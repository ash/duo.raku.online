<script type="application/json" id="page-data">{"u":"oop/try/quiz","n":931,"k":"quiz","pv":"oop/try/exercises/try-or-default/solution","nx":"oop/catch","tr":["oop","oop/try"],"L":{"en":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside then outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Two things happen here.<\/span> <span class=\"sg\" data-s=\"1\">First, <code>die<\/code> immediately aborts the rest of the <code>try<\/code> block, so the <code>say 'inside'<\/code> line is never reached — nothing is printed from inside the block.<\/span> <span class=\"sg\" data-s=\"2\">Second, because <code>try<\/code> catches the exception, the program itself does not stop: execution continues past the block, and <code>say 'outside'<\/code> runs normally.<\/span> <span class=\"sg\" data-s=\"3\">So the only line printed is <code>outside<\/code>. (<code>$r<\/code> would be undefined, and the message <code>Boom!<\/code> would be waiting in <code>$!<\/code> if you looked.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside und dann outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">ein Fehler<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier geschehen zwei Dinge.<\/span> <span class=\"sg\" data-s=\"1\">Erstens bricht <code>die<\/code> den Rest des <code>try<\/code>-Blocks sofort ab, die Zeile <code>say 'inside'<\/code> wird also nie erreicht — aus dem Block wird nichts ausgegeben.<\/span> <span class=\"sg\" data-s=\"2\">Zweitens hält das Programm selbst nicht an, weil <code>try<\/code> die Ausnahme fängt: Die Ausführung geht hinter dem Block weiter, und <code>say 'outside'<\/code> läuft ganz normal.<\/span> <span class=\"sg\" data-s=\"3\">Die einzige ausgegebene Zeile ist also <code>outside<\/code>. (<code>$r<\/code> wäre undefiniert, und die Meldung <code>Boom!<\/code> läge in <code>$!<\/code> bereit, falls Sie nachsähen.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside en dan outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">een fout<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Er gebeuren hier twee dingen.<\/span> <span class=\"sg\" data-s=\"1\">Ten eerste breekt <code>die<\/code> de rest van het <code>try<\/code>-blok onmiddellijk af, dus de regel <code>say 'inside'<\/code> wordt nooit bereikt — er wordt vanuit het blok niets afgedrukt.<\/span> <span class=\"sg\" data-s=\"2\">Ten tweede stopt het programma zelf niet, omdat <code>try<\/code> de exceptie vangt: de uitvoering gaat voorbij het blok verder en <code>say 'outside'<\/code> draait gewoon.<\/span> <span class=\"sg\" data-s=\"3\">De enige afgedrukte regel is dus <code>outside<\/code>. (<code>$r<\/code> zou ongedefinieerd zijn, en de melding <code>Boom!<\/code> zou in <code>$!<\/code> klaarstaan als je zou kijken.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside y después outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">un error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí pasan dos cosas.<\/span> <span class=\"sg\" data-s=\"1\">Primero, <code>die<\/code> aborta de inmediato el resto del bloque <code>try<\/code>, así que la línea <code>say 'inside'<\/code> nunca se alcanza: desde dentro del bloque no se imprime nada.<\/span> <span class=\"sg\" data-s=\"2\">Segundo, como <code>try<\/code> captura la excepción, el programa en sí no se detiene: la ejecución continúa más allá del bloque y <code>say 'outside'<\/code> se ejecuta con normalidad.<\/span> <span class=\"sg\" data-s=\"3\">Así que la única línea impresa es <code>outside<\/code>. (<code>$r<\/code> quedaría sin definir, y el mensaje <code>Boom!<\/code> estaría esperando en <code>$!<\/code> si lo miraras.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside e poi outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">un errore<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui succedono due cose.<\/span> <span class=\"sg\" data-s=\"1\">Primo, <code>die<\/code> interrompe subito il resto del blocco <code>try<\/code>, quindi la riga <code>say 'inside'<\/code> non viene mai raggiunta: dal blocco non viene stampato nulla.<\/span> <span class=\"sg\" data-s=\"2\">Secondo, poiché <code>try<\/code> intercetta l'eccezione, il programma stesso non si ferma: l'esecuzione prosegue oltre il blocco e <code>say 'outside'<\/code> gira normalmente.<\/span> <span class=\"sg\" data-s=\"3\">L'unica riga stampata è quindi <code>outside<\/code>. (<code>$r<\/code> sarebbe non definito, e il messaggio <code>Boom!<\/code> starebbe ad aspettare in <code>$!<\/code> se lo guardassi.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko izdrukā šī programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside un tad outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">kļūda<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit notiek divas lietas.<\/span> <span class=\"sg\" data-s=\"1\">Pirmkārt, <code>die<\/code> uzreiz pārtrauc atlikušo <code>try<\/code> bloka daļu, tāpēc rinda <code>say 'inside'<\/code> netiek sasniegta nekad — no bloka iekšienes netiek izdrukāts nekas.<\/span> <span class=\"sg\" data-s=\"2\">Otrkārt, tā kā <code>try<\/code> izņēmumu noķer, pati programma neapstājas: izpilde turpinās aiz bloka, un <code>say 'outside'<\/code> izpildās parastā kārtā.<\/span> <span class=\"sg\" data-s=\"3\">Tātad vienīgā izdrukātā rinda ir <code>outside<\/code>. (<code>$r<\/code> būtu nedefinēts, un paziņojums <code>Boom!<\/code> gaidītu <code>$!<\/code>, ja tur ieskatītos.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">сначала inside, потом outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">ошибка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь происходит две вещи.<\/span> <span class=\"sg\" data-s=\"1\">Во-первых, <code>die<\/code> немедленно прерывает остаток блока <code>try<\/code>, поэтому до строки <code>say 'inside'<\/code> дело не доходит — изнутри блока ничего не печатается.<\/span> <span class=\"sg\" data-s=\"2\">Во-вторых, поскольку <code>try<\/code> перехватывает исключение, сама программа не останавливается: выполнение продолжается за блоком, и <code>say 'outside'<\/code> отрабатывает как обычно.<\/span> <span class=\"sg\" data-s=\"3\">Значит, печатается единственная строка — <code>outside<\/code>. (<code>$r<\/code> был бы не определён, а сообщение <code>Boom!<\/code> дожидалось бы в <code>$!<\/code>, если бы вы туда заглянули.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що виведе наведена програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside, а потім outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">помилку<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут стаються дві речі.<\/span> <span class=\"sg\" data-s=\"1\">По-перше, <code>die<\/code> негайно перериває решту блоку <code>try<\/code>, тож до рядка <code>say 'inside'<\/code> виконання ніколи не доходить — зсередини блоку нічого не виводиться.<\/span> <span class=\"sg\" data-s=\"2\">По-друге, оскільки <code>try<\/code> перехоплює виняток, сама програма не зупиняється: виконання триває далі за блоком, і <code>say 'outside'<\/code> спрацьовує звичайно.<\/span> <span class=\"sg\" data-s=\"3\">Тож єдиним виведеним рядком є <code>outside<\/code>. (<code>$r<\/code> була б невизначеною, а повідомлення <code>Boom!<\/code> чекало б у <code>$!<\/code>, якби ви туди зазирнули.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside, после outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">грешка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук се случват две неща.<\/span> <span class=\"sg\" data-s=\"1\">Първо, <code>die<\/code> незабавно прекъсва остатъка от блока <code>try<\/code>, така че редът <code>say 'inside'<\/code> изобщо не се достига — отвътре в блока не се отпечатва нищо.<\/span> <span class=\"sg\" data-s=\"2\">Второ, понеже <code>try<\/code> прихваща изключението, самата програма не спира: изпълнението продължава след блока и <code>say 'outside'<\/code> се изпълнява нормално.<\/span> <span class=\"sg\" data-s=\"3\">Затова единственият отпечатан ред е <code>outside<\/code>. (<code>$r<\/code> би била недефинирана, а съобщението <code>Boom!<\/code> би чакало в <code>$!<\/code>, ако погледнете там.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion presas la jena programo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside poste outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">eraron<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du aferoj okazas ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Unue, <code>die<\/code> tuj ĉesigas la reston de la bloko <code>try<\/code>, do la linio <code>say 'inside'<\/code> neniam estas atingata — nenio estas presata el ene de la bloko.<\/span> <span class=\"sg\" data-s=\"2\">Due, ĉar <code>try<\/code> kaptas la escepton, la programo mem ne haltas: la ekzekuto daŭras preter la bloko, kaj <code>say 'outside'<\/code> ruliĝas normale.<\/span> <span class=\"sg\" data-s=\"3\">Do la sola presita linio estas <code>outside<\/code>. (<code>$r<\/code> estus nedifinita, kaj la mesaĝo <code>Boom!<\/code> atendus en <code>$!<\/code>, se vi rigardus.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid haec programma imprimit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside, deinde outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">errorem<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Duo hic fiunt.<\/span> <span class=\"sg\" data-s=\"1\">Primum, <code>die<\/code> reliquam clausulae <code>try<\/code> partem statim abrumpit, itaque linea <code>say 'inside'<\/code> numquam attingitur — nihil ex clausula imprimitur.<\/span> <span class=\"sg\" data-s=\"2\">Deinde, quia <code>try<\/code> exceptionem capit, ipsum programma non sistit: exsecutio ultra clausulam pergit, et <code>say 'outside'<\/code> more solito currit.<\/span> <span class=\"sg\" data-s=\"3\">Itaque sola linea impressa est <code>outside<\/code>. (<code>$r<\/code> indefinitus esset, et nuntius <code>Boom!<\/code> in <code>$!<\/code> exspectaret si inspiceres.)<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
