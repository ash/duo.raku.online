<script type="application/json" id="page-data">{"u":"oop/try","n":922,"k":"section","pv":"oop/external-programs/exercises/read-env/solution","nx":"oop/try/deferred-errors","tr":["oop"],"L":{"en":{"t":"Catching exceptions with <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When something goes wrong in a Raku program — a missing file, an explicit <code>die<\/code> — an <em>exception<\/em> is thrown.<\/span> <span class=\"sg\" data-s=\"1\">By default, an unhandled exception stops the program.<\/span> <span class=\"sg\" data-s=\"2\">The <code>try<\/code> block lets you run code that might fail without crashing.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You wrap the risky code in a <code>try<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">If an exception is thrown inside it, the block stops there, but the program continues:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>die<\/code> is caught by the <code>try<\/code>, so the program does not crash — it carries straight on to the next statement and prints:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When the block fails like this, it evaluates to an undefined value, so <code>$result<\/code> is undefined:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The exception that was caught is stored in the special variable <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can read its message from there:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So <code>try<\/code> turns a fatal error into something your program can inspect and react to.<\/span> <span class=\"sg\" data-s=\"1\">If the block runs without any exception, <code>$result<\/code> holds its value, and <code>$!<\/code> is undefined.<\/span><\/p>"]]},"de":{"t":"Ausnahmen mit <code>try<\/code> fangen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn in einem Raku-Programm etwas schiefgeht — eine fehlende Datei, ein ausdrückliches <code>die<\/code> —, wird eine <em>Ausnahme<\/em> geworfen.<\/span> <span class=\"sg\" data-s=\"1\">Eine unbehandelte Ausnahme hält das Programm standardmäßig an.<\/span> <span class=\"sg\" data-s=\"2\">Der <code>try<\/code>-Block erlaubt es Ihnen, Code auszuführen, der fehlschlagen könnte, ohne abzustürzen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie hüllen den riskanten Code in einen <code>try<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"1\">Wird darin eine Ausnahme geworfen, endet der Block dort, das Programm läuft aber weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>die<\/code> wird vom <code>try<\/code> gefangen, das Programm stürzt also nicht ab — es geht direkt zur nächsten Anweisung über und gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn der Block auf diese Weise fehlschlägt, ergibt er einen undefinierten Wert, <code>$result<\/code> ist also undefiniert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die gefangene Ausnahme wird in der besonderen Variablen <code>$!<\/code> abgelegt.<\/span> <span class=\"sg\" data-s=\"1\">Dort können Sie ihre Meldung lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> macht aus einem fatalen Fehler also etwas, das Ihr Programm untersuchen und worauf es reagieren kann.<\/span> <span class=\"sg\" data-s=\"1\">Läuft der Block ohne Ausnahme, enthält <code>$result<\/code> seinen Wert, und <code>$!<\/code> ist undefiniert.<\/span><\/p>"]]},"nl":{"t":"Excepties vangen met <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer er in een Raku-programma iets misgaat — een ontbrekend bestand, een expliciete <code>die<\/code> — wordt er een <em>exceptie<\/em> geworpen.<\/span> <span class=\"sg\" data-s=\"1\">Een onafgehandelde exceptie legt het programma standaard stil.<\/span> <span class=\"sg\" data-s=\"2\">Met het <code>try<\/code>-blok kun je code draaien die kan mislukken zonder te crashen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je wikkelt de riskante code in een <code>try<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"1\">Als er binnen dat blok een exceptie geworpen wordt, stopt het blok daar, maar het programma gaat door:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>die<\/code> wordt door de <code>try<\/code> gevangen, dus het programma crasht niet — het gaat regelrecht door naar de volgende opdracht en drukt af:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer het blok zo mislukt, evalueert het naar een ongedefinieerde waarde, dus <code>$result<\/code> is ongedefinieerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De gevangen exceptie wordt in de bijzondere variabele <code>$!<\/code> bewaard.<\/span> <span class=\"sg\" data-s=\"1\">Daar kun je haar melding uit lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> maakt van een fatale fout dus iets wat je programma kan bekijken en waarop het kan reageren.<\/span> <span class=\"sg\" data-s=\"1\">Als het blok zonder exceptie draait, bevat <code>$result<\/code> zijn waarde en is <code>$!<\/code> ongedefinieerd.<\/span><\/p>"]]},"es":{"t":"Capturar excepciones con <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando algo sale mal en un programa de Raku — un archivo que falta, un <code>die<\/code> explícito — se lanza una <em>excepción<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Por omisión, una excepción no manejada detiene el programa.<\/span> <span class=\"sg\" data-s=\"2\">El bloque <code>try<\/code> te permite ejecutar código que podría fallar sin que todo se venga abajo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Envuelves el código arriesgado en un bloque <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si dentro se lanza una excepción, el bloque se detiene ahí, pero el programa continúa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El <code>die<\/code> lo captura el <code>try<\/code>, así que el programa no se cae: sigue derecho a la instrucción siguiente e imprime:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando el bloque falla así, su valor es un valor no definido, de modo que <code>$result<\/code> no está definido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La excepción capturada se guarda en la variable especial <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Desde ahí puedes leer su mensaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que <code>try<\/code> convierte un error fatal en algo que tu programa puede inspeccionar y a lo que puede reaccionar.<\/span> <span class=\"sg\" data-s=\"1\">Si el bloque se ejecuta sin ninguna excepción, <code>$result<\/code> contiene su valor y <code>$!<\/code> no está definida.<\/span><\/p>"]]},"it":{"t":"Intercettare le eccezioni con <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando qualcosa va storto in un programma Raku — un file mancante, un <code>die<\/code> esplicito — viene sollevata un'<em>eccezione<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Per impostazione predefinita un'eccezione non gestita ferma il programma.<\/span> <span class=\"sg\" data-s=\"2\">Il blocco <code>try<\/code> ti permette di eseguire codice che potrebbe fallire senza far crollare tutto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Avvolgi il codice rischioso in un blocco <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se al suo interno viene sollevata un'eccezione, il blocco si ferma lì, ma il programma continua:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il <code>die<\/code> viene intercettato dal <code>try<\/code>, quindi il programma non crolla: prosegue dritto all'istruzione successiva e stampa:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando il blocco fallisce così, esso vale un valore non definito, quindi <code>$result<\/code> non è definito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'eccezione intercettata è conservata nella variabile speciale <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da lì puoi leggerne il messaggio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Così <code>try<\/code> trasforma un errore fatale in qualcosa che il tuo programma può ispezionare e a cui può reagire.<\/span> <span class=\"sg\" data-s=\"1\">Se il blocco gira senza alcuna eccezione, <code>$result<\/code> contiene il suo valore e <code>$!<\/code> non è definito.<\/span><\/p>"]]},"lv":{"t":"Izņēmumu pārtveršana ar <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad Raku programmā kaut kas noiet greizi — trūkstošs fails, skaidri norādīts <code>die<\/code> —, tiek izmests <em>izņēmums<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc noklusējuma neapstrādāts izņēmums aptur programmu.<\/span> <span class=\"sg\" data-s=\"2\">Bloks <code>try<\/code> ļauj izpildīt kodu, kas varētu neizdoties, bez programmas avārijas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Riskanto kodu ietinat blokā <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja tā iekšienē tiek izmests izņēmums, bloks tur apstājas, taču programma turpinās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> noķer <code>try<\/code>, tāpēc programma neavarē — tā turpina uzreiz ar nākamo teikumu un izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad bloks šādi neizdodas, tas izrēķinās par nedefinētu vērtību, tāpēc <code>$result<\/code> ir nedefinēts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noķertais izņēmums glabājas speciālajā mainīgajā <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā paziņojumu var nolasīt no turienes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>try<\/code> pārvērš liktenīgu kļūdu par kaut ko tādu, ko jūsu programma var izpētīt un uz ko reaģēt.<\/span> <span class=\"sg\" data-s=\"1\">Ja bloks izpildās bez neviena izņēmuma, <code>$result<\/code> satur tā vērtību, un <code>$!<\/code> ir nedefinēts.<\/span><\/p>"]]},"ru":{"t":"Перехват исключений с помощью <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда в программе на Raku что-то идёт не так — не находится файл, срабатывает явный <code>die<\/code>, — бросается <em>исключение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">По умолчанию необработанное исключение останавливает программу.<\/span> <span class=\"sg\" data-s=\"2\">Блок <code>try<\/code> позволяет выполнить код, который может дать сбой, не обрушивая программу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рискованный код заключают в блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если внутри него бросается исключение, блок на этом останавливается, но программа продолжает работу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> перехватывается блоком <code>try<\/code>, поэтому программа не падает — она сразу переходит к следующей инструкции и печатает:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда блок завершается сбоем, он вычисляется в неопределённое значение, поэтому <code>$result<\/code> не определён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехваченное исключение сохраняется в специальной переменной <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оттуда можно прочитать его сообщение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>try<\/code> превращает фатальную ошибку в нечто, что программа может исследовать и на что может отреагировать.<\/span> <span class=\"sg\" data-s=\"1\">Если блок отработал без исключений, <code>$result<\/code> содержит его значение, а <code>$!<\/code> не определён.<\/span><\/p>"]]},"uk":{"t":"Перехоплення винятків за допомогою <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли в програмі на Raku щось іде не так — бракує файлу, стається явний <code>die<\/code>, — кидається <em>виняток<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">За замовчуванням неперехоплений виняток зупиняє програму.<\/span> <span class=\"sg\" data-s=\"2\">Блок <code>try<\/code> дозволяє виконати код, який може зазнати невдачі, не обрушуючи програми.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви загортаєте ризикований код у блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо всередині кинуто виняток, блок на цьому зупиняється, але програма триває далі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> перехоплює <code>try<\/code>, тож програма не падає — вона одразу переходить до наступного оператора й виводить:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли блок зазнає невдачі отак, він обчислюється в невизначене значення, тож <code>$result<\/code> є невизначеним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехоплений виняток зберігається в спеціальній змінній <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звідти можна прочитати його повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, <code>try<\/code> перетворює фатальну помилку на щось, що ваша програма може дослідити й на що може відреагувати.<\/span> <span class=\"sg\" data-s=\"1\">Якщо блок виконується без жодного винятку, <code>$result<\/code> містить його значення, а <code>$!<\/code> є невизначеною.<\/span><\/p>"]]},"bg":{"t":"Прихващане на изключения с <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато нещо се обърка в програма на Raku — липсващ файл, изричен <code>die<\/code>, — се хвърля <em>изключение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">По подразбиране необработеното изключение спира програмата.<\/span> <span class=\"sg\" data-s=\"2\">Блокът <code>try<\/code> ви позволява да изпълните код, който може да се провали, без програмата да се срине.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обвивате рискования код в блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако вътре в него бъде хвърлено изключение, блокът спира дотам, но програмата продължава:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> е прихванат от <code>try<\/code>, така че програмата не се срива — тя продължава направо със следващия оператор и отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато блокът се провали така, той се изчислява до недефинирана стойност, така че <code>$result<\/code> е недефинирана:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прихванатото изключение се съхранява в специалната променлива <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да прочетете съобщението му оттам:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така <code>try<\/code> превръща фаталната грешка в нещо, което програмата ви може да разгледа и на което може да реагира.<\/span> <span class=\"sg\" data-s=\"1\">Ако блокът се изпълни без изключение, <code>$result<\/code> съдържа стойността му, а <code>$!<\/code> е недефинирана.<\/span><\/p>"]]},"eo":{"t":"Kapti esceptojn per <code>try<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam io misiras en Raku-programo — mankanta dosiero, eksplicita <code>die<\/code> — <em>escepto<\/em> estas ĵetata.<\/span> <span class=\"sg\" data-s=\"1\">Defaŭlte, netraktita escepto haltigas la programon.<\/span> <span class=\"sg\" data-s=\"2\">La bloko <code>try<\/code> permesas al vi ruli kodon, kiu povus malsukcesi, sen kolapsi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi envolvas la riskan kodon en blokon <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se escepto estas ĵetata ene de ĝi, la bloko haltas tie, sed la programo daŭras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>die<\/code> estas kaptita de la <code>try<\/code>, do la programo ne kolapsas — ĝi pluiras rekte al la sekva instrukcio kaj presas:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam la bloko malsukcesas tiel, ĝi taksiĝas al nedifinita valoro, do <code>$result<\/code> estas nedifinita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La escepto, kiu estis kaptita, estas konservita en la speciala variablo <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas legi ĝian mesaĝon el tie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do <code>try<\/code> transformas fatalan eraron en ion, kion via programo povas inspekti kaj al kio ĝi povas reagi.<\/span> <span class=\"sg\" data-s=\"1\">Se la bloko ruliĝas sen ia ajn escepto, <code>$result<\/code> tenas ĝian valoron, kaj <code>$!<\/code> estas nedifinita.<\/span><\/p>"]]},"la":{"t":"Exceptiones per <code>try<\/code> capere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum aliquid in programmate Raku male cadit — archivum deest, expressum <code>die<\/code> — <em>exceptio<\/em> iacitur.<\/span> <span class=\"sg\" data-s=\"1\">Ex more exceptio non tractata programma sistit.<\/span> <span class=\"sg\" data-s=\"2\">Clausula <code>try<\/code> tibi permittit codicem qui deficere possit currere sine ruina.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Codicem periculosum in clausulam <code>try<\/code> involvis.<\/span> <span class=\"sg\" data-s=\"1\">Si exceptio intus iacitur, clausula ibi desinit, sed programma pergit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> a <code>try<\/code> capitur, itaque programma non ruit — recta ad enuntiatum sequens pergit et imprimit:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum clausula ita deficit, valorem indefinitum reddit, itaque <code>$result<\/code> indefinitus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Exceptio capta in variabili speciali <code>$!<\/code> servatur.<\/span> <span class=\"sg\" data-s=\"1\">Nuntium eius inde legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>try<\/code> errorem fatalem in aliquid vertit quod programma tuum inspicere et ad quod reagere potest.<\/span> <span class=\"sg\" data-s=\"1\">Si clausula sine ulla exceptione currit, <code>$result<\/code> valorem eius continet, et <code>$!<\/code> indefinitus est.<\/span><\/p>"]]}}}</script>
