<script type="application/json" id="page-data">{"u":"oop/try/deferred-errors","n":923,"k":"topic","pv":"oop/try","nx":"oop/try/exercises","tr":["oop","oop/try"],"L":{"en":{"t":"Not every error is immediate","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">By default a thrown exception stops the program at once, and <code>try<\/code> is how you catch it.<\/span> <span class=\"sg\" data-s=\"1\">But not everything that looks like a fatal error actually halts your program the moment it happens.<\/span> <span class=\"sg\" data-s=\"2\">Raku has failures that stay quiet — postponing their reaction until you use the result, or letting you inspect them and carry on.<\/span> <span class=\"sg\" data-s=\"3\">A couple of these have already appeared in this part, and it is worth collecting them in one place.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>A division by zero.<\/strong> Dividing by zero does not blow up where it is written.<\/span> <span class=\"sg\" data-s=\"1\">The bad value is produced and held quietly; it only throws when you <em>use<\/em> it — by printing or coercing it, for example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This deferred behaviour, and the <code>Failure<\/code> objects behind it, are the subject of <a href=\"/oop/failures/\">Soft failures<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>A failing external program.<\/strong> A <code>Proc<\/code> returned by <code>run<\/code> or <code>shell<\/code> that exited unsuccessfully does not throw when it is produced.<\/span> <span class=\"sg\" data-s=\"1\">It throws only if you <em>discard<\/em> it unhandled; store it and read <code>.exitcode<\/code> (or test it as a Boolean) and the failure stays a plain value you can react to.<\/span> <span class=\"sg\" data-s=\"2\">You saw this in <a href=\"/oop/external-programs/the-proc-object/\">The Proc object<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The common thread: a failure can be <em>deferred<\/em> — turned into a value you examine when you are ready, rather than an immediate crash.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> and the <code>CATCH<\/code> phaser deal with the errors that are thrown right away; these mechanisms deal with the ones that are not.<\/span><\/p>"]]},"de":{"t":"Nicht jeder Fehler tritt sofort auf","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine geworfene Ausnahme hält das Programm standardmäßig sofort an, und mit <code>try<\/code> fangen Sie sie.<\/span> <span class=\"sg\" data-s=\"1\">Doch nicht alles, was wie ein fataler Fehler aussieht, hält Ihr Programm tatsächlich in dem Moment an, in dem es geschieht.<\/span> <span class=\"sg\" data-s=\"2\">Raku kennt Fehlschläge, die still bleiben — die ihre Reaktion aufschieben, bis Sie das Ergebnis verwenden, oder die Sie untersuchen lassen und weiterlaufen.<\/span> <span class=\"sg\" data-s=\"3\">Ein paar davon sind in diesem Teil schon aufgetaucht, und es lohnt sich, sie an einer Stelle zu sammeln.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Eine Division durch null.<\/strong> Durch null zu teilen fliegt nicht dort auf, wo es geschrieben steht.<\/span> <span class=\"sg\" data-s=\"1\">Der schlechte Wert wird erzeugt und still gehalten; geworfen wird erst, wenn Sie ihn <em>verwenden<\/em> — etwa indem Sie ihn ausgeben oder umwandeln:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses aufgeschobene Verhalten und die <code>Failure<\/code>-Objekte dahinter sind das Thema von <a href=\"https://course.raku.org/de/oop/failures/\" target=\"_blank\" rel=\"noopener\">Weiche Fehlschläge<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Ein fehlschlagendes externes Programm.<\/strong> Ein von <code>run<\/code> oder <code>shell<\/code> geliefertes <code>Proc<\/code>, das nicht erfolgreich beendet wurde, wirft nicht, wenn es entsteht.<\/span> <span class=\"sg\" data-s=\"1\">Es wirft nur, wenn Sie es unbehandelt <em>verwerfen<\/em>; speichern Sie es und lesen Sie <code>.exitcode<\/code> (oder prüfen Sie es als Wahrheitswert), bleibt der Fehlschlag ein schlichter Wert, auf den Sie reagieren können.<\/span> <span class=\"sg\" data-s=\"2\">Das haben Sie in <a href=\"https://course.raku.org/de/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Das Proc-Objekt<\/a> gesehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der rote Faden: Ein Fehlschlag kann <em>aufgeschoben<\/em> werden — verwandelt in einen Wert, den Sie prüfen, wenn Sie bereit sind, statt in einen sofortigen Absturz.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> und der <code>CATCH<\/code>-Phaser kümmern sich um Fehler, die sofort geworfen werden; diese Mechanismen um jene, die es nicht tun.<\/span><\/p>"]]},"nl":{"t":"Niet elke fout is onmiddellijk","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een geworpen exceptie legt het programma standaard meteen stil, en met <code>try<\/code> vang je hem.<\/span> <span class=\"sg\" data-s=\"1\">Maar niet alles wat op een fatale fout lijkt, legt je programma werkelijk stil op het moment dat het gebeurt.<\/span> <span class=\"sg\" data-s=\"2\">Raku heeft mislukkingen die stil blijven — die hun reactie uitstellen tot je het resultaat gebruikt, of die je toelaten ze te bekijken en door te gaan.<\/span> <span class=\"sg\" data-s=\"3\">Een paar daarvan zijn in dit deel al langsgekomen, en het loont ze op één plek bij elkaar te zetten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Een deling door nul.<\/strong> Delen door nul ontploft niet waar het geschreven staat.<\/span> <span class=\"sg\" data-s=\"1\">De slechte waarde wordt geproduceerd en stilletjes vastgehouden; ze werpt pas wanneer je haar <em>gebruikt<\/em> — bijvoorbeeld door haar af te drukken of te coerceren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit uitgestelde gedrag, en de <code>Failure<\/code>-objecten erachter, zijn het onderwerp van <a href=\"https://course.raku.org/nl/oop/failures/\" target=\"_blank\" rel=\"noopener\">Zachte mislukkingen<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Een mislukkend extern programma.<\/strong> Een <code>Proc<\/code> die door <code>run<\/code> of <code>shell<\/code> teruggegeven wordt en die niet succesvol geëindigd is, werpt niet op het moment dat hij gemaakt wordt.<\/span> <span class=\"sg\" data-s=\"1\">Hij werpt alleen als je hem onafgehandeld <em>weggooit<\/em>; bewaar hem en lees <code>.exitcode<\/code> (of test hem als boolean) en de mislukking blijft een gewone waarde waarop je kunt reageren.<\/span> <span class=\"sg\" data-s=\"2\">Je zag dit in <a href=\"https://course.raku.org/nl/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Het Proc-object<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De rode draad: een mislukking kan <em>uitgesteld<\/em> worden — omgezet in een waarde die je bekijkt wanneer je er klaar voor bent, in plaats van een onmiddellijke crash.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> en de <code>CATCH<\/code>-faser gaan over de fouten die meteen geworpen worden; deze mechanismen gaan over de fouten die dat niet doen.<\/span><\/p>"]]},"es":{"t":"No todo error es inmediato","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Por omisión, una excepción lanzada detiene el programa al instante, y <code>try<\/code> es la manera de capturarla.<\/span> <span class=\"sg\" data-s=\"1\">Pero no todo lo que parece un error fatal detiene realmente tu programa en el momento en que ocurre.<\/span> <span class=\"sg\" data-s=\"2\">Raku tiene fallos que se quedan callados: aplazan su reacción hasta que usas el resultado, o te dejan inspeccionarlos y seguir adelante.<\/span> <span class=\"sg\" data-s=\"3\">Un par de ellos ya han aparecido en esta parte, y vale la pena reunirlos en un solo sitio.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Una división por cero.<\/strong> Dividir por cero no estalla donde está escrito.<\/span> <span class=\"sg\" data-s=\"1\">El valor malo se produce y se guarda en silencio; solo lanza la excepción cuando lo <em>usas<\/em>, por ejemplo al imprimirlo o convertirlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ese comportamiento aplazado, y los objetos <code>Failure<\/code> que hay detrás, son el tema de <a href=\"https://course.raku.org/es/oop/failures/\" target=\"_blank\" rel=\"noopener\">Fallos blandos<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Un programa externo que falla.<\/strong> Un <code>Proc<\/code> devuelto por <code>run<\/code> o <code>shell<\/code> que terminó sin éxito no lanza ninguna excepción al producirse.<\/span> <span class=\"sg\" data-s=\"1\">Solo la lanza si lo <em>descartas<\/em> sin manejarlo; guárdalo y lee su <code>.exitcode<\/code> (o evalúalo como booleano) y el fallo seguirá siendo un valor simple al que puedes reaccionar.<\/span> <span class=\"sg\" data-s=\"2\">Lo viste en <a href=\"https://course.raku.org/es/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">El objeto Proc<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El hilo común: un fallo puede <em>aplazarse<\/em>, convertirse en un valor que examinas cuando estás listo, en lugar de en una caída inmediata.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> y el phaser <code>CATCH<\/code> se ocupan de los errores que se lanzan de inmediato; estos mecanismos se ocupan de los que no.<\/span><\/p>"]]},"it":{"t":"Non ogni errore è immediato","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita un'eccezione sollevata ferma subito il programma, e <code>try<\/code> è il modo di intercettarla.<\/span> <span class=\"sg\" data-s=\"1\">Ma non tutto ciò che sembra un errore fatale ferma davvero il programma nel momento in cui accade.<\/span> <span class=\"sg\" data-s=\"2\">Raku ha fallimenti che restano silenziosi — rimandano la propria reazione a quando usi il risultato, oppure ti lasciano ispezionarli e proseguire.<\/span> <span class=\"sg\" data-s=\"3\">Un paio di questi sono già comparsi in questa parte, e vale la pena raccoglierli in un unico posto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Una divisione per zero.<\/strong> Dividere per zero non esplode dove è scritto.<\/span> <span class=\"sg\" data-s=\"1\">Il valore cattivo viene prodotto e tenuto in silenzio; solleva un'eccezione solo quando lo <em>usi<\/em> — stampandolo o convertendolo, per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo comportamento differito, e gli oggetti <code>Failure<\/code> che vi stanno dietro, sono l'argomento di <a href=\"https://course.raku.org/it/oop/failures/\" target=\"_blank\" rel=\"noopener\">Fallimenti morbidi<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Un programma esterno che fallisce.<\/strong> Un <code>Proc<\/code> restituito da <code>run<\/code> o <code>shell<\/code> che è terminato senza successo non solleva un'eccezione quando viene prodotto.<\/span> <span class=\"sg\" data-s=\"1\">La solleva solo se lo <em>scarti<\/em> senza gestirlo; conservalo e leggine <code>.exitcode<\/code> (o mettilo alla prova come booleano) e il fallimento resta un valore semplice a cui puoi reagire.<\/span> <span class=\"sg\" data-s=\"2\">Lo hai visto in <a href=\"https://course.raku.org/it/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">L'oggetto Proc<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il filo comune: un fallimento può essere <em>differito<\/em> — trasformato in un valore che esamini quando sei pronto, invece che in un crollo immediato.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> e il phaser <code>CATCH<\/code> si occupano degli errori sollevati subito; questi meccanismi si occupano di quelli che non lo sono.<\/span><\/p>"]]},"lv":{"t":"Ne katra kļūda parādās uzreiz","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma izmests izņēmums aptur programmu uzreiz, un <code>try<\/code> ir veids, kā to noķert.<\/span> <span class=\"sg\" data-s=\"1\">Taču ne viss, kas izskatās pēc liktenīgas kļūdas, patiešām aptur programmu tajā brīdī, kad tas notiek.<\/span> <span class=\"sg\" data-s=\"2\">Raku ir neveiksmes, kas paliek klusas, atliekot savu reakciju līdz brīdim, kad rezultātu izmantojat, vai ļaujot to izpētīt un turpināt.<\/span> <span class=\"sg\" data-s=\"3\">Pāris no tām šajā daļā jau ir parādījušās, un ir vērts tās savākt vienuviet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Dalīšana ar nulli.<\/strong> Dalīšana ar nulli neuzsprāgst tur, kur uzrakstīta.<\/span> <span class=\"sg\" data-s=\"1\">Sliktā vērtība tiek radīta un klusi paturēta; tā izmet izņēmumu tikai tad, kad to <em>izmantojat<\/em> — piemēram, izdrukājot vai pārveidojot:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī atliktā uzvedība un <code>Failure<\/code> objekti aiz tās ir temata <a href=\"https://course.raku.org/lv/oop/failures/\" target=\"_blank\" rel=\"noopener\">Mīkstās neveiksmes<\/a> priekšmets.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Neveiksmīga ārēja programma.<\/strong> <code>Proc<\/code>, ko atgriež <code>run<\/code> vai <code>shell<\/code> un kas beidzies nesekmīgi, neizmet izņēmumu, kad tiek radīts.<\/span> <span class=\"sg\" data-s=\"1\">Tas izmet tikai tad, ja to <em>izmetat<\/em> neapstrādātu; saglabājiet to un nolasiet <code>.exitcode<\/code> (vai pārbaudiet kā Būla vērtību), un neveiksme paliek parasta vērtība, uz ko var reaģēt.<\/span> <span class=\"sg\" data-s=\"2\">To redzējāt sadaļā <a href=\"https://course.raku.org/lv/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Proc objekts<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kopīgais pavediens: neveiksmi var <em>atlikt<\/em> — pārvērst par vērtību, ko izpētāt, kad esat gatavi, nevis par tūlītēju avāriju.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> un fāzeris <code>CATCH<\/code> tiek galā ar kļūdām, kas tiek izmestas uzreiz; šie mehānismi tiek galā ar tām, kas netiek.<\/span><\/p>"]]},"ru":{"t":"Не всякая ошибка возникает сразу","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">По умолчанию брошенное исключение немедленно останавливает программу, и <code>try<\/code> — это способ его перехватить.<\/span> <span class=\"sg\" data-s=\"1\">Но не всё, что выглядит как фатальная ошибка, действительно останавливает программу в тот же миг.<\/span> <span class=\"sg\" data-s=\"2\">В Raku есть сбои, которые ведут себя тихо: они откладывают свою реакцию до момента, когда вы воспользуетесь результатом, или позволяют их исследовать и продолжить работу.<\/span> <span class=\"sg\" data-s=\"3\">Кое-что из этого в этой части уже встречалось, и стоит собрать всё в одном месте.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на ноль.<\/strong> Деление на ноль не взрывается там, где оно записано.<\/span> <span class=\"sg\" data-s=\"1\">Плохое значение создаётся и тихо хранится; исключение бросается лишь тогда, когда вы им <em>воспользуетесь<\/em> — например, напечатаете или приведёте к другому типу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # здесь ошибки нет\nsay 'still running';\nsay $x;           # только теперь бросается исключение<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этому отложенному поведению и стоящим за ним объектам <code>Failure<\/code> посвящены <a href=\"https://course.raku.org/ru/oop/failures/\" target=\"_blank\" rel=\"noopener\">Мягкие сбои<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Неудачно завершившаяся внешняя программа.<\/strong> <code>Proc<\/code>, возвращённый из <code>run<\/code> или <code>shell<\/code> и завершившийся неудачей, не бросает исключение в момент своего появления.<\/span> <span class=\"sg\" data-s=\"1\">Он бросает его, только если вы <em>отбросите<\/em> его необработанным; сохраните его и прочитайте <code>.exitcode<\/code> (или проверьте как булево значение) — и сбой останется обычным значением, на которое можно отреагировать.<\/span> <span class=\"sg\" data-s=\"2\">Вы видели это в теме <a href=\"https://course.raku.org/ru/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Объект Proc<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Общее здесь вот что: сбой может быть <em>отложен<\/em> — превращён в значение, которое вы исследуете тогда, когда будете готовы, вместо немедленного падения.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> и фазер <code>CATCH<\/code> имеют дело с ошибками, которые бросаются сразу; эти же механизмы — с теми, которые нет.<\/span><\/p>"]]},"uk":{"t":"Не кожна помилка негайна","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням кинутий виняток одразу зупиняє програму, а <code>try<\/code> — це спосіб його перехопити.<\/span> <span class=\"sg\" data-s=\"1\">Але не все, що виглядає як фатальна помилка, справді спиняє вашу програму тієї ж миті, коли стається.<\/span> <span class=\"sg\" data-s=\"2\">У Raku є збої, які поводяться тихо, відкладаючи свою реакцію до моменту, коли ви скористаєтеся результатом, або дозволяючи вам дослідити їх і рушити далі.<\/span> <span class=\"sg\" data-s=\"3\">Кілька з них уже траплялися в цій частині, і варто зібрати їх в одному місці.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Ділення на нуль.<\/strong> Ділення на нуль не вибухає там, де його записано.<\/span> <span class=\"sg\" data-s=\"1\">Погане значення створюється й тихо тримається; воно кидає виняток лише тоді, коли ви його <em>використовуєте<\/em> — наприклад, виводите чи зводите до іншого типу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # тут помилки немає\nsay 'still running';\nsay $x;           # ось тепер вона кидається<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця відкладена поведінка та об'єкти <code>Failure<\/code>, що за нею стоять, є темою розділу <a href=\"https://course.raku.org/uk/oop/failures/\" target=\"_blank\" rel=\"noopener\">М'які збої<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Зовнішня програма, що зазнала невдачі.<\/strong> Об'єкт <code>Proc<\/code>, який повертають <code>run<\/code> чи <code>shell<\/code> і який завершився невдало, не кидає винятку в мить свого створення.<\/span> <span class=\"sg\" data-s=\"1\">Він кидає його лише тоді, коли ви <em>відкидаєте<\/em> його необробленим; збережіть його й прочитайте <code>.exitcode<\/code> (або перевірте як булеве значення) — і збій лишиться звичайним значенням, на яке можна відреагувати.<\/span> <span class=\"sg\" data-s=\"2\">Ви бачили це в темі <a href=\"https://course.raku.org/uk/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Об'єкт Proc<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спільна нитка тут така: збій можна <em>відкласти<\/em> — перетворити на значення, яке ви дослідите, коли будете готові, замість негайного падіння.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> та фазер <code>CATCH<\/code> мають справу з помилками, які кидаються одразу; ці механізми — з тими, що ні.<\/span><\/p>"]]},"bg":{"t":"Не всяка грешка е незабавна","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">По подразбиране хвърленото изключение спира програмата веднага, а <code>try<\/code> е начинът да го прихванете.<\/span> <span class=\"sg\" data-s=\"1\">Но не всичко, което изглежда като фатална грешка, всъщност спира програмата ви в мига, в който се случи.<\/span> <span class=\"sg\" data-s=\"2\">Raku има провали, които мълчат — отлагат реакцията си, докато не използвате резултата, или ви позволяват да ги разгледате и да продължите.<\/span> <span class=\"sg\" data-s=\"3\">Няколко такива вече се появиха в тази част и си струва да бъдат събрани на едно място.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на нула.<\/strong> Делението на нула не гърми там, където е написано.<\/span> <span class=\"sg\" data-s=\"1\">Лошата стойност се произвежда и се държи мълчаливо; тя хвърля изключение едва когато я <em>използвате<\/em> — например като я отпечатате или преобразувате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # тук няма грешка\nsay 'still running';\nsay $x;           # чак сега хвърля<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отложено поведение и обектите <code>Failure<\/code>, които стоят зад него, са тема на <a href=\"https://course.raku.org/bg/oop/failures/\" target=\"_blank\" rel=\"noopener\">Меки провали<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Провалила се външна програма.<\/strong> <code>Proc<\/code>, върнат от <code>run<\/code> или <code>shell<\/code>, който е завършил неуспешно, не хвърля изключение, когато бъде произведен.<\/span> <span class=\"sg\" data-s=\"1\">Той хвърля само ако го <em>изхвърлите<\/em> необработен; съхранете го и прочетете <code>.exitcode<\/code> (или го проверете като булева стойност) и провалът си остава обикновена стойност, на която можете да реагирате.<\/span> <span class=\"sg\" data-s=\"2\">Видяхте това в <a href=\"https://course.raku.org/bg/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Обектът Proc<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Общото между тях: провалът може да бъде <em>отложен<\/em> — превърнат в стойност, която разглеждате, когато сте готови, вместо в незабавен срив.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> и фазерът <code>CATCH<\/code> се занимават с грешките, които се хвърлят веднага; тези механизми се занимават с онези, които не се хвърлят.<\/span><\/p>"]]}}}</script>
