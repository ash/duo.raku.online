<script type="application/json" id="page-data">{"u":"oop/classes","n":767,"k":"section","pv":"oop","nx":"oop/classes/type-object","tr":["oop"],"L":{"en":{"t":"Classes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">So far, the data types you have used — numbers, strings, arrays, and so on — were all built into Raku. <em>Object-oriented programming<\/em> lets you define your own types, called <em>classes<\/em>, and create values of those types, called <em>objects<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A class is defined with the <code>class<\/code> keyword, followed by a name and a block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This <code>Dog<\/code> class is empty for now, but it is already a new type.<\/span> <span class=\"sg\" data-s=\"1\">To create an object of the class — an <em>instance<\/em> — call the <code>new<\/code> method on the class name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$rex<\/code> now holds a <code>Dog<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">Every call to <code>new<\/code> creates a separate object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> and <code>$fido<\/code> are two distinct dogs, even though the class has no contents yet.<\/span> <span class=\"sg\" data-s=\"1\">In the following sections you will give a class its own data (<em>attributes<\/em>) and its own behaviour (<em>methods<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">The first topic looks more closely at the difference between a class and its instances.<\/span><\/p>"]]},"de":{"t":"Klassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bisher waren die Datentypen, die Sie verwendet haben — Zahlen, Zeichenketten, Arrays und so weiter —, alle in Raku eingebaut.<\/span> <span class=\"sg\" data-s=\"1\">Die <em>objektorientierte Programmierung<\/em> erlaubt es Ihnen, eigene Typen zu definieren, <em>Klassen<\/em> genannt, und Werte dieser Typen zu erzeugen, <em>Objekte<\/em> genannt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine Klasse wird mit dem Schlüsselwort <code>class<\/code> definiert, gefolgt von einem Namen und einem Block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Klasse <code>Dog<\/code> ist vorerst leer, aber sie ist bereits ein neuer Typ.<\/span> <span class=\"sg\" data-s=\"1\">Um ein Objekt der Klasse zu erzeugen — eine <em>Instanz<\/em> —, rufen Sie die Methode <code>new<\/code> auf dem Klassennamen auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$rex<\/code> enthält nun ein <code>Dog<\/code>-Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Aufruf von <code>new<\/code> erzeugt ein eigenes Objekt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> und <code>$fido<\/code> sind zwei verschiedene Hunde, obwohl die Klasse noch keinen Inhalt hat.<\/span> <span class=\"sg\" data-s=\"1\">In den folgenden Abschnitten geben Sie einer Klasse ihre eigenen Daten (<em>Attribute<\/em>) und ihr eigenes Verhalten (<em>Methoden<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Das erste Thema betrachtet den Unterschied zwischen einer Klasse und ihren Instanzen genauer.<\/span><\/p>"]]},"nl":{"t":"Klassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe waren de gegevenstypen die je gebruikt hebt — getallen, strings, arrays enzovoort — allemaal in Raku ingebouwd.<\/span> <span class=\"sg\" data-s=\"1\">Met <em>objectgeoriënteerd programmeren<\/em> kun je je eigen typen definiëren, <em>klassen<\/em> genoemd, en waarden van die typen maken, <em>objecten<\/em> genoemd.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een klasse wordt gedefinieerd met het sleutelwoord <code>class<\/code>, gevolgd door een naam en een blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze klasse <code>Dog<\/code> is voorlopig leeg, maar het is al een nieuw type.<\/span> <span class=\"sg\" data-s=\"1\">Om een object van de klasse te maken — een <em>instantie<\/em> — roep je de methode <code>new<\/code> aan op de naam van de klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$rex<\/code> bevat nu een <code>Dog<\/code>-object.<\/span> <span class=\"sg\" data-s=\"1\">Elke aanroep van <code>new<\/code> maakt een apart object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> en <code>$fido<\/code> zijn twee verschillende honden, ook al heeft de klasse nog geen inhoud.<\/span> <span class=\"sg\" data-s=\"1\">In de volgende secties geef je een klasse haar eigen gegevens (<em>attributen<\/em>) en haar eigen gedrag (<em>methoden<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Het eerste onderwerp kijkt nauwkeuriger naar het verschil tussen een klasse en haar instanties.<\/span><\/p>"]]},"es":{"t":"Clases","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora los tipos de datos que has usado — números, cadenas, arrays y demás — venían todos incorporados en Raku.<\/span> <span class=\"sg\" data-s=\"1\">La <em>programación orientada a objetos<\/em> te permite definir tipos propios, llamados <em>clases<\/em>, y crear valores de esos tipos, llamados <em>objetos<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una clase se define con la palabra clave <code>class<\/code>, seguida de un nombre y un bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta clase <code>Dog<\/code> está vacía por ahora, pero ya es un tipo nuevo.<\/span> <span class=\"sg\" data-s=\"1\">Para crear un objeto de la clase — una <em>instancia<\/em> — llama al método <code>new<\/code> sobre el nombre de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora la variable <code>$rex<\/code> contiene un objeto <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cada llamada a <code>new<\/code> crea un objeto distinto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> y <code>$fido<\/code> son dos perros distintos, aunque la clase todavía no tenga contenido.<\/span> <span class=\"sg\" data-s=\"1\">En las secciones siguientes darás a una clase datos propios (los <em>atributos<\/em>) y comportamiento propio (los <em>métodos<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">El primer tema examina más de cerca la diferencia entre una clase y sus instancias.<\/span><\/p>"]]},"it":{"t":"Classi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora i tipi di dati che hai usato — numeri, stringhe, array e così via — erano tutti incorporati in Raku.<\/span> <span class=\"sg\" data-s=\"1\">La <em>programmazione a oggetti<\/em> ti permette di definire tipi tuoi, chiamati <em>classi<\/em>, e di creare valori di quei tipi, chiamati <em>oggetti<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una classe si definisce con la parola chiave <code>class<\/code>, seguita da un nome e da un blocco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa classe <code>Dog<\/code> per ora è vuota, ma è già un tipo nuovo.<\/span> <span class=\"sg\" data-s=\"1\">Per creare un oggetto della classe — un'<em>istanza<\/em> — chiama il metodo <code>new<\/code> sul nome della classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora la variabile <code>$rex<\/code> contiene un oggetto <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni chiamata a <code>new<\/code> crea un oggetto separato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> e <code>$fido<\/code> sono due cani distinti, anche se la classe non ha ancora alcun contenuto.<\/span> <span class=\"sg\" data-s=\"1\">Nelle sezioni che seguono darai a una classe dati propri (gli <em>attributi<\/em>) e comportamenti propri (i <em>metodi<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Il primo argomento guarda più da vicino la differenza fra una classe e le sue istanze.<\/span><\/p>"]]},"lv":{"t":"Klases","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Līdz šim datu tipi, ko lietojāt — skaitļi, virknes, masīvi un tā tālāk —, visi bija Raku iebūvēti. <em>Objektorientētā programmēšana<\/em> ļauj definēt pašam savus tipus, ko sauc par <em>klasēm<\/em>, un radīt šo tipu vērtības, ko sauc par <em>objektiem<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klasi definē ar atslēgvārdu <code>class<\/code>, kam seko nosaukums un bloks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī klase <code>Dog<\/code> pagaidām ir tukša, taču tā jau ir jauns tips.<\/span> <span class=\"sg\" data-s=\"1\">Lai radītu klases objektu — <em>instanci<\/em> —, izsauciet uz klases nosaukuma metodi <code>new<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$rex<\/code> tagad satur <code>Dog<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"1\">Katrs <code>new<\/code> izsaukums rada atsevišķu objektu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> un <code>$fido<\/code> ir divi atsevišķi suņi, lai gan klasei vēl nav nekāda satura.<\/span> <span class=\"sg\" data-s=\"1\">Nākamajās sadaļās klasei dosiet savus datus (<em>atribūtus<\/em>) un savu uzvedību (<em>metodes<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Pirmais temats tuvāk aplūko atšķirību starp klasi un tās instancēm.<\/span><\/p>"]]},"ru":{"t":"Классы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">До сих пор все типы данных, которыми вы пользовались, — числа, строки, массивы и так далее — были встроены в Raku. <em>Объектно-ориентированное программирование<\/em> позволяет определять собственные типы, называемые <em>классами<\/em>, и создавать значения этих типов, называемые <em>объектами<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класс определяется ключевым словом <code>class<\/code>, за которым следуют имя и блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот класс <code>Dog<\/code> пока пуст, но он уже является новым типом.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы создать объект класса — <em>экземпляр<\/em> — вызовите метод <code>new<\/code> у имени класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь переменная <code>$rex<\/code> содержит объект <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каждый вызов <code>new<\/code> создаёт отдельный объект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> и <code>$fido<\/code> — две разные собаки, хотя у класса пока нет никакого содержимого.<\/span> <span class=\"sg\" data-s=\"1\">В следующих разделах вы дадите классу собственные данные (<em>атрибуты<\/em>) и собственное поведение (<em>методы<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Первая тема подробнее рассматривает разницу между классом и его экземплярами.<\/span><\/p>"]]},"uk":{"t":"Класи","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Досі всі типи даних, якими ви користувалися — числа, рядки, масиви тощо, — були вбудовані в Raku. <em>Об'єктно-орієнтоване програмування<\/em> дозволяє визначати власні типи, які називають <em>класами<\/em>, і створювати значення цих типів, які називають <em>об'єктами<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас визначають ключовим словом <code>class<\/code>, за яким ідуть ім'я та блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей клас <code>Dog<\/code> поки що порожній, але він уже є новим типом.<\/span> <span class=\"sg\" data-s=\"1\">Щоб створити об'єкт класу — <em>екземпляр<\/em>, — викличте метод <code>new<\/code> для імені класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$rex<\/code> тепер містить об'єкт <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кожен виклик <code>new<\/code> створює окремий об'єкт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> і <code>$fido<\/code> — два різні пси, хоча клас ще не має жодного вмісту.<\/span> <span class=\"sg\" data-s=\"1\">У наступних розділах ви надасте класу власні дані (<em>атрибути<\/em>) і власну поведінку (<em>методи<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Перша тема пильніше розглядає різницю між класом та його екземплярами.<\/span><\/p>"]]},"bg":{"t":"Класове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Досега типовете данни, които използвахте — числа, низове, масиви и така нататък, — бяха вградени в Raku. <em>Обектно-ориентираното програмиране<\/em> ви позволява да дефинирате свои собствени типове, наречени <em>класове<\/em>, и да създавате стойности от тези типове, наречени <em>обекти<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас се дефинира с ключовата дума <code>class<\/code>, следвана от име и блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този клас <code>Dog<\/code> засега е празен, но вече е нов тип.<\/span> <span class=\"sg\" data-s=\"1\">За да създадете обект от класа — <em>екземпляр<\/em>, — извикайте метода <code>new<\/code> върху името на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$rex<\/code> вече съдържа обект <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всяко извикване на <code>new<\/code> създава отделен обект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> и <code>$fido<\/code> са две различни кучета, макар че класът все още няма съдържание.<\/span> <span class=\"sg\" data-s=\"1\">В следващите раздели ще дадете на класа собствени данни (<em>атрибути<\/em>) и собствено поведение (<em>методи<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Първата тема разглежда по-отблизо разликата между клас и неговите екземпляри.<\/span><\/p>"]]}}}</script>
