<script type="application/json" id="page-data">{"u":"oop/classes/type-object","n":768,"k":"topic","pv":"oop/classes","nx":"oop/classes/type-object/quiz","tr":["oop","oop/classes"],"L":{"en":{"t":"Type objects and instances","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When you write a class name such as <code>Dog<\/code>, you are referring to the <em>type object<\/em> of the class.<\/span> <span class=\"sg\" data-s=\"1\">The type object represents the type itself, not any particular object of that type.<\/span> <span class=\"sg\" data-s=\"2\">An <em>instance<\/em>, created with <code>new<\/code>, is an actual object.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku can tell the two apart.<\/span> <span class=\"sg\" data-s=\"1\">The <code>defined<\/code> method returns <code>False<\/code> for a type object and <code>True<\/code> for an instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A type object is considered <em>undefined<\/em> because it holds no concrete data — it is only the description of a type.<\/span> <span class=\"sg\" data-s=\"1\">An instance is <em>defined<\/em>: it is a real object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Both report the same type through <code>WHAT<\/code>, which you met in the <a href=\"/advanced/containers/\">section about containers<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The parentheses around <code>(Dog)<\/code> are Raku’s way of showing a type.<\/span> <span class=\"sg\" data-s=\"1\">So <code>Dog<\/code> and <code>Dog.new<\/code> share the type <code>Dog<\/code>; the difference is that one is the type itself, and the other is an object of that type.<\/span><\/p>"]]},"de":{"t":"Typobjekte und Instanzen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie einen Klassennamen wie <code>Dog<\/code> schreiben, beziehen Sie sich auf das <em>Typobjekt<\/em> der Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Das Typobjekt steht für den Typ selbst, nicht für ein bestimmtes Objekt dieses Typs.<\/span> <span class=\"sg\" data-s=\"2\">Eine <em>Instanz<\/em>, mit <code>new<\/code> erzeugt, ist ein tatsächliches Objekt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku kann die beiden unterscheiden.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>defined<\/code> liefert <code>False<\/code> für ein Typobjekt und <code>True<\/code> für eine Instanz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Typobjekt gilt als <em>undefiniert<\/em>, weil es keine konkreten Daten enthält — es ist lediglich die Beschreibung eines Typs.<\/span> <span class=\"sg\" data-s=\"1\">Eine Instanz ist <em>definiert<\/em>: Sie ist ein echtes Objekt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide melden über <code>WHAT<\/code> denselben Typ, das Sie im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a> kennengelernt haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Klammern um <code>(Dog)<\/code> sind Rakus Art, einen Typ darzustellen.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> und <code>Dog.new<\/code> teilen sich also den Typ <code>Dog<\/code>; der Unterschied ist, dass das eine der Typ selbst ist und das andere ein Objekt dieses Typs.<\/span><\/p>"]]},"nl":{"t":"Typeobjecten en instanties","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je een klassenaam als <code>Dog<\/code> schrijft, verwijs je naar het <em>typeobject<\/em> van de klasse.<\/span> <span class=\"sg\" data-s=\"1\">Het typeobject stelt het type zelf voor, niet een bepaald object van dat type.<\/span> <span class=\"sg\" data-s=\"2\">Een <em>instantie<\/em>, gemaakt met <code>new<\/code>, is een echt object.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku kan de twee uit elkaar houden.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>defined<\/code> geeft <code>False<\/code> terug voor een typeobject en <code>True<\/code> voor een instantie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een typeobject geldt als <em>ongedefinieerd<\/em> omdat het geen concrete gegevens bevat — het is slechts de beschrijving van een type.<\/span> <span class=\"sg\" data-s=\"1\">Een instantie is <em>gedefinieerd<\/em>: het is een echt object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide melden hetzelfde type via <code>WHAT<\/code>, dat je tegenkwam in de <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectie over containers<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De haakjes om <code>(Dog)<\/code> zijn Raku's manier om een type te tonen.<\/span> <span class=\"sg\" data-s=\"1\">Dus <code>Dog<\/code> en <code>Dog.new<\/code> delen het type <code>Dog<\/code>; het verschil is dat het ene het type zelf is en het andere een object van dat type.<\/span><\/p>"]]},"es":{"t":"Objetos de tipo e instancias","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando escribes el nombre de una clase como <code>Dog<\/code>, te estás refiriendo al <em>objeto de tipo<\/em> de la clase.<\/span> <span class=\"sg\" data-s=\"1\">El objeto de tipo representa el tipo en sí, no un objeto concreto de ese tipo.<\/span> <span class=\"sg\" data-s=\"2\">Una <em>instancia<\/em>, creada con <code>new<\/code>, es un objeto de verdad.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku distingue ambos.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>defined<\/code> devuelve <code>False<\/code> para un objeto de tipo y <code>True<\/code> para una instancia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un objeto de tipo se considera <em>no definido<\/em> porque no contiene datos concretos: es solo la descripción de un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Una instancia sí está <em>definida<\/em>: es un objeto de verdad.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambos informan del mismo tipo a través de <code>WHAT<\/code>, que conociste en la <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sección sobre contenedores<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los paréntesis alrededor de <code>(Dog)<\/code> son la forma que tiene Raku de mostrar un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>Dog<\/code> y <code>Dog.new<\/code> comparten el tipo <code>Dog<\/code>; la diferencia es que uno es el tipo mismo y el otro un objeto de ese tipo.<\/span><\/p>"]]},"it":{"t":"Oggetti di tipo e istanze","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando scrivi il nome di una classe come <code>Dog<\/code>, ti stai riferendo all'<em>oggetto di tipo<\/em> della classe.<\/span> <span class=\"sg\" data-s=\"1\">L'oggetto di tipo rappresenta il tipo in sé, non un oggetto particolare di quel tipo.<\/span> <span class=\"sg\" data-s=\"2\">Un'<em>istanza<\/em>, creata con <code>new<\/code>, è un oggetto vero e proprio.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku sa distinguere i due.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>defined<\/code> restituisce <code>False<\/code> per un oggetto di tipo e <code>True<\/code> per un'istanza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un oggetto di tipo è considerato <em>non definito<\/em> perché non contiene dati concreti: è solo la descrizione di un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Un'istanza è <em>definita<\/em>: è un oggetto vero.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entrambi riferiscono lo stesso tipo tramite <code>WHAT<\/code>, che hai incontrato nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui contenitori<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le parentesi attorno a <code>(Dog)<\/code> sono il modo in cui Raku mostra un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>Dog<\/code> e <code>Dog.new<\/code> condividono il tipo <code>Dog<\/code>; la differenza è che uno è il tipo stesso e l'altro è un oggetto di quel tipo.<\/span><\/p>"]]},"lv":{"t":"Tipa objekti un instances","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad rakstāt klases nosaukumu, piemēram, <code>Dog<\/code>, jūs atsaucaties uz klases <em>tipa objektu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tipa objekts pārstāv pašu tipu, nevis kādu konkrētu šī tipa objektu. <em>Instance<\/em>, kas radīta ar <code>new<\/code>, ir īsts objekts.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku abus spēj atšķirt.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>defined<\/code> tipa objektam atgriež <code>False<\/code>, bet instancei <code>True<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tipa objekts tiek uzskatīts par <em>nedefinētu<\/em>, jo tas nesatur nekādus konkrētus datus — tas ir tikai tipa apraksts.<\/span> <span class=\"sg\" data-s=\"1\">Instance ir <em>definēta<\/em>: tā ir īsts objekts.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abi ziņo vienu un to pašu tipu caur <code>WHAT<\/code>, ar ko iepazināties <a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sadaļā par konteineriem<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iekavas ap <code>(Dog)<\/code> ir Raku veids, kā parādīt tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>Dog<\/code> un <code>Dog.new<\/code> dala tipu <code>Dog<\/code>; atšķirība ir tāda, ka viens ir pats tips, bet otrs — šī tipa objekts.<\/span><\/p>"]]},"ru":{"t":"Объекты типа и экземпляры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы пишете имя класса, например <code>Dog<\/code>, вы обращаетесь к <em>объекту типа<\/em> этого класса.<\/span> <span class=\"sg\" data-s=\"1\">Объект типа представляет сам тип, а не какой-то конкретный объект этого типа. <em>Экземпляр<\/em>, созданный с помощью <code>new<\/code>, — это настоящий объект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku умеет их различать.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>defined<\/code> возвращает <code>False<\/code> для объекта типа и <code>True<\/code> для экземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Объект типа считается <em>неопределённым<\/em>, потому что не содержит конкретных данных — это лишь описание типа.<\/span> <span class=\"sg\" data-s=\"1\">Экземпляр же <em>определён<\/em>: это настоящий объект.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оба сообщают один и тот же тип через <code>WHAT<\/code>, с которым вы встречались в <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Круглые скобки вокруг <code>(Dog)<\/code> — это принятый в Raku способ показать тип.<\/span> <span class=\"sg\" data-s=\"1\">Итак, <code>Dog<\/code> и <code>Dog.new<\/code> имеют один и тот же тип <code>Dog<\/code>; разница в том, что одно — это сам тип, а другое — объект этого типа.<\/span><\/p>"]]},"uk":{"t":"Об'єкти типу та екземпляри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви пишете ім'я класу на кшталт <code>Dog<\/code>, ви посилаєтеся на <em>об'єкт типу<\/em> цього класу.<\/span> <span class=\"sg\" data-s=\"1\">Об'єкт типу представляє сам тип, а не якийсь конкретний об'єкт цього типу. <em>Екземпляр<\/em>, створений через <code>new<\/code>, є справжнім об'єктом.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku вміє їх розрізняти.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>defined<\/code> повертає <code>False<\/code> для об'єкта типу й <code>True<\/code> для екземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Об'єкт типу вважається <em>невизначеним<\/em>, бо не містить жодних конкретних даних — це лише опис типу.<\/span> <span class=\"sg\" data-s=\"1\">Екземпляр є <em>визначеним<\/em>: це справжній об'єкт.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва повідомляють той самий тип через <code>WHAT<\/code>, з яким ви познайомилися в <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дужки навколо <code>(Dog)<\/code> — це спосіб Raku показати тип.<\/span> <span class=\"sg\" data-s=\"1\">Отже, <code>Dog<\/code> і <code>Dog.new<\/code> мають спільний тип <code>Dog<\/code>; різниця в тому, що одне є самим типом, а друге — об'єктом цього типу.<\/span><\/p>"]]},"bg":{"t":"Обекти на типа и екземпляри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато напишете име на клас като <code>Dog<\/code>, вие се позовавате на <em>обекта на типа<\/em> на класа.<\/span> <span class=\"sg\" data-s=\"1\">Обектът на типа представя самия тип, а не някакъв конкретен обект от този тип. <em>Екземплярът<\/em>, създаден с <code>new<\/code>, е действителен обект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku различава двете.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>defined<\/code> връща <code>False<\/code> за обект на типа и <code>True<\/code> за екземпляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обектът на типа се смята за <em>недефиниран<\/em>, защото не съдържа конкретни данни — той е само описанието на един тип.<\/span> <span class=\"sg\" data-s=\"1\">Екземплярът е <em>дефиниран<\/em>: той е истински обект.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И двата съобщават един и същ тип чрез <code>WHAT<\/code>, с който се запознахте в <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скобите около <code>(Dog)<\/code> са начинът на Raku да покаже тип.<\/span> <span class=\"sg\" data-s=\"1\">Така <code>Dog<\/code> и <code>Dog.new<\/code> споделят типа <code>Dog<\/code>; разликата е, че единият е самият тип, а другият — обект от този тип.<\/span><\/p>"]]},"eo":{"t":"Tipobjektoj kaj ekzempleroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi skribas klasan nomon kiel <code>Dog<\/code>, vi referencas la <em>tipobjekton<\/em> de la klaso.<\/span> <span class=\"sg\" data-s=\"1\">La tipobjekto reprezentas la tipon mem, ne iun apartan objekton de tiu tipo. <em>Ekzemplero<\/em>, kreita per <code>new<\/code>, estas efektiva objekto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku povas distingi ilin.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>defined<\/code> redonas <code>False<\/code> por tipobjekto kaj <code>True<\/code> por ekzemplero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tipobjekto estas konsiderata <em>nedifinita<\/em>, ĉar ĝi tenas neniujn konkretajn datumojn — ĝi estas nur la priskribo de tipo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemplero estas <em>difinita<\/em>: ĝi estas vera objekto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ raportas la saman tipon per <code>WHAT<\/code>, kiun vi renkontis en la <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sekcio pri ujoj<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La krampoj ĉirkaŭ <code>(Dog)<\/code> estas la maniero de Raku montri tipon.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>Dog<\/code> kaj <code>Dog.new<\/code> kunhavas la tipon <code>Dog<\/code>; la diferenco estas, ke unu estas la tipo mem, kaj la alia estas objekto de tiu tipo.<\/span><\/p>"]]},"la":{"t":"Obiecta generis et exempla","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum nomen classis qualis est <code>Dog<\/code> scribis, ad <em>obiectum generis<\/em> classis spectas.<\/span> <span class=\"sg\" data-s=\"1\">Obiectum generis ipsum genus repraesentat, non aliquod certum obiectum illius generis. <em>Exemplar<\/em>, per <code>new<\/code> creatum, est obiectum actuale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku utrumque discernere potest.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>defined<\/code> pro obiecto generis <code>False<\/code> reddit et pro exemplari <code>True<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Obiectum generis <em>indefinitum<\/em> habetur quia nulla data concreta continet — mera descriptio generis est.<\/span> <span class=\"sg\" data-s=\"1\">Exemplar <em>definitum<\/em> est: obiectum verum est.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Utrumque idem genus per <code>WHAT<\/code> nuntiat, quod in <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de receptaculis<\/a> invenisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parentheses circa <code>(Dog)<\/code> sunt modus quo Raku genus ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>Dog<\/code> et <code>Dog.new<\/code> genus <code>Dog<\/code> communicant; differentia est quod alterum ipsum genus est, alterum obiectum illius generis.<\/span><\/p>"]]}}}</script>
