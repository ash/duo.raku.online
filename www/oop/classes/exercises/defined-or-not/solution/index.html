<script type="application/json" id="page-data">{"u":"oop/classes/exercises/defined-or-not/solution","n":772,"k":"solution","pv":"oop/classes/exercises/defined-or-not","nx":"oop/classes/exercises/name-the-type","tr":["oop","oop/classes"],"L":{"en":{"t":"The solution of ’Defined or not‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The loop walks over a mix of type objects (<code>Cat<\/code>, <code>Dog<\/code>) and instances (<code>Cat.new<\/code>, <code>Dog.new<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both type objects are undefined, so <code>defined<\/code> returns <code>False<\/code> for them; both instances are defined, so it returns <code>True<\/code>. Definedness depends on whether a value is a type object or a real instance — not on which class it belongs to.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Definiert oder nicht","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Schleife läuft über eine Mischung aus Typobjekten (<code>Cat<\/code>, <code>Dog<\/code>) und Instanzen (<code>Cat.new<\/code>, <code>Dog.new<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Typobjekte sind undefiniert, daher liefert <code>defined<\/code> für sie <code>False<\/code>; beide Instanzen sind definiert, daher liefert es <code>True<\/code>. Die Definiertheit hängt davon ab, ob ein Wert ein Typobjekt oder eine echte Instanz ist — nicht davon, zu welcher Klasse er gehört.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Gedefinieerd of niet","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\  target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cikls iet pāri tipa objektu (<code>Cat<\/code>, <code>Dog<\/code>) un instanču (<code>Cat.new<\/code>, <code>Dog.new<\/code>) sajaukumam.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abi tipa objekti ir nedefinēti, tāpēc <code>defined<\/code> tiem atgriež <code>False<\/code>; abas instances ir definētas, tāpēc tas atgriež <code>True<\/code>. Definētība ir atkarīga no tā, vai vērtība ir tipa objekts vai īsta instance, — nevis no tā, kurai klasei tā pieder.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Определён или нет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл проходит по смеси объектов типа (<code>Cat<\/code>, <code>Dog<\/code>) и экземпляров (<code>Cat.new<\/code>, <code>Dog.new<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оба объекта типа не определены, поэтому <code>defined<\/c
