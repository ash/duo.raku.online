<script type="application/json" id="page-data">{"u":"oop/object-introspection/inheritance-chain","n":838,"k":"topic","pv":"oop/object-introspection","nx":"oop/object-introspection/inheritance-chain/quiz","tr":["oop","oop/object-introspection"],"L":{"en":{"t":"The inheritance chain","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When one class inherits from another, you can ask for the whole chain of types it is built on.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.^mro<\/code> meta-method returns this chain — the name stands for <em>method resolution order<\/em>, the order in which Raku looks for a method.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Reading from the left: a <code>Dog<\/code> is first itself, then an <code>Animal<\/code> (its parent), then <code>Any<\/code> and <code>Mu<\/code> — the two types that every Raku object inherits from at the very top.<\/span> <span class=\"sg\" data-s=\"1\">When you call a method on a <code>Dog<\/code>, Raku searches this list from left to right and uses the first matching method it finds.<\/span> <span class=\"sg\" data-s=\"2\">That is exactly why a child’s method overrides the parent’s: the child appears earlier in the chain.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For a class with no explicit parent, the chain is shorter — just the class itself, followed by <code>Any<\/code> and <code>Mu<\/code>.<\/span><\/p>"]]},"de":{"t":"Die Vererbungskette","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Klasse von einer anderen erbt, können Sie nach der gesamten Kette der Typen fragen, auf denen sie aufbaut.<\/span> <span class=\"sg\" data-s=\"1\">Die Metamethode <code>.^mro<\/code> liefert diese Kette — der Name steht für <em>method resolution order<\/em>, die Reihenfolge, in der Raku nach einer Methode sucht.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Von links gelesen: Ein <code>Dog<\/code> ist zuerst er selbst, dann ein <code>Animal<\/code> (sein Elternteil), dann <code>Any<\/code> und <code>Mu<\/code> — die beiden Typen, von denen ganz oben jedes Raku-Objekt erbt.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie eine Methode auf einem <code>Dog<\/code> aufrufen, durchsucht Raku diese Liste von links nach rechts und nimmt die erste passende Methode, die es findet.<\/span> <span class=\"sg\" data-s=\"2\">Genau deshalb überschreibt die Methode eines Kindes die des Elternteils: Das Kind steht früher in der Kette.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für eine Klasse ohne ausdrücklichen Elternteil ist die Kette kürzer — nur die Klasse selbst, gefolgt von <code>Any<\/code> und <code>Mu<\/code>.<\/span><\/p>"]]},"nl":{"t":"De overervingsketen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer de ene klasse van de andere erft, kun je de hele keten van typen opvragen waarop ze gebouwd is.<\/span> <span class=\"sg\" data-s=\"1\">De metamethode <code>.^mro<\/code> geeft die keten terug — de naam staat voor <em>method resolution order<\/em>, de volgorde waarin Raku naar een methode zoekt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Van links gelezen: een <code>Dog<\/code> is eerst zichzelf, dan een <code>Animal<\/code> (zijn ouder), dan <code>Any<\/code> en <code>Mu<\/code> — de twee typen waarvan elk Raku-object helemaal bovenaan erft.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer je een methode op een <code>Dog<\/code> aanroept, doorzoekt Raku deze lijst van links naar rechts en gebruikt het de eerste passende methode die het vindt.<\/span> <span class=\"sg\" data-s=\"2\">Precies daarom overschrijft de methode van een kind die van de ouder: het kind staat eerder in de keten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een klasse zonder expliciete ouder is de keten korter — alleen de klasse zelf, gevolgd door <code>Any<\/code> en <code>Mu<\/code>.<\/span><\/p>"]]},"es":{"t":"La cadena de herencia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando una clase hereda de otra, puedes pedir la cadena completa de tipos sobre la que está construida.<\/span> <span class=\"sg\" data-s=\"1\">El metamétodo <code>.^mro<\/code> devuelve esa cadena; el nombre viene de <em>method resolution order<\/em>, el orden en que Raku busca un método.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Leyendo de izquierda a derecha: un <code>Dog<\/code> es primero él mismo, después un <code>Animal<\/code> (su padre) y después <code>Any<\/code> y <code>Mu<\/code>, los dos tipos de los que hereda todo objeto de Raku en la cúspide.<\/span> <span class=\"sg\" data-s=\"1\">Cuando llamas a un método sobre un <code>Dog<\/code>, Raku recorre esta lista de izquierda a derecha y usa el primer método que encuentra.<\/span> <span class=\"sg\" data-s=\"2\">Esa es exactamente la razón de que el método de una hija sobrescriba el del padre: la hija aparece antes en la cadena.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para una clase sin padre explícito la cadena es más corta: solo la clase misma, seguida de <code>Any<\/code> y <code>Mu<\/code>.<\/span><\/p>"]]},"it":{"t":"La catena di ereditarietà","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando una classe eredita da un'altra, puoi chiedere l'intera catena di tipi su cui è costruita.<\/span> <span class=\"sg\" data-s=\"1\">Il metametodo <code>.^mro<\/code> restituisce questa catena: il nome sta per <em>method resolution order<\/em>, l'ordine in cui Raku cerca un metodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Leggendo da sinistra: un <code>Dog<\/code> è prima se stesso, poi un <code>Animal<\/code> (il suo genitore), poi <code>Any<\/code> e <code>Mu<\/code> — i due tipi da cui ogni oggetto Raku eredita in cima a tutto.<\/span> <span class=\"sg\" data-s=\"1\">Quando chiami un metodo su un <code>Dog<\/code>, Raku percorre questo elenco da sinistra a destra e usa il primo metodo corrispondente che trova.<\/span> <span class=\"sg\" data-s=\"2\">È esattamente per questo che il metodo di una figlia sovrascrive quello della genitrice: la figlia compare prima nella catena.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per una classe senza genitore esplicito la catena è più corta: solo la classe stessa, seguita da <code>Any<\/code> e <code>Mu<\/code>.<\/span><\/p>"]]},"lv":{"t":"Mantošanas ķēde","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad viena klase manto no citas, var palūgt visu tipu ķēdi, uz kuras tā ir uzbūvēta.<\/span> <span class=\"sg\" data-s=\"1\">Metametode <code>.^mro<\/code> atgriež šo ķēdi — nosaukums cēlies no <em>method resolution order<\/em>, tas ir, secības, kādā Raku meklē metodi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lasot no kreisās puses: <code>Dog<\/code> vispirms ir pats, tad <code>Animal<\/code> (tā vecākklase), tad <code>Any<\/code> un <code>Mu<\/code> — divi tipi, no kuriem pašā augšā manto katrs Raku objekts.<\/span> <span class=\"sg\" data-s=\"1\">Kad uz <code>Dog<\/code> izsaucat metodi, Raku pārmeklē šo sarakstu no kreisās uz labo un izmanto pirmo atrasto atbilstošo metodi.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tāpēc bērnklases metode pārraksta vecākklases: bērnklase ķēdē parādās agrāk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klasei bez skaidri norādītas vecākklases ķēde ir īsāka — tikai pati klase, kam seko <code>Any<\/code> un <code>Mu<\/code>.<\/span><\/p>"]]},"ru":{"t":"Цепочка наследования","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда один класс наследует от другого, можно запросить всю цепочку типов, на которых он построен.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^mro<\/code> возвращает эту цепочку — название расшифровывается как <em>method resolution order<\/em>, порядок разрешения методов, то есть порядок, в котором Raku ищет метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Читая слева направо: <code>Dog<\/code> — это сначала он сам, затем <code>Animal<\/code> (его родитель), затем <code>Any<\/code> и <code>Mu<\/code> — два типа, от которых на самом верху наследует каждый объект Raku.<\/span> <span class=\"sg\" data-s=\"1\">Когда вы вызываете метод у <code>Dog<\/code>, Raku просматривает этот список слева направо и берёт первый подходящий метод, который найдёт.<\/span> <span class=\"sg\" data-s=\"2\">Именно поэтому метод потомка переопределяет метод родителя: потомок стоит в цепочке раньше.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для класса без явного родителя цепочка короче — только сам класс, а за ним <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/p>"]]},"uk":{"t":"Ланцюжок успадкування","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли один клас успадковує від іншого, можна запитати весь ланцюжок типів, на яких він побудований.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^mro<\/code> повертає цей ланцюжок; назва походить від <em>method resolution order<\/em> — порядку, в якому Raku шукає метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Читаючи зліва: <code>Dog<\/code> спершу є сам собою, потім <code>Animal<\/code> (його батьком), потім <code>Any<\/code> та <code>Mu<\/code> — двома типами, від яких на самій вершині успадковує кожен об'єкт Raku.<\/span> <span class=\"sg\" data-s=\"1\">Коли ви викликаєте метод для <code>Dog<\/code>, Raku шукає в цьому списку зліва направо й бере перший знайдений відповідний метод.<\/span> <span class=\"sg\" data-s=\"2\">Саме тому метод дитини перекриває метод батька: дитина стоїть у ланцюжку раніше.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для класу без явного батька ланцюжок коротший — лише сам клас, а за ним <code>Any<\/code> та <code>Mu<\/code>.<\/span><\/p>"]]},"bg":{"t":"Веригата на наследяване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато един клас наследява друг, можете да поискате цялата верига от типове, върху която е изграден.<\/span> <span class=\"sg\" data-s=\"1\">Метаметодът <code>.^mro<\/code> връща тази верига — името идва от <em>method resolution order<\/em>, реда, в който Raku търси метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Четейки отляво: <code>Dog<\/code> е първо самият себе си, после <code>Animal<\/code> (родителят му), после <code>Any<\/code> и <code>Mu<\/code> — двата типа, които всеки обект в Raku наследява най-отгоре.<\/span> <span class=\"sg\" data-s=\"1\">Когато извикате метод върху <code>Dog<\/code>, Raku претърсва този списък отляво надясно и използва първия съвпадащ метод, който намери.<\/span> <span class=\"sg\" data-s=\"2\">Именно затова методът на дъщерния клас предефинира този на родителя: дъщерният клас се появява по-рано във веригата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За клас без изричен родител веригата е по-къса — само самият клас, следван от <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/p>"]]}}}</script>
