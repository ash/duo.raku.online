lse<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Beschreiben Sie eine Klasse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^name;\nsay Dog.^mro.elems;\nsay 'Cat' ∈ Dog.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/object-introspection/describe-a-class.raku\" target=\"_blank\" rel=\"noopener\">describe-a-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Dog\n4\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> liefert den eigenen Namen der Klasse, <code>Dog<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> liefert die Vererbungskette, und <code>.elems<\/code> zählt sie. In der Kette stehen vier Typen — <code>Dog<\/code>, sein Elternteil <code>Animal<\/code> sowie die universellen <code>Any<\/code> und <code>Mu<\/code> —, die Anzahl ist also <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro.map(*.^name)<\/code> verwandelt diese Kette in die Liste der Typnamen, <code>(Dog Animal Any Mu)<\/code>. Der Mengenoperator <code>∈<\/code> prüft dann, ob <code>Cat<\/code> darunter ist. <code>Dog<\/code> stammt von keiner <code>Cat<\/code> ab, die Antwort ist also <code>False<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Beschrijf een klasse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["
