<script type="application/json" id="page-data">{"u":"oop/object-introspection","n":837,"k":"section","pv":"oop/roles/exercises/dancing-robot/solution","nx":"oop/object-introspection/inheritance-chain","tr":["oop"],"L":{"en":{"t":"Introspecting objects","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/advanced/containers/\">section about containers<\/a> you used <code>.^name<\/code> to ask a value for its type.<\/span> <span class=\"sg\" data-s=\"1\">The same <code>.^<\/code> meta-calls let you inspect a class and its objects: their names, their attributes, and where they sit in a hierarchy.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>.^name<\/code> meta-method returns the name of the class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>.^attributes<\/code> meta-method lists the attributes of the class.<\/span> <span class=\"sg\" data-s=\"1\">Each is shown with its type and its internal private name (the <code>$!<\/code> form you met with <a href=\"/oop/methods/private-attributes/\">private attributes<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Introspection is useful for tools that work with objects generically — for example, to print every attribute of an object without knowing its class in advance.<\/span> <span class=\"sg\" data-s=\"1\">The next topic looks at how to see a class’s inheritance chain.<\/span><\/p>"]]},"de":{"t":"Objekte inspizieren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a> haben Sie <code>.^name<\/code> verwendet, um einen Wert nach seinem Typ zu fragen.<\/span> <span class=\"sg\" data-s=\"1\">Dieselben Meta-Aufrufe mit <code>.^<\/code> erlauben es Ihnen, eine Klasse und ihre Objekte zu untersuchen: ihre Namen, ihre Attribute und ihren Platz in einer Hierarchie.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Metamethode <code>.^name<\/code> liefert den Namen der Klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Metamethode <code>.^attributes<\/code> führt die Attribute der Klasse auf.<\/span> <span class=\"sg\" data-s=\"1\">Jedes wird mit seinem Typ und seinem internen privaten Namen dargestellt (die <code>$!<\/code>-Form, die Sie bei den <a href=\"https://course.raku.org/de/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privaten Attributen<\/a> kennengelernt haben):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Introspektion ist nützlich für Werkzeuge, die allgemein mit Objekten arbeiten — etwa um jedes Attribut eines Objekts auszugeben, ohne dessen Klasse vorher zu kennen.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Thema zeigt, wie man die Vererbungskette einer Klasse sieht.<\/span><\/p>"]]},"nl":{"t":"Objecten introspecteren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In de <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectie over containers<\/a> gebruikte je <code>.^name<\/code> om een waarde naar haar type te vragen.<\/span> <span class=\"sg\" data-s=\"1\">Dezelfde meta-aanroepen met <code>.^<\/code> laten je een klasse en haar objecten inspecteren: hun namen, hun attributen, en waar ze in een hiërarchie zitten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De metamethode <code>.^name<\/code> geeft de naam van de klasse terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De metamethode <code>.^attributes<\/code> somt de attributen van de klasse op.<\/span> <span class=\"sg\" data-s=\"1\">Elk wordt getoond met zijn type en zijn interne private naam (de <code>$!<\/code>-vorm die je bij <a href=\"https://course.raku.org/nl/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">private attributen<\/a> tegenkwam):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Introspectie is nuttig voor tools die generiek met objecten werken — bijvoorbeeld om elk attribuut van een object af te drukken zonder de klasse van tevoren te kennen.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp bekijkt hoe je de overervingsketen van een klasse kunt zien.<\/span><\/p>"]]},"es":{"t":"Introspección de objetos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sección sobre contenedores<\/a> usaste <code>.^name<\/code> para preguntarle a un valor por su tipo.<\/span> <span class=\"sg\" data-s=\"1\">Esas mismas metallamadas <code>.^<\/code> te permiten inspeccionar una clase y sus objetos: sus nombres, sus atributos y su lugar en una jerarquía.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El metamétodo <code>.^name<\/code> devuelve el nombre de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El metamétodo <code>.^attributes<\/code> enumera los atributos de la clase.<\/span> <span class=\"sg\" data-s=\"1\">Cada uno se muestra con su tipo y su nombre privado interno (la forma <code>$!<\/code> que conociste con los <a href=\"https://course.raku.org/es/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">atributos privados<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La introspección es útil para las herramientas que trabajan con objetos de forma genérica, por ejemplo para imprimir todos los atributos de un objeto sin conocer de antemano su clase.<\/span> <span class=\"sg\" data-s=\"1\">El tema siguiente examina cómo ver la cadena de herencia de una clase.<\/span><\/p>"]]},"it":{"t":"Introspezione degli oggetti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui contenitori<\/a> hai usato <code>.^name<\/code> per chiedere a un valore il suo tipo.<\/span> <span class=\"sg\" data-s=\"1\">Le stesse metachiamate <code>.^<\/code> ti permettono di ispezionare una classe e i suoi oggetti: i loro nomi, i loro attributi e la loro posizione in una gerarchia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metametodo <code>.^name<\/code> restituisce il nome della classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metametodo <code>.^attributes<\/code> elenca gli attributi della classe.<\/span> <span class=\"sg\" data-s=\"1\">Ciascuno è mostrato con il suo tipo e il suo nome privato interno (la forma <code>$!<\/code> che hai incontrato con gli <a href=\"https://course.raku.org/it/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">attributi privati<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'introspezione è utile per gli strumenti che lavorano con gli oggetti in modo generico — per esempio per stampare ogni attributo di un oggetto senza conoscerne in anticipo la classe.<\/span> <span class=\"sg\" data-s=\"1\">L'argomento successivo esamina come vedere la catena di ereditarietà di una classe.<\/span><\/p>"]]},"lv":{"t":"Objektu introspekcija","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Sadaļā par konteineriem<\/a> jūs izmantojāt <code>.^name<\/code>, lai vērtībai pajautātu tās tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tie paši <code>.^<\/code> metaizsaukumi ļauj izpētīt klasi un tās objektus: to nosaukumus, atribūtus un vietu hierarhijā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metametode <code>.^name<\/code> atgriež klases nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metametode <code>.^attributes<\/code> uzskaita klases atribūtus.<\/span> <span class=\"sg\" data-s=\"1\">Katrs tiek parādīts ar savu tipu un iekšējo privāto nosaukumu (<code>$!<\/code> formu, ar ko iepazināties pie <a href=\"https://course.raku.org/lv/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privātiem atribūtiem<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Introspekcija noder rīkiem, kas ar objektiem strādā vispārīgi, — piemēram, lai izdrukātu katru objekta atribūtu, iepriekš nezinot tā klasi.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais temats aplūko, kā apskatīt klases mantošanas ķēdi.<\/span><\/p>"]]},"ru":{"t":"Интроспекция объектов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a> вы использовали <code>.^name<\/code>, чтобы спросить у значения его тип.<\/span> <span class=\"sg\" data-s=\"1\">Те же метавызовы через <code>.^<\/code> позволяют исследовать класс и его объекты: их имена, их атрибуты и место в иерархии.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^name<\/code> возвращает имя класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^attributes<\/code> перечисляет атрибуты класса.<\/span> <span class=\"sg\" data-s=\"1\">Каждый показан со своим типом и внутренним приватным именем (та самая форма <code>$!<\/code>, с которой вы встречались в <a href=\"https://course.raku.org/ru/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">приватных атрибутах<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интроспекция полезна для инструментов, работающих с объектами обобщённо, — например, чтобы напечатать все атрибуты объекта, не зная заранее его класса.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема показывает, как увидеть цепочку наследования класса.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція об'єктів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a> ви користувалися <code>.^name<\/code>, щоб запитати значення про його тип.<\/span> <span class=\"sg\" data-s=\"1\">Ті самі метавиклики через <code>.^<\/code> дозволяють досліджувати клас і його об'єкти: їхні імена, атрибути та місце в ієрархії.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^name<\/code> повертає ім'я класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^attributes<\/code> перелічує атрибути класу.<\/span> <span class=\"sg\" data-s=\"1\">Кожен показано з його типом і внутрішнім приватним іменем (форма <code>$!<\/code>, з якою ви познайомилися в темі про <a href=\"https://course.raku.org/uk/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">приватні атрибути<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інтроспекція корисна для інструментів, що працюють з об'єктами узагальнено, — наприклад, щоб вивести кожен атрибут об'єкта, не знаючи наперед його класу.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема розглядає, як побачити ланцюжок успадкування класу.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на обекти","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a> използвахте <code>.^name<\/code>, за да попитате стойността за нейния тип.<\/span> <span class=\"sg\" data-s=\"1\">Същите метаизвиквания с <code>.^<\/code> ви позволяват да разгледате клас и обектите му: имената им, атрибутите им и мястото им в йерархията.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.^name<\/code> връща името на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаметодът <code>.^attributes<\/code> изброява атрибутите на класа.<\/span> <span class=\"sg\" data-s=\"1\">Всеки се показва с типа си и с вътрешното си частно име (формата <code>$!<\/code>, с която се запознахте при <a href=\"https://course.raku.org/bg/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">частните атрибути<\/a>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интроспекцията е полезна за инструменти, които работят с обекти общо — например за да отпечатат всеки атрибут на обект, без да знаят класа му предварително.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема разглежда как да видите веригата на наследяване на класа.<\/span><\/p>"]]}}}</script>
