<script type="application/json" id="page-data">{"u":"oop/exception-objects","n":941,"k":"section","pv":"oop/catch/quiz","nx":"oop/exception-objects/exercises","tr":["oop"],"L":{"en":{"t":"Exception objects","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An exception is an object, like any other in Raku.<\/span> <span class=\"sg\" data-s=\"1\">When you write <code>die 'something failed'<\/code>, Raku wraps your message in an exception object of the type <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inside a <code>CATCH<\/code>, you can inspect that object.<\/span> <span class=\"sg\" data-s=\"1\">Its type comes from <code>.^name<\/code>, and its text from <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Knowing the type lets you treat different errors differently.<\/span> <span class=\"sg\" data-s=\"1\">Raku’s built-in exceptions have specific types, whose names start with <code>X::<\/code>, and you can match on them with <code>when<\/code>, just as you matched values in a <code>given<\/code>/<code>when<\/code> block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This prints <code>an ad-hoc error: something failed<\/code>, because the exception matched the <code>X::AdHoc<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\">Matching on the type is the basis of handling specific errors — the idea the section on <a href=\"/oop/custom-exceptions/\">custom exceptions<\/a> builds upon.<\/span><\/p>"]]},"de":{"t":"Ausnahmeobjekte","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme ist ein Objekt wie jedes andere in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie <code>die 'something failed'<\/code> schreiben, verpackt Raku Ihre Meldung in ein Ausnahmeobjekt vom Typ <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Innerhalb eines <code>CATCH<\/code> können Sie dieses Objekt untersuchen.<\/span> <span class=\"sg\" data-s=\"1\">Seinen Typ liefert <code>.^name<\/code>, seinen Text <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Den Typ zu kennen erlaubt es, verschiedene Fehler verschieden zu behandeln.<\/span> <span class=\"sg\" data-s=\"1\">Rakus eingebaute Ausnahmen haben eigene Typen, deren Namen mit <code>X::<\/code> beginnen, und Sie können mit <code>when<\/code> darauf prüfen, genau wie Sie Werte in einem <code>given<\/code>/<code>when<\/code>-Block geprüft haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das gibt <code>an ad-hoc error: something failed<\/code> aus, weil die Ausnahme auf den Typ <code>X::AdHoc<\/code> passte.<\/span> <span class=\"sg\" data-s=\"1\">Auf den Typ zu prüfen ist die Grundlage für die Behandlung bestimmter Fehler — die Idee, auf der der Abschnitt über <a href=\"https://course.raku.org/de/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eigene Ausnahmen<\/a> aufbaut.<\/span><\/p>"]]},"nl":{"t":"Exceptieobjecten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een exceptie is een object, net als elk ander in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer je <code>die 'something failed'<\/code> schrijft, verpakt Raku je melding in een exceptieobject van het type <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binnen een <code>CATCH<\/code> kun je dat object inspecteren.<\/span> <span class=\"sg\" data-s=\"1\">Zijn type komt van <code>.^name<\/code> en zijn tekst van <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het type kennen laat je verschillende fouten verschillend behandelen.<\/span> <span class=\"sg\" data-s=\"1\">De ingebouwde excepties van Raku hebben specifieke typen waarvan de namen met <code>X::<\/code> beginnen, en je kunt erop matchen met <code>when<\/code>, precies zoals je waarden matchte in een <code>given<\/code>/<code>when<\/code>-blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit drukt <code>an ad-hoc error: something failed<\/code> af, omdat de exceptie op het type <code>X::AdHoc<\/code> matchte.<\/span> <span class=\"sg\" data-s=\"1\">Op het type matchen is de basis voor het afhandelen van specifieke fouten — het idee waarop de sectie over <a href=\"https://course.raku.org/nl/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eigen excepties<\/a> voortbouwt.<\/span><\/p>"]]},"es":{"t":"Objetos de excepción","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una excepción es un objeto, como cualquier otro en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Cuando escribes <code>die 'something failed'<\/code>, Raku envuelve tu mensaje en un objeto de excepción del tipo <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro de un <code>CATCH<\/code> puedes inspeccionar ese objeto.<\/span> <span class=\"sg\" data-s=\"1\">Su tipo viene de <code>.^name<\/code> y su texto de <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Conocer el tipo te permite tratar errores distintos de forma distinta.<\/span> <span class=\"sg\" data-s=\"1\">Las excepciones incorporadas de Raku tienen tipos concretos, cuyos nombres empiezan por <code>X::<\/code>, y puedes emparejarlas con <code>when<\/code>, igual que emparejabas valores en un bloque <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto imprime <code>an ad-hoc error: something failed<\/code>, porque la excepción coincidió con el tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Emparejar por tipo es la base del manejo de errores concretos, la idea sobre la que se construye la sección de <a href=\"https://course.raku.org/es/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">excepciones personalizadas<\/a>.<\/span><\/p>"]]},"it":{"t":"Oggetti eccezione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un'eccezione è un oggetto, come qualunque altro in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Quando scrivi <code>die 'something failed'<\/code>, Raku avvolge il tuo messaggio in un oggetto eccezione di tipo <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro un <code>CATCH<\/code> puoi ispezionare quell'oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Il suo tipo viene da <code>.^name<\/code> e il suo testo da <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Conoscere il tipo ti permette di trattare errori diversi in modo diverso.<\/span> <span class=\"sg\" data-s=\"1\">Le eccezioni incorporate di Raku hanno tipi specifici, i cui nomi cominciano con <code>X::<\/code>, e puoi confrontarle con <code>when<\/code>, proprio come confrontavi valori in un blocco <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>an ad-hoc error: something failed<\/code>, perché l'eccezione corrisponde al tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Confrontare il tipo è la base della gestione di errori specifici — l'idea su cui si costruisce la sezione sulle <a href=\"https://course.raku.org/it/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eccezioni personalizzate<\/a>.<\/span><\/p>"]]},"lv":{"t":"Izņēmumu objekti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Izņēmums ir objekts, gluži kā jebkurš cits Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Kad rakstāt <code>die 'something failed'<\/code>, Raku jūsu paziņojumu ietin izņēmuma objektā ar tipu <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> iekšienē šo objektu var izpētīt.<\/span> <span class=\"sg\" data-s=\"1\">Tā tips nāk no <code>.^name<\/code>, bet teksts no <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zinot tipu, dažādas kļūdas var apstrādāt dažādi.<\/span> <span class=\"sg\" data-s=\"1\">Raku iebūvētajiem izņēmumiem ir savi tipi, kuru nosaukumi sākas ar <code>X::<\/code>, un tiem var piemeklēt atbilstību ar <code>when<\/code>, gluži tāpat, kā piemeklējāt vērtības <code>given<\/code>/<code>when<\/code> blokā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>an ad-hoc error: something failed<\/code>, jo izņēmums atbilda tipam <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atbilstības piemeklēšana pēc tipa ir pamats konkrētu kļūdu apstrādei — ideja, uz kuras būvējas sadaļa par <a href=\"https://course.raku.org/lv/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">pašu definētiem izņēmumiem<\/a>.<\/span><\/p>"]]},"ru":{"t":"Объекты исключений","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Исключение — это объект, как и всё остальное в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Когда вы пишете <code>die 'something failed'<\/code>, Raku оборачивает ваше сообщение в объект исключения типа <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутри <code>CATCH<\/code> этот объект можно исследовать.<\/span> <span class=\"sg\" data-s=\"1\">Его тип даёт <code>.^name<\/code>, а текст — <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Знание типа позволяет обрабатывать разные ошибки по-разному.<\/span> <span class=\"sg\" data-s=\"1\">У встроенных исключений Raku есть конкретные типы, имена которых начинаются с <code>X::<\/code>, и их можно сопоставлять через <code>when<\/code> — точно так же, как вы сопоставляли значения в блоке <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа печатает <code>an ad-hoc error: something failed<\/code>, потому что исключение совпало с типом <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сопоставление по типу — основа обработки конкретных ошибок, и на этой идее строится раздел о <a href=\"https://course.raku.org/ru/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">собственных исключениях<\/a>.<\/span><\/p>"]]},"uk":{"t":"Об'єкти винятків","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Виняток є об'єктом, як і будь-що інше в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Коли ви пишете <code>die 'something failed'<\/code>, Raku загортає ваше повідомлення в об'єкт винятку типу <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усередині <code>CATCH<\/code> цей об'єкт можна дослідити.<\/span> <span class=\"sg\" data-s=\"1\">Його тип дає <code>.^name<\/code>, а текст — <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Знання типу дозволяє по-різному поводитися з різними помилками.<\/span> <span class=\"sg\" data-s=\"1\">Вбудовані винятки Raku мають власні типи, імена яких починаються з <code>X::<\/code>, і на них можна зіставлятися через <code>when<\/code> — так само, як ви зіставлялися зі значеннями в блоці <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це виводить <code>an ad-hoc error: something failed<\/code>, бо виняток збігся з типом <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зіставлення за типом є основою обробки конкретних помилок — ідеї, на якій будується розділ про <a href=\"https://course.raku.org/uk/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">власні винятки<\/a>.<\/span><\/p>"]]},"bg":{"t":"Обекти на изключенията","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Изключението е обект, като всеки друг в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Когато напишете <code>die 'something failed'<\/code>, Raku обвива вашето съобщение в обект на изключение от типа <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътре в <code>CATCH<\/code> можете да разгледате този обект.<\/span> <span class=\"sg\" data-s=\"1\">Типът му идва от <code>.^name<\/code>, а текстът му — от <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Знанието на типа ви позволява да третирате различните грешки различно.<\/span> <span class=\"sg\" data-s=\"1\">Вградените изключения на Raku имат конкретни типове, чиито имена започват с <code>X::<\/code>, и можете да ги съпоставяте с <code>when<\/code>, точно както съпоставяхте стойности в блок <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва <code>an ad-hoc error: something failed<\/code>, защото изключението съвпадна с типа <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Съпоставянето по тип е основата на обработката на конкретни грешки — идеята, върху която надгражда разделът за <a href=\"https://course.raku.org/bg/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">собствените изключения<\/a>.<\/span><\/p>"]]},"eo":{"t":"Esceptobjektoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Escepto estas objekto, kiel ĉiu alia en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Kiam vi skribas <code>die 'something failed'<\/code>, Raku envolvas vian mesaĝon en esceptobjekton de la tipo <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ene de <code>CATCH<\/code>, vi povas inspekti tiun objekton.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia tipo venas de <code>.^name<\/code>, kaj ĝia teksto de <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Koni la tipon permesas al vi trakti malsamajn erarojn malsame.<\/span> <span class=\"sg\" data-s=\"1\">La enkonstruitaj esceptoj de Raku havas specifajn tipojn, kies nomoj komenciĝas per <code>X::<\/code>, kaj vi povas kongrui kun ili per <code>when<\/code>, ĝuste kiel vi kongruis valorojn en bloko <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio presas <code>an ad-hoc error: something failed<\/code>, ĉar la escepto kongruis kun la tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kongrui laŭ la tipo estas la bazo de trakti specifajn erarojn — la ideo, sur kiu la sekcio pri <a href=\"https://course.raku.org/eo/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">propraj esceptoj<\/a> konstruas.<\/span><\/p>"]]},"la":{"t":"Obiecta exceptionum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Exceptio obiectum est, sicut quodlibet aliud in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>die 'something failed'<\/code> scribis, Raku nuntium tuum in obiectum exceptionis generis <code>X::AdHoc<\/code> involvit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intra <code>CATCH<\/code> illud obiectum inspicere potes.<\/span> <span class=\"sg\" data-s=\"1\">Genus eius ex <code>.^name<\/code> venit, et textus eius ex <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Genus nosse tibi permittit diversos errores diverse tractare.<\/span> <span class=\"sg\" data-s=\"1\">Exceptiones in Raku inbuiltae genera propria habent, quorum nomina ab <code>X::<\/code> incipiunt, et in eis per <code>when<\/code> comparare potes, sicut valores in clausula <code>given<\/code>/<code>when<\/code> comparasti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc <code>an ad-hoc error: something failed<\/code> imprimit, quia exceptio generi <code>X::AdHoc<\/code> convenit.<\/span> <span class=\"sg\" data-s=\"1\">In genere comparare fundamentum est certos errores tractandi — idea super quam sectio de <a href=\"https://course.raku.org/la/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">exceptionibus propriis<\/a> aedificat.<\/span><\/p>"]]}}}</script>
