ster/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>die<\/code> gebeurt binnen <code>risky<\/code>, maar de exceptie reist omhoog naar de aanroeper. De <code>CATCH<\/code> in het blok dat <code>risky<\/code> aanriep handelt hem af, en zo werkt foutafhandeling normaal gesproken: de mislukking en haar afhandelaar hoeven niet in dezelfde routine te zitten.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een kale <code>die<\/code> met een string maakt een <code>X::AdHoc<\/code>-exceptie, wat <code>.^name<\/code> meldt, en <code>.message<\/code> geeft de tekst terug die aan <code>die<\/code> is meegegeven.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Nombre el error","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub risky {\n    die 'sub failed';\n}\n\n{\n    risky();\n\n    CATCH {\n        default {\n            say .^name;\n            say .message;\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>die<\/code> ocurre dentro de <code>risky<\/code>, pero la excepción viaja hasta quien la llamó. El <code>CATCH<\/code> del bloque que llamó a <code>risky<\/code> la maneja, y así es como funciona normalmente el manejo de errores: el fallo y su manejador no tienen por qué estar en la misma rutina.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un simple <code>die<\/code> con una cadena crea una excepción <code>X::AdHoc<\/code>, que <code>.^name<\/code> informa, y <code>.message<\/code> devuelve el texto que se le pasó a <code>die<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Indicate l'errore","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub risky {\n    die 'sub failed';\n}\n\n{\n    risky();\n\n    CATCH {\n        default {\n            say .^name;\n            say .message;\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il <code>die<\/code> avviene dentro <code>risky<\/code>, ma l'eccezione viaggia fino al chiamante. Il <code>CATCH<\/code> nel blocco che ha chiamato <code>risky<\/code> la gestisce, ed è così che la gestione degli errori funziona normalmente: il fallimento e il suo gestore non devono stare nella stessa routine.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un semplice <code>die<\/code> con una stringa crea un'eccezione <code>X::AdHoc<\/code>, che <code>.^name<\/code> riferisce, e <code>.message<\/code> restituisce il testo passato a <code>die<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Nosauciet kļūdu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub risky {\n    die 'sub failed';\n}\n\n{\n    risky();\n\n    CATCH {\n        default {\n            say .^name;\n            say .message;\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>die<\/code> notiek <code>risky<\/code> iekšienē, taču izņēmums ceļo augšup pie izsaucēja. To apstrādā <code>CATCH<\/code> blokā, kas izsauca <code>risky<\/code>, un tieši tā kļūdu apstrāde parasti arī darbojas: neveiksmei un tās apstrādātājam nav jābūt vienā rutīnā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vienkāršs <code>die<\/code> ar virkni rada izņēmumu <code>X::AdHoc<\/code>, par ko ziņo <code>.^name<\/code>, bet <code>.message<\/code> atgriež tekstu, kas padots <code>die<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Назовите ошибку","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub risky {\n    die 'sub failed';\n}\n\n{\n    risky();\n\n    CATCH {\n        default {\n            say .^name;\n            say .message;\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>die<\/code> происходит внутри <code>risky<\/code>, но исключение поднимается к вызывающей стороне. Его обрабатывает <code>CATCH<\/code> в том блоке, который вызвал <code>risky<\/code>, — так обработка ошибок обычно и устроена: сбой и его обработчик не обязаны находиться в одной и той же процедуре.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обычный <code>die<\/code> со строкой создаёт исключение <code>X::AdHoc<\/code>, о чём и сообщает <code>.^name<\/code>, а <code>.message<\/code> возвращает текст, переданный в <code>die<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Назвіть помилку","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub risky {\n    die 'sub failed';\n}\n\n{\n    risky();\n\n    CATCH {\n        default {\n            say .^name;\n            say .message;\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>die<\/code> стається всередині <code>risky<\/code>, але виняток мандрує вгору до викликача. <code>CATCH<\/code> у блоці, який викликав <code>risky<\/code>, його обробляє, — саме так зазвичай і працює обробка помилок: збій і його обробник не мусять бути в одній підпрограмі.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Звичайний <code>die<\/code> із рядком створює виняток <code>X::AdHoc<\/code>, про що й повідомляє <code>.^name<\/code>, а <code>.message<\/code> повертає текст, переданий до <code>die<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Назовете грешката","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub risky {\n    die 'sub failed';\n}\n\n{\n    risky();\n\n    CATCH {\n        default {\n            say .^name;\n            say .message;\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/name-the-error.raku\" target=\"_blank\" rel=\"noopener\">name-the-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>die<\/code> се случва вътре в <code>risky<\/code>, но изключението пътува нагоре към извикващия. <code>CATCH<\/code> в блока, който е извикал <code>risky<\/code>, го обработва — и точно така обикновено работи обработката на грешки: провалът и обработващият го не е нужно да са в една и съща процедура.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\
