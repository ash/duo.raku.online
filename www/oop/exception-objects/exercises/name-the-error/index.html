<script type="application/json" id="page-data">{"u":"oop/exception-objects/exercises/name-the-error","n":943,"k":"exercise","pv":"oop/exception-objects/exercises","nx":"oop/exception-objects/exercises/name-the-error/solution","tr":["oop","oop/exception-objects"],"L":{"en":{"t":"Exercise ’Name the error‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Write a subroutine <code>risky<\/code> that does <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then call it from inside a block that has a <code>CATCH<\/code> phaser.<\/span> <span class=\"sg\" data-s=\"2\">The <code>CATCH<\/code> should print the exception’s type name (with <code>.^name<\/code>) and then its message (with <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">This shows that <code>CATCH<\/code> handles exceptions thrown by code the block <em>calls<\/em>, not only by <code>die<\/code> written directly in the block.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Nennen Sie den Fehler‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie eine Subroutine <code>risky<\/code>, die <code>die 'sub failed'<\/code> ausführt.<\/span> <span class=\"sg\" data-s=\"1\">Rufen Sie sie dann aus einem Block mit einem <code>CATCH<\/code>-Phaser auf.<\/span> <span class=\"sg\" data-s=\"2\">Das <code>CATCH<\/code> soll den Typnamen der Ausnahme (mit <code>.^name<\/code>) und danach ihre Meldung (mit <code>.message<\/code>) ausgeben.<\/span> <span class=\"sg\" data-s=\"3\">Das zeigt, dass <code>CATCH<\/code> Ausnahmen behandelt, die von Code geworfen werden, den der Block <em>aufruft<\/em>, und nicht nur von einem direkt im Block stehenden <code>die<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Noem de fout‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Schrijf een subroutine <code>risky<\/code> die <code>die 'sub failed'<\/code> doet.<\/span> <span class=\"sg\" data-s=\"1\">Roep haar daarna aan vanuit een blok met een <code>CATCH<\/code>-faser.<\/span> <span class=\"sg\" data-s=\"2\">De <code>CATCH<\/code> moet de typenaam van de exceptie afdrukken (met <code>.^name<\/code>) en daarna haar melding (met <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Dit laat zien dat <code>CATCH<\/code> excepties afhandelt die geworpen worden door code die het blok <em>aanroept<\/em>, niet alleen door een <code>die<\/code> die rechtstreeks in het blok staat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Nombre el error","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Escribe una subrutina <code>risky<\/code> que haga <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después llámala desde dentro de un bloque que tenga un phaser <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El <code>CATCH<\/code> debe imprimir el nombre del tipo de la excepción (con <code>.^name<\/code>) y después su mensaje (con <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Esto muestra que <code>CATCH<\/code> maneja las excepciones lanzadas por el código al que el bloque <em>llama<\/em>, y no solo por un <code>die<\/code> escrito directamente en el bloque.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Indicate l'errore","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Scrivi una subroutine <code>risky<\/code> che fa <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poi chiamala dall'interno di un blocco che ha un phaser <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il <code>CATCH<\/code> deve stampare il nome del tipo dell'eccezione (con <code>.^name<\/code>) e poi il suo messaggio (con <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Questo mostra che <code>CATCH<\/code> gestisce le eccezioni sollevate dal codice che il blocco <em>chiama<\/em>, non solo dal <code>die<\/code> scritto direttamente nel blocco.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Nosauciet kļūdu","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet apakšprogrammu <code>risky<\/code>, kas dara <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam izsauciet to no bloka, kuram ir fāzeris <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>CATCH<\/code> jāizdrukā izņēmuma tipa nosaukums (ar <code>.^name<\/code>) un pēc tam tā paziņojums (ar <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Tas parāda, ka <code>CATCH<\/code> apstrādā izņēmumus, ko izmet kods, kuru bloks <em>izsauc<\/em>, nevis tikai <code>die<\/code>, kas uzrakstīts pašā blokā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Назовите ошибку","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишите подпрограмму <code>risky<\/code>, которая делает <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затем вызовите её изнутри блока, в котором есть фазер <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>CATCH<\/code> должен напечатать имя типа исключения (через <code>.^name<\/code>), а затем его сообщение (через <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Это показывает, что <code>CATCH<\/code> обрабатывает исключения, брошенные кодом, который блок <em>вызывает<\/em>, а не только <code>die<\/code>, написанный прямо в блоке.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Назвіть помилку»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишіть підпрограму <code>risky<\/code>, яка робить <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім викличте її зсередини блоку, що має фазер <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>CATCH<\/code> має вивести ім'я типу винятку (через <code>.^name<\/code>), а потім його повідомлення (через <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Це показує, що <code>CATCH<\/code> обробляє винятки, кинуті кодом, який блок <em>викликає<\/em>, а не лише <code>die<\/code>, записаним безпосередньо в блоці.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Назовете грешката“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>risky<\/code>, която прави <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това я извикайте отвътре в блок, който има фазер <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>CATCH<\/code> трябва да отпечата името на типа на изключението (с <code>.^name<\/code>), а после съобщението му (с <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Това показва, че <code>CATCH<\/code> обработва изключения, хвърлени от код, който блокът <em>извиква<\/em>, а не само от <code>die<\/code>, написан направо в блока.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/exception-objects/exercises/name-the-error/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Nomu la eraron","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Skribu subrutinon <code>risky<\/code>, kiu faras <code>die 'sub failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste voku ĝin el ene de bloko, kiu havas fazeron <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La <code>CATCH<\/code> presu la tipnomon de la escepto (per <code>.^name<\/code>) kaj poste ĝian mesaĝon (per <code>.message<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Tio montras, ke <code>CATCH<\/code> traktas esceptojn ĵetitajn de kodo, kiun la bloko <em>vokas<\/em>, ne nur de <code>die<\/code> skribita rekte en la bloko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>X::AdHoc\nsub failed<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\
