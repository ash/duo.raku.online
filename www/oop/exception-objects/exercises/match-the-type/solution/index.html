ata-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/match-the-type.raku\" target=\"_blank\" rel=\"noopener\">match-the-type.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>cannot divide by zero<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В Raku <code>1 / 0<\/code> не взрывается сразу; получается ленивый <code>Failure<\/code>. Исключение бросается лишь тогда, когда мы <em>пользуемся<\/em> значением — здесь при попытке напечатать его через <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Брошенное исключение имеет встроенный тип <code>X::Numeric::DivideByZero<\/code>, и <code>when X::Numeric::DivideByZero<\/code> сопоставляет его в точности. Сопоставление конкретного типа — вместо того чтобы ловить всё подряд через <code>default<\/code> — позволяет обрабатывать разные ошибки по-разному.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Зіставте тип","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 1 / 0;\n    say $x;\n\n    CATCH {\n        when X::Numeric::DivideByZero {\n            say 'cannot divide by zero';\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/match-the-type.raku\" target=\"_blank\" rel=\"noopener\">match-the-type.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>cannot divide by zero<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У Raku <code>1 / 0<\/code> не вибухає одразу; воно дає лінивий <code>Failure<\/code>. Виняток кидається лише тоді, коли ми <em>використовуємо<\/em> це значення, — тут через спробу зробити <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кинутий виняток має вбудований тип <code>X::Numeric::DivideByZero<\/code>, і <code>when X::Numeric::DivideByZero<\/code> зіставляється з ним точно. Зіставлення з конкретним типом, замість перехоплення всього через <code>default<\/code>, дозволяє обробляти різні помилки по-різному.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Съпоставете типа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 1 / 0;\n    say $x;\n\n    CATCH {\n        when X::Numeric::DivideByZero {\n            say 'cannot divide by zero';\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/match-the-type.raku\" target=\"_blank\" rel=\"noopener\">match-the-type.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>cannot divide by zero<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В Raku <code>1 / 0<\/code> не гърми незабавно; той произвежда мързелив <code>Failure<\/code>. Изключението се хвърля едва когато <em>използваме<\/em> стойността — тук при опита да я подадем на <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Хвърленото изключение е от вградения тип <code>X::Numeric::DivideByZero<\/code>, а <code>when X::Numeric::DivideByZero<\/code> го съпоставя точно. Съп
