<script type="application/json" id="page-data">{"u":"oop/deleting","n":887,"k":"section","pv":"oop/directories/exercises/file-or-directory/solution","nx":"oop/deleting/exercises","tr":["oop"],"L":{"en":{"t":"Deleting files and directories","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Just as <code>spurt<\/code> and <code>mkdir<\/code> create things on disk, two routines remove them.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>unlink<\/code> routine deletes a file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> deletes the named file.<\/span> <span class=\"sg\" data-s=\"1\">Like the other file-system routines, it also has a method form on a path object — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deletion is immediate and permanent: there is no wastebasket to recover from.<\/span> <span class=\"sg\" data-s=\"1\">Note that after a file is gone, you must test for it with <code>.e<\/code> (existence) rather than <code>.f<\/code>, because the type tests <code>.f<\/code> and <code>.d<\/code> throw when the path is not there.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>rmdir<\/code> routine removes a directory, but only an <strong>empty<\/strong> one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If the directory still contains something, <code>rmdir<\/code> removes nothing and leaves it in place.<\/span> <span class=\"sg\" data-s=\"1\">So to delete a directory that holds files, you empty it first and then remove it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> lists the directory’s entries (the previous topic covered it), and calling <code>.unlink<\/code> on each removes them.<\/span> <span class=\"sg\" data-s=\"1\">Once the directory is empty, <code>rmdir<\/code> can take it away. (This flat loop assumes the directory holds only files; a tree with nested sub-directories would need to recurse into them first.)<\/span><\/p>"]]},"de":{"t":"Dateien und Verzeichnisse löschen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">So wie <code>spurt<\/code> und <code>mkdir<\/code> Dinge auf der Platte anlegen, entfernen zwei Routinen sie wieder.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>unlink<\/code> löscht eine Datei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> löscht die genannte Datei.<\/span> <span class=\"sg\" data-s=\"1\">Wie die übrigen Dateisystemroutinen hat sie auch eine Methodenform auf einem Pfadobjekt — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Löschen geschieht sofort und dauerhaft: Es gibt keinen Papierkorb, aus dem sich etwas zurückholen ließe.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, dass Sie nach dem Verschwinden einer Datei mit <code>.e<\/code> (Existenz) statt mit <code>.f<\/code> auf sie prüfen müssen, denn die Typprüfungen <code>.f<\/code> und <code>.d<\/code> werfen, wenn der Pfad nicht vorhanden ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>rmdir<\/code> entfernt ein Verzeichnis, aber nur ein <strong>leeres<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Enthält das Verzeichnis noch etwas, entfernt <code>rmdir<\/code> nichts und lässt es stehen.<\/span> <span class=\"sg\" data-s=\"1\">Um ein Verzeichnis mit Dateien zu löschen, leeren Sie es also zuerst und entfernen es dann:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> listet die Einträge des Verzeichnisses auf (das vorige Thema hat das behandelt), und <code>.unlink<\/code> auf jedem davon entfernt sie.<\/span> <span class=\"sg\" data-s=\"1\">Sobald das Verzeichnis leer ist, kann <code>rmdir<\/code> es wegnehmen. (Diese flache Schleife setzt voraus, dass das Verzeichnis nur Dateien enthält; ein Baum mit verschachtelten Unterverzeichnissen müsste zuerst in diese absteigen.)<\/span><\/p>"]]},"nl":{"t":"Bestanden en mappen verwijderen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Net zoals <code>spurt<\/code> en <code>mkdir<\/code> dingen op schijf aanmaken, halen twee routines ze weg.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De routine <code>unlink<\/code> verwijdert een bestand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> verwijdert het genoemde bestand.<\/span> <span class=\"sg\" data-s=\"1\">Net als de andere routines voor het bestandssysteem heeft hij ook een methodevorm op een padobject — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verwijderen is onmiddellijk en definitief: er is geen prullenbak om iets uit terug te halen.<\/span> <span class=\"sg\" data-s=\"1\">Merk op dat je, nadat een bestand weg is, erop moet testen met <code>.e<\/code> (bestaan) in plaats van <code>.f<\/code>, omdat de typetests <code>.f<\/code> en <code>.d<\/code> werpen wanneer het pad er niet is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De routine <code>rmdir<\/code> verwijdert een map, maar alleen een <strong>lege<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als de map nog iets bevat, verwijdert <code>rmdir<\/code> niets en laat hij haar staan.<\/span> <span class=\"sg\" data-s=\"1\">Dus om een map te verwijderen die bestanden bevat, maak je haar eerst leeg en verwijder je haar daarna:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> somt de items van de map op (het vorige onderwerp behandelde dat), en <code>.unlink<\/code> op elk ervan aanroepen verwijdert ze.<\/span> <span class=\"sg\" data-s=\"1\">Zodra de map leeg is, kan <code>rmdir<\/code> haar weghalen. (Deze platte lus gaat ervan uit dat de map alleen bestanden bevat; een boom met geneste submappen zou eerst daarin moeten afdalen.)<\/span><\/p>"]]},"es":{"t":"Borrar archivos y directorios","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Igual que <code>spurt<\/code> y <code>mkdir<\/code> crean cosas en el disco, dos rutinas las eliminan.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>unlink<\/code> borra un archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> borra el archivo indicado.<\/span> <span class=\"sg\" data-s=\"1\">Como las demás rutinas del sistema de archivos, también tiene forma de método sobre un objeto de ruta: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El borrado es inmediato y definitivo: no hay ninguna papelera de la que recuperar nada.<\/span> <span class=\"sg\" data-s=\"1\">Fíjate en que, una vez desaparecido el archivo, hay que comprobarlo con <code>.e<\/code> (existencia) y no con <code>.f<\/code>, porque las comprobaciones de tipo <code>.f<\/code> y <code>.d<\/code> lanzan una excepción cuando la ruta no está.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>rmdir<\/code> elimina un directorio, pero solo si está <strong>vacío<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si el directorio todavía contiene algo, <code>rmdir<\/code> no elimina nada y lo deja en su sitio.<\/span> <span class=\"sg\" data-s=\"1\">Así que, para borrar un directorio que contiene archivos, primero lo vacías y después lo eliminas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> lista las entradas del directorio (lo vimos en el tema anterior), y llamar a <code>.unlink<\/code> sobre cada una las elimina.<\/span> <span class=\"sg\" data-s=\"1\">Una vez vacío el directorio, <code>rmdir<\/code> puede llevárselo. (Este bucle plano da por sentado que el directorio solo contiene archivos; un árbol con subdirectorios anidados tendría que entrar antes en ellos de forma recursiva.)<\/span><\/p>"]]},"it":{"t":"Cancellare file e directory","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Proprio come <code>spurt<\/code> e <code>mkdir<\/code> creano cose su disco, due routine le rimuovono.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>unlink<\/code> cancella un file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> cancella il file indicato.<\/span> <span class=\"sg\" data-s=\"1\">Come le altre routine del file system, ha anche una forma a metodo su un oggetto percorso — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La cancellazione è immediata e definitiva: non c'è alcun cestino da cui recuperare.<\/span> <span class=\"sg\" data-s=\"1\">Nota che, una volta sparito il file, devi verificarlo con <code>.e<\/code> (esistenza) invece che con <code>.f<\/code>, perché i test di tipo <code>.f<\/code> e <code>.d<\/code> sollevano un'eccezione quando il percorso non c'è.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>rmdir<\/code> rimuove una directory, ma solo se <strong>vuota<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la directory contiene ancora qualcosa, <code>rmdir<\/code> non rimuove nulla e la lascia al suo posto.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, per cancellare una directory che contiene file, prima la svuoti e poi la rimuovi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> elenca le voci della directory (l'argomento precedente lo ha trattato), e chiamare <code>.unlink<\/code> su ciascuna le rimuove.<\/span> <span class=\"sg\" data-s=\"1\">Una volta che la directory è vuota, <code>rmdir<\/code> può portarla via. (Questo ciclo piatto presuppone che la directory contenga solo file; un albero con sottodirectory annidate dovrebbe prima entrare ricorsivamente in esse.)<\/span><\/p>"]]},"lv":{"t":"Failu un direktoriju dzēšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā <code>spurt<\/code> un <code>mkdir<\/code> uz diska lietas rada, divas rutīnas tās noņem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>unlink<\/code> dzēš failu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> izdzēš nosaukto failu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā pārējām failu sistēmas rutīnām, arī tai ir metodes forma uz ceļa objekta — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dzēšana ir tūlītēja un neatgriezeniska: nav nekādas miskastes, no kuras atgūt.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka pēc faila pazušanas tā esamība jāpārbauda ar <code>.e<\/code> (esamība), nevis ar <code>.f<\/code>, jo tipa pārbaudes <code>.f<\/code> un <code>.d<\/code> izmet izņēmumu, kad ceļa nav.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>rmdir<\/code> noņem direktoriju, taču tikai <strong>tukšu<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja direktorijā vēl kaut kas ir, <code>rmdir<\/code> nenoņem neko un atstāj to savā vietā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc, lai izdzēstu direktoriju, kurā ir faili, vispirms to iztukšojat un tikai tad noņemat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> uzskaita direktorijas ierakstus (iepriekšējais temats to aplūkoja), un <code>.unlink<\/code> izsaukums katram tos noņem.<\/span> <span class=\"sg\" data-s=\"1\">Kad direktorija ir tukša, <code>rmdir<\/code> to var aiznest. (Šis plakanais cikls pieņem, ka direktorijā ir tikai faili; kokam ar ligzdotām apakšdirektorijām vispirms būtu tajās jāieiet rekursīvi.)<\/span><\/p>"]]},"ru":{"t":"Удаление файлов и каталогов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Подобно тому как <code>spurt<\/code> и <code>mkdir<\/code> создают что-то на диске, две процедуры это удаляют.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>unlink<\/code> удаляет файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> удаляет названный файл.<\/span> <span class=\"sg\" data-s=\"1\">Как и другие процедуры для файловой системы, она имеет и форму метода у объекта пути — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Удаление происходит немедленно и безвозвратно: никакой корзины, из которой можно было бы восстановить файл, нет.<\/span> <span class=\"sg\" data-s=\"1\">Заметьте, что после исчезновения файла проверять его нужно через <code>.e<\/code> (существование), а не через <code>.f<\/code>, потому что проверки типа <code>.f<\/code> и <code>.d<\/code> бросают исключение, когда пути нет.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>rmdir<\/code> удаляет каталог, но только <strong>пустой<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если в каталоге ещё что-то есть, <code>rmdir<\/code> ничего не удаляет и оставляет его на месте.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому, чтобы удалить каталог с файлами, его сначала опустошают, а потом удаляют:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # удаляем все записи\nrmdir 'reports';                # теперь каталог пуст\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> перечисляет записи каталога (об этом была предыдущая тема), а вызов <code>.unlink<\/code> у каждой из них их удаляет.<\/span> <span class=\"sg\" data-s=\"1\">Как только каталог опустел, <code>rmdir<\/code> может его убрать. (Этот плоский цикл предполагает, что в каталоге лежат только файлы; для дерева с вложенными подкаталогами пришлось бы сначала спуститься в них рекурсивно.)<\/span><\/p>"]]},"uk":{"t":"Видалення файлів і каталогів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Так само як <code>spurt<\/code> і <code>mkdir<\/code> створюють щось на диску, дві підпрограми це прибирають.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>unlink<\/code> видаляє файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> видаляє названий файл.<\/span> <span class=\"sg\" data-s=\"1\">Як і інші підпрограми файлової системи, він має й форму методу для об'єкта шляху — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Видалення є негайним і остаточним: жодного смітника, з якого можна відновити, немає.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що після зникнення файлу перевіряти його наявність треба через <code>.e<\/code> (існування), а не через <code>.f<\/code>, бо перевірки типу <code>.f<\/code> та <code>.d<\/code> кидають виняток, коли шляху немає.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>rmdir<\/code> вилучає каталог, але лише <strong>порожній<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо каталог іще щось містить, <code>rmdir<\/code> нічого не вилучає й лишає його на місці.<\/span> <span class=\"sg\" data-s=\"1\">Тож, щоб видалити каталог із файлами, ви спершу спорожнюєте його, а потім вилучаєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # видалити кожен запис\nrmdir 'reports';                # тепер каталог порожній\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> перелічує записи каталогу (попередня тема це охоплювала), а виклик <code>.unlink<\/code> для кожного з них їх вилучає.<\/span> <span class=\"sg\" data-s=\"1\">Щойно каталог спорожнів, <code>rmdir<\/code> може його прибрати. (Цей плаский цикл припускає, що каталог містить лише файли; дерево з вкладеними підкаталогами потребувало б спершу рекурсивно зайти в них.)<\/span><\/p>"]]},"bg":{"t":"Изтриване на файлове и директории","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Точно както <code>spurt<\/code> и <code>mkdir<\/code> създават неща на диска, две процедури ги премахват.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>unlink<\/code> изтрива файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> изтрива посочения файл.<\/span> <span class=\"sg\" data-s=\"1\">Както и другите процедури за файловата система, той има и форма на метод върху обект-път — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изтриването е незабавно и окончателно: няма кошче, от което да се възстанови.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че след като файлът го няма, трябва да проверявате за него с <code>.e<\/code> (съществуване), а не с <code>.f<\/code>, защото проверките за тип <code>.f<\/code> и <code>.d<\/code> хвърлят грешка, когато пътят не е налице.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>rmdir<\/code> премахва директория, но само <strong>празна<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако директорията още съдържа нещо, <code>rmdir<\/code> не премахва нищо и я оставя на място.<\/span> <span class=\"sg\" data-s=\"1\">Затова, за да изтриете директория, която съдържа файлове, първо я изпразвате и после я премахвате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # изтриваме всеки елемент\nrmdir 'reports';                # сега директорията е празна\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> изброява елементите на директорията (предишната тема го разгледа), а извикването на <code>.unlink<\/code> върху всеки от тях ги премахва.<\/span> <span class=\"sg\" data-s=\"1\">Щом директорията е празна, <code>rmdir<\/code> може да я отнесе. (Този плосък цикъл предполага, че директорията съдържа само файлове; дърво с вложени поддиректории би изисквало първо да се влезе рекурсивно в тях.)<\/span><\/p>"]]},"eo":{"t":"Forigi dosierojn kaj dosierujojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Same kiel <code>spurt<\/code> kaj <code>mkdir<\/code> kreas aferojn sur disko, du rutinoj forigas ilin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>unlink<\/code> forigas dosieron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> forigas la nomitan dosieron.<\/span> <span class=\"sg\" data-s=\"1\">Kiel la aliaj dosiersistemaj rutinoj, ĝi ankaŭ havas metodan formon sur vojobjekto — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Forigo estas tuja kaj konstanta: ne estas rubujo, el kiu restaŭri.<\/span> <span class=\"sg\" data-s=\"1\">Notu, ke post kiam dosiero malaperis, vi devas testi ĝin per <code>.e<\/code> (ekzisto) anstataŭ <code>.f<\/code>, ĉar la tipaj testoj <code>.f<\/code> kaj <code>.d<\/code> ĵetas, kiam la vojo ne estas tie.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>rmdir<\/code> forigas dosierujon, sed nur <strong>malplenan<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la dosierujo ankoraŭ enhavas ion, <code>rmdir<\/code> forigas nenion kaj lasas ĝin surloke.<\/span> <span class=\"sg\" data-s=\"1\">Do por forigi dosierujon, kiu tenas dosierojn, vi unue malplenigas ĝin kaj poste forigas ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # forigu ĉiun eron\nrmdir 'reports';                # nun la dosierujo estas malplena\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> listigas la erojn de la dosierujo (la antaŭa temo traktis ĝin), kaj voki <code>.unlink<\/code> sur ĉiu forigas ilin.<\/span> <span class=\"sg\" data-s=\"1\">Post kiam la dosierujo estas malplena, <code>rmdir<\/code> povas forpreni ĝin. (Ĉi tiu plata buklo supozas, ke la dosierujo tenas nur dosierojn; arbo kun nestitaj subdosierujoj bezonus unue recursi en ilin.)<\/span><\/p>"]]},"la":{"t":"Plicas et directoria delere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sicut <code>spurt<\/code> et <code>mkdir<\/code> res in disco creant, duae procedurae eas removent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>unlink<\/code> archivum delet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> archivum nominatum delet.<\/span> <span class=\"sg\" data-s=\"1\">Sicut ceterae procedurae systematis archivorum, etiam formam methodi in obiecto semitae habet — <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deletio statim et perpetuo fit: nullum quisquiliarium est unde recuperes.<\/span> <span class=\"sg\" data-s=\"1\">Nota post archivum ablatum illud per <code>.e<\/code> (exsistentiam) potius quam per <code>.f<\/code> probandum esse, quia probationes generis <code>.f<\/code> et <code>.d<\/code> iaciunt cum semita non adest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>rmdir<\/code> directoriam removet, sed solum <strong>vacuam<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si directoria adhuc aliquid continet, <code>rmdir<\/code> nihil removet et eam in loco relinquit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque ut directoriam quae archiva tenet deleas, eam primum vacuas et deinde removes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # omnem ingressum dele\nrmdir 'reports';                # nunc directoria vacua est\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> ingressus directoriae enumerat (argumentum superius id tractavit), et <code>.unlink<\/code> in unoquoque vocans eos removet.<\/span> <span class=\"sg\" data-s=\"1\">Cum directoria vacua est, <code>rmdir<\/code> eam auferre potest. (Hic anulus planus supponit directoriam sola archiva tenere; arbor cum directoriis nidificatis prius in eas recurrere deberet.)<\/span><\/p>"]]}}}</script>
