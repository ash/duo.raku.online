<script type="application/json" id="page-data">{"u":"oop/class-methods","n":802,"k":"section","pv":"oop/methods/exercises/temperature/solution","nx":"oop/class-methods/exercises","tr":["oop"],"L":{"en":{"t":"Class methods","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Most methods are called on an object — an instance of a class.<\/span> <span class=\"sg\" data-s=\"1\">But a method can also be called on the class itself, that is, on the type object.<\/span> <span class=\"sg\" data-s=\"2\">Such a method is often called a <em>class method<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">It is useful for values and operations that belong to the class as a whole, rather than to one particular object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You define a class method exactly like any other method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">and call it on the class name instead of on an instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You have already been using a class method without naming it: <code>new<\/code> is a method called on the class to create a new object.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A class method has no access to instance attributes — there is no particular object behind it — so it works only with information that is the same for every object of the class.<\/span> <span class=\"sg\" data-s=\"1\">When the work depends on a specific object’s data, use an ordinary method called on an instance; when it does not, a class method is a natural fit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Note that while class methods do not need an instance, it is still possible to use object’s data in them when you do have an object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints the expected result:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without the instantiated class object, a call like <code>say Road.info<\/code> would produce an error.<\/span><\/p>"]]},"de":{"t":"Klassenmethoden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Die meisten Methoden werden auf einem Objekt aufgerufen — einer Instanz einer Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Eine Methode kann aber auch auf der Klasse selbst aufgerufen werden, also auf dem Typobjekt.<\/span> <span class=\"sg\" data-s=\"2\">Eine solche Methode nennt man häufig eine <em>Klassenmethode<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sie ist nützlich für Werte und Operationen, die zur Klasse als Ganzem gehören und nicht zu einem bestimmten Objekt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie definieren eine Klassenmethode genau wie jede andere Methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">und rufen sie auf dem Klassennamen statt auf einer Instanz auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine Klassenmethode haben Sie bereits verwendet, ohne sie so zu nennen: <code>new<\/code> ist eine Methode, die auf der Klasse aufgerufen wird, um ein neues Objekt zu erzeugen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Klassenmethode hat keinen Zugriff auf Instanzattribute — es steht kein bestimmtes Objekt dahinter —, sie arbeitet also nur mit Informationen, die für jedes Objekt der Klasse gleich sind.<\/span> <span class=\"sg\" data-s=\"1\">Hängt die Arbeit von den Daten eines bestimmten Objekts ab, nehmen Sie eine gewöhnliche Methode, die auf einer Instanz aufgerufen wird; andernfalls passt eine Klassenmethode natürlich.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Klassenmethoden zwar keine Instanz brauchen, aber trotzdem die Daten eines Objekts verwenden können, wenn Sie eines haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt das erwartete Ergebnis aus:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne das instanziierte Klassenobjekt würde ein Aufruf wie <code>say Road.info<\/code> einen Fehler erzeugen.<\/span><\/p>"]]},"nl":{"t":"Klassemethoden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De meeste methoden worden aangeroepen op een object — een instantie van een klasse.<\/span> <span class=\"sg\" data-s=\"1\">Maar een methode kan ook op de klasse zelf aangeroepen worden, dat wil zeggen op het typeobject.<\/span> <span class=\"sg\" data-s=\"2\">Zo'n methode wordt vaak een <em>klassemethode<\/em> genoemd.<\/span> <span class=\"sg\" data-s=\"3\">Ze is nuttig voor waarden en bewerkingen die bij de klasse als geheel horen in plaats van bij één bepaald object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je definieert een klassemethode precies als elke andere methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">en roept haar aan op de naam van de klasse in plaats van op een instantie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je gebruikte al een klassemethode zonder haar zo te noemen: <code>new<\/code> is een methode die op de klasse wordt aangeroepen om een nieuw object te maken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een klassemethode heeft geen toegang tot de attributen van een instantie — er zit geen bepaald object achter — dus ze werkt alleen met informatie die voor elk object van de klasse gelijk is.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer het werk van de gegevens van een specifiek object afhangt, gebruik je een gewone methode die op een instantie wordt aangeroepen; wanneer dat niet zo is, past een klassemethode van nature.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat klassemethoden weliswaar geen instantie nodig hebben, maar dat je er nog steeds de gegevens van een object in kunt gebruiken als je wél een object hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma drukt het verwachte resultaat af:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder het geïnstantieerde klasseobject zou een aanroep als <code>say Road.info<\/code> een fout opleveren.<\/span><\/p>"]]},"es":{"t":"Métodos de clase","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La mayoría de los métodos se llaman sobre un objeto, es decir, sobre una instancia de una clase.<\/span> <span class=\"sg\" data-s=\"1\">Pero un método también puede llamarse sobre la clase misma, esto es, sobre el objeto de tipo.<\/span> <span class=\"sg\" data-s=\"2\">A un método así se le suele llamar <em>método de clase<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Es útil para valores y operaciones que pertenecen a la clase en conjunto, y no a un objeto concreto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un método de clase se define exactamente igual que cualquier otro método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">y se llama sobre el nombre de la clase en lugar de sobre una instancia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ya has estado usando un método de clase sin nombrarlo: <code>new<\/code> es un método que se llama sobre la clase para crear un objeto nuevo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un método de clase no tiene acceso a los atributos de instancia — no hay ningún objeto concreto detrás —, así que solo trabaja con información que es igual para todos los objetos de la clase.<\/span> <span class=\"sg\" data-s=\"1\">Cuando el trabajo depende de los datos de un objeto concreto, usa un método ordinario llamado sobre una instancia; cuando no, un método de clase encaja de forma natural.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que, aunque los métodos de clase no necesitan una instancia, sí pueden usar los datos del objeto cuando sí tienes uno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime el resultado esperado:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin el objeto instanciado de la clase, una llamada como <code>say Road.info<\/code> daría un error.<\/span><\/p>"]]},"it":{"t":"Metodi di classe","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La maggior parte dei metodi viene chiamata su un oggetto — un'istanza di una classe.<\/span> <span class=\"sg\" data-s=\"1\">Ma un metodo può essere chiamato anche sulla classe stessa, cioè sull'oggetto di tipo.<\/span> <span class=\"sg\" data-s=\"2\">Un metodo così si chiama spesso <em>metodo di classe<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">È utile per valori e operazioni che appartengono alla classe nel suo insieme, invece che a un oggetto particolare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un metodo di classe si definisce esattamente come qualunque altro metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">e si chiama sul nome della classe invece che su un'istanza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un metodo di classe lo hai già usato senza chiamarlo per nome: <code>new<\/code> è un metodo chiamato sulla classe per creare un nuovo oggetto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metodo di classe non ha accesso agli attributi di istanza — dietro di esso non c'è alcun oggetto particolare — quindi lavora solo con informazioni uguali per ogni oggetto della classe.<\/span> <span class=\"sg\" data-s=\"1\">Quando il lavoro dipende dai dati di un oggetto preciso, usa un metodo ordinario chiamato su un'istanza; quando non dipende, un metodo di classe calza a pennello.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che, pur non avendo bisogno di un'istanza, i metodi di classe possono comunque usare i dati dell'oggetto quando un oggetto ce l'hai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa il risultato atteso:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza l'oggetto istanziato della classe, una chiamata come <code>say Road.info<\/code> darebbe un errore.<\/span><\/p>"]]},"lv":{"t":"Klases metodes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vairums metožu tiek izsauktas uz objekta — klases instances.<\/span> <span class=\"sg\" data-s=\"1\">Taču metodi var izsaukt arī uz pašas klases, tas ir, uz tipa objekta.<\/span> <span class=\"sg\" data-s=\"2\">Tādu metodi bieži sauc par <em>klases metodi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tā noder vērtībām un darbībām, kas pieder klasei kopumā, nevis kādam vienam konkrētam objektam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klases metodi definējat tieši tāpat kā jebkuru citu metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">un izsaucat uz klases nosaukuma, nevis uz instances:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat lietojuši klases metodi, to nenosaucot: <code>new<\/code> ir metode, ko izsauc uz klases, lai radītu jaunu objektu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klases metodei nav piekļuves instances atribūtiem — aiz tās nav neviena konkrēta objekta —, tāpēc tā strādā tikai ar informāciju, kas ir vienāda katram klases objektam.<\/span> <span class=\"sg\" data-s=\"1\">Kad darbs ir atkarīgs no konkrēta objekta datiem, izmantojiet parastu metodi, kas izsaukta uz instances; kad nav — klases metode iederas dabiski.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka, lai gan klases metodēm instance nav vajadzīga, tajās joprojām var izmantot objekta datus, ja objekts jums ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā gaidīto rezultātu:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez instantiēta klases objekta izsaukums, piemēram, <code>say Road.info<\/code>, radītu kļūdu.<\/span><\/p>"]]},"ru":{"t":"Методы класса","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Большинство методов вызываются у объекта — экземпляра класса.<\/span> <span class=\"sg\" data-s=\"1\">Но метод можно вызвать и у самого класса, то есть у объекта типа.<\/span> <span class=\"sg\" data-s=\"2\">Такой метод часто называют <em>методом класса<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Он полезен для значений и операций, которые принадлежат классу в целом, а не какому-то одному объекту.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод класса определяется точно так же, как любой другой метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">и вызывается у имени класса, а не у экземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Одним методом класса вы уже пользовались, не называя его так: <code>new<\/code> — это метод, вызываемый у класса для создания нового объекта.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У метода класса нет доступа к атрибутам экземпляра — за ним не стоит какой-то конкретный объект, — поэтому он работает только с той информацией, которая одинакова для всех объектов класса.<\/span> <span class=\"sg\" data-s=\"1\">Когда работа зависит от данных конкретного объекта, используйте обычный метод, вызываемый у экземпляра; когда не зависит — метод класса подходит естественным образом.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что хотя методам класса экземпляр не нужен, использовать данные объекта в них всё же можно — если объект у вас есть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает ожидаемый результат:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без созданного объекта класса вызов вроде <code>say Road.info<\/code> привёл бы к ошибке.<\/span><\/p>"]]},"uk":{"t":"Методи класу","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Більшість методів викликають для об'єкта — екземпляра класу.<\/span> <span class=\"sg\" data-s=\"1\">Але метод можна викликати й для самого класу, тобто для об'єкта типу.<\/span> <span class=\"sg\" data-s=\"2\">Такий метод часто називають <em>методом класу<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Він корисний для значень та операцій, що належать класу як цілому, а не одному конкретному об'єктові.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод класу визначають точнісінько так, як будь-який інший метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">і викликають для імені класу замість екземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Одним методом класу ви вже користувалися, не називаючи його: <code>new<\/code> — це метод, який викликають для класу, щоб створити новий об'єкт.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод класу не має доступу до атрибутів екземпляра — за ним немає конкретного об'єкта, — тож він працює лише з відомостями, однаковими для кожного об'єкта класу.<\/span> <span class=\"sg\" data-s=\"1\">Коли робота залежить від даних конкретного об'єкта, беріть звичайний метод, викликаний для екземпляра; коли ні, метод класу пасує природно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу: хоча методам класу екземпляр не потрібен, у них усе одно можна використати дані об'єкта, коли об'єкт таки є:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить очікуваний результат:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без створеного об'єкта класу виклик на кшталт <code>say Road.info<\/code> спричинив би помилку.<\/span><\/p>"]]},"bg":{"t":"Методи на класа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Повечето методи се извикват върху обект — екземпляр на клас.<\/span> <span class=\"sg\" data-s=\"1\">Но методът може да бъде извикан и върху самия клас, тоест върху обекта на типа.<\/span> <span class=\"sg\" data-s=\"2\">Такъв метод често се нарича <em>метод на класа<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Той е полезен за стойности и операции, които принадлежат на класа като цяло, а не на един конкретен обект.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирате метод на класа точно както всеки друг метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">и го извиквате върху името на класа вместо върху екземпляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вие вече използвахте метод на класа, без да го наричате така: <code>new<\/code> е метод, извикван върху класа, за да създаде нов обект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът на класа няма достъп до атрибутите на екземпляра — зад него не стои конкретен обект, — така че работи само с информация, която е една и съща за всеки обект от класа.<\/span> <span class=\"sg\" data-s=\"1\">Когато работата зависи от данните на конкретен обект, използвайте обикновен метод, извикан върху екземпляр; когато не зависи, методът на класа приляга естествено.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че макар методите на класа да не се нуждаят от екземпляр, в тях все пак може да се използват данни на обекта, когато обект е налице:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва очаквания резултат:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без създаден обект от класа извикване като <code>say Road.info<\/code> би довело до грешка.<\/span><\/p>"]]}}}</script>
