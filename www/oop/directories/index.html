<script type="application/json" id="page-data">{"u":"oop/directories","n":877,"k":"section","pv":"oop/files/exercises/count-characters/solution","nx":"oop/directories/listing","tr":["oop"],"L":{"en":{"t":"Working with directories","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To work with the file system itself — checking what exists and creating directories — Raku uses <em>path objects<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Any string can be turned into one with the <code>.IO<\/code> method, and the path object then answers questions about that path.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The most common questions are whether a path exists, and what kind of thing it is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> tests existence, <code>.f<\/code> tests for a regular file, and <code>.d<\/code> tests for a directory.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To create a new directory, use <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The next topic shows how to list what a directory contains.<\/span><\/p>"]]},"de":{"t":"Mit Verzeichnissen arbeiten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um mit dem Dateisystem selbst zu arbeiten — zu prüfen, was es gibt, und Verzeichnisse anzulegen —, verwendet Raku <em>Pfadobjekte<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jede Zeichenkette lässt sich mit der Methode <code>.IO<\/code> in eines verwandeln, und das Pfadobjekt beantwortet dann Fragen zu diesem Pfad.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die häufigsten Fragen sind, ob ein Pfad existiert und um was für ein Ding es sich handelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> prüft die Existenz, <code>.f<\/code> prüft auf eine gewöhnliche Datei und <code>.d<\/code> auf ein Verzeichnis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um ein neues Verzeichnis anzulegen, verwenden Sie <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das nächste Thema zeigt, wie man auflistet, was ein Verzeichnis enthält.<\/span><\/p>"]]},"nl":{"t":"Met mappen werken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om met het bestandssysteem zelf te werken — nagaan wat er bestaat en mappen aanmaken — gebruikt Raku <em>padobjecten<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Elke string kan er met de methode <code>.IO<\/code> in omgezet worden, en het padobject beantwoordt dan vragen over dat pad.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De meest voorkomende vragen zijn of een pad bestaat en wat voor ding het is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> test op bestaan, <code>.f<\/code> test op een gewoon bestand, en <code>.d<\/code> test op een map.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een nieuwe map aan te maken gebruik je <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het volgende onderwerp laat zien hoe je opsomt wat een map bevat.<\/span><\/p>"]]},"es":{"t":"Trabajar con directorios","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para trabajar con el propio sistema de archivos — comprobar qué existe y crear directorios — Raku usa <em>objetos de ruta<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Cualquier cadena se puede convertir en uno con el método <code>.IO<\/code>, y el objeto de ruta responde entonces a las preguntas sobre esa ruta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las preguntas más comunes son si una ruta existe y qué clase de cosa es:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> comprueba la existencia, <code>.f<\/code> comprueba si es un archivo regular y <code>.d<\/code> si es un directorio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para crear un directorio nuevo, usa <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El tema siguiente muestra cómo listar lo que contiene un directorio.<\/span><\/p>"]]},"it":{"t":"Lavorare con le directory","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per lavorare con il file system in sé — controllare che cosa esiste e creare directory — Raku usa gli <em>oggetti percorso<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Qualunque stringa può essere trasformata in uno di essi con il metodo <code>.IO<\/code>, e l'oggetto percorso risponde poi alle domande su quel percorso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le domande più comuni sono se un percorso esista e che genere di cosa sia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> verifica l'esistenza, <code>.f<\/code> verifica se si tratta di un file regolare e <code>.d<\/code> se si tratta di una directory.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per creare una nuova directory, usa <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'argomento successivo mostra come elencare il contenuto di una directory.<\/span><\/p>"]]},"lv":{"t":"Darbs ar direktorijām","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai strādātu ar pašu failu sistēmu — pārbaudītu, kas eksistē, un veidotu direktorijas —, Raku izmanto <em>ceļa objektus<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jebkuru virkni par tādu var pārvērst ar metodi <code>.IO<\/code>, un ceļa objekts tad atbild uz jautājumiem par šo ceļu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Biežākie jautājumi ir, vai ceļš eksistē un kāda veida lieta tā ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> pārbauda esamību, <code>.f<\/code> pārbauda, vai tas ir parasts fails, un <code>.d<\/code> pārbauda, vai tā ir direktorija.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai izveidotu jaunu direktoriju, izmantojiet <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamais temats parāda, kā uzskaitīt to, kas direktorijā ir.<\/span><\/p>"]]},"ru":{"t":"Работа с каталогами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Для работы с самой файловой системой — проверки того, что существует, и создания каталогов — Raku использует <em>объекты пути<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Любую строку можно превратить в такой объект методом <code>.IO<\/code>, и объект пути затем отвечает на вопросы об этом пути.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чаще всего спрашивают, существует ли путь и что именно по нему находится:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — существует ли?\nsay 'greeting.txt'.IO.f; # True  — это файл?\nsay 'greeting.txt'.IO.d; # False — это каталог?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> проверяет существование, <code>.f<\/code> — обычный ли это файл, а <code>.d<\/code> — каталог ли это.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать новый каталог, используйте <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующая тема показывает, как узнать, что содержится в каталоге.<\/span><\/p>"]]},"uk":{"t":"Робота з каталогами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб працювати із самою файловою системою — перевіряти, що існує, і створювати каталоги, — Raku використовує <em>об'єкти шляху<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Будь-який рядок можна перетворити на такий об'єкт методом <code>.IO<\/code>, і тоді об'єкт шляху відповідає на запитання про цей шлях.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпоширеніші запитання — чи існує шлях і що це за річ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — чи існує?\nsay 'greeting.txt'.IO.f; # True  — чи це файл?\nsay 'greeting.txt'.IO.d; # False — чи це каталог?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> перевіряє існування, <code>.f<\/code> — чи це звичайний файл, а <code>.d<\/code> — чи це каталог.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб створити новий каталог, скористайтеся <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступна тема показує, як перелічити те, що каталог містить.<\/span><\/p>"]]},"bg":{"t":"Работа с директории","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да работите със самата файлова система — да проверявате какво съществува и да създавате директории, — Raku използва <em>обекти-пътища<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Всеки низ може да бъде превърнат в такъв с метода <code>.IO<\/code>, а обектът-път след това отговаря на въпроси за този път.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-честите въпроси са дали пътят съществува и какво представлява:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — съществува ли?\nsay 'greeting.txt'.IO.f; # True  — файл ли е?\nsay 'greeting.txt'.IO.d; # False — директория ли е?<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> проверява съществуването, <code>.f<\/code> проверява за обикновен файл, а <code>.d<\/code> — за директория.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да създадете нова директория, използвайте <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващата тема показва как да изброите какво съдържа дадена директория.<\/span><\/p>"]]}}}</script>
