<script type="application/json" id="page-data">{"u":"oop/directories/listing","n":878,"k":"topic","pv":"oop/directories","nx":"oop/directories/listing/quiz","tr":["oop","oop/directories"],"L":{"en":{"t":"Listing a directory","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>dir<\/code> routine returns the entries of a directory — each as a path object.<\/span> <span class=\"sg\" data-s=\"1\">Their order is not fixed, so it is common to sort the result for predictable output.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints the names of the files in the <code>box<\/code> directory, in order:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each entry is a full path object; the <code>basename<\/code> method gives just the final name, without the directory part.<\/span> <span class=\"sg\" data-s=\"1\">From a path object you can ask all the same questions as before — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> — so you can, for instance, walk through a directory and pick out only the files.<\/span><\/p>"]]},"de":{"t":"Ein Verzeichnis auflisten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>dir<\/code> liefert die Einträge eines Verzeichnisses — jeden als Pfadobjekt.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Reihenfolge liegt nicht fest, daher ist es üblich, das Ergebnis für eine vorhersagbare Ausgabe zu sortieren.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt die Namen der Dateien im Verzeichnis <code>box<\/code> der Reihe nach aus:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Eintrag ist ein vollständiges Pfadobjekt; die Methode <code>basename<\/code> liefert nur den letzten Namen, ohne den Verzeichnisteil.<\/span> <span class=\"sg\" data-s=\"1\">Einem Pfadobjekt können Sie dieselben Fragen wie zuvor stellen — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> —, Sie können also etwa ein Verzeichnis durchgehen und nur die Dateien herausgreifen.<\/span><\/p>"]]},"nl":{"t":"Een map opsommen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De routine <code>dir<\/code> geeft de items van een map terug — elk als padobject.<\/span> <span class=\"sg\" data-s=\"1\">Hun volgorde ligt niet vast, dus het is gebruikelijk het resultaat te sorteren voor voorspelbare uitvoer.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt de namen van de bestanden in de map <code>box<\/code> op volgorde af:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk item is een volledig padobject; de methode <code>basename<\/code> geeft alleen de laatste naam, zonder het mapgedeelte.<\/span> <span class=\"sg\" data-s=\"1\">Aan een padobject kun je alle vragen van eerder stellen — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> — dus je kunt bijvoorbeeld door een map lopen en er alleen de bestanden uit vissen.<\/span><\/p>"]]},"es":{"t":"Listar un directorio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>dir<\/code> devuelve las entradas de un directorio, cada una como objeto de ruta.<\/span> <span class=\"sg\" data-s=\"1\">Su orden no está fijado, así que es habitual ordenar el resultado para obtener una salida predecible.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime los nombres de los archivos del directorio <code>box<\/code>, en orden:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada entrada es un objeto de ruta completo; el método <code>basename<\/code> da solo el nombre final, sin la parte del directorio.<\/span> <span class=\"sg\" data-s=\"1\">A un objeto de ruta puedes hacerle las mismas preguntas de antes — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> —, así que puedes, por ejemplo, recorrer un directorio y quedarte solo con los archivos.<\/span><\/p>"]]},"it":{"t":"Elencare una directory","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La routine <code>dir<\/code> restituisce le voci di una directory, ciascuna come oggetto percorso.<\/span> <span class=\"sg\" data-s=\"1\">Il loro ordine non è fissato, quindi è comune ordinare il risultato per avere un output prevedibile.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa i nomi dei file nella directory <code>box<\/code>, in ordine:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni voce è un oggetto percorso completo; il metodo <code>basename<\/code> dà solo il nome finale, senza la parte di directory.<\/span> <span class=\"sg\" data-s=\"1\">A un oggetto percorso puoi porre tutte le domande di prima — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> — così puoi, per esempio, percorrere una directory e selezionarne solo i file.<\/span><\/p>"]]},"lv":{"t":"Direktorijas satura uzskaitīšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>dir<\/code> atgriež direktorijas ierakstus — katru kā ceļa objektu.<\/span> <span class=\"sg\" data-s=\"1\">To secība nav noteikta, tāpēc paredzamas izvades dēļ rezultātu mēdz sakārtot.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas secībā izdrukā direktorijā <code>box<\/code> esošo failu nosaukumus:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs ieraksts ir pilns ceļa objekts; metode <code>basename<\/code> dod tikai pēdējo nosaukumu, bez direktorijas daļas.<\/span> <span class=\"sg\" data-s=\"1\">Ceļa objektam var uzdot visus tos pašus jautājumus, ko iepriekš — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> —, tāpēc varat, piemēram, iziet cauri direktorijai un atlasīt tikai failus.<\/span><\/p>"]]},"ru":{"t":"Просмотр содержимого каталога","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>dir<\/code> возвращает записи каталога — каждую в виде объекта пути.<\/span> <span class=\"sg\" data-s=\"1\">Их порядок не фиксирован, поэтому результат обычно сортируют, чтобы вывод был предсказуемым.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает имена файлов в каталоге <code>box<\/code> по порядку:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая запись — это полноценный объект пути; метод <code>basename<\/code> даёт только последнее имя, без части с каталогом.<\/span> <span class=\"sg\" data-s=\"1\">У объекта пути можно спросить всё то же, что и раньше — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>, — так что можно, например, пройти по каталогу и отобрать только файлы.<\/span><\/p>"]]},"uk":{"t":"Перелік вмісту каталогу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>dir<\/code> повертає записи каталогу — кожен як об'єкт шляху.<\/span> <span class=\"sg\" data-s=\"1\">Їхній порядок не є сталим, тож результат зазвичай сортують заради передбачуваного виводу.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це виводить імена файлів у каталозі <code>box<\/code> по порядку:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен запис є повним об'єктом шляху; метод <code>basename<\/code> дає лише кінцеве ім'я, без частини з каталогом.<\/span> <span class=\"sg\" data-s=\"1\">Об'єктові шляху можна ставити всі ті самі запитання, що й раніше — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>, — тож ви можете, наприклад, пройти каталогом і відібрати самі лише файли.<\/span><\/p>"]]},"bg":{"t":"Изброяване на директория","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>dir<\/code> връща елементите на директория — всеки като обект-път.<\/span> <span class=\"sg\" data-s=\"1\">Редът им не е фиксиран, така че често се сортира резултатът заради предвидим изход.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва имената на файловете в директорията <code>box<\/code>, по ред:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент е пълен обект-път; методът <code>basename<\/code> дава само крайното име, без частта с директорията.<\/span> <span class=\"sg\" data-s=\"1\">От обект-път можете да зададете всички същите въпроси както преди — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>, — така че можете например да обходите директория и да отделите само файловете.<\/span><\/p>"]]},"eo":{"t":"Listigi dosierujon","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>dir<\/code> redonas la erojn de dosierujo — ĉiun kiel vojobjekton.<\/span> <span class=\"sg\" data-s=\"1\">Ilia ordo ne estas fiksita, do estas ofte ordigi la rezulton por antaŭvidebla eligo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio presas la nomojn de la dosieroj en la dosierujo <code>box<\/code>, laŭorde:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ero estas plena vojobjekto; la metodo <code>basename<\/code> donas nur la finan nomon, sen la dosieruja parto.<\/span> <span class=\"sg\" data-s=\"1\">El vojobjekto vi povas fari ĉiujn samajn demandojn kiel antaŭe — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> — do vi povas, ekzemple, trairi dosierujon kaj elekti nur la dosierojn.<\/span><\/p>"]]},"la":{"t":"Directorium enumerare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>dir<\/code> ingressus directoriae reddit — unumquemque ut obiectum semitae.<\/span> <span class=\"sg\" data-s=\"1\">Ordo eorum non est fixus, itaque solet effectus ordinari ut exitus praedici possit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc nomina archivorum in directoria <code>box<\/code> ordine imprimit:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unusquisque ingressus plenum obiectum semitae est; methodus <code>basename<\/code> solum nomen ultimum dat, sine parte directoriae.<\/span> <span class=\"sg\" data-s=\"1\">Ex obiecto semitae easdem quaestiones ac prius petere potes — <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code> — itaque potes, exempli gratia, per directoriam ambulare et sola archiva eligere.<\/span><\/p>"]]}}}</script>
