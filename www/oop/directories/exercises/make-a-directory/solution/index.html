ory<\/code>. Direktorijas izveidošana vispirms — kā to šeit dara <code>mkdir<\/code> — ir tas, kas ļauj ierakstam izdoties. Ērti, ka <code>mkdir<\/code> izveido arī visas trūkstošās starpdirektorijas, tāpēc ligzdots ceļš, piemēram, <code>mkdir 'reports/2026'<\/code>, vienā izsaukumā uzbūvē visu ķēdi.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Создайте каталог","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/data.txt', 'x';\n\nsay 'reports'.IO.d;\nsay 'reports/data.txt'.IO.e;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/directories/make-a-directory.raku\" target=\"_blank\" rel=\"noopener\">make-a-directory.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> создаёт каталог, а <code>.IO.d<\/code> подтверждает, что <code>reports<\/code> — это каталог.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поскольку каталог теперь существует, в него можно записать файл, указав путь, включающий имя каталога, — <code>reports/data.txt<\/code>. Проверка <code>.e<\/code> для этого пути подтверждает, что файл создан внутри нового каталога.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок здесь важен: <code>spurt<\/code> <strong>не<\/strong> создаёт недостающие каталоги за вас. Запись в <code>reports/data.txt<\/code> до того, как появился каталог <code>reports<\/code>, завершится ошибкой вроде <code>Failed to open file … : No such file or directory<\/code>. Именно предварительное с
