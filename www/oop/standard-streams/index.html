<script type="application/json" id="page-data">{"u":"oop/standard-streams","n":858,"k":"section","pv":"oop/mop/exercises/add-a-method/solution","nx":"oop/standard-streams/exercises","tr":["oop"],"L":{"en":{"t":"Standard streams","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every program has three <em>standard streams<\/em> connecting it to its environment: standard output, standard error, and standard input.<\/span> <span class=\"sg\" data-s=\"1\">Raku makes them available through three special variables: <code>$*OUT<\/code>, <code>$*ERR<\/code>, and <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You have been writing to standard output all along: <code>say<\/code> and <code>print<\/code> send their text to <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diagnostic and error messages are kept separate, on standard error, so they do not get mixed into the program’s real output.<\/span> <span class=\"sg\" data-s=\"1\">The <code>note<\/code> routine writes there:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This separation is useful because the two streams can be redirected independently — for example, you can save a program’s output to a file while still seeing its error messages on screen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also write to the streams directly.<\/span> <span class=\"sg\" data-s=\"1\">Each of <code>$*OUT<\/code> and <code>$*ERR<\/code> is a <em>handle<\/em> with its own <code>say<\/code> and <code>print<\/code> methods:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The third stream, <code>$*IN<\/code>, is standard input.<\/span> <span class=\"sg\" data-s=\"1\">You met it indirectly through <code>prompt<\/code>, which reads a line from it.<\/span> <span class=\"sg\" data-s=\"2\">We return to reading input when we look at <a href=\"/oop/file-handles/\">file handles<\/a>, because <code>$*IN<\/code> is a handle just like an open file.<\/span><\/p>"]]},"de":{"t":"Standardströme","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Programm hat drei <em>Standardströme<\/em>, die es mit seiner Umgebung verbinden: die Standardausgabe, die Standardfehlerausgabe und die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"1\">Raku stellt sie über drei besondere Variablen bereit: <code>$*OUT<\/code>, <code>$*ERR<\/code> und <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auf die Standardausgabe haben Sie die ganze Zeit geschrieben: <code>say<\/code> und <code>print<\/code> schicken ihren Text an <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diagnose- und Fehlermeldungen bleiben davon getrennt, auf der Standardfehlerausgabe, damit sie sich nicht unter die eigentliche Ausgabe des Programms mischen.<\/span> <span class=\"sg\" data-s=\"1\">Die Routine <code>note<\/code> schreibt dorthin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diese Trennung ist nützlich, weil sich die beiden Ströme unabhängig umleiten lassen — Sie können etwa die Ausgabe eines Programms in eine Datei sichern und seine Fehlermeldungen trotzdem am Bildschirm sehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können auch direkt in die Ströme schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Sowohl <code>$*OUT<\/code> als auch <code>$*ERR<\/code> ist ein <em>Handle<\/em> mit eigenen Methoden <code>say<\/code> und <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der dritte Strom, <code>$*IN<\/code>, ist die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"1\">Ihm sind Sie mittelbar über <code>prompt<\/code> begegnet, das eine Zeile daraus liest.<\/span> <span class=\"sg\" data-s=\"2\">Auf das Lesen von Eingaben kommen wir bei den <a href=\"https://course.raku.org/de/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">Dateihandles<\/a> zurück, denn <code>$*IN<\/code> ist genauso ein Handle wie eine geöffnete Datei.<\/span><\/p>"]]},"nl":{"t":"Standaardstromen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk programma heeft drie <em>standaardstromen<\/em> die het met zijn omgeving verbinden: standaarduitvoer, standaardfout en standaardinvoer.<\/span> <span class=\"sg\" data-s=\"1\">Raku stelt ze beschikbaar via drie bijzondere variabelen: <code>$*OUT<\/code>, <code>$*ERR<\/code> en <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je hebt de hele tijd al naar de standaarduitvoer geschreven: <code>say<\/code> en <code>print<\/code> sturen hun tekst naar <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diagnostische meldingen en foutmeldingen worden apart gehouden, op de standaardfout, zodat ze niet door de echte uitvoer van het programma gemengd raken.<\/span> <span class=\"sg\" data-s=\"1\">De routine <code>note<\/code> schrijft daarheen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze scheiding is nuttig omdat de twee stromen onafhankelijk omgeleid kunnen worden — je kunt bijvoorbeeld de uitvoer van een programma naar een bestand opslaan en toch de foutmeldingen op het scherm zien.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook rechtstreeks naar de stromen schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Zowel <code>$*OUT<\/code> als <code>$*ERR<\/code> is een <em>handle<\/em> met eigen methoden <code>say<\/code> en <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De derde stroom, <code>$*IN<\/code>, is de standaardinvoer.<\/span> <span class=\"sg\" data-s=\"1\">Je kwam hem indirect tegen via <code>prompt<\/code>, dat er een regel uit leest.<\/span> <span class=\"sg\" data-s=\"2\">We komen op invoer lezen terug wanneer we naar <a href=\"https://course.raku.org/nl/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">bestandshandles<\/a> kijken, want <code>$*IN<\/code> is net zo goed een handle als een geopend bestand.<\/span><\/p>"]]},"es":{"t":"Flujos estándar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Todo programa tiene tres <em>flujos estándar<\/em> que lo conectan con su entorno: la salida estándar, el error estándar y la entrada estándar.<\/span> <span class=\"sg\" data-s=\"1\">Raku los pone a tu disposición mediante tres variables especiales: <code>$*OUT<\/code>, <code>$*ERR<\/code> y <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Llevas escribiendo en la salida estándar desde el principio: <code>say<\/code> y <code>print<\/code> mandan su texto a <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los mensajes de diagnóstico y de error se mantienen aparte, en el error estándar, para que no se mezclen con la salida real del programa.<\/span> <span class=\"sg\" data-s=\"1\">La rutina <code>note<\/code> escribe ahí:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta separación resulta útil porque los dos flujos se pueden redirigir por separado: puedes, por ejemplo, guardar la salida de un programa en un archivo y seguir viendo sus mensajes de error en la pantalla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes escribir directamente en los flujos.<\/span> <span class=\"sg\" data-s=\"1\">Tanto <code>$*OUT<\/code> como <code>$*ERR<\/code> son <em>manejadores<\/em> con sus propios métodos <code>say<\/code> y <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El tercer flujo, <code>$*IN<\/code>, es la entrada estándar.<\/span> <span class=\"sg\" data-s=\"1\">Lo conociste indirectamente a través de <code>prompt<\/code>, que lee una línea de él.<\/span> <span class=\"sg\" data-s=\"2\">Volveremos a la lectura de entrada cuando veamos los <a href=\"https://course.raku.org/es/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">manejadores de archivo<\/a>, porque <code>$*IN<\/code> es un manejador igual que un archivo abierto.<\/span><\/p>"]]},"it":{"t":"Flussi standard","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni programma ha tre <em>flussi standard<\/em> che lo collegano al suo ambiente: l'output standard, l'errore standard e l'input standard.<\/span> <span class=\"sg\" data-s=\"1\">Raku li rende disponibili attraverso tre variabili speciali: <code>$*OUT<\/code>, <code>$*ERR<\/code> e <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai scritto sull'output standard fin dall'inizio: <code>say<\/code> e <code>print<\/code> mandano il loro testo a <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I messaggi diagnostici e di errore restano separati, sull'errore standard, così non si mescolano con l'output vero del programma.<\/span> <span class=\"sg\" data-s=\"1\">La routine <code>note<\/code> scrive lì:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa separazione è utile perché i due flussi possono essere rediretti in modo indipendente: puoi per esempio salvare l'output di un programma in un file e continuare comunque a vedere i suoi messaggi di errore sullo schermo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche scrivere direttamente sui flussi.<\/span> <span class=\"sg\" data-s=\"1\">Sia <code>$*OUT<\/code> sia <code>$*ERR<\/code> sono <em>handle<\/em> con i propri metodi <code>say<\/code> e <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il terzo flusso, <code>$*IN<\/code>, è l'input standard.<\/span> <span class=\"sg\" data-s=\"1\">Lo hai incontrato indirettamente attraverso <code>prompt<\/code>, che ne legge una riga.<\/span> <span class=\"sg\" data-s=\"2\">Torneremo alla lettura dell'input quando guarderemo gli <a href=\"https://course.raku.org/it/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">handle di file<\/a>, perché <code>$*IN<\/code> è un handle proprio come un file aperto.<\/span><\/p>"]]},"lv":{"t":"Standarta plūsmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrai programmai ir trīs <em>standarta plūsmas<\/em>, kas to savieno ar vidi: standarta izvade, standarta kļūdas un standarta ievade.<\/span> <span class=\"sg\" data-s=\"1\">Raku tās padara pieejamas caur trim speciāliem mainīgajiem: <code>$*OUT<\/code>, <code>$*ERR<\/code> un <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Standarta izvadē jūs rakstāt jau visu laiku: <code>say<\/code> un <code>print<\/code> sūta savu tekstu uz <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diagnostikas un kļūdu paziņojumi tiek turēti atsevišķi, standarta kļūdu plūsmā, lai tie nesajauktos ar programmas īsto izvadi.<\/span> <span class=\"sg\" data-s=\"1\">Rutīna <code>note<\/code> raksta tur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī nošķiršana noder tāpēc, ka abas plūsmas var novirzīt neatkarīgi — piemēram, programmas izvadi var saglabāt failā, joprojām redzot tās kļūdu paziņojumus ekrānā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plūsmās var arī rakstīt tieši.<\/span> <span class=\"sg\" data-s=\"1\">Gan <code>$*OUT<\/code>, gan <code>$*ERR<\/code> ir <em>turis<\/em> ar savām metodēm <code>say<\/code> un <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Trešā plūsma <code>$*IN<\/code> ir standarta ievade.<\/span> <span class=\"sg\" data-s=\"1\">Ar to netieši sastapāties caur <code>prompt<\/code>, kas no tās nolasa rindu.<\/span> <span class=\"sg\" data-s=\"2\">Pie ievades lasīšanas atgriezīsimies, kad aplūkosim <a href=\"https://course.raku.org/lv/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">failu turus<\/a>, jo <code>$*IN<\/code> ir turis gluži tāpat kā atvērts fails.<\/span><\/p>"]]},"ru":{"t":"Стандартные потоки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У всякой программы есть три <em>стандартных потока<\/em>, связывающих её с окружением: стандартный вывод, стандартный поток ошибок и стандартный ввод.<\/span> <span class=\"sg\" data-s=\"1\">Raku делает их доступными через три специальные переменные: <code>$*OUT<\/code>, <code>$*ERR<\/code> и <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В стандартный вывод вы писали всё это время: <code>say<\/code> и <code>print<\/code> отправляют свой текст в <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # уходит в стандартный вывод<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Диагностические сообщения и сообщения об ошибках держат отдельно, в стандартном потоке ошибок, чтобы они не подмешивались к настоящему выводу программы.<\/span> <span class=\"sg\" data-s=\"1\">Туда пишет процедура <code>note<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # уходит в стандартный поток ошибок<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такое разделение полезно, потому что эти два потока можно перенаправлять независимо — например, сохранить вывод программы в файл, продолжая видеть сообщения об ошибках на экране.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Писать в потоки можно и напрямую.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$*OUT<\/code>, и <code>$*ERR<\/code> — это <em>дескрипторы<\/em> со своими методами <code>say<\/code> и <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Третий поток, <code>$*IN<\/code>, — это стандартный ввод.<\/span> <span class=\"sg\" data-s=\"1\">С ним вы косвенно встречались через <code>prompt<\/code>, который читает из него строку.<\/span> <span class=\"sg\" data-s=\"2\">К чтению ввода мы вернёмся, когда будем рассматривать <a href=\"https://course.raku.org/ru/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">файловые дескрипторы<\/a>, потому что <code>$*IN<\/code> — такой же дескриптор, как и открытый файл.<\/span><\/p>"]]},"uk":{"t":"Стандартні потоки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна програма має три <em>стандартні потоки<\/em>, що зв'язують її з оточенням: стандартний вивід, стандартний потік помилок і стандартне введення.<\/span> <span class=\"sg\" data-s=\"1\">Raku робить їх доступними через три спеціальні змінні: <code>$*OUT<\/code>, <code>$*ERR<\/code> та <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У стандартний вивід ви писали весь цей час: <code>say<\/code> і <code>print<\/code> надсилають свій текст до <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # іде в стандартний вивід<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Діагностичні повідомлення й повідомлення про помилки тримають окремо, у стандартному потоці помилок, щоб вони не змішувалися зі справжнім виводом програми.<\/span> <span class=\"sg\" data-s=\"1\">Туди пише підпрограма <code>note<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # іде в стандартний потік помилок<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це розділення корисне тим, що два потоки можна перенаправляти незалежно: наприклад, ви можете зберегти вивід програми у файл, і водночас бачити її повідомлення про помилки на екрані.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До потоків можна також писати напряму.<\/span> <span class=\"sg\" data-s=\"1\">І <code>$*OUT<\/code>, і <code>$*ERR<\/code> є <em>дескрипторами<\/em> з власними методами <code>say<\/code> та <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Третій потік, <code>$*IN<\/code>, — це стандартне введення.<\/span> <span class=\"sg\" data-s=\"1\">Ви стикалися з ним опосередковано через <code>prompt<\/code>, який читає з нього рядок.<\/span> <span class=\"sg\" data-s=\"2\">Ми повернемося до читання вводу, коли розглядатимемо <a href=\"https://course.raku.org/uk/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">дескриптори файлів<\/a>, бо <code>$*IN<\/code> є таким самим дескриптором, як і відкритий файл.<\/span><\/p>"]]},"bg":{"t":"Стандартни потоци","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка програма има три <em>стандартни потока<\/em>, които я свързват със средата ѝ: стандартен изход, стандартна грешка и стандартен вход.<\/span> <span class=\"sg\" data-s=\"1\">Raku ги предоставя чрез три специални променливи: <code>$*OUT<\/code>, <code>$*ERR<\/code> и <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вие пишете в стандартния изход през цялото време: <code>say<\/code> и <code>print<\/code> изпращат текста си в <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # отива в стандартния изход<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Диагностичните съобщения и съобщенията за грешки се държат отделно, в стандартната грешка, за да не се смесват с истинския изход на програмата.<\/span> <span class=\"sg\" data-s=\"1\">Процедурата <code>note<\/code> пише там:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # отива в стандартната грешка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това разделяне е полезно, защото двата потока могат да се пренасочват независимо — например можете да запишете изхода на програмата във файл, като същевременно виждате съобщенията ѝ за грешки на екрана.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете и да пишете направо в потоците.<\/span> <span class=\"sg\" data-s=\"1\">Всеки от <code>$*OUT<\/code> и <code>$*ERR<\/code> е <em>манипулатор<\/em> със свои собствени методи <code>say<\/code> и <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Третият поток, <code>$*IN<\/code>, е стандартният вход.<\/span> <span class=\"sg\" data-s=\"1\">Срещнахте го косвено чрез <code>prompt<\/code>, който чете ред от него.<\/span> <span class=\"sg\" data-s=\"2\">Ще се върнем към четенето на вход, когато разгледаме <a href=\"https://course.raku.org/bg/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">манипулаторите на файлове<\/a>, защото <code>$*IN<\/code> е манипулатор точно като отворен файл.<\/span><\/p>"]]},"eo":{"t":"Normaj fluoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu programo havas tri <em>normajn fluojn<\/em>, kiuj konektas ĝin al ĝia medio: norman eligon, norman erarfluon kaj norman enigon.<\/span> <span class=\"sg\" data-s=\"1\">Raku disponigas ilin per tri specialaj variabloj: <code>$*OUT<\/code>, <code>$*ERR<\/code> kaj <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi skribadis al norma eligo la tutan tempon: <code>say<\/code> kaj <code>print<\/code> sendas sian tekston al <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # iras al norma eligo<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diagnozaj kaj eraraj mesaĝoj estas tenataj aparte, sur norma erarfluo, por ke ili ne miksiĝu en la veran eligon de la programo.<\/span> <span class=\"sg\" data-s=\"1\">La rutino <code>note<\/code> skribas tien:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # iras al norma erarfluo<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu apartigo estas utila, ĉar la du fluoj povas esti redirektitaj sendepende — ekzemple, vi povas konservi la eligon de programo en dosieron dum vi ankoraŭ vidas ĝiajn erarmesaĝojn sur la ekrano.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas skribi al la fluoj rekte.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu el <code>$*OUT<\/code> kaj <code>$*ERR<\/code> estas <em>tenilo<\/em> kun siaj propraj metodoj <code>say<\/code> kaj <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La tria fluo, <code>$*IN<\/code>, estas norma enigo.<\/span> <span class=\"sg\" data-s=\"1\">Vi renkontis ĝin nerekte per <code>prompt<\/code>, kiu legas linion el ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ni revenos al legado de enigo, kiam ni rigardos <a href=\"https://course.raku.org/eo/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">dosiertenilojn<\/a>, ĉar <code>$*IN<\/code> estas tenilo same kiel malfermita dosiero.<\/span><\/p>"]]},"la":{"t":"Fluxus normales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Omne programma tria <em>fluenta vulgaria<\/em> habet quae illud cum ambitu suo coniungunt: exitum vulgarem, errorem vulgarem, et introitum vulgarem.<\/span> <span class=\"sg\" data-s=\"1\">Raku ea per tres variabiles speciales praesto facit: <code>$*OUT<\/code>, <code>$*ERR<\/code> et <code>$*IN<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In exitum vulgarem semper adhuc scripsisti: <code>say<\/code> et <code>print<\/code> textum suum ad <code>$*OUT<\/code> mittunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # ad exitum vulgarem it<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nuntii diagnostici et errorum separati servantur, in errore vulgari, ne cum vero programmatis exitu misceantur.<\/span> <span class=\"sg\" data-s=\"1\">Procedura <code>note<\/code> illuc scribit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # ad errorem vulgarem it<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec separatio utilis est quia duo fluenta independenter redirigi possunt — exempli gratia, exitum programmatis in archivum servare potes dum nuntios errorum in screen adhuc vides.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In fluenta etiam directe scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Utrumque <code>$*OUT<\/code> et <code>$*ERR<\/code> est <em>tractabulum<\/em> cum propriis methodis <code>say<\/code> et <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tertium fluentum, <code>$*IN<\/code>, est introitus vulgaris.<\/span> <span class=\"sg\" data-s=\"1\">Ei indirecte per <code>prompt<\/code> occurristi, quod lineam ex eo legit.<\/span> <span class=\"sg\" data-s=\"2\">Ad introitum legendum redibimus cum <a href=\"https://course.raku.org/la/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">tractabula archivorum<\/a> inspiciemus, quia <code>$*IN<\/code> tractabulum est sicut archivum apertum.<\/span><\/p>"]]}}}</script>
