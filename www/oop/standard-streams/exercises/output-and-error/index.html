<script type="application/json" id="page-data">{"u":"oop/standard-streams/exercises/output-and-error","n":860,"k":"exercise","pv":"oop/standard-streams/exercises","nx":"oop/standard-streams/exercises/output-and-error/solution","tr":["oop","oop/standard-streams"],"L":{"en":{"t":"Exercise ’Output and error‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A program adds up the list of numbers <code>3, 5, 7<\/code> in a loop.<\/span> <span class=\"sg\" data-s=\"1\">On every cycle, send the current running total to standard error as a progress message, and after the loop send the final result to standard output, using the stream handles directly.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This separation matters: the result can be captured or piped onward, while the progress messages stay out of the way on standard error.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you run the program, both streams appear on the screen — the running totals, then the final result:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">But if you discard standard error, only the real result remains:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Ausgabe und Fehler‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Programm summiert die Liste der Zahlen <code>3, 5, 7<\/code> in einer Schleife.<\/span> <span class=\"sg\" data-s=\"1\">Schicken Sie bei jedem Durchgang den aktuellen Zwischenstand als Fortschrittsmeldung an die Standardfehlerausgabe und nach der Schleife das Endergebnis an die Standardausgabe, und verwenden Sie dafür die Handles der Ströme direkt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diese Trennung ist wichtig: Das Ergebnis lässt sich auffangen oder weiterleiten, während die Fortschrittsmeldungen auf der Standardfehlerausgabe nicht im Weg sind.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beim Ausführen erscheinen beide Ströme am Bildschirm — die Zwischenstände, dann das Endergebnis:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verwerfen Sie aber die Standardfehlerausgabe, bleibt nur das eigentliche Ergebnis:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Uitvoer en fout‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een programma telt de lijst getallen <code>3, 5, 7<\/code> in een lus op.<\/span> <span class=\"sg\" data-s=\"1\">Stuur bij elke ronde de huidige tussenstand als voortgangsmelding naar de standaardfout, en stuur na de lus het eindresultaat naar de standaarduitvoer, met rechtstreeks gebruik van de handles van de stromen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze scheiding doet ertoe: het resultaat kan opgevangen of doorgesluisd worden, terwijl de voortgangsmeldingen op de standaardfout uit de weg blijven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je het programma draait, verschijnen beide stromen op het scherm — de tussenstanden, dan het eindresultaat:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Maar als je de standaardfout weggooit, blijft alleen het echte resultaat over:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Salida y error","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un programa suma en un bucle la lista de números <code>3, 5, 7<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En cada vuelta manda el total acumulado al error estándar como mensaje de progreso, y después del bucle manda el resultado final a la salida estándar, usando directamente los manejadores de los flujos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta separación importa: el resultado se puede capturar o encauzar hacia otro programa, mientras que los mensajes de progreso se quedan aparte, en el error estándar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Al ejecutar el programa aparecen en la pantalla los dos flujos: primero los totales acumulados y después el resultado final:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pero si descartas el error estándar, solo queda el resultado real:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Output ed errori","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un programma somma in un ciclo l'elenco di numeri <code>3, 5, 7<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A ogni giro manda il totale corrente all'errore standard come messaggio di avanzamento, e dopo il ciclo manda il risultato finale all'output standard, usando direttamente gli handle dei flussi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa separazione conta: il risultato può essere catturato o inoltrato in una pipe, mentre i messaggi di avanzamento restano da parte sull'errore standard.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando esegui il programma, sullo schermo compaiono entrambi i flussi — prima i totali parziali, poi il risultato finale:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ma se scarti l'errore standard, resta solo il risultato vero:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Izvade un kļūdas","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma ciklā saskaita skaitļu sarakstu <code>3, 5, 7<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katrā apgriezienā nosūtiet pašreizējo uzkrāto summu uz standarta kļūdu plūsmu kā progresa paziņojumu, bet pēc cikla nosūtiet galīgo rezultātu uz standarta izvadi, izmantojot plūsmu turus tieši.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī nošķiršana ir svarīga: rezultātu var noķert vai padot tālāk pa cauruli, kamēr progresa paziņojumi paliek malā standarta kļūdu plūsmā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaižot programmu, ekrānā parādās abas plūsmas — vispirms uzkrātās summas, tad galīgais rezultāts:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Taču, ja standarta kļūdu plūsmu izmet, paliek tikai īstais rezultāts:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Вывод и ошибки","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа складывает в цикле список чисел <code>3, 5, 7<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">На каждом шаге отправляйте текущую накопленную сумму в стандартный поток ошибок как сообщение о ходе работы, а после цикла отправьте итоговый результат в стандартный вывод, обращаясь к дескрипторам потоков напрямую.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это разделение важно: результат можно перехватить или передать дальше по конвейеру, а сообщения о ходе работы не будут мешаться, оставаясь в потоке ошибок.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При запуске программы на экране видны оба потока — сначала накопленные суммы, затем итог:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но если отбросить стандартный поток ошибок, останется только настоящий результат:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Вивід і помилки»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма підсумовує список чисел <code>3, 5, 7<\/code> у циклі.<\/span> <span class=\"sg\" data-s=\"1\">На кожному оберті надсилайте поточну накопичену суму до стандартного потоку помилок як повідомлення про поступ, а після циклу надішліть остаточний результат до стандартного виводу, користуючись дескрипторами потоків напряму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це розділення має значення: результат можна перехопити чи передати каналом далі, тоді як повідомлення про поступ не плутатимуться під ногами в стандартному потоці помилок.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли ви запускаєте програму, на екрані з'являються обидва потоки — накопичені суми, а потім остаточний результат:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Але якщо відкинути стандартний потік помилок, лишиться тільки справжній результат:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Изход и грешка“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма сумира списъка с числа <code>3, 5, 7<\/code> в цикъл.<\/span> <span class=\"sg\" data-s=\"1\">На всеки цикъл изпращайте текущата междинна сума в стандартната грешка като съобщение за напредъка, а след цикъла изпратете крайния резултат в стандартния изход, използвайки направо манипулаторите на потоците.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това разделяне има значение: резултатът може да бъде уловен или подаден нататък, докато съобщенията за напредъка остават настрана в стандартната грешка.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато изпълните програмата, и двата потока се появяват на екрана — междинните суми, после крайният резултат:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но ако отхвърлите стандартната грешка, остава само истинският резултат:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
