<script type="application/json" id="page-data">{"u":"oop/external-programs/the-proc-object","n":909,"k":"topic","pv":"oop/external-programs/capturing-output","nx":"oop/external-programs/the-proc-object/quiz","tr":["oop","oop/external-programs"],"L":{"en":{"t":"The Proc object","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every call to <code>run<\/code> or <code>shell<\/code> hands back a <code>Proc<\/code> object — a small record describing the program that ran and how it finished.<\/span> <span class=\"sg\" data-s=\"1\">The earlier topics used its <code>.out<\/code> handle to read output; the <code>Proc<\/code> carries more than that.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The most useful part is the <strong>exit code<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">A program tells whoever launched it whether it succeeded with a small integer: <code>0<\/code> means success, and any other number is a failure code of the program’s own choosing.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> gives you that number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For the usual yes/no question — did it work? — a <code>Proc<\/code> is simply true when the exit code is <code>0<\/code> and false otherwise, so you can test it directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>Proc<\/code> also remembers the command it launched, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One thing to watch for: if a command fails and you simply <strong>ignore<\/strong> the returned <code>Proc<\/code>, Raku raises an exception rather than letting the failure pass unnoticed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because a non-zero exit usually means something went wrong, a failing <code>Proc<\/code> that is thrown away throws when it goes out of scope.<\/span> <span class=\"sg\" data-s=\"1\">The trigger is <em>discarding<\/em> the result, not ignoring the exit code: simply storing the <code>Proc<\/code> in a variable is enough to avoid the exception, even if you never look at it again.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So if you <em>expect<\/em> a command might fail, keep its <code>Proc<\/code> and then look at <code>.exitcode<\/code> (or test it as a Boolean) whenever you want to know what happened.<\/span><\/p>"]]},"de":{"t":"Das Proc-Objekt","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>run<\/code> oder <code>shell<\/code> liefert ein <code>Proc<\/code>-Objekt zurück — einen kleinen Bericht darüber, welches Programm gelaufen ist und wie es geendet hat.<\/span> <span class=\"sg\" data-s=\"1\">Die früheren Themen haben seinen Handle <code>.out<\/code> zum Lesen der Ausgabe genutzt; das <code>Proc<\/code> trägt mehr als das.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der nützlichste Teil ist der <strong>Exit-Code<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ein Programm teilt dem, der es gestartet hat, mit einer kleinen ganzen Zahl mit, ob es gelungen ist: <code>0<\/code> bedeutet Erfolg, und jede andere Zahl ist ein selbstgewählter Fehlercode des Programms.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> liefert Ihnen diese Zahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für die übliche Ja/Nein-Frage — hat es funktioniert? — ist ein <code>Proc<\/code> schlicht wahr, wenn der Exit-Code <code>0<\/code> ist, und andernfalls falsch, Sie können es also unmittelbar prüfen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Proc<\/code> merkt sich auch den Befehl, den es gestartet hat, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eines ist zu beachten: Wenn ein Befehl fehlschlägt und Sie das gelieferte <code>Proc<\/code> schlicht <strong>ignorieren<\/strong>, löst Raku eine Ausnahme aus, statt den Fehlschlag unbemerkt durchgehen zu lassen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Weil ein Exit ungleich null gewöhnlich bedeutet, dass etwas schiefging, wirft ein fehlgeschlagenes <code>Proc<\/code>, das weggeworfen wird, sobald es seinen Gültigkeitsbereich verlässt.<\/span> <span class=\"sg\" data-s=\"1\">Auslöser ist das <em>Verwerfen<\/em> des Ergebnisses, nicht das Ignorieren des Exit-Codes: Das <code>Proc<\/code> einfach in einer Variablen zu speichern genügt, um die Ausnahme zu vermeiden, selbst wenn Sie es nie wieder ansehen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie also <em>erwarten<\/em>, dass ein Befehl fehlschlagen könnte, bewahren Sie sein <code>Proc<\/code> auf und sehen Sie sich <code>.exitcode<\/code> an (oder prüfen Sie es als Wahrheitswert), wann immer Sie wissen möchten, was geschehen ist.<\/span><\/p>"]]},"nl":{"t":"Het Proc-object","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>run<\/code> of <code>shell<\/code> geeft een <code>Proc<\/code>-object terug — een klein verslag dat beschrijft welk programma gedraaid heeft en hoe het geëindigd is.<\/span> <span class=\"sg\" data-s=\"1\">De eerdere onderwerpen gebruikten zijn handle <code>.out<\/code> om uitvoer te lezen; de <code>Proc<\/code> draagt meer dan dat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het nuttigste deel is de <strong>exitcode<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Een programma vertelt wie het gestart heeft met een klein geheel getal of het geslaagd is: <code>0<\/code> betekent succes, en elk ander getal is een foutcode die het programma zelf kiest.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> geeft je dat getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor de gewone ja/nee-vraag — heeft het gewerkt? — is een <code>Proc<\/code> eenvoudigweg waar wanneer de exitcode <code>0<\/code> is en anders onwaar, zodat je hem rechtstreeks kunt testen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>Proc<\/code> onthoudt ook het commando dat hij gestart heeft, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eén ding om op te letten: als een commando mislukt en je de teruggegeven <code>Proc<\/code> eenvoudigweg <strong>negeert<\/strong>, werpt Raku een exceptie in plaats van de mislukking onopgemerkt te laten passeren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat een exit ongelijk aan nul meestal betekent dat er iets misging, werpt een mislukkende <code>Proc<\/code> die weggegooid wordt zodra hij buiten bereik raakt.<\/span> <span class=\"sg\" data-s=\"1\">De aanleiding is het <em>weggooien<\/em> van het resultaat, niet het negeren van de exitcode: de <code>Proc<\/code> gewoon in een variabele bewaren is al genoeg om de exceptie te vermijden, ook als je er nooit meer naar kijkt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dus als je <em>verwacht<\/em> dat een commando kan mislukken, bewaar dan zijn <code>Proc<\/code> en kijk naar <code>.exitcode<\/code> (of test hem als boolean) wanneer je wilt weten wat er gebeurd is.<\/span><\/p>"]]},"es":{"t":"El objeto Proc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>run<\/code> o <code>shell<\/code> devuelve un objeto <code>Proc<\/code>: un pequeño registro que describe el programa que se ejecutó y cómo terminó.<\/span> <span class=\"sg\" data-s=\"1\">Los temas anteriores usaron su manejador <code>.out<\/code> para leer la salida; el <code>Proc<\/code> lleva más cosas consigo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La parte más útil es el <strong>código de salida<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Un programa le dice a quien lo lanzó si tuvo éxito mediante un entero pequeño: <code>0<\/code> significa éxito y cualquier otro número es un código de fallo elegido por el propio programa.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> te da ese número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para la pregunta habitual de sí o no — ¿funcionó? — un <code>Proc<\/code> es simplemente verdadero cuando el código de salida es <code>0<\/code> y falso en caso contrario, así que puedes evaluarlo directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Proc<\/code> también recuerda la orden que lanzó, en <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hay algo a lo que estar atento: si una orden falla y tú simplemente <strong>ignoras<\/strong> el <code>Proc<\/code> devuelto, Raku lanza una excepción en lugar de dejar pasar el fallo sin más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como una salida distinta de cero suele significar que algo salió mal, un <code>Proc<\/code> fallido que se tira lanza una excepción cuando sale de ámbito.<\/span> <span class=\"sg\" data-s=\"1\">Lo que lo dispara es <em>descartar<\/em> el resultado, no ignorar su código de salida: basta con guardar el <code>Proc<\/code> en una variable para evitar la excepción, aunque no vuelvas a mirarlo nunca.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así que, si <em>esperas<\/em> que una orden pueda fallar, guarda su <code>Proc<\/code> y mira después <code>.exitcode<\/code> (o evalúalo como booleano) cuando quieras saber qué pasó.<\/span><\/p>"]]},"it":{"t":"L'oggetto Proc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>run<\/code> o <code>shell<\/code> restituisce un oggetto <code>Proc<\/code> — un piccolo verbale che descrive il programma eseguito e come è terminato.<\/span> <span class=\"sg\" data-s=\"1\">Gli argomenti precedenti hanno usato il suo handle <code>.out<\/code> per leggere l'output; il <code>Proc<\/code> porta con sé altro ancora.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La parte più utile è il <strong>codice di uscita<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Un programma dice a chi lo ha lanciato se è riuscito, con un piccolo intero: <code>0<\/code> significa successo, e qualunque altro numero è un codice di fallimento a scelta del programma.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> ti dà quel numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per la solita domanda sì/no — ha funzionato? — un <code>Proc<\/code> è semplicemente vero quando il codice di uscita è <code>0<\/code> e falso altrimenti, quindi puoi metterlo alla prova direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Proc<\/code> ricorda anche il comando che ha lanciato, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una cosa a cui stare attenti: se un comando fallisce e tu semplicemente <strong>ignori<\/strong> il <code>Proc<\/code> restituito, Raku solleva un'eccezione invece di lasciar passare il fallimento inosservato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché un'uscita diversa da zero di solito significa che qualcosa è andato storto, un <code>Proc<\/code> fallito che viene buttato via solleva un'eccezione quando esce dal suo ambito.<\/span> <span class=\"sg\" data-s=\"1\">Ciò che scatena il tutto è lo <em>scartare<\/em> il risultato, non l'ignorarne il codice di uscita: basta conservare il <code>Proc<\/code> in una variabile per evitare l'eccezione, anche se non lo guardi mai più.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi, se ti <em>aspetti<\/em> che un comando possa fallire, conserva il suo <code>Proc<\/code> e guarda poi <code>.exitcode<\/code> (o mettilo alla prova come booleano) quando vuoi sapere che cosa è successo.<\/span><\/p>"]]},"lv":{"t":"Proc objekts","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>run<\/code> vai <code>shell<\/code> izsaukums atdod <code>Proc<\/code> objektu — nelielu pierakstu par to, kura programma izpildījās un kā tā beidza darbu.<\/span> <span class=\"sg\" data-s=\"1\">Iepriekšējie temati izmantoja tā turi <code>.out<\/code>, lai nolasītu izvadi; <code>Proc<\/code> nes vairāk.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Noderīgākā daļa ir <strong>izejas kods<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Programma pasaka tam, kas to palaidis, vai tā izdevusies, ar nelielu veselu skaitli: <code>0<\/code> nozīmē veiksmi, un jebkurš cits skaitlis ir pašas programmas izvēlēts neveiksmes kods.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> dod šo skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ierastajam jā/nē jautājumam — vai izdevās? — <code>Proc<\/code> vienkārši ir patiess, kad izejas kods ir <code>0<\/code>, un aplams citādi, tāpēc to var pārbaudīt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> atceras arī komandu, ko palaida, laukā <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kam jāpaskatās: ja komanda neizdodas un jūs atgriezto <code>Proc<\/code> vienkārši <strong>ignorējat<\/strong>, Raku ceļ izņēmumu, nevis ļauj neveiksmei paiet nepamanītai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā nenulles izeja parasti nozīmē, ka kaut kas noticis greizi, neveiksmīgs <code>Proc<\/code>, kas tiek izmests, izmet izņēmumu, kad iziet no redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"1\">Sprūds ir rezultāta <em>izmešana<\/em>, nevis izejas koda ignorēšana: ar to vien, ka <code>Proc<\/code> saglabājat mainīgajā, pietiek, lai izvairītos no izņēmuma, pat ja tajā vairs nekad neieskatāties.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tātad, ja <em>gaidāt<\/em>, ka komanda varētu neizdoties, paturiet tās <code>Proc<\/code> un tad ieskatieties <code>.exitcode<\/code> (vai pārbaudiet to kā Būla vērtību), kad vien vēlaties zināt, kas notika.<\/span><\/p>"]]},"ru":{"t":"Объект Proc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>run<\/code> или <code>shell<\/code> возвращает объект <code>Proc<\/code> — небольшую запись о том, какая программа выполнялась и как она завершилась.<\/span> <span class=\"sg\" data-s=\"1\">В предыдущих темах использовался его дескриптор <code>.out<\/code> для чтения вывода; но <code>Proc<\/code> несёт и кое-что ещё.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Самая полезная его часть — <strong>код возврата<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Программа сообщает тому, кто её запустил, удалась ли она, небольшим целым числом: <code>0<\/code> означает успех, а любое другое число — код неудачи, выбранный самой программой.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> даёт вам это число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для обычного вопроса «да или нет» — сработало ли? — <code>Proc<\/code> просто истинен, когда код возврата равен <code>0<\/code>, и ложен в остальных случаях, поэтому его можно проверять напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> помнит и саму запущенную команду — в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За одним стоит следить: если команда завершилась неудачей, а возвращённый <code>Proc<\/code> вы просто <strong>проигнорируете<\/strong>, Raku возбудит исключение, а не даст сбою пройти незамеченным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# умирает: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку ненулевой код возврата обычно означает, что что-то пошло не так, неудачный <code>Proc<\/code>, который выбросили, бросает исключение при выходе из области видимости.<\/span> <span class=\"sg\" data-s=\"1\">Срабатывает именно <em>отбрасывание<\/em> результата, а не игнорирование кода возврата: достаточно просто сохранить <code>Proc<\/code> в переменную, чтобы исключения не было, даже если вы больше никогда в неё не заглянете.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # ошибки нет, хотя команда и не удалась\n# …и $proc больше нигде не используется<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поэтому, если вы <em>ожидаете<\/em>, что команда может не удаться, сохраните её <code>Proc<\/code> и затем смотрите на <code>.exitcode<\/code> (или проверяйте его как булево значение) тогда, когда захотите узнать, что произошло.<\/span><\/p>"]]},"uk":{"t":"Об'єкт Proc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>run<\/code> чи <code>shell<\/code> повертає об'єкт <code>Proc<\/code> — невеликий запис, що описує програму, яка виконалася, і те, як вона завершилася.<\/span> <span class=\"sg\" data-s=\"1\">Попередні теми користувалися його дескриптором <code>.out<\/code>, щоб читати вивід; <code>Proc<\/code> несе більше.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Найкориснішою частиною є <strong>код завершення<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Програма повідомляє тому, хто її запустив, чи вдалася вона, невеликим цілим числом: <code>0<\/code> означає успіх, а будь-яке інше число є кодом невдачі на вибір самої програми.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> дає вам це число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для звичного запитання «так чи ні» — чи спрацювало? — <code>Proc<\/code> є просто істинним, коли код завершення дорівнює <code>0<\/code>, і хибним в іншому разі, тож його можна перевіряти напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> також пам'ятає команду, яку запустив, у <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На що варто зважати: якщо команда зазнає невдачі, а ви просто <strong>проігноруєте<\/strong> повернений <code>Proc<\/code>, Raku здійме виняток, замість дати збою пройти непоміченим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# гине: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки ненульове завершення зазвичай означає, що щось пішло не так, невдалий <code>Proc<\/code>, який викинули, кидає виняток, коли виходить за межі області видимості.<\/span> <span class=\"sg\" data-s=\"1\">Спусковим гачком є саме <em>відкидання<\/em> результату, а не ігнорування коду завершення: досить просто зберегти <code>Proc<\/code> у змінній, щоб уникнути винятку, навіть якщо ви більше ніколи в нього не зазирнете.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # помилки немає, хоч команда й зазнала невдачі\n# …і $proc більше ніколи не використовується<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тож, якщо ви <em>очікуєте<\/em>, що команда може зазнати невдачі, збережіть її <code>Proc<\/code>, а потім погляньте на <code>.exitcode<\/code> (або перевірте його як булеве значення), коли захочете дізнатися, що сталося.<\/span><\/p>"]]},"bg":{"t":"Обектът Proc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>run<\/code> или <code>shell<\/code> връща обект <code>Proc<\/code> — малък запис, описващ програмата, която е била изпълнена, и как е приключила.<\/span> <span class=\"sg\" data-s=\"1\">Предишните теми използваха манипулатора му <code>.out<\/code>, за да четат изхода; <code>Proc<\/code> носи повече от това.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Най-полезната част е <strong>кодът на изход<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Програмата казва на онзи, който я е стартирал, дали е успяла, с малко цяло число: <code>0<\/code> означава успех, а всяко друго число е код за провал по избор на самата програма.<\/span> <span class=\"sg\" data-s=\"2\"><code>.exitcode<\/code> ви дава това число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За обичайния въпрос с „да/не“ — проработи ли? — <code>Proc<\/code> е просто истина, когато кодът на изход е <code>0<\/code>, и лъжа в противен случай, така че можете да го проверите направо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> помни и командата, която е стартирал, в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Едно нещо за внимание: ако команда се провали и вие просто <strong>пренебрегнете<\/strong> върнатия <code>Proc<\/code>, Raku повдига изключение, вместо да остави провала да мине незабелязано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# умира: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже ненулевият изход обикновено означава, че нещо се е объркало, провалил се <code>Proc<\/code>, който е изхвърлен, хвърля изключение, когато излезе от обхват.<\/span> <span class=\"sg\" data-s=\"1\">Спусъкът е <em>изхвърлянето<\/em> на резултата, а не пренебрегването на кода на изход: простото съхраняване на <code>Proc<\/code> в променлива е достатъчно, за да избегнете изключението, дори ако никога повече не го погледнете.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # няма грешка, макар да се провали\n# …и $proc никога повече не се използва<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Затова, ако <em>очаквате<\/em>, че команда може да се провали, запазете нейния <code>Proc<\/code> и после погледнете <code>.exitcode<\/code> (или го проверете като булева стойност), когато поискате да разберете какво се е случило.<\/span><\/p>"]]}}}</script>
