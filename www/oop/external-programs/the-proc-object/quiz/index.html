<script type="application/json" id="page-data">{"u":"oop/external-programs/the-proc-object/quiz","n":910,"k":"quiz","pv":"oop/external-programs/the-proc-object","nx":"oop/external-programs/environment","tr":["oop","oop/external-programs","oop/external-programs/the-proc-object"],"L":{"en":{"t":"Quiz — The Proc object","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> is the integer the program returned — here the shell was told to <code>exit 2<\/code>, so it is <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The program does not throw: the failing <code>Proc<\/code> is stored in <code>$proc<\/code> and inspected with <code>.exitcode<\/code>, and looking at the result counts as handling it. (An exception would only arise if a failing <code>Proc<\/code> were discarded unchecked.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Das Proc-Objekt","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ein Fehler<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> ist die ganze Zahl, die das Programm zurückgegeben hat — hier wurde der Shell <code>exit 2<\/code> aufgetragen, sie ist also <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm wirft nicht: Das fehlgeschlagene <code>Proc<\/code> wird in <code>$proc<\/code> gespeichert und mit <code>.exitcode<\/code> untersucht, und das Ergebnis anzusehen gilt als Behandlung. (Eine Ausnahme entstünde nur, wenn ein fehlgeschlagenes <code>Proc<\/code> ungeprüft verworfen würde.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Het Proc-object","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">een fout<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> is het gehele getal dat het programma teruggaf — hier kreeg de shell te horen <code>exit 2<\/code> te doen, dus is het <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het programma werpt niet: de mislukkende <code>Proc<\/code> wordt in <code>$proc<\/code> bewaard en met <code>.exitcode<\/code> bekeken, en naar het resultaat kijken telt als het afhandelen ervan. (Een exceptie zou alleen ontstaan als een mislukkende <code>Proc<\/code> ongecontroleerd weggegooid werd.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — El objeto Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">un error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> es el entero que devolvió el programa; aquí a la shell se le dijo <code>exit 2<\/code>, así que es <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El programa no lanza ninguna excepción: el <code>Proc<\/code> fallido se guarda en <code>$proc<\/code> y se inspecciona con <code>.exitcode<\/code>, y mirar el resultado cuenta como manejarlo. (Solo surgiría una excepción si un <code>Proc<\/code> fallido se descartara sin comprobar.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — L'oggetto Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">un errore<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> è l'intero restituito dal programma — qui alla shell è stato detto <code>exit 2<\/code>, quindi è <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il programma non solleva eccezioni: il <code>Proc<\/code> fallito è conservato in <code>$proc<\/code> e ispezionato con <code>.exitcode<\/code>, e guardare il risultato conta come gestirlo. (Un'eccezione nascerebbe solo se un <code>Proc<\/code> fallito venisse scartato senza controllo.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Proc objekts","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko izdrukā šī programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">kļūda<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> ir vesels skaitlis, ko programma atgrieza — šeit čaulai tika likts <code>exit 2<\/code>, tāpēc tas ir <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Programma neizmet izņēmumu: neveiksmīgais <code>Proc<\/code> glabājas <code>$proc<\/code> un tiek izpētīts ar <code>.exitcode<\/code>, un rezultāta apskatīšana skaitās tā apstrādāšana. (Izņēmums rastos tikai tad, ja neveiksmīgs <code>Proc<\/code> tiktu izmests nepārbaudīts.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Объект Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ошибка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> — это целое число, которое вернула программа; здесь оболочке было велено <code>exit 2<\/code>, поэтому оно равно <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Исключения не возникает: неудачный <code>Proc<\/code> сохранён в <code>$proc<\/code> и исследован через <code>.exitcode<\/code>, а обращение к результату считается его обработкой. (Исключение появилось бы, только если бы неудачный <code>Proc<\/code> был отброшен без проверки.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Об'єкт Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що виведе наведена програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">помилку<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> — це ціле число, яке повернула програма; тут оболонці було сказано <code>exit 2<\/code>, тож воно дорівнює <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Програма не кидає винятку: невдалий <code>Proc<\/code> збережено в <code>$proc<\/code> і досліджено через <code>.exitcode<\/code>, а погляд на результат вважається його обробкою. (Виняток виник би, лише якби невдалий <code>Proc<\/code> було відкинуто неперевіреним.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Обектът Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">грешка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> е цялото число, което програмата е върнала — тук на обвивката е казано <code>exit 2<\/code>, така че то е <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Програмата не хвърля изключение: провалилият се <code>Proc<\/code> е съхранен в <code>$proc<\/code> и разгледан с <code>.exitcode<\/code>, а гледането на резултата се брои за обработка. (Изключение би възникнало само ако провалил се <code>Proc<\/code> бъде изхвърлен непроверен.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — La objekto Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion presas la jena programo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">eraron<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> estas la entjero, kiun la programo redonis — ĉi tie al la ŝelo estis dirite <code>exit 2<\/code>, do ĝi estas <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La programo ne ĵetas: la malsukcesa <code>Proc<\/code> estas konservita en <code>$proc<\/code> kaj inspektita per <code>.exitcode<\/code>, kaj rigardi la rezulton kalkuliĝas kiel trakti ĝin. (Escepto leviĝus nur, se malsukcesa <code>Proc<\/code> estus forĵetita nekontrolita.)<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Obiectum Proc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid haec programma imprimit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 2', :out;\n$proc.out.slurp(:close);\nsay $proc.exitcode;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">0<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">2<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">errorem<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> est numerus integer quem programma reddidit — hic interpres iussus est <code>exit 2<\/code> agere, itaque est <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Programma non iacit: <code>Proc<\/code> deficiens in <code>$proc<\/code> servatur et per <code>.exitcode<\/code> inspicitur, et effectum inspicere pro tractato habetur. (Exceptio solum oriretur si <code>Proc<\/code> deficiens non inspectum abiceretur.)<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
