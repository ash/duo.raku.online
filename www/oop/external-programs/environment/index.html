<script type="application/json" id="page-data">{"u":"oop/external-programs/environment","n":911,"k":"topic","pv":"oop/external-programs/the-proc-object/quiz","nx":"oop/external-programs/environment/quiz","tr":["oop","oop/external-programs"],"L":{"en":{"t":"The environment","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every program is started with a set of <em>environment variables<\/em> — named values like <code>HOME<\/code>, <code>PATH<\/code>, or <code>USER<\/code> that the operating system provides.<\/span> <span class=\"sg\" data-s=\"1\">In Raku they are available in the dynamic hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You read an environment variable by subscripting <code>%*ENV<\/code> with its name.<\/span> <span class=\"sg\" data-s=\"1\">Because it is an ordinary hash, you can also check whether a variable is set, or change it for programs you launch:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Setting a key in <code>%*ENV<\/code> adds it to the environment that any program you then start with <code>run<\/code> or <code>shell<\/code> will inherit, which is how you pass configuration down to a child program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable is set in your program’s environment <em>before<\/em> the child is launched, so the shell that <code>run<\/code> starts already has <code>GREETING<\/code> in its own environment and can echo it back.<\/span> <span class=\"sg\" data-s=\"1\">Any variable you set this way reaches every program you start afterwards.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>*<\/code> twigil tells you <code>%*ENV<\/code> is a dynamic variable, like <code>$*OUT<\/code> from the part on input and output.<\/span> <span class=\"sg\" data-s=\"1\">A few other starred variables describe the running program’s world — <code>@*ARGS<\/code> holds the command-line arguments, and <code>$*PROGRAM-NAME<\/code> is the script’s own name.<\/span> <span class=\"sg\" data-s=\"2\">Together they let a program understand the context it was launched in.<\/span><\/p>"]]},"de":{"t":"Die Umgebung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Programm wird mit einem Satz von <em>Umgebungsvariablen<\/em> gestartet — benannten Werten wie <code>HOME<\/code>, <code>PATH<\/code> oder <code>USER<\/code>, die das Betriebssystem bereitstellt.<\/span> <span class=\"sg\" data-s=\"1\">In Raku stehen sie in der dynamischen Hash <code>%*ENV<\/code> zur Verfügung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie lesen eine Umgebungsvariable, indem Sie <code>%*ENV<\/code> mit ihrem Namen indizieren.<\/span> <span class=\"sg\" data-s=\"1\">Da es eine gewöhnliche Hash ist, können Sie auch prüfen, ob eine Variable gesetzt ist, oder sie für Programme ändern, die Sie starten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einen Schlüssel in <code>%*ENV<\/code> zu setzen fügt ihn der Umgebung hinzu, die jedes danach mit <code>run<\/code> oder <code>shell<\/code> gestartete Programm erbt — so reichen Sie Konfiguration an ein Kindprogramm weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable wird in der Umgebung Ihres Programms gesetzt, <em>bevor<\/em> das Kind gestartet wird, die von <code>run<\/code> gestartete Shell hat <code>GREETING<\/code> also bereits in ihrer eigenen Umgebung und kann es zurückgeben.<\/span> <span class=\"sg\" data-s=\"1\">Jede so gesetzte Variable erreicht jedes Programm, das Sie danach starten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Twigil <code>*<\/code> sagt Ihnen, dass <code>%*ENV<\/code> eine dynamische Variable ist, wie <code>$*OUT<\/code> aus dem Teil über Ein- und Ausgabe.<\/span> <span class=\"sg\" data-s=\"1\">Einige weitere Variablen mit Stern beschreiben die Welt des laufenden Programms — <code>@*ARGS<\/code> enthält die Befehlszeilenargumente, und <code>$*PROGRAM-NAME<\/code> ist der Name des Skripts selbst.<\/span> <span class=\"sg\" data-s=\"2\">Zusammen erlauben sie einem Programm, den Zusammenhang zu verstehen, in dem es gestartet wurde.<\/span><\/p>"]]},"nl":{"t":"De omgeving","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk programma wordt gestart met een verzameling <em>omgevingsvariabelen<\/em> — benoemde waarden als <code>HOME<\/code>, <code>PATH<\/code> of <code>USER<\/code> die het besturingssysteem levert.<\/span> <span class=\"sg\" data-s=\"1\">In Raku zijn ze beschikbaar in de dynamische hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je leest een omgevingsvariabele door <code>%*ENV<\/code> met haar naam te indexeren.<\/span> <span class=\"sg\" data-s=\"1\">Omdat het een gewone hash is, kun je ook nagaan of een variabele gezet is, of haar wijzigen voor programma's die je start:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een sleutel in <code>%*ENV<\/code> zetten voegt hem toe aan de omgeving die elk programma erft dat je daarna met <code>run<\/code> of <code>shell<\/code> start, en zo geef je configuratie aan een kindprogramma door:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele wordt in de omgeving van jouw programma gezet <em>voordat<\/em> het kind gestart wordt, dus de shell die <code>run<\/code> start heeft <code>GREETING<\/code> al in zijn eigen omgeving en kan hem terugsturen.<\/span> <span class=\"sg\" data-s=\"1\">Elke variabele die je zo zet bereikt elk programma dat je daarna start.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De twigil <code>*<\/code> vertelt je dat <code>%*ENV<\/code> een dynamische variabele is, net als <code>$*OUT<\/code> uit het deel over invoer en uitvoer.<\/span> <span class=\"sg\" data-s=\"1\">Een paar andere variabelen met een ster beschrijven de wereld van het draaiende programma — <code>@*ARGS<\/code> bevat de opdrachtregelargumenten, en <code>$*PROGRAM-NAME<\/code> is de naam van het script zelf.<\/span> <span class=\"sg\" data-s=\"2\">Samen laten ze een programma de context begrijpen waarin het gestart is.<\/span><\/p>"]]},"es":{"t":"El entorno","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Todo programa se inicia con un conjunto de <em>variables de entorno<\/em>: valores con nombre como <code>HOME<\/code>, <code>PATH<\/code> o <code>USER<\/code> que aporta el sistema operativo.<\/span> <span class=\"sg\" data-s=\"1\">En Raku están disponibles en el hash dinámico <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lees una variable de entorno indexando <code>%*ENV<\/code> con su nombre.<\/span> <span class=\"sg\" data-s=\"1\">Como es un hash ordinario, también puedes comprobar si una variable está definida, o cambiarla para los programas que lances:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fijar una clave en <code>%*ENV<\/code> la añade al entorno que heredará cualquier programa que arranques después con <code>run<\/code> o <code>shell<\/code>, y así es como pasas configuración a un programa hijo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable se fija en el entorno de tu programa <em>antes<\/em> de lanzar al hijo, así que la shell que arranca <code>run<\/code> ya tiene <code>GREETING<\/code> en su propio entorno y puede devolverlo con echo.<\/span> <span class=\"sg\" data-s=\"1\">Cualquier variable que fijes así llega a todos los programas que inicies después.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El twigil <code>*<\/code> te indica que <code>%*ENV<\/code> es una variable dinámica, como <code>$*OUT<\/code> de la parte sobre entrada y salida.<\/span> <span class=\"sg\" data-s=\"1\">Algunas otras variables con asterisco describen el mundo del programa en ejecución: <code>@*ARGS<\/code> contiene los argumentos de la línea de comandos y <code>$*PROGRAM-NAME<\/code> es el nombre del propio guion.<\/span> <span class=\"sg\" data-s=\"2\">Juntas permiten que un programa entienda el contexto en el que se lo lanzó.<\/span><\/p>"]]},"it":{"t":"L'ambiente","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni programma viene avviato con un insieme di <em>variabili d'ambiente<\/em> — valori con un nome come <code>HOME<\/code>, <code>PATH<\/code> o <code>USER<\/code> che il sistema operativo fornisce.<\/span> <span class=\"sg\" data-s=\"1\">In Raku sono disponibili nell'hash dinamico <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Leggi una variabile d'ambiente indicizzando <code>%*ENV<\/code> con il suo nome.<\/span> <span class=\"sg\" data-s=\"1\">Poiché è un hash ordinario, puoi anche controllare se una variabile è impostata, o cambiarla per i programmi che lanci:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Impostare una chiave in <code>%*ENV<\/code> la aggiunge all'ambiente che qualunque programma poi avviato con <code>run<\/code> o <code>shell<\/code> erediterà, ed è così che passi la configurazione a un programma figlio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile viene impostata nell'ambiente del tuo programma <em>prima<\/em> che il figlio venga lanciato, quindi la shell che <code>run<\/code> avvia ha già <code>GREETING<\/code> nel proprio ambiente e può restituirlo con echo.<\/span> <span class=\"sg\" data-s=\"1\">Ogni variabile che imposti in questo modo raggiunge ogni programma che avvii in seguito.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il twigil <code>*<\/code> ti dice che <code>%*ENV<\/code> è una variabile dinamica, come <code>$*OUT<\/code> della parte su input e output.<\/span> <span class=\"sg\" data-s=\"1\">Alcune altre variabili con l'asterisco descrivono il mondo del programma in esecuzione: <code>@*ARGS<\/code> contiene gli argomenti della riga di comando e <code>$*PROGRAM-NAME<\/code> è il nome dello script stesso.<\/span> <span class=\"sg\" data-s=\"2\">Insieme permettono a un programma di capire il contesto in cui è stato lanciato.<\/span><\/p>"]]},"lv":{"t":"Vide","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Katra programma tiek palaista ar <em>vides mainīgo<\/em> kopu — nosauktām vērtībām, piemēram, <code>HOME<\/code>, <code>PATH<\/code> vai <code>USER<\/code>, ko nodrošina operētājsistēma.<\/span> <span class=\"sg\" data-s=\"1\">Raku tie ir pieejami dinamiskajā jauktenī <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vides mainīgo nolasāt, indeksējot <code>%*ENV<\/code> ar tā nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā tas ir parasts jauktenis, varat arī pārbaudīt, vai mainīgais ir uzstādīts, vai mainīt to programmām, ko palaižat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Uzstādot atslēgu <code>%*ENV<\/code>, tā tiek pievienota videi, ko mantos jebkura programma, kuru pēc tam palaidīsiet ar <code>run<\/code> vai <code>shell<\/code>, un tā konfigurāciju padod bērnprogrammai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgais tiek uzstādīts jūsu programmas vidē <em>pirms<\/em> bērna palaišanas, tāpēc čaulai, ko palaiž <code>run<\/code>, <code>GREETING<\/code> savā vidē jau ir un tā to var atbalsot atpakaļ.<\/span> <span class=\"sg\" data-s=\"1\">Katrs šādi uzstādītais mainīgais sasniedz katru programmu, ko palaižat pēc tam.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tvigils <code>*<\/code> pasaka, ka <code>%*ENV<\/code> ir dinamisks mainīgais, tāpat kā <code>$*OUT<\/code> daļā par ievadi un izvadi.<\/span> <span class=\"sg\" data-s=\"1\">Vēl daži zvaigžņotie mainīgie apraksta darbojošās programmas pasauli — <code>@*ARGS<\/code> satur komandrindas argumentus, un <code>$*PROGRAM-NAME<\/code> ir paša skripta nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Kopā tie ļauj programmai saprast kontekstu, kurā tā palaista.<\/span><\/p>"]]},"ru":{"t":"Переменные окружения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всякая программа запускается с набором <em>переменных окружения<\/em> — именованных значений вроде <code>HOME<\/code>, <code>PATH<\/code> или <code>USER<\/code>, которые предоставляет операционная система.<\/span> <span class=\"sg\" data-s=\"1\">В Raku они доступны в динамическом хеше <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашний каталог, например /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменную окружения читают, обращаясь к <code>%*ENV<\/code> по её имени.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку это обычный хеш, можно также проверить, задана ли переменная, или изменить её для программ, которые вы запускаете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Установка ключа в <code>%*ENV<\/code> добавляет его в окружение, которое унаследует любая программа, запущенная затем через <code>run<\/code> или <code>shell<\/code>, — так конфигурацию передают дочерней программе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменная устанавливается в окружении вашей программы <em>до<\/em> запуска потомка, поэтому оболочка, которую стартует <code>run<\/code>, уже имеет <code>GREETING<\/code> в собственном окружении и может его вывести.<\/span> <span class=\"sg\" data-s=\"1\">Любая установленная так переменная достаётся каждой программе, запущенной впоследствии.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Твигил <code>*<\/code> говорит о том, что <code>%*ENV<\/code> — динамическая переменная, как и <code>$*OUT<\/code> из части о вводе и выводе.<\/span> <span class=\"sg\" data-s=\"1\">Ещё несколько переменных со звёздочкой описывают мир работающей программы: <code>@*ARGS<\/code> содержит аргументы командной строки, а <code>$*PROGRAM-NAME<\/code> — имя самого скрипта.<\/span> <span class=\"sg\" data-s=\"2\">Вместе они позволяют программе понять, в каком контексте её запустили.<\/span><\/p>"]]},"uk":{"t":"Середовище","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна програма запускається з набором <em>змінних середовища<\/em> — іменованих значень на кшталт <code>HOME<\/code>, <code>PATH<\/code> чи <code>USER<\/code>, які надає операційна система.<\/span> <span class=\"sg\" data-s=\"1\">У Raku вони доступні в динамічному хеші <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашній каталог, наприклад /home/anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінну середовища читають, індексуючи <code>%*ENV<\/code> її іменем.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки це звичайний хеш, ви можете також перевірити, чи змінну встановлено, або змінити її для програм, які запускаєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Встановлення ключа в <code>%*ENV<\/code> додає його до середовища, яке успадкує будь-яка програма, згодом запущена через <code>run<\/code> чи <code>shell<\/code>, — саме так конфігурацію передають дочірній програмі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінну встановлено в середовищі вашої програми <em>до<\/em> запуску дитини, тож оболонка, яку запускає <code>run<\/code>, уже має <code>GREETING<\/code> у власному середовищі й може повернути її луною.<\/span> <span class=\"sg\" data-s=\"1\">Будь-яка встановлена так змінна доходить до кожної програми, яку ви запускаєте після цього.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Твіґіл <code>*<\/code> каже вам, що <code>%*ENV<\/code> є динамічною змінною, як <code>$*OUT<\/code> із частини про введення й виведення.<\/span> <span class=\"sg\" data-s=\"1\">Ще кілька змінних із зірочкою описують світ запущеної програми: <code>@*ARGS<\/code> містить аргументи командного рядка, а <code>$*PROGRAM-NAME<\/code> — власне ім'я скрипта.<\/span> <span class=\"sg\" data-s=\"2\">Разом вони дозволяють програмі зрозуміти контекст, у якому її запустили.<\/span><\/p>"]]},"bg":{"t":"Средата","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка програма се стартира с набор от <em>променливи на средата<\/em> — именувани стойности като <code>HOME<\/code>, <code>PATH<\/code> или <code>USER<\/code>, които операционната система предоставя.<\/span> <span class=\"sg\" data-s=\"1\">В Raku те са достъпни в динамичния хеш <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашната директория, например /home/anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Четете променлива на средата, като индексирате <code>%*ENV<\/code> с името ѝ. Понеже това е обикновен хеш, можете също да проверите дали дадена променлива е зададена, или да я промените за програмите, които стартирате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Задаването на ключ в <code>%*ENV<\/code> го добавя към средата, която всяка програма, стартирана след това с <code>run<\/code> или <code>shell<\/code>, ще наследи — така подавате настройки надолу към дъщерна програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата се задава в средата на вашата програма <em>преди<\/em> стартирането на детето, така че обвивката, която <code>run<\/code> пуска, вече има <code>GREETING<\/code> в собствената си среда и може да го изведе обратно.<\/span> <span class=\"sg\" data-s=\"1\">Всяка променлива, зададена по този начин, достига до всяка програма, която стартирате след това.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тайгълът <code>*<\/code> ви подсказва, че <code>%*ENV<\/code> е динамична променлива, като <code>$*OUT<\/code> от частта за входа и изхода.<\/span> <span class=\"sg\" data-s=\"1\">Няколко други променливи със звездичка описват света на работещата програма — <code>@*ARGS<\/code> съдържа аргументите от командния ред, а <code>$*PROGRAM-NAME<\/code> е собственото име на скрипта.<\/span> <span class=\"sg\" data-s=\"2\">Заедно те позволяват на програмата да разбере контекста, в който е стартирана.<\/span><\/p>"]]}}}</script>
