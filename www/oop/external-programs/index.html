<script type="application/json" id="page-data">{"u":"oop/external-programs","n":905,"k":"section","pv":"oop/file-handles/quiz","nx":"oop/external-programs/run-and-shell","tr":["oop"],"L":{"en":{"t":"Running external programs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programs do not work in isolation — they often need to run other programs, read their output, and consult the environment they were started in.<\/span> <span class=\"sg\" data-s=\"1\">Raku gives you direct, convenient access to all of this.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section covers <code>run<\/code> and <code>shell<\/code> for launching external commands, capturing what those commands print, and the <code>%*ENV<\/code> hash that holds the environment variables.<\/span><\/p>"]]},"de":{"t":"Externe Programme ausführen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programme arbeiten nicht für sich allein — oft müssen sie andere Programme ausführen, deren Ausgabe lesen und die Umgebung befragen, in der sie gestartet wurden.<\/span> <span class=\"sg\" data-s=\"1\">Raku gibt Ihnen dazu unmittelbaren, bequemen Zugang.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt <code>run<\/code> und <code>shell<\/code> zum Starten externer Befehle, das Auffangen dessen, was diese Befehle ausgeben, und die Hash <code>%*ENV<\/code>, die die Umgebungsvariablen enthält.<\/span><\/p>"]]},"nl":{"t":"Externe programma's draaien","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma's werken niet in isolatie — ze moeten vaak andere programma's draaien, hun uitvoer lezen en de omgeving raadplegen waarin ze gestart zijn.<\/span> <span class=\"sg\" data-s=\"1\">Raku geeft je daar rechtstreeks en gemakkelijk toegang toe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze sectie behandelt <code>run<\/code> en <code>shell<\/code> om externe commando's te starten, het opvangen van wat die commando's afdrukken, en de hash <code>%*ENV<\/code> die de omgevingsvariabelen bevat.<\/span><\/p>"]]},"es":{"t":"Ejecutar programas externos 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los programas no trabajan aislados: a menudo necesitan ejecutar otros programas, leer su salida y consultar el entorno en el que se los inició.<\/span> <span class=\"sg\" data-s=\"1\">Raku te da acceso directo y cómodo a todo esto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata <code>run<\/code> y <code>shell<\/code> para lanzar órdenes externas, la captura de lo que esas órdenes imprimen y el hash <code>%*ENV<\/code> que contiene las variables de entorno.<\/span><\/p>"]]},"it":{"t":"Eseguire programmi esterni 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I programmi non lavorano isolati: spesso devono eseguire altri programmi, leggerne l'output e consultare l'ambiente in cui sono stati avviati.<\/span> <span class=\"sg\" data-s=\"1\">Raku ti dà accesso diretto e comodo a tutto questo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta <code>run<\/code> e <code>shell<\/code> per lanciare comandi esterni, la cattura di ciò che quei comandi stampano e l'hash <code>%*ENV<\/code> che contiene le variabili d'ambiente.<\/span><\/p>"]]},"lv":{"t":"Ārējo programmu palaišana 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programmas nedarbojas nošķirtībā — tām bieži jāpalaiž citas programmas, jānolasa to izvade un jāapskatās vidē, kurā tās pašas ir palaistas.<\/span> <span class=\"sg\" data-s=\"1\">Raku dod tiešu un ērtu piekļuvi tam visam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko <code>run<\/code> un <code>shell<\/code> ārēju komandu palaišanai, šo komandu izdrukātā noķeršanu un jaukteni <code>%*ENV<\/code>, kas satur vides mainīgos.<\/span><\/p>"]]},"ru":{"t":"Запуск внешних программ","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Программы не существуют в изоляции — им часто нужно запускать другие программы, читать их вывод и обращаться к окружению, в котором они были запущены.<\/span> <span class=\"sg\" data-s=\"1\">Raku даёт ко всему этому прямой и удобный доступ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе рассматриваются <code>run<\/code> и <code>shell<\/code> для запуска внешних команд, перехват того, что эти команды печатают, и хеш <code>%*ENV<\/code>, хранящий переменные окружения.<\/span><\/p>"]]},"uk":{"t":"Запуск зовнішніх програм","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Програми не працюють у самоті — їм часто потрібно запускати інші програми, читати їхній вивід і звірятися з оточенням, у якому їх запустили.<\/span> <span class=\"sg\" data-s=\"1\">Raku дає вам прямий і зручний доступ до всього цього.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює <code>run<\/code> та <code>shell<\/code> для запуску зовнішніх команд, перехоплення того, що ці команди виводять, і хеш <code>%*ENV<\/code>, який містить змінні середовища.<\/span><\/p>"]]},"bg":{"t":"Изпълнение на външни програми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Програмите не работят в изолация — често им се налага да изпълняват други програми, да четат изхода им и да се справят със средата, в която са стартирани.<\/span> <span class=\"sg\" data-s=\"1\">Raku ви дава пряк и удобен достъп до всичко това.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел обхваща <code>run<\/code> и <code>shell<\/code> за стартиране на външни команди, улавянето на онова, което тези команди отпечатват, и хеша <code>%*ENV<\/code>, който съдържа променливите на средата.<\/span><\/p>"]]},"eo":{"t":"Ruli eksterajn programojn 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programoj ne laboras izolite — ili ofte bezonas ruli aliajn programojn, legi ilian eligon, kaj konsulti la medion, en kiu ili estis startigitaj.<\/span> <span class=\"sg\" data-s=\"1\">Raku donas al vi rektan, oportunan aliron al ĉio ĉi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas <code>run<\/code> kaj <code>shell<\/code> por lanĉi eksterajn komandojn, kapti tion, kion tiuj komandoj presas, kaj la hakon <code>%*ENV<\/code>, kiu tenas la mediajn variablojn.<\/span><\/p>"]]},"la":{"t":"Programmata externa exsequi 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programmata seorsum non operantur — saepe alia programmata currere, exitum eorum legere, et ambitum in quo incepta sunt consulere debent.<\/span> <span class=\"sg\" data-s=\"1\">Raku tibi ad haec omnia accessum directum et commodum dat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec sectio <code>run<\/code> et <code>shell<\/code> ad imperata externa lancianda tractat, exitum quem illa imperata imprimunt capiendum, et mappam <code>%*ENV<\/code> quae variabiles ambitus continet.<\/span><\/p>"]]}}}</script>
