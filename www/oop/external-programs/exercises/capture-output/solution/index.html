urp(:close)<\/code> la lee entera; <code>.trim<\/code> quita el salto de línea final que añade <code>echo<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una vez que la salida es una cadena ordinaria dentro de nuestro programa, la tratamos como cualquier otro dato: <code>.words.elems<\/code> la parte por los espacios y cuenta las piezas, dando <code>3<\/code>. Ese es el sentido de capturar: el programa externo se convierte en una pieza cuyo resultado procesamos después.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Catturate l'output","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello world raku', :out;\nmy $output = $proc.out.slurp(:close).trim;\nsay $output.words.elems;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/capture-output.raku\" target=\"_blank\" rel=\"noopener\">capture-output.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>:out<\/code> redirige l'output del programma dentro il <code>Proc<\/code> invece che sullo schermo, e <code>.out.slurp(:close)<\/code> lo rilegge tutto; <code>.trim<\/code> toglie il ritorno a capo finale che <code>echo<\/code> aggiunge.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una volta che l'output è una stringa ordinaria nel nostro programma, lo trattiamo come qualunque altro dato: <code>.words.elems<\/code> lo divide sugli spazi e conta i pezzi, dando <code>3<\/code>. È questo il senso della cattura: il programma esterno diventa un mattoncino il cui risultato elaboriamo ulteriormente.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pārtveriet izvadi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello world raku', :out;\nmy $output = $proc.out.slurp(:close).trim;\nsay $output.words.elems;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/capture-output.raku\" target=\"_blank\" rel=\"noopener\">capture-output.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>:out<\/code> novirza programmas izvadi <code>Proc<\/code> iekšienē, nevis uz ekrānu, un <code>.out.slurp(:close)<\/code> to visu nolasa atpakaļ; <code>.trim<\/code> noņem beigu jauno rindu, ko <code>echo<\/code> pievieno.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tiklīdz izvade mūsu programmā ir parasta virkne, mēs pret to izturamies kā pret jebkuriem citiem datiem: <code>.words.elems<\/code> sadala to pa atstarpēm un saskaita gabalus, dodot <code>3<\/code>. Tāda arī ir noķeršanas jēga — ārējā programma kļūst par būvbloku, kura rezultātu apstrādājam tālāk.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Захватите вывод","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello world raku', :out;\nmy $output = $proc.out.slurp(:close).trim;\nsay $output.words.elems;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\ \" data-s=\"0\"><code>:out<\/code> перенаправляє вивід програми в <code>Proc<\/code> замість екрана, а <code>.out.slurp(:close)<\/code> зчитує його весь назад; <code>.trim<\/code> прибирає завершальний перехід рядка, який додає <code>echo<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щойно вивід стає звичайним рядком у нашій програмі, ми поводимося з ним як із будь-якими іншими даними: <code>.words.elems<\/code> розбиває його за пробільними символами й рахує частини, даючи <code>3<\/code>. У цьому й суть перехоплення — зовнішня програма стає будівельним блоком, чий результат ми обробляємо далі.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Уловете изхода","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello world raku', :out;\nmy $output = $proc.out.slurp(:close).trim;\nsay $output.words.elems;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/capture-output.raku\" target=\"_blank\" rel=\"noopener\">capture-output.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>:out<\/code> пренасочва изхода на програмата в <code>Proc<\/code> вместо на екрана, а <code>.out.slurp(:close)<\/code> го прочита целия обратно; <code>.trim<\/code> премахва завършващия нов ред, който <code>echo<\/code> добавя.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щом изходът е обикновен низ в нашата програма, ние го третираме като всякакви други данни: <code>.words.elems<\/code> го разделя по празните места и преброява па
