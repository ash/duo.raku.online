<script type="application/json" id="page-data">{"u":"oop/external-programs/exercises/run-a-command/solution","n":915,"k":"solution","pv":"oop/external-programs/exercises/run-a-command","nx":"oop/external-programs/exercises/capture-output","tr":["oop","oop/external-programs"],"L":{"en":{"t":"The solution of ’Run a command‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> launches <code>echo<\/code> directly, passing each string as a separate argument. With no <code>:out<\/code>, the program’s output goes straight to the screen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The argument reaches <code>echo<\/code> exactly as written: <code>$HOME<\/code> is printed literally, not replaced with your home directory, because no shell is involved to expand it. This is why <code>run<\/code> is the safe default — the same command given to <code>shell<\/code> could behave very differently.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">To actually print the home directory, let a shell do the expansion: <code>shell 'echo home: $HOME'<\/code> prints something like <code>home: /home/anna<\/code>. (Keep the single quotes on the Raku side, too — a double-quoted <code>\"$HOME\"<\/code> would make Raku itself try to interpolate a variable named <code>$HOME<\/code> before <code>echo<\/code> ever runs.)<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Führen Sie einen Befehl aus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> startet <code>echo<\/code> unmittelbar und übergibt jede Zeichenkette als getrenntes Argument. Ohne <code>:out<\/code> geht die Ausgabe des Programms direkt an den Bildschirm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Argument erreicht <code>echo<\/code> genau so, wie es geschrieben steht: <code>$HOME<\/code> wird wörtlich ausgegeben und nicht durch Ihr Heimatverzeichnis ersetzt, weil keine Shell beteiligt ist, die es ersetzen würde. Deshalb ist <code>run<\/code> die sichere Standardwahl — derselbe Befehl an <code>shell<\/code> übergeben könnte sich ganz anders verhalten.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Um das Heimatverzeichnis tatsächlich auszugeben, lassen Sie eine Shell die Ersetzung vornehmen: <code>shell 'echo home: $HOME'<\/code> gibt etwas wie <code>home: /home/anna<\/code> aus. (Behalten Sie die einfachen Anführungszeichen auch auf der Raku-Seite bei — ein <code>\"$HOME\"<\/code> in doppelten Anführungszeichen würde Raku selbst dazu bringen, eine Variable namens <code>$HOME<\/code> zu interpolieren, noch bevor <code>echo<\/code> überhaupt läuft.)<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Draai een commando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> start <code>echo<\/code> rechtstreeks en geeft elke string als afzonderlijk argument mee. Zonder <code>:out<\/code> gaat de uitvoer van het programma regelrecht naar het scherm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het argument bereikt <code>echo<\/code> precies zoals geschreven: <code>$HOME<\/code> wordt letterlijk afgedrukt en niet door je thuismap vervangen, omdat er geen shell bij betrokken is om het te expanderen. Daarom is <code>run<\/code> de veilige standaardkeuze — hetzelfde commando aan <code>shell<\/code> gegeven zou zich heel anders kunnen gedragen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Om de thuismap werkelijk af te drukken, laat je een shell de expansie doen: <code>shell 'echo home: $HOME'<\/code> drukt zoiets af als <code>home: /home/anna<\/code>. (Houd de enkele aanhalingstekens ook aan de Raku-kant — een <code>\"$HOME\"<\/code> met dubbele aanhalingstekens zou Raku zelf een variabele met de naam <code>$HOME<\/code> laten interpoleren voordat <code>echo<\/code> ook maar draait.)<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Ejecute un comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> lanza <code>echo<\/code> directamente, pasando cada cadena como argumento separado. Sin <code>:out<\/code>, la salida del programa va derecha a la pantalla.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El argumento llega a <code>echo<\/code> exactamente como está escrito: <code>$HOME<\/code> se imprime tal cual, no se sustituye por tu carpeta personal, porque no hay ninguna shell que lo expanda. Por eso <code>run<\/code> es la opción segura por omisión: la misma orden dada a <code>shell<\/code> podría comportarse de forma muy distinta.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Para imprimir de verdad la carpeta personal, deja que sea una shell quien haga la expansión: <code>shell 'echo home: $HOME'<\/code> imprime algo como <code>home: /home/anna<\/code>. (Mantén también las comillas simples del lado de Raku: unas comillas dobles <code>\"$HOME\"<\/code> harían que el propio Raku intentara interpolar una variable llamada <code>$HOME<\/code> antes de que <code>echo<\/code> llegara a ejecutarse.)<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Eseguite un comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> lancia <code>echo<\/code> direttamente, passando ogni stringa come argomento separato. Senza <code>:out<\/code>, l'output del programma va dritto sullo schermo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'argomento raggiunge <code>echo<\/code> esattamente com'è scritto: <code>$HOME<\/code> viene stampato alla lettera, non sostituito con la tua directory home, perché non c'è alcuna shell a espanderlo. È per questo che <code>run<\/code> è la scelta predefinita sicura: lo stesso comando dato a <code>shell<\/code> potrebbe comportarsi in modo molto diverso.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Per stampare davvero la directory home, lascia che sia una shell a fare l'espansione: <code>shell 'echo home: $HOME'<\/code> stampa qualcosa come <code>home: /home/anna<\/code>. (Tieni le virgolette singole anche dal lato Raku: un <code>\"$HOME\"<\/code> fra virgolette doppie farebbe tentare a Raku stesso di interpolare una variabile di nome <code>$HOME<\/code> prima ancora che <code>echo<\/code> giri.)<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Palaidiet komandu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> palaiž <code>echo<\/code> tieši, padodot katru virkni kā atsevišķu argumentu. Bez <code>:out<\/code> programmas izvade aiziet tieši uz ekrānu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Arguments <code>echo<\/code> sasniedz tieši tā, kā uzrakstīts: <code>$HOME<\/code> tiek izdrukāts burtiski, nevis aizstāts ar jūsu mājas direktoriju, jo nav iesaistīta čaula, kas to izvērstu. Tieši tāpēc <code>run<\/code> ir drošais noklusējums — tā pati komanda, dota <code>shell<\/code>, varētu uzvesties pavisam citādi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Lai mājas direktoriju patiešām izdrukātu, ļaujiet izvēršanu veikt čaulai: <code>shell 'echo home: $HOME'<\/code> izdrukā kaut ko līdzīgu <code>home: /home/anna<\/code>. (Paturiet vienpēdiņas arī Raku pusē — dubultpēdiņās likts <code>\"$HOME\"<\/code> liktu pašam Raku mēģināt interpolēt mainīgo ar nosaukumu <code>$HOME<\/code>, pirms <code>echo<\/code> vispār palaistos.)<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Запустите команду","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> запускает <code>echo<\/code> напрямую, передавая каждую строку отдельным аргументом. Без <code>:out<\/code> вывод программы идёт прямо на экран.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргумент доходит до <code>echo<\/code> ровно таким, каким записан: <code>$HOME<\/code> печатается буквально, а не заменяется вашим домашним каталогом, потому что нет оболочки, которая бы его подставила. Именно поэтому <code>run<\/code> — безопасный выбор по умолчанию: та же команда, переданная <code>shell<\/code>, повела бы себя совсем иначе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Чтобы всё-таки напечатать домашний каталог, поручите подстановку оболочке: <code>shell 'echo home: $HOME'<\/code> напечатает что-нибудь вроде <code>home: /home/anna<\/code>. (Одинарные кавычки нужны и на стороне Raku: в двойных кавычках <code>\"$HOME\"<\/code> сам Raku попытался бы интерполировать переменную с именем <code>$HOME<\/code> ещё до того, как запустится <code>echo<\/code>.)<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Запустіть команду","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> запускає <code>echo<\/code> напряму, передаючи кожен рядок окремим аргументом. Без <code>:out<\/code> вивід програми йде просто на екран.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргумент доходить до <code>echo<\/code> точно таким, як записано: <code>$HOME<\/code> виводиться буквально, а не замінюється вашим домашнім каталогом, бо жодна оболонка не залучена, щоб його підставити. Саме тому <code>run<\/code> є безпечним вибором за замовчуванням: та сама команда, віддана до <code>shell<\/code>, могла б повестися зовсім інакше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щоб справді вивести домашній каталог, дозвольте підстановку оболонці: <code>shell 'echo home: $HOME'<\/code> виводить щось на кшталт <code>home: /home/anna<\/code>. (Тримайте одинарні лапки й на боці Raku — рядок у подвійних лапках <code>\"$HOME\"<\/code> змусив би сам Raku спробувати інтерполювати змінну на ім'я <code>$HOME<\/code> ще до того, як <code>echo<\/code> взагалі запуститься.)<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Изпълнете команда","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> стартира <code>echo<\/code> направо, подавайки всеки низ като отделен аргумент. Без <code>:out<\/code> изходът на програмата отива право на екрана.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргументът стига до <code>echo<\/code> точно както е написан: <code>$HOME<\/code> се отпечатва буквално, а не заменен с домашната ви директория, защото не участва обвивка, която да го разгъне. Именно затова <code>run<\/code> е безопасният избор по подразбиране — същата команда, подадена на <code>shell<\/code>, би могла да се държи съвсем различно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За да отпечатате наистина домашната директория, оставете обвивката да направи разгъването: <code>shell 'echo home: $HOME'<\/code> отпечатва нещо като <code>home: /home/anna<\/code>. (Запазете единичните кавички и от страна на Raku — низ в двойни кавички <code>\"$HOME\"<\/code> би накарал самия Raku да се опита да интерполира променлива на име <code>$HOME<\/code>, преди <code>echo<\/code> изобщо да е стартирал.)<\/span><\/li><\/ol>"]]}}}</script>
