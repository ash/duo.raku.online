<script type="application/json" id="page-data">{"u":"oop/external-programs/exercises/read-env/solution","n":921,"k":"solution","pv":"oop/external-programs/exercises/read-env","nx":"oop/try","tr":["oop","oop/external-programs"],"L":{"en":{"t":"The solution of ’Pass a variable to a child‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $file = 'notes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/read-env.raku\" target=\"_blank\" rel=\"noopener\">read-env.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> creates <code>notes.txt<\/code> with three lines. Setting <code>%*ENV&lt;NOTES&gt;<\/code> to its name puts the file name into the environment that any child program will inherit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>shell<\/code> command inherits that environment, expands <code>$NOTES<\/code> to <code>notes.txt<\/code>, and feeds the file into <code>wc -l<\/code>, which counts its lines. The <code>&lt; \"$NOTES\"<\/code> redirection keeps the output to just the number <code>3<\/code>, which we capture with <code>:out<\/code> and trim.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Finally the clean-up is done back in Raku with <code>unlink<\/code> — no shell needed. Deleting the file is a plain file-system operation, so there is no reason to launch another process for it.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Geben Sie eine Variable an ein Kind weiter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $file = 'notes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/read-env.raku\" target=\"_blank\" rel=\"noopener\">read-env.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> legt <code>notes.txt<\/code> mit drei Zeilen an. <code>%*ENV&lt;NOTES&gt;<\/code> auf ihren Namen zu setzen legt den Dateinamen in die Umgebung, die jedes Kindprogramm erbt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>shell<\/code>-Befehl erbt diese Umgebung, ersetzt <code>$NOTES<\/code> durch <code>notes.txt<\/code> und reicht die Datei an <code>wc -l<\/code> weiter, das ihre Zeilen zählt. Die Umleitung <code>&lt; \"$NOTES\"<\/code> beschränkt die Ausgabe auf die bloße Zahl <code>3<\/code>, die wir mit <code>:out<\/code> auffangen und trimmen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Aufräumen geschieht schließlich wieder in Raku mit <code>unlink<\/code> — keine Shell nötig. Eine Datei zu löschen ist eine schlichte Dateisystemoperation, es gibt also keinen Grund, dafür einen weiteren Prozess zu starten.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Geef een variabele aan een kind door","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $file = 'notes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/read-env.raku\" target=\"_blank\" rel=\"noopener\">read-env.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> maakt <code>notes.txt<\/code> met drie regels aan. <code>%*ENV&lt;NOTES&gt;<\/code> op die naam zetten plaatst de bestandsnaam in de omgeving die elk kindprogramma erft.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het <code>shell<\/code>-commando erft die omgeving, expandeert <code>$NOTES<\/code> naar <code>notes.txt<\/code> en voert het bestand aan <code>wc -l<\/code>, dat de regels telt. De omleiding <code>&lt; \"$NOTES\"<\/code> beperkt de uitvoer tot alleen het getal <code>3<\/code>, dat we met <code>:out<\/code> opvangen en trimmen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het opruimen gebeurt ten slotte weer in Raku met <code>unlink<\/code> — geen shell nodig. Een bestand verwijderen is een gewone bewerking op het bestandssysteem, dus is er geen reden om daar nog een proces voor te starten.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Pase una variable a un proceso hijo","b":[["p",1,"<p><span cla tes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/read-env.raku\" target=\"_blank\" rel=\"noopener\">read-env.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> izveido <code>notes.txt<\/code> ar trim rindām. Uzstādot <code>%*ENV&lt;NOTES&gt;<\/code> uz tā nosaukumu, faila nosaukums nonāk vidē, ko mantos jebkura bērnprogramma.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Komanda <code>shell<\/code> šo vidi manto, izvērš <code>$NOTES<\/code> par <code>notes.txt<\/code> un padod failu <code>wc -l<\/code>, kas saskaita tā rindas. Novirzīšana <code>&lt; \"$NOTES\"<\/code> patur izvadē tikai skaitli <code>3<\/code>, ko noķeram ar <code>:out<\/code> un apgriežam ar <code>trim<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Visbeidzot sakopšana tiek izdarīta atpakaļ Raku pusē ar <code>unlink<\/code> — čaula nav vajadzīga. Faila dzēšana ir parasta failu sistēmas darbība, tāpēc nav iemesla tās dēļ palaist vēl vienu procesu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Передайте переменную дочернему процессу","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $file = 'notes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/read-env.raku\" target=\"_blank\" rel=\"noopener\">read-env.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> создаёт <code>notes.txt<\/code> с тремя строками. Присваивание <code>%*ENV&lt;NOTES&gt;<\/code> его имени помещает имя файла в окружение, которое унаследует любая дочерняя программа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Команда <code>shell<\/code> наследует это окружение, подставляет вместо <code>$NOTES<\/code> значение <code>notes.txt<\/code> и передаёт файл в <code>wc -l<\/code>, который считает его строки. Перенаправление <code>&lt; \"$NOTES\"<\/code> оставляет в выводе только число <code>3<\/code>, которое мы перехватываем через <code>:out<\/code> и обрезаем.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наконец, уборка выполняется уже средствами Raku, через <code>unlink<\/code>, — оболочка тут не нужна. Удаление файла — обычная операция файловой системы, так что запускать ради неё ещё один процесс незачем.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Передайте змінну дитині","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $file = 'notes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код мож
