<script type="application/json" id="page-data">{"u":"oop/external-programs/run-and-shell","n":906,"k":"topic","pv":"oop/external-programs","nx":"oop/external-programs/run-and-shell/quiz","tr":["oop","oop/external-programs"],"L":{"en":{"t":"run and shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">There are two ways to launch an external program.<\/span> <span class=\"sg\" data-s=\"1\">The <code>run<\/code> function takes the command and its arguments as <strong>separate<\/strong> values and runs the program directly, without involving a shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This runs the <code>echo<\/code> program with the single argument <code>hello<\/code>, which prints <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Because the arguments are passed separately, there is no risk of the shell mis-interpreting spaces or special characters — <code>run<\/code> is the safe default.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>shell<\/code> function instead passes a <strong>single string<\/strong> to the system shell, which interprets it.<\/span> <span class=\"sg\" data-s=\"1\">This lets you use shell features like pipes and redirection:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the shell runs <code>echo<\/code>, pipes its output through <code>tr<\/code>, and prints <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The convenience comes with a caution: because the shell parses the string, building a <code>shell<\/code> command from untrusted input is dangerous.<\/span> <span class=\"sg\" data-s=\"2\">Prefer <code>run<\/code> unless you specifically need shell features.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Both return a <code>Proc<\/code> object describing how the program finished.<\/span> <span class=\"sg\" data-s=\"1\">By default, the launched program shares your program’s output, so what it prints appears on screen.<\/span> <span class=\"sg\" data-s=\"2\">To capture that output instead, you ask for it — the subject of the next topic.<\/span><\/p>"]]},"de":{"t":"run und shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt zwei Wege, ein externes Programm zu starten.<\/span> <span class=\"sg\" data-s=\"1\">Die Funktion <code>run<\/code> nimmt den Befehl und seine Argumente als <strong>getrennte<\/strong> Werte und führt das Programm unmittelbar aus, ohne eine Shell einzubeziehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das führt das Programm <code>echo<\/code> mit dem einzigen Argument <code>hello<\/code> aus, was <code>hello<\/code> ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">Weil die Argumente getrennt übergeben werden, besteht keine Gefahr, dass die Shell Leerzeichen oder Sonderzeichen falsch deutet — <code>run<\/code> ist die sichere Standardwahl.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Funktion <code>shell<\/code> übergibt stattdessen eine <strong>einzelne Zeichenkette<\/strong> an die System-Shell, die sie auswertet.<\/span> <span class=\"sg\" data-s=\"1\">Damit können Sie Shell-Möglichkeiten wie Pipes und Umleitungen nutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier führt die Shell <code>echo<\/code> aus, leitet dessen Ausgabe durch <code>tr<\/code> und gibt <code>HELLO<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Die Bequemlichkeit kommt mit einer Warnung: Weil die Shell die Zeichenkette zerlegt, ist es gefährlich, einen <code>shell<\/code>-Befehl aus nicht vertrauenswürdiger Eingabe zusammenzusetzen.<\/span> <span class=\"sg\" data-s=\"2\">Ziehen Sie <code>run<\/code> vor, solange Sie nicht ausdrücklich Shell-Möglichkeiten brauchen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide liefern ein <code>Proc<\/code>-Objekt, das beschreibt, wie das Programm geendet hat.<\/span> <span class=\"sg\" data-s=\"1\">Standardmäßig teilt sich das gestartete Programm die Ausgabe Ihres Programms, was es ausgibt, erscheint also am Bildschirm.<\/span> <span class=\"sg\" data-s=\"2\">Um diese Ausgabe stattdessen aufzufangen, fordern Sie sie an — das Thema des nächsten Abschnitts.<\/span><\/p>"]]},"nl":{"t":"run en shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee manieren om een extern programma te starten.<\/span> <span class=\"sg\" data-s=\"1\">De functie <code>run<\/code> neemt het commando en zijn argumenten als <strong>afzonderlijke<\/strong> waarden en draait het programma rechtstreeks, zonder een shell erbij te betrekken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit draait het programma <code>echo<\/code> met het enkele argument <code>hello<\/code>, wat <code>hello<\/code> afdrukt.<\/span> <span class=\"sg\" data-s=\"1\">Omdat de argumenten apart meegegeven worden, bestaat er geen risico dat de shell spaties of bijzondere tekens verkeerd interpreteert — <code>run<\/code> is de veilige standaardkeuze.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De functie <code>shell<\/code> geeft in plaats daarvan één <strong>enkele string<\/strong> aan de systeemshell, die hem interpreteert.<\/span> <span class=\"sg\" data-s=\"1\">Zo kun je shellmogelijkheden als pipes en omleiding gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier draait de shell <code>echo<\/code>, sluist de uitvoer door <code>tr<\/code> en drukt <code>HELLO<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">Het gemak komt met een waarschuwing: omdat de shell de string ontleedt, is een <code>shell<\/code>-commando opbouwen uit onbetrouwbare invoer gevaarlijk.<\/span> <span class=\"sg\" data-s=\"2\">Geef de voorkeur aan <code>run<\/code> tenzij je specifiek shellmogelijkheden nodig hebt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide geven een <code>Proc<\/code>-object terug dat beschrijft hoe het programma geëindigd is.<\/span> <span class=\"sg\" data-s=\"1\">Standaard deelt het gestarte programma de uitvoer van jouw programma, dus wat het afdrukt verschijnt op het scherm.<\/span> <span class=\"sg\" data-s=\"2\">Om die uitvoer in plaats daarvan op te vangen, vraag je erom — het onderwerp van het volgende onderdeel.<\/span><\/p>"]]},"es":{"t":"run y shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay dos maneras de lanzar un programa externo.<\/span> <span class=\"sg\" data-s=\"1\">La función <code>run<\/code> toma la orden y sus argumentos como valores <strong>separados<\/strong> y ejecuta el programa directamente, sin implicar a ninguna shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto ejecuta el programa <code>echo<\/code> con el único argumento <code>hello<\/code>, que imprime <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Como los argumentos se pasan por separado, no hay riesgo de que la shell interprete mal espacios o caracteres especiales: <code>run<\/code> es la opción segura por omisión.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La función <code>shell<\/code>, en cambio, pasa una <strong>única cadena<\/strong> a la shell del sistema, que la interpreta.<\/span> <span class=\"sg\" data-s=\"1\">Esto te permite usar funcionalidades de la shell como las tuberías y las redirecciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí la shell ejecuta <code>echo<\/code>, encauza su salida a través de <code>tr<\/code> e imprime <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La comodidad viene con una advertencia: como la shell analiza la cadena, construir una orden <code>shell<\/code> a partir de entrada no fiable es peligroso.<\/span> <span class=\"sg\" data-s=\"2\">Prefiere <code>run<\/code> salvo que necesites expresamente funcionalidades de la shell.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ambas devuelven un objeto <code>Proc<\/code> que describe cómo terminó el programa.<\/span> <span class=\"sg\" data-s=\"1\">Por omisión, el programa lanzado comparte la salida de tu programa, así que lo que imprime aparece en la pantalla.<\/span> <span class=\"sg\" data-s=\"2\">Para capturar esa salida hay que pedirlo, y ese es el tema de la página siguiente.<\/span><\/p>"]]},"it":{"t":"run e shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono due modi per lanciare un programma esterno.<\/span> <span class=\"sg\" data-s=\"1\">La funzione <code>run<\/code> prende il comando e i suoi argomenti come valori <strong>separati<\/strong> ed esegue il programma direttamente, senza coinvolgere una shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo esegue il programma <code>echo<\/code> con il singolo argomento <code>hello<\/code>, che stampa <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poiché gli argomenti sono passati separatamente, non c'è il rischio che la shell interpreti male spazi o caratteri speciali: <code>run<\/code> è la scelta predefinita sicura.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>shell<\/code>, invece, passa una <strong>singola stringa<\/strong> alla shell di sistema, che la interpreta.<\/span> <span class=\"sg\" data-s=\"1\">Questo ti permette di usare funzionalità della shell come le pipe e le redirezioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui la shell esegue <code>echo<\/code>, passa il suo output attraverso <code>tr<\/code> e stampa <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La comodità viene con un avvertimento: poiché la shell analizza la stringa, costruire un comando <code>shell<\/code> a partire da input non fidato è pericoloso.<\/span> <span class=\"sg\" data-s=\"2\">Preferisci <code>run<\/code> a meno che non ti servano espressamente funzionalità della shell.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Entrambe restituiscono un oggetto <code>Proc<\/code> che descrive come il programma è terminato.<\/span> <span class=\"sg\" data-s=\"1\">Per impostazione predefinita il programma lanciato condivide l'output del tuo programma, quindi ciò che stampa compare sullo schermo.<\/span> <span class=\"sg\" data-s=\"2\">Per catturare invece quell'output, devi chiederlo — ed è l'argomento della prossima pagina.<\/span><\/p>"]]},"lv":{"t":"run un shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ārēju programmu var palaist divējādi.<\/span> <span class=\"sg\" data-s=\"1\">Funkcija <code>run<\/code> ņem komandu un tās argumentus kā <strong>atsevišķas<\/strong> vērtības un palaiž programmu tieši, neiesaistot čaulu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas palaiž programmu <code>echo<\/code> ar vienu argumentu <code>hello<\/code>, kas izdrukā <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā argumenti tiek padoti atsevišķi, nav riska, ka čaula nepareizi iztulkotu atstarpes vai īpašās rakstzīmes — <code>run<\/code> ir drošais noklusējums.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>shell<\/code> tā vietā padod sistēmas čaulai <strong>vienu virkni<\/strong>, ko tā iztulko.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj izmantot čaulas iespējas, piemēram, caurules un novirzīšanu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit čaula palaiž <code>echo<\/code>, izvada tā izvadi caur <code>tr<\/code> un izdrukā <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ērtums nāk ar brīdinājumu: tā kā čaula virkni parsē, <code>shell<\/code> komandas būvēšana no neuzticamas ievades ir bīstama.<\/span> <span class=\"sg\" data-s=\"2\">Dodiet priekšroku <code>run<\/code>, ja vien jums nav tieši vajadzīgas čaulas iespējas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Abas atgriež <code>Proc<\/code> objektu, kas apraksta, kā programma beidza darbu.<\/span> <span class=\"sg\" data-s=\"1\">Pēc noklusējuma palaistā programma dala jūsu programmas izvadi, tāpēc tās izdrukātais parādās ekrānā.<\/span> <span class=\"sg\" data-s=\"2\">Lai šo izvadi tā vietā noķertu, tā ir jāpieprasa — un tas ir nākamā temata priekšmets.<\/span><\/p>"]]},"ru":{"t":"run и shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустить внешнюю программу можно двумя способами.<\/span> <span class=\"sg\" data-s=\"1\">Функция <code>run<\/code> принимает команду и её аргументы как <strong>отдельные<\/strong> значения и запускает программу напрямую, без участия оболочки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь запускается программа <code>echo<\/code> с единственным аргументом <code>hello<\/code>, которая печатает <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку аргументы передаются по отдельности, нет риска, что оболочка неверно истолкует пробелы или специальные символы: <code>run<\/code> — безопасный выбор по умолчанию.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функция <code>shell<\/code>, наоборот, передаёт <strong>одну строку<\/strong> системной оболочке, которая её разбирает.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет пользоваться возможностями оболочки — конвейерами и перенаправлением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь оболочка запускает <code>echo<\/code>, пропускает его вывод через <code>tr<\/code> и печатает <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За удобство приходится платить осторожностью: раз строку разбирает оболочка, собирать команду для <code>shell<\/code> из недоверенных данных опасно.<\/span> <span class=\"sg\" data-s=\"2\">Предпочитайте <code>run<\/code>, если вам не нужны именно возможности оболочки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обе функции возвращают объект <code>Proc<\/code>, описывающий, как завершилась программа.<\/span> <span class=\"sg\" data-s=\"1\">По умолчанию запущенная программа делит вывод с вашей программой, поэтому напечатанное ею появляется на экране.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы вместо этого перехватить вывод, его надо запросить — этому посвящена следующая тема.<\/span><\/p>"]]},"uk":{"t":"run та shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Є два способи запустити зовнішню програму.<\/span> <span class=\"sg\" data-s=\"1\">Функція <code>run<\/code> бере команду та її аргументи як <strong>окремі<\/strong> значення й виконує програму напряму, не залучаючи оболонки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це запускає програму <code>echo<\/code> з єдиним аргументом <code>hello<\/code>, що виводить <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки аргументи передаються окремо, немає ризику, що оболонка неправильно витлумачить пробіли чи особливі символи, — <code>run<\/code> є безпечним вибором за замовчуванням.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функція <code>shell<\/code> натомість передає <strong>один рядок<\/strong> системній оболонці, яка його тлумачить.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє користуватися можливостями оболонки на кшталт каналів і перенаправлень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут оболонка запускає <code>echo<\/code>, пропускає його вивід через <code>tr<\/code> і виводить <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ця зручність приходить із засторогою: оскільки оболонка розбирає рядок, будувати команду для <code>shell<\/code> із недовіреного вводу небезпечно.<\/span> <span class=\"sg\" data-s=\"2\">Віддавайте перевагу <code>run<\/code>, якщо вам не потрібні саме можливості оболонки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обидві повертають об'єкт <code>Proc<\/code>, який описує, як програма завершилася.<\/span> <span class=\"sg\" data-s=\"1\">За замовчуванням запущена програма ділить вивід із вашою програмою, тож те, що вона друкує, з'являється на екрані.<\/span> <span class=\"sg\" data-s=\"2\">Щоб натомість перехопити цей вивід, треба про це попросити, — це тема наступного розділу.<\/span><\/p>"]]},"bg":{"t":"run и shell","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Има два начина да стартирате външна програма.<\/span> <span class=\"sg\" data-s=\"1\">Функцията <code>run<\/code> приема командата и аргументите ѝ като <strong>отделни<\/strong> стойности и изпълнява програмата направо, без да намесва обвивка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това изпълнява програмата <code>echo<\/code> с единствения аргумент <code>hello<\/code>, което отпечатва <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Понеже аргументите се подават поотделно, няма опасност обвивката да разтълкува погрешно интервали или специални символи — <code>run<\/code> е безопасният избор по подразбиране.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>shell<\/code> вместо това подава <strong>един-единствен низ<\/strong> на системната обвивка, която го тълкува.<\/span> <span class=\"sg\" data-s=\"1\">Това ви позволява да използвате възможности на обвивката като канали и пренасочване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук обвивката изпълнява <code>echo<\/code>, прекарва изхода му през <code>tr<\/code> и отпечатва <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Удобството идва с предупреждение: понеже обвивката разбира низа, изграждането на команда за <code>shell<\/code> от недоверен вход е опасно.<\/span> <span class=\"sg\" data-s=\"2\">Предпочитайте <code>run<\/code>, освен ако конкретно не ви трябват възможности на обвивката.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">И двете връщат обект <code>Proc<\/code>, който описва как е приключила програмата.<\/span> <span class=\"sg\" data-s=\"1\">По подразбиране стартираната програма споделя изхода на вашата програма, така че онова, което тя отпечатва, се появява на екрана.<\/span> <span class=\"sg\" data-s=\"2\">За да уловите този изход вместо това, трябва да го поискате — това е темата на следващия раздел.<\/span><\/p>"]]}}}</script>
