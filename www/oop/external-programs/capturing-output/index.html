<script type="application/json" id="page-data">{"u":"oop/external-programs/capturing-output","n":908,"k":"topic","pv":"oop/external-programs/run-and-shell/quiz","nx":"oop/external-programs/the-proc-object","tr":["oop","oop/external-programs"],"L":{"en":{"t":"Capturing output","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To read what an external program prints rather than letting it go to the screen, pass <code>:out<\/code> when launching it.<\/span> <span class=\"sg\" data-s=\"1\">The returned <code>Proc<\/code> then has an <code>.out<\/code> handle you can read from:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> redirects the program’s standard output into the <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.out<\/code> handle works like the file handles from the previous section, and <code>.slurp<\/code> reads everything from it at once.<\/span> <span class=\"sg\" data-s=\"2\">The <code>:close<\/code> adverb is a handy shortcut: after reading, it closes the handle for you — the same tidy-up you did explicitly with <code>.close<\/code> on a file handle — so nothing is left open.<\/span> <span class=\"sg\" data-s=\"3\">Finally, <code>.chomp<\/code> removes the trailing newline that <code>echo<\/code> adds.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same works with <code>shell<\/code>, which is handy for capturing the result of a pipeline:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can capture the error stream too, with <code>:err<\/code> and the matching <code>.err<\/code> handle.<\/span> <span class=\"sg\" data-s=\"1\">Passing both <code>:out<\/code> and <code>:err<\/code> keeps the two streams apart, each in its own handle, so you can read them separately:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, the shell command prints one line to standard output and one to standard error (<code>&gt;&amp;2<\/code> redirects to it).<\/span> <span class=\"sg\" data-s=\"1\">Because we asked for both streams, <code>.out<\/code> and <code>.err<\/code> hold them independently — the program’s normal output never gets mixed up with its diagnostics.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Capturing output is how you use an external program as a building block — run it, read its result, and carry on with that data in your own program.<\/span><\/p>"]]},"de":{"t":"Ausgabe auffangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um zu lesen, was ein externes Programm ausgibt, statt es an den Bildschirm gehen zu lassen, übergeben Sie beim Starten <code>:out<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das gelieferte <code>Proc<\/code> hat dann einen Handle <code>.out<\/code>, aus dem Sie lesen können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> leitet die Standardausgabe des Programms in das <code>Proc<\/code> um.<\/span> <span class=\"sg\" data-s=\"1\">Der Handle <code>.out<\/code> funktioniert wie die Dateihandles aus dem vorigen Abschnitt, und <code>.slurp<\/code> liest auf einmal alles daraus.<\/span> <span class=\"sg\" data-s=\"2\">Das Adverb <code>:close<\/code> ist eine praktische Abkürzung: Nach dem Lesen schließt es den Handle für Sie — dasselbe Aufräumen, das Sie bei einem Dateihandle ausdrücklich mit <code>.close<\/code> gemacht haben —, sodass nichts offen bleibt.<\/span> <span class=\"sg\" data-s=\"3\">Schließlich entfernt <code>.chomp<\/code> den abschließenden Zeilenumbruch, den <code>echo<\/code> anfügt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dasselbe funktioniert mit <code>shell<\/code>, was praktisch ist, um das Ergebnis einer Pipeline aufzufangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können auch den Fehlerstrom auffangen, mit <code>:err<\/code> und dem zugehörigen Handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sowohl <code>:out<\/code> als auch <code>:err<\/code> zu übergeben hält die beiden Ströme getrennt, jeden in seinem eigenen Handle, sodass Sie sie einzeln lesen können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier gibt der Shell-Befehl eine Zeile auf der Standardausgabe und eine auf der Standardfehlerausgabe aus (<code>&gt;&amp;2<\/code> leitet dorthin um).<\/span> <span class=\"sg\" data-s=\"1\">Weil wir beide Ströme angefordert haben, enthalten <code>.out<\/code> und <code>.err<\/code> sie unabhängig voneinander — die gewöhnliche Ausgabe des Programms vermischt sich nie mit seiner Diagnose.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ausgabe aufzufangen ist der Weg, ein externes Programm als Baustein zu verwenden — führen Sie es aus, lesen Sie sein Ergebnis und arbeiten Sie mit diesen Daten in Ihrem eigenen Programm weiter.<\/span><\/p>"]]},"nl":{"t":"Uitvoer opvangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om te lezen wat een extern programma afdrukt in plaats van het naar het scherm te laten gaan, geef je <code>:out<\/code> mee bij het starten.<\/span> <span class=\"sg\" data-s=\"1\">De teruggegeven <code>Proc<\/code> heeft dan een handle <code>.out<\/code> waaruit je kunt lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> leidt de standaarduitvoer van het programma de <code>Proc<\/code> in.<\/span> <span class=\"sg\" data-s=\"1\">De handle <code>.out<\/code> werkt als de bestandshandles uit de vorige sectie, en <code>.slurp<\/code> leest er in één keer alles uit.<\/span> <span class=\"sg\" data-s=\"2\">Het bijwoord <code>:close<\/code> is een handige afkorting: na het lezen sluit het de handle voor je — dezelfde opruiming die je met <code>.close<\/code> op een bestandshandle expliciet deed — zodat er niets open blijft staan.<\/span> <span class=\"sg\" data-s=\"3\">Ten slotte haalt <code>.chomp<\/code> de afsluitende newline weg die <code>echo<\/code> toevoegt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde werkt met <code>shell<\/code>, wat handig is om het resultaat van een pipeline op te vangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook de foutstroom opvangen, met <code>:err<\/code> en de bijbehorende handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zowel <code>:out<\/code> als <code>:err<\/code> meegeven houdt de twee stromen apart, elk in een eigen handle, zodat je ze los kunt lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier drukt het shellcommando één regel naar de standaarduitvoer af en één naar de standaardfout (<code>&gt;&amp;2<\/code> leidt daarheen om).<\/span> <span class=\"sg\" data-s=\"1\">Omdat we om beide stromen gevraagd hebben, bevatten <code>.out<\/code> en <code>.err<\/code> ze onafhankelijk — de gewone uitvoer van het programma raakt nooit vermengd met zijn diagnostiek.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Uitvoer opvangen is hoe je een extern programma als bouwsteen gebruikt — draai het, lees zijn resultaat, en ga met die gegevens verder in je eigen programma.<\/span><\/p>"]]},"es":{"t":"Capturar la salida","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para leer lo que imprime un programa externo en lugar de dejar que vaya a la pantalla, pásale <code>:out<\/code> al lanzarlo.<\/span> <span class=\"sg\" data-s=\"1\">El <code>Proc<\/code> devuelto tiene entonces un manejador <code>.out<\/code> del que puedes leer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> redirige la salida estándar del programa hacia el <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El manejador <code>.out<\/code> funciona como los manejadores de archivo de la sección anterior, y <code>.slurp<\/code> lee todo de una vez.<\/span> <span class=\"sg\" data-s=\"2\">El adverbio <code>:close<\/code> es un atajo cómodo: tras la lectura cierra el manejador por ti — el mismo aseo que hacías explícitamente con <code>.close<\/code> sobre un manejador de archivo —, así que no queda nada abierto.<\/span> <span class=\"sg\" data-s=\"3\">Por último, <code>.chomp<\/code> quita el salto de línea final que añade <code>echo<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo mismo vale con <code>shell<\/code>, lo que resulta cómodo para capturar el resultado de una tubería:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes capturar el flujo de errores, con <code>:err<\/code> y el manejador <code>.err<\/code> correspondiente.<\/span> <span class=\"sg\" data-s=\"1\">Pasar tanto <code>:out<\/code> como <code>:err<\/code> mantiene los dos flujos separados, cada uno en su propio manejador, para que puedas leerlos por separado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí la orden de la shell imprime una línea en la salida estándar y otra en el error estándar (<code>&gt;&amp;2<\/code> redirige hacia él).<\/span> <span class=\"sg\" data-s=\"1\">Como hemos pedido ambos flujos, <code>.out<\/code> y <code>.err<\/code> los contienen de forma independiente: la salida normal del programa nunca se mezcla con su diagnóstico.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Capturar la salida es la manera de usar un programa externo como pieza de construcción: lo ejecutas, lees su resultado y sigues adelante con esos datos en tu propio programa.<\/span><\/p>"]]},"it":{"t":"Catturare l'output","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per leggere ciò che un programma esterno stampa invece di lasciarlo andare sullo schermo, passa <code>:out<\/code> quando lo lanci.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>Proc<\/code> restituito ha allora un handle <code>.out<\/code> da cui puoi leggere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> redirige l'output standard del programma dentro il <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'handle <code>.out<\/code> funziona come gli handle di file della sezione precedente, e <code>.slurp<\/code> ne legge tutto in una volta.<\/span> <span class=\"sg\" data-s=\"2\">L'avverbio <code>:close<\/code> è una comoda scorciatoia: dopo la lettura chiude l'handle al posto tuo — lo stesso riordino che facevi esplicitamente con <code>.close<\/code> su un handle di file — così non resta nulla di aperto.<\/span> <span class=\"sg\" data-s=\"3\">Infine <code>.chomp<\/code> toglie il ritorno a capo finale che <code>echo<\/code> aggiunge.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo stesso vale con <code>shell<\/code>, il che è comodo per catturare il risultato di una pipeline:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi catturare anche il flusso degli errori, con <code>:err<\/code> e il corrispondente handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Passare sia <code>:out<\/code> sia <code>:err<\/code> tiene i due flussi separati, ciascuno nel proprio handle, così puoi leggerli separatamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui il comando della shell stampa una riga sull'output standard e una sull'errore standard (<code>&gt;&amp;2<\/code> vi redirige).<\/span> <span class=\"sg\" data-s=\"1\">Poiché abbiamo chiesto entrambi i flussi, <code>.out<\/code> e <code>.err<\/code> li contengono in modo indipendente: l'output normale del programma non si mescola mai con la sua diagnostica.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Catturare l'output è il modo in cui usi un programma esterno come mattoncino: eseguilo, leggine il risultato e prosegui con quei dati nel tuo programma.<\/span><\/p>"]]},"lv":{"t":"Izvades pārtveršana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai nolasītu to, ko ārēja programma izdrukā, nevis ļautu tam aiziet uz ekrānu, palaižot padodiet <code>:out<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atgrieztajam <code>Proc<\/code> tad ir turis <code>.out<\/code>, no kura var lasīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> novirza programmas standarta izvadi <code>Proc<\/code> iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Turis <code>.out<\/code> darbojas kā failu turi no iepriekšējās sadaļas, un <code>.slurp<\/code> no tā uzreiz nolasa visu.<\/span> <span class=\"sg\" data-s=\"2\">Apstākļvārds <code>:close<\/code> ir ērts saīsinājums: pēc nolasīšanas tas aizver turi jūsu vietā — tā pati sakopšana, ko skaidri veicāt ar <code>.close<\/code> uz faila tura —, tāpēc nekas nepaliek atvērts.<\/span> <span class=\"sg\" data-s=\"3\">Visbeidzot <code>.chomp<\/code> noņem beigu jauno rindu, ko <code>echo<\/code> pievieno.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas pats darbojas ar <code>shell<\/code>, kas noder cauruļvada rezultāta noķeršanai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noķert var arī kļūdu plūsmu — ar <code>:err<\/code> un atbilstošo turi <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Padodot gan <code>:out<\/code>, gan <code>:err<\/code>, abas plūsmas paliek nošķirtas, katra savā turī, tāpēc tās var lasīt atsevišķi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit čaulas komanda izdrukā vienu rindu standarta izvadē un vienu standarta kļūdu plūsmā (<code>&gt;&amp;2<\/code> uz to novirza).<\/span> <span class=\"sg\" data-s=\"1\">Tā kā prasījām abas plūsmas, <code>.out<\/code> un <code>.err<\/code> tās satur neatkarīgi — programmas parastā izvade nekad nesajaucas ar tās diagnostiku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izvades noķeršana ir veids, kā ārēju programmu izmantot par būvbloku: palaidiet to, nolasiet tās rezultātu un turpiniet ar šiem datiem savā programmā.<\/span><\/p>"]]},"ru":{"t":"Захват вывода","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы прочитать то, что печатает внешняя программа, а не отпускать это на экран, передайте при запуске <code>:out<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У возвращённого <code>Proc<\/code> появится дескриптор <code>.out<\/code>, из которого можно читать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> перенаправляет стандартный вывод программы в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Дескриптор <code>.out<\/code> работает так же, как файловые дескрипторы из предыдущего раздела, а <code>.slurp<\/code> читает из него всё сразу.<\/span> <span class=\"sg\" data-s=\"2\">Наречие <code>:close<\/code> — удобное сокращение: после чтения оно закрывает дескриптор за вас, то есть выполняет ту же уборку, которую вы делали явным <code>.close<\/code> у файлового дескриптора, — так ничего не остаётся открытым.<\/span> <span class=\"sg\" data-s=\"3\">Наконец, <code>.chomp<\/code> убирает завершающий перевод строки, который добавляет <code>echo<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">То же работает и с <code>shell<\/code>, что удобно для перехвата результата конвейера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехватить можно и поток ошибок — с помощью <code>:err<\/code> и соответствующего дескриптора <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если передать и <code>:out<\/code>, и <code>:err<\/code>, потоки останутся раздельными, каждый в своём дескрипторе, и их можно читать по отдельности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь команда оболочки печатает одну строку в стандартный вывод и одну — в стандартный поток ошибок (<code>&gt;&amp;2<\/code> перенаправляет туда).<\/span> <span class=\"sg\" data-s=\"1\">Поскольку мы запросили оба потока, <code>.out<\/code> и <code>.err<\/code> держат их независимо: обычный вывод программы не смешивается с её диагностикой.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Захват вывода — это способ использовать внешнюю программу как строительный блок: запустить её, прочитать результат и продолжить работать с этими данными в собственной программе.<\/span><\/p>"]]},"uk":{"t":"Перехоплення виводу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб прочитати те, що виводить зовнішня програма, замість пускати це на екран, передайте <code>:out<\/code> під час запуску.<\/span> <span class=\"sg\" data-s=\"1\">Повернений <code>Proc<\/code> тоді має дескриптор <code>.out<\/code>, з якого можна читати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> перенаправляє стандартний вивід програми в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Дескриптор <code>.out<\/code> працює як дескриптори файлів із попереднього розділу, а <code>.slurp<\/code> зчитує з нього все за раз.<\/span> <span class=\"sg\" data-s=\"2\">Наріччя <code>:close<\/code> є зручним скороченням: після читання воно закриває дескриптор за вас — те саме прибирання, яке ви явно робили через <code>.close<\/code> для дескриптора файлу, — тож нічого не лишається відкритим.<\/span> <span class=\"sg\" data-s=\"3\">Нарешті <code>.chomp<\/code> прибирає завершальний перехід рядка, який додає <code>echo<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так само працює й <code>shell<\/code>, що стає в пригоді для перехоплення результату конвеєра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехопити можна й потік помилок — через <code>:err<\/code> і відповідний дескриптор <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Передача одразу <code>:out<\/code> і <code>:err<\/code> тримає ці два потоки нарізно, кожен у своєму дескрипторі, тож їх можна читати окремо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут команда оболонки виводить один рядок у стандартний вивід і один — у стандартний потік помилок (<code>&gt;&amp;2<\/code> туди перенаправляє).<\/span> <span class=\"sg\" data-s=\"1\">Оскільки ми попросили обидва потоки, <code>.out<\/code> та <code>.err<\/code> тримають їх незалежно — звичайний вивід програми ніколи не змішується з її діагностикою.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перехоплення виводу — це спосіб використати зовнішню програму як будівельний блок: запустити її, прочитати результат і рушити далі з цими даними у власній програмі.<\/span><\/p>"]]},"bg":{"t":"Улавяне на изхода","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За да прочетете какво отпечатва външна програма, вместо да я оставите да го изсипе на екрана, подайте <code>:out<\/code> при стартирането ѝ. Върнатият <code>Proc<\/code> тогава има манипулатор <code>.out<\/code>, от който можете да четете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> пренасочва стандартния изход на програмата в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Манипулаторът <code>.out<\/code> работи като манипулаторите на файлове от предишния раздел, а <code>.slurp<\/code> прочита всичко от него наведнъж.<\/span> <span class=\"sg\" data-s=\"2\">Прислужникът <code>:close<\/code> е удобно скъсяване: след четенето той затваря манипулатора вместо вас — същото прибиране, което правехте изрично с <code>.close<\/code> върху манипулатор на файл, — така че нищо не остава отворено.<\/span> <span class=\"sg\" data-s=\"3\">Накрая <code>.chomp<\/code> премахва завършващия нов ред, който <code>echo<\/code> добавя.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същото работи и с <code>shell<\/code>, което е удобно за улавяне на резултата от конвейер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да уловите и потока за грешки с <code>:err<\/code> и съответния манипулатор <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подаването и на <code>:out<\/code>, и на <code>:err<\/code> държи двата потока разделени, всеки в свой манипулатор, така че можете да ги четете поотделно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук командата на обвивката отпечатва един ред в стандартния изход и един в стандартната грешка (<code>&gt;&amp;2<\/code> пренасочва натам).<\/span> <span class=\"sg\" data-s=\"1\">Понеже поискахме и двата потока, <code>.out<\/code> и <code>.err<\/code> ги държат независимо — нормалният изход на програмата никога не се смесва с диагностиката ѝ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Улавянето на изхода е начинът да използвате външна програма като градивен блок — изпълнете я, прочетете резултата ѝ и продължете с тези данни в собствената си програма.<\/span><\/p>"]]}}}</script>
