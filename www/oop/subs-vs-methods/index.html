<script type="application/json" id="page-data">{"u":"oop/subs-vs-methods","n":809,"k":"section","pv":"oop/class-methods/quiz","nx":"oop/subs-vs-methods/exercises","tr":["oop"],"L":{"en":{"t":"Subroutines vs methods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You now have two ways to package a piece of behaviour: a <em>subroutine<\/em> and a <em>method<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">They look similar but are used differently.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A subroutine stands on its own.<\/span> <span class=\"sg\" data-s=\"1\">You call it by its name and pass it everything it needs as arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A method belongs to a class and is called on an object with the dot.<\/span> <span class=\"sg\" data-s=\"1\">It can use the object’s own data through <code>self<\/code> and the attribute accessors, so you do not pass that data in:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Both compute the same number.<\/span> <span class=\"sg\" data-s=\"1\">The difference is where the data comes from: the subroutine receives the radius as an argument, while the method reads it from the object it was called on.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">As a rule of thumb, use a subroutine for a standalone operation that simply transforms its arguments, and a method when the behaviour naturally belongs to an object and works with that object’s own state.<\/span> <span class=\"sg\" data-s=\"1\">For class-specific, but generic routines, use class methods.<\/span><\/p>"]]},"de":{"t":"Subroutinen versus Methoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie haben nun zwei Möglichkeiten, ein Stück Verhalten zu verpacken: eine <em>Subroutine<\/em> und eine <em>Methode<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sie sehen ähnlich aus, werden aber unterschiedlich verwendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine steht für sich.<\/span> <span class=\"sg\" data-s=\"1\">Sie rufen sie über ihren Namen auf und übergeben ihr alles Nötige als Argumente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Methode gehört zu einer Klasse und wird mit dem Punkt auf einem Objekt aufgerufen.<\/span> <span class=\"sg\" data-s=\"1\">Sie kann über <code>self<\/code> und die Attribut-Accessoren die eigenen Daten des Objekts verwenden, diese Daten übergeben Sie also nicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide berechnen dieselbe Zahl.<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied liegt darin, woher die Daten kommen: Die Subroutine erhält den Radius als Argument, während die Methode ihn von dem Objekt liest, auf dem sie aufgerufen wurde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als Faustregel: Nehmen Sie eine Subroutine für eine eigenständige Operation, die einfach ihre Argumente umwandelt, und eine Methode, wenn das Verhalten von Natur aus zu einem Objekt gehört und mit dessen eigenem Zustand arbeitet.<\/span> <span class=\"sg\" data-s=\"1\">Für klassenspezifische, aber allgemeine Routinen nehmen Sie Klassenmethoden.<\/span><\/p>"]]},"nl":{"t":"Subroutines versus methoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt nu twee manieren om een stuk gedrag te verpakken: een <em>subroutine<\/em> en een <em>methode<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ze lijken op elkaar maar worden verschillend gebruikt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een subroutine staat op zichzelf.<\/span> <span class=\"sg\" data-s=\"1\">Je roept hem bij naam aan en geeft hem alles wat hij nodig heeft als argumenten mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een methode hoort bij een klasse en wordt met de punt op een object aangeroepen.<\/span> <span class=\"sg\" data-s=\"1\">Ze kan via <code>self<\/code> en de accessors van de attributen de eigen gegevens van het object gebruiken, dus die gegevens geef je niet mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide berekenen hetzelfde getal.<\/span> <span class=\"sg\" data-s=\"1\">Het verschil zit in waar de gegevens vandaan komen: de subroutine krijgt de straal als argument, terwijl de methode hem afleest van het object waarop ze is aangeroepen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als vuistregel: gebruik een subroutine voor een op zichzelf staande bewerking die eenvoudigweg haar argumenten omzet, en een methode wanneer het gedrag van nature bij een object hoort en met de eigen toestand van dat object werkt.<\/span> <span class=\"sg\" data-s=\"1\">Voor klassespecifieke maar generieke routines gebruik je klassemethoden.<\/span><\/p>"]]},"es":{"t":"Subrutinas y métodos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya tienes dos maneras de empaquetar un comportamiento: una <em>subrutina<\/em> y un <em>método<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Se parecen, pero se usan de forma distinta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina se sostiene sola.<\/span> <span class=\"sg\" data-s=\"1\">La llamas por su nombre y le pasas como argumentos todo lo que necesita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un método pertenece a una clase y se llama sobre un objeto con el punto.<\/span> <span class=\"sg\" data-s=\"1\">Puede usar los datos del propio objeto a través de <code>self<\/code> y de los accesores de los atributos, así que esos datos no se los pasas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambos calculan el mismo número.<\/span> <span class=\"sg\" data-s=\"1\">La diferencia está en de dónde vienen los datos: la subrutina recibe el radio como argumento, mientras que el método lo lee del objeto sobre el que se llamó.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como regla práctica, usa una subrutina para una operación aislada que se limite a transformar sus argumentos, y un método cuando el comportamiento pertenezca naturalmente a un objeto y trabaje con el estado de ese objeto.<\/span> <span class=\"sg\" data-s=\"1\">Para rutinas propias de la clase pero genéricas, usa métodos de clase.<\/span><\/p>"]]},"it":{"t":"Subroutine e metodi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora hai due modi per impacchettare un comportamento: una <em>subroutine<\/em> e un <em>metodo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Si somigliano ma si usano in modo diverso.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine sta da sola.<\/span> <span class=\"sg\" data-s=\"1\">La chiami per nome e le passi come argomenti tutto ciò che le serve:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metodo appartiene a una classe e viene chiamato su un oggetto con il punto.<\/span> <span class=\"sg\" data-s=\"1\">Può usare i dati dell'oggetto stesso attraverso <code>self<\/code> e gli accessori degli attributi, quindi quei dati non glieli passi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entrambi calcolano lo stesso numero.<\/span> <span class=\"sg\" data-s=\"1\">La differenza è da dove arrivano i dati: la subroutine riceve il raggio come argomento, mentre il metodo lo legge dall'oggetto su cui è stato chiamato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come regola pratica, usa una subroutine per un'operazione a sé stante che si limita a trasformare i suoi argomenti, e un metodo quando il comportamento appartiene naturalmente a un oggetto e lavora con lo stato di quell'oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Per routine specifiche della classe ma generiche, usa i metodi di classe.<\/span><\/p>"]]},"lv":{"t":"Apakšprogrammas un metodes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad jums ir divi veidi, kā iepakot kādu uzvedību: <em>apakšprogramma<\/em> un <em>metode<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tās izskatās līdzīgi, taču tiek lietotas dažādi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma stāv pati par sevi.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to izsaucat pēc nosaukuma un padodat tai visu vajadzīgo kā argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode pieder klasei, un to izsauc uz objekta ar punktu.<\/span> <span class=\"sg\" data-s=\"1\">Tā var izmantot objekta paša datus caur <code>self<\/code> un atribūtu piekļuves metodēm, tāpēc šos datus jums nav jāpadod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Abas aprēķina to pašu skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirība ir tur, no kurienes nāk dati: apakšprogramma rādiusu saņem kā argumentu, bet metode to nolasa no objekta, uz kura tā tika izsaukta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kā īkšķa likums: izmantojiet apakšprogrammu patstāvīgai darbībai, kas vienkārši pārveido savus argumentus, un metodi tad, kad uzvedība dabiski pieder objektam un strādā ar šī objekta paša stāvokli.<\/span> <span class=\"sg\" data-s=\"1\">Klasei specifiskām, bet vispārīgām rutīnām izmantojiet klases metodes.<\/span><\/p>"]]},"ru":{"t":"Подпрограммы и методы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь у вас есть два способа упаковать некоторое поведение: <em>подпрограмма<\/em> и <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Выглядят они похоже, но используются по-разному.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма существует сама по себе.<\/span> <span class=\"sg\" data-s=\"1\">Вы вызываете её по имени и передаёте ей всё необходимое в виде аргументов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод принадлежит классу и вызывается у объекта через точку.<\/span> <span class=\"sg\" data-s=\"1\">Он может пользоваться собственными данными объекта через <code>self<\/code> и аксессоры атрибутов, поэтому передавать эти данные не нужно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оба варианта вычисляют одно и то же число.<\/span> <span class=\"sg\" data-s=\"1\">Разница в том, откуда берутся данные: подпрограмма получает радиус как аргумент, а метод читает его из объекта, у которого он был вызван.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как правило, берите подпрограмму для самостоятельной операции, которая просто преобразует свои аргументы, и метод — когда поведение естественно принадлежит объекту и работает с его собственным состоянием.<\/span> <span class=\"sg\" data-s=\"1\">Для процедур, связанных с классом, но не с конкретным объектом, используйте методы класса.<\/span><\/p>"]]},"uk":{"t":"Підпрограми проти методів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер у вас є два способи запакувати частину поведінки: <em>підпрограма<\/em> й <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Вони схожі на вигляд, але використовуються по-різному.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма стоїть сама по собі.<\/span> <span class=\"sg\" data-s=\"1\">Ви викликаєте її за іменем і передаєте їй усе потрібне аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод належить класу і викликається для об'єкта через крапку.<\/span> <span class=\"sg\" data-s=\"1\">Він може користуватися власними даними об'єкта через <code>self<\/code> та методи доступу до атрибутів, тож ці дані передавати не треба:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва обчислюють те саме число.<\/span> <span class=\"sg\" data-s=\"1\">Різниця в тому, звідки беруться дані: підпрограма отримує радіус аргументом, а метод читає його з об'єкта, для якого його викликано.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як правило, беріть підпрограму для самостійної операції, яка просто перетворює свої аргументи, і метод — коли поведінка природно належить об'єктові й працює з його власним станом.<\/span> <span class=\"sg\" data-s=\"1\">Для специфічних для класу, але загальних підпрограм використовуйте методи класу.<\/span><\/p>"]]},"bg":{"t":"Подпрограми срещу методи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече имате два начина да опаковате парче поведение: <em>подпрограма<\/em> и <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Изглеждат си подобни, но се използват различно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата стои сама за себе си.<\/span> <span class=\"sg\" data-s=\"1\">Извиквате я по име и ѝ подавате всичко необходимо като аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът принадлежи на клас и се извиква върху обект с точка.<\/span> <span class=\"sg\" data-s=\"1\">Той може да използва собствените данни на обекта чрез <code>self<\/code> и аксесорите на атрибутите, така че не му подавате тези данни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двете изчисляват едно и също число.<\/span> <span class=\"sg\" data-s=\"1\">Разликата е откъде идват данните: подпрограмата получава радиуса като аргумент, докато методът го чете от обекта, върху който е извикан.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Като правило използвайте подпрограма за самостоятелна операция, която просто преобразува аргументите си, и метод, когато поведението естествено принадлежи на обект и работи със собственото му състояние.<\/span> <span class=\"sg\" data-s=\"1\">За процедури, специфични за класа, но общи за всички негови обекти, използвайте методи на класа.<\/span><\/p>"]]}}}</script>
