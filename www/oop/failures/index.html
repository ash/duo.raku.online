<script type="application/json" id="page-data">{"u":"oop/failures","n":950,"k":"section","pv":"oop/exception-objects/quiz","nx":"oop/failures/exercises","tr":["oop"],"L":{"en":{"t":"Soft failures","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Throwing an exception with <code>die<\/code> stops everything immediately.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes that is too drastic: you want a subroutine to report that it could not produce a result, but let the caller decide whether that is fatal.<\/span> <span class=\"sg\" data-s=\"2\">For this, Raku has <em>soft failures<\/em>, created with <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">When a subroutine calls <code>fail<\/code>, it does not throw straight away.<\/span> <span class=\"sg\" data-s=\"1\">Instead it returns a special <code>Failure<\/code> object to the caller.<\/span> <span class=\"sg\" data-s=\"2\">A <code>Failure<\/code> is undefined, so the caller can quietly check for it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The successful call returns <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The failing call returns a <code>Failure<\/code>, which reports <code>False<\/code> for <code>defined<\/code>, so the caller can test the result before using it.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A <code>Failure<\/code> is called <em>soft<\/em> because it turns into a real, thrown exception only if you try to use it as a value without checking it first.<\/span> <span class=\"sg\" data-s=\"1\">As long as you handle it — for example by testing <code>defined<\/code> — it stays quiet.<\/span> <span class=\"sg\" data-s=\"2\">This lets a subroutine signal a problem without forcing the whole program to stop.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">You have seen this before<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This deferred style of failure is not unique to <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Earlier in this part you met the same idea twice.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <strong>division by zero<\/strong> produces a value quietly and only throws when you actually use it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <strong>failing external program<\/strong> returns a <code>Proc<\/code> that throws only if you discard it unhandled — save it and inspect it, and it stays a quiet value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In each case a problem does not stop the program the moment it happens: it becomes a value you can check, and it escalates to a thrown exception only when you use it unchecked or ignore it.<\/span> <span class=\"sg\" data-s=\"1\">The topic <a href=\"/oop/try/deferred-errors/\">Not every error is immediate<\/a> shows these two side by side.<\/span><\/p>"]]},"de":{"t":"Weiche Fehlschläge","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme mit <code>die<\/code> zu werfen hält sofort alles an.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal ist das zu drastisch: Sie möchten, dass eine Subroutine meldet, dass sie kein Ergebnis liefern konnte, die Entscheidung über die Schwere aber dem Aufrufer überlassen.<\/span> <span class=\"sg\" data-s=\"2\">Dafür hat Raku <em>weiche Fehlschläge<\/em>, erzeugt mit <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Subroutine <code>fail<\/code> aufruft, wirft sie nicht sofort.<\/span> <span class=\"sg\" data-s=\"1\">Stattdessen liefert sie dem Aufrufer ein besonderes <code>Failure<\/code>-Objekt.<\/span> <span class=\"sg\" data-s=\"2\">Ein <code>Failure<\/code> ist undefiniert, der Aufrufer kann also in aller Ruhe darauf prüfen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der erfolgreiche Aufruf liefert <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der fehlschlagende Aufruf liefert ein <code>Failure<\/code>, das für <code>defined<\/code> <code>False<\/code> meldet, sodass der Aufrufer das Ergebnis prüfen kann, bevor er es verwendet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Failure<\/code> heißt <em>weich<\/em>, weil es sich erst dann in eine echte, geworfene Ausnahme verwandelt, wenn Sie versuchen, es als Wert zu verwenden, ohne es zuvor zu prüfen.<\/span> <span class=\"sg\" data-s=\"1\">Solange Sie es behandeln — etwa indem Sie <code>defined<\/code> testen —, bleibt es still.<\/span> <span class=\"sg\" data-s=\"2\">So kann eine Subroutine ein Problem melden, ohne das ganze Programm zum Anhalten zu zwingen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das haben Sie schon einmal gesehen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser aufgeschobene Stil des Fehlschlagens ist nicht auf <code>fail<\/code> beschränkt.<\/span> <span class=\"sg\" data-s=\"1\">Früher in diesem Teil ist Ihnen dieselbe Idee zweimal begegnet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine <strong>Division durch null<\/strong> erzeugt still einen Wert und wirft erst, wenn Sie ihn tatsächlich verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <strong>fehlschlagendes externes Programm<\/strong> liefert ein <code>Proc<\/code>, das nur wirft, wenn Sie es unbehandelt verwerfen — bewahren Sie es auf und sehen Sie es sich an, bleibt es ein stiller Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In jedem Fall hält ein Problem das Programm nicht in dem Moment an, in dem es auftritt: Es wird zu einem Wert, den Sie prüfen können, und eskaliert erst dann zu einer geworfenen Ausnahme, wenn Sie ihn ungeprüft verwenden oder ignorieren.<\/span> <span class=\"sg\" data-s=\"1\">Das Thema <a href=\"https://course.raku.org/de/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Nicht jeder Fehler tritt sofort auf<\/a> stellt diese beiden nebeneinander.<\/span><\/p>"]]},"nl":{"t":"Zachte mislukkingen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een exceptie werpen met <code>die<\/code> legt alles onmiddellijk stil.<\/span> <span class=\"sg\" data-s=\"1\">Soms is dat te drastisch: je wilt dat een subroutine meldt dat ze geen resultaat kon leveren, maar de aanroeper laat beslissen of dat fataal is.<\/span> <span class=\"sg\" data-s=\"2\">Daarvoor heeft Raku <em>zachte mislukkingen<\/em>, gemaakt met <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer een subroutine <code>fail<\/code> aanroept, werpt ze niet meteen.<\/span> <span class=\"sg\" data-s=\"1\">In plaats daarvan geeft ze een bijzonder <code>Failure<\/code>-object aan de aanroeper terug.<\/span> <span class=\"sg\" data-s=\"2\">Een <code>Failure<\/code> is ongedefinieerd, dus de aanroeper kan er rustig op controleren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De geslaagde aanroep geeft <code>5<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">De mislukte aanroep geeft een <code>Failure<\/code> terug, die <code>False<\/code> meldt voor <code>defined<\/code>, zodat de aanroeper het resultaat kan testen voordat hij het gebruikt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <code>Failure<\/code> heet <em>zacht<\/em> omdat hij pas in een echte, geworpen exceptie verandert als je hem als waarde probeert te gebruiken zonder hem eerst te controleren.<\/span> <span class=\"sg\" data-s=\"1\">Zolang je hem afhandelt — bijvoorbeeld door <code>defined<\/code> te testen — blijft hij stil.<\/span> <span class=\"sg\" data-s=\"2\">Zo kan een subroutine een probleem signaleren zonder het hele programma tot stoppen te dwingen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dit heb je eerder gezien<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze uitgestelde stijl van mislukken is niet uniek voor <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eerder in dit deel kwam je hetzelfde idee twee keer tegen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <strong>deling door nul<\/strong> levert stilletjes een waarde op en werpt pas wanneer je die werkelijk gebruikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <strong>mislukkend extern programma<\/strong> geeft een <code>Proc<\/code> terug die alleen werpt als je hem onafgehandeld weggooit — bewaar hem en bekijk hem, en hij blijft een stille waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In elk geval legt een probleem het programma niet stil op het moment dat het optreedt: het wordt een waarde die je kunt controleren, en het escaleert pas tot een geworpen exceptie wanneer je het ongecontroleerd gebruikt of negeert.<\/span> <span class=\"sg\" data-s=\"1\">Het onderwerp <a href=\"https://course.raku.org/nl/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Niet elke fout is onmiddellijk<\/a> zet deze twee naast elkaar.<\/span><\/p>"]]},"es":{"t":"Fallos suaves","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lanzar una excepción con <code>die<\/code> lo detiene todo de inmediato.<\/span> <span class=\"sg\" data-s=\"1\">A veces eso es demasiado drástico: quieres que una subrutina informe de que no pudo producir un resultado, pero que sea quien la llama quien decida si eso es fatal.<\/span> <span class=\"sg\" data-s=\"2\">Para esto Raku tiene los <em>fallos blandos<\/em>, creados con <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando una subrutina llama a <code>fail<\/code>, no lanza nada de inmediato.<\/span> <span class=\"sg\" data-s=\"1\">En su lugar devuelve a quien la llamó un objeto especial <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>Failure<\/code> no está definido, así que quien llama puede comprobarlo con discreción:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La llamada que funciona devuelve <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La que falla devuelve un <code>Failure<\/code>, que informa <code>False<\/code> para <code>defined<\/code>, de modo que quien llama puede comprobar el resultado antes de usarlo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <code>Failure<\/code> se llama <em>blando<\/em> porque solo se convierte en una excepción real y lanzada si intentas usarlo como valor sin comprobarlo antes.<\/span> <span class=\"sg\" data-s=\"1\">Mientras lo manejes — por ejemplo comprobando <code>defined<\/code> — se mantiene callado.<\/span> <span class=\"sg\" data-s=\"2\">Esto permite que una subrutina señale un problema sin obligar a todo el programa a detenerse.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ya has visto esto<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este estilo aplazado de fallo no es exclusivo de <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Antes en esta parte te encontraste dos veces con la misma idea.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una <strong>división por cero<\/strong> produce un valor en silencio y solo lanza la excepción cuando realmente lo usas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <strong>programa externo que falla<\/strong> devuelve un <code>Proc<\/code> que solo lanza una excepción si lo descartas sin manejarlo; guárdalo e inspecciónalo y seguirá siendo un valor callado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En cada caso un problema no detiene el programa en el momento en que ocurre: se convierte en un valor que puedes comprobar, y solo asciende a excepción lanzada cuando lo usas sin comprobar o lo ignoras.<\/span> <span class=\"sg\" data-s=\"1\">El tema <a href=\"https://course.raku.org/es/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">No todo error es inmediato<\/a> muestra los dos casos uno al lado del otro.<\/span><\/p>"]]},"it":{"t":"Guasti morbidi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sollevare un'eccezione con <code>die<\/code> ferma tutto immediatamente.<\/span> <span class=\"sg\" data-s=\"1\">A volte è troppo drastico: vuoi che una subroutine riferisca di non aver potuto produrre un risultato, ma lasci decidere al chiamante se ciò sia fatale.<\/span> <span class=\"sg\" data-s=\"2\">Per questo Raku ha i <em>fallimenti morbidi<\/em>, creati con <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando una subroutine chiama <code>fail<\/code>, non solleva nulla subito.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce invece al chiamante un oggetto speciale <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>Failure<\/code> non è definito, quindi il chiamante può controllarlo con discrezione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La chiamata riuscita restituisce <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La chiamata fallita restituisce un <code>Failure<\/code>, che riferisce <code>False<\/code> per <code>defined<\/code>, così il chiamante può mettere alla prova il risultato prima di usarlo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <code>Failure<\/code> si dice <em>morbido<\/em> perché si trasforma in un'eccezione vera e sollevata solo se provi a usarlo come valore senza controllarlo prima.<\/span> <span class=\"sg\" data-s=\"1\">Finché lo gestisci — per esempio mettendo alla prova <code>defined<\/code> — resta silenzioso.<\/span> <span class=\"sg\" data-s=\"2\">Questo permette a una subroutine di segnalare un problema senza costringere l'intero programma a fermarsi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lo hai già visto<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo stile differito di fallimento non è esclusivo di <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Prima in questa parte hai incontrato la stessa idea due volte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una <strong>divisione per zero<\/strong> produce un valore in silenzio e solleva un'eccezione solo quando lo usi davvero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <strong>programma esterno che fallisce<\/strong> restituisce un <code>Proc<\/code> che solleva un'eccezione solo se lo scarti senza gestirlo — conservalo e ispezionalo, e resterà un valore silenzioso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In ciascun caso un problema non ferma il programma nel momento in cui accade: diventa un valore che puoi controllare, e sale al rango di eccezione sollevata solo quando lo usi senza controllo o lo ignori.<\/span> <span class=\"sg\" data-s=\"1\">L'argomento <a href=\"https://course.raku.org/it/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Non ogni errore è immediato<\/a> mostra i due casi fianco a fianco.<\/span><\/p>"]]},"lv":{"t":"Mīkstās kļūmes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Izņēmuma izmešana ar <code>die<\/code> uzreiz aptur visu.<\/span> <span class=\"sg\" data-s=\"1\">Reizēm tas ir pārāk krasi: gribat, lai apakšprogramma paziņo, ka rezultātu radīt nav izdevies, taču lai izsaucējs izlemj, vai tas ir liktenīgi.<\/span> <span class=\"sg\" data-s=\"2\">Tam Raku ir <em>mīkstās neveiksmes<\/em>, ko rada ar <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad apakšprogramma izsauc <code>fail<\/code>, tā neizmet izņēmumu uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā tā atgriež izsaucējam īpašu <code>Failure<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> ir nedefinēts, tāpēc izsaucējs var to klusi pārbaudīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Veiksmīgais izsaukums atgriež <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Neveiksmīgais atgriež <code>Failure<\/code>, kas <code>defined<\/code> ziņo <code>False<\/code>, tāpēc izsaucējs var rezultātu pārbaudīt, pirms to izmanto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Failure<\/code> sauc par <em>mīkstu<\/em> tāpēc, ka tas pārvēršas par īstu, izmestu izņēmumu tikai tad, ja mēģināt to izmantot kā vērtību, iepriekš nepārbaudot.<\/span> <span class=\"sg\" data-s=\"1\">Kamēr to apstrādājat — piemēram, pārbaudot <code>defined<\/code> —, tas paliek kluss.<\/span> <span class=\"sg\" data-s=\"2\">Tas ļauj apakšprogrammai signalizēt par problēmu, nepiespiežot visu programmu apstāties.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">To jau esat redzējuši<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis atliktais neveiksmes stils nav tikai <code>fail<\/code> īpatnība.<\/span> <span class=\"sg\" data-s=\"1\">Šajā daļā ar to pašu ideju jau sastapāties divreiz.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Dalīšana ar nulli<\/strong> klusi rada vērtību un izmet izņēmumu tikai tad, kad to patiešām izmantojat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Neveiksmīga ārēja programma<\/strong> atgriež <code>Proc<\/code>, kas izmet izņēmumu tikai tad, ja to izmetat neapstrādātu; saglabājiet to un izpētiet, un tas paliek klusa vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrā gadījumā problēma neaptur programmu tajā brīdī, kad notiek: tā kļūst par vērtību, ko varat pārbaudīt, un pāraug izmestā izņēmumā tikai tad, kad to izmantojat nepārbaudītu vai ignorējat.<\/span> <span class=\"sg\" data-s=\"1\">Temats <a href=\"https://course.raku.org/lv/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Ne katra kļūda ir tūlītēja<\/a> parāda abus līdzās.<\/span><\/p>"]]},"ru":{"t":"Мягкие сбои","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Бросить исключение через <code>die<\/code> — значит немедленно всё остановить.<\/span> <span class=\"sg\" data-s=\"1\">Иногда это слишком резко: вы хотите, чтобы подпрограмма сообщила о невозможности выдать результат, но решение, фатально ли это, оставила вызывающей стороне.<\/span> <span class=\"sg\" data-s=\"2\">Для этого в Raku есть <em>мягкие сбои<\/em>, создаваемые с помощью <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда подпрограмма вызывает <code>fail<\/code>, она не бросает исключение сразу.<\/span> <span class=\"sg\" data-s=\"1\">Вместо этого она возвращает вызывающей стороне особый объект <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> не определён, поэтому вызывающий код может тихо его проверить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Успешный вызов возвращает <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Неудачный возвращает <code>Failure<\/code>, который на <code>defined<\/code> отвечает <code>False<\/code>, так что вызывающая сторона может проверить результат, прежде чем им пользоваться.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Failure<\/code> называется <em>мягким<\/em> потому, что превращается в настоящее брошенное исключение, только если попытаться использовать его как значение, не проверив предварительно.<\/span> <span class=\"sg\" data-s=\"1\">Пока вы его обрабатываете — например, проверяете <code>defined<\/code>, — он остаётся безмолвным.<\/span> <span class=\"sg\" data-s=\"2\">Это позволяет подпрограмме сообщить о проблеме, не заставляя всю программу остановиться.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вы это уже видели<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такой отложенный стиль сбоя присущ не только <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Раньше в этой части вы дважды встречали ту же идею.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на ноль<\/strong> тихо порождает значение и бросает исключение лишь тогда, когда вы им действительно воспользуетесь:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # ошибки пока нет\nsay $x;           # бросает только здесь, когда значение используется<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Неудачно завершившаяся внешняя программа<\/strong> возвращает <code>Proc<\/code>, который бросает исключение, только если вы отбросите его необработанным; сохраните и исследуйте его — и он останется безмолвным значением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # неудачный Proc отброшен, поэтому здесь бросается исключение<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В каждом случае проблема не останавливает программу в тот миг, когда возникает: она становится значением, которое можно проверить, и перерастает в брошенное исключение, только если воспользоваться им без проверки или проигнорировать его.<\/span> <span class=\"sg\" data-s=\"1\">Тема <a href=\"https://course.raku.org/ru/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не всякая ошибка возникает сразу<\/a> показывает эти два случая рядом.<\/span><\/p>"]]},"uk":{"t":"М'які збої","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кидання винятку через <code>die<\/code> спиняє все негайно.<\/span> <span class=\"sg\" data-s=\"1\">Іноді це надто різко: ви хочете, щоб підпрограма повідомила, що не змогла дати результат, але дозволила викликачеві вирішити, чи це фатально.<\/span> <span class=\"sg\" data-s=\"2\">Для цього в Raku є <em>м'які збої<\/em>, які створюють через <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли підпрограма викликає <code>fail<\/code>, вона не кидає виняток одразу.<\/span> <span class=\"sg\" data-s=\"1\">Натомість вона повертає викликачеві особливий об'єкт <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> є невизначеним, тож викликач може тихо його перевірити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Успішний виклик повертає <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Невдалий виклик повертає <code>Failure<\/code>, який для <code>defined<\/code> повідомляє <code>False<\/code>, тож викликач може перевірити результат, перш ніж ним скористатися.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Failure<\/code> називають <em>м'яким<\/em>, бо він перетворюється на справжній кинутий виняток лише тоді, коли ви намагаєтеся скористатися ним як значенням, спершу не перевіривши.<\/span> <span class=\"sg\" data-s=\"1\">Доки ви його обробляєте — наприклад, перевіряючи <code>defined<\/code>, — він лишається тихим.<\/span> <span class=\"sg\" data-s=\"2\">Це дозволяє підпрограмі сигналізувати про негаразд, не змушуючи спинятися всю програму.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ви це вже бачили<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такий відкладений стиль збою не є винятковою властивістю <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Раніше в цій частині ви двічі стикалися з тією самою ідеєю.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Ділення на нуль<\/strong> тихо створює значення й кидає виняток лише тоді, коли ви ним справді користуєтеся:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # помилки ще немає\nsay $x;           # кидає лише тут, коли значення використано<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Зовнішня програма, що зазнала невдачі,<\/strong> повертає <code>Proc<\/code>, який кидає виняток, лише якщо ви відкидаєте його необробленим; збережіть його й дослідіть — і він лишиться тихим значенням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # невдалий Proc відкинуто, тож це кидає виняток<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У кожному з випадків негаразд не спиняє програму тієї миті, коли стається: він стає значенням, яке можна перевірити, і переростає в кинутий виняток, лише коли ви користуєтеся ним без перевірки або ігноруєте його.<\/span> <span class=\"sg\" data-s=\"1\">Тема <a href=\"https://course.raku.org/uk/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не кожна помилка негайна<\/a> показує ці два випадки поруч.<\/span><\/p>"]]},"bg":{"t":"Меки провали","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Хвърлянето на изключение с <code>die<\/code> спира всичко незабавно.<\/span> <span class=\"sg\" data-s=\"1\">Понякога това е твърде рязко: искате подпрограмата да съобщи, че не е могла да произведе резултат, но да остави на извикващия да реши дали това е фатално.<\/span> <span class=\"sg\" data-s=\"2\">За целта Raku има <em>меки провали<\/em>, създавани с <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато подпрограма извика <code>fail<\/code>, тя не хвърля веднага.<\/span> <span class=\"sg\" data-s=\"1\">Вместо това връща на извикващия специален обект <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> е недефиниран, така че извикващият може тихо да провери за него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Успешното извикване връща <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Провалилото се извикване връща <code>Failure<\/code>, който съобщава <code>False<\/code> за <code>defined<\/code>, така че извикващият може да провери резултата, преди да го използва.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Failure<\/code> се нарича <em>мек<\/em>, защото се превръща в истинско, хвърлено изключение само ако се опитате да го използвате като стойност, без първо да сте го проверили.<\/span> <span class=\"sg\" data-s=\"1\">Докато го обработвате — например като проверите <code>defined<\/code>, — той си остава тих.<\/span> <span class=\"sg\" data-s=\"2\">Това позволява на подпрограмата да сигнализира за проблем, без да принуждава цялата програма да спре.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виждали сте това и преди<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този отложен стил на провал не е присъщ само на <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">По-рано в тази част срещнахте същата идея два пъти.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Делението на нула<\/strong> произвежда стойност тихо и хвърля едва когато действително я използвате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # още няма грешка\nsay $x;           # хвърля едва тук, когато стойността се използва<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Провалила се външна програма<\/strong> връща <code>Proc<\/code>, който хвърля само ако го изхвърлите необработен; запазете го и го разгледайте — и той си остава тиха стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # провалилият се Proc е изхвърлен, затова това хвърля<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Във всеки от случаите проблемът не спира програмата в мига, в който се случва: той се превръща в стойност, която можете да проверите, и прераства в хвърлено изключение само когато я използвате непроверена или я пренебрегнете.<\/span> <span class=\"sg\" data-s=\"1\">Темата <a href=\"https://course.raku.org/bg/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не всяка грешка е незабавна<\/a> показва тези два случая един до друг.<\/span><\/p>"]]}}}</script>
