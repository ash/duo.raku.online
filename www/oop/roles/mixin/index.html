<script type="application/json" id="page-data">{"u":"oop/roles/mixin","n":828,"k":"topic","pv":"oop/roles/multiple-roles","nx":"oop/roles/mixin/quiz","tr":["oop","oop/roles"],"L":{"en":{"t":"Adding a role to an object","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A role does not have to be baked into a class.<\/span> <span class=\"sg\" data-s=\"1\">You can also give one to an object that already exists, using the <code>but<\/code> operator.<\/span> <span class=\"sg\" data-s=\"2\">It mixes the role into a single object at run time and returns a new object that plays the role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Only <code>$loud<\/code> gained the role.<\/span> <span class=\"sg\" data-s=\"1\">The <code>Greeter<\/code> class and every other <code>Greeter<\/code> object are untouched, so <code>$quiet<\/code> still greets in the ordinary way.<\/span> <span class=\"sg\" data-s=\"2\">When the role and the class both define a method with the same name, the role’s version wins, and <code>callsame<\/code> calls the one it overrode — here the original <code>greet<\/code> from <code>Greeter<\/code>, whose result is then upper-cased.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An object that has a role mixed in is recognised as doing that role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> leaves the original object as it was and hands you a new one.<\/span> <span class=\"sg\" data-s=\"1\">If you would rather change an existing object in place, use the <code>does<\/code> operator instead:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mixing roles into individual objects lets you decide, one object at a time, which extra behaviour it should take on — without defining a separate class for every combination.<\/span><\/p>"]]},"de":{"t":"Einem Objekt eine Rolle hinzufügen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Rolle muss nicht fest in eine Klasse eingebaut sein.<\/span> <span class=\"sg\" data-s=\"1\">Sie können eine auch einem bereits bestehenden Objekt geben, mit dem Operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er mischt die Rolle zur Laufzeit in ein einzelnes Objekt und liefert ein neues Objekt, das die Rolle spielt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nur <code>$loud<\/code> hat die Rolle erhalten.<\/span> <span class=\"sg\" data-s=\"1\">Die Klasse <code>Greeter<\/code> und jedes andere <code>Greeter<\/code>-Objekt bleiben unberührt, <code>$quiet<\/code> grüßt also weiterhin auf die gewöhnliche Weise.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Rolle und Klasse beide eine Methode gleichen Namens definieren, gewinnt die Fassung der Rolle, und <code>callsame<\/code> ruft diejenige auf, die sie überschrieben hat — hier das ursprüngliche <code>greet<\/code> aus <code>Greeter<\/code>, dessen Ergebnis anschließend in Großbuchstaben gesetzt wird.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Objekt, in das eine Rolle eingemischt wurde, wird als Träger dieser Rolle erkannt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> lässt das ursprüngliche Objekt, wie es war, und reicht Ihnen ein neues.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie ein bestehendes Objekt lieber an Ort und Stelle ändern möchten, nehmen Sie stattdessen den Operator <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rollen in einzelne Objekte einzumischen erlaubt Ihnen, Objekt für Objekt zu entscheiden, welches zusätzliche Verhalten es übernehmen soll — ohne für jede Kombination eine eigene Klasse zu definieren.<\/span><\/p>"]]},"nl":{"t":"Een rol aan een object toevoegen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een rol hoeft niet in een klasse ingebakken te zijn.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er ook een geven aan een object dat al bestaat, met de operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die mengt de rol tijdens het draaien in één enkel object en geeft een nieuw object terug dat de rol speelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Alleen <code>$loud<\/code> kreeg de rol erbij.<\/span> <span class=\"sg\" data-s=\"1\">De klasse <code>Greeter<\/code> en elk ander <code>Greeter<\/code>-object blijven onaangeroerd, dus <code>$quiet<\/code> groet nog steeds op de gewone manier.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer de rol en de klasse allebei een methode met dezelfde naam definiëren, wint de versie van de rol, en <code>callsame<\/code> roept degene aan die overschreven werd — hier de oorspronkelijke <code>greet<\/code> uit <code>Greeter<\/code>, waarvan het resultaat vervolgens in hoofdletters wordt gezet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een object waarin een rol gemengd is, wordt herkend als doende die rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> laat het oorspronkelijke object zoals het was en geeft je een nieuw object.<\/span> <span class=\"sg\" data-s=\"1\">Als je liever een bestaand object ter plaatse wijzigt, gebruik dan de operator <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rollen in afzonderlijke objecten mengen laat je per object beslissen welk extra gedrag het moet aannemen — zonder voor elke combinatie een aparte klasse te definiëren.<\/span><\/p>"]]},"es":{"t":"Añadir un rol a un objeto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un rol no tiene por qué estar incorporado en una clase.<\/span> <span class=\"sg\" data-s=\"1\">También puedes dárselo a un objeto que ya existe, usando el operador <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mezcla el rol en un único objeto en tiempo de ejecución y devuelve un objeto nuevo que asume el rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Solo <code>$loud<\/code> ha adquirido el rol.<\/span> <span class=\"sg\" data-s=\"1\">La clase <code>Greeter<\/code> y todos los demás objetos <code>Greeter<\/code> quedan intactos, así que <code>$quiet<\/code> sigue saludando de la manera ordinaria.<\/span> <span class=\"sg\" data-s=\"2\">Cuando el rol y la clase definen ambos un método con el mismo nombre, gana la versión del rol, y <code>callsame<\/code> llama a la que ha sobrescrito — aquí el <code>greet<\/code> original de <code>Greeter<\/code>, cuyo resultado se pasa después a mayúsculas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un objeto en el que se ha mezclado un rol se reconoce como portador de ese rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> deja el objeto original tal cual y te entrega uno nuevo.<\/span> <span class=\"sg\" data-s=\"1\">Si prefieres cambiar un objeto existente en el sitio, usa el operador <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mezclar roles en objetos concretos te permite decidir, objeto a objeto, qué comportamiento extra debe asumir, sin definir una clase aparte para cada combinación.<\/span><\/p>"]]},"it":{"t":"Aggiungere un ruolo a un oggetto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un ruolo non deve per forza essere incorporato in una classe.<\/span> <span class=\"sg\" data-s=\"1\">Puoi darlo anche a un oggetto che esiste già, usando l'operatore <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esso mescola il ruolo in un singolo oggetto a runtime e restituisce un nuovo oggetto che assume il ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Solo <code>$loud<\/code> ha acquisito il ruolo.<\/span> <span class=\"sg\" data-s=\"1\">La classe <code>Greeter<\/code> e ogni altro oggetto <code>Greeter<\/code> restano intatti, quindi <code>$quiet<\/code> saluta ancora nel modo ordinario.<\/span> <span class=\"sg\" data-s=\"2\">Quando il ruolo e la classe definiscono entrambi un metodo con lo stesso nome, vince la versione del ruolo, e <code>callsame<\/code> chiama quella che è stata sovrascritta — qui il <code>greet<\/code> originale di <code>Greeter<\/code>, il cui risultato viene poi reso maiuscolo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un oggetto in cui è stato mescolato un ruolo viene riconosciuto come portatore di quel ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> lascia l'oggetto originale com'era e te ne consegna uno nuovo.<\/span> <span class=\"sg\" data-s=\"1\">Se preferisci cambiare sul posto un oggetto esistente, usa invece l'operatore <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mescolare ruoli in singoli oggetti ti permette di decidere, un oggetto alla volta, quale comportamento aggiuntivo debba assumere — senza definire una classe separata per ogni combinazione.<\/span><\/p>"]]},"lv":{"t":"Lomas pievienošana objektam","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lomai nav obligāti jābūt iecepta klasē.<\/span> <span class=\"sg\" data-s=\"1\">To var dot arī objektam, kas jau eksistē, izmantojot operatoru <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas izpildes laikā iemaisa lomu vienā objektā un atgriež jaunu objektu, kas šo lomu spēlē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lomu ieguva tikai <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Klase <code>Greeter<\/code> un visi pārējie <code>Greeter<\/code> objekti paliek neskarti, tāpēc <code>$quiet<\/code> joprojām sasveicinās parastajā veidā.<\/span> <span class=\"sg\" data-s=\"2\">Kad gan loma, gan klase definē vienāda nosaukuma metodi, uzvar lomas versija, un <code>callsame<\/code> izsauc to, kuru tā pārrakstīja, — šeit sākotnējo <code>greet<\/code> no <code>Greeter<\/code>, kura rezultāts tad tiek pārvērsts lielajos burtos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objekts, kurā iemaisīta loma, tiek atpazīts kā tāds, kas šo lomu dara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> atstāj sākotnējo objektu tādu, kāds tas bija, un atdod jums jaunu.<\/span> <span class=\"sg\" data-s=\"1\">Ja labprātāk mainītu esošu objektu uz vietas, izmantojiet operatoru <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lomu iemaisīšana atsevišķos objektos ļauj pa vienam objektam izlemt, kādu papildu uzvedību tas uzņemsies, — nedefinējot atsevišķu klasi katrai kombinācijai.<\/span><\/p>"]]},"ru":{"t":"Добавление роли объекту","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Роль не обязана быть встроена в класс.<\/span> <span class=\"sg\" data-s=\"1\">Её можно дать и уже существующему объекту с помощью оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он подмешивает роль в один-единственный объект во время выполнения и возвращает новый объект, который эту роль играет:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Роль получил только <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Класс <code>Greeter<\/code> и все остальные объекты <code>Greeter<\/code> остались нетронутыми, поэтому <code>$quiet<\/code> по-прежнему здоровается обычным образом.<\/span> <span class=\"sg\" data-s=\"2\">Когда и роль, и класс определяют метод с одним именем, побеждает версия из роли, а <code>callsame<\/code> вызывает тот метод, который она перекрыла, — здесь исходный <code>greet<\/code> из <code>Greeter<\/code>, результат которого затем переводится в верхний регистр.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Объект с подмешанной ролью распознаётся как выполняющий эту роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> оставляет исходный объект таким, каким он был, и выдаёт вам новый.<\/span> <span class=\"sg\" data-s=\"1\">Если вы предпочитаете изменить существующий объект на месте, используйте вместо этого оператор <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подмешивание ролей в отдельные объекты позволяет решать по одному объекту за раз, какое дополнительное поведение он должен получить, — не определяя отдельный класс для каждого сочетания.<\/span><\/p>"]]},"uk":{"t":"Додавання ролі до об'єкта","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Роль не обов'язково вбудовувати в клас.<\/span> <span class=\"sg\" data-s=\"1\">Її можна надати й об'єктові, який уже існує, за допомогою оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він підмішує роль в один об'єкт під час виконання й повертає новий об'єкт, що цю роль виконує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Роль отримав лише <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Клас <code>Greeter<\/code> і кожен інший об'єкт <code>Greeter<\/code> лишилися недоторканими, тож <code>$quiet<\/code> і далі вітається у звичайний спосіб.<\/span> <span class=\"sg\" data-s=\"2\">Коли і роль, і клас визначають метод з однаковим іменем, перемагає версія ролі, а <code>callsame<\/code> викликає ту, яку вона перекрила, — тут початковий <code>greet<\/code> із <code>Greeter<\/code>, чий результат потім переводять у верхній регістр.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Об'єкт, у який підмішано роль, розпізнається як такий, що її виконує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> лишає початковий об'єкт таким, яким він був, і віддає вам новий.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви радше хочете змінити наявний об'єкт на місці, скористайтеся натомість оператором <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підмішування ролей в окремі об'єкти дозволяє вирішувати для кожного об'єкта зокрема, якої додаткової поведінки він має набути, — не визначаючи окремого класу для кожного поєднання.<\/span><\/p>"]]},"bg":{"t":"Добавяне на роля към обект","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ролята не е задължително да е вградена в класа.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я дадете и на обект, който вече съществува, с оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той вмесва ролята в един-единствен обект по време на изпълнение и връща нов обект, който играе ролята:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Само <code>$loud<\/code> придоби ролята.<\/span> <span class=\"sg\" data-s=\"1\">Класът <code>Greeter<\/code> и всеки друг обект <code>Greeter<\/code> остават недокоснати, така че <code>$quiet<\/code> все още поздравява по обичайния начин.<\/span> <span class=\"sg\" data-s=\"2\">Когато и ролята, и класът дефинират метод с едно и също име, версията на ролята надделява, а <code>callsame<\/code> извиква онази, която е предефинирала — тук първоначалния <code>greet<\/code> от <code>Greeter<\/code>, чийто резултат след това се преобразува в главни букви.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обект, в който е вмесена роля, се разпознава като изпълняващ тази роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> оставя първоначалния обект какъвто си е бил и ви подава нов.<\/span> <span class=\"sg\" data-s=\"1\">Ако предпочитате да промените съществуващ обект на място, използвайте вместо това оператора <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вмесването на роли в отделни обекти ви позволява да решавате обект по обект какво допълнително поведение да поеме — без да дефинирате отделен клас за всяка комбинация.<\/span><\/p>"]]}}}</script>
