<script type="application/json" id="page-data">{"u":"oop/roles","n":826,"k":"section","pv":"oop/inheritance/exercises/inherited-attribute/solution","nx":"oop/roles/multiple-roles","tr":["oop"],"L":{"en":{"t":"Roles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>role<\/em> is a bundle of behaviour (and sometimes data) that can be shared by several classes.<\/span> <span class=\"sg\" data-s=\"1\">Where inheritance says a class <em>is a<\/em> kind of another, a role describes something a class <em>can do<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You define a role with the <code>role<\/code> keyword, much like a class, and you give it to a class with the <code>does<\/code> trait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>Person<\/code> class now has the <code>hello<\/code> method from the role, as if it were written in the class itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A class that does a role is recognised as having that role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notice that the role’s <code>hello<\/code> method uses <code>self.name<\/code>, even though the role itself has no <code>name<\/code> attribute.<\/span> <span class=\"sg\" data-s=\"1\">That is fine: the method runs as part of whatever class composes the role, and that class provides <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The next topic shows that a class can take on more than one role at a time.<\/span><\/p>"]]},"de":{"t":"Rollen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Rolle<\/em> ist ein Bündel aus Verhalten (und mitunter Daten), das sich mehrere Klassen teilen können.<\/span> <span class=\"sg\" data-s=\"1\">Wo Vererbung sagt, eine Klasse <em>sei<\/em> eine Art einer anderen, beschreibt eine Rolle etwas, das eine Klasse <em>kann<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie definieren eine Rolle mit dem Schlüsselwort <code>role<\/code>, ganz ähnlich wie eine Klasse, und geben sie einer Klasse mit dem Trait <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Klasse <code>Person<\/code> hat nun die Methode <code>hello<\/code> aus der Rolle, als wäre sie in der Klasse selbst geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine Klasse, die eine Rolle erfüllt, wird auch als Trägerin dieser Rolle erkannt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass die Methode <code>hello<\/code> der Rolle <code>self.name<\/code> verwendet, obwohl die Rolle selbst kein Attribut <code>name<\/code> hat.<\/span> <span class=\"sg\" data-s=\"1\">Das ist in Ordnung: Die Methode läuft als Teil derjenigen Klasse, die die Rolle einbindet, und diese Klasse liefert <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Thema zeigt, dass eine Klasse mehr als eine Rolle zugleich übernehmen kann.<\/span><\/p>"]]},"nl":{"t":"Rollen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>rol<\/em> is een bundel gedrag (en soms gegevens) die door meerdere klassen gedeeld kan worden.<\/span> <span class=\"sg\" data-s=\"1\">Waar overerving zegt dat een klasse een soort van iets anders <em>is<\/em>, beschrijft een rol iets wat een klasse <em>kan doen<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je definieert een rol met het sleutelwoord <code>role<\/code>, vrijwel als een klasse, en je geeft hem aan een klasse met de trait <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De klasse <code>Person<\/code> heeft nu de methode <code>hello<\/code> uit de rol, alsof die in de klasse zelf geschreven was:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een klasse die een rol doet, wordt herkend als hebbende die rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de methode <code>hello<\/code> van de rol <code>self.name<\/code> gebruikt, ook al heeft de rol zelf geen attribuut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is prima: de methode draait als onderdeel van welke klasse de rol ook samenstelt, en die klasse levert <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende onderwerp laat zien dat een klasse meer dan één rol tegelijk kan aannemen.<\/span><\/p>"]]},"es":{"t":"Roles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>rol<\/em> es un paquete de comportamiento (y a veces de datos) que varias clases pueden compartir.<\/span> <span class=\"sg\" data-s=\"1\">Mientras que la herencia dice que una clase <em>es<\/em> una clase de otra, un rol describe algo que una clase <em>sabe hacer<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un rol se define con la palabra clave <code>role<\/code>, casi como una clase, y se le da a una clase con el rasgo <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La clase <code>Person<\/code> tiene ahora el método <code>hello<\/code> del rol, como si estuviera escrito en la propia clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una clase que asume un rol se reconoce como portadora de ese rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que el método <code>hello<\/code> del rol usa <code>self.name<\/code>, aunque el rol mismo no tiene ningún atributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">No pasa nada: el método se ejecuta como parte de la clase que compone el rol, y esa clase aporta <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El tema siguiente muestra que una clase puede asumir más de un rol a la vez.<\/span><\/p>"]]},"it":{"t":"Ruoli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>ruolo<\/em> è un fascio di comportamenti (e a volte di dati) che può essere condiviso da più classi.<\/span> <span class=\"sg\" data-s=\"1\">Mentre l'ereditarietà dice che una classe <em>è<\/em> un tipo di un'altra, un ruolo descrive qualcosa che una classe <em>sa fare<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un ruolo si definisce con la parola chiave <code>role<\/code>, quasi come una classe, e lo si dà a una classe con il tratto <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora la classe <code>Person<\/code> ha il metodo <code>hello<\/code> del ruolo, come se fosse scritto nella classe stessa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una classe che assume un ruolo viene riconosciuta come portatrice di quel ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota che il metodo <code>hello<\/code> del ruolo usa <code>self.name<\/code>, anche se il ruolo stesso non ha alcun attributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Va benissimo: il metodo gira come parte della classe che compone il ruolo, e quella classe fornisce <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L'argomento successivo mostra che una classe può assumere più di un ruolo per volta.<\/span><\/p>"]]},"lv":{"t":"Lomas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Loma<\/em> ir uzvedības (un dažkārt datu) kūlītis, ko var koplietot vairākas klases.<\/span> <span class=\"sg\" data-s=\"1\">Ja mantošana saka, ka klase <em>ir<\/em> kāda cita paveids, tad loma apraksta to, ko klase <em>prot darīt<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lomu definējat ar atslēgvārdu <code>role<\/code>, gluži kā klasi, un klasei to dodat ar iezīmi <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klasei <code>Person<\/code> tagad ir metode <code>hello<\/code> no lomas, it kā tā būtu uzrakstīta pašā klasē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klase, kas dara lomu, tiek atpazīta kā tāda, kam šī loma ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka lomas metode <code>hello<\/code> izmanto <code>self.name<\/code>, lai gan pašai lomai atribūta <code>name<\/code> nav.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir labi: metode izpildās kā daļa no tās klases, kas lomu komponē, un šī klase nodrošina <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nākamais temats parāda, ka klase var uzņemties vairāk nekā vienu lomu vienlaikus.<\/span><\/p>"]]},"ru":{"t":"Роли","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Роль<\/em> — это набор поведения (а иногда и данных), который могут разделять несколько классов.<\/span> <span class=\"sg\" data-s=\"1\">Если наследование говорит, что класс <em>является<\/em> разновидностью другого, то роль описывает то, что класс <em>умеет делать<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Роль определяется ключевым словом <code>role<\/code>, во многом как класс, и передаётся классу трейтом <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь у класса <code>Person<\/code> есть метод <code>hello<\/code> из роли — так, как если бы он был написан в самом классе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класс, выполняющий роль, распознаётся как обладающий этой ролью:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что метод <code>hello<\/code> из роли использует <code>self.name<\/code>, хотя у самой роли нет атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">И это нормально: метод выполняется как часть того класса, который включает эту роль, а <code>name<\/code> предоставляет уже класс.<\/span> <span class=\"sg\" data-s=\"2\">Следующая тема показывает, что класс может брать на себя сразу несколько ролей.<\/span><\/p>"]]},"uk":{"t":"Ролі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Роль<\/em> — це згорток поведінки (а іноді й даних), який можуть спільно використовувати кілька класів.<\/span> <span class=\"sg\" data-s=\"1\">Якщо успадкування каже, що клас <em>є<\/em> різновидом іншого, то роль описує те, що клас <em>уміє робити<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Роль визначають ключовим словом <code>role<\/code>, дуже схоже на клас, а надають класу трейтом <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас <code>Person<\/code> тепер має метод <code>hello<\/code> із ролі, наче його було написано в самому класі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас, який виконує роль, розпізнається як такий, що її має:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що метод <code>hello<\/code> ролі використовує <code>self.name<\/code>, хоча сама роль не має атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це нормально: метод виконується як частина того класу, який компонує роль, а цей клас надає <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Наступна тема показує, що клас може взяти на себе більш ніж одну роль одночасно.<\/span><\/p>"]]},"bg":{"t":"Роли","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Ролята<\/em> е сноп от поведение (а понякога и данни), който може да се споделя от няколко класа.<\/span> <span class=\"sg\" data-s=\"1\">Докато наследяването казва, че класът <em>е<\/em> вид друг клас, ролята описва нещо, което класът <em>може да прави<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирате роля с ключовата дума <code>role<\/code>, досущ като клас, и я давате на клас с трейта <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класът <code>Person<\/code> вече има метода <code>hello<\/code> от ролята, все едно е бил написан в самия клас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас, който изпълнява роля, се разпознава като притежаващ тази роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че методът <code>hello<\/code> на ролята използва <code>self.name<\/code>, макар самата роля да няма атрибут <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е наред: методът се изпълнява като част от онзи клас, който компонира ролята, а този клас предоставя <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следващата тема показва, че класът може да поеме повече от една роля наведнъж.<\/span><\/p>"]]}}}</script>
