<script type="application/json" id="page-data">{"u":"oop/roles/exercises/greetable","n":831,"k":"exercise","pv":"oop/roles/exercises","nx":"oop/roles/exercises/greetable/solution","tr":["oop","oop/roles"],"L":{"en":{"t":"Exercise ’A sized box‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Define a role <code>Sized<\/code> with a method <code>describe<\/code> that returns the string <code>size is &lt;size&gt;<\/code>, using <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Then define a class <code>Box<\/code> that does the <code>Sized<\/code> role and has a <code>size<\/code> attribute.<\/span> <span class=\"sg\" data-s=\"1\">Create a box with size <code>10<\/code>, print the result of calling <code>describe<\/code> on it, and then, on a second line, print whether the box <code>~~ Sized<\/code> — that is, whether it is recognised as doing the role.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Eine Schachtel mit Größe‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definieren Sie eine Rolle <code>Sized<\/code> mit einer Methode <code>describe<\/code>, die die Zeichenkette <code>size is &lt;size&gt;<\/code> liefert und dafür <code>self.size<\/code> verwendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Definieren Sie dann eine Klasse <code>Box<\/code>, die die Rolle <code>Sized<\/code> erfüllt und ein Attribut <code>size<\/code> hat.<\/span> <span class=\"sg\" data-s=\"1\">Erzeugen Sie eine Schachtel mit der Größe <code>10<\/code>, geben Sie das Ergebnis des Aufrufs von <code>describe<\/code> darauf aus und geben Sie dann in einer zweiten Zeile aus, ob die Schachtel <code>~~ Sized<\/code> ist — ob sie also als Trägerin der Rolle erkannt wird.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Een doos met een maat‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definieer een rol <code>Sized<\/code> met een methode <code>describe<\/code> die de string <code>size is &lt;size&gt;<\/code> teruggeeft, met gebruik van <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Definieer daarna een klasse <code>Box<\/code> die de rol <code>Sized<\/code> doet en een attribuut <code>size<\/code> heeft.<\/span> <span class=\"sg\" data-s=\"1\">Maak een doos met maat <code>10<\/code>, druk het resultaat af van <code>describe<\/code> erop aanroepen, en druk daarna, op een tweede regel, af of de doos <code>~~ Sized<\/code> is — dat wil zeggen, of hij herkend wordt als doende de rol.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Una caja con tamaño","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Define un rol <code>Sized<\/code> con un método <code>describe<\/code> que devuelva la cadena <code>size is &lt;tamaño&gt;<\/code>, usando <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Después define una clase <code>Box<\/code> que asuma el rol <code>Sized<\/code> y tenga un atributo <code>size<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Crea una caja de tamaño <code>10<\/code>, imprime el resultado de llamar a <code>describe<\/code> sobre ella y después, en una segunda línea, imprime si la caja <code>~~ Sized<\/code>, es decir, si se reconoce como portadora del rol.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Una scatola con una misura","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definisci un ruolo <code>Sized<\/code> con un metodo <code>describe<\/code> che restituisce la stringa <code>size is &lt;misura&gt;<\/code>, usando <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poi definisci una classe <code>Box<\/code> che assume il ruolo <code>Sized<\/code> e ha un attributo <code>size<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Crea una scatola di misura <code>10<\/code>, stampa il risultato della chiamata di <code>describe<\/code> su di essa e poi, su una seconda riga, stampa se la scatola <code>~~ Sized<\/code> — cioè se viene riconosciuta come portatrice del ruolo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Kaste ar izmēru","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definējiet lomu <code>Sized<\/code> ar metodi <code>describe<\/code>, kas atgriež virkni <code>size is &lt;izmērs&gt;<\/code>, izmantojot <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc tam definējiet klasi <code>Box<\/code>, kas dara lomu <code>Sized<\/code> un kam ir atribūts <code>size<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Izveidojiet kasti ar izmēru <code>10<\/code>, izdrukājiet uz tās izsauktās <code>describe<\/code> rezultātu un pēc tam otrā rindā izdrukājiet, vai kaste ir <code>~~ Sized<\/code>, tas ir, vai tā tiek atpazīta kā tāda, kas dara šo lomu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Коробка с размером","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Определите роль <code>Sized<\/code> с методом <code>describe<\/code>, который возвращает строку <code>size is &lt;размер&gt;<\/code>, используя <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Затем определите класс <code>Box<\/code>, который выполняет роль <code>Sized<\/code> и имеет атрибут <code>size<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Создайте коробку размера <code>10<\/code>, напечатайте результат вызова у неё <code>describe<\/code>, а второй строкой напечатайте, верно ли <code>~~ Sized<\/code> для этой коробки, то есть распознаётся ли она как выполняющая роль.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Коробка з розміром»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Визначте роль <code>Sized<\/code> із методом <code>describe<\/code>, який повертає рядок <code>size is &lt;size&gt;<\/code>, використовуючи <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Потім визначте клас <code>Box<\/code>, який виконує роль <code>Sized<\/code> і має атрибут <code>size<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Створіть коробку розміром <code>10<\/code>, виведіть результат виклику <code>describe<\/code> для неї, а другим рядком виведіть, чи справджується <code>box ~~ Sized<\/code>, тобто чи розпізнається вона як така, що виконує роль.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Кутия с размер“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте роля <code>Sized<\/code> с метод <code>describe<\/code>, който връща низа <code>size is &lt;size&gt;<\/code>, използвайки <code>self.size<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След това дефинирайте клас <code>Box<\/code>, който изпълнява ролята <code>Sized<\/code> и има атрибут <code>size<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Създайте кутия с размер <code>10<\/code>, отпечатайте резултата от извикването на <code>describe<\/code> върху нея, а после на втори ред отпечатайте дали кутията е <code>~~ Sized<\/code> — тоест дали се разпознава като изпълняваща ролята.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>size is 10\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/roles/exercises/greetable/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
