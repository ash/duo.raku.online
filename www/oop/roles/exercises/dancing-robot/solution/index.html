<script type="application/json" id="page-data">{"u":"oop/roles/exercises/dancing-robot/solution","n":836,"k":"solution","pv":"oop/roles/exercises/dancing-robot","nx":"oop/object-introspection","tr":["oop","oop/roles"],"L":{"en":{"t":"The solution of ’A dancing robot‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Unlike the earlier examples, <code>Dancing<\/code> does not replace an existing method — it brings a brand-new <code>dance<\/code> method that <code>Robot<\/code> knows nothing about.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mixes the role into a single object at run time, so <code>$dancing<\/code> can both <code>speak<\/code> (from the class) and <code>dance<\/code> (from the role). The plain <code>$plain<\/code> only ever learnt <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The extra ability belongs to that one object, not to the <code>Robot<\/code> class. Calling <code>$plain.dance<\/code> would be an error, because <code>$plain<\/code> never received the role.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein tanzender Roboter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anders als in den früheren Beispielen ersetzt <code>Dancing<\/code> keine bestehende Methode — es bringt eine ganz neue Methode <code>dance<\/code> mit, von der <code>Robot<\/code> nichts weiß.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mischt die Rolle zur Laufzeit in ein einzelnes Objekt, <code>$dancing<\/code> kann also sowohl <code>speak<\/code> (aus der Klasse) als auch <code>dance<\/code> (aus der Rolle). Der schlichte <code>$plain<\/code> hat nur <code>speak<\/code> gelernt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die zusätzliche Fähigkeit gehört zu diesem einen Objekt, nicht zur Klasse <code>Robot<\/code>. <code>$plain.dance<\/code> aufzurufen wäre ein Fehler, weil <code>$plain<\/code> die Rolle nie erhalten hat.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een dansende robot","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anders dan in de eerdere voorbeelden vervangt <code>Dancing<\/code> geen bestaande methode — hij brengt een gloednieuwe methode <code>dance<\/code> mee waar <code>Robot<\/code> niets van weet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mengt de rol tijdens het draaien in één enkel object, dus <code>$dancing<\/code> kan zowel <code>speak<\/code> (uit de klasse) als <code>dance<\/code> (uit de rol). De kale <code>$plain<\/code> heeft alleen ooit <code>speak<\/code> geleerd.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De extra mogelijkheid hoort bij dat ene object, niet bij de klasse <code>Robot<\/code>. <code>$plain.dance<\/code> aanroepen zou een fout zijn, omdat <code>$plain<\/code> de rol nooit gekregen heeft.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un robot que baila","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A diferencia de los ejemplos anteriores, <code>Dancing<\/code> no sustituye un método existente: trae un método <code>dance<\/code> completamente nuevo, del que <code>Robot<\/code> no sabe nada.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mezcla el rol en un único objeto en tiempo de ejecución, así que <code>$dancing<\/code> sabe tanto <code>speak<\/code> (de la clase) como <code>dance<\/code> (del rol). El simple <code>$plain<\/code> solo llegó a aprender <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La capacidad extra pertenece a ese objeto concreto, no a la clase <code>Robot<\/code>. Llamar a <code>$plain.dance<\/code> sería un error, porque <code>$plain<\/code> nunca recibió el rol.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un robot che balla","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A differenza degli esempi precedenti, <code>Dancing<\/code> non sostituisce un metodo esistente: porta un metodo <code>dance<\/code> completamente nuovo, di cui <code>Robot<\/code> non sa nulla.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mescola il ruolo in un singolo oggetto a runtime, quindi <code>$dancing<\/code> sa sia <code>speak<\/code> (dalla classe) sia <code>dance<\/code> (dal ruolo). Il semplice <code>$plain<\/code> ha imparato soltanto <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La capacità in più appartiene a quel singolo oggetto, non alla classe <code>Robot<\/code>. Chiamare <code>$plain.dance<\/code> sarebbe un errore, perché <code>$plain<\/code> non ha mai ricevuto il ruolo.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Dejojošs robots","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Atšķirībā no iepriekšējiem piemēriem <code>Dancing<\/code> neaizstāj esošu metodi — tā atnes pavisam jaunu metodi <code>dance<\/code>, par kuru <code>Robot<\/code> neko nezina.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> izpildes laikā iemaisa lomu vienā objektā, tāpēc <code>$dancing<\/code> prot gan <code>speak<\/code> (no klases), gan <code>dance<\/code> (no lomas). Vienkāršais <code>$plain<\/code> iemācījās vienīgi <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Papildu spēja pieder šim vienam objektam, nevis klasei <code>Robot<\/code>. Izsaukums <code>$plain.dance<\/code> būtu kļūda, jo <code>$plain<\/code> lomu nekad nesaņēma.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Танцующий робот","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В отличие от прежних примеров, <code>Dancing<\/code> не заменяет существующий метод — она приносит совершенно новый метод <code>dance<\/code>, о котором <code>Robot<\/code> ничего не знает.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> подмешивает роль в один-единственный объект во время выполнения, поэтому <code>$dancing<\/code> умеет и <code>speak<\/code> (из класса), и <code>dance<\/code> (из роли). Обычный <code>$plain<\/code> научился только <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дополнительная способность принадлежит именно этому объекту, а не классу <code>Robot<\/code>. Вызов <code>$plain.dance<\/code> привёл бы к ошибке, потому что <code>$plain<\/code> роль не получал.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Робот, що танцює","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">На відміну від попередніх прикладів, <code>Dancing<\/code> не замінює наявного методу — вона приносить цілком новий метод <code>dance<\/code>, про який <code>Robot<\/code> нічого не знає.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> підмішує роль в один об'єкт під час виконання, тож <code>$dancing<\/code> уміє і <code>speak<\/code> (від класу), і <code>dance<\/code> (від ролі). Звичайний <code>$plain<\/code> навчився лише <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Додаткова здатність належить саме цьому об'єктові, а не класу <code>Robot<\/code>. Виклик <code>$plain.dance<\/code> був би помилкою, бо <code>$plain<\/code> ніколи не отримував ролі.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Танцуващ робот","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За разлика от предишните примери, <code>Dancing<\/code> не заменя съществуващ метод — тя донася чисто нов метод <code>dance<\/code>, за който <code>Robot<\/code> не знае нищо.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> вмесва ролята в един-единствен обект по време на изпълнение, така че <code>$dancing<\/code> може и да <code>speak<\/code> (от класа), и да <code>dance<\/code> (от ролята). Обикновеният <code>$plain<\/code> е научил само <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Допълнителната способност принадлежи на този един обект, а не на класа <code>Robot<\/code>. Извикването на <code>$plain.dance<\/code> би било грешка, защото <code>$plain<\/code> така и не е получил ролята.<\/span><\/li><\/ol>"]]}}}</script>
