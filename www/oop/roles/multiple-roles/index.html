<script type="application/json" id="page-data">{"u":"oop/roles/multiple-roles","n":827,"k":"topic","pv":"oop/roles","nx":"oop/roles/mixin","tr":["oop","oop/roles"],"L":{"en":{"t":"Composing several roles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A class can do more than one role.<\/span> <span class=\"sg\" data-s=\"1\">You simply list each one with its own <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>Duck<\/code> class now has both the <code>move<\/code> method from <code>Walk<\/code> and the <code>dive<\/code> method from <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Combining roles like this is called <em>composition<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">It lets you assemble a class from several independent pieces of behaviour, which is often more flexible than building a single chain of inheritance — a class can mix in exactly the capabilities it needs, and nothing more.<\/span><\/p>"]]},"de":{"t":"Mehrere Rollen zusammensetzen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Klasse kann mehr als eine Rolle erfüllen.<\/span> <span class=\"sg\" data-s=\"1\">Sie führen jede einfach mit ihrem eigenen <code>does<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Klasse <code>Duck<\/code> hat nun sowohl die Methode <code>move<\/code> aus <code>Walk<\/code> als auch die Methode <code>dive<\/code> aus <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rollen auf diese Weise zu verbinden nennt man <em>Komposition<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sie erlaubt es, eine Klasse aus mehreren unabhängigen Verhaltensbausteinen zusammenzusetzen, was oft flexibler ist, als eine einzige Vererbungskette zu bauen — eine Klasse kann genau die Fähigkeiten einmischen, die sie braucht, und nicht mehr.<\/span><\/p>"]]},"nl":{"t":"Meerdere rollen samenstellen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een klasse kan meer dan één rol doen.<\/span> <span class=\"sg\" data-s=\"1\">Je somt ze eenvoudig op, elk met een eigen <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De klasse <code>Duck<\/code> heeft nu zowel de methode <code>move<\/code> uit <code>Walk<\/code> als de methode <code>dive<\/code> uit <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rollen zo combineren heet <em>compositie<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Het laat je een klasse samenstellen uit meerdere onafhankelijke stukken gedrag, wat vaak flexibeler is dan één keten van overerving bouwen — een klasse kan precies de mogelijkheden binnenhalen die ze nodig heeft, en niets meer.<\/span><\/p>"]]},"es":{"t":"Componer varios roles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una clase puede asumir más de un rol.<\/span> <span class=\"sg\" data-s=\"1\">Basta con enumerarlos, cada uno con su propio <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La clase <code>Duck<\/code> tiene ahora tanto el método <code>move<\/code> de <code>Walk<\/code> como el método <code>dive<\/code> de <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Combinar roles así se llama <em>composición<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Te permite ensamblar una clase a partir de varias piezas de comportamiento independientes, lo que suele ser más flexible que construir una única cadena de herencia: una clase puede mezclar exactamente las capacidades que necesita, y nada más.<\/span><\/p>"]]},"it":{"t":"Comporre più ruoli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una classe può assumere più di un ruolo.<\/span> <span class=\"sg\" data-s=\"1\">Basta elencarli ciascuno con il proprio <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora la classe <code>Duck<\/code> ha sia il metodo <code>move<\/code> di <code>Walk<\/code> sia il metodo <code>dive<\/code> di <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Combinare ruoli in questo modo si chiama <em>composizione<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ti permette di assemblare una classe a partire da più pezzi di comportamento indipendenti, il che è spesso più flessibile che costruire una singola catena di ereditarietà: una classe può mescolare esattamente le capacità che le servono, e niente di più.<\/span><\/p>"]]},"lv":{"t":"Vairāku lomu apvienošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Klase var darīt vairāk nekā vienu lomu.<\/span> <span class=\"sg\" data-s=\"1\">Vienkārši uzskaitiet katru ar savu <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klasei <code>Duck<\/code> tagad ir gan metode <code>move<\/code> no <code>Walk<\/code>, gan metode <code>dive<\/code> no <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šādu lomu apvienošanu sauc par <em>komponēšanu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ļauj klasi salikt no vairākiem neatkarīgiem uzvedības gabaliem, un tas bieži ir elastīgāk nekā būvēt vienu mantošanas ķēdi — klase var iemaisīt tieši tās spējas, kas tai vajadzīgas, un neko vairāk.<\/span><\/p>"]]},"ru":{"t":"Композиция нескольких ролей","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Класс может выполнять больше одной роли.<\/span> <span class=\"sg\" data-s=\"1\">Достаточно перечислить каждую со своим <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь у класса <code>Duck<\/code> есть и метод <code>move<\/code> из <code>Walk<\/code>, и метод <code>dive<\/code> из <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такое объединение ролей называется <em>композицией<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Оно позволяет собирать класс из нескольких независимых кусочков поведения, что часто гибче, чем выстраивать единую цепочку наследования: класс может подмешать ровно те возможности, которые ему нужны, и ничего лишнего.<\/span><\/p>"]]},"uk":{"t":"Компонування кількох ролей","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Клас може виконувати більш ніж одну роль.<\/span> <span class=\"sg\" data-s=\"1\">Ви просто перелічуєте кожну з власним <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас <code>Duck<\/code> тепер має і метод <code>move<\/code> із <code>Walk<\/code>, і метод <code>dive<\/code> із <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таке поєднання ролей називають <em>композицією<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Воно дозволяє скласти клас із кількох незалежних частин поведінки, що часто гнучкіше за побудову єдиного ланцюжка успадкування: клас може підмішати рівно ті можливості, які йому потрібні, і нічого більше.<\/span><\/p>"]]},"bg":{"t":"Компониране на няколко роли","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Класът може да изпълнява повече от една роля.<\/span> <span class=\"sg\" data-s=\"1\">Просто изброявате всяка със свое <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класът <code>Duck<\/code> вече има и метода <code>move<\/code> от <code>Walk<\/code>, и метода <code>dive<\/code> от <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такова съчетаване на роли се нарича <em>композиция<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">То ви позволява да сглобите клас от няколко независими парчета поведение, което често е по-гъвкаво от изграждането на една-единствена верига от наследявания — класът може да смеси точно тези способности, които са му нужни, и нищо повече.<\/span><\/p>"]]},"eo":{"t":"Kunmeti plurajn rolojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Klaso povas fari pli ol unu rolon.<\/span> <span class=\"sg\" data-s=\"1\">Vi simple listigas ĉiun kun sia propra <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La klaso <code>Duck<\/code> nun havas kaj la metodon <code>move<\/code> el <code>Walk<\/code> kaj la metodon <code>dive<\/code> el <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kombini rolojn tiel nomiĝas <em>kunmeto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi permesas al vi kunigi klason el pluraj sendependaj pecoj de konduto, kio ofte estas pli fleksebla ol konstrui unu solan ĉenon de heredo — klaso povas enmiksi ĝuste la kapablojn, kiujn ĝi bezonas, kaj nenion pli.<\/span><\/p>"]]},"la":{"t":"Plures partes componere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Classis plus quam unam partem facere potest.<\/span> <span class=\"sg\" data-s=\"1\">Simpliciter unamquamque cum proprio <code>does<\/code> enumeras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Classis <code>Duck<\/code> nunc et methodum <code>move<\/code> ex <code>Walk<\/code> et methodum <code>dive<\/code> ex <code>Swim<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Partes ita coniungere <em>compositio<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"1\">Tibi permittit classem ex pluribus independentibus agendi rationis partibus componere, quod saepe flexibilius est quam unam hereditatis catenam aedificare — classis exacte eas facultates quibus eget miscere potest, et nihil amplius.<\/span><\/p>"]]}}}</script>
