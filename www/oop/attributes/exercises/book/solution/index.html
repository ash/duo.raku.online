"list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cada una de las declaraciones <code>has $.title<\/code> y <code>has $.author<\/code> declara un atributo junto con un accesor de lectura.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambos accesores se usan dentro de una misma cadena entre comillas dobles. Cada uno va envuelto en llaves — <code>{$b.title}<\/code> y <code>{$b.author}<\/code> —, que es la forma de interpolar código: lo que hay entre las llaves se ejecuta y su resultado se inserta, de modo que los accesores se llaman y sus valores se colocan en la cadena.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambos atributos son cadenas, así que conviene declararlos como tales.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un libro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Book {\n    has Str $.title;\n    has Str $.author;\n}\n\nmy $b = Book.new(title =&gt; 'Raku', author =&gt; 'Larry');\nsay \"{$b.title} by {$b.author}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/book.raku\" target=\"_blank\" rel=\"noopener\">book.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Raku by Larry<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ciascuna delle dichiarazioni <code>has $.title<\/code> e <code>has $.author<\/code> dichiara un attributo insieme a un accessore in lettura.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Entrambi gli accessori sono usati dentro un'unica stringa fra virgolette doppie. Ciascuno è racchiuso fra parentesi graffe — <code>{$b.title}<\/code> e <code>{$b.author}<\/code> — che è la forma dell'interpolazione di codice: ciò che sta fra le graffe viene eseguito e il suo risultato viene inserito, quindi gli accessori vengono chiamati e i loro valori messi nella stringa.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Entrambi gli attributi sono stringhe, quindi conviene dichiararli come tali.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Grāmata","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Book {\n    has Str $.title;\n    has Str $.author;\n}\n\nmy $b = Book.new(title =&gt; 'Raku', author =&gt; 'Larry');\nsay \"{$b.title} by {$b.author}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/book.raku\" target=\"_blank\" rel=\"noopener\">book.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Raku by Larry<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Katrs <code>has $.title<\/code> un <code>has $.author<\/code> deklarē atribūtu kopā ar lasīšanas piekļuves metodi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abas piekļuves metodes tiek izmantotas vienā virknē ar dubultpēdiņām. Katra ir ietīta figūriekavās — <code>{$b.title}<\/code> un <code>{$b.author}<\/code> —, un tā ir koda interpolācijas forma: tas, kas ir iekavās, tiek izpildīts un tā rezultāts ievietots, tāpēc piekļuves metodes tiek izsauktas un to vērtības ieliktas virknē.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abi atribūti ir virknes, tāpēc būtu prātīgi tos tā arī deklarēt.<\/span><\/li><\/ol>"]]}," \/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/book.raku\" target=\"_blank\" rel=\"noopener\">book.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Raku by Larry<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кожне з <code>has $.title<\/code> та <code>has $.author<\/code> оголошує атрибут разом з аксесором для читання.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидва аксесори використано в одному рядку з подвійними лапками. Кожен узято у фігурні дужки — <code>{$b.title}<\/code> та <code>{$b.author}<\/code>, — і це форма інтерполяції коду: те, що всередині дужок, виконується, а його результат вставляється, тож аксесори викликаються, а їхні значення потрапляють у рядок.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидва атрибути є рядками, тож розумно було б так їх і оголосити.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Книга","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Book {\n    has Str $.title;\n    has Str $.author;\n}\n\nmy $b = Book.new(title =&gt; 'Raku', author =&gt; 'Larry');\nsay \"{$b.title} by {$b.author}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/book.raku\" target=\"_blank\" rel=\"noopener\">book.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Raku by Larry<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всяко от <code>has $.title<\/code> и <code>has $.author<\/code> декларира атрибут заедно с аксесор за четене.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата аксесора се използват в един низ с двойни кавички. Всеки е обвит във фигурни скоби — <code>{$b.title}<\/code> и <code>{$b.author}<\/code>, — а това е формата за интерполация на код: каквото е в скобите, се изпълнява и резултатът му се вмъква, така че аксесорите се извикват и стойностите им попадат в низа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата атрибута са низове, така че е разумно да бъдат декларирани като такива.<\/span><\/li><\/ol>"]]}}}</script>
