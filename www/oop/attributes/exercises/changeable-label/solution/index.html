<script type="application/json" id="page-data">{"u":"oop/attributes/exercises/changeable-label/solution","n":787,"k":"solution","pv":"oop/attributes/exercises/changeable-label","nx":"oop/methods","tr":["oop","oop/attributes"],"L":{"en":{"t":"The solution of ’A changeable label‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Label {\n    has $.text is rw;\n}\n\nmy $l = Label.new(text =&gt; 'draft');\n$l.text ~= ' (revised)';\nsay $l.text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/changeable-label.raku\" target=\"_blank\" rel=\"noopener\">changeable-label.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>draft (revised)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>is rw<\/code> trait makes the accessor return a writable container, so it can appear on the left of an assignment.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Because it is writable, the compound operator <code>~=<\/code> works on it too: <code>$l.text ~= ' (revised)'<\/code> reads the current text, concatenates the suffix, and stores the result back — all through the same accessor.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein änderbares Etikett","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Label {\n    has $.text is rw;\n}\n\nmy $l = Label.new(text =&gt; 'draft');\n$l.text ~= ' (revised)';\nsay $l.text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/changeable-label.raku\" target=\"_blank\" rel=\"noopener\">changeable-label.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>draft (revised)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Trait <code>is rw<\/code> lässt den Accessor einen schreibbaren Container liefern, sodass er links von einer Zuweisung stehen kann.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Weil er schreibbar ist, funktioniert auch der zusammengesetzte Operator <code>~=<\/code> darauf: <code>$l.text ~= ' (revised)'<\/code> liest den aktuellen Text, hängt das Suffix an und speichert das Ergebnis wieder zurück — alles über denselben Accessor.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een wijzigbaar label","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Label {\n    has $.text is rw;\n}\n\nmy $l = Label.new(text =&gt; 'draft');\n$l.text ~= ' (revised)';\nsay $l.text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/changeable-label.raku\" target=\"_blank\" rel=\"noopener\">changeable-label.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>draft (revised)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De trait <code>is rw<\/code> laat de accessor een schrijfbare container teruggeven, zodat die links van een toekenning kan staan.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omdat hij schrijfbaar is, werkt de samengestelde operator <code>~=<\/code> er ook op: <code>$l.text ~= ' (revised)'<\/code> leest de huidige tekst, plakt het achtervoegsel eraan en slaat het resultaat weer op — allemaal via dezelfde accessor.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Una etiqueta modificable","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Label {\n    has $.text is rw;\n}\n\nmy $l = Label.new(text =&gt; 'draft');\n$l.text ~= ' (revised)';\nsay $l.text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/changeable-label.raku\" target=\"_blank\" rel=\"noopener\">changeable-label.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>draft (revised)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El rasgo <code>is rw<\/code> hace que el accesor devuelva un contenedor escribible, de modo que puede aparecer a la izquierda de una asignación.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Precisamente por ser escribible, el operador compuesto <code>~=<\/code> también funciona sobre él: <code>$l.text ~= ' (revised)'<\/code> lee el texto actual, concatena el sufijo y guarda el resultado de vuelta, todo a través del mismo accesor.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un'etichetta modificabile","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\ ачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Label {\n    has $.text is rw;\n}\n\nmy $l = Label.new(text =&gt; 'draft');\n$l.text ~= ' (revised)';\nsay $l.text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/changeable-label.raku\" target=\"_blank\" rel=\"noopener\">changeable-label.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>draft (revised)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трейт <code>is rw<\/code> змушує аксесор повертати записуваний контейнер, тож той може стояти ліворуч від присвоєння.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оскільки він записуваний, складений оператор <code>~=<\/code> теж на ньому працює: <code>$l.text ~= ' (revised)'<\/code> читає поточний текст, приєднує суфікс і зберігає результат назад — і все це через той самий аксесор.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Променяем етикет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Label {\n    has $.text is rw;\n}\n\nmy $l = Label.new(text =&gt; 'draft');\n$l.text ~= ' (revised)';\nsay $l.text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/attributes/changeable-label.raku\" target=\"_blank\" rel=\"noopener\">changeable-label.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>draft (revised)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трейтът <code>is rw<\/code> кара аксесора да върне записваем контейнер, така че той може да стои отляво на присвояване.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Понеже е записваем, съставният оператор <code>~=<\/code> също работи с него: <code>$l.text ~= ' (revised)'<\/code> прочита текущия текст, долепя наставката и записва резултата обратно — всичко това през същия аксесор.<\/span><\/li><\/ol>"]]}}}</script>
