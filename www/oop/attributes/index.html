<script type="application/json" id="page-data">{"u":"oop/attributes","n":775,"k":"section","pv":"oop/classes/exercises/name-the-type/solution","nx":"oop/attributes/read-write","tr":["oop"],"L":{"en":{"t":"Attributes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">An empty class is not very useful.<\/span> <span class=\"sg\" data-s=\"1\">To let an object carry its own data, you give the class <em>attributes<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">An attribute is declared inside the class with the <code>has<\/code> keyword:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each object of the class gets its own copy of these attributes.<\/span> <span class=\"sg\" data-s=\"1\">You set their values when you create the object, by passing them to <code>new<\/code> as named arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>$.<\/code> in <code>has $.name<\/code> does two things at once: it declares an attribute, and it creates a method of the same name — an <em>accessor<\/em> — that returns the attribute’s value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Different objects hold their own values, independently of one another:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following topics show how to make attributes changeable and how to give them default values. (There is also a way to declare <em>private<\/em> attributes, hidden from the outside; we return to it once methods are introduced.)<\/span><\/p>"]]},"de":{"t":"Attribute","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine leere Klasse ist nicht besonders nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Damit ein Objekt eigene Daten tragen kann, geben Sie der Klasse <em>Attribute<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Attribut wird innerhalb der Klasse mit dem Schlüsselwort <code>has<\/code> deklariert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Objekt der Klasse erhält seine eigene Kopie dieser Attribute.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Werte setzen Sie beim Erzeugen des Objekts, indem Sie sie <code>new<\/code> als benannte Argumente übergeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>$.<\/code> in <code>has $.name<\/code> tut zweierlei auf einmal: Es deklariert ein Attribut und erzeugt eine gleichnamige Methode — einen <em>Accessor<\/em> —, die den Wert des Attributs liefert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verschiedene Objekte halten ihre eigenen Werte, unabhängig voneinander:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Themen zeigen, wie Sie Attribute veränderbar machen und wie Sie ihnen Standardwerte geben. (Es gibt außerdem eine Möglichkeit, <em>private<\/em> Attribute zu deklarieren, die von außen verborgen sind; darauf kommen wir zurück, sobald Methoden eingeführt sind.)<\/span><\/p>"]]},"nl":{"t":"Attributen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een lege klasse is niet erg nuttig.<\/span> <span class=\"sg\" data-s=\"1\">Om een object zijn eigen gegevens te laten dragen, geef je de klasse <em>attributen<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Een attribuut wordt binnen de klasse gedeclareerd met het sleutelwoord <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk object van de klasse krijgt zijn eigen exemplaar van deze attributen.<\/span> <span class=\"sg\" data-s=\"1\">Je stelt hun waarden in wanneer je het object maakt, door ze als benoemde argumenten aan <code>new<\/code> mee te geven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>$.<\/code> in <code>has $.name<\/code> doet twee dingen tegelijk: hij declareert een attribuut, en hij maakt een methode met dezelfde naam — een <em>accessor<\/em> — die de waarde van het attribuut teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verschillende objecten bevatten hun eigen waarden, onafhankelijk van elkaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je attributen wijzigbaar maakt en hoe je ze standaardwaarden geeft. (Er is ook een manier om <em>private<\/em> attributen te declareren, verborgen voor de buitenwereld; daar komen we op terug zodra methoden zijn geïntroduceerd.)<\/span><\/p>"]]},"es":{"t":"Atributos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una clase vacía no es muy útil.<\/span> <span class=\"sg\" data-s=\"1\">Para que un objeto lleve consigo datos propios, se dan a la clase unos <em>atributos<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Un atributo se declara dentro de la clase con la palabra clave <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada objeto de la clase recibe su propia copia de estos atributos.<\/span> <span class=\"sg\" data-s=\"1\">Sus valores se fijan al crear el objeto, pasándolos a <code>new<\/code> como argumentos con nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El <code>$.<\/code> de <code>has $.name<\/code> hace dos cosas a la vez: declara un atributo y crea un método con el mismo nombre — un <em>accesor<\/em> — que devuelve el valor del atributo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objetos distintos guardan valores propios, independientes entre sí:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los temas siguientes muestran cómo hacer modificables los atributos y cómo darles valores por defecto. (También existe una manera de declarar atributos <em>privados<\/em>, ocultos al exterior; volveremos a ella una vez introducidos los métodos.)<\/span><\/p>"]]},"it":{"t":"Attributi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una classe vuota non è molto utile.<\/span> <span class=\"sg\" data-s=\"1\">Per permettere a un oggetto di portare con sé dati propri, si danno alla classe degli <em>attributi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Un attributo si dichiara dentro la classe con la parola chiave <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni oggetto della classe riceve la propria copia di questi attributi.<\/span> <span class=\"sg\" data-s=\"1\">I loro valori si impostano quando crei l'oggetto, passandoli a <code>new<\/code> come argomenti nominati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il <code>$.<\/code> in <code>has $.name<\/code> fa due cose insieme: dichiara un attributo e crea un metodo con lo stesso nome — un <em>accessore<\/em> — che restituisce il valore dell'attributo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oggetti diversi contengono valori propri, indipendenti l'uno dall'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti che seguono mostrano come rendere modificabili gli attributi e come dare loro dei valori predefiniti. (C'è anche un modo per dichiarare attributi <em>privati<\/em>, nascosti all'esterno; ci torneremo una volta introdotti i metodi.)<\/span><\/p>"]]},"lv":{"t":"Atribūti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tukša klase nav sevišķi noderīga.<\/span> <span class=\"sg\" data-s=\"1\">Lai objekts varētu nest savus datus, klasei dodat <em>atribūtus<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Atribūtu deklarē klases iekšienē ar atslēgvārdu <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs klases objekts iegūst savu šo atribūtu kopiju.<\/span> <span class=\"sg\" data-s=\"1\">To vērtības uzstādāt, kad objektu radāt, padodot tās <code>new<\/code> kā nosauktus argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> deklarācijā <code>has $.name<\/code> dara divas lietas uzreiz: tas deklarē atribūtu un izveido tāda paša nosaukuma metodi — <em>piekļuves metodi<\/em> —, kas atgriež atribūta vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dažādi objekti glabā savas vērtības neatkarīgi cits no cita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, kā atribūtus padarīt maināmus un kā tiem dot noklusētās vērtības. (Ir arī veids, kā deklarēt <em>privātus<\/em> atribūtus, kas paslēpti no ārpuses; pie tā atgriezīsimies, kad būs ieviestas metodes.)<\/span><\/p>"]]},"ru":{"t":"Атрибуты","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пустой класс не слишком полезен.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы объект мог нести собственные данные, классу дают <em>атрибуты<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Атрибут объявляется внутри класса ключевым словом <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый объект класса получает собственную копию этих атрибутов.<\/span> <span class=\"sg\" data-s=\"1\">Их значения задаются при создании объекта: они передаются в <code>new<\/code> как именованные аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запись <code>$.<\/code> в <code>has $.name<\/code> делает сразу две вещи: объявляет атрибут и создаёт одноимённый метод — <em>аксессор<\/em>, — который возвращает значение атрибута:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разные объекты хранят собственные значения, независимо друг от друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, как сделать атрибуты изменяемыми и как задать им значения по умолчанию. (Есть также способ объявить <em>приватные<\/em> атрибуты, скрытые снаружи; мы вернёмся к нему, когда будут введены методы.)<\/span><\/p>"]]},"uk":{"t":"Атрибути","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Порожній клас не надто корисний.<\/span> <span class=\"sg\" data-s=\"1\">Щоб об'єкт міг нести власні дані, класу надають <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Атрибут оголошують усередині класу ключовим словом <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен об'єкт класу отримує власну копію цих атрибутів.<\/span> <span class=\"sg\" data-s=\"1\">Їхні значення ви задаєте під час створення об'єкта, передаючи їх до <code>new<\/code> як іменовані аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> у <code>has $.name<\/code> робить дві речі водночас: оголошує атрибут і створює однойменний метод — <em>аксесор<\/em>, — який повертає значення атрибута:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Різні об'єкти зберігають власні значення, незалежно одне від одного:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як зробити атрибути змінюваними та як надати їм типові значення. (Є також спосіб оголосити <em>приватні<\/em> атрибути, приховані ззовні; ми повернемося до нього, коли введемо методи.)<\/span><\/p>"]]},"bg":{"t":"Атрибути","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Празният клас не е особено полезен.<\/span> <span class=\"sg\" data-s=\"1\">За да може обектът да носи собствени данни, давате на класа <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Атрибут се декларира вътре в класа с ключовата дума <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки обект от класа получава свое собствено копие на тези атрибути.<\/span> <span class=\"sg\" data-s=\"1\">Стойностите им се задават при създаването на обекта, като ги подадете на <code>new<\/code> като именувани аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> в <code>has $.name<\/code> върши две неща наведнъж: декларира атрибут и създава метод със същото име — <em>аксесор<\/em>, — който връща стойността на атрибута:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Различните обекти пазят свои собствени стойности, независимо един от друг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да направите атрибутите променяеми и как да им дадете стойности по подразбиране. (Има и начин да се декларират <em>частни<\/em> атрибути, скрити от външния свят; ще се върнем към него, щом въведем методите.)<\/span><\/p>"]]},"eo":{"t":"Atributoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Malplena klaso ne estas tre utila.<\/span> <span class=\"sg\" data-s=\"1\">Por ke objekto portu siajn proprajn datumojn, vi donas al la klaso <em>atributojn<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Atributo estas deklarita ene de la klaso per la ŝlosilvorto <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu objekto de la klaso ricevas sian propran kopion de ĉi tiuj atributoj.<\/span> <span class=\"sg\" data-s=\"1\">Vi starigas iliajn valorojn, kiam vi kreas la objekton, transdonante ilin al <code>new<\/code> kiel nomitajn argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>$.<\/code> en <code>has $.name<\/code> faras du aferojn samtempe: ĝi deklaras atributon, kaj ĝi kreas metodon de la sama nomo — <em>atingilon<\/em> — kiu redonas la valoron de la atributo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Malsamaj objektoj tenas siajn proprajn valorojn, sendepende unu de la alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel fari atributojn ŝanĝeblaj kaj kiel doni al ili defaŭltajn valorojn. (Estas ankaŭ maniero deklari <em>privatajn<\/em> atributojn, kaŝitajn de ekstere; ni revenos al ĝi, kiam metodoj estos enkondukitaj.)<\/span><\/p>"]]},"la":{"t":"Attributa","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Classis vacua non valde utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Ut obiectum propria data ferat, classi <em>attributa<\/em> das.<\/span> <span class=\"sg\" data-s=\"2\">Attributum intra classem per verbum <code>has<\/code> declaratur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unumquodque obiectum classis propriam horum attributorum copiam accipit.<\/span> <span class=\"sg\" data-s=\"1\">Valores eorum ponis cum obiectum creas, ea ad <code>new<\/code> ut argumenta nominata tradens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> in <code>has $.name<\/code> duo simul agit: attributum declarat, et methodum eiusdem nominis creat — <em>accessorem<\/em> — quae valorem attributi reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diversa obiecta proprios valores tenent, alia ab aliis independenter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia ostendunt quomodo attributa mutabilia reddas et quomodo eis valores praedefinitos des. (Est etiam modus attributa <em>privata<\/em> declarandi, ab exteriore abscondita; ad illud redibimus cum methodi introductae erunt.)<\/span><\/p>"]]}}}</script>
