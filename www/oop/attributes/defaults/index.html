<script type="application/json" id="page-data">{"u":"oop/attributes/defaults","n":777,"k":"topic","pv":"oop/attributes/read-write","nx":"oop/attributes/defaults/quiz","tr":["oop","oop/attributes"],"L":{"en":{"t":"Default values","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An attribute can be given a <em>default value<\/em>, which is used when an object is created without a value for it.<\/span> <span class=\"sg\" data-s=\"1\">Write the default after the attribute, with <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice that similar to variables, it is possible to force the type of the attributes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you do not pass <code>weight<\/code> to <code>new<\/code>, the attribute takes the default:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can still override the default by passing a value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without a default, and without a value passed to <code>new<\/code>, an attribute is simply undefined, exactly like a fresh scalar variable.<\/span><\/p>"]]},"de":{"t":"Standardwerte","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Attribut kann einen <em>Standardwert<\/em> erhalten, der verwendet wird, wenn ein Objekt ohne Wert dafür erzeugt wird.<\/span> <span class=\"sg\" data-s=\"1\">Schreiben Sie den Standardwert mit <code>=<\/code> hinter das Attribut:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass sich der Typ der Attribute ähnlich wie bei Variablen festlegen lässt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie <code>weight<\/code> nicht an <code>new<\/code> übergeben, nimmt das Attribut den Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können den Standardwert weiterhin überschreiben, indem Sie einen Wert übergeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne Standardwert und ohne einen an <code>new<\/code> übergebenen Wert ist ein Attribut schlicht undefiniert, genau wie eine frische skalare Variable.<\/span><\/p>"]]},"nl":{"t":"Standaardwaarden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een attribuut kan een <em>standaardwaarde<\/em> krijgen, die gebruikt wordt wanneer een object gemaakt wordt zonder een waarde ervoor.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf de standaardwaarde achter het attribuut, met <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat het net als bij variabelen mogelijk is het type van de attributen af te dwingen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je <code>weight<\/code> niet aan <code>new<\/code> meegeeft, neemt het attribuut de standaardwaarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt de standaardwaarde nog steeds overschrijven door een waarde mee te geven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder standaardwaarde, en zonder een waarde die aan <code>new<\/code> wordt meegegeven, is een attribuut eenvoudigweg ongedefinieerd, precies als een verse scalaire variabele.<\/span><\/p>"]]},"es":{"t":"Valores por defecto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A un atributo se le puede dar un <em>valor por defecto<\/em>, que se usa cuando se crea un objeto sin darle un valor.<\/span> <span class=\"sg\" data-s=\"1\">Escribe el valor por defecto después del atributo, con <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que, igual que con las variables, es posible imponer el tipo de los atributos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si no pasas <code>weight<\/code> a <code>new<\/code>, el atributo toma el valor por defecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes anular el valor por defecto pasando un valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin valor por defecto y sin un valor pasado a <code>new<\/code>, un atributo simplemente queda sin definir, exactamente como una variable escalar recién declarada.<\/span><\/p>"]]},"it":{"t":"Valori predefiniti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A un attributo si può dare un <em>valore predefinito<\/em>, usato quando un oggetto viene creato senza un valore per quell'attributo.<\/span> <span class=\"sg\" data-s=\"1\">Scrivi il valore predefinito dopo l'attributo, con <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che, come per le variabili, è possibile imporre il tipo degli attributi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se non passi <code>weight<\/code> a <code>new<\/code>, l'attributo prende il valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi comunque scavalcare il valore predefinito passando un valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza valore predefinito e senza un valore passato a <code>new<\/code>, un attributo è semplicemente non definito, esattamente come una variabile scalare appena dichiarata.<\/span><\/p>"]]},"lv":{"t":"Noklusētās vērtības","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Atribūtam var dot <em>noklusēto vērtību<\/em>, ko izmanto, kad objekts tiek radīts bez vērtības tam.<\/span> <span class=\"sg\" data-s=\"1\">Rakstiet noklusējumu aiz atribūta ar <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka līdzīgi kā mainīgajiem, arī atribūtiem var uzspiest tipu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja <code>weight<\/code> <code>new<\/code> nepadodat, atribūts pieņem noklusējumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Noklusējumu joprojām var pārrakstīt, padodot vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez noklusējuma un bez <code>new<\/code> padotas vērtības atribūts vienkārši ir nedefinēts, gluži tāpat kā svaigs skalārs mainīgais.<\/span><\/p>"]]},"ru":{"t":"Значения по умолчанию","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Атрибуту можно задать <em>значение по умолчанию<\/em>, которое используется, если объект создаётся без значения для него.<\/span> <span class=\"sg\" data-s=\"1\">Значение по умолчанию пишется после атрибута через <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что, как и у переменных, тип атрибутов можно задать явно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если не передать <code>weight<\/code> в <code>new<\/code>, атрибут примет значение по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значение по умолчанию по-прежнему можно переопределить, передав своё:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без значения по умолчанию и без значения, переданного в <code>new<\/code>, атрибут просто не определён — точно так же, как только что объявленная скалярная переменная.<\/span><\/p>"]]},"uk":{"t":"Типові значення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Атрибуту можна надати <em>типове значення<\/em>, яке використовується, коли об'єкт створюють без значення для нього.<\/span> <span class=\"sg\" data-s=\"1\">Запишіть типове значення після атрибута через <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що, як і для змінних, тип атрибутів можна задати примусово.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви не передасте <code>weight<\/code> до <code>new<\/code>, атрибут візьме типове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типове значення все одно можна перекрити, передавши своє:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без типового значення й без значення, переданого до <code>new<\/code>, атрибут просто невизначений — точнісінько як щойно створена скалярна змінна.<\/span><\/p>"]]},"bg":{"t":"Стойности по подразбиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">На атрибута може да се даде <em>стойност по подразбиране<\/em>, която се използва, когато обектът се създава без стойност за него.<\/span> <span class=\"sg\" data-s=\"1\">Запишете стойността по подразбиране след атрибута, с <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че подобно на променливите, типът на атрибутите може да бъде наложен.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако не подадете <code>weight<\/code> на <code>new<\/code>, атрибутът взема стойността по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пак можете да пренебрегнете стойността по подразбиране, като подадете стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без стойност по подразбиране и без стойност, подадена на <code>new<\/code>, атрибутът просто е недефиниран, точно като новосъздадена скаларна променлива.<\/span><\/p>"]]}}}</script>
