<script type="application/json" id="page-data">{"u":"oop/attributes/read-write","n":776,"k":"topic","pv":"oop/attributes","nx":"oop/attributes/defaults","tr":["oop","oop/attributes"],"L":{"en":{"t":"Read-write attributes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">By default, the accessor created by <code>has $.name<\/code> is <em>read-only<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The value is initialised in the constructor, after which you can read the value but not change it from outside the object.<\/span> <span class=\"sg\" data-s=\"2\">Assigning to it is an error:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This stops with:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To allow the value to be changed through the accessor, mark the attribute with the <code>is rw<\/code> trait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now the accessor returns a writable container, so the assignment works and the object’s <code>name<\/code> becomes <code>Max<\/code>.<\/span><\/p>"]]},"de":{"t":"Les- und schreibbare Attribute","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig ist der Accessor, den <code>has $.name<\/code> erzeugt, <em>nur lesbar<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Der Wert wird im Konstruktor gesetzt; danach können Sie ihn lesen, aber von außerhalb des Objekts nicht mehr ändern.<\/span> <span class=\"sg\" data-s=\"2\">Eine Zuweisung ist ein Fehler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das bricht ab mit:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Damit der Wert über den Accessor geändert werden darf, versehen Sie das Attribut mit dem Trait <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt liefert der Accessor einen schreibbaren Container, die Zuweisung funktioniert also, und der <code>name<\/code> des Objekts wird zu <code>Max<\/code>.<\/span><\/p>"]]},"nl":{"t":"Lees-schrijfattributen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Standaard is de accessor die <code>has $.name<\/code> maakt <em>alleen-lezen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De waarde wordt in de constructor geïnitialiseerd, waarna je de waarde kunt lezen maar niet van buiten het object kunt veranderen.<\/span> <span class=\"sg\" data-s=\"2\">Eraan toekennen is een fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit stopt met:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om de waarde via de accessor te kunnen wijzigen, markeer je het attribuut met de trait <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu geeft de accessor een schrijfbare container terug, dus de toekenning werkt en de <code>name<\/code> van het object wordt <code>Max<\/code>.<\/span><\/p>"]]},"es":{"t":"Atributos de lectura y escritura","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por omisión, el accesor creado por <code>has $.name<\/code> es de <em>solo lectura<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El valor se inicializa en el constructor y después puedes leerlo, pero no cambiarlo desde fuera del objeto.<\/span> <span class=\"sg\" data-s=\"2\">Asignarle algo es un error:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa se detiene con:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para permitir que el valor cambie a través del accesor, marca el atributo con el rasgo <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora el accesor devuelve un contenedor escribible, así que la asignación funciona y el <code>name<\/code> del objeto pasa a ser <code>Max<\/code>.<\/span><\/p>"]]},"it":{"t":"Attributi in lettura e scrittura","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita, l'accessore creato da <code>has $.name<\/code> è di <em>sola lettura<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il valore viene inizializzato nel costruttore, dopodiché puoi leggerlo ma non cambiarlo dall'esterno dell'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Assegnarvi qualcosa è un errore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma si ferma con:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per permettere che il valore venga cambiato attraverso l'accessore, contrassegna l'attributo con il tratto <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora l'accessore restituisce un contenitore scrivibile, quindi l'assegnamento funziona e il <code>name<\/code> dell'oggetto diventa <code>Max<\/code>.<\/span><\/p>"]]},"lv":{"t":"Lasāmi un rakstāmi atribūti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma piekļuves metode, ko izveido <code>has $.name<\/code>, ir <em>tikai lasāma<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Vērtība tiek inicializēta konstruktorā, un pēc tam to var nolasīt, bet no ārpuses mainīt nevar.<\/span> <span class=\"sg\" data-s=\"2\">Piešķiršana tai ir kļūda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas apstājas ar:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai atļautu vērtību mainīt caur piekļuves metodi, atzīmējiet atribūtu ar iezīmi <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad piekļuves metode atgriež rakstāmu konteineru, tāpēc piešķiršana darbojas un objekta <code>name<\/code> kļūst par <code>Max<\/code>.<\/span><\/p>"]]},"ru":{"t":"Атрибуты для чтения и записи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">По умолчанию аксессор, создаваемый объявлением <code>has $.name<\/code>, работает <em>только на чтение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Значение инициализируется в конструкторе, после чего его можно читать, но нельзя изменить извне объекта.<\/span> <span class=\"sg\" data-s=\"2\">Присваивание приводит к ошибке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа останавливается с сообщением:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы разрешить изменять значение через аксессор, пометьте атрибут трейтом <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь аксессор возвращает изменяемый контейнер, поэтому присваивание срабатывает и <code>name<\/code> объекта становится <code>Max<\/code>.<\/span><\/p>"]]},"uk":{"t":"Атрибути для читання й запису","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням аксесор, створений через <code>has $.name<\/code>, доступний <em>лише для читання<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Значення ініціалізується в конструкторі, після чого його можна читати, але не змінювати ззовні об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">Присвоєння йому є помилкою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це зупиняється з повідомленням:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб дозволити змінювати значення через аксесор, позначте атрибут трейтом <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер аксесор повертає записуваний контейнер, тож присвоєння працює, і <code>name<\/code> об'єкта стає <code>Max<\/code>.<\/span><\/p>"]]},"bg":{"t":"Атрибути за четене и писане","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">По подразбиране аксесорът, създаден от <code>has $.name<\/code>, е <em>само за четене<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Стойността се задава в конструктора, след което можете да я четете, но не и да я променяте отвън.<\/span> <span class=\"sg\" data-s=\"2\">Присвояването ѝ е грешка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това спира с:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да позволите стойността да се променя през аксесора, отбележете атрибута с трейта <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега аксесорът връща записваем контейнер, така че присвояването работи и <code>name<\/code> на обекта става <code>Max<\/code>.<\/span><\/p>"]]}}}</script>
