<script type="application/json" id="page-data">{"u":"oop/methods/private-attributes","n":789,"k":"topic","pv":"oop/methods","nx":"oop/methods/parameters","tr":["oop","oop/methods"],"L":{"en":{"t":"Private attributes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/oop/attributes/\">section about attributes<\/a>, each attribute was declared with <code>$.<\/code>, which creates a public accessor.<\/span> <span class=\"sg\" data-s=\"1\">An attribute declared with <code>$!<\/code> instead is <em>private<\/em>: it has no accessor and cannot be seen from outside the object.<\/span> <span class=\"sg\" data-s=\"2\">It is reachable only from within the class’s own methods, where you refer to it as <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The secret <code>$!code<\/code> is stored inside the object but never exposed: there is no <code>.code<\/code> accessor, so the only way to interact with it is through the <code>unlocks<\/code> method that the class chooses to provide.<\/span> <span class=\"sg\" data-s=\"1\">An attempt to read <code>$safe.code<\/code> or <code>$safe!code<\/code> simply fails.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Private attributes are useful for internal details that the rest of the program should not touch directly.<\/span><\/p>"]]},"de":{"t":"Private Attribute","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/oop/attributes/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Attribute<\/a> wurde jedes Attribut mit <code>$.<\/code> deklariert, was einen öffentlichen Accessor erzeugt.<\/span> <span class=\"sg\" data-s=\"1\">Ein stattdessen mit <code>$!<\/code> deklariertes Attribut ist <em>privat<\/em>: Es hat keinen Accessor und ist von außerhalb des Objekts nicht sichtbar.<\/span> <span class=\"sg\" data-s=\"2\">Erreichbar ist es nur aus den eigenen Methoden der Klasse, wo Sie es als <code>$!name<\/code> ansprechen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der geheime <code>$!code<\/code> wird im Objekt gespeichert, aber nie preisgegeben: Es gibt keinen Accessor <code>.code<\/code>, der einzige Weg, mit ihm umzugehen, führt also über die Methode <code>unlocks<\/code>, die die Klasse bewusst anbietet.<\/span> <span class=\"sg\" data-s=\"1\">Ein Versuch, <code>$safe.code<\/code> oder <code>$safe!code<\/code> zu lesen, scheitert schlicht.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Private Attribute sind nützlich für interne Details, die der Rest des Programms nicht unmittelbar anfassen soll.<\/span><\/p>"]]},"nl":{"t":"Private attributen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In de <a href=\"https://course.raku.org/nl/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sectie over attributen<\/a> werd elk attribuut met <code>$.<\/code> gedeclareerd, wat een publieke accessor maakt.<\/span> <span class=\"sg\" data-s=\"1\">Een attribuut dat in plaats daarvan met <code>$!<\/code> gedeclareerd wordt, is <em>private<\/em>: het heeft geen accessor en is van buiten het object niet te zien.<\/span> <span class=\"sg\" data-s=\"2\">Het is alleen bereikbaar vanuit de eigen methoden van de klasse, waar je ernaar verwijst als <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De geheime <code>$!code<\/code> wordt binnen het object bewaard maar nooit prijsgegeven: er is geen accessor <code>.code<\/code>, dus de enige manier om ermee om te gaan is via de methode <code>unlocks<\/code> die de klasse bewust aanbiedt.<\/span> <span class=\"sg\" data-s=\"1\">Een poging om <code>$safe.code<\/code> of <code>$safe!code<\/code> te lezen mislukt eenvoudigweg.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Private attributen zijn nuttig voor interne details waar de rest van het programma niet rechtstreeks aan mag komen.<\/span><\/p>"]]},"es":{"t":"Atributos privados","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sección sobre atributos<\/a> cada atributo se declaraba con <code>$.<\/code>, lo que crea un accesor público.<\/span> <span class=\"sg\" data-s=\"1\">Un atributo declarado con <code>$!<\/code>, en cambio, es <em>privado<\/em>: no tiene accesor y no se ve desde fuera del objeto.<\/span> <span class=\"sg\" data-s=\"2\">Solo es accesible desde los propios métodos de la clase, donde te refieres a él como <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El secreto <code>$!code<\/code> se guarda dentro del objeto pero nunca se expone: no hay accesor <code>.code<\/code>, así que la única manera de interactuar con él es el método <code>unlocks<\/code> que la clase decide ofrecer.<\/span> <span class=\"sg\" data-s=\"1\">Un intento de leer <code>$safe.code<\/code> o <code>$safe!code<\/code> simplemente falla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los atributos privados son útiles para los detalles internos que el resto del programa no debería tocar directamente.<\/span><\/p>"]]},"it":{"t":"Attributi privati","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sezione sugli attributi<\/a> ogni attributo era dichiarato con <code>$.<\/code>, che crea un accessore pubblico.<\/span> <span class=\"sg\" data-s=\"1\">Un attributo dichiarato con <code>$!<\/code>, invece, è <em>privato<\/em>: non ha accessore e non si vede dall'esterno dell'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">È raggiungibile solo dai metodi della classe stessa, dove ci si riferisce a esso come <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il segreto <code>$!code<\/code> è conservato dentro l'oggetto ma non viene mai esposto: non c'è alcun accessore <code>.code<\/code>, quindi l'unico modo per interagirvi è il metodo <code>unlocks<\/code> che la classe sceglie di fornire.<\/span> <span class=\"sg\" data-s=\"1\">Un tentativo di leggere <code>$safe.code<\/code> o <code>$safe!code<\/code> semplicemente fallisce.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli attributi privati sono utili per i dettagli interni che il resto del programma non dovrebbe toccare direttamente.<\/span><\/p>"]]},"lv":{"t":"Privāti atribūti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/oop/attributes/\" target=\"_blank\" rel=\"noopener\">Sadaļā par atribūtiem<\/a> katrs atribūts tika deklarēts ar <code>$.<\/code>, kas izveido publisku piekļuves metodi.<\/span> <span class=\"sg\" data-s=\"1\">Atribūts, kas deklarēts ar <code>$!<\/code>, savukārt ir <em>privāts<\/em>: tam nav piekļuves metodes, un no ārpuses to nevar redzēt.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir sasniedzams tikai klases pašas metodēs, kur uz to atsaucaties kā <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Slepenais <code>$!code<\/code> glabājas objekta iekšienē, taču nekad netiek atklāts: piekļuves metodes <code>.code<\/code> nav, tāpēc vienīgais veids, kā ar to mijiedarboties, ir metode <code>unlocks<\/code>, ko klase izvēlas piedāvāt.<\/span> <span class=\"sg\" data-s=\"1\">Mēģinājums nolasīt <code>$safe.code<\/code> vai <code>$safe!code<\/code> vienkārši neizdodas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Privāti atribūti noder iekšējām detaļām, kurām pārējā programma nedrīkst pieskarties tieši.<\/span><\/p>"]]},"ru":{"t":"Приватные атрибуты","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/oop/attributes/\" target=\"_blank\" rel=\"noopener\">разделе об атрибутах<\/a> каждый атрибут объявлялся через <code>$.<\/code>, что создаёт публичный аксессор.<\/span> <span class=\"sg\" data-s=\"1\">Атрибут, объявленный через <code>$!<\/code>, наоборот, является <em>приватным<\/em>: у него нет аксессора, и снаружи объекта его не видно.<\/span> <span class=\"sg\" data-s=\"2\">Он доступен только из методов самого класса, где к нему обращаются как <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Секретный <code>$!code<\/code> хранится внутри объекта, но никогда не раскрывается: аксессора <code>.code<\/code> нет, поэтому единственный способ работать с ним — метод <code>unlocks<\/code>, который класс решил предоставить.<\/span> <span class=\"sg\" data-s=\"1\">Попытка прочитать <code>$safe.code<\/code> или <code>$safe!code<\/code> просто не сработает.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приватные атрибуты полезны для внутренних деталей, к которым остальной программе не следует обращаться напрямую.<\/span><\/p>"]]},"uk":{"t":"Приватні атрибути","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/oop/attributes/\" target=\"_blank\" rel=\"noopener\">розділі про атрибути<\/a> кожен атрибут оголошували через <code>$.<\/code>, що створює публічний аксесор.<\/span> <span class=\"sg\" data-s=\"1\">Атрибут, оголошений натомість через <code>$!<\/code>, є <em>приватним<\/em>: він не має аксесора й не видимий ззовні об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">Дістатися до нього можна лише з власних методів класу, де на нього посилаються як <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таємний <code>$!code<\/code> зберігається всередині об'єкта, але ніколи не виставляється назовні: аксесора <code>.code<\/code> немає, тож єдиний спосіб взаємодіяти з ним — через метод <code>unlocks<\/code>, який клас вирішує надати.<\/span> <span class=\"sg\" data-s=\"1\">Спроба прочитати <code>$safe.code<\/code> чи <code>$safe!code<\/code> просто зазнає невдачі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приватні атрибути корисні для внутрішніх подробиць, яких решта програми не має торкатися напряму.<\/span><\/p>"]]},"bg":{"t":"Частни атрибути","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/oop/attributes/\" target=\"_blank\" rel=\"noopener\">раздела за атрибутите<\/a> всеки атрибут беше деклариран с <code>$.<\/code>, което създава публичен аксесор.<\/span> <span class=\"sg\" data-s=\"1\">Атрибут, деклариран вместо това с <code>$!<\/code>, е <em>частен<\/em>: той няма аксесор и не се вижда отвън.<\/span> <span class=\"sg\" data-s=\"2\">Достъпен е само от собствените методи на класа, където се обръщате към него като <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тайният <code>$!code<\/code> се съхранява вътре в обекта, но никога не се излага навън: няма аксесор <code>.code<\/code>, така че единственият начин да си взаимодействате с него е през метода <code>unlocks<\/code>, който класът е решил да предостави.<\/span> <span class=\"sg\" data-s=\"1\">Опит да се прочете <code>$safe.code<\/code> или <code>$safe!code<\/code> просто се проваля.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Частните атрибути са полезни за вътрешни подробности, до които останалата част от програмата не бива да посяга пряко.<\/span><\/p>"]]},"eo":{"t":"Privataj atributoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/eo/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sekcio pri atributoj<\/a>, ĉiu atributo estis deklarita per <code>$.<\/code>, kio kreas publikan atingilon.<\/span> <span class=\"sg\" data-s=\"1\">Atributo deklarita per <code>$!<\/code> anstataŭe estas <em>privata<\/em>: ĝi havas neniun atingilon kaj ne videblas de ekstere de la objekto.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas atingebla nur el ene de la propraj metodoj de la klaso, kie vi referencas ĝin kiel <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekreta <code>$!code<\/code> estas konservita ene de la objekto sed neniam elmontrita: ne estas atingilo <code>.code<\/code>, do la sola maniero interagi kun ĝi estas tra la metodo <code>unlocks<\/code>, kiun la klaso elektas provizi.<\/span> <span class=\"sg\" data-s=\"1\">Provo legi <code>$safe.code<\/code> aŭ <code>$safe!code<\/code> simple malsukcesas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Privataj atributoj estas utilaj por internaj detaloj, kiujn la resto de la programo ne devus tuŝi rekte.<\/span><\/p>"]]},"la":{"t":"Attributa privata","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"https://course.raku.org/la/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sectione de attributis<\/a> unumquodque attributum per <code>$.<\/code> declaratum est, quod accessorem publicum creat.<\/span> <span class=\"sg\" data-s=\"1\">Attributum per <code>$!<\/code> declaratum contra <em>privatum<\/em> est: accessorem non habet et ab exteriore obiecti videri non potest.<\/span> <span class=\"sg\" data-s=\"2\">Solum intra proprias classis methodos attingi potest, ubi ad illud ut <code>$!name<\/code> spectas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secretum <code>$!code<\/code> intra obiectum servatur sed numquam patefit: nullus accessor <code>.code<\/code> est, itaque unicus modus cum eo agendi est methodus <code>unlocks<\/code> quam classis praebere elegit.<\/span> <span class=\"sg\" data-s=\"1\">Conatus <code>$safe.code<\/code> vel <code>$safe!code<\/code> legendi simpliciter deficit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Attributa privata utilia sunt pro particulis internis quas cetera programmatis pars directe tangere non debet.<\/span><\/p>"]]}}}</script>
