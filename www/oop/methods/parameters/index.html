<script type="application/json" id="page-data">{"u":"oop/methods/parameters","n":790,"k":"topic","pv":"oop/methods/private-attributes","nx":"oop/methods/calling-methods","tr":["oop","oop/methods"],"L":{"en":{"t":"Methods with parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A method can take parameters, just like a subroutine.<\/span> <span class=\"sg\" data-s=\"1\">You list them in parentheses after the method name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>deposit<\/code> method takes one parameter, <code>$amount<\/code>, and adds it to the object’s balance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each call works on the object it was called on, so the same method can update different objects independently.<\/span> <span class=\"sg\" data-s=\"1\">Methods can take positional and named parameters, default values, and everything else you have already seen in subroutine signatures.<\/span><\/p>"]]},"de":{"t":"Methoden mit Parametern","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Methode kann Parameter aufnehmen, genau wie eine Subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Sie führen sie in Klammern hinter dem Methodennamen auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>deposit<\/code> nimmt einen Parameter, <code>$amount<\/code>, und addiert ihn zum Kontostand des Objekts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf wirkt auf das Objekt, auf dem er aufgerufen wurde, dieselbe Methode kann also verschiedene Objekte unabhängig voneinander aktualisieren.<\/span> <span class=\"sg\" data-s=\"1\">Methoden können positionale und benannte Parameter, Standardwerte und alles Weitere aufnehmen, was Sie schon aus Subroutinen-Signaturen kennen.<\/span><\/p>"]]},"nl":{"t":"Methoden met parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een methode kan parameters aannemen, net als een subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Je somt ze op tussen haakjes achter de naam van de methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>deposit<\/code> neemt één parameter, <code>$amount<\/code>, en telt die op bij het saldo van het object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep werkt op het object waarop hij is aangeroepen, dus dezelfde methode kan verschillende objecten onafhankelijk bijwerken.<\/span> <span class=\"sg\" data-s=\"1\">Methoden kunnen positionele en benoemde parameters aannemen, standaardwaarden hebben, en al het andere dat je al in de signaturen van subroutines gezien hebt.<\/span><\/p>"]]},"es":{"t":"Métodos con parámetros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un método puede recibir parámetros, igual que una subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Se enumeran entre paréntesis después del nombre del método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>deposit<\/code> recibe un parámetro, <code>$amount<\/code>, y lo suma al saldo del objeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada llamada actúa sobre el objeto sobre el que se hizo, así que el mismo método puede actualizar objetos distintos de forma independiente.<\/span> <span class=\"sg\" data-s=\"1\">Los métodos pueden recibir parámetros posicionales y con nombre, valores por defecto y todo lo demás que ya has visto en las firmas de las subrutinas.<\/span><\/p>"]]},"it":{"t":"Metodi con parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metodo può prendere parametri, proprio come una subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Li elenchi fra parentesi dopo il nome del metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>deposit<\/code> prende un parametro, <code>$amount<\/code>, e lo aggiunge al saldo dell'oggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata agisce sull'oggetto su cui è stata chiamata, quindi lo stesso metodo può aggiornare oggetti diversi in modo indipendente.<\/span> <span class=\"sg\" data-s=\"1\">I metodi possono prendere parametri posizionali e nominati, valori predefiniti e tutto il resto che hai già visto nelle firme delle subroutine.<\/span><\/p>"]]},"lv":{"t":"Metodes ar parametriem","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode var ņemt parametrus, gluži kā apakšprogramma.<\/span> <span class=\"sg\" data-s=\"1\">Tos uzskaitāt iekavās aiz metodes nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>deposit<\/code> ņem vienu parametru <code>$amount<\/code> un pieskaita to objekta bilancei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums strādā ar to objektu, uz kura tas tika izsaukts, tāpēc viena un tā pati metode var neatkarīgi atjaunināt dažādus objektus.<\/span> <span class=\"sg\" data-s=\"1\">Metodes var ņemt pozicionālus un nosauktus parametrus, noklusētās vērtības un visu pārējo, ko jau esat redzējuši apakšprogrammu parakstos.<\/span><\/p>"]]},"ru":{"t":"Методы с параметрами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод может принимать параметры, как и подпрограмма.<\/span> <span class=\"sg\" data-s=\"1\">Они перечисляются в круглых скобках после имени метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>deposit<\/code> принимает один параметр, <code>$amount<\/code>, и прибавляет его к балансу объекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов работает с тем объектом, у которого он был сделан, поэтому один и тот же метод может независимо изменять разные объекты.<\/span> <span class=\"sg\" data-s=\"1\">Методы могут принимать позиционные и именованные параметры, значения по умолчанию и всё остальное, что вы уже видели в сигнатурах подпрограмм.<\/span><\/p>"]]},"uk":{"t":"Методи з параметрами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод може приймати параметри, так само як підпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Ви перелічуєте їх у дужках після імені методу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>deposit<\/code> приймає один параметр, <code>$amount<\/code>, і додає його до балансу об'єкта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик працює з тим об'єктом, для якого його зроблено, тож той самий метод може незалежно оновлювати різні об'єкти.<\/span> <span class=\"sg\" data-s=\"1\">Методи можуть приймати позиційні та іменовані параметри, типові значення й усе інше, що ви вже бачили в сигнатурах підпрограм.<\/span><\/p>"]]},"bg":{"t":"Методи с параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът може да приема параметри, точно както подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Изброявате ги в скоби след името на метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>deposit<\/code> приема един параметър — <code>$amount<\/code> — и го добавя към баланса на обекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване работи върху обекта, върху който е извикано, така че един и същ метод може да обновява различни обекти независимо.<\/span> <span class=\"sg\" data-s=\"1\">Методите могат да приемат позиционни и именувани параметри, стойности по подразбиране и всичко останало, което вече видяхте в сигнатурите на подпрограмите.<\/span><\/p>"]]}}}</script>
