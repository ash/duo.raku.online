<script type="application/json" id="page-data">{"u":"oop/methods/exercises/bank-account/solution","n":795,"k":"solution","pv":"oop/methods/exercises/bank-account","nx":"oop/methods/exercises/greeter","tr":["oop","oop/methods"],"L":{"en":{"t":"The solution of ’A walking robot‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>position<\/code> attribute is <code>is rw<\/code> so that the method can change it, and it defaults to <code>0<\/code> so a fresh robot starts at the origin.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>move<\/code> method gives its parameter a default value, <code>$steps = 1<\/code>. The bare call <code>$r.move<\/code> therefore advances by one step, while <code>$r.move(5)<\/code> and <code>$r.move(2)<\/code> advance by the amount given. The three calls add <code>5 + 1 + 2<\/code>, so the final position is <code>8<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein laufender Roboter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Attribut <code>position<\/code> ist <code>is rw<\/code>, damit die Methode es ändern kann, und es ist standardmäßig <code>0<\/code>, sodass ein frischer Roboter im Ursprung startet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Methode <code>move<\/code> gibt ihrem Parameter einen Standardwert, <code>$steps = 1<\/code>. Der bloße Aufruf <code>$r.move<\/code> rückt daher um einen Schritt vor, während <code>$r.move(5)<\/code> und <code>$r.move(2)<\/code> um den angegebenen Betrag vorrücken. Die drei Aufrufe addieren <code>5 + 1 + 2<\/code>, die Endposition ist also <code>8<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een lopende robot","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het attribuut <code>position<\/code> is <code>is rw<\/code> zodat de methode het kan veranderen, en het is standaard <code>0<\/code> zodat een verse robot in de oorsprong begint.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De methode <code>move<\/code> geeft haar parameter een standaardwaarde, <code>$steps = 1<\/code>. De kale aanroep <code>$r.move<\/code> schuift dus één stap op, terwijl <code>$r.move(5)<\/code> en <code>$r.move(2)<\/code> met het gegeven aantal opschuiven. De drie aanroepen tellen <code>5 + 1 + 2<\/code> op, dus de eindpositie is <code>8<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un robot que camina","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El atributo <code>position<\/code> es <code>is rw<\/code> para que el método pueda cambiarlo, y su valor por defecto es <code>0<\/code> para que un robot recién creado arranque en el origen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El método <code>move<\/code> da a su parámetro un valor por defecto, <code>$steps = 1<\/code>. La llamada escueta <code>$r.move<\/code> avanza por tanto un paso, mientras que <code>$r.move(5)<\/code> y <code>$r.move(2)<\/code> avanzan la cantidad indicada. Las tres llamadas suman <code>5 + 1 + 2<\/code>, así que la posición final es <code>8<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un robot che cammina","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'attributo <code>position<\/code> è <code>is rw<\/code> perché il metodo possa cambiarlo, e ha valore predefinito <code>0<\/code> così che un robot appena creato parta dall'origine.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il metodo <code>move<\/code> dà al suo parametro un valore predefinito, <code>$steps = 1<\/code>. La chiamata nuda <code>$r.move<\/code> avanza quindi di un passo, mentre <code>$r.move(5)<\/code> e <code>$r.move(2)<\/code> avanzano della quantità indicata. Le tre chiamate sommano <code>5 + 1 + 2<\/code>, quindi la posizione finale è <code>8<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Ejošs robots","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Atribūts <code>position<\/code> ir <code>is rw<\/code>, lai metode to varētu mainīt, un pēc noklusējuma ir <code>0<\/code>, lai svaigs robots sāktu koordinātu sākumpunktā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Metode <code>move<\/code> savam parametram dod noklusēto vērtību <code>$steps = 1<\/code>. Tāpēc kails izsaukums <code>$r.move<\/code> pavirza par vienu soli, bet <code>$r.move(5)<\/code> un <code>$r.move(2)<\/code> — par doto daudzumu. Trīs izsaukumi saskaita <code>5 + 1 + 2<\/code>, tāpēc galīgā pozīcija ir <code>8<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Шагающий робот","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Атрибут <code>position<\/code> объявлен с <code>is rw<\/code>, чтобы метод мог его изменять, и по умолчанию равен <code>0<\/code>, так что новый робот начинает в начале координат.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Метод <code>move<\/code> задаёт своему параметру значение по умолчанию — <code>$steps = 1<\/code>. Поэтому вызов без аргументов, <code>$r.move<\/code>, продвигает на один шаг, а <code>$r.move(5)<\/code> и <code>$r.move(2)<\/code> — на указанное число. Три вызова дают в сумме <code>5 + 1 + 2<\/code>, поэтому итоговая позиция равна <code>8<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Робот, що крокує","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Атрибут <code>position<\/code> позначено <code>is rw<\/code>, щоб метод міг його змінювати, а типове значення <code>0<\/code> означає, що новий робот починає з початку координат.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Метод <code>move<\/code> надає своєму параметру типове значення — <code>$steps = 1<\/code>. Тому голий виклик <code>$r.move<\/code> просуває на один крок, тоді як <code>$r.move(5)<\/code> та <code>$r.move(2)<\/code> просувають на задану величину. Три виклики додають <code>5 + 1 + 2<\/code>, тож остаточна позиція дорівнює <code>8<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Крачещ робот","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Robot {\n    has $.position is rw = 0;\n\n    method move($steps = 1) {\n        $.position += $steps;\n    }\n}\n\nmy $r = Robot.new;\n$r.move(5);\n$r.move;\n$r.move(2);\n\nsay $r.position;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/methods/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>8<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Атрибутът <code>position<\/code> е <code>is rw<\/code>, за да може методът да го променя, и по подразбиране е <code>0<\/code>, така че новосъздаден робот започва от началото.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Методът <code>move<\/code> дава на параметъра си стойност по подразбиране — <code>$steps = 1<\/code>. Затова голото извикване <code>$r.move<\/code> придвижва с една стъпка, докато <code>$r.move(5)<\/code> и <code>$r.move(2)<\/code> придвижват със зададената величина. Трите извиквания добавят <code>5 + 1 + 2<\/code>, така че крайната позиция е <code>8<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
