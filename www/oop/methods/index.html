<script type="application/json" id="page-data">{"u":"oop/methods","n":788,"k":"section","pv":"oop/attributes/exercises/changeable-label/solution","nx":"oop/methods/private-attributes","tr":["oop"],"L":{"en":{"t":"Methods","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Attributes give an object its data; <em>methods<\/em> give it behaviour.<\/span> <span class=\"sg\" data-s=\"1\">A method is a subroutine that belongs to a class and is called on an object.<\/span> <span class=\"sg\" data-s=\"2\">You declare one with the <code>method<\/code> keyword:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Call a method on an object using the dot, just like an accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Inside a method, the object on which the method was called is available as <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The attributes are reached through their accessors, written <code>$.name<\/code>, <code>$.age<\/code>, and so on.<\/span> <span class=\"sg\" data-s=\"2\">These also work inside interpolated strings:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following topics cover private attributes (now that we have methods to use them), methods that take parameters, and methods that call other methods.<\/span><\/p>"]]},"de":{"t":"Methoden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Attribute geben einem Objekt seine Daten; <em>Methoden<\/em> geben ihm Verhalten.<\/span> <span class=\"sg\" data-s=\"1\">Eine Methode ist eine Subroutine, die zu einer Klasse gehört und auf einem Objekt aufgerufen wird.<\/span> <span class=\"sg\" data-s=\"2\">Sie deklarieren sie mit dem Schlüsselwort <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rufen Sie eine Methode auf einem Objekt mit dem Punkt auf, genau wie einen Accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Innerhalb einer Methode steht das Objekt, auf dem die Methode aufgerufen wurde, als <code>self<\/code> zur Verfügung.<\/span> <span class=\"sg\" data-s=\"1\">Die Attribute erreichen Sie über ihre Accessoren, geschrieben als <code>$.name<\/code>, <code>$.age<\/code> und so weiter.<\/span> <span class=\"sg\" data-s=\"2\">Diese funktionieren auch in interpolierten Zeichenketten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Themen behandeln private Attribute (nun, da wir Methoden haben, um sie zu nutzen), Methoden mit Parametern und Methoden, die andere Methoden aufrufen.<\/span><\/p>"]]},"nl":{"t":"Methoden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Attributen geven een object zijn gegevens; <em>methoden<\/em> geven het gedrag.<\/span> <span class=\"sg\" data-s=\"1\">Een methode is een subroutine die bij een klasse hoort en die op een object wordt aangeroepen.<\/span> <span class=\"sg\" data-s=\"2\">Je declareert er een met het sleutelwoord <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Roep een methode op een object aan met de punt, net als een accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Binnen een methode is het object waarop de methode is aangeroepen beschikbaar als <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De attributen bereik je via hun accessors, geschreven als <code>$.name<\/code>, <code>$.age<\/code> enzovoort.<\/span> <span class=\"sg\" data-s=\"2\">Die werken ook binnen geïnterpoleerde strings:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen behandelen private attributen (nu we methoden hebben om ze te gebruiken), methoden die parameters aannemen, en methoden die andere methoden aanroepen.<\/span><\/p>"]]},"es":{"t":"Métodos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los atributos dan a un objeto sus datos; los <em>métodos<\/em> le dan comportamiento.<\/span> <span class=\"sg\" data-s=\"1\">Un método es una subrutina que pertenece a una clase y se llama sobre un objeto.<\/span> <span class=\"sg\" data-s=\"2\">Se declara con la palabra clave <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Llama a un método sobre un objeto usando el punto, igual que a un accesor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro de un método, el objeto sobre el que se llamó está disponible como <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A los atributos se llega a través de sus accesores, escritos <code>$.name<\/code>, <code>$.age<\/code> y demás.<\/span> <span class=\"sg\" data-s=\"2\">También funcionan dentro de cadenas interpoladas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los temas siguientes tratan los atributos privados (ahora que tenemos métodos para usarlos), los métodos que reciben parámetros y los métodos que llaman a otros métodos.<\/span><\/p>"]]},"it":{"t":"Metodi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Gli attributi danno a un oggetto i suoi dati; i <em>metodi<\/em> gli danno un comportamento.<\/span> <span class=\"sg\" data-s=\"1\">Un metodo è una subroutine che appartiene a una classe e viene chiamata su un oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Se ne dichiara uno con la parola chiave <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Chiama un metodo su un oggetto usando il punto, proprio come un accessore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro un metodo, l'oggetto su cui il metodo è stato chiamato è disponibile come <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Gli attributi si raggiungono attraverso i loro accessori, scritti <code>$.name<\/code>, <code>$.age<\/code> e così via.<\/span> <span class=\"sg\" data-s=\"2\">Funzionano anche dentro le stringhe interpolate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti che seguono trattano gli attributi privati (ora che abbiamo i metodi per usarli), i metodi che prendono parametri e i metodi che chiamano altri metodi.<\/span><\/p>"]]},"lv":{"t":"Metodes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Atribūti dod objektam datus; <em>metodes<\/em> dod tam uzvedību.<\/span> <span class=\"sg\" data-s=\"1\">Metode ir apakšprogramma, kas pieder klasei un tiek izsaukta uz objekta.<\/span> <span class=\"sg\" data-s=\"2\">To deklarē ar atslēgvārdu <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metodi uz objekta izsauc ar punktu, gluži tāpat kā piekļuves metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metodes iekšienē objekts, uz kura metode tika izsaukta, ir pieejams kā <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atribūti tiek sasniegti caur to piekļuves metodēm, ko raksta <code>$.name<\/code>, <code>$.age<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"2\">Tās darbojas arī interpolētu virkņu iekšienē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati aplūko privātus atribūtus (tagad, kad mums ir metodes, ar ko tos izmantot), metodes ar parametriem un metodes, kas izsauc citas metodes.<\/span><\/p>"]]},"ru":{"t":"Методы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Атрибуты дают объекту данные; <em>методы<\/em> дают ему поведение.<\/span> <span class=\"sg\" data-s=\"1\">Метод — это подпрограмма, которая принадлежит классу и вызывается у объекта.<\/span> <span class=\"sg\" data-s=\"2\">Объявляется он ключевым словом <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод вызывается у объекта через точку, точно так же, как аксессор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри метода объект, у которого метод был вызван, доступен как <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">К атрибутам обращаются через их аксессоры, записываемые как <code>$.name<\/code>, <code>$.age<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"2\">Они работают и в интерполируемых строках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующие темы посвящены приватным атрибутам (теперь, когда у нас есть методы, чтобы ими пользоваться), методам с параметрами и методам, вызывающим другие методы.<\/span><\/p>"]]},"uk":{"t":"Методи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Атрибути дають об'єктові дані; <em>методи<\/em> дають йому поведінку.<\/span> <span class=\"sg\" data-s=\"1\">Метод — це підпрограма, яка належить класу й викликається для об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">Оголошують її ключовим словом <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Викликайте метод для об'єкта через крапку, так само як аксесор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Усередині методу об'єкт, для якого метод викликано, доступний як <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">До атрибутів дістаються через їхні аксесори, які записують як <code>$.name<\/code>, <code>$.age<\/code> тощо.<\/span> <span class=\"sg\" data-s=\"2\">Вони працюють і всередині інтерпольованих рядків:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми охоплюють приватні атрибути (тепер, коли ми маємо методи, щоб ними користуватися), методи з параметрами та методи, які викликають інші методи.<\/span><\/p>"]]},"bg":{"t":"Методи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Атрибутите дават на обекта неговите данни; <em>методите<\/em> му дават поведение.<\/span> <span class=\"sg\" data-s=\"1\">Методът е подпрограма, която принадлежи на клас и се извиква върху обект.<\/span> <span class=\"sg\" data-s=\"2\">Декларира се с ключовата дума <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикайте метод върху обект с точка, точно както аксесор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вътре в метода обектът, върху който е извикан методът, е достъпен като <code>self<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">До атрибутите се стига през аксесорите им, записвани <code>$.name<\/code>, <code>$.age<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"2\">Те работят и в интерполирани низове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми обхващат частните атрибути (вече имаме методи, с които да ги използваме), методите с параметри и методите, които извикват други методи.<\/span><\/p>"]]}}}</script>
