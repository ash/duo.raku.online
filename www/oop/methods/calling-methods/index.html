<script type="application/json" id="page-data">{"u":"oop/methods/calling-methods","n":791,"k":"topic","pv":"oop/methods/parameters","nx":"oop/methods/calling-methods/quiz","tr":["oop","oop/methods"],"L":{"en":{"t":"Methods calling methods","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">A method can call another method on the same object through <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Inside <code>describe<\/code>, the call <code>self.area<\/code> runs the <code>area<\/code> method on the same circle, and its result is used to build the description.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You write <code>self.area<\/code> — with the dot — to call a method, just as an outside caller would call it on an instance, e.g.: <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This lets you build more complex behaviour out of smaller methods, each doing one job.<\/span><\/p>"]]},"de":{"t":"Methoden, die Methoden aufrufen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine Methode kann über <code>self<\/code> eine andere Methode auf demselben Objekt aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Innerhalb von <code>describe<\/code> führt der Aufruf <code>self.area<\/code> die Methode <code>area<\/code> auf demselben Kreis aus, und ihr Ergebnis wird für die Beschreibung verwendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie schreiben <code>self.area<\/code> — mit dem Punkt —, um eine Methode aufzurufen, genau wie sie ein Aufrufer von außen auf einer Instanz aufrufen würde, etwa <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So bauen Sie komplexeres Verhalten aus kleineren Methoden auf, von denen jede eine Aufgabe erledigt.<\/span><\/p>"]]},"nl":{"t":"Methoden die methoden aanroepen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Een methode kan via <code>self<\/code> een andere methode op hetzelfde object aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Binnen <code>describe<\/code> draait de aanroep <code>self.area<\/code> de methode <code>area<\/code> op dezelfde cirkel, en het resultaat wordt gebruikt om de beschrijving op te bouwen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je schrijft <code>self.area<\/code> — met de punt — om een methode aan te roepen, precies zoals een aanroeper van buiten hem op een instantie zou aanroepen, bijvoorbeeld: <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zo bouw je complexer gedrag op uit kleinere methoden, die elk één taak doen.<\/span><\/p>"]]},"es":{"t":"Métodos que llaman a métodos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un método puede llamar a otro método sobre el mismo objeto a través de <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro de <code>describe<\/code>, la llamada <code>self.area<\/code> ejecuta el método <code>area<\/code> sobre el mismo círculo, y su resultado se usa para construir la descripción.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Escribes <code>self.area<\/code> — con el punto — para llamar a un método, igual que lo llamaría desde fuera quien tuviera la instancia, por ejemplo <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto te permite construir comportamientos más complejos a partir de métodos más pequeños, cada uno con un solo cometido.<\/span><\/p>"]]},"it":{"t":"Metodi che chiamano metodi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un metodo può chiamare un altro metodo sullo stesso oggetto attraverso <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro <code>describe<\/code>, la chiamata <code>self.area<\/code> esegue il metodo <code>area<\/code> sullo stesso cerchio, e il suo risultato viene usato per costruire la descrizione.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scrivi <code>self.area<\/code> — con il punto — per chiamare un metodo, esattamente come lo chiamerebbe un chiamante esterno su un'istanza, per esempio <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo ti permette di costruire comportamenti più complessi a partire da metodi più piccoli, ciascuno con un compito solo.<\/span><\/p>"]]},"lv":{"t":"Metodes, kas izsauc metodes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode var izsaukt citu metodi uz tā paša objekta caur <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>describe<\/code> iekšienē izsaukums <code>self.area<\/code> izpilda metodi <code>area<\/code> uz tā paša apļa, un tās rezultāts tiek izmantots apraksta uzbūvēšanai.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metodes izsaukšanai rakstāt <code>self.area<\/code> — ar punktu — gluži tāpat, kā to uz instances izsauktu ārējs izsaucējs, piemēram, <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj sarežģītāku uzvedību uzbūvēt no mazākām metodēm, no kurām katra dara vienu darbu.<\/span><\/p>"]]},"ru":{"t":"Методы, вызывающие методы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод может вызвать другой метод того же объекта через <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Внутри <code>describe<\/code> вызов <code>self.area<\/code> выполняет метод <code>area<\/code> у той же самой окружности, и его результат используется для построения описания.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы вызвать метод, пишут <code>self.area<\/code> — через точку, — точно так же, как это сделал бы внешний вызывающий код у экземпляра, например <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет собирать более сложное поведение из небольших методов, каждый из которых делает одну работу.<\/span><\/p>"]]},"uk":{"t":"Методи, що викликають методи","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод може викликати інший метод того самого об'єкта через <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усередині <code>describe<\/code> виклик <code>self.area<\/code> виконує метод <code>area<\/code> для того самого кола, і його результат використовується для побудови опису.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви пишете <code>self.area<\/code> — із крапкою, — щоб викликати метод, точно так само, як його викликав би зовнішній викликач для екземпляра, наприклад <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє будувати складнішу поведінку з менших методів, кожен з яких робить одну справу.<\/span><\/p>"]]},"bg":{"t":"Методи, извикващи методи","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът може да извика друг метод върху същия обект чрез <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вътре в <code>describe<\/code> извикването <code>self.area<\/code> изпълнява метода <code>area<\/code> върху същата окръжност, а резултатът му се използва за построяване на описанието.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пишете <code>self.area<\/code> — с точката, — за да извикате метод, точно както външен извикващ би го извикал върху екземпляр, например: <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това ви позволява да изградите по-сложно поведение от по-малки методи, всеки от които върши по една работа.<\/span><\/p>"]]}}}</script>
