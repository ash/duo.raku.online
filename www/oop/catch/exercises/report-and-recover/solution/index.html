ATCH {\n        default {\n            say \"warning: {.message}; keeping default\";\n        }\n    }\n}\n\nsay \"timeout is $timeout seconds\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/report-and-recover.raku\" target=\"_blank\" rel=\"noopener\">report-and-recover.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>warning: config missing; keeping default\ntimeout is 30 seconds<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Коли <code>die<\/code> кидає виняток, решта блоку полишається, — тож рядок <code>$timeout = 60<\/code> ніколи не виконується, і <code>$timeout<\/code> зберігає своє типове значення <code>30<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> обробляє виняток (виводячи попередження), тож програма не зупиняється. Вона продовжує з типовим значенням, а це саме те, що означає <em>відновитися<\/em> після помилки: відзначити негаразд, вдатися до чогось безпечного й рушити далі.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Докладвайте и се възстановете","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $timeout = 30;\n\n{\n    die 'config missing';\n    $timeout = 60;\n\n    CATCH {\n        default {\n            say \"warning: {.message}; keeping default\";\n        }\n    }\n}\n\nsay \"timeout is $timeout seconds\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/report-and-recover.raku\" target=\"_blank\" rel=\"noopener\">report-and-recover.rak
