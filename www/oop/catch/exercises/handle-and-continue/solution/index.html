<script type="application/json" id="page-data">{"u":"oop/catch/exercises/handle-and-continue/solution","n":935,"k":"solution","pv":"oop/catch/exercises/handle-and-continue","nx":"oop/catch/exercises/survive-a-loop","tr":["oop","oop/catch"],"L":{"en":{"t":"The solution of ’Handle and continue‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>CATCH<\/code> phaser is inside the per-item block, so it handles a <code>die<\/code> for just that one item. Because the exception is handled there, it never escapes to stop the whole loop.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is the typical use of <code>CATCH<\/code> over <code>try<\/code>: a failure in one iteration is dealt with locally, and the loop moves on to the next item. The middle item fails, but the two <code>ok<\/code> items are still processed.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Behandeln und weitermachen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\ ssage}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>CATCH<\/code>-faser zit binnen het blok per item, dus hij handelt een <code>die<\/code> af voor precies dat ene item. Omdat de exceptie daar afgehandeld wordt, ontsnapt ze nooit om de hele lus stil te leggen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit is het typische gebruik van <code>CATCH<\/code> boven <code>try<\/code>: een mislukking in één iteratie wordt lokaal afgehandeld, en de lus gaat door naar het volgende item. Het middelste item mislukt, maar de twee <code>ok<\/code>-items worden gewoon verwerkt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Maneje y continúe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El phaser <code>CATCH<\/code> está dentro del bloque que trata cada elemento, así que maneja un <code>die<\/code> solo para ese elemento. Como la excepción se maneja ahí, nunca escapa hasta detener todo el bucle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Este es el uso típico de <code>CATCH<\/code> frente a <code>try<\/code>: un fallo en una iteración se resuelve localmente y el bucle pasa al elemento siguiente. El elemento del medio falla, pero los dos elementos <code>ok<\/code> se procesan igualmente.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Gestite e proseguite","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il phaser <code>CATCH<\/code> è dentro il blocco che tratta il singolo elemento, quindi gestisce un <code>die<\/code> per quel solo elemento. Poiché l'eccezione viene gestita lì, non sfugge mai fino a fermare l'intero ciclo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questo è l'uso tipico di <code>CATCH<\/code> rispetto a <code>try<\/code>: un fallimento in un'iterazione viene affrontato localmente, e il ciclo passa all'elemento successivo. L'elemento centrale fallisce, ma i due elementi <code>ok<\/code> vengono comunque elaborati.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Apstrādājiet un turpiniet","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fāzeris <code>CATCH<\/code> atrodas katra elementa blokā, tāpēc tas apstrādā <code>die<\/code> tikai šim vienam elementam. Tā kā izņēmums tiek apstrādāts turpat, tas nekad neizspruk, lai apturētu visu ciklu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šis ir tipiskais <code>CATCH<\/code> lietojums, kur <code>try<\/code> neder: viena apgrieziena neveiksme tiek nokārtota uz vietas, un cikls virzās uz nākamo elementu. Vidējais elements neizdodas, taču abi <code>ok<\/code> elementi joprojām tiek apstrādāti.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Обработайте и продолжите","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> находится внутри блока, относящегося к одному элементу, поэтому он обрабатывает <code>die<\/code> только для этого элемента. Раз исключение обработано там, оно не вырывается наружу и не останавливает весь цикл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В этом и состоит типичное преимущество <code>CATCH<\/code> перед <code>try<\/code>: сбой на одной итерации решается на месте, и цикл переходит к следующему элементу. Средний элемент даёт сбой, но два <code>ok<\/code> всё равно обрабатываются.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Обробити й продовжити","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> міститься всередині блоку для окремого елемента, тож він обробляє <code>die<\/code> лише для цього одного елемента. Оскільки виняток обробляється там, він ніколи не виривається назовні, щоб спинити весь цикл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це типове застосування <code>CATCH<\/code> замість <code>try<\/code>: збій на одній ітерації розв'язується на місці, а цикл переходить до наступного елемента. Середній елемент зазнає невдачі, але два <code>ok<\/code> усе одно обробляються.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Обработете и продължете","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазерът <code>CATCH<\/code> е вътре в блока за отделния елемент, така че обработва <code>die<\/code> само за този един елемент. Понеже изключението е обработено там, то никога не се измъква, за да спре целия цикъл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е типичната употреба на <code>CATCH<\/code> пред <code>try<\/code>: провал в една итерация се решава на място, а цикълът продължава със следващия елемент. Средният елемент се проваля, но двата елемента <code>ok<\/code> все пак се обработват.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Traktu kaj daŭrigu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La fazero <code>CATCH<\/code> estas ene de la po-era bloko, do ĝi traktas <code>die<\/code> por nur tiu unu ero. Ĉar la escepto estas traktata tie, ĝi neniam eskapas por haltigi la tutan buklon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jen la tipa uzo de <code>CATCH<\/code> super <code>try<\/code>: misfunkcio en unu iteracio estas traktata loke, kaj la buklo moviĝas al la sekva ero. La meza ero malsukcesas, sed la du eroj <code>ok<\/code> ankoraŭ estas prilaborataj.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Tracta et perge","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fasis <code>CATCH<\/code> intra clausulam uniuscuiusque elementi est, itaque <code>die<\/code> pro illo uno elemento tantum tractat. Quia exceptio ibi tractatur, numquam effugit ut totum anulum sistat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic est usus typicus <code>CATCH<\/code> prae <code>try<\/code>: defectus in una iteratione lo
