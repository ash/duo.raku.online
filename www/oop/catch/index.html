<script type="application/json" id="page-data">{"u":"oop/catch","n":932,"k":"section","pv":"oop/try/quiz","nx":"oop/catch/exercises","tr":["oop"],"L":{"en":{"t":"The <code>CATCH<\/code> phaser","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>try<\/code> block is convenient, but it treats the whole block as one unit: either it works or it does not.<\/span> <span class=\"sg\" data-s=\"1\">The <code>CATCH<\/code> phaser gives you finer control — it lets you handle an exception <em>inside<\/em> the block where it happened, and decide what to do.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> is a phaser, like the ones you met in the <a href=\"/advanced/phasers/\">section about control flow<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">You write it anywhere inside a block; it runs only if an exception is thrown there.<\/span> <span class=\"sg\" data-s=\"2\">The exception is available as the topic <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>default<\/code> block inside <code>CATCH<\/code> handles any exception.<\/span> <span class=\"sg\" data-s=\"1\">Once it has run, the exception is considered handled, so the program does not stop — execution carries on after the enclosing block, which is why <code>after<\/code> is printed.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without the <code>CATCH<\/code>, the <code>die<\/code> would have ended the program before <code>after<\/code> could be reached.<\/span><\/p>"]]},"de":{"t":"Der <code>CATCH<\/code>-Phaser","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>try<\/code>-Block ist bequem, behandelt aber den ganzen Block als eine Einheit: Entweder er funktioniert oder nicht.<\/span> <span class=\"sg\" data-s=\"1\">Der <code>CATCH<\/code>-Phaser gibt Ihnen feinere Kontrolle — er erlaubt es, eine Ausnahme <em>innerhalb<\/em> des Blocks zu behandeln, in dem sie auftrat, und zu entscheiden, was zu tun ist.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> ist ein Phaser, wie jene, die Sie im <a href=\"https://course.raku.org/de/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über den Programmfluss<\/a> kennengelernt haben.<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben ihn irgendwo in einen Block; er läuft nur, wenn dort eine Ausnahme geworfen wird.<\/span> <span class=\"sg\" data-s=\"2\">Die Ausnahme steht als Thema <code>$_<\/code> zur Verfügung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>default<\/code>-Block innerhalb von <code>CATCH<\/code> behandelt jede Ausnahme.<\/span> <span class=\"sg\" data-s=\"1\">Sobald er gelaufen ist, gilt die Ausnahme als behandelt, das Programm hält also nicht an — die Ausführung geht hinter dem umgebenden Block weiter, weshalb <code>after<\/code> ausgegeben wird.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne das <code>CATCH<\/code> hätte das <code>die<\/code> das Programm beendet, bevor <code>after<\/code> erreicht werden konnte.<\/span><\/p>"]]},"nl":{"t":"De <code>CATCH<\/code>-faser","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>try<\/code>-blok is handig, maar het behandelt het hele blok als één geheel: of het werkt, of het werkt niet.<\/span> <span class=\"sg\" data-s=\"1\">De <code>CATCH<\/code>-faser geeft je fijnere controle — hij laat je een exceptie afhandelen <em>binnen<\/em> het blok waar ze optrad, en beslissen wat er moet gebeuren.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> is een faser, net als die uit de <a href=\"https://course.raku.org/nl/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sectie over besturingsstructuren<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft hem ergens binnen een blok; hij draait alleen als daar een exceptie geworpen wordt.<\/span> <span class=\"sg\" data-s=\"2\">De exceptie is beschikbaar als het onderwerp <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>default<\/code>-blok binnen <code>CATCH<\/code> handelt elke exceptie af.<\/span> <span class=\"sg\" data-s=\"1\">Zodra het gedraaid heeft, geldt de exceptie als afgehandeld, dus stopt het programma niet — de uitvoering gaat verder na het omvattende blok, en daarom wordt <code>after<\/code> afgedrukt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder de <code>CATCH<\/code> zou de <code>die<\/code> het programma beëindigd hebben voordat <code>after<\/code> bereikt kon worden.<\/span><\/p>"]]},"es":{"t":"El phaser <code>CATCH<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>try<\/code> es cómodo, pero trata el bloque entero como una sola unidad: o funciona o no. El phaser <code>CATCH<\/code> te da un control más fino: te permite manejar una excepción <em>dentro<\/em> del bloque donde ocurrió y decidir qué hacer.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> es un phaser, como los que conociste en la <a href=\"https://course.raku.org/es/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sección sobre el flujo de control<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Lo escribes en cualquier punto dentro de un bloque; solo se ejecuta si allí se lanza una excepción.<\/span> <span class=\"sg\" data-s=\"2\">La excepción está disponible como el tema <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code> dentro de <code>CATCH<\/code> maneja cualquier excepción.<\/span> <span class=\"sg\" data-s=\"1\">Una vez que se ha ejecutado, la excepción se considera manejada, así que el programa no se detiene: la ejecución sigue después del bloque que lo contiene, y por eso se imprime <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin el <code>CATCH<\/code>, el <code>die<\/code> habría terminado el programa antes de que se pudiera alcanzar <code>after<\/code>.<\/span><\/p>"]]},"it":{"t":"Il phaser <code>CATCH<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>try<\/code> è comodo, ma tratta l'intero blocco come un'unica unità: o funziona o non funziona.<\/span> <span class=\"sg\" data-s=\"1\">Il phaser <code>CATCH<\/code> ti dà un controllo più fine — ti permette di gestire un'eccezione <em>dentro<\/em> il blocco in cui è avvenuta e di decidere che cosa fare.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> è un phaser, come quelli che hai incontrato nella <a href=\"https://course.raku.org/it/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sezione sul flusso di controllo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Lo scrivi ovunque dentro un blocco; gira solo se lì viene sollevata un'eccezione.<\/span> <span class=\"sg\" data-s=\"2\">L'eccezione è disponibile come argomento corrente <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code> dentro <code>CATCH<\/code> gestisce qualunque eccezione.<\/span> <span class=\"sg\" data-s=\"1\">Una volta che è girato, l'eccezione è considerata gestita, quindi il programma non si ferma: l'esecuzione prosegue dopo il blocco che lo racchiude, ed è per questo che viene stampato <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza il <code>CATCH<\/code>, il <code>die<\/code> avrebbe chiuso il programma prima che si potesse raggiungere <code>after<\/code>.<\/span><\/p>"]]},"lv":{"t":"Fāzeris <code>CATCH<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloks <code>try<\/code> ir ērts, taču tas visu bloku uztver kā vienu veselumu: vai nu tas nostrādā, vai ne.<\/span> <span class=\"sg\" data-s=\"1\">Fāzeris <code>CATCH<\/code> dod smalkāku vadību — tas ļauj izņēmumu apstrādāt <em>iekšpus<\/em> tā bloka, kurā tas notika, un izlemt, ko darīt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> ir fāzeris, tāpat kā tie, ar kuriem iepazināties <a href=\"https://course.raku.org/lv/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sadaļā par vadības plūsmu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">To rakstāt jebkur bloka iekšienē; tas izpildās tikai tad, ja tur tiek izmests izņēmums.<\/span> <span class=\"sg\" data-s=\"2\">Izņēmums ir pieejams kā tēma <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloks <code>default<\/code> <code>CATCH<\/code> iekšienē apstrādā jebkuru izņēmumu.<\/span> <span class=\"sg\" data-s=\"1\">Kad tas ir izpildījies, izņēmums tiek uzskatīts par apstrādātu, tāpēc programma neapstājas — izpilde turpinās aiz apņemošā bloka, un tieši tāpēc tiek izdrukāts <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez <code>CATCH<\/code> <code>die<\/code> būtu beidzis programmu, pirms <code>after<\/code> varētu tikt sasniegts.<\/span><\/p>"]]},"ru":{"t":"Фазер <code>CATCH<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>try<\/code> удобен, но он рассматривает весь блок как одно целое: либо всё получилось, либо нет.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>CATCH<\/code> даёт более тонкий контроль — он позволяет обработать исключение <em>внутри<\/em> того блока, где оно произошло, и решить, что делать дальше.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> — это фазер, как и те, с которыми вы встречались в <a href=\"https://course.raku.org/ru/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">разделе о порядке выполнения<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Его пишут где угодно внутри блока; он срабатывает только тогда, когда там бросается исключение.<\/span> <span class=\"sg\" data-s=\"2\">Само исключение доступно как тема <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> внутри <code>CATCH<\/code> обрабатывает любое исключение.<\/span> <span class=\"sg\" data-s=\"1\">После того как он отработал, исключение считается обработанным, поэтому программа не останавливается: выполнение продолжается за объемлющим блоком — вот почему печатается <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> вызов <code>die<\/code> завершил бы программу раньше, чем дело дошло бы до <code>after<\/code>.<\/span><\/p>"]]},"uk":{"t":"Фазер <code>CATCH<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>try<\/code> зручний, але він розглядає весь блок як одне ціле: або все спрацювало, або ні.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>CATCH<\/code> дає тонше керування — він дозволяє обробити виняток <em>усередині<\/em> того блоку, де той стався, і вирішити, що робити.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> є фазером, як і ті, з якими ви познайомилися в <a href=\"https://course.raku.org/uk/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">розділі про порядок виконання<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ви пишете його будь-де всередині блоку; він виконується, лише якщо там кинуто виняток.<\/span> <span class=\"sg\" data-s=\"2\">Виняток доступний як топік <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> усередині <code>CATCH<\/code> обробляє будь-який виняток.<\/span> <span class=\"sg\" data-s=\"1\">Щойно він виконався, виняток вважається обробленим, тож програма не зупиняється — виконання триває після обгортального блоку, через що й виводиться <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> <code>die<\/code> завершив би програму ще до того, як можна було б дійти до <code>after<\/code>.<\/span><\/p>"]]},"bg":{"t":"Фазерът <code>CATCH<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>try<\/code> е удобен, но третира целия блок като едно цяло: или работи, или не.<\/span> <span class=\"sg\" data-s=\"1\">Фазерът <code>CATCH<\/code> ви дава по-фин контрол — той позволява да обработите изключение <em>вътре<\/em> в блока, където се е случило, и да решите какво да правите.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> е фазер, като онези, с които се запознахте в <a href=\"https://course.raku.org/bg/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">раздела за управлението на потока<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Пишете го където и да е вътре в блок; изпълнява се само ако там бъде хвърлено изключение.<\/span> <span class=\"sg\" data-s=\"2\">Изключението е достъпно като темата <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> вътре в <code>CATCH<\/code> обработва всяко изключение.<\/span> <span class=\"sg\" data-s=\"1\">Щом той се изпълни, изключението се смята за обработено, така че програмата не спира — изпълнението продължава след обхващащия блок, затова се отпечатва <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> <code>die<\/code> би приключил програмата, преди да се стигне до <code>after<\/code>.<\/span><\/p>"]]}}}</script>
