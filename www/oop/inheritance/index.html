<script type="application/json" id="page-data">{"u":"oop/inheritance","n":816,"k":"section","pv":"oop/subs-vs-methods/quiz","nx":"oop/inheritance/overriding","tr":["oop"],"L":{"en":{"t":"Inheritance","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Inheritance<\/em> lets one class build on another.<\/span> <span class=\"sg\" data-s=\"1\">A class declared with <code>is<\/code> after its name inherits the attributes and methods of the class it names — its <em>parent<\/em> (or <em>base<\/em>) class.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> means a <code>Dog<\/code> is a kind of <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Without writing anything new, <code>Dog<\/code> already has the <code>name<\/code> attribute and the <code>speak<\/code> method from <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>Dog<\/code> object is also recognised as an <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The smart-match <code>~~<\/code> against a type is true when the object is of that type or inherits from it.<\/span> <span class=\"sg\" data-s=\"1\">The next topic shows how a child class can replace an inherited method with its own version.<\/span><\/p>"]]},"de":{"t":"Vererbung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit <em>Vererbung<\/em> kann eine Klasse auf einer anderen aufbauen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Klasse, die mit <code>is<\/code> hinter ihrem Namen deklariert wird, erbt die Attribute und Methoden der genannten Klasse — ihrer <em>Elternklasse<\/em> (oder <em>Basisklasse<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> bedeutet, dass ein <code>Dog<\/code> eine Art <code>Animal<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Ohne dass Sie etwas Neues schreiben, hat <code>Dog<\/code> bereits das Attribut <code>name<\/code> und die Methode <code>speak<\/code> von <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Dog<\/code>-Objekt wird auch als <code>Animal<\/code> erkannt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Smartmatch <code>~~<\/code> gegen einen Typ ist wahr, wenn das Objekt von diesem Typ ist oder von ihm erbt.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Thema zeigt, wie eine Kindklasse eine geerbte Methode durch ihre eigene Fassung ersetzen kann.<\/span><\/p>"]]},"nl":{"t":"Overerving","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Met <em>overerving<\/em> kan de ene klasse op de andere voortbouwen.<\/span> <span class=\"sg\" data-s=\"1\">Een klasse die met <code>is<\/code> achter haar naam gedeclareerd wordt, erft de attributen en methoden van de klasse die ze noemt — haar <em>ouderklasse<\/em> (of <em>basisklasse<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> betekent dat een <code>Dog<\/code> een soort <code>Animal<\/code> is.<\/span> <span class=\"sg\" data-s=\"1\">Zonder iets nieuws te schrijven heeft <code>Dog<\/code> al het attribuut <code>name<\/code> en de methode <code>speak<\/code> van <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>Dog<\/code>-object wordt ook herkend als een <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De smart-match <code>~~<\/code> tegen een type is waar wanneer het object van dat type is of ervan erft.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp laat zien hoe een kindklasse een geërfde methode door haar eigen versie kan vervangen.<\/span><\/p>"]]},"es":{"t":"Herencia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La <em>herencia<\/em> permite que una clase se construya sobre otra.<\/span> <span class=\"sg\" data-s=\"1\">Una clase declarada con <code>is<\/code> después de su nombre hereda los atributos y los métodos de la clase que nombra: su clase <em>padre<\/em> (o <em>base<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> significa que un <code>Dog<\/code> es una clase de <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sin escribir nada nuevo, <code>Dog<\/code> ya tiene el atributo <code>name<\/code> y el método <code>speak<\/code> de <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un objeto <code>Dog<\/code> también se reconoce como <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El smart-match <code>~~<\/code> contra un tipo es verdadero cuando el objeto es de ese tipo o hereda de él.<\/span> <span class=\"sg\" data-s=\"1\">El tema siguiente muestra cómo una clase hija puede sustituir un método heredado por una versión propia.<\/span><\/p>"]]},"it":{"t":"Ereditarietà","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'<em>ereditarietà<\/em> permette a una classe di costruire su un'altra.<\/span> <span class=\"sg\" data-s=\"1\">Una classe dichiarata con <code>is<\/code> dopo il proprio nome eredita gli attributi e i metodi della classe che nomina — la sua classe <em>genitrice<\/em> (o <em>base<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> significa che un <code>Dog<\/code> è un tipo di <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Senza scrivere nulla di nuovo, <code>Dog<\/code> ha già l'attributo <code>name<\/code> e il metodo <code>speak<\/code> di <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un oggetto <code>Dog<\/code> viene riconosciuto anche come <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo smart-match <code>~~<\/code> contro un tipo è vero quando l'oggetto è di quel tipo o ne eredita.<\/span> <span class=\"sg\" data-s=\"1\">L'argomento successivo mostra come una classe figlia possa sostituire un metodo ereditato con una versione propria.<\/span><\/p>"]]},"lv":{"t":"Mantošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Mantošana<\/em> ļauj vienai klasei būvēties uz citas.<\/span> <span class=\"sg\" data-s=\"1\">Klase, kas deklarēta ar <code>is<\/code> aiz sava nosaukuma, manto tās klases atribūtus un metodes, kuru nosauc, — savas <em>vecākklases<\/em> (jeb <em>bāzes klases<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> nozīmē, ka <code>Dog<\/code> ir <code>Animal<\/code> paveids.<\/span> <span class=\"sg\" data-s=\"1\">Neko jaunu nerakstot, <code>Dog<\/code> jau ir atribūts <code>name<\/code> un metode <code>speak<\/code> no <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> objekts tiek atpazīts arī kā <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gudrā sakritība <code>~~<\/code> pret tipu ir patiesa, kad objekts ir šī tipa vai to manto.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais temats parāda, kā bērnklase var aizstāt mantotu metodi ar savu versiju.<\/span><\/p>"]]},"ru":{"t":"Наследование","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Наследование<\/em> позволяет одному классу строиться на основе другого.<\/span> <span class=\"sg\" data-s=\"1\">Класс, объявленный с <code>is<\/code> после имени, наследует атрибуты и методы того класса, который он называет, — своего <em>родительского<\/em> (или <em>базового<\/em>) класса.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запись <code>Dog is Animal<\/code> означает, что <code>Dog<\/code> — это разновидность <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ничего нового не написав, <code>Dog<\/code> уже имеет атрибут <code>name<\/code> и метод <code>speak<\/code> из <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Объект <code>Dog<\/code> распознаётся также и как <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Умное сопоставление <code>~~<\/code> с типом истинно, когда объект имеет этот тип или наследует от него.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема показывает, как дочерний класс может заменить унаследованный метод собственной версией.<\/span><\/p>"]]},"uk":{"t":"Успадкування","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Успадкування<\/em> дозволяє одному класу будуватися на іншому.<\/span> <span class=\"sg\" data-s=\"1\">Клас, оголошений з <code>is<\/code> після свого імені, успадковує атрибути й методи названого класу — свого <em>батьківського<\/em> (або <em>базового<\/em>) класу.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означає, що <code>Dog<\/code> є різновидом <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Не написавши нічого нового, <code>Dog<\/code> уже має атрибут <code>name<\/code> і метод <code>speak<\/code> від <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Об'єкт <code>Dog<\/code> розпізнається також і як <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Розумне зіставлення <code>~~<\/code> з типом істинне, коли об'єкт належить до цього типу або успадковує від нього.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема показує, як дочірній клас може замінити успадкований метод власною версією.<\/span><\/p>"]]},"bg":{"t":"Наследяване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Наследяването<\/em> позволява един клас да се надгради над друг.<\/span> <span class=\"sg\" data-s=\"1\">Клас, деклариран с <code>is<\/code> след името си, наследява атрибутите и методите на класа, който назовава — своя <em>родителски<\/em> (или <em>базов<\/em>) клас.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означава, че <code>Dog<\/code> е вид <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без да е написано нищо ново, <code>Dog<\/code> вече има атрибута <code>name<\/code> и метода <code>speak<\/code> от <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обект <code>Dog<\/code> се разпознава и като <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интелигентното съпоставяне <code>~~<\/code> срещу тип е истина, когато обектът е от този тип или наследява от него.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема показва как дъщерен клас може да замени наследен метод със своя собствена версия.<\/span><\/p>"]]}}}</script>
