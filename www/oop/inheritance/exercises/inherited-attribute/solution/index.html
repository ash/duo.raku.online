<script type="application/json" id="page-data">{"u":"oop/inheritance/exercises/inherited-attribute/solution","n":825,"k":"solution","pv":"oop/inheritance/exercises/inherited-attribute","nx":"oop/roles","tr":["oop","oop/inheritance"],"L":{"en":{"t":"The solution of ’An inherited attribute‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> and <code>Car<\/code> both inherit the <code>wheels<\/code> attribute (and its accessor) from <code>Vehicle<\/code>. Neither redeclares the attribute from scratch — they only give the inherited one a default value, <code>2<\/code> and <code>4<\/code> respectively.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Because the default is baked into each class, you can create the objects with a plain <code>Bike.new<\/code> and <code>Car.new<\/code>, and the inherited accessor reads the right number of wheels back.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">You can still pass the value explicitly, for example <code>Car.new(wheels =&gt; 3)<\/code>, and an explicit argument overrides the default. But since a bike or a car most likely already comes with its usual number of wheels, the defaults keep the common case simple while leaving room for the occasional exception.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein geerbtes Attribut","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> und <code>Car<\/code> erben beide das Attribut <code>wheels<\/code> (und seinen Accessor) von <code>Vehicle<\/code>. Keines deklariert das Attribut von Grund auf neu — sie geben dem geerbten lediglich einen Standardwert, <code>2<\/code> beziehungsweise <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Weil der Standardwert in jeder Klasse fest eingebaut ist, können Sie die Objekte mit einem schlichten <code>Bike.new<\/code> und <code>Car.new<\/code> erzeugen, und der geerbte Accessor liest die richtige Anzahl Räder zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sie können den Wert weiterhin ausdrücklich übergeben, etwa <code>Car.new(wheels =&gt; 3)<\/code>, und ein ausdrückliches Argument überschreibt den Standardwert. Da ein Fahrrad oder ein Auto aber höchstwahrscheinlich schon mit seiner üblichen Anzahl Räder kommt, halten die Standardwerte den Normalfall einfach und lassen zugleich Raum für die gelegentliche Ausnahme.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een geërfd attribuut","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> en <code>Car<\/code> erven allebei het attribuut <code>wheels<\/code> (en zijn accessor) van <code>Vehicle<\/code>. Geen van beide declareert het attribuut opnieuw vanaf nul — ze geven het geërfde attribuut alleen een standaardwaarde, respectievelijk <code>2<\/code> en <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omdat de standaardwaarde in elke klasse is ingebakken, kun je de objecten met een simpele <code>Bike.new<\/code> en <code>Car.new<\/code> maken, en leest de geërfde accessor het juiste aantal wielen terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Je kunt de waarde nog steeds expliciet meegeven, bijvoorbeeld <code>Car.new(wheels =&gt; 3)<\/code>, en een expliciet argument overschrijft de standaardwaarde. Maar omdat een fiets of een auto hoogstwaarschijnlijk al met zijn gebruikelijke aantal wielen komt, houden de standaardwaarden het gewone geval eenvoudig en laten ze toch ruimte voor de enkele uitzondering.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un atributo heredado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> y <code>Car<\/code> heredan ambas de <code>Vehicle<\/code> el atributo <code>wheels<\/code> (y su accesor). Ninguna vuelve a declarar el atributo desde cero: solo le dan al heredado un valor por defecto, <code>2<\/code> y <code>4<\/code> respectivamente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Como el valor por defecto está incorporado en cada clase, puedes crear los objetos con un simple <code>Bike.new<\/code> y <code>Car.new<\/code>, y el accesor heredado lee el número correcto de ruedas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Puedes pasar el valor explícitamente, por ejemplo <code>Car.new(wheels =&gt; 3)<\/code>, y un argumento explícito anula el valor por defecto. Pero como una bicicleta o un coche vienen muy probablemente ya con su número habitual de ruedas, los valores por defecto mantienen sencillo el caso común y dejan sitio a la excepción ocasional.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un attributo ereditato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> e <code>Car<\/code> ereditano entrambe da <code>Vehicle<\/code> l'attributo <code>wheels<\/code> (e il suo accessore). Nessuna delle due ridichiara l'attributo da zero: gli danno solo un valore predefinito, rispettivamente <code>2<\/code> e <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Poiché il valore predefinito è incorporato in ciascuna classe, puoi creare gli oggetti con un semplice <code>Bike.new<\/code> e <code>Car.new<\/code>, e l'accessore ereditato rilegge il numero giusto di ruote.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Puoi comunque passare il valore esplicitamente, per esempio <code>Car.new(wheels =&gt; 3)<\/code>, e un argomento esplicito scavalca il valore predefinito. Ma poiché una bici o un'auto arrivano molto probabilmente già con il loro numero abituale di ruote, i valori predefiniti tengono semplice il caso comune lasciando spazio all'eccezione occasionale.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Mantots atribūts","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> un <code>Car<\/code> abi manto no <code>Vehicle<\/code> atribūtu <code>wheels<\/code> (un tā piekļuves metodi). Neviens no tiem atribūtu nedeklarē no jauna — tie mantotajam tikai dod noklusēto vērtību, attiecīgi <code>2<\/code> un <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tā kā noklusējums ir iecepts katrā klasē, objektus var izveidot ar vienkāršu <code>Bike.new<\/code> un <code>Car.new<\/code>, un mantotā piekļuves metode nolasa pareizo riteņu skaitu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vērtību joprojām var padot arī skaidri, piemēram, <code>Car.new(wheels =&gt; 3)<\/code>, un skaidri norādīts arguments pārraksta noklusējumu. Taču, tā kā velosipēdam vai automašīnai visdrīzāk jau ir tam ierastais riteņu skaits, noklusējumi patur biežāko gadījumu vienkāršu, atstājot vietu retajiem izņēmumiem.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Унаследованный атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Bike<\/code>, и <code>Car<\/code> наследуют атрибут <code>wheels<\/code> (вместе с его аксессором) от <code>Vehicle<\/code>. Ни один из них не объявляет атрибут заново — они лишь задают унаследованному значение по умолчанию, <code>2<\/code> и <code>4<\/code> соответственно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поскольку значение по умолчанию заложено в каждый класс, объекты можно создавать простыми <code>Bike.new<\/code> и <code>Car.new<\/code>, а унаследованный аксессор считывает нужное число колёс.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Значение всё ещё можно передать явно, например <code>Car.new(wheels =&gt; 3)<\/code>, и явный аргумент переопределяет значение по умолчанию. Но поскольку у велосипеда или автомобиля скорее всего уже есть привычное число колёс, значения по умолчанию упрощают обычный случай, оставляя место для редких исключений.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Успадкований атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І <code>Bike<\/code>, і <code>Car<\/code> успадковують атрибут <code>wheels<\/code> (та його аксесор) від <code>Vehicle<\/code>. Жоден із них не оголошує атрибут наново — вони лише надають успадкованому типове значення, <code>2<\/code> та <code>4<\/code> відповідно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оскільки типове значення вбудовано в кожен клас, об'єкти можна створювати простими <code>Bike.new<\/code> та <code>Car.new<\/code>, і успадкований аксесор зчитує потрібну кількість коліс.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Значення все одно можна передати явно, наприклад <code>Car.new(wheels =&gt; 3)<\/code>, і явний аргумент перекриває типове значення. Але, оскільки велосипед чи автомобіль найімовірніше вже мають звичну для себе кількість коліс, типові значення тримають поширений випадок простим, лишаючи місце для випадкових винятків.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Наследен атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Bike<\/code>, и <code>Car<\/code> наследяват атрибута <code>wheels<\/code> (и неговия аксесор) от <code>Vehicle<\/code>. Нито един от тях не предекларира атрибута от нулата — те само дават на наследения стойност по подразбиране, съответно <code>2<\/code> и <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Понеже стойността по подразбиране е вградена във всеки клас, можете да създадете обектите с обикновени <code>Bike.new<\/code> и <code>Car.new<\/code>, а наследеният аксесор връща правилния брой колела.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пак можете да подадете стойността изрично, например <code>Car.new(wheels =&gt; 3)<\/code>, и изричният аргумент надделява над стойността по подразбиране. Но понеже колелото или автомобилът най-вероятно вече идват с обичайния си брой колела, стойностите по подразбиране държат обичайния случай прост, оставяйки място за случайното изключение.<\/span><\/li><\/ol>"]]}}}</script>
