<script type="application/json" id="page-data">{"u":"oop/inheritance/overriding","n":817,"k":"topic","pv":"oop/inheritance","nx":"oop/inheritance/overriding/quiz","tr":["oop","oop/inheritance"],"L":{"en":{"t":"Overriding methods","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A child class can provide its own version of an inherited method.<\/span> <span class=\"sg\" data-s=\"1\">This is called <em>overriding<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">When the method is called on an object of the child class, the child’s version runs instead of the parent’s.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> and <code>Cat<\/code> each override <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>intro<\/code> method, inherited unchanged from <code>Animal<\/code>, calls <code>self.speak<\/code> — and that call uses whichever <code>speak<\/code> belongs to the actual object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So the same inherited <code>intro<\/code> produces different results, because each object brings its own <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is one of the central ideas of object-oriented programming: shared code that adapts to the specific kind of object it works on.<\/span><\/p>"]]},"de":{"t":"Methoden überschreiben","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Kindklasse kann ihre eigene Fassung einer geerbten Methode anbieten.<\/span> <span class=\"sg\" data-s=\"1\">Das nennt man <em>Überschreiben<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Wird die Methode auf einem Objekt der Kindklasse aufgerufen, läuft die Fassung des Kindes statt der des Elternteils.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> und <code>Cat<\/code> überschreiben jeweils <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>intro<\/code>, unverändert von <code>Animal<\/code> geerbt, ruft <code>self.speak<\/code> auf — und dieser Aufruf verwendet dasjenige <code>speak<\/code>, das zum tatsächlichen Objekt gehört:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dasselbe geerbte <code>intro<\/code> liefert also verschiedene Ergebnisse, weil jedes Objekt sein eigenes <code>speak<\/code> mitbringt.<\/span> <span class=\"sg\" data-s=\"1\">Das ist eine der zentralen Ideen der objektorientierten Programmierung: gemeinsamer Code, der sich an die konkrete Art des Objekts anpasst, mit dem er arbeitet.<\/span><\/p>"]]},"nl":{"t":"Methoden overschrijven","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een kindklasse kan haar eigen versie van een geërfde methode aanbieden.<\/span> <span class=\"sg\" data-s=\"1\">Dat heet <em>overschrijven<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer de methode op een object van de kindklasse aangeroepen wordt, draait de versie van het kind in plaats van die van de ouder.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> en <code>Cat<\/code> overschrijven elk <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>intro<\/code>, ongewijzigd van <code>Animal<\/code> geërfd, roept <code>self.speak<\/code> aan — en die aanroep gebruikt de <code>speak<\/code> die bij het werkelijke object hoort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dezelfde geërfde <code>intro<\/code> levert dus verschillende resultaten op, omdat elk object zijn eigen <code>speak<\/code> meebrengt.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een van de centrale ideeën van objectgeoriënteerd programmeren: gedeelde code die zich aanpast aan de specifieke soort object waarmee ze werkt.<\/span><\/p>"]]},"es":{"t":"Sobrescribir métodos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una clase hija puede ofrecer su propia versión de un método heredado.<\/span> <span class=\"sg\" data-s=\"1\">A esto se le llama <em>sobrescribir<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Cuando el método se llama sobre un objeto de la clase hija, se ejecuta la versión de la hija en lugar de la del padre.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> y <code>Cat<\/code> sobrescriben cada uno <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>intro<\/code>, heredado sin cambios de <code>Animal<\/code>, llama a <code>self.speak<\/code>, y esa llamada usa el <code>speak<\/code> que pertenezca al objeto real:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que el mismo <code>intro<\/code> heredado produce resultados distintos, porque cada objeto trae su propio <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esta es una de las ideas centrales de la programación orientada a objetos: código compartido que se adapta a la clase concreta de objeto sobre la que trabaja.<\/span><\/p>"]]},"it":{"t":"Sovrascrivere i metodi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una classe figlia può fornire una propria versione di un metodo ereditato.<\/span> <span class=\"sg\" data-s=\"1\">Questo si chiama <em>sovrascrittura<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Quando il metodo viene chiamato su un oggetto della classe figlia, gira la versione della figlia invece di quella della genitrice.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> e <code>Cat<\/code> sovrascrivono ciascuno <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>intro<\/code>, ereditato immutato da <code>Animal<\/code>, chiama <code>self.speak<\/code> — e quella chiamata usa lo <code>speak<\/code> che appartiene all'oggetto vero e proprio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Così lo stesso <code>intro<\/code> ereditato produce risultati diversi, perché ogni oggetto porta con sé il proprio <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa è una delle idee centrali della programmazione a oggetti: codice condiviso che si adatta al tipo preciso di oggetto su cui lavora.<\/span><\/p>"]]},"lv":{"t":"Metožu pārrakstīšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bērnklase var nodrošināt savu mantotās metodes versiju.<\/span> <span class=\"sg\" data-s=\"1\">To sauc par <em>pārrakstīšanu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Kad metode tiek izsaukta uz bērnklases objekta, vecākklases versijas vietā izpildās bērnklases versija.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> un <code>Cat<\/code> katrs pārraksta <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>intro<\/code>, kas mantota no <code>Animal<\/code> bez izmaiņām, izsauc <code>self.speak<\/code> — un šis izsaukums izmanto to <code>speak<\/code>, kas pieder īstajam objektam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad viena un tā pati mantotā <code>intro<\/code> dod dažādus rezultātus, jo katrs objekts nes savu <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šī ir viena no objektorientētās programmēšanas centrālajām idejām: koplietots kods, kas pielāgojas tam konkrētajam objekta veidam, ar kuru strādā.<\/span><\/p>"]]},"ru":{"t":"Переопределение методов","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Дочерний класс может предоставить собственную версию унаследованного метода.<\/span> <span class=\"sg\" data-s=\"1\">Это называется <em>переопределением<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Когда метод вызывается у объекта дочернего класса, выполняется версия потомка, а не родителя.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> и <code>Cat<\/code> каждый переопределяют <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>intro<\/code>, унаследованный от <code>Animal<\/code> без изменений, вызывает <code>self.speak<\/code> — и этот вызов использует тот <code>speak<\/code>, который принадлежит самому объекту:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, один и тот же унаследованный <code>intro<\/code> даёт разные результаты, потому что каждый объект приносит собственный <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это одна из центральных идей объектно-ориентированного программирования: общий код, который подстраивается под конкретный вид объекта, с которым работает.<\/span><\/p>"]]},"uk":{"t":"Перевизначення методів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Дочірній клас може надати власну версію успадкованого методу.<\/span> <span class=\"sg\" data-s=\"1\">Це називають <em>перевизначенням<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Коли метод викликають для об'єкта дочірнього класу, виконується версія дитини, а не батька.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> і <code>Cat<\/code> кожен перевизначає <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>intro<\/code>, успадкований від <code>Animal<\/code> без змін, викликає <code>self.speak<\/code> — і цей виклик використовує той <code>speak<\/code>, який належить справжньому об'єктові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, той самий успадкований <code>intro<\/code> дає різні результати, бо кожен об'єкт приносить власний <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це одна з центральних ідей об'єктно-орієнтованого програмування: спільний код, який пристосовується до конкретного роду об'єкта, з яким працює.<\/span><\/p>"]]},"bg":{"t":"Предефиниране на методи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Дъщерният клас може да предостави своя собствена версия на наследен метод.<\/span> <span class=\"sg\" data-s=\"1\">Това се нарича <em>предефиниране<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Когато методът се извика върху обект от дъщерния клас, се изпълнява версията на дъщерния клас вместо тази на родителя.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> и <code>Cat<\/code> предефинират всеки своя <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>intro<\/code>, наследен непроменен от <code>Animal<\/code>, извиква <code>self.speak<\/code> — и това извикване използва онзи <code>speak<\/code>, който принадлежи на действителния обект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така един и същ наследен <code>intro<\/code> дава различни резултати, защото всеки обект носи свой собствен <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е една от централните идеи на обектно-ориентираното програмиране: споделен код, който се приспособява към конкретния вид обект, върху който работи.<\/span><\/p>"]]}}}</script>
