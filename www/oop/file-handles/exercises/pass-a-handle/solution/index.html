<script type="application/json" id="page-data">{"u":"oop/file-handles/exercises/pass-a-handle/solution","n":903,"k":"solution","pv":"oop/file-handles/exercises/pass-a-handle","nx":"oop/file-handles/quiz","tr":["oop","oop/file-handles"],"L":{"en":{"t":"The solution of ’Pass a handle to a function‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The handle returned by <code>open<\/code> is just a value held in <code>$fh<\/code>, so it can be passed to <code>log-line<\/code> as an argument like any string or number. Inside the subroutine, <code>$fh.say<\/code> writes through that same open handle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Because the handle stays open across all three calls, each <code>log-line<\/code> appends another line to the same file. <code>close<\/code> then flushes everything, and <code>slurp<\/code> reads the three lines back.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is what makes handles composable: a function can accept a handle and write to (or read from) it without caring which file it points at — the caller decides that when it opens the file.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Übergeben Sie einen Handle an eine Funktion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der von <code>open<\/code> gelieferte Handle ist einfach ein Wert in <code>$fh<\/code>, er kann also wie jede Zeichenkette oder Zahl als Argument an <code>log-line<\/code> übergeben werden. Innerhalb der Subroutine schreibt <code>$fh.say<\/code> durch denselben offenen Handle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Weil der Handle über alle drei Aufrufe hinweg offen bleibt, hängt jedes <code>log-line<\/code> eine weitere Zeile an dieselbe Datei an. <code>close<\/code> schreibt dann alles weg, und <code>slurp<\/code> liest die drei Zeilen zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das macht Handles kombinierbar: Eine Funktion kann einen Handle aufnehmen und hineinschreiben (oder daraus lesen), ohne sich darum zu kümmern, auf welche Datei er zeigt — das entscheidet der Aufrufer, wenn er die Datei öffnet.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Geef een handle aan een functie","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De handle die <code>open<\/code> teruggeeft is gewoon een waarde in <code>$fh<\/code>, dus hij kan net als elke string of elk getal als argument aan <code>log-line<\/code> meegegeven worden. Binnen de subroutine schrijft <code>$fh.say<\/code> via diezelfde open handle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omdat de handle over alle drie de aanroepen open blijft, plakt elke <code>log-line<\/code> er nog een regel aan hetzelfde bestand bij. <code>close<\/code> schrijft daarna alles weg, en <code>slurp<\/code> leest de drie regels terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit is wat handles samenstelbaar maakt: een functie kan een handle aannemen en ernaar schrijven (of eruit lezen) zonder zich te bekommeren om welk bestand hij aanwijst — dat beslist de aanroeper wanneer hij het bestand opent.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Pase un manejador a una función","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El manejador que devuelve <code>open<\/code> es solo un valor guardado en <code>$fh<\/code>, así que puede pasarse a <code>log-line<\/code> como argumento igual que cualquier cadena o número. Dentro de la subrutina, <code>$fh.say<\/code> escribe a través de ese mismo manejador abierto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Como el manejador sigue abierto durante las tres llamadas, cada <code>log-line<\/code> añade otra línea al mismo archivo. <code>close<\/code> vuelca entonces todo, y <code>slurp<\/code> vuelve a leer las tres líneas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esto es lo que hace componibles a los manejadores: una función puede aceptar un manejador y escribir en él (o leer de él) sin importarle a qué archivo apunta; eso lo decide quien la llama al abrir el archivo.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Passate un handle a una funzione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'handle restituito da <code>open<\/code> è solo un valore contenuto in <code>$fh<\/code>, quindi può essere passato a <code>log-line<\/code> come argomento, come una stringa o un numero qualunque. Dentro la subroutine, <code>$fh.say<\/code> scrive attraverso quello stesso handle aperto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Poiché l'handle resta aperto per tutte e tre le chiamate, ogni <code>log-line<\/code> aggiunge un'altra riga allo stesso file. <code>close<\/code> scarica poi tutto e <code>slurp<\/code> rilegge le tre righe.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">È questo che rende componibili gli handle: una funzione può accettare un handle e scriverci (o leggerci) senza curarsi di quale file punti — è il chiamante a deciderlo quando apre il file.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Nododiet deskriptoru funkcijai","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Turis, ko atgriež <code>open<\/code>, ir vienkārši vērtība, kas glabājas <code>$fh<\/code>, tāpēc to var padot <code>log-line<\/code> kā argumentu gluži tāpat kā jebkuru virkni vai skaitli. Apakšprogrammas iekšienē <code>$fh.say<\/code> raksta caur to pašu atvērto turi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tā kā turis paliek atvērts visus trīs izsaukumus, katrs <code>log-line<\/code> pievieno tam pašam failam vēl vienu rindu. <code>close<\/code> tad visu izskalo, un <code>slurp<\/code> nolasa trīs rindas atpakaļ.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tieši tas padara turus komponējamus: funkcija var pieņemt turi un tajā rakstīt (vai no tā lasīt), nerūpējoties par to, uz kuru failu tas norāda, — to izlemj izsaucējs, kad failu atver.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Передайте дескриптор в функцию","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор, который возвращает <code>open<\/code>, — это просто значение, хранящееся в <code>$fh<\/code>, поэтому его можно передать в <code>log-line<\/code> как аргумент, наравне с любой строкой или числом. Внутри подпрограммы <code>$fh.say<\/code> пишет через тот же самый открытый дескриптор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поскольку дескриптор остаётся открытым на протяжении всех трёх вызовов, каждый <code>log-line<\/code> дописывает очередную строку в тот же файл. Затем <code>close<\/code> всё сбрасывает, а <code>slurp<\/code> считывает три строки обратно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Именно это делает дескрипторы компонуемыми: функция может принимать дескриптор и писать в него (или читать из него), не заботясь о том, на какой файл он указывает, — это решает вызывающая сторона, когда открывает файл.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Передайте дескриптор функції","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор, який повертає <code>open<\/code>, є просто значенням, що зберігається в <code>$fh<\/code>, тож його можна передати до <code>log-line<\/code> аргументом, як будь-який рядок чи число. Усередині підпрограми <code>$fh.say<\/code> пише через той самий відкритий дескриптор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оскільки дескриптор лишається відкритим упродовж усіх трьох викликів, кожен <code>log-line<\/code> дописує до того самого файлу ще один рядок. Далі <code>close<\/code> усе скидає на диск, а <code>slurp<\/code> зчитує три рядки назад.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Саме це й робить дескриптори композиційними: функція може приймати дескриптор і писати в нього (чи читати з нього), не переймаючись тим, на який файл він вказує, — це вирішує викликач, коли відкриває файл.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Подайте манипулатор на функция","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Манипулаторът, върнат от <code>open<\/code>, е просто стойност, съхранена в <code>$fh<\/code>, така че може да бъде подаден на <code>log-line<\/code> като аргумент, също като низ или число. Вътре в подпрограмата <code>$fh.say<\/code> пише през същия отворен манипулатор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Понеже манипулаторът остава отворен през трите извиквания, всяко <code>log-line<\/code> добавя още един ред към същия файл. <code>close<\/code> след това изтласква всичко, а <code>slurp<\/code> прочита трите реда обратно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Именно това прави манипулаторите компонуеми: функцията може да приеме манипулатор и да пише в него (или да чете от него), без да се интересува към кой файл сочи — това решава извикващият, когато отваря файла.<\/span><\/li><\/ol>"]]}}}</script>
