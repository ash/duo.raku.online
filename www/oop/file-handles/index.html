<script type="application/json" id="page-data">{"u":"oop/file-handles","n":894,"k":"section","pv":"oop/deleting/quiz","nx":"oop/file-handles/exercises","tr":["oop"],"L":{"en":{"t":"File handles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Reading or writing a whole file at once is convenient, but sometimes you want to go through a file one line at a time, or keep a file open while you write to it repeatedly.<\/span> <span class=\"sg\" data-s=\"1\">For that you use a <em>file handle<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The simplest way to read a file line by line does not even need an explicit handle: the <code>lines<\/code> method on a path object gives the lines one at a time, ready for a <code>for<\/code> loop:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each <code>$line<\/code> is a single line, without its trailing newline.<\/span> <span class=\"sg\" data-s=\"1\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To write to a file through a handle, open it with <code>open<\/code> and the <code>:w<\/code> (write) flag, use the handle’s <code>say<\/code> or <code>print<\/code> methods, and <code>close<\/code> it when done:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closing the handle makes sure everything you wrote is flushed to disk.<\/span> <span class=\"sg\" data-s=\"1\">Reading line by line, as above, is the usual way to handle files that are too large to slurp into memory all at once.<\/span><\/p>"]]},"de":{"t":"Dateihandles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine ganze Datei auf einmal zu lesen oder zu schreiben ist bequem, aber manchmal möchten Sie eine Datei Zeile für Zeile durchgehen oder eine Datei offen halten, während Sie wiederholt hineinschreiben.<\/span> <span class=\"sg\" data-s=\"1\">Dafür verwenden Sie einen <em>Dateihandle<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der einfachste Weg, eine Datei zeilenweise zu lesen, braucht nicht einmal einen ausdrücklichen Handle: Die Methode <code>lines<\/code> auf einem Pfadobjekt liefert die Zeilen einzeln, bereit für eine <code>for<\/code>-Schleife:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede <code>$line<\/code> ist eine einzelne Zeile, ohne ihren abschließenden Zeilenumbruch.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um über einen Handle in eine Datei zu schreiben, öffnen Sie sie mit <code>open<\/code> und dem Schalter <code>:w<\/code> (write), verwenden die Methoden <code>say<\/code> oder <code>print<\/code> des Handles und schließen ihn mit <code>close<\/code>, wenn Sie fertig sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Den Handle zu schließen stellt sicher, dass alles Geschriebene auf die Platte gelangt.<\/span> <span class=\"sg\" data-s=\"1\">Zeilenweise zu lesen, wie oben, ist der übliche Weg für Dateien, die zu groß sind, um sie am Stück in den Speicher zu holen.<\/span><\/p>"]]},"nl":{"t":"Bestandshandles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een heel bestand in één keer lezen of schrijven is handig, maar soms wil je een bestand regel voor regel doorlopen, of een bestand open houden terwijl je er herhaaldelijk naar schrijft.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor gebruik je een <em>bestandshandle<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste manier om een bestand regel voor regel te lezen heeft niet eens een expliciete handle nodig: de methode <code>lines<\/code> op een padobject geeft de regels een voor een, klaar voor een <code>for<\/code>-lus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke <code>$line<\/code> is één regel, zonder de afsluitende newline.<\/span> <span class=\"sg\" data-s=\"1\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om via een handle naar een bestand te schrijven, open je het met <code>open<\/code> en de vlag <code>:w<\/code> (write), gebruik je de methoden <code>say<\/code> of <code>print<\/code> van de handle, en <code>close<\/code> je hem als je klaar bent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De handle sluiten zorgt ervoor dat alles wat je geschreven hebt naar schijf weggeschreven wordt.<\/span> <span class=\"sg\" data-s=\"1\">Regel voor regel lezen, zoals hierboven, is de gebruikelijke manier om bestanden te verwerken die te groot zijn om in één keer in het geheugen te slurpen.<\/span><\/p>"]]},"es":{"t":"Manejadores de archivo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Leer o escribir un archivo entero de una vez es cómodo, pero a veces quieres recorrer un archivo línea a línea, o mantener un archivo abierto mientras escribes en él repetidamente.<\/span> <span class=\"sg\" data-s=\"1\">Para eso se usa un <em>manejador de archivo<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma más sencilla de leer un archivo línea a línea ni siquiera necesita un manejador explícito: el método <code>lines<\/code> sobre un objeto de ruta entrega las líneas de una en una, listas para un bucle <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada <code>$line<\/code> es una sola línea, sin su salto de línea final.<\/span> <span class=\"sg\" data-s=\"1\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para escribir en un archivo a través de un manejador, ábrelo con <code>open<\/code> y la bandera <code>:w<\/code> (write), usa los métodos <code>say<\/code> o <code>print<\/code> del manejador y ciérralo con <code>close<\/code> al terminar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cerrar el manejador asegura que todo lo que escribiste se vuelca al disco.<\/span> <span class=\"sg\" data-s=\"1\">Leer línea a línea, como arriba, es la manera habitual de tratar archivos demasiado grandes para cargarlos enteros en memoria.<\/span><\/p>"]]},"it":{"t":"Handle di file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Leggere o scrivere un file intero in una volta sola è comodo, ma a volte vuoi percorrere un file una riga alla volta, oppure tenere un file aperto mentre ci scrivi ripetutamente.<\/span> <span class=\"sg\" data-s=\"1\">Per questo si usa un <em>handle di file<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il modo più semplice di leggere un file riga per riga non richiede nemmeno un handle esplicito: il metodo <code>lines<\/code> su un oggetto percorso dà le righe una alla volta, pronte per un ciclo <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>$line<\/code> è una singola riga, senza il suo ritorno a capo finale.<\/span> <span class=\"sg\" data-s=\"1\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per scrivere su un file attraverso un handle, aprilo con <code>open<\/code> e il flag <code>:w<\/code> (write), usa i metodi <code>say<\/code> o <code>print<\/code> dell'handle e chiudilo con <code>close<\/code> quando hai finito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Chiudere l'handle garantisce che tutto ciò che hai scritto venga scaricato su disco.<\/span> <span class=\"sg\" data-s=\"1\">Leggere riga per riga, come sopra, è il modo consueto di trattare file troppo grandi per essere slurpati in memoria tutti insieme.<\/span><\/p>"]]},"lv":{"t":"Failu deskriptori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Visa faila nolasīšana vai ierakstīšana uzreiz ir ērta, taču dažreiz gribat failam iet cauri pa vienai rindai vai turēt failu atvērtu, kamēr tajā atkārtoti rakstāt.<\/span> <span class=\"sg\" data-s=\"1\">Tam izmantojat <em>faila turi<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākajam veidam, kā failu lasīt pa rindai, skaidri norādīts turis pat nav vajadzīgs: metode <code>lines<\/code> uz ceļa objekta dod rindas pa vienai, gatavas ciklam <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>$line<\/code> ir viena rinda bez tās beigu jaunās rindas rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai failā rakstītu caur turi, atveriet to ar <code>open<\/code> un karodziņu <code>:w<\/code> (rakstīšanai), izmantojiet tura metodes <code>say<\/code> vai <code>print<\/code> un aizveriet to ar <code>close<\/code>, kad esat pabeiguši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tura aizvēršana gādā, ka viss ierakstītais tiek izskalots uz disku.<\/span> <span class=\"sg\" data-s=\"1\">Lasīšana pa rindai, kā augstāk, ir ierastais veids, kā tikt galā ar failiem, kas ir par lielu, lai tos uzreiz ierautu atmiņā.<\/span><\/p>"]]},"ru":{"t":"Файловые дескрипторы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Читать или записывать файл целиком удобно, но иногда нужно пройти по файлу строка за строкой или держать файл открытым, многократно в него записывая.<\/span> <span class=\"sg\" data-s=\"1\">Для этого используется <em>файловый дескриптор<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Самый простой способ читать файл построчно не требует даже явного дескриптора: метод <code>lines<\/code> у объекта пути выдаёт строки по одной, готовые для цикла <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая <code>$line<\/code> — это одна строка, без завершающего перевода строки.<\/span> <span class=\"sg\" data-s=\"1\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы писать в файл через дескриптор, откройте его с помощью <code>open<\/code> и флага <code>:w<\/code> (запись), пользуйтесь методами <code>say<\/code> или <code>print<\/code> дескриптора, а по окончании закройте его через <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Закрытие дескриптора гарантирует, что всё записанное сброшено на диск.<\/span> <span class=\"sg\" data-s=\"1\">Построчное чтение, как выше, — это обычный способ работать с файлами, которые слишком велики, чтобы целиком затянуть их в память.<\/span><\/p>"]]},"uk":{"t":"Дескриптори файлів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Читати чи записувати весь файл за раз зручно, але іноді потрібно пройти файл рядок за рядком або тримати його відкритим, поки ви раз за разом до нього пишете.<\/span> <span class=\"sg\" data-s=\"1\">Для цього використовують <em>дескриптор файлу<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпростіший спосіб читати файл рядок за рядком навіть не потребує явного дескриптора: метод <code>lines<\/code> для об'єкта шляху видає рядки по черзі, готові для циклу <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>$line<\/code> є одним рядком, без завершального переходу рядка.<\/span> <span class=\"sg\" data-s=\"1\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб писати у файл через дескриптор, відкрийте його за допомогою <code>open<\/code> із прапорцем <code>:w<\/code> (write), скористайтеся методами <code>say<\/code> чи <code>print<\/code> дескриптора й закрийте його через <code>close<\/code>, коли закінчите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Закриття дескриптора гарантує, що все написане скинуто на диск.<\/span> <span class=\"sg\" data-s=\"1\">Читання рядок за рядком, як вище, є звичним способом працювати з файлами, надто великими, щоб зчитати їх у пам'ять цілком.<\/span><\/p>"]]},"bg":{"t":"Манипулатори на файлове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Четенето или записването на цял файл наведнъж е удобно, но понякога искате да минете през файла ред по ред или да го държите отворен, докато пишете в него многократно.<\/span> <span class=\"sg\" data-s=\"1\">За това използвате <em>манипулатор на файл<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-простият начин да четете файл ред по ред дори не се нуждае от изричен манипулатор: методът <code>lines<\/code> върху обект-път подава редовете един по един, готови за цикъл <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>$line<\/code> е един ред, без завършващия си нов ред.<\/span> <span class=\"sg\" data-s=\"1\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да пишете във файл през манипулатор, отворете го с <code>open<\/code> и флага <code>:w<\/code> (write), използвайте методите <code>say<\/code> или <code>print<\/code> на манипулатора и го затворете с <code>close<\/code>, когато приключите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Затварянето на манипулатора гарантира, че всичко записано е изтласкано на диска.<\/span> <span class=\"sg\" data-s=\"1\">Четенето ред по ред, както по-горе, е обичайният начин да се работи с файлове, които са твърде големи, за да се поберат наведнъж в паметта.<\/span><\/p>"]]}}}</script>
