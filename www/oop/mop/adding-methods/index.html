<script type="application/json" id="page-data">{"u":"oop/mop/adding-methods","n":848,"k":"topic","pv":"oop/mop/meta-methods/quiz","nx":"oop/mop/exercises","tr":["oop","oop/mop"],"L":{"en":{"t":"Adding methods at runtime","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The MOP is not only for inspection — it can also <strong>change<\/strong> a type while the program runs.<\/span> <span class=\"sg\" data-s=\"1\">The meta-method <code>.^add_method<\/code> adds a new method to a class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The class <code>Empty<\/code> is defined with no methods at all.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> then attaches a method named <code>greet<\/code>, given as an anonymous <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">From that point on, every <code>Empty<\/code> object responds to <code>.greet<\/code>, just as if it had been written into the class.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is genuine meta-programming: the metaobject for <code>Empty<\/code> is being told to grow a new method.<\/span> <span class=\"sg\" data-s=\"1\">The same protocol underlies features you have already used — conceptually, when you write <code>class<\/code>, <code>role<\/code>, <code>has<\/code>, or <code>method<\/code>, the compiler builds your type through MOP methods like <code>.^add_method<\/code> and <code>.^add_attribute<\/code> on your behalf.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">“Conceptually”, because this is a model of the language, not a promise about any one compiler.<\/span> <span class=\"sg\" data-s=\"1\">The MOP is what the object system is <em>specified<\/em> in terms of; whether a given implementation literally routes every declaration through those meta-methods — and whether you can observe it doing so — is up to that implementation.<\/span> <span class=\"sg\" data-s=\"2\">For the same reason, <em>calling<\/em> these meta-methods yourself is implementation-dependent: which ones a compiler exposes, and exactly how they behave, can differ, so code that reaches for <code>.^add_method<\/code> and friends may not run the same way on every Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adding methods at runtime is a powerful and rarely needed tool.<\/span> <span class=\"sg\" data-s=\"1\">Most programs never reach for it, but it is what makes Raku’s object system open: the rules of classes are themselves written in terms of the MOP, so you can extend them.<\/span> <span class=\"sg\" data-s=\"2\">For everyday code, the inspection meta-methods of the previous topic are the part of the MOP you will actually use.<\/span><\/p>"]]},"de":{"t":"Methoden zur Laufzeit hinzufügen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das MOP dient nicht nur der Untersuchung — es kann einen Typ auch <strong>verändern<\/strong>, während das Programm läuft.<\/span> <span class=\"sg\" data-s=\"1\">Die Metamethode <code>.^add_method<\/code> fügt einer Klasse eine neue Methode hinzu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Klasse <code>Empty<\/code> ist ganz ohne Methoden definiert.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> hängt ihr dann eine Methode namens <code>greet<\/code> an, angegeben als anonyme <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Von da an antwortet jedes <code>Empty<\/code>-Objekt auf <code>.greet<\/code>, als wäre sie in die Klasse geschrieben worden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist echte Metaprogrammierung: Dem Metaobjekt für <code>Empty<\/code> wird gesagt, es solle eine neue Methode wachsen lassen.<\/span> <span class=\"sg\" data-s=\"1\">Dasselbe Protokoll liegt Möglichkeiten zugrunde, die Sie schon genutzt haben — begrifflich baut der Compiler Ihren Typ, wenn Sie <code>class<\/code>, <code>role<\/code>, <code>has<\/code> oder <code>method<\/code> schreiben, stellvertretend für Sie über MOP-Methoden wie <code>.^add_method<\/code> und <code>.^add_attribute<\/code> auf.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">„Begrifflich“ deshalb, weil dies ein Modell der Sprache ist und keine Zusage über einen bestimmten Compiler.<\/span> <span class=\"sg\" data-s=\"1\">Das MOP ist das, worin das Objektsystem <em>spezifiziert<\/em> ist; ob eine gegebene Implementierung tatsächlich jede Deklaration über diese Metamethoden leitet — und ob Sie das beobachten können —, bleibt dieser Implementierung überlassen.<\/span> <span class=\"sg\" data-s=\"2\">Aus demselben Grund ist auch das <em>eigene Aufrufen<\/em> dieser Metamethoden implementierungsabhängig: Welche ein Compiler bereitstellt und wie genau sie sich verhalten, kann sich unterscheiden, Code, der zu <code>.^add_method<\/code> und Verwandten greift, läuft also womöglich nicht auf jedem Raku gleich.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Methoden zur Laufzeit hinzuzufügen ist ein mächtiges und selten benötigtes Werkzeug.<\/span> <span class=\"sg\" data-s=\"1\">Die meisten Programme greifen nie danach, aber es ist das, was Rakus Objektsystem offen macht: Die Regeln für Klassen sind selbst in Begriffen des MOP geschrieben, Sie können sie also erweitern.<\/span> <span class=\"sg\" data-s=\"2\">Für alltäglichen Code sind die untersuchenden Metamethoden des vorigen Themas der Teil des MOP, den Sie tatsächlich verwenden werden.<\/span><\/p>"]]},"nl":{"t":"Methoden toevoegen tijdens het draaien","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het MOP is niet alleen voor inspectie — het kan een type ook <strong>veranderen<\/strong> terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"1\">De metamethode <code>.^add_method<\/code> voegt een nieuwe methode aan een klasse toe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De klasse <code>Empty<\/code> is gedefinieerd zonder ook maar één methode.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> hangt er vervolgens een methode met de naam <code>greet<\/code> aan, gegeven als een anonieme <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vanaf dat punt reageert elk <code>Empty<\/code>-object op <code>.greet<\/code>, precies alsof de methode in de klasse geschreven was.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is echte metaprogrammering: het metaobject voor <code>Empty<\/code> krijgt te horen dat het een nieuwe methode moet laten groeien.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde protocol ligt onder mogelijkheden die je al gebruikt hebt — conceptueel bouwt de compiler, wanneer je <code>class<\/code>, <code>role<\/code>, <code>has<\/code> of <code>method<\/code> schrijft, jouw type namens jou op via MOP-methoden als <code>.^add_method<\/code> en <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">\"Conceptueel\", omdat dit een model van de taal is, geen belofte over een bepaalde compiler.<\/span> <span class=\"sg\" data-s=\"1\">Het MOP is datgene waarin het objectsysteem <em>gespecificeerd<\/em> is; of een gegeven implementatie werkelijk elke declaratie via die metamethoden leidt — en of je dat kunt waarnemen — is aan die implementatie.<\/span> <span class=\"sg\" data-s=\"2\">Om dezelfde reden is het <em>zelf aanroepen<\/em> van deze metamethoden implementatieafhankelijk: welke een compiler blootstelt, en hoe die zich precies gedragen, kan verschillen, dus code die naar <code>.^add_method<\/code> en verwanten grijpt draait misschien niet op elke Raku hetzelfde.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Methoden toevoegen tijdens het draaien is een krachtig en zelden nodig gereedschap.<\/span> <span class=\"sg\" data-s=\"1\">De meeste programma's grijpen er nooit naar, maar het is wat Raku's objectsysteem open maakt: de regels van klassen zijn zelf in termen van het MOP geschreven, dus je kunt ze uitbreiden.<\/span> <span class=\"sg\" data-s=\"2\">Voor alledaagse code zijn de inspecterende metamethoden uit het vorige onderwerp het deel van het MOP dat je werkelijk zult gebruiken.<\/span><\/p>"]]},"es":{"t":"Añadir métodos en tiempo de ejecución","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El MOP no sirve solo para inspeccionar: también puede <strong>cambiar<\/strong> un tipo mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"1\">El metamétodo <code>.^add_method<\/code> añade un método nuevo a una clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La clase <code>Empty<\/code> se define sin ningún método.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> le adosa entonces un método llamado <code>greet<\/code>, dado como un <code>method { … }<\/code> anónimo.<\/span> <span class=\"sg\" data-s=\"2\">A partir de ese momento todo objeto <code>Empty<\/code> responde a <code>.greet<\/code>, igual que si estuviera escrito en la clase.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es metaprogramación de verdad: se le está diciendo al metaobjeto de <code>Empty<\/code> que le crezca un método nuevo.<\/span> <span class=\"sg\" data-s=\"1\">Ese mismo protocolo está debajo de funcionalidades que ya has usado: conceptualmente, cuando escribes <code>class<\/code>, <code>role<\/code>, <code>has<\/code> o <code>method<\/code>, el compilador construye tu tipo por ti a través de métodos del MOP como <code>.^add_method<\/code> y <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">«Conceptualmente», porque esto es un modelo del lenguaje, no una promesa sobre ningún compilador concreto.<\/span> <span class=\"sg\" data-s=\"1\">El MOP es aquello <em>en términos de lo cual<\/em> está especificado el sistema de objetos; si una implementación dada encamina realmente cada declaración a través de esos metamétodos — y si puedes observarla haciéndolo — depende de esa implementación.<\/span> <span class=\"sg\" data-s=\"2\">Por el mismo motivo, <em>llamar<\/em> tú mismo a estos metamétodos depende de la implementación: cuáles expone un compilador, y cómo se comportan exactamente, puede variar, así que el código que recurre a <code>.^add_method<\/code> y compañía podría no ejecutarse igual en todos los Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Añadir métodos en tiempo de ejecución es una herramienta potente y rara vez necesaria.<\/span> <span class=\"sg\" data-s=\"1\">La mayoría de los programas nunca recurren a ella, pero es lo que hace abierto el sistema de objetos de Raku: las reglas de las clases están escritas a su vez en términos del MOP, así que puedes extenderlas.<\/span> <span class=\"sg\" data-s=\"2\">Para el código de todos los días, los metamétodos de inspección del tema anterior son la parte del MOP que realmente usarás.<\/span><\/p>"]]},"it":{"t":"Aggiungere metodi a runtime","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il MOP non serve solo per ispezionare: può anche <strong>cambiare<\/strong> un tipo mentre il programma gira.<\/span> <span class=\"sg\" data-s=\"1\">Il metametodo <code>.^add_method<\/code> aggiunge un nuovo metodo a una classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La classe <code>Empty<\/code> è definita senza alcun metodo.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> vi attacca poi un metodo di nome <code>greet<\/code>, dato come <code>method { … }<\/code> anonimo.<\/span> <span class=\"sg\" data-s=\"2\">Da quel momento in poi ogni oggetto <code>Empty<\/code> risponde a <code>.greet<\/code>, esattamente come se il metodo fosse stato scritto nella classe.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa è vera metaprogrammazione: si sta dicendo al metaoggetto di <code>Empty<\/code> di farsi crescere un nuovo metodo.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso protocollo sta sotto funzionalità che hai già usato — concettualmente, quando scrivi <code>class<\/code>, <code>role<\/code>, <code>has<\/code> o <code>method<\/code>, il compilatore costruisce il tuo tipo per tuo conto attraverso metodi MOP come <code>.^add_method<\/code> e <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">«Concettualmente», perché questo è un modello del linguaggio, non una promessa su un compilatore particolare.<\/span> <span class=\"sg\" data-s=\"1\">Il MOP è ciò <em>in termini di cui<\/em> il sistema a oggetti è specificato; se una data implementazione instradi davvero ogni dichiarazione attraverso quei metametodi — e se tu possa osservarla mentre lo fa — dipende da quell'implementazione.<\/span> <span class=\"sg\" data-s=\"2\">Per lo stesso motivo, <em>chiamare<\/em> tu stesso questi metametodi dipende dall'implementazione: quali un compilatore esponga, e come si comportino esattamente, può variare, quindi il codice che ricorre a <code>.^add_method<\/code> e simili potrebbe non girare allo stesso modo su ogni Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aggiungere metodi a runtime è uno strumento potente e raramente necessario.<\/span> <span class=\"sg\" data-s=\"1\">La maggior parte dei programmi non vi ricorre mai, ma è ciò che rende aperto il sistema a oggetti di Raku: le regole delle classi sono a loro volta scritte in termini del MOP, quindi puoi estenderle.<\/span> <span class=\"sg\" data-s=\"2\">Per il codice di tutti i giorni, i metametodi di ispezione dell'argomento precedente sono la parte del MOP che userai davvero.<\/span><\/p>"]]},"lv":{"t":"Metožu pievienošana izpildes laikā","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">MOP ir domāts ne tikai izpētei — tas var arī <strong>mainīt<\/strong> tipu, kamēr programma darbojas.<\/span> <span class=\"sg\" data-s=\"1\">Metametode <code>.^add_method<\/code> pievieno klasei jaunu metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Klase <code>Empty<\/code> ir definēta pavisam bez metodēm.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> tad piesaista metodi ar nosaukumu <code>greet<\/code>, kas dota kā anonīma <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No šī brīža katrs <code>Empty<\/code> objekts atsaucas uz <code>.greet<\/code>, gluži tāpat, it kā tā būtu uzrakstīta klasē.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī ir īsta metaprogrammēšana: <code>Empty<\/code> metaobjektam tiek likts izaudzēt jaunu metodi.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats protokols ir pamatā iespējām, ko jau esat izmantojuši — konceptuāli, kad rakstāt <code>class<\/code>, <code>role<\/code>, <code>has<\/code> vai <code>method<\/code>, kompilators jūsu tipu uzbūvē jūsu vietā ar MOP metodēm, piemēram, <code>.^add_method<\/code> un <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">«Konceptuāli» tāpēc, ka šis ir valodas modelis, nevis solījums par kādu konkrētu kompilatoru.<\/span> <span class=\"sg\" data-s=\"1\">MOP ir tas, kā objektu sistēma tiek <em>specificēta<\/em>; vai konkrēta implementācija katru deklarāciju burtiski vada caur šīm metametodēm — un vai to var novērot —, ir šīs implementācijas ziņā.<\/span> <span class=\"sg\" data-s=\"2\">Tā paša iemesla dēļ šo metametožu <em>izsaukšana<\/em> pašam ir atkarīga no implementācijas: kuras no tām kompilators atklāj un kā tieši tās uzvedas, var atšķirties, tāpēc kods, kas ķeras pie <code>.^add_method<\/code> un tamlīdzīgām, var nedarboties vienādi katrā Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metožu pievienošana izpildes laikā ir jaudīgs un reti vajadzīgs rīks.<\/span> <span class=\"sg\" data-s=\"1\">Vairums programmu pie tā nekad neķeras, taču tieši tas padara Raku objektu sistēmu atvērtu: klašu likumi paši ir uzrakstīti MOP terminos, tāpēc tos var paplašināt.<\/span> <span class=\"sg\" data-s=\"2\">Ikdienas kodam tā MOP daļa, ko patiešām izmantosiet, ir iepriekšējā temata izpētes metametodes.<\/span><\/p>"]]},"ru":{"t":"Добавление методов во время выполнения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">MOP служит не только для исследования — он может и <strong>изменять<\/strong> тип во время работы программы.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^add_method<\/code> добавляет классу новый метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Класс <code>Empty<\/code> определён вообще без методов.<\/span> <span class=\"sg\" data-s=\"1\">Затем <code>Empty.^add_method('greet', …)<\/code> прикрепляет метод по имени <code>greet<\/code>, заданный как анонимный <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С этого момента каждый объект <code>Empty<\/code> откликается на <code>.greet<\/code> — ровно так, как если бы метод был написан в самом классе.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это настоящее метапрограммирование: метаобъекту <code>Empty<\/code> предписывают отрастить новый метод.<\/span> <span class=\"sg\" data-s=\"1\">Тот же протокол лежит в основе возможностей, которыми вы уже пользовались: концептуально, когда вы пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> или <code>method<\/code>, компилятор строит ваш тип за вас через MOP-методы вроде <code>.^add_method<\/code> и <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">«Концептуально» — потому что это модель языка, а не обещание относительно какого-то конкретного компилятора.<\/span> <span class=\"sg\" data-s=\"1\">MOP — это то, в терминах чего объектная система <em>специфицирована<\/em>; а буквально ли данная реализация пропускает каждое объявление через эти метаметоды и можно ли это наблюдать — дело самой реализации.<\/span> <span class=\"sg\" data-s=\"2\">По той же причине <em>вызов<\/em> этих метаметодов вами самими зависит от реализации: какие из них компилятор предоставляет и как именно они себя ведут, может различаться, поэтому код, обращающийся к <code>.^add_method<\/code> и подобным, может работать не одинаково в каждом Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Добавление методов во время выполнения — мощный и редко нужный инструмент.<\/span> <span class=\"sg\" data-s=\"1\">Большинство программ никогда к нему не прибегают, но именно он делает объектную систему Raku открытой: правила классов сами описаны в терминах MOP, поэтому их можно расширять.<\/span> <span class=\"sg\" data-s=\"2\">В повседневном коде вам пригодится та часть MOP, о которой шла речь в предыдущей теме, — метаметоды для исследования.<\/span><\/p>"]]},"uk":{"t":"Додавання методів під час виконання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">MOP існує не лише для дослідження — він може й <strong>змінювати<\/strong> тип, поки програма виконується.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^add_method<\/code> додає до класу новий метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Клас <code>Empty<\/code> визначено взагалі без методів.<\/span> <span class=\"sg\" data-s=\"1\">Далі <code>Empty.^add_method('greet', …)<\/code> приєднує метод на ім'я <code>greet<\/code>, заданий як анонімний <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Від цієї миті кожен об'єкт <code>Empty<\/code> відгукується на <code>.greet<\/code>, наче метод було вписано в клас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це справжнє метапрограмування: метаоб'єктові для <code>Empty<\/code> кажуть виростити новий метод.<\/span> <span class=\"sg\" data-s=\"1\">Той самий протокол лежить в основі можливостей, якими ви вже користувалися: концептуально, коли ви пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> чи <code>method<\/code>, компілятор будує ваш тип за вас через методи MOP на кшталт <code>.^add_method<\/code> та <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">«Концептуально» — бо це модель мови, а не обіцянка щодо якогось конкретного компілятора.<\/span> <span class=\"sg\" data-s=\"1\">MOP є тим, у термінах чого об'єктну систему <em>специфіковано<\/em>; чи справді дана реалізація буквально пропускає кожне оголошення через ці метаметоди — і чи можна це спостерегти — залежить від неї.<\/span> <span class=\"sg\" data-s=\"2\">З тієї самої причини <em>виклик<\/em> цих метаметодів вами самими є залежним від реалізації: які з них компілятор надає й як саме вони поводяться, може різнитися, тож код, що звертається до <code>.^add_method<\/code> та йому подібних, може працювати не однаково в кожному Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Додавання методів під час виконання — потужний і рідко потрібний інструмент.<\/span> <span class=\"sg\" data-s=\"1\">Більшість програм ніколи до нього не вдається, але саме він робить об'єктну систему Raku відкритою: правила класів самі записані в термінах MOP, тож ви можете їх розширювати.<\/span> <span class=\"sg\" data-s=\"2\">Для щоденного коду тією частиною MOP, якою ви справді користуватиметеся, є метаметоди дослідження з попередньої теми.<\/span><\/p>"]]},"bg":{"t":"Добавяне на методи по време на изпълнение","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">MOP не служи само за разглеждане — той може и да <strong>променя<\/strong> типа, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"1\">Метаметодът <code>.^add_method<\/code> добавя нов метод към клас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Класът <code>Empty<\/code> е дефиниран изобщо без методи.<\/span> <span class=\"sg\" data-s=\"1\"><code>Empty.^add_method('greet', …)<\/code> след това прикачва метод на име <code>greet<\/code>, зададен като анонимен <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">От този момент нататък всеки обект <code>Empty<\/code> отговаря на <code>.greet<\/code>, точно както ако беше записан в класа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е истинско метапрограмиране: на метаобекта на <code>Empty<\/code> се казва да си отгледа нов метод.<\/span> <span class=\"sg\" data-s=\"1\">Същият протокол стои в основата на възможности, които вече използвахте — концептуално, когато пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> или <code>method<\/code>, компилаторът изгражда вашия тип чрез методи на MOP като <code>.^add_method<\/code> и <code>.^add_attribute<\/code> от ваше име.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">„Концептуално“, защото това е модел на езика, а не обещание за някой конкретен компилатор.<\/span> <span class=\"sg\" data-s=\"1\">MOP е онова, чрез което обектната система е <em>специфицирана<\/em>; дали дадена реализация буквално прекарва всяка декларация през тези метаметоди — и дали можете да я наблюдавате как го прави — зависи от самата реализация.<\/span> <span class=\"sg\" data-s=\"2\">По същата причина <em>извикването<\/em> на тези метаметоди от вас зависи от реализацията: кои от тях излага даден компилатор и как точно се държат, може да се различава, така че код, който посяга към <code>.^add_method<\/code> и подобните му, може да не работи еднакво във всеки Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Добавянето на методи по време на изпълнение е мощен и рядко нужен инструмент.<\/span> <span class=\"sg\" data-s=\"1\">Повечето програми никога не посягат към него, но именно то прави обектната система на Raku отворена: правилата на класовете сами са написани чрез MOP, така че можете да ги разширявате.<\/span> <span class=\"sg\" data-s=\"2\">За ежедневния код метаметодите за разглеждане от предишната тема са частта от MOP, която наистина ще използвате.<\/span><\/p>"]]}}}</script>
