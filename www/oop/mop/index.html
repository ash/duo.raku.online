<script type="application/json" id="page-data">{"u":"oop/mop","n":845,"k":"section","pv":"oop/object-introspection/exercises/count-attributes/solution","nx":"oop/mop/meta-methods","tr":["oop"],"L":{"en":{"t":"The metaobject protocol","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every class, role, and type in Raku is itself described by another object — its <em>metaobject<\/em> — which knows the type’s name, its attributes, its methods, and its place in the inheritance tree.<\/span> <span class=\"sg\" data-s=\"1\">The interface to these metaobjects is the <em>metaobject protocol<\/em>, or MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You have already used a corner of it: <code>.^name<\/code> is a MOP call.<\/span> <span class=\"sg\" data-s=\"1\">This section shows the <code>.^<\/code> syntax properly, the most useful meta-methods for inspecting a type, and how the MOP even lets you add methods to a class while the program runs.<\/span><\/p>"]]},"de":{"t":"Das Metaobjektprotokoll","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede Klasse, jede Rolle und jeder Typ in Raku wird selbst durch ein weiteres Objekt beschrieben — sein <em>Metaobjekt<\/em> —, das den Namen des Typs kennt, seine Attribute, seine Methoden und seinen Platz im Vererbungsbaum.<\/span> <span class=\"sg\" data-s=\"1\">Die Schnittstelle zu diesen Metaobjekten ist das <em>Metaobjektprotokoll<\/em>, kurz MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Einen Winkel davon haben Sie bereits genutzt: <code>.^name<\/code> ist ein MOP-Aufruf.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt die <code>.^<\/code>-Syntax gründlich, die nützlichsten Metamethoden zum Untersuchen eines Typs und wie das MOP es sogar erlaubt, einer Klasse zur Laufzeit Methoden hinzuzufügen.<\/span><\/p>"]]},"nl":{"t":"Het metaobjectprotocol","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke klasse, rol en elk type in Raku wordt zelf beschreven door een ander object — zijn <em>metaobject<\/em> — dat de naam van het type kent, zijn attributen, zijn methoden en zijn plaats in de overervingsboom.<\/span> <span class=\"sg\" data-s=\"1\">De interface tot deze metaobjecten is het <em>metaobjectprotocol<\/em>, of MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je gebruikte er al een hoekje van: <code>.^name<\/code> is een MOP-aanroep.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie toont de <code>.^<\/code>-syntaxis behoorlijk, de nuttigste metamethoden om een type te inspecteren, en hoe het MOP je zelfs toelaat methoden aan een klasse toe te voegen terwijl het programma draait.<\/span><\/p>"]]},"es":{"t":"El protocolo de metaobjetos 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada clase, rol y tipo de Raku está descrito a su vez por otro objeto — su <em>metaobjeto<\/em> —, que conoce el nombre del tipo, sus atributos, sus métodos y su lugar en el árbol de herencia.<\/span> <span class=\"sg\" data-s=\"1\">La interfaz hacia esos metaobjetos es el <em>protocolo de metaobjetos<\/em>, o MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya has usado un rincón de él: <code>.^name<\/code> es una llamada al MOP.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección presenta como es debido la sintaxis <code>.^<\/code>, los metamétodos más útiles para inspeccionar un tipo y cómo el MOP te permite incluso añadir métodos a una clase mientras el programa se ejecuta.<\/span><\/p>"]]},"it":{"t":"Il protocollo dei metaoggetti 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni classe, ruolo e tipo in Raku è a sua volta descritto da un altro oggetto — il suo <em>metaoggetto<\/em> — che conosce il nome del tipo, i suoi attributi, i suoi metodi e il suo posto nell'albero dell'ereditarietà.<\/span> <span class=\"sg\" data-s=\"1\">L'interfaccia verso questi metaoggetti è il <em>protocollo dei metaoggetti<\/em>, o MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne hai già usato un angolo: <code>.^name<\/code> è una chiamata MOP.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione presenta per bene la sintassi <code>.^<\/code>, i metametodi più utili per ispezionare un tipo e il modo in cui il MOP ti permette persino di aggiungere metodi a una classe mentre il programma gira.<\/span><\/p>"]]},"lv":{"t":"Metaobjektu protokols 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Katru Raku klasi, lomu un tipu pašu apraksta cits objekts — tā <em>metaobjekts<\/em> —, kas zina tipa nosaukumu, tā atribūtus, metodes un vietu mantošanas kokā.<\/span> <span class=\"sg\" data-s=\"1\">Saskarne ar šiem metaobjektiem ir <em>metaobjektu protokols<\/em> jeb MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienu tā stūrīti jau esat izmantojuši: <code>.^name<\/code> ir MOP izsaukums.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa pienācīgi parāda <code>.^<\/code> sintaksi, noderīgākās metametodes tipa izpētei un to, kā MOP ļauj pat pievienot klasei metodes, kamēr programma darbojas.<\/span><\/p>"]]},"ru":{"t":"Протокол метаобъектов 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый класс, роль и тип в Raku сам описывается другим объектом — своим <em>метаобъектом<\/em>, — который знает имя типа, его атрибуты, его методы и его место в дереве наследования.<\/span> <span class=\"sg\" data-s=\"1\">Интерфейс к этим метаобъектам и есть <em>протокол метаобъектов<\/em>, или MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Одним его уголком вы уже пользовались: <code>.^name<\/code> — это вызов MOP.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе как следует рассматриваются синтаксис <code>.^<\/code>, самые полезные метаметоды для исследования типа, а также то, как MOP позволяет даже добавлять классу методы во время работы программы.<\/span><\/p>"]]},"uk":{"t":"Метаоб'єктний протокол","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен клас, роль і тип у Raku сам описується іншим об'єктом — своїм <em>метаоб'єктом<\/em>, — який знає ім'я типу, його атрибути, його методи та його місце в дереві успадкування.<\/span> <span class=\"sg\" data-s=\"1\">Інтерфейсом до цих метаоб'єктів є <em>метаоб'єктний протокол<\/em>, або MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Одним його закутком ви вже користувалися: <code>.^name<\/code> є викликом MOP.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ як слід показує синтаксис <code>.^<\/code>, найкорисніші метаметоди для дослідження типу й те, як MOP дозволяє навіть додавати методи до класу під час виконання програми.<\/span><\/p>"]]},"bg":{"t":"Протоколът на метаобектите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки клас, роля и тип в Raku сам по себе си се описва от друг обект — своя <em>метаобект<\/em>, — който знае името на типа, атрибутите му, методите му и мястото му в дървото на наследяване.<\/span> <span class=\"sg\" data-s=\"1\">Интерфейсът към тези метаобекти е <em>протоколът на метаобектите<\/em>, или MOP.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вие вече използвахте едно ъгълче от него: <code>.^name<\/code> е извикване към MOP.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва синтаксиса <code>.^<\/code> както трябва, най-полезните метаметоди за разглеждане на тип и как MOP дори ви позволява да добавяте методи към клас, докато програмата работи.<\/span><\/p>"]]}}}</script>
