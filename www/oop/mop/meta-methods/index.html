<script type="application/json" id="page-data">{"u":"oop/mop/meta-methods","n":846,"k":"topic","pv":"oop/mop","nx":"oop/mop/meta-methods/quiz","tr":["oop","oop/mop"],"L":{"en":{"t":"Meta-methods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>meta-method<\/em> is called with <code>.^<\/code> instead of <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The ordinary <code>.method<\/code> runs a method of the object; the <code>.^method<\/code> calls a method on the object’s <strong>metaobject<\/strong> — it asks about the type rather than acting as the type.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You have met <code>.^name<\/code>, which returns the type’s name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Other meta-methods inspect the structure of a type.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> lists its attributes, and <code>.^find_method<\/code> tells you whether a method exists:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> returns the <em>method resolution order<\/em> — the chain of types Raku searches, in order, when looking up a method.<\/span> <span class=\"sg\" data-s=\"1\">It is the inheritance line of a class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> inherits from <code>A<\/code>, and every type ultimately from <code>Any<\/code> and <code>Mu<\/code>, so a method call on a <code>B<\/code> is looked for along exactly that path.<\/span> <span class=\"sg\" data-s=\"1\">These meta-methods turn the structure of your types into data you can query at runtime.<\/span><\/p>"]]},"de":{"t":"Metamethoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Metamethode<\/em> wird mit <code>.^<\/code> statt mit <code>.<\/code> aufgerufen.<\/span> <span class=\"sg\" data-s=\"1\">Das gewöhnliche <code>.method<\/code> führt eine Methode des Objekts aus; das <code>.^method<\/code> ruft eine Methode auf dem <strong>Metaobjekt<\/strong> des Objekts auf — es fragt also nach dem Typ, statt als der Typ zu handeln.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie kennen bereits <code>.^name<\/code>, das den Namen des Typs liefert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere Metamethoden untersuchen den Aufbau eines Typs.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> führt seine Attribute auf, und <code>.^find_method<\/code> sagt Ihnen, ob eine Methode existiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> liefert die <em>method resolution order<\/em> — die Kette der Typen, die Raku der Reihe nach durchsucht, wenn es eine Methode nachschlägt.<\/span> <span class=\"sg\" data-s=\"1\">Sie ist die Vererbungslinie einer Klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> erbt von <code>A<\/code>, und jeder Typ letztlich von <code>Any<\/code> und <code>Mu<\/code>, ein Methodenaufruf auf einem <code>B<\/code> wird also genau entlang dieses Pfads gesucht.<\/span> <span class=\"sg\" data-s=\"1\">Diese Metamethoden machen den Aufbau Ihrer Typen zu Daten, die Sie zur Laufzeit abfragen können.<\/span><\/p>"]]},"nl":{"t":"Metamethoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>metamethode<\/em> wordt met <code>.^<\/code> in plaats van <code>.<\/code> aangeroepen.<\/span> <span class=\"sg\" data-s=\"1\">De gewone <code>.method<\/code> draait een methode van het object; de <code>.^method<\/code> roept een methode aan op het <strong>metaobject<\/strong> van het object — hij vraagt iets óver het type in plaats van als het type op te treden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je bent <code>.^name<\/code> tegengekomen, die de naam van het type teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere metamethoden inspecteren de structuur van een type.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> somt de attributen op, en <code>.^find_method<\/code> vertelt je of een methode bestaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> geeft de <em>method resolution order<\/em> terug — de keten van typen die Raku in volgorde doorzoekt bij het opzoeken van een methode.<\/span> <span class=\"sg\" data-s=\"1\">Het is de overervingslijn van een klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> erft van <code>A<\/code>, en elk type uiteindelijk van <code>Any<\/code> en <code>Mu<\/code>, dus een methodeaanroep op een <code>B<\/code> wordt precies langs dat pad gezocht.<\/span> <span class=\"sg\" data-s=\"1\">Deze metamethoden maken van de structuur van je typen gegevens die je tijdens het draaien kunt bevragen.<\/span><\/p>"]]},"es":{"t":"Metamétodos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>metamétodo<\/em> se llama con <code>.^<\/code> en lugar de con <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El <code>.method<\/code> ordinario ejecuta un método del objeto; el <code>.^method<\/code> llama a un método sobre el <strong>metaobjeto<\/strong> del objeto: pregunta algo sobre el tipo en lugar de actuar como el tipo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ya conoces <code>.^name<\/code>, que devuelve el nombre del tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otros metamétodos inspeccionan la estructura de un tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> enumera sus atributos y <code>.^find_method<\/code> te dice si un método existe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> devuelve el <em>method resolution order<\/em>: la cadena de tipos que Raku recorre, en orden, al buscar un método.<\/span> <span class=\"sg\" data-s=\"1\">Es la línea de herencia de una clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> hereda de <code>A<\/code>, y todo tipo en última instancia de <code>Any<\/code> y <code>Mu<\/code>, así que una llamada a un método sobre un <code>B<\/code> se busca exactamente por ese camino.<\/span> <span class=\"sg\" data-s=\"1\">Estos metamétodos convierten la estructura de tus tipos en datos que puedes consultar en tiempo de ejecución.<\/span><\/p>"]]},"it":{"t":"Metametodi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>metametodo<\/em> si chiama con <code>.^<\/code> invece che con <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>.method<\/code> ordinario esegue un metodo dell'oggetto; il <code>.^method<\/code> chiama un metodo sul <strong>metaoggetto<\/strong> dell'oggetto — chiede qualcosa sul tipo invece di agire come il tipo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai incontrato <code>.^name<\/code>, che restituisce il nome del tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri metametodi ispezionano la struttura di un tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> elenca i suoi attributi e <code>.^find_method<\/code> ti dice se un metodo esiste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> restituisce il <em>method resolution order<\/em> — la catena di tipi che Raku percorre, nell'ordine, quando cerca un metodo.<\/span> <span class=\"sg\" data-s=\"1\">È la linea di ereditarietà di una classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> eredita da <code>A<\/code>, e ogni tipo in ultima analisi da <code>Any<\/code> e <code>Mu<\/code>, quindi la chiamata di un metodo su un <code>B<\/code> viene cercata esattamente lungo quel percorso.<\/span> <span class=\"sg\" data-s=\"1\">Questi metametodi trasformano la struttura dei tuoi tipi in dati che puoi interrogare a runtime.<\/span><\/p>"]]},"lv":{"t":"Metametodes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Metametodi<\/em> izsauc ar <code>.^<\/code>, nevis ar <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Parastā <code>.method<\/code> izpilda objekta metodi; <code>.^method<\/code> izsauc metodi uz objekta <strong>metaobjekta<\/strong> — tā jautā par tipu, nevis darbojas kā tips.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar <code>.^name<\/code>, kas atgriež tipa nosaukumu, jau esat sastapušies:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Citas metametodes izpēta tipa struktūru.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> uzskaita tā atribūtus, un <code>.^find_method<\/code> pasaka, vai metode eksistē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> atgriež <em>metožu atrisināšanas secību<\/em> — tipu ķēdi, ko Raku secīgi pārmeklē, meklējot metodi.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir klases mantošanas līnija:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> manto no <code>A<\/code>, un katrs tips galu galā no <code>Any<\/code> un <code>Mu<\/code>, tāpēc metodes izsaukums uz <code>B<\/code> tiek meklēts tieši pa šo ceļu.<\/span> <span class=\"sg\" data-s=\"1\">Šīs metametodes pārvērš jūsu tipu struktūru par datiem, ko izpildes laikā var izprašņāt.<\/span><\/p>"]]},"ru":{"t":"Метаметоды","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметод<\/em> вызывается через <code>.^<\/code>, а не через <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обычный <code>.method<\/code> выполняет метод объекта, а <code>.^method<\/code> вызывает метод у <strong>метаобъекта<\/strong> объекта — он спрашивает о типе, а не действует как тип.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы уже встречали <code>.^name<\/code>, который возвращает имя типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Другие метаметоды исследуют устройство типа.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> перечисляет его атрибуты, а <code>.^find_method<\/code> сообщает, существует ли метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> возвращает <em>порядок разрешения методов<\/em> — цепочку типов, которые Raku по очереди просматривает при поиске метода.<\/span> <span class=\"sg\" data-s=\"1\">Это линия наследования класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> наследует от <code>A<\/code>, а всякий тип в конечном счёте — от <code>Any<\/code> и <code>Mu<\/code>, поэтому вызов метода у объекта <code>B<\/code> ищется ровно по этому пути.<\/span> <span class=\"sg\" data-s=\"1\">Эти метаметоды превращают устройство ваших типов в данные, которые можно запрашивать во время выполнения.<\/span><\/p>"]]},"uk":{"t":"Метаметоди","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметод<\/em> викликають через <code>.^<\/code> замість <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звичайний <code>.method<\/code> виконує метод об'єкта; <code>.^method<\/code> викликає метод <strong>метаоб'єкта<\/strong> об'єкта — він запитує про тип, а не діє як тип.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви вже зустрічалися з <code>.^name<\/code>, який повертає ім'я типу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інші метаметоди досліджують будову типу.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> перелічує його атрибути, а <code>.^find_method<\/code> каже, чи існує метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> повертає <em>порядок розв'язання методів<\/em> — ланцюжок типів, у якому Raku по черзі шукає метод.<\/span> <span class=\"sg\" data-s=\"1\">Це лінія успадкування класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> успадковує від <code>A<\/code>, а кожен тип зрештою — від <code>Any<\/code> та <code>Mu<\/code>, тож виклик методу для <code>B<\/code> шукається саме цим шляхом.<\/span> <span class=\"sg\" data-s=\"1\">Ці метаметоди перетворюють будову ваших типів на дані, які можна запитувати під час виконання.<\/span><\/p>"]]},"bg":{"t":"Метаметоди","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметодът<\/em> се извиква с <code>.^<\/code> вместо с <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обикновеното <code>.method<\/code> изпълнява метод на обекта; <code>.^method<\/code> извиква метод върху <strong>метаобекта<\/strong> на обекта — той пита за типа, вместо да действа като типа.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запознахте се с <code>.^name<\/code>, който връща името на типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Други метаметоди разглеждат устройството на типа.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> изброява атрибутите му, а <code>.^find_method<\/code> ви казва дали даден метод съществува:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> връща <em>реда на разрешаване на методите<\/em> — веригата от типове, която Raku претърсва по ред, когато търси метод.<\/span> <span class=\"sg\" data-s=\"1\">Това е линията на наследяване на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> наследява <code>A<\/code>, а всеки тип в крайна сметка — <code>Any<\/code> и <code>Mu<\/code>, така че извикването на метод върху <code>B<\/code> се търси точно по този път.<\/span> <span class=\"sg\" data-s=\"1\">Тези метаметоди превръщат устройството на вашите типове в данни, които можете да запитвате по време на изпълнение.<\/span><\/p>"]]},"eo":{"t":"Metametodoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Metametodo<\/em> estas vokata per <code>.^<\/code> anstataŭ <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ordinara <code>.method<\/code> rulas metodon de la objekto; la <code>.^method<\/code> vokas metodon sur la <strong>metaobjekto<\/strong> de la objekto — ĝi demandas pri la tipo anstataŭ agi kiel la tipo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi renkontis <code>.^name<\/code>, kiu redonas la nomon de la tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliaj metametodoj inspektas la strukturon de tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> listigas ĝiajn atributojn, kaj <code>.^find_method<\/code> diras al vi, ĉu metodo ekzistas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> redonas la <em>ordon de metodserĉado<\/em> — la ĉenon de tipoj, kiujn Raku traserĉas, laŭvice, kiam ĝi serĉas metodon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la hereda linio de klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> heredas de <code>A<\/code>, kaj ĉiu tipo finfine de <code>Any<\/code> kaj <code>Mu<\/code>, do metodvoko sur <code>B<\/code> estas serĉata laŭ ĝuste tiu vojo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj metametodoj transformas la strukturon de viaj tipoj en datumojn, kiujn vi povas pridemandi je rultempo.<\/span><\/p>"]]},"la":{"t":"Metamethodi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Metamethodus<\/em> per <code>.^<\/code> loco <code>.<\/code> vocatur.<\/span> <span class=\"sg\" data-s=\"1\">Ordinarium <code>.method<\/code> methodum obiecti exsequitur; <code>.^method<\/code> methodum in <strong>metaobiecto<\/strong> obiecti vocat — de genere interrogat potius quam ut genus agit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> invenisti, quae nomen generis reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliae metamethodi structuram generis inspiciunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> attributa eius enumerat, et <code>.^find_method<\/code> tibi indicat utrum methodus exsistat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> <em>ordinem resolutionis methodorum<\/em> reddit — catenam generum quam Raku ordine perquirit cum methodum quaerit.<\/span> <span class=\"sg\" data-s=\"1\">Est linea hereditatis classis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> ab <code>A<\/code> heredat, et omne genus tandem ab <code>Any<\/code> et <code>Mu<\/code>, itaque vocatio methodi in <code>B<\/code> per illam ipsam semitam quaeritur.<\/span> <span class=\"sg\" data-s=\"1\">Hae metamethodi structuram generum tuorum in data vertunt quae tempore exsecutionis interrogare potes.<\/span><\/p>"]]}}}</script>
