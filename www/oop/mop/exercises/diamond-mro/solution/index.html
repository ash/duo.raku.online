ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> šo rombu saplacina vienā, lineārā meklēšanas secībā. Vispirms nāk <code>D<\/code>, tad tā vecākklases <code>B<\/code> un <code>C<\/code> tādā secībā, kādā tās uzrakstītas, tad kopīgais <code>A<\/code> un visbeidzot <code>Any<\/code> un <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Lai gan gan <code>B<\/code>, gan <code>C<\/code> ved uz <code>A<\/code>, tips <code>A<\/code> parādās <strong>vienreiz<\/strong>, un tikai pēc abiem. Tā ir metožu atrisināšanas secības jēga: katrs tips tiek apmeklēts tieši vienu reizi, un vecākklase nekad nenāk pirms bērnklases, kas no tās manto, — tāpēc metode, kas definēta <code>B<\/code>, vienmēr tiek atrasta pirms tās, ko tā pārrakstītu <code>A<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Ромб классов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> наследует сразу от двух родителей — в записи <code>class D is B is C<\/code> каждый из них указан со своим <code>is<\/code>. Это множественное наследование, и <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, <code>D<\/code> образуют <em>ромб<\/em>: два пути от <code>D<\/code> вверх к общему предку <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> расплющивает этот ромб в единый линейный порядок поиска. Сначала идёт <code>D<\/code>, затем его родители <code>B<\/code> и <code>C<\/code> в том порядке, в котором они были записаны, затем общий <code>A<\/code> и, наконец, <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Хотя и <code>B<\/code>, и <code>C<\/code> ведут к <code>A<\/code>, тип <code>A<\/code> появляется <strong>один раз<\/strong> — и только после них обоих. В этом и смысл порядка разрешения методов: каждый тип посещается ровно однажды, и родитель никогда не идёт раньше потомка, который от него наследует, — поэтому метод, определённый в <code>B<\/code>, всегда находится раньше того, который он переопределяет в <code>A<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Ромб із класів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> успадковує одразу від двох батьків — <code>class D is B is C<\/code> перелічує кожного з власним <code>is<\/code>. Це множинне успадкування, і <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, <code>D<\/code> утворюють <em>ромб<\/em>: два шляхи від <code>D<\/code> угору до спільного предка <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> сплощує цей ромб в єдиний лінійний порядок пошуку. Спершу йде <code>D<\/code>, потім його батьки <code>B<\/code> та <code>C<\/code> у порядку запису, потім спільний <code>A<\/code>, і нарешті <code>Any<\/code> та <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Хоча і <code>B<\/code>, і <code>C<\/code> ведуть до <code>A<\/code>, тип <code>A<\/code> з'являється <strong>один раз<\/strong>, і лише після них обох. У цьому й полягає суть порядку розв'язання методів: кожен тип відвідується рівно раз, і батько ніколи не стоїть перед дитиною, яка від нього успадковує, — тож метод, визначений у <code>B<\/code>, завжди знаходиться раніше за той, який він перекрив би в <code>A<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Ромб от класове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> наследява от двама родители наведнъж — <code>class D is B is C<\/code> изброява всеки от тях със свое <code>is<\/code>. Това е множествено наследяване, а <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, <code>D<\/code> образуват <em>ромб<\/em>: два пътя от <code>D<\/code> нагоре до общия предшественик <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> сплесква този ромб в един-единствен линеен ред на търсене. <code>D<\/code> идва първи, после родителите му <code>B<\/code> и <code>C<\/code> в реда, в който са написани, после общият <code>A<\/code> и накрая <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Макар и <code>B<\/code>, и <code>C<\/code> да водят до <code>A<\/code>, типът <code>A<\/code> се появява <strong>веднъж<\/strong> и то едва след двата. Точно това е смисълът на реда на разрешаване на методите: всеки тип се посещава точно веднъж, а родител никога не идва преди дъщерен клас, който го наследява — така че метод, дефиниран в <code>B<\/code>, винаги се намира преди онзи, който би предефинирал в <code>A<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Rombo el klasoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> heredas de du patroj samtempe — <code>class D is B is C<\/code> listigas ĉiun el ili kun sia propra <code>is<\/code>. Tio estas multobla heredo, kaj <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, <code>D<\/code> formas <em>rombon<\/em>: du vojoj de <code>D<\/code> supren al la kunhavata prapatro <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> platigas tiun rombon en unu solan, linian serĉordon. <code>D<\/code> venas unue, poste ĝiaj patroj <code>B<\/code> kaj <code>C<\/code> en la ordo, en kiu ili estis skribitaj, poste la kunhavata <code>A<\/code>, kaj fine <code>Any<\/code> kaj <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kvankam kaj <code>B<\/code> kaj <code>C<\/code> kondukas al <code>A<\/code>, la tipo <code>A<\/code> aperas <strong>unufoje<\/strong>, kaj nur post ambaŭ. Jen la celo de ordo de metodserĉado: ĉiu tipo estas vizitata ekzakte unufoje, kaj patro neniam venas antaŭ ido, kiu heredas de ĝi — do metodo difinita en <code>B<\/code> estas ĉiam trovata antaŭ tiu, kiun ĝi superregus en <code>A<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Rhombus classium","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> a duobus parentibus simul heredat — <code>class D is B is C<\/code> unumquemque cum proprio <code>is<\/code> enumerat. Haec est hereditas multiplex, et <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, <code>D<\/code> <em>adamantem<\/em> formant: duae semitae a <code>D<\/code> sursum ad communem maiorem <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> illum adamantem in unum ordinem quaerendi linearem complanat. <code>D<\/code> primum venit, deinde parentes eius <code>B<\/code> et <code>C<\/code> eo ordine quo scripti sunt, deinde communis <code>A<\/code>, et denique <code>Any<\/code> et <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quamquam et <code>B<\/code> et <code>C<\/code> ad <code>A<\/code> ducunt, genus <code>A<\/code> <strong>semel<\/strong> apparet, et solum post utrumque. Ea est ratio ordinis resolutionis methodorum: omne genus exacte semel visitatur, et parens numquam ante filiam venit quae ab eo heredat — itaque methodus in <code>B<\/code> definita semper ante eam invenitur quam in <code>A<\/code> superscriberet.<\/span><\/li><\/ol>"]]}}}</script>
