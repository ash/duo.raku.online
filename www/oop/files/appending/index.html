<script type="application/json" id="page-data">{"u":"oop/files/appending","n":868,"k":"topic","pv":"oop/files","nx":"oop/files/appending/quiz","tr":["oop","oop/files"],"L":{"en":{"t":"Appending to a file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">By default, <code>spurt<\/code> replaces whatever was in the file.<\/span> <span class=\"sg\" data-s=\"1\">To add to the end of an existing file instead, pass the <code>:append<\/code> named argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The second <code>spurt<\/code> keeps the existing content and adds the new line after it, so the file ends up with both lines:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Without <code>:append<\/code>, the second call would have overwritten the file, leaving only <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Appending is useful for things like log files, where each run of a program adds to a growing record rather than starting over.<\/span><\/p>"]]},"de":{"t":"An eine Datei anhängen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig ersetzt <code>spurt<\/code> alles, was in der Datei stand.<\/span> <span class=\"sg\" data-s=\"1\">Um stattdessen an das Ende einer bestehenden Datei anzuhängen, übergeben Sie das benannte Argument <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das zweite <code>spurt<\/code> behält den bestehenden Inhalt und setzt die neue Zeile dahinter, die Datei enthält am Ende also beide Zeilen:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne <code>:append<\/code> hätte der zweite Aufruf die Datei überschrieben, und nur <code>line2<\/code> wäre übrig geblieben.<\/span> <span class=\"sg\" data-s=\"1\">Anhängen ist nützlich für Dinge wie Protokolldateien, bei denen jeder Programmlauf zu einem wachsenden Verlauf beiträgt, statt von vorn zu beginnen.<\/span><\/p>"]]},"nl":{"t":"Aan een bestand toevoegen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard vervangt <code>spurt<\/code> wat er in het bestand stond.<\/span> <span class=\"sg\" data-s=\"1\">Om in plaats daarvan aan het eind van een bestaand bestand toe te voegen, geef je het benoemde argument <code>:append<\/code> mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De tweede <code>spurt<\/code> behoudt de bestaande inhoud en zet de nieuwe regel erachter, dus het bestand eindigt met beide regels:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder <code>:append<\/code> zou de tweede aanroep het bestand overschreven hebben, waarna alleen <code>line2<\/code> zou overblijven.<\/span> <span class=\"sg\" data-s=\"1\">Toevoegen is nuttig voor dingen als logbestanden, waar elke draaibeurt van een programma aan een groeiend verslag toevoegt in plaats van opnieuw te beginnen.<\/span><\/p>"]]},"es":{"t":"Añadir a un archivo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por omisión, <code>spurt<\/code> sustituye lo que hubiera en el archivo.<\/span> <span class=\"sg\" data-s=\"1\">Para añadir al final de un archivo existente, pasa el argumento con nombre <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El segundo <code>spurt<\/code> conserva el contenido existente y añade la línea nueva después, así que el archivo acaba con las dos líneas:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin <code>:append<\/code>, la segunda llamada habría sobrescrito el archivo y solo quedaría <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Añadir al final resulta útil para cosas como los archivos de registro, donde cada ejecución de un programa se suma a un historial que crece en lugar de empezar de cero.<\/span><\/p>"]]},"it":{"t":"Aggiungere a un file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita <code>spurt<\/code> sostituisce ciò che c'era nel file.<\/span> <span class=\"sg\" data-s=\"1\">Per aggiungere invece in coda a un file esistente, passa l'argomento nominato <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il secondo <code>spurt<\/code> conserva il contenuto esistente e aggiunge dopo di esso la nuova riga, quindi il file finisce per avere entrambe le righe:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza <code>:append<\/code> la seconda chiamata avrebbe sovrascritto il file, lasciando solo <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aggiungere in coda è utile per cose come i file di log, dove ogni esecuzione di un programma si aggiunge a un registro che cresce invece di ricominciare da capo.<\/span><\/p>"]]},"lv":{"t":"Pievienošana failam","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma <code>spurt<\/code> aizstāj visu, kas failā bija.<\/span> <span class=\"sg\" data-s=\"1\">Lai tā vietā pievienotu esoša faila beigās, padodiet nosaukto argumentu <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otrais <code>spurt<\/code> patur esošo saturu un pievieno jauno rindu aiz tā, tāpēc failā beigās ir abas rindas:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez <code>:append<\/code> otrais izsaukums būtu failu pārrakstījis, atstājot tikai <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pievienošana noder tādām lietām kā žurnālfaili, kur katra programmas palaišanas reize papildina augošu pierakstu, nevis sāk no jauna.<\/span><\/p>"]]},"ru":{"t":"Добавление в файл","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию <code>spurt<\/code> заменяет всё, что было в файле.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы вместо этого дописать в конец существующего файла, передайте именованный аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второй <code>spurt<\/code> сохраняет прежнее содержимое и добавляет новую строку после него, поэтому в файле оказываются обе строки:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> второй вызов перезаписал бы файл, оставив только <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Дописывание полезно, например, для журналов, где каждый запуск программы добавляет записи к растущей летописи, а не начинает её заново.<\/span><\/p>"]]},"uk":{"t":"Додавання до файлу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням <code>spurt<\/code> замінює те, що було у файлі.<\/span> <span class=\"sg\" data-s=\"1\">Щоб натомість додати в кінець наявного файлу, передайте іменований аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другий <code>spurt<\/code> зберігає наявний вміст і додає новий рядок після нього, тож у файлі опиняються обидва рядки:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> другий виклик перезаписав би файл, лишивши тільки <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Додавання корисне для таких речей, як файли журналів, де кожен запуск програми дописує до запису, що зростає, замість починати спочатку.<\/span><\/p>"]]},"bg":{"t":"Добавяне към файл","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране <code>spurt<\/code> заменя каквото е било във файла.<\/span> <span class=\"sg\" data-s=\"1\">За да добавите вместо това в края на съществуващ файл, подайте именувания аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второто <code>spurt<\/code> запазва съществуващото съдържание и добавя новия ред след него, така че файлът завършва и с двата реда:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> второто извикване би презаписало файла и би останало само <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Добавянето е полезно за неща като журнални файлове, където всяко изпълнение на програмата допълва растящ запис, вместо да започва отначало.<\/span><\/p>"]]}}}</script>
