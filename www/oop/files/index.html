<script type="application/json" id="page-data">{"u":"oop/files","n":867,"k":"section","pv":"oop/standard-streams/quiz","nx":"oop/files/appending","tr":["oop"],"L":{"en":{"t":"Working with files","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The simplest way to work with a file is to read or write it all at once.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>spurt<\/code> routine writes a string to a file, creating the file (or replacing its contents if it already exists):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>slurp<\/code> routine reads the whole content of a file back into a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Together, <code>spurt<\/code> and <code>slurp<\/code> let you save data and load it again with two short calls. (<code>print<\/code> is used here rather than <code>say<\/code>, because the text already ends with a newline.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">These whole-file operations are ideal when a file is small enough to hold in memory comfortably.<\/span> <span class=\"sg\" data-s=\"1\">For larger files, or when you want to process a file line by line, you use a <a href=\"/oop/file-handles/\">file handle<\/a>, covered at the end of this section.<\/span> <span class=\"sg\" data-s=\"2\">The next topic shows how to add to a file instead of replacing it.<\/span><\/p>"]]},"de":{"t":"Mit Dateien arbeiten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Der einfachste Weg, mit einer Datei zu arbeiten, ist, sie ganz auf einmal zu lesen oder zu schreiben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>spurt<\/code> schreibt eine Zeichenkette in eine Datei und legt die Datei an (oder ersetzt ihren Inhalt, falls sie bereits besteht):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>slurp<\/code> liest den gesamten Inhalt einer Datei zurück in eine Zeichenkette:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zusammen erlauben <code>spurt<\/code> und <code>slurp<\/code> es Ihnen, Daten mit zwei kurzen Aufrufen zu sichern und wieder zu laden. (Hier wird <code>print<\/code> statt <code>say<\/code> verwendet, weil der Text bereits mit einem Zeilenumbruch endet.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diese Operationen auf ganzen Dateien sind ideal, wenn eine Datei klein genug ist, um bequem im Speicher zu liegen.<\/span> <span class=\"sg\" data-s=\"1\">Für größere Dateien oder wenn Sie eine Datei zeilenweise verarbeiten möchten, verwenden Sie einen <a href=\"https://course.raku.org/de/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">Dateihandle<\/a>, der am Ende dieses Abschnitts behandelt wird.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Thema zeigt, wie Sie an eine Datei anhängen, statt sie zu ersetzen.<\/span><\/p>"]]},"nl":{"t":"Met bestanden werken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste manier om met een bestand te werken is het in één keer lezen of schrijven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De routine <code>spurt<\/code> schrijft een string naar een bestand en maakt het bestand aan (of vervangt de inhoud als het al bestaat):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De routine <code>slurp<\/code> leest de hele inhoud van een bestand terug in een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Samen laten <code>spurt<\/code> en <code>slurp<\/code> je met twee korte aanroepen gegevens opslaan en weer inladen. (Hier wordt <code>print<\/code> gebruikt in plaats van <code>say<\/code>, omdat de tekst al op een newline eindigt.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze bewerkingen op hele bestanden zijn ideaal wanneer een bestand klein genoeg is om comfortabel in het geheugen te houden.<\/span> <span class=\"sg\" data-s=\"1\">Voor grotere bestanden, of wanneer je een bestand regel voor regel wilt verwerken, gebruik je een <a href=\"https://course.raku.org/nl/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">bestandshandle<\/a>, behandeld aan het eind van deze sectie.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende onderwerp laat zien hoe je aan een bestand toevoegt in plaats van het te vervangen.<\/span><\/p>"]]},"es":{"t":"Trabajar con archivos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma más sencilla de trabajar con un archivo es leerlo o escribirlo entero de una vez.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>spurt<\/code> escribe una cadena en un archivo, creándolo (o sustituyendo su contenido si ya existe):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>slurp<\/code> lee de vuelta todo el contenido de un archivo en una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Juntas, <code>spurt<\/code> y <code>slurp<\/code> te permiten guardar datos y volver a cargarlos con dos llamadas cortas. (Aquí se usa <code>print<\/code> en lugar de <code>say<\/code>, porque el texto ya termina con un salto de línea.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas operaciones sobre el archivo entero son ideales cuando un archivo es lo bastante pequeño como para caber cómodamente en memoria.<\/span> <span class=\"sg\" data-s=\"1\">Para archivos más grandes, o cuando quieres procesar un archivo línea a línea, se usa un <a href=\"https://course.raku.org/es/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">manejador de archivo<\/a>, tratado al final de esta sección.<\/span> <span class=\"sg\" data-s=\"2\">El tema siguiente muestra cómo añadir a un archivo en lugar de sustituirlo.<\/span><\/p>"]]},"it":{"t":"Lavorare con i file","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Il modo più semplice di lavorare con un file è leggerlo o scriverlo tutto in una volta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>spurt<\/code> scrive una stringa in un file, creando il file (o sostituendone il contenuto se esiste già):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>slurp<\/code> rilegge l'intero contenuto di un file in una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Insieme, <code>spurt<\/code> e <code>slurp<\/code> ti permettono di salvare dati e ricaricarli con due chiamate brevi. (Qui si usa <code>print<\/code> invece di <code>say<\/code>, perché il testo termina già con un ritorno a capo.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Queste operazioni su tutto il file sono ideali quando un file è abbastanza piccolo da stare comodamente in memoria.<\/span> <span class=\"sg\" data-s=\"1\">Per file più grandi, o quando vuoi elaborare un file riga per riga, si usa un <a href=\"https://course.raku.org/it/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">handle di file<\/a>, trattato alla fine di questa sezione.<\/span> <span class=\"sg\" data-s=\"2\">L'argomento successivo mostra come aggiungere a un file invece di sostituirlo.<\/span><\/p>"]]},"lv":{"t":"Darbs ar failiem","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākais veids, kā strādāt ar failu, ir nolasīt vai ierakstīt to visu uzreiz.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>spurt<\/code> ieraksta virkni failā, izveidojot failu (vai aizstājot tā saturu, ja tas jau eksistē):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>slurp<\/code> nolasa visu faila saturu atpakaļ virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kopā <code>spurt<\/code> un <code>slurp<\/code> ļauj datus saglabāt un atkal ielādēt ar diviem īsiem izsaukumiem. (Šeit lietots <code>print<\/code>, nevis <code>say<\/code>, jo teksts jau beidzas ar jaunas rindas rakstzīmi.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šīs veselā faila darbības ir ideālas, kad fails ir pietiekami mazs, lai to ērti turētu atmiņā.<\/span> <span class=\"sg\" data-s=\"1\">Lielākiem failiem vai tad, kad failu vēlaties apstrādāt pa rindai, izmantojat <a href=\"https://course.raku.org/lv/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">faila turi<\/a>, kas aplūkots šīs sadaļas beigās.<\/span> <span class=\"sg\" data-s=\"2\">Nākamais temats parāda, kā failam pievienot, nevis to aizstāt.<\/span><\/p>"]]},"ru":{"t":"Работа с файлами","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Проще всего работать с файлом, читая или записывая его целиком.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>spurt<\/code> записывает строку в файл, создавая его (или заменяя содержимое, если файл уже существует):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>slurp<\/code> читает всё содержимое файла обратно в строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместе <code>spurt<\/code> и <code>slurp<\/code> позволяют сохранить данные и снова их загрузить двумя короткими вызовами. (Здесь используется <code>print<\/code>, а не <code>say<\/code>, потому что текст уже заканчивается переводом строки.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Такие операции над файлом целиком идеальны, когда файл достаточно мал, чтобы спокойно уместиться в памяти.<\/span> <span class=\"sg\" data-s=\"1\">Для файлов побольше или когда файл нужно обрабатывать построчно, используется <a href=\"https://course.raku.org/ru/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">файловый дескриптор<\/a>, которому посвящён конец этого раздела.<\/span> <span class=\"sg\" data-s=\"2\">Следующая тема показывает, как дописывать в файл, а не заменять его.<\/span><\/p>"]]},"uk":{"t":"Робота з файлами","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпростіший спосіб працювати з файлом — прочитати або записати його весь за раз.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>spurt<\/code> записує рядок у файл, створюючи файл (або замінюючи його вміст, якщо той уже існує):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>slurp<\/code> читає весь вміст файлу назад у рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разом <code>spurt<\/code> і <code>slurp<\/code> дозволяють зберегти дані й знову завантажити їх двома короткими викликами. (Тут використано <code>print<\/code>, а не <code>say<\/code>, бо текст уже закінчується переходом рядка.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ці операції над цілим файлом ідеальні, коли файл достатньо малий, щоб зручно вміститися в пам'яті.<\/span> <span class=\"sg\" data-s=\"1\">Для більших файлів або коли ви хочете обробляти файл рядок за рядком, використовують <a href=\"https://course.raku.org/uk/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">дескриптор файлу<\/a>, розглянутий наприкінці цього розділу.<\/span> <span class=\"sg\" data-s=\"2\">Наступна тема показує, як додавати до файлу замість замінювати його.<\/span><\/p>"]]},"bg":{"t":"Работа с файлове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-простият начин да работите с файл е да го прочетете или запишете наведнъж.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>spurt<\/code> записва низ във файл, като създава файла (или заменя съдържанието му, ако вече съществува):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>slurp<\/code> прочита цялото съдържание на файл обратно в низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заедно <code>spurt<\/code> и <code>slurp<\/code> ви позволяват да запазите данни и да ги заредите отново с две кратки извиквания. (Тук се използва <code>print<\/code>, а не <code>say<\/code>, защото текстът вече завършва с нов ред.)<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тези операции върху целия файл са идеални, когато файлът е достатъчно малък, за да се побере удобно в паметта.<\/span> <span class=\"sg\" data-s=\"1\">За по-големи файлове или когато искате да обработите файл ред по ред, използвате <a href=\"https://course.raku.org/bg/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">манипулатор на файл<\/a>, разгледан в края на този раздел.<\/span> <span class=\"sg\" data-s=\"2\">Следващата тема показва как да добавяте към файл, вместо да го заменяте.<\/span><\/p>"]]}}}</script>
