<script type="application/json" id="page-data">{"u":"oop/custom-exceptions","n":959,"k":"section","pv":"oop/failures/quiz","nx":"oop/custom-exceptions/exercises","tr":["oop"],"L":{"en":{"t":"Custom exceptions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides the built-in <code>X::<\/code> exceptions, you can define your own.<\/span> <span class=\"sg\" data-s=\"1\">A custom exception is a class that inherits from the built-in <code>Exception<\/code> class and provides a <code>message<\/code> method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> is a normal class — it can have attributes such as <code>value<\/code> — but because it <code>is Exception<\/code>, it can be thrown.<\/span> <span class=\"sg\" data-s=\"1\">You throw it by creating an object and calling <code>.throw<\/code> on it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inside the <code>CATCH<\/code>, <code>when TooBig<\/code> matches because the thrown object is of that type.<\/span> <span class=\"sg\" data-s=\"1\">A custom exception carries whatever data you give it (here, the <code>value<\/code>), so the handler can build a precise message or react in a specific way — far more useful than a plain string passed to <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This brings together everything in this part: a custom exception is a <em>class<\/em> (with attributes and a method) that takes part in the exception machinery, ready to signal exactly what went wrong.<\/span><\/p>"]]},"de":{"t":"Eigene Ausnahmen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben den eingebauten <code>X::<\/code>-Ausnahmen können Sie eigene definieren.<\/span> <span class=\"sg\" data-s=\"1\">Eine eigene Ausnahme ist eine Klasse, die von der eingebauten Klasse <code>Exception<\/code> erbt und eine Methode <code>message<\/code> bereitstellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> ist eine gewöhnliche Klasse — sie kann Attribute wie <code>value<\/code> haben —, aber weil sie <code>is Exception<\/code> ist, kann sie geworfen werden.<\/span> <span class=\"sg\" data-s=\"1\">Sie werfen sie, indem Sie ein Objekt erzeugen und darauf <code>.throw<\/code> aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Innerhalb des <code>CATCH<\/code> trifft <code>when TooBig<\/code> zu, weil das geworfene Objekt von diesem Typ ist.<\/span> <span class=\"sg\" data-s=\"1\">Eine eigene Ausnahme trägt beliebige Daten mit sich, die Sie ihr mitgeben (hier den <code>value<\/code>), sodass die Behandlung eine genaue Meldung aufbauen oder gezielt reagieren kann — weit nützlicher als eine schlichte, an <code>die<\/code> übergebene Zeichenkette.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Damit fügt sich alles aus diesem Teil zusammen: Eine eigene Ausnahme ist eine <em>Klasse<\/em> (mit Attributen und einer Methode), die an der Ausnahmemaschinerie teilnimmt und bereitsteht, genau zu melden, was schiefging.<\/span><\/p>"]]},"nl":{"t":"Eigen excepties","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast de ingebouwde <code>X::<\/code>-excepties kun je je eigen excepties definiëren.<\/span> <span class=\"sg\" data-s=\"1\">Een eigen exceptie is een klasse die van de ingebouwde klasse <code>Exception<\/code> erft en een methode <code>message<\/code> levert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> is een gewone klasse — hij kan attributen als <code>value<\/code> hebben — maar omdat hij <code>is Exception<\/code>, kan hij geworpen worden.<\/span> <span class=\"sg\" data-s=\"1\">Je werpt hem door een object te maken en er <code>.throw<\/code> op aan te roepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binnen de <code>CATCH<\/code> matcht <code>when TooBig<\/code> omdat het geworpen object van dat type is.<\/span> <span class=\"sg\" data-s=\"1\">Een eigen exceptie draagt alle gegevens mee die je haar meegeeft (hier de <code>value<\/code>), zodat de afhandelaar een nauwkeurige melding kan opbouwen of op een specifieke manier kan reageren — veel nuttiger dan een kale string die aan <code>die<\/code> wordt meegegeven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit brengt alles uit dit deel samen: een eigen exceptie is een <em>klasse<\/em> (met attributen en een methode) die meedoet in het exceptiemechanisme, klaar om precies te melden wat er misging.<\/span><\/p>"]]},"es":{"t":"Excepciones propias","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de las excepciones incorporadas <code>X::<\/code>, puedes definir las tuyas.<\/span> <span class=\"sg\" data-s=\"1\">Una excepción personalizada es una clase que hereda de la clase incorporada <code>Exception<\/code> y aporta un método <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> es una clase normal — puede tener atributos como <code>value<\/code> —, pero como es <code>is Exception<\/code>, se puede lanzar.<\/span> <span class=\"sg\" data-s=\"1\">La lanzas creando un objeto y llamándole <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro del <code>CATCH<\/code>, <code>when TooBig<\/code> coincide porque el objeto lanzado es de ese tipo.<\/span> <span class=\"sg\" data-s=\"1\">Una excepción personalizada lleva consigo los datos que le des (aquí, el <code>value<\/code>), de modo que el manejador puede construir un mensaje preciso o reaccionar de una forma concreta, mucho más útil que una simple cadena pasada a <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto reúne todo lo de esta parte: una excepción personalizada es una <em>clase<\/em> (con atributos y un método) que participa en la maquinaria de las excepciones, lista para señalar exactamente qué salió mal.<\/span><\/p>"]]},"it":{"t":"Eccezioni personalizzate","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre alle eccezioni incorporate <code>X::<\/code>, puoi definire le tue.<\/span> <span class=\"sg\" data-s=\"1\">Un'eccezione personalizzata è una classe che eredita dalla classe incorporata <code>Exception<\/code> e fornisce un metodo <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> è una classe normale — può avere attributi come <code>value<\/code> — ma poiché è <code>is Exception<\/code>, può essere sollevata.<\/span> <span class=\"sg\" data-s=\"1\">La sollevi creando un oggetto e chiamandovi sopra <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro il <code>CATCH<\/code>, <code>when TooBig<\/code> corrisponde perché l'oggetto sollevato è di quel tipo.<\/span> <span class=\"sg\" data-s=\"1\">Un'eccezione personalizzata porta con sé qualunque dato le dai (qui il <code>value<\/code>), così il gestore può costruire un messaggio preciso o reagire in modo specifico — molto più utile di una semplice stringa passata a <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo mette insieme tutto ciò che c'è in questa parte: un'eccezione personalizzata è una <em>classe<\/em> (con attributi e un metodo) che partecipa al meccanismo delle eccezioni, pronta a segnalare esattamente che cosa è andato storto.<\/span><\/p>"]]},"lv":{"t":"Paša veidoti izņēmumi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez iebūvētajiem <code>X::<\/code> izņēmumiem varat definēt savējos.<\/span> <span class=\"sg\" data-s=\"1\">Paša definēts izņēmums ir klase, kas manto no iebūvētās klases <code>Exception<\/code> un nodrošina metodi <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> ir parasta klase — tai var būt atribūti, piemēram, <code>value<\/code> —, taču, tā kā tā <code>is Exception<\/code>, to var izmest.<\/span> <span class=\"sg\" data-s=\"1\">To izmetat, izveidojot objektu un izsaucot uz tā <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> iekšienē <code>when TooBig<\/code> atbilst, jo izmestais objekts ir šī tipa.<\/span> <span class=\"sg\" data-s=\"1\">Paša definēts izņēmums nes sev līdzi tos datus, ko tam dodat (šeit <code>value<\/code>), tāpēc apstrādātājs var uzbūvēt precīzu paziņojumu vai reaģēt konkrētā veidā — daudz noderīgāk nekā vienkārša virkne, kas padota <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas savij kopā visu šo daļu: paša definēts izņēmums ir <em>klase<\/em> (ar atribūtiem un metodi), kas piedalās izņēmumu mehānismā, gatava paziņot tieši to, kas noticis greizi.<\/span><\/p>"]]},"ru":{"t":"Собственные исключения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кроме встроенных исключений <code>X::<\/code>, вы можете определять собственные.<\/span> <span class=\"sg\" data-s=\"1\">Собственное исключение — это класс, который наследует от встроенного класса <code>Exception<\/code> и предоставляет метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> — обычный класс: у него могут быть атрибуты, например <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но поскольку он <code>is Exception<\/code>, его можно бросить.<\/span> <span class=\"sg\" data-s=\"2\">Бросают его, создав объект и вызвав у него <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри <code>CATCH<\/code> срабатывает <code>when TooBig<\/code>, потому что брошенный объект имеет этот тип.<\/span> <span class=\"sg\" data-s=\"1\">Собственное исключение несёт те данные, которые вы ему дали (здесь — <code>value<\/code>), поэтому обработчик может построить точное сообщение или отреагировать особым образом.<\/span> <span class=\"sg\" data-s=\"2\">Это куда полезнее, чем простая строка, переданная в <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь сходится всё содержание этой части: собственное исключение — это <em>класс<\/em> (с атрибутами и методом), участвующий в механике исключений и готовый сообщить в точности о том, что пошло не так.<\/span><\/p>"]]},"uk":{"t":"Власні винятки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім вбудованих винятків <code>X::<\/code>, ви можете визначати власні.<\/span> <span class=\"sg\" data-s=\"1\">Власний виняток — це клас, який успадковує від вбудованого класу <code>Exception<\/code> і надає метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> є звичайним класом — він може мати атрибути на кшталт <code>value<\/code>, — але, оскільки він <code>is Exception<\/code>, його можна кинути.<\/span> <span class=\"sg\" data-s=\"1\">Кидають його, створивши об'єкт і викликавши для нього <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усередині <code>CATCH<\/code> <code>when TooBig<\/code> збігається, бо кинутий об'єкт має цей тип.<\/span> <span class=\"sg\" data-s=\"1\">Власний виняток несе ті дані, які ви йому дали (тут — <code>value<\/code>), тож обробник може побудувати точне повідомлення або відреагувати в конкретний спосіб, — це значно корисніше за звичайний рядок, переданий до <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це зводить докупи все з цієї частини: власний виняток є <em>класом<\/em> (з атрибутами й методом), який бере участь у механіці винятків, готовий сигналізувати саме про те, що пішло не так.<\/span><\/p>"]]},"bg":{"t":"Собствени изключения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен вградените изключения <code>X::<\/code>, можете да дефинирате и свои собствени.<\/span> <span class=\"sg\" data-s=\"1\">Собственото изключение е клас, който наследява вградения клас <code>Exception<\/code> и предоставя метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> е нормален клас — може да има атрибути като <code>value<\/code>, — но понеже е <code>is Exception<\/code>, той може да бъде хвърлен.<\/span> <span class=\"sg\" data-s=\"1\">Хвърляте го, като създадете обект и извикате <code>.throw<\/code> върху него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътре в <code>CATCH<\/code> <code>when TooBig<\/code> съвпада, защото хвърленият обект е от този тип.<\/span> <span class=\"sg\" data-s=\"1\">Собственото изключение носи каквито данни му дадете (тук <code>value<\/code>), така че обработващият може да изгради точно съобщение или да реагира по конкретен начин — далеч по-полезно от обикновен низ, подаден на <code>die<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това събира всичко от тази част: собственото изключение е <em>клас<\/em> (с атрибути и метод), който участва в машинарията на изключенията, готов да сигнализира какво точно се е объркало.<\/span><\/p>"]]}}}</script>
