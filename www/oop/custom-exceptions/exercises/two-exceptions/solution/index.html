<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/two-exceptions/solution","n":966,"k":"solution","pv":"oop/custom-exceptions/exercises/two-exceptions","nx":"oop/custom-exceptions/quiz","tr":["oop","oop/custom-exceptions"],"L":{"en":{"t":"The solution of ’Two exception types‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The loop throws a <code>TooSmall<\/code> on the first pass and a <code>TooBig<\/code> on the second, each inside its own block with its own <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>CATCH<\/code> phaser has a <code>when<\/code> branch for each exception type. On each pass, only the branch matching the thrown type runs — so the first pass prints <code>small<\/code> and the second prints <code>big<\/code>. This is how a single set of handlers reacts differently to different kinds of error.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zwei Ausnahmetypen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Schleife wirft im ersten Durchgang eine <code>TooSmall<\/code> und im zweiten eine <code>TooBig<\/code>, jeweils in einem eigenen Block mit eigenem <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>CATCH<\/code>-Phaser hat einen <code>when<\/code>-Zweig je Ausnahmetyp. In jedem Durchgang läuft nur der Zweig, der auf den geworfenen Typ passt — der erste Durchgang gibt also <code>small<\/code> aus und der zweite <code>big<\/code>. So reagiert ein einziger Satz von Behandlungen unterschiedlich auf verschiedene Arten von Fehlern.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Twee exceptietypen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De lus werpt bij de eerste ronde een <code>TooSmall<\/code> en bij de tweede een <code>TooBig<\/code>, elk binnen een eigen blok met een eigen <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>CATCH<\/code>-faser heeft een <code>when<\/code>-tak voor elk exceptietype. Bij elke ronde draait alleen de tak die op het geworpen type matcht — dus de eerste ronde drukt <code>small<\/code> af en de tweede <code>big<\/code>. Zo reageert één stel afhandelaars verschillend op verschillende soorten fouten.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Dos tipos de excepción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bucle lanza una <code>TooSmall<\/code> en la primera pasada y una <code>TooBig<\/code> en la segunda, cada una dentro de su propio bloque con su propio <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El phaser <code>CATCH<\/code> tiene una rama <code>when<\/code> para cada tipo de excepción. En cada pasada solo se ejecuta la rama que coincide con el tipo lanzado, así que la primera imprime <code>small<\/code> y la segunda <code>big<\/code>. Así es como un mismo conjunto de manejadores reacciona de forma distinta ante clases distintas de error.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Due tipi di eccezione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il ciclo solleva una <code>TooSmall<\/code> al primo passaggio e una <code>TooBig<\/code> al secondo, ciascuna dentro un blocco a sé con il proprio <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il phaser <code>CATCH<\/code> ha un ramo <code>when<\/code> per ogni tipo di eccezione. A ogni passaggio gira solo il ramo che corrisponde al tipo sollevato — quindi il primo passaggio stampa <code>small<\/code> e il secondo stampa <code>big<\/code>. È così che un unico insieme di gestori reagisce in modo diverso a generi diversi di errore.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Divi izņēmumu tipi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cikls pirmajā piegājienā izmet <code>TooSmall<\/code>, bet otrajā <code>TooBig<\/code>, katru savā blokā ar savu <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fāzerim <code>CATCH<\/code> ir <code>when<\/code> zars katram izņēmuma tipam. Katrā piegājienā izpildās tikai tas zars, kas atbilst izmestajam tipam, — tāpēc pirmais piegājiens izdrukā <code>small<\/code>, bet otrais <code>big<\/code>. Tā viens apstrādātāju kopums reaģē atšķirīgi uz dažādiem kļūdu veidiem.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Два типа исключений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл бросает <code>TooSmall<\/code> на первом проходе и <code>TooBig<\/code> на втором, каждый внутри собственного блока со своим <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У фазера <code>CATCH<\/code> есть ветвь <code>when<\/code> для каждого типа исключения. На каждом проходе срабатывает только та ветвь, которая соответствует брошенному типу, — поэтому первый проход печатает <code>small<\/code>, а второй <code>big<\/code>. Так один набор обработчиков по-разному реагирует на разные виды ошибок.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Два типи винятків","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл кидає <code>TooSmall<\/code> на першому проході й <code>TooBig<\/code> на другому, кожен усередині власного блоку з власним <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> має гілку <code>when<\/code> для кожного типу винятку. На кожному проході виконується лише та гілка, що відповідає кинутому типу, — тож перший прохід виводить <code>small<\/code>, а другий <code>big<\/code>. Саме так один набір обробників по-різному реагує на різні роди помилок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Два типа изключения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикълът хвърля <code>TooSmall<\/code> при първото преминаване и <code>TooBig<\/code> при второто, всяко вътре в собствен блок със свой <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазерът <code>CATCH<\/code> има по един клон <code>when<\/code> за всеки тип изключение. При всяко преминаване се изпълнява само клонът, съвпадащ с хвърления тип — така първото преминаване отпечатва <code>small<\/code>, а второто <code>big<\/code>. Ето как един-единствен набор от обработващи реагира различно на различни видове грешки.<\/span><\/li><\/ol>"]]}}}</script>
