ceptions/exercises/two-exceptions/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Два типа исключений","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Определите два собственных класса исключений, <code>TooSmall<\/code> и <code>TooBig<\/code>, каждый наследующий от <code>Exception<\/code>, с методами <code>message<\/code>, возвращающими соответственно <code>too small<\/code> и <code>too big<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пройдите циклом по этим двум типам и для каждого бросьте исключение этого типа внутри собственного блока.<\/span> <span class=\"sg\" data-s=\"1\">Возьмите фазер <code>CATCH<\/code> с ветвью <code>when<\/code> для каждого типа, печатающей <code>small<\/code> для <code>TooSmall<\/code> и <code>big<\/code> для <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так вы увидите, что задействуются обе ветви.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/two-exceptions/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Два типи винятків»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Визначте два власні класи винятків, <code>TooSmall<\/code> та <code>TooBig<\/code>, кожен з яких успадковує від <code>Exception<\/code>, із методами <code>message<\/code>, що повертають <code>too small<\/code> та <code>too big<\/code> відповідно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пройдіть циклом ці два типи й для кожного киньте виняток цього типу всередині власного блоку.<\/span> <span class=\"sg\" data-s=\"1\">Скористайтеся фазером <code>CATCH<\/code> із гілкою <code>when<\/code> для кожного типу, виводячи <code>small<\/code> для <code>TooSmall<\/code> та <code>big<\/code> для <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так ви побачите, що використано обидві гілки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/two-exceptions/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Два типа изключения“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте два собствени класа изключения — <code>TooSmall<\/code> и <code>TooBig<\/code>, — всеки наследяващ <code>Exception<\/code>, с методи <code>message<\/code>, връщащи съответно <code>too small<\/code> и <code>too big<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обходете в цикъл двата типа и за всеки хвърлете изключение от този тип вътре в собствен блок.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте фазер <code>CATCH<\/code> с по един клон <code>when<\/code> за всеки тип, отпечатвайки <code>small<\/code> за <code>TooSmall<\/code> и <code>big<\/code> за <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така ще видите как се използват и двата клона.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/two-exceptions/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</sc
