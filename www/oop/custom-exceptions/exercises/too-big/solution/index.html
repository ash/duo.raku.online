<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/too-big/solution","n":962,"k":"solution","pv":"oop/custom-exceptions/exercises/too-big","nx":"oop/custom-exceptions/exercises/negative-error","tr":["oop","oop/custom-exceptions"],"L":{"en":{"t":"The solution of ’Too big‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> makes the class a throwable exception. It carries two pieces of data, <code>value<\/code> and <code>limit<\/code>, and its <code>message<\/code> method weaves both into the reported text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> raises the exception, and <code>when TooBig<\/code> matches it by type. The handler does more than print the message: it reads the <code>limit<\/code> attribute straight off the caught object to give a helpful hint. That is the advantage of a custom exception over a plain string — the handler receives structured data it can act on.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The exception is thrown <strong>only<\/strong> when <code>$value &gt; $limit<\/code>. For <code>30<\/code>, no exception is raised and the loop body runs to its <code>say<\/code>, printing that the value is within the limit. For <code>99<\/code> and <code>60<\/code>, the <code>throw<\/code> fires, so that <code>say<\/code> is skipped and the <code>CATCH<\/code> handles it instead. The <code>for<\/code> body is itself the block the <code>CATCH<\/code> guards, so a caught exception ends only the current iteration — the loop then simply moves on to the next value.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zu groß","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> macht aus der Klasse eine werfbare Ausnahme. Sie trägt zwei Daten mit sich, <code>value<\/code> und <code>limit<\/code>, und ihre Methode <code>message<\/code> verwebt beide im gemeldeten Text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> löst die Ausnahme aus, und <code>when TooBig<\/code> trifft sie nach Typ. Die Behandlung tut mehr, als die Meldung auszugeben: Sie liest das Attribut <code>limit<\/code> direkt vom gefangenen Objekt, um einen hilfreichen Hinweis zu geben. Das ist der Vorteil einer eigenen Ausnahme gegenüber einer schlichten Zeichenkette — die Behandlung erhält strukturierte Daten, mit denen sie arbeiten kann.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Ausnahme wird <strong>nur<\/strong> geworfen, wenn <code>$value &gt; $limit<\/code>. Für <code>30<\/code> wird keine Ausnahme ausgelöst, und der Schleifenrumpf läuft bis zu seinem <code>say<\/code> und gibt aus, dass der Wert innerhalb der Grenze liegt. Für <code>99<\/code> und <code>60<\/code> schlägt das <code>throw<\/code> zu, jenes <code>say<\/code> wird also übersprungen, und stattdessen behandelt das <code>CATCH<\/code>. Der Rumpf der <code>for<\/code>-Schleife ist selbst der Block, den das <code>CATCH<\/code> bewacht, eine gefangene Ausnahme beendet also nur den laufenden Durchgang — die Schleife geht danach einfach zum nächsten Wert über.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Te groot","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code e>$value &gt; $limit<\/code>. Voor <code>30<\/code> wordt geen exceptie opgeworpen en loopt de body van de lus door tot haar <code>say<\/code>, die afdrukt dat de waarde binnen de limiet ligt. Voor <code>99<\/code> en <code>60<\/code> gaat de <code>throw<\/code> af, dus wordt die <code>say<\/code> overgeslagen en handelt de <code>CATCH<\/code> het in plaats daarvan af. De body van de <code>for<\/code> is zelf het blok dat de <code>CATCH<\/code> bewaakt, dus een gevangen exceptie beëindigt alleen de huidige iteratie — de lus gaat daarna eenvoudigweg door naar de volgende waarde.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Demasiado grande","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><c          say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> rende la classe un'eccezione sollevabile. Porta con sé due dati, <code>value<\/code> e <code>limit<\/code>, e il suo metodo <code>message<\/code> intreccia entrambi nel testo riferito.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> solleva l'eccezione e <code>when TooBig<\/code> la riconosce dal tipo. Il gestore fa più che stampare il messaggio: legge l'attributo <code>limit<\/code> direttamente dall'oggetto intercettato per dare un suggerimento utile. È questo il vantaggio di un'eccezione personalizzata rispetto a una semplice stringa: il gestore riceve dati strutturati su cui può agire.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'eccezione viene sollevata <strong>solo<\/strong> quando <code>$value &gt; $limit<\/code>. Per <code>30<\/code> non viene sollevata alcuna eccezione e il corpo del ciclo arriva fino al suo <code>say<\/code>, stampando che il valore è entro il limite. Per <code>99<\/code> e <code>60<\/code> scatta il <code>throw<\/code>, quindi quel <code>say<\/code> viene saltato e se ne occupa invece il <code>CATCH<\/code>. Il corpo del <code>for<\/code> è esso stesso il blocco che il <code>CATCH<\/code> sorveglia, quindi un'eccezione intercettata chiude solo l'iterazione corrente — e il ciclo passa poi semplicemente al valore successivo.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pārāk liels","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> padara klasi par izmetamu izņēmumu. Tā nes divus datu gabalus <code>value<\/code> un <code>limit<\/code>, un tās metode <code>message<\/code> abus iepin ziņotajā tekstā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> ceļ izņēmumu, un <code>when TooBig<\/code> tam atbilst pēc tipa. Apstrādātājs dara vairāk nekā tikai izdrukā paziņojumu: tas nolasa atribūtu <code>limit<\/code> tieši no noķertā objekta, lai dotu noderīgu norādi. Tieši ar to paša definēts izņēmums ir pārāks par vienkāršu virkni — apstrādātājs saņem strukturētus datus, ar ko var rīkoties.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izņēmums tiek izmests <strong>tikai<\/strong> tad, kad <code>$value &gt; $limit<\/code>. Vērtībai <code>30<\/code> izņēmums netiek celts un cikla ķermenis izpildās līdz savam <code>say<\/code>, izdrukājot, ka vērtība ir robežas ietvaros. Vērtībām <code>99<\/code> un <code>60<\/code> <code>throw<\/code> nostrādā, tāpēc šis <code>say<\/code> tiek izlaists un tā vietā to apstrādā <code>CATCH<\/code>. Cikla ķermenis pats ir tas bloks, ko <code>CATCH<\/code> sargā, tāpēc noķerts izņēmums beidz tikai pašreizējo iterāciju — cikls tad vienkārši virzās uz nākamo vērtību.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Слишком большое","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> делает класс бросаемым исключением. Он несёт две порции данных, <code>value<\/code> и <code>limit<\/code>, а его метод <code>message<\/code> вплетает обе в итоговый текст.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> возбуждает исключение, а <code>when TooBig<\/code> сопоставляет его по типу. Обработчик делает больше, чем печатает сообщение: он читает атрибут <code>limit<\/code> прямо у перехваченного объекта, чтобы дать полезную подсказку. В этом и преимущество собственного исключения перед простой строкой — обработчик получает структурированные данные, с которыми может работать.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Исключение бросается <strong>только<\/strong> тогда, когда <code>$value &gt; $limit<\/code>. Для <code>30<\/code> исключения нет, тело цикла доходит до своего <code>say<\/code> и печатает, что значение в пределах нормы. Для <code>99<\/code> и <code>60<\/code> срабатывает <code>throw<\/code>, поэтому тот <code>say<\/code> пропускается и дело берёт на себя <code>CATCH<\/code>. Тело <code>for<\/code> само и есть тот блок, который охраняет <code>CATCH<\/code>, поэтому перехваченное исключение завершает лишь текущую итерацию — а затем цикл просто переходит к следующему значению.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Завелике","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> робить клас винятком, який можна кидати. Він несе дві одиниці даних, <code>value<\/code> та <code>limit<\/code>, а його метод <code>message<\/code> вплітає обидві у повідомлюваний текст.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> здіймає виняток, а <code>when TooBig<\/code> зіставляється з ним за типом. Обробник робить більше, ніж просто виводить повідомлення: він читає атрибут <code>limit<\/code> прямо з перехопленого об'єкта, щоб дати корисну підказку. У цьому й перевага власного винятку над звичайним рядком — обробник отримує структуровані дані, з якими може щось робити.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Виняток кидається <strong>лише<\/strong> тоді, коли <code>$value &gt; $limit<\/code>. Для <code>30<\/code> жодного винятку не здіймається, і тіло циклу доходить до свого <code>say<\/code>, виводячи, що значення в межах межі. Для <code>99<\/code> та <code>60<\/code> спрацьовує <code>throw<\/code>, тож цей <code>say<\/code> пропускається, і натомість справу бере <code>CATCH<\/code>. Тіло <code>for<\/code> саме є тим блоком, який охороняє <code>CATCH<\/code>, тож перехоплений виняток завершує лише поточну ітерацію — далі цикл просто переходить до наступного значення.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Твърде голямо","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> прави класа хвърляемо изключение. Той носи две парчета данни — <code>value<\/code> и <code>limit<\/code>, — а методът му <code>message<\/code> вплита и двете в съобщавания текст.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> повдига изключението, а <code>when TooBig<\/code> го съпоставя по тип. Обработващият прави повече от това да отпечата съобщението: той чете атрибута <code>limit<\/code> направо от прихванатия обект, за да даде полезна подсказка. Точно това е предимството на собственото изключение пред обикновения низ — обработващият получава структурирани данни, с които може да действа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изключението се хвърля <strong>само<\/strong> когато <code>$value &gt; $limit<\/code>. За <code>30<\/code> не се повдига изключение и тялото на цикъла стига до своя <code>say<\/code>, отпечатвайки, че стойността е в рамките на границата. За <code>99<\/code> и <code>60<\/code> <code>throw<\/code> се задейства, така че този <code>say<\/code> се прескача и вместо това го обработва <code>CATCH<\/code>. Самото тяло на <code>for<\/code> е блокът, който <code>CATCH<\/code> пази, така че прихванатото изключение прекратява само текущата итерация — а после цикълът просто продължава със следващата стойност.<\/span><\/li><\/ol>"]]}}}</script>
