<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/too-big","n":961,"k":"exercise","pv":"oop/custom-exceptions/exercises","nx":"oop/custom-exceptions/exercises/too-big/solution","tr":["oop","oop/custom-exceptions"],"L":{"en":{"t":"Exercise ’Too big‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Define a custom exception class <code>TooBig<\/code> that inherits from <code>Exception<\/code> and has two attributes, <code>value<\/code> and <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Its <code>message<\/code> method should return <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Then loop over the values <code>30<\/code>, <code>99<\/code>, and <code>60<\/code> with a limit of <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">For each value, throw a <code>TooBig<\/code> only when the value exceeds the limit, and use a <code>CATCH<\/code> phaser with <code>when TooBig<\/code> that prints the message <strong>and<\/strong>, on a second line, reads the exception’s <code>limit<\/code> attribute directly to print <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A value within the limit should simply report that it is fine.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This shows that the exception is raised only for the failing numbers; the others pass straight through, and the loop keeps going either way.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><s ion/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Demasiado grande","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Define una clase de excepción personalizada <code>TooBig<\/code> que herede de <code>Exception<\/code> y tenga dos atributos, <code>value<\/code> y <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Su método <code>message<\/code> debe devolver <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Después recorre los valores <code>30<\/code>, <code>99<\/code> y <code>60<\/code> con un límite de <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para cada valor lanza una <code>TooBig<\/code> solo cuando el valor supere el límite, y usa un phaser <code>CATCH<\/code> con <code>when TooBig<\/code> que imprima el mensaje <strong>y<\/strong>, en una segunda línea, lea directamente el atributo <code>limit<\/code> de la excepción para imprimir <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un valor dentro del límite debe limitarse a informar de que está bien.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto muestra que la excepción se lanza solo para los números que fallan; los demás pasan de largo, y el bucle sigue en ambos casos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Troppo grande","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Definisci una classe di eccezione personalizzata <code>TooBig<\/code> che eredita da <code>Exception<\/code> e ha due attributi, <code>value<\/code> e <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il suo metodo <code>message<\/code> deve restituire <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Poi scorri i valori <code>30<\/code>, <code>99<\/code> e <code>60<\/code> con un limite di <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per ogni valore solleva una <code>TooBig<\/code> solo quando il valore supera il limite, e usa un phaser <code>CATCH<\/code> con <code>when TooBig<\/code> che stampa il messaggio <strong>e<\/strong>, su una seconda riga, legge direttamente l'attributo <code>limit<\/code> dell'eccezione per stampare <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un valore entro il limite deve semplicemente riferire che va bene.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo mostra che l'eccezione viene sollevata solo per i numeri che falliscono; gli altri passano dritti, e in entrambi i casi il ciclo prosegue.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Pārāk liels","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Definējiet paša izņēmuma klasi <code>TooBig<\/code>, kas manto no <code>Exception<\/code> un kam ir divi atribūti <code>value<\/code> un <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās metodei <code>message<\/code> jāatgriež <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc tam palaidiet ciklu pāri vērtībām <code>30<\/code>, <code>99<\/code> un <code>60<\/code> ar robežu <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katrai vērtībai izmetiet <code>TooBig<\/code> tikai tad, kad vērtība pārsniedz robežu, un izmantojiet fāzeri <code>CATCH<\/code> ar <code>when TooBig<\/code>, kas izdrukā paziņojumu <strong>un<\/strong> otrā rindā nolasa izņēmuma atribūtu <code>limit<\/code> tieši, lai izdrukātu <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vērtībai robežas ietvaros vienkārši jāziņo, ka viss ir kārtībā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas parāda, ka izņēmums tiek celts tikai neveiksmīgajiem skaitļiem; pārējie iziet cauri bez traucējumiem, un cikls jebkurā gadījumā turpinās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Слишком большое","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Определите собственный класс исключения <code>TooBig<\/code>, наследующий от <code>Exception<\/code> и имеющий два атрибута: <code>value<\/code> и <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Его метод <code>message<\/code> должен возвращать <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Затем пройдите циклом по значениям <code>30<\/code>, <code>99<\/code> и <code>60<\/code> при пределе <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для каждого значения бросайте <code>TooBig<\/code>, только когда значение превышает предел, и возьмите фазер <code>CATCH<\/code> с ветвью <code>when TooBig<\/code>, который печатает сообщение <strong>и<\/strong> второй строкой, читая атрибут <code>limit<\/code> исключения напрямую, печатает <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Для значения в пределах нормы должно просто сообщаться, что всё в порядке.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это показывает, что исключение возбуждается только для сбойных чисел; остальные проходят насквозь, а цикл в любом случае продолжается.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Завелике»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Визначте власний клас винятку <code>TooBig<\/code>, який успадковує від <code>Exception<\/code> і має два атрибути, <code>value<\/code> та <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Його метод <code>message<\/code> має повертати <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потім пройдіть циклом значення <code>30<\/code>, <code>99<\/code> та <code>60<\/code> з межею <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для кожного значення кидайте <code>TooBig<\/code> лише тоді, коли значення перевищує межу, і скористайтеся фазером <code>CATCH<\/code> із <code>when TooBig<\/code>, який виводить повідомлення <strong>і<\/strong>, другим рядком, читає атрибут <code>limit<\/code> винятку безпосередньо, щоб вивести <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Значення в межах межі має просто повідомити, що з ним усе гаразд.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це показує, що виняток здіймається лише для невдалих чисел; решта проходить наскрізь, і цикл триває в обох випадках.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Твърде голямо“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте собствен клас изключение <code>TooBig<\/code>, който наследява <code>Exception<\/code> и има два атрибута — <code>value<\/code> и <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Методът му <code>message<\/code> трябва да връща <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">След
