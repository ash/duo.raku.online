<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/negative-error","n":963,"k":"exercise","pv":"oop/custom-exceptions/exercises/too-big/solution","nx":"oop/custom-exceptions/exercises/negative-error/solution","tr":["oop","oop/custom-exceptions"],"L":{"en":{"t":"Exercise ’A negative error‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Define a custom exception class <code>Negative<\/code> that inherits from <code>Exception<\/code>, has an attribute <code>n<\/code>, and whose <code>message<\/code> method returns <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Write a subroutine <code>check($n)<\/code> that throws a <code>Negative<\/code> (carrying that <code>n<\/code>) when its argument is below zero, and otherwise returns the argument.<\/span> <span class=\"sg\" data-s=\"1\">Then, in a block, call <code>check(-5)<\/code> and use a <code>CATCH<\/code> phaser with <code>when Negative<\/code> to print the exception’s message.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Finally, after the block, throw another <code>Negative<\/code> (with <code>n<\/code> <code>-10<\/code>) to show that an exception thrown where no <code>CATCH<\/code> guards it ends the program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Ein Fehler bei negativen Zahlen‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definieren Sie eine eigene Ausnahmeklasse <code>Negative<\/code>, die von <code>Exception<\/code> erbt, ein Attribut <code>n<\/code> hat und deren Methode <code>message<\/code> <code>&lt;n&gt; is negative<\/code> liefert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie eine Subroutine <code>check($n)<\/code>, die eine <code>Negative<\/code> wirft (mit diesem <code>n<\/code>), wenn ihr Argument kleiner als null ist, und andernfalls das Argument liefert.<\/span> <span class=\"sg\" data-s=\"1\">Rufen Sie dann in einem Block <code>check(-5)<\/code> auf und verwenden Sie einen <code>CATCH<\/code>-Phaser mit <code>when Negative<\/code>, um die Meldung der Ausnahme auszugeben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Werfen Sie schließlich nach dem Block eine weitere <code>Negative<\/code> (mit <code>n<\/code> gleich <code>-10<\/code>), um zu zeigen, dass eine Ausnahme, die dort geworfen wird, wo kein <code>CATCH<\/code> sie bewacht, das Programm beendet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Een negatieve fout‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definieer een eigen exceptieklasse <code>Negative<\/code> die van <code>Exception<\/code> erft, een attribuut <code>n<\/code> heeft en waarvan de methode <code>message<\/code> <code>&lt;n&gt; is negative<\/code> teruggeeft.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Schrijf een subroutine <code>check($n)<\/code> die een <code>Negative<\/code> werpt (met die <code>n<\/code> erin) wanneer haar argument onder nul ligt, en anders het argument teruggeeft.<\/span> <span class=\"sg\" data-s=\"1\">Roep daarna, in een blok, <code>check(-5)<\/code> aan en gebruik een <code>CATCH<\/code>-faser met <code>when Negative<\/code> om de melding van de exceptie af te drukken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Werp ten slotte, na het blok, nog een <code>Negative<\/code> (met <code>n<\/code> gelijk aan <code>-10<\/code>) om te laten zien dat een exceptie die geworpen wordt waar geen <code>CATCH<\/code> haar bewaakt het programma beëindigt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Un error de número negativo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Define una clase de excepción personalizada <code>Negative<\/code> que herede de <code>Exception<\/code>, tenga un atributo <code>n<\/code> y cuyo método <code>message<\/code> devuelva <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Escribe una subrutina <code>check($n)<\/code> que lance una <code>Negative<\/code> (llevando esa <code>n<\/code>) cuando su argumento sea menor que cero, y que en caso contrario devuelva el argumento.<\/span> <span class=\"sg\" data-s=\"1\">Después, dentro de un bloque, llama a <code>check(-5)<\/code> y usa un phaser <code>CATCH<\/code> con <code>when Negative<\/code> para imprimir el mensaje de la excepción.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por último, después del bloque, lanza otra <code>Negative<\/code> (con <code>n<\/code> igual a <code>-10<\/code>) para mostrar que una excepción lanzada donde ningún <code>CATCH<\/code> la vigila termina el programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Un errore per i numeri negativi","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definisci una classe di eccezione personalizzata <code>Negative<\/code> che eredita da <code>Exception<\/code>, ha un attributo <code>n<\/code> e il cui metodo <code>message<\/code> restituisce <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scrivi una subroutine <code>check($n)<\/code> che solleva una <code>Negative<\/code> (che porta con sé quell'<code>n<\/code>) quando il suo argomento è minore di zero, e altrimenti restituisce l'argomento.<\/span> <span class=\"sg\" data-s=\"1\">Poi, dentro un blocco, chiama <code>check(-5)<\/code> e usa un phaser <code>CATCH<\/code> con <code>when Negative<\/code> per stampare il messaggio dell'eccezione.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Infine, dopo il blocco, solleva un'altra <code>Negative<\/code> (con <code>n<\/code> uguale a <code>-10<\/code>) per mostrare che un'eccezione sollevata dove nessun <code>CATCH<\/code> la sorveglia chiude il programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Negatīva skaitļa kļūda","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definējiet paša izņēmuma klasi <code>Negative<\/code>, kas manto no <code>Exception<\/code>, kam ir atribūts <code>n<\/code> un kuras metode <code>message<\/code> atgriež <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet apakšprogrammu <code>check($n)<\/code>, kas izmet <code>Negative<\/code> (nesot līdzi šo <code>n<\/code>), kad tās arguments ir zem nulles, un citādi atgriež argumentu.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam blokā izsauciet <code>check(-5)<\/code> un izmantojiet fāzeri <code>CATCH<\/code> ar <code>when Negative<\/code>, lai izdrukātu izņēmuma paziņojumu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visbeidzot aiz bloka izmetiet vēl vienu <code>Negative<\/code> (ar <code>n<\/code> vērtību <code>-10<\/code>), lai parādītu, ka izņēmums, kas izmests tur, kur to nesargā neviens <code>CATCH<\/code>, beidz programmu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Ошибка отрицательного числа","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Определите собственный класс исключения <code>Negative<\/code>, наследующий от <code>Exception<\/code>, с атрибутом <code>n<\/code> и методом <code>message<\/code>, возвращающим <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишите подпрограмму <code>check($n)<\/code>, которая бросает <code>Negative<\/code> (несущий это <code>n<\/code>), когда её аргумент меньше нуля, и в остальных случаях возвращает аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Затем в блоке вызовите <code>check(-5)<\/code> и с помощью фазера <code>CATCH<\/code> с ветвью <code>when Negative<\/code> напечатайте сообщение исключения.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наконец, после блока бросьте ещё один <code>Negative<\/code> (с <code>n<\/code>, равным <code>-10<\/code>), чтобы показать: если исключение брошено там, где его не охраняет <code>CATCH<\/code>, программа завершается.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Помилка від'ємного числа»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Визначте власний клас винятку <code>Negative<\/code>, який успадковує від <code>Exception<\/code>, має атрибут <code>n<\/code>, а його метод <code>message<\/code> повертає <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишіть підпрограму <code>check($n)<\/code>, яка кидає <code>Negative<\/code> (несучи це <code>n<\/code>), коли її аргумент менший за нуль, і повертає аргумент в іншому разі.<\/span> <span class=\"sg\" data-s=\"1\">Потім у блоці викличте <code>check(-5)<\/code> і скористайтеся фазером <code>CATCH<\/code> із <code>when Negative<\/code>, щоб вивести повідомлення винятку.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нарешті, після блоку киньте ще один <code>Negative<\/code> (з <code>n<\/code>, рівним <code>-10<\/code>), щоб показати: виняток, кинутий там, де його не охороняє жоден <code>CATCH<\/code>, завершує програму.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Грешка при отрицателно число“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте собствен клас изключение <code>Negative<\/code>, който наследява <code>Exception<\/code>, има атрибут <code>n<\/code> и чийто метод <code>message<\/code> връща <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>check($n)<\/code>, която хвърля <code>Negative<\/code> (носещ това <code>n<\/code>), когато аргументът ѝ е под нулата, а иначе връща аргумента.<\/span> <span class=\"sg\" data-s=\"1\">След това в блок извикайте <code>check(-5)<\/code> и използвайте фазер <code>CATCH<\/code> с <code>when Negative<\/code>, за да отпечатате съобщението на изключението.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Накрая, след блока, хвърлете още един <code>Negative<\/code> (с <code>n<\/code> равно на <code>-10<\/code>), за да покажете, че изключение, хвърлено там, където никакъв <code>CATCH<\/code> не го пази, приключва програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
