<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/negative-error/solution","n":964,"k":"solution","pv":"oop/custom-exceptions/exercises/negative-error","nx":"oop/custom-exceptions/exercises/two-exceptions","tr":["oop","oop/custom-exceptions"],"L":{"en":{"t":"The solution of ’A negative error‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> makes the class throwable, and its <code>message<\/code> method uses the <code>n<\/code> attribute to build the text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> validates its input and throws the custom exception for a negative number. The exception travels out of <code>check<\/code> to the <code>CATCH<\/code> in the calling block, where <code>when Negative<\/code> matches it by type and prints the message. Validating input and signalling bad values with a typed exception is a very common, real use of custom exceptions.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>{ … }<\/code> around the call is there because a <code>CATCH<\/code> phaser handles the exceptions thrown in <strong>its own enclosing block<\/strong>. The block groups the risky <code>check(-5)<\/code> together with the <code>CATCH<\/code> that guards it, so the thrown exception is caught right here, and execution resumes just after the block. Without wrapping them in a block, the <code>CATCH<\/code> would guard the whole program instead — and once it caught the exception the program would simply end, with no natural place to carry on.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The final <code>Negative.new(n =&gt; -10).throw<\/code> shows the other side of this. It sits <strong>outside<\/strong> the block, so nothing catches it: the exception propagates all the way to the top, and the program dies, printing the message and a backtrace to standard error and exiting with a non-zero status. That is the default fate of any exception you do not catch — and exactly why the first throw needed a <code>CATCH<\/code> to survive.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein Fehler bei negativen Zahlen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https ong> des Blocks, nichts fängt es also: Die Ausnahme pflanzt sich bis ganz nach oben fort, und das Programm stirbt, gibt die Meldung samt Rückverfolgung auf der Standardfehlerausgabe aus und endet mit einem Status ungleich null. Das ist das Standardschicksal jeder Ausnahme, die Sie nicht fangen — und genau der Grund, warum der erste Wurf ein <code>CATCH<\/code> brauchte, um zu überleben.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een negatieve fout","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> maakt de klasse werpbaar, en haar methode <code>message<\/code> gebruikt het attribuut <code>n<\/code> om de tekst op te bouwen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> valideert haar invoer en werpt de eigen exceptie voor een negatief getal. De exceptie reist uit <code>check<\/code> {\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> hace lanzable la clase, y su método <code>message<\/code> usa el atributo <code>n<\/code> para construir el texto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> valida su entrada y lanza la excepción personalizada para un número negativo. La excepción sale de <code>check<\/code> y llega al <code>CATCH<\/code> del bloque que llama, donde <code>when Negative<\/code> la empareja por tipo e imprime el mensaje. Validar la entrada y señalar los valores erróneos con una excepción tipada es un uso muy común y real de las excepciones personalizadas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las <code>{ … }<\/code> alrededor de la llamada están ahí porque un phaser <code>CATCH<\/code> maneja las excepciones lanzadas en <strong>su propio bloque contenedor<\/strong>. El bloque agrupa el arriesgado <code>check(-5)<\/code> junto con el <code>CATCH<\/code> que lo vigila, de modo que la excepción lanzada se captura justo aquí y la ejecución se reanuda inmediatamente después del bloque. Sin envolverlos en un bloque, el <code>CATCH<\/code> vigilaría el programa entero, y una vez capturada la excepción el programa simplemente terminaría, sin ningún punto natural en el que seguir.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>Negative.new(n =&gt; -10).throw<\/code> final muestra la otra cara. Está <strong>fuera<\/strong> del bloque, así que nada lo captura: la excepción se propaga hasta arriba del todo y el programa muere, imprimiendo el mensaje y una traza en el error estándar y saliendo con un estado distinto de cero. Ese es el destino por omisión de cualquier excepción que no captures, y exactamente el motivo por el que el primer lanzamiento necesitaba un <code>CATCH<\/code> para sobrevivir.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un errore per i numeri negativi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> rende la classe sollevabile, e il suo metodo <code>message<\/code> usa l'attributo <code>n<\/code> per costruire il testo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> valida il proprio input e solleva l'eccezione personalizzata per un numero negativo. L'eccezione esce da <code>check<\/code> e arriva al <code>CATCH<\/code> nel blocco chiamante, dove <code>when Negative<\/code> la riconosce dal tipo e ne stampa il messaggio. Validare l'input e segnalare i valori sbagliati con un'eccezione tipizzata è un uso molto comune e concreto delle eccezioni personalizzate.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le <code>{ … }<\/code> attorno alla chiamata ci sono perché un phaser <code>CATCH<\/code> gestisce le eccezioni sollevate nel <strong>proprio blocco contenitore<\/strong>. Il blocco raggruppa il rischioso <code>check(-5)<\/code> insieme al <code>CATCH<\/code> che lo sorveglia, così l'eccezione sollevata viene intercettata proprio qui e l'esecuzione riprende subito dopo il blocco. Senza avvolgerli in un blocco, il <code>CATCH<\/code> sorveglierebbe l'intero programma — e una volta intercettata l'eccezione il programma finirebbe semplicemente, senza alcun punto naturale in cui proseguire.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il conclusivo <code>Negative.new(n =&gt; -10).throw<\/code> mostra l'altra faccia della cosa. Sta <strong>fuori<\/strong> dal blocco, quindi nessuno lo intercetta: l'eccezione si propaga fino in cima e il programma muore, stampando il messaggio e una traccia sull'errore standard e uscendo con uno stato diverso da zero. È questo il destino predefinito di qualunque eccezione non intercettata — ed è esattamente il motivo per cui il primo lancio aveva bisogno di un <code>CATCH<\/code> per sopravvivere.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Negatīva skaitļa kļūda","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> padara klasi izmetamu, un tās metode <code>message<\/code> izmanto atribūtu <code>n<\/code>, lai uzbūvētu tekstu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> pārbauda savu ievadi un negatīvam skaitlim izmet paša definēto izņēmumu. Izņēmums izceļo no <code>check<\/code> līdz <code>CATCH<\/code> izsaucošajā blokā, kur <code>when Negative<\/code> tam atbilst pēc tipa un izdrukā paziņojumu. Ievades pārbaude un sliktu vērtību signalizēšana ar tipizētu izņēmumu ir ļoti izplatīts, īsts paša definētu izņēmumu lietojums.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>{ … }<\/code> ap izsaukumu ir tur tāpēc, ka fāzeris <code>CATCH<\/code> apstrādā izņēmumus, kas izmesti <strong>tā paša apņemošajā blokā<\/strong>. Bloks sagrupē riskanto <code>check(-5)<\/code> kopā ar <code>CATCH<\/code>, kas to sargā, tāpēc izmestais izņēmums tiek noķerts turpat, un izpilde atsākas tūlīt aiz bloka. Neietinot tos blokā, <code>CATCH<\/code> sargātu visu programmu — un, tiklīdz tas izņēmumu noķertu, programma vienkārši beigtos, bez dabiskas vietas, kur turpināt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nobeiguma <code>Negative.new(n =&gt; -10).throw<\/code> parāda otru šīs medaļas pusi. Tas atrodas <strong>ārpus<\/strong> bloka, tāpēc to nenoķer nekas: izņēmums izplatās līdz pašai augšai, un programma mirst, izdrukājot paziņojumu un izsaukumu atskaiti standarta kļūdu plūsmā un izejot ar nenulles statusu. Tāds ir noklusētais liktenis jebkuram izņēmumam, ko nenoķerat, — un tieši tāpēc pirmajam izmetienam bija vajadzīgs <code>CATCH<\/code>, lai izdzīvotu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Ошибка отрицательного числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> делает класс бросаемым, а его метод <code>message<\/code> строит текст на основе атрибута <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> проверяет свой ввод и бросает собственное исключение для отрицательного числа. Исключение выходит из <code>check<\/code> к <code>CATCH<\/code> в вызывающем блоке, где <code>when Negative<\/code> сопоставляет его по типу и печатает сообщение. Проверка ввода и сигнализация о плохих значениях типизированным исключением — очень частое, вполне реальное применение собственных исключений.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Скобки <code>{ … }<\/code> вокруг вызова нужны потому, что фазер <code>CATCH<\/code> обрабатывает исключения, брошенные в <strong>своём собственном объемлющем блоке<\/strong>. Блок объединяет рискованный <code>check(-5)<\/code> и охраняющий его <code>CATCH<\/code>, поэтому брошенное исключение перехватывается прямо здесь, а выполнение возобновляется сразу после блока. Без такой обёртки <code>CATCH<\/code> охранял бы всю программу — и, раз перехватив исключение, программа просто закончилась бы, потому что продолжать было бы неоткуда.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Заключительный <code>Negative.new(n =&gt; -10).throw<\/code> показывает обратную сторону. Он стоит <strong>вне<\/strong> блока, поэтому его никто не перехватывает: исключение поднимается до самого верха, и программа умирает, напечатав сообщение и трассировку в стандартный поток ошибок и завершившись с ненулевым кодом. Такова участь по умолчанию для любого неперехваченного исключения — и ровно поэтому первому броску понадобился <code>CATCH<\/code>, чтобы программа уцелела.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Помилка від'ємного числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> робить клас придатним для кидання, а його метод <code>message<\/code> використовує атрибут <code>n<\/code>, щоб побудувати текст.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> перевіряє свій ввід і кидає власний виняток для від'ємного числа. Виняток мандрує з <code>check<\/code> до <code>CATCH<\/code> у блоці, що викликав, де <code>when Negative<\/code> зіставляється з ним за типом і виводить повідомлення. Перевірка вводу й сигналізування про погані значення типізованим винятком є дуже поширеним, справжнім застосуванням власних винятків.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дужки <code>{ … }<\/code> навколо виклику потрібні тому, що фазер <code>CATCH<\/code> обробляє винятки, кинуті в <strong>його власному обгортальному блоці<\/strong>. Блок групує ризикований <code>check(-5)<\/code> разом із <code>CATCH<\/code>, який його охороняє, тож кинутий виняток перехоплюється саме тут, і виконання відновлюється одразу після блоку. Без загортання їх у блок <code>CATCH<\/code> охороняв би натомість усю програму — і, перехопивши виняток, програма просто завершилася б, не маючи природного місця, щоб продовжити.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Останній <code>Negative.new(n =&gt; -10).throw<\/code> показує зворотний бік. Він стоїть <strong>поза<\/strong> блоком, тож його ніхто не перехоплює: виняток поширюється аж до верху, і програма гине, виводячи повідомлення й трасування стека до стандартного потоку помилок і завершуючись із ненульовим статусом. Така типова доля будь-якого неперехопленого винятку — і саме тому першому киданню потрібен був <code>CATCH<\/code>, щоб вижити.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Грешка при отрицателно число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> прави класа хвърляем, а методът му <code>message<\/code> използва атрибута <code>n<\/code>, за да изгради текста.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> проверява входа си и хвърля собственото изключение за отрицателно число. Изключението излиза от <code>check<\/code> до <code>CATCH<\/code> в извикващия блок, където <code>when Negative<\/code> го съпоставя по тип и отпечатва съобщението. Проверката на входа и сигнализирането за лоши стойности с типизирано изключение е много честа, реална употреба на собствените изключения.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Скобите <code>{ … }<\/code> около извикването са там, защото фазерът <code>CATCH<\/code> обработва изключенията, хвърлени в <strong>собствения му обхващащ блок<\/strong>. Блокът групира рискованото <code>check(-5)<\/code> заедно с <code>CATCH<\/code>, който го пази, така че хвърленото изключение се прихваща точно тук, а изпълнението продължава веднага след блока. Без да ги обвием в блок, <code>CATCH<\/code> би пазил цялата програма — и щом прихване изключението, програмата просто би приключила, без естествено място, откъдето да продължи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последното <code>Negative.new(n =&gt; -10).throw<\/code> показва другата страна на това. То стои <strong>извън<\/strong> блока, така че нищо не го прихваща: изключението се разпространява чак до върха и програмата умира, отпечатвайки съобщението и обратната следа в стандартната грешка и излизайки с ненулев статус. Това е съдбата по подразбиране на всяко изключение, което не прихванете — и точно затова първото хвърляне се нуждаеше от <code>CATCH<\/code>, за да оцелее.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Eraro pri negativa nombro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> faras la klason ĵetebla, kaj ĝia metodo <code>message<\/code> uzas la atributon <code>n<\/code> por konstrui la tekston.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> validigas sian enigon kaj ĵetas la propran escepton por negativa nombro. La escepto vojaĝas el <code>check<\/code> al la <code>CATCH<\/code> en la vokanta bloko, kie <code>when Negative<\/code> kongruas kun ĝi laŭ tipo kaj presas la mesaĝon. Validigi enigon kaj signali malbonajn valorojn per tipita escepto estas tre ofta, vera uzo de propraj esceptoj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>{ … }<\/code> ĉirkaŭ la voko estas tie, ĉar fazero <code>CATCH<\/code> traktas la esceptojn ĵetitajn en <strong>sia propra ĉirkaŭa bloko<\/strong>. La bloko grupigas la riskan <code>check(-5)<\/code> kune kun la <code>CATCH<\/code>, kiu gardas ĝin, do la ĵetita escepto estas kaptata ĝuste ĉi tie, kaj la ekzekuto rekomenciĝas tuj post la bloko. Sen envolvi ilin en blokon, la <code>CATCH<\/code> gardus la tutan programon anstataŭe — kaj post kiam ĝi kaptus la escepton, la programo simple finiĝus, kun neniu natura loko por daŭrigi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La fina <code>Negative.new(n =&gt; -10).throw<\/code> montras la alian flankon de tio. Ĝi sidas <strong>ekster<\/strong> la bloko, do nenio kaptas ĝin: la escepto disvastiĝas ĝis la supro, kaj la programo mortas, presante la mesaĝon kaj retrospuron al norma erarfluo kaj elirante kun ne-nula statuso. Jen la defaŭlta sorto de ĉiu escepto, kiun vi ne kaptas — kaj ĝuste kial la unua ĵeto bezonis <code>CATCH<\/code> por postvivi.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Error numeri negativi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> classem iaciendam reddit, et methodus eius <code>message<\/code> attributo <code>n<\/code> utitur ad textum aedificandum.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> introitum suum probat et exceptionem propriam pro numero negativo iacit. Exceptio ex <code>check<\/code> ad <code>CATCH<\/code> in clausula vocante migrat, ubi <code>when Negative<\/code> ei genere convenit nuntiumque imprimit. Introitum probare et valores malos exceptione generis notati significare est usus verus et frequentissimus exceptionum propriarum.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>{ … }<\/code> circa vocationem adest quia fasis <code>CATCH<\/code> exceptiones tractat quae in <strong>propria clausula ambiente<\/strong> iaciuntur. Clausula periculosum <code>check(-5)<\/code> una cum <code>CATCH<\/code> quae illud custodit congregat, itaque exceptio iacta hic ipso loco capitur, et exsecutio statim post clausulam resumit. Nisi ea in clausulam involuta essent, <code>CATCH<\/code> totum programma custodiret — et, postquam exceptionem cepisset, programma simpliciter finiret, nullo loco naturali ubi pergeret.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ultimum <code>Negative.new(n =&gt; -10).throw<\/code> alteram huius rei partem ostendit. <strong>Extra<\/strong> clausulam sedet, itaque nihil illud capit: exceptio usque ad summum propagatur, et programma moritur, nuntium et vestigium ad errorem vulgarem imprimens et cum statu non nullo exiens. Ea est sors praedefinita cuiuslibet exceptionis quam non capis — et exacte ratio cur primus iactus <code>CATCH<\/code> egeret ut superesset.<\/span><\/li><\/ol>"]]}}}</script>
