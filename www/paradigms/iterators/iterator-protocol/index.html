<script type="application/json" id="page-data">{"u":"paradigms/iterators/iterator-protocol","n":1245,"k":"topic","pv":"paradigms/iterators","nx":"paradigms/iterators/iterator-protocol/quiz","tr":["paradigms","paradigms/iterators"],"L":{"en":{"t":"The iterator protocol","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every value you can loop over — a list, a range, an array — can hand you an <em>iterator<\/em> with the <code>.iterator<\/code> method.<\/span> <span class=\"sg\" data-s=\"1\">An iterator has one essential method, <code>pull-one<\/code>, which returns the next value each time you call it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When the values run out, <code>pull-one<\/code> returns a special sentinel, <code>IterationEnd<\/code>, instead of a real element.<\/span> <span class=\"sg\" data-s=\"1\">Asking the same <code>$it<\/code> for one more value shows it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>=:=<\/code> operator tests for the <strong>same object<\/strong>, which is how you recognise the sentinel.<\/span> <span class=\"sg\" data-s=\"1\">That detail matters inside a loop, where you need to keep the pulled value <em>and<\/em> test it.<\/span> <span class=\"sg\" data-s=\"2\">If you <strong>assign<\/strong> it with <code>=<\/code>, the value lands in a container and the comparison ends up looking at the container rather than at <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The remedy is to <strong>bind<\/strong> with <code>:=<\/code>, so the variable simply <em>is<\/em> whatever <code>pull-one<\/code> returned:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # bind, not assign\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The loop prints <code>a<\/code>, <code>b<\/code>, <code>c<\/code> and then stops.<\/span> <span class=\"sg\" data-s=\"1\">This is exactly what a <code>for<\/code> loop does for you under the hood: it calls <code>.iterator<\/code> on the thing you are looping over and keeps calling <code>pull-one<\/code> until it meets <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You rarely need to write it out by hand, but doing so once shows that iterators — not lists — are what Raku actually loops over.<\/span><\/p>"]]},"de":{"t":"Das Iteratorprotokoll","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Wert, über den Sie laufen können — eine Liste, ein Bereich, ein Array —, kann Ihnen mit der Methode <code>.iterator<\/code> einen <em>Iterator<\/em> überreichen.<\/span> <span class=\"sg\" data-s=\"1\">Ein Iterator hat eine wesentliche Methode, <code>pull-one<\/code>, die bei jedem Aufruf den nächsten Wert liefert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gehen die Werte aus, liefert <code>pull-one<\/code> statt eines echten Elements einen besonderen Wächter, <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dieselbe <code>$it<\/code> um einen weiteren Wert zu bitten zeigt ihn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der Operator <code>=:=<\/code> prüft auf <strong>dasselbe Objekt<\/strong>, und so erkennen Sie den Wächter.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Detail ist innerhalb einer Schleife wichtig, wo Sie den geholten Wert behalten <em>und<\/em> prüfen müssen.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie ihn mit <code>=<\/code> <strong>zuweisen<\/strong>, landet der Wert in einem Container, und der Vergleich betrachtet am Ende den Container statt <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die Abhilfe ist, mit <code>:=<\/code> zu <strong>binden<\/strong>, sodass die Variable schlicht das <em>ist<\/em>, was <code>pull-one<\/code> geliefert hat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # bind, not assign\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Schleife gibt <code>a<\/code>, <code>b<\/code>, <code>c<\/code> aus und hält dann an.<\/span> <span class=\"sg\" data-s=\"1\">Genau das tut eine <code>for<\/code>-Schleife unter der Haube für Sie: Sie ruft <code>.iterator<\/code> auf dem Ding auf, über das Sie laufen, und ruft weiter <code>pull-one<\/code> auf, bis sie <code>IterationEnd<\/code> antrifft.<\/span> <span class=\"sg\" data-s=\"2\">Sie müssen das selten von Hand ausschreiben, doch es einmal zu tun zeigt, dass Raku in Wahrheit über Iteratoren läuft und nicht über Listen.<\/span><\/p>"]]},"nl":{"t":"Het iteratorprotocol","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke waarde waar je overheen kunt lussen — een lijst, een bereik, een array — kan je met de methode <code>.iterator<\/code> een <em>iterator<\/em> overhandigen.<\/span> <span class=\"sg\" data-s=\"1\">Een iterator heeft één essentiële methode, <code>pull-one<\/code>, die telkens wanneer je haar aanroept de volgende waarde teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer de waarden op zijn, geeft <code>pull-one<\/code> een bijzondere schildwacht terug, <code>IterationEnd<\/code>, in plaats van een echt element.<\/span> <span class=\"sg\" data-s=\"1\">Dezelfde <code>$it<\/code> om nog één waarde vragen laat dat zien:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De operator <code>=:=<\/code> test op <strong>hetzelfde object<\/strong>, en zo herken je de schildwacht.<\/span> <span class=\"sg\" data-s=\"1\">Dat detail doet ertoe binnen een lus, waar je de opgehaalde waarde moet bewaren <em>én<\/em> testen.<\/span> <span class=\"sg\" data-s=\"2\">Als je haar met <code>=<\/code> <strong>toekent<\/strong>, belandt de waarde in een container en kijkt de vergelijking naar de container in plaats van naar <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De remedie is <strong>binden<\/strong> met <code>:=<\/code>, zodat de variabele eenvoudigweg <em>is<\/em> wat <code>pull-one<\/code> teruggaf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # bind, not assign\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De lus drukt <code>a<\/code>, <code>b<\/code>, <code>c<\/code> af en stopt daarna.<\/span> <span class=\"sg\" data-s=\"1\">Precies dat doet een <code>for<\/code>-lus onder de motorkap voor je: hij roept <code>.iterator<\/code> aan op het ding waar je overheen lust en blijft <code>pull-one<\/code> aanroepen tot hij <code>IterationEnd<\/code> tegenkomt.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft het zelden met de hand uit te schrijven, maar het één keer doen laat zien dat Raku eigenlijk over iterators lust en niet over lijsten.<\/span><\/p>"]]},"es":{"t":"El protocolo de iterador","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Todo valor sobre el que puedes iterar — una lista, un rango, un array — puede darte un <em>iterador<\/em> con el método <code>.iterator<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un iterador tiene un método esencial, <code>pull-one<\/code>, que devuelve el valor siguiente cada vez que lo llamas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando los valores se agotan, <code>pull-one<\/code> devuelve un centinela especial, <code>IterationEnd<\/code>, en lugar de un elemento real.<\/span> <span class=\"sg\" data-s=\"1\">Pedir un valor más al mismo <code>$it<\/code> lo muestra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El operador <code>=:=<\/code> comprueba si se trata del <strong>mismo objeto<\/strong>, que es como se reconoce el centinela.<\/span> <span class=\"sg\" data-s=\"1\">Ese detalle importa dentro de un bucle, donde necesitas conservar el valor extraído <em>y<\/em> comprobarlo.<\/span> <span class=\"sg\" data-s=\"2\">Si lo <strong>asignas<\/strong> con <code>=<\/code>, el valor aterriza en un contenedor y la comparación acaba mirando el contenedor en lugar de <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El remedio es <strong>ligarlo<\/strong> con <code>:=<\/code>, de modo que la variable simplemente <em>sea<\/em> lo que devolvió <code>pull-one<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # bind, not assign\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El bucle imprime <code>a<\/code>, <code>b<\/code>, <code>c<\/code> y después se detiene.<\/span> <span class=\"sg\" data-s=\"1\">Esto es exactamente lo que hace por ti un bucle <code>for<\/code> entre bastidores: llama a <code>.iterator<\/code> sobre aquello que estás recorriendo y sigue llamando a <code>pull-one<\/code> hasta encontrar <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Rara vez necesitas escribirlo a mano, pero hacerlo una vez muestra que son los iteradores — y no las listas — lo que Raku recorre en realidad.<\/span><\/p>"]]},"it":{"t":"Il protocollo degli iteratori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni valore su cui puoi ciclare — un elenco, un intervallo, un array — può consegnarti un <em>iteratore<\/em> con il metodo <code>.iterator<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un iteratore ha un metodo essenziale, <code>pull-one<\/code>, che a ogni chiamata restituisce il valore successivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando i valori finiscono, <code>pull-one<\/code> restituisce una sentinella speciale, <code>IterationEnd<\/code>, invece di un elemento vero.<\/span> <span class=\"sg\" data-s=\"1\">Chiedere allo stesso <code>$it<\/code> un altro valore lo mostra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">L'operatore <code>=:=<\/code> mette alla prova l'identità dello <strong>stesso oggetto<\/strong>, ed è così che si riconosce la sentinella.<\/span> <span class=\"sg\" data-s=\"1\">Quel dettaglio conta dentro un ciclo, dove devi conservare il valore estratto <em>e<\/em> metterlo alla prova.<\/span> <span class=\"sg\" data-s=\"2\">Se lo <strong>assegni<\/strong> con <code>=<\/code>, il valore atterra in un contenitore e il confronto finisce per guardare il contenitore invece di <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il rimedio è <strong>legarlo<\/strong> con <code>:=<\/code>, così che la variabile semplicemente <em>sia<\/em> ciò che <code>pull-one<\/code> ha restituito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # bind, not assign\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il ciclo stampa <code>a<\/code>, <code>b<\/code>, <code>c<\/code> e poi si ferma.<\/span> <span class=\"sg\" data-s=\"1\">È esattamente ciò che un ciclo <code>for<\/code> fa per te sotto il cofano: chiama <code>.iterator<\/code> sulla cosa che stai ciclando e continua a chiamare <code>pull-one<\/code> finché non incontra <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raramente hai bisogno di scriverlo a mano, ma farlo una volta mostra che sono gli iteratori — non gli elenchi — ciò su cui Raku cicla davvero.<\/span><\/p>"]]},"ru":{"t":"Протокол итератора","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всякое значение, по которому можно пройти циклом — список, диапазон, массив, — может выдать вам <em>итератор<\/em> методом <code>.iterator<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У итератора есть один главный метод, <code>pull-one<\/code>, который при каждом вызове возвращает следующее значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда значения заканчиваются, <code>pull-one<\/code> возвращает не настоящий элемент, а особый маркер — <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Запрос ещё одного значения у того же <code>$it<\/code> это и показывает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>=:=<\/code> проверяет, что это <strong>тот же самый объект<\/strong>, — именно так маркер и распознают.<\/span> <span class=\"sg\" data-s=\"1\">Эта деталь важна внутри цикла, где нужно и сохранить вытянутое значение, и проверить его.<\/span> <span class=\"sg\" data-s=\"2\">Если <strong>присвоить<\/strong> его через <code>=<\/code>, значение попадёт в контейнер, и сравнение станет смотреть на контейнер, а не на <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Средство от этого — <strong>связать<\/strong> через <code>:=<\/code>, чтобы переменная попросту <em>и была<\/em> тем, что вернул <code>pull-one<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # связываем, а не присваиваем\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цикл печатает <code>a<\/code>, <code>b<\/code>, <code>c<\/code>, а затем останавливается.<\/span> <span class=\"sg\" data-s=\"1\">Ровно это цикл <code>for<\/code> и делает за вас под капотом: он вызывает <code>.iterator<\/code> у того, по чему вы идёте, и продолжает вызывать <code>pull-one<\/code>, пока не встретит <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Писать это вручную приходится редко, но, сделав так однажды, видишь: Raku на самом деле проходит циклом по итераторам, а не по спискам.<\/span><\/p>"]]},"uk":{"t":"Протокол ітератора","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожне значення, яке можна обійти циклом — список, діапазон, масив, — може вручити вам <em>ітератор<\/em> через метод <code>.iterator<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ітератор має один суттєвий метод, <code>pull-one<\/code>, що щоразу повертає наступне значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли значення вичерпуються, <code>pull-one<\/code> повертає замість справжнього елемента особливий вартовий об'єкт, <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Запит іще одного значення в того самого <code>$it<\/code> це показує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>=:=<\/code> перевіряє, чи це <strong>той самий об'єкт<\/strong>, і саме так розпізнають вартового.<\/span> <span class=\"sg\" data-s=\"1\">Ця деталь важлива всередині циклу, де вам потрібно і зберегти витягнуте значення, <em>і<\/em> перевірити його.<\/span> <span class=\"sg\" data-s=\"2\">Якщо ви <strong>присвоїте<\/strong> його через <code>=<\/code>, значення потрапить у контейнер, і порівняння дивитиметься на контейнер, а не на <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ліки — <strong>зв'язати<\/strong> через <code>:=<\/code>, щоб змінна просто <em>була<\/em> тим, що повернув <code>pull-one<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # зв'язування, а не присвоєння\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цикл друкує <code>a<\/code>, <code>b<\/code>, <code>c<\/code> і зупиняється.<\/span> <span class=\"sg\" data-s=\"1\">Саме це під капотом робить за вас цикл <code>for<\/code>: він викликає <code>.iterator<\/code> на тому, що ви обходите, і далі викликає <code>pull-one<\/code>, аж поки не зустріне <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вам рідко доводиться виписувати це вручну, але зробивши так одного разу, ви бачите, що Raku насправді обходить циклом ітератори, а не списки.<\/span><\/p>"]]},"bg":{"t":"Протоколът на итератора","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка стойност, която можете да обходите в цикъл — списък, диапазон, масив, — може да ви подаде <em>итератор<\/em> чрез метода <code>.iterator<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Итераторът има един съществен метод — <code>pull-one<\/code>, — който връща следващата стойност всеки път, когато го извикате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = (10, 20, 30).iterator;\nsay $it.pull-one; # 10\nsay $it.pull-one; # 20\nsay $it.pull-one; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато стойностите свършат, <code>pull-one<\/code> връща специален страж — <code>IterationEnd<\/code>, — вместо истински елемент.<\/span> <span class=\"sg\" data-s=\"1\">Заявката за още една стойност от същия <code>$it<\/code> го показва:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $it.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>=:=<\/code> проверява за <strong>същия обект<\/strong> и точно така разпознавате стража.<\/span> <span class=\"sg\" data-s=\"1\">Тази подробност има значение вътре в цикъл, където трябва и да запазите изтеглената стойност, <em>и<\/em> да я проверите.<\/span> <span class=\"sg\" data-s=\"2\">Ако я <strong>присвоите<\/strong> с <code>=<\/code>, стойността попада в контейнер и сравнението разглежда контейнера, а не <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Лекарството е да <strong>свържете<\/strong> с <code>:=<\/code>, така че променливата просто <em>да бъде<\/em> онова, което <code>pull-one<\/code> е върнал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $it = &lt;a b c&gt;.iterator;\nloop {\n    my $v := $it.pull-one;      # свързване, а не присвояване\n    last if $v =:= IterationEnd;\n    say $v;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цикълът отпечатва <code>a<\/code>, <code>b<\/code>, <code>c<\/code> и спира.<\/span> <span class=\"sg\" data-s=\"1\">Точно това прави цикълът <code>for<\/code> за вас под капака: той извиква <code>.iterator<\/code> върху онова, което обхождате, и продължава да вика <code>pull-one<\/code>, докато не срещне <code>IterationEnd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Рядко ви се налага да го изписвате на ръка, но щом го направите веднъж, се вижда, че Raku всъщност обхожда итератори, а не списъци.<\/span><\/p>"]]}}}</script>
