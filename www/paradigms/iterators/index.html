<script type="application/json" id="page-data">{"u":"paradigms/iterators","n":1244,"k":"section","pv":"paradigms/generators/exercises/gather-vowels/solution","nx":"paradigms/iterators/iterator-protocol","tr":["paradigms"],"L":{"en":{"t":"Iterators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The previous section built sequences with <code>gather<\/code> and <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This one goes one level down, to the mechanism that actually delivers the values: the <em>iterator<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">An iterator is the small object behind every list, range, and lazy sequence in Raku.<\/span> <span class=\"sg\" data-s=\"1\">It knows how to do one thing — produce the <strong>next<\/strong> value — and nothing more.<\/span> <span class=\"sg\" data-s=\"2\">Whenever you write a <code>for<\/code> loop or call <code>map<\/code>, Raku quietly asks an iterator for one value at a time until there are none left.<\/span> <span class=\"sg\" data-s=\"3\">This section shows that protocol directly: how to pull values from an iterator by hand, and how to write an iterator of your own.<\/span><\/p>"]]},"de":{"t":"Iteratoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der vorige Abschnitt hat Sequenzen mit <code>gather<\/code> und <code>take<\/code> gebaut.<\/span> <span class=\"sg\" data-s=\"1\">Dieser geht eine Ebene tiefer, zu dem Mechanismus, der die Werte tatsächlich liefert: dem <em>Iterator<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Iterator ist das kleine Objekt hinter jeder Liste, jedem Bereich und jeder trägen Sequenz in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Er kann eines — den <strong>nächsten<\/strong> Wert erzeugen — und sonst nichts.<\/span> <span class=\"sg\" data-s=\"2\">Wann immer Sie eine <code>for<\/code>-Schleife schreiben oder <code>map<\/code> aufrufen, bittet Raku im Stillen einen Iterator um einen Wert nach dem anderen, bis keiner mehr da ist.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt dieses Protokoll unmittelbar: wie Sie einem Iterator von Hand Werte entnehmen und wie Sie einen eigenen Iterator schreiben.<\/span><\/p>"]]},"nl":{"t":"Iterators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De vorige sectie bouwde reeksen met <code>gather<\/code> en <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deze gaat een niveau dieper, naar het mechanisme dat de waarden werkelijk aflevert: de <em>iterator<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een iterator is het kleine object achter elke lijst, elk bereik en elke luie reeks in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Hij weet één ding te doen — de <strong>volgende<\/strong> waarde produceren — en niets meer.<\/span> <span class=\"sg\" data-s=\"2\">Telkens wanneer je een <code>for<\/code>-lus schrijft of <code>map<\/code> aanroept, vraagt Raku stilletjes aan een iterator om één waarde tegelijk tot er geen meer zijn.<\/span> <span class=\"sg\" data-s=\"3\">Deze sectie toont dat protocol rechtstreeks: hoe je met de hand waarden uit een iterator haalt, en hoe je zelf een iterator schrijft.<\/span><\/p>"]]},"es":{"t":"Iteradores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La sección anterior construía secuencias con <code>gather<\/code> y <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esta baja un nivel, al mecanismo que en realidad entrega los valores: el <em>iterador<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un iterador es el pequeño objeto que hay detrás de toda lista, todo rango y toda secuencia perezosa de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Sabe hacer una sola cosa — producir el valor <strong>siguiente<\/strong> — y nada más.<\/span> <span class=\"sg\" data-s=\"2\">Siempre que escribes un bucle <code>for<\/code> o llamas a <code>map<\/code>, Raku va pidiendo calladamente a un iterador un valor cada vez, hasta que no quedan más.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra ese protocolo directamente: cómo extraer valores de un iterador a mano y cómo escribir un iterador propio.<\/span><\/p>"]]},"it":{"t":"Iteratori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La sezione precedente ha costruito sequenze con <code>gather<\/code> e <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa scende di un livello, al meccanismo che consegna davvero i valori: l'<em>iteratore<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un iteratore è il piccolo oggetto che sta dietro a ogni elenco, intervallo e sequenza pigra in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Sa fare una cosa sola — produrre il valore <strong>successivo<\/strong> — e nient'altro.<\/span> <span class=\"sg\" data-s=\"2\">Ogni volta che scrivi un ciclo <code>for<\/code> o chiami <code>map<\/code>, Raku chiede in silenzio a un iteratore un valore alla volta finché non ne restano più.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra quel protocollo direttamente: come estrarre valori da un iteratore a mano e come scrivere un iteratore tuo.<\/span><\/p>"]]},"ru":{"t":"Итераторы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Предыдущий раздел строил последовательности с помощью <code>gather<\/code> и <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Этот спускается на уровень ниже — к механизму, который на самом деле поставляет значения, к <em>итератору<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итератор — это маленький объект, стоящий за каждым списком, диапазоном и ленивой последовательностью в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Он умеет одно-единственное: выдать <strong>следующее<\/strong> значение, и больше ничего.<\/span> <span class=\"sg\" data-s=\"2\">Всякий раз, когда вы пишете цикл <code>for<\/code> или вызываете <code>map<\/code>, Raku незаметно просит у итератора по одному значению за раз, пока они не кончатся.<\/span> <span class=\"sg\" data-s=\"3\">В этом разделе этот протокол показан напрямую: как вытягивать значения из итератора вручную и как написать собственный итератор.<\/span><\/p>"]]},"uk":{"t":"Ітератори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Попередній розділ будував послідовності за допомогою <code>gather<\/code> та <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Цей спускається на рівень нижче — до механізму, що насправді видає значення: до <em>ітератора<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ітератор — це невеликий об'єкт, що стоїть за кожним списком, діапазоном та лінивою послідовністю в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Він уміє робити одну річ — видавати <strong>наступне<\/strong> значення — і більш нічого.<\/span> <span class=\"sg\" data-s=\"2\">Щоразу, коли ви пишете цикл <code>for<\/code> або викликаєте <code>map<\/code>, Raku тихенько просить в ітератора по одному значенню за раз, аж поки їх не залишиться.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує цей протокол безпосередньо: як витягати значення з ітератора вручну і як написати власний ітератор.<\/span><\/p>"]]},"bg":{"t":"Итератори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Предишният раздел строеше последователности с <code>gather<\/code> и <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този слиза едно ниво по-надолу — до механизма, който всъщност доставя стойностите: <em>итератора<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итераторът е малкият обект, който стои зад всеки списък, диапазон и мързелива последователност в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Той умее едно-единствено нещо — да произведе <strong>следващата<\/strong> стойност — и нищо повече.<\/span> <span class=\"sg\" data-s=\"2\">Всеки път, когато пишете цикъл <code>for<\/code> или извиквате <code>map<\/code>, Raku тихо иска от итератор по една стойност наведнъж, докато не свършат.<\/span> <span class=\"sg\" data-s=\"3\">Този раздел показва този протокол направо: как да теглите стойности от итератор на ръка и как да напишете свой собствен итератор.<\/span><\/p>"]]}}}</script>
