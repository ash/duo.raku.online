<script type="application/json" id="page-data">{"u":"paradigms/iterators/writing-an-iterator","n":1247,"k":"topic","pv":"paradigms/iterators/iterator-protocol/quiz","nx":"paradigms/iterators/exercises","tr":["paradigms","paradigms/iterators"],"L":{"en":{"t":"Writing an iterator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">An iterator is simply an object that does the built-in <code>Iterator<\/code> role and provides a <code>pull-one<\/code> method.<\/span> <span class=\"sg\" data-s=\"1\">That method returns the next value, or <code>IterationEnd<\/code> when there is nothing left.<\/span> <span class=\"sg\" data-s=\"2\">Here is a countdown iterator that yields a number and steps towards zero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Each call to <code>pull-one<\/code> first checks whether the count has run out; if not, it returns the current number and decrements it.<\/span> <span class=\"sg\" data-s=\"1\">The post-decrement <code>$!n--<\/code> returns the value <em>before<\/em> subtracting, so the numbers come out <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Driving it by hand looks just like any other iterator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An iterator on its own is not something a <code>for<\/code> loop can take directly — a loop expects an <em>iterable<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Wrap the iterator in a <code>Seq<\/code> and it becomes loopable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">That prints <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In everyday code you would reach for <code>gather<\/code> / <code>take<\/code> instead — the <a href=\"/paradigms/generators/\">generator<\/a> form is far shorter for the same result.<\/span> <span class=\"sg\" data-s=\"2\">Writing the <code>Iterator<\/code> role directly is worth seeing once, though, because it lays bare what <code>gather<\/code>, <code>map<\/code>, and every <code>for<\/code> loop are built on: an object that answers a single question — “what is the next value?”<\/span><\/p>"]]},"de":{"t":"Einen Iterator schreiben","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Iterator ist schlicht ein Objekt, das die eingebaute Rolle <code>Iterator<\/code> erfüllt und eine Methode <code>pull-one<\/code> bereitstellt.<\/span> <span class=\"sg\" data-s=\"1\">Diese Methode liefert den nächsten Wert oder <code>IterationEnd<\/code>, wenn nichts mehr übrig ist.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist ein Abwärtszähler-Iterator, der eine Zahl liefert und auf null zuschreitet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>pull-one<\/code> prüft zuerst, ob die Zählung aufgebraucht ist; wenn nicht, liefert er die aktuelle Zahl und verringert sie.<\/span> <span class=\"sg\" data-s=\"1\">Das nachgestellte <code>$!n--<\/code> liefert den Wert <em>vor<\/em> dem Abziehen, die Zahlen kommen also als <code>3, 2, 1<\/code> heraus.<\/span> <span class=\"sg\" data-s=\"2\">Ihn von Hand anzutreiben sieht aus wie bei jedem anderen Iterator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Iterator für sich ist nichts, was eine <code>for<\/code>-Schleife unmittelbar aufnehmen kann — eine Schleife erwartet etwas <em>Iterierbares<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Hüllen Sie den Iterator in eine <code>Seq<\/code>, und er wird schleifenfähig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das gibt <code>3<\/code>, <code>2<\/code>, <code>1<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Im Alltag würden Sie stattdessen zu <code>gather<\/code> / <code>take<\/code> greifen — die <a href=\"https://course.raku.org/de/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">Generator<\/a>form ist für dasselbe Ergebnis weit kürzer.<\/span> <span class=\"sg\" data-s=\"2\">Die Rolle <code>Iterator<\/code> einmal unmittelbar zu schreiben lohnt sich dennoch, denn es legt offen, worauf <code>gather<\/code>, <code>map<\/code> und jede <code>for<\/code>-Schleife gebaut sind: ein Objekt, das eine einzige Frage beantwortet — „was ist der nächste Wert?“<\/span><\/p>"]]},"nl":{"t":"Een iterator schrijven","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een iterator is eenvoudigweg een object dat de ingebouwde rol <code>Iterator<\/code> doet en een methode <code>pull-one<\/code> levert.<\/span> <span class=\"sg\" data-s=\"1\">Die methode geeft de volgende waarde terug, of <code>IterationEnd<\/code> wanneer er niets meer over is.<\/span> <span class=\"sg\" data-s=\"2\">Hier is een afteliterator die een getal oplevert en naar nul toe stapt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>pull-one<\/code> controleert eerst of de telling op is; zo niet, dan geeft ze het huidige getal terug en verlaagt ze het.<\/span> <span class=\"sg\" data-s=\"1\">De postfix-decrementatie <code>$!n--<\/code> geeft de waarde terug <em>voordat<\/em> er afgetrokken wordt, dus komen de getallen er als <code>3, 2, 1<\/code> uit.<\/span> <span class=\"sg\" data-s=\"2\">Hem met de hand aandrijven ziet er net zo uit als bij elke andere iterator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een iterator op zichzelf is niet iets wat een <code>for<\/code>-lus rechtstreeks kan aannemen — een lus verwacht iets <em>iterabels<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Wikkel de iterator in een <code>Seq<\/code> en hij wordt luspaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dat drukt <code>3<\/code>, <code>2<\/code>, <code>1<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">In alledaagse code zou je in plaats daarvan naar <code>gather<\/code> / <code>take<\/code> grijpen — de <a href=\"https://course.raku.org/nl/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">generator<\/a>vorm is voor hetzelfde resultaat veel korter.<\/span> <span class=\"sg\" data-s=\"2\">De rol <code>Iterator<\/code> rechtstreeks schrijven is het één keer waard om te zien, omdat het blootlegt waar <code>gather<\/code>, <code>map<\/code> en elke <code>for<\/code>-lus op gebouwd zijn: een object dat één enkele vraag beantwoordt — \"wat is de volgende waarde?\"<\/span><\/p>"]]},"es":{"t":"Escribir un iterador","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un iterador no es más que un objeto que hace el rol integrado <code>Iterator<\/code> y proporciona un método <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ese método devuelve el valor siguiente, o <code>IterationEnd<\/code> cuando no queda nada.<\/span> <span class=\"sg\" data-s=\"2\">Aquí tienes un iterador de cuenta atrás que entrega un número y avanza hacia cero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>pull-one<\/code> comprueba primero si la cuenta se ha agotado; si no, devuelve el número actual y lo decrementa.<\/span> <span class=\"sg\" data-s=\"1\">El post-decremento <code>$!n--<\/code> devuelve el valor <em>anterior<\/em> a la resta, así que los números salen <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Manejarlo a mano se parece a cualquier otro iterador:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un iterador por sí solo no es algo que un bucle <code>for<\/code> pueda tomar directamente: un bucle espera un <em>iterable<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Envuelve el iterador en una <code>Seq<\/code> y se vuelve recorrible:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eso imprime <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En el código de todos los días recurrirías más bien a <code>gather<\/code> / <code>take<\/code>: la forma de <a href=\"https://course.raku.org/es/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">generador<\/a> es mucho más corta para el mismo resultado.<\/span> <span class=\"sg\" data-s=\"2\">Aun así, merece la pena ver una vez cómo se escribe el rol <code>Iterator<\/code> directamente, porque deja al descubierto aquello sobre lo que están construidos <code>gather<\/code>, <code>map<\/code> y todo bucle <code>for<\/code>: un objeto que responde a una sola pregunta — «¿cuál es el valor siguiente?».<\/span><\/p>"]]},"it":{"t":"Scrivere un iteratore","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un iteratore è semplicemente un oggetto che assume il ruolo incorporato <code>Iterator<\/code> e fornisce un metodo <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quel metodo restituisce il valore successivo, oppure <code>IterationEnd<\/code> quando non resta nulla.<\/span> <span class=\"sg\" data-s=\"2\">Ecco un iteratore che conta alla rovescia, consegnando un numero e avvicinandosi a zero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>pull-one<\/code> controlla prima se il conteggio è finito; se no, restituisce il numero attuale e lo decrementa.<\/span> <span class=\"sg\" data-s=\"1\">Il post-decremento <code>$!n--<\/code> restituisce il valore <em>prima<\/em> di sottrarre, quindi i numeri escono <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pilotarlo a mano è come per qualunque altro iteratore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un iteratore da solo non è qualcosa che un ciclo <code>for<\/code> possa prendere direttamente: un ciclo si aspetta un <em>iterabile<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Avvolgi l'iteratore in una <code>Seq<\/code> e diventa ciclabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nel codice di tutti i giorni ricorreresti invece a <code>gather<\/code> / <code>take<\/code>: la forma del <a href=\"https://course.raku.org/it/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">generatore<\/a> è molto più breve per lo stesso risultato.<\/span> <span class=\"sg\" data-s=\"2\">Vale però la pena vedere una volta il ruolo <code>Iterator<\/code> scritto direttamente, perché mette a nudo ciò su cui sono costruiti <code>gather<\/code>, <code>map<\/code> e ogni ciclo <code>for<\/code>: un oggetto che risponde a un'unica domanda — «qual è il valore successivo?»<\/span><\/p>"]]},"lv":{"t":"Iteratora rakstīšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iterators vienkārši ir objekts, kas pilda iebūvēto lomu <code>Iterator<\/code> un nodrošina metodi <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šī metode atgriež nākamo vērtību vai <code>IterationEnd<\/code>, kad vairs nekā nav palicis.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir atpakaļskaitīšanas iterators, kas atdod skaitli un soļo pretī nullei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>pull-one<\/code> izsaukums vispirms pārbauda, vai skaitīšana nav beigusies; ja nav, tas atgriež pašreizējo skaitli un to samazina.<\/span> <span class=\"sg\" data-s=\"1\">Pēcsamazinājums <code>$!n--<\/code> atgriež vērtību <em>pirms<\/em> atņemšanas, tāpēc skaitļi iznāk <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Darbinot to ar rokām, tas izskatās gluži kā jebkurš cits iterators:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iteratoru pašu par sevi <code>for<\/code> cikls tieši paņemt nespēj — cikls gaida <em>iterējamu<\/em> lietu.<\/span> <span class=\"sg\" data-s=\"1\">Ietiniet iteratoru <code>Seq<\/code>, un tas kļūst ciklojams:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ikdienas kodā jūs tā vietā ņemtu <code>gather<\/code> / <code>take<\/code> — <a href=\"https://course.raku.org/lv/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">ģeneratora<\/a> forma tam pašam rezultātam ir daudz īsāka.<\/span> <span class=\"sg\" data-s=\"2\">Tomēr <code>Iterator<\/code> lomu uzrakstīt tieši ir vērts redzēt vienreiz, jo tas atklāj, uz kā balstās <code>gather<\/code>, <code>map<\/code> un katrs <code>for<\/code> cikls: uz objekta, kas atbild uz vienu vienīgu jautājumu — «kāda ir nākamā vērtība?»<\/span><\/p>"]]},"ru":{"t":"Написание итератора","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Итератор — это просто объект, который выполняет встроенную роль <code>Iterator<\/code> и предоставляет метод <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Этот метод возвращает следующее значение или <code>IterationEnd<\/code>, когда ничего не осталось.<\/span> <span class=\"sg\" data-s=\"2\">Вот итератор обратного отсчёта, выдающий число и шагающий к нулю:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>pull-one<\/code> сначала проверяет, не кончился ли счёт; если нет — возвращает текущее число и уменьшает его.<\/span> <span class=\"sg\" data-s=\"1\">Постфиксное уменьшение <code>$!n--<\/code> возвращает значение <em>до<\/em> вычитания, поэтому числа выходят как <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Управление им вручную выглядит как и у любого другого итератора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сам по себе итератор — не то, что цикл <code>for<\/code> может взять напрямую: циклу нужен <em>итерируемый<\/em> объект.<\/span> <span class=\"sg\" data-s=\"1\">Заверните итератор в <code>Seq<\/code>, и по нему станет можно проходить циклом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это напечатает <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В повседневном коде вы взяли бы <code>gather<\/code> / <code>take<\/code> — форма <a href=\"https://course.raku.org/ru/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">генератора<\/a> для того же результата куда короче.<\/span> <span class=\"sg\" data-s=\"2\">Но написать роль <code>Iterator<\/code> напрямую стоит хотя бы раз, потому что это обнажает то, на чём построены <code>gather<\/code>, <code>map<\/code> и всякий цикл <code>for<\/code>: объект, отвечающий на один-единственный вопрос — «каково следующее значение?».<\/span><\/p>"]]},"uk":{"t":"Написання ітератора","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ітератор — це просто об'єкт, що виконує вбудовану роль <code>Iterator<\/code> і надає метод <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Цей метод повертає наступне значення або <code>IterationEnd<\/code>, коли нічого не залишилося.<\/span> <span class=\"sg\" data-s=\"2\">Ось ітератор зворотного відліку, що видає число й крокує до нуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>pull-one<\/code> спершу перевіряє, чи не вичерпався лічильник; якщо ні, повертає поточне число й зменшує його.<\/span> <span class=\"sg\" data-s=\"1\">Постфіксний декремент <code>$!n--<\/code> повертає значення <em>до<\/em> віднімання, тож числа виходять як <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Керування ним вручну має такий самий вигляд, як і з будь-яким іншим ітератором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сам собою ітератор не є тим, що цикл <code>for<\/code> може взяти напряму, — цикл очікує <em>ітерабельне<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Загорніть ітератор у <code>Seq<\/code>, і він стане придатним для циклу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це друкує <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У повсякденному коді ви взяли б натомість <code>gather<\/code> / <code>take<\/code> — форма <a href=\"https://course.raku.org/uk/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">генератора<\/a> значно коротша для того самого результату.<\/span> <span class=\"sg\" data-s=\"2\">Проте написати роль <code>Iterator<\/code> напряму варто хоча б раз побачити, бо це оголює те, на чому збудовані <code>gather<\/code>, <code>map<\/code> і кожен цикл <code>for<\/code>: об'єкт, що відповідає на одне-єдине запитання — «яке наступне значення?»<\/span><\/p>"]]},"bg":{"t":"Писане на итератор","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Итераторът е просто обект, който изпълнява вградената роля <code>Iterator<\/code> и предоставя метод <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този метод връща следващата стойност или <code>IterationEnd<\/code>, когато не е останало нищо.<\/span> <span class=\"sg\" data-s=\"2\">Ето итератор за обратно броене, който подава число и крачи към нулата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>pull-one<\/code> първо проверява дали броенето е свършило; ако не е, връща текущото число и го намалява.<\/span> <span class=\"sg\" data-s=\"1\">Постфиксното намаляване <code>$!n--<\/code> връща стойността <em>преди<\/em> изваждането, така че числата излизат като <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Управлението му на ръка изглежда също като при всеки друг итератор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сам по себе си итераторът не е нещо, което цикълът <code>for<\/code> може да вземе направо — циклите очакват <em>обхождаемо<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Обвийте итератора в <code>Seq<\/code> и той става годен за цикъл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В ежедневния код бихте посегнали вместо това към <code>gather<\/code> / <code>take<\/code> — формата на <a href=\"https://course.raku.org/bg/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">генератор<\/a> е далеч по-къса за същия резултат.<\/span> <span class=\"sg\" data-s=\"2\">Все пак си струва веднъж да видите как се пише ролята <code>Iterator<\/code> направо, защото това оголва онова, върху което са изградени <code>gather<\/code>, <code>map<\/code> и всеки цикъл <code>for<\/code>: обект, който отговаря на един-единствен въпрос — „коя е следващата стойност?“.<\/span><\/p>"]]},"eo":{"t":"Verki itervilon","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Itervilo estas simple objekto, kiu plenumas la enkonstruitan rolon <code>Iterator<\/code> kaj provizas metodon <code>pull-one<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiu metodo redonas la sekvan valoron, aŭ <code>IterationEnd<\/code>, kiam nenio restas.<\/span> <span class=\"sg\" data-s=\"2\">Jen retronombra itervilo, kiu liveras nombron kaj paŝas al nulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko de <code>pull-one<\/code> unue kontrolas, ĉu la nombrado elĉerpiĝis; se ne, ĝi redonas la kurantan nombron kaj malpliigas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">La postmalpliigo <code>$!n--<\/code> redonas la valoron <em>antaŭ<\/em> la subtraho, do la nombroj eliras kiel <code>3, 2, 1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Konduki ĝin mane aspektas ĝuste kiel ĉe ajna alia itervilo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itervilo per si mem ne estas io, kion buklo <code>for<\/code> povas preni rekte — buklo atendas <em>iterablon<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Envolvu la itervilon en <code>Seq<\/code> kaj ĝi fariĝas buklo-irebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio presas <code>3<\/code>, <code>2<\/code>, <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En ĉiutaga kodo vi prefere uzus <code>gather<\/code> / <code>take<\/code> — la <a href=\"https://course.raku.org/eo/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">generila<\/a> formo estas multe pli mallonga por la sama rezulto.<\/span> <span class=\"sg\" data-s=\"2\">Skribi la rolon <code>Iterator<\/code> rekte tamen indas vidi unufoje, ĉar ĝi malkaŝas, sur kio <code>gather<\/code>, <code>map<\/code> kaj ĉiu buklo <code>for<\/code> estas konstruitaj: objekto, kiu respondas unu solan demandon — «kio estas la sekva valoro?»<\/span><\/p>"]]},"la":{"t":"Iteratorem scribere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iterator simpliciter obiectum est quod partem inbuiltam <code>Iterator<\/code> facit et methodum <code>pull-one<\/code> praebet.<\/span> <span class=\"sg\" data-s=\"1\">Illa methodus valorem sequentem reddit, vel <code>IterationEnd<\/code> cum nihil superest.<\/span> <span class=\"sg\" data-s=\"2\">Ecce iterator numerationis inversae qui numerum reddit et ad nihil gradum facit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Countdown does Iterator {\n    has Int $.n is rw;\n\n    method pull-one {\n        return IterationEnd if $!n &lt;= 0;\n        return $!n--;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unaquaeque vocatio <code>pull-one<\/code> primum inspicit utrum numeratio defecerit; si non, numerum currentem reddit eumque minuit.<\/span> <span class=\"sg\" data-s=\"1\">Postminutio <code>$!n--<\/code> valorem <em>ante<\/em> subtractionem reddit, itaque numeri <code>3, 2, 1<\/code> exeunt.<\/span> <span class=\"sg\" data-s=\"2\">Illum manu agens, ut quilibet alius iterator apparet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Countdown.new(n =&gt; 3);\nsay $c.pull-one; # 3\nsay $c.pull-one; # 2\nsay $c.pull-one; # 1\nsay $c.pull-one =:= IterationEnd; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iterator per se non est quod anulus <code>for<\/code> directe accipere potest — anulus rem <em>iterabilem<\/em> exspectat.<\/span> <span class=\"sg\" data-s=\"1\">Involve iteratorem in <code>Seq<\/code> et percurribilis fit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for Seq.new(Countdown.new(n =&gt; 3)) -&gt; $x {\n    say $x;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Illud <code>3<\/code>, <code>2<\/code>, <code>1<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">In codice cotidiano <code>gather<\/code> / <code>take<\/code> loco eius peteres — forma <a href=\"https://course.raku.org/la/paradigms/generators/\" target=\"_blank\" rel=\"noopener\">generatoris<\/a> pro eodem effectu multo brevior est.<\/span> <span class=\"sg\" data-s=\"2\">Partem <code>Iterator<\/code> directe scribere tamen semel videre operae pretium est, quia nudum ostendit id super quod <code>gather<\/code>, <code>map<\/code> et omnis anulus <code>for<\/code> aedificantur: obiectum quod uni quaestioni respondet — «quis est valor sequens?»<\/span><\/p>"]]}}}</script>
