<script type="application/json" id="page-data">{"u":"paradigms/hyper-race/race","n":1318,"k":"topic","pv":"paradigms/hyper-race/hyper/quiz","nx":"paradigms/hyper-race/batch-and-degree","tr":["paradigms","paradigms/hyper-race"],"L":{"en":{"t":"Unordered parallelism with race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> parallelises in the same way as <code>.hyper<\/code>, with one difference: it does <strong>not<\/strong> promise to return the results in order.<\/span> <span class=\"sg\" data-s=\"1\">Whichever worker finishes first contributes its result first.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The squares come back in an unpredictable order, so the <code>.sort<\/code> is there to make the output deterministic.<\/span> <span class=\"sg\" data-s=\"1\">Had we printed without sorting, the numbers would all be present but possibly shuffled.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because it does not have to keep results ordered, <code>.race<\/code> can have slightly less overhead than <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The trade-off is simple:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">use <code>.hyper<\/code> when the <strong>order<\/strong> of the results matters;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">use <code>.race<\/code> when it does <strong>not<\/strong> — for example when you are going to sum, count, or otherwise combine the results in an order-independent way.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Summing is order-independent, so <code>.race<\/code> is a fine choice here and gives the same <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Both methods are about the same idea — let independent work run at once — and you pick between them on whether you care about ordering.<\/span><\/p>"]]},"de":{"t":"Ungeordnete Parallelität mit race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> parallelisiert auf dieselbe Weise wie <code>.hyper<\/code>, mit einem Unterschied: Es verspricht <strong>nicht<\/strong>, die Ergebnisse in Reihenfolge zu liefern.<\/span> <span class=\"sg\" data-s=\"1\">Welcher Arbeiter zuerst fertig ist, steuert sein Ergebnis zuerst bei.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Quadrate kommen in unvorhersagbarer Reihenfolge zurück, das <code>.sort<\/code> steht also dort, um die Ausgabe bestimmt zu machen.<\/span> <span class=\"sg\" data-s=\"1\">Hätten wir ohne Sortieren ausgegeben, wären alle Zahlen da, aber womöglich durcheinander.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da es die Ergebnisse nicht in Reihenfolge halten muss, kann <code>.race<\/code> etwas weniger Aufwand haben als <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die Abwägung ist einfach:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">nehmen Sie <code>.hyper<\/code>, wenn die <strong>Reihenfolge<\/strong> der Ergebnisse zählt;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">nehmen Sie <code>.race<\/code>, wenn sie es <strong>nicht<\/strong> tut — etwa wenn Sie die Ergebnisse summieren, zählen oder sonst auf von der Reihenfolge unabhängige Weise verbinden.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Summieren ist von der Reihenfolge unabhängig, <code>.race<\/code> ist hier also eine gute Wahl und ergibt dieselben <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beiden Methoden liegt derselbe Gedanke zugrunde — unabhängige Arbeit zugleich laufen lassen —, und Sie wählen danach, ob Ihnen die Reihenfolge wichtig ist.<\/span><\/p>"]]},"nl":{"t":"Ongeordend parallellisme met race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> parallelliseert op dezelfde manier als <code>.hyper<\/code>, met één verschil: het belooft <strong>niet<\/strong> de resultaten op volgorde terug te geven.<\/span> <span class=\"sg\" data-s=\"1\">Welke worker het eerst klaar is, levert zijn resultaat het eerst.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De kwadraten komen in een onvoorspelbare volgorde terug, dus de <code>.sort<\/code> staat er om de uitvoer deterministisch te maken.<\/span> <span class=\"sg\" data-s=\"1\">Hadden we zonder sorteren afgedrukt, dan zouden alle getallen aanwezig maar mogelijk door elkaar geschud zijn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat het de resultaten niet op volgorde hoeft te houden, kan <code>.race<\/code> iets minder overhead hebben dan <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De afweging is eenvoudig:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">gebruik <code>.hyper<\/code> wanneer de <strong>volgorde<\/strong> van de resultaten ertoe doet;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">gebruik <code>.race<\/code> wanneer dat <strong>niet<\/strong> zo is — bijvoorbeeld wanneer je de resultaten gaat optellen, tellen of anderszins op een van volgorde onafhankelijke manier gaat combineren.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Optellen is van volgorde onafhankelijk, dus <code>.race<\/code> is hier een prima keuze en geeft dezelfde <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beide methoden gaan over hetzelfde idee — laat onafhankelijk werk tegelijk lopen — en je kiest ertussen op grond van de vraag of de volgorde je iets kan schelen.<\/span><\/p>"]]},"es":{"t":"Paralelismo sin orden con race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> paraleliza igual que <code>.hyper<\/code>, con una diferencia: <strong>no<\/strong> promete devolver los resultados en orden.<\/span> <span class=\"sg\" data-s=\"1\">El trabajador que termina primero aporta primero su resultado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los cuadrados vuelven en un orden impredecible, así que el <code>.sort<\/code> está ahí para hacer determinista la salida.<\/span> <span class=\"sg\" data-s=\"1\">Si hubiéramos imprimido sin ordenar, los números estarían todos presentes pero posiblemente barajados.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como no tiene que mantener los resultados ordenados, <code>.race<\/code> puede tener algo menos de sobrecarga que <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El compromiso es sencillo:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">usa <code>.hyper<\/code> cuando importe el <strong>orden<\/strong> de los resultados;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">usa <code>.race<\/code> cuando <strong>no<\/strong> importe; por ejemplo, cuando vayas a sumar, contar o combinar de cualquier otro modo los resultados sin depender del orden.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sumar no depende del orden, así que <code>.race<\/code> es aquí una buena elección y da el mismo <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ambos métodos giran en torno a la misma idea — dejar que el trabajo independiente corra a la vez — y eliges entre ellos según te importe o no el orden.<\/span><\/p>"]]},"it":{"t":"Parallelismo senza ordine con race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> parallelizza allo stesso modo di <code>.hyper<\/code>, con una differenza: <strong>non<\/strong> promette di restituire i risultati in ordine.<\/span> <span class=\"sg\" data-s=\"1\">Il lavoratore che finisce per primo contribuisce per primo il proprio risultato.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I quadrati tornano in un ordine imprevedibile, quindi il <code>.sort<\/code> è lì per rendere deterministico l'output.<\/span> <span class=\"sg\" data-s=\"1\">Se avessimo stampato senza ordinare, i numeri ci sarebbero stati tutti ma forse mescolati.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché non deve tenere ordinati i risultati, <code>.race<\/code> può avere un po' meno sovraccarico di <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il compromesso è semplice:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">usa <code>.hyper<\/code> quando l'<strong>ordine<\/strong> dei risultati conta;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">usa <code>.race<\/code> quando <strong>non<\/strong> conta — per esempio quando stai per sommare, contare o combinare altrimenti i risultati in un modo indipendente dall'ordine.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommare è indipendente dall'ordine, quindi <code>.race<\/code> qui è una buona scelta e dà lo stesso <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entrambi i metodi riguardano la stessa idea — lasciare che il lavoro indipendente giri insieme — e scegli fra loro in base al fatto che l'ordinamento ti interessi o no.<\/span><\/p>"]]},"ru":{"t":"Неупорядоченный параллелизм с race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> распараллеливает так же, как <code>.hyper<\/code>, с одним отличием: он <strong>не<\/strong> обещает вернуть результаты в исходном порядке.<\/span> <span class=\"sg\" data-s=\"1\">Чей рабочий поток закончил первым, того результат и придёт первым.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Квадраты возвращаются в непредсказуемом порядке, поэтому <code>.sort<\/code> здесь нужен, чтобы вывод был детерминированным.<\/span> <span class=\"sg\" data-s=\"1\">Напечатай мы результат без сортировки, все числа были бы на месте, но, возможно, вперемешку.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>.race<\/code> не обязан сохранять порядок результатов, у него могут быть чуть меньшие издержки, чем у <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Выбор прост:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">используйте <code>.hyper<\/code>, когда <strong>порядок<\/strong> результатов важен;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">используйте <code>.race<\/code>, когда он <strong>не<\/strong> важен, — например, когда вы собираетесь просуммировать, пересчитать или иначе объединить результаты способом, не зависящим от порядка.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Суммирование не зависит от порядка, поэтому <code>.race<\/code> здесь вполне уместен и даёт те же <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оба метода об одном и том же — позволить независимой работе выполняться одновременно, — а выбирают между ними по тому, важен ли вам порядок.<\/span><\/p>"]]},"uk":{"t":"Невпорядкована паралельність із race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> розпаралелює так само, як <code>.hyper<\/code>, з однією різницею: він <strong>не<\/strong> обіцяє повернути результати в порядку.<\/span> <span class=\"sg\" data-s=\"1\">Хто з робітників завершить першим, той першим і віддасть свій результат.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Квадрати повертаються в непередбачуваному порядку, тож <code>.sort<\/code> стоїть тут, щоб зробити вивід детермінованим.<\/span> <span class=\"sg\" data-s=\"1\">Якби ми надрукували без сортування, числа були б усі, але, можливо, перемішані.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки йому не доводиться тримати результати впорядкованими, <code>.race<\/code> може мати трохи менше накладних витрат, ніж <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Компроміс простий:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">використовуйте <code>.hyper<\/code>, коли <strong>порядок<\/strong> результатів має значення;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">використовуйте <code>.race<\/code>, коли <strong>не<\/strong> має, — наприклад, коли ви збираєтеся підсумувати, порахувати або інакше поєднати результати способом, незалежним від порядку.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підсумовування незалежне від порядку, тож <code>.race<\/code> тут цілком доречний і дає те саме <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обидва методи стосуються однієї ідеї — дати незалежній роботі виконуватися водночас, — і обираєте ви між ними за тим, чи важливий вам порядок.<\/span><\/p>"]]},"bg":{"t":"Неподредена паралелност с race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.race<\/code> паралелизира по същия начин като <code>.hyper<\/code>, с една разлика: той <strong>не<\/strong> обещава да върне резултатите по ред.<\/span> <span class=\"sg\" data-s=\"1\">Който работник приключи пръв, пръв подава своя резултат.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).race.map(* ** 2).sort; # (1 4 9 16 25 36 49 64 81 100)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Квадратите се връщат в непредвидим ред, така че <code>.sort<\/code> е там, за да направи изхода детерминиран.<\/span> <span class=\"sg\" data-s=\"1\">Ако бяхме отпечатали без сортиране, числата щяха да са всичките, но може би разбъркани.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже не му се налага да пази резултатите подредени, <code>.race<\/code> може да има малко по-малко допълнителни разходи от <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Компромисът е прост:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">използвайте <code>.hyper<\/code>, когато <strong>редът<\/strong> на резултатите има значение;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">използвайте <code>.race<\/code>, когато <strong>няма<\/strong> — например когато ще сумирате, броите или иначе съчетавате резултатите по начин, независим от реда.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..100).race.map(* * 2).sum; # 10100<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сумирането е независимо от реда, така че <code>.race<\/code> тук е добър избор и дава същото <code>10100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">И двата метода са за една и съща идея — да оставите независимата работа да върви наведнъж — и избирате между тях според това дали ви е важен редът.<\/span><\/p>"]]}}}</script>
