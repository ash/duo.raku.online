<script type="application/json" id="page-data">{"u":"paradigms/hyper-race/batch-and-degree","n":1319,"k":"topic","pv":"paradigms/hyper-race/race","nx":"paradigms/hyper-race/batch-and-degree/quiz","tr":["paradigms","paradigms/hyper-race"],"L":{"en":{"t":"Tuning with :batch and :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Both <code>.hyper<\/code> and <code>.race<\/code> accept two adverbs that control <em>how<\/em> the work is split across threads: <code>:degree<\/code> and <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You rarely need them, but they are what you reach for when you are tuning for speed.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — how many workers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> sets how many worker threads run at the same time:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">By default the degree is close to the number of CPU cores the machine has — on an eight-core machine it is <code>7<\/code>, leaving a core for the main program.<\/span> <span class=\"sg\" data-s=\"1\">Raising it much above the core count rarely helps, since there are no more cores to run on, and the extra coordination can even slow things down.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — how many elements at a time<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> sets how many elements each worker takes in one go before coming back for more:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The default batch is <code>64<\/code>, and the size is a trade-off:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">A <strong>large<\/strong> batch means less back-and-forth between the workers and the scheduler — less overhead, which is good when every element costs about the same.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">A <strong>small<\/strong> batch spreads the work more evenly when some elements are far more expensive than others, so no single worker gets stuck with all the slow ones — at the cost of more coordination.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can set both at once, on <code>.race<\/code> just as on <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you are curious what the defaults actually are, you can peek at them through Rakudo’s internals.<\/span> <span class=\"sg\" data-s=\"1\">Note that this reads a <em>private<\/em> attribute — it is not a stable API, and the numbers depend on your machine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here <code>batch<\/code> is the fixed default <code>64<\/code>, while <code>degree<\/code> is <code>7<\/code> — one less than this machine’s eight cores.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">They are still only hints<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">As with <code>.hyper<\/code> and <code>.race<\/code> themselves, these adverbs <strong>request<\/strong> a particular split rather than guarantee it.<\/span> <span class=\"sg\" data-s=\"1\">A compiler is free to honour them, adjust them, or ignore them entirely — so treat <code>:batch<\/code> and <code>:degree<\/code> as knobs to try when tuning, not as promises about exactly how the work will run.<\/span><\/p>"]]},"de":{"t":"Feinabstimmung mit :batch und :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sowohl <code>.hyper<\/code> als auch <code>.race<\/code> nimmt zwei Adverbien auf, die steuern, <em>wie<\/em> die Arbeit über Threads verteilt wird: <code>:degree<\/code> und <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie brauchen sie selten, aber zu ihnen greifen Sie, wenn Sie auf Geschwindigkeit abstimmen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — wie viele Arbeiter<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> legt fest, wie viele Arbeits-Threads zugleich laufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig liegt der Grad nahe an der Zahl der CPU-Kerne der Maschine — auf einer Maschine mit acht Kernen ist er <code>7<\/code> und lässt einen Kern für das Hauptprogramm.<\/span> <span class=\"sg\" data-s=\"1\">Ihn deutlich über die Kernzahl zu heben hilft selten, denn es gibt keine weiteren Kerne, auf denen gelaufen werden könnte, und die zusätzliche Koordination kann sogar bremsen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — wie viele Elemente auf einmal<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> legt fest, wie viele Elemente jeder Arbeiter auf einmal nimmt, bevor er um mehr zurückkommt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Standardgröße ist <code>64<\/code>, und die Größe ist eine Abwägung:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Eine <strong>große<\/strong> Portion bedeutet weniger Hin und Her zwischen Arbeitern und Ablaufsteuerung — weniger Aufwand, was gut ist, wenn jedes Element ungefähr gleich viel kostet.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Eine <strong>kleine<\/strong> Portion verteilt die Arbeit gleichmäßiger, wenn manche Elemente weit teurer sind als andere, sodass kein einzelner Arbeiter mit allen langsamen sitzen bleibt — zum Preis von mehr Koordination.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können beide zugleich setzen, bei <code>.race<\/code> genauso wie bei <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie neugierig sind, wie die Standardwerte tatsächlich lauten, können Sie über Rakudos Innenleben nachsehen.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, dass dies ein <em>privates<\/em> Attribut liest — es ist keine feste Schnittstelle, und die Zahlen hängen von Ihrer Maschine ab:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>batch<\/code> der feste Standardwert <code>64<\/code>, während <code>degree<\/code> <code>7<\/code> ist — einer weniger als die acht Kerne dieser Maschine.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Es bleiben nur Hinweise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie <code>.hyper<\/code> und <code>.race<\/code> selbst <strong>bitten<\/strong> diese Adverbien um eine bestimmte Aufteilung, statt sie zuzusichern.<\/span> <span class=\"sg\" data-s=\"1\">Ein Compiler darf sie beachten, anpassen oder ganz übergehen — behandeln Sie <code>:batch<\/code> und <code>:degree<\/code> also als Stellschrauben zum Ausprobieren, nicht als Versprechen darüber, wie die Arbeit genau ablaufen wird.<\/span><\/p>"]]},"nl":{"t":"Afstemmen met :batch en :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zowel <code>.hyper<\/code> als <code>.race<\/code> accepteert twee bijwoorden die bepalen <em>hoe<\/em> het werk over threads verdeeld wordt: <code>:degree<\/code> en <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt ze zelden nodig, maar het zijn de knoppen waar je naar grijpt wanneer je op snelheid afstemt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — hoeveel workers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> bepaalt hoeveel werkthreads tegelijk lopen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard ligt de graad dicht bij het aantal CPU-kernen dat de machine heeft — op een machine met acht kernen is het <code>7<\/code>, wat één kern voor het hoofdprogramma overlaat.<\/span> <span class=\"sg\" data-s=\"1\">Hem veel hoger zetten dan het aantal kernen helpt zelden, omdat er niet meer kernen zijn om op te draaien, en de extra coördinatie kan het zelfs vertragen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — hoeveel elementen tegelijk<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> bepaalt hoeveel elementen elke worker in één keer neemt voordat hij om meer terugkomt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De standaardbatch is <code>64<\/code>, en de grootte is een afweging:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Een <strong>grote<\/strong> batch betekent minder heen en weer tussen de workers en de scheduler — minder overhead, wat goed is wanneer elk element ongeveer evenveel kost.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Een <strong>kleine<\/strong> batch verdeelt het werk gelijkmatiger wanneer sommige elementen veel duurder zijn dan andere, zodat geen enkele worker met alle trage blijft zitten — ten koste van meer coördinatie.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt beide tegelijk instellen, op <code>.race<\/code> net zo goed als op <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je benieuwd bent wat de standaardwaarden werkelijk zijn, kun je er via Rakudo's interne onderdelen naar gluren.<\/span> <span class=\"sg\" data-s=\"1\">Let op: dit leest een <em>private<\/em> attribuut — het is geen stabiele API, en de getallen hangen van je machine af:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>batch<\/code> de vaste standaardwaarde <code>64<\/code>, terwijl <code>degree<\/code> <code>7<\/code> is — één minder dan de acht kernen van deze machine.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het blijven slechts hints<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als <code>.hyper<\/code> en <code>.race<\/code> zelf <strong>vragen<\/strong> deze bijwoorden om een bepaalde verdeling in plaats van haar te garanderen.<\/span> <span class=\"sg\" data-s=\"1\">Een compiler mag ze honoreren, bijstellen of volledig negeren — beschouw <code>:batch<\/code> en <code>:degree<\/code> dus als knoppen om aan te draaien bij het afstemmen, niet als beloften over hoe het werk precies zal lopen.<\/span><\/p>"]]},"es":{"t":"Ajustar con :batch y :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tanto <code>.hyper<\/code> como <code>.race<\/code> aceptan dos adverbios que controlan <em>cómo<\/em> se reparte el trabajo entre los hilos: <code>:degree<\/code> y <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rara vez los necesitas, pero son a lo que recurres cuando ajustas para ganar velocidad.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — cuántos trabajadores<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> fija cuántos hilos trabajadores corren al mismo tiempo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por omisión, el grado se acerca al número de núcleos de CPU que tiene la máquina: en una máquina de ocho núcleos es <code>7<\/code>, dejando un núcleo para el programa principal.<\/span> <span class=\"sg\" data-s=\"1\">Subirlo muy por encima del número de núcleos rara vez ayuda, ya que no hay más núcleos donde correr, y la coordinación extra puede incluso frenar las cosas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — cuántos elementos de una vez<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> fija cuántos elementos toma cada trabajador de una tacada antes de volver a por más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El lote por omisión es <code>64<\/code>, y el tamaño es un compromiso:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Un lote <strong>grande<\/strong> significa menos ir y venir entre los trabajadores y el planificador — menos sobrecarga, cosa buena cuando todos los elementos cuestan más o menos lo mismo.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Un lote <strong>pequeño<\/strong> reparte el trabajo de manera más pareja cuando unos elementos son mucho más caros que otros, así que ningún trabajador se queda atascado con todos los lentos, a costa de más coordinación.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes fijar ambos a la vez, en <code>.race<\/code> igual que en <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si sientes curiosidad por saber cuáles son en realidad los valores por omisión, puedes atisbarlos a través de las tripas de Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Ten en cuenta que esto lee un atributo <em>privado<\/em>: no es una API estable, y los números dependen de tu máquina.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>batch<\/code> es el valor fijo por omisión <code>64<\/code>, mientras que <code>degree<\/code> es <code>7<\/code>: uno menos que los ocho núcleos de esta máquina.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Siguen siendo solo indicaciones<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Igual que <code>.hyper<\/code> y <code>.race<\/code> en sí, estos adverbios <strong>solicitan<\/strong> un reparto concreto en lugar de garantizarlo.<\/span> <span class=\"sg\" data-s=\"1\">Un compilador es libre de respetarlos, ajustarlos o ignorarlos por completo, así que trata <code>:batch<\/code> y <code>:degree<\/code> como mandos que probar al ajustar, no como promesas sobre cómo se ejecutará exactamente el trabajo.<\/span><\/p>"]]},"it":{"t":"Regolare con :batch e :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sia <code>.hyper<\/code> sia <code>.race<\/code> accettano due avverbi che controllano <em>come<\/em> il lavoro viene diviso fra i thread: <code>:degree<\/code> e <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raramente ti servono, ma sono ciò a cui ricorri quando stai regolando le prestazioni.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — quanti lavoratori<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> stabilisce quanti thread lavoratori girano nello stesso momento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita il grado è vicino al numero di core della CPU della macchina — su una macchina a otto core è <code>7<\/code>, lasciando un core al programma principale.<\/span> <span class=\"sg\" data-s=\"1\">Alzarlo molto oltre il numero di core raramente aiuta, dato che non ci sono altri core su cui girare, e il coordinamento in più può persino rallentare le cose.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — quanti elementi per volta<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> stabilisce quanti elementi ogni lavoratore prende in una volta prima di tornare a chiederne altri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il lotto predefinito è <code>64<\/code>, e la dimensione è un compromesso:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Un lotto <strong>grande<\/strong> significa meno avanti e indietro fra i lavoratori e lo schedulatore — meno sovraccarico, il che va bene quando ogni elemento costa più o meno lo stesso.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Un lotto <strong>piccolo<\/strong> distribuisce il lavoro più uniformemente quando alcuni elementi sono molto più costosi di altri, così nessun singolo lavoratore resta impantanato con tutti quelli lenti — al prezzo di più coordinamento.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi impostarli entrambi insieme, su <code>.race<\/code> come su <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se sei curioso di sapere quali siano davvero i valori predefiniti, puoi sbirciarli attraverso le interiora di Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Nota che questo legge un attributo <em>privato<\/em>: non è un'interfaccia stabile, e i numeri dipendono dalla tua macchina:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui <code>batch<\/code> è il predefinito fisso <code>64<\/code>, mentre <code>degree<\/code> è <code>7<\/code> — uno in meno degli otto core di questa macchina.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Restano comunque solo suggerimenti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come <code>.hyper<\/code> e <code>.race<\/code> stessi, questi avverbi <strong>richiedono<\/strong> una particolare divisione invece di garantirla.<\/span> <span class=\"sg\" data-s=\"1\">Un compilatore è libero di onorarli, di aggiustarli o di ignorarli del tutto — quindi tratta <code>:batch<\/code> e <code>:degree<\/code> come manopole da provare quando regoli, non come promesse su come il lavoro girerà esattamente.<\/span><\/p>"]]},"ru":{"t":"Настройка с :batch и :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">И <code>.hyper<\/code>, и <code>.race<\/code> принимают два наречия, управляющие тем, <em>как<\/em> работа делится между потоками: <code>:degree<\/code> и <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Нужны они редко, но именно к ним обращаются, когда настраивают скорость.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — сколько рабочих потоков<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> задаёт, сколько рабочих потоков выполняются одновременно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию степень близка к числу процессорных ядер машины: на восьмиядерной это <code>7<\/code>, одно ядро остаётся основной программе.<\/span> <span class=\"sg\" data-s=\"1\">Поднимать её намного выше числа ядер обычно бесполезно, потому что исполнять код больше не на чем, а дополнительная координация может даже замедлить работу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — сколько элементов за раз<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> задаёт, сколько элементов рабочий поток забирает за один заход, прежде чем вернуться за следующими:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">По умолчанию размер пачки равен <code>64<\/code>, и здесь есть компромисс:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Большая<\/strong> пачка означает меньше беготни между рабочими потоками и планировщиком — меньше издержек, что хорошо, когда все элементы стоят примерно одинаково.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Маленькая<\/strong> пачка равномернее распределяет работу, когда одни элементы гораздо дороже других, так что ни одному потоку не достанутся все медленные, — ценой более частой координации.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Задать можно оба сразу, причём для <code>.race<\/code> так же, как для <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если любопытно, каковы значения по умолчанию на самом деле, в них можно заглянуть через внутренности Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Учтите, что здесь читается <em>приватный<\/em> атрибут — это не стабильный API, а числа зависят от вашей машины:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>batch<\/code> — фиксированное значение по умолчанию <code>64<\/code>, а <code>degree<\/code> равно <code>7<\/code>: на единицу меньше, чем восемь ядер этой машины.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Это всё равно лишь подсказки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и сами <code>.hyper<\/code> и <code>.race<\/code>, эти наречия <strong>просят<\/strong> о конкретном разбиении, а не гарантируют его.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор вправе соблюсти их, подправить или вовсе проигнорировать, — так что считайте <code>:batch<\/code> и <code>:degree<\/code> ручками, которые стоит покрутить при настройке, а не обещаниями того, как именно пойдёт работа.<\/span><\/p>"]]},"uk":{"t":"Налаштування через :batch та :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">І <code>.hyper<\/code>, і <code>.race<\/code> приймають два прислівники, що керують тим, <em>як<\/em> роботу розділено між потоками: <code>:degree<\/code> та <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони рідко потрібні, але саме до них ви звертаєтеся, коли налаштовуєте швидкість.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — скільки робітників<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> задає, скільки робочих потоків працюють одночасно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Типово degree близький до кількості ядер процесора машини — на восьмиядерній машині це <code>7<\/code>, лишаючи одне ядро головній програмі.<\/span> <span class=\"sg\" data-s=\"1\">Піднімати його значно вище за кількість ядер рідко допомагає, бо більше ядер для роботи немає, а зайва координація може навіть уповільнити справу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — скільки елементів за раз<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> задає, скільки елементів кожен робітник бере за один захід, перш ніж повернутися по нові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типовий batch дорівнює <code>64<\/code>, і розмір є компромісом:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Великий<\/strong> batch означає менше метушні між робітниками та планувальником — менше накладних витрат, що добре, коли кожен елемент коштує приблизно однаково.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Малий<\/strong> batch рівномірніше розподіляє роботу, коли деякі елементи набагато дорожчі за інші, тож жоден робітник не застрягає з усіма повільними — ціною більшої координації.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва можна задати водночас, і на <code>.race<\/code> так само, як на <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо вам цікаво, які ж типові значення насправді, ви можете зазирнути в них через нутрощі Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Зауважте, що це читає <em>приватний<\/em> атрибут — це не стабільний API, і числа залежать від вашої машини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут <code>batch<\/code> дорівнює фіксованому типовому <code>64<\/code>, а <code>degree<\/code> — <code>7<\/code>, тобто на одиницю менше за вісім ядер цієї машини.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Це все ще лише підказки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і самі <code>.hyper<\/code> та <code>.race<\/code>, ці прислівники <strong>просять<\/strong> певного поділу, а не гарантують його.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор вільний зважити на них, скоригувати їх або цілком проігнорувати — тож ставтеся до <code>:batch<\/code> та <code>:degree<\/code> як до ручок, які варто покрутити під час налаштування, а не як до обіцянок про те, як саме виконуватиметься робота.<\/span><\/p>"]]},"bg":{"t":"Настройване с :batch и :degree","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">И <code>.hyper<\/code>, и <code>.race<\/code> приемат две наречия, които управляват <em>как<\/em> работата се разделя между нишките: <code>:degree<\/code> и <code>:batch<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Рядко ви трябват, но именно към тях посягате, когато настройвате за скорост.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> — колко работници<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:degree<\/code> задава колко работни нишки вървят едновременно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper(:degree(2)).map(*²); # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране степента е близо до броя процесорни ядра на машината — на осемядрена машина тя е <code>7<\/code>, оставяйки едно ядро за основната програма.<\/span> <span class=\"sg\" data-s=\"1\">Вдигането ѝ много над броя на ядрата рядко помага, защото повече ядра за работа няма, а допълнителната координация може дори да забави нещата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — по колко елемента наведнъж<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> задава по колко елемента взема всеки работник наведнъж, преди да се върне за още:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).hyper(:batch(2)).map(*²); # (1 4 9 16 25 36)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Партидата по подразбиране е <code>64<\/code>, а размерът е компромис:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Голяма<\/strong> партида означава по-малко разкарване между работниците и планировчика — по-малко допълнителни разходи, което е добре, когато всеки елемент струва приблизително еднакво.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Малка<\/strong> партида разпределя работата по-равномерно, когато някои елементи са далеч по-скъпи от други, така че никой работник не засяда с всички бавни — срещу цената на повече координация.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да зададете и двете наведнъж, и то при <code>.race<\/code> също както при <code>.hyper<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..6).race(:degree(2), :batch(3)).map(*²).sum; # 91<\/code><\/pre>"],["raw",0,"<div style=\"font-size: 85%; opacity: .8;\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако ви е любопитно какви всъщност са стойностите по подразбиране, можете да надникнете в тях през вътрешностите на Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че това чете <em>частен<\/em> атрибут — не е стабилен API, а числата зависят от вашата машина:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $h := (1..10).hyper;\nsay $h.^attributes.first(*.name.contains('config')).get_value($h).raku;\n# HyperConfiguration.new(batch =&gt; 64, degree =&gt; 7)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук <code>batch<\/code> е фиксираната стойност по подразбиране <code>64<\/code>, а <code>degree<\/code> е <code>7<\/code> — с едно по-малко от осемте ядра на тази машина.<\/span><\/p>"],["raw",0,"<\/div>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Те пак са само подсказки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както и самите <code>.hyper<\/code> и <code>.race<\/code>, тези наречия <strong>молят<\/strong> за определено разделяне, а не го гарантират.<\/span> <span class=\"sg\" data-s=\"1\">Компилаторът е свободен да ги зачете, да ги коригира или изцяло да ги пренебрегне — така че гледайте на <code>:batch<\/code> и <code>:degree<\/code> като на копчета, които да завъртите при настройване, а не като на обещания за това как точно ще върви работата.<\/span><\/p>"]]}}}</script>
