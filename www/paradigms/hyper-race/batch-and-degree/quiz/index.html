<script type="application/json" id="page-data">{"u":"paradigms/hyper-race/batch-and-degree/quiz","n":1320,"k":"quiz","pv":"paradigms/hyper-race/batch-and-degree","nx":"paradigms/hyper-race/exercises","tr":["paradigms","paradigms/hyper-race","paradigms/hyper-race/batch-and-degree"],"L":{"en":{"t":"Quiz — batch and degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>(1..1000).hyper(:degree(4), :batch(50))<\/code>, what does the <code>:batch(50)<\/code> control?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">How many elements each worker processes in one go before fetching more<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">How many worker threads run at the same time<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">How many elements the whole pipeline is allowed to process<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">The number of CPU cores the program may use<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> is the <strong>chunk size<\/strong> — how many elements a worker takes per turn.<\/span> <span class=\"sg\" data-s=\"1\">The number of workers is <code>:degree<\/code> (here <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">A larger batch cuts coordination overhead; a smaller one balances uneven work more evenly.<\/span> <span class=\"sg\" data-s=\"3\">Both are hints the compiler may adjust or ignore.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — batch und degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was steuert das <code>:batch(50)<\/code> in <code>(1..1000).hyper(:degree(4), :batch(50))<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Wie viele Elemente jeder Arbeiter auf einmal verarbeitet, bevor er weitere holt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Wie viele Arbeits-Threads zugleich laufen<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Wie viele Elemente die ganze Pipeline verarbeiten darf<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Die Zahl der CPU-Kerne, die das Programm nutzen darf<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> ist die <strong>Portionsgröße<\/strong> — wie viele Elemente ein Arbeiter je Runde nimmt.<\/span> <span class=\"sg\" data-s=\"1\">Die Zahl der Arbeiter ist <code>:degree<\/code> (hier <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Eine größere Portion senkt den Koordinationsaufwand; eine kleinere gleicht ungleiche Arbeit besser aus.<\/span> <span class=\"sg\" data-s=\"3\">Beides sind Hinweise, die der Compiler anpassen oder übergehen darf.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — batch en degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat bepaalt de <code>:batch(50)<\/code> in <code>(1..1000).hyper(:degree(4), :batch(50))<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Hoeveel elementen elke worker in één keer verwerkt voordat hij er meer ophaalt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Hoeveel werkthreads tegelijk lopen<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Hoeveel elementen de hele pijplijn mag verwerken<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Het aantal CPU-kernen dat het programma mag gebruiken<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> is de <strong>brokgrootte<\/strong> — hoeveel elementen een worker per beurt neemt.<\/span> <span class=\"sg\" data-s=\"1\">Het aantal workers is <code>:degree<\/code> (hier <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Een grotere batch snijdt in de coördinatie-overhead; een kleinere verdeelt ongelijk werk gelijkmatiger.<\/span> <span class=\"sg\" data-s=\"3\">Beide zijn hints die de compiler mag bijstellen of negeren.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — batch y degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>(1..1000).hyper(:degree(4), :batch(50))<\/code>, ¿qué controla el <code>:batch(50)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Cuántos elementos procesa cada trabajador de una tacada antes de ir a por más<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Cuántos hilos trabajadores corren al mismo tiempo<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Cuántos elementos puede procesar la tubería entera<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">El número de núcleos de CPU que el programa puede usar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> es el <strong>tamaño del trozo<\/strong>: cuántos elementos toma un trabajador por turno.<\/span> <span class=\"sg\" data-s=\"1\">El número de trabajadores es <code>:degree<\/code> (aquí <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Un lote mayor recorta la sobrecarga de coordinación; uno menor equilibra mejor el trabajo desigual.<\/span> <span class=\"sg\" data-s=\"3\">Ambos son indicaciones que el compilador puede ajustar o ignorar.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — batch e degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>(1..1000).hyper(:degree(4), :batch(50))<\/code>, che cosa controlla <code>:batch(50)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Quanti elementi ogni lavoratore elabora in una volta prima di prenderne altri<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Quanti thread lavoratori girano nello stesso momento<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Quanti elementi l'intera pipeline può elaborare<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Il numero di core della CPU che il programma può usare<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> è la <strong>dimensione del lotto<\/strong> — quanti elementi un lavoratore prende per turno.<\/span> <span class=\"sg\" data-s=\"1\">Il numero di lavoratori è <code>:degree<\/code> (qui <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Un lotto più grande taglia il sovraccarico di coordinamento; uno più piccolo bilancia più uniformemente il lavoro disomogeneo.<\/span> <span class=\"sg\" data-s=\"3\">Entrambi sono suggerimenti che il compilatore può aggiustare o ignorare.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — batch и degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Чем управляет <code>:batch(50)<\/code> в выражении <code>(1..1000).hyper(:degree(4), :batch(50))<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Сколько элементов рабочий поток обрабатывает за один заход, прежде чем взять ещё<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Сколько рабочих потоков выполняются одновременно<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Сколько элементов разрешено обработать всему конвейеру<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Число процессорных ядер, которые может использовать программа<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — это <strong>размер порции<\/strong>: сколько элементов рабочий поток берёт за раз.<\/span> <span class=\"sg\" data-s=\"1\">Число рабочих потоков задаёт <code>:degree<\/code> (здесь <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Большая пачка снижает издержки координации, маленькая — равномернее распределяет неравную работу.<\/span> <span class=\"sg\" data-s=\"3\">И то и другое — подсказки, которые компилятор может подправить или проигнорировать.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — batch і degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">У <code>(1..1000).hyper(:degree(4), :batch(50))<\/code> — чим керує <code>:batch(50)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Скільки елементів кожен робітник обробляє за один захід, перш ніж узяти наступні<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Скільки робочих потоків працюють одночасно<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Скільки елементів дозволено обробити всьому конвеєру<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Кількість ядер процесора, які програма може використати<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> — це <strong>розмір порції<\/strong>, тобто скільки елементів робітник бере за один хід.<\/span> <span class=\"sg\" data-s=\"1\">Кількість робітників задає <code>:degree<\/code> (тут <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Більша порція зменшує накладні витрати на координацію; менша рівномірніше балансує нерівномірну роботу.<\/span> <span class=\"sg\" data-s=\"3\">Обидва є підказками, які компілятор може скоригувати чи проігнорувати.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — batch и degree","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В <code>(1..1000).hyper(:degree(4), :batch(50))<\/code> — какво управлява <code>:batch(50)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">По колко елемента обработва всеки работник наведнъж, преди да вземе още<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Колко работни нишки вървят едновременно<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Колко елемента има право да обработи целият конвейер<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Броя процесорни ядра, които програмата може да използва<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>:batch<\/code> е <strong>размерът на порцията<\/strong> — по колко елемента взема работникът на един ход.<\/span> <span class=\"sg\" data-s=\"1\">Броят на работниците се задава от <code>:degree<\/code> (тук <code>4<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">По-голяма порция намалява разходите за координация; по-малка балансира по-добре неравномерната работа.<\/span> <span class=\"sg\" data-s=\"3\">И двете са подсказки, които компилаторът може да коригира или пренебрегне.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
