<script type="application/json" id="page-data">{"u":"paradigms/hyper-race/hyper","n":1316,"k":"topic","pv":"paradigms/hyper-race","nx":"paradigms/hyper-race/hyper/quiz","tr":["paradigms","paradigms/hyper-race"],"L":{"en":{"t":"Parallel maps with hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Call <code>.hyper<\/code> on a list before a <code>map<\/code> or <code>grep<\/code>, and the work is spread across multiple worker threads — while the results still come back in the <strong>original order<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This looks exactly like an ordinary <code>map<\/code>, and the result is identical; the only difference is that the doublings may have been computed on different cores at the same time.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> works with <code>grep<\/code> in just the same way — each element is tested in parallel, and the ones that pass still come back in their original order:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Because <code>.hyper<\/code> preserves order, it is a drop-in replacement for a slow <code>map<\/code> or <code>grep<\/code>: nothing that depends on the order of the results has to change.<\/span> <span class=\"sg\" data-s=\"1\">The benefit only appears when each element’s work is large enough to outweigh the cost of coordinating threads — squaring a number is far too cheap to be worth parallelising in reality.<\/span> <span class=\"sg\" data-s=\"2\">For genuinely expensive per-element work over a big list, <code>.hyper<\/code> can turn a long wait into a short one for the price of a single method call.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">One thing to keep in mind: whether the work is <em>really<\/em> spread across cores is up to the compiler.<\/span> <span class=\"sg\" data-s=\"1\">The language fixes the results — and, for <code>.hyper<\/code>, their original order — but it does not demand actual parallel execution.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> and <code>.race<\/code> <strong>request<\/strong> parallelism rather than require it, so a given compiler may run them on a pool of threads or may quietly process the elements in sequence.<\/span> <span class=\"sg\" data-s=\"3\">Treat them as an opportunity for a speed-up, not a guarantee of one.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because the order is kept, operations that <em>depend<\/em> on it still come out right.<\/span> <span class=\"sg\" data-s=\"1\">Here each word is upper-cased in parallel, yet the pieces join back into the phrase in their original sequence:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"de":{"t":"Parallele Maps mit hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Rufen Sie <code>.hyper<\/code> vor einem <code>map<\/code> oder <code>grep<\/code> auf einer Liste auf, und die Arbeit verteilt sich über mehrere Arbeits-Threads — während die Ergebnisse dennoch in der <strong>ursprünglichen Reihenfolge<\/strong> zurückkommen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das sieht genau aus wie ein gewöhnliches <code>map<\/code>, und das Ergebnis ist gleich; der einzige Unterschied ist, dass die Verdopplungen womöglich zugleich auf verschiedenen Kernen berechnet wurden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> arbeitet mit <code>grep<\/code> genauso — jedes Element wird parallel geprüft, und die bestandenen kommen dennoch in ihrer ursprünglichen Reihenfolge zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Da <code>.hyper<\/code> die Reihenfolge bewahrt, ist es ein unmittelbarer Ersatz für ein langsames <code>map<\/code> oder <code>grep<\/code>: Nichts, was von der Reihenfolge der Ergebnisse abhängt, muss sich ändern.<\/span> <span class=\"sg\" data-s=\"1\">Der Gewinn zeigt sich erst, wenn die Arbeit je Element groß genug ist, um die Kosten der Thread-Koordination aufzuwiegen — eine Zahl zu quadrieren ist in Wirklichkeit viel zu billig, um es zu parallelisieren.<\/span> <span class=\"sg\" data-s=\"2\">Für wirklich aufwendige Arbeit je Element über eine große Liste kann <code>.hyper<\/code> ein langes Warten für den Preis eines einzigen Methodenaufrufs in ein kurzes verwandeln.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eines ist zu bedenken: Ob die Arbeit <em>tatsächlich<\/em> über Kerne verteilt wird, entscheidet der Compiler.<\/span> <span class=\"sg\" data-s=\"1\">Die Sprache legt die Ergebnisse fest — und für <code>.hyper<\/code> ihre ursprüngliche Reihenfolge —, verlangt aber keine wirkliche parallele Ausführung.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> und <code>.race<\/code> <strong>bitten<\/strong> um Parallelität, statt sie zu fordern, ein gegebener Compiler darf sie also auf einem Threadpool ausführen oder die Elemente still der Reihe nach abarbeiten.<\/span> <span class=\"sg\" data-s=\"3\">Betrachten Sie sie als Gelegenheit zur Beschleunigung, nicht als Zusicherung einer solchen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Weil die Reihenfolge bewahrt bleibt, kommen auch Operationen richtig heraus, die <em>von ihr abhängen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Hier wird jedes Wort parallel großgeschrieben, und dennoch fügen sich die Stücke in ihrer ursprünglichen Reihenfolge wieder zum Satz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"nl":{"t":"Parallelle maps met hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Roep <code>.hyper<\/code> op een lijst aan vóór een <code>map<\/code> of <code>grep<\/code>, en het werk wordt over meerdere werkthreads verspreid — terwijl de resultaten toch in de <strong>oorspronkelijke volgorde<\/strong> terugkomen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit ziet er precies uit als een gewone <code>map<\/code>, en het resultaat is identiek; het enige verschil is dat de verdubbelingen mogelijk tegelijk op verschillende kernen berekend zijn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> werkt op dezelfde manier met <code>grep<\/code> — elk element wordt parallel getest, en de elementen die slagen komen toch in hun oorspronkelijke volgorde terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>.hyper<\/code> de volgorde bewaart, is het een rechtstreekse vervanger voor een trage <code>map<\/code> of <code>grep<\/code>: niets wat van de volgorde van de resultaten afhangt hoeft te veranderen.<\/span> <span class=\"sg\" data-s=\"1\">Het voordeel treedt pas op wanneer het werk per element groot genoeg is om tegen de kosten van het coördineren van threads op te wegen — een getal kwadrateren is in werkelijkheid veel te goedkoop om te parallelliseren.<\/span> <span class=\"sg\" data-s=\"2\">Voor werkelijk duur werk per element over een grote lijst kan <code>.hyper<\/code> een lange wachttijd in een korte veranderen voor de prijs van één methodeaanroep.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eén ding om in gedachten te houden: of het werk <em>werkelijk<\/em> over kernen verspreid wordt, is aan de compiler.<\/span> <span class=\"sg\" data-s=\"1\">De taal legt de resultaten vast — en voor <code>.hyper<\/code> hun oorspronkelijke volgorde — maar zij eist geen daadwerkelijke parallelle uitvoering.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> en <code>.race<\/code> <strong>vragen<\/strong> om parallellisme in plaats van het te vereisen, dus een bepaalde compiler mag ze op een threadpool draaien of de elementen stilletjes op volgorde verwerken.<\/span> <span class=\"sg\" data-s=\"3\">Beschouw ze als een kans op versnelling, niet als een garantie ervan.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat de volgorde bewaard blijft, komen bewerkingen die er <em>van afhangen<\/em> toch goed uit.<\/span> <span class=\"sg\" data-s=\"1\">Hier wordt elk woord parallel in hoofdletters gezet, en toch voegen de stukken zich in hun oorspronkelijke volgorde weer tot de zin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"es":{"t":"map en paralelo con hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Llama a <code>.hyper<\/code> sobre una lista antes de un <code>map<\/code> o un <code>grep<\/code> y el trabajo se reparte entre varios hilos trabajadores, mientras que los resultados siguen volviendo en el <strong>orden original<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto se parece exactamente a un <code>map<\/code> corriente, y el resultado es idéntico; la única diferencia es que las duplicaciones pueden haberse calculado en núcleos distintos al mismo tiempo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> funciona con <code>grep<\/code> exactamente igual: cada elemento se comprueba en paralelo, y los que pasan siguen volviendo en su orden original:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Como <code>.hyper<\/code> preserva el orden, es un sustituto directo de un <code>map<\/code> o un <code>grep<\/code> lento: no hay que cambiar nada que dependa del orden de los resultados.<\/span> <span class=\"sg\" data-s=\"1\">El beneficio solo aparece cuando el trabajo de cada elemento es lo bastante grande como para compensar el coste de coordinar hilos; elevar un número al cuadrado es, en realidad, demasiado barato para que merezca la pena paralelizarlo.<\/span> <span class=\"sg\" data-s=\"2\">Para un trabajo genuinamente caro por elemento sobre una lista grande, <code>.hyper<\/code> puede convertir una espera larga en una corta al precio de una sola llamada a un método.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una cosa que conviene tener presente: que el trabajo se reparta <em>de verdad<\/em> entre los núcleos es cosa del compilador.<\/span> <span class=\"sg\" data-s=\"1\">El lenguaje fija los resultados — y, para <code>.hyper<\/code>, su orden original —, pero no exige una ejecución realmente paralela.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> y <code>.race<\/code> <strong>solicitan<\/strong> paralelismo en lugar de exigirlo, así que un compilador dado puede ejecutarlos en un pool de hilos o puede procesar calladamente los elementos en secuencia.<\/span> <span class=\"sg\" data-s=\"3\">Tómalos como una oportunidad de acelerar, no como una garantía de ello.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como el orden se conserva, las operaciones que <em>dependen<\/em> de él siguen saliendo bien.<\/span> <span class=\"sg\" data-s=\"1\">Aquí cada palabra se pasa a mayúsculas en paralelo y, aun así, las piezas se vuelven a unir en la frase en su secuencia original:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"it":{"t":"map in parallelo con hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Chiama <code>.hyper<\/code> su un elenco prima di un <code>map<\/code> o di un <code>grep<\/code>, e il lavoro viene distribuito su più thread lavoratori — mentre i risultati tornano comunque nell'<strong>ordine originale<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sembra esattamente un <code>map<\/code> ordinario, e il risultato è identico; l'unica differenza è che i raddoppi possono essere stati calcolati su core diversi nello stesso momento.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> funziona con <code>grep<\/code> esattamente allo stesso modo: ogni elemento viene messo alla prova in parallelo, e quelli che passano tornano comunque nel loro ordine originale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>.hyper<\/code> preserva l'ordine, è un sostituto immediato di un <code>map<\/code> o <code>grep<\/code> lento: nulla che dipenda dall'ordine dei risultati deve cambiare.<\/span> <span class=\"sg\" data-s=\"1\">Il vantaggio compare solo quando il lavoro su ciascun elemento è abbastanza grande da superare il costo del coordinamento fra thread — elevare al quadrato un numero è in realtà troppo poco costoso perché valga la pena parallelizzarlo.<\/span> <span class=\"sg\" data-s=\"2\">Per lavoro davvero costoso per elemento su un elenco grande, <code>.hyper<\/code> può trasformare una lunga attesa in una breve al prezzo di una singola chiamata di metodo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una cosa da tenere a mente: se il lavoro venga <em>davvero<\/em> distribuito sui core dipende dal compilatore.<\/span> <span class=\"sg\" data-s=\"1\">Il linguaggio fissa i risultati — e, per <code>.hyper<\/code>, il loro ordine originale — ma non pretende un'esecuzione realmente parallela.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> e <code>.race<\/code> <strong>richiedono<\/strong> il parallelismo invece di esigerlo, quindi un dato compilatore può eseguirli su un pool di thread oppure elaborare gli elementi in sequenza senza dirlo.<\/span> <span class=\"sg\" data-s=\"3\">Trattali come un'occasione di accelerazione, non come una garanzia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché l'ordine viene mantenuto, le operazioni che <em>dipendono<\/em> da esso continuano a venire giuste.<\/span> <span class=\"sg\" data-s=\"1\">Qui ogni parola viene resa maiuscola in parallelo, eppure i pezzi si riuniscono nella frase nella loro sequenza originale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"lv":{"t":"Paralēls map ar hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Izsauciet sarakstam <code>.hyper<\/code> pirms <code>map<\/code> vai <code>grep<\/code>, un darbs tiks izklaidīts pa vairākiem darbapavedieniem — kamēr rezultāti joprojām atgriežas <strong>sākotnējā secībā<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izskatās tieši tāpat kā parasts <code>map<\/code>, un rezultāts ir identisks; vienīgā atšķirība ir tā, ka dubultošana var būt aprēķināta dažādos kodolos vienlaikus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> tieši tāpat darbojas ar <code>grep<\/code> — katrs elements tiek pārbaudīts paralēli, un tie, kas iziet cauri, joprojām atgriežas savā sākotnējā secībā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>.hyper<\/code> saglabā secību, tā ir tieša aizstājēja lēnam <code>map<\/code> vai <code>grep<\/code>: nekas, kas ir atkarīgs no rezultātu secības, nav jāmaina.<\/span> <span class=\"sg\" data-s=\"1\">Ieguvums parādās tikai tad, kad darbs ar katru elementu ir pietiekami liels, lai atsvērtu pavedienu saskaņošanas izmaksas — skaitļa kāpināšana kvadrātā īstenībā ir pārāk lēta, lai to būtu vērts paralelizēt.<\/span> <span class=\"sg\" data-s=\"2\">Tiešām dārgam darbam ar katru elementu lielā sarakstā <code>.hyper<\/code> par viena metodes izsaukuma cenu var pārvērst garu gaidīšanu īsā.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Viena lieta, kas jāpatur prātā: vai darbs <em>tiešām<\/em> tiek izklaidīts pa kodoliem, izlemj kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Valoda nosaka rezultātus — un <code>.hyper<\/code> gadījumā to sākotnējo secību —, bet nepieprasa īstu paralēlu izpildi.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> un <code>.race<\/code> paralēlismu <strong>pieprasa<\/strong> kā lūgumu, nevis kā prasību, tāpēc konkrēts kompilators tos var izpildīt pavedienu baseinā vai arī klusi apstrādāt elementus pēc kārtas.<\/span> <span class=\"sg\" data-s=\"3\">Uztveriet tos kā iespēju paātrināties, nevis kā garantiju.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā secība tiek saglabāta, darbības, kas no tās <em>ir atkarīgas<\/em>, joprojām iznāk pareizi.<\/span> <span class=\"sg\" data-s=\"1\">Šeit katrs vārds tiek paralēli pārvērsts lielajos burtos, un tomēr gabali savienojas atpakaļ frāzē to sākotnējā secībā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"ru":{"t":"Параллельный map с hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вызовите <code>.hyper<\/code> у списка перед <code>map<\/code> или <code>grep<\/code> — и работа распределится между несколькими рабочими потоками, а результаты всё равно вернутся в <strong>исходном порядке<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Выглядит это в точности как обычный <code>map<\/code>, и результат тот же самый; разница лишь в том, что удвоения могли быть вычислены одновременно на разных ядрах.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>grep<\/code> метод <code>.hyper<\/code> работает точно так же: каждый элемент проверяется параллельно, а прошедшие проверку всё равно возвращаются в исходном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>.hyper<\/code> сохраняет порядок, он служит прямой заменой медленному <code>map<\/code> или <code>grep<\/code>: ничего из того, что зависит от порядка результатов, менять не придётся.<\/span> <span class=\"sg\" data-s=\"1\">Выигрыш появляется только тогда, когда работа над каждым элементом достаточно велика, чтобы перевесить издержки на координацию потоков, — возведение числа в квадрат в реальности слишком дёшево, чтобы его имело смысл распараллеливать.<\/span> <span class=\"sg\" data-s=\"2\">Но для по-настоящему дорогой поэлементной работы над большим списком <code>.hyper<\/code> способен превратить долгое ожидание в короткое ценой одного вызова метода.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Одно стоит помнить: <em>действительно<\/em> ли работа распределится по ядрам, решает компилятор.<\/span> <span class=\"sg\" data-s=\"1\">Язык фиксирует результаты — а для <code>.hyper<\/code> ещё и их исходный порядок, — но не требует настоящего параллельного выполнения.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> и <code>.race<\/code> <strong>запрашивают<\/strong> параллельность, а не предписывают её, поэтому конкретный компилятор может выполнить их на пуле потоков, а может тихо обработать элементы последовательно.<\/span> <span class=\"sg\" data-s=\"3\">Считайте их возможностью ускорения, а не гарантией.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку порядок сохраняется, операции, которые от него <em>зависят<\/em>, по-прежнему дают верный результат.<\/span> <span class=\"sg\" data-s=\"1\">Здесь каждое слово переводится в верхний регистр параллельно, но части складываются обратно во фразу в исходной последовательности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"uk":{"t":"Паралельні відображення з hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Викличте <code>.hyper<\/code> на списку перед <code>map<\/code> або <code>grep<\/code> — і роботу буде розподілено між кількома робочими потоками, тоді як результати все одно повернуться в <strong>початковому порядку<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це має вигляд звичайного <code>map<\/code>, і результат ідентичний; єдина різниця в тому, що подвоєння могли обчислюватися на різних ядрах водночас.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> так само працює з <code>grep<\/code> — кожен елемент перевіряється паралельно, а ті, що пройшли, все одно повертаються в початковому порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>.hyper<\/code> зберігає порядок, він є прямою заміною повільного <code>map<\/code> чи <code>grep<\/code>: нічого, що залежить від порядку результатів, змінювати не доводиться.<\/span> <span class=\"sg\" data-s=\"1\">Виграш з'являється лише тоді, коли робота над кожним елементом достатньо велика, щоб переважити вартість координації потоків, — піднесення числа до квадрата насправді надто дешеве, щоб його варто було розпаралелювати.<\/span> <span class=\"sg\" data-s=\"2\">Для справді дорогої роботи над елементом на великому списку <code>.hyper<\/code> може перетворити довге очікування на коротке ціною одного виклику методу.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Одне варто тримати в голові: чи справді роботу буде розподілено між ядрами, вирішує компілятор.<\/span> <span class=\"sg\" data-s=\"1\">Мова фіксує результати — а для <code>.hyper<\/code> ще й їхній початковий порядок, — але не вимагає фактичного паралельного виконання.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> та <code>.race<\/code> <strong>просять<\/strong> паралельності, а не вимагають її, тож конкретний компілятор може виконати їх на пулі потоків, а може тихенько обробити елементи послідовно.<\/span> <span class=\"sg\" data-s=\"3\">Ставтеся до них як до нагоди пришвидшитися, а не до гарантії цього.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки порядок зберігається, операції, що <em>залежать<\/em> від нього, все одно виходять правильними.<\/span> <span class=\"sg\" data-s=\"1\">Тут кожне слово переводиться у верхній регістр паралельно, і все ж шматки з'єднуються назад у фразу в початковій послідовності:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"bg":{"t":"Паралелни отображения с hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикайте <code>.hyper<\/code> върху списък преди <code>map<\/code> или <code>grep<\/code> и работата ще бъде разпределена между няколко работни нишки — а резултатите пак ще се върнат в <strong>първоначалния ред<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това изглежда точно като обикновен <code>map<\/code> и резултатът е същият; единствената разлика е, че удвояванията може да са били изчислени на различни ядра едновременно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> работи с <code>grep<\/code> по същия начин — всеки елемент се проверява паралелно, а онези, които минат, пак се връщат в първоначалния си ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понеже <code>.hyper<\/code> запазва реда, той е пряка замяна на бавен <code>map<\/code> или <code>grep<\/code>: нищо, което зависи от реда на резултатите, не се налага да се променя.<\/span> <span class=\"sg\" data-s=\"1\">Ползата се появява само когато работата върху всеки елемент е достатъчно голяма, за да натежи над цената на координирането на нишките — повдигането на число на квадрат всъщност е твърде евтино, за да си струва да се паралелизира.<\/span> <span class=\"sg\" data-s=\"2\">За наистина скъпа работа върху елемент в голям списък <code>.hyper<\/code> може да превърне дълго чакане в кратко срещу цената на едно извикване на метод.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Едно нещо, което да имате предвид: дали работата <em>наистина<\/em> се разпределя между ядрата, зависи от компилатора.<\/span> <span class=\"sg\" data-s=\"1\">Езикът фиксира резултатите — а за <code>.hyper<\/code> и техния първоначален ред, — но не изисква действително паралелно изпълнение.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> и <code>.race<\/code> <strong>молят<\/strong> за паралелност, вместо да я изискват, така че даден компилатор може да ги изпълни върху пул от нишки, а може и тихо да обработи елементите последователно.<\/span> <span class=\"sg\" data-s=\"3\">Гледайте на тях като на възможност за ускорение, а не като на гаранция за такова.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже редът се запазва, операциите, които <em>зависят<\/em> от него, пак излизат правилни.<\/span> <span class=\"sg\" data-s=\"1\">Тук всяка дума се превръща в главни букви паралелно, а парчетата все пак се слепват обратно във фразата в първоначалната си последователност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"eo":{"t":"Paralela map per hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Voku <code>.hyper<\/code> sur listo antaŭ <code>map<\/code> aŭ <code>grep<\/code>, kaj la laboro disvastiĝas trans plurajn laborfadenojn — dum la rezultoj tamen revenas en la <strong>originala ordo<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio aspektas precize kiel ordinara <code>map<\/code>, kaj la rezulto estas identa; la sola diferenco estas, ke la duobligoj eble estis kalkulitaj sur malsamaj kernoj samtempe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> funkcias kun <code>grep<\/code> ĝuste same — ĉiu elemento estas testata paralele, kaj tiuj, kiuj trapasas, tamen revenas en sia originala ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉar <code>.hyper<\/code> konservas la ordon, ĝi estas rekta anstataŭaĵo por malrapida <code>map<\/code> aŭ <code>grep<\/code>: nenio, kio dependas de la ordo de la rezultoj, devas ŝanĝiĝi.<\/span> <span class=\"sg\" data-s=\"1\">La avantaĝo aperas nur kiam la laboro por ĉiu elemento estas sufiĉe granda por superpezi la koston de kunordigi fadenojn — kvadratigi nombron estas multe tro malmultekosta por vere indi paraleligon.<\/span> <span class=\"sg\" data-s=\"2\">Por vere multekosta laboro por ĉiu elemento sur granda listo, <code>.hyper<\/code> povas transformi longan atendon en mallongan kontraŭ la prezo de unu sola metodvoko.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unu aferon indas memori: ĉu la laboro <em>vere<\/em> disvastiĝas trans kernoj, dependas de la kompililo.<\/span> <span class=\"sg\" data-s=\"1\">La lingvo fiksas la rezultojn — kaj, por <code>.hyper<\/code>, ilian originalan ordon — sed ĝi ne postulas efektivan paralelan plenumon.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> kaj <code>.race<\/code> <strong>petas<\/strong> paralelecon prefere ol postuli ĝin, do donita kompililo povas plenumi ilin sur fadenaro aŭ povas senbrue trakti la elementojn laŭvice.<\/span> <span class=\"sg\" data-s=\"3\">Traktu ilin kiel ŝancon por rapidigo, ne kiel garantion pri ĝi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉar la ordo estas konservata, operacioj, kiuj <em>dependas<\/em> de ĝi, tamen eliras ĝuste.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie ĉiu vorto estas majuskligata paralele, kaj tamen la pecoj rekuniĝas en la frazon en sia originala sinsekvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]},"la":{"t":"map parallelum per hyper","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Voca <code>.hyper<\/code> in indice ante <code>map<\/code> vel <code>grep<\/code>, et opus per plura fila operaria diffunditur — dum effectus adhuc <strong>ordine originali<\/strong> redeunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).hyper.map(* * 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc prorsus ut <code>map<\/code> ordinarium apparet, et effectus idem est; sola differentia est quod duplicationes fortasse in nucleis diversis eodem tempore computatae sunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.hyper<\/code> cum <code>grep<\/code> eodem prorsus modo operatur — unumquodque elementum parallele probatur, et ea quae transeunt adhuc ordine originali redeunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).hyper.grep(* %% 2); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quia <code>.hyper<\/code> ordinem servat, substitutio directa est pro <code>map<\/code> vel <code>grep<\/code> tardo: nihil quod ex ordine effectuum pendet mutari debet.<\/span> <span class=\"sg\" data-s=\"1\">Emolumentum solum apparet cum opus uniuscuiusque elementi satis magnum est ut pretium fila ordinandi superet — numerum quadrare longe nimis vile est ut re vera parallelizari mereatur.<\/span> <span class=\"sg\" data-s=\"2\">Pro opere per elementum vere sumptuoso super indicem magnum, <code>.hyper<\/code> exspectationem longam in brevem vertere potest pretio unius vocationis methodi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unum tenendum: utrum opus <em>revera<\/em> per nuclea diffundatur, compilatoris est.<\/span> <span class=\"sg\" data-s=\"1\">Lingua effectus figit — et, pro <code>.hyper<\/code>, ordinem eorum originalem — sed exsecutionem parallelam actualem non postulat.<\/span> <span class=\"sg\" data-s=\"2\"><code>.hyper<\/code> et <code>.race<\/code> parallelismum <strong>rogant<\/strong> potius quam exigunt, itaque compilator quidam eas in stagno filorum currere potest vel elementa tacite in serie tractare.<\/span> <span class=\"sg\" data-s=\"3\">Eas ut occasionem accelerationis habe, non ut garantiam.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quia ordo servatur, operationes quae ex eo <em>pendent<\/em> adhuc recte exeunt.<\/span> <span class=\"sg\" data-s=\"1\">Hic unumquodque verbum parallele in maiusculas vertitur, et tamen partes in locutionem ordine originali rursus iunguntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku is fun&gt;.hyper.map(*.uc).join(' '); # RAKU IS FUN<\/code><\/pre>"]]}}}</script>
