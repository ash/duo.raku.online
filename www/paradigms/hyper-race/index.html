<script type="application/json" id="page-data">{"u":"paradigms/hyper-race","n":1315,"k":"section","pv":"paradigms/channels/exercises/drain-channel/solution","nx":"paradigms/hyper-race/hyper","tr":["paradigms"],"L":{"en":{"t":"Hyper and race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The functional list operations you met earlier — <code>map<\/code> and <code>grep<\/code> — process their elements one after another.<\/span> <span class=\"sg\" data-s=\"1\">When the work on each element is independent and substantial, Raku can run it <strong>in parallel<\/strong> across several CPU cores, with almost no change to your code.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Two methods switch this on: <code>.hyper<\/code>, which keeps the results in order, and <code>.race<\/code>, which does not but can be a little faster.<\/span> <span class=\"sg\" data-s=\"1\">This section shows both.<\/span><\/p>"]]},"de":{"t":"Hyper und race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die funktionalen Listenoperationen, die Ihnen früher begegnet sind — <code>map<\/code> und <code>grep<\/code> —, verarbeiten ihre Elemente eines nach dem anderen.<\/span> <span class=\"sg\" data-s=\"1\">Ist die Arbeit an jedem Element unabhängig und erheblich, kann Raku sie <strong>parallel<\/strong> über mehrere CPU-Kerne ausführen, fast ohne Änderung an Ihrem Code.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zwei Methoden schalten das ein: <code>.hyper<\/code>, das die Ergebnisse in Reihenfolge hält, und <code>.race<\/code>, das das nicht tut, dafür aber ein wenig schneller sein kann.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt beide.<\/span><\/p>"]]},"nl":{"t":"Hyper en race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De functionele lijstbewerkingen die je eerder tegenkwam — <code>map<\/code> en <code>grep<\/code> — verwerken hun elementen na elkaar.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer het werk aan elk element onafhankelijk en substantieel is, kan Raku het <strong>parallel<\/strong> over meerdere CPU-kernen draaien, met vrijwel geen wijziging in je code.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Twee methoden zetten dat aan: <code>.hyper<\/code>, die de resultaten op volgorde houdt, en <code>.race<\/code>, die dat niet doet maar iets sneller kan zijn.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie toont beide.<\/span><\/p>"]]},"es":{"t":"hyper y race 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Las operaciones funcionales sobre listas que conociste antes — <code>map<\/code> y <code>grep<\/code> — procesan sus elementos uno tras otro.<\/span> <span class=\"sg\" data-s=\"1\">Cuando el trabajo sobre cada elemento es independiente y sustancial, Raku puede ejecutarlo <strong>en paralelo<\/strong> repartido entre varios núcleos de CPU, casi sin cambiar tu código.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dos métodos lo activan: <code>.hyper<\/code>, que mantiene los resultados en orden, y <code>.race<\/code>, que no lo hace pero puede ser algo más rápido.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección muestra ambos.<\/span><\/p>"]]},"it":{"t":"hyper e race 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Le operazioni funzionali su elenchi che hai incontrato prima — <code>map<\/code> e <code>grep<\/code> — elaborano i loro elementi uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"1\">Quando il lavoro su ciascun elemento è indipendente e consistente, Raku può eseguirlo <strong>in parallelo<\/strong> su più core della CPU, quasi senza cambiare il tuo codice.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Due metodi lo accendono: <code>.hyper<\/code>, che tiene i risultati in ordine, e <code>.race<\/code>, che non lo fa ma può essere un po' più veloce.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra entrambi.<\/span><\/p>"]]},"ru":{"t":"hyper и race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Функциональные операции над списками, с которыми вы познакомились раньше, — <code>map<\/code> и <code>grep<\/code> — обрабатывают элементы один за другим.<\/span> <span class=\"sg\" data-s=\"1\">Когда работа над каждым элементом независима и достаточно объёмна, Raku может выполнить её <strong>параллельно<\/strong> на нескольких ядрах процессора, почти не требуя изменений в коде.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Включают это два метода: <code>.hyper<\/code>, который сохраняет порядок результатов, и <code>.race<\/code>, который его не сохраняет, но может работать чуть быстрее.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе показаны оба.<\/span><\/p>"]]},"uk":{"t":"Hyper і race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Функційні операції над списками, з якими ви зустрічалися раніше, — <code>map<\/code> та <code>grep<\/code> — обробляють свої елементи один за одним.<\/span> <span class=\"sg\" data-s=\"1\">Коли робота над кожним елементом незалежна й вагома, Raku може виконувати її <strong>паралельно<\/strong> на кількох ядрах процесора, майже без змін у вашому коді.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Умикають це два методи: <code>.hyper<\/code>, що зберігає порядок результатів, і <code>.race<\/code>, що його не зберігає, зате може бути трохи швидшим.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує обидва.<\/span><\/p>"]]},"bg":{"t":"Hyper и race","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Функционалните операции върху списъци, които срещнахте по-рано — <code>map<\/code> и <code>grep<\/code> — обработват елементите си един след друг.<\/span> <span class=\"sg\" data-s=\"1\">Когато работата върху всеки елемент е независима и съществена, Raku може да я изпълни <strong>паралелно<\/strong> върху няколко процесорни ядра, почти без промяна в кода ви.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това се включва с два метода: <code>.hyper<\/code>, който запазва реда на резултатите, и <code>.race<\/code>, който не го запазва, но може да е малко по-бърз.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва и двата.<\/span><\/p>"]]}}}</script>
