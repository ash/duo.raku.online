<script type="application/json" id="page-data">{"u":"paradigms/http-server/listening","n":1391,"k":"topic","pv":"paradigms/http-server","nx":"paradigms/http-server/listening/quiz","tr":["paradigms","paradigms/http-server"],"L":{"en":{"t":"Listening for connections","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">To act as a server, create a socket in <strong>listening<\/strong> mode with the <code>:listen<\/code> argument, giving the address and port to listen on:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> listens on your own machine, and <code>:localport(8080)<\/code> is the port clients must connect to.<\/span> <span class=\"sg\" data-s=\"1\">The socket is now waiting, but no client has arrived yet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To take the next incoming connection, call <code>.accept<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It <strong>blocks<\/strong> until a client connects, then returns a fresh socket representing that one conversation:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>$listener<\/code> keeps listening for more clients, while <code>$conn<\/code> is your channel to talk to this particular one.<\/span> <span class=\"sg\" data-s=\"1\">A real server calls <code>.accept<\/code> in a loop, handling each client as it arrives.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">These examples run on your own machine; connect to them from a browser or another program at <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So a server is just a socket turned around: instead of <code>:host<\/code>/<code>:port<\/code> to dial out, you give <code>:listen<\/code> with <code>:localhost<\/code>/<code>:localport<\/code> to wait for calls in.<\/span><\/p>"]]},"de":{"t":"Auf Verbindungen lauschen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Um als Server aufzutreten, erzeugen Sie einen Socket im <strong>Lauschmodus<\/strong> mit dem Argument <code>:listen<\/code> und geben Adresse und Port an, auf denen gelauscht werden soll:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> lauscht auf Ihrer eigenen Maschine, und <code>:localport(8080)<\/code> ist der Port, mit dem sich Clients verbinden müssen.<\/span> <span class=\"sg\" data-s=\"1\">Der Socket wartet nun, aber noch ist kein Client eingetroffen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um die nächste hereinkommende Verbindung anzunehmen, rufen Sie <code>.accept<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Es <strong>blockiert<\/strong>, bis sich ein Client verbindet, und liefert dann einen frischen Socket, der dieses eine Gespräch darstellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>$listener<\/code> lauscht weiter auf weitere Clients, während <code>$conn<\/code> Ihr Kanal ist, um mit diesem bestimmten zu sprechen.<\/span> <span class=\"sg\" data-s=\"1\">Ein echter Server ruft <code>.accept<\/code> in einer Schleife auf und bedient jeden Client, sobald er eintrifft.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Diese Beispiele laufen auf Ihrer eigenen Maschine; verbinden Sie sich aus einem Browser oder einem anderen Programm unter <code>127.0.0.1:8080<\/code> mit ihnen.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Server ist also schlicht ein umgedrehter Socket: Statt <code>:host<\/code>/<code>:port<\/code> zum Hinauswählen geben Sie <code>:listen<\/code> mit <code>:localhost<\/code>/<code>:localport<\/code>, um auf Anrufe zu warten.<\/span><\/p>"]]},"nl":{"t":"Op verbindingen luisteren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Om als server op te treden, maak je een socket in <strong>luistermodus<\/strong> met het argument <code>:listen<\/code>, met opgave van het adres en de poort waarop geluisterd moet worden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> luistert op je eigen machine, en <code>:localport(8080)<\/code> is de poort waarmee clients verbinding moeten maken.<\/span> <span class=\"sg\" data-s=\"1\">De socket wacht nu, maar er is nog geen client aangekomen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om de volgende binnenkomende verbinding aan te nemen, roep je <code>.accept<\/code> aan.<\/span> <span class=\"sg\" data-s=\"1\">Dat <strong>blokkeert<\/strong> tot een client verbinding maakt en geeft daarna een verse socket terug die dat ene gesprek voorstelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>$listener<\/code> blijft naar meer clients luisteren, terwijl <code>$conn<\/code> je kanaal is om met deze bepaalde client te praten.<\/span> <span class=\"sg\" data-s=\"1\">Een echte server roept <code>.accept<\/code> in een lus aan en handelt elke client af zodra die binnenkomt.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Deze voorbeelden draaien op je eigen machine; maak er vanuit een browser of een ander programma verbinding mee op <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een server is dus gewoon een omgekeerde socket: in plaats van <code>:host<\/code>/<code>:port<\/code> om uit te bellen, geef je <code>:listen<\/code> met <code>:localhost<\/code>/<code>:localport<\/code> om op inkomende oproepen te wachten.<\/span><\/p>"]]},"es":{"t":"Escuchar conexiones","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Para actuar como servidor, crea un socket en modo <strong>de escucha<\/strong> con el argumento <code>:listen<\/code>, dando la dirección y el puerto en los que escuchar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> escucha en tu propia máquina, y <code>:localport(8080)<\/code> es el puerto al que deben conectarse los clientes.<\/span> <span class=\"sg\" data-s=\"1\">El socket está ya esperando, pero aún no ha llegado ningún cliente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para tomar la siguiente conexión entrante, llama a <code>.accept<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Se bloquea<\/strong> hasta que un cliente conecta, y devuelve entonces un socket nuevo que representa esa conversación concreta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>$listener<\/code> sigue escuchando en busca de más clientes, mientras que <code>$conn<\/code> es tu canal para hablar con este en particular.<\/span> <span class=\"sg\" data-s=\"1\">Un servidor real llama a <code>.accept<\/code> en un bucle, atendiendo a cada cliente según llega.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Estos ejemplos se ejecutan en tu propia máquina; conéctate a ellos desde un navegador u otro programa en <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así que un servidor no es más que un socket dado la vuelta: en lugar de <code>:host<\/code>/<code>:port<\/code> para llamar hacia fuera, das <code>:listen<\/code> con <code>:localhost<\/code>/<code>:localport<\/code> para esperar llamadas de entrada.<\/span><\/p>"]]},"it":{"t":"Restare in ascolto di connessioni","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Per fare da server, crea un socket in modalità di <strong>ascolto<\/strong> con l'argomento <code>:listen<\/code>, indicando l'indirizzo e la porta su cui ascoltare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> ascolta sulla tua macchina, e <code>:localport(8080)<\/code> è la porta a cui i client devono connettersi.<\/span> <span class=\"sg\" data-s=\"1\">Il socket sta ora aspettando, ma nessun client è ancora arrivato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per prendere la connessione in arrivo successiva, chiama <code>.accept<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Blocca<\/strong> finché un client non si connette, poi restituisce un socket fresco che rappresenta quella singola conversazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>$listener<\/code> continua ad ascoltare altri client, mentre <code>$conn<\/code> è il tuo canale per parlare con questo in particolare.<\/span> <span class=\"sg\" data-s=\"1\">Un server vero chiama <code>.accept<\/code> in un ciclo, gestendo ogni client man mano che arriva.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questi esempi girano sulla tua macchina; raggiungili da un browser o da un altro programma a <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi un server è solo un socket girato al contrario: invece di <code>:host<\/code>/<code>:port<\/code> per chiamare fuori, dai <code>:listen<\/code> con <code>:localhost<\/code>/<code>:localport<\/code> per aspettare le chiamate in entrata.<\/span><\/p>"]]},"ru":{"t":"Ожидание соединений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы выступить сервером, создайте сокет в режиме <strong>ожидания<\/strong> с аргументом <code>:listen<\/code>, указав адрес и порт, на которых слушать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> означает ожидание на вашей собственной машине, а <code>:localport(8080)<\/code> — порт, к которому должны подключаться клиенты.<\/span> <span class=\"sg\" data-s=\"1\">Сокет теперь ждёт, но ни один клиент ещё не пришёл.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы принять очередное входящее соединение, вызовите <code>.accept<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он <strong>блокирует<\/strong> выполнение, пока клиент не подключится, и затем возвращает новый сокет, представляющий именно этот разговор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$listener<\/code> продолжает ждать других клиентов, а <code>$conn<\/code> — ваш канал для общения именно с этим.<\/span> <span class=\"sg\" data-s=\"1\">Настоящий сервер вызывает <code>.accept<\/code> в цикле, обрабатывая каждого клиента по мере его прихода.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Эти примеры работают на вашей машине; подключайтесь к ним браузером или другой программой по адресу <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Итак, сервер — это просто развёрнутый сокет: вместо <code>:host<\/code>/<code>:port<\/code> для исходящего звонка вы даёте <code>:listen<\/code> с <code>:localhost<\/code>/<code>:localport<\/code>, чтобы ждать входящих.<\/span><\/p>"]]},"uk":{"t":"Слухання з'єднань","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб діяти як сервер, створіть сокет у режимі <strong>слухання<\/strong> з аргументом <code>:listen<\/code>, задавши адресу й порт, які слухати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> слухає на вашій власній машині, а <code>:localport(8080)<\/code> — це порт, до якого мають приєднуватися клієнти.<\/span> <span class=\"sg\" data-s=\"1\">Сокет тепер чекає, але жоден клієнт іще не прийшов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб узяти наступне вхідне з'єднання, викличте <code>.accept<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він <strong>блокує<\/strong> виконання, аж поки не приєднається клієнт, а тоді повертає свіжий сокет, що представляє саме цю розмову:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$listener<\/code> і далі слухає нових клієнтів, тоді як <code>$conn<\/code> є вашим каналом для розмови з цим конкретним.<\/span> <span class=\"sg\" data-s=\"1\">Справжній сервер викликає <code>.accept<\/code> у циклі, обробляючи кожного клієнта в міру його прибуття.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ці приклади запускають на вашій власній машині; приєднуйтеся до них із браузера чи іншої програми за адресою <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отже, сервер — це просто повернутий навпаки сокет: замість <code>:host<\/code>/<code>:port<\/code>, щоб набрати назовні, ви даєте <code>:listen<\/code> разом із <code>:localhost<\/code>/<code>:localport<\/code>, щоб чекати на дзвінки всередину.<\/span><\/p>"]]},"bg":{"t":"Слушане за връзки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За да действате като сървър, създайте сокет в режим на <strong>слушане<\/strong> с аргумента <code>:listen<\/code>, като зададете адреса и порта, на които да слуша:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>:localhost('127.0.0.1')<\/code> слуша на вашата собствена машина, а <code>:localport(8080)<\/code> е портът, към който клиентите трябва да се свързват.<\/span> <span class=\"sg\" data-s=\"1\">Сокетът вече чака, но още никой клиент не е дошъл.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да вземете следващата входяща връзка, извикайте <code>.accept<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той <strong>блокира<\/strong>, докато не се свърже клиент, а после връща нов сокет, представящ точно този разговор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = $listener.accept;\nsay 'a client connected';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$listener<\/code> продължава да слуша за още клиенти, докато <code>$conn<\/code> е вашият канал за разговор с този конкретен.<\/span> <span class=\"sg\" data-s=\"1\">Истинският сървър извиква <code>.accept<\/code> в цикъл, обслужвайки всеки клиент в момента на пристигането му.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тези примери се изпълняват на вашата собствена машина; свързвайте се към тях от браузър или друга програма на адрес <code>127.0.0.1:8080<\/code>.<\/span><\/blockquote>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значи сървърът е просто обърнат сокет: вместо <code>:host<\/code>/<code>:port<\/code>, за да наберете навън, задавате <code>:listen<\/code> заедно с <code>:localhost<\/code>/<code>:localport<\/code>, за да чакате обаждания навътре.<\/span><\/p>"]]}}}</script>
