<script type="application/json" id="page-data">{"u":"paradigms/http-server/responding","n":1393,"k":"topic","pv":"paradigms/http-server/listening/quiz","nx":"paradigms/http-server/serving-requests","tr":["paradigms","paradigms/http-server"],"L":{"en":{"t":"Responding to a request","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Once a client has connected, you read its request and send a response.<\/span> <span class=\"sg\" data-s=\"1\">For a web browser, the response must be valid HTTP: a status line, optional headers, a blank line, and then the body.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The response mirrors the request format you saw on the client side.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> is the status line, <code>Content-Type: text/plain<\/code> is a header, the blank line (<code>\\r\\n\\r\\n<\/code>) ends the headers, and <code>Hello, web!<\/code> is the body the browser displays.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run this program, then hit it from another terminal with <code>curl<\/code> (or open <code>http://127.0.0.1:8080/<\/code> in a browser), and it prints the body straight to the screen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This handles a single request and then stops.<\/span> <span class=\"sg\" data-s=\"1\">To serve many requests, you would wrap the <code>.accept<\/code>-read-respond steps in a loop, and typically handle each connection on its own thread or promise so that slow clients do not block the others.<\/span> <span class=\"sg\" data-s=\"2\">But the essence of a web server is exactly this: accept a connection, read the request, write an HTTP response.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <a href=\"/paradigms/http-server/serving-requests/\">next page<\/a> does exactly that — a server that stays alive, looping to answer one request after another instead of stopping after the first.<\/span><\/p>"]]},"de":{"t":"Auf eine Anfrage antworten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sobald ein Client sich verbunden hat, lesen Sie seine Anfrage und senden eine Antwort.<\/span> <span class=\"sg\" data-s=\"1\">Für einen Webbrowser muss die Antwort gültiges HTTP sein: eine Statuszeile, wahlweise Header, eine leere Zeile und dann der Rumpf.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Antwort spiegelt das Anfrageformat wider, das Sie auf der Clientseite gesehen haben.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> ist die Statuszeile, <code>Content-Type: text/plain<\/code> ist ein Header, die leere Zeile (<code>\\r\\n\\r\\n<\/code>) beendet die Header, und <code>Hello, web!<\/code> ist der Rumpf, den der Browser anzeigt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Führen Sie dieses Programm aus und sprechen Sie es dann aus einem anderen Terminal mit <code>curl<\/code> an (oder öffnen Sie <code>http://127.0.0.1:8080/<\/code> in einem Browser), und es gibt den Rumpf unmittelbar auf dem Bildschirm aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das bedient eine einzelne Anfrage und hört dann auf.<\/span> <span class=\"sg\" data-s=\"1\">Um viele Anfragen zu bedienen, würden Sie die Schritte <code>.accept<\/code>-lesen-antworten in eine Schleife hüllen und meist jede Verbindung auf einem eigenen Thread oder Promise abwickeln, damit langsame Clients die anderen nicht aufhalten.<\/span> <span class=\"sg\" data-s=\"2\">Doch das Wesen eines Webservers ist genau dies: eine Verbindung annehmen, die Anfrage lesen, eine HTTP-Antwort schreiben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <a href=\"https://course.raku.org/de/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">nächste Seite<\/a> tut genau das — ein Server, der am Leben bleibt und in einer Schleife eine Anfrage nach der anderen beantwortet, statt nach der ersten aufzuhören.<\/span><\/p>"]]},"nl":{"t":"Op een verzoek antwoorden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zodra een client verbinding gemaakt heeft, lees je zijn verzoek en stuur je een antwoord.<\/span> <span class=\"sg\" data-s=\"1\">Voor een webbrowser moet het antwoord geldig HTTP zijn: een statusregel, eventuele headers, een lege regel, en daarna de body.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het antwoord weerspiegelt het verzoekformaat dat je aan de clientkant zag.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> is de statusregel, <code>Content-Type: text/plain<\/code> is een header, de lege regel (<code>\\r\\n\\r\\n<\/code>) beëindigt de headers, en <code>Hello, web!<\/code> is de body die de browser toont.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Draai dit programma en benader het daarna vanuit een andere terminal met <code>curl<\/code> (of open <code>http://127.0.0.1:8080/<\/code> in een browser), en het drukt de body regelrecht op het scherm af:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit handelt één enkel verzoek af en stopt daarna.<\/span> <span class=\"sg\" data-s=\"1\">Om veel verzoeken te bedienen zou je de stappen <code>.accept<\/code>-lezen-antwoorden in een lus wikkelen, en meestal elke verbinding op een eigen thread of promise afhandelen zodat trage clients de andere niet ophouden.<\/span> <span class=\"sg\" data-s=\"2\">Maar de kern van een webserver is precies dit: een verbinding aannemen, het verzoek lezen, een HTTP-antwoord schrijven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <a href=\"https://course.raku.org/nl/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">volgende pagina<\/a> doet precies dat — een server die in leven blijft en in een lus het ene verzoek na het andere beantwoordt in plaats van na het eerste te stoppen.<\/span><\/p>"]]},"es":{"t":"Responder a una petición","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una vez que un cliente ha conectado, lees su petición y envías una respuesta.<\/span> <span class=\"sg\" data-s=\"1\">Para un navegador web, la respuesta debe ser HTTP válido: una línea de estado, cabeceras opcionales, una línea en blanco y después el cuerpo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La respuesta refleja el formato de petición que viste en el lado del cliente.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> es la línea de estado, <code>Content-Type: text/plain<\/code> es una cabecera, la línea en blanco (<code>\\r\\n\\r\\n<\/code>) cierra las cabeceras, y <code>Hello, web!<\/code> es el cuerpo que el navegador muestra.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ejecuta este programa y golpéalo después desde otra terminal con <code>curl<\/code> (o abre <code>http://127.0.0.1:8080/<\/code> en un navegador), y el cuerpo se imprime directamente en la pantalla:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esto atiende una sola petición y después se detiene.<\/span> <span class=\"sg\" data-s=\"1\">Para servir muchas peticiones, envolverías los pasos de <code>.accept<\/code>, lectura y respuesta en un bucle, y normalmente atenderías cada conexión en su propio hilo o promesa para que los clientes lentos no bloqueen a los demás.<\/span> <span class=\"sg\" data-s=\"2\">Pero la esencia de un servidor web es exactamente esto: aceptar una conexión, leer la petición, escribir una respuesta HTTP.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <a href=\"https://course.raku.org/es/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">página siguiente<\/a> hace precisamente eso: un servidor que se mantiene vivo, iterando para responder una petición tras otra en lugar de detenerse tras la primera.<\/span><\/p>"]]},"it":{"t":"Rispondere a una richiesta","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una volta che un client si è connesso, leggi la sua richiesta e invii una risposta.<\/span> <span class=\"sg\" data-s=\"1\">Per un browser web la risposta deve essere HTTP valido: una riga di stato, intestazioni facoltative, una riga vuota e poi il corpo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La risposta rispecchia il formato della richiesta che hai visto dal lato client.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> è la riga di stato, <code>Content-Type: text/plain<\/code> è un'intestazione, la riga vuota (<code>\\r\\n\\r\\n<\/code>) chiude le intestazioni, e <code>Hello, web!<\/code> è il corpo che il browser mostra.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esegui questo programma, poi colpiscilo da un altro terminale con <code>curl<\/code> (o apri <code>http://127.0.0.1:8080/<\/code> in un browser), e stampa il corpo dritto sullo schermo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo gestisce una sola richiesta e poi si ferma.<\/span> <span class=\"sg\" data-s=\"1\">Per servire molte richieste avvolgeresti i passi <code>.accept<\/code>-leggi-rispondi in un ciclo, e tipicamente gestiresti ogni connessione su un proprio thread o promise così che i client lenti non blocchino gli altri.<\/span> <span class=\"sg\" data-s=\"2\">Ma l'essenza di un server web è esattamente questa: accetta una connessione, leggi la richiesta, scrivi una risposta HTTP.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <a href=\"https://course.raku.org/it/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">pagina successiva<\/a> fa proprio questo: un server che resta vivo, ciclando per rispondere a una richiesta dopo l'altra invece di fermarsi dopo la prima.<\/span><\/p>"]]},"ru":{"t":"Ответ на запрос","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда клиент подключился, вы читаете его запрос и отправляете ответ.<\/span> <span class=\"sg\" data-s=\"1\">Для веб-браузера ответ должен быть корректным HTTP: строка состояния, необязательные заголовки, пустая строка, а затем тело.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ответ повторяет формат запроса, который вы видели на стороне клиента.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> — строка состояния, <code>Content-Type: text/plain<\/code> — заголовок, пустая строка (<code>\\r\\n\\r\\n<\/code>) завершает заголовки, а <code>Hello, web!<\/code> — тело, которое отображает браузер.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите эту программу, затем постучитесь к ней из другого терминала с помощью <code>curl<\/code> (или откройте <code>http://127.0.0.1:8080/<\/code> в браузере) — и она напечатает тело прямо на экран:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Так обрабатывается один запрос, после чего программа останавливается.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы обслуживать много запросов, шаги «принять соединение — прочитать — ответить» заворачивают в цикл и обычно обрабатывают каждое соединение в отдельном потоке или промисе, чтобы медленные клиенты не задерживали остальных.<\/span> <span class=\"sg\" data-s=\"2\">Но суть веб-сервера именно в этом: принять соединение, прочитать запрос, записать HTTP-ответ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/ru/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">Следующая страница<\/a> как раз это и делает: сервер, который остаётся в живых и в цикле отвечает на запрос за запросом, а не останавливается после первого.<\/span><\/p>"]]},"uk":{"t":"Відповідь на запит","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щойно клієнт приєднався, ви читаєте його запит і надсилаєте відповідь.<\/span> <span class=\"sg\" data-s=\"1\">Для вебпереглядача відповідь має бути коректним HTTP: рядок стану, необов'язкові заголовки, порожній рядок, а потім тіло.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Відповідь дзеркалить той формат запиту, який ви бачили на боці клієнта.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> — це рядок стану, <code>Content-Type: text/plain<\/code> — заголовок, порожній рядок (<code>\\r\\n\\r\\n<\/code>) завершує заголовки, а <code>Hello, web!<\/code> — тіло, яке відображає браузер.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть цю програму, а потім гукніть її з іншого термінала за допомогою <code>curl<\/code> (або відкрийте <code>http://127.0.0.1:8080/<\/code> у браузері) — і вона надрукує тіло просто на екран:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це обробляє один-єдиний запит і зупиняється.<\/span> <span class=\"sg\" data-s=\"1\">Щоб обслуговувати багато запитів, ви обгорнули б кроки <code>.accept<\/code>—читання—відповідь у цикл і зазвичай обробляли б кожне з'єднання у власному потоці виконання чи обіцянці, щоб повільні клієнти не блокували інших.<\/span> <span class=\"sg\" data-s=\"2\">Але суть вебсервера — рівно в цьому: прийми з'єднання, прочитай запит, напиши HTTP-відповідь.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/uk/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">Наступна сторінка<\/a> робить саме це — сервер, що лишається живим і в циклі відповідає на запит за запитом, а не зупиняється після першого.<\/span><\/p>"]]},"bg":{"t":"Отговаряне на заявка","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щом клиент се е свързал, вие прочитате заявката му и изпращате отговор.<\/span> <span class=\"sg\" data-s=\"1\">За уеб браузър отговорът трябва да е валиден HTTP: ред за състояние, незадължителни заглавки, празен ред и после тялото.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $conn = $listener.accept;\nmy $request = $conn.recv;\n\n$conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\nHello, web!\\n\");\n$conn.close;\n$listener.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отговорът огледално повтаря формата на заявката, която видяхте от страна на клиента.<\/span> <span class=\"sg\" data-s=\"1\"><code>HTTP/1.0 200 OK<\/code> е редът за състояние, <code>Content-Type: text/plain<\/code> е заглавка, празният ред (<code>\\r\\n\\r\\n<\/code>) завършва заглавките, а <code>Hello, web!<\/code> е тялото, което браузърът показва.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изпълнете тази програма, после я викнете от друг терминал с <code>curl<\/code> (или отворете <code>http://127.0.0.1:8080/<\/code> в браузър) и тя отпечатва тялото направо на екрана:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello, web!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това обработва една-единствена заявка и спира.<\/span> <span class=\"sg\" data-s=\"1\">За да обслужвате много заявки, бихте обвили стъпките <code>.accept<\/code>—четене—отговор в цикъл и обикновено бихте обработвали всяка връзка в собствена нишка или обещание, за да не блокират бавните клиенти останалите.<\/span> <span class=\"sg\" data-s=\"2\">Но същността на уеб сървъра е точно това: приеми връзка, прочети заявката, напиши HTTP отговор.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/bg/paradigms/http-server/serving-requests/\" target=\"_blank\" rel=\"noopener\">Следващата страница<\/a> прави точно това — сървър, който остава жив и в цикъл отговаря на заявка след заявка, вместо да спре след първата.<\/span><\/p>"]]}}}</script>
