<script type="application/json" id="page-data">{"u":"paradigms/http-server/exercises/text-response","n":1396,"k":"exercise","pv":"paradigms/http-server/exercises","nx":"paradigms/http-server/exercises/text-response/solution","tr":["paradigms","paradigms/http-server"],"L":{"en":{"t":"Exercise ’Upper-case the path‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Make the server do real work with the client's input, rather than returning a fixed string.<\/span> <span class=\"sg\" data-s=\"1\">Write a server that, in a <strong>loop<\/strong> (as on the previous page), reads each request, takes the requested <strong>path<\/strong>, and sends it back <strong>upper-cased<\/strong> — so a request for <code>/hello<\/code> replies with <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The path is the second word of the request's first line (<code>GET /hello HTTP/1.0<\/code>); drop the leading <code>/<\/code> before upper-casing it.<\/span> <span class=\"sg\" data-s=\"3\">It keeps serving request after request; stop it with Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Requesting a path with <code>curl<\/code> returns it in capitals:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Schreiben Sie den Pfad groß‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie den Server echte Arbeit mit der Eingabe des Clients tun, statt eine feste Zeichenkette zu liefern.<\/span> <span class=\"sg\" data-s=\"1\">Schreiben Sie einen Server, der in einer <strong>Schleife<\/strong> (wie auf der vorigen Seite) jede Anfrage liest, den angefragten <strong>Pfad<\/strong> nimmt und ihn <strong>großgeschrieben<\/strong> zurücksendet — eine Anfrage nach <code>/hello<\/code> antwortet also mit <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Der Pfad ist das zweite Wort der ersten Zeile der Anfrage (<code>GET /hello HTTP/1.0<\/code>); lassen Sie den führenden <code>/<\/code> weg, bevor Sie ihn großschreiben.<\/span> <span class=\"sg\" data-s=\"3\">Der Server bedient weiter Anfrage um Anfrage; halten Sie ihn mit Strg-C an.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einen Pfad mit <code>curl<\/code> anzufragen liefert ihn in Großbuchstaben zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Zet het pad in hoofdletters‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Laat de server echt werk doen met de invoer van de client in plaats van een vaste string terug te geven.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf een server die in een <strong>lus<\/strong> (zoals op de vorige pagina) elk verzoek leest, het gevraagde <strong>pad<\/strong> neemt en het <strong>in hoofdletters<\/strong> terugstuurt — zodat een verzoek om <code>/hello<\/code> met <code>HELLO<\/code> antwoordt.<\/span> <span class=\"sg\" data-s=\"2\">Het pad is het tweede woord van de eerste regel van het verzoek (<code>GET /hello HTTP/1.0<\/code>); laat de voorafgaande <code>/<\/code> vallen voordat je het in hoofdletters zet.<\/span> <span class=\"sg\" data-s=\"3\">De server blijft verzoek na verzoek bedienen; stop hem met Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een pad opvragen met <code>curl<\/code> geeft het in hoofdletters terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"La ruta en mayúsculas","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haz que el servidor haga un trabajo real con la entrada del cliente, en lugar de devolver una cadena fija.<\/span> <span class=\"sg\" data-s=\"1\">Escribe un servidor que, en un <strong>bucle<\/strong> (como en la página anterior), lea cada petición, tome la <strong>ruta<\/strong> solicitada y la devuelva <strong>en mayúsculas<\/strong>, de modo que una petición de <code>/hello<\/code> responda con <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La ruta es la segunda palabra de la primera línea de la petición (<code>GET /hello HTTP/1.0<\/code>); quita la <code>/<\/code> inicial antes de pasarla a mayúsculas.<\/span> <span class=\"sg\" data-s=\"3\">Sigue atendiendo petición tras petición; detenlo con Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pedir una ruta con <code>curl<\/code> la devuelve en mayúsculas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Il percorso in maiuscolo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fa' che il server faccia un lavoro vero con l'input del client, invece di restituire una stringa fissa.<\/span> <span class=\"sg\" data-s=\"1\">Scrivi un server che, in un <strong>ciclo<\/strong> (come nella pagina precedente), legga ogni richiesta, ne prenda il <strong>percorso<\/strong> richiesto e lo rimandi indietro <strong>reso maiuscolo<\/strong> — così una richiesta di <code>/hello<\/code> risponde <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il percorso è la seconda parola della prima riga della richiesta (<code>GET /hello HTTP/1.0<\/code>); togli lo <code>/<\/code> iniziale prima di rendere maiuscolo.<\/span> <span class=\"sg\" data-s=\"3\">Continua a servire richiesta dopo richiesta; fermalo con Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Richiedere un percorso con <code>curl<\/code> lo restituisce in maiuscolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"ru":{"t":"Упражнение «Путь в верхнем регистре»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Заставьте сервер делать настоящую работу с тем, что прислал клиент, вместо возврата фиксированной строки.<\/span> <span class=\"sg\" data-s=\"1\">Напишите сервер, который в <strong>цикле<\/strong> (как на предыдущей странице) читает каждый запрос, берёт запрошенный <strong>путь<\/strong> и отправляет его обратно <strong>в верхнем регистре<\/strong>: так, на запрос <code>/hello<\/code> он отвечает <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Путь — это второе слово первой строки запроса (<code>GET /hello HTTP/1.0<\/code>); перед переводом в верхний регистр отбросьте ведущий <code>/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Сервер обслуживает запрос за запросом; остановите его по Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запрос пути через <code>curl<\/code> возвращает его заглавными буквами:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Шлях великими літерами»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Змусьте сервер робити справжню роботу зі вхідними даними клієнта, а не повертати сталий рядок.<\/span> <span class=\"sg\" data-s=\"1\">Напишіть сервер, що в <strong>циклі<\/strong> (як на попередній сторінці) читає кожен запит, бере запитаний <strong>шлях<\/strong> і надсилає його назад <strong>великими літерами<\/strong> — тож запит до <code>/hello<\/code> відповідає <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Шлях є другим словом першого рядка запиту (<code>GET /hello HTTP/1.0<\/code>); відкиньте початкову <code>/<\/code>, перш ніж переводити його у верхній регістр.<\/span> <span class=\"sg\" data-s=\"3\">Сервер і далі обслуговує запит за запитом; спиніть його через Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запит шляху через <code>curl<\/code> повертає його великими літерами:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Пътят с главни букви“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Накарайте сървъра да върши истинска работа с входа на клиента, вместо да връща постоянен низ.<\/span> <span class=\"sg\" data-s=\"1\">Напишете сървър, който в <strong>цикъл<\/strong> (както на предишната страница) чете всяка заявка, взема заявения <strong>път<\/strong> и го изпраща обратно <strong>с главни букви<\/strong> — така заявка за <code>/hello<\/code> отговаря с <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Пътят е втората дума от първия ред на заявката (<code>GET /hello HTTP/1.0<\/code>); махнете началната <code>/<\/code>, преди да го превърнете в главни букви.<\/span> <span class=\"sg\" data-s=\"3\">Сървърът продължава да обслужва заявка след заявка; спрете го с Ctrl-C.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заявка на път с <code>curl<\/code> го връща с главни букви:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello\nHELLO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/http-server/exercises/text-response/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
