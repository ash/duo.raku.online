<script type="application/json" id="page-data">{"u":"paradigms/http-server","n":1390,"k":"section","pv":"paradigms/connections/exercises/send-and-receive/solution","nx":"paradigms/http-server/listening","tr":["paradigms"],"L":{"en":{"t":"A simple HTTP server","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>server<\/em> is the other side of a connection: instead of reaching out to a remote machine, it waits for clients to reach <strong>in<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">The same core class, <code>IO::Socket::INET<\/code>, does this too — you just put it in listening mode.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This section builds a tiny web server by hand: listen for a connection, read the request, and send back an HTTP response.<\/span> <span class=\"sg\" data-s=\"1\">Like the socket examples earlier, these need to be run on your own machine and connected to with a browser or another program.<\/span><\/p>"]]},"de":{"t":"Ein einfacher HTTP-Server","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Server<\/em> ist die andere Seite einer Verbindung: Statt zu einer entfernten Maschine hinauszureichen, wartet er darauf, dass Clients zu ihm <strong>hereinreichen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Dieselbe Kernklasse, <code>IO::Socket::INET<\/code>, tut auch das — Sie versetzen sie nur in den Lauschmodus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt baut von Hand einen winzigen Webserver: auf eine Verbindung lauschen, die Anfrage lesen und eine HTTP-Antwort zurücksenden.<\/span> <span class=\"sg\" data-s=\"1\">Wie die früheren Socket-Beispiele müssen diese auf Ihrer eigenen Maschine laufen und mit einem Browser oder einem anderen Programm angesprochen werden.<\/span><\/p>"]]},"nl":{"t":"Een eenvoudige HTTP-server","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>server<\/em> is de andere kant van een verbinding: in plaats van naar een machine op afstand uit te reiken, wacht hij tot clients naar <strong>binnen<\/strong> reiken.<\/span> <span class=\"sg\" data-s=\"1\">Dezelfde kernklasse, <code>IO::Socket::INET<\/code>, doet dit ook — je zet haar alleen in luistermodus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze sectie bouwt met de hand een piepkleine webserver: luister op een verbinding, lees het verzoek, en stuur een HTTP-antwoord terug.<\/span> <span class=\"sg\" data-s=\"1\">Net als bij de eerdere socketvoorbeelden moeten deze op je eigen machine draaien en met een browser of een ander programma benaderd worden.<\/span><\/p>"]]},"es":{"t":"Un servidor HTTP sencillo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>servidor<\/em> es el otro lado de una conexión: en lugar de salir hacia una máquina remota, espera a que los clientes entren <strong>hacia él<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">La misma clase básica, <code>IO::Socket::INET<\/code>, también hace esto: basta con ponerla en modo de escucha.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta sección construye a mano un servidor web diminuto: escuchar una conexión, leer la petición y devolver una respuesta HTTP.<\/span> <span class=\"sg\" data-s=\"1\">Como los ejemplos de sockets anteriores, hay que ejecutarlos en tu propia máquina y conectarse a ellos con un navegador u otro programa.<\/span><\/p>"]]},"it":{"t":"Un semplice server HTTP","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>server<\/em> è l'altro lato di una connessione: invece di allungarsi verso una macchina remota, aspetta che siano i client ad allungarsi <strong>verso di lui<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Anche questo lo fa la stessa classe di base, <code>IO::Socket::INET<\/code>: basta metterla in modalità di ascolto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sezione costruisce a mano un minuscolo server web: mettersi in ascolto di una connessione, leggere la richiesta e rimandare indietro una risposta HTTP.<\/span> <span class=\"sg\" data-s=\"1\">Come gli esempi con i socket di prima, questi vanno eseguiti sulla tua macchina e raggiunti con un browser o con un altro programma.<\/span><\/p>"]]},"ru":{"t":"Простой HTTP-сервер","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сервер<\/em> — это другая сторона соединения: вместо того чтобы тянуться к удалённой машине, он ждёт, когда клиенты потянутся к <strong>нему<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Тот же основной класс <code>IO::Socket::INET<\/code> умеет и это — надо лишь перевести его в режим ожидания.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом разделе мы вручную построим крошечный веб-сервер: дождаться соединения, прочитать запрос и отправить обратно HTTP-ответ.<\/span> <span class=\"sg\" data-s=\"1\">Как и прежние примеры с сокетами, эти нужно запускать на своей машине и подключаться к ним браузером или другой программой.<\/span><\/p>"]]},"uk":{"t":"Простий HTTP-сервер","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сервер<\/em> — це інша сторона з'єднання: замість тягнутися до віддаленої машини він чекає, поки клієнти дотягнуться <strong>до нього<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Той самий основний клас, <code>IO::Socket::INET<\/code>, робить і це — ви просто переводите його в режим слухання.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей розділ будує крихітний вебсервер власноруч: послухати з'єднання, прочитати запит і надіслати назад HTTP-відповідь.<\/span> <span class=\"sg\" data-s=\"1\">Як і попередні приклади із сокетами, ці треба запускати на власній машині й приєднуватися до них браузером чи іншою програмою.<\/span><\/p>"]]},"bg":{"t":"Прост HTTP сървър","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сървърът<\/em> е другата страна на връзката: вместо да посяга към отдалечена машина, той чака клиентите да посегнат <strong>към него<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Същият основен клас — <code>IO::Socket::INET<\/code> — прави и това; просто го поставяте в режим на слушане.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този раздел изгражда мъничък уеб сървър на ръка: слушай за връзка, прочети заявката и изпрати обратно HTTP отговор.<\/span> <span class=\"sg\" data-s=\"1\">Както и по-ранните примери със сокети, тези трябва да се изпълняват на собствената ви машина и да се свързвате към тях с браузър или друга програма.<\/span><\/p>"]]}}}</script>
