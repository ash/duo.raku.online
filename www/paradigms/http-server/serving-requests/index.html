<script type="application/json" id="page-data">{"u":"paradigms/http-server/serving-requests","n":1394,"k":"topic","pv":"paradigms/http-server/responding","nx":"paradigms/http-server/exercises","tr":["paradigms","paradigms/http-server"],"L":{"en":{"t":"Serving many requests","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The server on the previous page handled a single request and then stopped.<\/span> <span class=\"sg\" data-s=\"1\">A real server keeps running, answering client after client.<\/span> <span class=\"sg\" data-s=\"2\">Wrap the accept-read-respond steps in a <code>loop<\/code> — and because the loop shares the variables declared around it, you can keep state between requests.<\/span> <span class=\"sg\" data-s=\"3\">Here the server counts its customers and tells each one their number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # a qq:to heredoc makes a tidy template — the variable interpolates straight in\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # send the header first, then the body, as two separate writes\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>blocks<\/strong> until a client connects, then returns a fresh socket for that one conversation.<\/span> <span class=\"sg\" data-s=\"1\">Because <code>$customer<\/code> lives outside the loop, it survives from one request to the next: the first visitor is customer <code>1<\/code>, the second <code>2<\/code>, and so on.<\/span> <span class=\"sg\" data-s=\"2\">The loop never ends on its own, so the server stays up until you stop it with Ctrl-C.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Two details are worth noticing:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>The response is written in two parts.<\/strong> The first <code>.print<\/code> sends the HTTP header — the status line, the content type, and the blank line that ends the headers. The second sends the body. HTTP does not care whether these arrive in one write or several, so splitting them keeps the fixed protocol boilerplate apart from the part that actually changes.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>The body comes from a template.<\/strong> <code>qq:to/END/<\/code> is a <em>heredoc<\/em> — a <code>qq<\/code> string that runs to the line <code>END<\/code>. It spans several lines and interpolates <code>$customer<\/code> just like any double-quoted string, which makes it a neat little templating tool for building a reply. (It is one of the <a href=\"https://course.raku.org/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">quoting constructs<\/a> from earlier in the course.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Connect a few times to watch the counter climb:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Handling requests one after another like this is the simplest kind of server.<\/span> <span class=\"sg\" data-s=\"1\">A production server would also serve each connection on its own thread or promise, so a slow client cannot hold up the others — but the heart of it is exactly this loop: accept, read, respond, repeat.<\/span><\/p>"]]},"de":{"t":"Viele Anfragen bedienen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Der Server auf der vorigen Seite bediente eine einzelne Anfrage und hörte dann auf.<\/span> <span class=\"sg\" data-s=\"1\">Ein echter Server läuft weiter und beantwortet einen Client nach dem anderen.<\/span> <span class=\"sg\" data-s=\"2\">Hüllen Sie die Schritte annehmen-lesen-antworten in eine <code>loop<\/code> — und da die Schleife die ringsum deklarierten Variablen teilt, können Sie Zustand zwischen Anfragen behalten.<\/span> <span class=\"sg\" data-s=\"3\">Hier zählt der Server seine Kunden und nennt jedem seine Nummer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # a qq:to heredoc makes a tidy template — the variable interpolates straight in\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # send the header first, then the body, as two separate writes\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>blockiert<\/strong>, bis sich ein Client verbindet, und liefert dann einen frischen Socket für dieses eine Gespräch.<\/span> <span class=\"sg\" data-s=\"1\">Da <code>$customer<\/code> außerhalb der Schleife lebt, überdauert es von einer Anfrage zur nächsten: Der erste Besucher ist Kunde <code>1<\/code>, der zweite <code>2<\/code> und so fort.<\/span> <span class=\"sg\" data-s=\"2\">Die Schleife endet von selbst nie, der Server bleibt also oben, bis Sie ihn mit Strg-C anhalten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zwei Einzelheiten sind bemerkenswert:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Die Antwort wird in zwei Teilen geschrieben.<\/strong> Das erste <code>.print<\/code> sendet den HTTP-Header — die Statuszeile, den Inhaltstyp und die leere Zeile, die die Header beendet. Das zweite sendet den Rumpf. HTTP ist es gleich, ob diese in einem oder in mehreren Schreibvorgängen ankommen, sie zu trennen hält das feste Protokollbeiwerk also von dem Teil fern, der sich wirklich ändert.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Der Rumpf kommt aus einer Vorlage.<\/strong> <code>qq:to/END/<\/code> ist ein <em>Heredoc<\/em> — eine <code>qq<\/code>-Zeichenkette, die bis zur Zeile <code>END<\/code> reicht. Sie erstreckt sich über mehrere Zeilen und interpoliert <code>$customer<\/code> wie jede Zeichenkette in doppelten Anführungszeichen, was sie zu einem netten kleinen Vorlagenwerkzeug für den Aufbau einer Antwort macht. (Es ist eines der <a href=\"https://course.raku.org/de/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">Anführungskonstrukte<\/a> von früher im Kurs.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verbinden Sie sich ein paar Mal, um den Zähler klettern zu sehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anfragen auf diese Weise nacheinander abzuwickeln ist die einfachste Art von Server.<\/span> <span class=\"sg\" data-s=\"1\">Ein Server für den Wirkbetrieb würde jede Verbindung zusätzlich auf einem eigenen Thread oder Promise bedienen, damit ein langsamer Client die anderen nicht aufhalten kann — doch sein Herz ist genau diese Schleife: annehmen, lesen, antworten, wiederholen.<\/span><\/p>"]]},"nl":{"t":"Veel verzoeken bedienen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De server op de vorige pagina handelde één enkel verzoek af en stopte daarna.<\/span> <span class=\"sg\" data-s=\"1\">Een echte server blijft draaien en beantwoordt de ene client na de andere.<\/span> <span class=\"sg\" data-s=\"2\">Wikkel de stappen accepteren-lezen-antwoorden in een <code>loop<\/code> — en omdat de lus de eromheen gedeclareerde variabelen deelt, kun je toestand tussen verzoeken bewaren.<\/span> <span class=\"sg\" data-s=\"3\">Hier telt de server zijn klanten en vertelt hij elk zijn nummer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # a qq:to heredoc makes a tidy template — the variable interpolates straight in\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # send the header first, then the body, as two separate writes\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>blokkeert<\/strong> tot een client verbinding maakt en geeft daarna een verse socket voor dat ene gesprek terug.<\/span> <span class=\"sg\" data-s=\"1\">Omdat <code>$customer<\/code> buiten de lus leeft, overleeft die van het ene verzoek naar het volgende: de eerste bezoeker is klant <code>1<\/code>, de tweede <code>2<\/code>, enzovoort.<\/span> <span class=\"sg\" data-s=\"2\">De lus eindigt uit zichzelf nooit, dus de server blijft draaien tot je hem met Ctrl-C stopt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Twee details zijn het opmerken waard:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Het antwoord wordt in twee delen geschreven.<\/strong> De eerste <code>.print<\/code> verstuurt de HTTP-header — de statusregel, het contenttype en de lege regel die de headers beëindigt. De tweede verstuurt de body. HTTP kan het niets schelen of die in één of in meerdere schrijfacties aankomen, dus ze splitsen houdt het vaste protocolwerk gescheiden van het deel dat werkelijk verandert.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>De body komt uit een sjabloon.<\/strong> <code>qq:to/END/<\/code> is een <em>heredoc<\/em> — een <code>qq<\/code>-string die tot de regel <code>END<\/code> loopt. Hij beslaat meerdere regels en interpoleert <code>$customer<\/code> net als elke string met dubbele aanhalingstekens, wat er een net klein sjabloongereedschap van maakt om een antwoord op te bouwen. (Het is een van de <a href=\"https://course.raku.org/nl/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">aanhalingsconstructies<\/a> van eerder in de cursus.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Maak een paar keer verbinding om de teller te zien klimmen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verzoeken zo na elkaar afhandelen is de eenvoudigste soort server.<\/span> <span class=\"sg\" data-s=\"1\">Een productieserver zou elke verbinding ook op een eigen thread of promise bedienen, zodat een trage client de andere niet kan ophouden — maar het hart ervan is precies deze lus: accepteren, lezen, antwoorden, herhalen.<\/span><\/p>"]]},"es":{"t":"Atender muchas peticiones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El servidor de la página anterior atendía una sola petición y después se detenía.<\/span> <span class=\"sg\" data-s=\"1\">Un servidor real sigue corriendo, respondiendo a un cliente tras otro.<\/span> <span class=\"sg\" data-s=\"2\">Envuelve los pasos de aceptar, leer y responder en un <code>loop<\/code> y, como el bucle comparte las variables declaradas a su alrededor, puedes conservar estado entre peticiones.<\/span> <span class=\"sg\" data-s=\"3\">Aquí el servidor cuenta a sus clientes y le dice a cada uno su número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # a qq:to heredoc makes a tidy template — the variable interpolates straight in\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # send the header first, then the body, as two separate writes\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>se bloquea<\/strong> hasta que un cliente conecta, y devuelve entonces un socket nuevo para esa conversación concreta.<\/span> <span class=\"sg\" data-s=\"1\">Como <code>$customer<\/code> vive fuera del bucle, sobrevive de una petición a la siguiente: el primer visitante es el cliente <code>1<\/code>, el segundo el <code>2<\/code>, y así sucesivamente.<\/span> <span class=\"sg\" data-s=\"2\">El bucle no termina nunca por sí solo, así que el servidor se mantiene en pie hasta que lo detienes con Ctrl-C.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merece la pena fijarse en dos detalles:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>La respuesta se escribe en dos partes.<\/strong> El primer <code>.print<\/code> envía la cabecera HTTP: la línea de estado, el tipo de contenido y la línea en blanco que cierra las cabeceras. El segundo envía el cuerpo. A HTTP le da igual que estos lleguen en una escritura o en varias, así que separarlos mantiene aparte el formulismo fijo del protocolo de la parte que realmente cambia.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>El cuerpo viene de una plantilla.<\/strong> <code>qq:to/END/<\/code> es un <em>heredoc<\/em>: una cadena <code>qq<\/code> que se extiende hasta la línea <code>END<\/code>. Abarca varias líneas e interpola <code>$customer<\/code> igual que cualquier cadena entre comillas dobles, lo que la convierte en una pulcra herramienta de plantillas para construir una respuesta. (Es una de las <a href=\"https://course.raku.org/es/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">construcciones de entrecomillado<\/a> vistas antes en el curso.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Conéctate unas cuantas veces para ver subir el contador:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atender las peticiones una tras otra de este modo es la clase de servidor más sencilla.<\/span> <span class=\"sg\" data-s=\"1\">Un servidor de producción atendería además cada conexión en su propio hilo o promesa, de modo que un cliente lento no pueda retener a los demás, pero su corazón es exactamente este bucle: aceptar, leer, responder, repetir.<\/span><\/p>"]]},"it":{"t":"Servire molte richieste","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Il server della pagina precedente gestiva una sola richiesta e poi si fermava.<\/span> <span class=\"sg\" data-s=\"1\">Un server vero continua a girare, rispondendo a un client dopo l'altro.<\/span> <span class=\"sg\" data-s=\"2\">Avvolgi i passi accetta-leggi-rispondi in un <code>loop<\/code> — e poiché il ciclo condivide le variabili dichiarate attorno a esso, puoi mantenere uno stato fra le richieste.<\/span> <span class=\"sg\" data-s=\"3\">Qui il server conta i propri clienti e dice a ciascuno il proprio numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # a qq:to heredoc makes a tidy template — the variable interpolates straight in\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # send the header first, then the body, as two separate writes\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>blocca<\/strong> finché un client non si connette, poi restituisce un socket fresco per quella singola conversazione.<\/span> <span class=\"sg\" data-s=\"1\">Poiché <code>$customer<\/code> vive fuori dal ciclo, sopravvive da una richiesta alla successiva: il primo visitatore è il cliente <code>1<\/code>, il secondo il <code>2<\/code> e così via.<\/span> <span class=\"sg\" data-s=\"2\">Il ciclo non finisce mai da solo, quindi il server resta su finché non lo fermi con Ctrl-C.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vale la pena notare due dettagli:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>La risposta è scritta in due parti.<\/strong> Il primo <code>.print<\/code> invia l'intestazione HTTP — la riga di stato, il tipo di contenuto e la riga vuota che chiude le intestazioni. Il secondo invia il corpo. A HTTP non importa se questi arrivino in una scrittura o in parecchie, quindi dividerli tiene separato il testo fisso del protocollo dalla parte che cambia davvero.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Il corpo viene da un modello.<\/strong> <code>qq:to/END/<\/code> è un <em>heredoc<\/em>: una stringa <code>qq<\/code> che corre fino alla riga <code>END<\/code>. Si estende su più righe e interpola <code>$customer<\/code> come qualunque stringa fra virgolette doppie, il che ne fa un piccolo e ordinato strumento di templating per costruire una risposta. (È uno dei <a href=\"https://course.raku.org/it/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">costrutti di quoting<\/a> visti prima nel corso.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Connettiti qualche volta per veder salire il contatore:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gestire le richieste una dopo l'altra così è il genere di server più semplice.<\/span> <span class=\"sg\" data-s=\"1\">Un server di produzione servirebbe anche ogni connessione su un proprio thread o promise, così che un client lento non possa trattenere gli altri — ma il cuore è esattamente questo ciclo: accetta, leggi, rispondi, ripeti.<\/span><\/p>"]]},"ru":{"t":"Обслуживание множества запросов","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Сервер с предыдущей страницы обработал один запрос и остановился.<\/span> <span class=\"sg\" data-s=\"1\">Настоящий сервер продолжает работать, отвечая клиенту за клиентом.<\/span> <span class=\"sg\" data-s=\"2\">Заверните шаги «принять — прочитать — ответить» в <code>loop<\/code> — и, поскольку цикл разделяет переменные, объявленные вокруг него, между запросами можно сохранять состояние.<\/span> <span class=\"sg\" data-s=\"3\">Здесь сервер считает своих посетителей и сообщает каждому его номер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # heredoc с qq:to даёт опрятный шаблон — переменная интерполируется прямо в нём\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # сначала отправляем заголовок, затем тело — двумя отдельными записями\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>блокирует<\/strong> выполнение, пока клиент не подключится, и затем возвращает новый сокет для этого разговора.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку <code>$customer<\/code> живёт вне цикла, она переживает переход от запроса к запросу: первый посетитель — покупатель <code>1<\/code>, второй — <code>2<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"2\">Цикл сам по себе никогда не кончается, поэтому сервер работает, пока вы не остановите его по Ctrl-C.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стоит обратить внимание на две детали:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Ответ пишется в две части.<\/strong> Первый <code>.print<\/code> отправляет HTTP-заголовок — строку состояния, тип содержимого и пустую строку, завершающую заголовки. Второй отправляет тело. HTTP безразлично, придёт это одной записью или несколькими, поэтому разделение позволяет держать неизменную протокольную обвязку отдельно от того, что действительно меняется.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Тело берётся из шаблона.<\/strong> <code>qq:to/END/<\/code> — это <em>heredoc<\/em>, строка <code>qq<\/code>, которая тянется до строки <code>END<\/code>. Она занимает несколько строк и интерполирует <code>$customer<\/code> так же, как любая строка в двойных кавычках, что делает её изящным средством шаблонизации для сборки ответа. (Это одна из <a href=\"https://course.raku.org/ru/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">конструкций кавычек<\/a>, встречавшихся раньше в курсе.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подключитесь несколько раз, чтобы посмотреть, как растёт счётчик:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такая последовательная обработка запросов — простейший вид сервера.<\/span> <span class=\"sg\" data-s=\"1\">Промышленный сервер вдобавок обслуживал бы каждое соединение в отдельном потоке или промисе, чтобы медленный клиент не задерживал остальных, — но сердцем его остаётся именно этот цикл: принять, прочитать, ответить, повторить.<\/span><\/p>"]]},"uk":{"t":"Обслуговування багатьох запитів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Сервер із попередньої сторінки обробив один запит і зупинився.<\/span> <span class=\"sg\" data-s=\"1\">Справжній сервер працює далі, відповідаючи клієнтові за клієнтом.<\/span> <span class=\"sg\" data-s=\"2\">Обгорніть кроки «прийми—прочитай—відповідай» у <code>loop<\/code> — і, оскільки цикл поділяє змінні, оголошені навколо нього, ви можете тримати стан між запитами.<\/span> <span class=\"sg\" data-s=\"3\">Тут сервер рахує своїх відвідувачів і повідомляє кожному його номер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # heredoc через qq:to дає охайний шаблон — змінна інтерполюється просто всередині\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # спершу надсилаємо заголовок, потім тіло — двома окремими записами\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>блокує<\/strong> виконання, аж поки не приєднається клієнт, а тоді повертає свіжий сокет для саме цієї розмови.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки <code>$customer<\/code> живе поза циклом, вона переживає перехід від одного запиту до наступного: перший відвідувач є клієнтом <code>1<\/code>, другий — <code>2<\/code> і так далі.<\/span> <span class=\"sg\" data-s=\"2\">Цикл сам собою ніколи не завершується, тож сервер працює, аж поки ви не спините його через Ctrl-C.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дві деталі варті уваги:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Відповідь записано двома частинами.<\/strong> Перший <code>.print<\/code> надсилає HTTP-заголовок — рядок стану, тип вмісту та порожній рядок, що завершує заголовки. Другий надсилає тіло. HTTP байдуже, чи прибудуть вони одним записом, чи кількома, тож розділення тримає незмінну протокольну обв'язку окремо від тієї частини, що справді змінюється.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Тіло походить із шаблону.<\/strong> <code>qq:to/END/<\/code> — це <em>heredoc<\/em>: рядок <code>qq<\/code>, що триває до рядка <code>END<\/code>. Він охоплює кілька рядків і інтерполює <code>$customer<\/code> точно як будь-який рядок у подвійних лапках, що робить його зграбним маленьким засобом шаблонізації для побудови відповіді. (Це одна з <a href=\"https://course.raku.org/uk/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">конструкцій цитування<\/a> з попередньої частини курсу.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приєднайтеся кілька разів, щоб побачити, як лічильник видирається вгору:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така обробка запитів один за одним є найпростішим різновидом сервера.<\/span> <span class=\"sg\" data-s=\"1\">Промисловий сервер обслуговував би ще й кожне з'єднання у власному потоці виконання чи обіцянці, щоб повільний клієнт не міг затримувати інших, — але серцем цього є рівно цей цикл: прийми, прочитай, відповідай, повтори.<\/span><\/p>"]]},"bg":{"t":"Обслужване на много заявки","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Сървърът от предишната страница обработи една заявка и спря.<\/span> <span class=\"sg\" data-s=\"1\">Истинският сървър продължава да работи, отговаряйки на клиент след клиент.<\/span> <span class=\"sg\" data-s=\"2\">Обвийте стъпките „приеми—прочети—отговори“ в <code>loop<\/code> — и понеже цикълът споделя променливите, декларирани около него, можете да пазите състояние между заявките.<\/span> <span class=\"sg\" data-s=\"3\">Тук сървърът брои клиентите си и казва на всеки неговия номер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $listener = IO::Socket::INET.new(\n    :listen,\n    :localhost('127.0.0.1'),\n    :localport(8080),\n);\n\nmy $customer = 0;\n\nloop {\n    my $conn = $listener.accept;\n    $conn.recv;\n    $customer++;\n\n    # heredoc чрез qq:to дава спретнат шаблон — променливата се интерполира направо вътре\n    my $body = qq:to/END/;\n        Hello!\n        You are customer number $customer.\n        Thanks for visiting.\n        END\n\n    # първо изпращаме заглавката, после тялото — с два отделни записа\n    $conn.print(\"HTTP/1.0 200 OK\\r\\nContent-Type: text/plain\\r\\n\\r\\n\");\n    $conn.print($body);\n\n    $conn.close;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.accept<\/code> <strong>блокира<\/strong>, докато не се свърже клиент, а после връща нов сокет за точно този разговор.<\/span> <span class=\"sg\" data-s=\"1\">Понеже <code>$customer<\/code> живее извън цикъла, тя оцелява от една заявка към следващата: първият посетител е клиент <code>1<\/code>, вторият — <code>2<\/code>, и така нататък.<\/span> <span class=\"sg\" data-s=\"2\">Цикълът никога не свършва сам, така че сървърът работи, докато не го спрете с Ctrl-C.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Две подробности заслужават внимание:<\/span><\/p>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Отговорът е записан на две части.<\/strong> Първият <code>.print<\/code> изпраща HTTP заглавката — реда за състояние, типа на съдържанието и празния ред, който завършва заглавките. Вторият изпраща тялото. На HTTP му е все едно дали те пристигат с един запис, или с няколко, така че разделянето държи непроменливата протоколна обвивка настрани от онази част, която наистина се променя.<\/span><\/li><\/ul>"],["list",1,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Тялото идва от шаблон.<\/strong> <code>qq:to/END/<\/code> е <em>heredoc<\/em>: низ <code>qq<\/code>, който продължава до реда <code>END<\/code>. Той обхваща няколко реда и интерполира <code>$customer<\/code> точно както всеки низ в двойни кавички, което го прави спретнато малко средство за шаблонизиране при изграждането на отговор. (Това е една от <a href=\"https://course.raku.org/bg/advanced/quoting-constructs/\" target=\"_blank\" rel=\"noopener\">конструкциите за цитиране<\/a> от по-рано в курса.)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Свържете се няколко пъти, за да видите как броячът се катери:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 1.\nThanks for visiting.\n$ curl http://127.0.0.1:8080/\nHello!\nYou are customer number 2.\nThanks for visiting.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такава обработка на заявките една след друга е най-простият вид сървър.<\/span> <span class=\"sg\" data-s=\"1\">Промишленият сървър би обслужвал и всяка връзка в собствена нишка или обещание, за да не може бавен клиент да задържа останалите — но сърцето му е точно този цикъл: приеми, прочети, отговори, повтори.<\/span><\/p>"]]}}}</script>
