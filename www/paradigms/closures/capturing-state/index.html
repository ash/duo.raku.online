<script type="application/json" id="page-data">{"u":"paradigms/closures/capturing-state","n":1194,"k":"topic","pv":"paradigms/closures/lambdas/quiz","nx":"paradigms/closures/capturing-state/quiz","tr":["paradigms","paradigms/closures"],"L":{"en":{"t":"Closures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>closure<\/em> is a subroutine that captures variables from the scope in which it was defined, and keeps them alive even after that scope has ended.<\/span> <span class=\"sg\" data-s=\"1\">This gives the subroutine its own private, persistent state.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The classic example is a counter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$n<\/code> is declared inside <code>make-counter<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The returned subroutine refers to <code>$n<\/code>, so it closes over it: each call to <code>count<\/code> increments and returns the <strong>same<\/strong> <code>$n<\/code>, even though <code>make-counter<\/code> itself finished long ago.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Every call to <code>make-counter<\/code> creates a fresh <code>$n<\/code>, so separate counters are independent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closures let a function carry state without a global variable and without an object.<\/span> <span class=\"sg\" data-s=\"1\">They are the functional-programming way to remember something between calls.<\/span><\/p>"]]},"de":{"t":"Closures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Closure<\/em> ist eine Subroutine, die Variablen aus dem Bereich einfängt, in dem sie definiert wurde, und sie am Leben hält, selbst nachdem dieser Bereich geendet hat.<\/span> <span class=\"sg\" data-s=\"1\">Damit erhält die Subroutine ihren eigenen, dauerhaften Zustand.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das klassische Beispiel ist ein Zähler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$n<\/code> ist innerhalb von <code>make-counter<\/code> deklariert.<\/span> <span class=\"sg\" data-s=\"1\">Die zurückgegebene Subroutine verweist auf <code>$n<\/code> und schließt sich also um sie: Jeder Aufruf von <code>count<\/code> erhöht und liefert <strong>dieselbe<\/strong> <code>$n<\/code>, obwohl <code>make-counter<\/code> selbst längst fertig ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>make-counter<\/code> erzeugt eine frische <code>$n<\/code>, getrennte Zähler sind also unabhängig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closures erlauben es einer Funktion, Zustand mitzutragen, ohne globale Variable und ohne Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind die funktionale Art, sich zwischen Aufrufen etwas zu merken.<\/span><\/p>"]]},"nl":{"t":"Closures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>closure<\/em> is een subroutine die variabelen vastlegt uit het bereik waarin ze gedefinieerd is, en die in leven houdt zelfs nadat dat bereik geëindigd is.<\/span> <span class=\"sg\" data-s=\"1\">Zo krijgt de subroutine haar eigen private, blijvende toestand.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het klassieke voorbeeld is een teller:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$n<\/code> is binnen <code>make-counter<\/code> gedeclareerd.<\/span> <span class=\"sg\" data-s=\"1\">De teruggegeven subroutine verwijst naar <code>$n<\/code> en sluit er dus omheen: elke aanroep van <code>count<\/code> verhoogt en geeft <strong>dezelfde<\/strong> <code>$n<\/code> terug, hoewel <code>make-counter<\/code> zelf allang klaar is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>make-counter<\/code> maakt een verse <code>$n<\/code>, dus aparte tellers zijn onafhankelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closures laten een functie toestand meedragen zonder globale variabele en zonder object.<\/span> <span class=\"sg\" data-s=\"1\">Het is de functioneel-programmeerwijze om iets tussen aanroepen te onthouden.<\/span><\/p>"]]},"es":{"t":"Clausuras","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>clausura<\/em> es una subrutina que captura variables del ámbito en el que se definió y las mantiene vivas incluso después de que ese ámbito haya terminado.<\/span> <span class=\"sg\" data-s=\"1\">Esto le da a la subrutina un estado privado y duradero propio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El ejemplo clásico es un contador:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$n<\/code> se declara dentro de <code>make-counter<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La subrutina devuelta se refiere a <code>$n<\/code>, así que se cierra sobre ella: cada llamada a <code>count<\/code> incrementa y devuelve el <strong>mismo<\/strong> <code>$n<\/code>, aunque <code>make-counter<\/code> terminara hace rato.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>make-counter<\/code> crea un <code>$n<\/code> nuevo, así que los contadores distintos son independientes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las clausuras permiten que una función lleve consigo un estado sin una variable global y sin un objeto.<\/span> <span class=\"sg\" data-s=\"1\">Son la manera que tiene la programación funcional de recordar algo entre llamadas.<\/span><\/p>"]]},"it":{"t":"Chiusure","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>chiusura<\/em> è una subroutine che cattura variabili dall'ambito in cui è stata definita e le tiene in vita anche dopo che quell'ambito è finito.<\/span> <span class=\"sg\" data-s=\"1\">Questo dà alla subroutine uno stato privato e duraturo tutto suo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'esempio classico è un contatore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$n<\/code> è dichiarata dentro <code>make-counter<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La subroutine restituita si riferisce a <code>$n<\/code>, quindi si chiude su di essa: ogni chiamata a <code>count<\/code> incrementa e restituisce lo <strong>stesso<\/strong> <code>$n<\/code>, anche se <code>make-counter<\/code> è finita da un pezzo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>make-counter<\/code> crea un <code>$n<\/code> fresco, quindi contatori separati sono indipendenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le chiusure permettono a una funzione di portare con sé uno stato senza una variabile globale e senza un oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Sono il modo della programmazione funzionale di ricordare qualcosa fra una chiamata e l'altra.<\/span><\/p>"]]},"ru":{"t":"Замыкания","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Замыкание<\/em> — это подпрограмма, которая захватывает переменные из области видимости, где была определена, и сохраняет их живыми даже после того, как эта область закончилась.<\/span> <span class=\"sg\" data-s=\"1\">Так подпрограмма получает собственное скрытое, устойчивое состояние.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Классический пример — счётчик:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$n<\/code> объявлена внутри <code>make-counter<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Возвращаемая подпрограмма ссылается на <code>$n<\/code>, то есть замыкается на неё: каждый вызов <code>count<\/code> увеличивает и возвращает <strong>одну и ту же<\/strong> <code>$n<\/code>, хотя сам <code>make-counter<\/code> завершился уже давно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>make-counter<\/code> создаёт новую <code>$n<\/code>, поэтому отдельные счётчики независимы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Замыкания позволяют функции нести состояние без глобальной переменной и без объекта.<\/span> <span class=\"sg\" data-s=\"1\">Это принятый в функциональном программировании способ помнить что-то между вызовами.<\/span><\/p>"]]},"uk":{"t":"Замикання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Замикання<\/em> — це підпрограма, що захоплює змінні з області, у якій її було визначено, і тримає їх живими навіть після того, як ця область завершилася.<\/span> <span class=\"sg\" data-s=\"1\">Це дає підпрограмі власний приватний сталий стан.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класичний приклад — лічильник:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінну <code>$n<\/code> оголошено всередині <code>make-counter<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повернена підпрограма посилається на <code>$n<\/code>, тож замикається на ній: кожен виклик <code>count<\/code> збільшує й повертає <strong>ту саму<\/strong> <code>$n<\/code>, хоча сам <code>make-counter<\/code> завершився давним-давно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>make-counter<\/code> створює свіжу <code>$n<\/code>, тож окремі лічильники незалежні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Замикання дозволяють функції нести стан без глобальної змінної й без об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">Це функційний спосіб пам'ятати щось між викликами.<\/span><\/p>"]]},"bg":{"t":"Затваряния","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Затварянето<\/em> е подпрограма, която улавя променливи от обхвата, в който е дефинирана, и ги държи живи дори след като този обхват е приключил.<\/span> <span class=\"sg\" data-s=\"1\">Това дава на подпрограмата собствено частно, устойчиво състояние.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класическият пример е брояч:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter {\n    my $n = 0;\n    return sub { ++$n };\n}\n\nmy &amp;count = make-counter;\nsay count(); # 1\nsay count(); # 2\nsay count(); # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$n<\/code> е декларирана вътре в <code>make-counter<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Върнатата подпрограма се позовава на <code>$n<\/code>, така че се затваря върху нея: всяко извикване на <code>count<\/code> увеличава и връща <strong>същото<\/strong> <code>$n<\/code>, макар самият <code>make-counter<\/code> да е приключил отдавна.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>make-counter<\/code> създава ново <code>$n<\/code>, така че отделните броячи са независими:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;a = make-counter;\nmy &amp;b = make-counter;\nsay a(); # 1\nsay a(); # 2\nsay b(); # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Затварянията позволяват на функцията да носи състояние без глобална променлива и без обект.<\/span> <span class=\"sg\" data-s=\"1\">Това е функционалният начин да се помни нещо между извикванията.<\/span><\/p>"]]}}}</script>
