<script type="application/json" id="page-data">{"u":"paradigms/closures/exercises/counter/solution","n":1198,"k":"solution","pv":"paradigms/closures/exercises/counter","nx":"paradigms/closures/exercises/multiplier","tr":["paradigms","paradigms/closures"],"L":{"en":{"t":"The solution of ’A counter‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter($step) {\n    my $n = 0;\n    return sub { $n += $step };\n}\n\nmy &amp;count = make-counter(10);\nsay count();\nsay count();\nsay count();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/closures/counter.raku\" target=\"_blank\" rel=\"noopener\">counter.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>10\n20\n30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The closure captures two things from <code>make-counter<\/code>: the parameter <code>$step<\/code> and the private variable <code>$n<\/code>. Both stay alive after <code>make-counter<\/code> returns.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Each call adds <code>$step<\/code> to <code>$n<\/code> and returns the new total. A counter built with a different step would advance by that amount instead.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein Zähler","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-counter($step) {\n    my $n = 0;\n    return sub { $n += $step };\n}\n\nmy &amp;count = make-counter(10);\nsay cou
