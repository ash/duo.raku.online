<script type="application/json" id="page-data">{"u":"paradigms/closures/lambdas","n":1192,"k":"topic","pv":"paradigms/closures","nx":"paradigms/closures/lambdas/quiz","tr":["paradigms","paradigms/closures"],"L":{"en":{"t":"Lambdas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <em>lambda<\/em> is a function with no name.<\/span> <span class=\"sg\" data-s=\"1\">You have already met two ways to write one.<\/span> <span class=\"sg\" data-s=\"2\">The first is the <strong><a href=\"/advanced/anonymous-subroutines/\">pointy block<\/a><\/strong>, which lists its parameters after the arrow <code>-&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The second is the <strong><a href=\"/advanced/whatever/\">Whatever<\/a><\/strong> form, where a <code>*<\/code> stands in for the argument and the expression around it becomes a one-argument function:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Both create the same kind of thing: a piece of code you can store, pass, and call.<\/span> <span class=\"sg\" data-s=\"1\">Lambdas shine as arguments to higher-order functions, where naming them would only get in the way:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The pointy form is clearer when the body is longer or takes several parameters; the Whatever form is wonderfully short for simple expressions.<\/span> <span class=\"sg\" data-s=\"1\">They are two spellings of the same idea: a function without a name.<\/span><\/p>"]]},"de":{"t":"Lambdas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Lambda<\/em> ist eine Funktion ohne Namen.<\/span> <span class=\"sg\" data-s=\"1\">Zwei Schreibweisen dafür kennen Sie bereits.<\/span> <span class=\"sg\" data-s=\"2\">Die erste ist der <strong><a href=\"https://course.raku.org/de/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Pointy Block<\/a><\/strong>, der seine Parameter hinter dem Pfeil <code>-&gt;<\/code> aufführt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die zweite ist die <strong><a href=\"https://course.raku.org/de/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>-Form, in der ein <code>*<\/code> für das Argument steht und der Ausdruck darum herum zu einer einstelligen Funktion wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide erzeugen dieselbe Art Ding: ein Stück Code, das Sie ablegen, weitergeben und aufrufen können.<\/span> <span class=\"sg\" data-s=\"1\">Lambdas glänzen als Argumente für Funktionen höherer Ordnung, wo ein Name nur im Weg wäre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Pointy-Form ist klarer, wenn der Rumpf länger ist oder mehrere Parameter hat; die Whatever-Form ist für einfache Ausdrücke herrlich kurz.<\/span> <span class=\"sg\" data-s=\"1\">Es sind zwei Schreibweisen desselben Gedankens: eine Funktion ohne Namen.<\/span><\/p>"]]},"nl":{"t":"Lambda's","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>lambda<\/em> is een functie zonder naam.<\/span> <span class=\"sg\" data-s=\"1\">Je bent al twee manieren tegengekomen om er een te schrijven.<\/span> <span class=\"sg\" data-s=\"2\">De eerste is het <strong><a href=\"https://course.raku.org/nl/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">pointy block<\/a><\/strong>, dat zijn parameters achter de pijl <code>-&gt;<\/code> opsomt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De tweede is de <strong><a href=\"https://course.raku.org/nl/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>-vorm, waarin een <code>*<\/code> voor het argument staat en de uitdrukking eromheen een functie met één argument wordt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide maken hetzelfde soort ding: een stuk code dat je kunt bewaren, doorgeven en aanroepen.<\/span> <span class=\"sg\" data-s=\"1\">Lambda's komen het best tot hun recht als argumenten voor hogere-ordefuncties, waar ze een naam geven alleen maar in de weg zou zitten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De pointy vorm is duidelijker wanneer de body langer is of meerdere parameters heeft; de Whatever-vorm is heerlijk kort voor eenvoudige uitdrukkingen.<\/span> <span class=\"sg\" data-s=\"1\">Het zijn twee schrijfwijzen van hetzelfde idee: een functie zonder naam.<\/span><\/p>"]]},"es":{"t":"Lambdas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una <em>lambda<\/em> es una función sin nombre.<\/span> <span class=\"sg\" data-s=\"1\">Ya has conocido dos formas de escribir una.<\/span> <span class=\"sg\" data-s=\"2\">La primera es el <strong><a href=\"https://course.raku.org/es/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">bloque con flecha<\/a><\/strong>, que enumera sus parámetros tras la flecha <code>-&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La segunda es la forma <strong><a href=\"https://course.raku.org/es/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>, donde un <code>*<\/code> ocupa el lugar del argumento y la expresión que lo rodea se convierte en una función de un argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambas crean la misma clase de cosa: un fragmento de código que puedes guardar, pasar y llamar.<\/span> <span class=\"sg\" data-s=\"1\">Las lambdas brillan como argumentos de las funciones de orden superior, donde ponerles nombre solo estorbaría:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma con flecha es más clara cuando el cuerpo es más largo o recibe varios parámetros; la forma Whatever es maravillosamente breve para expresiones sencillas.<\/span> <span class=\"sg\" data-s=\"1\">Son dos grafías de la misma idea: una función sin nombre.<\/span><\/p>"]]},"it":{"t":"Lambda","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una <em>lambda<\/em> è una funzione senza nome.<\/span> <span class=\"sg\" data-s=\"1\">Hai già incontrato due modi di scriverne una.<\/span> <span class=\"sg\" data-s=\"2\">Il primo è il <strong><a href=\"https://course.raku.org/it/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">blocco con la freccia<\/a><\/strong>, che elenca i propri parametri dopo la freccia <code>-&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il secondo è la forma <strong><a href=\"https://course.raku.org/it/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>, dove un <code>*<\/code> sta al posto dell'argomento e l'espressione attorno diventa una funzione a un argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entrambi creano lo stesso genere di cosa: un pezzo di codice che puoi conservare, passare e chiamare.<\/span> <span class=\"sg\" data-s=\"1\">Le lambda brillano come argomenti delle funzioni di ordine superiore, dove dar loro un nome sarebbe solo d'intralcio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma con la freccia è più chiara quando il corpo è più lungo o prende parecchi parametri; la forma Whatever è splendidamente breve per le espressioni semplici.<\/span> <span class=\"sg\" data-s=\"1\">Sono due grafie della stessa idea: una funzione senza nome.<\/span><\/p>"]]},"ru":{"t":"Лямбды","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Лямбда<\/em> — это функция без имени.<\/span> <span class=\"sg\" data-s=\"1\">Два способа её записи вы уже встречали.<\/span> <span class=\"sg\" data-s=\"2\">Первый — <strong><a href=\"https://course.raku.org/ru/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">стрелочный блок<\/a><\/strong>, который перечисляет свои параметры после стрелки <code>-&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второй — форма с <strong><a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>, где <code>*<\/code> замещает аргумент, а окружающее выражение становится функцией одного аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оба создают одно и то же: кусочек кода, который можно сохранить, передать и вызвать.<\/span> <span class=\"sg\" data-s=\"1\">Лямбды особенно хороши в роли аргументов функций высшего порядка, где имя только мешало бы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стрелочная форма понятнее, когда тело длиннее или параметров несколько; форма с Whatever восхитительно коротка для простых выражений.<\/span> <span class=\"sg\" data-s=\"1\">Это два написания одной идеи — функции без имени.<\/span><\/p>"]]},"uk":{"t":"Лямбди","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Лямбда<\/em> — це функція без імені.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже зустрічали два способи її записати.<\/span> <span class=\"sg\" data-s=\"2\">Перший — це <strong><a href=\"https://course.raku.org/uk/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">гострий блок<\/a><\/strong>, що перелічує свої параметри після стрілки <code>-&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другий — форма <strong><a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>, у якій <code>*<\/code> заступає аргумент, а вираз навколо нього стає функцією від одного аргументу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва створюють ту саму річ: шматок коду, який можна зберігати, передавати й викликати.<\/span> <span class=\"sg\" data-s=\"1\">Лямбди сяють як аргументи функцій вищого порядку, де ім'я лише заважало б:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Гостра форма зрозуміліша, коли тіло довше або параметрів кілька; форма з Whatever чудово коротка для простих виразів.<\/span> <span class=\"sg\" data-s=\"1\">Це два написання однієї ідеї: функції без імені.<\/span><\/p>"]]},"bg":{"t":"Ламбди","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Ламбдата<\/em> е функция без име.<\/span> <span class=\"sg\" data-s=\"1\">Вече срещнахте два начина да я запишете.<\/span> <span class=\"sg\" data-s=\"2\">Първият е <strong><a href=\"https://course.raku.org/bg/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">острият блок<\/a><\/strong>, който изброява параметрите си след стрелката <code>-&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = -&gt; $x { $x * $x };\nsay square(7); # 49<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вторият е формата <strong><a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a><\/strong>, в която <code>*<\/code> замества аргумента, а изразът около нея става функция от един аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;square = * ** 2;\nsay square(7); # 49<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двете създават едно и също нещо: парче код, което можете да съхранявате, подавате и извиквате.<\/span> <span class=\"sg\" data-s=\"1\">Ламбдите блестят като аргументи на функции от по-висок ред, където именуването им само би пречило:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(-&gt; $n { $n * $n }); # (1 4 9 16 25)\nsay (1..5).map(* ** 2);            # (1 4 9 16 25)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Острата форма е по-ясна, когато тялото е по-дълго или параметрите са няколко; формата с Whatever е чудесно кратка за прости изрази.<\/span> <span class=\"sg\" data-s=\"1\">Те са два записа на една и съща идея: функция без име.<\/span><\/p>"]]}}}</script>
