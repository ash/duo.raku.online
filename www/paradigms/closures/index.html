<script type="application/json" id="page-data">{"u":"paradigms/closures","n":1191,"k":"section","pv":"paradigms/higher-order/exercises/filter-block/solution","nx":"paradigms/closures/lambdas","tr":["paradigms"],"L":{"en":{"t":"Lambdas and closures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>lambda<\/em> is a small, nameless function written inline — exactly the pointy blocks and Whatever expressions you have been passing to <code>map<\/code> and friends.<\/span> <span class=\"sg\" data-s=\"1\">A <em>closure<\/em> is a lambda (or any subroutine) that remembers variables from the place where it was created.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closures are what make returned subroutines so useful: they carry a little piece of private state with them.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at both ideas.<\/span><\/p>"]]},"de":{"t":"Lambdas und Closures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Lambda<\/em> ist eine kleine, namenlose Funktion, die man inline schreibt — genau die Pointy Blocks und Whatever-Ausdrücke, die Sie an <code>map<\/code> und Verwandte übergeben haben.<\/span> <span class=\"sg\" data-s=\"1\">Eine <em>Closure<\/em> ist ein Lambda (oder eine beliebige Subroutine), das sich Variablen von der Stelle merkt, an der es erzeugt wurde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closures machen zurückgegebene Subroutinen so nützlich: Sie tragen ein kleines Stück eigenen Zustand mit sich.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet beide Gedanken.<\/span><\/p>"]]},"nl":{"t":"Lambda's en closures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>lambda<\/em> is een kleine, naamloze functie die je inline schrijft — precies de pointy blocks en Whatever-uitdrukkingen die je aan <code>map<\/code> en verwanten hebt meegegeven.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>closure<\/em> is een lambda (of elke subroutine) die variabelen onthoudt uit de plek waar hij gemaakt is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closures zijn wat teruggegeven subroutines zo nuttig maakt: ze dragen een klein stukje private toestand met zich mee.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie bekijkt beide ideeën.<\/span><\/p>"]]},"es":{"t":"Lambdas y clausuras","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>lambda<\/em> es una función pequeña y sin nombre escrita en línea: exactamente los bloques con flecha y las expresiones Whatever que has estado pasando a <code>map<\/code> y compañía.<\/span> <span class=\"sg\" data-s=\"1\">Una <em>clausura<\/em> es una lambda (o cualquier subrutina) que recuerda variables del lugar donde se creó.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las clausuras son lo que hace tan útiles a las subrutinas devueltas: llevan consigo un pequeño trozo de estado privado.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección examina ambas ideas.<\/span><\/p>"]]},"it":{"t":"Lambda e chiusure","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>lambda<\/em> è una piccola funzione senza nome scritta in linea — esattamente i blocchi con la freccia e le espressioni Whatever che hai passato a <code>map<\/code> e compagnia.<\/span> <span class=\"sg\" data-s=\"1\">Una <em>chiusura<\/em> è una lambda (o una qualunque subroutine) che ricorda le variabili del posto in cui è stata creata.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le chiusure sono ciò che rende così utili le subroutine restituite: portano con sé un piccolo pezzo di stato privato.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione guarda entrambe le idee.<\/span><\/p>"]]},"ru":{"t":"Лямбды и замыкания","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Лямбда<\/em> — это маленькая безымянная функция, записанная прямо на месте: ровно те стрелочные блоки и выражения с Whatever, которые вы передавали в <code>map<\/code> и ему подобные. <em>Замыкание<\/em> — это лямбда (или любая подпрограмма), которая помнит переменные из того места, где была создана.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именно замыкания и делают возвращаемые подпрограммы такими полезными: они несут с собой немного собственного состояния.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются обе идеи.<\/span><\/p>"]]},"uk":{"t":"Лямбди та замикання","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Лямбда<\/em> — це маленька безіменна функція, записана просто на місці, — рівно ті гострі блоки та вирази з Whatever, які ви передавали в <code>map<\/code> та подібні до нього. <em>Замикання<\/em> — це лямбда (або будь-яка підпрограма), що пам'ятає змінні з того місця, де її було створено.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме замикання роблять повернені підпрограми такими корисними: вони несуть із собою невеликий шматочок приватного стану.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає обидві ідеї.<\/span><\/p>"]]},"bg":{"t":"Ламбди и затваряния","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Ламбдата<\/em> е малка безименна функция, написана направо на място — точно острите блокове и изразите с Whatever, които подавахте на <code>map<\/code> и подобните му. <em>Затварянето<\/em> е ламбда (или каквато и да е подпрограма), която помни променливи от мястото, където е създадена.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именно затварянията правят върнатите подпрограми толкова полезни: те носят със себе си малко късче частно състояние.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда и двете идеи.<\/span><\/p>"]]}}}</script>
