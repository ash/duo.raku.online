<script type="application/json" id="page-data">{"u":"paradigms/higher-order","n":1179,"k":"section","pv":"paradigms/recursion/exercises/triangular-number/solution","nx":"paradigms/higher-order/passing-subs","tr":["paradigms"],"L":{"en":{"t":"Higher-order functions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, a subroutine is an ordinary value: you can store it in a variable, pass it to another subroutine, and return it as a result.<\/span> <span class=\"sg\" data-s=\"1\">A subroutine that <strong>takes<\/strong> or <strong>returns<\/strong> another subroutine is called a <em>higher-order function<\/em>, and it is the heart of functional programming.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You have already used higher-order functions without naming them — <code>map<\/code>, <code>grep<\/code>, and <code>sort<\/code> all take a block of code as an argument.<\/span> <span class=\"sg\" data-s=\"1\">This section shows how to write your own.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">These block-taking methods are also a natural place for the <em>colon call<\/em> form, which lets you drop the parentheses — <code>(1..10).grep: * %% 2<\/code> instead of <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is introduced in <a href=\"/advanced/colon-calls/\">Calling with a colon<\/a>, and the <code>*<\/code> shorthand it uses is the <a href=\"/advanced/whatever/\">Whatever star<\/a>.<\/span><\/p>"]]},"de":{"t":"Funktionen höherer Ordnung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku ist eine Subroutine ein gewöhnlicher Wert: Sie können sie in einer Variablen ablegen, sie einer anderen Subroutine übergeben und sie als Ergebnis zurückliefern.<\/span> <span class=\"sg\" data-s=\"1\">Eine Subroutine, die eine andere Subroutine <strong>aufnimmt<\/strong> oder <strong>zurückgibt<\/strong>, heißt <em>Funktion höherer Ordnung<\/em>, und sie ist das Herz der funktionalen Programmierung.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funktionen höherer Ordnung haben Sie schon verwendet, ohne sie so zu nennen — <code>map<\/code>, <code>grep<\/code> und <code>sort<\/code> nehmen alle einen Codeblock als Argument.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt, wie Sie eigene schreiben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese blockannehmenden Methoden sind auch ein natürlicher Ort für die Form mit <em>Doppelpunkt<\/em>, die Ihnen erlaubt, die Klammern wegzulassen — <code>(1..10).grep: * %% 2<\/code> statt <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie wird in <a href=\"https://course.raku.org/de/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Aufrufen mit Doppelpunkt<\/a> eingeführt, und die Abkürzung <code>*<\/code>, die sie verwendet, ist der <a href=\"https://course.raku.org/de/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever-Stern<\/a>.<\/span><\/p>"]]},"nl":{"t":"Hogere-ordefuncties","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku is een subroutine een gewone waarde: je kunt haar in een variabele bewaren, haar aan een andere subroutine meegeven, en haar als resultaat teruggeven.<\/span> <span class=\"sg\" data-s=\"1\">Een subroutine die een andere subroutine <strong>aanneemt<\/strong> of <strong>teruggeeft<\/strong> heet een <em>hogere-ordefunctie<\/em>, en dat is het hart van functioneel programmeren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt al hogere-ordefuncties gebruikt zonder ze zo te noemen — <code>map<\/code>, <code>grep<\/code> en <code>sort<\/code> nemen allemaal een codeblok als argument.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie laat zien hoe je die zelf schrijft.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze methoden die een blok aannemen zijn ook een natuurlijke plek voor de vorm met <em>dubbele punt<\/em>, waarmee je de haakjes kunt weglaten — <code>(1..10).grep: * %% 2<\/code> in plaats van <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die wordt geïntroduceerd in <a href=\"https://course.raku.org/nl/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Aanroepen met een dubbele punt<\/a>, en de afkorting <code>*<\/code> die hij gebruikt is de <a href=\"https://course.raku.org/nl/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever-ster<\/a>.<\/span><\/p>"]]},"es":{"t":"Funciones de orden superior","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, una subrutina es un valor ordinario: puedes guardarla en una variable, pasarla a otra subrutina y devolverla como resultado.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina que <strong>recibe<\/strong> o <strong>devuelve<\/strong> otra subrutina se llama <em>función de orden superior<\/em>, y es el corazón de la programación funcional.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya has usado funciones de orden superior sin nombrarlas: <code>map<\/code>, <code>grep<\/code> y <code>sort<\/code> reciben todas un bloque de código como argumento.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección muestra cómo escribir las tuyas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estos métodos que reciben bloques son también un sitio natural para la forma de la <em>llamada con dos puntos<\/em>, que te permite quitar los paréntesis: <code>(1..10).grep: * %% 2<\/code> en lugar de <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se presenta en <a href=\"https://course.raku.org/es/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Llamar con dos puntos<\/a>, y el atajo <code>*<\/code> que usa es la <a href=\"https://course.raku.org/es/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">estrella Whatever<\/a>.<\/span><\/p>"]]},"it":{"t":"Funzioni di ordine superiore","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku una subroutine è un valore ordinario: puoi conservarla in una variabile, passarla a un'altra subroutine e restituirla come risultato.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine che <strong>prende<\/strong> o <strong>restituisce<\/strong> un'altra subroutine si chiama <em>funzione di ordine superiore<\/em>, ed è il cuore della programmazione funzionale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai già usato funzioni di ordine superiore senza chiamarle per nome: <code>map<\/code>, <code>grep<\/code> e <code>sort<\/code> prendono tutte un blocco di codice come argomento.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra come scrivere le tue.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questi metodi che prendono blocchi sono anche un posto naturale per la forma della <em>chiamata con i due punti<\/em>, che ti permette di lasciar cadere le parentesi — <code>(1..10).grep: * %% 2<\/code> invece di <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È introdotta in <a href=\"https://course.raku.org/it/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Chiamare con i due punti<\/a>, e la scorciatoia <code>*<\/code> che usa è la <a href=\"https://course.raku.org/it/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">stella Whatever<\/a>.<\/span><\/p>"]]},"ru":{"t":"Функции высшего порядка","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku подпрограмма — обычное значение: её можно сохранить в переменной, передать другой подпрограмме и вернуть как результат.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограмму, которая <strong>принимает<\/strong> или <strong>возвращает<\/strong> другую подпрограмму, называют <em>функцией высшего порядка<\/em>, и она — сердце функционального программирования.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже пользовались функциями высшего порядка, не называя их так: <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code> — все они принимают блок кода в качестве аргумента.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе показано, как писать собственные.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти принимающие блок методы — ещё и естественное место для формы <em>вызова с двоеточием<\/em>, которая позволяет обойтись без скобок: <code>(1..10).grep: * %% 2<\/code> вместо <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она вводится в теме <a href=\"https://course.raku.org/ru/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Вызов с двоеточием<\/a>, а используемое в ней сокращение <code>*<\/code> — это <a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">звезда Whatever<\/a>.<\/span><\/p>"]]},"uk":{"t":"Функції вищого порядку","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku підпрограма є звичайним значенням: її можна зберегти у змінній, передати іншій підпрограмі та повернути як результат.<\/span> <span class=\"sg\" data-s=\"1\">Підпрограму, що <strong>приймає<\/strong> або <strong>повертає<\/strong> іншу підпрограму, називають <em>функцією вищого порядку<\/em>, і саме вона є серцем функційного програмування.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися функціями вищого порядку, не називаючи їх так: <code>map<\/code>, <code>grep<\/code> та <code>sort<\/code> усі приймають блок коду як аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує, як писати власні.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ці методи, що приймають блок, є також природним місцем для форми <em>виклику з двокрапкою<\/em>, яка дозволяє опустити дужки — <code>(1..10).grep: * %% 2<\/code> замість <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Її представлено у <a href=\"https://course.raku.org/uk/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Виклику з двокрапкою<\/a>, а скорочення <code>*<\/code>, яке вона використовує, — це <a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">зірочка Whatever<\/a>.<\/span><\/p>"]]},"bg":{"t":"Функции от по-висок ред","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku подпрограмата е обикновена стойност: можете да я съхраните в променлива, да я подадете на друга подпрограма и да я върнете като резултат.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограма, която <strong>приема<\/strong> или <strong>връща<\/strong> друга подпрограма, се нарича <em>функция от по-висок ред<\/em> и е сърцето на функционалното програмиране.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вие вече използвахте функции от по-висок ред, без да ги наричате така: <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code> приемат блок код като аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва как да напишете свои собствени.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тези методи, приемащи блок, са и естественото място за формата <em>извикване с двоеточие<\/em>, която позволява да пропуснете скобите — <code>(1..10).grep: * %% 2<\/code> вместо <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя е въведена в <a href=\"https://course.raku.org/bg/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Извикване с двоеточие<\/a>, а скъсяването <code>*<\/code>, което тя използва, е <a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">звездата Whatever<\/a>.<\/span><\/p>"]]}}}</script>
