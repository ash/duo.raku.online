<script type="application/json" id="page-data">{"u":"paradigms/higher-order/returning-subs","n":1182,"k":"topic","pv":"paradigms/higher-order/passing-subs/quiz","nx":"paradigms/higher-order/returning-subs/quiz","tr":["paradigms","paradigms/higher-order"],"L":{"en":{"t":"Returning subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A subroutine can also <strong>return<\/strong> a subroutine.<\/span> <span class=\"sg\" data-s=\"1\">This lets you build new functions on the fly, tailored to the arguments you give:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> builds and returns an anonymous subroutine that adds <code>5<\/code> to its argument.<\/span> <span class=\"sg\" data-s=\"1\">We store it in <code>&amp;add5<\/code> and call it like any other subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Calling <code>adder(10)<\/code> would give a different adder that adds ten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notice that the returned subroutine remembers the value of <code>$n<\/code> from the call that created it — <code>add5<\/code> keeps its <code>5<\/code> even after <code>adder<\/code> has finished.<\/span> <span class=\"sg\" data-s=\"1\">A subroutine that captures values from the scope where it was created is called a <a href=\"/paradigms/closures/\"><em>closure<\/em><\/a>, the subject of the next section.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Returning functions is a compact way to produce families of related operations without repeating yourself: one <code>adder<\/code> definition yields an unlimited number of specific adders.<\/span><\/p>"]]},"de":{"t":"Subroutinen zurückgeben","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine kann auch eine Subroutine <strong>zurückgeben<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Damit bauen Sie im laufenden Betrieb neue Funktionen, zugeschnitten auf die Argumente, die Sie mitgeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> baut eine anonyme Subroutine, die <code>5<\/code> zu ihrem Argument addiert, und liefert sie zurück.<\/span> <span class=\"sg\" data-s=\"1\">Wir legen sie in <code>&amp;add5<\/code> ab und rufen sie wie jede andere Subroutine auf.<\/span> <span class=\"sg\" data-s=\"2\"><code>adder(10)<\/code> aufzurufen ergäbe einen anderen Addierer, der zehn addiert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass sich die zurückgegebene Subroutine den Wert von <code>$n<\/code> aus dem Aufruf merkt, der sie erzeugt hat — <code>add5<\/code> behält seine <code>5<\/code> auch dann, wenn <code>adder<\/code> längst fertig ist.<\/span> <span class=\"sg\" data-s=\"1\">Eine Subroutine, die Werte aus dem Bereich einfängt, in dem sie erzeugt wurde, heißt <a href=\"https://course.raku.org/de/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>Closure<\/em><\/a>, das Thema des nächsten Abschnitts.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funktionen zurückzugeben ist ein knapper Weg, ganze Familien verwandter Operationen zu erzeugen, ohne sich zu wiederholen: Eine <code>adder<\/code>-Definition liefert unbegrenzt viele bestimmte Addierer.<\/span><\/p>"]]},"nl":{"t":"Subroutines teruggeven","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een subroutine kan ook een subroutine <strong>teruggeven<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Zo bouw je gaandeweg nieuwe functies, op maat van de argumenten die je meegeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> bouwt en geeft een anonieme subroutine terug die <code>5<\/code> bij haar argument optelt.<\/span> <span class=\"sg\" data-s=\"1\">We bewaren die in <code>&amp;add5<\/code> en roepen haar aan als elke andere subroutine.<\/span> <span class=\"sg\" data-s=\"2\"><code>adder(10)<\/code> aanroepen zou een andere opteller geven die er tien bij optelt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de teruggegeven subroutine de waarde van <code>$n<\/code> onthoudt uit de aanroep die haar maakte — <code>add5<\/code> houdt haar <code>5<\/code> ook nadat <code>adder<\/code> klaar is.<\/span> <span class=\"sg\" data-s=\"1\">Een subroutine die waarden vastlegt uit het bereik waar ze gemaakt is, heet een <a href=\"https://course.raku.org/nl/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>closure<\/em><\/a>, het onderwerp van de volgende sectie.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Functies teruggeven is een compacte manier om families van verwante bewerkingen te maken zonder jezelf te herhalen: één definitie van <code>adder<\/code> levert een onbeperkt aantal specifieke optellers op.<\/span><\/p>"]]},"es":{"t":"Devolver subrutinas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina también puede <strong>devolver<\/strong> una subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Esto te permite construir funciones nuevas sobre la marcha, a medida de los argumentos que le des:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> construye y devuelve una subrutina anónima que suma <code>5<\/code> a su argumento.<\/span> <span class=\"sg\" data-s=\"1\">La guardamos en <code>&amp;add5<\/code> y la llamamos como a cualquier otra subrutina.<\/span> <span class=\"sg\" data-s=\"2\">Llamar a <code>adder(10)<\/code> daría un sumador distinto que suma diez.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que la subrutina devuelta recuerda el valor de <code>$n<\/code> de la llamada que la creó: <code>add5<\/code> conserva su <code>5<\/code> incluso después de que <code>adder<\/code> haya terminado.<\/span> <span class=\"sg\" data-s=\"1\">A una subrutina que captura valores del ámbito donde se creó se la llama <a href=\"https://course.raku.org/es/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>clausura<\/em><\/a>, el tema de la sección siguiente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Devolver funciones es una forma compacta de producir familias de operaciones emparentadas sin repetirte: una sola definición de <code>adder<\/code> genera un número ilimitado de sumadores concretos.<\/span><\/p>"]]},"it":{"t":"Restituire subroutine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine può anche <strong>restituire<\/strong> una subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Questo ti permette di costruire nuove funzioni al volo, su misura per gli argomenti che dai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> costruisce e restituisce una subroutine anonima che aggiunge <code>5<\/code> al proprio argomento.<\/span> <span class=\"sg\" data-s=\"1\">La conserviamo in <code>&amp;add5<\/code> e la chiamiamo come qualunque altra subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Chiamare <code>adder(10)<\/code> darebbe un sommatore diverso che aggiunge dieci.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che la subroutine restituita ricorda il valore di <code>$n<\/code> dalla chiamata che l'ha creata: <code>add5<\/code> conserva il suo <code>5<\/code> anche dopo che <code>adder<\/code> è terminata.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine che cattura valori dall'ambito in cui è stata creata si chiama <a href=\"https://course.raku.org/it/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>chiusura<\/em><\/a>, l'argomento della sezione successiva.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Restituire funzioni è un modo compatto di produrre famiglie di operazioni imparentate senza ripetersi: un'unica definizione di <code>adder<\/code> genera un numero illimitato di sommatori specifici.<\/span><\/p>"]]},"ru":{"t":"Возврат подпрограмм","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма может и <strong>возвращать<\/strong> подпрограмму.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет строить новые функции на лету, подгоняя их под переданные аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> строит и возвращает анонимную подпрограмму, прибавляющую <code>5<\/code> к своему аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Мы сохраняем её в <code>&amp;add5<\/code> и вызываем как любую другую подпрограмму.<\/span> <span class=\"sg\" data-s=\"2\">Вызов <code>adder(10)<\/code> дал бы другой сумматор, прибавляющий десять.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что возвращённая подпрограмма помнит значение <code>$n<\/code> из того вызова, который её создал: <code>add5<\/code> держит свою <code>5<\/code> даже после того, как <code>adder<\/code> завершился.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограмму, которая захватывает значения из области видимости, где была создана, называют <a href=\"https://course.raku.org/ru/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>замыканием<\/em><\/a> — ему посвящён следующий раздел.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Возврат функций — компактный способ порождать семейства родственных операций, не повторяясь: одно определение <code>adder<\/code> даёт неограниченное число конкретных сумматоров.<\/span><\/p>"]]},"uk":{"t":"Повернення підпрограм","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма може також <strong>повертати<\/strong> підпрограму.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє будувати нові функції на льоту, припасовані до аргументів, які ви передаєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> будує й повертає анонімну підпрограму, що додає <code>5<\/code> до свого аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Ми зберігаємо її в <code>&amp;add5<\/code> і викликаємо, як будь-яку іншу підпрограму.<\/span> <span class=\"sg\" data-s=\"2\">Виклик <code>adder(10)<\/code> дав би інший додавач, що додає десять.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що повернена підпрограма пам'ятає значення <code>$n<\/code> із того виклику, що її створив, — <code>add5<\/code> зберігає свою <code>5<\/code> навіть після того, як <code>adder<\/code> завершився.<\/span> <span class=\"sg\" data-s=\"1\">Підпрограму, що захоплює значення з області, у якій її створено, називають <a href=\"https://course.raku.org/uk/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>замиканням<\/em><\/a>, і це тема наступного розділу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повернення функцій — компактний спосіб виробляти сімейства споріднених операцій, не повторюючись: одне визначення <code>adder<\/code> дає необмежену кількість конкретних додавачів.<\/span><\/p>"]]},"bg":{"t":"Връщане на подпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата може и да <strong>връща<\/strong> подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Това ви позволява да строите нови функции в движение, скроени според аргументите, които подавате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub adder($n) {\n    sub ($x) { $x + $n };\n}\n\nmy &amp;add5 = adder(5);\nsay add5(3); # 8<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>adder(5)<\/code> изгражда и връща анонимна подпрограма, която добавя <code>5<\/code> към аргумента си.<\/span> <span class=\"sg\" data-s=\"1\">Съхраняваме я в <code>&amp;add5<\/code> и я извикваме като всяка друга подпрограма.<\/span> <span class=\"sg\" data-s=\"2\">Извикването на <code>adder(10)<\/code> би дало друг събирач, който добавя десет.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че върнатата подпрограма помни стойността на <code>$n<\/code> от извикването, което я е създало — <code>add5<\/code> пази своята <code>5<\/code> дори след като <code>adder<\/code> е приключил.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограма, която улавя стойности от обхвата, в който е създадена, се нарича <a href=\"https://course.raku.org/bg/paradigms/closures/\" target=\"_blank\" rel=\"noopener\"><em>затваряне<\/em><\/a> и е темата на следващия раздел.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Връщането на функции е сбит начин да произвеждате семейства от сродни операции, без да се повтаряте: едно определение на <code>adder<\/code> дава неограничен брой конкретни събирачи.<\/span><\/p>"]]}}}</script>
