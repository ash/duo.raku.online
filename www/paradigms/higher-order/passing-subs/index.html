<script type="application/json" id="page-data">{"u":"paradigms/higher-order/passing-subs","n":1180,"k":"topic","pv":"paradigms/higher-order","nx":"paradigms/higher-order/passing-subs/quiz","tr":["paradigms","paradigms/higher-order"],"L":{"en":{"t":"Passing subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To accept a subroutine as a parameter, declare it with the <code>&amp;<\/code> sigil.<\/span> <span class=\"sg\" data-s=\"1\">Inside the body you can then call it by name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The parameter <code>&amp;f<\/code> receives a piece of code, and <code>f($x)<\/code> calls it.<\/span> <span class=\"sg\" data-s=\"1\">Here we passed <code>* + 3<\/code>, a <em>Whatever<\/em> expression that means “add three to whatever you are given”, so <code>apply(* + 3, 10)<\/code> computes <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can pass a named subroutine just as easily, by referring to it with the <code>&amp;<\/code> sigil so that it is passed rather than called:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is exactly how <code>map<\/code> and <code>grep<\/code> work: they are subroutines that take another subroutine — your block — and apply it to each element.<\/span> <span class=\"sg\" data-s=\"1\">Writing your own subroutines that take code makes them just as flexible.<\/span><\/p>"]]},"de":{"t":"Subroutinen übergeben","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um eine Subroutine als Parameter aufzunehmen, deklarieren Sie sie mit der Sigil <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Im Rumpf können Sie sie dann namentlich aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Parameter <code>&amp;f<\/code> erhält ein Stück Code, und <code>f($x)<\/code> ruft es auf.<\/span> <span class=\"sg\" data-s=\"1\">Hier haben wir <code>* + 3<\/code> übergeben, einen <em>Whatever<\/em>-Ausdruck, der „addiere drei zu dem, was du bekommst“ bedeutet, <code>apply(* + 3, 10)<\/code> berechnet also <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine benannte Subroutine übergeben Sie ebenso leicht, indem Sie mit der Sigil <code>&amp;<\/code> auf sie verweisen, damit sie übergeben und nicht aufgerufen wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Genau so arbeiten <code>map<\/code> und <code>grep<\/code>: Es sind Subroutinen, die eine andere Subroutine — Ihren Block — aufnehmen und auf jedes Element anwenden.<\/span> <span class=\"sg\" data-s=\"1\">Eigene Subroutinen zu schreiben, die Code aufnehmen, macht sie ebenso beweglich.<\/span><\/p>"]]},"nl":{"t":"Subroutines meegeven","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een subroutine als parameter aan te nemen, declareer je haar met de sigil <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Binnen de body kun je haar dan bij naam aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De parameter <code>&amp;f<\/code> ontvangt een stuk code, en <code>f($x)<\/code> roept het aan.<\/span> <span class=\"sg\" data-s=\"1\">Hier gaven we <code>* + 3<\/code> mee, een <em>Whatever<\/em>-uitdrukking die betekent \"tel drie op bij wat je ook krijgt\", dus berekent <code>apply(* + 3, 10)<\/code> <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een benoemde subroutine geef je net zo gemakkelijk mee, door ernaar te verwijzen met de sigil <code>&amp;<\/code> zodat ze meegegeven en niet aangeroepen wordt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Precies zo werken <code>map<\/code> en <code>grep<\/code>: het zijn subroutines die een andere subroutine — jouw blok — aannemen en op elk element toepassen.<\/span> <span class=\"sg\" data-s=\"1\">Zelf subroutines schrijven die code aannemen maakt ze net zo flexibel.<\/span><\/p>"]]},"es":{"t":"Pasar subrutinas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para aceptar una subrutina como parámetro, decláralo con el sigilo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dentro del cuerpo puedes llamarla entonces por su nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El parámetro <code>&amp;f<\/code> recibe un fragmento de código, y <code>f($x)<\/code> lo llama.<\/span> <span class=\"sg\" data-s=\"1\">Aquí pasamos <code>* + 3<\/code>, una expresión <em>Whatever<\/em> que significa «suma tres a lo que te den», así que <code>apply(* + 3, 10)<\/code> calcula <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes pasar con la misma facilidad una subrutina con nombre, refiriéndote a ella con el sigilo <code>&amp;<\/code> para que se pase en lugar de llamarse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así es exactamente como funcionan <code>map<\/code> y <code>grep<\/code>: son subrutinas que reciben otra subrutina — tu bloque — y la aplican a cada elemento.<\/span> <span class=\"sg\" data-s=\"1\">Escribir subrutinas propias que reciben código las hace igual de flexibles.<\/span><\/p>"]]},"it":{"t":"Passare subroutine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per accettare una subroutine come parametro, dichiarala con il sigillo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dentro il corpo puoi poi chiamarla per nome:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il parametro <code>&amp;f<\/code> riceve un pezzo di codice, e <code>f($x)<\/code> lo chiama.<\/span> <span class=\"sg\" data-s=\"1\">Qui abbiamo passato <code>* + 3<\/code>, un'espressione <em>Whatever<\/em> che significa «aggiungi tre a qualunque cosa ti venga data», quindi <code>apply(* + 3, 10)<\/code> calcola <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi passare altrettanto facilmente una subroutine con nome, riferendoti a essa con il sigillo <code>&amp;<\/code> così che venga passata invece di essere chiamata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È esattamente così che funzionano <code>map<\/code> e <code>grep<\/code>: sono subroutine che prendono un'altra subroutine — il tuo blocco — e la applicano a ogni elemento.<\/span> <span class=\"sg\" data-s=\"1\">Scrivere subroutine tue che prendono codice le rende altrettanto flessibili.<\/span><\/p>"]]},"ru":{"t":"Передача подпрограмм","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы принять подпрограмму как параметр, объявите его с сигилом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Внутри тела её можно вызывать по имени:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметр <code>&amp;f<\/code> получает кусочек кода, а <code>f($x)<\/code> его вызывает.<\/span> <span class=\"sg\" data-s=\"1\">Здесь мы передали <code>* + 3<\/code> — выражение с <em>Whatever<\/em>, означающее «прибавь три к тому, что тебе дадут», — поэтому <code>apply(* + 3, 10)<\/code> вычисляет <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именованную подпрограмму передать так же просто: сошлитесь на неё с сигилом <code>&amp;<\/code>, чтобы она была передана, а не вызвана:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ровно так и работают <code>map<\/code> и <code>grep<\/code>: это подпрограммы, которые принимают другую подпрограмму — ваш блок — и применяют её к каждому элементу.<\/span> <span class=\"sg\" data-s=\"1\">Если ваши собственные подпрограммы тоже будут принимать код, они станут такими же гибкими.<\/span><\/p>"]]},"uk":{"t":"Передавання підпрограм","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб прийняти підпрограму як параметр, оголосіть її із сигілом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Усередині тіла її потім можна викликати за іменем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметр <code>&amp;f<\/code> отримує шматок коду, а <code>f($x)<\/code> викликає його.<\/span> <span class=\"sg\" data-s=\"1\">Тут ми передали <code>* + 3<\/code> — вираз <em>Whatever<\/em>, що означає «додай три до того, що тобі дадуть», — тож <code>apply(* + 3, 10)<\/code> обчислює <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так само легко передати й іменовану підпрограму, посилаючись на неї із сигілом <code>&amp;<\/code>, щоб її було передано, а не викликано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме так працюють <code>map<\/code> та <code>grep<\/code>: це підпрограми, що приймають іншу підпрограму — ваш блок — і застосовують її до кожного елемента.<\/span> <span class=\"sg\" data-s=\"1\">Написання власних підпрограм, що приймають код, робить їх такими самими гнучкими.<\/span><\/p>"]]},"bg":{"t":"Подаване на подпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да приемете подпрограма като параметър, декларирайте я със сигила <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в тялото после можете да я извикате по име:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(* + 3, 10); # 13<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметърът <code>&amp;f<\/code> получава парче код, а <code>f($x)<\/code> го извиква.<\/span> <span class=\"sg\" data-s=\"1\">Тук подадохме <code>* + 3<\/code> — израз <em>Whatever<\/em>, който означава „добави три към каквото ти дадат“, — така че <code>apply(* + 3, 10)<\/code> изчислява <code>13<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Също толкова лесно можете да подадете и именувана подпрограма, като се позовете на нея със сигила <code>&amp;<\/code>, за да бъде подадена, а не извикана:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub double($n) { $n * 2 }\n\nsub apply(&amp;f, $x) {\n    f($x);\n}\n\nsay apply(&amp;double, 5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Точно така работят <code>map<\/code> и <code>grep<\/code>: те са подпрограми, които приемат друга подпрограма — вашия блок — и я прилагат към всеки елемент.<\/span> <span class=\"sg\" data-s=\"1\">Писането на собствени подпрограми, които приемат код, ги прави също толкова гъвкави.<\/span><\/p>"]]}}}</script>
