<script type="application/json" id="page-data">{"u":"paradigms/supplies/transforming","n":1331,"k":"topic","pv":"paradigms/supplies/tapping-a-supply/quiz","nx":"paradigms/supplies/transforming/quiz","tr":["paradigms","paradigms/supplies"],"L":{"en":{"t":"Transforming a supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A supply can be transformed before you tap it, much like a list.<\/span> <span class=\"sg\" data-s=\"1\">Methods such as <code>map<\/code> and <code>grep<\/code> produce a <strong>new<\/strong> supply whose values are the transformed ones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>map(* * 10)<\/code> builds a new supply that emits ten times each original value, and the tap collects those into <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> filters a supply, passing on only the values for which its block is true:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because each transformation returns another supply, you can chain them, building a small pipeline that reacts to the stream:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is the same map/grep vocabulary you know from lists, applied to values arriving over time.<\/span> <span class=\"sg\" data-s=\"1\">The supply does the pushing; your pipeline shapes what comes out.<\/span><\/p>"]]},"de":{"t":"Ein Supply umformen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Supply lässt sich vor dem Anzapfen umformen, ganz ähnlich wie eine Liste.<\/span> <span class=\"sg\" data-s=\"1\">Methoden wie <code>map<\/code> und <code>grep<\/code> erzeugen ein <strong>neues<\/strong> Supply, dessen Werte die umgeformten sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>map(* * 10)<\/code> baut ein neues Supply, das das Zehnfache jedes ursprünglichen Wertes aussendet, und die Zapfstelle sammelt diese in <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> filtert ein Supply und gibt nur die Werte weiter, für die sein Block wahr ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da jede Umformung wieder ein Supply liefert, können Sie sie aneinanderreihen und so eine kleine Pipeline bauen, die auf den Strom reagiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist derselbe Wortschatz aus map und grep, den Sie von Listen kennen, angewandt auf Werte, die im Lauf der Zeit eintreffen.<\/span> <span class=\"sg\" data-s=\"1\">Das Supply schiebt; Ihre Pipeline formt, was herauskommt.<\/span><\/p>"]]},"nl":{"t":"Een supply omvormen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een supply kan omgevormd worden voordat je hem aftapt, vrijwel als een lijst.<\/span> <span class=\"sg\" data-s=\"1\">Methoden als <code>map<\/code> en <code>grep<\/code> leveren een <strong>nieuwe<\/strong> supply op waarvan de waarden de omgevormde zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>map(* * 10)<\/code> bouwt een nieuwe supply die tien keer elke oorspronkelijke waarde uitzendt, en de tap verzamelt die in <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> filtert een supply en laat alleen de waarden door waarvoor zijn blok waar is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat elke omvorming weer een supply teruggeeft, kun je ze aaneenrijgen en zo een kleine pijplijn bouwen die op de stroom reageert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is dezelfde woordenschat van map en grep die je van lijsten kent, toegepast op waarden die in de loop van de tijd binnenkomen.<\/span> <span class=\"sg\" data-s=\"1\">De supply doet het duwen; jouw pijplijn bepaalt de vorm van wat eruit komt.<\/span><\/p>"]]},"es":{"t":"Transformar un supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply se puede transformar antes de engancharlo, muy parecido a una lista.<\/span> <span class=\"sg\" data-s=\"1\">Métodos como <code>map<\/code> y <code>grep<\/code> producen un supply <strong>nuevo<\/strong> cuyos valores son los transformados:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El <code>map(* * 10)<\/code> construye un supply nuevo que emite diez veces cada valor original, y el enganche los recoge en <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> filtra un supply, dejando pasar solo los valores para los que su bloque es verdadero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como cada transformación devuelve otro supply, puedes encadenarlas, construyendo una pequeña tubería que reacciona al flujo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este es el mismo vocabulario de map y grep que conoces de las listas, aplicado a valores que llegan a lo largo del tiempo.<\/span> <span class=\"sg\" data-s=\"1\">El supply hace el empuje; tu tubería da forma a lo que sale.<\/span><\/p>"]]},"it":{"t":"Trasformare un supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply può essere trasformato prima che tu vi attinga, un po' come un elenco.<\/span> <span class=\"sg\" data-s=\"1\">Metodi come <code>map<\/code> e <code>grep<\/code> producono un <strong>nuovo<\/strong> supply i cui valori sono quelli trasformati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il <code>map(* * 10)<\/code> costruisce un nuovo supply che emette dieci volte ogni valore originale, e la presa li raccoglie in <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> filtra un supply, lasciando passare solo i valori per i quali il suo blocco è vero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché ogni trasformazione restituisce un altro supply, puoi concatenarle, costruendo una piccola pipeline che reagisce al flusso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È lo stesso vocabolario di map e grep che conosci dagli elenchi, applicato a valori che arrivano nel tempo.<\/span> <span class=\"sg\" data-s=\"1\">Il supply fa la spinta; la tua pipeline dà forma a ciò che esce.<\/span><\/p>"]]},"lv":{"t":"Supply pārveidošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply var pārveidot, pirms tai pieslēdzas, gluži kā sarakstu.<\/span> <span class=\"sg\" data-s=\"1\">Metodes, piemēram, <code>map<\/code> un <code>grep<\/code>, rada <strong>jaunu<\/strong> supply, kuras vērtības ir pārveidotās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>map(* * 10)<\/code> uzbūvē jaunu supply, kas izstaro katru sākotnējo vērtību desmitkārtīgi, un pieslēgums tās savāc <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> supply filtrē, tālāk laižot tikai tās vērtības, kurām tā bloks ir patiess:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā katra pārveidošana atgriež vēl vienu supply, tās var saķēdēt, uzbūvējot mazu konveijeru, kas reaģē uz straumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī ir tā pati map/grep vārdnīca, ko pazīstat no sarakstiem, piemērota vērtībām, kas pienāk laika gaitā.<\/span> <span class=\"sg\" data-s=\"1\">Supply stumj; jūsu konveijers veido to, kas iznāk ārā.<\/span><\/p>"]]},"ru":{"t":"Преобразование supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply можно преобразовать до подключения к нему — почти как список.<\/span> <span class=\"sg\" data-s=\"1\">Методы вроде <code>map<\/code> и <code>grep<\/code> создают <strong>новый<\/strong> supply, значениями которого будут преобразованные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>map(* * 10)<\/code> строит новый supply, выдающий каждое исходное значение, умноженное на десять, а подключение собирает их в <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> фильтрует supply, пропуская лишь те значения, для которых его блок истинен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку каждое преобразование возвращает очередной supply, их можно составлять в цепочку, выстраивая небольшой конвейер, который реагирует на поток:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это тот же словарь map/grep, что вы знаете по спискам, только применённый к значениям, приходящим во времени.<\/span> <span class=\"sg\" data-s=\"1\">Supply проталкивает значения, а ваш конвейер задаёт форму того, что выходит наружу.<\/span><\/p>"]]},"uk":{"t":"Перетворення потоку значень","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Потік значень можна перетворити перед підключенням, дуже подібно до списку.<\/span> <span class=\"sg\" data-s=\"1\">Методи на кшталт <code>map<\/code> та <code>grep<\/code> дають <strong>новий<\/strong> потік, значеннями якого є перетворені:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>map(* * 10)<\/code> будує новий потік, що видає кожне початкове значення, помножене на десять, а підключення збирає їх у <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> фільтрує потік, пропускаючи далі лише ті значення, для яких його блок істинний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки кожне перетворення повертає ще один потік, їх можна зчіплювати, будуючи невеликий конвеєр, що реагує на струмінь:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це той самий словник map/grep, який ви знаєте зі списків, застосований до значень, що надходять у часі.<\/span> <span class=\"sg\" data-s=\"1\">Потік робить штовхання; ваш конвеєр надає форми тому, що виходить.<\/span><\/p>"]]},"bg":{"t":"Преобразуване на поток от стойности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Потокът може да бъде преобразуван, преди да се включите към него, много подобно на списък.<\/span> <span class=\"sg\" data-s=\"1\">Методи като <code>map<\/code> и <code>grep<\/code> произвеждат <strong>нов<\/strong> поток, чиито стойности са преобразуваните:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>map(* * 10)<\/code> изгражда нов поток, който подава по десет пъти всяка първоначална стойност, а включването ги събира в <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> филтрира потока, като пропуска нататък само онези стойности, за които блокът му е истина:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Понеже всяко преобразуване връща още един поток, можете да ги свързвате, изграждайки малък конвейер, който откликва на струята:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е същият речник map/grep, който познавате от списъците, приложен към стойности, пристигащи във времето.<\/span> <span class=\"sg\" data-s=\"1\">Потокът върши тласкането; вашият конвейер оформя онова, което излиза.<\/span><\/p>"]]},"eo":{"t":"Transformi supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply povas esti transformita antaŭ ol vi konektiĝas al ĝi, tre kiel listo.<\/span> <span class=\"sg\" data-s=\"1\">Metodoj kiel <code>map<\/code> kaj <code>grep<\/code> produktas <strong>novan<\/strong> supply, kies valoroj estas la transformitaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>map(* * 10)<\/code> konstruas novan supply, kiu eligas dekoblon de ĉiu originala valoro, kaj la konekto kolektas tiujn en <code>@out<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> filtras supply, transdonante nur la valorojn, por kiuj ĝia bloko estas vera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar ĉiu transformo redonas alian supply, vi povas ĉenigi ilin, konstruante malgrandan ĉenstacion, kiu reagas al la fluo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen la sama vortprovizo de map/grep, kiun vi konas el listoj, aplikita al valoroj alvenantaj en la tempo.<\/span> <span class=\"sg\" data-s=\"1\">La supply faras la puŝadon; via ĉenstacio formas tion, kio eliras.<\/span><\/p>"]]},"la":{"t":"Supply transformare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply transformari potest antequam ad illud te coniungas, non aliter ac index.<\/span> <span class=\"sg\" data-s=\"1\">Methodi ut <code>map<\/code> et <code>grep<\/code> <strong>novum<\/strong> supply producunt cuius valores transformati sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3).map(* * 10).tap(-&gt; $v { @out.push($v) });\nsay @out; # [10 20 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>map(* * 10)<\/code> novum supply aedificat quod decies unumquemque valorem originalem emittit, et coniunctio ea in <code>@out<\/code> colligit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>grep<\/code> supply filtrat, solos valores transmittens pro quibus blocus eius verus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1, 2, 3, 4, 5, 6).grep(* %% 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [2 4 6]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia unaquaeque transformatio aliud supply reddit, ea concatenare potes, fistulam parvam aedificans quae fluxui respondet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\nSupply.from-list(1..6).grep(* %% 2).map(* ** 2).tap(-&gt; $v { @out.push($v) });\nsay @out; # [4 16 36]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem vocabularium <code>map<\/code>/<code>grep<\/code> est quod ex indicibus nosti, valoribus per tempus advenientibus applicatum.<\/span> <span class=\"sg\" data-s=\"1\">Supply trudit; fistula tua format quid exeat.<\/span><\/p>"]]}}}</script>
