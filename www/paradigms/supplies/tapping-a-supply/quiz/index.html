<script type="application/json" id="page-data">{"u":"paradigms/supplies/tapping-a-supply/quiz","n":1330,"k":"quiz","pv":"paradigms/supplies/tapping-a-supply","nx":"paradigms/supplies/transforming","tr":["paradigms","paradigms/supplies","paradigms/supplies/tapping-a-supply"],"L":{"en":{"t":"Quiz — Supplies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The tap runs once for every value the supply emits.<\/span> <span class=\"sg\" data-s=\"1\">Each time, it upper-cases the value and appends it to <code>$out<\/code>, so <code>a<\/code>, <code>b<\/code>, <code>c<\/code> become <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, joined into <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The block reacts to the whole stream, not just the last value — which is why the answer is not simply <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Supplies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Zapfstelle läuft einmal für jeden Wert, den das Supply aussendet.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Mal schreibt sie den Wert groß und hängt ihn an <code>$out<\/code>, aus <code>a<\/code>, <code>b<\/code>, <code>c<\/code> werden also <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, verbunden zu <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Der Block reagiert auf den ganzen Strom, nicht nur auf den letzten Wert — weshalb die Antwort nicht schlicht <code>C<\/code> ist.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Supplies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De tap draait één keer voor elke waarde die de supply uitzendt.<\/span> <span class=\"sg\" data-s=\"1\">Elke keer zet hij de waarde in hoofdletters en plakt haar achter <code>$out<\/code>, dus worden <code>a<\/code>, <code>b<\/code>, <code>c<\/code> <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, samengevoegd tot <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het blok reageert op de hele stroom, niet alleen op de laatste waarde — en daarom is het antwoord niet eenvoudigweg <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Supplies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El enganche se ejecuta una vez por cada valor que el supply emite.<\/span> <span class=\"sg\" data-s=\"1\">Cada vez pasa el valor a mayúsculas y lo añade a <code>$out<\/code>, así que <code>a<\/code>, <code>b<\/code>, <code>c<\/code> se convierten en <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, unidos en <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El bloque reacciona al flujo entero, no solo al último valor, y por eso la respuesta no es simplemente <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La presa gira una volta per ogni valore che il supply emette.<\/span> <span class=\"sg\" data-s=\"1\">Ogni volta rende maiuscolo il valore e lo aggiunge in coda a <code>$out<\/code>, quindi <code>a<\/code>, <code>b<\/code>, <code>c<\/code> diventano <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, uniti in <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il blocco reagisce all'intero flusso, non solo all'ultimo valore — ed è per questo che la risposta non è semplicemente <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Подключение выполняется по разу для каждого значения, выданного supply.<\/span> <span class=\"sg\" data-s=\"1\">Каждый раз оно переводит значение в верхний регистр и дописывает к <code>$out<\/code>, поэтому <code>a<\/code>, <code>b<\/code>, <code>c<\/code> превращаются в <code>A<\/code>, <code>B<\/code>, <code>C<\/code> и складываются в <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок реагирует на весь поток, а не только на последнее значение, — поэтому ответ не просто <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Потоки значень","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що надрукує наступна програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Підключення виконується на кожне значення, яке видає потік.<\/span> <span class=\"sg\" data-s=\"1\">Щоразу воно переводить значення у верхній регістр і дописує до <code>$out<\/code>, тож <code>a<\/code>, <code>b<\/code>, <code>c<\/code> стають <code>A<\/code>, <code>B<\/code>, <code>C<\/code> й зливаються в <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок реагує на весь потік, а не лише на останнє значення, — саме тому відповіддю є не просто <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Потоци от стойности","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $out = '';\nSupply.from-list('a', 'b', 'c').tap(-&gt; $v { $out ~= $v.uc });\nsay $out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">ABC<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">abc<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">a b c<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">C<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Включването се изпълнява по веднъж за всяка стойност, която потокът подава.<\/span> <span class=\"sg\" data-s=\"1\">Всеки път то превръща стойността в главни букви и я долепя към <code>$out<\/code>, така че <code>a<\/code>, <code>b<\/code>, <code>c<\/code> стават <code>A<\/code>, <code>B<\/code>, <code>C<\/code> и се сливат в <code>ABC<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блокът откликва на цялата струя, а не само на последната стойност — затова отговорът не е просто <code>C<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
