<script type="application/json" id="page-data">{"u":"paradigms/supplies/tapping-a-supply","n":1329,"k":"topic","pv":"paradigms/supplies","nx":"paradigms/supplies/tapping-a-supply/quiz","tr":["paradigms","paradigms/supplies"],"L":{"en":{"t":"Tapping a supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To subscribe to a supply, you <em>tap<\/em> it: you give <code>.tap<\/code> a block, and that block runs for every value the supply emits.<\/span> <span class=\"sg\" data-s=\"1\">The simplest supply to experiment with is <code>Supply.from-list<\/code>, which emits the values of a list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The block <code>-&gt; $v { say $v }<\/code> is the <em>tap<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The supply pushes each value into it in turn, so the block runs three times, once per value.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The tap can do anything with the value, including accumulate a result:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here every emitted value is added to <code>$total<\/code>, which ends at <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tapping is the basic act of reactive programming: connect a piece of behaviour to a stream, and let the stream drive it.<\/span><\/p>"]]},"de":{"t":"Ein Supply anzapfen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um ein Supply zu abonnieren, <em>zapfen<\/em> Sie es an: Sie geben <code>.tap<\/code> einen Block, und dieser Block läuft für jeden Wert, den das Supply aussendet.<\/span> <span class=\"sg\" data-s=\"1\">Am einfachsten experimentiert es sich mit <code>Supply.from-list<\/code>, das die Werte einer Liste aussendet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt aus:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Block <code>-&gt; $v { say $v }<\/code> ist die <em>Zapfstelle<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das Supply schiebt jeden Wert der Reihe nach hinein, der Block läuft also dreimal, einmal je Wert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Zapfstelle darf mit dem Wert alles tun, auch ein Ergebnis aufsummieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wird jeder ausgesandte Wert zu <code>$total<\/code> addiert, das bei <code>6<\/code> endet.<\/span> <span class=\"sg\" data-s=\"1\">Das Anzapfen ist die Grundhandlung der reaktiven Programmierung: ein Stück Verhalten mit einem Strom verbinden und den Strom es antreiben lassen.<\/span><\/p>"]]},"nl":{"t":"Een supply aftappen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om je op een supply te abonneren, <em>tap<\/em> je hem af: je geeft <code>.tap<\/code> een blok, en dat blok draait voor elke waarde die de supply uitzendt.<\/span> <span class=\"sg\" data-s=\"1\">De eenvoudigste supply om mee te experimenteren is <code>Supply.from-list<\/code>, die de waarden van een lijst uitzendt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het blok <code>-&gt; $v { say $v }<\/code> is de <em>tap<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De supply duwt elke waarde er om beurten in, dus draait het blok drie keer, één keer per waarde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De tap mag met de waarde doen wat hij wil, ook een resultaat opbouwen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wordt elke uitgezonden waarde bij <code>$total<\/code> opgeteld, dat op <code>6<\/code> eindigt.<\/span> <span class=\"sg\" data-s=\"1\">Aftappen is de basishandeling van reactief programmeren: verbind een stukje gedrag met een stroom en laat de stroom het aandrijven.<\/span><\/p>"]]},"es":{"t":"Conectarse a un supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para suscribirte a un supply, lo <em>enganchas<\/em>: le das a <code>.tap<\/code> un bloque, y ese bloque se ejecuta para cada valor que el supply emite.<\/span> <span class=\"sg\" data-s=\"1\">El supply más sencillo para experimentar es <code>Supply.from-list<\/code>, que emite los valores de una lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>-&gt; $v { say $v }<\/code> es el <em>enganche<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El supply le empuja cada valor por turno, así que el bloque se ejecuta tres veces, una por valor.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El enganche puede hacer cualquier cosa con el valor, incluido acumular un resultado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí cada valor emitido se suma a <code>$total<\/code>, que acaba en <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Enganchar es el acto básico de la programación reactiva: conecta un fragmento de comportamiento a un flujo y deja que el flujo lo mueva.<\/span><\/p>"]]},"it":{"t":"Collegarsi a un supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per abbonarti a un supply vi <em>attingi<\/em>: dai a <code>.tap<\/code> un blocco, e quel blocco gira per ogni valore che il supply emette.<\/span> <span class=\"sg\" data-s=\"1\">Il supply più semplice con cui sperimentare è <code>Supply.from-list<\/code>, che emette i valori di un elenco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>-&gt; $v { say $v }<\/code> è la <em>presa<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il supply vi spinge dentro ogni valore a turno, quindi il blocco gira tre volte, una per valore.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La presa può fare qualunque cosa con il valore, compreso accumulare un risultato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui ogni valore emesso viene aggiunto a <code>$total<\/code>, che finisce a <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Attingere è l'atto di base della programmazione reattiva: collegare un pezzo di comportamento a un flusso e lasciare che sia il flusso a pilotarlo.<\/span><\/p>"]]},"ru":{"t":"Подключение к supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы подписаться на supply, к нему <em>подключаются<\/em>: вы передаёте методу <code>.tap<\/code> блок, и этот блок выполняется для каждого значения, которое supply выдаёт.<\/span> <span class=\"sg\" data-s=\"1\">Проще всего экспериментировать с <code>Supply.from-list<\/code>, который выдаёт значения списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>-&gt; $v { say $v }<\/code> и есть <em>подключение<\/em> (tap).<\/span> <span class=\"sg\" data-s=\"1\">Supply по очереди проталкивает в него каждое значение, поэтому блок выполняется трижды — по разу на значение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подключение может делать со значением что угодно, в том числе накапливать результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь каждое выданное значение прибавляется к <code>$total<\/code>, который в итоге равен <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подключение — базовое действие реактивного программирования: соединяете кусочек поведения с потоком и даёте потоку двигать его.<\/span><\/p>"]]},"uk":{"t":"Підключення до потоку значень","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб підписатися на потік значень, ви <em>підключаєтеся<\/em> до нього (tap): даєте <code>.tap<\/code> блок, і цей блок виконується на кожне значення, яке видає потік.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіший потік для експериментів — це <code>Supply.from-list<\/code>, що видає значення списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>-&gt; $v { say $v }<\/code> є <em>підключенням<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Потік штовхає в нього кожне значення по черзі, тож блок виконується тричі, по разу на значення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підключення може робити зі значенням що завгодно, зокрема накопичувати результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут кожне видане значення додається до <code>$total<\/code>, який завершується на <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Підключення — це базова дія реактивного програмування: приєднати шматок поведінки до потоку й дати потокові керувати ним.<\/span><\/p>"]]},"bg":{"t":"Включване към поток от стойности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да се абонирате за поток, вие се <em>включвате<\/em> към него (tap): подавате на <code>.tap<\/code> блок и този блок се изпълнява за всяка стойност, която потокът подава.<\/span> <span class=\"sg\" data-s=\"1\">Най-простият поток за експерименти е <code>Supply.from-list<\/code>, който подава стойностите на списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n$s.tap(-&gt; $v { say $v });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>-&gt; $v { say $v }<\/code> е <em>включването<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Потокът тласка всяка стойност в него поред, така че блокът се изпълнява три пъти — по веднъж за стойност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Включването може да прави каквото и да е със стойността, включително да натрупва резултат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $total = 0;\nSupply.from-list(1, 2, 3).tap(-&gt; $v { $total += $v });\nsay $total; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук всяка подадена стойност се добавя към <code>$total<\/code>, който завършва на <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Включването е основното действие на реактивното програмиране: свързвате парче поведение със струя и оставяте струята да го задвижва.<\/span><\/p>"]]}}}</script>
