<script type="application/json" id="page-data">{"u":"paradigms/supplies","n":1328,"k":"section","pv":"paradigms/hyper-race/exercises/hyper-filter/solution","nx":"paradigms/supplies/tapping-a-supply","tr":["paradigms"],"L":{"en":{"t":"Supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">This subpart is about <em>reactive<\/em> programming: writing code that responds to a stream of values as they arrive, rather than asking for them one by one.<\/span> <span class=\"sg\" data-s=\"1\">The central type is the <em>supply<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A supply is a source of values over time — think of it as a stream you can subscribe to.<\/span> <span class=\"sg\" data-s=\"1\">You attach a piece of code to a supply, and that code runs once for <strong>each<\/strong> value the supply produces.<\/span> <span class=\"sg\" data-s=\"2\">This “values push to you” style is the opposite of pulling values out of a list, and it is exactly what you want for events, messages, and live data.<\/span><\/p>"]]},"de":{"t":"Supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Unterteil handelt von <em>reaktiver<\/em> Programmierung: Code zu schreiben, der auf einen Strom von Werten antwortet, sobald sie eintreffen, statt sie einen nach dem anderen anzufordern.<\/span> <span class=\"sg\" data-s=\"1\">Der zentrale Typ ist das <em>Supply<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Supply ist eine Quelle von Werten im Lauf der Zeit — stellen Sie es sich als Strom vor, den Sie abonnieren können.<\/span> <span class=\"sg\" data-s=\"1\">Sie hängen ein Stück Code an ein Supply, und dieser Code läuft einmal für <strong>jeden<\/strong> Wert, den das Supply erzeugt.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Stil, bei dem „Werte zu Ihnen geschoben werden“, ist das Gegenteil davon, Werte aus einer Liste zu ziehen, und genau richtig für Ereignisse, Nachrichten und lebende Daten.<\/span><\/p>"]]},"nl":{"t":"Supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel gaat over <em>reactief<\/em> programmeren: code schrijven die op een stroom waarden reageert zodra die binnenkomen, in plaats van er een voor een om te vragen.<\/span> <span class=\"sg\" data-s=\"1\">Het centrale type is de <em>supply<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een supply is een bron van waarden in de loop van de tijd — zie het als een stroom waarop je je kunt abonneren.<\/span> <span class=\"sg\" data-s=\"1\">Je hangt een stuk code aan een supply, en die code draait één keer voor <strong>elke<\/strong> waarde die de supply produceert.<\/span> <span class=\"sg\" data-s=\"2\">Deze stijl waarin \"waarden naar jou geduwd worden\" is het tegenovergestelde van waarden uit een lijst halen, en het is precies wat je wilt voor gebeurtenissen, berichten en live gegevens.<\/span><\/p>"]]},"es":{"t":"Supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta subparte trata de la programación <em>reactiva<\/em>: escribir código que responde a un flujo de valores según van llegando, en lugar de pedirlos uno a uno.<\/span> <span class=\"sg\" data-s=\"1\">El tipo central es el <em>supply<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un supply es una fuente de valores a lo largo del tiempo; piénsalo como un flujo al que puedes suscribirte.<\/span> <span class=\"sg\" data-s=\"1\">Enganchas un fragmento de código a un supply, y ese código se ejecuta una vez por <strong>cada<\/strong> valor que el supply produce.<\/span> <span class=\"sg\" data-s=\"2\">Este estilo de «los valores se te empujan» es lo contrario de extraer valores de una lista, y es exactamente lo que quieres para eventos, mensajes y datos en vivo.<\/span><\/p>"]]},"it":{"t":"Supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sottoparte riguarda la programmazione <em>reattiva<\/em>: scrivere codice che risponde a un flusso di valori man mano che arrivano, invece di chiederli uno per uno.<\/span> <span class=\"sg\" data-s=\"1\">Il tipo centrale è il <em>supply<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un supply è una sorgente di valori nel tempo — pensalo come un flusso a cui puoi abbonarti.<\/span> <span class=\"sg\" data-s=\"1\">Attacchi un pezzo di codice a un supply, e quel codice gira una volta per <strong>ogni<\/strong> valore che il supply produce.<\/span> <span class=\"sg\" data-s=\"2\">Questo stile in cui «i valori ti vengono spinti addosso» è l'opposto dell'estrarre valori da un elenco, ed è esattamente ciò che vuoi per eventi, messaggi e dati dal vivo.<\/span><\/p>"]]},"ru":{"t":"Supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта подчасть посвящена <em>реактивному<\/em> программированию: написанию кода, который реагирует на поток значений по мере их поступления, а не запрашивает их одно за другим.<\/span> <span class=\"sg\" data-s=\"1\">Центральный тип здесь — <em>supply<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Supply — это источник значений во времени; представляйте его как поток, на который можно подписаться.<\/span> <span class=\"sg\" data-s=\"1\">Вы присоединяете к supply кусочек кода, и этот код выполняется для <strong>каждого<\/strong> значения, которое supply выдаёт.<\/span> <span class=\"sg\" data-s=\"2\">Такой стиль «значения приходят к вам» противоположен вытягиванию значений из списка и как раз то, что нужно для событий, сообщений и живых данных.<\/span><\/p>"]]},"uk":{"t":"Потоки значень","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця підчастина присвячена <em>реактивному<\/em> програмуванню: написанню коду, що відгукується на потік значень у міру їх надходження, а не просить їх по одному.<\/span> <span class=\"sg\" data-s=\"1\">Центральним типом є <em>потік значень<\/em> (supply).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потік значень — це джерело значень у часі; уявляйте його як струмінь, на який можна підписатися.<\/span> <span class=\"sg\" data-s=\"1\">Ви прикріплюєте до потоку шматок коду, і цей код виконується по разу на <strong>кожне<\/strong> значення, яке потік виробляє.<\/span> <span class=\"sg\" data-s=\"2\">Такий стиль «значення штовхають до вас» протилежний до витягування значень зі списку, і саме цього ви хочете для подій, повідомлень та живих даних.<\/span><\/p>"]]},"bg":{"t":"Потоци от стойности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази подчаст е за <em>реактивното<\/em> програмиране: писане на код, който откликва на поток от стойности в момента на пристигането им, вместо да ги иска една по една.<\/span> <span class=\"sg\" data-s=\"1\">Централният тип е <em>потокът от стойности<\/em> (supply).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потокът от стойности е източник на стойности във времето — мислете за него като за струя, за която можете да се абонирате.<\/span> <span class=\"sg\" data-s=\"1\">Прикачвате парче код към потока и този код се изпълнява по веднъж за <strong>всяка<\/strong> стойност, която потокът произвежда.<\/span> <span class=\"sg\" data-s=\"2\">Този стил „стойностите се тласкат към вас“ е противоположен на изтеглянето на стойности от списък и е точно каквото ви трябва за събития, съобщения и живи данни.<\/span><\/p>"]]}}}</script>
