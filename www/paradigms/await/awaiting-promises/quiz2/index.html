<script type="application/json" id="page-data">{"u":"paradigms/await/awaiting-promises/quiz2","n":1371,"k":"quiz","pv":"paradigms/await/awaiting-promises/quiz","nx":"paradigms/await/waiting-for-completion","tr":["paradigms","paradigms/await","paradigms/await/awaiting-promises"],"L":{"en":{"t":"Quiz — await and sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program do?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Prints <code>waiting<\/code> at once, then prints <code>42<\/code> about two seconds later<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Pauses for two seconds, then prints <code>waiting<\/code> and <code>42<\/code> together<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Prints <code>waiting<\/code> and <code>42<\/code> at once — the sleep happens in the background<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Prints <code>waiting<\/code>, then <code>Promise<\/code> — you cannot await a sleeping promise<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> returns a promise <strong>immediately<\/strong> — the block, with its <code>sleep<\/code>, runs on a background thread.<\/span> <span class=\"sg\" data-s=\"1\">So <code>say 'waiting'<\/code> executes straight away.<\/span> <span class=\"sg\" data-s=\"2\">It is <code>await<\/code> that blocks: the program pauses there until the background block finishes its two-second nap and produces <code>42<\/code>, which is then printed.<\/span> <span class=\"sg\" data-s=\"3\">The pause belongs to the <code>await<\/code> line, not to the <code>start<\/code> line.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — await und sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was tut das folgende Programm?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Gibt sofort <code>waiting<\/code> aus und rund zwei Sekunden später <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Hält zwei Sekunden an und gibt dann <code>waiting<\/code> und <code>42<\/code> zusammen aus<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Gibt <code>waiting<\/code> und <code>42<\/code> sofort aus — der sleep geschieht im Hintergrund<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Gibt <code>waiting<\/code> aus und dann <code>Promise<\/code> — ein schlafendes Promise kann man nicht abwarten<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> liefert <strong>sofort<\/strong> ein Promise — der Block mit seinem <code>sleep<\/code> läuft auf einem Hintergrundthread.<\/span> <span class=\"sg\" data-s=\"1\"><code>say 'waiting'<\/code> wird also unverzüglich ausgeführt.<\/span> <span class=\"sg\" data-s=\"2\">Es ist <code>await<\/code>, das blockiert: Das Programm hält dort an, bis der Hintergrundblock sein zweisekündiges Nickerchen beendet und <code>42<\/code> erzeugt hat, was dann ausgegeben wird.<\/span> <span class=\"sg\" data-s=\"3\">Die Pause gehört zur Zeile mit <code>await<\/code>, nicht zur Zeile mit <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — await en sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat doet het volgende programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Drukt meteen <code>waiting<\/code> af en ongeveer twee seconden later <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Pauzeert twee seconden en drukt daarna <code>waiting<\/code> en <code>42<\/code> samen af<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Drukt <code>waiting<\/code> en <code>42<\/code> meteen af — de sleep gebeurt op de achtergrond<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Drukt <code>waiting<\/code> af en daarna <code>Promise<\/code> — een slapende promise kun je niet afwachten<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> geeft <strong>meteen<\/strong> een promise terug — het blok, met zijn <code>sleep<\/code>, draait op een achtergrondthread.<\/span> <span class=\"sg\" data-s=\"1\">Dus <code>say 'waiting'<\/code> wordt onmiddellijk uitgevoerd.<\/span> <span class=\"sg\" data-s=\"2\">Het is <code>await<\/code> dat blokkeert: het programma pauzeert daar tot het achtergrondblok zijn dutje van twee seconden voltooid heeft en <code>42<\/code> oplevert, dat daarna afgedrukt wordt.<\/span> <span class=\"sg\" data-s=\"3\">De pauze hoort bij de regel met <code>await<\/code>, niet bij de regel met <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — await y sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué hace el programa siguiente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Imprime <code>waiting<\/code> enseguida, y unos dos segundos después imprime <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Se detiene dos segundos y después imprime <code>waiting<\/code> y <code>42<\/code> juntos<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Imprime <code>waiting<\/code> y <code>42<\/code> enseguida: el sleep ocurre en segundo plano<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Imprime <code>waiting<\/code> y después <code>Promise<\/code>: no se puede esperar una promesa dormida<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> devuelve una promesa <strong>de inmediato<\/strong>: el bloque, con su <code>sleep<\/code>, corre en un hilo en segundo plano.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>say 'waiting'<\/code> se ejecuta al momento.<\/span> <span class=\"sg\" data-s=\"2\">Es <code>await<\/code> quien bloquea: el programa se detiene ahí hasta que el bloque en segundo plano termina su siesta de dos segundos y produce <code>42<\/code>, que entonces se imprime.<\/span> <span class=\"sg\" data-s=\"3\">La pausa pertenece a la línea del <code>await<\/code>, no a la del <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — await e sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Che cosa fa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Stampa subito <code>waiting<\/code>, poi stampa <code>42<\/code> circa due secondi dopo<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Si ferma per due secondi, poi stampa <code>waiting<\/code> e <code>42<\/code> insieme<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Stampa <code>waiting<\/code> e <code>42<\/code> subito — lo sleep avviene in secondo piano<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Stampa <code>waiting<\/code>, poi <code>Promise<\/code> — non puoi attendere una promise che dorme<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> restituisce <strong>subito<\/strong> una promise: il blocco, con il suo <code>sleep<\/code>, gira su un thread in secondo piano.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>say 'waiting'<\/code> viene eseguito immediatamente.<\/span> <span class=\"sg\" data-s=\"2\">È <code>await<\/code> a bloccare: il programma si mette in pausa lì finché il blocco in secondo piano non finisce il suo pisolino di due secondi e produce <code>42<\/code>, che viene poi stampato.<\/span> <span class=\"sg\" data-s=\"3\">La pausa appartiene alla riga dell'<code>await<\/code>, non a quella dello <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — await un sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko dara šī programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Uzreiz izdrukā <code>waiting<\/code>, tad apmēram divas sekundes vēlāk izdrukā <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Apstājas uz divām sekundēm, tad izdrukā <code>waiting<\/code> un <code>42<\/code> kopā<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Izdrukā <code>waiting<\/code> un <code>42<\/code> uzreiz — miegs notiek fonā<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Izdrukā <code>waiting<\/code>, tad <code>Promise<\/code> — guļošu solījumu gaidīt nevar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> atgriež solījumu <strong>tūlīt<\/strong> — bloks ar savu <code>sleep<\/code> izpildās fona pavedienā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc <code>say 'waiting'<\/code> nostrādā uzreiz.<\/span> <span class=\"sg\" data-s=\"2\">Bloķē tieši <code>await<\/code>: programma tur apstājas, līdz fona bloks pabeidz savu divu sekunžu snaudu un rada <code>42<\/code>, ko tad izdrukā.<\/span> <span class=\"sg\" data-s=\"3\">Pauze pieder <code>await<\/code> rindai, nevis <code>start<\/code> rindai.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — await и sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что делает следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Сразу печатает <code>waiting<\/code>, а примерно через две секунды печатает <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Делает паузу в две секунды, затем печатает <code>waiting<\/code> и <code>42<\/code> вместе<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Сразу печатает <code>waiting<\/code> и <code>42<\/code> — sleep происходит в фоне<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Печатает <code>waiting<\/code>, затем <code>Promise<\/code> — спящий промис дождаться нельзя<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> возвращает промис <strong>немедленно<\/strong>: блок вместе со своим <code>sleep<\/code> выполняется в фоновом потоке.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>say 'waiting'<\/code> срабатывает сразу же.<\/span> <span class=\"sg\" data-s=\"2\">Блокирует выполнение именно <code>await<\/code>: программа приостанавливается на нём, пока фоновый блок не досмотрит свой двухсекундный сон и не выдаст <code>42<\/code>, которое затем печатается.<\/span> <span class=\"sg\" data-s=\"3\">Пауза принадлежит строке с <code>await<\/code>, а не строке со <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — await і sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що робить наступна програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Одразу друкує <code>waiting<\/code>, а приблизно за дві секунди друкує <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Робить паузу на дві секунди, а потім друкує <code>waiting<\/code> та <code>42<\/code> разом<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Друкує <code>waiting<\/code> та <code>42<\/code> одразу — сон відбувається у фоні<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Друкує <code>waiting<\/code>, а потім <code>Promise<\/code> — обіцянку, що спить, чекати не можна<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> повертає обіцянку <strong>негайно<\/strong> — блок разом зі своїм <code>sleep<\/code> виконується у фоновому потоці.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>say 'waiting'<\/code> виконується одразу.<\/span> <span class=\"sg\" data-s=\"2\">Блокує саме <code>await<\/code>: програма зупиняється там, аж поки фоновий блок не завершить свою двосекундну дрімоту й не дасть <code>42<\/code>, яке потім друкується.<\/span> <span class=\"sg\" data-s=\"3\">Пауза належить рядкові з <code>await<\/code>, а не рядкові зі <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — await и sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво прави следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Отпечатва <code>waiting<\/code> веднага, а около две секунди по-късно отпечатва <code>42<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Спира за две секунди, после отпечатва <code>waiting<\/code> и <code>42<\/code> заедно<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Отпечатва <code>waiting<\/code> и <code>42<\/code> веднага — спането става във фонов режим<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Отпечатва <code>waiting<\/code>, после <code>Promise<\/code> — спящо обещание не може да се изчаква<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> връща обещание <strong>незабавно<\/strong> — блокът със своя <code>sleep<\/code> се изпълнява във фонова нишка.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>say 'waiting'<\/code> се изпълнява веднага.<\/span> <span class=\"sg\" data-s=\"2\">Блокира именно <code>await<\/code>: програмата спира там, докато фоновият блок не приключи двусекундната си дрямка и не даде <code>42<\/code>, което после се отпечатва.<\/span> <span class=\"sg\" data-s=\"3\">Паузата принадлежи на реда с <code>await<\/code>, а не на реда със <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — await kaj sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion faras la jena programo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Presas <code>waiting<\/code> tuj, poste presas <code>42<\/code> ĉirkaŭ du sekundojn poste<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Paŭzas dum du sekundoj, poste presas <code>waiting<\/code> kaj <code>42<\/code> kune<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Presas <code>waiting<\/code> kaj <code>42<\/code> tuj — la dormo okazas fone<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Presas <code>waiting<\/code>, poste <code>Promise<\/code> — vi ne povas atendi dormantan promeson<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> redonas promeson <strong>tuj<\/strong> — la bloko, kun sia <code>sleep<\/code>, kuras sur fona fadeno.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>say 'waiting'<\/code> plenumiĝas senprokraste.<\/span> <span class=\"sg\" data-s=\"2\">Estas <code>await<\/code>, kiu blokas: la programo paŭzas tie, ĝis la fona bloko finas sian dusekundan dormeton kaj produktas <code>42<\/code>, kiu tiam estas presata.<\/span> <span class=\"sg\" data-s=\"3\">La paŭzo apartenas al la linio <code>await<\/code>, ne al la linio <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — await et sleep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid haec programma agit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 2; 42 };\nsay 'waiting';\nsay await $p;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Statim <code>waiting<\/code> imprimit, deinde <code>42<\/code> circiter duobus secundis post<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Duo secunda consistit, deinde <code>waiting<\/code> et <code>42<\/code> simul imprimit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>waiting<\/code> et <code>42<\/code> statim imprimit — dormitio in fundo accidit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>waiting<\/code> imprimit, deinde <code>Promise<\/code> — promissum dormiens exspectare non potes<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>start<\/code> promissum <strong>statim<\/strong> reddit — blocus, cum <code>sleep<\/code> suo, in filo fundi currit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>say 'waiting'<\/code> illico exsequitur.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> est quod moratur: programma ibi consistit donec blocus fundi somnum duorum secundorum finiat et <code>42<\/code> producat, quod deinde imprimitur.<\/span> <span class=\"sg\" data-s=\"3\">Mora ad lineam <code>await<\/code> pertinet, non ad lineam <code>start<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
