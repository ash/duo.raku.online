<script type="application/json" id="page-data">{"u":"paradigms/await/awaiting-promises","n":1369,"k":"topic","pv":"paradigms/await","nx":"paradigms/await/awaiting-promises/quiz","tr":["paradigms","paradigms/await"],"L":{"en":{"t":"Awaiting a promise","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> takes a promise, waits for it to complete, and returns its result:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program pauses at <code>await<\/code> only as long as needed, then continues with the value the promise produced.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Given several promises, <code>await<\/code> waits for <strong>all<\/strong> of them and returns their results in the same order as the promises in the list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The jobs run concurrently, but <code>await @jobs<\/code> does not return until every one is done.<\/span> <span class=\"sg\" data-s=\"1\">Each result then sits at the same position as its promise in <code>@jobs<\/code> — no matter which job happened to finish first.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If an awaited promise was <strong>broken<\/strong> — its block threw an exception — <code>await<\/code> rethrows that exception at the point of the <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This means errors in background work surface where you wait for it, so you can handle them with the usual <code>try<\/code> / <code>CATCH<\/code> from the part on exceptions:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>die<\/code> happens on a background thread, but the exception travels with the promise and pops out at <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>try<\/code> catches it there, leaving <code>$result<\/code> undefined and the error in <code>$!<\/code> — so a failure in concurrent work is handled exactly like any other exception.<\/span> <span class=\"sg\" data-s=\"2\">Awaiting is therefore not just about getting a value; it is the moment where concurrent work rejoins the main flow, results and errors alike.<\/span><\/p>"]]},"de":{"t":"Ein Promise abwarten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> nimmt ein Promise auf, wartet auf sein Ende und liefert sein Ergebnis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm hält bei <code>await<\/code> nur so lange an, wie nötig, und läuft dann mit dem Wert weiter, den das Promise erzeugt hat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei mehreren Promises wartet <code>await<\/code> auf <strong>alle<\/strong> und liefert ihre Ergebnisse in derselben Reihenfolge wie die Promises in der Liste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Aufgaben laufen nebenläufig, doch <code>await @jobs<\/code> kehrt erst zurück, wenn jede fertig ist.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Ergebnis steht danach an derselben Stelle wie sein Promise in <code>@jobs<\/code> — gleich, welche Aufgabe zufällig zuerst fertig war.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wurde ein abgewartetes Promise <strong>gebrochen<\/strong> — sein Block warf eine Ausnahme —, wirft <code>await<\/code> diese Ausnahme an der Stelle des <code>await<\/code> erneut.<\/span> <span class=\"sg\" data-s=\"1\">Fehler in Hintergrundarbeit tauchen also dort auf, wo Sie darauf warten, sodass Sie sie mit dem gewohnten <code>try<\/code> / <code>CATCH<\/code> aus dem Teil über Ausnahmen behandeln können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt aus:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <code>die<\/code> geschieht auf einem Hintergrundthread, doch die Ausnahme reist mit dem Promise mit und tritt beim <code>await<\/code> hervor.<\/span> <span class=\"sg\" data-s=\"1\">Das <code>try<\/code> fängt sie dort, lässt <code>$result<\/code> undefiniert und den Fehler in <code>$!<\/code> — ein Fehlschlag in nebenläufiger Arbeit wird also genau wie jede andere Ausnahme behandelt.<\/span> <span class=\"sg\" data-s=\"2\">Beim Abwarten geht es daher nicht nur darum, einen Wert zu bekommen; es ist der Augenblick, in dem sich nebenläufige Arbeit wieder in den Hauptfluss einfügt, mit Ergebnissen wie mit Fehlern.<\/span><\/p>"]]},"nl":{"t":"Een promise afwachten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> neemt een promise aan, wacht tot zij klaar is, en geeft haar resultaat terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma pauzeert bij <code>await<\/code> alleen zolang als nodig is en gaat daarna verder met de waarde die de promise opleverde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gegeven meerdere promises wacht <code>await<\/code> op <strong>alle<\/strong> en geeft het hun resultaten in dezelfde volgorde terug als de promises in de lijst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De taken lopen gelijktijdig, maar <code>await @jobs<\/code> keert pas terug wanneer elk ervan klaar is.<\/span> <span class=\"sg\" data-s=\"1\">Elk resultaat staat daarna op dezelfde positie als zijn promise in <code>@jobs<\/code> — ongeacht welke taak toevallig het eerst klaar was.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als een afgewachte promise <strong>verbroken<\/strong> was — haar blok wierp een exceptie — werpt <code>await<\/code> die exceptie opnieuw op het punt van de <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat fouten in achtergrondwerk opduiken waar je erop wacht, zodat je ze met de gewone <code>try<\/code> / <code>CATCH<\/code> uit het deel over excepties kunt afhandelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>die<\/code> gebeurt op een achtergrondthread, maar de exceptie reist met de promise mee en komt bij <code>await<\/code> naar buiten.<\/span> <span class=\"sg\" data-s=\"1\">De <code>try<\/code> vangt haar daar, waardoor <code>$result<\/code> ongedefinieerd blijft en de fout in <code>$!<\/code> staat — dus een mislukking in gelijktijdig werk wordt precies als elke andere exceptie afgehandeld.<\/span> <span class=\"sg\" data-s=\"2\">Afwachten gaat dus niet alleen over een waarde krijgen; het is het moment waarop gelijktijdig werk zich weer bij de hoofdstroom voegt, resultaten en fouten alle beide.<\/span><\/p>"]]},"es":{"t":"Esperar una promesa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> recibe una promesa, espera a que se complete y devuelve su resultado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa se detiene en <code>await<\/code> solo el tiempo necesario, y después continúa con el valor que produjo la promesa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dadas varias promesas, <code>await<\/code> espera a <strong>todas<\/strong> y devuelve sus resultados en el mismo orden que las promesas de la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los trabajos corren de forma concurrente, pero <code>await @jobs<\/code> no retorna hasta que todos han terminado.<\/span> <span class=\"sg\" data-s=\"1\">Cada resultado ocupa entonces la misma posición que su promesa en <code>@jobs<\/code>, sin importar cuál acabara primero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si una promesa esperada quedó <strong>rota<\/strong> — su bloque lanzó una excepción —, <code>await<\/code> relanza esa excepción en el punto del <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto significa que los errores del trabajo en segundo plano afloran allí donde lo esperas, así que puedes tratarlos con los <code>try<\/code> / <code>CATCH<\/code> de siempre de la parte sobre excepciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El <code>die<\/code> ocurre en un hilo en segundo plano, pero la excepción viaja con la promesa y sale a la luz en el <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El <code>try<\/code> la captura allí, dejando <code>$result<\/code> indefinido y el error en <code>$!<\/code>, de modo que un fallo en trabajo concurrente se trata exactamente igual que cualquier otra excepción.<\/span> <span class=\"sg\" data-s=\"2\">Esperar, por tanto, no va solo de obtener un valor: es el momento en que el trabajo concurrente vuelve a unirse al flujo principal, con sus resultados y sus errores por igual.<\/span><\/p>"]]},"it":{"t":"Attendere una promise","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> prende una promise, aspetta che si completi e ne restituisce il risultato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma si mette in pausa all'<code>await<\/code> solo per il tempo necessario, poi prosegue con il valore prodotto dalla promise.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Date parecchie promise, <code>await<\/code> le aspetta <strong>tutte<\/strong> e restituisce i loro risultati nello stesso ordine delle promise nell'elenco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I lavori girano in modo concorrente, ma <code>await @jobs<\/code> non ritorna finché ognuno non è finito.<\/span> <span class=\"sg\" data-s=\"1\">Ogni risultato sta poi nella stessa posizione della propria promise in <code>@jobs<\/code>, indipendentemente da quale lavoro sia finito per primo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se una promise attesa era <strong>rotta<\/strong> — il suo blocco ha sollevato un'eccezione — <code>await<\/code> rilancia quell'eccezione nel punto dell'<code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo significa che gli errori del lavoro in secondo piano emergono là dove lo aspetti, così puoi gestirli con i soliti <code>try<\/code> / <code>CATCH<\/code> della parte sulle eccezioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il <code>die<\/code> avviene su un thread in secondo piano, ma l'eccezione viaggia con la promise e salta fuori all'<code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>try<\/code> la intercetta lì, lasciando <code>$result<\/code> non definito e l'errore in <code>$!<\/code> — così un fallimento nel lavoro concorrente si gestisce esattamente come qualunque altra eccezione.<\/span> <span class=\"sg\" data-s=\"2\">Attendere, quindi, non riguarda solo l'ottenere un valore: è il momento in cui il lavoro concorrente si ricongiunge al flusso principale, risultati ed errori compresi.<\/span><\/p>"]]},"ru":{"t":"Ожидание промиса","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> принимает промис, дожидается его завершения и возвращает его результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа приостанавливается на <code>await<\/code> ровно настолько, насколько нужно, а затем продолжает работу со значением, которое произвёл промис.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Получив несколько промисов, <code>await<\/code> дожидается <strong>всех<\/strong> и возвращает их результаты в том же порядке, в каком промисы стоят в списке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Задачи выполняются конкурентно, но <code>await @jobs<\/code> не вернёт управление, пока не завершится каждая из них.<\/span> <span class=\"sg\" data-s=\"1\">Каждый результат затем оказывается на той же позиции, что и его промис в <code>@jobs<\/code>, — независимо от того, какая задача закончилась первой.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если ожидаемый промис оказался <strong>сломан<\/strong> — его блок бросил исключение, — <code>await<\/code> перебрасывает это исключение в точке <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значит, ошибки фоновой работы всплывают там, где вы её дожидаетесь, и обрабатывать их можно привычными <code>try<\/code> / <code>CATCH<\/code> из части об исключениях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> происходит в фоновом потоке, но исключение путешествует вместе с промисом и выныривает на <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там его перехватывает <code>try<\/code>, оставляя <code>$result<\/code> неопределённым, а ошибку — в <code>$!<\/code>; так что сбой в конкурентной работе обрабатывается точно так же, как любое другое исключение.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому ожидание — не только про получение значения: это ещё и момент, когда конкурентная работа воссоединяется с основным потоком выполнения, как с результатами, так и с ошибками.<\/span><\/p>"]]},"uk":{"t":"Очікування обіцянки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> приймає обіцянку, чекає її завершення й повертає її результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма зупиняється на <code>await<\/code> лише настільки, наскільки потрібно, а потім продовжується зі значенням, яке дала обіцянка.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отримавши кілька обіцянок, <code>await<\/code> чекає на <strong>всі<\/strong> й повертає їхні результати в тому самому порядку, у якому обіцянки стоять у списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Завдання виконуються конкурентно, але <code>await @jobs<\/code> не повертається, доки не завершиться кожне з них.<\/span> <span class=\"sg\" data-s=\"1\">Кожен результат тоді стоїть на тій самій позиції, що й його обіцянка в <code>@jobs<\/code>, — байдуже, яке завдання завершилося першим.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо очікувану обіцянку було <strong>зламано<\/strong> — її блок кинув виняток, — <code>await<\/code> повторно кидає цей виняток у точці <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що помилки у фоновій роботі виринають там, де ви на неї чекаєте, тож ви можете обробити їх звичними <code>try<\/code> / <code>CATCH<\/code> із частини про винятки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> стається у фоновому потоці, але виняток мандрує разом з обіцянкою й вискакує на <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> перехоплює його там, лишаючи <code>$result<\/code> неозначеним, а помилку — у <code>$!<\/code>, тож невдача в конкурентній роботі обробляється точно як будь-який інший виняток.<\/span> <span class=\"sg\" data-s=\"2\">Отже, очікування — це не лише про отримання значення; це мить, коли конкурентна робота знову вливається в основний потік виконання, і з результатами, і з помилками.<\/span><\/p>"]]},"bg":{"t":"Изчакване на обещание","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> приема обещание, изчаква го да приключи и връща резултата му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 7 * 6 };\nsay await $p; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата спира на <code>await<\/code> само колкото е нужно, а после продължава със стойността, дадена от обещанието.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Получил няколко обещания, <code>await<\/code> изчаква <strong>всички<\/strong> и връща резултатите им в същия ред, в който обещанията стоят в списъка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 5 }), (start { 10 }), (start { 15 });\nsay await @jobs;     # (5 10 15)\nsay [+] await @jobs; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Задачите вървят паралелно, но <code>await @jobs<\/code> не се връща, докато всяка от тях не приключи.<\/span> <span class=\"sg\" data-s=\"1\">Всеки резултат после стои на същата позиция, на която е неговото обещание в <code>@jobs<\/code> — независимо коя задача е приключила първа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако изчаканото обещание е било <strong>счупено<\/strong> — блокът му е хвърлил изключение, — <code>await<\/code> хвърля това изключение отново на мястото на <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че грешките във фоновата работа изплуват там, където я чакате, така че можете да ги обработите с обичайните <code>try<\/code> / <code>CATCH<\/code> от частта за изключенията:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'no such file' };\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>the job failed: no such file<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>die<\/code> се случва във фонова нишка, но изключението пътува заедно с обещанието и изскача при <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>try<\/code> го прихваща там, оставяйки <code>$result<\/code> недефиниран, а грешката — в <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така провалът в паралелна работа се обработва точно като всяко друго изключение.<\/span> <span class=\"sg\" data-s=\"3\">Затова изчакването не е само за получаване на стойност; то е моментът, в който паралелната работа отново се влива в основния поток — и с резултатите, и с грешките.<\/span><\/p>"]]}}}</script>
