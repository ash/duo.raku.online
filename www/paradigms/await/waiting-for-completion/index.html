<script type="application/json" id="page-data">{"u":"paradigms/await/waiting-for-completion","n":1372,"k":"topic","pv":"paradigms/await/awaiting-promises/quiz2","nx":"paradigms/await/exercises","tr":["paradigms","paradigms/await"],"L":{"en":{"t":"Waiting for completion","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> is the explicit way to wait, but reactive code waits too — just implicitly.<\/span> <span class=\"sg\" data-s=\"1\">A <code>react<\/code> block does not finish until all the supplies it watches are done, which gives you the same “everything has completed” guarantee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>say<\/code> runs only <strong>after<\/strong> the react block has finished, so <code>@values<\/code> already holds every emitted value.<\/span> <span class=\"sg\" data-s=\"1\">In effect, the <code>react<\/code> block awaited the stream for you.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is a useful pattern: use a <code>react<\/code> block to collect everything a supply emits, and then work with the collected result on the line after, confident that the stream is complete.<\/span> <span class=\"sg\" data-s=\"1\">Whether you wait for a promise with <code>await<\/code> or for a stream with <code>react<\/code>, the principle is the same — pause until the concurrent work is done, then continue with its results.<\/span><\/p>"]]},"de":{"t":"Auf die Fertigstellung warten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> ist der ausdrückliche Weg zu warten, aber reaktiver Code wartet auch — nur unausgesprochen.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>react<\/code>-Block ist erst fertig, wenn alle Supplies, die er beobachtet, fertig sind, was Ihnen dieselbe Zusicherung „alles ist erledigt“ gibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>say<\/code> läuft erst, <strong>nachdem<\/strong> der react-Block fertig ist, <code>@values<\/code> enthält also bereits jeden ausgesandten Wert.<\/span> <span class=\"sg\" data-s=\"1\">Im Grunde hat der <code>react<\/code>-Block den Strom für Sie abgewartet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist ein nützliches Vorgehen: Verwenden Sie einen <code>react<\/code>-Block, um alles zu sammeln, was ein Supply aussendet, und arbeiten Sie dann in der nächsten Zeile mit dem Gesammelten, in der Gewissheit, dass der Strom vollständig ist.<\/span> <span class=\"sg\" data-s=\"1\">Ob Sie mit <code>await<\/code> auf ein Promise oder mit <code>react<\/code> auf einen Strom warten, das Grundmuster ist dasselbe — anhalten, bis die nebenläufige Arbeit fertig ist, und dann mit ihren Ergebnissen weitermachen.<\/span><\/p>"]]},"nl":{"t":"Wachten op voltooiing","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> is de expliciete manier om te wachten, maar reactieve code wacht ook — alleen impliciet.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>react<\/code>-blok is pas klaar wanneer alle supplies die het bekijkt klaar zijn, wat je dezelfde garantie \"alles is voltooid\" geeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>say<\/code> draait pas <strong>nadat<\/strong> het react-blok klaar is, dus bevat <code>@values<\/code> al elke uitgezonden waarde.<\/span> <span class=\"sg\" data-s=\"1\">In feite heeft het <code>react<\/code>-blok de stroom voor je afgewacht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is een nuttig patroon: gebruik een <code>react<\/code>-blok om alles wat een supply uitzendt te verzamelen, en werk daarna op de volgende regel met het verzamelde resultaat, in de wetenschap dat de stroom compleet is.<\/span> <span class=\"sg\" data-s=\"1\">Of je nu met <code>await<\/code> op een promise wacht of met <code>react<\/code> op een stroom, het principe is hetzelfde — pauzeer tot het gelijktijdige werk klaar is en ga daarna verder met de resultaten.<\/span><\/p>"]]},"es":{"t":"Esperar a que termine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> es la manera explícita de esperar, pero el código reactivo también espera, solo que de forma implícita.<\/span> <span class=\"sg\" data-s=\"1\">Un bloque <code>react<\/code> no termina hasta que todos los flujos que observa están acabados, lo que te da la misma garantía de «todo se ha completado»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>say<\/code> se ejecuta solo <strong>después<\/strong> de que el bloque react haya terminado, así que <code>@values<\/code> ya contiene todos los valores emitidos.<\/span> <span class=\"sg\" data-s=\"1\">En efecto, el bloque <code>react<\/code> esperó el flujo por ti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este es un patrón útil: usa un bloque <code>react<\/code> para recoger todo lo que emite un flujo y trabaja después con el resultado recogido en la línea siguiente, con la seguridad de que el flujo está completo.<\/span> <span class=\"sg\" data-s=\"1\">Ya esperes una promesa con <code>await<\/code> o un flujo con <code>react<\/code>, el principio es el mismo: detenerse hasta que el trabajo concurrente esté hecho y continuar entonces con sus resultados.<\/span><\/p>"]]},"it":{"t":"Attendere il completamento","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> è il modo esplicito di aspettare, ma anche il codice reattivo aspetta — solo implicitamente.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco <code>react<\/code> non finisce finché tutti i supply che osserva non sono conclusi, il che ti dà la stessa garanzia di «è tutto completato»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>say<\/code> gira solo <strong>dopo<\/strong> che il blocco react è finito, quindi <code>@values<\/code> contiene già ogni valore emesso.<\/span> <span class=\"sg\" data-s=\"1\">In effetti il blocco <code>react<\/code> ha atteso il flusso al posto tuo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È uno schema utile: usa un blocco <code>react<\/code> per raccogliere tutto ciò che un supply emette, e poi lavora sul risultato raccolto nella riga successiva, sicuro che il flusso sia completo.<\/span> <span class=\"sg\" data-s=\"1\">Che tu aspetti una promise con <code>await<\/code> o un flusso con <code>react<\/code>, il principio è lo stesso: metterti in pausa finché il lavoro concorrente non è finito, poi proseguire con i suoi risultati.<\/span><\/p>"]]},"ru":{"t":"Ожидание завершения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> — это явный способ ждать, но реактивный код тоже ждёт, только неявно.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>react<\/code> не завершится, пока не закончатся все supply, за которыми он следит, а это даёт ту же гарантию «всё завершилось»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> выполняется только <strong>после<\/strong> того, как блок react закончил работу, поэтому <code>@values<\/code> уже содержит все выданные значения.<\/span> <span class=\"sg\" data-s=\"1\">По сути блок <code>react<\/code> дождался потока за вас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это полезный приём: соберите блоком <code>react<\/code> всё, что выдаёт supply, а затем работайте с собранным на следующей строке, будучи уверенными, что поток закончился.<\/span> <span class=\"sg\" data-s=\"1\">Ждёте ли вы промис через <code>await<\/code> или поток через <code>react<\/code> — принцип один: приостановиться, пока конкурентная работа не завершится, а затем продолжить с её результатами.<\/span><\/p>"]]},"uk":{"t":"Очікування завершення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> — це явний спосіб чекати, але реактивний код теж чекає, тільки неявно.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>react<\/code> не завершується, доки не завершаться всі потоки значень, за якими він стежить, а це дає вам ту саму гарантію «усе завершилося»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> виконується лише <strong>після<\/strong> того, як блок <code>react<\/code> завершився, тож <code>@values<\/code> уже містить кожне видане значення.<\/span> <span class=\"sg\" data-s=\"1\">По суті, блок <code>react<\/code> дочекався потоку значень за вас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це корисний підхід: скористайтеся блоком <code>react<\/code>, щоб зібрати все, що видає потік значень, а потім працюйте зі зібраним результатом у наступному рядку, будучи певними, що потік завершено.<\/span> <span class=\"sg\" data-s=\"1\">Чи чекаєте ви обіцянку через <code>await<\/code>, чи потік значень через <code>react<\/code>, принцип той самий — зупинись, поки конкурентна робота не завершиться, а потім продовжуй з її результатами.<\/span><\/p>"]]},"bg":{"t":"Изчакване на приключване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> е изричният начин да чакате, но реактивният код също чака — само че неявно.<\/span> <span class=\"sg\" data-s=\"1\">Блокът <code>react<\/code> не приключва, докато не приключат всички потоци от стойности, които следи, а това ви дава същата гаранция „всичко е приключило“:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @values;\n\nreact {\n    whenever Supply.from-list(2, 4, 6) {\n        @values.push($_);\n    }\n}\n\nsay [+] @values; # 12<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> се изпълнява едва <strong>след<\/strong> като блокът <code>react<\/code> е приключил, така че <code>@values<\/code> вече съдържа всяка подадена стойност.<\/span> <span class=\"sg\" data-s=\"1\">На практика блокът <code>react<\/code> е изчакал потока вместо вас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е полезен подход: използвайте блок <code>react<\/code>, за да съберете всичко, което потокът подава, а после работете със събрания резултат на следващия ред, уверени, че потокът е завършен.<\/span> <span class=\"sg\" data-s=\"1\">Дали чакате обещание с <code>await<\/code>, или поток със <code>react<\/code>, принципът е един и същ — спри, докато паралелната работа приключи, после продължи с резултатите ѝ.<\/span><\/p>"]]}}}</script>
