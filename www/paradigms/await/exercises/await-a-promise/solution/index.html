<script type="application/json" id="page-data">{"u":"paradigms/await/exercises/await-a-promise/solution","n":1375,"k":"solution","pv":"paradigms/await/exercises/await-a-promise","nx":"paradigms/await/exercises/await-a-supply","tr":["paradigms","paradigms/await"],"L":{"en":{"t":"The solution of ’Await a promise‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">All three jobs start at once and sleep concurrently, so the whole program takes about <code>0.3<\/code> seconds — the duration of the slowest job, not the sum of all three.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Although <code>quick<\/code> finishes first and <code>slow<\/code> last, the output is <code>(slow quick medium)<\/code>: <code>await<\/code> returns each result at the same position as its promise in <code>@jobs<\/code>. Completion order affects only <em>when<\/em> <code>await<\/code> returns, never the arrangement of the results.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Warten Sie ein Promise ab","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Alle drei Aufgaben starten zugleich und schlafen nebenläufig, das ganze Programm dauert also rund <code>0.3<\/code> Sekunden — die Dauer der langsamsten Aufgabe, nicht die Summe aller drei.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Obwohl <code>quick<\/code> zuerst fertig ist und <code>slow<\/code> zuletzt, lautet die Ausgabe <code>(slow quick medium)<\/code>: <code>await<\/code> liefert jedes Ergebnis an derselben Stelle wie sein Promise in <code>@jobs<\/code>. Die Reihenfolge der Fertigstellung beeinflusst nur, <em>wann<\/em> <code>await<\/code> zurückkehrt, nie die Anordnung der Ergebnisse.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Wacht een promise af","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Alle drie de taken starten tegelijk en slapen gelijktijdig, dus duurt het hele programma ongeveer <code>0.3<\/code> seconde — de duur van de traagste taak, niet de som van alle drie.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hoewel <code>quick<\/code> als eerste klaar is en <code>slow<\/code> als laatste, is de uitvoer <code>(slow quick medium)<\/code>: <code>await<\/code> geeft elk resultaat terug op dezelfde positie als zijn promise in <code>@jobs<\/code>. De volgorde van voltooiing beïnvloedt alleen <em>wanneer<\/em> <code>await<\/code> terugkeert, nooit de schikking van de resultaten.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Espere una promesa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los tres trabajos arrancan a la vez y duermen de forma concurrente, así que el programa entero tarda unos <code>0.3<\/code> segundos: la duración del trabajo más lento, no la suma de los tres.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aunque <code>quick<\/code> termina primero y <code>slow<\/code> el último, la salida es <code>(slow quick medium)<\/code>: <code>await<\/code> devuelve cada resultado en la misma posición que su promesa en <code>@jobs<\/code>. El orden de finalización afecta solo a <em>cuándo<\/em> retorna <code>await<\/code>, nunca a la disposición de los resultados.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Attendete una promise","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tutti e tre i lavori partono insieme e dormono in modo concorrente, quindi l'intero programma impiega circa <code>0.3<\/code> secondi — la durata del lavoro più lento, non la somma di tutti e tre.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anche se <code>quick<\/code> finisce per primo e <code>slow<\/code> per ultimo, l'output è <code>(slow quick medium)<\/code>: <code>await<\/code> restituisce ogni risultato nella stessa posizione della propria promise in <code>@jobs<\/code>. L'ordine di completamento influenza solo <em>quando<\/em> <code>await<\/code> ritorna, mai la disposizione dei risultati.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Дождитесь промиса","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Все три задачи стартуют одновременно и спят конкурентно, поэтому вся программа занимает около <code>0.3<\/code> секунды — длительность самой медленной задачи, а не сумму всех трёх.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Хотя <code>quick<\/code> заканчивается первой, а <code>slow<\/code> последней, вывод — <code>(slow quick medium)<\/code>: <code>await<\/code> возвращает каждый результат на той же позиции, что и его промис в <code>@jobs<\/code>. Порядок завершения влияет только на то, <em>когда<\/em> <code>await<\/code> вернёт управление, но никогда — на расположение результатов.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Дочекайтеся обіцянки»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Усі три завдання стартують водночас і сплять конкурентно, тож уся програма забирає близько <code>0.3<\/code> секунди — тривалість найповільнішого завдання, а не суму всіх трьох.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Хоча <code>quick<\/code> завершується першим, а <code>slow<\/code> останнім, виводом є <code>(slow quick medium)<\/code>: <code>await<\/code> повертає кожен результат на тій самій позиції, що й його обіцянка в <code>@jobs<\/code>. Порядок завершення впливає лише на те, <em>коли<\/em> <code>await<\/code> повернеться, а не на розташування результатів.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Изчакайте обещание","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs =\n    (start { sleep 0.3; 'slow'   }),\n    (start { sleep 0.1; 'quick'  }),\n    (start { sleep 0.2; 'medium' });\n\nsay await @jobs;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-promise.raku\" target=\"_blank\" rel=\"noopener\">await-a-promise.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И трите задачи тръгват наведнъж и спят паралелно, така че цялата програма отнема около <code>0.3<\/code> секунди — продължителността на най-бавната задача, а не сумата от трите.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Макар <code>quick<\/code> да приключва първа, а <code>slow<\/code> последна, изходът е <code>(slow quick medium)<\/code>: <code>await<\/code> връща всеки резултат на същата позиция, на която е неговото обещание в <code>@jobs<\/code>. Редът на приключване влияе само върху това <em>кога<\/em> <code>await<\/code> се връща, а не върху подредбата на резултатите.<\/span><\/li><\/ol>"]]}}}</script>
