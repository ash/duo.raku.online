<\/code> y produzca <code>'medium'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Espéralas todas como una lista e imprime los resultados.<\/span> <span class=\"sg\" data-s=\"2\">Fíjate en el orden en que vuelven: el trabajo rápido termina primero, pero ¿cambia eso la salida?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/await/exercises/await-a-promise/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Attendete una promise","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Avvia <strong>tre<\/strong> promise: una che dorme <code>0.3<\/code> secondi e produce la stringa <code>'slow'<\/code>, una che dorme <code>0.1<\/code> e produce <code>'quick'<\/code> e una che dorme <code>0.2<\/code> e produce <code>'medium'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Attendile tutte come elenco e stampa i risultati.<\/span> <span class=\"sg\" data-s=\"2\">Nota in che ordine tornano: il lavoro rapido finisce per primo, ma questo cambia l'output?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>(slow quick medium)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/await/exercises/await-a-promise/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Sagaidiet solījumu","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sāciet <strong>trīs<\/strong> solījumus: vienu, kas guļ <code>0.3<\/co
