span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een supply afwachten blokkeert tot de stroom alles uitgezonden heeft wat ze heeft — hetzelfde \"wacht tot het klaar is\" dat <code>await<\/code> bij een promise geeft — en haar waarde is het <strong>laatste<\/strong> dat de supply uitzond, <code>23<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dat past bij een stroom waarbij alleen de eindtoestand telt, zoals de nieuwste sensormeting. Als je <em>elke<\/em> waarde nodig hebt, is dat een taak voor <code>.tap<\/code> of een <code>react<\/code>-blok, zoals in de vorige secties.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Espere un supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensor = Supply.from-list(18, 21, 19, 23);\n\nmy $last = await $sensor;\nsay \"final reading: $last\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-supply.raku\" target=\"_blank\" rel=\"noopener\">await-a-supply.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>final reading: 23<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esperar un supply se bloquea hasta que el flujo ha emitido todo lo que tenía — la misma «espera hasta que acabe» que <code>await<\/code> da para una promesa — y su valor es lo <strong>último<\/strong> que emitió el supply, <code>23<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esto encaja con un flujo en el que solo importa el estado final, como la lectura más reciente de un sensor. Si necesitas <em>todos<\/em> los valores, eso es tarea de <code>.tap<\/code> o de un bloque <code>react<\/code>, como en las secciones anteriores.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Attendete un supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensor = Supply.from-list(18, 21, 19, 23);\n\nmy $last = await $sensor;\nsay \"final reading: $last\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-supply.raku\" target=\"_blank\" rel=\"noopener\">await-a-supply.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>final reading: 23<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Attendere un supply blocca finché il flusso non ha emesso tutto ciò che aveva — lo stesso «aspetta fino al completamento» che <code>await<\/code> dà per una promise — e il suo valore è l'<strong>ultima<\/strong> cosa emessa dal supply, <code>23<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questo si adatta a un flusso in cui conta solo lo stato finale, come l'ultima lettura di un sensore. Se ti serve <em>ogni<\/em> valore, quello è un compito per <code>.tap<\/code> o per un blocco <code>react<\/code>, come nelle sezioni precedenti.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Дождитесь supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensor = Supply.from-list(18, 21, 19, 23);\n\nmy $last = await $sensor;\nsay \"final reading: $last\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-supply.raku\" target=\"_blank\" rel=\"noopener\">await-a-supply.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>final reading: 23<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ожидание supply блокирует выполнение, пока поток не выдаст всё, что у него есть, — то самое «ждать до завершения», которое <code>await<\/code> даёт и для промиса, — а его значением становится <strong>последнее<\/strong>, что выдал supply, то есть <code>23<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Это подходит для потока, в котором важно лишь конечное состояние, например для последнего показания датчика. Если же вам нужно <em>каждое<\/em> значение, это работа для <code>.tap<\/code> или блока <code>react<\/code>, как в предыдущих разделах.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Дочекайтеся потоку значень»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensor = Supply.from-list(18, 21, 19, 23);\n\nmy $last = await $sensor;\nsay \"final reading: $last\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-supply.raku\" target=\"_blank\" rel=\"noopener\">await-a-supply.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>final reading: 23<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Очікування потоку значень блокує виконання, аж поки потік не видасть усе, що має, — те саме «чекай до завершення», яке <code>await<\/code> дає для обіцянки, — а його значенням є <strong>останнє<\/strong>, що видав потік, тобто <code>23<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це пасує потокові, у якому важливий лише кінцевий стан, як-от найсвіжіший показ давача. Якщо вам потрібне <em>кожне<\/em> значення, це робота для <code>.tap<\/code> або блоку <code>react<\/code>, як у попередніх розділах.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Изчакайте поток от стойности","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensor = Supply.from-list(18, 21, 19, 23);\n\nmy $last = await $sensor;\nsay \"final reading: $last\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/await/await-a-supply.raku\" target=\"_blank\" rel=\"noopener\">await-a-supply.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>final reading: 23<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изчакването на поток блокира, докато потокът не подаде всичко, което има — същото „чакай до приключване“, което <code>await<\/code> дава за обещание, — а стойността му е <strong>последното<\/strong>, което потокът е подал, тоест <code>23<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това пасва на поток, при който има значение само крайното състояние, като най-новото показание на датчик. Ако ви трябва <em>всяка<\/em> стойност, това е работа за <code>.tap<\/code> или за блок <code>react<\/code>, както в предишните раздели.<\/span><\/li><\/ol>"]]}}}</script>
