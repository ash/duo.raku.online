<script type="application/json" id="page-data">{"u":"paradigms/await","n":1368,"k":"section","pv":"paradigms/react-whenever/exercises/two-whenevers/solution","nx":"paradigms/await/awaiting-promises","tr":["paradigms"],"L":{"en":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Concurrent and reactive code launches work that finishes later.<\/span> <span class=\"sg\" data-s=\"1\">At some point you need to <strong>wait<\/strong> for that work and use its result.<\/span> <span class=\"sg\" data-s=\"2\">The tool for this is <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You have already met <code>await<\/code> with <a href=\"/paradigms/promises/\">promises<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">This section gathers the idea together: how <code>await<\/code> waits for one or many promises, and how reactive constructs like <code>react<\/code> provide the same “wait until done” guarantee for streams.<\/span><\/p>"]]},"de":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nebenläufiger und reaktiver Code startet Arbeit, die später fertig wird.<\/span> <span class=\"sg\" data-s=\"1\">Irgendwann müssen Sie auf diese Arbeit <strong>warten<\/strong> und ihr Ergebnis verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Das Werkzeug dafür ist <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> ist Ihnen schon bei den <a href=\"https://course.raku.org/de/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">Promises<\/a> begegnet.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt bringt den Gedanken zusammen: wie <code>await<\/code> auf ein oder viele Promises wartet und wie reaktive Konstrukte wie <code>react<\/code> dieselbe Zusicherung „warte, bis es fertig ist“ für Ströme geben.<\/span><\/p>"]]},"nl":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Concurrente en reactieve code start werk dat later klaar is.<\/span> <span class=\"sg\" data-s=\"1\">Op enig moment moet je op dat werk <strong>wachten<\/strong> en het resultaat ervan gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">Het gereedschap daarvoor is <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je bent <code>await<\/code> al tegengekomen bij <a href=\"https://course.raku.org/nl/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">promises<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie brengt het idee bij elkaar: hoe <code>await<\/code> op een of vele promises wacht, en hoe reactieve constructies als <code>react<\/code> dezelfde garantie \"wacht tot het klaar is\" voor stromen bieden.<\/span><\/p>"]]},"es":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El código concurrente y reactivo lanza trabajo que termina más tarde.<\/span> <span class=\"sg\" data-s=\"1\">En algún momento necesitas <strong>esperar<\/strong> ese trabajo y usar su resultado.<\/span> <span class=\"sg\" data-s=\"2\">La herramienta para ello es <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya has conocido <code>await<\/code> con las <a href=\"https://course.raku.org/es/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">promesas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección reúne la idea: cómo <code>await<\/code> espera una o muchas promesas, y cómo construcciones reactivas como <code>react<\/code> ofrecen la misma garantía de «esperar hasta que acabe» para los flujos.<\/span><\/p>"]]},"it":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il codice concorrente e reattivo lancia lavoro che finisce più tardi.<\/span> <span class=\"sg\" data-s=\"1\">A un certo punto devi <strong>aspettare<\/strong> quel lavoro e usarne il risultato.<\/span> <span class=\"sg\" data-s=\"2\">Lo strumento per questo è <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai già incontrato <code>await<\/code> con le <a href=\"https://course.raku.org/it/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">promise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione raccoglie l'idea: come <code>await<\/code> aspetta una o molte promise e come i costrutti reattivi come <code>react<\/code> forniscono la stessa garanzia di «aspetta finché non è finito» per i flussi.<\/span><\/p>"]]},"ru":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Конкурентный и реактивный код запускает работу, которая заканчивается позже.<\/span> <span class=\"sg\" data-s=\"1\">В какой-то момент вам нужно <strong>дождаться<\/strong> этой работы и воспользоваться её результатом.<\/span> <span class=\"sg\" data-s=\"2\">Инструмент для этого — <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>await<\/code> вы уже встречались в разделе о <a href=\"https://course.raku.org/ru/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">промисах<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Этот раздел собирает идею воедино: как <code>await<\/code> ждёт один или много промисов и как реактивные конструкции вроде <code>react<\/code> дают ту же гарантию «дождаться завершения» для потоков.<\/span><\/p>"]]},"uk":{"t":"await","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Конкурентний та реактивний код запускає роботу, що завершиться пізніше.<\/span> <span class=\"sg\" data-s=\"1\">У певний момент вам потрібно <strong>дочекатися<\/strong> цієї роботи й скористатися її результатом.<\/span> <span class=\"sg\" data-s=\"2\">Інструментом для цього є <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви вже зустрічали <code>await<\/code> разом з <a href=\"https://course.raku.org/uk/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">обіцянками<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ збирає ідею докупи: як <code>await<\/code> чекає на одну чи багато обіцянок і як реактивні конструкції на кшталт <code>react<\/code> дають ту саму гарантію «зачекай, поки не завершиться» для потоків значень.<\/span><\/p>"]]},"bg":{"t":"await","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Паралелният и реактивният код пускат работа, която приключва по-късно.<\/span> <span class=\"sg\" data-s=\"1\">В някакъв момент трябва да <strong>изчакате<\/strong> тази работа и да използвате резултата ѝ. Инструментът за това е <code>await<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече срещнахте <code>await<\/code> при <a href=\"https://course.raku.org/bg/paradigms/promises/\" target=\"_blank\" rel=\"noopener\">обещанията<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел събира идеята накуп: как <code>await<\/code> изчаква едно или много обещания и как реактивните конструкции като <code>react<\/code> дават същата гаранция „изчакай, докато приключи“ за потоците от стойности.<\/span><\/p>"]]}}}</script>
