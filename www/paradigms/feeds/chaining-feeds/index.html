<script type="application/json" id="page-data">{"u":"paradigms/feeds/chaining-feeds","n":1222,"k":"topic","pv":"paradigms/feeds/feed-operator/quiz","nx":"paradigms/feeds/chaining-feeds/quiz","tr":["paradigms","paradigms/feeds"],"L":{"en":{"t":"Chaining feeds","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The real value of feeds appears when you have several stages.<\/span> <span class=\"sg\" data-s=\"1\">Each <code>==&gt;<\/code> passes its result to the next operation, so a whole pipeline reads top to bottom in the order the work happens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Follow the data down the page: start with <code>1..10<\/code>, keep the even numbers, square each of them, and collect the result.<\/span> <span class=\"sg\" data-s=\"1\">The even numbers are <code>2, 4, 6, 8, 10<\/code>, and their squares are <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Written as a method chain, the same pipeline is <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — and that reads left to right just as the feed does.<\/span> <span class=\"sg\" data-s=\"1\">A method chain is not inside-out; it runs its stages in the very same order.<\/span> <span class=\"sg\" data-s=\"2\">The form that genuinely reads inside-out is nesting the operations as plain functions, <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, where you have to start at the innermost call and work outwards.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A feed, then, is not a way to escape inside-out code — it is another spelling of a left-to-right pipeline.<\/span> <span class=\"sg\" data-s=\"1\">What it adds is layout: each <code>==&gt;<\/code> stage can sit on its own line, and the one operator works the same for method-style and function-style steps alike, which keeps a long pipeline easy to scan.<\/span> <span class=\"sg\" data-s=\"2\">Feeds and method chains ultimately do the same job; choose whichever makes a particular transformation clearest.<\/span><\/p>"]]},"de":{"t":"Feeds aneinanderreihen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der wahre Wert von Feeds zeigt sich, wenn Sie mehrere Stufen haben.<\/span> <span class=\"sg\" data-s=\"1\">Jedes <code>==&gt;<\/code> reicht sein Ergebnis an die nächste Operation weiter, eine ganze Pipeline liest sich also von oben nach unten in der Reihenfolge, in der die Arbeit geschieht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Folgen Sie den Daten die Seite hinunter: beginne mit <code>1..10<\/code>, behalte die geraden Zahlen, quadriere jede davon und sammle das Ergebnis.<\/span> <span class=\"sg\" data-s=\"1\">Die geraden Zahlen sind <code>2, 4, 6, 8, 10<\/code>, und ihre Quadrate sind <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als Methodenkette geschrieben ist dieselbe Pipeline <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — und die liest sich genau wie der Feed von links nach rechts.<\/span> <span class=\"sg\" data-s=\"1\">Eine Methodenkette ist nicht von innen nach außen; sie führt ihre Stufen in genau derselben Reihenfolge aus.<\/span> <span class=\"sg\" data-s=\"2\">Die Form, die sich wirklich von innen nach außen liest, ist das Verschachteln der Operationen als gewöhnliche Funktionen, <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, wo Sie beim innersten Aufruf anfangen und sich nach außen arbeiten müssen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Feed ist also kein Weg, von-innen-nach-außen-Code zu entkommen — er ist eine andere Schreibweise einer Pipeline von links nach rechts.<\/span> <span class=\"sg\" data-s=\"1\">Was er hinzufügt, ist die Anordnung: Jede <code>==&gt;<\/code>-Stufe darf in einer eigenen Zeile stehen, und derselbe Operator funktioniert gleichermaßen für Schritte im Methoden- wie im Funktionsstil, was eine lange Pipeline gut überschaubar hält.<\/span> <span class=\"sg\" data-s=\"2\">Feeds und Methodenketten erledigen letztlich dieselbe Arbeit; wählen Sie, was eine bestimmte Umformung am klarsten macht.<\/span><\/p>"]]},"nl":{"t":"Feeds aan elkaar rijgen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De echte waarde van feeds komt naar voren wanneer je meerdere fasen hebt.<\/span> <span class=\"sg\" data-s=\"1\">Elke <code>==&gt;<\/code> geeft haar resultaat aan de volgende bewerking door, zodat een hele pijplijn van boven naar beneden leest in de volgorde waarin het werk gebeurt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Volg de gegevens de pagina af: begin met <code>1..10<\/code>, houd de even getallen, kwadrateer ze elk, en verzamel het resultaat.<\/span> <span class=\"sg\" data-s=\"1\">De even getallen zijn <code>2, 4, 6, 8, 10<\/code>, en hun kwadraten zijn <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als methodeketen geschreven is dezelfde pijplijn <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — en dat leest net zo van links naar rechts als de feed.<\/span> <span class=\"sg\" data-s=\"1\">Een methodeketen is niet binnenstebuiten; ze draait haar fasen in precies dezelfde volgorde.<\/span> <span class=\"sg\" data-s=\"2\">De vorm die werkelijk binnenstebuiten leest is de bewerkingen als gewone functies nestelen, <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, waar je bij de binnenste aanroep moet beginnen en naar buiten moet werken.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een feed is dus geen manier om aan binnenstebuiten code te ontsnappen — het is een andere schrijfwijze van een pijplijn van links naar rechts.<\/span> <span class=\"sg\" data-s=\"1\">Wat hij toevoegt is opmaak: elke <code>==&gt;<\/code>-fase mag op een eigen regel staan, en die ene operator werkt hetzelfde voor stappen in methode- en in functiestijl, wat een lange pijplijn goed scanbaar houdt.<\/span> <span class=\"sg\" data-s=\"2\">Feeds en methodeketens doen uiteindelijk hetzelfde werk; kies wat een bepaalde transformatie het duidelijkst maakt.<\/span><\/p>"]]},"es":{"t":"Encadenar flujos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El verdadero valor de los flujos aparece cuando tienes varias etapas.<\/span> <span class=\"sg\" data-s=\"1\">Cada <code>==&gt;<\/code> pasa su resultado a la operación siguiente, así que la tubería entera se lee de arriba abajo en el orden en que ocurre el trabajo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sigue los datos página abajo: empieza con <code>1..10<\/code>, conserva los números pares, eleva cada uno al cuadrado y recoge el resultado.<\/span> <span class=\"sg\" data-s=\"1\">Los números pares son <code>2, 4, 6, 8, 10<\/code>, y sus cuadrados son <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Escrita como cadena de métodos, la misma tubería es <code>(1..10).grep(* %% 2).map(* ** 2)<\/code>, y eso se lee de izquierda a derecha igual que el flujo.<\/span> <span class=\"sg\" data-s=\"1\">Una cadena de métodos no va de dentro afuera; ejecuta sus etapas exactamente en el mismo orden.<\/span> <span class=\"sg\" data-s=\"2\">La forma que sí se lee de dentro afuera es anidar las operaciones como funciones normales, <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, donde tienes que empezar por la llamada más interna e ir saliendo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un flujo, por tanto, no es una manera de escapar del código de dentro afuera: es otra grafía de una tubería de izquierda a derecha.<\/span> <span class=\"sg\" data-s=\"1\">Lo que aporta es disposición: cada etapa <code>==&gt;<\/code> puede ocupar su propia línea, y un mismo operador funciona igual tanto para pasos con forma de método como con forma de función, lo que mantiene fácil de recorrer una tubería larga.<\/span> <span class=\"sg\" data-s=\"2\">Los flujos y las cadenas de métodos hacen en el fondo el mismo trabajo; elige el que deje más clara cada transformación concreta.<\/span><\/p>"]]},"it":{"t":"Concatenare i feed","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il vero valore dei flussi appare quando gli stadi sono parecchi.<\/span> <span class=\"sg\" data-s=\"1\">Ogni <code>==&gt;<\/code> passa il proprio risultato all'operazione successiva, quindi un'intera pipeline si legge dall'alto in basso nell'ordine in cui avviene il lavoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Segui i dati giù per la pagina: parti da <code>1..10<\/code>, conserva i numeri pari, eleva al quadrato ciascuno di essi e raccogli il risultato.<\/span> <span class=\"sg\" data-s=\"1\">I numeri pari sono <code>2, 4, 6, 8, 10<\/code>, e i loro quadrati sono <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scritta come catena di metodi, la stessa pipeline è <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — e anche quella si legge da sinistra a destra proprio come il flusso.<\/span> <span class=\"sg\" data-s=\"1\">Una catena di metodi non va dall'interno all'esterno; esegue i propri stadi esattamente nello stesso ordine.<\/span> <span class=\"sg\" data-s=\"2\">La forma che si legge davvero dall'interno all'esterno è quella che annida le operazioni come funzioni semplici, <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, dove devi partire dalla chiamata più interna e lavorare verso l'esterno.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un flusso, quindi, non è un modo di sfuggire al codice dall'interno all'esterno: è un'altra grafia di una pipeline da sinistra a destra.<\/span> <span class=\"sg\" data-s=\"1\">Ciò che aggiunge è l'impaginazione: ogni stadio <code>==&gt;<\/code> può stare sulla propria riga, e l'unico operatore funziona allo stesso modo sia per i passi in stile metodo sia per quelli in stile funzione, il che tiene facile da scorrere una lunga pipeline.<\/span> <span class=\"sg\" data-s=\"2\">Alla fine i flussi e le catene di metodi fanno lo stesso lavoro; scegli quello che rende più chiara una particolare trasformazione.<\/span><\/p>"]]},"ru":{"t":"Цепочки конвейеров","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Настоящая ценность конвейеров проявляется, когда ступеней несколько.<\/span> <span class=\"sg\" data-s=\"1\">Каждый <code>==&gt;<\/code> передаёт свой результат следующей операции, поэтому весь конвейер читается сверху вниз в том порядке, в каком идёт работа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Проследите за данными вниз по странице: начинаем с <code>1..10<\/code>, оставляем чётные числа, возводим каждое в квадрат и собираем результат.<\/span> <span class=\"sg\" data-s=\"1\">Чётные числа — это <code>2, 4, 6, 8, 10<\/code>, а их квадраты — <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Записанный цепочкой методов, тот же конвейер выглядит как <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — и читается он слева направо ровно так же, как конвейер.<\/span> <span class=\"sg\" data-s=\"1\">Цепочка методов не «выворачивается наизнанку»: её ступени выполняются в том же самом порядке.<\/span> <span class=\"sg\" data-s=\"2\">По-настоящему наизнанку читается вложение операций в виде обычных функций, <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, где приходится начинать с самого внутреннего вызова и двигаться наружу.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Значит, конвейер — не способ убежать от кода, вывернутого наизнанку; это другое написание того же конвейера слева направо.<\/span> <span class=\"sg\" data-s=\"1\">Что он добавляет, так это расположение: каждая ступень <code>==&gt;<\/code> может стоять на своей строке, и один и тот же оператор одинаково работает и для шагов в стиле методов, и для шагов в стиле функций, — а от этого длинный конвейер остаётся лёгким для просмотра.<\/span> <span class=\"sg\" data-s=\"2\">В конечном счёте конвейеры и цепочки методов делают одну работу; выбирайте то, что делает конкретное преобразование понятнее.<\/span><\/p>"]]},"uk":{"t":"Ланцюжки потоків","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Справжня цінність потоків з'являється тоді, коли етапів кілька.<\/span> <span class=\"sg\" data-s=\"1\">Кожен <code>==&gt;<\/code> передає свій результат наступній операції, тож увесь конвеєр читається згори вниз у тому порядку, у якому відбувається робота:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Простежте дані вниз сторінкою: почни з <code>1..10<\/code>, залиш парні числа, піднеси кожне до квадрата й збери результат.<\/span> <span class=\"sg\" data-s=\"1\">Парні числа — це <code>2, 4, 6, 8, 10<\/code>, а їхні квадрати — <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Записаний як ланцюжок методів, той самий конвеєр має вигляд <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — і читається він зліва направо, точно як потік.<\/span> <span class=\"sg\" data-s=\"1\">Ланцюжок методів не вивернутий навиворіт; він виконує свої етапи в тому самому порядку.<\/span> <span class=\"sg\" data-s=\"2\">Формою, що справді читається навиворіт, є вкладання операцій як звичайних функцій — <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, де доводиться починати з найглибшого виклику й рухатися назовні.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Отже, потік — це не спосіб утекти від вивернутого коду, а інше написання конвеєра, що читається зліва направо.<\/span> <span class=\"sg\" data-s=\"1\">Що він додає, так це розкладку: кожен етап <code>==&gt;<\/code> може стояти на власному рядку, і один оператор однаково працює як для кроків у стилі методів, так і для кроків у стилі функцій, а це тримає довгий конвеєр легким для огляду.<\/span> <span class=\"sg\" data-s=\"2\">Зрештою потоки та ланцюжки методів роблять ту саму роботу; обирайте те, що робить конкретне перетворення найзрозумілішим.<\/span><\/p>"]]},"bg":{"t":"Свързване на потоци","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Истинската стойност на потоците изпъква, когато етапите са няколко.<\/span> <span class=\"sg\" data-s=\"1\">Всеки <code>==&gt;<\/code> подава резултата си на следващата операция, така че целият конвейер се чете отгоре надолу в реда, в който се случва работата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10)\n    ==&gt; grep(* %% 2)\n    ==&gt; map(* ** 2)\n    ==&gt; my @result;\n\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Проследете данните надолу по страницата: започни с <code>1..10<\/code>, запази четните числа, повдигни всяко на квадрат и събери резултата.<\/span> <span class=\"sg\" data-s=\"1\">Четните числа са <code>2, 4, 6, 8, 10<\/code>, а квадратите им — <code>4, 16, 36, 64, 100<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Записан като верига от методи, същият конвейер е <code>(1..10).grep(* %% 2).map(* ** 2)<\/code> — и той се чете отляво надясно точно както потокът.<\/span> <span class=\"sg\" data-s=\"1\">Веригата от методи не е обърната отвътре навън; тя изпълнява етапите си в същия ред.<\/span> <span class=\"sg\" data-s=\"2\">Формата, която наистина се чете отвътре навън, е влагането на операциите като обикновени функции — <code>map(* ** 2, grep(* %% 2, 1..10))<\/code>, — където трябва да започнете от най-вътрешното извикване и да се придвижвате навън.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Значи потокът не е начин да избягате от обърнат навътре код, а друг запис на конвейер, който се чете отляво надясно.<\/span> <span class=\"sg\" data-s=\"1\">Онова, което той добавя, е подредбата: всеки етап <code>==&gt;<\/code> може да стои на свой ред, а един и същ оператор работи еднакво както за стъпки в стил метод, така и за стъпки в стил функция, което държи дългия конвейер лесен за преглед.<\/span> <span class=\"sg\" data-s=\"2\">В крайна сметка потоците и веригите от методи вършат една и съща работа; изберете онова, което прави дадено преобразувание най-ясно.<\/span><\/p>"]]}}}</script>
