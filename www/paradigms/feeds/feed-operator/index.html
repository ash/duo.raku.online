<script type="application/json" id="page-data">{"u":"paradigms/feeds/feed-operator","n":1220,"k":"topic","pv":"paradigms/feeds","nx":"paradigms/feeds/feed-operator/quiz","tr":["paradigms","paradigms/feeds"],"L":{"en":{"t":"The feed operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The feed operator <code>==&gt;<\/code> sends a list from the left into the operation on the right.<\/span> <span class=\"sg\" data-s=\"1\">The result then flows on to wherever the next <code>==&gt;<\/code> points, ending in a variable that collects it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Read it left to right: take <code>1..10<\/code>, keep the even numbers, and store the result in <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>%%<\/code> operator means “is divisible by”, so <code>* %% 2<\/code> keeps the even numbers.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The important rule is that a feed must <strong>end in a target<\/strong> — usually <code>my @array<\/code> (or an existing variable).<\/span> <span class=\"sg\" data-s=\"1\">The data flows forward into it.<\/span> <span class=\"sg\" data-s=\"2\">Writing the assignment the other way round, with <code>=<\/code>, does not do what you want, because the feed and the assignment compete; always let the feed finish into its variable.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A feed is just another way to spell a chain of list operations.<\/span> <span class=\"sg\" data-s=\"1\">The same result could be written <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The feed form comes into its own when there are several stages, as the next topic shows.<\/span><\/p>"]]},"de":{"t":"Der Feed-Operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Feed-Operator <code>==&gt;<\/code> schickt eine Liste von links in die Operation rechts.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis fließt dann dorthin weiter, wohin das nächste <code>==&gt;<\/code> zeigt, und endet in einer Variablen, die es auffängt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie es von links nach rechts: nimm <code>1..10<\/code>, behalte die geraden Zahlen und lege das Ergebnis in <code>@evens<\/code> ab.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>%%<\/code> bedeutet „ist teilbar durch“, <code>* %% 2<\/code> behält also die geraden Zahlen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die wichtige Regel ist, dass ein Feed in einem <strong>Ziel enden<\/strong> muss — meist <code>my @array<\/code> (oder eine bestehende Variable).<\/span> <span class=\"sg\" data-s=\"1\">Die Daten fließen vorwärts hinein.<\/span> <span class=\"sg\" data-s=\"2\">Die Zuweisung andersherum zu schreiben, mit <code>=<\/code>, tut nicht, was Sie wollen, denn Feed und Zuweisung geraten sich in die Quere; lassen Sie den Feed stets in seiner Variablen enden.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Feed ist nur eine andere Schreibweise für eine Kette von Listenoperationen.<\/span> <span class=\"sg\" data-s=\"1\">Dasselbe Ergebnis ließe sich als <code>my @evens = (1..10).grep(* %% 2)<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Die Feed-Form kommt zur Geltung, wenn es mehrere Stufen gibt, wie das nächste Thema zeigt.<\/span><\/p>"]]},"nl":{"t":"De feed-operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De feed-operator <code>==&gt;<\/code> stuurt een lijst van links naar de bewerking rechts.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat stroomt daarna door naar waar de volgende <code>==&gt;<\/code> heen wijst, en eindigt in een variabele die het opvangt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lees het van links naar rechts: neem <code>1..10<\/code>, houd de even getallen, en bewaar het resultaat in <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De operator <code>%%<\/code> betekent \"is deelbaar door\", dus <code>* %% 2<\/code> houdt de even getallen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De belangrijke regel is dat een feed in een <strong>doel moet eindigen<\/strong> — meestal <code>my @array<\/code> (of een bestaande variabele).<\/span> <span class=\"sg\" data-s=\"1\">De gegevens stromen er voorwaarts in.<\/span> <span class=\"sg\" data-s=\"2\">De toekenning andersom schrijven, met <code>=<\/code>, doet niet wat je wilt, omdat de feed en de toekenning met elkaar concurreren; laat de feed altijd in zijn variabele eindigen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een feed is slechts een andere manier om een keten lijstbewerkingen te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde resultaat had je als <code>my @evens = (1..10).grep(* %% 2)<\/code> kunnen schrijven.<\/span> <span class=\"sg\" data-s=\"2\">De feed-vorm komt tot zijn recht wanneer er meerdere fasen zijn, zoals het volgende onderwerp laat zien.<\/span><\/p>"]]},"es":{"t":"El operador de flujo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El operador de flujo <code>==&gt;<\/code> envía una lista desde la izquierda hacia la operación de la derecha.<\/span> <span class=\"sg\" data-s=\"1\">El resultado sigue después hacia donde apunte el <code>==&gt;<\/code> siguiente, terminando en una variable que lo recoge:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Léelo de izquierda a derecha: toma <code>1..10<\/code>, conserva los números pares y guarda el resultado en <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El operador <code>%%<\/code> significa «es divisible por», así que <code>* %% 2<\/code> conserva los números pares.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La regla importante es que un flujo debe <strong>terminar en un destino<\/strong>, normalmente <code>my @array<\/code> (o una variable ya existente).<\/span> <span class=\"sg\" data-s=\"1\">Los datos fluyen hacia delante hasta él.<\/span> <span class=\"sg\" data-s=\"2\">Escribir la asignación al revés, con <code>=<\/code>, no hace lo que quieres, porque el flujo y la asignación compiten; deja siempre que el flujo termine en su variable.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un flujo no es más que otra manera de escribir una cadena de operaciones sobre listas.<\/span> <span class=\"sg\" data-s=\"1\">El mismo resultado podría escribirse <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La forma de flujo luce cuando hay varias etapas, como muestra el tema siguiente.<\/span><\/p>"]]},"it":{"t":"L'operatore feed","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'operatore di flusso <code>==&gt;<\/code> manda un elenco da sinistra dentro l'operazione a destra.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato scorre poi fin dove punta il <code>==&gt;<\/code> successivo, terminando in una variabile che lo raccoglie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Leggilo da sinistra a destra: prendi <code>1..10<\/code>, conserva i numeri pari e riponi il risultato in <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore <code>%%<\/code> significa «è divisibile per», quindi <code>* %% 2<\/code> conserva i numeri pari.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La regola importante è che un flusso deve <strong>terminare in un bersaglio<\/strong>, di solito <code>my @array<\/code> (o una variabile già esistente).<\/span> <span class=\"sg\" data-s=\"1\">I dati vi scorrono dentro.<\/span> <span class=\"sg\" data-s=\"2\">Scrivere l'assegnamento nel verso opposto, con <code>=<\/code>, non fa ciò che vuoi, perché il flusso e l'assegnamento si contendono il campo; lascia sempre che il flusso finisca nella propria variabile.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un flusso è solo un altro modo di scrivere una catena di operazioni su elenchi.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso risultato si potrebbe scrivere <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La forma a flusso dà il meglio quando gli stadi sono parecchi, come mostra l'argomento successivo.<\/span><\/p>"]]},"lv":{"t":"Plūsmas operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Plūsmas operators <code>==&gt;<\/code> nosūta sarakstu no kreisās puses uz darbību labajā pusē.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts pēc tam plūst tālāk uz to, kurp rāda nākamais <code>==&gt;<\/code>, un beidzas mainīgajā, kas to savāc:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lasiet no kreisās uz labo: paņem <code>1..10<\/code>, paturi pāra skaitļus un noglabā rezultātu <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Operators <code>%%<\/code> nozīmē «dalās ar», tāpēc <code>* %% 2<\/code> patur pāra skaitļus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Svarīgais likums ir tas, ka plūsmai <strong>jābeidzas mērķī<\/strong> — parasti <code>my @array<\/code> (vai jau esošs mainīgais).<\/span> <span class=\"sg\" data-s=\"1\">Dati tajā ieplūst.<\/span> <span class=\"sg\" data-s=\"2\">Piešķīruma rakstīšana otrādi, ar <code>=<\/code>, nedod to, ko gribat, jo plūsma un piešķīrums sacenšas; vienmēr ļaujiet plūsmai ietecēt savā mainīgajā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Plūsma ir tikai vēl viens veids, kā uzrakstīt saraksta darbību ķēdi.<\/span> <span class=\"sg\" data-s=\"1\">To pašu rezultātu varētu uzrakstīt kā <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Plūsmas forma atklāj savu vērtību, kad posmu ir vairāki, kā rāda nākamais temats.<\/span><\/p>"]]},"ru":{"t":"Оператор конвейера","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор конвейера <code>==&gt;<\/code> отправляет список слева в операцию справа.<\/span> <span class=\"sg\" data-s=\"1\">Результат затем течёт дальше, куда указывает следующий <code>==&gt;<\/code>, и заканчивает путь в переменной, которая его собирает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Читайте слева направо: возьми <code>1..10<\/code>, оставь чётные числа и сохрани результат в <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>%%<\/code> означает «делится на», поэтому <code>* %% 2<\/code> оставляет чётные числа.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важное правило: конвейер обязан <strong>заканчиваться приёмником<\/strong> — обычно это <code>my @array<\/code> (или уже существующая переменная).<\/span> <span class=\"sg\" data-s=\"1\">Данные втекают в него.<\/span> <span class=\"sg\" data-s=\"2\">Записывать присваивание в обратную сторону, через <code>=<\/code>, — не то, что вам нужно, потому что конвейер и присваивание начнут спорить друг с другом; всегда давайте конвейеру дотечь до своей переменной.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Конвейер — это просто другой способ записать цепочку операций над списком.<\/span> <span class=\"sg\" data-s=\"1\">Тот же результат можно записать как <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По-настоящему конвейер раскрывается, когда ступеней несколько, — об этом следующая тема.<\/span><\/p>"]]},"uk":{"t":"Оператор потоку","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор потоку <code>==&gt;<\/code> надсилає список зліва в операцію праворуч.<\/span> <span class=\"sg\" data-s=\"1\">Результат тоді тече далі туди, куди вказує наступний <code>==&gt;<\/code>, і завершується у змінній, що його збирає:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Читайте зліва направо: візьми <code>1..10<\/code>, залиш парні числа й збережи результат у <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>%%<\/code> означає «ділиться на», тож <code>* %% 2<\/code> залишає парні числа.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важливе правило: потік має <strong>завершуватися ціллю<\/strong> — зазвичай <code>my @array<\/code> (або наявною змінною).<\/span> <span class=\"sg\" data-s=\"1\">Дані течуть уперед у неї.<\/span> <span class=\"sg\" data-s=\"2\">Записування присвоєння навпаки, через <code>=<\/code>, робить не те, що вам потрібно, бо потік і присвоєння змагаються між собою; завжди дозволяйте потокові завершитися у своїй змінній.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потік — це просто ще один спосіб записати ланцюжок операцій над списком.<\/span> <span class=\"sg\" data-s=\"1\">Той самий результат можна було б записати як <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Форма з потоком розкривається тоді, коли етапів кілька, — це показує наступна тема.<\/span><\/p>"]]},"bg":{"t":"Операторът за поток","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторът за поток <code>==&gt;<\/code> изпраща списък отляво към операцията отдясно.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът после тече нататък, накъдето сочи следващият <code>==&gt;<\/code>, и завършва в променлива, която го събира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прочетете го отляво надясно: вземи <code>1..10<\/code>, запази четните числа и съхрани резултата в <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>%%<\/code> означава „дели се на“, така че <code>* %% 2<\/code> запазва четните числа.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важното правило е, че потокът трябва да <strong>завършва с цел<\/strong> — обикновено <code>my @array<\/code> (или съществуваща променлива).<\/span> <span class=\"sg\" data-s=\"1\">Данните текат напред в нея.<\/span> <span class=\"sg\" data-s=\"2\">Записването на присвояването наобратно, с <code>=<\/code>, не прави каквото искате, защото потокът и присвояването се борят помежду си; винаги оставяйте потока да завърши в своята променлива.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потокът е просто друг начин да се запише верига от операции върху списък.<\/span> <span class=\"sg\" data-s=\"1\">Същият резултат може да се запише и като <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Формата с поток се разгръща, когато етапите са няколко — това показва следващата тема.<\/span><\/p>"]]},"eo":{"t":"La flua operatoro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La flua operatoro <code>==&gt;<\/code> sendas liston de maldekstre en la operacion dekstre.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto poste fluas plu al tie, kien montras la sekva <code>==&gt;<\/code>, finiĝante en variablo, kiu kolektas ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Legu ĝin de maldekstre dekstren: prenu <code>1..10<\/code>, konservu la parajn nombrojn kaj konservu la rezulton en <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro <code>%%<\/code> signifas «estas dividebla per», do <code>* %% 2<\/code> konservas la parajn nombrojn.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La grava regulo estas, ke fluo devas <strong>finiĝi en celo<\/strong> — kutime <code>my @array<\/code> (aŭ jam ekzistanta variablo).<\/span> <span class=\"sg\" data-s=\"1\">La datumoj fluas antaŭen en ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Skribi la atribuon inverse, per <code>=<\/code>, ne faras tion, kion vi volas, ĉar la fluo kaj la atribuo konkurencas; ĉiam lasu la fluon finiĝi en sian variablon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fluo estas nur alia maniero skribi ĉenon da listaj operacioj.<\/span> <span class=\"sg\" data-s=\"1\">La saman rezulton oni povus skribi kiel <code>my @evens = (1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La flua formo montras sian valoron, kiam estas pluraj etapoj, kiel montras la sekva temo.<\/span><\/p>"]]},"la":{"t":"Operator fluxus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator fluxus <code>==&gt;<\/code> indicem a sinistra in operationem a dextra mittit.<\/span> <span class=\"sg\" data-s=\"1\">Effectus deinde eo fluit quo <code>==&gt;<\/code> sequens spectat, in variabili desinens quae illum colligit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens;\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lege a sinistra ad dextram: cape <code>1..10<\/code>, serva numeros pares, et effectum in <code>@evens<\/code> repone.<\/span> <span class=\"sg\" data-s=\"1\">Operator <code>%%<\/code> significat «dividitur per», itaque <code>* %% 2<\/code> numeros pares servat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Regula gravis est fluxum <strong>in scopo desinere<\/strong> debere — plerumque <code>my @array<\/code> (vel variabilis exsistens).<\/span> <span class=\"sg\" data-s=\"1\">Data in illam prorsum fluunt.<\/span> <span class=\"sg\" data-s=\"2\">Assignationem altero modo, per <code>=<\/code>, scribere non agit quod vis, quia fluxus et assignatio inter se certant; semper sine fluxum in variabilem suam finire.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fluxus est solum alius modus catenam operationum indicis scribendi.<\/span> <span class=\"sg\" data-s=\"1\">Idem effectus ut <code>my @evens = (1..10).grep(* %% 2)<\/code> scribi posset.<\/span> <span class=\"sg\" data-s=\"2\">Forma fluxus vim suam ostendit cum plures gradus sunt, ut argumentum sequens ostendit.<\/span><\/p>"]]}}}</script>
