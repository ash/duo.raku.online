<script type="application/json" id="page-data">{"u":"paradigms/feeds","n":1219,"k":"section","pv":"paradigms/reduction/exercises/comma-separated/solution","nx":"paradigms/feeds/feed-operator","tr":["paradigms"],"L":{"en":{"t":"Data feeds","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>feed<\/em> lets you write a chain of list operations in the order they happen, like a pipeline.<\/span> <span class=\"sg\" data-s=\"1\">Instead of nesting <code>map<\/code> inside <code>grep<\/code> inside <code>sort<\/code>, you send data from one stage to the next with the feed operator <code>==&gt;<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Feeds read naturally from left to right and make multi-step transformations easy to follow.<\/span> <span class=\"sg\" data-s=\"1\">This section shows the feed operator and how to chain several stages together.<\/span><\/p>"]]},"de":{"t":"Datenströme","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Feed<\/em> erlaubt es Ihnen, eine Kette von Listenoperationen in der Reihenfolge zu schreiben, in der sie geschehen, wie eine Pipeline.<\/span> <span class=\"sg\" data-s=\"1\">Statt <code>map<\/code> in <code>grep<\/code> in <code>sort<\/code> zu verschachteln, schicken Sie Daten mit dem Feed-Operator <code>==&gt;<\/code> von einer Stufe zur nächsten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Feeds lesen sich von Natur aus von links nach rechts und machen mehrstufige Umformungen leicht nachvollziehbar.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt den Feed-Operator und wie man mehrere Stufen aneinanderreiht.<\/span><\/p>"]]},"nl":{"t":"Gegevensstromen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Met een <em>feed<\/em> kun je een keten lijstbewerkingen schrijven in de volgorde waarin ze gebeuren, als een pijplijn.<\/span> <span class=\"sg\" data-s=\"1\">In plaats van <code>map<\/code> in <code>grep<\/code> in <code>sort<\/code> te nestelen, stuur je gegevens met de feed-operator <code>==&gt;<\/code> van de ene fase naar de volgende.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Feeds lezen van nature van links naar rechts en maken transformaties met meerdere stappen goed te volgen.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie toont de feed-operator en hoe je meerdere fasen aan elkaar rijgt.<\/span><\/p>"]]},"es":{"t":"Flujos de datos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>flujo<\/em> te permite escribir una cadena de operaciones sobre listas en el orden en que ocurren, como una tubería.<\/span> <span class=\"sg\" data-s=\"1\">En lugar de anidar <code>map<\/code> dentro de <code>grep<\/code> dentro de <code>sort<\/code>, envías los datos de una etapa a la siguiente con el operador de flujo <code>==&gt;<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los flujos se leen con naturalidad de izquierda a derecha y hacen fáciles de seguir las transformaciones de varios pasos.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección presenta el operador de flujo y cómo encadenar varias etapas.<\/span><\/p>"]]},"it":{"t":"Feed di dati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>flusso<\/em> ti permette di scrivere una catena di operazioni su elenchi nell'ordine in cui avvengono, come una pipeline.<\/span> <span class=\"sg\" data-s=\"1\">Invece di annidare <code>map<\/code> dentro <code>grep<\/code> dentro <code>sort<\/code>, mandi i dati da uno stadio al successivo con l'operatore di flusso <code>==&gt;<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I flussi si leggono naturalmente da sinistra a destra e rendono facili da seguire le trasformazioni a più passi.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra l'operatore di flusso e come concatenare più stadi.<\/span><\/p>"]]},"ru":{"t":"Конвейеры данных","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Конвейер<\/em> позволяет записать цепочку операций над списком в том порядке, в каком они происходят.<\/span> <span class=\"sg\" data-s=\"1\">Вместо того чтобы вкладывать <code>map<\/code> внутрь <code>grep<\/code> внутрь <code>sort<\/code>, вы передаёте данные с одной ступени на другую оператором конвейера <code>==&gt;<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Конвейеры естественно читаются слева направо и делают многошаговые преобразования лёгкими для восприятия.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе показан оператор конвейера и то, как соединять несколько ступеней.<\/span><\/p>"]]},"uk":{"t":"Потоки даних","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Потік<\/em> дозволяє записати ланцюжок операцій над списком у тому порядку, у якому вони відбуваються, — як конвеєр.<\/span> <span class=\"sg\" data-s=\"1\">Замість вкладати <code>map<\/code> усередину <code>grep<\/code> усередину <code>sort<\/code>, ви надсилаєте дані від одного етапу до наступного оператором потоку <code>==&gt;<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Потоки природно читаються зліва направо й роблять багатокрокові перетворення легкими для стеження.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує оператор потоку та те, як зчепити кілька етапів разом.<\/span><\/p>"]]},"bg":{"t":"Потоци от данни","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Потокът<\/em> позволява да напишете верига от операции върху списък в реда, в който те се случват, като конвейер.<\/span> <span class=\"sg\" data-s=\"1\">Вместо да влагате <code>map<\/code> вътре в <code>grep<\/code> вътре в <code>sort<\/code>, вие пращате данните от един етап към следващия с оператора за поток <code>==&gt;<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Потоците се четат естествено отляво надясно и правят многостъпковите преобразувания лесни за проследяване.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва оператора за поток и как да свържете няколко етапа.<\/span><\/p>"]]}}}</script>
