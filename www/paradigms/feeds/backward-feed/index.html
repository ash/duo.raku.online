<script type="application/json" id="page-data">{"u":"paradigms/feeds/backward-feed","n":1224,"k":"topic","pv":"paradigms/feeds/chaining-feeds/quiz","nx":"paradigms/feeds/backward-feed/quiz","tr":["paradigms","paradigms/feeds"],"L":{"en":{"t":"The backward feed","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Every feed so far has flowed forward with <code>==&gt;<\/code>, from a source on the left into a target on the right.<\/span> <span class=\"sg\" data-s=\"1\">Raku also has the mirror operator, <code>&lt;==<\/code>, the <strong>backward feed<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">It runs the other way round: the target sits on the <strong>left<\/strong>, and the data is pulled in from the source on the <strong>right<\/strong>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the even-numbers pipeline from before, written backward:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Read it right to left: take <code>1..10<\/code>, keep the even numbers, and collect them into <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The result is exactly the same as <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code> — only the direction in which you write the stages has changed.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Backward feeds chain in the same way, and again the target leads:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The work still happens source-first — start with <code>1..10<\/code>, keep the evens, square them — but on the page the stages are listed from the destination back towards the origin.<\/span> <span class=\"sg\" data-s=\"1\">The order of the elements is untouched; <code>&lt;==<\/code> changes only the reading direction, never the data.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Because code usually reads left to right, the forward <code>==&gt;<\/code> tends to read more naturally: you meet the data first and follow it to where it lands.<\/span> <span class=\"sg\" data-s=\"1\">The backward <code>&lt;==<\/code> is there for the occasions when leading with the destination tells the story better — naming <em>what you are building<\/em> before <em>what it is built from<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The two are exact mirrors, so choose whichever direction reads best.<\/span><\/p>"]]},"de":{"t":"Der rückwärtige Feed","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jeder Feed bisher floss mit <code>==&gt;<\/code> vorwärts, von einer Quelle links in ein Ziel rechts.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat auch den gespiegelten Operator, <code>&lt;==<\/code>, den <strong>rückwärtigen Feed<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Er läuft andersherum: Das Ziel steht <strong>links<\/strong>, und die Daten werden von der Quelle <strong>rechts<\/strong> hereingezogen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist die Pipeline mit den geraden Zahlen von zuvor, rückwärts geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie es von rechts nach links: nimm <code>1..10<\/code>, behalte die geraden Zahlen und sammle sie in <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis ist genau dasselbe wie bei <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code> — nur die Richtung, in der Sie die Stufen schreiben, hat sich geändert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rückwärtige Feeds reihen sich genauso aneinander, und wieder steht das Ziel voran:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Arbeit geschieht weiterhin quellenzuerst — beginne mit <code>1..10<\/code>, behalte die geraden, quadriere sie —, doch auf dem Papier sind die Stufen vom Ziel zurück zum Ursprung aufgeführt.<\/span> <span class=\"sg\" data-s=\"1\">Die Reihenfolge der Elemente bleibt unberührt; <code>&lt;==<\/code> ändert nur die Leserichtung, niemals die Daten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Da Code gewöhnlich von links nach rechts gelesen wird, liest sich das vorwärtige <code>==&gt;<\/code> meist natürlicher: Sie begegnen zuerst den Daten und folgen ihnen dorthin, wo sie landen.<\/span> <span class=\"sg\" data-s=\"1\">Das rückwärtige <code>&lt;==<\/code> gibt es für die Gelegenheiten, bei denen das Ziel voranzustellen die Geschichte besser erzählt — erst benennen, <em>was Sie bauen<\/em>, dann <em>woraus es gebaut ist<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Die beiden sind genaue Spiegelbilder, wählen Sie also die Richtung, die sich am besten liest.<\/span><\/p>"]]},"nl":{"t":"De achterwaartse feed","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke feed tot nu toe stroomde voorwaarts met <code>==&gt;<\/code>, van een bron links naar een doel rechts.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft ook de gespiegelde operator, <code>&lt;==<\/code>, de <strong>achterwaartse feed<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Die loopt andersom: het doel staat <strong>links<\/strong>, en de gegevens worden van de bron <strong>rechts<\/strong> binnengetrokken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is de pijplijn met even getallen van eerder, achterstevoren geschreven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lees hem van rechts naar links: neem <code>1..10<\/code>, houd de even getallen, en verzamel ze in <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is precies hetzelfde als <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code> — alleen de richting waarin je de fasen schrijft is veranderd.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Achterwaartse feeds rijgen zich op dezelfde manier aaneen, en opnieuw gaat het doel voorop:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het werk gebeurt nog steeds bron-eerst — begin met <code>1..10<\/code>, houd de even getallen, kwadrateer ze — maar op papier staan de fasen opgesomd van de bestemming terug naar de oorsprong.<\/span> <span class=\"sg\" data-s=\"1\">De volgorde van de elementen blijft ongemoeid; <code>&lt;==<\/code> verandert alleen de leesrichting, nooit de gegevens.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omdat code doorgaans van links naar rechts leest, leest de voorwaartse <code>==&gt;<\/code> meestal natuurlijker: je komt de gegevens eerst tegen en volgt ze naar waar ze belanden.<\/span> <span class=\"sg\" data-s=\"1\">De achterwaartse <code>&lt;==<\/code> is er voor de gelegenheden waarbij met de bestemming beginnen het verhaal beter vertelt — eerst benoemen <em>wat je bouwt<\/em> en daarna <em>waaruit het gebouwd is<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De twee zijn exacte spiegelbeelden, dus kies de richting die het best leest.<\/span><\/p>"]]},"es":{"t":"El flujo hacia atrás","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Todos los flujos vistos hasta ahora fluían hacia delante con <code>==&gt;<\/code>, desde una fuente a la izquierda hacia un destino a la derecha.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene también el operador espejo, <code>&lt;==<\/code>, el <strong>flujo hacia atrás<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Va al revés: el destino está a la <strong>izquierda<\/strong> y los datos se traen desde la fuente de la <strong>derecha<\/strong>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes la tubería de números pares de antes, escrita hacia atrás:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Léela de derecha a izquierda: toma <code>1..10<\/code>, conserva los números pares y recógelos en <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es exactamente el mismo que el de <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code>: solo ha cambiado la dirección en la que escribes las etapas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los flujos hacia atrás se encadenan igual, y de nuevo el destino va primero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El trabajo sigue ocurriendo desde la fuente — empieza con <code>1..10<\/code>, conserva los pares, elévalos al cuadrado —, pero en la página las etapas se enumeran desde el destino hacia el origen.<\/span> <span class=\"sg\" data-s=\"1\">El orden de los elementos queda intacto; <code>&lt;==<\/code> cambia solo la dirección de lectura, nunca los datos.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Como el código suele leerse de izquierda a derecha, el <code>==&gt;<\/code> hacia delante tiende a leerse con más naturalidad: primero te encuentras los datos y los sigues hasta donde aterrizan.<\/span> <span class=\"sg\" data-s=\"1\">El <code>&lt;==<\/code> hacia atrás está ahí para las ocasiones en que empezar por el destino cuenta mejor la historia, nombrando <em>lo que estás construyendo<\/em> antes que <em>aquello con lo que se construye<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Son espejos exactos, así que elige la dirección que mejor se lea.<\/span><\/p>"]]},"it":{"t":"Il feed all'indietro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni flusso visto finora scorreva in avanti con <code>==&gt;<\/code>, da una sorgente a sinistra dentro un bersaglio a destra.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha anche l'operatore speculare, <code>&lt;==<\/code>, il <strong>flusso all'indietro<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Va nel verso opposto: il bersaglio sta a <strong>sinistra<\/strong> e i dati vengono tirati dalla sorgente a <strong>destra<\/strong>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco la pipeline dei numeri pari di prima, scritta all'indietro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Leggila da destra a sinistra: prendi <code>1..10<\/code>, conserva i numeri pari e raccoglili in <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è esattamente lo stesso di <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code> — è cambiata solo la direzione in cui scrivi gli stadi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I flussi all'indietro si concatenano allo stesso modo, e di nuovo è il bersaglio a guidare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il lavoro avviene comunque partendo dalla sorgente — parti da <code>1..10<\/code>, conserva i pari, elevali al quadrato — ma sulla pagina gli stadi sono elencati dalla destinazione a ritroso verso l'origine.<\/span> <span class=\"sg\" data-s=\"1\">L'ordine degli elementi non viene toccato; <code>&lt;==<\/code> cambia solo la direzione di lettura, mai i dati.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Poiché il codice di solito si legge da sinistra a destra, il <code>==&gt;<\/code> in avanti tende a leggersi più naturalmente: incontri prima i dati e li segui fin dove atterrano.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>&lt;==<\/code> all'indietro è lì per le occasioni in cui guidare con la destinazione racconta meglio la storia — nominare <em>ciò che stai costruendo<\/em> prima di <em>ciò da cui è costruito<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">I due sono specchi esatti, quindi scegli la direzione che si legge meglio.<\/span><\/p>"]]},"ru":{"t":"Обратный конвейер","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Все конвейеры до сих пор текли вперёд, через <code>==&gt;<\/code>, от источника слева к приёмнику справа.<\/span> <span class=\"sg\" data-s=\"1\">В Raku есть и зеркальный оператор <code>&lt;==<\/code> — <strong>обратный конвейер<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Он работает в другую сторону: приёмник стоит <strong>слева<\/strong>, а данные притягиваются из источника <strong>справа<\/strong>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот прежний конвейер с чётными числами, записанный в обратную сторону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Читайте справа налево: возьми <code>1..10<\/code>, оставь чётные числа и собери их в <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат в точности тот же, что и у <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code>, — изменилось лишь направление, в котором вы записываете ступени.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратные конвейеры соединяются в цепочки так же, и приёмник снова идёт первым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Работа по-прежнему начинается с источника — берём <code>1..10<\/code>, оставляем чётные, возводим в квадрат, — но на странице ступени перечислены от назначения назад к истоку.<\/span> <span class=\"sg\" data-s=\"1\">Порядок элементов не меняется: <code>&lt;==<\/code> меняет только направление чтения, но никогда сами данные.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поскольку код обычно читают слева направо, прямой <code>==&gt;<\/code> чаще читается естественнее: вы сначала встречаете данные и следуете за ними туда, где они оседают.<\/span> <span class=\"sg\" data-s=\"1\">Обратный <code>&lt;==<\/code> существует для тех случаев, когда историю лучше рассказывать с назначения — назвав <em>то, что вы строите<\/em>, прежде <em>того, из чего оно строится<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Это точные зеркала друг друга, поэтому выбирайте направление, которое читается лучше.<\/span><\/p>"]]},"uk":{"t":"Зворотний потік","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен потік досі плинув уперед за допомогою <code>==&gt;<\/code>, від джерела ліворуч до цілі праворуч.<\/span> <span class=\"sg\" data-s=\"1\">У Raku є й дзеркальний оператор <code>&lt;==<\/code> — <strong>зворотний потік<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Він працює в інший бік: ціль стоїть <strong>ліворуч<\/strong>, а дані тягнуться з джерела <strong>праворуч<\/strong>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось конвеєр парних чисел із попереднього прикладу, записаний навпаки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Читайте справа наліво: візьми <code>1..10<\/code>, залиш парні числа й збери їх у <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат точно такий самий, як у <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code>, — змінився лише напрямок, у якому ви записуєте етапи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зворотні потоки зчіплюються так само, і знову веде ціль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Робота, як і раніше, відбувається від джерела — почни з <code>1..10<\/code>, залиш парні, піднеси їх до квадрата, — але на сторінці етапи перелічено від призначення назад до початку.<\/span> <span class=\"sg\" data-s=\"1\">Порядок елементів залишається недоторканим; <code>&lt;==<\/code> змінює лише напрямок читання, а не дані.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оскільки код зазвичай читають зліва направо, прямий <code>==&gt;<\/code> частіше читається природніше: ви спершу зустрічаєте дані й простежуєте, куди вони потрапляють.<\/span> <span class=\"sg\" data-s=\"1\">Зворотний <code>&lt;==<\/code> існує для тих випадків, коли розповідь виходить кращою, якщо почати з призначення, — назвати <em>те, що ви будуєте<\/em>, перед <em>тим, з чого воно будується<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Обидва є точними дзеркалами, тож обирайте той напрямок, який читається краще.<\/span><\/p>"]]},"bg":{"t":"Обратният поток","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки поток досега течеше напред с <code>==&gt;<\/code>, от източник отляво към цел отдясно.<\/span> <span class=\"sg\" data-s=\"1\">Raku има и огледалния оператор <code>&lt;==<\/code> — <strong>обратния поток<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Той работи в другата посока: целта стои <strong>отляво<\/strong>, а данните се теглят от източника <strong>отдясно<\/strong>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето конвейера с четните числа отпреди, записан наобратно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens &lt;== grep(* %% 2) &lt;== (1..10);\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прочетете го отдясно наляво: вземи <code>1..10<\/code>, запази четните числа и ги събери в <code>@evens<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е точно същият като при <code>(1..10) ==&gt; grep(* %% 2) ==&gt; my @evens<\/code> — променила се е само посоката, в която записвате етапите.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратните потоци се свързват по същия начин и отново води целта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result &lt;== map(* ** 2) &lt;== grep(* %% 2) &lt;== (1..10);\nsay @result; # [4 16 36 64 100]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Работата пак се извършва от източника нататък — започни с <code>1..10<\/code>, запази четните, повдигни ги на квадрат, — но на страницата етапите са изброени от местоназначението назад към началото.<\/span> <span class=\"sg\" data-s=\"1\">Редът на елементите остава непокътнат; <code>&lt;==<\/code> променя само посоката на четене, а не данните.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понеже кодът обикновено се чете отляво надясно, правият <code>==&gt;<\/code> често се чете по-естествено: първо срещате данните и ги проследявате докъде стигат.<\/span> <span class=\"sg\" data-s=\"1\">Обратният <code>&lt;==<\/code> е налице за случаите, когато разказът излиза по-добър, ако започнете с местоназначението — да назовете <em>онова, което строите<\/em>, преди <em>онова, от което го строите<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Двата са точни огледала, така че изберете посоката, която се чете по-добре.<\/span><\/p>"]]}}}</script>
