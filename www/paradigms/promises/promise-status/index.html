<script type="application/json" id="page-data">{"u":"paradigms/promises/promise-status","n":1292,"k":"topic","pv":"paradigms/promises/making-a-promise","nx":"paradigms/promises/vows","tr":["paradigms","paradigms/promises"],"L":{"en":{"t":"The status of a promise","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">A promise is always in one of three states, reported by its <code>.status<\/code> method:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — not settled yet;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — it finished with a value;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — its work threw an exception.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">These are the values of the <code>PromiseStatus<\/code> enumeration.<\/span> <span class=\"sg\" data-s=\"1\">Reading <code>.status<\/code> does not wait — it tells you where the promise is <em>right now<\/em>, so you can check it before the promise has settled and again afterwards:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — read at once, while the block is still running\nawait $p;      # now wait for it to finish\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> gives the kept value.<\/span> <span class=\"sg\" data-s=\"1\">Unlike <code>.status<\/code>, it <em>waits<\/em> until the promise is settled, so on an unfinished promise it blocks exactly like <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">And if the promise was broken, <code>.result<\/code> re-throws the exception.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you want to look at a failure without re-throwing it, use <code>.cause<\/code> — the exception object of a broken promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # let it settle (and swallow the re-thrown error)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So <code>.status<\/code> and <code>.cause<\/code> inspect a promise without disturbing it, while <code>await<\/code> and <code>.result<\/code> collect its outcome — the value, or the error re-thrown.<\/span><\/p>"]]},"de":{"t":"Der Status eines Promise","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Promise befindet sich stets in einem von drei Zuständen, gemeldet von seiner Methode <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — noch nicht erledigt;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — es endete mit einem Wert;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — seine Arbeit warf eine Ausnahme.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das sind die Werte der Aufzählung <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>.status<\/code> zu lesen wartet nicht — es sagt Ihnen, wo das Promise <em>gerade jetzt<\/em> steht, Sie können es also prüfen, bevor das Promise erledigt ist, und danach erneut:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — read at once, while the block is still running\nawait $p;      # now wait for it to finish\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> liefert den erfüllten Wert.<\/span> <span class=\"sg\" data-s=\"1\">Anders als <code>.status<\/code> <em>wartet<\/em> es, bis das Promise erledigt ist, bei einem unfertigen Promise blockiert es also genau wie <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Und wurde das Promise gebrochen, wirft <code>.result<\/code> die Ausnahme erneut.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie einen Fehlschlag ansehen möchten, ohne ihn erneut zu werfen, nehmen Sie <code>.cause<\/code> — das Ausnahmeobjekt eines gebrochenen Promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # let it settle (and swallow the re-thrown error)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.status<\/code> und <code>.cause<\/code> untersuchen ein Promise also, ohne es zu stören, während <code>await<\/code> und <code>.result<\/code> seinen Ausgang abholen — den Wert oder den erneut geworfenen Fehler.<\/span><\/p>"]]},"nl":{"t":"De status van een promise","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Een promise verkeert altijd in een van drie toestanden, gemeld door haar methode <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — nog niet afgehandeld;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — ze eindigde met een waarde;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — haar werk wierp een exceptie.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dat zijn de waarden van de opsomming <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>.status<\/code> lezen wacht niet — het vertelt je waar de promise zich <em>op dit moment<\/em> bevindt, zodat je hem kunt controleren voordat de promise afgehandeld is en opnieuw daarna:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — read at once, while the block is still running\nawait $p;      # now wait for it to finish\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> geeft de vervulde waarde.<\/span> <span class=\"sg\" data-s=\"1\">Anders dan <code>.status<\/code> <em>wacht<\/em> het tot de promise afgehandeld is, dus op een onvoltooide promise blokkeert het precies als <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En als de promise verbroken is, werpt <code>.result<\/code> de exceptie opnieuw.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je naar een mislukking wilt kijken zonder haar opnieuw te werpen, gebruik je <code>.cause<\/code> — het exceptieobject van een verbroken promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # let it settle (and swallow the re-thrown error)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.status<\/code> en <code>.cause<\/code> inspecteren een promise dus zonder haar te verstoren, terwijl <code>await<\/code> en <code>.result<\/code> haar uitkomst ophalen — de waarde, of de opnieuw geworpen fout.<\/span><\/p>"]]},"es":{"t":"El estado de una promesa 🆕","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Una promesa está siempre en uno de tres estados, que informa su método <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — todavía sin resolver;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — terminó con un valor;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — su trabajo lanzó una excepción.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estos son los valores de la enumeración <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Leer <code>.status<\/code> no espera: te dice dónde está la promesa <em>ahora mismo<\/em>, así que puedes comprobarlo antes de que la promesa se resuelva y de nuevo después:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — read at once, while the block is still running\nawait $p;      # now wait for it to finish\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> da el valor cumplido.<\/span> <span class=\"sg\" data-s=\"1\">A diferencia de <code>.status<\/code>, sí <em>espera<\/em> hasta que la promesa esté resuelta, de modo que sobre una promesa sin terminar se bloquea exactamente igual que <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Y si la promesa quedó rota, <code>.result<\/code> relanza la excepción.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando quieres examinar un fallo sin relanzarlo, usa <code>.cause<\/code>, el objeto de excepción de una promesa rota:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # let it settle (and swallow the re-thrown error)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así que <code>.status<\/code> y <code>.cause<\/code> inspeccionan una promesa sin perturbarla, mientras que <code>await<\/code> y <code>.result<\/code> recogen su desenlace: el valor, o el error relanzado.<\/span><\/p>"]]},"it":{"t":"Lo stato di una promise 🆕","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Una promise è sempre in uno di tre stati, riferiti dal suo metodo <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — non ancora conclusa;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — è finita con un valore;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — il suo lavoro ha sollevato un'eccezione.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questi sono i valori dell'enumerazione <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Leggere <code>.status<\/code> non aspetta: ti dice dove si trova la promise <em>proprio ora<\/em>, quindi puoi controllarla prima che si concluda e di nuovo dopo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — read at once, while the block is still running\nawait $p;      # now wait for it to finish\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> dà il valore mantenuto.<\/span> <span class=\"sg\" data-s=\"1\">A differenza di <code>.status<\/code>, <em>aspetta<\/em> finché la promise non si è conclusa, quindi su una promise non finita blocca esattamente come <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">E se la promise è stata rotta, <code>.result<\/code> rilancia l'eccezione.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando vuoi guardare un fallimento senza rilanciarlo, usa <code>.cause<\/code> — l'oggetto eccezione di una promise rotta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # let it settle (and swallow the re-thrown error)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>.status<\/code> e <code>.cause<\/code> ispezionano una promise senza disturbarla, mentre <code>await<\/code> e <code>.result<\/code> ne raccolgono l'esito: il valore, oppure l'errore rilanciato.<\/span><\/p>"]]},"ru":{"t":"Статус промиса","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Промис всегда находится в одном из трёх состояний, о которых сообщает его метод <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — ещё не улажен;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — завершился со значением;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — его работа бросила исключение.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это значения перечисления <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чтение <code>.status<\/code> не ждёт — оно сообщает, где промис находится <em>прямо сейчас<\/em>, поэтому проверить его можно и до того, как промис уладился, и после:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — читаем сразу, пока блок ещё работает\nawait $p;      # теперь дожидаемся завершения\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> даёт исполненное значение.<\/span> <span class=\"sg\" data-s=\"1\">В отличие от <code>.status<\/code>, он <em>ждёт<\/em>, пока промис не уладится, поэтому на незавершённом промисе блокирует выполнение точно как <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А если промис был сломан, <code>.result<\/code> заново бросает исключение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда хочется взглянуть на неудачу, не бросая её заново, используйте <code>.cause<\/code> — объект исключения сломанного промиса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # даём ему уладиться (и проглатываем заново брошенную ошибку)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>.status<\/code> и <code>.cause<\/code> исследуют промис, не тревожа его, а <code>await<\/code> и <code>.result<\/code> забирают его исход — значение или заново брошенную ошибку.<\/span><\/p>"]]},"uk":{"t":"Стан обіцянки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Обіцянка завжди перебуває в одному з трьох станів, про які повідомляє її метод <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — ще не владнано;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — завершилася зі значенням;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — її робота кинула виняток.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це значення переліку <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Читання <code>.status<\/code> не чекає — воно каже вам, де обіцянка перебуває <em>просто зараз<\/em>, тож ви можете перевірити її і до того, як вона владналася, і після:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — прочитано одразу, поки блок ще працює\nawait $p;      # тепер дочекаємося завершення\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> дає збережене значення.<\/span> <span class=\"sg\" data-s=\"1\">На відміну від <code>.status<\/code>, воно <em>чекає<\/em>, аж поки обіцянку не буде владнано, тож на незавершеній обіцянці воно блокує виконання точно як <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А якщо обіцянку зламано, <code>.result<\/code> повторно кидає виняток.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли ви хочете подивитися на невдачу, не кидаючи її повторно, скористайтеся <code>.cause<\/code> — об'єктом винятку зламаної обіцянки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # даємо їй владнатися (і ковтаємо повторно кинуту помилку)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отже, <code>.status<\/code> та <code>.cause<\/code> оглядають обіцянку, не турбуючи її, тоді як <code>await<\/code> і <code>.result<\/code> забирають її підсумок — значення або повторно кинуту помилку.<\/span><\/p>"]]},"bg":{"t":"Състоянието на обещанието","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Обещанието винаги е в едно от три състояния, съобщавани от метода му <code>.status<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>Planned<\/code>** — още не е уредено;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>Kept<\/code>** — приключило е със стойност;<\/span><\/li><li><span class=\"sg\" data-s=\"2\">**<code>Broken<\/code>** — работата му е хвърлила изключение.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това са стойностите на изброения тип <code>PromiseStatus<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Четенето на <code>.status<\/code> не чака — то ви казва къде е обещанието <em>точно сега<\/em>, така че можете да го проверите и преди то да се уреди, и после:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { sleep 1; 10 };\n\nsay $p.status; # Planned — прочетено веднага, докато блокът още работи\nawait $p;      # сега изчакваме да приключи\nsay $p.status; # Kept\nsay $p.result; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.result<\/code> дава запазената стойност.<\/span> <span class=\"sg\" data-s=\"1\">За разлика от <code>.status<\/code>, той <em>чака<\/em>, докато обещанието се уреди, така че върху неприключило обещание блокира точно като <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А ако обещанието е било счупено, <code>.result<\/code> хвърля изключението отново.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато искате да погледнете провала, без да го хвърляте отново, използвайте <code>.cause<\/code> — обекта на изключението на счупеното обещание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { die 'boom' };\ntry await $p;         # оставяме го да се уреди (и поглъщаме повторно хвърлената грешка)\nsay $p.status;        # Broken\nsay $p.cause.message; # boom<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така <code>.status<\/code> и <code>.cause<\/code> разглеждат обещанието, без да го безпокоят, докато <code>await<\/code> и <code>.result<\/code> събират изхода му — стойността или повторно хвърлената грешка.<\/span><\/p>"]]}}}</script>
