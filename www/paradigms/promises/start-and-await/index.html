<script type="application/json" id="page-data">{"u":"paradigms/promises/start-and-await","n":1287,"k":"topic","pv":"paradigms/promises","nx":"paradigms/promises/start-and-await/quiz","tr":["paradigms","paradigms/promises"],"L":{"en":{"t":"start and await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>start<\/code> keyword runs a block in the background and immediately returns a <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The work happens on Raku’s thread pool while your program carries on.<\/span> <span class=\"sg\" data-s=\"1\">To get the result, use <code>await<\/code>, which waits for the promise to finish and gives you its value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> blocks just long enough for the promise to complete, then returns whatever the block produced — here, <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">If the work is already done by the time you await, you get the result at once.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This pair — <code>start<\/code> to launch, <code>await<\/code> to collect — is the core of promise-based concurrency.<\/span> <span class=\"sg\" data-s=\"1\">You can launch several pieces of work, let them run at the same time, and await their results when you are ready, which is exactly what the next topic builds on.<\/span><\/p>"]]},"de":{"t":"start und await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Schlüsselwort <code>start<\/code> führt einen Block im Hintergrund aus und liefert sofort ein <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Arbeit geschieht auf Rakus Threadpool, während Ihr Programm weiterläuft.<\/span> <span class=\"sg\" data-s=\"1\">Um das Ergebnis zu bekommen, nehmen Sie <code>await<\/code>, das auf das Ende des Promise wartet und Ihnen seinen Wert gibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> blockiert genau so lange, wie das Promise braucht, und liefert dann, was der Block erzeugt hat — hier <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ist die Arbeit schon fertig, wenn Sie abwarten, bekommen Sie das Ergebnis sofort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieses Paar — <code>start<\/code> zum Starten, <code>await<\/code> zum Abholen — ist der Kern der auf Promises gestützten Nebenläufigkeit.<\/span> <span class=\"sg\" data-s=\"1\">Sie können mehrere Stücke Arbeit starten, sie zugleich laufen lassen und ihre Ergebnisse abwarten, wenn Sie so weit sind, und genau darauf baut das nächste Thema auf.<\/span><\/p>"]]},"nl":{"t":"start en await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Het sleutelwoord <code>start<\/code> draait een blok op de achtergrond en geeft meteen een <code>Promise<\/code> terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het werk gebeurt op Raku's threadpool terwijl je programma doorloopt.<\/span> <span class=\"sg\" data-s=\"1\">Om het resultaat te krijgen gebruik je <code>await<\/code>, dat wacht tot de promise klaar is en je haar waarde geeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> blokkeert precies lang genoeg voor de voltooiing van de promise en geeft daarna terug wat het blok opleverde — hier <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Als het werk al klaar is tegen de tijd dat je afwacht, krijg je het resultaat meteen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit paar — <code>start<\/code> om te starten, <code>await<\/code> om op te halen — vormt de kern van op promises gebaseerde concurrency.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt meerdere stukken werk starten, ze tegelijk laten lopen, en hun resultaten afwachten wanneer je er klaar voor bent, en precies daarop bouwt het volgende onderwerp voort.<\/span><\/p>"]]},"es":{"t":"start y await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La palabra clave <code>start<\/code> ejecuta un bloque en segundo plano y devuelve de inmediato una <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El trabajo ocurre en el pool de hilos de Raku mientras tu programa sigue adelante.<\/span> <span class=\"sg\" data-s=\"1\">Para obtener el resultado, usa <code>await<\/code>, que espera a que la promesa termine y te da su valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> se bloquea justo lo necesario para que la promesa se complete, y después devuelve lo que produjera el bloque: aquí, <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si el trabajo ya está hecho cuando esperas, obtienes el resultado enseguida.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta pareja — <code>start<\/code> para lanzar, <code>await<\/code> para recoger — es el núcleo de la concurrencia basada en promesas.<\/span> <span class=\"sg\" data-s=\"1\">Puedes lanzar varios trabajos, dejarlos correr al mismo tiempo y esperar sus resultados cuando estés listo, que es exactamente sobre lo que construye el apartado siguiente.<\/span><\/p>"]]},"it":{"t":"start e await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La parola chiave <code>start<\/code> esegue un blocco in secondo piano e restituisce subito una <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il lavoro avviene sul pool di thread di Raku mentre il tuo programma prosegue.<\/span> <span class=\"sg\" data-s=\"1\">Per ottenere il risultato usa <code>await<\/code>, che aspetta che la promise finisca e ti dà il suo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> blocca giusto il tempo che la promise si completi, poi restituisce ciò che il blocco ha prodotto — qui <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se il lavoro è già finito quando la attendi, ottieni il risultato all'istante.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa coppia — <code>start<\/code> per lanciare, <code>await<\/code> per raccogliere — è il cuore della concorrenza basata sulle promise.<\/span> <span class=\"sg\" data-s=\"1\">Puoi lanciare parecchi pezzi di lavoro, lasciarli girare nello stesso momento e attenderne i risultati quando sei pronto, che è esattamente ciò su cui costruisce l'argomento successivo.<\/span><\/p>"]]},"lv":{"t":"start un await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Atslēgvārds <code>start<\/code> izpilda bloku fonā un tūlīt atgriež <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Darbs notiek Raku pavedienu baseinā, kamēr jūsu programma turpina savu gaitu.<\/span> <span class=\"sg\" data-s=\"1\">Lai iegūtu rezultātu, izmantojiet <code>await<\/code>, kas nogaida solījuma beigas un pasniedz jums tā vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> bloķē tieši tik ilgi, cik vajag solījuma pabeigšanai, un tad atgriež to, ko bloks radījis, — šeit <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja darbs līdz gaidīšanas brīdim jau ir padarīts, rezultātu saņemsiet uzreiz.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis pāris — <code>start<\/code> palaišanai, <code>await<\/code> savākšanai — ir uz solījumiem balstītas konkurences kodols.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat palaist vairākus darba gabalus, ļaut tiem izpildīties vienlaikus un sagaidīt to rezultātus tad, kad esat gatavi; tieši uz to būvē nākamais temats.<\/span><\/p>"]]},"ru":{"t":"start и await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ключевое слово <code>start<\/code> выполняет блок в фоне и немедленно возвращает <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Работа идёт в пуле потоков Raku, пока ваша программа продолжает своё дело.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы получить результат, используйте <code>await<\/code>, который дожидается завершения промиса и отдаёт его значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> блокирует выполнение ровно настолько, чтобы промис успел завершиться, а затем возвращает то, что выдал блок, — здесь <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если работа к моменту ожидания уже сделана, результат приходит сразу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта пара — <code>start<\/code> для запуска, <code>await<\/code> для сбора — и есть основа конкурентности на промисах.<\/span> <span class=\"sg\" data-s=\"1\">Можно запустить несколько кусков работы, дать им идти одновременно и дождаться их результатов, когда будете готовы; именно на этом и строится следующая тема.<\/span><\/p>"]]},"uk":{"t":"start і await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ключове слово <code>start<\/code> виконує блок у фоні й негайно повертає <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Робота відбувається в пулі потоків Raku, поки ваша програма йде далі.<\/span> <span class=\"sg\" data-s=\"1\">Щоб отримати результат, скористайтеся <code>await<\/code>, який чекає завершення обіцянки й дає вам її значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> блокує виконання рівно настільки, щоб обіцянка встигла завершитися, а потім повертає те, що дав блок, — тут <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо на момент очікування роботу вже виконано, ви отримуєте результат одразу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця пара — <code>start<\/code> для запуску, <code>await<\/code> для збирання — є ядром конкурентності на обіцянках.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете запустити кілька шматків роботи, дати їм виконуватися водночас і дочекатися їхніх результатів, коли будете готові, — саме на цьому й будує наступна тема.<\/span><\/p>"]]},"bg":{"t":"start и await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ключовата дума <code>start<\/code> изпълнява блок във фонов режим и незабавно връща <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Работата се извършва в пула от нишки на Raku, докато програмата ви продължава.<\/span> <span class=\"sg\" data-s=\"1\">За да получите резултата, използвайте <code>await<\/code>, който изчаква обещанието да приключи и ви дава стойността му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> блокира точно толкова, колкото е нужно на обещанието да завърши, и после връща онова, което блокът е дал — тук <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако работата вече е свършена, когато изчаквате, получавате резултата веднага.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази двойка — <code>start<\/code> за пускане, <code>await<\/code> за събиране — е ядрото на паралелността с обещания.<\/span> <span class=\"sg\" data-s=\"1\">Можете да пуснете няколко парчета работа, да ги оставите да вървят едновременно и да изчакате резултатите им, когато сте готови — точно върху това надгражда следващата тема.<\/span><\/p>"]]},"eo":{"t":"start kaj await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La ŝlosilvorto <code>start<\/code> plenumas blokon fone kaj tuj redonas <code>Promise<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La laboro okazas en la fadenaro de Raku dum via programo daŭrigas.<\/span> <span class=\"sg\" data-s=\"1\">Por akiri la rezulton, uzu <code>await<\/code>, kiu atendas, ke la promeso finiĝu, kaj donas al vi ĝian valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> blokas ĝuste sufiĉe longe por ke la promeso kompletiĝu, poste redonas tion, kion la bloko produktis — ĉi tie, <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se la laboro jam estas farita en la momento, kiam vi atendas, vi ricevas la rezulton tuj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu paro — <code>start<\/code> por lanĉi, <code>await<\/code> por kolekti — estas la kerno de promes-bazita samtempeco.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas lanĉi plurajn pecojn da laboro, lasi ilin kuri samtempe kaj atendi iliajn rezultojn, kiam vi estas preta, kio estas ĝuste tio, sur kio konstruas la sekva temo.<\/span><\/p>"]]},"la":{"t":"start et await","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Clavis <code>start<\/code> blocum in fundo currit et statim <code>Promise<\/code> reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Opus in stagno filorum Raku fit dum programma tuum pergit.<\/span> <span class=\"sg\" data-s=\"1\">Ut effectum accipias, utere <code>await<\/code>, quod promissum finire exspectat valoremque eius tibi dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 2 + 2 };\nsay await $p; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>await<\/code> tam diu moratur quam promisso opus est ut perficiat, deinde reddit quidquid blocus produxit — hic, <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si opus iam perfectum est cum exspectas, effectum statim recipis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc par — <code>start<\/code> ad lanciandum, <code>await<\/code> ad colligendum — nucleus est simultaneitatis promissis fundatae.<\/span> <span class=\"sg\" data-s=\"1\">Plura opera lanciare potes, ea eodem tempore currere sinere, et effectus eorum exspectare cum paratus es, quod est exacte id super quo argumentum sequens aedificat.<\/span><\/p>"]]}}}</script>
