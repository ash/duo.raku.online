<script type="application/json" id="page-data">{"u":"paradigms/promises/then-and-combinators","n":1289,"k":"topic","pv":"paradigms/promises/start-and-await/quiz","nx":"paradigms/promises/then-and-combinators/quiz","tr":["paradigms","paradigms/promises"],"L":{"en":{"t":"Chaining and combining","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Promises become even more powerful when you combine them.<\/span> <span class=\"sg\" data-s=\"1\">The most common need is to wait for <strong>several<\/strong> at once.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> accepts a list of promises and returns their results in order:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The three jobs run concurrently; <code>await @jobs<\/code> waits for all of them and hands back <code>(1, 2, 3)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Because the results come back in the same order as the promises, you can reduce them as usual.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also chain work onto a promise with <code>.then<\/code>, which runs a follow-up block once the promise is done.<\/span> <span class=\"sg\" data-s=\"1\">Inside it, <code>.result<\/code> is the value of the original promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> is a new promise that doubles the result of <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Awaiting it gives <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The block has no explicit parameter, so it receives the finished promise as the topic variable <code>$_<\/code> — which is why a bare <code>.result<\/code> works: it is really <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">If you would rather give that promise a name, use a pointy block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This behaves exactly the same way; <code>$prev<\/code> is the original promise <code>$p<\/code>, and <code>$prev.result<\/code> is its value.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With <code>start<\/code>, <code>await<\/code>, and <code>.then<\/code>, you can describe whole pipelines of concurrent work: launch many tasks, combine their results, and build new tasks from old ones — all without touching a thread directly.<\/span><\/p>"]]},"de":{"t":"Aneinanderreihen und verbinden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Promises werden noch mächtiger, wenn Sie sie verbinden.<\/span> <span class=\"sg\" data-s=\"1\">Am häufigsten gebraucht wird das Warten auf <strong>mehrere<\/strong> zugleich.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> nimmt eine Liste von Promises auf und liefert ihre Ergebnisse in derselben Reihenfolge:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die drei Aufgaben laufen nebenläufig; <code>await @jobs<\/code> wartet auf alle und reicht <code>(1, 2, 3)<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Da die Ergebnisse in derselben Reihenfolge wie die Promises zurückkommen, können Sie sie wie gewohnt reduzieren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können mit <code>.then<\/code> auch Arbeit an ein Promise anhängen, was einen Folgeblock ausführt, sobald das Promise fertig ist.<\/span> <span class=\"sg\" data-s=\"1\">Darin ist <code>.result<\/code> der Wert des ursprünglichen Promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> ist ein neues Promise, das das Ergebnis von <code>$p<\/code> verdoppelt.<\/span> <span class=\"sg\" data-s=\"1\">Es abzuwarten ergibt <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Block hat keinen ausdrücklichen Parameter, er erhält das fertige Promise also als Themenvariable <code>$_<\/code> — weshalb ein blankes <code>.result<\/code> funktioniert: Es ist in Wahrheit <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Möchten Sie diesem Promise lieber einen Namen geben, nehmen Sie einen Pointy Block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das verhält sich genau gleich; <code>$prev<\/code> ist das ursprüngliche Promise <code>$p<\/code>, und <code>$prev.result<\/code> ist sein Wert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit <code>start<\/code>, <code>await<\/code> und <code>.then<\/code> können Sie ganze Pipelines nebenläufiger Arbeit beschreiben: viele Aufgaben starten, ihre Ergebnisse verbinden und aus alten neue Aufgaben bauen — und das alles, ohne je einen Thread unmittelbar anzufassen.<\/span><\/p>"]]},"nl":{"t":"Aaneenrijgen en combineren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Promises worden nog krachtiger wanneer je ze combineert.<\/span> <span class=\"sg\" data-s=\"1\">De gebruikelijkste behoefte is op <strong>meerdere<\/strong> tegelijk wachten.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> accepteert een lijst promises en geeft hun resultaten op volgorde terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De drie taken lopen gelijktijdig; <code>await @jobs<\/code> wacht op alle drie en geeft <code>(1, 2, 3)<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">Omdat de resultaten in dezelfde volgorde terugkomen als de promises, kun je ze zoals gewoonlijk reduceren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt met <code>.then<\/code> ook werk aan een promise rijgen, dat een vervolgblok draait zodra de promise klaar is.<\/span> <span class=\"sg\" data-s=\"1\">Binnen dat blok is <code>.result<\/code> de waarde van de oorspronkelijke promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> is een nieuwe promise die het resultaat van <code>$p<\/code> verdubbelt.<\/span> <span class=\"sg\" data-s=\"1\">Haar afwachten geeft <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het blok heeft geen expliciete parameter, dus het ontvangt de voltooide promise als de onderwerpsvariabele <code>$_<\/code> — en daarom werkt een kale <code>.result<\/code>: het is eigenlijk <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Als je die promise liever een naam geeft, gebruik dan een pointy block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit gedraagt zich precies hetzelfde; <code>$prev<\/code> is de oorspronkelijke promise <code>$p<\/code>, en <code>$prev.result<\/code> is haar waarde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met <code>start<\/code>, <code>await<\/code> en <code>.then<\/code> kun je hele pijplijnen van gelijktijdig werk beschrijven: veel taken starten, hun resultaten combineren, en nieuwe taken uit oude bouwen — allemaal zonder ooit een thread aan te raken.<\/span><\/p>"]]},"es":{"t":"Encadenar y combinar","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Las promesas se vuelven aún más potentes cuando las combinas.<\/span> <span class=\"sg\" data-s=\"1\">La necesidad más común es esperar <strong>varias<\/strong> a la vez.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> acepta una lista de promesas y devuelve sus resultados en orden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tres trabajos corren de forma concurrente; <code>await @jobs<\/code> los espera a todos y devuelve <code>(1, 2, 3)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Como los resultados vuelven en el mismo orden que las promesas, puedes reducirlos como de costumbre.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes encadenar trabajo a una promesa con <code>.then<\/code>, que ejecuta un bloque de seguimiento en cuanto la promesa está lista.<\/span> <span class=\"sg\" data-s=\"1\">Dentro de él, <code>.result<\/code> es el valor de la promesa original:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> es una promesa nueva que duplica el resultado de <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esperarla da <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque no tiene parámetro explícito, así que recibe la promesa terminada como la variable de tema <code>$_<\/code>, y por eso funciona un <code>.result<\/code> a secas: en realidad es <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si prefieres darle un nombre a esa promesa, usa un bloque con flecha:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto se comporta exactamente igual; <code>$prev<\/code> es la promesa original <code>$p<\/code>, y <code>$prev.result<\/code> es su valor.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con <code>start<\/code>, <code>await<\/code> y <code>.then<\/code> puedes describir tuberías enteras de trabajo concurrente: lanzar muchas tareas, combinar sus resultados y construir tareas nuevas a partir de las viejas, todo ello sin tocar un hilo directamente.<\/span><\/p>"]]},"it":{"t":"Concatenare e combinare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Le promise diventano ancora più potenti quando le combini.<\/span> <span class=\"sg\" data-s=\"1\">Il bisogno più comune è aspettarne <strong>parecchie<\/strong> in una volta.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> accetta un elenco di promise e restituisce i loro risultati in ordine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I tre lavori girano in modo concorrente; <code>await @jobs<\/code> li aspetta tutti e restituisce <code>(1, 2, 3)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poiché i risultati tornano nello stesso ordine delle promise, puoi ridurli come al solito.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche concatenare del lavoro a una promise con <code>.then<\/code>, che esegue un blocco di seguito una volta che la promise è finita.<\/span> <span class=\"sg\" data-s=\"1\">Al suo interno, <code>.result<\/code> è il valore della promise originale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> è una nuova promise che raddoppia il risultato di <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Attenderla dà <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco non ha un parametro esplicito, quindi riceve la promise finita come variabile argomento <code>$_<\/code> — ed è per questo che un <code>.result<\/code> nudo funziona: in realtà è <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se preferisci dare un nome a quella promise, usa un blocco con la freccia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si comporta esattamente allo stesso modo; <code>$prev<\/code> è la promise originale <code>$p<\/code>, e <code>$prev.result<\/code> è il suo valore.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con <code>start<\/code>, <code>await<\/code> e <code>.then<\/code> puoi descrivere intere pipeline di lavoro concorrente: lanciare molti compiti, combinarne i risultati e costruire nuovi compiti da quelli vecchi — senza mai toccare direttamente un thread.<\/span><\/p>"]]},"ru":{"t":"Цепочки и комбинирование","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Промисы становятся ещё мощнее, когда их объединяют.<\/span> <span class=\"sg\" data-s=\"1\">Чаще всего нужно дождаться <strong>нескольких<\/strong> сразу.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> принимает список промисов и возвращает их результаты по порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Три задания выполняются одновременно; <code>await @jobs<\/code> дожидается их всех и отдаёт <code>(1, 2, 3)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку результаты возвращаются в том же порядке, что и промисы, их можно свернуть как обычно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Работу можно и надстроить над промисом методом <code>.then<\/code>, который выполняет последующий блок, когда промис завершится.<\/span> <span class=\"sg\" data-s=\"1\">Внутри него <code>.result<\/code> — это значение исходного промиса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> — новый промис, удваивающий результат <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ожидание его даёт <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У блока нет явного параметра, поэтому он получает завершившийся промис в переменной темы <code>$_<\/code> — вот почему работает голое <code>.result<\/code>: на самом деле это <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если вам хочется дать этому промису имя, возьмите стрелочный блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ведёт себя это в точности так же: <code>$prev<\/code> — исходный промис <code>$p<\/code>, а <code>$prev.result<\/code> — его значение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С помощью <code>start<\/code>, <code>await<\/code> и <code>.then<\/code> можно описывать целые конвейеры конкурентной работы: запускать множество задач, объединять их результаты и строить новые задачи из старых — и всё это не прикасаясь к потокам напрямую.<\/span><\/p>"]]},"uk":{"t":"Зчеплення та поєднання","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Обіцянки стають іще потужнішими, коли ви їх поєднуєте.<\/span> <span class=\"sg\" data-s=\"1\">Найпоширеніша потреба — дочекатися <strong>кількох<\/strong> одразу.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> приймає список обіцянок і повертає їхні результати по порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Три завдання виконуються конкурентно; <code>await @jobs<\/code> чекає на всі й повертає <code>(1, 2, 3)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки результати повертаються в тому самому порядку, що й обіцянки, їх можна згортати як завжди.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Роботу можна також зчепити з обіцянкою через <code>.then<\/code>, який виконує блок-продовження, щойно обіцянка завершиться.<\/span> <span class=\"sg\" data-s=\"1\">Усередині нього <code>.result<\/code> є значенням початкової обіцянки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> — це нова обіцянка, що подвоює результат <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Очікування її дає <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок не має явного параметра, тож він отримує завершену обіцянку як змінну теми <code>$_<\/code> — саме тому голе <code>.result<\/code> працює: насправді це <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви волієте дати цій обіцянці ім'я, скористайтеся гострим блоком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поводиться це точно так само; <code>$prev<\/code> є початковою обіцянкою <code>$p<\/code>, а <code>$prev.result<\/code> — її значенням.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Маючи <code>start<\/code>, <code>await<\/code> та <code>.then<\/code>, ви можете описувати цілі конвеєри конкурентної роботи: запускати багато завдань, поєднувати їхні результати й будувати нові завдання зі старих — і все це не торкаючись потоку виконання напряму.<\/span><\/p>"]]},"bg":{"t":"Свързване и съчетаване","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Обещанията стават още по-мощни, когато ги съчетавате.<\/span> <span class=\"sg\" data-s=\"1\">Най-честата нужда е да изчакате <strong>няколко<\/strong> наведнъж.<\/span> <span class=\"sg\" data-s=\"2\"><code>await<\/code> приема списък от обещания и връща резултатите им по ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @jobs = (start { 1 }), (start { 2 }), (start { 3 });\nsay await @jobs;     # (1 2 3)\nsay [+] await @jobs; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трите задачи вървят паралелно; <code>await @jobs<\/code> изчаква всички и връща <code>(1, 2, 3)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Понеже резултатите се връщат в същия ред като обещанията, можете да ги свиете както обикновено.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете и да свържете работа с обещание чрез <code>.then<\/code>, който изпълнява следващ блок, щом обещанието приключи.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в него <code>.result<\/code> е стойността на първоначалното обещание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 10 };\nmy $q = $p.then({ .result * 2 });\nsay await $q; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$q<\/code> е ново обещание, което удвоява резултата на <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Изчакването му дава <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът няма изричен параметър, така че получава приключилото обещание като променливата тема <code>$_<\/code> — затова голото <code>.result<\/code> работи: всъщност това е <code>$_.result<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако предпочитате да дадете име на това обещание, използвайте остър блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $q = $p.then(-&gt; $prev { $prev.result * 2 });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това се държи по абсолютно същия начин; <code>$prev<\/code> е първоначалното обещание <code>$p<\/code>, а <code>$prev.result<\/code> е неговата стойност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>start<\/code>, <code>await<\/code> и <code>.then<\/code> можете да описвате цели конвейери от паралелна работа: да пускате много задачи, да съчетавате резултатите им и да строите нови задачи от стари — и всичко това, без да докосвате нишка направо.<\/span><\/p>"]]}}}</script>
