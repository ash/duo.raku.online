<script type="application/json" id="page-data">{"u":"paradigms/promises","n":1286,"k":"section","pv":"paradigms/threads/exercises/two-threads/solution","nx":"paradigms/promises/start-and-await","tr":["paradigms"],"L":{"en":{"t":"Promises","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>promise<\/em> represents a piece of work that will finish at some point and produce a result (or fail).<\/span> <span class=\"sg\" data-s=\"1\">Promises are the high-level, everyday way to do concurrency in Raku: you start work, get a promise back immediately, and collect the result when you need it.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unlike raw threads, promises are easy to combine — you can wait for several at once, or chain one onto the result of another.<\/span> <span class=\"sg\" data-s=\"1\">And where a thread only lets you <em>wait<\/em> for the work to finish, awaiting a promise hands you the <strong>value<\/strong> it produced — and re-throws any error it hit — so you rarely have to pass results around through shared variables yourself.<\/span> <span class=\"sg\" data-s=\"2\">This section covers starting promises, awaiting their results, and putting them together.<\/span><\/p>"]]},"de":{"t":"Promises","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Promise<\/em> steht für ein Stück Arbeit, das irgendwann fertig sein und ein Ergebnis liefern wird (oder scheitert).<\/span> <span class=\"sg\" data-s=\"1\">Promises sind der alltägliche, übergeordnete Weg, in Raku nebenläufig zu arbeiten: Sie starten Arbeit, bekommen sofort ein Promise zurück und holen das Ergebnis ab, wenn Sie es brauchen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anders als rohe Threads lassen sich Promises leicht verbinden — Sie können auf mehrere zugleich warten oder eines an das Ergebnis eines anderen anhängen.<\/span> <span class=\"sg\" data-s=\"1\">Und wo ein Thread Sie nur auf das Ende der Arbeit <em>warten<\/em> lässt, überreicht Ihnen das Abwarten eines Promise den <strong>Wert<\/strong>, den es erzeugt hat — und wirft jeden Fehler erneut, auf den es gestoßen ist —, sodass Sie selten selbst Ergebnisse über gemeinsame Variablen herumreichen müssen.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt behandelt das Starten von Promises, das Abwarten ihrer Ergebnisse und ihr Zusammenspiel.<\/span><\/p>"]]},"nl":{"t":"Promises","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>promise<\/em> staat voor een stuk werk dat op enig moment klaar zal zijn en een resultaat zal opleveren (of mislukken).<\/span> <span class=\"sg\" data-s=\"1\">Promises zijn de alledaagse manier op hoog niveau om in Raku aan concurrency te doen: je start werk, krijgt meteen een promise terug, en haalt het resultaat op wanneer je het nodig hebt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anders dan kale threads zijn promises makkelijk te combineren — je kunt op meerdere tegelijk wachten, of er een aan het resultaat van een andere rijgen.<\/span> <span class=\"sg\" data-s=\"1\">En waar een thread je alleen op de voltooiing van het werk laat <em>wachten<\/em>, overhandigt een promise afwachten je de <strong>waarde<\/strong> die zij opleverde — en werpt zij elke fout die zij tegenkwam opnieuw — zodat je zelden zelf resultaten via gedeelde variabelen hoeft rond te geven.<\/span> <span class=\"sg\" data-s=\"2\">Deze sectie behandelt promises starten, hun resultaten afwachten en ze samenvoegen.<\/span><\/p>"]]},"es":{"t":"Promesas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>promesa<\/em> representa un trabajo que terminará en algún momento y producirá un resultado (o fallará).<\/span> <span class=\"sg\" data-s=\"1\">Las promesas son la manera de alto nivel y de todos los días de hacer concurrencia en Raku: arrancas un trabajo, recibes de inmediato una promesa y recoges el resultado cuando lo necesitas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A diferencia de los hilos en crudo, las promesas son fáciles de combinar: puedes esperar varias a la vez o encadenar una al resultado de otra.<\/span> <span class=\"sg\" data-s=\"1\">Y mientras que un hilo solo te deja <em>esperar<\/em> a que el trabajo acabe, esperar una promesa te entrega el <strong>valor<\/strong> que produjo — y relanza cualquier error que encontrara —, así que rara vez tienes que pasar tú mismo los resultados por variables compartidas.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección cubre cómo arrancar promesas, esperar sus resultados y combinarlas.<\/span><\/p>"]]},"it":{"t":"Promise","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>promise<\/em> rappresenta un pezzo di lavoro che finirà a un certo punto e produrrà un risultato (o fallirà).<\/span> <span class=\"sg\" data-s=\"1\">Le promise sono il modo di alto livello, di tutti i giorni, di fare concorrenza in Raku: avvii il lavoro, ricevi subito indietro una promise e raccogli il risultato quando ti serve.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A differenza dei thread nudi, le promise sono facili da combinare — puoi aspettarne parecchie insieme, o concatenarne una al risultato di un'altra.<\/span> <span class=\"sg\" data-s=\"1\">E mentre un thread ti lascia solo <em>aspettare<\/em> che il lavoro finisca, attendere una promise ti consegna il <strong>valore<\/strong> che ha prodotto — e rilancia qualunque errore abbia incontrato — così raramente devi passare in giro i risultati attraverso variabili condivise.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione tratta l'avvio delle promise, l'attesa dei loro risultati e il modo di metterle insieme.<\/span><\/p>"]]},"ru":{"t":"Промисы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Промис<\/em> представляет работу, которая когда-нибудь завершится и выдаст результат (или потерпит неудачу).<\/span> <span class=\"sg\" data-s=\"1\">Промисы — высокоуровневый, повседневный способ заниматься конкурентностью в Raku: вы запускаете работу, тут же получаете промис и забираете результат, когда он понадобится.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В отличие от сырых потоков, промисы легко комбинировать: можно дожидаться сразу нескольких или надстроить один над результатом другого.<\/span> <span class=\"sg\" data-s=\"1\">И если поток позволяет только <em>дождаться<\/em> завершения работы, то ожидание промиса отдаёт вам <strong>значение<\/strong>, которое он выдал, и заново бросает ошибку, на которую он наткнулся, — так что передавать результаты через общие переменные вручную приходится редко.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе рассматриваются запуск промисов, ожидание их результатов и их объединение.<\/span><\/p>"]]},"uk":{"t":"Обіцянки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Обіцянка<\/em> представляє шматок роботи, що колись завершиться й дасть результат (або зазнає невдачі).<\/span> <span class=\"sg\" data-s=\"1\">Обіцянки — це високорівневий, повсякденний спосіб робити конкурентність у Raku: ви запускаєте роботу, негайно отримуєте обіцянку й забираєте результат тоді, коли він вам потрібен.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На відміну від сирих потоків виконання, обіцянки легко поєднувати — можна чекати на кілька одразу або зчепити одну з результатом іншої.<\/span> <span class=\"sg\" data-s=\"1\">І там, де потік дозволяє лише <em>дочекатися<\/em> завершення роботи, очікування обіцянки вручає вам <strong>значення<\/strong>, яке вона дала, і повторно кидає будь-яку помилку, на яку вона наразилася, — тож вам рідко доводиться самотужки передавати результати через спільні змінні.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ охоплює запуск обіцянок, очікування їхніх результатів та їх поєднання.<\/span><\/p>"]]},"bg":{"t":"Обещания","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Обещанието<\/em> представя парче работа, което ще приключи някога и ще даде резултат (или ще се провали).<\/span> <span class=\"sg\" data-s=\"1\">Обещанията са високоравнищният, ежедневен начин да се прави паралелност в Raku: стартирате работа, веднага получавате обещание и взимате резултата, когато ви потрябва.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За разлика от суровите нишки, обещанията са лесни за съчетаване — можете да изчакате няколко наведнъж или да свържете едно с резултата на друго.<\/span> <span class=\"sg\" data-s=\"1\">И там, където нишката ви позволява само да <em>изчакате<\/em> работата да свърши, изчакването на обещание ви подава <strong>стойността<\/strong>, която то е дало, и хвърля отново всяка грешка, на която е попаднало — така че рядко ви се налага сами да прекарвате резултати през споделени променливи.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел обхваща стартирането на обещания, изчакването на резултатите им и съчетаването им.<\/span><\/p>"]]}}}</script>
