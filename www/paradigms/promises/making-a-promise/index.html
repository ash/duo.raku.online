<script type="application/json" id="page-data">{"u":"paradigms/promises/making-a-promise","n":1291,"k":"topic","pv":"paradigms/promises/then-and-combinators/quiz","nx":"paradigms/promises/promise-status","tr":["paradigms","paradigms/promises"],"L":{"en":{"t":"Making your own promise","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Every promise so far came from <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But you can also create one directly with <code>Promise.new<\/code> — a promise that has not finished yet — and settle it yourself when the result (or the news) is ready.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> fulfils it with a value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # a fresh, unsettled promise\n\n$p.keep(42);           # fulfil it with a value\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> is the failure case.<\/span> <span class=\"sg\" data-s=\"1\">Awaiting a broken promise re-throws the error, just as it does for a <code>start<\/code> block that <a href=\"/paradigms/await/awaiting-promises/\">died<\/a> — and if nothing catches it, that exception stops the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # dies here with 'disk full'\nsay 'never reached';      # this line does not run<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To keep going, catch the failure with <code>try<\/code>, exactly as you would around any code that might die:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the outcome is already known, two shortcuts make a promise that starts out settled: <code>Promise.kept($value)<\/code> and <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Why make a promise by hand?<\/span> <span class=\"sg\" data-s=\"1\">Because not every result comes from a <code>start<\/code> block.<\/span> <span class=\"sg\" data-s=\"2\">An event that fires later, a message that arrives, a callback from another library — <code>Promise.new<\/code> lets you turn any of these into a promise that the rest of the program can <code>await<\/code> and combine like any other.<\/span><\/p>"]]},"de":{"t":"Ein eigenes Promise erzeugen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes Promise bisher kam von <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie können aber auch unmittelbar eines mit <code>Promise.new<\/code> erzeugen — ein Promise, das noch nicht fertig ist — und es selbst erledigen, wenn das Ergebnis (oder die Nachricht) bereitsteht.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> erfüllt es mit einem Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # a fresh, unsettled promise\n\n$p.keep(42);           # fulfil it with a value\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> ist der Fehlschlagfall.<\/span> <span class=\"sg\" data-s=\"1\">Ein gebrochenes Promise abzuwarten wirft den Fehler erneut, genau wie bei einem <code>start<\/code>-Block, der <a href=\"https://course.raku.org/de/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">gestorben ist<\/a> — und fängt niemand die Ausnahme, hält sie das Programm an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # dies here with 'disk full'\nsay 'never reached';      # this line does not run<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um weiterzumachen, fangen Sie den Fehlschlag mit <code>try<\/code>, genau wie um jeden Code, der sterben könnte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Steht der Ausgang bereits fest, erzeugen zwei Abkürzungen ein Promise, das schon erledigt beginnt: <code>Promise.kept($value)<\/code> und <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Warum ein Promise von Hand erzeugen?<\/span> <span class=\"sg\" data-s=\"1\">Weil nicht jedes Ergebnis aus einem <code>start<\/code>-Block kommt.<\/span> <span class=\"sg\" data-s=\"2\">Ein Ereignis, das später eintritt, eine Nachricht, die ankommt, ein Rückruf aus einer anderen Bibliothek — mit <code>Promise.new<\/code> machen Sie aus jedem davon ein Promise, das der Rest des Programms <code>await<\/code>-en und wie jedes andere verbinden kann.<\/span><\/p>"]]},"nl":{"t":"Je eigen promise maken","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke promise tot nu toe kwam van <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar je kunt er ook rechtstreeks een maken met <code>Promise.new<\/code> — een promise die nog niet klaar is — en haar zelf afhandelen wanneer het resultaat (of het nieuws) klaar is.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> vervult haar met een waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # a fresh, unsettled promise\n\n$p.keep(42);           # fulfil it with a value\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> is het mislukkingsgeval.<\/span> <span class=\"sg\" data-s=\"1\">Een verbroken promise afwachten werpt de fout opnieuw, net zoals het dat doet bij een <code>start<\/code>-blok dat <a href=\"https://course.raku.org/nl/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">gestorven is<\/a> — en als niets die exceptie vangt, legt ze het programma stil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # dies here with 'disk full'\nsay 'never reached';      # this line does not run<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om door te gaan vang je de mislukking met <code>try<\/code>, precies zoals je om elke code zou doen die kan sterven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als de uitkomst al bekend is, maken twee afkortingen een promise die al afgehandeld begint: <code>Promise.kept($value)<\/code> en <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Waarom met de hand een promise maken?<\/span> <span class=\"sg\" data-s=\"1\">Omdat niet elk resultaat uit een <code>start<\/code>-blok komt.<\/span> <span class=\"sg\" data-s=\"2\">Een gebeurtenis die later afgaat, een bericht dat binnenkomt, een callback uit een andere bibliotheek — met <code>Promise.new<\/code> maak je van elk daarvan een promise die de rest van het programma kan <code>await<\/code>-en en net als elke andere kan combineren.<\/span><\/p>"]]},"es":{"t":"Su propia promesa 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Todas las promesas vistas hasta ahora venían de <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero también puedes crear una directamente con <code>Promise.new<\/code> — una promesa que aún no ha terminado — y resolverla tú mismo cuando el resultado (o la noticia) esté listo.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> la cumple con un valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # a fresh, unsettled promise\n\n$p.keep(42);           # fulfil it with a value\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> es el caso de fallo.<\/span> <span class=\"sg\" data-s=\"1\">Esperar una promesa rota relanza el error, igual que ocurre con un bloque <code>start<\/code> que <a href=\"https://course.raku.org/es/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">murió<\/a>, y si nadie la captura, esa excepción detiene el programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # dies here with 'disk full'\nsay 'never reached';      # this line does not run<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para seguir adelante, captura el fallo con <code>try<\/code>, exactamente como harías alrededor de cualquier código que pueda morir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si el desenlace ya se conoce, dos atajos crean una promesa que nace ya resuelta: <code>Promise.kept($value)<\/code> y <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">¿Por qué crear una promesa a mano?<\/span> <span class=\"sg\" data-s=\"1\">Porque no todos los resultados vienen de un bloque <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un evento que se dispara más tarde, un mensaje que llega, una retrollamada de otra biblioteca: <code>Promise.new<\/code> te permite convertir cualquiera de ellos en una promesa que el resto del programa puede <code>await<\/code> y combinar como cualquier otra.<\/span><\/p>"]]},"it":{"t":"Una promise tutta vostra 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni promise vista finora veniva da <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma puoi anche crearne una direttamente con <code>Promise.new<\/code> — una promise non ancora conclusa — e concluderla tu quando il risultato (o la notizia) è pronto.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> la soddisfa con un valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # a fresh, unsettled promise\n\n$p.keep(42);           # fulfil it with a value\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> è il caso di fallimento.<\/span> <span class=\"sg\" data-s=\"1\">Attendere una promise rotta rilancia l'errore, proprio come fa per un blocco <code>start<\/code> che è <a href=\"https://course.raku.org/it/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">morto<\/a> — e se nulla la intercetta, quell'eccezione ferma il programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # dies here with 'disk full'\nsay 'never reached';      # this line does not run<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per proseguire, intercetta il fallimento con <code>try<\/code>, esattamente come faresti attorno a qualunque codice che potrebbe morire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se l'esito è già noto, due scorciatoie creano una promise che nasce già conclusa: <code>Promise.kept($value)<\/code> e <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Perché costruire una promise a mano?<\/span> <span class=\"sg\" data-s=\"1\">Perché non ogni risultato viene da un blocco <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un evento che scatta più tardi, un messaggio che arriva, una callback da un'altra libreria — <code>Promise.new<\/code> ti permette di trasformare ognuna di queste cose in una promise che il resto del programma può attendere e combinare come qualunque altra.<\/span><\/p>"]]},"ru":{"t":"Собственный промис","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Все промисы до сих пор приходили из <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но промис можно создать и напрямую, через <code>Promise.new<\/code> — это промис, который ещё не завершился, — и уладить его самому, когда результат (или известие) готов.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> исполняет его со значением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # свежий, ещё не улаженный промис\n\n$p.keep(42);           # исполняем его со значением\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> — это случай неудачи.<\/span> <span class=\"sg\" data-s=\"1\">Ожидание сломанного промиса заново бросает ошибку — ровно так же, как для блока <code>start<\/code>, который <a href=\"https://course.raku.org/ru/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">умер<\/a>, — и, если её никто не перехватит, это исключение остановит программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # здесь умирает с 'disk full'\nsay 'never reached';      # эта строка не выполняется<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы продолжить работу, перехватите неудачу через <code>try<\/code> — точно так же, как вокруг любого кода, который может умереть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если исход уже известен, два сокращения создают промис, изначально улаженный: <code>Promise.kept($value)<\/code> и <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зачем создавать промис вручную?<\/span> <span class=\"sg\" data-s=\"1\">Затем, что не всякий результат приходит из блока <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Событие, которое сработает позже, пришедшее сообщение, обратный вызов из другой библиотеки — <code>Promise.new<\/code> позволяет превратить любое из этого в промис, который остальная программа сможет ожидать через <code>await<\/code> и комбинировать как любой другой.<\/span><\/p>"]]},"uk":{"t":"Створення власної обіцянки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожна обіцянка досі походила від <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але ви можете створити її й безпосередньо через <code>Promise.new<\/code> — обіцянку, що ще не завершилася, — і владнати її самотужки, коли результат (або новина) буде готовий.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> виконує її зі значенням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # свіжа, невладнана обіцянка\n\n$p.keep(42);           # виконуємо її зі значенням\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> — це випадок невдачі.<\/span> <span class=\"sg\" data-s=\"1\">Очікування зламаної обіцянки повторно кидає помилку, точно як воно робить для блоку <code>start<\/code>, що <a href=\"https://course.raku.org/uk/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">помер<\/a>, — і якщо цього ніхто не перехопить, такий виняток зупиняє програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # тут помирає з 'disk full'\nsay 'never reached';      # цей рядок не виконується<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб рухатися далі, перехопіть невдачу через <code>try<\/code>, рівно як ви зробили б навколо будь-якого коду, що може померти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо підсумок уже відомий, два скорочення створюють обіцянку, що вже від початку владнана: <code>Promise.kept($value)<\/code> та <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Навіщо створювати обіцянку вручну?<\/span> <span class=\"sg\" data-s=\"1\">Бо не кожен результат походить із блоку <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Подія, що спрацює пізніше, повідомлення, що надійде, зворотний виклик з іншої бібліотеки — <code>Promise.new<\/code> дозволяє перетворити будь-що з цього на обіцянку, яку решта програми може <code>await<\/code>-ити й поєднувати, як і будь-яку іншу.<\/span><\/p>"]]},"bg":{"t":"Създаване на собствено обещание","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяко обещание досега идваше от <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но можете да създадете такова и направо с <code>Promise.new<\/code> — обещание, което още не е приключило, — и да го уредите сами, когато резултатът (или новината) е готов.<\/span> <span class=\"sg\" data-s=\"2\"><code>.keep<\/code> го изпълнява със стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;   # ново, неуредено обещание\n\n$p.keep(42);           # изпълняваме го със стойност\nsay await $p;          # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.break<\/code> е случаят на провал.<\/span> <span class=\"sg\" data-s=\"1\">Изчакването на счупено обещание хвърля грешката отново, точно както при блок <code>start<\/code>, който е <a href=\"https://course.raku.org/bg/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">умрял<\/a> — и ако никой не я прихване, това изключение спира програмата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nsay await $p;             # тук умира с 'disk full'\nsay 'never reached';      # този ред не се изпълнява<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да продължите, прихванете провала с <code>try<\/code>, точно както бихте направили около всеки код, който може да умре:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\n$p.break('disk full');\n\nmy $result = try await $p;\nsay $result // \"the job failed: $!\"; # the job failed: disk full<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако изходът вече е известен, две скъсявания създават обещание, което започва уредено: <code>Promise.kept($value)<\/code> и <code>Promise.broken($error)<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say await Promise.kept(7); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Защо да създавате обещание на ръка?<\/span> <span class=\"sg\" data-s=\"1\">Защото не всеки резултат идва от блок <code>start<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Събитие, което ще се задейства по-късно, съобщение, което ще пристигне, обратно извикване от друга библиотека — <code>Promise.new<\/code> ви позволява да превърнете всяко от тях в обещание, което останалата част от програмата може да <code>await<\/code>-и и да съчетава като всяко друго.<\/span><\/p>"]]}}}</script>
