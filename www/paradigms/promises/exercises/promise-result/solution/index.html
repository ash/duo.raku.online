=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Elke <code>.then<\/code> bouwt een nieuwe promise die draait zodra de vorige klaar is. Binnen haar blok is <code>.result<\/code> de waarde die de vorige promise opleverde.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het eerste vervolg zet <code>'raku'<\/code> in hoofdletters tot <code>'RAKU'<\/code>; het tweede voegt <code>'!'<\/code> toe. De laatste promise, <code>$r<\/code>, afwachten loopt de hele keten door en levert <code>'RAKU!'<\/code> op — een kleine pijplijn waarin elke stap het resultaat van de vorige omvormt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Encadene una promesa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 'raku' };\nmy $q = $p.then({ .result.uc });\nmy $r = $q.then({ .result ~ '!' });\nsay await $r;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/promises/promise-result.raku\" target=\"_blank\" rel=\"noopener\">promise-result.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>RAKU!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cada <code>.then<\/code> construye una promesa nueva que se ejecuta en cuanto la anterior está lista. Dentro de su bloque, <code>.result<\/code> es el valor que produjo la promesa anterior.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El primer seguimiento convierte <code>'raku'<\/code> en <code>'RAKU'<\/code>; el segundo le añade <code>'!'<\/code>. Esperar la última promesa, <code>$r<\ ку, що виконується, щойно завершиться попередня. Усередині її блоку <code>.result<\/code> є значенням, яке дала попередня обіцянка.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Перше продовження переводить <code>'raku'<\/code> у <code>'RAKU'<\/code>; друге додає <code>'!'<\/code>. Очікування останньої обіцянки, <code>$r<\/code>, проходить увесь ланцюжок і дає <code>'RAKU!'<\/code> — невеличкий конвеєр, у якому кожен крок перетворює результат попереднього.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Свържете обещание","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = start { 'raku' };\nmy $q = $p.then({ .result.uc });\nmy $r = $q.then({ .result ~ '!' });\nsay await $r;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/promises/promise-result.raku\" target=\"_blank\" rel=\"noopener\">promise-result.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>RAKU!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всяко <code>.then<\/code> изгражда ново обещание, което се изпълнява, щом предишното приключи. Вътре в блока му <code>.result<\/code> е стойността, дадена от предишното обещание.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Първото продължение превръща <code>'raku'<\/code> в <code>'RAKU'<\/code>; второто добавя <code>'!'<\/code>. Изчакването на последното обещание <code>$r<\/code> минава по цялата верига и дава <code>'RAKU!'<\/code> — малък конвейер, в който всяка стъпка преобразува резултата на предишната.<\/span><\/li><\/ol>"]]}}}</script>
