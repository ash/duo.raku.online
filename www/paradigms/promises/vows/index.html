<script type="application/json" id="page-data">{"u":"paradigms/promises/vows","n":1293,"k":"topic","pv":"paradigms/promises/promise-status","nx":"paradigms/promises/exercises","tr":["paradigms","paradigms/promises"],"L":{"en":{"t":"Vows","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When you call <code>$p.keep(...)<\/code> yourself, anyone who holds <code>$p<\/code> could settle it.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes you want the opposite: the code that <em>produces<\/em> the result should be the only thing allowed to settle the promise, while everyone else may only wait on it.<\/span> <span class=\"sg\" data-s=\"2\">That separation is a <strong>vow<\/strong>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> gives you a promise; calling <code>.vow<\/code> on it hands back a <code>Vow<\/code> — the sole right to keep or break that promise.<\/span> <span class=\"sg\" data-s=\"1\">From then on the promise is meant to be read-only: it is settled through the vow.<\/span> <span class=\"sg\" data-s=\"2\">The usual shape is a producer that keeps the vow private and returns just the promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # take the settle-right\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # settle it through the vow\n    }\n    return $p;                            # callers get only the read side\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Taking the vow makes the promise genuinely read-only: from that moment <code>$p.keep<\/code> and <code>$p.break<\/code> are refused, because the vow now owns the sole right to settle it.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # dies: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So the caller can <code>await<\/code> the promise, chain <code>.then<\/code> onto it, or check its <code>.status<\/code>, but it cannot settle it — only the holder of the vow can.<\/span> <span class=\"sg\" data-s=\"1\">This is how libraries turn callback- and event-based APIs into ordinary promises: create a promise, hold its vow, and fulfil it from inside the callback when the event finally arrives.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is also exactly what <code>start<\/code> does for you behind the scenes — it makes a promise, keeps the vow to itself, and settles the promise with the block’s value (or breaks it if the block dies).<\/span> <span class=\"sg\" data-s=\"1\">Making the promise and its vow by hand simply lets you do the same thing when the result does not come from a single block of code.<\/span><\/p>"]]},"de":{"t":"Gelöbnisse","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie selbst <code>$p.keep(...)<\/code> aufrufen, könnte jeder, der <code>$p<\/code> besitzt, es erledigen.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal wollen Sie das Gegenteil: Nur der Code, der das Ergebnis <em>erzeugt<\/em>, soll das Promise erledigen dürfen, während alle anderen bloß darauf warten dürfen.<\/span> <span class=\"sg\" data-s=\"2\">Diese Trennung ist ein <strong>Gelöbnis<\/strong> (Vow).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> gibt Ihnen ein Promise; darauf <code>.vow<\/code> aufzurufen überreicht ein <code>Vow<\/code> — das alleinige Recht, dieses Promise zu erfüllen oder zu brechen.<\/span> <span class=\"sg\" data-s=\"1\">Von da an ist das Promise als nur lesbar gedacht: Es wird über das Gelöbnis erledigt.<\/span> <span class=\"sg\" data-s=\"2\">Die übliche Form ist ein Erzeuger, der das Gelöbnis für sich behält und nur das Promise zurückgibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # take the settle-right\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # settle it through the vow\n    }\n    return $p;                            # callers get only the read side\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Gelöbnis zu nehmen macht das Promise wirklich nur lesbar: Von diesem Augenblick an werden <code>$p.keep<\/code> und <code>$p.break<\/code> abgelehnt, denn das Gelöbnis besitzt nun das alleinige Recht, es zu erledigen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # dies: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Aufrufer kann das Promise also <code>await<\/code>-en, <code>.then<\/code> daran hängen oder seinen <code>.status<\/code> prüfen, aber er kann es nicht erledigen — das kann nur der Inhaber des Gelöbnisses.<\/span> <span class=\"sg\" data-s=\"1\">So machen Bibliotheken aus auf Rückrufen und Ereignissen gestützten Schnittstellen gewöhnliche Promises: ein Promise erzeugen, sein Gelöbnis halten und es aus dem Rückruf heraus erfüllen, wenn das Ereignis endlich eintritt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Genau das tut auch <code>start<\/code> hinter den Kulissen für Sie — es erzeugt ein Promise, behält das Gelöbnis für sich und erledigt das Promise mit dem Wert des Blocks (oder bricht es, wenn der Block stirbt).<\/span> <span class=\"sg\" data-s=\"1\">Das Promise und sein Gelöbnis von Hand zu erzeugen erlaubt Ihnen schlicht, dasselbe zu tun, wenn das Ergebnis nicht aus einem einzelnen Codeblock kommt.<\/span><\/p>"]]},"nl":{"t":"Geloften","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer je zelf <code>$p.keep(...)<\/code> aanroept, zou iedereen die <code>$p<\/code> bezit haar kunnen afhandelen.<\/span> <span class=\"sg\" data-s=\"1\">Soms wil je het tegenovergestelde: de code die het resultaat <em>produceert<\/em> zou als enige de promise mogen afhandelen, terwijl alle anderen er alleen op mogen wachten.<\/span> <span class=\"sg\" data-s=\"2\">Die scheiding is een <strong>gelofte<\/strong> (vow).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> geeft je een promise; er <code>.vow<\/code> op aanroepen overhandigt een <code>Vow<\/code> — het enige recht om die promise te vervullen of te verbreken.<\/span> <span class=\"sg\" data-s=\"1\">Vanaf dat moment is de promise bedoeld als alleen-lezen: ze wordt via de gelofte afgehandeld.<\/span> <span class=\"sg\" data-s=\"2\">De gebruikelijke vorm is een producent die de gelofte privé houdt en alleen de promise teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # take the settle-right\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # settle it through the vow\n    }\n    return $p;                            # callers get only the read side\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De gelofte nemen maakt de promise werkelijk alleen-lezen: vanaf dat moment worden <code>$p.keep<\/code> en <code>$p.break<\/code> geweigerd, omdat de gelofte nu het enige recht bezit om haar af te handelen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # dies: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De aanroeper kan de promise dus <code>await<\/code>-en, er <code>.then<\/code> aan rijgen of haar <code>.status<\/code> controleren, maar hij kan haar niet afhandelen — alleen de houder van de gelofte kan dat.<\/span> <span class=\"sg\" data-s=\"1\">Zo veranderen bibliotheken API's die op callbacks en gebeurtenissen gebaseerd zijn in gewone promises: maak een promise, houd haar gelofte, en vervul haar vanuit de callback wanneer de gebeurtenis eindelijk komt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Precies dat doet <code>start<\/code> ook achter de schermen voor je — het maakt een promise, houdt de gelofte voor zichzelf, en handelt de promise af met de waarde van het blok (of verbreekt haar als het blok sterft).<\/span> <span class=\"sg\" data-s=\"1\">De promise en haar gelofte met de hand maken laat je eenvoudigweg hetzelfde doen wanneer het resultaat niet uit één enkel blok code komt.<\/span><\/p>"]]},"es":{"t":"Vows 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando llamas tú mismo a <code>$p.keep(...)<\/code>, cualquiera que tenga <code>$p<\/code> podría resolverla.<\/span> <span class=\"sg\" data-s=\"1\">A veces quieres lo contrario: que el código que <em>produce<\/em> el resultado sea lo único con permiso para resolver la promesa, mientras que todos los demás solo puedan esperarla.<\/span> <span class=\"sg\" data-s=\"2\">Esa separación es un <strong>voto<\/strong>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> te da una promesa; llamar a <code>.vow<\/code> sobre ella devuelve un <code>Vow<\/code>, el derecho exclusivo a cumplir o romper esa promesa.<\/span> <span class=\"sg\" data-s=\"1\">A partir de ahí la promesa está pensada para ser de solo lectura: se resuelve a través del voto.<\/span> <span class=\"sg\" data-s=\"2\">La forma habitual es un productor que mantiene el voto en privado y devuelve solo la promesa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # take the settle-right\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # settle it through the vow\n    }\n    return $p;                            # callers get only the read side\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tomar el voto hace la promesa genuinamente de solo lectura: desde ese momento <code>$p.keep<\/code> y <code>$p.break<\/code> se rechazan, porque el voto posee ahora el derecho exclusivo a resolverla.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # dies: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así, quien la recibe puede hacer <code>await<\/code> sobre la promesa, encadenarle un <code>.then<\/code> o comprobar su <code>.status<\/code>, pero no puede resolverla: solo puede hacerlo quien tiene el voto.<\/span> <span class=\"sg\" data-s=\"1\">Así es como las bibliotecas convierten las API basadas en retrollamadas y eventos en promesas corrientes: crean una promesa, se quedan con su voto y la cumplen desde dentro de la retrollamada cuando el evento llega por fin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es también exactamente lo que hace <code>start<\/code> por ti entre bastidores: crea una promesa, se guarda el voto y resuelve la promesa con el valor del bloque (o la rompe si el bloque muere).<\/span> <span class=\"sg\" data-s=\"1\">Crear a mano la promesa y su voto simplemente te permite hacer lo mismo cuando el resultado no viene de un único bloque de código.<\/span><\/p>"]]},"it":{"t":"Vow 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando chiami tu <code>$p.keep(...)<\/code>, chiunque abbia <code>$p<\/code> potrebbe concluderla.<\/span> <span class=\"sg\" data-s=\"1\">A volte vuoi l'opposto: il codice che <em>produce<\/em> il risultato dovrebbe essere l'unico autorizzato a concludere la promise, mentre tutti gli altri possono solo aspettarla.<\/span> <span class=\"sg\" data-s=\"2\">Quella separazione è un <strong>voto<\/strong>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> ti dà una promise; chiamarvi sopra <code>.vow<\/code> restituisce un <code>Vow<\/code>, il diritto esclusivo di mantenere o rompere quella promise.<\/span> <span class=\"sg\" data-s=\"1\">Da quel momento la promise è pensata come di sola lettura: si conclude attraverso il voto.<\/span> <span class=\"sg\" data-s=\"2\">La forma abituale è un produttore che tiene privato il voto e restituisce soltanto la promise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # take the settle-right\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # settle it through the vow\n    }\n    return $p;                            # callers get only the read side\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prendere il voto rende la promise davvero di sola lettura: da quel momento <code>$p.keep<\/code> e <code>$p.break<\/code> vengono rifiutati, perché il voto possiede ora il diritto esclusivo di concluderla.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # dies: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Così il chiamante può attendere la promise, concatenarvi un <code>.then<\/code> o controllarne lo <code>.status<\/code>, ma non può concluderla: solo chi tiene il voto può.<\/span> <span class=\"sg\" data-s=\"1\">È così che le librerie trasformano le interfacce basate su callback ed eventi in promise ordinarie: creano una promise, ne tengono il voto e la soddisfano dall'interno della callback quando l'evento finalmente arriva.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È anche esattamente ciò che <code>start<\/code> fa per te dietro le quinte: crea una promise, ne tiene il voto per sé e conclude la promise con il valore del blocco (o la rompe se il blocco muore).<\/span> <span class=\"sg\" data-s=\"1\">Costruire a mano la promise e il suo voto ti permette semplicemente di fare la stessa cosa quando il risultato non viene da un unico blocco di codice.<\/span><\/p>"]]},"ru":{"t":"Обещания (Vow)","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда вы сами вызываете <code>$p.keep(...)<\/code>, уладить промис может любой, кто держит <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Иногда нужно обратное: улаживать промис должен только тот код, который <em>производит<\/em> результат, а всем остальным позволено лишь дожидаться.<\/span> <span class=\"sg\" data-s=\"2\">Это разделение и есть <strong>обещание<\/strong> (vow).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> даёт вам промис; вызов <code>.vow<\/code> у него возвращает <code>Vow<\/code> — единоличное право исполнить или сломать этот промис.<\/span> <span class=\"sg\" data-s=\"1\">С этого момента промис предполагается доступным только для чтения: улаживают его через обещание.<\/span> <span class=\"sg\" data-s=\"2\">Обычная форма — производитель, который держит обещание при себе и возвращает только промис:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # забираем право улаживать\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # улаживаем через обещание\n    }\n    return $p;                            # вызывающим достаётся только сторона для чтения\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Взятие обещания делает промис по-настоящему доступным только для чтения: с этого момента <code>$p.keep<\/code> и <code>$p.break<\/code> отвергаются, потому что единоличное право улаживать теперь принадлежит обещанию.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # умирает: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, вызывающая сторона может дождаться промиса через <code>await<\/code>, надстроить над ним <code>.then<\/code> или проверить его <code>.status<\/code>, но уладить его не может — на это способен лишь держатель обещания.<\/span> <span class=\"sg\" data-s=\"1\">Именно так библиотеки превращают API на обратных вызовах и событиях в обычные промисы: создают промис, держат его обещание и исполняют его изнутри обратного вызова, когда событие наконец наступает.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ровно это <code>start<\/code> и делает за вас за кулисами: он создаёт промис, оставляет обещание себе и улаживает промис значением блока (или ломает его, если блок умер).<\/span> <span class=\"sg\" data-s=\"1\">Создание промиса и его обещания вручную просто позволяет сделать то же самое, когда результат приходит не из одного блока кода.<\/span><\/p>"]]},"uk":{"t":"Зароки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли ви самі викликаєте <code>$p.keep(...)<\/code>, владнати обіцянку може будь-хто, у кого є <code>$p<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Інколи вам потрібне протилежне: щоб код, який <em>виробляє<\/em> результат, був єдиним, кому дозволено владнати обіцянку, тоді як усі інші можуть лише на неї чекати.<\/span> <span class=\"sg\" data-s=\"2\">Це розділення й називають <strong>зароком<\/strong> (vow).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> дає вам обіцянку; виклик <code>.vow<\/code> на ній повертає <code>Vow<\/code> — виняткове право виконати чи зламати цю обіцянку.<\/span> <span class=\"sg\" data-s=\"1\">Відтоді обіцянка вважається доступною лише для читання: її владнують через зарок.<\/span> <span class=\"sg\" data-s=\"2\">Звична форма — виробник, що тримає зарок приватним і повертає саму лише обіцянку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # беремо право владнати\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # владнуємо її через зарок\n    }\n    return $p;                            # тим, хто викликає, дістається лише сторона читання\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Узяття зароку робить обіцянку справді доступною лише для читання: від цієї миті <code>$p.keep<\/code> та <code>$p.break<\/code> відхиляються, бо виняткове право владнати її тепер належить зарокові.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # помирає: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тож той, хто викликає, може <code>await<\/code>-ити обіцянку, зчепити з нею <code>.then<\/code> або перевірити її <code>.status<\/code>, але не може її владнати — це може лише власник зароку.<\/span> <span class=\"sg\" data-s=\"1\">Саме так бібліотеки перетворюють API на зворотних викликах та подіях на звичайні обіцянки: створити обіцянку, тримати її зарок і виконати її зсередини зворотного виклику, коли подія нарешті настане.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це також рівно те, що <code>start<\/code> робить за вас за лаштунками: він створює обіцянку, лишає зарок собі й владнує обіцянку значенням блоку (або ламає її, якщо блок помирає).<\/span> <span class=\"sg\" data-s=\"1\">Створення обіцянки та її зароку вручну просто дозволяє вам зробити те саме, коли результат походить не з єдиного блоку коду.<\/span><\/p>"]]},"bg":{"t":"Обети","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато сами извиквате <code>$p.keep(...)<\/code>, всеки, който държи <code>$p<\/code>, би могъл да го уреди.<\/span> <span class=\"sg\" data-s=\"1\">Понякога искате обратното: кодът, който <em>произвежда<\/em> резултата, да е единственото нещо, на което е позволено да уреди обещанието, докато всички останали могат само да го чакат.<\/span> <span class=\"sg\" data-s=\"2\">Това разделяне е <strong>обет<\/strong> (vow).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Promise.new<\/code> ви дава обещание; извикването на <code>.vow<\/code> върху него връща <code>Vow<\/code> — изключителното право да изпълните или счупите това обещание.<\/span> <span class=\"sg\" data-s=\"1\">Оттам нататък обещанието се смята за достъпно само за четене: то се урежда през обета.<\/span> <span class=\"sg\" data-s=\"2\">Обичайната форма е производител, който държи обета частен и връща само обещанието:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub after($seconds) {\n    my $p = Promise.new;\n    my $v = $p.vow;                       # взимаме правото да уреждаме\n    start {\n        sleep $seconds;\n        $v.keep(\"done after $seconds s\"); # уреждаме го през обета\n    }\n    return $p;                            # извикващите получават само страната за четене\n}\n\nmy $job = after(0.2);\nsay $job.status;   # Planned\nsay await $job;    # done after 0.2 s<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Взимането на обета прави обещанието наистина достъпно само за четене: от този миг <code>$p.keep<\/code> и <code>$p.break<\/code> се отказват, защото обетът вече притежава изключителното право да го урежда.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $p = Promise.new;\nmy $v = $p.vow;\n\n$p.keep(1); # умира: Access denied to keep/break this Promise; already vowed<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така извикващият може да <code>await<\/code>-и обещанието, да свърже <code>.then<\/code> с него или да провери неговия <code>.status<\/code>, но не може да го уреди — това може само притежателят на обета.<\/span> <span class=\"sg\" data-s=\"1\">Точно така библиотеките превръщат API-та, базирани на обратни извиквания и събития, в обикновени обещания: създават обещание, държат обета му и го изпълняват отвътре в обратното извикване, когато събитието най-сетне настъпи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е и точно каквото <code>start<\/code> прави за вас зад кулисите — той създава обещание, задържа обета за себе си и урежда обещанието със стойността на блока (или го счупва, ако блокът умре).<\/span> <span class=\"sg\" data-s=\"1\">Създаването на обещанието и обета му на ръка просто ви позволява да направите същото, когато резултатът не идва от един-единствен блок код.<\/span><\/p>"]]}}}</script>
