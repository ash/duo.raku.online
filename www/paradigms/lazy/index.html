<script type="application/json" id="page-data">{"u":"paradigms/lazy","n":1251,"k":"section","pv":"paradigms/iterators/exercises/sum-with-pull-one/solution","nx":"paradigms/lazy/sequence-operator","tr":["paradigms"],"L":{"en":{"t":"Lazy and infinite sequences","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>lazy<\/em> list computes its elements only when they are asked for.<\/span> <span class=\"sg\" data-s=\"1\">This makes it possible to describe sequences that are conceptually <strong>infinite<\/strong> — all the natural numbers, all the powers of two, the whole Fibonacci sequence — and then take just the part you need.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku builds such sequences with the sequence operator <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This section shows how to write finite and infinite sequences and how to pull values from them safely.<\/span><\/p>"]]},"de":{"t":"Träge und unendliche Sequenzen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>träge<\/em> Liste berechnet ihre Elemente erst, wenn man nach ihnen fragt.<\/span> <span class=\"sg\" data-s=\"1\">Damit lassen sich Sequenzen beschreiben, die im Grunde <strong>unendlich<\/strong> sind — alle natürlichen Zahlen, alle Zweierpotenzen, die ganze Fibonacci-Folge — und dann genau der Teil entnehmen, den Sie brauchen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku baut solche Sequenzen mit dem Sequenzoperator <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt, wie man endliche und unendliche Sequenzen schreibt und wie man ihnen sicher Werte entnimmt.<\/span><\/p>"]]},"nl":{"t":"Luie en oneindige reeksen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>luie<\/em> lijst berekent haar elementen pas wanneer erom gevraagd wordt.<\/span> <span class=\"sg\" data-s=\"1\">Zo wordt het mogelijk reeksen te beschrijven die in wezen <strong>oneindig<\/strong> zijn — alle natuurlijke getallen, alle machten van twee, de hele Fibonacci-reeks — en er daarna precies het deel uit te nemen dat je nodig hebt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku bouwt zulke reeksen met de reeksoperator <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie laat zien hoe je eindige en oneindige reeksen schrijft en hoe je er veilig waarden uit haalt.<\/span><\/p>"]]},"es":{"t":"Secuencias perezosas e infinitas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una lista <em>perezosa<\/em> calcula sus elementos solo cuando se piden.<\/span> <span class=\"sg\" data-s=\"1\">Esto hace posible describir secuencias conceptualmente <strong>infinitas<\/strong> — todos los números naturales, todas las potencias de dos, la sucesión de Fibonacci entera — y tomar después solo la parte que necesitas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku construye esas secuencias con el operador de secuencia <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección muestra cómo escribir secuencias finitas e infinitas y cómo extraer valores de ellas sin peligro.<\/span><\/p>"]]},"it":{"t":"Sequenze pigre e infinite","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un elenco <em>pigro<\/em> calcola i propri elementi solo quando vengono richiesti.<\/span> <span class=\"sg\" data-s=\"1\">Questo rende possibile descrivere sequenze concettualmente <strong>infinite<\/strong> — tutti i numeri naturali, tutte le potenze di due, l'intera sequenza di Fibonacci — e poi prenderne solo la parte che serve.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku costruisce sequenze simili con l'operatore di sequenza <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra come scrivere sequenze finite e infinite e come estrarne valori in sicurezza.<\/span><\/p>"]]},"ru":{"t":"Ленивые и бесконечные последовательности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Ленивый<\/em> список вычисляет свои элементы только тогда, когда их спрашивают.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет описывать последовательности, которые по сути <strong>бесконечны<\/strong>, — все натуральные числа, все степени двойки, всю последовательность Фибоначчи, — а затем брать ровно ту часть, которая нужна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такие последовательности Raku строит оператором последовательности <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе показано, как записывать конечные и бесконечные последовательности и как безопасно вытягивать из них значения.<\/span><\/p>"]]},"uk":{"t":"Ліниві та нескінченні послідовності","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Лінивий<\/em> список обчислює свої елементи лише тоді, коли їх просять.<\/span> <span class=\"sg\" data-s=\"1\">Це дає змогу описувати послідовності, що концептуально є <strong>нескінченними<\/strong>, — усі натуральні числа, усі степені двійки, усю послідовність Фібоначчі — і потім брати саме ту частину, яка вам потрібна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku будує такі послідовності оператором послідовності <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує, як записувати скінченні та нескінченні послідовності і як безпечно витягати з них значення.<\/span><\/p>"]]},"bg":{"t":"Мързеливи и безкрайни последователности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Мързеливият<\/em> списък изчислява елементите си едва когато бъдат поискани.<\/span> <span class=\"sg\" data-s=\"1\">Това прави възможно да се описват последователности, които са концептуално <strong>безкрайни<\/strong> — всички естествени числа, всички степени на двойката, цялата редица на Фибоначи — и после да се вземе само онази част, която ви трябва.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku строи такива последователности с оператора за последователност <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва как се записват крайни и безкрайни последователности и как безопасно да теглите стойности от тях.<\/span><\/p>"]]}}}</script>
