<script type="application/json" id="page-data">{"u":"paradigms/lazy/sequence-operator","n":1252,"k":"topic","pv":"paradigms/lazy","nx":"paradigms/lazy/sequence-operator/quiz","tr":["paradigms","paradigms/lazy"],"L":{"en":{"t":"The sequence operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The sequence operator <code>...<\/code> builds a list from a starting pattern up to an end value.<\/span> <span class=\"sg\" data-s=\"1\">Give it the first few elements and the endpoint, and it works out how the series continues:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">From <code>2, 4<\/code> it infers “add two each time”, and continues until it reaches <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The step can be downward too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the elements grow by multiplication rather than addition, the operator notices that as well:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here each term is double the previous one, so the sequence is geometric.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When the rule is more complex than the operator can guess, you can supply it explicitly as a closure of the previous elements.<\/span> <span class=\"sg\" data-s=\"1\">For instance, an explicit “add the step” rule:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The block <code>* + 2<\/code> says how to get the next element from the current one.<\/span> <span class=\"sg\" data-s=\"1\">With this, <code>...<\/code> can express any sequence you can describe by a rule.<\/span><\/p>"]]},"de":{"t":"Der Sequenzoperator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Sequenzoperator <code>...<\/code> baut eine Liste von einem Anfangsmuster bis zu einem Endwert.<\/span> <span class=\"sg\" data-s=\"1\">Geben Sie ihm die ersten paar Elemente und den Endpunkt, und er ermittelt, wie die Folge weitergeht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aus <code>2, 4<\/code> schließt er auf „addiere jedes Mal zwei“ und läuft weiter, bis er <code>10<\/code> erreicht.<\/span> <span class=\"sg\" data-s=\"1\">Der Schritt darf auch abwärts gehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wachsen die Elemente durch Multiplikation statt durch Addition, bemerkt der Operator auch das:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist jedes Glied das Doppelte des vorigen, die Folge ist also geometrisch.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ist die Regel verwickelter, als der Operator raten kann, können Sie sie ausdrücklich als Closure über die vorigen Elemente angeben.<\/span> <span class=\"sg\" data-s=\"1\">Etwa eine ausdrückliche Regel „addiere den Schritt“:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Block <code>* + 2<\/code> sagt, wie man aus dem aktuellen Element das nächste erhält.<\/span> <span class=\"sg\" data-s=\"1\">Damit kann <code>...<\/code> jede Folge ausdrücken, die Sie durch eine Regel beschreiben können.<\/span><\/p>"]]},"nl":{"t":"De reeksoperator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De reeksoperator <code>...<\/code> bouwt een lijst op vanaf een beginpatroon tot een eindwaarde.<\/span> <span class=\"sg\" data-s=\"1\">Geef hem de eerste paar elementen en het eindpunt, en hij werkt uit hoe de reeks doorloopt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uit <code>2, 4<\/code> leidt hij \"tel er telkens twee bij op\" af, en hij gaat door tot hij <code>10<\/code> bereikt.<\/span> <span class=\"sg\" data-s=\"1\">De stap kan ook omlaag gaan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als de elementen door vermenigvuldiging in plaats van optelling groeien, merkt de operator dat ook:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is elke term het dubbele van de vorige, dus de reeks is meetkundig.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer de regel ingewikkelder is dan de operator kan raden, kun je haar expliciet als closure van de vorige elementen leveren.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld een expliciete regel \"tel de stap op\":<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het blok <code>* + 2<\/code> zegt hoe je het volgende element uit het huidige krijgt.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee kan <code>...<\/code> elke reeks uitdrukken die je met een regel kunt beschrijven.<\/span><\/p>"]]},"es":{"t":"El operador de secuencia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El operador de secuencia <code>...<\/code> construye una lista a partir de un patrón inicial hasta un valor final.<\/span> <span class=\"sg\" data-s=\"1\">Dale los primeros elementos y el punto final, y deduce cómo continúa la serie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>2, 4<\/code> infiere «suma dos cada vez», y continúa hasta llegar a <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El paso también puede ir hacia abajo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si los elementos crecen multiplicándose en lugar de sumándose, el operador también se da cuenta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí cada término es el doble del anterior, así que la secuencia es geométrica.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando la regla es más compleja de lo que el operador puede adivinar, puedes darla explícitamente como una clausura de los elementos anteriores.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, una regla explícita de «suma el paso»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>* + 2<\/code> dice cómo obtener el elemento siguiente a partir del actual.<\/span> <span class=\"sg\" data-s=\"1\">Con esto, <code>...<\/code> puede expresar cualquier secuencia que sepas describir mediante una regla.<\/span><\/p>"]]},"it":{"t":"L'operatore di sequenza","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'operatore di sequenza <code>...<\/code> costruisce un elenco a partire da uno schema iniziale fino a un valore finale.<\/span> <span class=\"sg\" data-s=\"1\">Dagli i primi elementi e l'estremo, e capirà da sé come la serie continua:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da <code>2, 4<\/code> deduce «aggiungi due ogni volta» e continua finché non raggiunge <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il passo può anche essere all'ingiù:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se gli elementi crescono per moltiplicazione invece che per addizione, l'operatore se ne accorge lo stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui ogni termine è il doppio del precedente, quindi la sequenza è geometrica.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando la regola è più complessa di quanto l'operatore possa indovinare, puoi fornirla esplicitamente come chiusura degli elementi precedenti.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, una regola esplicita «aggiungi il passo»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>* + 2<\/code> dice come ottenere l'elemento successivo dall'attuale.<\/span> <span class=\"sg\" data-s=\"1\">Con questo, <code>...<\/code> può esprimere qualunque sequenza tu sappia descrivere con una regola.<\/span><\/p>"]]},"ru":{"t":"Оператор последовательности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор последовательности <code>...<\/code> строит список от начального образца до конечного значения.<\/span> <span class=\"sg\" data-s=\"1\">Дайте ему несколько первых элементов и конечную точку — и он сам сообразит, как ряд продолжается:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Из <code>2, 4<\/code> он выводит «прибавлять по два» и продолжает, пока не дойдёт до <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Шаг может идти и вниз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если элементы растут умножением, а не сложением, оператор замечает и это:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь каждый член вдвое больше предыдущего, то есть последовательность геометрическая.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда правило сложнее, чем оператор может угадать, его можно задать явно — замыканием от предыдущих элементов.<\/span> <span class=\"sg\" data-s=\"1\">Например, явное правило «прибавить шаг»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>* + 2<\/code> говорит, как получить следующий элемент из текущего.<\/span> <span class=\"sg\" data-s=\"1\">С этим <code>...<\/code> может выразить любую последовательность, которую вы способны описать правилом.<\/span><\/p>"]]},"uk":{"t":"Оператор послідовності","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор послідовності <code>...<\/code> будує список від початкового зразка до кінцевого значення.<\/span> <span class=\"sg\" data-s=\"1\">Дайте йому кілька перших елементів та кінцеву точку — і він з'ясує, як послідовність продовжується:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>2, 4<\/code> він виснує «щоразу додавай два» й продовжує, аж поки не дійде до <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Крок може бути й спадним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо елементи зростають множенням, а не додаванням, оператор помічає і це:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут кожен член удвічі більший за попередній, тож послідовність геометрична.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли правило складніше за те, що оператор може вгадати, ви можете задати його явно як замикання від попередніх елементів.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, явне правило «додай крок»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>* + 2<\/code> каже, як отримати наступний елемент із поточного.<\/span> <span class=\"sg\" data-s=\"1\">Із цим <code>...<\/code> може виразити будь-яку послідовність, яку ви здатні описати правилом.<\/span><\/p>"]]},"bg":{"t":"Операторът за последователност","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторът за последователност <code>...<\/code> строи списък от начален образец до крайна стойност.<\/span> <span class=\"sg\" data-s=\"1\">Дайте му първите няколко елемента и крайната точка и той сам разбира как продължава редицата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... 10); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">От <code>2, 4<\/code> той заключава „добавяй по две всеки път“ и продължава, докато стигне <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стъпката може да е и надолу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 8 ... 2); # (10 8 6 4 2)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако елементите растат чрез умножение, а не чрез събиране, операторът забелязва и това:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... 64); # (1 2 4 8 16 32 64)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук всеки член е двойно по-голям от предишния, така че последователността е геометрична.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато правилото е по-сложно, отколкото операторът може да отгатне, можете да го зададете изрично като затваряне от предишните елементи.<\/span> <span class=\"sg\" data-s=\"1\">Например изрично правило „добави стъпката“:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, * + 2 ... 9); # (1 3 5 7 9)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>* + 2<\/code> казва как да се получи следващият елемент от текущия.<\/span> <span class=\"sg\" data-s=\"1\">С това <code>...<\/code> може да изрази всяка последователност, която можете да опишете с правило.<\/span><\/p>"]]}}}</script>
