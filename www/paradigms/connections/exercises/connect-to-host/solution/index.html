<script type="application/json" id="page-data">{"u":"paradigms/connections/exercises/connect-to-host/solution","n":1387,"k":"solution","pv":"paradigms/connections/exercises/connect-to-host","nx":"paradigms/connections/exercises/send-and-receive","tr":["paradigms","paradigms/connections"],"L":{"en":{"t":"The solution of ’Connect to a host‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> opens the connection immediately, and throws if the host is unreachable.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wrapping it in <code>try<\/code> turns that exception into a <code>Nil<\/code> instead of a crash. The <code>if … -&gt; $conn<\/code> binds the socket when the connection succeeds and runs the <code>else<\/code> branch when it does not — the robust way to attempt a connection.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">To see the <code>else<\/code> branch in action, change <code>$host<\/code> to a name that does not exist, such as <code>'example.comp'<\/code>. The DNS lookup then fails — without the <code>try<\/code> you would get an error like <code>Failed to resolve host name 'example.comp'<\/code> — but here the <code>try<\/code> turns it into <code>Nil<\/code>, so the program calmly prints <code>could not connect to example.comp<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Verbindung zu einem Host","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> öffnet die Verbindung unverzüglich und wirft, wenn der Host unerreichbar ist.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Es in <code>try<\/code> zu hüllen macht aus dieser Ausnahme ein <code>Nil<\/code> statt eines Absturzes. Das <code>if … -&gt; $conn<\/code> bindet den Socket, wenn die Verbindung gelingt, und führt den <code>else<\/code>-Zweig aus, wenn nicht — der robuste Weg, eine Verbindung zu versuchen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Um den <code>else<\/code>-Zweig in Aktion zu sehen, ändern Sie <code>$host<\/code> in einen Namen, den es nicht gibt, etwa <code>'example.comp'<\/code>. Die DNS-Auflösung scheitert dann — ohne das <code>try<\/code> bekämen Sie einen Fehler wie <code>Failed to resolve host name 'example.comp'<\/code> —, doch hier macht das <code>try<\/code> ein <code>Nil<\/code> daraus, das Programm gibt also ruhig <code>could not connect to example.comp<\/code> aus.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Verbinding met een host","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> opent de verbinding meteen en werpt als de host onbereikbaar is.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haar in <code>try<\/code> wikkelen maakt van die exceptie een <code>Nil<\/code> in plaats van een crash. De <code>if … -&gt; $conn<\/code> bindt de socket wanneer de verbinding lukt en draait de <code>else<\/code>-tak wanneer dat niet zo is — de robuuste manier om een verbinding te proberen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Om de <code>else<\/code>-tak in actie te zien, verander je <code>$host<\/code> in een naam die niet bestaat, zoals <code>'example.comp'<\/code>. De DNS-opzoeking mislukt dan — zonder de <code>try<\/code> zou je een fout als <code>Failed to resolve host name 'example.comp'<\/code> krijgen — maar hier maakt de <code>try<\/code> er een <code>Nil<\/code> van, dus drukt het programma kalm <code>could not connect to example.comp<\/code> af.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Conéctese a un host","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> abre la conexión de inmediato y lanza una excepción si el host es inalcanzable.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Envolverlo en <code>try<\/code> convierte esa excepción en un <code>Nil<\/code> en lugar de en una caída. El <code>if … -&gt; $conn<\/code> liga el socket cuando la conexión tiene éxito y ejecuta la rama <code>else<\/code> cuando no, la manera robusta de intentar una conexión.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Para ver la rama <code>else<\/code> en acción, cambia <code>$host<\/code> por un nombre que no exista, como <code>'example.comp'<\/code>. La resolución de DNS falla entonces — sin el <code>try<\/code> obtendrías un error como <code>Failed to resolve host name 'example.comp'<\/code> —, pero aquí el <code>try<\/code> lo convierte en <code>Nil<\/code>, así que el programa imprime con calma <code>could not connect to example.comp<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Collegatevi a un host","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> apre subito la connessione e solleva un'eccezione se l'host è irraggiungibile.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Avvolgerla in <code>try<\/code> trasforma quell'eccezione in un <code>Nil<\/code> invece che in un crollo. L'<code>if … -&gt; $conn<\/code> lega il socket quando la connessione riesce ed esegue il ramo <code>else<\/code> quando non riesce — il modo robusto di tentare una connessione.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Per vedere all'opera il ramo <code>else<\/code>, cambia <code>$host<\/code> in un nome che non esiste, come <code>'example.comp'<\/code>. La risoluzione DNS fallisce allora — senza il <code>try<\/code> otterresti un errore come <code>Failed to resolve host name 'example.comp'<\/code> — ma qui il <code>try<\/code> lo trasforma in <code>Nil<\/code>, quindi il programma stampa con calma <code>could not connect to example.comp<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Подключитесь к хосту","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> открывает соединение немедленно и бросает исключение, если хост недостижим.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обёртка в <code>try<\/code> превращает это исключение в <code>Nil<\/code> вместо аварийного завершения. Конструкция <code>if … -&gt; $conn<\/code> связывает сокет при успешном соединении и выполняет ветку <code>else<\/code>, когда соединения нет, — надёжный способ попытаться подключиться.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Чтобы увидеть ветку <code>else<\/code> в действии, поменяйте <code>$host<\/code> на несуществующее имя, например <code>'example.comp'<\/code>. Тогда не сработает разрешение DNS — без <code>try<\/code> вы получили бы ошибку вроде <code>Failed to resolve host name 'example.comp'<\/code>, — но здесь <code>try<\/code> превращает её в <code>Nil<\/code>, и программа спокойно печатает <code>could not connect to example.comp<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Приєднайтеся до вузла»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> відкриває з'єднання негайно й кидає виняток, якщо вузол недосяжний.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обгортання його в <code>try<\/code> перетворює цей виняток на <code>Nil<\/code> замість аварії. Конструкція <code>if … -&gt; $conn<\/code> зв'язує сокет, коли з'єднання вдається, і виконує гілку <code>else<\/code>, коли ні, — надійний спосіб спробувати з'єднатися.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щоб побачити гілку <code>else<\/code> в дії, змініть <code>$host<\/code> на ім'я, якого не існує, як-от <code>'example.comp'<\/code>. Тоді пошук у DNS зазнає невдачі — без <code>try<\/code> ви отримали б помилку на кшталт <code>Failed to resolve host name 'example.comp'<\/code>, — але тут <code>try<\/code> перетворює її на <code>Nil<\/code>, і програма спокійно друкує <code>could not connect to example.comp<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Свържете се с хост","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $host = 'example.com';\n\nif try IO::Socket::INET.new(:host($host), :port(80)) -&gt; $conn {\n    say \"connected to $host\";\n    $conn.close;\n}\nelse {\n    say \"could not connect to $host\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/connections/connect-to-host.raku\" target=\"_blank\" rel=\"noopener\">connect-to-host.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>connected to example.com<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new(:host, :port)<\/code> отваря връзката незабавно и хвърля изключение, ако хостът е недостижим.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обвиването му в <code>try<\/code> превръща това изключение в <code>Nil<\/code> вместо в срив. Конструкцията <code>if … -&gt; $conn<\/code> свързва сокета, когато връзката успее, и изпълнява клона <code>else<\/code>, когато не успее — надеждният начин да се опита връзка.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За да видите клона <code>else<\/code> в действие, сменете <code>$host<\/code> с име, което не съществува, например <code>'example.comp'<\/code>. Тогава търсенето в DNS се проваля — без <code>try<\/code> бихте получили грешка от рода на <code>Failed to resolve host name 'example.comp'<\/code>, — но тук <code>try<\/code> я превръща в <code>Nil<\/code> и програмата спокойно отпечатва <code>could not connect to example.comp<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
