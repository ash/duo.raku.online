<script type="application/json" id="page-data">{"u":"paradigms/connections","n":1380,"k":"section","pv":"paradigms/await/exercises/await-failure/solution","nx":"paradigms/connections/opening-a-socket","tr":["paradigms"],"L":{"en":{"t":"Making remote connections","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The last subpart of the course turns to <em>web<\/em> programming — talking to other machines over the network.<\/span> <span class=\"sg\" data-s=\"1\">We build up from the bottom: a raw network connection, then a simple HTTP client, a simple HTTP server, and finally a glimpse of the Cro framework.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unlike the rest of the course, these examples need a <strong>network connection<\/strong> to run, and the later ones need modules you install yourself.<\/span> <span class=\"sg\" data-s=\"1\">The code is written to compile and to work when you run it against a real server, but its output cannot be shown the way the offline examples can.<\/span> <span class=\"sg\" data-s=\"2\">Each page notes what it needs.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">We begin with the foundation of all network code: a <em>socket<\/em>, the two-way pipe between two programs across a network.<\/span><\/p>"]]},"de":{"t":"Verbindungen in die Ferne aufbauen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der letzte Unterteil des Kurses wendet sich der <em>Web<\/em>-Programmierung zu — dem Sprechen mit anderen Maschinen über das Netz.<\/span> <span class=\"sg\" data-s=\"1\">Wir bauen von unten auf: eine rohe Netzverbindung, dann ein einfacher HTTP-Client, ein einfacher HTTP-Server und schließlich ein Blick auf das Cro-Framework.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anders als der Rest des Kurses brauchen diese Beispiele eine <strong>Netzverbindung<\/strong>, um zu laufen, und die späteren brauchen Module, die Sie selbst installieren.<\/span> <span class=\"sg\" data-s=\"1\">Der Code ist so geschrieben, dass er übersetzt und funktioniert, wenn Sie ihn gegen einen echten Server laufen lassen, doch seine Ausgabe lässt sich nicht so zeigen wie bei den Beispielen ohne Netz.<\/span> <span class=\"sg\" data-s=\"2\">Jede Seite vermerkt, was sie braucht.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wir beginnen mit dem Fundament allen Netzcodes: einem <em>Socket<\/em>, der Zweiwegleitung zwischen zwei Programmen über ein Netz.<\/span><\/p>"]]},"nl":{"t":"Verbindingen op afstand maken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het laatste onderdeel van de cursus wendt zich tot <em>web<\/em>-programmeren — praten met andere machines over het netwerk.<\/span> <span class=\"sg\" data-s=\"1\">We bouwen van onderaf op: een kale netwerkverbinding, dan een eenvoudige HTTP-client, een eenvoudige HTTP-server, en ten slotte een blik op het Cro-framework.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anders dan de rest van de cursus hebben deze voorbeelden een <strong>netwerkverbinding<\/strong> nodig om te draaien, en de latere hebben modules nodig die je zelf installeert.<\/span> <span class=\"sg\" data-s=\"1\">De code is zo geschreven dat ze compileert en werkt wanneer je haar tegen een echte server draait, maar de uitvoer kan niet getoond worden zoals bij de offline voorbeelden.<\/span> <span class=\"sg\" data-s=\"2\">Elke pagina vermeldt wat ze nodig heeft.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">We beginnen bij het fundament van alle netwerkcode: een <em>socket<\/em>, de tweewegbuis tussen twee programma's over een netwerk.<\/span><\/p>"]]},"es":{"t":"Establecer conexiones remotas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La última subparte del curso se vuelve hacia la programación <em>web<\/em>: hablar con otras máquinas por la red.<\/span> <span class=\"sg\" data-s=\"1\">Construimos desde abajo: una conexión de red en crudo, después un cliente HTTP sencillo, un servidor HTTP sencillo y, por último, un vistazo al framework Cro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A diferencia del resto del curso, estos ejemplos necesitan una <strong>conexión de red<\/strong> para ejecutarse, y los últimos necesitan módulos que instalas tú.<\/span> <span class=\"sg\" data-s=\"1\">El código está escrito para compilar y para funcionar cuando lo ejecutes contra un servidor real, pero su salida no se puede mostrar como sí se puede con los ejemplos sin conexión.<\/span> <span class=\"sg\" data-s=\"2\">Cada página indica lo que necesita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Empezamos por el cimiento de todo el código de red: un <em>socket<\/em>, la tubería de dos direcciones entre dos programas a través de una red.<\/span><\/p>"]]},"it":{"t":"Stabilire connessioni remote","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'ultima sottoparte del corso passa alla programmazione <em>web<\/em>: parlare con altre macchine attraverso la rete.<\/span> <span class=\"sg\" data-s=\"1\">Costruiamo dal basso: una connessione di rete grezza, poi un semplice client HTTP, un semplice server HTTP e infine uno sguardo al framework Cro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A differenza del resto del corso, questi esempi hanno bisogno di una <strong>connessione di rete<\/strong> per girare, e gli ultimi hanno bisogno di moduli che installi tu.<\/span> <span class=\"sg\" data-s=\"1\">Il codice è scritto per compilare e per funzionare quando lo esegui contro un server vero, ma il suo output non può essere mostrato come quello degli esempi non in rete.<\/span> <span class=\"sg\" data-s=\"2\">Ogni pagina segnala di che cosa ha bisogno.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cominciamo dal fondamento di tutto il codice di rete: un <em>socket<\/em>, il tubo a due vie fra due programmi attraverso una rete.<\/span><\/p>"]]},"ru":{"t":"Удалённые соединения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Последняя подчасть курса обращается к <em>веб<\/em>-программированию — общению с другими машинами по сети.<\/span> <span class=\"sg\" data-s=\"1\">Мы будем строить снизу вверх: сначала «сырое» сетевое соединение, затем простой HTTP-клиент, простой HTTP-сервер и, наконец, беглый взгляд на фреймворк Cro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В отличие от остального курса, этим примерам для работы нужно <strong>сетевое соединение<\/strong>, а более поздним — модули, которые вы устанавливаете сами.<\/span> <span class=\"sg\" data-s=\"1\">Код написан так, чтобы компилироваться и работать при запуске против настоящего сервера, но показать его вывод так, как это делается в офлайновых примерах, невозможно.<\/span> <span class=\"sg\" data-s=\"2\">На каждой странице отмечено, что ей требуется.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Начнём с основы всего сетевого кода — с <em>сокета<\/em>, двусторонней трубы между двумя программами через сеть.<\/span><\/p>"]]},"uk":{"t":"Віддалені з'єднання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Остання підчастина курсу повертає до <em>веб<\/em>-програмування — спілкування з іншими машинами через мережу.<\/span> <span class=\"sg\" data-s=\"1\">Ми будуємо знизу вгору: сире мережеве з'єднання, потім простий HTTP-клієнт, простий HTTP-сервер і насамкінець побіжний погляд на фреймворк Cro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На відміну від решти курсу, цим прикладам для запуску потрібне <strong>мережеве з'єднання<\/strong>, а пізнішим — модулі, які ви встановлюєте самі.<\/span> <span class=\"sg\" data-s=\"1\">Код написано так, щоб він компілювався й працював, коли ви запускаєте його проти справжнього сервера, але його вивід неможливо показати так, як це роблять офлайнові приклади.<\/span> <span class=\"sg\" data-s=\"2\">Кожна сторінка зазначає, що їй потрібно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Починаємо з підмурівка всього мережевого коду — із <em>сокета<\/em>, двобічної труби між двома програмами через мережу.<\/span><\/p>"]]},"bg":{"t":"Отдалечени връзки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Последната подчаст на курса се обръща към <em>уеб<\/em> програмирането — говоренето с други машини по мрежата.<\/span> <span class=\"sg\" data-s=\"1\">Изграждаме отдолу нагоре: сурова мрежова връзка, после прост HTTP клиент, прост HTTP сървър и накрая бегъл поглед към рамката Cro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За разлика от останалата част на курса, тези примери се нуждаят от <strong>мрежова връзка<\/strong>, за да работят, а по-късните — от модули, които сами инсталирате.<\/span> <span class=\"sg\" data-s=\"1\">Кодът е написан така, че да се компилира и да работи, когато го изпълните срещу истински сървър, но изходът му не може да бъде показан така, както при офлайн примерите.<\/span> <span class=\"sg\" data-s=\"2\">Всяка страница отбелязва от какво се нуждае.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Започваме с основата на целия мрежов код — <em>сокета<\/em>, двупосочната тръба между две програми през мрежа.<\/span><\/p>"]]}}}</script>
