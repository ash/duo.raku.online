<script type="application/json" id="page-data">{"u":"paradigms/connections/sending-receiving/quiz","n":1384,"k":"quiz","pv":"paradigms/connections/sending-receiving","nx":"paradigms/connections/exercises","tr":["paradigms","paradigms/connections","paradigms/connections/sending-receiving"],"L":{"en":{"t":"Quiz — HTTP requests","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In an HTTP request sent over a socket, what marks the end of the request headers?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">A full stop<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">A blank line (an extra <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">The word <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Closing the socket<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP separates the headers from the body — and signals “no more headers” — with a blank line, written as an extra <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Without it, the server keeps waiting for the rest of the request.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — HTTP-Anfragen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was kennzeichnet in einer über einen Socket gesendeten HTTP-Anfrage das Ende der Anfrage-Header?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ein Punkt<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Eine leere Zeile (ein zusätzliches <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Das Wort <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Das Schließen des Sockets<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP trennt die Header vom Rumpf — und meldet „keine Header mehr“ — mit einer leeren Zeile, geschrieben als zusätzliches <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ohne sie wartet der Server weiter auf den Rest der Anfrage.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — HTTP-verzoeken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat markeert in een HTTP-verzoek dat over een socket verstuurd wordt het einde van de verzoekheaders?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Een punt<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Een lege regel (een extra <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Het woord <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">De socket sluiten<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP scheidt de headers van de body — en signaleert \"geen headers meer\" — met een lege regel, geschreven als een extra <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zonder die regel blijft de server op de rest van het verzoek wachten.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Peticiones HTTP","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En una petición HTTP enviada por un socket, ¿qué marca el final de las cabeceras de la petición?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Un punto<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Una línea en blanco (un <code>\\r\\n<\/code> de más)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">La palabra <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Cerrar el socket<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP separa las cabeceras del cuerpo — y señala «no hay más cabeceras» — con una línea en blanco, escrita como un <code>\\r\\n<\/code> de más.<\/span> <span class=\"sg\" data-s=\"1\">Sin ella, el servidor se queda esperando el resto de la petición.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Richieste HTTP","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In una richiesta HTTP inviata attraverso un socket, che cosa segna la fine delle intestazioni della richiesta?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Un punto<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Una riga vuota (un <code>\\r\\n<\/code> in più)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">La parola <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">La chiusura del socket<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP separa le intestazioni dal corpo — e segnala «niente altre intestazioni» — con una riga vuota, scritta come un <code>\\r\\n<\/code> in più.<\/span> <span class=\"sg\" data-s=\"1\">Senza di essa, il server continua ad aspettare il resto della richiesta.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — HTTP pieprasījumi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kas HTTP pieprasījumā, kas nosūtīts caur ligzdu, apzīmē pieprasījuma galveņu beigas?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Punkts<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Tukša rinda (papildu <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Vārds <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Ligzdas aizvēršana<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP galvenes no ķermeņa atdala — un pavēsta «vairāk galveņu nav» — ar tukšu rindu, kas rakstīta kā papildu <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bez tās serveris turpina gaidīt pieprasījuma atlikumu.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — HTTP-запросы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что обозначает конец заголовков в HTTP-запросе, отправленном через сокет?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Точка<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Пустая строка (лишний <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Слово <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Закрытие сокета<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP отделяет заголовки от тела — и сообщает «заголовков больше нет» — пустой строкой, которая записывается как дополнительный <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без неё сервер продолжит ждать остаток запроса.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — HTTP-запити","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що в HTTP-запиті, надісланому через сокет, позначає кінець заголовків запиту?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Крапка<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Порожній рядок (додаткове <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Слово <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Закриття сокета<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP відділяє заголовки від тіла — і сигналізує «заголовків більше немає» — порожнім рядком, записаним як додаткове <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без нього сервер і далі чекатиме на решту запиту.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — HTTP заявки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отбелязва края на заглавките в HTTP заявка, изпратена през сокет?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Точка<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Празен ред (допълнително <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Думата <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Затварянето на сокета<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP отделя заглавките от тялото — и сигнализира „няма повече заглавки“ — с празен ред, записан като допълнително <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без него сървърът продължава да чака остатъка от заявката.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — HTTP-petoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En HTTP-peto sendita tra kontaktskatolo, kio markas la finon de la petaj kapoj?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Punkto<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Malplena linio (kroma <code>\\r\\n<\/code>)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">La vorto <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Fermi la kontaktskatolon<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP apartigas la kapojn de la korpo — kaj signalas «neniuj pliaj kapoj» — per malplena linio, skribita kiel kroma <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sen ĝi, la servilo daŭre atendas la reston de la peto.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Petitiones HTTP","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In petitione HTTP per foramen missa, quid finem capitum petitionis notat?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Punctum<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Linea vacua (<code>\\r\\n<\/code> superfluum)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Verbum <code>END<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Foramen claudere<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP capita a corpore separat — et «nulla capita amplius» significat — per lineam vacuam, ut <code>\\r\\n<\/code> superfluum scriptam.<\/span> <span class=\"sg\" data-s=\"1\">Sine ea, servitor reliquum petitionis exspectare pergit.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
