<script type="application/json" id="page-data">{"u":"paradigms/connections/sending-receiving","n":1383,"k":"topic","pv":"paradigms/connections/opening-a-socket/quiz","nx":"paradigms/connections/sending-receiving/quiz","tr":["paradigms","paradigms/connections"],"L":{"en":{"t":"Sending and receiving","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Once a socket is open, you exchange data through it.<\/span> <span class=\"sg\" data-s=\"1\">Send text with <code>.print<\/code>, and read what comes back with <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This sends a minimal HTTP request and reads the server’s reply into <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The first line of a reply from a web server is its status line.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">This example needs a working network connection. When run, it prints the reply’s status line. Because <code>raku.org<\/code> redirects plain HTTP to the secure HTTPS site, that line is a redirect, such as <code>HTTP/1.1 308 Permanent Redirect<\/code>, rather than <code>200 OK<\/code>. The special domain <code>example.com<\/code> does not redirect, so aiming the same request there prints a plain <code>HTTP/1.1 200 OK<\/code> instead.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Two details matter when talking to servers.<\/span> <span class=\"sg\" data-s=\"1\">First, network protocols usually separate lines with <code>\\r\\n<\/code> (carriage return plus newline), not a plain <code>\\n<\/code>, which is why the request is written with <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Second, <code>.recv<\/code> returns whatever data has arrived so far; for larger replies you read in a loop until the connection closes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sending bytes and receiving bytes is all a socket really does.<\/span> <span class=\"sg\" data-s=\"1\">Everything else — HTTP, and the higher-level tools in the coming sections — is built on top of this simple send-and-receive.<\/span><\/p>"]]},"de":{"t":"Senden und empfangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sobald ein Socket offen ist, tauschen Sie darüber Daten aus.<\/span> <span class=\"sg\" data-s=\"1\">Senden Sie Text mit <code>.print<\/code> und lesen Sie mit <code>.recv<\/code>, was zurückkommt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das sendet eine minimale HTTP-Anfrage und liest die Antwort des Servers in <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die erste Zeile einer Antwort von einem Webserver ist ihre Statuszeile.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dieses Beispiel braucht eine funktionierende Netzverbindung. Beim Ausführen gibt es die Statuszeile der Antwort aus. Da <code>raku.org<\/code> einfaches HTTP auf die gesicherte HTTPS-Seite umleitet, ist diese Zeile eine Umleitung, etwa <code>HTTP/1.1 308 Permanent Redirect<\/code>, und nicht <code>200 OK<\/code>. Die besondere Domäne <code>example.com<\/code> leitet nicht um, dieselbe Anfrage dorthin zu richten gibt also schlicht <code>HTTP/1.1 200 OK<\/code> aus.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zwei Einzelheiten sind beim Sprechen mit Servern wichtig.<\/span> <span class=\"sg\" data-s=\"1\">Erstens trennen Netzprotokolle Zeilen gewöhnlich mit <code>\\r\\n<\/code> (Wagenrücklauf plus Zeilenvorschub), nicht mit einem einfachen <code>\\n<\/code>, weshalb die Anfrage mit <code>\\r\\n<\/code> geschrieben ist.<\/span> <span class=\"sg\" data-s=\"2\">Zweitens liefert <code>.recv<\/code>, was bisher an Daten eingetroffen ist; bei größeren Antworten lesen Sie in einer Schleife, bis die Verbindung schließt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bytes senden und Bytes empfangen ist alles, was ein Socket wirklich tut.<\/span> <span class=\"sg\" data-s=\"1\">Alles andere — HTTP und die übergeordneten Werkzeuge der kommenden Abschnitte — ist darauf aufgebaut.<\/span><\/p>"]]},"nl":{"t":"Versturen en ontvangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zodra een socket open is, wissel je er gegevens door uit.<\/span> <span class=\"sg\" data-s=\"1\">Verstuur tekst met <code>.print<\/code>, en lees wat terugkomt met <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit verstuurt een minimaal HTTP-verzoek en leest het antwoord van de server in <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De eerste regel van een antwoord van een webserver is haar statusregel.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dit voorbeeld heeft een werkende netwerkverbinding nodig. Bij het draaien drukt het de statusregel van het antwoord af. Omdat <code>raku.org<\/code> gewone HTTP naar de beveiligde HTTPS-site omleidt, is die regel een omleiding, zoals <code>HTTP/1.1 308 Permanent Redirect<\/code>, en niet <code>200 OK<\/code>. Het bijzondere domein <code>example.com<\/code> leidt niet om, dus hetzelfde verzoek daarheen richten drukt gewoon <code>HTTP/1.1 200 OK<\/code> af.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Twee details doen ertoe wanneer je met servers praat.<\/span> <span class=\"sg\" data-s=\"1\">Ten eerste scheiden netwerkprotocollen regels doorgaans met <code>\\r\\n<\/code> (carriage return plus newline) en niet met een kale <code>\\n<\/code>, en daarom is het verzoek met <code>\\r\\n<\/code> geschreven.<\/span> <span class=\"sg\" data-s=\"2\">Ten tweede geeft <code>.recv<\/code> terug welke gegevens tot dusver binnengekomen zijn; voor grotere antwoorden lees je in een lus tot de verbinding sluit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bytes versturen en bytes ontvangen is alles wat een socket werkelijk doet.<\/span> <span class=\"sg\" data-s=\"1\">Al het andere — HTTP, en de gereedschappen op hoger niveau in de komende secties — is daarbovenop gebouwd.<\/span><\/p>"]]},"es":{"t":"Enviar y recibir","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una vez abierto un socket, intercambias datos a través de él.<\/span> <span class=\"sg\" data-s=\"1\">Envía texto con <code>.print<\/code> y lee lo que vuelve con <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto envía una petición HTTP mínima y lee la respuesta del servidor en <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La primera línea de una respuesta de un servidor web es su línea de estado.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Este ejemplo necesita una conexión de red que funcione. Al ejecutarlo, imprime la línea de estado de la respuesta. Como <code>raku.org<\/code> redirige el HTTP simple al sitio seguro HTTPS, esa línea es una redirección, como <code>HTTP/1.1 308 Permanent Redirect<\/code>, en lugar de <code>200 OK<\/code>. El dominio especial <code>example.com<\/code> no redirige, así que dirigir la misma petición allí imprime un <code>HTTP/1.1 200 OK<\/code> sin más.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dos detalles importan al hablar con servidores.<\/span> <span class=\"sg\" data-s=\"1\">Primero, los protocolos de red suelen separar las líneas con <code>\\r\\n<\/code> (retorno de carro más salto de línea), no con un <code>\\n<\/code> a secas, y por eso la petición se escribe con <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Segundo, <code>.recv<\/code> devuelve los datos que hayan llegado hasta el momento; para respuestas más grandes lees en un bucle hasta que la conexión se cierra.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Enviar bytes y recibir bytes es todo lo que un socket hace en realidad.<\/span> <span class=\"sg\" data-s=\"1\">Todo lo demás — HTTP y las herramientas de más alto nivel de las secciones siguientes — está construido sobre este sencillo enviar y recibir.<\/span><\/p>"]]},"it":{"t":"Inviare e ricevere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una volta che un socket è aperto, ci scambi dati attraverso.<\/span> <span class=\"sg\" data-s=\"1\">Invia testo con <code>.print<\/code> e leggi ciò che torna con <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo invia una richiesta HTTP minima e legge la risposta del server in <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La prima riga di una risposta da un server web è la sua riga di stato.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questo esempio ha bisogno di una connessione di rete funzionante. Quando gira, stampa la riga di stato della risposta. Poiché <code>raku.org<\/code> reindirizza l'HTTP semplice al sito sicuro HTTPS, quella riga è un reindirizzamento, come <code>HTTP/1.1 308 Permanent Redirect<\/code>, invece di <code>200 OK<\/code>. Il dominio speciale <code>example.com<\/code> non reindirizza, quindi puntare la stessa richiesta là stampa un semplice <code>HTTP/1.1 200 OK<\/code>.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nel parlare con i server contano due dettagli.<\/span> <span class=\"sg\" data-s=\"1\">Primo, i protocolli di rete separano di solito le righe con <code>\\r\\n<\/code> (ritorno carrello più a capo), non con un semplice <code>\\n<\/code>, ed è per questo che la richiesta è scritta con <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Secondo, <code>.recv<\/code> restituisce i dati arrivati fino a quel momento; per risposte più grandi leggi in un ciclo finché la connessione non si chiude.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inviare byte e ricevere byte è tutto ciò che un socket fa davvero.<\/span> <span class=\"sg\" data-s=\"1\">Tutto il resto — HTTP e gli strumenti di livello più alto delle sezioni che vengono — è costruito sopra questo semplice inviare e ricevere.<\/span><\/p>"]]},"lv":{"t":"Sūtīšana un saņemšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tiklīdz ligzda ir atvērta, caur to apmainās ar datiem.<\/span> <span class=\"sg\" data-s=\"1\">Tekstu sūtiet ar <code>.print<\/code> un nolasiet atnākušo ar <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas nosūta minimālu HTTP pieprasījumu un nolasa servera atbildi mainīgajā <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tīmekļa servera atbildes pirmā rinda ir tā statusa rinda.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Šim piemēram vajadzīgs tīkla savienojums. Palaists tas izdrukā atbildes statusa rindu. Tā kā <code>raku.org<\/code> parasto HTTP pāradresē uz drošo HTTPS vietni, šī rinda ir pāradresācija, piemēram, <code>HTTP/1.1 308 Permanent Redirect<\/code>, nevis <code>200 OK<\/code>. Īpašais domēns <code>example.com<\/code> nepāradresē, tāpēc, sūtot to pašu pieprasījumu turp, izdrukājas vienkāršs <code>HTTP/1.1 200 OK<\/code>.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sarunājoties ar serveriem, svarīgas ir divas detaļas.<\/span> <span class=\"sg\" data-s=\"1\">Pirmkārt, tīkla protokoli rindas parasti atdala ar <code>\\r\\n<\/code> (rakstatgriezi plus jaunrindu), nevis ar vienkāršu <code>\\n<\/code>, un tieši tāpēc pieprasījums ir rakstīts ar <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Otrkārt, <code>.recv<\/code> atgriež tos datus, kas līdz šim ir pienākuši; lielākām atbildēm jālasa ciklā, līdz savienojums aizveras.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Baitu sūtīšana un baitu saņemšana ir viss, ko ligzda patiesībā dara.<\/span> <span class=\"sg\" data-s=\"1\">Viss pārējais — HTTP un augstāka līmeņa rīki turpmākajās sadaļās — ir uzbūvēts virs šīs vienkāršās sūtīšanas un saņemšanas.<\/span><\/p>"]]},"ru":{"t":"Отправка и получение","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда сокет открыт, через него обмениваются данными.<\/span> <span class=\"sg\" data-s=\"1\">Текст отправляют методом <code>.print<\/code>, а читают ответ методом <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь отправляется минимальный HTTP-запрос, а ответ сервера читается в <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Первая строка ответа веб-сервера — его строка состояния.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этому примеру нужно действующее сетевое соединение. При запуске он печатает строку состояния ответа. Поскольку <code>raku.org<\/code> перенаправляет обычный HTTP на защищённый HTTPS-сайт, это будет строка перенаправления, например <code>HTTP/1.1 308 Permanent Redirect<\/code>, а не <code>200 OK<\/code>. Специальный домен <code>example.com<\/code> перенаправлений не делает, поэтому тот же запрос к нему напечатает обычное <code>HTTP/1.1 200 OK<\/code>.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">При общении с серверами важны две детали.<\/span> <span class=\"sg\" data-s=\"1\">Во-первых, сетевые протоколы обычно разделяют строки последовательностью <code>\\r\\n<\/code> (возврат каретки плюс перевод строки), а не одним <code>\\n<\/code>, — поэтому запрос и записан с <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Во-вторых, <code>.recv<\/code> возвращает те данные, что пришли к этому моменту; для больших ответов читают в цикле, пока соединение не закроется.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отправка и приём байтов — это всё, что на самом деле делает сокет.<\/span> <span class=\"sg\" data-s=\"1\">Всё остальное — и HTTP, и более высокоуровневые инструменты из следующих разделов — построено поверх этой простой пары «отправить и получить».<\/span><\/p>"]]},"uk":{"t":"Надсилання та отримання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щойно сокет відкрито, ви обмінюєтеся через нього даними.<\/span> <span class=\"sg\" data-s=\"1\">Надсилайте текст через <code>.print<\/code>, а читайте те, що приходить назад, через <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це надсилає мінімальний HTTP-запит і читає відповідь сервера в <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Першим рядком відповіді вебсервера є його рядок стану.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цьому прикладові потрібне робоче мережеве з'єднання. Коли його запустити, він друкує рядок стану відповіді. Оскільки <code>raku.org<\/code> перенаправляє звичайний HTTP на захищений HTTPS-сайт, цим рядком є перенаправлення, як-от <code>HTTP/1.1 308 Permanent Redirect<\/code>, а не <code>200 OK<\/code>. Особливий домен <code>example.com<\/code> не перенаправляє, тож той самий запит, спрямований туди, надрукує звичайне <code>HTTP/1.1 200 OK<\/code>.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Спілкуючись із серверами, важливо пам'ятати дві деталі.<\/span> <span class=\"sg\" data-s=\"1\">По-перше, мережеві протоколи зазвичай розділяють рядки через <code>\\r\\n<\/code> (повернення каретки плюс новий рядок), а не простим <code>\\n<\/code>, — саме тому запит записано з <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По-друге, <code>.recv<\/code> повертає ті дані, що надійшли на цю мить; для більших відповідей ви читаєте в циклі, аж поки з'єднання не закриється.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Надсилання байтів і отримання байтів — це все, що сокет насправді робить.<\/span> <span class=\"sg\" data-s=\"1\">Усе інше — HTTP та вищерівневі засоби з наступних розділів — збудовано поверх цього простого «надішли й отримай».<\/span><\/p>"]]},"bg":{"t":"Изпращане и получаване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щом сокетът е отворен, вие обменяте данни през него.<\/span> <span class=\"sg\" data-s=\"1\">Изпращайте текст с <code>.print<\/code>, а четете онова, което се връща, с <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това изпраща минимална HTTP заявка и прочита отговора на сървъра в <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Първият ред от отговора на уеб сървър е неговият ред за състояние.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Този пример се нуждае от работеща мрежова връзка. При изпълнение той отпечатва реда за състояние на отговора. Понеже <code>raku.org<\/code> пренасочва обикновения HTTP към защитения HTTPS сайт, този ред е пренасочване, например <code>HTTP/1.1 308 Permanent Redirect<\/code>, а не <code>200 OK<\/code>. Специалният домейн <code>example.com<\/code> не пренасочва, така че същата заявка, насочена натам, отпечатва обикновено <code>HTTP/1.1 200 OK<\/code>.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">При говоренето със сървъри значение имат две подробности.<\/span> <span class=\"sg\" data-s=\"1\">Първо, мрежовите протоколи обикновено разделят редовете с <code>\\r\\n<\/code> (връщане на каретката плюс нов ред), а не с обикновено <code>\\n<\/code> — затова заявката е записана с <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Второ, <code>.recv<\/code> връща онези данни, които са пристигнали дотук; за по-големи отговори четете в цикъл, докато връзката не се затвори.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изпращането на байтове и получаването на байтове е всичко, което сокетът всъщност прави.<\/span> <span class=\"sg\" data-s=\"1\">Всичко останало — HTTP и по-високоравнищните средства от следващите раздели — е изградено върху това просто „изпрати и получи“.<\/span><\/p>"]]},"eo":{"t":"Sendi kaj ricevi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Post kiam kontaktskatolo estas malfermita, vi interŝanĝas datumojn tra ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Sendu tekston per <code>.print<\/code> kaj legu tion, kio revenas, per <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio sendas minimuman HTTP-peton kaj legas la respondon de la servilo en <code>$response<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La unua linio de respondo de retservilo estas ĝia statusa linio.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzemplo bezonas funkciantan retan konekton. Plenumite, ĝi presas la statusan linion de la respondo. Ĉar <code>raku.org<\/code> alidirektas simplan HTTP al la sekura HTTPS-retejo, tiu linio estas alidirekto, kiel <code>HTTP/1.1 308 Permanent Redirect<\/code>, prefere ol <code>200 OK<\/code>. La speciala domajno <code>example.com<\/code> ne alidirektas, do celi la saman peton tien presas simplan <code>HTTP/1.1 200 OK<\/code> anstataŭe.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du detaloj gravas, kiam vi parolas kun serviloj.<\/span> <span class=\"sg\" data-s=\"1\">Unue, retaj protokoloj kutime apartigas liniojn per <code>\\r\\n<\/code> (ĉaretreveno plus novlinio), ne per simpla <code>\\n<\/code>, kaj tial la peto estas skribita per <code>\\r\\n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Due, <code>.recv<\/code> redonas kiujn ajn datumojn alvenis ĝis nun; por pli grandaj respondoj vi legas en buklo, ĝis la konekto fermiĝas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sendi bajtojn kaj ricevi bajtojn estas ĉio, kion kontaktskatolo vere faras.<\/span> <span class=\"sg\" data-s=\"1\">Ĉio alia — HTTP kaj la pli altnivelaj iloj en la venontaj sekcioj — estas konstruita sur ĉi tiu simpla sendo-kaj-ricevo.<\/span><\/p>"]]},"la":{"t":"Mittere et accipere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Simul atque foramen apertum est, data per illud permutas.<\/span> <span class=\"sg\" data-s=\"1\">Mitte textum per <code>.print<\/code>, et lege quod redit per <code>.recv<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\n\n$conn.print(\"GET / HTTP/1.0\\r\\nHost: raku.org\\r\\n\\r\\n\");\nmy $response = $conn.recv;\n\n$conn.close;\nsay $response.lines.first;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc petitionem HTTP minimam mittit et responsum servitoris in <code>$response<\/code> legit.<\/span> <span class=\"sg\" data-s=\"1\">Prima linea responsi a servitore retiali linea status eius est.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Hoc exemplum coniunctione retiali eget. Cum curritur, lineam status responsi imprimit. Quia <code>raku.org<\/code> HTTP simplex ad sedem securam HTTPS redirigit, illa linea redirectio est, ut <code>HTTP/1.1 308 Permanent Redirect<\/code>, potius quam <code>200 OK<\/code>. Dominium speciale <code>example.com<\/code> non redirigit, itaque eandem petitionem illuc dirigere simplex <code>HTTP/1.1 200 OK<\/code> imprimit.<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Duae res in colloquio cum servitoribus referunt.<\/span> <span class=\"sg\" data-s=\"1\">Primum, protocolla retialia lineas plerumque per <code>\\r\\n<\/code> (reditum carri cum linea nova) separant, non per simplex <code>\\n<\/code>, quapropter petitio cum <code>\\r\\n<\/code> scribitur.<\/span> <span class=\"sg\" data-s=\"2\">Secundum, <code>.recv<\/code> reddit quaecumque data hactenus advenerunt; pro responsis maioribus in anulo legis donec coniunctio claudatur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bytes mittere et bytes accipere est omne quod foramen re vera agit.<\/span> <span class=\"sg\" data-s=\"1\">Cetera omnia — HTTP, et instrumenta superioris gradus in sectionibus venientibus — super hoc simplex mittere-et-accipere aedificata sunt.<\/span><\/p>"]]}}}</script>
