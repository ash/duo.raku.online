<script type="application/json" id="page-data">{"u":"paradigms/connections/opening-a-socket","n":1381,"k":"topic","pv":"paradigms/connections","nx":"paradigms/connections/opening-a-socket/quiz","tr":["paradigms","paradigms/connections"],"L":{"en":{"t":"Opening a socket","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>socket<\/em> is a connection between two programs over a network.<\/span> <span class=\"sg\" data-s=\"1\">Raku’s core class for TCP sockets is <code>IO::Socket::INET<\/code>, and you need nothing extra installed to use it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To connect to a remote server, create a socket with the host and port you want to reach:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> opens the connection straight away.<\/span> <span class=\"sg\" data-s=\"1\">Port <code>80<\/code> is the standard port for HTTP, so this connects to the web server at <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">When you are finished, <code>.close<\/code> releases the connection.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">This example needs a working network connection to run. When it connects successfully it prints <code>connected<\/code>.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The same class is used in two modes: as a <strong>client<\/strong>, connecting out to a server as shown here, and as a <strong>server<\/strong>, listening for connections coming in (which you will see later).<\/span> <span class=\"sg\" data-s=\"1\">For now, the idea to take away is that <code>IO::Socket::INET.new(:host, :port)<\/code> gives you a live two-way channel to another machine.<\/span><\/p>"]]},"de":{"t":"Einen Socket öffnen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Socket<\/em> ist eine Verbindung zwischen zwei Programmen über ein Netz.<\/span> <span class=\"sg\" data-s=\"1\">Rakus Kernklasse für TCP-Sockets ist <code>IO::Socket::INET<\/code>, und Sie brauchen nichts zusätzlich installiert, um sie zu verwenden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um sich mit einem entfernten Server zu verbinden, erzeugen Sie einen Socket mit dem Host und dem Port, den Sie erreichen möchten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> öffnet die Verbindung unverzüglich.<\/span> <span class=\"sg\" data-s=\"1\">Port <code>80<\/code> ist der übliche Port für HTTP, das verbindet also mit dem Webserver auf <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie fertig sind, gibt <code>.close<\/code> die Verbindung frei.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dieses Beispiel braucht eine funktionierende Netzverbindung, um zu laufen. Gelingt die Verbindung, gibt es <code>connected<\/code> aus.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieselbe Klasse wird auf zwei Weisen verwendet: als <strong>Client<\/strong>, der wie hier zu einem Server hinauswählt, und als <strong>Server<\/strong>, der auf hereinkommende Verbindungen lauscht (was Sie später sehen).<\/span> <span class=\"sg\" data-s=\"1\">Für den Augenblick ist der Gedanke, dass <code>IO::Socket::INET.new(:host, :port)<\/code> Ihnen einen lebendigen Zweiwegkanal zu einer anderen Maschine gibt.<\/span><\/p>"]]},"nl":{"t":"Een socket openen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>socket<\/em> is een verbinding tussen twee programma's over een netwerk.<\/span> <span class=\"sg\" data-s=\"1\">Raku's kernklasse voor TCP-sockets is <code>IO::Socket::INET<\/code>, en je hoeft niets extra's te installeren om haar te gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om verbinding met een server op afstand te maken, maak je een socket met de host en poort die je wilt bereiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> opent de verbinding meteen.<\/span> <span class=\"sg\" data-s=\"1\">Poort <code>80<\/code> is de standaardpoort voor HTTP, dus dit maakt verbinding met de webserver op <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer je klaar bent, geeft <code>.close<\/code> de verbinding vrij.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dit voorbeeld heeft een werkende netwerkverbinding nodig om te draaien. Wanneer de verbinding lukt, drukt het <code>connected<\/code> af.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dezelfde klasse wordt in twee modi gebruikt: als <strong>client<\/strong>, die zoals hier naar een server uitbelt, en als <strong>server<\/strong>, die op binnenkomende verbindingen luistert (wat je later ziet).<\/span> <span class=\"sg\" data-s=\"1\">Voor nu is het idee om te onthouden dat <code>IO::Socket::INET.new(:host, :port)<\/code> je een levend tweewegkanaal naar een andere machine geeft.<\/span><\/p>"]]},"es":{"t":"Abrir un socket","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>socket<\/em> es una conexión entre dos programas a través de una red.<\/span> <span class=\"sg\" data-s=\"1\">La clase básica de Raku para sockets TCP es <code>IO::Socket::INET<\/code>, y no necesitas instalar nada más para usarla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para conectarte a un servidor remoto, crea un socket con el host y el puerto a los que quieres llegar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> abre la conexión de inmediato.<\/span> <span class=\"sg\" data-s=\"1\">El puerto <code>80<\/code> es el puerto estándar de HTTP, así que esto conecta con el servidor web de <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cuando hayas terminado, <code>.close<\/code> libera la conexión.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Este ejemplo necesita una conexión de red que funcione. Cuando conecta con éxito, imprime <code>connected<\/code>.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La misma clase se usa en dos modos: como <strong>cliente<\/strong>, conectando hacia un servidor como se muestra aquí, y como <strong>servidor<\/strong>, escuchando las conexiones que llegan (cosa que verás más adelante).<\/span> <span class=\"sg\" data-s=\"1\">Por ahora, la idea que hay que llevarse es que <code>IO::Socket::INET.new(:host, :port)<\/code> te da un canal vivo de dos direcciones hacia otra máquina.<\/span><\/p>"]]},"it":{"t":"Aprire un socket","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>socket<\/em> è una connessione fra due programmi attraverso una rete.<\/span> <span class=\"sg\" data-s=\"1\">La classe di base di Raku per i socket TCP è <code>IO::Socket::INET<\/code>, e per usarla non serve installare nulla in più.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per connetterti a un server remoto, crea un socket con l'host e la porta che vuoi raggiungere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> apre la connessione all'istante.<\/span> <span class=\"sg\" data-s=\"1\">La porta <code>80<\/code> è la porta standard per HTTP, quindi questo si connette al server web di <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quando hai finito, <code>.close<\/code> rilascia la connessione.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questo esempio ha bisogno di una connessione di rete funzionante per girare. Quando si connette con successo stampa <code>connected<\/code>.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La stessa classe si usa in due modalità: come <strong>client<\/strong>, connettendosi verso un server come qui, e come <strong>server<\/strong>, restando in ascolto di connessioni in arrivo (cosa che vedrai più avanti).<\/span> <span class=\"sg\" data-s=\"1\">Per ora l'idea da portarsi via è che <code>IO::Socket::INET.new(:host, :port)<\/code> ti dà un canale a due vie vivo verso un'altra macchina.<\/span><\/p>"]]},"ru":{"t":"Открытие сокета","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сокет<\/em> — это соединение между двумя программами по сети.<\/span> <span class=\"sg\" data-s=\"1\">Основной класс Raku для TCP-сокетов — <code>IO::Socket::INET<\/code>, и ничего дополнительно устанавливать для него не нужно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы подключиться к удалённому серверу, создайте сокет с нужными хостом и портом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> открывает соединение немедленно.<\/span> <span class=\"sg\" data-s=\"1\">Порт <code>80<\/code> — стандартный порт для HTTP, поэтому здесь мы подключаемся к веб-серверу на <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когда работа закончена, <code>.close<\/code> освобождает соединение.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этому примеру для работы нужно действующее сетевое соединение. При успешном подключении он печатает <code>connected<\/code>.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Один и тот же класс используется в двух режимах: как <strong>клиент<\/strong>, подключающийся к серверу, — как показано здесь, — и как <strong>сервер<\/strong>, ожидающий входящих соединений (это вы увидите позже).<\/span> <span class=\"sg\" data-s=\"1\">Пока же главная мысль такова: <code>IO::Socket::INET.new(:host, :port)<\/code> даёт вам живой двусторонний канал к другой машине.<\/span><\/p>"]]},"uk":{"t":"Відкриття сокета","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сокет<\/em> — це з'єднання між двома програмами через мережу.<\/span> <span class=\"sg\" data-s=\"1\">Основним класом Raku для TCP-сокетів є <code>IO::Socket::INET<\/code>, і щоб ним скористатися, нічого додаткового встановлювати не треба.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб приєднатися до віддаленого сервера, створіть сокет із вузлом і портом, до яких хочете дістатися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> відкриває з'єднання одразу.<\/span> <span class=\"sg\" data-s=\"1\">Порт <code>80<\/code> є стандартним портом для HTTP, тож це приєднується до вебсервера на <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коли ви закінчили, <code>.close<\/code> вивільняє з'єднання.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цьому прикладові для запуску потрібне робоче мережеве з'єднання. Коли він успішно приєднується, він друкує <code>connected<\/code>.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Той самий клас використовують у двох режимах: як <strong>клієнт<\/strong>, що приєднується назовні до сервера, як показано тут, і як <strong>сервер<\/strong>, що слухає вхідні з'єднання (це ви побачите пізніше).<\/span> <span class=\"sg\" data-s=\"1\">Наразі ідея, яку варто винести, така: <code>IO::Socket::INET.new(:host, :port)<\/code> дає вам живий двобічний канал до іншої машини.<\/span><\/p>"]]},"bg":{"t":"Отваряне на сокет","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сокетът<\/em> е връзка между две програми през мрежа.<\/span> <span class=\"sg\" data-s=\"1\">Основният клас на Raku за TCP сокети е <code>IO::Socket::INET<\/code> и за да го използвате, не ви трябва нищо допълнително.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да се свържете с отдалечен сървър, създайте сокет с хоста и порта, до които искате да достигнете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $conn = IO::Socket::INET.new(:host('raku.org'), :port(80));\nsay 'connected';\n$conn.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IO::Socket::INET.new<\/code> отваря връзката веднага.<\/span> <span class=\"sg\" data-s=\"1\">Порт <code>80<\/code> е стандартният порт за HTTP, така че това се свързва с уеб сървъра на <code>raku.org<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когато приключите, <code>.close<\/code> освобождава връзката.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Този пример се нуждае от работеща мрежова връзка. Когато се свърже успешно, той отпечатва <code>connected<\/code>.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същият клас се използва в два режима: като <strong>клиент<\/strong>, който се свързва навън със сървър, както е показано тук, и като <strong>сървър<\/strong>, който слуша за входящи връзки (ще видите това по-късно).<\/span> <span class=\"sg\" data-s=\"1\">Засега идеята за отнасяне е, че <code>IO::Socket::INET.new(:host, :port)<\/code> ви дава жив двупосочен канал към друга машина.<\/span><\/p>"]]}}}</script>
