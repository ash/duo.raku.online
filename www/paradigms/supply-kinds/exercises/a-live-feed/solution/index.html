<script type="application/json" id="page-data">{"u":"paradigms/supply-kinds/exercises/a-live-feed/solution","n":1349,"k":"solution","pv":"paradigms/supply-kinds/exercises/a-live-feed","nx":"paradigms/supply-kinds/exercises/live-sum","tr":["paradigms","paradigms/supply-kinds"],"L":{"en":{"t":"The solution of ’Tuning in late‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>Supplier<\/code> is the sending end; its <code>.Supply<\/code> is what you tap. A live supply broadcasts only to the taps listening <strong>at the moment<\/strong> of each emission.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>emit(1)<\/code> happens before any tap exists, so it is lost — like tuning into a radio station after a song has played. Only <code>2<\/code> and <code>3<\/code>, emitted after the tap, are captured, giving <code>[2 3]<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zu spät eingeschaltet","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>Supplier<\/code> ist die Sendeseite; sein <code>.Supply<\/code> ist das, was Sie anzapfen. Ein Live-Supply sendet nur an die Zapfstellen, die <strong>im Augenblick<\/strong> jeder Aussendung zuhören.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>emit(1)<\/code> geschieht, bevor eine Zapfstelle besteht, es geht also verloren — wie das Einschalten eines Radiosenders, nachdem ein Lied gelaufen ist. Nur <code>2<\/code> und <code>3<\/code>, nach der Zapfstelle ausgesandt, werden eingefangen, was <code>[2 3]<\/code> ergibt.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Te laat afstemmen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>Supplier<\/code> is de verzendkant; zijn <code>.Supply<\/code> is wat je aftapt. Een live supply zendt alleen uit naar de taps die <strong>op het moment<\/strong> van elke uitzending luisteren.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>emit(1)<\/code> gebeurt voordat er een tap bestaat, dus gaat hij verloren — als afstemmen op een radiostation nadat een lied al gespeeld is. Alleen <code>2<\/code> en <code>3<\/code>, die na de tap uitgezonden zijn, worden opgevangen, wat <code>[2 3]<\/code> geeft.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Conectarse tarde","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>Supplier<\/code> es el extremo emisor; su <code>.Supply<\/code> es lo que enganchas. Un supply en vivo difunde solo a los enganches que escuchan <strong>en el momento<\/strong> de cada emisión.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>emit(1)<\/code> ocurre antes de que exista ningún enganche, así que se pierde, como sintonizar una emisora de radio después de que haya sonado una canción. Solo <code>2<\/code> y <code>3<\/code>, emitidos después del enganche, se capturan, dando <code>[2 3]<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Collegarsi in ritardo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il <code>Supplier<\/code> è l'estremità che invia; il suo <code>.Supply<\/code> è ciò a cui attingi. Un supply dal vivo trasmette solo alle prese in ascolto <strong>nel momento<\/strong> di ogni emissione.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'<code>emit(1)<\/code> avviene prima che esista una qualunque presa, quindi va perduto — come sintonizzarsi su una stazione radio dopo che una canzone è già passata. Solo <code>2<\/code> e <code>3<\/code>, emessi dopo la presa, vengono catturati, dando <code>[2 3]<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Позднее подключение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Supplier<\/code> — это передающая сторона, а подключаются к его <code>.Supply<\/code>. Живой supply вещает только тем подключениям, которые слушают <strong>в момент<\/strong> каждой выдачи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>emit(1)<\/code> происходит до того, как появилось хоть одно подключение, поэтому это значение потеряно — как если включить радиостанцию после того, как песня уже отзвучала. Перехвачены только <code>2<\/code> и <code>3<\/code>, выданные после подключения, что даёт <code>[2 3]<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Ввімкнутися пізно»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Supplier<\/code> є стороною надсилання; підключаються до його <code>.Supply<\/code>. Живий потік транслює лише тим підключенням, що слухають <strong>у мить<\/strong> кожної видачі.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>emit(1)<\/code> стається до того, як з'явилося бодай одне підключення, тож його втрачено — як увімкнути радіостанцію після того, як пісня вже відіграла. Захоплено лише <code>2<\/code> та <code>3<\/code>, видані після підключення, що дає <code>[2 3]<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Включване със закъснение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\n\nmy @got;\n$supplier.emit(1);\n$supplier.Supply.tap(-&gt; $v { @got.push($v) });\n$supplier.emit(2);\n$supplier.emit(3);\n\nsay @got;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/supply-kinds/a-live-feed.raku\" target=\"_blank\" rel=\"noopener\">a-live-feed.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[2 3]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Supplier<\/code> е изпращащата страна; включвате се към неговия <code>.Supply<\/code>. Живият поток излъчва само към онези включвания, които слушат <strong>в мига<\/strong> на всяко подаване.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>emit(1)<\/code> се случва, преди изобщо да съществува включване, така че то се губи — както да пуснете радиостанция, след като песента вече е свирила. Уловени са само <code>2<\/code> и <code>3<\/code>, подадени след включването, което дава <code>[2 3]<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
