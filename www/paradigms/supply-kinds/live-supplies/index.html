<script type="application/json" id="page-data">{"u":"paradigms/supply-kinds/live-supplies","n":1343,"k":"topic","pv":"paradigms/supply-kinds/on-demand-supplies/quiz","nx":"paradigms/supply-kinds/live-in-action","tr":["paradigms","paradigms/supply-kinds"],"L":{"en":{"t":"Live supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>live<\/em> supply broadcasts values as they occur to whatever taps are listening <strong>at that moment<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">You create one with a <code>Supplier<\/code>: the supplier is the sending end, and its <code>.Supply<\/code> is the receiving end that others tap.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here <code>.emit<\/code> pushes a value into the live supply, and every current tap receives it.<\/span> <span class=\"sg\" data-s=\"1\">The tap was in place before the emissions, so it captured both values.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The crucial difference from an on-demand supply is timing: a live supply does <strong>not<\/strong> remember past values.<\/span> <span class=\"sg\" data-s=\"1\">A tap added after an <code>emit<\/code> would miss whatever was emitted before it subscribed.<\/span> <span class=\"sg\" data-s=\"2\">Live supplies are the right model for real events — clicks, messages, sensor readings — where “what is happening now” matters and the past is gone.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In short: use an on-demand supply to replay a fixed sequence to each subscriber, and a live supply (via a <code>Supplier<\/code>) to broadcast events as they happen.<\/span><\/p>"]]},"de":{"t":"Live-Supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Live<\/em>-Supply sendet Werte, sobald sie auftreten, an die Zapfstellen, die <strong>in diesem Augenblick<\/strong> zuhören.<\/span> <span class=\"sg\" data-s=\"1\">Sie erzeugen eines mit einem <code>Supplier<\/code>: Der Supplier ist die Sendeseite, und sein <code>.Supply<\/code> ist die Empfangsseite, die andere anzapfen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier schiebt <code>.emit<\/code> einen Wert in das Live-Supply, und jede derzeitige Zapfstelle erhält ihn.<\/span> <span class=\"sg\" data-s=\"1\">Die Zapfstelle war vor den Aussendungen da, sie hat also beide Werte eingefangen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der entscheidende Unterschied zu einem On-demand-Supply ist die Zeit: Ein Live-Supply erinnert sich <strong>nicht<\/strong> an vergangene Werte.<\/span> <span class=\"sg\" data-s=\"1\">Eine nach einem <code>emit<\/code> hinzugefügte Zapfstelle verpasste alles, was vor ihrem Abonnement ausgesandt wurde.<\/span> <span class=\"sg\" data-s=\"2\">Live-Supplies sind das richtige Modell für echte Ereignisse — Klicks, Nachrichten, Sensormesswerte —, bei denen „was gerade geschieht“ zählt und die Vergangenheit vorbei ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kurz: Nehmen Sie ein On-demand-Supply, um jedem Abonnenten eine feste Folge erneut abzuspielen, und ein Live-Supply (über einen <code>Supplier<\/code>), um Ereignisse zu senden, sobald sie geschehen.<\/span><\/p>"]]},"nl":{"t":"Live supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>live<\/em> supply zendt waarden zodra ze optreden uit naar de taps die <strong>op dat moment<\/strong> luisteren.<\/span> <span class=\"sg\" data-s=\"1\">Je maakt er een met een <code>Supplier<\/code>: de supplier is de verzendkant, en zijn <code>.Supply<\/code> is de ontvangstkant die anderen aftappen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier duwt <code>.emit<\/code> een waarde de live supply in, en elke huidige tap ontvangt haar.<\/span> <span class=\"sg\" data-s=\"1\">De tap zat er vóór de uitzendingen, dus ving hij beide waarden op.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het cruciale verschil met een on-demand-supply is timing: een live supply onthoudt <strong>geen<\/strong> eerdere waarden.<\/span> <span class=\"sg\" data-s=\"1\">Een tap die na een <code>emit<\/code> toegevoegd wordt, zou missen wat vóór zijn abonnement uitgezonden is.<\/span> <span class=\"sg\" data-s=\"2\">Live supplies zijn het juiste model voor echte gebeurtenissen — kliks, berichten, sensormetingen — waar \"wat er nu gebeurt\" ertoe doet en het verleden weg is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kort gezegd: gebruik een on-demand-supply om een vaste reeks voor elke abonnee opnieuw af te spelen, en een live supply (via een <code>Supplier<\/code>) om gebeurtenissen uit te zenden zodra ze gebeuren.<\/span><\/p>"]]},"es":{"t":"Supplies en vivo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply <em>en vivo<\/em> difunde los valores según ocurren a los enganches que estén escuchando <strong>en ese momento<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Creas uno con un <code>Supplier<\/code>: el supplier es el extremo emisor, y su <code>.Supply<\/code> es el extremo receptor que otros enganchan.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>.emit<\/code> empuja un valor al supply en vivo, y todos los enganches actuales lo reciben.<\/span> <span class=\"sg\" data-s=\"1\">El enganche estaba puesto antes de las emisiones, así que capturó ambos valores.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La diferencia crucial respecto de un supply bajo demanda es el momento: un supply en vivo <strong>no<\/strong> recuerda los valores pasados.<\/span> <span class=\"sg\" data-s=\"1\">Un enganche añadido después de un <code>emit<\/code> se perdería lo que se emitiera antes de suscribirse.<\/span> <span class=\"sg\" data-s=\"2\">Los supplies en vivo son el modelo adecuado para eventos reales — clics, mensajes, lecturas de sensores — donde importa «lo que está pasando ahora» y el pasado ya no está.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En resumen: usa un supply bajo demanda para reproducir una secuencia fija a cada suscriptor, y un supply en vivo (mediante un <code>Supplier<\/code>) para difundir eventos según ocurren.<\/span><\/p>"]]},"it":{"t":"Supply live","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply <em>dal vivo<\/em> trasmette i valori man mano che accadono a qualunque presa sia in ascolto <strong>in quel momento<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ne crei uno con un <code>Supplier<\/code>: il supplier è l'estremità che invia, e il suo <code>.Supply<\/code> è l'estremità che riceve, a cui gli altri attingono.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>.emit<\/code> spinge un valore nel supply dal vivo, e ogni presa attuale lo riceve.<\/span> <span class=\"sg\" data-s=\"1\">La presa era già al suo posto prima delle emissioni, quindi ha catturato entrambi i valori.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La differenza cruciale rispetto a un supply su richiesta è il tempismo: un supply dal vivo <strong>non<\/strong> ricorda i valori passati.<\/span> <span class=\"sg\" data-s=\"1\">Una presa aggiunta dopo un <code>emit<\/code> si perderebbe tutto ciò che è stato emesso prima che si abbonasse.<\/span> <span class=\"sg\" data-s=\"2\">I supply dal vivo sono il modello giusto per gli eventi veri — clic, messaggi, letture di sensori — dove conta «ciò che sta accadendo ora» e il passato è andato.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In breve: usa un supply su richiesta per riproporre una sequenza fissa a ogni abbonato, e un supply dal vivo (attraverso un <code>Supplier<\/code>) per trasmettere gli eventi man mano che accadono.<\/span><\/p>"]]},"ru":{"t":"Живые supply","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Живой<\/em> supply транслирует значения по мере их появления тем подключениям, которые слушают <strong>в этот момент<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Создают его с помощью <code>Supplier<\/code>: поставщик — это передающая сторона, а его <code>.Supply<\/code> — принимающая, к которой подключаются другие.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>.emit<\/code> проталкивает значение в живой supply, и его получает каждое текущее подключение.<\/span> <span class=\"sg\" data-s=\"1\">Подключение существовало до выдачи значений, поэтому оно перехватило оба.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Принципиальное отличие от supply по требованию — во времени: живой supply <strong>не<\/strong> помнит прошлых значений.<\/span> <span class=\"sg\" data-s=\"1\">Подключение, добавленное после <code>emit<\/code>, пропустило бы всё, что было выдано до его подписки.<\/span> <span class=\"sg\" data-s=\"2\">Живые supply — правильная модель для настоящих событий: щелчков мыши, сообщений, показаний датчиков, — где важно «что происходит сейчас», а прошлое уже ушло.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коротко: supply по требованию нужен, чтобы проигрывать фиксированную последовательность каждому подписчику, а живой supply (через <code>Supplier<\/code>) — чтобы транслировать события по мере их наступления.<\/span><\/p>"]]},"uk":{"t":"Живі потоки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Живий<\/em> потік транслює значення в міру їх настання тим підключенням, що слухають <strong>у цю мить<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Створюють його за допомогою <code>Supplier<\/code>: постачальник є стороною надсилання, а його <code>.Supply<\/code> — стороною отримання, до якої підключаються інші.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>.emit<\/code> штовхає значення в живий потік, і кожне наявне підключення його отримує.<\/span> <span class=\"sg\" data-s=\"1\">Підключення було на місці ще до видач, тож воно захопило обидва значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вирішальна відмінність від потоку на вимогу — це час: живий потік <strong>не<\/strong> пам'ятає минулих значень.<\/span> <span class=\"sg\" data-s=\"1\">Підключення, додане після <code>emit<\/code>, пропустило б усе, що видали до його підписки.<\/span> <span class=\"sg\" data-s=\"2\">Живі потоки — правильна модель для справжніх подій (клацань, повідомлень, показів давачів), де важливо «що відбувається зараз», а минуле вже минуло.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коротко: використовуйте потік на вимогу, щоб програти фіксовану послідовність кожному підписникові, і живий потік (через <code>Supplier<\/code>), щоб транслювати події в міру їх настання.<\/span><\/p>"]]},"bg":{"t":"Живи потоци","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Живият<\/em> поток излъчва стойностите в момента на случването им към онези включвания, които слушат <strong>в този миг<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Създавате такъв с <code>Supplier<\/code>: доставчикът е изпращащата страна, а неговият <code>.Supply<\/code> е приемащата страна, към която се включват другите.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $supply   = $supplier.Supply;\n\nmy @got;\n$supply.tap(-&gt; $v { @got.push($v) });\n\n$supplier.emit(1);\n$supplier.emit(2);\n\nsay @got; # [1 2]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>.emit<\/code> тласка стойност в живия поток и всяко текущо включване я получава.<\/span> <span class=\"sg\" data-s=\"1\">Включването беше налице преди подаванията, така че то улови и двете стойности.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Решаващата разлика спрямо потока при поискване е времето: живият поток <strong>не<\/strong> помни минали стойности.<\/span> <span class=\"sg\" data-s=\"1\">Включване, добавено след <code>emit<\/code>, би пропуснало всичко, подадено преди абонирането му.<\/span> <span class=\"sg\" data-s=\"2\">Живите потоци са правилният модел за истински събития — щраквания, съобщения, показания на датчици, — където има значение „какво се случва сега“, а миналото е отминало.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Накратко: използвайте поток при поискване, за да пуснете фиксирана последователност на всеки абонат, и жив поток (чрез <code>Supplier<\/code>), за да излъчвате събития в момента на случването им.<\/span><\/p>"]]}}}</script>
