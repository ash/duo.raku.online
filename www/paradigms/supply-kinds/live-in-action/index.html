<script type="application/json" id="page-data">{"u":"paradigms/supply-kinds/live-in-action","n":1344,"k":"topic","pv":"paradigms/supply-kinds/live-supplies","nx":"paradigms/supply-kinds/exercises","tr":["paradigms","paradigms/supply-kinds"],"L":{"en":{"t":"Live supplies in action","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Because a live supply broadcasts to whatever taps are listening at the moment, several listeners can follow the same stream at once — and each is free to join or leave whenever it likes.<\/span> <span class=\"sg\" data-s=\"1\">Here two listeners watch a stream of events: a <code>log<\/code> that records everything, and an <code>alert<\/code> that joins later and leaves earlier.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # first listener joins\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # a second listener joins\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # the first listener leaves\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The lifecycle of the two taps lines up like this — 🟢 marks a tap joining, 🔴 a tap leaving, and ✅ each value a tap actually receives:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Step<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 joins<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 joins<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 leaves<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A blank cell means that tap was not listening when the value went out.<\/span> <span class=\"sg\" data-s=\"1\">Follow the timeline:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> returns a **<code>Tap<\/code> object** — the handle you keep to control that one subscription.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> is emitted while only <code>log<\/code> is listening, so only <code>log<\/code> sees it. This is the live-supply rule again: <code>alert<\/code> joined <em>after<\/em> <code>start<\/code>, and a live supply does not replay the past, so <code>alert<\/code> never sees it.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> and <code>all clear<\/code> are emitted while <strong>both<\/strong> are tapped, so each value reaches both — in the order the taps subscribed, <code>log<\/code> first, then <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Calling <code>$log.close<\/code> <strong>leaves<\/strong> the supply. From then on <code>log<\/code> receives nothing, so the final <code>stop<\/code> reaches only <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Two things to take away.<\/span> <span class=\"sg\" data-s=\"1\">First, a single live supply can fan out to many independent taps at once.<\/span> <span class=\"sg\" data-s=\"2\">Second, each tap is its own subscription with its own lifetime: hold on to the <code>Tap<\/code> object that <code>.tap<\/code> returns, and you can end that one listener with <code>.close<\/code> without disturbing the others.<\/span><\/p>"]]},"de":{"t":"Live-Supplies in Aktion","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Da ein Live-Supply an die gerade zuhörenden Zapfstellen sendet, können mehrere Zuhörer demselben Strom zugleich folgen — und jeder darf beliebig ein- oder aussteigen.<\/span> <span class=\"sg\" data-s=\"1\">Hier beobachten zwei Zuhörer einen Strom von Ereignissen: ein <code>log<\/code>, das alles festhält, und ein <code>alert<\/code>, das später einsteigt und früher geht.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # first listener joins\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # a second listener joins\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # the first listener leaves\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt aus:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Lebenslauf der beiden Zapfstellen sieht so aus — 🟢 kennzeichnet einen Einstieg, 🔴 einen Ausstieg und ✅ jeden Wert, den eine Zapfstelle tatsächlich erhält:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Schritt<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 steigt ein<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 steigt ein<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 geht<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine leere Zelle bedeutet, dass diese Zapfstelle nicht zuhörte, als der Wert hinausging.<\/span> <span class=\"sg\" data-s=\"1\">Folgen Sie dem Zeitverlauf:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> liefert ein **<code>Tap<\/code>-Objekt** — den Griff, den Sie behalten, um genau dieses Abonnement zu steuern.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> wird ausgesandt, während nur <code>log<\/code> zuhört, nur <code>log<\/code> sieht es also. Das ist wieder die Regel des Live-Supply: <code>alert<\/code> stieg <em>nach<\/em> <code>start<\/code> ein, und ein Live-Supply spielt die Vergangenheit nicht erneut ab, <code>alert<\/code> sieht es also nie.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> und <code>all clear<\/code> werden ausgesandt, während <strong>beide<\/strong> angezapft haben, jeder Wert erreicht also beide — in der Reihenfolge, in der die Zapfstellen abonniert haben, erst <code>log<\/code>, dann <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>$log.close<\/code> aufzurufen <strong>verlässt<\/strong> das Supply. Von da an erhält <code>log<\/code> nichts mehr, das abschließende <code>stop<\/code> erreicht also nur <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zweierlei bleibt festzuhalten.<\/span> <span class=\"sg\" data-s=\"1\">Erstens kann ein einzelnes Live-Supply zugleich an viele unabhängige Zapfstellen ausfächern.<\/span> <span class=\"sg\" data-s=\"2\">Zweitens ist jede Zapfstelle ein eigenes Abonnement mit eigener Lebensdauer: Halten Sie das <code>Tap<\/code>-Objekt fest, das <code>.tap<\/code> liefert, und Sie können diesen einen Zuhörer mit <code>.close<\/code> beenden, ohne die anderen zu stören.<\/span><\/p>"]]},"nl":{"t":"Live supplies in actie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat een live supply uitzendt naar welke taps op dat moment ook luisteren, kunnen meerdere luisteraars dezelfde stroom tegelijk volgen — en elk mag naar believen in- of uitstappen.<\/span> <span class=\"sg\" data-s=\"1\">Hier bekijken twee luisteraars een stroom gebeurtenissen: een <code>log<\/code> die alles vastlegt, en een <code>alert<\/code> die later instapt en eerder vertrekt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # first listener joins\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # a second listener joins\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # the first listener leaves\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De levensloop van de twee taps ziet er zo uit — 🟢 markeert een tap die instapt, 🔴 een tap die vertrekt, en ✅ elke waarde die een tap werkelijk ontvangt:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Stap<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 stapt in<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 stapt in<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 vertrekt<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een lege cel betekent dat die tap niet luisterde toen de waarde uitging.<\/span> <span class=\"sg\" data-s=\"1\">Volg de tijdlijn:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> geeft een **<code>Tap<\/code>-object** terug — de handgreep die je bewaart om dat ene abonnement te sturen.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> wordt uitgezonden terwijl alleen <code>log<\/code> luistert, dus alleen <code>log<\/code> ziet het. Dat is opnieuw de regel van de live supply: <code>alert<\/code> stapte <em>na<\/em> <code>start<\/code> in, en een live supply speelt het verleden niet opnieuw af, dus <code>alert<\/code> ziet het nooit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> en <code>all clear<\/code> worden uitgezonden terwijl <strong>beide<\/strong> aftappen, dus bereikt elke waarde beide — in de volgorde waarin de taps zich abonneerden, eerst <code>log<\/code>, dan <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>$log.close<\/code> aanroepen <strong>verlaat<\/strong> de supply. Vanaf dan ontvangt <code>log<\/code> niets meer, dus bereikt de afsluitende <code>stop<\/code> alleen <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Twee dingen om te onthouden.<\/span> <span class=\"sg\" data-s=\"1\">Ten eerste kan één enkele live supply tegelijk naar veel onafhankelijke taps uitwaaieren.<\/span> <span class=\"sg\" data-s=\"2\">Ten tweede is elke tap een eigen abonnement met een eigen levensduur: houd het <code>Tap<\/code>-object vast dat <code>.tap<\/code> teruggeeft, en je kunt die ene luisteraar met <code>.close<\/code> beëindigen zonder de andere te storen.<\/span><\/p>"]]},"es":{"t":"Supplies en vivo en acción","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Como un supply en vivo difunde a los enganches que estén escuchando en el momento, varios oyentes pueden seguir el mismo flujo a la vez, y cada uno es libre de unirse o marcharse cuando quiera.<\/span> <span class=\"sg\" data-s=\"1\">Aquí dos oyentes observan un flujo de eventos: un <code>log<\/code> que lo registra todo y una <code>alert<\/code> que se une más tarde y se marcha antes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # first listener joins\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # a second listener joins\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # the first listener leaves\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El ciclo de vida de los dos enganches encaja así — 🟢 marca un enganche que se une, 🔴 uno que se marcha y ✅ cada valor que un enganche recibe realmente:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Paso<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 se une<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 se une<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 se marcha<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una celda en blanco significa que ese enganche no estaba escuchando cuando salió el valor.<\/span> <span class=\"sg\" data-s=\"1\">Sigue la línea temporal:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> devuelve un **objeto <code>Tap<\/code>**: el asa que conservas para controlar esa suscripción concreta.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> se emite cuando solo <code>log<\/code> está escuchando, así que solo <code>log<\/code> lo ve. Es de nuevo la regla del supply en vivo: <code>alert<\/code> se unió <em>después<\/em> de <code>start<\/code>, y un supply en vivo no reproduce el pasado, así que <code>alert<\/code> nunca lo ve.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> y <code>all clear<\/code> se emiten cuando <strong>ambos<\/strong> están enganchados, así que cada valor llega a los dos, en el orden en que se suscribieron los enganches: primero <code>log<\/code>, después <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Llamar a <code>$log.close<\/code> <strong>abandona<\/strong> el supply. A partir de ahí <code>log<\/code> no recibe nada, así que el <code>stop<\/code> final llega solo a <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dos cosas para llevarse.<\/span> <span class=\"sg\" data-s=\"1\">Primera: un solo supply en vivo puede abrirse en abanico hacia muchos enganches independientes a la vez.<\/span> <span class=\"sg\" data-s=\"2\">Segunda: cada enganche es su propia suscripción, con su propio tiempo de vida; conserva el objeto <code>Tap<\/code> que devuelve <code>.tap<\/code> y podrás terminar ese oyente concreto con <code>.close<\/code> sin molestar a los demás.<\/span><\/p>"]]},"it":{"t":"Supply live in azione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché un supply dal vivo trasmette a qualunque presa sia in ascolto in quel momento, più ascoltatori possono seguire lo stesso flusso insieme — e ciascuno è libero di unirsi o andarsene quando gli pare.<\/span> <span class=\"sg\" data-s=\"1\">Qui due ascoltatori osservano un flusso di eventi: un <code>log<\/code> che registra tutto e un <code>alert<\/code> che si unisce più tardi e se ne va prima.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # first listener joins\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # a second listener joins\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # the first listener leaves\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il ciclo di vita delle due prese si allinea così — 🟢 segna una presa che si unisce, 🔴 una presa che se ne va, e ✅ ogni valore che una presa riceve davvero:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Passo<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 si unisce<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 si unisce<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 se ne va<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una cella vuota significa che quella presa non era in ascolto quando il valore è uscito.<\/span> <span class=\"sg\" data-s=\"1\">Segui la linea del tempo:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> restituisce un **oggetto <code>Tap<\/code>**: la maniglia che conservi per controllare quella singola sottoscrizione.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> viene emesso mentre ascolta solo <code>log<\/code>, quindi solo <code>log<\/code> lo vede. È di nuovo la regola del supply dal vivo: <code>alert<\/code> si è unito <em>dopo<\/em> <code>start<\/code>, e un supply dal vivo non ripropone il passato, quindi <code>alert<\/code> non lo vede mai.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> e <code>all clear<\/code> vengono emessi mentre <strong>entrambe<\/strong> le prese sono agganciate, quindi ogni valore raggiunge entrambe — nell'ordine in cui le prese si sono abbonate, prima <code>log<\/code>, poi <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Chiamare <code>$log.close<\/code> <strong>lascia<\/strong> il supply. Da quel momento <code>log<\/code> non riceve nulla, quindi il conclusivo <code>stop<\/code> raggiunge solo <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Due cose da portare via.<\/span> <span class=\"sg\" data-s=\"1\">Primo, un unico supply dal vivo può diramarsi verso molte prese indipendenti insieme.<\/span> <span class=\"sg\" data-s=\"2\">Secondo, ogni presa è una sottoscrizione a sé con la propria vita: conserva l'oggetto <code>Tap<\/code> che <code>.tap<\/code> restituisce, e potrai chiudere quel singolo ascoltatore con <code>.close<\/code> senza disturbare gli altri.<\/span><\/p>"]]},"lv":{"t":"Dzīvie supply darbībā","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā dzīva supply pārraida tiem pieslēgumiem, kas tobrīd klausās, vairāki klausītāji var sekot vienai un tai pašai straumei uzreiz — un katrs var pievienoties vai aiziet, kad vien vēlas.<\/span> <span class=\"sg\" data-s=\"1\">Šeit divi klausītāji vēro notikumu straumi: <code>log<\/code>, kas pieraksta visu, un <code>alert<\/code>, kas pievienojas vēlāk un aiziet agrāk.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # pievienojas pirmais klausītājs\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # pievienojas otrs klausītājs\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # pirmais klausītājs aiziet\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abu pieslēgumu dzīves cikls sakārtojas šādi — 🟢 apzīmē pieslēguma pievienošanos, 🔴 tā aiziešanu un ✅ katru vērtību, ko pieslēgums tiešām saņem:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Solis<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 pievienojas<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 pievienojas<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 aiziet<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tukša šūna nozīmē, ka šis pieslēgums neklausījās brīdī, kad vērtība tika izsūtīta.<\/span> <span class=\"sg\" data-s=\"1\">Sekojiet laika līnijai:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> atgriež **<code>Tap<\/code> objektu** — turekli, ko paturat, lai vadītu šo vienu abonementu.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> tiek izstarots, kamēr klausās tikai <code>log<\/code>, tāpēc to redz tikai <code>log<\/code>. Šis atkal ir dzīvās supply likums: <code>alert<\/code> pievienojās <em>pēc<\/em> <code>start<\/code>, un dzīva supply pagātni neatkārto, tāpēc <code>alert<\/code> to nekad neredz.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> un <code>all clear<\/code> tiek izstaroti, kamēr pieslēgti ir <strong>abi<\/strong>, tāpēc katra vērtība nonāk pie abiem — tādā secībā, kādā pieslēgumi abonējās: vispirms <code>log<\/code>, tad <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>$log.close<\/code> izsaukums <strong>aiziet<\/strong> no supply. No tā brīža <code>log<\/code> nesaņem neko, tāpēc pēdējais <code>stop<\/code> nonāk tikai pie <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Divas lietas, kas jāpaņem līdzi.<\/span> <span class=\"sg\" data-s=\"1\">Pirmkārt, viena dzīva supply var izvērsties daudzos neatkarīgos pieslēgumos vienlaikus.<\/span> <span class=\"sg\" data-s=\"2\">Otrkārt, katrs pieslēgums ir savs abonements ar savu mūžu: paturiet <code>Tap<\/code> objektu, ko atgriež <code>.tap<\/code>, un jūs varēsiet šo vienu klausītāju izbeigt ar <code>.close<\/code>, netraucējot pārējos.<\/span><\/p>"]]},"ru":{"t":"Живые supply в действии","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку живой supply вещает тем подключениям, которые слушают в данный момент, за одним и тем же потоком могут следить сразу несколько слушателей, и каждый волен присоединиться или уйти когда угодно.<\/span> <span class=\"sg\" data-s=\"1\">Здесь за потоком событий наблюдают двое: <code>log<\/code>, который записывает всё, и <code>alert<\/code>, который присоединяется позже и уходит раньше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # присоединяется первый слушатель\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # присоединяется второй слушатель\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # первый слушатель уходит\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Жизненный цикл двух подключений выстраивается так: 🟢 отмечает присоединение подключения, 🔴 — его уход, а ✅ — каждое значение, которое подключение действительно получило:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Шаг<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 присоединяется<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 присоединяется<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 уходит<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пустая клетка означает, что в момент выдачи значения это подключение не слушало.<\/span> <span class=\"sg\" data-s=\"1\">Проследим за временной линией:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> возвращает **объект <code>Tap<\/code>** — рукоятку, которую вы сохраняете, чтобы управлять именно этой подпиской.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> выдаётся, когда слушает только <code>log<\/code>, поэтому его видит только <code>log<\/code>. Это снова правило живого supply: <code>alert<\/code> присоединился <em>после<\/em> <code>start<\/code>, а живой supply прошлое не проигрывает, так что <code>alert<\/code> этого значения никогда не увидит.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> и <code>all clear<\/code> выдаются, когда подключены <strong>оба<\/strong>, поэтому каждое значение доходит до обоих — в том порядке, в каком они подписались: сначала <code>log<\/code>, затем <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Вызов <code>$log.close<\/code> <strong>отсоединяет<\/strong> от supply. С этого момента <code>log<\/code> не получает ничего, поэтому последнее <code>stop<\/code> доходит только до <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Отсюда два вывода.<\/span> <span class=\"sg\" data-s=\"1\">Во-первых, один живой supply способен разветвляться сразу на множество независимых подключений.<\/span> <span class=\"sg\" data-s=\"2\">Во-вторых, каждое подключение — отдельная подписка со своим временем жизни: сохраните объект <code>Tap<\/code>, который возвращает <code>.tap<\/code>, и вы сможете прекратить именно этого слушателя методом <code>.close<\/code>, не потревожив остальных.<\/span><\/p>"]]},"uk":{"t":"Живі потоки в дії","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки живий потік транслює тим підключенням, що слухають у цю мить, кілька слухачів можуть стежити за тим самим струменем водночас — і кожен вільний приєднатися чи піти коли завгодно.<\/span> <span class=\"sg\" data-s=\"1\">Тут два слухачі спостерігають за потоком подій: <code>log<\/code>, що записує все, та <code>alert<\/code>, що приєднується пізніше й іде раніше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # приєднується перший слухач\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # приєднується другий слухач\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # перший слухач іде\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Життєвий цикл двох підключень вишиковується так: 🟢 позначає приєднання підключення, 🔴 — його вихід, а ✅ — кожне значення, яке підключення справді отримало:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Крок<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 приєднується<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 приєднується<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 іде<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Порожня комірка означає, що це підключення не слухало, коли значення виходило.<\/span> <span class=\"sg\" data-s=\"1\">Простежте часову лінію:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> повертає **об'єкт <code>Tap<\/code>** — держак, який ви тримаєте, щоб керувати саме цією підпискою.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> видано тоді, коли слухає лише <code>log<\/code>, тож лише <code>log<\/code> його й бачить. Це знову те саме правило живого потоку: <code>alert<\/code> приєднався <em>після<\/em> <code>start<\/code>, а живий потік не програє минулого наново, тож <code>alert<\/code> ніколи його не побачить.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> та <code>all clear<\/code> видано тоді, коли підключені <strong>обидва<\/strong>, тож кожне значення доходить до обох — у порядку, у якому підключення підписалися: спершу <code>log<\/code>, потім <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Виклик <code>$log.close<\/code> <strong>виводить<\/strong> з потоку. Відтоді <code>log<\/code> не отримує нічого, тож останнє <code>stop<\/code> доходить лише до <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Два висновки.<\/span> <span class=\"sg\" data-s=\"1\">По-перше, один живий потік може віялом розходитися на багато незалежних підключень водночас.<\/span> <span class=\"sg\" data-s=\"2\">По-друге, кожне підключення є власною підпискою з власним часом життя: тримайтеся за об'єкт <code>Tap<\/code>, який повертає <code>.tap<\/code>, — і ви зможете завершити саме цього слухача через <code>.close<\/code>, не турбуючи інших.<\/span><\/p>"]]},"bg":{"t":"Живите потоци в действие","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже живият поток излъчва към онези включвания, които слушат в момента, няколко слушателя могат да следят една и съща струя наведнъж — и всеки е свободен да се присъедини или да си тръгне когато поиска.<\/span> <span class=\"sg\" data-s=\"1\">Тук двама слушатели наблюдават поток от събития: <code>log<\/code>, който записва всичко, и <code>alert<\/code>, който се присъединява по-късно и си тръгва по-рано.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # първият слушател се присъединява\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # присъединява се втори слушател\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # първият слушател си тръгва\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Жизненият цикъл на двете включвания се подрежда така — 🟢 отбелязва присъединяване, 🔴 — тръгване, а ✅ — всяка стойност, която включването действително получава:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Стъпка<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 присъединява се<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 присъединява се<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 тръгва си<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Празна клетка означава, че това включване не е слушало, когато стойността е излязла.<\/span> <span class=\"sg\" data-s=\"1\">Проследете хронологията:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> връща **обект <code>Tap<\/code>** — дръжката, която пазите, за да управлявате точно този абонамент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> е подадено, докато слуша само <code>log<\/code>, така че само <code>log<\/code> го вижда. Това е пак правилото на живия поток: <code>alert<\/code> се присъедини <em>след<\/em> <code>start<\/code>, а живият поток не пуска миналото наново, така че <code>alert<\/code> никога не го вижда.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> и <code>all clear<\/code> са подадени, докато са включени <strong>и двете<\/strong>, така че всяка стойност достига и до двете — в реда, в който включванията са се абонирали: първо <code>log<\/code>, после <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Извикването на <code>$log.close<\/code> <strong>напуска<\/strong> потока. Оттам нататък <code>log<\/code> не получава нищо, така че последното <code>stop<\/code> достига само до <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Две неща за отнасяне.<\/span> <span class=\"sg\" data-s=\"1\">Първо, един жив поток може да се разклони ветрилообразно към много независими включвания наведнъж.<\/span> <span class=\"sg\" data-s=\"2\">Второ, всяко включване е свой собствен абонамент със свой живот: задръжте обекта <code>Tap<\/code>, който <code>.tap<\/code> връща, и ще можете да прекратите точно този слушател с <code>.close<\/code>, без да безпокоите останалите.<\/span><\/p>"]]},"eo":{"t":"Vivaj supply en ago","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉar viva supply elsendas al kiuj ajn konektoj aŭskultas en la momento, pluraj aŭskultantoj povas sekvi la saman fluon samtempe — kaj ĉiu rajtas aliĝi aŭ foriri, kiam ĝi volas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie du aŭskultantoj rigardas fluon da eventoj: <code>log<\/code>, kiu registras ĉion, kaj <code>alert<\/code>, kiu aliĝas pli malfrue kaj foriras pli frue.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # la unua aŭskultanto aliĝas\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # dua aŭskultanto aliĝas\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # la unua aŭskultanto foriras\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio presas:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La vivociklo de la du konektoj viciĝas jene — 🟢 markas konekton aliĝantan, 🔴 konekton forirantan, kaj ✅ ĉiun valoron, kiun konekto efektive ricevas:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Paŝo<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 aliĝas<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 aliĝas<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 foriras<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Malplena ĉelo signifas, ke tiu konekto ne aŭskultis, kiam la valoro eliris.<\/span> <span class=\"sg\" data-s=\"1\">Sekvu la tempolinion:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> redonas **objekton <code>Tap<\/code>** — la tenilon, kiun vi konservas por regi tiun unu abonon.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> estas eligita dum nur <code>log<\/code> aŭskultas, do nur <code>log<\/code> vidas ĝin. Jen denove la regulo de viva supply: <code>alert<\/code> aliĝis <em>post<\/em> <code>start<\/code>, kaj viva supply ne represpektas la pasintecon, do <code>alert<\/code> neniam vidas ĝin.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> kaj <code>all clear<\/code> estas eligitaj dum <strong>ambaŭ<\/strong> estas konektitaj, do ĉiu valoro atingas ambaŭ — en la ordo, laŭ kiu la konektoj abonis, unue <code>log<\/code>, poste <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Voki <code>$log.close<\/code> <strong>forlasas<\/strong> la supply. De tiam <code>log<\/code> ricevas nenion, do la fina <code>stop<\/code> atingas nur <code>alert<\/code>.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du aferojn indas kunporti.<\/span> <span class=\"sg\" data-s=\"1\">Unue, unu sola viva supply povas disvastiĝi al multaj sendependaj konektoj samtempe.<\/span> <span class=\"sg\" data-s=\"2\">Due, ĉiu konekto estas propra abono kun propra vivodaŭro: tenu la objekton <code>Tap<\/code>, kiun <code>.tap<\/code> redonas, kaj vi povas fini tiun unu aŭskultanton per <code>.close<\/code> sen ĝeni la aliajn.<\/span><\/p>"]]},"la":{"t":"Supply viva in actione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quia supply vivum ad quascumque coniunctiones illo momento audientes diffundit, plures auditores eundem fluxum simul sequi possunt — et unusquisque liber est adire vel abire quandocumque libet.<\/span> <span class=\"sg\" data-s=\"1\">Hic duo auditores fluxum eventuum spectant: <code>log<\/code> qui omnia recordat, et <code>alert<\/code> qui serius adit et prius abit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $supplier = Supplier.new;\nmy $events   = $supplier.Supply;\n\nmy $log = $events.tap(-&gt; $v { say \"log:   $v\" });    # auditor primus adit\n$supplier.emit('start');\n\nmy $alert = $events.tap(-&gt; $v { say \"alert: $v\" });  # auditor secundus adit\n$supplier.emit('warning');\n$supplier.emit('all clear');\n\n$log.close;                                          # auditor primus abit\n$supplier.emit('stop');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>log:   start\nlog:   warning\nalert: warning\nlog:   all clear\nalert: all clear\nalert: stop<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vitae duarum coniunctionum ita se componunt — 🟢 coniunctionem adeuntem notat, 🔴 coniunctionem abeuntem, et ✅ unumquemque valorem quem coniunctio revera accipit:<\/span><\/p>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Gradus<\/td><td><code>log<\/code><\/td><td><code>alert<\/code><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><code>$events.tap<\/code> → <code>log<\/code><\/td><td>🟢 adit<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><code>emit 'start'<\/code><\/td><td>✅ start<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><code>$events.tap<\/code> → <code>alert<\/code><\/td><td><\/td><td>🟢 adit<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><code>emit 'warning'<\/code><\/td><td>✅ warning<\/td><td>✅ warning<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><code>emit 'all clear'<\/code><\/td><td>✅ all clear<\/td><td>✅ all clear<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td><code>$log.close<\/code><\/td><td>🔴 abit<\/td><td><\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><code>emit 'stop'<\/code><\/td><td><\/td><td>✅ stop<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cella vacua significat illam coniunctionem non audivisse cum valor exiret.<\/span> <span class=\"sg\" data-s=\"1\">Sequere temporum ordinem:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.tap<\/code> **obiectum <code>Tap<\/code>** reddit — manubrium quod servas ut illam unam subscriptionem regas.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>start<\/code> emittitur dum solus <code>log<\/code> audit, itaque solus <code>log<\/code> illud videt. Haec est regula supply vivi iterum: <code>alert<\/code> <em>post<\/em> <code>start<\/code> adiit, et supply vivum praeteritum non iterum agit, itaque <code>alert<\/code> illud numquam videt.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>warning<\/code> et <code>all clear<\/code> emittuntur dum <strong>ambo<\/strong> coniuncti sunt, itaque uterque valor ad utrumque pervenit — eo ordine quo coniunctiones se subscripserunt, <code>log<\/code> primus, deinde <code>alert<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>$log.close<\/code> vocare supply <strong>relinquit<\/strong>. Ex illo momento <code>log<\/code> nihil accipit, itaque ultimum <code>stop<\/code> solum ad <code>alert<\/code> pervenit.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Duo tenenda.<\/span> <span class=\"sg\" data-s=\"1\">Primum, unum supply vivum ad multas coniunctiones independentes simul diffundi potest.<\/span> <span class=\"sg\" data-s=\"2\">Secundum, unaquaeque coniunctio propria subscriptio est cum propria vita: obiectum <code>Tap<\/code> quod <code>.tap<\/code> reddit tene, et illum unum auditorem per <code>.close<\/code> finire potes sine ceteris turbandis.<\/span><\/p>"]]}}}</script>
