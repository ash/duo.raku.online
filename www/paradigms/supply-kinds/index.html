<script type="application/json" id="page-data">{"u":"paradigms/supply-kinds","n":1340,"k":"section","pv":"paradigms/supplies/exercises/count-emissions/solution","nx":"paradigms/supply-kinds/on-demand-supplies","tr":["paradigms"],"L":{"en":{"t":"Live and on-demand supplies","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Supplies come in two flavours, and knowing the difference saves a lot of confusion.<\/span> <span class=\"sg\" data-s=\"1\">An <em>on-demand<\/em> supply starts producing its values afresh for <strong>each<\/strong> tap, like replaying a recording.<\/span> <span class=\"sg\" data-s=\"2\">A <em>live<\/em> supply broadcasts values as they happen to <strong>all<\/strong> current taps, like a radio station — if you tune in late, you miss what already aired.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section shows both kinds and when each one is what you want.<\/span><\/p>"]]},"de":{"t":"Live- und On-demand-Supplies","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Supplies gibt es in zwei Ausprägungen, und den Unterschied zu kennen erspart viel Verwirrung.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>On-demand<\/em>-Supply beginnt seine Werte für <strong>jede<\/strong> Zapfstelle von Neuem zu erzeugen, wie das erneute Abspielen einer Aufnahme.<\/span> <span class=\"sg\" data-s=\"2\">Ein <em>Live<\/em>-Supply sendet Werte, sobald sie geschehen, an <strong>alle<\/strong> derzeitigen Zapfstellen, wie ein Radiosender — schalten Sie zu spät ein, verpassen Sie, was schon gesendet wurde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt beide Arten und wann welche die gewünschte ist.<\/span><\/p>"]]},"nl":{"t":"Live en on-demand supplies","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Supplies komen in twee smaken, en het verschil kennen scheelt veel verwarring.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>on-demand<\/em>-supply begint zijn waarden voor <strong>elke<\/strong> tap opnieuw te produceren, als een opname die je opnieuw afspeelt.<\/span> <span class=\"sg\" data-s=\"2\">Een <em>live<\/em> supply zendt waarden uit zodra ze gebeuren naar <strong>alle<\/strong> huidige taps, als een radiostation — stem je te laat af, dan mis je wat al uitgezonden is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze sectie toont beide soorten en wanneer je welke wilt.<\/span><\/p>"]]},"es":{"t":"Supplies en vivo y bajo demanda","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los supplies vienen en dos sabores, y conocer la diferencia ahorra mucha confusión.<\/span> <span class=\"sg\" data-s=\"1\">Un supply <em>bajo demanda<\/em> empieza a producir sus valores de nuevo para <strong>cada<\/strong> enganche, como reproducir otra vez una grabación.<\/span> <span class=\"sg\" data-s=\"2\">Un supply <em>en vivo<\/em> difunde los valores según ocurren a <strong>todos<\/strong> los enganches actuales, como una emisora de radio: si sintonizas tarde, te pierdes lo ya emitido.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra ambas clases y cuándo quieres cada una.<\/span><\/p>"]]},"it":{"t":"Supply live e su richiesta","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">I supply esistono in due varietà, e conoscere la differenza risparmia molta confusione.<\/span> <span class=\"sg\" data-s=\"1\">Un supply <em>su richiesta<\/em> ricomincia a produrre i propri valori da capo per <strong>ogni<\/strong> presa, come riprodurre di nuovo una registrazione.<\/span> <span class=\"sg\" data-s=\"2\">Un supply <em>dal vivo<\/em> trasmette i valori man mano che accadono a <strong>tutte<\/strong> le prese in ascolto, come una stazione radio: se ti sintonizzi tardi, ti perdi ciò che è già andato in onda.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra entrambi i generi e quando ciascuno è quello che vuoi.<\/span><\/p>"]]},"ru":{"t":"Живые supply и supply по требованию","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply бывают двух видов, и понимание разницы избавляет от множества недоразумений.<\/span> <span class=\"sg\" data-s=\"1\">Supply <em>по требованию<\/em> начинает выдавать свои значения заново для <strong>каждого<\/strong> подключения — словно проигрывает запись сначала. <em>Живой<\/em> supply транслирует значения по мере их появления <strong>всем<\/strong> текущим подключениям — как радиостанция: включились поздно, значит, пропустили то, что уже прозвучало.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе показаны оба вида и то, когда какой из них нужен.<\/span><\/p>"]]},"uk":{"t":"Живі потоки та потоки на вимогу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Потоки значень бувають двох ґатунків, і знання різниці рятує від чималої плутанини.<\/span> <span class=\"sg\" data-s=\"1\">Потік <em>на вимогу<\/em> (on-demand) починає виробляти свої значення наново для <strong>кожного<\/strong> підключення — наче програє запис іще раз. <em>Живий<\/em> потік транслює значення в міру їх настання <strong>всім<\/strong> наявним підключенням, наче радіостанція: якщо ви ввімкнулися пізно, ви пропустили те, що вже прозвучало.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує обидва різновиди й те, коли який із них вам потрібен.<\/span><\/p>"]]},"bg":{"t":"Живи потоци и потоци при поискване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Потоците от стойности идват в два вкуса и знанието на разликата спестява много объркване.<\/span> <span class=\"sg\" data-s=\"1\">Потокът <em>при поискване<\/em> (on-demand) започва да произвежда стойностите си наново за <strong>всяко<\/strong> включване, все едно пуска запис отначало. <em>Живият<\/em> поток излъчва стойностите в момента на случването им към <strong>всички<\/strong> текущи включвания, като радиостанция — включите ли се късно, пропускате вече излъченото.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел показва и двата вида и кога кой ви трябва.<\/span><\/p>"]]}}}</script>
