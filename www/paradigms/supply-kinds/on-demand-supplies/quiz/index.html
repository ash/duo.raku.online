<script type="application/json" id="page-data">{"u":"paradigms/supply-kinds/on-demand-supplies/quiz","n":1342,"k":"quiz","pv":"paradigms/supply-kinds/on-demand-supplies","nx":"paradigms/supply-kinds/live-supplies","tr":["paradigms","paradigms/supply-kinds","paradigms/supply-kinds/on-demand-supplies"],"L":{"en":{"t":"Quiz — Supply kinds","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">For an <strong>on-demand<\/strong> supply such as <code>Supply.from-list<\/code>, what does a second tap receive?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Nothing — the first tap used up the values<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Only the values emitted after it tapped<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">The whole sequence, from the start<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">An error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An on-demand supply replays its values for every tap.<\/span> <span class=\"sg\" data-s=\"1\">Each tap is independent and receives the complete sequence from the beginning — unlike a live supply, where late subscribers miss earlier values.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Arten von Supplies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was erhält bei einem <strong>On-demand<\/strong>-Supply wie <code>Supply.from-list<\/code> eine zweite Zapfstelle?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Nichts — die erste Zapfstelle hat die Werte aufgebraucht<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Nur die Werte, die nach ihrem Anzapfen ausgesandt wurden<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Die ganze Folge, von Anfang an<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Einen Fehler<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein On-demand-Supply spielt seine Werte für jede Zapfstelle erneut ab.<\/span> <span class=\"sg\" data-s=\"1\">Jede Zapfstelle ist unabhängig und erhält die vollständige Folge von Anfang an — anders als bei einem Live-Supply, wo späte Abonnenten frühere Werte verpassen.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Soorten supplies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat ontvangt een tweede tap bij een <strong>on-demand<\/strong>-supply als <code>Supply.from-list<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Niets — de eerste tap heeft de waarden opgebruikt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Alleen de waarden die uitgezonden zijn nadat hij aftapte<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">De hele reeks, vanaf het begin<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Een fout<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een on-demand-supply speelt zijn waarden voor elke tap opnieuw af.<\/span> <span class=\"sg\" data-s=\"1\">Elke tap is onafhankelijk en ontvangt de volledige reeks vanaf het begin — anders dan bij een live supply, waar late abonnees eerdere waarden missen.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Tipos de supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En un supply <strong>bajo demanda<\/strong> como <code>Supply.from-list<\/code>, ¿qué recibe un segundo enganche?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Nada: el primer enganche gastó los valores<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Solo los valores emitidos después de engancharse<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">La secuencia entera, desde el principio<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Un error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply bajo demanda reproduce sus valores para cada enganche.<\/span> <span class=\"sg\" data-s=\"1\">Cada enganche es independiente y recibe la secuencia completa desde el comienzo, a diferencia de un supply en vivo, donde los suscriptores tardíos se pierden los valores anteriores.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Tipi di supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un supply <strong>su richiesta<\/strong> come <code>Supply.from-list<\/code>, che cosa riceve una seconda presa?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Niente — la prima presa ha consumato i valori<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Solo i valori emessi dopo che si è agganciata<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">L'intera sequenza, dall'inizio<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Un errore<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply su richiesta riproduce di nuovo i propri valori per ogni presa.<\/span> <span class=\"sg\" data-s=\"1\">Ogni presa è indipendente e riceve la sequenza completa dall'inizio — a differenza di un supply dal vivo, dove gli abbonati tardivi si perdono i valori precedenti.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Виды supply","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что получит второе подключение к supply <strong>по требованию<\/strong>, например к <code>Supply.from-list<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ничего — первое подключение израсходовало значения<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Только значения, выданные после его подключения<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Всю последовательность с самого начала<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Ошибку<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply по требованию проигрывает свои значения заново для каждого подключения.<\/span> <span class=\"sg\" data-s=\"1\">Каждое подключение независимо и получает полную последовательность с самого начала — в отличие от живого supply, где опоздавшие подписчики пропускают более ранние значения.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Різновиди потоків значень","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що отримає друге підключення до потоку <strong>на вимогу<\/strong>, як-от <code>Supply.from-list<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Нічого — перше підключення витратило значення<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Лише значення, видані після того, як воно підключилося<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Усю послідовність, від початку<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Помилку<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Потік на вимогу програє свої значення наново для кожного підключення.<\/span> <span class=\"sg\" data-s=\"1\">Кожне підключення незалежне й отримує повну послідовність від самого початку — на відміну від живого потоку, де пізні підписники пропускають попередні значення.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Видове потоци от стойности","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво получава второто включване към поток <strong>при поискване<\/strong>, като <code>Supply.from-list<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Нищо — първото включване е изразходвало стойностите<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Само стойностите, подадени след като то се е включило<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Цялата последователност, от началото<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Грешка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Потокът при поискване пуска стойностите си наново за всяко включване.<\/span> <span class=\"sg\" data-s=\"1\">Всяко включване е независимо и получава пълната последователност от самото начало — за разлика от живия поток, при който закъснелите абонати пропускат по-ранните стойности.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
