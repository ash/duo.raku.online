<script type="application/json" id="page-data">{"u":"paradigms/supply-kinds/on-demand-supplies","n":1341,"k":"topic","pv":"paradigms/supply-kinds","nx":"paradigms/supply-kinds/on-demand-supplies/quiz","tr":["paradigms","paradigms/supply-kinds"],"L":{"en":{"t":"On-demand supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An <em>on-demand<\/em> supply produces its values anew for every tap.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> is on-demand: each tap gets the <strong>whole<\/strong> sequence from the start, independently of any other tap.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Both taps received all three values.<\/span> <span class=\"sg\" data-s=\"1\">The supply did not “use up” its values on the first tap; it simply ran again for the second.<\/span> <span class=\"sg\" data-s=\"2\">This is the behaviour you want when a supply represents a fixed source — a list, a file, a query — that every subscriber should see in full.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On-demand is the default for supplies built from existing data, because each consumer naturally expects the complete sequence.<\/span> <span class=\"sg\" data-s=\"1\">The other kind, a <em>live<\/em> supply, behaves quite differently, as the next topic shows.<\/span><\/p>"]]},"de":{"t":"On-demand-Supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>On-demand<\/em>-Supply erzeugt seine Werte für jede Zapfstelle neu.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> ist on demand: Jede Zapfstelle erhält die <strong>ganze<\/strong> Folge von Anfang an, unabhängig von jeder anderen Zapfstelle.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide Zapfstellen haben alle drei Werte erhalten.<\/span> <span class=\"sg\" data-s=\"1\">Das Supply hat seine Werte bei der ersten Zapfstelle nicht „aufgebraucht“; es lief für die zweite schlicht erneut.<\/span> <span class=\"sg\" data-s=\"2\">Das ist das Verhalten, das Sie wollen, wenn ein Supply eine feste Quelle darstellt — eine Liste, eine Datei, eine Abfrage —, die jeder Abonnent vollständig sehen soll.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On demand ist der Standard für Supplies, die aus bestehenden Daten gebaut sind, denn jeder Verbraucher erwartet natürlicherweise die vollständige Folge.<\/span> <span class=\"sg\" data-s=\"1\">Die andere Art, ein <em>Live<\/em>-Supply, verhält sich recht anders, wie das nächste Thema zeigt.<\/span><\/p>"]]},"nl":{"t":"On-demand supplies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>on-demand<\/em>-supply produceert zijn waarden voor elke tap opnieuw.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> is on-demand: elke tap krijgt de <strong>hele<\/strong> reeks vanaf het begin, onafhankelijk van elke andere tap.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide taps ontvingen alle drie de waarden.<\/span> <span class=\"sg\" data-s=\"1\">De supply heeft zijn waarden bij de eerste tap niet \"opgebruikt\"; hij draaide eenvoudigweg opnieuw voor de tweede.<\/span> <span class=\"sg\" data-s=\"2\">Dat is het gedrag dat je wilt wanneer een supply een vaste bron voorstelt — een lijst, een bestand, een query — die elke abonnee volledig zou moeten zien.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On-demand is de standaard voor supplies die uit bestaande gegevens gebouwd zijn, omdat elke consument van nature de volledige reeks verwacht.<\/span> <span class=\"sg\" data-s=\"1\">De andere soort, een <em>live<\/em> supply, gedraagt zich heel anders, zoals het volgende onderwerp laat zien.<\/span><\/p>"]]},"es":{"t":"Supplies bajo demanda","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply <em>bajo demanda<\/em> produce sus valores de nuevo para cada enganche.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> es bajo demanda: cada enganche recibe la secuencia <strong>entera<\/strong> desde el principio, con independencia de cualquier otro enganche.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ambos enganches recibieron los tres valores.<\/span> <span class=\"sg\" data-s=\"1\">El supply no «gastó» sus valores en el primer enganche; sencillamente volvió a ejecutarse para el segundo.<\/span> <span class=\"sg\" data-s=\"2\">Este es el comportamiento que quieres cuando un supply representa una fuente fija — una lista, un archivo, una consulta — que todo suscriptor debería ver completa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bajo demanda es lo predeterminado para los supplies construidos a partir de datos ya existentes, porque cada consumidor espera de forma natural la secuencia completa.<\/span> <span class=\"sg\" data-s=\"1\">La otra clase, el supply <em>en vivo<\/em>, se comporta de manera bastante distinta, como muestra el apartado siguiente.<\/span><\/p>"]]},"it":{"t":"Supply su richiesta","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un supply <em>su richiesta<\/em> produce i propri valori daccapo per ogni presa.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> è su richiesta: ogni presa riceve l'<strong>intera<\/strong> sequenza dall'inizio, indipendentemente da qualunque altra presa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Entrambe le prese hanno ricevuto tutti e tre i valori.<\/span> <span class=\"sg\" data-s=\"1\">Il supply non ha «consumato» i propri valori sulla prima presa; semplicemente è ripartito per la seconda.<\/span> <span class=\"sg\" data-s=\"2\">È il comportamento che vuoi quando un supply rappresenta una sorgente fissa — un elenco, un file, una query — che ogni abbonato dovrebbe vedere per intero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Su richiesta è il comportamento predefinito per i supply costruiti da dati esistenti, perché ogni consumatore si aspetta naturalmente la sequenza completa.<\/span> <span class=\"sg\" data-s=\"1\">L'altro genere, il supply <em>dal vivo<\/em>, si comporta in modo piuttosto diverso, come mostra l'argomento successivo.<\/span><\/p>"]]},"ru":{"t":"Supply по требованию","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Supply <em>по требованию<\/em> производит свои значения заново для каждого подключения.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> работает по требованию: каждое подключение получает <strong>всю<\/strong> последовательность с самого начала, независимо от остальных подключений.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оба подключения получили все три значения.<\/span> <span class=\"sg\" data-s=\"1\">Supply не «израсходовал» свои значения на первом подключении — он просто отработал заново для второго.<\/span> <span class=\"sg\" data-s=\"2\">Именно такое поведение нужно, когда supply представляет фиксированный источник — список, файл, запрос, — который каждый подписчик должен увидеть целиком.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для supply, построенных из уже существующих данных, режим «по требованию» установлен по умолчанию, потому что каждый потребитель естественным образом ожидает полную последовательность.<\/span> <span class=\"sg\" data-s=\"1\">Другой вид — <em>живой<\/em> supply — ведёт себя совсем иначе, как показано в следующей теме.<\/span><\/p>"]]},"uk":{"t":"Потоки на вимогу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Потік <em>на вимогу<\/em> виробляє свої значення заново для кожного підключення.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> є потоком на вимогу: кожне підключення отримує <strong>всю<\/strong> послідовність від початку, незалежно від будь-якого іншого підключення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обидва підключення отримали всі три значення.<\/span> <span class=\"sg\" data-s=\"1\">Потік не «витратив» своїх значень на першому підключенні; він просто виконався ще раз для другого.<\/span> <span class=\"sg\" data-s=\"2\">Саме така поведінка потрібна, коли потік представляє фіксоване джерело — список, файл, запит, — яке кожен підписник має побачити повністю.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На вимогу — це типова поведінка для потоків, побудованих із наявних даних, бо кожен споживач природно очікує повної послідовності.<\/span> <span class=\"sg\" data-s=\"1\">Інший різновид, <em>живий<\/em> потік, поводиться зовсім інакше, як показує наступна тема.<\/span><\/p>"]]},"bg":{"t":"Потоци при поискване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Потокът <em>при поискване<\/em> произвежда стойностите си наново за всяко включване.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.from-list<\/code> е такъв: всяко включване получава <strong>цялата<\/strong> последователност от началото, независимо от всяко друго включване.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = Supply.from-list(1, 2, 3);\n\nmy @a;\nmy @b;\n$s.tap(-&gt; $v { @a.push($v) });\n$s.tap(-&gt; $v { @b.push($v) });\n\nsay @a; # [1 2 3]\nsay @b; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">И двете включвания получиха и трите стойности.<\/span> <span class=\"sg\" data-s=\"1\">Потокът не „изразходва“ стойностите си при първото включване; той просто се изпълни отново за второто.<\/span> <span class=\"sg\" data-s=\"2\">Точно това поведение искате, когато потокът представя фиксиран източник — списък, файл, заявка, — който всеки абонат трябва да види изцяло.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">„При поискване“ е поведението по подразбиране за потоци, изградени от съществуващи данни, защото всеки потребител естествено очаква пълната последователност.<\/span> <span class=\"sg\" data-s=\"1\">Другият вид, <em>живият<\/em> поток, се държи съвсем различно, както показва следващата тема.<\/span><\/p>"]]}}}</script>
