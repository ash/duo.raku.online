<script type="application/json" id="page-data">{"u":"paradigms/generators","n":1233,"k":"section","pv":"paradigms/feeds/exercises/feed-sorted/solution","nx":"paradigms/generators/gather-take","tr":["paradigms"],"L":{"en":{"t":"Generators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>generator<\/em> is a routine that produces a series of values one at a time, yielding each on demand instead of building the whole list up front.<\/span> <span class=\"sg\" data-s=\"1\">Raku spells it with the <code>gather<\/code> / <code>take<\/code> pair: inside a <code>gather<\/code> block, every <code>take<\/code> hands one value to the resulting sequence, and the block pauses right there until the next value is pulled.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Because the values are produced lazily — only as they are asked for — a generator can even describe an endless series.<\/span> <span class=\"sg\" data-s=\"1\">This section shows how to build sequences with <code>gather<\/code> and <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The lower-level machinery that actually pulls those values out, one by one, is the subject of the next section, <a href=\"/paradigms/iterators/\">Iterators<\/a>.<\/span><\/p>"]]},"de":{"t":"Generatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Generator<\/em> ist eine Routine, die eine Reihe von Werten einen nach dem anderen erzeugt und jeden auf Anforderung liefert, statt die ganze Liste vorab zu bauen.<\/span> <span class=\"sg\" data-s=\"1\">Raku schreibt das mit dem Paar <code>gather<\/code> / <code>take<\/code>: Innerhalb eines <code>gather<\/code>-Blocks reicht jedes <code>take<\/code> einen Wert an die entstehende Sequenz, und der Block pausiert genau dort, bis der nächste Wert abgeholt wird.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Weil die Werte träge erzeugt werden — erst, wenn nach ihnen gefragt wird —, kann ein Generator sogar eine endlose Reihe beschreiben.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt, wie man Sequenzen mit <code>gather<\/code> und <code>take<\/code> baut.<\/span> <span class=\"sg\" data-s=\"2\">Die tieferliegende Maschinerie, die diese Werte tatsächlich einen nach dem anderen herausholt, ist das Thema des nächsten Abschnitts, <a href=\"https://course.raku.org/de/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Iteratoren<\/a>.<\/span><\/p>"]]},"nl":{"t":"Generatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>generator<\/em> is een routine die een reeks waarden één voor één produceert en elk op verzoek oplevert in plaats van de hele lijst vooraf op te bouwen.<\/span> <span class=\"sg\" data-s=\"1\">Raku schrijft dat met het paar <code>gather<\/code> / <code>take<\/code>: binnen een <code>gather<\/code>-blok overhandigt elke <code>take<\/code> één waarde aan de resulterende reeks, en het blok pauzeert daar tot de volgende waarde opgehaald wordt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omdat de waarden lui geproduceerd worden — alleen zodra erom gevraagd wordt — kan een generator zelfs een eindeloze reeks beschrijven.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie laat zien hoe je reeksen bouwt met <code>gather<\/code> en <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De machinerie op lager niveau die die waarden er werkelijk één voor één uit haalt, is het onderwerp van de volgende sectie, <a href=\"https://course.raku.org/nl/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Iterators<\/a>.<\/span><\/p>"]]},"es":{"t":"Generadores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>generador<\/em> es una rutina que produce una serie de valores de uno en uno, entregando cada uno bajo demanda en lugar de construir la lista entera por adelantado.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo escribe con el par <code>gather<\/code> / <code>take<\/code>: dentro de un bloque <code>gather<\/code>, cada <code>take<\/code> entrega un valor a la secuencia resultante, y el bloque se detiene justo ahí hasta que se pide el valor siguiente.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Como los valores se producen perezosamente — solo a medida que se piden —, un generador puede incluso describir una serie sin fin.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección muestra cómo construir secuencias con <code>gather<\/code> y <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La maquinaria de más bajo nivel que en realidad extrae esos valores, uno a uno, es el tema de la sección siguiente, <a href=\"https://course.raku.org/es/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Iteradores<\/a>.<\/span><\/p>"]]},"it":{"t":"Generatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>generatore<\/em> è una routine che produce una serie di valori uno alla volta, consegnandone ciascuno su richiesta invece di costruire tutto l'elenco in anticipo.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo scrive con la coppia <code>gather<\/code> / <code>take<\/code>: dentro un blocco <code>gather<\/code>, ogni <code>take<\/code> consegna un valore alla sequenza risultante, e il blocco si mette in pausa proprio lì fino a quando il valore successivo non viene tirato.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Poiché i valori sono prodotti pigramente — solo quando vengono richiesti — un generatore può persino descrivere una serie senza fine.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra come costruire sequenze con <code>gather<\/code> e <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il meccanismo di più basso livello che tira davvero fuori quei valori, uno a uno, è l'argomento della sezione successiva, <a href=\"https://course.raku.org/it/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Iteratori<\/a>.<\/span><\/p>"]]},"ru":{"t":"Генераторы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Генератор<\/em> — это процедура, которая выдаёт череду значений по одному, отдавая каждое по требованию, вместо того чтобы строить весь список заранее.<\/span> <span class=\"sg\" data-s=\"1\">В Raku он записывается парой <code>gather<\/code> / <code>take<\/code>: внутри блока <code>gather<\/code> каждый <code>take<\/code> отдаёт одно значение получаемой последовательности, и блок замирает прямо на этом месте, пока не затребуют следующее значение.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поскольку значения производятся лениво — только тогда, когда их спрашивают, — генератор может описывать даже бесконечную череду.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе показано, как строить последовательности с помощью <code>gather<\/code> и <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Более низкоуровневая механика, которая на самом деле вытягивает эти значения одно за другим, — предмет следующего раздела, <a href=\"https://course.raku.org/ru/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Итераторы<\/a>.<\/span><\/p>"]]},"uk":{"t":"Генератори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Генератор<\/em> — це процедура, що виробляє низку значень по одному, віддаючи кожне на вимогу, замість будувати весь список наперед.<\/span> <span class=\"sg\" data-s=\"1\">Raku записує це парою <code>gather<\/code> / <code>take<\/code>: усередині блоку <code>gather<\/code> кожен <code>take<\/code> вручає одне значення підсумковій послідовності, і блок зупиняється рівно там, аж поки не витягнуть наступне значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оскільки значення виробляються ліниво — лише тоді, коли їх просять, — генератор може описати навіть нескінченний ряд.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує, як будувати послідовності за допомогою <code>gather<\/code> та <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Механіка нижчого рівня, що насправді витягає ці значення одне за одним, є темою наступного розділу — <a href=\"https://course.raku.org/uk/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Ітератори<\/a>.<\/span><\/p>"]]},"bg":{"t":"Генератори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Генераторът<\/em> е процедура, която произвежда поредица от стойности една по една, подавайки всяка при поискване, вместо да изгражда целия списък наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Raku го записва с двойката <code>gather<\/code> / <code>take<\/code>: вътре в блок <code>gather<\/code> всяко <code>take<\/code> подава по една стойност на получаващата се последователност, а блокът спира точно там, докато не бъде изтеглена следващата стойност.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понеже стойностите се произвеждат мързеливо — само когато бъдат поискани, — генераторът може да опише дори безкрайна редица.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва как се строят последователности с <code>gather<\/code> и <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Механиката от по-ниско ниво, която всъщност изтегля тези стойности една по една, е тема на следващия раздел — <a href=\"https://course.raku.org/bg/paradigms/iterators/\" target=\"_blank\" rel=\"noopener\">Итератори<\/a>.<\/span><\/p>"]]}}}</script>
