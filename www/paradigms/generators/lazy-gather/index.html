<script type="application/json" id="page-data">{"u":"paradigms/generators/lazy-gather","n":1236,"k":"topic","pv":"paradigms/generators/gather-take/quiz","nx":"paradigms/generators/exercises","tr":["paradigms","paradigms/generators"],"L":{"en":{"t":"Lazy gather","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>gather<\/code> block is <em>lazy<\/em>: it does not run all at once.<\/span> <span class=\"sg\" data-s=\"1\">It produces values only as they are pulled out, which means a <code>gather<\/code> can describe an <strong>endless<\/strong> series and still be useful — you simply stop taking values when you have enough.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The catch is that you must keep the result lazy.<\/span> <span class=\"sg\" data-s=\"1\">Storing it in a plain <code>@array<\/code> would try to collect every value at once, and for an endless series that never finishes.<\/span> <span class=\"sg\" data-s=\"2\">Instead, keep the sequence in a scalar (where it stays a lazy <code>Seq<\/code>) and pull a slice from it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> never ends, but only five values are ever produced, because that is all we asked for with <code>[^5]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can also pull from the front with <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laziness is what lets <code>gather<\/code> model infinite streams safely: nothing is computed until it is needed, and you take exactly as much as you want.<\/span><\/p>"]]},"de":{"t":"Träges gather","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>gather<\/code>-Block ist <em>träge<\/em>: Er läuft nicht auf einen Schlag.<\/span> <span class=\"sg\" data-s=\"1\">Er erzeugt Werte erst, wenn sie herausgeholt werden, was bedeutet, dass ein <code>gather<\/code> eine <strong>endlose<\/strong> Reihe beschreiben und dennoch brauchbar sein kann — Sie hören einfach auf, Werte zu nehmen, wenn Sie genug haben.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Haken ist, dass Sie das Ergebnis träge halten müssen.<\/span> <span class=\"sg\" data-s=\"1\">Es in einem gewöhnlichen <code>@array<\/code> abzulegen würde versuchen, jeden Wert auf einmal einzusammeln, und bei einer endlosen Reihe endet das nie.<\/span> <span class=\"sg\" data-s=\"2\">Legen Sie die Sequenz stattdessen in einem Skalar ab (wo sie eine träge <code>Seq<\/code> bleibt) und entnehmen Sie ihr eine Scheibe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code> endet nie, aber es werden nur fünf Werte erzeugt, denn mehr haben wir mit <code>[^5]<\/code> nicht verlangt.<\/span> <span class=\"sg\" data-s=\"1\">Sie können auch vorn mit <code>.head<\/code> entnehmen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Trägheit ist es, die <code>gather<\/code> unendliche Ströme sicher abbilden lässt: Nichts wird berechnet, bevor es gebraucht wird, und Sie nehmen genau so viel, wie Sie wollen.<\/span><\/p>"]]},"nl":{"t":"Luie gather","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>gather<\/code>-blok is <em>lui<\/em>: het draait niet in één keer.<\/span> <span class=\"sg\" data-s=\"1\">Het produceert waarden pas zodra ze eruit gehaald worden, wat betekent dat een <code>gather<\/code> een <strong>eindeloze<\/strong> reeks kan beschrijven en toch bruikbaar blijft — je stopt eenvoudigweg met waarden opnemen zodra je er genoeg hebt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het addertje is dat je het resultaat lui moet houden.<\/span> <span class=\"sg\" data-s=\"1\">Het in een gewone <code>@array<\/code> bewaren zou proberen elke waarde in één keer te verzamelen, en voor een eindeloze reeks eindigt dat nooit.<\/span> <span class=\"sg\" data-s=\"2\">Bewaar de reeks in plaats daarvan in een scalair (waar ze een luie <code>Seq<\/code> blijft) en haal er een plak uit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code> eindigt nooit, maar er worden ooit slechts vijf waarden geproduceerd, want dat is alles waar we met <code>[^5]<\/code> om vroegen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ook vooraan waarden weghalen met <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Luiheid is wat <code>gather<\/code> oneindige stromen veilig laat modelleren: er wordt niets berekend tot het nodig is, en je neemt precies zoveel als je wilt.<\/span><\/p>"]]},"es":{"t":"gather perezoso","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>gather<\/code> es <em>perezoso<\/em>: no se ejecuta de una vez.<\/span> <span class=\"sg\" data-s=\"1\">Produce valores solo a medida que se extraen, lo que significa que un <code>gather<\/code> puede describir una serie <strong>sin fin<\/strong> y seguir siendo útil: simplemente dejas de tomar valores cuando ya tienes bastantes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La trampa está en que debes mantener el resultado perezoso.<\/span> <span class=\"sg\" data-s=\"1\">Guardarlo en un <code>@array<\/code> normal intentaría reunir todos los valores a la vez, y para una serie sin fin eso no termina nunca.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, mantén la secuencia en un escalar (donde sigue siendo una <code>Seq<\/code> perezosa) y extrae de ella una porción:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>loop<\/code> no termina nunca, pero solo se producen cinco valores, porque es todo lo que pedimos con <code>[^5]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También puedes extraer desde el principio con <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La pereza es lo que permite a <code>gather<\/code> modelar flujos infinitos sin peligro: no se calcula nada hasta que hace falta, y tomas exactamente tanto como quieras.<\/span><\/p>"]]},"it":{"t":"gather pigro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>gather<\/code> è <em>pigro<\/em>: non gira tutto in una volta.<\/span> <span class=\"sg\" data-s=\"1\">Produce valori solo man mano che vengono estratti, il che significa che un <code>gather<\/code> può descrivere una serie <strong>senza fine<\/strong> ed essere comunque utile — smetti semplicemente di prendere valori quando ne hai abbastanza.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il trucco è che devi mantenere pigro il risultato.<\/span> <span class=\"sg\" data-s=\"1\">Conservarlo in un semplice <code>@array<\/code> proverebbe a raccogliere tutti i valori in una volta, e per una serie senza fine non finirebbe mai.<\/span> <span class=\"sg\" data-s=\"2\">Conserva invece la sequenza in uno scalare (dove resta una <code>Seq<\/code> pigra) ed estraine una fetta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>loop<\/code> non finisce mai, ma vengono prodotti solo cinque valori, perché è tutto ciò che abbiamo chiesto con <code>[^5]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche estrarre dalla testa con <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">È la pigrizia a permettere a <code>gather<\/code> di modellare flussi infiniti in sicurezza: nulla viene calcolato finché non serve, e ne prendi esattamente quanto vuoi.<\/span><\/p>"]]},"ru":{"t":"Ленивый gather","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>gather<\/code> <em>ленив<\/em>: он не выполняется весь сразу.<\/span> <span class=\"sg\" data-s=\"1\">Он выдаёт значения лишь по мере того, как их вытягивают, а это значит, что <code>gather<\/code> может описывать <strong>бесконечную<\/strong> череду и всё равно оставаться полезным: вы просто перестаёте брать значения, когда их достаточно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Загвоздка в том, что результат надо сохранить ленивым.<\/span> <span class=\"sg\" data-s=\"1\">Складывание его в обычный <code>@array<\/code> попыталось бы собрать сразу все значения, а для бесконечной череды это никогда не закончится.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого держите последовательность в скаляре (там она остаётся ленивой <code>Seq<\/code>) и вытягивайте из неё срез:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цикл <code>loop<\/code> не кончается никогда, но производится ровно пять значений, потому что именно столько мы и запросили через <code>[^5]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вытягивать с начала можно и методом <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именно лень и позволяет <code>gather<\/code> безопасно моделировать бесконечные потоки: ничего не вычисляется, пока не понадобится, и вы берёте ровно столько, сколько хотите.<\/span><\/p>"]]},"uk":{"t":"Ліниве збирання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>gather<\/code> є <em>лінивим<\/em>: він не виконується весь одразу.<\/span> <span class=\"sg\" data-s=\"1\">Він виробляє значення лише тоді, коли їх витягають, а це означає, що <code>gather<\/code> може описувати <strong>нескінченний<\/strong> ряд і все одно бути корисним — ви просто перестаєте брати значення, коли їх достатньо.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Заковика в тому, що результат треба тримати лінивим.<\/span> <span class=\"sg\" data-s=\"1\">Збереження його у звичайному масиві <code>@array<\/code> спробувало б зібрати всі значення одразу, а для нескінченного ряду це ніколи не завершиться.<\/span> <span class=\"sg\" data-s=\"2\">Натомість тримайте послідовність у скалярі (де вона залишається лінивим <code>Seq<\/code>) і витягайте з неї зріз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> не завершується ніколи, але виробляється лише п'ять значень, бо саме стільки ми попросили через <code>[^5]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Витягати з початку можна також за допомогою <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Саме лінивість дозволяє <code>gather<\/code> безпечно моделювати нескінченні потоки: ніщо не обчислюється, поки не знадобиться, і ви берете рівно стільки, скільки хочете.<\/span><\/p>"]]},"bg":{"t":"Мързеливо събиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>gather<\/code> е <em>мързелив<\/em>: той не се изпълнява целият наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Той произвежда стойности само когато те бъдат изтеглени, а това означава, че <code>gather<\/code> може да опише <strong>безкрайна<\/strong> редица и пак да е полезен — просто спирате да взимате стойности, когато ви стигнат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Уловката е, че трябва да държите резултата мързелив.<\/span> <span class=\"sg\" data-s=\"1\">Съхраняването му в обикновен масив <code>@array<\/code> би се опитало да събере всяка стойност наведнъж, а за безкрайна редица това никога не свършва.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това дръжте последователността в скалар (където тя остава мързелив <code>Seq<\/code>) и теглете отрязък от нея:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = gather {\n    my $n = 1;\n    loop {\n        take $n++;\n    }\n}\n\nsay $naturals[^5]; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> никога не свършва, но се произвеждат само пет стойности, защото само толкова поискахме с <code>[^5]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да теглите и от началото с <code>.head<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (gather { my $n = 1; loop { take $n++ } }).head(3); # (1 2 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именно мързеливостта позволява на <code>gather<\/code> безопасно да моделира безкрайни потоци: нищо не се изчислява, докато не потрябва, и вземате точно толкова, колкото искате.<\/span><\/p>"]]}}}</script>
