<script type="application/json" id="page-data">{"u":"paradigms/generators/gather-take","n":1234,"k":"topic","pv":"paradigms/generators","nx":"paradigms/generators/gather-take/quiz","tr":["paradigms","paradigms/generators"],"L":{"en":{"t":"gather and take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>gather<\/code> block collects values.<\/span> <span class=\"sg\" data-s=\"1\">Anywhere inside it — including in loops and subroutines it calls — a <code>take<\/code> adds a value to the list that <code>gather<\/code> produces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>take<\/code> runs once for each number <code>1, 2, 3<\/code>, contributing <code>1<\/code>, <code>4<\/code>, and <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The whole <code>gather<\/code> block evaluates to the list of everything taken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> can appear under any control flow, which makes <code>gather<\/code> ideal for building a list with conditions:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here a value is taken only when the <code>if<\/code> succeeds, so only the even numbers end up in the list.<\/span> <span class=\"sg\" data-s=\"1\">This is often clearer than building the list by hand with <code>push<\/code>, because the logic reads as a normal loop and <code>take<\/code> simply marks the values to keep.<\/span><\/p>"]]},"de":{"t":"gather und take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>gather<\/code>-Block sammelt Werte.<\/span> <span class=\"sg\" data-s=\"1\">Überall darin — auch in Schleifen und in Subroutinen, die es aufruft — fügt ein <code>take<\/code> einen Wert zu der Liste hinzu, die <code>gather<\/code> erzeugt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>take<\/code> läuft einmal für jede Zahl <code>1, 2, 3<\/code> und steuert <code>1<\/code>, <code>4<\/code> und <code>9<\/code> bei.<\/span> <span class=\"sg\" data-s=\"1\">Der ganze <code>gather<\/code>-Block ergibt die Liste alles Genommenen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> darf unter jeder Ablaufsteuerung stehen, was <code>gather<\/code> ideal macht, um eine Liste mit Bedingungen zu bauen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wird ein Wert nur genommen, wenn das <code>if<\/code> gelingt, in der Liste landen also nur die geraden Zahlen.<\/span> <span class=\"sg\" data-s=\"1\">Das ist oft klarer, als die Liste von Hand mit <code>push<\/code> aufzubauen, denn die Logik liest sich wie eine gewöhnliche Schleife, und <code>take<\/code> markiert schlicht die zu behaltenden Werte.<\/span><\/p>"]]},"nl":{"t":"gather en take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>gather<\/code>-blok verzamelt waarden.<\/span> <span class=\"sg\" data-s=\"1\">Overal daarbinnen — ook in lussen en in subroutines die het aanroept — voegt een <code>take<\/code> een waarde toe aan de lijst die <code>gather<\/code> oplevert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>take<\/code> draait één keer voor elk getal <code>1, 2, 3<\/code> en levert <code>1<\/code>, <code>4<\/code> en <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het hele <code>gather<\/code>-blok evalueert naar de lijst met alles wat opgenomen is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> mag onder elke besturingsstructuur staan, wat <code>gather<\/code> ideaal maakt om met voorwaarden een lijst op te bouwen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wordt een waarde alleen opgenomen wanneer de <code>if<\/code> slaagt, dus komen alleen de even getallen in de lijst terecht.<\/span> <span class=\"sg\" data-s=\"1\">Dat is vaak duidelijker dan de lijst met de hand met <code>push<\/code> opbouwen, omdat de logica als een gewone lus leest en <code>take<\/code> eenvoudigweg de te bewaren waarden markeert.<\/span><\/p>"]]},"es":{"t":"gather y take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>gather<\/code> recoge valores.<\/span> <span class=\"sg\" data-s=\"1\">En cualquier lugar dentro de él — incluidos los bucles y las subrutinas que llame —, un <code>take<\/code> añade un valor a la lista que produce <code>gather<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>take<\/code> se ejecuta una vez por cada número <code>1, 2, 3<\/code>, aportando <code>1<\/code>, <code>4<\/code> y <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El bloque <code>gather<\/code> entero evalúa a la lista de todo lo tomado.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> puede aparecer bajo cualquier estructura de control, lo que hace de <code>gather<\/code> una herramienta ideal para construir una lista con condiciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí solo se toma un valor cuando el <code>if<\/code> se cumple, así que en la lista acaban solo los números pares.<\/span> <span class=\"sg\" data-s=\"1\">Esto suele ser más claro que construir la lista a mano con <code>push<\/code>, porque la lógica se lee como un bucle normal y <code>take<\/code> simplemente marca los valores que hay que conservar.<\/span><\/p>"]]},"it":{"t":"gather e take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>gather<\/code> raccoglie valori.<\/span> <span class=\"sg\" data-s=\"1\">Ovunque al suo interno — cicli e subroutine da esso chiamate comprese — un <code>take<\/code> aggiunge un valore all'elenco che <code>gather<\/code> produce:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>take<\/code> gira una volta per ogni numero <code>1, 2, 3<\/code>, contribuendo <code>1<\/code>, <code>4<\/code> e <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'intero blocco <code>gather<\/code> vale l'elenco di tutto ciò che è stato preso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> può comparire sotto qualunque flusso di controllo, il che rende <code>gather<\/code> ideale per costruire un elenco con delle condizioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui un valore viene preso solo quando l'<code>if<\/code> riesce, quindi nell'elenco finiscono solo i numeri pari.<\/span> <span class=\"sg\" data-s=\"1\">Spesso questo è più chiaro che costruire l'elenco a mano con <code>push<\/code>, perché la logica si legge come un ciclo normale e <code>take<\/code> si limita a segnare i valori da tenere.<\/span><\/p>"]]},"ru":{"t":"gather и take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>gather<\/code> собирает значения.<\/span> <span class=\"sg\" data-s=\"1\">В любом месте внутри него — в том числе в циклах и вызываемых им подпрограммах — <code>take<\/code> добавляет значение в список, который порождает <code>gather<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> выполняется по одному разу для каждого числа <code>1, 2, 3<\/code>, отдавая <code>1<\/code>, <code>4<\/code> и <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Весь блок <code>gather<\/code> вычисляется в список всего, что было взято.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> может стоять под любой управляющей конструкцией, что делает <code>gather<\/code> идеальным для построения списка с условиями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь значение берётся, только когда срабатывает <code>if<\/code>, поэтому в списке оказываются лишь чётные числа.<\/span> <span class=\"sg\" data-s=\"1\">Часто это понятнее, чем собирать список вручную через <code>push<\/code>, потому что логика читается как обычный цикл, а <code>take<\/code> просто помечает значения, которые нужно оставить.<\/span><\/p>"]]},"uk":{"t":"gather і take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>gather<\/code> збирає значення.<\/span> <span class=\"sg\" data-s=\"1\">Будь-де всередині нього — зокрема в циклах та підпрограмах, які він викликає, — <code>take<\/code> додає значення до списку, який виробляє <code>gather<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> виконується по разу для кожного з чисел <code>1, 2, 3<\/code>, даючи <code>1<\/code>, <code>4<\/code> та <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Увесь блок <code>gather<\/code> обчислюється у список усього взятого.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> може стояти під будь-яким керуванням потоком виконання, що робить <code>gather<\/code> ідеальним для побудови списку з умовами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут значення береться лише тоді, коли спрацьовує <code>if<\/code>, тож у списку опиняються самі парні числа.<\/span> <span class=\"sg\" data-s=\"1\">Часто це зрозуміліше за побудову списку вручну через <code>push<\/code>, бо логіка читається як звичайний цикл, а <code>take<\/code> просто позначає значення, які слід залишити.<\/span><\/p>"]]},"bg":{"t":"gather и take","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>gather<\/code> събира стойности.<\/span> <span class=\"sg\" data-s=\"1\">Навсякъде вътре в него — включително в цикли и подпрограми, които той извиква — <code>take<\/code> добавя стойност към списъка, който <code>gather<\/code> произвежда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = gather {\n    take $_ ** 2 for 1..3;\n}\n\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> се изпълнява по веднъж за всяко от числата <code>1, 2, 3<\/code> и дава <code>1<\/code>, <code>4<\/code> и <code>9<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Целият блок <code>gather<\/code> се изчислява до списъка с всичко взето.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>take<\/code> може да стои под каквото и да е управление на потока, което прави <code>gather<\/code> идеален за изграждане на списък с условия:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather {\n    for 1..10 {\n        take $_ if $_ %% 2;\n    }\n}\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук стойност се взема само когато <code>if<\/code> успее, така че в списъка попадат само четните числа.<\/span> <span class=\"sg\" data-s=\"1\">Това често е по-ясно от изграждането на списъка на ръка с <code>push<\/code>, защото логиката се чете като обикновен цикъл, а <code>take<\/code> просто отбелязва стойностите за запазване.<\/span><\/p>"]]}}}</script>
