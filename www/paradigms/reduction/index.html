<script type="application/json" id="page-data">{"u":"paradigms/reduction","n":1203,"k":"section","pv":"paradigms/closures/exercises/accumulator/solution","nx":"paradigms/reduction/reduction-metaop","tr":["paradigms"],"L":{"en":{"t":"Reduction","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Reduction<\/em> is the act of combining a whole list of values into a single value by applying an operator between them: summing a list, multiplying it, finding its maximum, or joining its strings.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has two ways to do this — the reduction metaoperator <code>[ ]<\/code>, which turns any infix operator into a list reducer, and the <code>reduce<\/code> routine, which does the same with a block.<\/span> <span class=\"sg\" data-s=\"1\">This section covers both.<\/span><\/p>"]]},"de":{"t":"Reduktion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Reduktion<\/em> ist das Zusammenfassen einer ganzen Liste von Werten zu einem einzigen Wert, indem ein Operator zwischen sie gesetzt wird: eine Liste summieren, sie multiplizieren, ihr Maximum finden oder ihre Zeichenketten verbinden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat dafür zwei Wege — den Reduktions-Metaoperator <code>[ ]<\/code>, der jeden Infixoperator zu einem Listenreduzierer macht, und die Routine <code>reduce<\/code>, die dasselbe mit einem Block tut.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt beide.<\/span><\/p>"]]},"nl":{"t":"Reductie","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Reductie<\/em> is het samenvoegen van een hele lijst waarden tot één enkele waarde door er een operator tussen toe te passen: een lijst optellen, vermenigvuldigen, het maximum ervan vinden, of de strings ervan aaneenplakken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft daar twee manieren voor — de reductiemeta-operator <code>[ ]<\/code>, die van elke infixoperator een lijstreductor maakt, en de routine <code>reduce<\/code>, die hetzelfde met een blok doet.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie behandelt beide.<\/span><\/p>"]]},"es":{"t":"Reducción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>reducción<\/em> es el acto de combinar una lista entera de valores en un solo valor aplicando un operador entre ellos: sumar una lista, multiplicarla, hallar su máximo o unir sus cadenas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene dos maneras de hacerlo: el metaoperador de reducción <code>[ ]<\/code>, que convierte cualquier operador infijo en un reductor de listas, y la rutina <code>reduce<\/code>, que hace lo mismo con un bloque.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección cubre ambas.<\/span><\/p>"]]},"it":{"t":"Riduzione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>riduzione<\/em> è l'atto di combinare un intero elenco di valori in un unico valore applicando un operatore fra di essi: sommare un elenco, moltiplicarlo, trovarne il massimo o unirne le stringhe.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha due modi di farlo — il metaoperatore di riduzione <code>[ ]<\/code>, che trasforma qualunque operatore infisso in un riduttore di elenchi, e la routine <code>reduce<\/code>, che fa lo stesso con un blocco.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione tratta entrambi.<\/span><\/p>"]]},"lv":{"t":"Samazināšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Redukcija<\/em> ir vesela vērtību saraksta apvienošana vienā vērtībā, starp tām liekot operatoru: saraksta summēšana, reizināšana, maksimuma atrašana vai tā virkņu salīmēšana.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku to var izdarīt divējādi — ar redukcijas metaoperatoru <code>[ ]<\/code>, kas jebkuru infiksu operatoru pārvērš par saraksta reducētāju, un ar <code>reduce<\/code> procedūru, kas to pašu dara ar bloku.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa apskata abus.<\/span><\/p>"]]},"ru":{"t":"Свёртка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Свёртка<\/em> — это объединение целого списка значений в одно значение путём применения оператора между ними: суммирование списка, перемножение, поиск максимума или соединение строк.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku для этого есть два способа: метаоператор свёртки <code>[ ]<\/code>, превращающий любой инфиксный оператор в сворачиватель списка, и процедура <code>reduce<\/code>, делающая то же самое с блоком.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются оба.<\/span><\/p>"]]},"uk":{"t":"Згортка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Згортка<\/em> — це дія поєднання цілого списку значень в одне значення шляхом застосування оператора між ними: підсумовування списку, множення, пошук максимуму або склеювання рядків.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku є два способи це зробити — метаоператор згортки <code>[ ]<\/code>, що перетворює будь-який інфіксний оператор на згортач списку, та процедура <code>reduce<\/code>, що робить те саме з блоком.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ охоплює обидва.<\/span><\/p>"]]},"bg":{"t":"Свиване","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Свиването<\/em> е действието по обединяване на цял списък от стойности в една стойност чрез прилагане на оператор между тях: сумиране на списък, умножаване, намиране на максимума или слепване на низовете му.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има два начина за това — метаоператорът за свиване <code>[ ]<\/code>, който превръща всеки инфиксен оператор в свиващ списъка, и процедурата <code>reduce<\/code>, която прави същото с блок.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел обхваща и двата.<\/span><\/p>"]]},"eo":{"t":"Redukto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Redukto<\/em> estas la ago kombini tutan liston de valoroj en unu solan valoron aplikante operatoron inter ilin: sumi liston, multipliki ĝin, trovi ĝian maksimumon, aŭ kunigi ĝiajn ĉenojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku havas du manierojn fari tion — la reduktan metaoperatoron <code>[ ]<\/code>, kiu transformas ajnan infiksan operatoron en listan reduktilon, kaj la rutinon <code>reduce<\/code>, kiu faras la samon per bloko.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio traktas ambaŭ.<\/span><\/p>"]]},"la":{"t":"Reductio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Reductio<\/em> est actus totum indicem valorum in unum valorem coniungendi operatore inter eos applicato: indicem summare, illum multiplicare, maximum eius invenire, vel catenas eius coniungere.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku duobus modis hoc agit — metaoperatore reductionis <code>[ ]<\/code>, qui quemlibet operatorem infixum in reductorem indicis vertit, et rutina <code>reduce<\/code>, quae idem per blocum agit.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio utrumque tractat.<\/span><\/p>"]]}}}</script>
