ku', 'is', 'fun';\n\nsay @words.reduce(-&gt; $a, $b { \"$a, $b\" });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/reduction/comma-separated.raku\" target=\"_blank\" rel=\"noopener\">comma-separated.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Raku, is, fun<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui il blocco <strong>costruisce<\/strong> un valore invece di sceglierne uno: <code>$a<\/code> è la stringa assemblata finora e <code>$b<\/code> è la parola successiva, e <code>\"$a, $b\"<\/code> le incolla con una virgola e uno spazio.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La prima chiamata unisce <code>'Raku'<\/code> e <code>'is'<\/code> in <code>Raku, is<\/code>; la seconda unisce quello con <code>'fun'<\/code> per dare <code>Raku, is, fun<\/code>. È il genere di unione consapevole del separatore che il metaoperatore <code>[~]<\/code> non sa esprimere da solo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nel codice vero ricorreresti al metodo incorporato <code>join<\/code>, che fa esattamente questo — <code>say @words.join(', ');<\/code> stampa lo stesso <code>Raku, is, fun<\/code>. Il senso dell'esercizio è esercitarsi a esprimere la stessa idea come blocco di <code>reduce<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Ar komatiem atdalīts saraksts","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @words = 'Raku', 'is', 'fun';\n\nsay @words.reduce(-&gt; $a, $b { \"$a, $b\" });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programm \"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Raku, is, fun<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Здесь блок <strong>строит<\/strong> значение, а не выбирает одно из двух: <code>$a<\/code> — собранная к этому моменту строка, <code>$b<\/code> — очередное слово, а <code>\"$a, $b\"<\/code> склеивает их через запятую с пробелом.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Первый вызов соединяет <code>'Raku'<\/code> и <code>'is'<\/code> в <code>Raku, is<\/code>; второй присоединяет к этому <code>'fun'<\/code> и даёт <code>Raku, is, fun<\/code>. Такое соединение с разделителем метаоператор <code>[~]<\/code> сам по себе выразить не может.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В настоящем коде вы взяли бы встроенный метод <code>join<\/code>, который делает ровно это: <code>say @words.join(', ');<\/code> напечатает то же <code>Raku, is, fun<\/code>. Смысл упражнения — потренироваться выражать ту же идею блоком <code>reduce<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Список через кому»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @words = 'Raku', 'is', 'fun';\n\nsay @words.reduce(-&gt; $a, $b { \"$a, $b\" });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/reduction/comma-separated.raku\" target=\"_blank\" rel=\"noopener\">comma-separated.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Raku, is, fun<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тут блок <strong>будує<\/strong> значення, а не обирає одне з двох: <code>$a<\/code> — це зібраний досі рядок, <code>$b<\/code> — наступне слово, а <code>\"$a, $b\"<\/code> склеює їх комою з пробілом.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Перший виклик з'єднує <code>'Raku'<\/code> та <code>'is'<\/code> у <code>Raku, is<\/code>; другий з'єднує це з <code>'fun'<\/code>, даючи <code>Raku, is, fun<\/code>. Саме такого з'єднання з розділювачем метаоператор <code>[~]<\/code> сам виразити не може.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У справжньому коді ви взяли б вбудований метод <code>join<\/code>, що робить рівно це: <code>say @words.join(', ');<\/code> друкує те саме <code>Raku, is, fun<\/code>. Сенс вправи — потренуватися виражати ту саму ідею блоком <code>reduce<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Списък със запетаи","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @words = 'Raku', 'is', 'fun';\n\nsay @words.reduce(-&gt; $a, $b { \"$a, $b\" });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/reduction/comma-separated.raku\" target=\"_blank\" rel=\"noopener\">comma-separated.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Raku, is, fun<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тук блокът <strong>изгражда<\/strong> стойност, вместо да избира една от двете: <code>$a<\/code> е низът, сглобен дотук, <code>$b<\/code> е следващата дума, а <code>\"$a, $b\"<\/code> ги слепва със запетая и интервал.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Първото извикване съединява <code>'Raku'<\/code> и <code>'is'<\/code> в <code>Raku, is<\/code>; второто съединява това с <code>'fun'<\/code> и дава <code>Raku, is, fun<\/code>. Точно такова съединяване с разделител метаоператорът <code>[~]<\/code> не може да изрази сам.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В истински код бихте посегнали към вградения метод <code>join<\/code>, който прави точно това — <code>say @words.join(', ');<\/code> отпечатва същото <code>Raku, is, fun<\/code>. Смисълът на упражнението е да се упражните да изразите същата идея с блок на <code>reduce<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Listo disigita per komoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @words = 'Raku', 'is', 'fun';\n\nsay @words.reduce(-&gt; $a, $b { \"$a, $b\" });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/reduction/comma-separated.raku\" target=\"_blank\" rel=\"noopener\">comma-separated.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Raku, is, fun<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tie la bloko <strong>konstruas<\/strong> valoron anstataŭ elekti unu: <code>$a<\/code> estas la ĝis nun kunmetita ĉeno kaj <code>$b<\/code> estas la sekva vorto, kaj <code>\"$a, $b\"<\/code> gluas ilin per komo kaj spaco.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La unua voko kunigas <code>'Raku'<\/code> kaj <code>'is'<\/code> en <code>Raku, is<\/code>; la dua kunigas tion kun <code>'fun'<\/code> por doni <code>Raku, is, fun<\/code>. Jen la speco de apartigil-konscia kunigo, kiun la metaoperatoro <code>[~]<\/code> ne povas esprimi memstare.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">En vera kodo vi atingus la enkonstruitan metodon <code>join<\/code>, kiu faras ĝuste tion — <code>say @words.join(', ');<\/code> presas la saman <code>Raku, is, fun<\/code>. La celo de la ekzerco estas ekzerci esprimi la saman ideon kiel blokon <code>reduce<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Index commis divisus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @words = 'Raku', 'is', 'fun';\n\nsay @words.reduce(-&gt; $a, $b { \"$a, $b\" });<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/reduction/comma-separated.raku\" target=\"_blank\" rel=\"noopener\">comma-separated.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Raku, is, fun<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic blocus valorem <strong>aedificat<\/strong> loco eius quod unum eligat: <code>$a<\/code> est catena adhuc composita et <code>$b<\/code> est verbum sequens, et <code>\"$a, $b\"<\/code> ea commate et spatio glutinat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Prima vocatio <code>'Raku'<\/code> et <code>'is'<\/code> in <code>Raku, is<\/code> coniungit; secunda illud cum <code>'fun'<\/code> coniungit ut <code>Raku, is, fun<\/code> det. Hoc est genus coniunctionis separatoris consciae quod metaoperator <code>[~]<\/code> per se exprimere non potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">In vero codice methodum inbuiltam <code>join<\/code> peteres, quae exacte hoc agit — <code>say @words.join(', ');<\/code> idem <code>Raku, is, fun<\/code> imprimit. Ratio exercitationis est eandem ideam ut blocum <code>reduce<\/code> exprimere exercere.<\/span><\/li><\/ol>"]]}}}</script>
