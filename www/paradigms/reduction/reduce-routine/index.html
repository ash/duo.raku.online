<script type="application/json" id="page-data">{"u":"paradigms/reduction/reduce-routine","n":1206,"k":"topic","pv":"paradigms/reduction/reduction-metaop/quiz","nx":"paradigms/reduction/reduce-routine/quiz","tr":["paradigms","paradigms/reduction"],"L":{"en":{"t":"The reduce routine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you want to reduce with a custom operation rather than a single named operator, use the <code>reduce<\/code> routine.<\/span> <span class=\"sg\" data-s=\"1\">It takes a block of two arguments and applies it across the list, carrying the running result forward:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The block <code>* + *<\/code> has two <a href=\"/advanced/whatever/\">Whatever<\/a> stars: the first is the result so far, the second is the next element.<\/span> <span class=\"sg\" data-s=\"1\">So <code>reduce<\/code> computes <code>((((1 + 2) + 3) + 4) + 5)<\/code>, that is <code>15<\/code> — the same as <code>[+]<\/code>, but written as a block.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To see those two arguments at work, give them names and print each step.<\/span> <span class=\"sg\" data-s=\"1\">A pointy block hands back its last expression, so <code>$x + $y<\/code> is both what the block prints about and the value it returns to <code>reduce<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Each of the first four lines is one call to the block.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> is the result accumulated so far and <code>$y<\/code> is the next element from the list.<\/span> <span class=\"sg\" data-s=\"2\">The very first call gets the list’s first two values, <code>1<\/code> and <code>2<\/code>; every later call receives the previous step’s total back as <code>$x<\/code> — <code>3<\/code>, then <code>6<\/code>, then <code>10<\/code> — paired with the next number as <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The block’s value becomes the <code>$x<\/code> of the following call, and the final total, <code>15<\/code>, is what <code>reduce<\/code> returns and <code>say<\/code> prints on the last line.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because the block can be anything, <code>reduce<\/code> is more general.<\/span> <span class=\"sg\" data-s=\"1\">For example, build a value step by step:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each step multiplies the accumulator by ten and adds the next digit, turning the separate digits <code>1, 2, 3, 4<\/code> into the number <code>1234<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Like the other block-taking methods, <code>reduce<\/code> reads well with the <a href=\"/advanced/colon-calls/\">colon-call<\/a> form, which drops the parentheses around the block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In short, <code>[op]<\/code> is the quick form for a named operator, and <code>reduce<\/code> is the flexible form for an arbitrary combining block.<\/span> <span class=\"sg\" data-s=\"1\">Both fold a list down to a single value.<\/span><\/p>"]]},"de":{"t":"Die Routine reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie mit einer eigenen Operation statt mit einem einzelnen benannten Operator reduzieren möchten, nehmen Sie die Routine <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt einen Block mit zwei Argumenten auf und wendet ihn über die Liste an, wobei sie das laufende Ergebnis mitführt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Block <code>* + *<\/code> hat zwei <a href=\"https://course.raku.org/de/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-Sterne: Der erste ist das bisherige Ergebnis, der zweite das nächste Element.<\/span> <span class=\"sg\" data-s=\"1\"><code>reduce<\/code> berechnet also <code>((((1 + 2) + 3) + 4) + 5)<\/code>, also <code>15<\/code> — dasselbe wie <code>[+]<\/code>, nur als Block geschrieben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um diese beiden Argumente bei der Arbeit zu sehen, geben Sie ihnen Namen und geben Sie jeden Schritt aus.<\/span> <span class=\"sg\" data-s=\"1\">Ein Pointy Block liefert seinen letzten Ausdruck zurück, <code>$x + $y<\/code> ist also zugleich das, worüber der Block berichtet, und der Wert, den er <code>reduce<\/code> zurückgibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt aus:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jede der ersten vier Zeilen ist ein Aufruf des Blocks.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> ist das bisher aufgelaufene Ergebnis und <code>$y<\/code> das nächste Element der Liste.<\/span> <span class=\"sg\" data-s=\"2\">Der allererste Aufruf erhält die ersten beiden Werte der Liste, <code>1<\/code> und <code>2<\/code>; jeder spätere Aufruf bekommt die Summe des vorigen Schrittes als <code>$x<\/code> zurück — <code>3<\/code>, dann <code>6<\/code>, dann <code>10<\/code> — gepaart mit der nächsten Zahl als <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Der Wert des Blocks wird zum <code>$x<\/code> des folgenden Aufrufs, und die Endsumme, <code>15<\/code>, ist das, was <code>reduce<\/code> liefert und <code>say<\/code> in der letzten Zeile ausgibt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da der Block alles sein kann, ist <code>reduce<\/code> allgemeiner.<\/span> <span class=\"sg\" data-s=\"1\">Bauen Sie etwa einen Wert Schritt für Schritt auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Schritt multipliziert den Akkumulator mit zehn und addiert die nächste Ziffer, wodurch aus den einzelnen Ziffern <code>1, 2, 3, 4<\/code> die Zahl <code>1234<\/code> wird.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wie die anderen blockannehmenden Methoden liest sich <code>reduce<\/code> gut in der Form mit <a href=\"https://course.raku.org/de/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">Doppelpunkt<\/a>, die die Klammern um den Block weglässt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kurz: <code>[op]<\/code> ist die schnelle Form für einen benannten Operator, und <code>reduce<\/code> die bewegliche Form für einen beliebigen verbindenden Block.<\/span> <span class=\"sg\" data-s=\"1\">Beide falten eine Liste zu einem einzigen Wert zusammen.<\/span><\/p>"]]},"nl":{"t":"De routine reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je met een eigen bewerking wilt reduceren in plaats van met één benoemde operator, gebruik je de routine <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zij neemt een blok met twee argumenten aan en past het over de lijst toe, waarbij ze het lopende resultaat meedraagt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het blok <code>* + *<\/code> heeft twee <a href=\"https://course.raku.org/nl/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-sterren: de eerste is het resultaat tot nu toe, de tweede is het volgende element.<\/span> <span class=\"sg\" data-s=\"1\">Dus <code>reduce<\/code> berekent <code>((((1 + 2) + 3) + 4) + 5)<\/code>, dat wil zeggen <code>15<\/code> — hetzelfde als <code>[+]<\/code>, maar als blok geschreven.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om die twee argumenten aan het werk te zien, geef je ze namen en druk je elke stap af.<\/span> <span class=\"sg\" data-s=\"1\">Een pointy block geeft zijn laatste uitdrukking terug, dus <code>$x + $y<\/code> is zowel waar het blok over afdrukt als de waarde die het aan <code>reduce<\/code> teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Elk van de eerste vier regels is één aanroep van het blok.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> is het tot dan toe opgebouwde resultaat en <code>$y<\/code> is het volgende element uit de lijst.<\/span> <span class=\"sg\" data-s=\"2\">De allereerste aanroep krijgt de eerste twee waarden van de lijst, <code>1<\/code> en <code>2<\/code>; elke latere aanroep krijgt de som van de vorige stap als <code>$x<\/code> terug — <code>3<\/code>, dan <code>6<\/code>, dan <code>10<\/code> — gekoppeld aan het volgende getal als <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De waarde van het blok wordt de <code>$x<\/code> van de volgende aanroep, en de eindsom, <code>15<\/code>, is wat <code>reduce<\/code> teruggeeft en <code>say<\/code> op de laatste regel afdrukt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat het blok van alles kan zijn, is <code>reduce<\/code> algemener.<\/span> <span class=\"sg\" data-s=\"1\">Bouw bijvoorbeeld stap voor stap een waarde op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke stap vermenigvuldigt de accumulator met tien en telt het volgende cijfer erbij op, waarmee de losse cijfers <code>1, 2, 3, 4<\/code> het getal <code>1234<\/code> worden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Net als de andere methoden die een blok aannemen leest <code>reduce<\/code> goed met de vorm met <a href=\"https://course.raku.org/nl/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">dubbele punt<\/a>, die de haakjes om het blok weglaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kort gezegd: <code>[op]<\/code> is de snelle vorm voor een benoemde operator, en <code>reduce<\/code> is de flexibele vorm voor een willekeurig combinerend blok.<\/span> <span class=\"sg\" data-s=\"1\">Beide vouwen een lijst tot één enkele waarde samen.<\/span><\/p>"]]},"es":{"t":"La rutina reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando quieres reducir con una operación a medida en lugar de con un único operador con nombre, usa la rutina <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Recibe un bloque de dos argumentos y lo aplica a lo largo de la lista, arrastrando el resultado acumulado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>* + *<\/code> tiene dos estrellas <a href=\"https://course.raku.org/es/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>: la primera es el resultado obtenido hasta el momento, la segunda es el elemento siguiente.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>reduce<\/code> calcula <code>((((1 + 2) + 3) + 4) + 5)<\/code>, es decir <code>15<\/code>: lo mismo que <code>[+]<\/code>, pero escrito como bloque.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para ver esos dos argumentos en acción, ponles nombre e imprime cada paso.<\/span> <span class=\"sg\" data-s=\"1\">Un bloque con flecha devuelve su última expresión, así que <code>$x + $y<\/code> es a la vez lo que el bloque imprime y el valor que devuelve a <code>reduce<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada una de las cuatro primeras líneas es una llamada al bloque.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> es el resultado acumulado hasta ahora e <code>$y<\/code> es el elemento siguiente de la lista.<\/span> <span class=\"sg\" data-s=\"2\">La primerísima llamada recibe los dos primeros valores de la lista, <code>1<\/code> y <code>2<\/code>; cada llamada posterior recibe de vuelta el total del paso anterior como <code>$x<\/code> — <code>3<\/code>, luego <code>6<\/code>, luego <code>10<\/code> —, emparejado con el número siguiente como <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El valor del bloque se convierte en el <code>$x<\/code> de la llamada siguiente, y el total final, <code>15<\/code>, es lo que devuelve <code>reduce<\/code> y lo que <code>say<\/code> imprime en la última línea.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como el bloque puede ser cualquier cosa, <code>reduce<\/code> es más general.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, construye un valor paso a paso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada paso multiplica el acumulador por diez y añade el dígito siguiente, convirtiendo los dígitos sueltos <code>1, 2, 3, 4<\/code> en el número <code>1234<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como los demás métodos que reciben bloques, <code>reduce<\/code> se lee bien con la forma de <a href=\"https://course.raku.org/es/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">llamada con dos puntos<\/a>, que prescinde de los paréntesis alrededor del bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En resumen, <code>[op]<\/code> es la forma rápida para un operador con nombre, y <code>reduce<\/code> es la forma flexible para un bloque combinador arbitrario.<\/span> <span class=\"sg\" data-s=\"1\">Ambas pliegan una lista hasta un solo valor.<\/span><\/p>"]]},"it":{"t":"La routine reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando vuoi ridurre con un'operazione tua invece che con un singolo operatore già nominato, usa la routine <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Prende un blocco a due argomenti e lo applica lungo l'elenco, portando avanti il risultato corrente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>* + *<\/code> ha due stelle <a href=\"https://course.raku.org/it/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>: la prima è il risultato accumulato finora, la seconda è l'elemento successivo.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>reduce<\/code> calcola <code>((((1 + 2) + 3) + 4) + 5)<\/code>, cioè <code>15<\/code> — lo stesso di <code>[+]<\/code>, ma scritto come blocco.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per vedere quei due argomenti al lavoro, dai loro un nome e stampa ogni passo.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco con la freccia restituisce la sua ultima espressione, quindi <code>$x + $y<\/code> è sia ciò di cui il blocco parla sia il valore che restituisce a <code>reduce<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ciascuna delle prime quattro righe è una chiamata al blocco.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> è il risultato accumulato finora e <code>$y<\/code> è l'elemento successivo dell'elenco.<\/span> <span class=\"sg\" data-s=\"2\">La primissima chiamata riceve i primi due valori dell'elenco, <code>1<\/code> e <code>2<\/code>; ogni chiamata seguente riceve come <code>$x<\/code> il totale del passo precedente — <code>3<\/code>, poi <code>6<\/code>, poi <code>10<\/code> — abbinato al numero successivo come <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il valore del blocco diventa la <code>$x<\/code> della chiamata seguente, e il totale finale, <code>15<\/code>, è ciò che <code>reduce<\/code> restituisce e che <code>say<\/code> stampa sull'ultima riga.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché il blocco può essere qualunque cosa, <code>reduce<\/code> è più generale.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, costruire un valore passo dopo passo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni passo moltiplica l'accumulatore per dieci e aggiunge la cifra successiva, trasformando le cifre separate <code>1, 2, 3, 4<\/code> nel numero <code>1234<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come gli altri metodi che prendono un blocco, <code>reduce<\/code> si legge bene con la forma della <a href=\"https://course.raku.org/it/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">chiamata con i due punti<\/a>, che lascia cadere le parentesi attorno al blocco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In breve: <code>[op]<\/code> è la forma rapida per un operatore già nominato, e <code>reduce<\/code> è la forma flessibile per un blocco combinatore qualunque.<\/span> <span class=\"sg\" data-s=\"1\">Entrambi ripiegano un elenco in un unico valore.<\/span><\/p>"]]},"ru":{"t":"Процедура reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда сворачивать нужно собственной операцией, а не одним именованным оператором, используйте процедуру <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она принимает блок от двух аргументов и применяет его вдоль списка, перенося накопленный результат дальше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В блоке <code>* + *<\/code> две звезды <a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>: первая — это результат, накопленный к этому моменту, вторая — очередной элемент.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>reduce<\/code> вычисляет <code>((((1 + 2) + 3) + 4) + 5)<\/code>, то есть <code>15<\/code>, — то же, что и <code>[+]<\/code>, но записанное блоком.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы увидеть эти два аргумента в деле, дайте им имена и напечатайте каждый шаг.<\/span> <span class=\"sg\" data-s=\"1\">Стрелочный блок возвращает своё последнее выражение, поэтому <code>$x + $y<\/code> — это и то, о чём блок печатает, и то значение, которое он возвращает в <code>reduce<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Каждая из первых четырёх строк — это один вызов блока.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> — накопленный к этому моменту результат, <code>$y<\/code> — очередной элемент списка.<\/span> <span class=\"sg\" data-s=\"2\">Самый первый вызов получает два первых значения списка, <code>1<\/code> и <code>2<\/code>; каждый следующий получает обратно итог предыдущего шага как <code>$x<\/code> — <code>3<\/code>, затем <code>6<\/code>, затем <code>10<\/code>, — в паре с очередным числом как <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Значение блока становится <code>$x<\/code> следующего вызова, а итоговая сумма, <code>15<\/code>, — это то, что <code>reduce<\/code> возвращает и что <code>say<\/code> печатает последней строкой.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку блок может быть каким угодно, <code>reduce<\/code> более универсален.<\/span> <span class=\"sg\" data-s=\"1\">Например, можно строить значение шаг за шагом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый шаг умножает накопитель на десять и прибавляет очередную цифру, превращая отдельные цифры <code>1, 2, 3, 4<\/code> в число <code>1234<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как и другие принимающие блок методы, <code>reduce<\/code> хорошо читается в форме <a href=\"https://course.raku.org/ru/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">вызова с двоеточием<\/a>, где скобки вокруг блока опускаются:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коротко говоря, <code>[op]<\/code> — быстрая форма для именованного оператора, а <code>reduce<\/code> — гибкая форма для произвольного объединяющего блока.<\/span> <span class=\"sg\" data-s=\"1\">Оба сворачивают список к одному значению.<\/span><\/p>"]]},"uk":{"t":"Процедура reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви хочете згорнути список власною операцією, а не одним іменованим оператором, скористайтеся процедурою <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вона приймає блок від двох аргументів і застосовує його вздовж списку, несучи поточний результат далі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>* + *<\/code> має дві зірочки <a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>: перша — це результат, накопичений досі, друга — наступний елемент.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>reduce<\/code> обчислює <code>((((1 + 2) + 3) + 4) + 5)<\/code>, тобто <code>15<\/code> — те саме, що й <code>[+]<\/code>, але записане блоком.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб побачити ці два аргументи в дії, дайте їм імена й надрукуйте кожен крок.<\/span> <span class=\"sg\" data-s=\"1\">Гострий блок повертає свій останній вираз, тож <code>$x + $y<\/code> є водночас і тим, про що блок друкує, і значенням, яке він повертає в <code>reduce<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожен із перших чотирьох рядків є одним викликом блоку.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> — це результат, накопичений досі, а <code>$y<\/code> — наступний елемент списку.<\/span> <span class=\"sg\" data-s=\"2\">Найперший виклик отримує два перші значення списку, <code>1<\/code> та <code>2<\/code>; кожен наступний отримує назад підсумок попереднього кроку як <code>$x<\/code> — <code>3<\/code>, потім <code>6<\/code>, потім <code>10<\/code> — у парі з наступним числом як <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Значення блоку стає <code>$x<\/code> наступного виклику, а підсумковий результат, <code>15<\/code>, — це те, що <code>reduce<\/code> повертає, а <code>say<\/code> друкує в останньому рядку.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки блок може бути яким завгодно, <code>reduce<\/code> є загальнішим.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, можна будувати значення крок за кроком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен крок множить акумулятор на десять і додає наступну цифру, перетворюючи окремі цифри <code>1, 2, 3, 4<\/code> на число <code>1234<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як і інші методи, що приймають блок, <code>reduce<\/code> добре читається у формі <a href=\"https://course.raku.org/uk/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">виклику з двокрапкою<\/a>, яка прибирає дужки навколо блоку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коротко: <code>[op]<\/code> — швидка форма для іменованого оператора, а <code>reduce<\/code> — гнучка форма для довільного поєднувального блоку.<\/span> <span class=\"sg\" data-s=\"1\">Обидві згортають список до одного значення.<\/span><\/p>"]]},"bg":{"t":"Процедурата reduce","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато искате да свиете със собствена операция, а не с един именуван оператор, използвайте процедурата <code>reduce<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя приема блок от два аргумента и го прилага по списъка, носейки текущия резултат нататък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(* + *); # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>* + *<\/code> има две звезди <a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>: първата е резултатът дотук, втората е следващият елемент.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>reduce<\/code> изчислява <code>((((1 + 2) + 3) + 4) + 5)<\/code>, тоест <code>15<\/code> — същото като <code>[+]<\/code>, но записано с блок.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да видите тези два аргумента в действие, дайте им имена и отпечатайте всяка стъпка.<\/span> <span class=\"sg\" data-s=\"1\">Острият блок връща последния си израз, така че <code>$x + $y<\/code> е и онова, за което блокът печата, и стойността, която той връща на <code>reduce<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce(\n    -&gt; $x, $y {\n        say \"$x + $y\";\n        $x + $y;\n    }\n);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>1 + 2\n3 + 3\n6 + 4\n10 + 5\n15<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всеки от първите четири реда е едно извикване на блока.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x<\/code> е резултатът, натрупан дотук, а <code>$y<\/code> е следващият елемент от списъка.<\/span> <span class=\"sg\" data-s=\"2\">Най-първото извикване получава първите две стойности на списъка — <code>1<\/code> и <code>2<\/code>; всяко следващо получава обратно сбора от предишната стъпка като <code>$x<\/code> — <code>3<\/code>, после <code>6<\/code>, после <code>10<\/code> — в двойка със следващото число като <code>$y<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Стойността на блока става <code>$x<\/code> на следващото извикване, а крайният сбор <code>15<\/code> е онова, което <code>reduce<\/code> връща и <code>say<\/code> отпечатва на последния ред.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже блокът може да е какъвто и да е, <code>reduce<\/code> е по-общ.<\/span> <span class=\"sg\" data-s=\"1\">Например можете да изградите стойност стъпка по стъпка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..4).reduce(-&gt; $acc, $x { $acc * 10 + $x }); # 1234<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяка стъпка умножава акумулатора по десет и добавя следващата цифра, превръщайки отделните цифри <code>1, 2, 3, 4<\/code> в числото <code>1234<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както и другите методи, приемащи блок, <code>reduce<\/code> се чете добре във формата <a href=\"https://course.raku.org/bg/advanced/colon-calls/\" target=\"_blank\" rel=\"noopener\">извикване с двоеточие<\/a>, която маха скобите около блока:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).reduce: * + *; # 15<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Накратко: <code>[op]<\/code> е бързата форма за именуван оператор, а <code>reduce<\/code> — гъвкавата форма за произволен обединяващ блок.<\/span> <span class=\"sg\" data-s=\"1\">И двете свеждат списък до една стойност.<\/span><\/p>"]]}}}</script>
