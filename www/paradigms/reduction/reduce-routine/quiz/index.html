<script type="application/json" id="page-data">{"u":"paradigms/reduction/reduce-routine/quiz","n":1207,"k":"quiz","pv":"paradigms/reduction/reduce-routine","nx":"paradigms/reduction/exercises","tr":["paradigms","paradigms/reduction","paradigms/reduction/reduce-routine"],"L":{"en":{"t":"Quiz — Reduction","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> folds the list left to right, and the <strong>first<\/strong> argument of the block is always the result so far — here, the left operand of <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So it computes <code>((10 - 1) - 2) - 3<\/code>, that is <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Folding the other way, <code>10 - (1 - (2 - 3))<\/code>, would give <code>8<\/code>, and adding instead of subtracting would give <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Unlike <code>+<\/code>, subtraction depends on order, so the roles of the two arguments really matter.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Reduktion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> faltet die Liste von links nach rechts, und das <strong>erste<\/strong> Argument des Blocks ist stets das bisherige Ergebnis — hier der linke Operand von <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es berechnet also <code>((10 - 1) - 2) - 3<\/code>, also <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Andersherum gefaltet, <code>10 - (1 - (2 - 3))<\/code>, ergäbe <code>8<\/code>, und Addieren statt Abziehen ergäbe <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Anders als <code>+<\/code> hängt das Abziehen von der Reihenfolge ab, die Rollen der beiden Argumente sind also wirklich wichtig.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Reductie","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> vouwt de lijst van links naar rechts, en het <strong>eerste<\/strong> argument van het blok is altijd het resultaat tot nu toe — hier de linkeroperand van <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het berekent dus <code>((10 - 1) - 2) - 3<\/code>, dat wil zeggen <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Andersom vouwen, <code>10 - (1 - (2 - 3))<\/code>, zou <code>8<\/code> geven, en optellen in plaats van aftrekken zou <code>16<\/code> geven.<\/span> <span class=\"sg\" data-s=\"3\">Anders dan <code>+<\/code> hangt aftrekken van de volgorde af, dus de rollen van de twee argumenten doen er werkelijk toe.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Reducción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> pliega la lista de izquierda a derecha, y el <strong>primer<\/strong> argumento del bloque es siempre el resultado obtenido hasta el momento, aquí el operando izquierdo de <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que calcula <code>((10 - 1) - 2) - 3<\/code>, es decir <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Plegar en el otro sentido, <code>10 - (1 - (2 - 3))<\/code>, daría <code>8<\/code>, y sumar en lugar de restar daría <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">A diferencia de <code>+<\/code>, la resta depende del orden, así que los papeles de los dos argumentos importan de verdad.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Riduzione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> ripiega l'elenco da sinistra a destra, e il <strong>primo<\/strong> argomento del blocco è sempre il risultato accumulato finora — qui l'operando sinistro di <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi calcola <code>((10 - 1) - 2) - 3<\/code>, cioè <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ripiegando nell'altro verso, <code>10 - (1 - (2 - 3))<\/code>, si otterrebbe <code>8<\/code>, e sommando invece di sottrarre si otterrebbe <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">A differenza di <code>+<\/code>, la sottrazione dipende dall'ordine, quindi i ruoli dei due argomenti contano davvero.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Samazināšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko izdrukā šī programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> saloka sarakstu no kreisās uz labo, un bloka <strong>pirmais<\/strong> arguments vienmēr ir līdzšinējais rezultāts — šeit tas ir <code>-<\/code> kreisais operands.<\/span> <span class=\"sg\" data-s=\"1\">Tātad tiek aprēķināts <code>((10 - 1) - 2) - 3<\/code>, tas ir, <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Salokot otrādi, <code>10 - (1 - (2 - 3))<\/code>, iznāktu <code>8<\/code>, un saskaitot atņemšanas vietā — <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Atšķirībā no <code>+<\/code> atņemšana ir atkarīga no secības, tāpēc abu argumentu lomas tiešām ir svarīgas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Свёртка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> сворачивает список слева направо, и <strong>первый<\/strong> аргумент блока — это всегда накопленный результат, здесь левый операнд <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вычисляется <code>((10 - 1) - 2) - 3<\/code>, то есть <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Свёртка в другую сторону, <code>10 - (1 - (2 - 3))<\/code>, дала бы <code>8<\/code>, а сложение вместо вычитания дало бы <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В отличие от <code>+<\/code>, вычитание зависит от порядка, поэтому роли двух аргументов действительно важны.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Згортка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що надрукує наступна програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> згортає список зліва направо, і <strong>першим<\/strong> аргументом блоку завжди є результат, накопичений досі, — тут це лівий операнд <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож обчислюється <code>((10 - 1) - 2) - 3<\/code>, тобто <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Згортка в інший бік, <code>10 - (1 - (2 - 3))<\/code>, дала б <code>8<\/code>, а додавання замість віднімання дало б <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">На відміну від <code>+<\/code>, віднімання залежить від порядку, тож ролі двох аргументів справді мають значення.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Свиване","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> свива списъка отляво надясно, а <strong>първият<\/strong> аргумент на блока винаги е резултатът дотук — тук левият операнд на <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова се изчислява <code>((10 - 1) - 2) - 3<\/code>, тоест <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Свиване в другата посока — <code>10 - (1 - (2 - 3))<\/code> — би дало <code>8<\/code>, а събиране вместо изваждане би дало <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">За разлика от <code>+<\/code>, изваждането зависи от реда, така че ролите на двата аргумента наистина имат значение.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Redukto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion presas la jena programo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> faldas la liston de maldekstre dekstren, kaj la <strong>unua<\/strong> argumento de la bloko ĉiam estas la ĝisnuna rezulto — ĉi tie, la maldekstra operando de <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi kalkulas <code>((10 - 1) - 2) - 3<\/code>, tio estas <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Faldi la alian direkton, <code>10 - (1 - (2 - 3))<\/code>, donus <code>8<\/code>, kaj adicii anstataŭ subtrahi donus <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Malsame ol <code>+<\/code>, subtraho dependas de la ordo, do la roloj de la du argumentoj vere gravas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Reductio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid haec programma imprimit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (10, 1, 2, 3).reduce(* - *);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">4<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">8<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">16<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">-4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>reduce<\/code> indicem a sinistra ad dextram complicat, et <strong>primum<\/strong> bloci argumentum semper est effectus adhuc collectus — hic operandum sinistrum operatoris <code>-<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>((10 - 1) - 2) - 3<\/code> computat, id est <code>9 - 2 - 3 = 4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In alteram partem complicans, <code>10 - (1 - (2 - 3))<\/code>, <code>8<\/code> daret, et addens loco subtrahendi <code>16<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dissimilis <code>+<\/code>, subtractio ab ordine pendet, itaque partes duorum argumentorum revera intersunt.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
