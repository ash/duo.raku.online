<script type="application/json" id="page-data">{"u":"paradigms/reduction/reduction-metaop","n":1204,"k":"topic","pv":"paradigms/reduction","nx":"paradigms/reduction/reduction-metaop/quiz","tr":["paradigms","paradigms/reduction"],"L":{"en":{"t":"The reduction metaoperator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wrap any infix operator in square brackets and it becomes a <em>reduction<\/em>: it is inserted between every element of a list, collapsing the list to one value.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> sums the list as if you had written <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> multiplies it.<\/span> <span class=\"sg\" data-s=\"1\">The same works with any infix operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> reduces with the <code>max<\/code> operator to find the largest element, and <code>[~]<\/code> reduces with the string-concatenation operator <code>~<\/code> to glue the pieces together.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The reduction metaoperator works on any list, including a range:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It is one of Raku’s most compact and expressive features: a whole loop’s worth of accumulation in a pair of brackets.<\/span><\/p>"]]},"de":{"t":"Der Reduktions-Metaoperator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Setzen Sie einen beliebigen Infixoperator in eckige Klammern, und er wird zu einer <em>Reduktion<\/em>: Er wird zwischen jedes Element einer Liste gesetzt und klappt die Liste zu einem Wert zusammen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> summiert die Liste, als hätten Sie <code>1 + 2 + 3 + 4 + 5<\/code> geschrieben; <code>[*]<\/code> multipliziert sie.<\/span> <span class=\"sg\" data-s=\"1\">Dasselbe funktioniert mit jedem Infixoperator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> reduziert mit dem Operator <code>max<\/code>, um das größte Element zu finden, und <code>[~]<\/code> reduziert mit dem Verkettungsoperator <code>~<\/code>, um die Stücke zusammenzufügen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Reduktions-Metaoperator arbeitet auf jeder Liste, auch auf einem Bereich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Er ist eine von Rakus knappsten und ausdrucksstärksten Möglichkeiten: eine ganze Schleife voller Aufsummierung in einem Klammerpaar.<\/span><\/p>"]]},"nl":{"t":"De reductiemeta-operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zet elke infixoperator tussen vierkante haken en hij wordt een <em>reductie<\/em>: hij wordt tussen elk element van een lijst ingevoegd en klapt de lijst tot één waarde in.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> telt de lijst op alsof je <code>1 + 2 + 3 + 4 + 5<\/code> geschreven had; <code>[*]<\/code> vermenigvuldigt haar.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde werkt met elke infixoperator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> reduceert met de operator <code>max<\/code> om het grootste element te vinden, en <code>[~]<\/code> reduceert met de stringplakoperator <code>~<\/code> om de stukken aan elkaar te plakken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De reductiemeta-operator werkt op elke lijst, ook op een bereik:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is een van Raku's compactste en meest expressieve mogelijkheden: een hele lus aan accumulatie in een paar haken.<\/span><\/p>"]]},"es":{"t":"El metaoperador de reducción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Envuelve cualquier operador infijo entre corchetes y se convierte en una <em>reducción<\/em>: se inserta entre todos los elementos de una lista, contrayéndola a un solo valor.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> suma la lista como si hubieras escrito <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> la multiplica.<\/span> <span class=\"sg\" data-s=\"1\">Lo mismo funciona con cualquier operador infijo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> reduce con el operador <code>max<\/code> para hallar el elemento mayor, y <code>[~]<\/code> reduce con el operador de concatenación de cadenas <code>~<\/code> para pegar las piezas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El metaoperador de reducción funciona sobre cualquier lista, incluido un rango:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es una de las características más compactas y expresivas de Raku: la acumulación de todo un bucle en un par de corchetes.<\/span><\/p>"]]},"it":{"t":"Il metaoperatore di riduzione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Avvolgi un qualunque operatore infisso fra parentesi quadre e diventa una <em>riduzione<\/em>: viene inserito fra ogni elemento di un elenco, facendolo collassare in un unico valore.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> somma l'elenco come se avessi scritto <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> lo moltiplica.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso vale con qualunque operatore infisso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> riduce con l'operatore <code>max<\/code> per trovare l'elemento più grande, e <code>[~]<\/code> riduce con l'operatore di concatenazione <code>~<\/code> per incollare insieme i pezzi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metaoperatore di riduzione funziona su qualunque elenco, intervalli compresi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">È una delle funzionalità più compatte ed espressive di Raku: un intero ciclo di accumulazione in un paio di parentesi.<\/span><\/p>"]]},"lv":{"t":"Samazināšanas metaoperators","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ielieciet jebkuru infiksu operatoru kvadrātiekavās, un tas kļūst par <em>redukciju<\/em>: tas tiek iesprausts starp katriem diviem saraksta elementiem, savelkot sarakstu vienā vērtībā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> saskaita sarakstu, it kā jūs būtu uzrakstījuši <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> to sareizina.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats darbojas ar jebkuru infiksu operatoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> reducē ar operatoru <code>max<\/code>, atrodot lielāko elementu, un <code>[~]<\/code> reducē ar virkņu savienošanas operatoru <code>~<\/code>, salīmējot gabalus kopā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Redukcijas metaoperators darbojas ar jebkuru sarakstu, arī ar diapazonu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā ir viena no kompaktākajām un izteiksmīgākajām Raku iespējām: vesela cikla vērtā uzkrāšana vienā iekavu pārī.<\/span><\/p>"]]},"ru":{"t":"Метаоператор свёртки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Заключите любой инфиксный оператор в квадратные скобки, и он станет <em>свёрткой<\/em>: он вставляется между каждыми элементами списка, схлопывая список в одно значение.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> суммирует список, как если бы вы написали <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> его перемножает.<\/span> <span class=\"sg\" data-s=\"1\">То же работает с любым инфиксным оператором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> сворачивает список оператором <code>max<\/code>, находя наибольший элемент, а <code>[~]<\/code> сворачивает оператором конкатенации строк <code>~<\/code>, склеивая кусочки вместе.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаоператор свёртки работает с любым списком, в том числе с диапазоном:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это одна из самых компактных и выразительных возможностей Raku: накопление на целый цикл — в одной паре скобок.<\/span><\/p>"]]},"uk":{"t":"Метаоператор згортки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Обгорніть будь-який інфіксний оператор у квадратні дужки — і він стане <em>згорткою<\/em>: його буде вставлено між кожним елементом списку, згортаючи список в одне значення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> підсумовує список так, ніби ви написали <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> його перемножує.<\/span> <span class=\"sg\" data-s=\"1\">Те саме працює з будь-яким інфіксним оператором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> згортає список оператором <code>max<\/code>, щоб знайти найбільший елемент, а <code>[~]<\/code> згортає його оператором конкатенації рядків <code>~<\/code>, щоб склеїти шматки докупи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаоператор згортки працює з будь-яким списком, зокрема з діапазоном:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це одна з найкомпактніших та найвиразніших можливостей Raku: накопичення на цілий цикл — у парі дужок.<\/span><\/p>"]]},"bg":{"t":"Метаоператорът за свиване","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Обвийте кой да е инфиксен оператор в квадратни скоби и той се превръща в <em>свиване<\/em>: вмъква се между всеки елемент на списъка и свежда списъка до една стойност.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> сумира списъка, все едно сте написали <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> го умножава.<\/span> <span class=\"sg\" data-s=\"1\">Същото работи с всеки инфиксен оператор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> свива с оператора <code>max<\/code>, за да намери най-големия елемент, а <code>[~]<\/code> свива с оператора за слепване на низове <code>~<\/code>, за да съедини парчетата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът за свиване работи с всеки списък, включително с диапазон:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Той е една от най-сбитите и изразителни възможности на Raku: натрупване за цял цикъл — в чифт скоби.<\/span><\/p>"]]},"eo":{"t":"La metaoperatoro de redukto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Envolvu ajnan infiksan operatoron en rektajn krampojn kaj ĝi fariĝas <em>redukto<\/em>: ĝi estas enmetata inter ĉiun elementon de listo, kunfaldante la liston al unu valoro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> sumigas la liston kvazaŭ vi estus skribinta <code>1 + 2 + 3 + 4 + 5<\/code>; <code>[*]<\/code> multiplikas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">La samo funkcias kun ajna infiksa operatoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> reduktas per la operatoro <code>max<\/code> por trovi la plej grandan elementon, kaj <code>[~]<\/code> reduktas per la ĉenkuniga operatoro <code>~<\/code> por glui la pecojn kune.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La redukta metaoperatoro funkcias sur ajna listo, inkluzive de intervalo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĝi estas unu el la plej kompaktaj kaj esprimplenaj ecoj de Raku: tuta buklo da akumulado en paro da krampoj.<\/span><\/p>"]]},"la":{"t":"Metaoperator reductionis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Involve quemlibet operatorem infixum uncis quadratis et <em>reductio<\/em> fit: inter omnia indicis elementa inseritur, indicem in unum valorem contrahens.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1, 2, 3, 4, 5; # 15\nsay [*] 1, 2, 3, 4, 5; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>[+]<\/code> indicem summat ac si <code>1 + 2 + 3 + 4 + 5<\/code> scripsisses; <code>[*]<\/code> illum multiplicat.<\/span> <span class=\"sg\" data-s=\"1\">Idem cum quolibet operatore infixo operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [max] 4, 9, 2, 7; # 9\nsay [min] 4, 9, 2, 7; # 2\nsay [~] 'a', 'b', 'c'; # abc<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[max]<\/code> operatore <code>max<\/code> reducit ut elementum maximum inveniat, et <code>[~]<\/code> operatore concatenationis catenarum <code>~<\/code> reducit ut partes simul glutinet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metaoperator reductionis in quolibet indice operatur, etiam in intervallo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [+] 1..100; # 5050<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Est una ex facultatibus Raku compendiosissimis et expressivissimis: totius anuli accumulatio in uno uncorum pari.<\/span><\/p>"]]}}}</script>
