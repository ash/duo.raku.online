<script type="application/json" id="page-data">{"u":"paradigms/channels/closing-a-channel","n":1304,"k":"topic","pv":"paradigms/channels/send-and-receive/quiz","nx":"paradigms/channels/closing-a-channel/quiz","tr":["paradigms","paradigms/channels"],"L":{"en":{"t":"Closing a channel","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When a producer has no more values to send, it calls <code>.close<\/code> on the channel.<\/span> <span class=\"sg\" data-s=\"1\">Closing signals to the consumer that the stream has ended.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The most convenient way to consume a closed channel is <code>.list<\/code>, which gives you every remaining value and finishes once the channel is closed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because <code>.list<\/code> waits for the channel to be closed, it is perfect for “collect everything the producer sends”.<\/span> <span class=\"sg\" data-s=\"1\">You can treat the result like any other list — sum it, count it, and so on:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Closing is how a consumer knows when to stop.<\/span> <span class=\"sg\" data-s=\"1\">Without it, <code>.list<\/code> (or a loop of <code>.receive<\/code>) would wait forever for a value that never comes.<\/span> <span class=\"sg\" data-s=\"2\">Always close a channel when the sending is done.<\/span><\/p>"]]},"de":{"t":"Einen Kanal schließen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hat ein Erzeuger keine Werte mehr zu senden, ruft er <code>.close<\/code> auf dem Kanal auf.<\/span> <span class=\"sg\" data-s=\"1\">Das Schließen meldet dem Verbraucher, dass der Strom geendet hat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Am bequemsten verbraucht man einen geschlossenen Kanal mit <code>.list<\/code>, das Ihnen jeden verbleibenden Wert gibt und endet, sobald der Kanal geschlossen ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da <code>.list<\/code> auf das Schließen des Kanals wartet, eignet es sich bestens für „sammle alles, was der Erzeuger sendet“.<\/span> <span class=\"sg\" data-s=\"1\">Sie können das Ergebnis wie jede andere Liste behandeln — summieren, zählen und so weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Schließen ist es, woran ein Verbraucher erkennt, wann er aufhören soll.<\/span> <span class=\"sg\" data-s=\"1\">Ohne es würde <code>.list<\/code> (oder eine Schleife aus <code>.receive<\/code>) ewig auf einen Wert warten, der nie kommt.<\/span> <span class=\"sg\" data-s=\"2\">Schließen Sie einen Kanal stets, wenn das Senden erledigt ist.<\/span><\/p>"]]},"nl":{"t":"Een kanaal sluiten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer een producent geen waarden meer te versturen heeft, roept hij <code>.close<\/code> op het kanaal aan.<\/span> <span class=\"sg\" data-s=\"1\">Sluiten signaleert de consument dat de stroom geëindigd is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De handigste manier om een gesloten kanaal te consumeren is <code>.list<\/code>, dat je elke resterende waarde geeft en klaar is zodra het kanaal gesloten is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>.list<\/code> wacht tot het kanaal gesloten is, is het perfect voor \"verzamel alles wat de producent verstuurt\".<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het resultaat als elke andere lijst behandelen — optellen, tellen, enzovoort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sluiten is hoe een consument weet wanneer hij moet stoppen.<\/span> <span class=\"sg\" data-s=\"1\">Zonder dat zou <code>.list<\/code> (of een lus van <code>.receive<\/code>) eeuwig wachten op een waarde die nooit komt.<\/span> <span class=\"sg\" data-s=\"2\">Sluit een kanaal altijd zodra het versturen klaar is.<\/span><\/p>"]]},"es":{"t":"Cerrar un canal","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando un productor no tiene más valores que enviar, llama a <code>.close<\/code> sobre el canal.<\/span> <span class=\"sg\" data-s=\"1\">Cerrar señala al consumidor que el flujo ha terminado.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La manera más cómoda de consumir un canal cerrado es <code>.list<\/code>, que te da todos los valores restantes y acaba en cuanto el canal está cerrado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como <code>.list<\/code> espera a que el canal se cierre, es perfecta para «recoge todo lo que envíe el productor».<\/span> <span class=\"sg\" data-s=\"1\">Puedes tratar el resultado como cualquier otra lista: sumarlo, contarlo, etcétera.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cerrar es como un consumidor sabe cuándo parar.<\/span> <span class=\"sg\" data-s=\"1\">Sin ello, <code>.list<\/code> (o un bucle de <code>.receive<\/code>) esperaría para siempre un valor que nunca llega.<\/span> <span class=\"sg\" data-s=\"2\">Cierra siempre un canal cuando el envío haya terminado.<\/span><\/p>"]]},"it":{"t":"Chiudere un channel","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando un produttore non ha più valori da inviare, chiama <code>.close<\/code> sul channel.<\/span> <span class=\"sg\" data-s=\"1\">La chiusura segnala al consumatore che il flusso è finito.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il modo più comodo di consumare un channel chiuso è <code>.list<\/code>, che ti dà ogni valore rimasto e finisce una volta che il channel è chiuso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>.list<\/code> aspetta che il channel sia chiuso, è perfetto per «raccogli tutto ciò che il produttore invia».<\/span> <span class=\"sg\" data-s=\"1\">Puoi trattare il risultato come qualunque altro elenco — sommarlo, contarlo e così via:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La chiusura è il modo in cui un consumatore sa quando fermarsi.<\/span> <span class=\"sg\" data-s=\"1\">Senza di essa, <code>.list<\/code> (o un ciclo di <code>.receive<\/code>) aspetterebbe per sempre un valore che non arriva mai.<\/span> <span class=\"sg\" data-s=\"2\">Chiudi sempre un channel quando l'invio è finito.<\/span><\/p>"]]},"ru":{"t":"Закрытие канала","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда у производителя больше нет значений для отправки, он вызывает у канала <code>.close<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Закрытие сообщает потребителю, что поток закончился.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Удобнее всего потреблять закрытый канал методом <code>.list<\/code>: он выдаёт все оставшиеся значения и завершается, как только канал закрыт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>.list<\/code> дожидается закрытия канала, он идеально подходит для «собрать всё, что отправит производитель».<\/span> <span class=\"sg\" data-s=\"1\">С результатом можно обращаться как с любым другим списком — просуммировать, пересчитать и так далее:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Закрытие — это то, как потребитель узнаёт, когда остановиться.<\/span> <span class=\"sg\" data-s=\"1\">Без него <code>.list<\/code> (или цикл из <code>.receive<\/code>) ждал бы вечно значения, которое так и не придёт.<\/span> <span class=\"sg\" data-s=\"2\">Всегда закрывайте канал, когда отправка окончена.<\/span><\/p>"]]},"uk":{"t":"Закриття каналу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли у виробника більше немає значень для надсилання, він викликає на каналі <code>.close<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Закриття сигналізує споживачеві, що потік завершився.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найзручніший спосіб спожити закритий канал — це <code>.list<\/code>, що дає вам кожне значення, яке залишилося, і завершується, щойно канал закрито:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>.list<\/code> чекає закриття каналу, він ідеальний для «зібрати все, що надсилає виробник».<\/span> <span class=\"sg\" data-s=\"1\">Із результатом можна поводитися як із будь-яким іншим списком — підсумувати, порахувати тощо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Закриття — це те, як споживач дізнається, коли зупинитися.<\/span> <span class=\"sg\" data-s=\"1\">Без нього <code>.list<\/code> (або цикл із <code>.receive<\/code>) чекав би вічно на значення, яке ніколи не прийде.<\/span> <span class=\"sg\" data-s=\"2\">Завжди закривайте канал, коли надсилання завершено.<\/span><\/p>"]]},"bg":{"t":"Затваряне на канал","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато производителят няма повече стойности за изпращане, той извиква <code>.close<\/code> върху канала.<\/span> <span class=\"sg\" data-s=\"1\">Затварянето сигнализира на потребителя, че потокът е приключил.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-удобният начин да се консумира затворен канал е <code>.list<\/code>, който ви дава всяка останала стойност и приключва, щом каналът е затворен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\n$c.send(3);\n$c.close;\n\nsay $c.list; # (1 2 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже <code>.list<\/code> чака каналът да бъде затворен, той е идеален за „събери всичко, което производителят изпрати“.<\/span> <span class=\"sg\" data-s=\"1\">С резултата можете да работите като с всеки друг списък — да го сумирате, да го преброите и така нататък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send($_) for 1..5;\n$c.close;\n\nsay [+] $c.list; # 15<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Затварянето е начинът потребителят да разбере кога да спре.<\/span> <span class=\"sg\" data-s=\"1\">Без него <code>.list<\/code> (или цикъл от <code>.receive<\/code>) би чакал вечно стойност, която никога няма да дойде.<\/span> <span class=\"sg\" data-s=\"2\">Винаги затваряйте канала, когато изпращането е приключило.<\/span><\/p>"]]}}}</script>
