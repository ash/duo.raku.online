 Sie in einem zweiten <code>start<\/code>-Block — dem Verbraucher — jeden Wert mit <code>.list<\/code> und liefern Sie ihre Summe.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Warten Sie beide<\/strong> Promises zusammen ab und geben Sie die Summe aus, die der Verbraucher erzeugt hat.<\/span> <span class=\"sg\" data-s=\"4\">Das ist die natürliche Form eines Kanals: ein Erzeuger auf einem Thread, ein Verbraucher auf einem anderen, koordiniert von einem dritten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Tel een kanaal op‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Maak een kanaal en drijf het met <strong>twee promises<\/strong> aan.<\/span> <span class=\"sg\" data-s=\"1\">Verstuur in het ene <code>start<\/code>-blok — de producent — de getallen <code>1..6<\/code> het kanaal in en sluit het daarna.<\/span> <span class=\"sg\" data-s=\"2\">Verzamel in een tweede <code>start<\/code>-blok — de consument — elke waarde met <code>.list<\/code> en geef hun som terug.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Wacht beide<\/strong> promises samen af, en druk de som af die de consument opleverde.<\/span> <span class=\"sg\" data-s=\"4\">Dit is de natuurlijke vorm van een kanaal: een producent op de ene thread, een consument op de andere, gecoördineerd vanaf een derde.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Sume un canal","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Crea un canal y muévelo con <strong>dos promesas<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">En un bloque <code>start<\/code> — el productor — envía al canal los números <code>1..6<\/code> y ciérralo después.<\/span> <span class=\"sg\" data-s=\"2\">En un segundo bloque <code>start<\/code> — el consumidor — recoge todos los valores con <code>.list<\/code> y devuelve su suma.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Espera ambas<\/strong> promesas juntas e imprime la suma que produjo el consumidor.<\/span> <span class=\"sg\" data-s=\"4\">Esta es la forma natural de un canal: un productor en un hilo, un consumidor en otro, coordinados desde un tercero.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Sommate un channel","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Crea un channel e pilotalo con <strong>due promise<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">In un blocco <code>start<\/code> — il produttore — invia i numeri <code>1..6<\/code> nel channel e poi chiudilo.<\/span> <span class=\"sg\" data-s=\"2\">In un secondo blocco <code>start<\/code> — il consumatore — raccogli ogni valore con <code>.list<\/code> e restituiscine la somma.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Attendi entrambe<\/strong> le promise insieme e stampa la somma prodotta dal consumatore.<\/span> <span class=\"sg\" data-s=\"4\">Questa è la forma naturale di un channel: un produttore su un thread, un consumatore su un altro, coordinati da un terzo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Saskaitiet kanālu","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Izveidojiet kanālu un darbiniet to ar <strong>diviem solījumiem<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Vienā <code>start<\/code> blokā — ražotājā — nosūtiet kanālā skaitļus <code>1..6<\/code> un pēc tam to aizveriet.<\/span> <span class=\"sg\" data-s=\"2\">Otrā <code>start<\/code> blokā — patērētājā — savāciet katru vērtību ar <code>.list<\/code> un atgrieziet to summu.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Sagaidiet abus<\/strong> solījumus kopā un izdrukājiet summu, ko radījis patērētājs.<\/span> <span class=\"sg\" data-s=\"4\">Šī ir kanāla dabiskā forma: ražotājs vienā pavedienā, patērētājs otrā, saskaņoti no trešā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Упражнение «Сумма из канала»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Создайте канал и обслужите его <strong>двумя промисами<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">В одном блоке <code>start<\/code> — производителе — отправьте в канал числа <code>1..6<\/code> и затем закройте его.<\/span> <span class=\"sg\" data-s=\"2\">Во втором блоке <code>start<\/code> — потребителе — соберите все значения методом <code>.list<\/code> и верните их сумму.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Дождитесь обоих<\/strong> промисов вместе и напечатайте сумму, полученную потребителем.<\/span> <span class=\"sg\" data-s=\"4\">Это естественная форма работы канала: производитель в одном потоке, потребитель в другом, а координация — из третьего.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Сума каналу»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Створіть канал і керуйте ним за допомогою <strong>двох обіцянок<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">В одному блоці <code>start<\/code> — виробникові — надішліть у канал числа <code>1..6<\/code>, а потім закрийте його.<\/span> <span class=\"sg\" data-s=\"2\">У другому блоці <code>start<\/code> — споживачеві — зберіть кожне значення через <code>.list<\/code> і поверніть їхню суму.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Дочекайтеся обох<\/strong> обіцянок разом і надрукуйте суму, яку дав споживач.<\/span> <span class=\"sg\" data-s=\"4\">Це природна форма каналу: виробник в одному потоці, споживач в іншому, а координація з третього.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма друкує:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Сума от канал“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Създайте канал и го задвижете с <strong>две обещания<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">В единия блок <code>start<\/code> — производителя — изпратете в канала числата <code>1..6<\/code> и после го затворете.<\/span> <span class=\"sg\" data-s=\"2\">Във втория блок <code>start<\/code> — потребителя — съберете всяка стойност с <code>.list<\/code> и върнете сумата им.<\/span> <span class=\"sg\" data-s=\"3\"><strong>Изчакайте и двете<\/strong> обещания заедно и отпечатайте сумата, дадена от потребителя.<\/span> <span class=\"sg\" data-s=\"4\">Това е естествената форма на канала: производител в една нишка, потребител в друга, а координацията — от трета.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/paradigms/channels/exercises/channel-sum/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Sumu kanalon","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kreu kanalon kaj konduku ĝin per <strong>du promesoj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">En unu bloko <code>start<\/code> — la produktanto — sendu la nombrojn <code>1..6<\/code> en la kanalon kaj poste fermu ĝin.<\/spa
