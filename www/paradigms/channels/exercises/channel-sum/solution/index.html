<script type="application/json" id="page-data">{"u":"paradigms/channels/exercises/channel-sum/solution","n":1312,"k":"solution","pv":"paradigms/channels/exercises/channel-sum","nx":"paradigms/channels/exercises/drain-channel","tr":["paradigms","paradigms/channels"],"L":{"en":{"t":"The solution of ’Sum a channel‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The producer promise sends the six values on one thread and closes the channel. The consumer promise, on another thread, uses <code>.list<\/code> to collect everything up to the close and returns the sum (<code>[+]<\/code> adds <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> waits for <strong>both<\/strong> promises and returns their results in order. The producer's result is not needed here (<code>$sent<\/code>); the consumer's is the sum, <code>21<\/code>. The channel is what safely carries the values from the producer thread to the consumer thread.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Summieren Sie einen Kanal","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Erzeuger-Promise sendet die sechs Werte auf einem Thread und schließt den Kanal. Das Verbraucher-Promise auf einem anderen Thread sammelt mit <code>.list<\/code> alles bis zum Schließen und liefert die Summe (<code>[+]<\/code> addiert <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> wartet auf <strong>beide<\/strong> Promises und liefert ihre Ergebnisse in Reihenfolge. Das Ergebnis des Erzeugers wird hier nicht gebraucht (<code>$sent<\/code>); das des Verbrauchers ist die Summe, <code>21<\/code>. Der Kanal ist es, der die Werte sicher vom Erzeuger-Thread zum Verbraucher-Thread trägt.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Tel een kanaal op","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De promise van de producent verstuurt de zes waarden op de ene thread en sluit het kanaal. De promise van de consument, op een andere thread, gebruikt <code>.list<\/code> om alles tot aan de sluiting te verzamelen en geeft de som terug (<code>[+]<\/code> telt <code>1 + 2 + … + 6<\/code> op).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> wacht op <strong>beide<\/strong> promises en geeft hun resultaten op volgorde terug. Het resultaat van de producent is hier niet nodig (<code>$sent<\/code>); dat van de consument is de som, <code>21<\/code>. Het kanaal is wat de waarden veilig van de producentthread naar de consumentthread draagt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Sume un canal","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La promesa productora envía los seis valores en un hilo y cierra el canal. La promesa consumidora, en otro hilo, usa <code>.list<\/code> para recoger todo hasta el cierre y devuelve la suma (<code>[+]<\/code> suma <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> espera <strong>ambas<\/strong> promesas y devuelve sus resultados en orden. El resultado del productor no hace falta aquí (<code>$sent<\/code>); el del consumidor es la suma, <code>21<\/code>. El canal es lo que lleva con seguridad los valores del hilo productor al hilo consumidor.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Sommate un channel","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La promise del produttore invia i sei valori su un thread e chiude il channel. La promise del consumatore, su un altro thread, usa <code>.list<\/code> per raccogliere tutto fino alla chiusura e ne restituisce la somma (<code>[+]<\/code> somma <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> aspetta <strong>entrambe<\/strong> le promise e restituisce i loro risultati in ordine. Il risultato del produttore qui non serve (<code>$sent<\/code>); quello del consumatore è la somma, <code>21<\/code>. È il channel a portare in sicurezza i valori dal thread produttore al thread consumatore.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Сумма из канала","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Промис-производитель отправляет шесть значений в одном потоке и закрывает канал. Промис-потребитель в другом потоке методом <code>.list<\/code> собирает всё, что пришло до закрытия, и возвращает сумму (<code>[+]<\/code> складывает <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> дожидается <strong>обоих<\/strong> промисов и возвращает их результаты по порядку. Результат производителя здесь не нужен (<code>$sent<\/code>), а результат потребителя — это сумма <code>21<\/code>. Именно канал безопасно переносит значения из потока производителя в поток потребителя.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Сума каналу»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обіцянка-виробник надсилає шість значень в одному потоці й закриває канал. Обіцянка-споживач, в іншому потоці, використовує <code>.list<\/code>, щоб зібрати все до закриття, і повертає суму (<code>[+]<\/code> додає <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> чекає на <strong>обидві<\/strong> обіцянки й повертає їхні результати по порядку. Результат виробника тут не потрібен (<code>$sent<\/code>); результат споживача — це сума, <code>21<\/code>. Саме канал безпечно переносить значення з потоку виробника в потік споживача.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Сума от канал","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n\nmy $producer = start {\n    $c.send($_) for 1..6;\n    $c.close;\n};\n\nmy $consumer = start {\n    [+] $c.list;\n};\n\nmy ($sent, $sum) = await $producer, $consumer;\nsay $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/channels/channel-sum.raku\" target=\"_blank\" rel=\"noopener\">channel-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обещанието-производител изпраща шестте стойности в една нишка и затваря канала. Обещанието-потребител, в друга нишка, използва <code>.list<\/code>, за да събере всичко до затварянето, и връща сумата (<code>[+]<\/code> събира <code>1 + 2 + … + 6<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>await $producer, $consumer<\/code> изчаква <strong>и двете<\/strong> обещания и връща резултатите им по ред. Резултатът на производителя тук не е нужен (<code>$sent<\/code>); резултатът на потребителя е сумата — <code>21<\/code>. Именно каналът безопасно пренася стойностите от нишката на производителя към нишката на потребителя.<\/span><\/li><\/ol>"]]}}}</script>
