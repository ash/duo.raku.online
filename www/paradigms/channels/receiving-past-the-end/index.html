<script type="application/json" id="page-data">{"u":"paradigms/channels/receiving-past-the-end","n":1306,"k":"topic","pv":"paradigms/channels/closing-a-channel/quiz","nx":"paradigms/channels/receiving-past-the-end/quiz","tr":["paradigms","paradigms/channels"],"L":{"en":{"t":"Receiving past the end","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">What happens if you call <code>.receive<\/code> more times than there are values to take?<\/span> <span class=\"sg\" data-s=\"1\">The answer depends on whether the channel has been <strong>closed<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Take the producer–consumer example from earlier: a background task sends three values and closes the channel.<\/span> <span class=\"sg\" data-s=\"1\">What if the consumer asks for a fourth?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # one receive too many<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">On a closed channel, an extra receive throws<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Closing does not throw away the values already queued — the three <code>.receive<\/code> calls above still return <code>1<\/code>, <code>2<\/code>, and <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But once the channel is closed <strong>and<\/strong> empty, no more values can ever arrive, so rather than let you wait forever, Raku raises an exception:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The exception is <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is helpful rather than annoying: it tells the consumer, unmistakably, that it has drained the channel.<\/span> <span class=\"sg\" data-s=\"2\">In practice you avoid ever hitting it by consuming with <code>.list<\/code> (which stops cleanly at the close) or by looping only while values remain — both shown on the previous page.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">On an open channel, an extra receive blocks<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the producer never closes the channel, <code>.receive<\/code> has no way to know whether another value is still coming, so it simply <strong>waits<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # waits here — the channel is open but empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The program hangs at the second <code>.receive<\/code>, because a value <em>might<\/em> still be sent.<\/span> <span class=\"sg\" data-s=\"1\">This is the danger the previous page warned about: forget to <code>.close<\/code>, and a normal “wait for the next value” becomes a wait that never ends.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So the two outcomes are opposite, in a useful way.<\/span> <span class=\"sg\" data-s=\"1\">A <strong>closed<\/strong> channel fails fast when it is empty — you get an exception you can see and catch.<\/span> <span class=\"sg\" data-s=\"2\">An <strong>open<\/strong> channel keeps waiting — exactly right while a producer is still at work, but a silent hang if the producer has quietly stopped without closing.<\/span> <span class=\"sg\" data-s=\"3\">Closing the channel is precisely what turns that silent hang into a clear signal that the stream has ended.<\/span><\/p>"]]},"de":{"t":"Über das Ende hinaus empfangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Was geschieht, wenn Sie <code>.receive<\/code> öfter aufrufen, als es Werte zu holen gibt?<\/span> <span class=\"sg\" data-s=\"1\">Die Antwort hängt davon ab, ob der Kanal <strong>geschlossen<\/strong> wurde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nehmen Sie das Erzeuger-Verbraucher-Beispiel von zuvor: Eine Hintergrundaufgabe sendet drei Werte und schließt den Kanal.<\/span> <span class=\"sg\" data-s=\"1\">Was, wenn der Verbraucher nach einem vierten fragt?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # one receive too many<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Auf einem geschlossenen Kanal wirft ein zusätzliches receive<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Schließen wirft die bereits eingereihten Werte nicht weg — die drei <code>.receive<\/code>-Aufrufe oben liefern weiterhin <code>1<\/code>, <code>2<\/code> und <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Doch sobald der Kanal geschlossen <strong>und<\/strong> leer ist, können nie mehr Werte ankommen, statt Sie ewig warten zu lassen, löst Raku also eine Ausnahme aus:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Ausnahme ist <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist hilfreich und nicht lästig: Es sagt dem Verbraucher unmissverständlich, dass er den Kanal geleert hat.<\/span> <span class=\"sg\" data-s=\"2\">In der Praxis vermeiden Sie sie, indem Sie mit <code>.list<\/code> verbrauchen (das sauber beim Schließen anhält) oder nur so lange schleifen, wie Werte übrig sind — beides auf der vorigen Seite gezeigt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Auf einem offenen Kanal blockiert ein zusätzliches receive<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schließt der Erzeuger den Kanal nie, kann <code>.receive<\/code> nicht wissen, ob noch ein Wert kommt, es <strong>wartet<\/strong> also schlicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # waits here — the channel is open but empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Programm bleibt beim zweiten <code>.receive<\/code> hängen, denn <em>vielleicht<\/em> wird noch ein Wert gesendet.<\/span> <span class=\"sg\" data-s=\"1\">Das ist die Gefahr, vor der die vorige Seite gewarnt hat: Vergessen Sie das <code>.close<\/code>, und aus einem gewöhnlichen „warte auf den nächsten Wert“ wird ein Warten ohne Ende.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die beiden Ausgänge sind also auf nützliche Weise entgegengesetzt.<\/span> <span class=\"sg\" data-s=\"1\">Ein <strong>geschlossener<\/strong> Kanal scheitert rasch, wenn er leer ist — Sie bekommen eine Ausnahme, die Sie sehen und fangen können.<\/span> <span class=\"sg\" data-s=\"2\">Ein <strong>offener<\/strong> Kanal wartet weiter — genau richtig, solange ein Erzeuger noch arbeitet, aber ein stilles Hängen, wenn der Erzeuger leise aufgehört hat, ohne zu schließen.<\/span> <span class=\"sg\" data-s=\"3\">Den Kanal zu schließen ist genau das, was dieses stille Hängen in ein klares Zeichen verwandelt, dass der Strom geendet hat.<\/span><\/p>"]]},"nl":{"t":"Ontvangen voorbij het einde","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wat gebeurt er als je <code>.receive<\/code> vaker aanroept dan er waarden op te halen zijn?<\/span> <span class=\"sg\" data-s=\"1\">Het antwoord hangt ervan af of het kanaal <strong>gesloten<\/strong> is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Neem het voorbeeld met producent en consument van eerder: een achtergrondtaak verstuurt drie waarden en sluit het kanaal.<\/span> <span class=\"sg\" data-s=\"1\">Wat als de consument om een vierde vraagt?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # one receive too many<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Op een gesloten kanaal werpt een extra receive<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sluiten gooit de al in de wachtrij staande waarden niet weg — de drie <code>.receive<\/code>-aanroepen hierboven geven nog steeds <code>1<\/code>, <code>2<\/code> en <code>3<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">Maar zodra het kanaal gesloten <strong>en<\/strong> leeg is, kunnen er nooit meer waarden aankomen, dus laat Raku je niet eeuwig wachten maar werpt het een exceptie:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De exceptie is <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is behulpzaam en niet vervelend: het vertelt de consument ondubbelzinnig dat hij het kanaal leeggehaald heeft.<\/span> <span class=\"sg\" data-s=\"2\">In de praktijk vermijd je haar door met <code>.list<\/code> te consumeren (dat netjes bij de sluiting stopt) of door alleen te lussen zolang er waarden over zijn — beide op de vorige pagina getoond.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Op een open kanaal blokkeert een extra receive<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als de producent het kanaal nooit sluit, kan <code>.receive<\/code> niet weten of er nog een waarde komt, dus <strong>wacht<\/strong> het eenvoudigweg:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # waits here — the channel is open but empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het programma blijft bij de tweede <code>.receive<\/code> hangen, omdat er <em>misschien<\/em> nog een waarde verstuurd wordt.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het gevaar waar de vorige pagina voor waarschuwde: vergeet te <code>.close<\/code>-en, en een gewoon \"wacht op de volgende waarde\" wordt een wachten dat nooit eindigt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De twee uitkomsten zijn dus op een nuttige manier tegengesteld.<\/span> <span class=\"sg\" data-s=\"1\">Een <strong>gesloten<\/strong> kanaal faalt snel wanneer het leeg is — je krijgt een exceptie die je kunt zien en vangen.<\/span> <span class=\"sg\" data-s=\"2\">Een <strong>open<\/strong> kanaal blijft wachten — precies goed zolang een producent nog aan het werk is, maar een stille blokkade als de producent stilletjes gestopt is zonder te sluiten.<\/span> <span class=\"sg\" data-s=\"3\">Het kanaal sluiten is precies wat die stille blokkade verandert in een helder signaal dat de stroom geëindigd is.<\/span><\/p>"]]},"es":{"t":"Recibir más allá del final","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Qué ocurre si llamas a <code>.receive<\/code> más veces de las que hay valores que tomar?<\/span> <span class=\"sg\" data-s=\"1\">La respuesta depende de si el canal se ha <strong>cerrado<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Toma el ejemplo de productor y consumidor de antes: una tarea en segundo plano envía tres valores y cierra el canal.<\/span> <span class=\"sg\" data-s=\"1\">¿Y si el consumidor pide un cuarto?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # one receive too many<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">En un canal cerrado, un receive de más lanza una excepción<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cerrar no tira los valores que ya están en cola: las tres llamadas a <code>.receive<\/code> de arriba siguen devolviendo <code>1<\/code>, <code>2<\/code> y <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero una vez que el canal está cerrado <strong>y<\/strong> vacío, ya no puede llegar ningún valor más, así que en lugar de dejarte esperar para siempre, Raku lanza una excepción:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La excepción es <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es de ayuda más que un fastidio: le dice al consumidor, sin lugar a dudas, que ha vaciado el canal.<\/span> <span class=\"sg\" data-s=\"2\">En la práctica evitas encontrártela consumiendo con <code>.list<\/code> (que se detiene limpiamente en el cierre) o iterando solo mientras queden valores, ambas cosas mostradas en la página anterior.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">En un canal abierto, un receive de más se bloquea<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si el productor nunca cierra el canal, <code>.receive<\/code> no tiene manera de saber si aún viene otro valor, así que simplemente <strong>espera<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # waits here — the channel is open but empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El programa se queda colgado en el segundo <code>.receive<\/code>, porque <em>podría<\/em> enviarse todavía un valor.<\/span> <span class=\"sg\" data-s=\"1\">Este es el peligro del que avisaba la página anterior: olvida el <code>.close<\/code> y una «espera al valor siguiente» normal se convierte en una espera que no termina nunca.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Así que los dos desenlaces son opuestos, de una manera útil.<\/span> <span class=\"sg\" data-s=\"1\">Un canal <strong>cerrado<\/strong> falla enseguida cuando está vacío: obtienes una excepción que puedes ver y capturar.<\/span> <span class=\"sg\" data-s=\"2\">Un canal <strong>abierto<\/strong> sigue esperando, exactamente lo correcto mientras un productor siga trabajando, pero un cuelgue silencioso si el productor se ha parado calladamente sin cerrar.<\/span> <span class=\"sg\" data-s=\"3\">Cerrar el canal es precisamente lo que convierte ese cuelgue silencioso en una señal clara de que el flujo ha terminado.<\/span><\/p>"]]},"it":{"t":"Ricevere oltre la fine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Che cosa succede se chiami <code>.receive<\/code> più volte di quanti siano i valori da prendere?<\/span> <span class=\"sg\" data-s=\"1\">La risposta dipende dal fatto che il channel sia stato <strong>chiuso<\/strong> o no.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prendi l'esempio produttore-consumatore di prima: un compito in secondo piano invia tre valori e chiude il channel.<\/span> <span class=\"sg\" data-s=\"1\">E se il consumatore ne chiedesse un quarto?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # one receive too many<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Su un channel chiuso, una ricezione in più solleva un'eccezione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La chiusura non butta via i valori già in coda: le tre chiamate <code>.receive<\/code> qui sopra restituiscono comunque <code>1<\/code>, <code>2<\/code> e <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma una volta che il channel è chiuso <strong>e<\/strong> vuoto, non possono più arrivare valori, quindi invece di lasciarti aspettare per sempre Raku solleva un'eccezione:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'eccezione è <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È utile più che fastidiosa: dice al consumatore, senza ambiguità, che ha svuotato il channel.<\/span> <span class=\"sg\" data-s=\"2\">In pratica eviti del tutto di incontrarla consumando con <code>.list<\/code> (che si ferma pulitamente alla chiusura) o ciclando solo finché restano valori — entrambe le cose mostrate nella pagina precedente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Su un channel aperto, una ricezione in più blocca<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se il produttore non chiude mai il channel, <code>.receive<\/code> non ha modo di sapere se un altro valore stia ancora arrivando, quindi semplicemente <strong>aspetta<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # waits here — the channel is open but empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il programma si blocca al secondo <code>.receive<\/code>, perché un valore <em>potrebbe<\/em> essere ancora inviato.<\/span> <span class=\"sg\" data-s=\"1\">È il pericolo di cui avvertiva la pagina precedente: dimentica il <code>.close<\/code>, e un normale «aspetta il valore successivo» diventa un'attesa che non finisce mai.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I due esiti sono dunque opposti, in modo utile.<\/span> <span class=\"sg\" data-s=\"1\">Un channel <strong>chiuso<\/strong> fallisce in fretta quando è vuoto: ottieni un'eccezione che puoi vedere e intercettare.<\/span> <span class=\"sg\" data-s=\"2\">Un channel <strong>aperto<\/strong> continua ad aspettare — esattamente ciò che serve mentre un produttore è ancora al lavoro, ma un blocco silenzioso se il produttore si è fermato in sordina senza chiudere.<\/span> <span class=\"sg\" data-s=\"3\">Chiudere il channel è proprio ciò che trasforma quel blocco silenzioso in un segnale chiaro che il flusso è finito.<\/span><\/p>"]]},"ru":{"t":"Чтение после конца","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Что произойдёт, если вызвать <code>.receive<\/code> больше раз, чем есть значений?<\/span> <span class=\"sg\" data-s=\"1\">Ответ зависит от того, <strong>закрыт<\/strong> ли канал.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Возьмём прежний пример с производителем и потребителем: фоновая задача отправляет три значения и закрывает канал.<\/span> <span class=\"sg\" data-s=\"1\">А что, если потребитель попросит четвёртое?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # одним получением больше, чем нужно<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">На закрытом канале лишнее получение бросает исключение<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Закрытие не выбрасывает уже стоящие в очереди значения — три вызова <code>.receive<\/code> выше по-прежнему вернут <code>1<\/code>, <code>2<\/code> и <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но как только канал закрыт <strong>и<\/strong> пуст, новых значений появиться уже не может, и, вместо того чтобы позволить вам ждать вечно, Raku возбуждает исключение:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это исключение <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оно скорее полезно, чем досадно: оно недвусмысленно сообщает потребителю, что канал вычерпан.<\/span> <span class=\"sg\" data-s=\"2\">На практике до него не доходит, если потреблять через <code>.list<\/code> (который аккуратно останавливается на закрытии) или крутить цикл лишь пока значения остаются, — оба способа показаны на предыдущей странице.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">На открытом канале лишнее получение блокирует выполнение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если производитель канал так и не закрыл, <code>.receive<\/code> не может знать, придёт ли ещё значение, и попросту <strong>ждёт<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # здесь ждёт — канал открыт, но пуст<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа зависает на втором <code>.receive<\/code>, потому что значение <em>может<\/em> ещё быть отправлено.<\/span> <span class=\"sg\" data-s=\"1\">Об этой опасности и предупреждала предыдущая страница: забудьте <code>.close<\/code> — и обычное «дождись следующего значения» превратится в ожидание, которое никогда не кончится.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итак, два исхода противоположны, и это полезно.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Закрытый<\/strong> канал, опустев, отказывает сразу — вы получаете видимое исключение, которое можно перехватить.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Открытый<\/strong> канал продолжает ждать — что совершенно правильно, пока производитель ещё работает, но оборачивается безмолвным зависанием, если производитель тихо остановился, не закрыв канал.<\/span> <span class=\"sg\" data-s=\"3\">Закрытие канала как раз и превращает это безмолвное зависание в ясный сигнал о том, что поток закончился.<\/span><\/p>"]]},"uk":{"t":"Отримання за межею кінця","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Що станеться, якщо викликати <code>.receive<\/code> більше разів, ніж є значень, які можна забрати?<\/span> <span class=\"sg\" data-s=\"1\">Відповідь залежить від того, чи канал було <strong>закрито<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Візьмімо приклад «виробник — споживач» із попереднього: фонова задача надсилає три значення й закриває канал.<\/span> <span class=\"sg\" data-s=\"1\">А що, як споживач попросить четверте?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # на одне отримання забагато<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">На закритому каналі зайве отримання кидає виняток<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Закриття не викидає значень, що вже стоять у черзі, — три виклики <code>.receive<\/code> вище все одно повертають <code>1<\/code>, <code>2<\/code> та <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але щойно канал закрито <strong>і<\/strong> він порожній, нових значень уже ніколи не надійде, тож Raku не дає вам чекати вічно, а натомість підіймає виняток:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей виняток — <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це радше корисно, ніж прикро: він недвозначно повідомляє споживачеві, що той вичерпав канал.<\/span> <span class=\"sg\" data-s=\"2\">На практиці ви взагалі на нього не натрапляєте, споживаючи через <code>.list<\/code> (який чисто зупиняється на закритті) або зациклюючись лише поки значення залишаються, — обидва способи показано на попередній сторінці.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">На відкритому каналі зайве отримання блокує виконання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо виробник ніколи не закриває каналу, <code>.receive<\/code> не має способу дізнатися, чи надійде ще значення, тож він просто <strong>чекає<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # чекає тут — канал відкритий, але порожній<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма зависає на другому <code>.receive<\/code>, бо значення <em>може<\/em> ще бути надіслане.<\/span> <span class=\"sg\" data-s=\"1\">Це та сама небезпека, про яку попереджала попередня сторінка: забудьте <code>.close<\/code> — і звичайне «дочекайся наступного значення» стане очікуванням, що ніколи не скінчиться.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Отже, ці два наслідки протилежні, і то в корисний спосіб.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Закритий<\/strong> канал швидко зазнає невдачі, коли порожній, — ви отримуєте виняток, який видно й можна перехопити.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Відкритий<\/strong> канал і далі чекає — саме те, що треба, поки виробник ще працює, але мовчазне зависання, якщо виробник тихенько спинився, не закривши каналу.<\/span> <span class=\"sg\" data-s=\"3\">Закриття каналу — це рівно те, що перетворює це мовчазне зависання на чіткий сигнал про завершення потоку.<\/span><\/p>"]]},"bg":{"t":"Получаване след края","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Какво става, ако извикате <code>.receive<\/code> повече пъти, отколкото има стойности за взимане?<\/span> <span class=\"sg\" data-s=\"1\">Отговорът зависи от това дали каналът е <strong>затворен<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вземете примера с производител и потребител отпреди: фонова задача изпраща три стойности и затваря канала.<\/span> <span class=\"sg\" data-s=\"1\">Ами ако потребителят поиска четвърта?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\n\nsay $c.receive; # 1\nsay $c.receive; # 2\nsay $c.receive; # 3\nsay $c.receive; # с едно получаване повече<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">При затворен канал излишното получаване хвърля изключение<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Затварянето не изхвърля вече наредените стойности — трите извиквания на <code>.receive<\/code> по-горе пак връщат <code>1<\/code>, <code>2<\/code> и <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но щом каналът е затворен <strong>и<\/strong> празен, повече стойности никога няма да пристигнат, така че вместо да ви остави да чакате вечно, Raku повдига изключение:<\/span><\/p>"],["code",0,"<pre><code>Cannot receive a message on a closed channel<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Изключението е <code>X::Channel::ReceiveOnClosed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е по-скоро полезно, отколкото досадно: то недвусмислено казва на потребителя, че е изчерпал канала.<\/span> <span class=\"sg\" data-s=\"2\">На практика изобщо не стигате до него, ако консумирате с <code>.list<\/code> (който спира чисто при затварянето) или ако въртите цикъл само докато има стойности — и двата начина са показани на предишната страница.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">При отворен канал излишното получаване блокира<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако производителят никога не затвори канала, <code>.receive<\/code> няма как да разбере дали ще дойде още една стойност, така че просто <strong>чака<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\nsay $c.receive; # 1\nsay $c.receive; # чака тук — каналът е отворен, но празен<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програмата увисва на второто <code>.receive<\/code>, защото стойност <em>може<\/em> още да бъде изпратена.<\/span> <span class=\"sg\" data-s=\"1\">Точно за тази опасност предупреждаваше предишната страница: забравите ли <code>.close<\/code>, обикновеното „изчакай следващата стойност“ се превръща в чакане без край.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Така двата изхода са противоположни по полезен начин.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Затвореният<\/strong> канал се проваля бързо, когато е празен — получавате изключение, което се вижда и може да се прихване.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Отвореният<\/strong> канал продължава да чака — точно каквото трябва, докато производителят още работи, но мълчаливо увисване, ако производителят тихо е спрял, без да затвори.<\/span> <span class=\"sg\" data-s=\"3\">Затварянето на канала е именно онова, което превръща това мълчаливо увисване в ясен сигнал, че потокът е приключил.<\/span><\/p>"]]}}}</script>
