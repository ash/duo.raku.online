<script type="application/json" id="page-data">{"u":"paradigms/channels/receiving-past-the-end/quiz","n":1307,"k":"quiz","pv":"paradigms/channels/receiving-past-the-end","nx":"paradigms/channels/exercises","tr":["paradigms","paradigms/channels","paradigms/channels/receiving-past-the-end"],"L":{"en":{"t":"Quiz — Receiving past the end","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A channel has had all its sent values received.<\/span> <span class=\"sg\" data-s=\"1\">What happens on the <strong>next<\/strong> <code>.receive<\/code> if the channel is <strong>still open<\/strong> (never closed)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">It throws <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">It blocks, waiting for a value that may never come<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">It returns <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">It returns an empty list <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On an <strong>open<\/strong> channel, <code>.receive<\/code> cannot tell whether another value is on its way, so it waits — potentially forever, if the producer has stopped without closing.<\/span> <span class=\"sg\" data-s=\"1\">The <code>X::Channel::ReceiveOnClosed<\/code> exception is the <strong>closed<\/strong>-channel case: only a closed, empty channel fails fast instead of blocking.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Über das Ende hinaus empfangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Von einem Kanal wurden alle gesendeten Werte empfangen.<\/span> <span class=\"sg\" data-s=\"1\">Was geschieht beim <strong>nächsten<\/strong> <code>.receive<\/code>, wenn der Kanal <strong>noch offen<\/strong> ist (nie geschlossen wurde)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Es wirft <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Es blockiert und wartet auf einen Wert, der vielleicht nie kommt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Es liefert <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Es liefert eine leere Liste <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Auf einem <strong>offenen<\/strong> Kanal kann <code>.receive<\/code> nicht erkennen, ob noch ein Wert unterwegs ist, es wartet also — womöglich ewig, wenn der Erzeuger ohne Schließen aufgehört hat.<\/span> <span class=\"sg\" data-s=\"1\">Die Ausnahme <code>X::Channel::ReceiveOnClosed<\/code> gehört zum <strong>geschlossenen<\/strong> Fall: Nur ein geschlossener, leerer Kanal scheitert rasch, statt zu blockieren.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Ontvangen voorbij het einde","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Van een kanaal zijn alle verstuurde waarden ontvangen.<\/span> <span class=\"sg\" data-s=\"1\">Wat gebeurt er bij de <strong>volgende<\/strong> <code>.receive<\/code> als het kanaal <strong>nog open<\/strong> is (nooit gesloten)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Het werpt <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Het blokkeert en wacht op een waarde die misschien nooit komt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Het geeft <code>Nil<\/code> terug<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Het geeft een lege lijst <code>()<\/code> terug<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Op een <strong>open<\/strong> kanaal kan <code>.receive<\/code> niet zien of er nog een waarde onderweg is, dus wacht het — mogelijk eeuwig, als de producent gestopt is zonder te sluiten.<\/span> <span class=\"sg\" data-s=\"1\">De exceptie <code>X::Channel::ReceiveOnClosed<\/code> hoort bij het <strong>gesloten<\/strong> geval: alleen een gesloten, leeg kanaal faalt snel in plaats van te blokkeren.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Recibir más allá del final","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De un canal se han recibido ya todos los valores enviados.<\/span> <span class=\"sg\" data-s=\"1\">¿Qué ocurre en el <code>.receive<\/code> <strong>siguiente<\/strong> si el canal <strong>sigue abierto<\/strong> (nunca se cerró)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Lanza <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Se bloquea, esperando un valor que quizá nunca llegue<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Devuelve <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Devuelve una lista vacía <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En un canal <strong>abierto<\/strong>, <code>.receive<\/code> no puede saber si viene otro valor de camino, así que espera, potencialmente para siempre, si el productor se ha parado sin cerrar.<\/span> <span class=\"sg\" data-s=\"1\">La excepción <code>X::Channel::ReceiveOnClosed<\/code> es el caso del canal <strong>cerrado<\/strong>: solo un canal cerrado y vacío falla enseguida en lugar de bloquearse.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Ricevere oltre la fine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Di un channel sono stati ricevuti tutti i valori inviati.<\/span> <span class=\"sg\" data-s=\"1\">Che cosa succede al <code>.receive<\/code> <strong>successivo<\/strong> se il channel è <strong>ancora aperto<\/strong> (mai chiuso)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Solleva <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Blocca, aspettando un valore che potrebbe non arrivare mai<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Restituisce <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Restituisce un elenco vuoto <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Su un channel <strong>aperto<\/strong>, <code>.receive<\/code> non può sapere se un altro valore stia arrivando, quindi aspetta — potenzialmente per sempre, se il produttore si è fermato senza chiudere.<\/span> <span class=\"sg\" data-s=\"1\">L'eccezione <code>X::Channel::ReceiveOnClosed<\/code> è il caso del channel <strong>chiuso<\/strong>: solo un channel chiuso e vuoto fallisce in fretta invece di bloccare.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Чтение после конца","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Из канала уже получены все отправленные в него значения.<\/span> <span class=\"sg\" data-s=\"1\">Что произойдёт при <strong>следующем<\/strong> <code>.receive<\/code>, если канал <strong>всё ещё открыт<\/strong> (не закрывался)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Будет брошено <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Он заблокирует выполнение, ожидая значения, которого может и не быть<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Он вернёт <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Он вернёт пустой список <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На <strong>открытом<\/strong> канале <code>.receive<\/code> не может определить, в пути ли ещё одно значение, поэтому он ждёт — возможно, вечно, если производитель остановился, не закрыв канал.<\/span> <span class=\"sg\" data-s=\"1\">Исключение <code>X::Channel::ReceiveOnClosed<\/code> относится к случаю <strong>закрытого<\/strong> канала: только закрытый и пустой канал отказывает сразу, а не блокирует выполнение.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Отримання за межею кінця","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У каналі отримано всі надіслані значення.<\/span> <span class=\"sg\" data-s=\"1\">Що станеться на <strong>наступному<\/strong> <code>.receive<\/code>, якщо канал <strong>усе ще відкритий<\/strong> (його ніколи не закривали)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Він кине <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Він заблокує виконання, чекаючи на значення, яке може ніколи не прийти<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Він поверне <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Він поверне порожній список <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На <strong>відкритому<\/strong> каналі <code>.receive<\/code> не може сказати, чи в дорозі ще одне значення, тож він чекає — потенційно вічно, якщо виробник спинився, не закривши каналу.<\/span> <span class=\"sg\" data-s=\"1\">Виняток <code>X::Channel::ReceiveOnClosed<\/code> стосується випадку <strong>закритого<\/strong> каналу: лише закритий і порожній канал швидко зазнає невдачі замість блокувати виконання.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Получаване след края","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В канал са получени всички изпратени стойности.<\/span> <span class=\"sg\" data-s=\"1\">Какво става при <strong>следващия<\/strong> <code>.receive<\/code>, ако каналът е <strong>още отворен<\/strong> (никога не е затварян)?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Хвърля <code>X::Channel::ReceiveOnClosed<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Блокира, чакайки стойност, която може никога да не дойде<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Връща <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Връща празен списък <code>()<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При <strong>отворен<\/strong> канал <code>.receive<\/code> не може да прецени дали още една стойност е на път, така че чака — потенциално вечно, ако производителят е спрял, без да затвори.<\/span> <span class=\"sg\" data-s=\"1\">Изключението <code>X::Channel::ReceiveOnClosed<\/code> се отнася за случая на <strong>затворен<\/strong> канал: само затворен и празен канал се проваля бързо, вместо да блокира.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
