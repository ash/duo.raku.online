<script type="application/json" id="page-data">{"u":"paradigms/channels/send-and-receive","n":1302,"k":"topic","pv":"paradigms/channels","nx":"paradigms/channels/send-and-receive/quiz","tr":["paradigms","paradigms/channels"],"L":{"en":{"t":"Sending and receiving","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Create a channel with <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Put values in with <code>.send<\/code>, and take them out with <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A channel is a <strong>queue<\/strong>: values come out in the same order they went in — first in, first out.<\/span> <span class=\"sg\" data-s=\"1\">So the first <code>.receive<\/code> returns <code>1<\/code>, the value sent first.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The point of a channel is that sending and receiving are safe to do from <strong>different threads<\/strong> at the same time.<\/span> <span class=\"sg\" data-s=\"1\">A producer can keep sending while a consumer keeps receiving, and Raku makes sure no value is lost or duplicated:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here a background task sends <code>1, 2, 3<\/code>; the main program receives.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> waits if the channel is momentarily empty, so the consumer never races ahead of the producer.<\/span><\/p>"]]},"de":{"t":"Senden und empfangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Erzeugen Sie einen Kanal mit <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Legen Sie Werte mit <code>.send<\/code> hinein und nehmen Sie sie mit <code>.receive<\/code> heraus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Kanal ist eine <strong>Warteschlange<\/strong>: Werte kommen in derselben Reihenfolge heraus, in der sie hineingingen — first in, first out.<\/span> <span class=\"sg\" data-s=\"1\">Die erste <code>.receive<\/code> liefert also <code>1<\/code>, den zuerst gesendeten Wert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Sinn eines Kanals ist, dass Senden und Empfangen zugleich aus <strong>verschiedenen Threads<\/strong> heraus sicher sind.<\/span> <span class=\"sg\" data-s=\"1\">Ein Erzeuger kann weiter senden, während ein Verbraucher weiter empfängt, und Raku sorgt dafür, dass kein Wert verloren geht oder doppelt auftaucht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier sendet eine Hintergrundaufgabe <code>1, 2, 3<\/code>; das Hauptprogramm empfängt.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> wartet, wenn der Kanal gerade leer ist, der Verbraucher überholt den Erzeuger also nie.<\/span><\/p>"]]},"nl":{"t":"Versturen en ontvangen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Maak een kanaal met <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zet er waarden in met <code>.send<\/code>, en haal ze eruit met <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een kanaal is een <strong>wachtrij<\/strong>: waarden komen er in dezelfde volgorde uit als ze erin gingen — first in, first out.<\/span> <span class=\"sg\" data-s=\"1\">Dus de eerste <code>.receive<\/code> geeft <code>1<\/code> terug, de waarde die als eerste verstuurd is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De bedoeling van een kanaal is dat versturen en ontvangen veilig tegelijk vanuit <strong>verschillende threads<\/strong> kunnen.<\/span> <span class=\"sg\" data-s=\"1\">Een producent kan blijven versturen terwijl een consument blijft ontvangen, en Raku zorgt ervoor dat geen waarde verloren gaat of gedupliceerd wordt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier verstuurt een achtergrondtaak <code>1, 2, 3<\/code>; het hoofdprogramma ontvangt.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> wacht als het kanaal even leeg is, dus de consument loopt de producent nooit vooruit.<\/span><\/p>"]]},"es":{"t":"Enviar y recibir","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Crea un canal con <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mete valores con <code>.send<\/code> y sácalos con <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un canal es una <strong>cola<\/strong>: los valores salen en el mismo orden en que entraron, el primero en entrar es el primero en salir.<\/span> <span class=\"sg\" data-s=\"1\">Así que el primer <code>.receive<\/code> devuelve <code>1<\/code>, el valor enviado primero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La gracia de un canal está en que enviar y recibir se pueden hacer sin peligro desde <strong>hilos distintos<\/strong> al mismo tiempo.<\/span> <span class=\"sg\" data-s=\"1\">Un productor puede seguir enviando mientras un consumidor sigue recibiendo, y Raku se asegura de que ningún valor se pierda ni se duplique:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí una tarea en segundo plano envía <code>1, 2, 3<\/code>; el programa principal recibe.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> espera si el canal está momentáneamente vacío, así que el consumidor nunca se adelanta al productor.<\/span><\/p>"]]},"it":{"t":"Inviare e ricevere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Crea un channel con <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Metti dentro i valori con <code>.send<\/code> e tirali fuori con <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un channel è una <strong>coda<\/strong>: i valori escono nello stesso ordine in cui sono entrati — primo entrato, primo uscito.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il primo <code>.receive<\/code> restituisce <code>1<\/code>, il valore inviato per primo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il senso di un channel è che inviare e ricevere si possono fare in sicurezza da <strong>thread diversi<\/strong> nello stesso momento.<\/span> <span class=\"sg\" data-s=\"1\">Un produttore può continuare a inviare mentre un consumatore continua a ricevere, e Raku si assicura che nessun valore vada perduto o duplicato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui un compito in secondo piano invia <code>1, 2, 3<\/code>; il programma principale riceve.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> aspetta se il channel è momentaneamente vuoto, quindi il consumatore non corre mai avanti al produttore.<\/span><\/p>"]]},"lv":{"t":"Sūtīšana un saņemšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kanālu izveido ar <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vērtības tajā ieliek ar <code>.send<\/code> un izņem ar <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kanāls ir <strong>rinda<\/strong>: vērtības iznāk tādā pašā secībā, kādā tās iegāja — pirmais iekšā, pirmais ārā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc pirmais <code>.receive<\/code> atgriež <code>1<\/code>, vērtību, kas nosūtīta pirmā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kanāla jēga ir tā, ka sūtīt un saņemt ir droši no <strong>dažādiem pavedieniem<\/strong> vienlaikus.<\/span> <span class=\"sg\" data-s=\"1\">Ražotājs var turpināt sūtīt, kamēr patērētājs turpina saņemt, un Raku gādā, lai neviena vērtība nepazustu un nedubultotos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit fona uzdevums sūta <code>1, 2, 3<\/code>; galvenā programma saņem.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> gaida, ja kanāls uz mirkli ir tukšs, tāpēc patērētājs nekad neaizskrien ražotājam priekšā.<\/span><\/p>"]]},"ru":{"t":"Отправка и получение","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Канал создаётся через <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значения кладут в него методом <code>.send<\/code>, а забирают методом <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Канал — это <strong>очередь<\/strong>: значения выходят в том же порядке, в каком вошли, — первым пришёл, первым вышел.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому первый <code>.receive<\/code> возвращает <code>1<\/code>, значение, отправленное первым.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Смысл канала в том, что отправлять и получать безопасно из <strong>разных потоков<\/strong> одновременно.<\/span> <span class=\"sg\" data-s=\"1\">Производитель может продолжать отправку, пока потребитель продолжает приём, и Raku гарантирует, что ни одно значение не потеряется и не задвоится:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь фоновая задача отправляет <code>1, 2, 3<\/code>, а основная программа принимает.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> ждёт, если канал на мгновение пуст, поэтому потребитель никогда не убегает вперёд производителя.<\/span><\/p>"]]},"uk":{"t":"Надсилання та отримання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Створіть канал за допомогою <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кладіть значення всередину через <code>.send<\/code>, а забирайте через <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Канал є <strong>чергою<\/strong>: значення виходять у тому самому порядку, у якому зайшли, — перший прийшов, перший вийшов.<\/span> <span class=\"sg\" data-s=\"1\">Тож перший <code>.receive<\/code> повертає <code>1<\/code>, тобто значення, надіслане першим.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сенс каналу в тому, що надсилати й отримувати безпечно з <strong>різних потоків виконання<\/strong> водночас.<\/span> <span class=\"sg\" data-s=\"1\">Виробник може й далі надсилати, поки споживач і далі отримує, а Raku подбає, щоб жодне значення не загубилося й не задвоїлося:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут фонова задача надсилає <code>1, 2, 3<\/code>; головна програма отримує.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> чекає, якщо канал наразі порожній, тож споживач ніколи не забігає поперед виробника.<\/span><\/p>"]]},"bg":{"t":"Изпращане и получаване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Създайте канал с <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Слагайте стойности вътре с <code>.send<\/code>, а ги вземайте с <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каналът е <strong>опашка<\/strong>: стойностите излизат в същия ред, в който са влезли — първи влязъл, първи излязъл.<\/span> <span class=\"sg\" data-s=\"1\">Затова първият <code>.receive<\/code> връща <code>1<\/code> — стойността, изпратена първа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Смисълът на канала е, че изпращането и получаването са безопасни за правене от <strong>различни нишки<\/strong> едновременно.<\/span> <span class=\"sg\" data-s=\"1\">Производителят може да продължава да изпраща, докато потребителят продължава да получава, а Raku се грижи никоя стойност да не се загуби или удвои:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук фонова задача изпраща <code>1, 2, 3<\/code>; основната програма получава.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> чака, ако каналът за момента е празен, така че потребителят никога не изпреварва производителя.<\/span><\/p>"]]},"eo":{"t":"Sendi kaj ricevi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kreu kanalon per <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Enmetu valorojn per <code>.send<\/code> kaj elprenu ilin per <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kanalo estas <strong>vico<\/strong>: valoroj eliras en la sama ordo, en kiu ili eniris — unue enen, unue eksteren.<\/span> <span class=\"sg\" data-s=\"1\">Do la unua <code>.receive<\/code> redonas <code>1<\/code>, la valoron senditan unue.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La celo de kanalo estas, ke sendi kaj ricevi estas sekure fareblaj el <strong>malsamaj fadenoj<\/strong> samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Produktanto povas daŭre sendi dum konsumanto daŭre ricevas, kaj Raku certigas, ke neniu valoro perdiĝas aŭ duobliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie fona tasko sendas <code>1, 2, 3<\/code>; la ĉefa programo ricevas.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> atendas, se la kanalo estas momente malplena, do la konsumanto neniam antaŭkuras la produktanton.<\/span><\/p>"]]},"la":{"t":"Mittere et accipere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Crea canalem per <code>Channel.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Valores immitte per <code>.send<\/code>, eosque extrahe per <code>.receive<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\n$c.send(1);\n$c.send(2);\nsay $c.receive; # 1\nsay $c.receive; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Canalis <strong>ordo<\/strong> est: valores eodem ordine exeunt quo intraverunt — primus intrans, primus exiens.<\/span> <span class=\"sg\" data-s=\"1\">Itaque primum <code>.receive<\/code> <code>1<\/code> reddit, valorem qui primus missus est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vis canalis in eo est quod mittere et accipere tuto ex <strong>filis diversis<\/strong> eodem tempore fieri possunt.<\/span> <span class=\"sg\" data-s=\"1\">Productor mittere pergere potest dum consumptor accipere pergit, et Raku curat ne ullus valor pereat vel duplicetur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = Channel.new;\nstart {\n    $c.send($_) for 1..3;\n    $c.close;\n}\nsay $c.receive; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic negotium in fundo <code>1, 2, 3<\/code> mittit; programma principale accipit.<\/span> <span class=\"sg\" data-s=\"1\"><code>.receive<\/code> exspectat si canalis momento vacuus est, itaque consumptor numquam productorem praecurrit.<\/span><\/p>"]]}}}</script>
