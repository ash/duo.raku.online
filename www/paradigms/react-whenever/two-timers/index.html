<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/two-timers","n":1360,"k":"topic","pv":"paradigms/react-whenever/whenever-vs-when","nx":"paradigms/react-whenever/exercises","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"Two timers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Every react example so far has used <code>Supply.from-list<\/code>, which pushes all of its values the instant it is tapped.<\/span> <span class=\"sg\" data-s=\"1\">That is why each stream printed in full before the next one started — there was no waiting involved.<\/span> <span class=\"sg\" data-s=\"2\">Real event streams are not like that: their values arrive spread out over <strong>time<\/strong>, and a <code>react<\/code> block interleaves them as they come.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A timer is the simplest stream that behaves this way.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> emits an increasing counter — <code>0, 1, 2, …<\/code> — once every <code>$period<\/code> seconds.<\/span> <span class=\"sg\" data-s=\"2\">Run two of them at different rates inside one <code>react<\/code>, and their values weave together:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A typical run prints:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The fast <code>tick<\/code> fires every <code>0.3<\/code> seconds; the slower <code>TOCK<\/code> every <code>0.5<\/code>, starting a quarter-second in (the second argument to <code>interval<\/code> is that initial delay).<\/span> <span class=\"sg\" data-s=\"1\">Neither waits for the other — the <code>react<\/code> block just runs whichever <code>whenever<\/code> body goes with the value that has arrived, so the two streams <strong>intersect<\/strong> instead of taking turns.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because timers never finish on their own, a third <code>whenever<\/code> provides the exit: <code>Promise.in(1.4)<\/code> is kept after 1.4 seconds, and its body calls <code>done<\/code> to end the <code>react<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">Without it, the react would tick and tock forever.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The exact interleaving depends on timing, so a later run may order the lines a little differently — but that is the nature of reacting to live events: you respond to each as it happens, whenever it happens.<\/span><\/p>"]]},"de":{"t":"Zwei Zeitgeber","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes react-Beispiel bisher hat <code>Supply.from-list<\/code> verwendet, das alle seine Werte in dem Augenblick hinausschiebt, in dem es angezapft wird.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb wurde jeder Strom vollständig ausgegeben, bevor der nächste begann — es war kein Warten im Spiel.<\/span> <span class=\"sg\" data-s=\"2\">Echte Ereignisströme sind nicht so: Ihre Werte treffen über die <strong>Zeit<\/strong> verteilt ein, und ein <code>react<\/code>-Block verflicht sie, wie sie kommen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Zeitgeber ist der einfachste Strom, der sich so verhält.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> sendet einen aufsteigenden Zähler aus — <code>0, 1, 2, …<\/code> — einmal alle <code>$period<\/code> Sekunden.<\/span> <span class=\"sg\" data-s=\"2\">Lassen Sie zwei davon mit verschiedenen Taktraten in einem <code>react<\/code> laufen, und ihre Werte verweben sich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein typischer Lauf gibt aus:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das schnelle <code>tick<\/code> feuert alle <code>0.3<\/code> Sekunden; das langsamere <code>TOCK<\/code> alle <code>0.5<\/code>, beginnend nach einer Viertelsekunde (das zweite Argument von <code>interval<\/code> ist diese Anfangsverzögerung).<\/span> <span class=\"sg\" data-s=\"1\">Keines wartet auf das andere — der <code>react<\/code>-Block führt schlicht den <code>whenever<\/code>-Rumpf aus, der zum eingetroffenen Wert gehört, die beiden Ströme <strong>durchdringen<\/strong> einander also, statt sich abzuwechseln.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da Zeitgeber von selbst nie enden, sorgt ein drittes <code>whenever<\/code> für den Ausgang: <code>Promise.in(1.4)<\/code> wird nach 1,4 Sekunden erfüllt, und sein Rumpf ruft <code>done<\/code> auf, um den <code>react<\/code>-Block zu beenden.<\/span> <span class=\"sg\" data-s=\"1\">Ohne das würde der react ewig ticken und tocken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die genaue Verflechtung hängt vom Zeitverlauf ab, ein späterer Lauf ordnet die Zeilen also womöglich etwas anders — doch das ist das Wesen des Reagierens auf lebendige Ereignisse: Sie antworten auf jedes, sobald es geschieht, wann immer es geschieht.<\/span><\/p>"]]},"nl":{"t":"Twee timers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk react-voorbeeld tot nu toe gebruikte <code>Supply.from-list<\/code>, die al zijn waarden meteen bij het aftappen naar buiten duwt.<\/span> <span class=\"sg\" data-s=\"1\">Daarom werd elke stroom volledig afgedrukt voordat de volgende begon — er kwam geen wachten aan te pas.<\/span> <span class=\"sg\" data-s=\"2\">Echte gebeurtenisstromen zijn zo niet: hun waarden komen in de loop van de <strong>tijd<\/strong> verspreid binnen, en een <code>react<\/code>-blok vlecht ze dooreen zodra ze komen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een timer is de eenvoudigste stroom die zich zo gedraagt.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> zendt een oplopende teller uit — <code>0, 1, 2, …<\/code> — één keer per <code>$period<\/code> seconden.<\/span> <span class=\"sg\" data-s=\"2\">Draai er twee met verschillende snelheden in één <code>react<\/code>, en hun waarden vlechten zich dooreen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een typische draaibeurt drukt af:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De snelle <code>tick<\/code> gaat elke <code>0.3<\/code> seconde af; de tragere <code>TOCK<\/code> elke <code>0.5<\/code>, beginnend na een kwart seconde (het tweede argument van <code>interval<\/code> is die aanvangsvertraging).<\/span> <span class=\"sg\" data-s=\"1\">Geen van beide wacht op de andere — het <code>react<\/code>-blok draait eenvoudigweg de <code>whenever<\/code>-body die bij de binnengekomen waarde hoort, dus <strong>doorsnijden<\/strong> de twee stromen elkaar in plaats van om beurten te gaan.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat timers uit zichzelf nooit eindigen, biedt een derde <code>whenever<\/code> de uitgang: <code>Promise.in(1.4)<\/code> wordt na 1,4 seconde vervuld, en haar body roept <code>done<\/code> aan om het <code>react<\/code>-blok te beëindigen.<\/span> <span class=\"sg\" data-s=\"1\">Zonder dat zou de react eeuwig tikken en tokken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De precieze dooreenvlechting hangt van de timing af, dus een latere draaibeurt kan de regels iets anders ordenen — maar dat is de aard van reageren op live gebeurtenissen: je reageert op elke gebeurtenis zodra ze gebeurt, wanneer ze ook gebeurt.<\/span><\/p>"]]},"es":{"t":"Dos temporizadores","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Todos los ejemplos de react vistos hasta ahora usaban <code>Supply.from-list<\/code>, que empuja todos sus valores en el instante en que se lo engancha.<\/span> <span class=\"sg\" data-s=\"1\">Por eso cada flujo se imprimía entero antes de que empezara el siguiente: no había espera de por medio.<\/span> <span class=\"sg\" data-s=\"2\">Los flujos de eventos reales no son así: sus valores llegan repartidos a lo largo del <strong>tiempo<\/strong>, y un bloque <code>react<\/code> los entrelaza según vienen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un temporizador es el flujo más sencillo que se comporta de este modo.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> emite un contador creciente — <code>0, 1, 2, …<\/code> — una vez cada <code>$period<\/code> segundos.<\/span> <span class=\"sg\" data-s=\"2\">Haz correr dos de ellos a ritmos distintos dentro de un mismo <code>react<\/code> y sus valores se entretejen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una ejecución típica imprime:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>tick<\/code> rápido se dispara cada <code>0.3<\/code> segundos; el <code>TOCK<\/code>, más lento, cada <code>0.5<\/code>, empezando un cuarto de segundo más tarde (el segundo argumento de <code>interval<\/code> es ese retardo inicial).<\/span> <span class=\"sg\" data-s=\"1\">Ninguno espera al otro: el bloque <code>react<\/code> sencillamente ejecuta el cuerpo del <code>whenever<\/code> que corresponde al valor que ha llegado, de modo que los dos flujos se <strong>cruzan<\/strong> en lugar de turnarse.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como los temporizadores nunca terminan por sí solos, un tercer <code>whenever<\/code> proporciona la salida: <code>Promise.in(1.4)<\/code> se cumple a los 1,4 segundos, y su cuerpo llama a <code>done<\/code> para acabar el bloque <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sin él, el react haría tic y toc para siempre.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El entrelazado exacto depende de los tiempos, así que una ejecución posterior puede ordenar las líneas un poco de otro modo, pero esa es la naturaleza de reaccionar a eventos en vivo: respondes a cada uno según ocurre, cuando quiera que ocurra.<\/span><\/p>"]]},"it":{"t":"Due timer","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni esempio con react visto finora ha usato <code>Supply.from-list<\/code>, che spinge tutti i propri valori nell'istante in cui gli si attinge.<\/span> <span class=\"sg\" data-s=\"1\">È per questo che ogni flusso si stampava per intero prima che cominciasse il successivo: non c'era alcuna attesa di mezzo.<\/span> <span class=\"sg\" data-s=\"2\">I flussi di eventi veri non sono così: i loro valori arrivano distribuiti nel <strong>tempo<\/strong>, e un blocco <code>react<\/code> li intreccia man mano che vengono.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un timer è il flusso più semplice che si comporta così.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> emette un contatore crescente — <code>0, 1, 2, …<\/code> — una volta ogni <code>$period<\/code> secondi.<\/span> <span class=\"sg\" data-s=\"2\">Fanne girare due a ritmi diversi dentro un unico <code>react<\/code>, e i loro valori si intrecciano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una esecuzione tipica stampa:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il rapido <code>tick<\/code> scatta ogni <code>0.3<\/code> secondi; il più lento <code>TOCK<\/code> ogni <code>0.5<\/code>, cominciando un quarto di secondo dopo (il secondo argomento di <code>interval<\/code> è quel ritardo iniziale).<\/span> <span class=\"sg\" data-s=\"1\">Nessuno dei due aspetta l'altro: il blocco <code>react<\/code> esegue semplicemente il corpo del <code>whenever<\/code> che va con il valore arrivato, quindi i due flussi si <strong>intersecano<\/strong> invece di darsi il turno.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché i timer non finiscono mai da soli, un terzo <code>whenever<\/code> fornisce l'uscita: <code>Promise.in(1.4)<\/code> viene mantenuta dopo 1,4 secondi, e il suo corpo chiama <code>done<\/code> per chiudere il blocco <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Senza di esso il react ticchetterebbe e toccherebbe per sempre.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'intreccio esatto dipende dal tempismo, quindi un'esecuzione successiva potrebbe ordinare le righe un po' diversamente — ma è la natura del reagire a eventi dal vivo: rispondi a ciascuno mentre accade, quando accade.<\/span><\/p>"]]},"lv":{"t":"Divi taimeri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Visi līdzšinējie <code>react<\/code> piemēri izmantoja <code>Supply.from-list<\/code>, kas visas savas vērtības iestumj tajā pašā mirklī, kad tai pieslēdzas.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tāpēc katra straume izdrukājās pilnībā, pirms sākās nākamā — nekādas gaidīšanas nebija.<\/span> <span class=\"sg\" data-s=\"2\">Īstas notikumu straumes tādas nav: to vērtības pienāk izklaidus <strong>laikā<\/strong>, un <code>react<\/code> bloks tās savij kopā, kā tās nāk.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Taimeris ir vienkāršākā šādi uzvedošās straumes.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> reizi <code>$period<\/code> sekundēs izstaro augošu skaitītāju — <code>0, 1, 2, …<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Palaidiet divus tādus ar dažādu ātrumu vienā <code>react<\/code>, un to vērtības savijas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipiska izpilde izdrukā:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ātrais <code>tick<\/code> nostrādā reizi <code>0.3<\/code> sekundēs; lēnākais <code>TOCK<\/code> — reizi <code>0.5<\/code>, sākot ceturtdaļsekundi vēlāk (<code>interval<\/code> otrais arguments ir šī sākotnējā aizture).<\/span> <span class=\"sg\" data-s=\"1\">Neviens negaida otru — <code>react<\/code> bloks vienkārši izpilda to <code>whenever<\/code> ķermeni, kas iet kopā ar pienākušo vērtību, tāpēc abas straumes <strong>krustojas<\/strong>, nevis mijas pēc kārtas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā taimeri paši no sevis nekad nebeidzas, izeju nodrošina trešais <code>whenever<\/code>: <code>Promise.in(1.4)<\/code> tiek turēts pēc 1,4 sekundēm, un tā ķermenis izsauc <code>done<\/code>, izbeidzot <code>react<\/code> bloku.<\/span> <span class=\"sg\" data-s=\"1\">Bez tā <code>react<\/code> tikšķētu un takšķētu mūžīgi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Precīzais savijums ir atkarīgs no laika, tāpēc vēlāka izpilde rindas var sakārtot mazliet citādi — bet tāda jau ir reaģēšana uz dzīviem notikumiem: jūs atsaucaties uz katru, kad tas notiek, kad vien tas notiek.<\/span><\/p>"]]},"ru":{"t":"Два таймера","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Во всех примерах с react до сих пор использовался <code>Supply.from-list<\/code>, который выталкивает все свои значения в тот же миг, как к нему подключились.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому каждый поток печатался целиком, прежде чем начинался следующий, — никакого ожидания не было.<\/span> <span class=\"sg\" data-s=\"2\">Настоящие потоки событий устроены иначе: их значения приходят растянутыми во <strong>времени<\/strong>, и блок <code>react<\/code> переплетает их по мере поступления.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Простейший поток с таким поведением — таймер.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> выдаёт растущий счётчик — <code>0, 1, 2, …<\/code> — раз в <code>$period<\/code> секунд.<\/span> <span class=\"sg\" data-s=\"2\">Запустите два таких таймера с разной частотой внутри одного <code>react<\/code>, и их значения сплетутся:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типичный запуск печатает:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Быстрый <code>tick<\/code> срабатывает каждые <code>0.3<\/code> секунды, более медленный <code>TOCK<\/code> — каждые <code>0.5<\/code>, начиная с четверти секунды (второй аргумент <code>interval<\/code> и есть эта начальная задержка).<\/span> <span class=\"sg\" data-s=\"1\">Ни один не ждёт другого: блок <code>react<\/code> просто выполняет то тело <code>whenever<\/code>, которому соответствует пришедшее значение, поэтому два потока <strong>пересекаются<\/strong>, а не сменяют друг друга.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку таймеры сами по себе никогда не заканчиваются, выход обеспечивает третий <code>whenever<\/code>: <code>Promise.in(1.4)<\/code> исполняется через 1,4 секунды, и его тело вызывает <code>done<\/code>, завершая блок <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без него react тикал бы и такал вечно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Точное переплетение зависит от того, как лягут задержки, поэтому при следующем запуске строки могут пойти немного иначе, — но такова природа реакции на живые события: вы отвечаете на каждое из них тогда, когда оно происходит.<\/span><\/p>"]]},"uk":{"t":"Два таймери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен приклад із react досі використовував <code>Supply.from-list<\/code>, який штовхає всі свої значення тієї ж миті, коли до нього підключаються.<\/span> <span class=\"sg\" data-s=\"1\">Саме тому кожен струмінь друкувався повністю, перш ніж починався наступний, — жодного очікування не було.<\/span> <span class=\"sg\" data-s=\"2\">Справжні струмені подій не такі: їхні значення надходять розтягнутими в <strong>часі<\/strong>, і блок <code>react<\/code> переплітає їх у міру надходження.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Таймер — найпростіший струмінь, що так поводиться.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> видає зростаючий лічильник — <code>0, 1, 2, …<\/code> — раз на кожні <code>$period<\/code> секунд.<\/span> <span class=\"sg\" data-s=\"2\">Запустіть два таких із різними частотами всередині одного <code>react<\/code> — і їхні значення сплітаються:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типовий запуск друкує:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Швидкий <code>tick<\/code> спрацьовує кожні <code>0.3<\/code> секунди; повільніший <code>TOCK<\/code> — кожні <code>0.5<\/code>, починаючи через чверть секунди (другий аргумент <code>interval<\/code> є саме цією початковою затримкою).<\/span> <span class=\"sg\" data-s=\"1\">Жоден не чекає на іншого — блок <code>react<\/code> просто виконує те тіло <code>whenever<\/code>, що відповідає значенню, яке надійшло, тож два струмені <strong>перетинаються<\/strong>, а не чергуються.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки таймери самі собою ніколи не завершуються, вихід надає третій <code>whenever<\/code>: <code>Promise.in(1.4)<\/code> виконується через 1,4 секунди, і її тіло викликає <code>done<\/code>, завершуючи блок <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без цього react цокав би й такав би вічно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Точне переплетення залежить від таймінгу, тож пізніший запуск може впорядкувати рядки трохи інакше, — але така вже природа реагування на живі події: ви відгукуєтеся на кожну в міру того, як вона стається, коли б вона не сталася.<\/span><\/p>"]]},"bg":{"t":"Два таймера","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки пример с react досега използваше <code>Supply.from-list<\/code>, който тласка всичките си стойности в мига, в който се включат към него.<\/span> <span class=\"sg\" data-s=\"1\">Затова всяка струя се отпечатваше изцяло, преди да започне следващата — никакво чакане не участваше.<\/span> <span class=\"sg\" data-s=\"2\">Истинските струи от събития не са такива: стойностите им пристигат разтеглени във <strong>времето<\/strong>, а блокът <code>react<\/code> ги преплита в реда на пристигането им.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Таймерът е най-простата струя, която се държи така.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> подава нарастващ брояч — <code>0, 1, 2, …<\/code> — веднъж на всеки <code>$period<\/code> секунди.<\/span> <span class=\"sg\" data-s=\"2\">Пуснете два такива с различна честота вътре в един <code>react<\/code> и стойностите им се сплитат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типично изпълнение отпечатва:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Бързият <code>tick<\/code> се задейства на всеки <code>0.3<\/code> секунди; по-бавният <code>TOCK<\/code> — на всеки <code>0.5<\/code>, започвайки след четвърт секунда (вторият аргумент на <code>interval<\/code> е точно това начално закъснение).<\/span> <span class=\"sg\" data-s=\"1\">Нито един не чака другия — блокът <code>react<\/code> просто изпълнява онова тяло на <code>whenever<\/code>, което отговаря на пристигналата стойност, така че двете струи се <strong>пресичат<\/strong>, вместо да се редуват.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже таймерите никога не свършват сами, изходът осигурява трети <code>whenever<\/code>: <code>Promise.in(1.4)<\/code> се изпълнява след 1,4 секунди, а тялото ѝ извиква <code>done<\/code>, за да прекрати блока <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без него react щеше да цъка и така да си цъка вечно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Точното преплитане зависи от таймингите, така че по-късно изпълнение може да подреди редовете малко по-различно — но такава е природата на откликването на живи събития: откликвате на всяко в момента на случването му, когато и да се случи.<\/span><\/p>"]]},"eo":{"t":"Du tempigiloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ĝisnuna ekzemplo pri react uzis <code>Supply.from-list<\/code>, kiu puŝas ĉiujn siajn valorojn en la momento, kiam oni konektiĝas al ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Tial ĉiu fluo presiĝis plene antaŭ ol la sekva komenciĝis — nenia atendo estis implikita.<\/span> <span class=\"sg\" data-s=\"2\">Veraj event-fluoj ne estas tiaj: iliaj valoroj alvenas disaj en la <strong>tempo<\/strong>, kaj bloko <code>react<\/code> interplektas ilin laŭ ilia alveno.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tempigilo estas la plej simpla fluo, kiu kondutas tiel.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> eligas kreskantan nombrilon — <code>0, 1, 2, …<\/code> — unufoje ĉiujn <code>$period<\/code> sekundojn.<\/span> <span class=\"sg\" data-s=\"2\">Plenumu du el ili je malsamaj rapidecoj ene de unu <code>react<\/code>, kaj iliaj valoroj kunplektiĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipa plenumo presas:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rapida <code>tick<\/code> ekfunkcias ĉiujn <code>0.3<\/code> sekundojn; la pli malrapida <code>TOCK<\/code> ĉiujn <code>0.5<\/code>, komencante kvaronsekundon poste (la dua argumento al <code>interval<\/code> estas tiu komenca prokrasto).<\/span> <span class=\"sg\" data-s=\"1\">Neniu atendas la alian — la bloko <code>react<\/code> simple plenumas tiun korpon <code>whenever<\/code>, kiu apartenas al la valoro, kiu alvenis, do la du fluoj <strong>interkruciĝas<\/strong> anstataŭ alterni.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉar tempigiloj neniam finiĝas per si mem, tria <code>whenever<\/code> provizas la eliron: <code>Promise.in(1.4)<\/code> estas plenumata post 1,4 sekundoj, kaj ĝia korpo vokas <code>done<\/code> por fini la blokon <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sen ĝi, la react tiktakus eterne.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La preciza interplektado dependas de la tempado, do pli malfrua plenumo povas ordigi la liniojn iomete alie — sed tia estas la naturo de reagi al vivaj eventoj: vi respondas al ĉiu laŭ ĝia okazo, kiam ajn ĝi okazas.<\/span><\/p>"]]},"la":{"t":"Duo horologia","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Omne exemplum react hactenus <code>Supply.from-list<\/code> adhibuit, quod omnes valores suos illo momento quo coniungitur trudit.<\/span> <span class=\"sg\" data-s=\"1\">Quapropter unusquisque fluxus plene impressus est antequam sequens incipiebat — nulla exspectatio implicata erat.<\/span> <span class=\"sg\" data-s=\"2\">Fluxus eventuum veri tales non sunt: valores eorum per <strong>tempus<\/strong> diffusi adveniunt, et blocus <code>react<\/code> eos dum veniunt intertexit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Horologium est fluxus simplicissimus qui ita se gerit.<\/span> <span class=\"sg\" data-s=\"1\"><code>Supply.interval($period)<\/code> calculum crescentem emittit — <code>0, 1, 2, …<\/code> — semel per <code>$period<\/code> secunda.<\/span> <span class=\"sg\" data-s=\"2\">Curre duo eorum diversis celeritatibus intra unum <code>react<\/code>, et valores eorum inter se texuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>react {\n    whenever Supply.interval(0.3) {\n        say \"tick $_\";\n    }\n    whenever Supply.interval(0.5, 0.25) {\n        say \"TOCK $_\";\n    }\n    whenever Promise.in(1.4) {\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cursus typicus imprimit:<\/span><\/p>"],["code",0,"<pre><code>tick 0\nTOCK 0\ntick 1\ntick 2\nTOCK 1\ntick 3\ntick 4\nTOCK 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Celer <code>tick<\/code> omni <code>0.3<\/code> secundo emicat; tardior <code>TOCK<\/code> omni <code>0.5<\/code>, quadrante secundi post incipiens (secundum argumentum ipsius <code>interval<\/code> illa mora initialis est).<\/span> <span class=\"sg\" data-s=\"1\">Neutrum alterum exspectat — blocus <code>react<\/code> mere illud corpus <code>whenever<\/code> currit quod ad valorem qui advenit pertinet, itaque duo fluxus <strong>inter se secant<\/strong> potius quam per vices agunt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quia horologia numquam sponte finiunt, tertium <code>whenever<\/code> exitum praebet: <code>Promise.in(1.4)<\/code> post 1.4 secunda servatur, et corpus eius <code>done<\/code> vocat ut blocum <code>react<\/code> finiat.<\/span> <span class=\"sg\" data-s=\"1\">Sine eo, react in aeternum tick et tock ageret.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exacta intertextura ex temporibus pendet, itaque cursus posterior lineas paulo aliter ordinare potest — sed haec natura eventibus vivis respondendi est: unicuique respondes dum accidit, quandocumque accidit.<\/span><\/p>"]]}}}</script>
