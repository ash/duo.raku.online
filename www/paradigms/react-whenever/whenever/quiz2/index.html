"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        @out.push($_);\n        done if $_ == 2;\n    }\n    whenever Supply.from-list(10, 20) {\n        @out.push($_);\n    }\n}\n\nsay @out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">[1 2]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">[1 2 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">[1 2 3 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">[10 20]<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das erste <code>whenever<\/code> legt <code>1<\/code> hinein, dann <code>2<\/code> — und bei <code>2<\/code> ruft es <code>done<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Entscheidend ist, dass <code>done<\/code> den **ganzen <code>react<\/code>-Block** beendet und nicht nur sein eigenes <code>whenever<\/code>: Der Rest des ersten Supply (<code>3<\/code>) und das <em>ganze zweite Supply<\/em> (<code>10, 20<\/code>) werden abgeschnitten, bevor sie geliefert werden.<\/span> <span class=\"sg\" data-s=\"2\"><code>@out<\/code> enthält also nur <code>[1 2]<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Würde <code>done<\/code> bloß seinen eigenen Strom stilllegen, hätten Sie <code>[1 2 10 20]<\/code> gesehen — doch ein <code>done<\/code> hält alle Reaktionen auf einmal an.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — whenever en done","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        @out.push($_);\n        done if $_ == 2;\n    }\n    whenever Supply.from-list(10, 20) {\n        @out.push($_);\n    }\n}\n\nsay @out;< \" data-s=\"3\">[10 20]<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El primer <code>whenever<\/code> añade <code>1<\/code>, después <code>2<\/code>, y con el <code>2<\/code> llama a <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El punto crucial es que <code>done<\/code> termina el **bloque <code>react<\/code> entero**, no solo su propio <code>whenever<\/code>: el resto del primer supply (<code>3<\/code>) y el <em>segundo supply completo<\/em> (<code>10, 20<\/code>) quedan cortados antes de entregarse.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>@out<\/code> contiene solo <code>[1 2]<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Si <code>done<\/code> silenciara únicamente su propio flujo, habrías visto <code>[1 2 10 20]<\/code>, pero un solo <code>done<\/code> detiene todas las reacciones a la vez.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — whenever e done","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        @out.push($_);\n        done if $_ == 2;\n    }\n    whenever Supply.from-list(10, 20) {\n        @out.push($_);\n    }\n}\n\nsay @out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">[1 2]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">[1 2 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">[1 2 3 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">[10 20]<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il primo <code>whenever<\/code> spinge <code>1<\/code>, poi <code>2<\/code> — e su <code>2<\/code> chiama <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il punto cruciale è che <code>done<\/code> chiude l'**intero blocco <code>react<\/code>**, non solo il proprio <code>whenever<\/code>: il resto del primo supply (<code>3<\/code>) e l'<em>intero secondo supply<\/em> (<code>10, 20<\/code>) vengono tagliati fuori prima di essere consegnati.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>@out<\/code> contiene solo <code>[1 2]<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Se <code>done<\/code> zittisse solo il proprio flusso, avresti visto <code>[1 2 10 20]<\/code> — ma un solo <code>done<\/code> ferma tutte le reazioni insieme.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — whenever и done","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        @out.push($_);\n        done if $_ == 2;\n    }\n    whenever Supply.from-list(10, 20) {\n        @out.push($_);\n    }\n}\n\nsay @out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">[1 2]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">[1 2 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">[1 2 3 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">[10 20]<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Первый <code>whenever<\/code> добавляет <code>1<\/code>, затем <code>2<\/code> — и на <code>2<\/code> вызывает <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Принципиально важно, что <code>done<\/code> завершает **весь блок <code>react<\/code>**, а не только свой <code>whenever<\/code>: остаток первого supply (<code>3<\/code>) и <em>весь второй supply<\/em> (<code>10, 20<\/code>) отсекаются, так и не будучи доставленными.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому в <code>@out<\/code> остаётся лишь <code>[1 2]<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Если бы <code>done<\/code> заглушал только собственный поток, вы увидели бы <code>[1 2 10 20]<\/code>, — но один <code>done<\/code> останавливает сразу все реакции.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — whenever і done","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що надрукує наступна програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        @out.push($_);\n        done if $_ == 2;\n    }\n    whenever Supply.from-list(10, 20) {\n        @out.push($_);\n    }\n}\n\nsay @out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">[1 2]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">[1 2 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">[1 2 3 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">[10 20]<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перший <code>whenever<\/code> кладе <code>1<\/code>, потім <code>2<\/code> — і на <code>2<\/code> викликає <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вирішальний момент у тому, що <code>done<\/code> завершує **увесь блок <code>react<\/code>**, а не лише свій <code>whenever<\/code>: решту першого потоку (<code>3<\/code>) і <em>весь другий потік<\/em> (<code>10, 20<\/code>) відтято ще до доставляння.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>@out<\/code> містить самі <code>[1 2]<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Якби <code>done<\/code> глушив лише власний струмінь, ви побачили б <code>[1 2 10 20]<\/code> — але один <code>done<\/code> спиняє всі реакції одразу.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — whenever и done","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @out;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        @out.push($_);\n        done if $_ == 2;\n    }\n    whenever Supply.from-list(10, 20) {\n        @out.push($_);\n    }\n}\n\nsay @out;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">[1 2]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">[1 2 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">[1 2 3 10 20]<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">[10 20]<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Първият <code>whenever<\/code> слага <code>1<\/code>, после <code>2<\/code> — и при <code>2<\/code> извиква <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Решаващото е, че <code>done<\/code> прекратява **целия блок <code>react<\/code>**, а не само своя <code>whenever<\/code>: остатъкът от първия поток (<code>3<\/code>) и <em>целият втори поток<\/em> (<code>10, 20<\/code>) са отрязани, преди да бъдат доставени.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>@out<\/code> съдържа само <code>[1 2]<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ако <code>done<\/code> заглушаваше само собствената си струя, щяхте да видите <code>[1 2 10 20]<\/code> — но едно <code>done<\/code> спира всички реакции наведнъж.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
