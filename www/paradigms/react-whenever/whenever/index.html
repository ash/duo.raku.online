<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/whenever","n":1355,"k":"topic","pv":"paradigms/react-whenever/the-react-block/quiz","nx":"paradigms/react-whenever/whenever/quiz","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A single <code>react<\/code> block can hold <strong>several<\/strong> <code>whenever<\/code> blocks, each watching a different supply.<\/span> <span class=\"sg\" data-s=\"1\">The block reacts to whichever supply emits next, running the matching body:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Both supplies are watched at once.<\/span> <span class=\"sg\" data-s=\"1\">Their values — <code>1, 2, 3<\/code> and <code>10, 20<\/code> — all flow into <code>$sum<\/code>, which ends at <code>36<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The <code>react<\/code> block finishes only when <strong>both<\/strong> supplies are done.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each <code>whenever<\/code> reacts independently, so this is how you combine streams: one <code>whenever<\/code> per source, all inside the same <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A real program might watch a network connection in one <code>whenever<\/code> and a timer in another, responding to each as its events arrive.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Within a <code>whenever<\/code> body you have the emitted value (as <code>$_<\/code> or a named parameter) and can do anything with it — update state, emit to another supply, or even close the react block early with <code>done<\/code>.<\/span><\/p>"]]},"de":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein einzelner <code>react<\/code>-Block kann <strong>mehrere<\/strong> <code>whenever<\/code>-Blöcke enthalten, von denen jeder ein anderes Supply beobachtet.<\/span> <span class=\"sg\" data-s=\"1\">Der Block reagiert auf dasjenige Supply, das als nächstes aussendet, und führt den zugehörigen Rumpf aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide Supplies werden zugleich beobachtet.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Werte — <code>1, 2, 3<\/code> und <code>10, 20<\/code> — fließen alle in <code>$sum<\/code>, das bei <code>36<\/code> endet.<\/span> <span class=\"sg\" data-s=\"2\">Der <code>react<\/code>-Block ist erst fertig, wenn <strong>beide<\/strong> Supplies fertig sind.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes <code>whenever<\/code> reagiert unabhängig, und so verbinden Sie Ströme: ein <code>whenever<\/code> je Quelle, alle im selben <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ein echtes Programm könnte in einem <code>whenever<\/code> eine Netzverbindung beobachten und in einem anderen einen Zeitgeber und auf jedes Ereignis reagieren, sobald es eintrifft.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Innerhalb eines <code>whenever<\/code>-Rumpfes haben Sie den ausgesandten Wert (als <code>$_<\/code> oder als benannten Parameter) und können damit alles tun — Zustand ändern, an ein anderes Supply aussenden oder den react-Block mit <code>done<\/code> sogar vorzeitig schließen.<\/span><\/p>"]]},"nl":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eén <code>react<\/code>-blok kan <strong>meerdere<\/strong> <code>whenever<\/code>-blokken bevatten, die elk een andere supply bekijken.<\/span> <span class=\"sg\" data-s=\"1\">Het blok reageert op de supply die als volgende uitzendt en draait de bijbehorende body:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide supplies worden tegelijk bekeken.<\/span> <span class=\"sg\" data-s=\"1\">Hun waarden — <code>1, 2, 3<\/code> en <code>10, 20<\/code> — stromen allemaal in <code>$sum<\/code>, dat op <code>36<\/code> eindigt.<\/span> <span class=\"sg\" data-s=\"2\">Het <code>react<\/code>-blok is pas klaar wanneer <strong>beide<\/strong> supplies klaar zijn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke <code>whenever<\/code> reageert onafhankelijk, en zo combineer je stromen: één <code>whenever<\/code> per bron, allemaal binnen hetzelfde <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Een echt programma zou in de ene <code>whenever<\/code> een netwerkverbinding kunnen bekijken en in de andere een timer, en op elk reageren zodra de gebeurtenissen binnenkomen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Binnen een <code>whenever<\/code>-body heb je de uitgezonden waarde (als <code>$_<\/code> of als benoemde parameter) en kun je er van alles mee doen — toestand bijwerken, naar een andere supply uitzenden, of het react-blok zelfs vroegtijdig sluiten met <code>done<\/code>.<\/span><\/p>"]]},"es":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un solo bloque <code>react<\/code> puede contener <strong>varios<\/strong> bloques <code>whenever<\/code>, cada uno observando un supply distinto.<\/span> <span class=\"sg\" data-s=\"1\">El bloque reacciona al supply que emita a continuación, ejecutando el cuerpo correspondiente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ambos supplies se observan a la vez.<\/span> <span class=\"sg\" data-s=\"1\">Sus valores — <code>1, 2, 3<\/code> y <code>10, 20<\/code> — fluyen todos hacia <code>$sum<\/code>, que acaba en <code>36<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El bloque <code>react<\/code> termina solo cuando <strong>ambos<\/strong> supplies están acabados.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada <code>whenever<\/code> reacciona de forma independiente, y así es como se combinan flujos: un <code>whenever<\/code> por fuente, todos dentro del mismo <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un programa real podría observar una conexión de red en un <code>whenever<\/code> y un temporizador en otro, respondiendo a cada uno según llegan sus eventos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro del cuerpo de un <code>whenever<\/code> tienes el valor emitido (como <code>$_<\/code> o como parámetro con nombre) y puedes hacer cualquier cosa con él: actualizar estado, emitir a otro supply o incluso cerrar antes de tiempo el bloque react con <code>done<\/code>.<\/span><\/p>"]]},"it":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un solo blocco <code>react<\/code> può contenere <strong>parecchi<\/strong> blocchi <code>whenever<\/code>, ciascuno che osserva un supply diverso.<\/span> <span class=\"sg\" data-s=\"1\">Il blocco reagisce a qualunque supply emetta per primo, eseguendo il corpo corrispondente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Entrambi i supply sono osservati insieme.<\/span> <span class=\"sg\" data-s=\"1\">I loro valori — <code>1, 2, 3<\/code> e <code>10, 20<\/code> — confluiscono tutti in <code>$sum<\/code>, che finisce a <code>36<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il blocco <code>react<\/code> finisce solo quando <strong>entrambi<\/strong> i supply sono conclusi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>whenever<\/code> reagisce in modo indipendente, ed è così che combini i flussi: un <code>whenever<\/code> per sorgente, tutti dentro lo stesso <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un programma vero potrebbe osservare una connessione di rete in un <code>whenever<\/code> e un timer in un altro, rispondendo a ciascuno man mano che i suoi eventi arrivano.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro il corpo di un <code>whenever<\/code> hai il valore emesso (come <code>$_<\/code> o come parametro con nome) e puoi farne qualunque cosa: aggiornare uno stato, emettere verso un altro supply o persino chiudere in anticipo il blocco react con <code>done<\/code>.<\/span><\/p>"]]},"ru":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Один блок <code>react<\/code> может содержать <strong>несколько<\/strong> блоков <code>whenever<\/code>, каждый из которых следит за своим supply.<\/span> <span class=\"sg\" data-s=\"1\">Блок реагирует на тот supply, который выдал значение следующим, и выполняет соответствующее тело:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За обоими supply следят одновременно.<\/span> <span class=\"sg\" data-s=\"1\">Их значения — <code>1, 2, 3<\/code> и <code>10, 20<\/code> — стекаются в <code>$sum<\/code>, которая в итоге равна <code>36<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок <code>react<\/code> завершается, только когда закончатся <strong>оба<\/strong> supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый <code>whenever<\/code> реагирует независимо, и именно так объединяют потоки: по одному <code>whenever<\/code> на источник, все внутри одного <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Настоящая программа могла бы следить за сетевым соединением в одном <code>whenever<\/code> и за таймером в другом, отвечая на события каждого по мере их поступления.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В теле <code>whenever<\/code> вам доступно выданное значение (как <code>$_<\/code> или именованный параметр), и с ним можно делать что угодно: обновлять состояние, выдавать значения в другой supply или даже досрочно закрыть блок react вызовом <code>done<\/code>.<\/span><\/p>"]]},"uk":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Один блок <code>react<\/code> може містити <strong>кілька<\/strong> блоків <code>whenever<\/code>, і кожен стежитиме за своїм потоком значень.<\/span> <span class=\"sg\" data-s=\"1\">Блок реагує на той потік, що видасть значення наступним, виконуючи відповідне тіло:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За обома потоками стежать водночас.<\/span> <span class=\"sg\" data-s=\"1\">Їхні значення — <code>1, 2, 3<\/code> та <code>10, 20<\/code> — усі втікають у <code>$sum<\/code>, який завершується на <code>36<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок <code>react<\/code> завершується лише тоді, коли завершаться <strong>обидва<\/strong> потоки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>whenever<\/code> реагує незалежно, і саме так ви поєднуєте струмені: по одному <code>whenever<\/code> на джерело, і всі всередині того самого <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Справжня програма могла б стежити за мережевим з'єднанням в одному <code>whenever<\/code> і за таймером в іншому, відгукуючись на кожен у міру надходження його подій.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У тілі <code>whenever<\/code> вам доступне видане значення (як <code>$_<\/code> або як іменований параметр), і робити з ним можна що завгодно — оновити стан, видати щось в інший потік або навіть достроково закрити блок react через <code>done<\/code>.<\/span><\/p>"]]},"bg":{"t":"whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Един блок <code>react<\/code> може да съдържа <strong>няколко<\/strong> блока <code>whenever<\/code>, всеки от които следи различен поток.<\/span> <span class=\"sg\" data-s=\"1\">Блокът откликва на онзи поток, който подаде стойност следващ, изпълнявайки съответното тяло:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n    whenever Supply.from-list(10, 20) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 36<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">И двата потока се следят наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Стойностите им — <code>1, 2, 3<\/code> и <code>10, 20<\/code> — всички се вливат в <code>$sum<\/code>, който завършва на <code>36<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блокът <code>react<\/code> приключва едва когато <strong>и двата<\/strong> потока свършат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>whenever<\/code> откликва независимо, така че точно така съчетавате струи: по един <code>whenever<\/code> на източник, всички вътре в един и същ <code>react<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Истинска програма би могла да следи мрежова връзка в един <code>whenever<\/code> и таймер в друг, откликвайки на всеки в момента на пристигане на събитията му.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В тялото на <code>whenever<\/code> разполагате с подадената стойност (като <code>$_<\/code> или като именуван параметър) и можете да правите с нея каквото поискате — да обновите състояние, да подадете нещо в друг поток или дори да затворите блока react предсрочно с <code>done<\/code>.<\/span><\/p>"]]}}}</script>
