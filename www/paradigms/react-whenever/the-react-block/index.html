<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/the-react-block","n":1353,"k":"topic","pv":"paradigms/react-whenever","nx":"paradigms/react-whenever/the-react-block/quiz","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"The react block","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <code>react<\/code> block is a place where reactions live.<\/span> <span class=\"sg\" data-s=\"1\">Inside it, a <code>whenever<\/code> says “whenever this supply emits a value, run this body”.<\/span> <span class=\"sg\" data-s=\"2\">The <code>react<\/code> block then waits until every supply it watches is finished:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>whenever<\/code> body runs once for each value — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — adding it to <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The topic value is available as <code>$_<\/code> (you can also name it with <code>-&gt; $v<\/code>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The key behaviour is that <code>react<\/code> <strong>blocks<\/strong> until its supplies are done.<\/span> <span class=\"sg\" data-s=\"1\">Only after the <code>Supply.from-list<\/code> has emitted all its values does the <code>react<\/code> block finish and the program move on to the <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">That is why <code>$sum<\/code> is already <code>6<\/code> by the time it is printed: the react block waited for the whole stream.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This makes <code>react<\/code> a natural place to gather results from a stream: set up the reactions, let it run to completion, and use what you collected afterwards.<\/span><\/p>"]]},"de":{"t":"Der react-Block","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>react<\/code>-Block ist ein Ort, an dem Reaktionen wohnen.<\/span> <span class=\"sg\" data-s=\"1\">Darin sagt ein <code>whenever<\/code>: „Wann immer dieses Supply einen Wert aussendet, führe diesen Rumpf aus.“ Der <code>react<\/code>-Block wartet dann, bis jedes von ihm beobachtete Supply fertig ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>whenever<\/code>-Rumpf läuft einmal für jeden Wert — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — und addiert ihn zu <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Themenwert steht als <code>$_<\/code> zur Verfügung (Sie können ihn auch mit <code>-&gt; $v<\/code> benennen).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das entscheidende Verhalten ist, dass <code>react<\/code> <strong>blockiert<\/strong>, bis seine Supplies fertig sind.<\/span> <span class=\"sg\" data-s=\"1\">Erst nachdem das <code>Supply.from-list<\/code> alle seine Werte ausgesandt hat, ist der <code>react<\/code>-Block fertig, und das Programm geht zum <code>say<\/code> über.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb ist <code>$sum<\/code> schon <code>6<\/code>, wenn es ausgegeben wird: Der react-Block hat auf den ganzen Strom gewartet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das macht <code>react<\/code> zu einem natürlichen Ort, um Ergebnisse aus einem Strom einzusammeln: die Reaktionen einrichten, es bis zum Ende laufen lassen und danach das Gesammelte verwenden.<\/span><\/p>"]]},"nl":{"t":"Het react-blok","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <code>react<\/code>-blok is een plek waar reacties wonen.<\/span> <span class=\"sg\" data-s=\"1\">Daarbinnen zegt een <code>whenever<\/code>: \"telkens wanneer deze supply een waarde uitzendt, draai deze body\".<\/span> <span class=\"sg\" data-s=\"2\">Het <code>react<\/code>-blok wacht daarna tot elke supply die het bekijkt klaar is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>whenever<\/code>-body draait één keer voor elke waarde — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — en telt haar bij <code>$sum<\/code> op.<\/span> <span class=\"sg\" data-s=\"1\">De onderwerpswaarde is beschikbaar als <code>$_<\/code> (je kunt haar ook met <code>-&gt; $v<\/code> een naam geven).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het kerngedrag is dat <code>react<\/code> <strong>blokkeert<\/strong> tot zijn supplies klaar zijn.<\/span> <span class=\"sg\" data-s=\"1\">Pas nadat de <code>Supply.from-list<\/code> al haar waarden uitgezonden heeft, is het <code>react<\/code>-blok klaar en gaat het programma naar de <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Daarom is <code>$sum<\/code> al <code>6<\/code> tegen de tijd dat het afgedrukt wordt: het react-blok wachtte op de hele stroom.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dat maakt <code>react<\/code> een natuurlijke plek om resultaten uit een stroom bijeen te brengen: zet de reacties op, laat het tot voltooiing draaien, en gebruik daarna wat je verzameld hebt.<\/span><\/p>"]]},"es":{"t":"El bloque react","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>react<\/code> es un lugar donde viven las reacciones.<\/span> <span class=\"sg\" data-s=\"1\">Dentro de él, un <code>whenever<\/code> dice «siempre que este supply emita un valor, ejecuta este cuerpo».<\/span> <span class=\"sg\" data-s=\"2\">El bloque <code>react<\/code> espera entonces hasta que todos los supplies que observa han terminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El cuerpo del <code>whenever<\/code> se ejecuta una vez por cada valor — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> —, sumándolo a <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El valor de tema está disponible como <code>$_<\/code> (también puedes nombrarlo con <code>-&gt; $v<\/code>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El comportamiento clave es que <code>react<\/code> <strong>se bloquea<\/strong> hasta que sus supplies han terminado.<\/span> <span class=\"sg\" data-s=\"1\">Solo después de que el <code>Supply.from-list<\/code> haya emitido todos sus valores acaba el bloque <code>react<\/code> y el programa pasa al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por eso <code>$sum<\/code> ya vale <code>6<\/code> cuando se imprime: el bloque react esperó al flujo entero.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto hace de <code>react<\/code> un lugar natural para reunir resultados de un flujo: prepara las reacciones, déjalo correr hasta el final y usa después lo que hayas recogido.<\/span><\/p>"]]},"it":{"t":"Il blocco react","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>react<\/code> è un posto dove vivono le reazioni.<\/span> <span class=\"sg\" data-s=\"1\">Al suo interno, un <code>whenever<\/code> dice «ogni volta che questo supply emette un valore, esegui questo corpo».<\/span> <span class=\"sg\" data-s=\"2\">Il blocco <code>react<\/code> aspetta poi finché ogni supply che osserva non è finito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il corpo del <code>whenever<\/code> gira una volta per ogni valore — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — sommandolo a <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il valore corrente è disponibile come <code>$_<\/code> (puoi anche dargli un nome con <code>-&gt; $v<\/code>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il comportamento chiave è che <code>react<\/code> <strong>blocca<\/strong> finché i suoi supply non sono conclusi.<\/span> <span class=\"sg\" data-s=\"1\">Solo dopo che il <code>Supply.from-list<\/code> ha emesso tutti i suoi valori il blocco <code>react<\/code> finisce e il programma passa al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ecco perché <code>$sum<\/code> è già <code>6<\/code> quando viene stampato: il blocco react ha aspettato l'intero flusso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo fa di <code>react<\/code> un posto naturale dove raccogliere risultati da un flusso: predisponi le reazioni, lascia che giri fino in fondo e usa dopo ciò che hai raccolto.<\/span><\/p>"]]},"ru":{"t":"Блок react","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блок <code>react<\/code> — это место, где живут реакции.<\/span> <span class=\"sg\" data-s=\"1\">Внутри него <code>whenever<\/code> говорит: «всякий раз, когда этот supply выдаёт значение, выполняй это тело».<\/span> <span class=\"sg\" data-s=\"2\">Затем блок <code>react<\/code> ждёт, пока не закончится каждый supply, за которым он следит:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тело <code>whenever<\/code> выполняется по разу на каждое значение — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — и прибавляет его к <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Текущее значение доступно как <code>$_<\/code> (его можно и назвать через <code>-&gt; $v<\/code>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ключевое свойство в том, что <code>react<\/code> <strong>блокирует<\/strong> выполнение, пока его supply не закончатся.<\/span> <span class=\"sg\" data-s=\"1\">Только после того как <code>Supply.from-list<\/code> выдаст все свои значения, блок <code>react<\/code> завершится и программа перейдёт к <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Именно поэтому <code>$sum<\/code> уже равна <code>6<\/code> к моменту печати: блок react дождался всего потока.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Благодаря этому <code>react<\/code> — естественное место, чтобы собрать результаты из потока: устанавливаете реакции, даёте им доработать до конца и используете собранное дальше.<\/span><\/p>"]]},"uk":{"t":"Блок react","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блок <code>react<\/code> — це місце, де живуть реакції.<\/span> <span class=\"sg\" data-s=\"1\">Усередині нього <code>whenever<\/code> каже: «щоразу, коли цей потік видає значення, виконай це тіло».<\/span> <span class=\"sg\" data-s=\"2\">Блок <code>react<\/code> тоді чекає, аж поки не завершиться кожен потік, за яким він стежить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тіло <code>whenever<\/code> виконується по разу на кожне значення — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — і додає його до <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значення теми доступне як <code>$_<\/code> (його можна також назвати через <code>-&gt; $v<\/code>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ключова поведінка в тому, що <code>react<\/code> <strong>блокує<\/strong> виконання, аж поки його потоки не завершаться.<\/span> <span class=\"sg\" data-s=\"1\">Лише після того, як <code>Supply.from-list<\/code> видасть усі свої значення, блок <code>react<\/code> завершиться й програма перейде до <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Саме тому <code>$sum<\/code> уже дорівнює <code>6<\/code> на момент друку: блок react дочекався всього струменя.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це робить <code>react<\/code> природним місцем для збирання результатів зі струменя: налаштуйте реакції, дайте йому доробити до кінця й скористайтеся зібраним потому.<\/span><\/p>"]]},"bg":{"t":"Блокът react","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>react<\/code> е мястото, където живеят реакциите.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в него <code>whenever<\/code> казва „щом този поток подаде стойност, изпълни това тяло“.<\/span> <span class=\"sg\" data-s=\"2\">Блокът <code>react<\/code> след това чака, докато всеки следен от него поток не приключи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nreact {\n    whenever Supply.from-list(1, 2, 3) {\n        $sum += $_;\n    }\n}\n\nsay $sum; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тялото на <code>whenever<\/code> се изпълнява по веднъж за всяка стойност — <code>1<\/code>, <code>2<\/code>, <code>3<\/code> — и я добавя към <code>$sum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стойността на темата е достъпна като <code>$_<\/code> (можете да я именувате и с <code>-&gt; $v<\/code>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ключовото поведение е, че <code>react<\/code> <strong>блокира<\/strong>, докато потоците му не приключат.<\/span> <span class=\"sg\" data-s=\"1\">Едва след като <code>Supply.from-list<\/code> подаде всичките си стойности, блокът <code>react<\/code> завършва и програмата преминава към <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>$sum<\/code> вече е <code>6<\/code> в момента на отпечатването: блокът react е изчакал цялата струя.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това прави <code>react<\/code> естествено място за събиране на резултати от струя: подгответе реакциите, оставете го да се доизпълни и после използвайте събраното.<\/span><\/p>"]]}}}</script>
