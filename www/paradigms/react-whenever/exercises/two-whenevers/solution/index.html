<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/exercises/two-whenevers/solution","n":1367,"k":"solution","pv":"paradigms/react-whenever/exercises/two-whenevers","nx":"paradigms/await","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"The solution of ’Two whenevers‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $deposits    = Supply.from-list(100, 50, 200);\nmy $withdrawals = Supply.from-list(30, 120);\n\nmy $balance = 0;\n\nreact {\n    whenever $deposits    { $balance += $_ }\n    whenever $withdrawals { $balance -= $_ }\n}\n\nsay $balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/two-whenevers.raku\" target=\"_blank\" rel=\"noopener\">two-whenevers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>200<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The two <code>whenever<\/code> blocks watch the two named supplies and react <strong>differently<\/strong>: deposits are added, withdrawals subtracted. One react block, two streams, two distinct reactions — that is the point of having a <code>whenever<\/code> per source.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The react block finishes only when both supplies are done, so the balance is final before it is printed: <code>100 + 50 + 200 - 30 - 120<\/code> gives <code>200<\/code>. Since addition and subtraction commute, the interleaving of the two streams does not affect the result.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Here both supplies deliver <\/code>. Da Addition und Subtraktion vertauschbar sind, beeinflusst die Verflechtung der beiden Ströme das Ergebnis nicht.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hier liefern beide Supplies ihre Werte unverzüglich, ein Strom nach dem anderen. Im echten Leben treffen die Ereignisse eines Bankkontos über die Zeit verteilt ein — jetzt eine Einzahlung, eine Stunde später eine Abhebung — und die beiden Ströme verflechten sich, wie in der Vorführung <a href=\"https://course.raku.org/de/paradigms/react-whenever/two-timers/\" target=\"_blank\" rel=\"noopener\">Zwei Zeitgeber<\/a>. Der Code bleibt genau derselbe: Der react-Block führt denjenigen <code>whenever<\/code>-Rumpf aus, der zum jeweils eintreffenden Ereignis passt.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Twee whenevers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $deposits    = Supply.from-list(100, 50, 200);\nmy $withdrawals = Supply.from-list(30, 120);\n\nmy $balance = 0;\n\nreact {\n    whenever $deposits    { $balance += $_ }\n    whenever $withdrawals { $balance -= $_ }\n}\n\nsay $balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/two-whenevers.raku\" target=\"_blank\" rel=\"noopener\">two-whenevers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>200<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De twee <code>whenever<\/code>-blokken bekijken de twee benoemde supplies en reageren <strong>verschillend<\/strong>: stortingen worden opgeteld, opnames afgetrokken. Eén react-blok, twee stromen, twee onderscheiden reacties — daar draait het om bij een <code>whenever<\/code> per bron.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het react-blok is pas klaar wanneer beide supplies klaar zijn, dus het saldo staat vast voordat het afgedrukt wordt: <code>100 + 50 + 200 - 30 - 120<\/code> geeft <code>200<\/code>. Omdat optellen en aftrekken commuteren, beïnvloedt de dooreenvlechting van de twee stromen het resultaat niet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hier leveren beide supplies hun waarden onmiddellijk, de ene stroom na de andere. In het echt komen de gebeurtenissen van een bankrekening over de tijd verspreid binnen — nu een storting, een uur later een opname — en vlechten de twee stromen zich dooreen, zoals in de demo <a href=\"https://course.raku.org/nl/paradigms/react-whenever/two-timers/\" target=\"_blank\" rel=\"noopener\">Twee timers<\/a>. De code blijft precies hetzelfde: het react-blok draait de <code>whenever<\/code>-body die bij elke binnenkomende gebeurtenis past.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Dos whenever","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $deposits    = Supply.from-list(100, 50, 200);\nmy $withdrawals = Supply.from-list(30, 120);\n\nmy $balance = 0;\n\nreact {\n    whenever $deposits    { $balance += $_ }\n    whenever $withdrawals { $balance -= $_ }\n}\n\nsay $balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/two-whenevers.raku\" target=\"_blank\" rel=\"noopener\">two-whenevers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>200<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los dos bloques <code>whenever<\/code> observan los dos supplies con nombre y reaccionan de manera <strong>distinta<\/strong>: los ingresos se suman, los reintegros se restan. Un bloque react, dos flujos, dos reacciones diferenciadas: esa es la gracia de tener un <code>whenever<\/code> por fuente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque react termina solo cuando ambos supplies están acabados, así que el saldo es definitivo antes de imprimirse: <code>100 + 50 + 200 - 30 - 120<\/code> da <code>200<\/code>. Como la suma y la resta conmutan, el entrelazado de los dos flujos no afecta al resultado.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aquí ambos supplies entregan sus valores al instante, un flujo tras otro. En la vida real los eventos de una cuenta bancaria llegan repartidos a lo largo del tiempo — un ingreso ahora, un reintegro una hora después — y los dos flujos se entrelazan, como en la demostración de <a href=\"https://course.raku.org/es/paradigms/react-whenever/two-timers/\" target=\"_blank\" rel=\"noopener\">Dos temporizadores<\/a>. El código se queda exactamente igual: el bloque react ejecuta el cuerpo del <code>whenever<\/code> que corresponda a cada evento según entra.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Due whenever","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $deposits    = Supply.from-list(100, 50, 200);\nmy $withdrawals = Supply.from-list(30, 120);\n\nmy $balance = 0;\n\nreact {\n    whenever $deposits    { $balance += $_ }\n    whenever $withdrawals { $balance -= $_ }\n}\n\nsay $balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/two-whenevers.raku\" target=\"_blank\" rel=\"noopener\">two-whenevers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>200<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">I due blocchi <code>whenever<\/code> osservano i due supply con un nome e reagiscono in modo <strong>diverso<\/strong>: i depositi vengono aggiunti, i prelievi sottratti. Un blocco react, due flussi, due reazioni distinte — è questo il senso di avere un <code>whenever<\/code> per sorgente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco react finisce solo quando entrambi i supply sono conclusi, quindi il saldo è definitivo prima di essere stampato: <code>100 + 50 + 200 - 30 - 120<\/code> dà <code>200<\/code>. Poiché addizione e sottrazione commutano, l'intreccio dei due flussi non influenza il risultato.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui entrambi i supply consegnano i propri valori all'istante, un flusso dopo l'altro. Nella vita vera gli eventi di un conto bancario arrivano distribuiti nel tempo — un deposito ora, un prelievo un'ora dopo — e i due flussi si intrecciano, come nella dimostrazione <a href=\"https://course.raku.org/it/paradigms/react-whenever/two-timers/\" target=\"_blank\" rel=\"noopener\">Due timer<\/a>. Il codice resta esattamente lo stesso: il blocco react esegue il <code>whenever<\/code> che corrisponde a ogni evento man mano che entra.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Два whenever","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $deposits    = Supply.from-list(100, 50, 200);\nmy $withdrawals = Supply.from-list(30, 120);\n\nmy $balance = 0;\n\nreact {\n    whenever $deposits    { $balance += $_ }\n    whenever $withdrawals { $balance -= $_ }\n}\n\nsay $balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/two-whenevers.raku\" target=\"_blank\" rel=\"noopener\">two-whenevers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>200<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Два блока <code>whenever<\/code> следят за двумя именованными supply и реагируют <strong>по-разному<\/strong>: поступления прибавляются, списания вычитаются. Один блок react, два потока, две различные реакции — ради этого и заводят по <code>whenever<\/code> на источник.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок react завершается лишь тогда, когда закончатся оба supply, поэтому к моменту печати баланс уже окончательный: <code>100 + 50 + 200 - 30 - 120<\/code> даёт <code>200<\/code>. Поскольку сложение и вычитание перестановочны, чередование двух потоков на результат не влияет.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Здесь оба supply выдают свои значения мгновенно, один поток за другим. В жизни события банковского счёта приходят растянутыми во времени — поступление сейчас, списание через час, — и два потока переплетаются, как в примере <a href=\"https://course.raku.org/ru/paradigms/react-whenever/two-timers/\" target=\"_blank\" rel=\"noopener\">Два таймера<\/a>. Код при этом остаётся ровно тем же: блок react выполняет то тело <code>whenever<\/code>, которое соответствует очередному пришедшему событию.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Два whenever»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з те тіло <code>whenever<\/code>, що відповідає кожній події в міру її надходження.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Два whenever","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $deposits    = Supply.from-list(100, 50, 200);\nmy $withdrawals = Supply.from-list(30, 120);\n\nmy $balance = 0;\n\nreact {\n    whenever $deposits    { $balance += $_ }\n    whenever $withdrawals { $balance -= $_ }\n}\n\nsay $balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/two-whenevers.raku\" target=\"_blank\" rel=\"noopener\">two-whenevers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>200<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Двата блока <code>whenever<\/code> следят двата именувани потока и откликват <strong>различно<\/strong>: постъпленията се добавят, тегленията се изваждат. Един блок react, две струи, две отчетливо различни реакции — точно заради това се държи по един <code>whenever<\/code> на източник.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блокът react приключва едва когато двата потока свършат, така че салдото е окончателно още преди отпечатването: <code>100 + 50 + 200 - 30 - 120<\/code> дава <code>200<\/code>. Понеже събирането и изваждането комутират, преплитането на двете струи не влияе на резултата.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тук и двата потока подават стойностите си мигновено, една струя след друга. В живота събитията по банкова сметка пристигат разтеглени във времето — постъпление сега, теглене след час — и двете струи с
