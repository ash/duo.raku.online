st(4, 42, 7, 100, 15) {\n        if $_ &gt; 10 { @big.push($_) }\n        else       { @small.push($_) }\n    }\n}\n\nsay @small;\nsay @big;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-collect.raku\" target=\"_blank\" rel=\"noopener\">react-collect.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[4 7]\n[42 100 15]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тело <code>whenever<\/code> — обычный код, поэтому оно может не только собирать: здесь оно <strong>принимает решение<\/strong>, направляя каждое приходящее значение в <code>@big<\/code> или в <code>@small<\/code>. Внутри каждого массива значения сохраняют порядок потока.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок react ждёт окончания потока, поэтому к моменту печати оба массива уже заполнены целиком.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Розкладіть у два масиви»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @small;\nmy @big;\n\nreact {\n    whenever Supply.from-list(4, 42, 7, 100, 15) {\n        if $_ &gt; 10 { @big.push($_) }\n        else       { @small.push($_) }\n    }\n}\n\nsay @small;\nsay @big;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-collect.raku\" target=\"_blank\" rel=\"noopener\">react-collect.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[4 7]\n[42 100 15]<\/code><\/pre>"],
