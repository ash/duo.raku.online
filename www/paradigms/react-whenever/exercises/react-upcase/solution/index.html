<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/exercises/react-upcase/solution","n":1363,"k":"solution","pv":"paradigms/react-whenever/exercises/react-upcase","nx":"paradigms/react-whenever/exercises/react-collect","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"The solution of ’Upper-case with react‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>whenever<\/code> body runs once per value, upper-casing it and pushing it onto <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> waits for the single supply to finish, so by the time <code>say<\/code> runs the array holds all three values in order: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A supply has list-like methods of its own, so you could upper-case in the stream instead of in the body — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — and the effect is the same. <code>.map<\/code> on a supply transforms each value as it flows past; the choice is simply whether the transformation belongs to the stream or to the reaction.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Großschreiben mit react","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>whenever<\/code>-Rumpf läuft einmal je Wert, schreibt ihn groß und legt ihn auf <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> wartet, bis das eine Supply fertig ist, bis <code>say<\/code> läuft, enthält das Array also alle drei Werte in Reihenfolge: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein Supply hat eigene listenartige Methoden, Sie könnten also im Strom statt im Rumpf großschreiben — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — mit derselben Wirkung. <code>.map<\/code> auf einem Supply formt jeden Wert um, während er vorbeifließt; die Wahl ist schlicht, ob die Umformung zum Strom oder zur Reaktion gehört.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Hoofdletters met react","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>whenever<\/code>-body draait één keer per waarde, zet haar in hoofdletters en duwt haar op <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> wacht tot de enkele supply klaar is, dus tegen de tijd dat <code>say<\/code> draait bevat de array alle drie de waarden op volgorde: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een supply heeft eigen lijstachtige methoden, dus je zou de hoofdletters in de stroom kunnen zetten in plaats van in de body — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — met hetzelfde effect. <code>.map<\/code> op een supply vormt elke waarde om terwijl ze langsstroomt; de keuze is eenvoudigweg of de omvorming bij de stroom of bij de reactie hoort.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Mayúsculas con react","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo del <code>whenever<\/code> se ejecuta una vez por valor, pasándolo a mayúsculas y añadiéndolo a <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> espera a que el único supply termine, así que cuando se ejecuta el <code>say<\/code> el array ya contiene los tres valores en orden: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un supply tiene sus propios métodos al estilo de las listas, así que podrías pasar a mayúsculas dentro del flujo en lugar de en el cuerpo — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — y el efecto es el mismo. <code>.map<\/code> sobre un supply transforma cada valor según pasa; la elección es simplemente si la transformación pertenece al flujo o a la reacción.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Maiuscolo con react","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo del <code>whenever<\/code> gira una volta per valore, rendendolo maiuscolo e spingendolo in <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> aspetta che l'unico supply finisca, quindi quando il <code>say<\/code> gira l'array contiene tutti e tre i valori in ordine: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un supply ha metodi simili a quelli degli elenchi, quindi potresti rendere maiuscolo nel flusso invece che nel corpo — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — e l'effetto è lo stesso. <code>.map<\/code> su un supply trasforma ogni valore mentre scorre; la scelta è semplicemente se la trasformazione appartenga al flusso o alla reazione.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Верхний регистр с react","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тело <code>whenever<\/code> выполняется по разу на каждое значение, переводит его в верхний регистр и добавляет в <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> дожидается окончания единственного supply, поэтому к моменту выполнения <code>say<\/code> массив содержит все три значения по порядку: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У supply есть собственные списочные методы, поэтому переводить в верхний регистр можно не в теле, а прямо в потоке — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code>, — и результат будет тот же. <code>.map<\/code> у supply преобразует каждое значение на лету; вопрос лишь в том, к чему относится преобразование — к потоку или к реакции.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Верхній регістр через react»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло <code>whenever<\/code> виконується по разу на значення, переводить його у верхній регістр і кладе в <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> чекає завершення єдиного потоку, тож на момент виконання <code>say<\/code> масив містить усі три значення по порядку: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Потік значень має власні методи, схожі на спискові, тож переводити у верхній регістр можна в самому струмені, а не в тілі — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — і ефект той самий. <code>.map<\/code> на потоці перетворює кожне значення, коли те пропливає повз; вибір полягає лише в тому, чи перетворення належить струменеві, чи реакції.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Главни букви с react","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @collected;\n\nreact {\n    whenever Supply.from-list('a', 'b', 'c') {\n        @collected.push($_.uc);\n    }\n}\n\nsay @collected;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/react-whenever/react-upcase.raku\" target=\"_blank\" rel=\"noopener\">react-upcase.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[A B C]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото на <code>whenever<\/code> се изпълнява по веднъж за стойност, превръща я в главни букви и я слага в <code>@collected<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>react<\/code> изчаква единствения поток да приключи, така че в момента на изпълнение на <code>say<\/code> масивът съдържа и трите стойности по ред: <code>[A B C]<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Потокът има свои собствени методи, подобни на списъчните, така че можете да превърнете в главни букви в самата струя, а не в тялото — <code>whenever Supply.from-list('a', 'b', 'c').map(*.uc) { @collected.push($_) }<\/code> — и ефектът е същият. <code>.map<\/code> върху поток преобразува всяка стойност, докато тя минава покрай него; изборът е само дали преобразуването принадлежи на струята, или на реакцията.<\/span><\/li><\/ol>"]]}}}</script>
