<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/named-supplies","n":1358,"k":"topic","pv":"paradigms/react-whenever/whenever/quiz2","nx":"paradigms/react-whenever/whenever-vs-when","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"Supplies defined outside","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Every <code>whenever<\/code> so far has created its supply right there in the header — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">That reads well for a quick example, but real programs rarely have their event source on hand at exactly that spot.<\/span> <span class=\"sg\" data-s=\"2\">More often a supply is built somewhere else — returned by a function, produced by a <code>Supplier<\/code>, or handed to you by a socket or a timer — and arrives as a plain variable.<\/span> <span class=\"sg\" data-s=\"3\">A <code>whenever<\/code> is just as happy to watch a named supply:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So read <code>whenever $sensors { … }<\/code> as “whenever the <code>$sensors<\/code> supply — wherever it came from — emits a value, run this body”.<\/span> <span class=\"sg\" data-s=\"1\">The inline <code>whenever Supply.from-list(...)<\/code> you saw earlier is just the special case where the source happens to be created on the spot.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If this outer-block-with-inner-blocks shape reminds you of something, you are right — the <a href=\"/paradigms/react-whenever/whenever-vs-when/\">next page<\/a> compares it with <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"de":{"t":"Anderswo definierte Supplies","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jedes <code>whenever<\/code> bisher hat sein Supply gleich im Kopf erzeugt — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das liest sich für ein schnelles Beispiel gut, doch echte Programme haben ihre Ereignisquelle selten genau an dieser Stelle zur Hand.<\/span> <span class=\"sg\" data-s=\"2\">Häufiger wird ein Supply anderswo gebaut — von einer Funktion geliefert, von einem <code>Supplier<\/code> erzeugt oder Ihnen von einem Socket oder einem Zeitgeber überreicht — und kommt als gewöhnliche Variable an.<\/span> <span class=\"sg\" data-s=\"3\">Ein <code>whenever<\/code> beobachtet ebenso bereitwillig ein benanntes Supply:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt aus:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie <code>whenever $sensors { … }<\/code> also als „wann immer das Supply <code>$sensors<\/code> — woher es auch stammt — einen Wert aussendet, führe diesen Rumpf aus“.<\/span> <span class=\"sg\" data-s=\"1\">Das inline stehende <code>whenever Supply.from-list(...)<\/code> von zuvor ist nur der Sonderfall, in dem die Quelle zufällig an Ort und Stelle erzeugt wird.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie diese Form aus äußerem Block mit inneren Blöcken an etwas erinnert, haben Sie recht — die <a href=\"https://course.raku.org/de/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">nächste Seite<\/a> vergleicht sie mit <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"nl":{"t":"Supplies die elders gedefinieerd zijn","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Elke <code>whenever<\/code> tot nu toe maakte zijn supply meteen in de kop — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat leest goed voor een snel voorbeeld, maar echte programma's hebben hun gebeurtenisbron zelden precies op die plek bij de hand.<\/span> <span class=\"sg\" data-s=\"2\">Vaker wordt een supply ergens anders gebouwd — teruggegeven door een functie, geproduceerd door een <code>Supplier<\/code>, of aan je overhandigd door een socket of een timer — en komt hij als gewone variabele binnen.<\/span> <span class=\"sg\" data-s=\"3\">Een <code>whenever<\/code> bekijkt net zo graag een benoemde supply:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lees <code>whenever $sensors { … }<\/code> dus als \"telkens wanneer de supply <code>$sensors<\/code> — waar hij ook vandaan kwam — een waarde uitzendt, draai deze body\".<\/span> <span class=\"sg\" data-s=\"1\">De inline <code>whenever Supply.from-list(...)<\/code> die je eerder zag, is slechts het bijzondere geval waarin de bron toevallig ter plekke gemaakt wordt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als deze vorm van een buitenblok met binnenblokken je ergens aan doet denken, heb je gelijk — de <a href=\"https://course.raku.org/nl/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">volgende pagina<\/a> vergelijkt hem met <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"es":{"t":"Supplies definidos fuera","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Todos los <code>whenever<\/code> vistos hasta ahora creaban su supply allí mismo, en la cabecera: <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eso se lee bien en un ejemplo rápido, pero los programas reales rara vez tienen su fuente de eventos a mano exactamente en ese punto.<\/span> <span class=\"sg\" data-s=\"2\">Lo más frecuente es que un supply se construya en otro sitio — devuelto por una función, producido por un <code>Supplier<\/code> o entregado por un socket o un temporizador — y llegue como una variable corriente.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>whenever<\/code> observa igual de a gusto un supply con nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que lee <code>whenever $sensors { … }<\/code> como «siempre que el supply <code>$sensors<\/code> — venga de donde venga — emita un valor, ejecuta este cuerpo».<\/span> <span class=\"sg\" data-s=\"1\">El <code>whenever Supply.from-list(...)<\/code> en línea que viste antes no es más que el caso particular en el que la fuente se crea allí mismo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si esta forma de bloque exterior con bloques interiores te recuerda a algo, no te equivocas: la <a href=\"https://course.raku.org/es/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">página siguiente<\/a> la compara con <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"it":{"t":"Supply definiti all'esterno","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>whenever<\/code> visto finora ha creato il proprio supply proprio lì nell'intestazione — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si legge bene per un esempio veloce, ma i programmi veri raramente hanno la propria sorgente di eventi sottomano esattamente in quel punto.<\/span> <span class=\"sg\" data-s=\"2\">Più spesso un supply viene costruito altrove — restituito da una funzione, prodotto da un <code>Supplier<\/code> o consegnato da un socket o da un timer — e arriva come semplice variabile.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>whenever<\/code> è altrettanto contento di osservare un supply con un nome:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi leggi <code>whenever $sensors { … }<\/code> come «ogni volta che il supply <code>$sensors<\/code> — da qualunque parte venga — emette un valore, esegui questo corpo».<\/span> <span class=\"sg\" data-s=\"1\">Il <code>whenever Supply.from-list(...)<\/code> in linea che hai visto prima è solo il caso particolare in cui la sorgente viene creata sul posto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se questa forma di blocco esterno con blocchi interni ti ricorda qualcosa, hai ragione: la <a href=\"https://course.raku.org/it/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">pagina successiva<\/a> la confronta con <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"ru":{"t":"Supply, объявленные снаружи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Все <code>whenever<\/code> до сих пор создавали свой supply прямо в заголовке — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для короткого примера это читается неплохо, но в настоящих программах источник событий редко оказывается под рукой ровно в этом месте.<\/span> <span class=\"sg\" data-s=\"2\">Чаще supply создаётся где-то ещё — его возвращает функция, производит <code>Supplier<\/code> или передаёт вам сокет или таймер, — и приходит он как обычная переменная.<\/span> <span class=\"sg\" data-s=\"3\"><code>Whenever<\/code> с тем же успехом следит и за именованным supply:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так что читайте <code>whenever $sensors { … }<\/code> как «всякий раз, когда supply <code>$sensors<\/code> — откуда бы он ни взялся — выдаёт значение, выполняй это тело».<\/span> <span class=\"sg\" data-s=\"1\">Виденный ранее вариант с <code>whenever Supply.from-list(...)<\/code> внутри — лишь частный случай, когда источник создаётся тут же на месте.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если эта форма — внешний блок со вложенными блоками — вам что-то напоминает, вы правы: <a href=\"https://course.raku.org/ru/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">следующая страница<\/a> сравнивает её с <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"uk":{"t":"Потоки, означені зовні","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>whenever<\/code> досі створював свій потік просто там, у заголовку — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для швидкого прикладу це читається добре, але справжні програми рідко мають джерело подій під рукою рівно в цьому місці.<\/span> <span class=\"sg\" data-s=\"2\">Частіше потік будують десь інде — його повертає функція, виробляє <code>Supplier<\/code> або вручає вам сокет чи таймер — і надходить він як звичайна змінна.<\/span> <span class=\"sg\" data-s=\"3\"><code>whenever<\/code> так само радо стежить за іменованим потоком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тож читайте <code>whenever $sensors { … }<\/code> як «щоразу, коли потік <code>$sensors<\/code> — звідки б він не взявся — видає значення, виконай це тіло».<\/span> <span class=\"sg\" data-s=\"1\">Вбудований <code>whenever Supply.from-list(...)<\/code>, який ви бачили раніше, є лише окремим випадком, коли джерело випадково створено просто на місці.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ця форма «зовнішній блок із внутрішніми блоками» вам щось нагадує, то ви маєте рацію — <a href=\"https://course.raku.org/uk/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">наступна сторінка<\/a> порівнює її з <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]},"bg":{"t":"Потоци, дефинирани отвън","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>whenever<\/code> досега създаваше потока си точно там, в заглавието — <code>whenever Supply.from-list(...)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това се чете добре за бърз пример, но истинските програми рядко имат източника си на събития под ръка точно на това място.<\/span> <span class=\"sg\" data-s=\"2\">По-често потокът се изгражда другаде — връща го функция, произвежда го <code>Supplier<\/code> или ви го подава сокет или таймер — и пристига като обикновена променлива.<\/span> <span class=\"sg\" data-s=\"3\"><code>whenever<\/code> следи именуван поток също толкова охотно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sensors  = Supply.from-list(18, 21, 19);\nmy $messages = Supply.from-list('hi', 'bye');\n\nreact {\n    whenever $sensors {\n        say \"temperature: $_\";\n    }\n    whenever $messages {\n        say \"message: $_\";\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>temperature: 18\ntemperature: 21\ntemperature: 19\nmessage: hi\nmessage: bye<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Затова четете <code>whenever $sensors { … }<\/code> като „щом потокът <code>$sensors<\/code> — откъдето и да е дошъл — подаде стойност, изпълни това тяло“.<\/span> <span class=\"sg\" data-s=\"1\">Вграденият <code>whenever Supply.from-list(...)<\/code>, който видяхте по-рано, е просто частният случай, в който източникът се създава на място.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако тази форма „външен блок с вътрешни блокове“ ви напомня нещо, вие сте прави — <a href=\"https://course.raku.org/bg/paradigms/react-whenever/whenever-vs-when/\" target=\"_blank\" rel=\"noopener\">следващата страница<\/a> я сравнява с <code>given<\/code>/<code>when<\/code>.<\/span><\/p>"]]}}}</script>
