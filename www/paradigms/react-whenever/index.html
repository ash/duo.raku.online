<script type="application/json" id="page-data">{"u":"paradigms/react-whenever","n":1352,"k":"section","pv":"paradigms/supply-kinds/exercises/live-sum/solution","nx":"paradigms/react-whenever/the-react-block","tr":["paradigms"],"L":{"en":{"t":"react and whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tapping a single supply is fine, but real reactive programs often watch <strong>several<\/strong> streams at once and react to whichever produces a value next.<\/span> <span class=\"sg\" data-s=\"1\">Raku has dedicated syntax for this: the <code>react<\/code> block, with one or more <code>whenever<\/code> blocks inside it.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>react<\/code> block sets up the reactions and then waits, running each <code>whenever<\/code> body as its supply emits — until all the supplies are done.<\/span> <span class=\"sg\" data-s=\"1\">This section shows how the two work together.<\/span><\/p>"]]},"de":{"t":"react und whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein einzelnes Supply anzuzapfen ist gut, doch echte reaktive Programme beobachten oft <strong>mehrere<\/strong> Ströme zugleich und reagieren auf denjenigen, der als nächster einen Wert liefert.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat dafür eine eigene Schreibweise: den <code>react<\/code>-Block mit einem oder mehreren <code>whenever<\/code>-Blöcken darin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>react<\/code>-Block richtet die Reaktionen ein und wartet dann, wobei er jeden <code>whenever<\/code>-Rumpf ausführt, sobald sein Supply etwas aussendet — bis alle Supplies fertig sind.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt, wie die beiden zusammenwirken.<\/span><\/p>"]]},"nl":{"t":"react en whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eén supply aftappen is prima, maar echte reactieve programma's bekijken vaak <strong>meerdere<\/strong> stromen tegelijk en reageren op degene die als volgende een waarde levert.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft daar eigen syntaxis voor: het <code>react<\/code>-blok, met een of meer <code>whenever<\/code>-blokken erin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>react<\/code>-blok zet de reacties op en wacht daarna, waarbij het elke <code>whenever<\/code>-body draait zodra de bijbehorende supply uitzendt — tot alle supplies klaar zijn.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie laat zien hoe de twee samenwerken.<\/span><\/p>"]]},"es":{"t":"react y whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Enganchar un solo supply está bien, pero los programas reactivos de verdad observan a menudo <strong>varios<\/strong> flujos a la vez y reaccionan al que produzca el valor siguiente.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene una sintaxis dedicada a esto: el bloque <code>react<\/code>, con uno o más bloques <code>whenever<\/code> dentro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>react<\/code> prepara las reacciones y después espera, ejecutando el cuerpo de cada <code>whenever<\/code> según emite su supply, hasta que todos los supplies han terminado.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección muestra cómo trabajan juntos los dos.<\/span><\/p>"]]},"it":{"t":"react e whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Attingere a un solo supply va bene, ma i programmi reattivi veri osservano spesso <strong>parecchi<\/strong> flussi insieme e reagiscono a quello che produce il valore successivo.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha una sintassi dedicata a questo: il blocco <code>react<\/code>, con al suo interno uno o più blocchi <code>whenever<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>react<\/code> predispone le reazioni e poi aspetta, eseguendo il corpo di ogni <code>whenever<\/code> man mano che il suo supply emette — finché tutti i supply non sono conclusi.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra come i due lavorano insieme.<\/span><\/p>"]]},"lv":{"t":"react un whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pieslēgties vienai supply ir labi, taču īstas reaktīvas programmas bieži vēro <strong>vairākas<\/strong> straumes uzreiz un reaģē uz to, kura nākamā rada vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Raku tam ir īpaša sintakse: <code>react<\/code> bloks ar vienu vai vairākiem <code>whenever<\/code> blokiem tā iekšienē.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>react<\/code> bloks izveido reakcijas un tad gaida, izpildot katru <code>whenever<\/code> ķermeni, kad tā supply izstaro, — līdz visas supply ir pabeigtas.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa parāda, kā abi darbojas kopā.<\/span><\/p>"]]},"ru":{"t":"react и whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подключиться к одному supply — дело нехитрое, но настоящие реактивные программы часто следят сразу за <strong>несколькими<\/strong> потоками и реагируют на тот, который выдал значение следующим.<\/span> <span class=\"sg\" data-s=\"1\">В Raku для этого есть отдельный синтаксис: блок <code>react<\/code>, а внутри него — один или несколько блоков <code>whenever<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>react<\/code> устанавливает реакции, а затем ждёт, выполняя тело каждого <code>whenever<\/code>, когда его supply выдаёт значение, — пока все supply не закончатся.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе показано, как эти два элемента работают вместе.<\/span><\/p>"]]},"uk":{"t":"react і whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Підключитися до одного потоку значень — це добре, але справжні реактивні програми часто стежать за <strong>кількома<\/strong> струменями водночас і реагують на той, що видасть значення наступним.<\/span> <span class=\"sg\" data-s=\"1\">У Raku для цього є окремий синтаксис: блок <code>react<\/code> з одним чи кількома блоками <code>whenever<\/code> усередині.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>react<\/code> налаштовує реакції, а потім чекає, виконуючи тіло кожного <code>whenever<\/code>, коли його потік щось видає, — аж поки не завершаться всі потоки.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує, як ці двоє працюють разом.<\/span><\/p>"]]},"bg":{"t":"react и whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Включването към един поток е добре, но истинските реактивни програми често следят <strong>няколко<\/strong> струи наведнъж и откликват на онази, която подаде стойност следваща.<\/span> <span class=\"sg\" data-s=\"1\">Raku има отделен синтаксис за това: блокът <code>react<\/code> с един или повече блока <code>whenever<\/code> вътре в него.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>react<\/code> подготвя реакциите и после чака, изпълнявайки тялото на всеки <code>whenever<\/code>, когато неговият поток подаде стойност — докато всички потоци не приключат.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва как двете работят заедно.<\/span><\/p>"]]},"eo":{"t":"react kaj whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Konektiĝi al unu sola supply estas bone, sed veraj reaktivaj programoj ofte observas <strong>plurajn<\/strong> fluojn samtempe kaj reagas al tiu, kiu produktas valoron sekve.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas dediĉitan sintakson por tio: la blokon <code>react<\/code>, kun unu aŭ pluraj blokoj <code>whenever<\/code> ene de ĝi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloko <code>react<\/code> starigas la reagojn kaj poste atendas, plenumante ĉiun korpon <code>whenever<\/code> laŭ la eligoj de ĝia supply — ĝis ĉiuj supply finiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio montras, kiel la du kunlaboras.<\/span><\/p>"]]},"la":{"t":"react et whenever","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad unum supply se coniungere satis est, sed programmata reactiva vera saepe <strong>plures<\/strong> fluxus simul spectant et ei respondent qui proximus valorem producit.<\/span> <span class=\"sg\" data-s=\"1\">Raku syntaxin propriam huic rei habet: blocum <code>react<\/code>, cum uno vel pluribus blocis <code>whenever<\/code> intus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Blocus <code>react<\/code> reactiones instituit deinde exspectat, unumquodque corpus <code>whenever<\/code> currens dum supply eius emittit — donec omnia supply perfecta sint.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio ostendit quomodo duo simul operentur.<\/span><\/p>"]]}}}</script>
