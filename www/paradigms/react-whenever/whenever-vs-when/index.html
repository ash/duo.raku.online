<script type="application/json" id="page-data">{"u":"paradigms/react-whenever/whenever-vs-when","n":1359,"k":"topic","pv":"paradigms/react-whenever/named-supplies","nx":"paradigms/react-whenever/two-timers","tr":["paradigms","paradigms/react-whenever"],"L":{"en":{"t":"whenever vs when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The shape of a <code>react<\/code> block may look familiar.<\/span> <span class=\"sg\" data-s=\"1\">An outer block holding several inner blocks, each acting on the topic <code>$_<\/code>, is exactly how <a href=\"/advanced/given-when/\"><code>given<\/code>/<code>when<\/code><\/a> is written.<\/span> <span class=\"sg\" data-s=\"2\">If you had a single temperature reading instead of a whole stream of them, you would branch on it like this:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The resemblance to <code>react<\/code>/<code>whenever<\/code> is real, but the two do very different jobs:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> handles one value, right now.** <code>given<\/code> sets <code>$_<\/code> to a single value; each <code>when<\/code> tests it (<code>$_ ~~ 18<\/code>), the <strong>first<\/strong> match runs, and the block is finished. It is an ordinary, synchronous conditional.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> handles many values, over time.** A <code>whenever<\/code> does not test <code>$_<\/code> against a pattern — it <em>subscribes<\/em> to a supply, and its body runs for <strong>every<\/strong> value that supply emits, whenever that value arrives. All the <code>whenever<\/code>s are live at once, and <code>react<\/code> keeps blocking until each of their supplies is finished.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So <code>when<\/code> asks “does this one value match?”, while <code>whenever<\/code> says “for each value this stream ever produces, do this”.<\/span> <span class=\"sg\" data-s=\"1\">Same skeleton, very different lives: a branch taken a single time, versus a reaction that runs again and again as events arrive.<\/span><\/p>"]]},"de":{"t":"whenever gegen when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Form eines <code>react<\/code>-Blocks mag bekannt vorkommen.<\/span> <span class=\"sg\" data-s=\"1\">Ein äußerer Block, der mehrere innere Blöcke enthält, die jeweils auf dem Thema <code>$_<\/code> arbeiten, ist genau die Schreibweise von <a href=\"https://course.raku.org/de/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Hätten Sie einen einzelnen Temperaturmesswert statt eines ganzen Stroms davon, würden Sie so darauf verzweigen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ähnlichkeit zu <code>react<\/code>/<code>whenever<\/code> ist echt, doch die beiden erledigen sehr verschiedene Aufgaben:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> behandelt einen Wert, jetzt sofort.** <code>given<\/code> setzt <code>$_<\/code> auf einen einzelnen Wert; jedes <code>when<\/code> prüft ihn (<code>$_ ~~ 18<\/code>), das <strong>erste<\/strong> Zutreffen läuft, und der Block ist fertig. Es ist eine gewöhnliche, gleichzeitig ablaufende Verzweigung.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> behandelt viele Werte, im Lauf der Zeit.** Ein <code>whenever<\/code> prüft <code>$_<\/code> nicht gegen ein Muster — es <em>abonniert<\/em> ein Supply, und sein Rumpf läuft für <strong>jeden<\/strong> Wert, den dieses Supply aussendet, wann immer dieser Wert eintrifft. Alle <code>whenever<\/code> sind zugleich aktiv, und <code>react<\/code> blockiert weiter, bis jedes ihrer Supplies fertig ist.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>when<\/code> fragt also „trifft dieser eine Wert zu?“, während <code>whenever<\/code> sagt „tu dies für jeden Wert, den dieser Strom je erzeugt“.<\/span> <span class=\"sg\" data-s=\"1\">Dasselbe Gerüst, sehr verschiedene Leben: eine einmal genommene Verzweigung gegenüber einer Reaktion, die immer wieder läuft, sobald Ereignisse eintreffen.<\/span><\/p>"]]},"nl":{"t":"whenever versus when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De vorm van een <code>react<\/code>-blok komt misschien bekend voor.<\/span> <span class=\"sg\" data-s=\"1\">Een buitenblok dat meerdere binnenblokken bevat die elk op het onderwerp <code>$_<\/code> werken, is precies hoe <a href=\"https://course.raku.org/nl/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a> geschreven wordt.<\/span> <span class=\"sg\" data-s=\"2\">Had je één enkele temperatuurmeting in plaats van een hele stroom ervan, dan zou je er zo op vertakken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De gelijkenis met <code>react<\/code>/<code>whenever<\/code> is echt, maar de twee doen heel verschillend werk:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> behandelt één waarde, nu meteen.** <code>given<\/code> zet <code>$_<\/code> op één enkele waarde; elke <code>when<\/code> test die (<code>$_ ~~ 18<\/code>), de <strong>eerste<\/strong> die matcht draait, en het blok is klaar. Het is een gewone, synchrone voorwaarde.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> behandelt veel waarden, in de loop van de tijd.** Een <code>whenever<\/code> test <code>$_<\/code> niet tegen een patroon — hij <em>abonneert<\/em> zich op een supply, en zijn body draait voor <strong>elke<\/strong> waarde die die supply uitzendt, wanneer die waarde ook binnenkomt. Alle <code>whenever<\/code>s zijn tegelijk actief, en <code>react<\/code> blijft blokkeren tot elk van hun supplies klaar is.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>when<\/code> vraagt dus \"matcht deze ene waarde?\", terwijl <code>whenever<\/code> zegt \"doe dit voor elke waarde die deze stroom ooit oplevert\".<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde skelet, heel verschillende levens: een tak die één keer genomen wordt, tegenover een reactie die telkens opnieuw draait zodra er gebeurtenissen binnenkomen.<\/span><\/p>"]]},"es":{"t":"whenever y when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma de un bloque <code>react<\/code> puede resultarte familiar.<\/span> <span class=\"sg\" data-s=\"1\">Un bloque exterior que contiene varios bloques interiores, cada uno actuando sobre el tema <code>$_<\/code>, es exactamente como se escribe <a href=\"https://course.raku.org/es/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Si tuvieras una sola lectura de temperatura en lugar de un flujo entero de ellas, te ramificarías así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El parecido con <code>react<\/code>/<code>whenever<\/code> es real, pero los dos hacen trabajos muy distintos:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> maneja un valor, ahora mismo.** <code>given<\/code> fija <code>$_<\/code> a un solo valor; cada <code>when<\/code> lo comprueba (<code>$_ ~~ 18<\/code>), se ejecuta la <strong>primera<\/strong> coincidencia y el bloque termina. Es un condicional corriente y síncrono.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> maneja muchos valores, a lo largo del tiempo.** Un <code>whenever<\/code> no comprueba <code>$_<\/code> contra un patrón: se <em>suscribe<\/em> a un supply, y su cuerpo se ejecuta para <strong>cada<\/strong> valor que ese supply emita, cuando quiera que ese valor llegue. Todos los <code>whenever<\/code> están vivos a la vez, y <code>react<\/code> sigue bloqueando hasta que todos sus supplies han terminado.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que <code>when<\/code> pregunta «¿coincide este valor?», mientras que <code>whenever<\/code> dice «para cada valor que este flujo produzca alguna vez, haz esto».<\/span> <span class=\"sg\" data-s=\"1\">El mismo esqueleto, vidas muy distintas: una rama tomada una sola vez frente a una reacción que se ejecuta una y otra vez según llegan los eventos.<\/span><\/p>"]]},"it":{"t":"whenever e when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma di un blocco <code>react<\/code> può sembrare familiare.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco esterno che contiene parecchi blocchi interni, ciascuno che agisce sull'argomento corrente <code>$_<\/code>, è esattamente il modo in cui si scrive <a href=\"https://course.raku.org/it/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Se avessi una singola lettura di temperatura invece di un intero flusso di esse, vi ti dirameresti così:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La somiglianza con <code>react<\/code>/<code>whenever<\/code> è reale, ma i due fanno lavori molto diversi:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> gestisce un valore, adesso.** <code>given<\/code> imposta <code>$_<\/code> a un unico valore; ogni <code>when<\/code> lo mette alla prova (<code>$_ ~~ 18<\/code>), gira la <strong>prima<\/strong> corrispondenza e il blocco è finito. È una condizione ordinaria e sincrona.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> gestisce molti valori, nel tempo.** Un <code>whenever<\/code> non mette alla prova <code>$_<\/code> contro uno schema: si <em>abbona<\/em> a un supply, e il suo corpo gira per <strong>ogni<\/strong> valore che quel supply emette, quando quel valore arriva. Tutti i <code>whenever<\/code> sono vivi insieme, e <code>react<\/code> continua a bloccare finché ognuno dei loro supply non è finito.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>when<\/code> chiede «questo unico valore corrisponde?», mentre <code>whenever<\/code> dice «per ogni valore che questo flusso produrrà mai, fai questo».<\/span> <span class=\"sg\" data-s=\"1\">Stesso scheletro, vite molto diverse: una diramazione presa una volta sola, contro una reazione che gira ancora e ancora man mano che gli eventi arrivano.<\/span><\/p>"]]},"lv":{"t":"whenever un when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>react<\/code> bloka forma var likties pazīstama.<\/span> <span class=\"sg\" data-s=\"1\">Ārējs bloks, kas satur vairākus iekšējus blokus, no kuriem katrs darbojas ar tematu <code>$_<\/code>, ir tieši tas, kā raksta <a href=\"https://course.raku.org/lv/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ja jums vienas veselas straumes vietā būtu viens temperatūras rādījums, jūs pēc tā zarotos šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Līdzība ar <code>react<\/code>/<code>whenever<\/code> ir īsta, bet abi dara ļoti dažādus darbus:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> apstrādā vienu vērtību tepat un tagad.** <code>given<\/code> iestata <code>$_<\/code> uz vienu vērtību; katrs <code>when<\/code> to pārbauda (<code>$_ ~~ 18<\/code>), izpildās <strong>pirmā<\/strong> sakritība, un bloks ir beidzies. Tas ir parasts, sinhrons nosacījums.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> apstrādā daudzas vērtības laika gaitā.** <code>whenever<\/code> nesalīdzina <code>$_<\/code> ar paraugu — tas <em>abonē<\/em> supply, un tā ķermenis izpildās <strong>katrai<\/strong> vērtībai, ko šī supply izstaro, kad vien šī vērtība pienāk. Visi <code>whenever<\/code> ir dzīvi vienlaikus, un <code>react<\/code> turpina bloķēt, līdz pabeigta ir katra no to supply.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>when<\/code> jautā: «vai šī viena vērtība atbilst?», kamēr <code>whenever<\/code> saka: «katrai vērtībai, ko šī straume jebkad radīs, dari šo».<\/span> <span class=\"sg\" data-s=\"1\">Tas pats skelets, ļoti dažādi mūži: vienreiz izvēlēts zars pret reakciju, kas atkārtojas atkal un atkal, notikumiem pienākot.<\/span><\/p>"]]},"ru":{"t":"whenever и when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Форма блока <code>react<\/code> может показаться знакомой.<\/span> <span class=\"sg\" data-s=\"1\">Внешний блок, содержащий несколько внутренних, каждый из которых работает с текущим значением <code>$_<\/code>, — ровно так пишется <a href=\"https://course.raku.org/ru/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Если бы у вас было одно показание температуры, а не целый их поток, вы бы разветвлялись по нему так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сходство с <code>react<\/code>/<code>whenever<\/code> не случайно, но задачи у них совершенно разные:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> обрабатывает одно значение прямо сейчас.** <code>given<\/code> устанавливает <code>$_<\/code> в одно значение; каждый <code>when<\/code> проверяет его (<code>$_ ~~ 18<\/code>), выполняется <strong>первое<\/strong> совпадение, и на этом блок закончен. Это обычное синхронное условное ветвление.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> обрабатывает множество значений во времени.** <code>whenever<\/code> не сверяет <code>$_<\/code> с образцом — он <em>подписывается<\/em> на supply, и его тело выполняется для <strong>каждого<\/strong> значения, которое этот supply выдаст, когда бы оно ни пришло. Все <code>whenever<\/code> действуют одновременно, а <code>react<\/code> продолжает блокировать выполнение, пока не закончится каждый из их supply.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>when<\/code> спрашивает: «совпадает ли это одно значение?», а <code>whenever<\/code> говорит: «для каждого значения, которое когда-либо выдаст этот поток, делай вот это».<\/span> <span class=\"sg\" data-s=\"1\">Скелет один и тот же, а жизнь совсем разная: единожды выбранная ветка — и реакция, срабатывающая снова и снова по мере поступления событий.<\/span><\/p>"]]},"uk":{"t":"whenever проти when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Форма блоку <code>react<\/code> може здатися знайомою.<\/span> <span class=\"sg\" data-s=\"1\">Зовнішній блок, що містить кілька внутрішніх блоків, кожен з яких діє на тему <code>$_<\/code>, — це рівно те, як записують <a href=\"https://course.raku.org/uk/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Якби ви мали один-єдиний показ температури замість цілого їх струменя, ви розгалужувалися б на ньому так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Схожість із <code>react<\/code>/<code>whenever<\/code> справжня, але ці двоє роблять зовсім різну роботу:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> обробляє одне значення, просто зараз.** <code>given<\/code> встановлює <code>$_<\/code> в одне значення; кожен <code>when<\/code> перевіряє його (<code>$_ ~~ 18<\/code>), виконується <strong>перший<\/strong> збіг, і блок завершено. Це звичайна синхронна умова.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> обробляє багато значень, у часі.** <code>whenever<\/code> не перевіряє <code>$_<\/code> проти зразка — він <em>підписується<\/em> на потік значень, і його тіло виконується на <strong>кожне<\/strong> значення, яке цей потік видає, коли б те значення не надійшло. Усі <code>whenever<\/code> живі водночас, а <code>react<\/code> і далі блокує виконання, аж поки не завершиться кожен їхній потік.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тож <code>when<\/code> питає «чи збігається це одне значення?», тоді як <code>whenever<\/code> каже «для кожного значення, яке цей струмінь колись видасть, роби це».<\/span> <span class=\"sg\" data-s=\"1\">Той самий кістяк, але зовсім різні життя: гілка, узята один-єдиний раз, проти реакції, що виконується знову й знову, коли надходять події.<\/span><\/p>"]]},"bg":{"t":"whenever срещу when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Формата на блока <code>react<\/code> може да изглежда позната.<\/span> <span class=\"sg\" data-s=\"1\">Външен блок, съдържащ няколко вътрешни блока, всеки от които действа върху темата <code>$_<\/code>, е точно начинът, по който се записва <a href=\"https://course.raku.org/bg/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ако имахте едно-единствено показание за температура вместо цяла струя от такива, бихте разклонили по него така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приликата с <code>react<\/code>/<code>whenever<\/code> е истинска, но двете вършат съвсем различна работа:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> обработва една стойност, точно сега.** <code>given<\/code> задава <code>$_<\/code> на една стойност; всеки <code>when<\/code> я проверява (<code>$_ ~~ 18<\/code>), изпълнява се <strong>първото<\/strong> съвпадение и блокът приключва. Това е обикновено синхронно условие.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> обработва много стойности, във времето.** <code>whenever<\/code> не проверява <code>$_<\/code> срещу образец — той се <em>абонира<\/em> за поток, а тялото му се изпълнява за <strong>всяка<\/strong> стойност, която този поток подаде, когато и да пристигне тя. Всички <code>whenever<\/code> са живи наведнъж, а <code>react<\/code> продължава да блокира, докато всеки от техните потоци не приключи.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значи <code>when<\/code> пита „съвпада ли тази една стойност?“, докато <code>whenever<\/code> казва „за всяка стойност, която тази струя някога произведе, направи това“.<\/span> <span class=\"sg\" data-s=\"1\">Един и същ скелет, съвсем различен живот: клон, поет един-единствен път, срещу реакция, която се изпълнява отново и отново, докато пристигат събития.<\/span><\/p>"]]},"eo":{"t":"whenever kaj when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La formo de bloko <code>react<\/code> povas aspekti konata.<\/span> <span class=\"sg\" data-s=\"1\">Ekstera bloko tenanta plurajn internajn blokojn, ĉiu agante sur la temo <code>$_<\/code>, estas ĝuste tiel, kiel <a href=\"https://course.raku.org/eo/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a> estas skribata.<\/span> <span class=\"sg\" data-s=\"2\">Se vi havus unu solan temperaturan legaĵon anstataŭ tutan fluon da ili, vi branĉus sur ĝi jene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La simileco al <code>react<\/code>/<code>whenever<\/code> estas reala, sed la du faras tre malsamajn laborojn:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> traktas unu valoron, ĝuste nun.** <code>given<\/code> fiksas <code>$_<\/code> al unu sola valoro; ĉiu <code>when<\/code> testas ĝin (<code>$_ ~~ 18<\/code>), la <strong>unua<\/strong> kongruo plenumiĝas, kaj la bloko finiĝas. Ĝi estas ordinara, sinkrona kondiĉo.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> traktas multajn valorojn, en la tempo.** <code>whenever<\/code> ne testas <code>$_<\/code> kontraŭ ŝablono — ĝi <em>abonas<\/em> al supply, kaj ĝia korpo plenumiĝas por <strong>ĉiu<\/strong> valoro, kiun tiu supply eligas, kiam ajn tiu valoro alvenas. Ĉiuj <code>whenever<\/code> estas vivaj samtempe, kaj <code>react<\/code> daŭre blokas, ĝis ĉiu el iliaj supply estas finita.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do <code>when<\/code> demandas «ĉu ĉi tiu unu valoro kongruas?», dum <code>whenever<\/code> diras «por ĉiu valoro, kiun ĉi tiu fluo iam produktas, faru ĉi tion».<\/span> <span class=\"sg\" data-s=\"1\">Sama skeleto, tre malsamaj vivoj: branĉo prenata unu solan fojon, kontraŭ reago, kiu plenumiĝas denove kaj denove laŭ la alveno de eventoj.<\/span><\/p>"]]},"la":{"t":"whenever et when","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Forma bloci <code>react<\/code> nota videri potest.<\/span> <span class=\"sg\" data-s=\"1\">Blocus externus plures blocos internos tenens, unoquoque in themate <code>$_<\/code> agente, est exacte quomodo <a href=\"https://course.raku.org/la/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code>/<code>when<\/code><\/a> scribitur.<\/span> <span class=\"sg\" data-s=\"2\">Si unam lectionem temperaturae pro toto fluxu earum haberes, ita in ea ramificares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $temperature {\n    when 18 { say 'cool' }\n    when 21 { say 'warm' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Similitudo cum <code>react<\/code>/<code>whenever<\/code> vera est, sed duo munera valde diversa agunt:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">**<code>given<\/code>/<code>when<\/code> unum valorem, nunc, tractat.** <code>given<\/code> <code>$_<\/code> ad unum valorem ponit; unumquodque <code>when<\/code> illum probat (<code>$_ ~~ 18<\/code>), <strong>primum<\/strong> congruens currit, et blocus finitus est. Conditionalis ordinaria et synchrona est.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">**<code>react<\/code>/<code>whenever<\/code> multos valores, per tempus, tractat.** <code>whenever<\/code> <code>$_<\/code> contra exemplar non probat — supply <em>se subscribit<\/em>, et corpus eius pro <strong>omni<\/strong> valore quem illud supply emittit currit, quandocumque ille valor advenit. Omnia <code>whenever<\/code> simul viva sunt, et <code>react<\/code> morari pergit donec omne supply eorum perfectum sit.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>when<\/code> rogat «num hic unus valor congruit?», dum <code>whenever<\/code> dicit «pro unoquoque valore quem hic fluxus umquam producit, hoc age».<\/span> <span class=\"sg\" data-s=\"1\">Idem sceletum, vitae valde diversae: ramus semel captus, contra reactionem quae iterum atque iterum currit dum eventus adveniunt.<\/span><\/p>"]]}}}</script>
