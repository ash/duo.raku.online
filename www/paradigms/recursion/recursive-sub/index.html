<script type="application/json" id="page-data">{"u":"paradigms/recursion/recursive-sub","n":1164,"k":"topic","pv":"paradigms/recursion","nx":"paradigms/recursion/recursive-sub/quiz","tr":["paradigms","paradigms/recursion"],"L":{"en":{"t":"A recursive subroutine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>recursive<\/em> subroutine is one that calls itself.<\/span> <span class=\"sg\" data-s=\"1\">The classic example is the factorial: the factorial of <code>n<\/code> is <code>n<\/code> times the factorial of <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Read the body as two cases joined by the ternary operator <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">when <code>$n<\/code> is <code>1<\/code> or less, the answer is simply <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">otherwise, the answer is <code>$n<\/code> times <code>fact($n - 1)<\/code> — the same subroutine called with a smaller number.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each call peels off one factor and asks for a smaller factorial, until the number reaches <code>1<\/code> and the calls unwind: <code>fact(5)<\/code> is <code>5 * fact(4)<\/code>, which is <code>5 * 4 * fact(3)<\/code>, and so on down to <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recursion expresses many problems very directly.<\/span> <span class=\"sg\" data-s=\"1\">Whenever a task can be described in terms of a smaller version of itself, a recursive subroutine is often the most natural way to write it.<\/span><\/p>"]]},"de":{"t":"Eine rekursive Subroutine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>rekursive<\/em> Subroutine ist eine, die sich selbst aufruft.<\/span> <span class=\"sg\" data-s=\"1\">Das klassische Beispiel ist die Fakultät: Die Fakultät von <code>n<\/code> ist <code>n<\/code> mal die Fakultät von <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie den Rumpf als zwei Fälle, verbunden durch den ternären Operator <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Ist <code>$n<\/code> gleich <code>1<\/code> oder kleiner, lautet die Antwort schlicht <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">andernfalls ist die Antwort <code>$n<\/code> mal <code>fact($n - 1)<\/code> — dieselbe Subroutine, mit einer kleineren Zahl aufgerufen.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf schält einen Faktor ab und fragt nach einer kleineren Fakultät, bis die Zahl <code>1<\/code> erreicht und sich die Aufrufe wieder abwickeln: <code>fact(5)<\/code> ist <code>5 * fact(4)<\/code>, was <code>5 * 4 * fact(3)<\/code> ist, und so weiter hinunter bis <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rekursion drückt viele Aufgaben sehr unmittelbar aus.<\/span> <span class=\"sg\" data-s=\"1\">Wann immer sich eine Aufgabe mithilfe einer kleineren Fassung ihrer selbst beschreiben lässt, ist eine rekursive Subroutine oft der natürlichste Weg, sie zu schreiben.<\/span><\/p>"]]},"nl":{"t":"Een recursieve subroutine","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>recursieve<\/em> subroutine is er een die zichzelf aanroept.<\/span> <span class=\"sg\" data-s=\"1\">Het klassieke voorbeeld is de faculteit: de faculteit van <code>n<\/code> is <code>n<\/code> maal de faculteit van <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lees de body als twee gevallen die door de ternaire operator <code>?? !!<\/code> verbonden zijn:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">wanneer <code>$n<\/code> <code>1<\/code> of minder is, is het antwoord eenvoudigweg <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">anders is het antwoord <code>$n<\/code> maal <code>fact($n - 1)<\/code> — dezelfde subroutine aangeroepen met een kleiner getal.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep pelt één factor af en vraagt om een kleinere faculteit, tot het getal <code>1<\/code> bereikt en de aanroepen zich afwikkelen: <code>fact(5)<\/code> is <code>5 * fact(4)<\/code>, wat <code>5 * 4 * fact(3)<\/code> is, en zo verder omlaag tot <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recursie drukt veel problemen heel rechtstreeks uit.<\/span> <span class=\"sg\" data-s=\"1\">Zodra een taak beschreven kan worden in termen van een kleinere versie van zichzelf, is een recursieve subroutine vaak de natuurlijkste manier om haar te schrijven.<\/span><\/p>"]]},"es":{"t":"Una subrutina recursiva","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina <em>recursiva<\/em> es la que se llama a sí misma.<\/span> <span class=\"sg\" data-s=\"1\">El ejemplo clásico es el factorial: el factorial de <code>n<\/code> es <code>n<\/code> por el factorial de <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lee el cuerpo como dos casos unidos por el operador ternario <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">cuando <code>$n<\/code> es <code>1<\/code> o menos, la respuesta es simplemente <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">en caso contrario, la respuesta es <code>$n<\/code> por <code>fact($n - 1)<\/code>, la misma subrutina llamada con un número más pequeño.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada arranca un factor y pide un factorial más pequeño, hasta que el número llega a <code>1<\/code> y las llamadas se desenrollan: <code>fact(5)<\/code> es <code>5 * fact(4)<\/code>, que es <code>5 * 4 * fact(3)<\/code>, y así hasta <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La recursión expresa muchos problemas de forma muy directa.<\/span> <span class=\"sg\" data-s=\"1\">Siempre que una tarea se pueda describir en términos de una versión más pequeña de sí misma, una subrutina recursiva suele ser la manera más natural de escribirla.<\/span><\/p>"]]},"it":{"t":"Una subroutine ricorsiva","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine <em>ricorsiva<\/em> è una che chiama se stessa.<\/span> <span class=\"sg\" data-s=\"1\">L'esempio classico è il fattoriale: il fattoriale di <code>n<\/code> è <code>n<\/code> per il fattoriale di <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Leggi il corpo come due casi uniti dall'operatore ternario <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">quando <code>$n<\/code> è <code>1<\/code> o meno, la risposta è semplicemente <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">altrimenti la risposta è <code>$n<\/code> per <code>fact($n - 1)<\/code> — la stessa subroutine chiamata con un numero più piccolo.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata stacca un fattore e chiede un fattoriale più piccolo, finché il numero raggiunge <code>1<\/code> e le chiamate si srotolano: <code>fact(5)<\/code> è <code>5 * fact(4)<\/code>, che è <code>5 * 4 * fact(3)<\/code>, e così via fino a <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ricorsione esprime molti problemi in modo molto diretto.<\/span> <span class=\"sg\" data-s=\"1\">Ogni volta che un compito si può descrivere in termini di una versione più piccola di se stesso, una subroutine ricorsiva è spesso il modo più naturale di scriverlo.<\/span><\/p>"]]},"lv":{"t":"Rekursīva apakšprogramma","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Rekursīva<\/em> apakšprogramma ir tāda, kas izsauc pati sevi.<\/span> <span class=\"sg\" data-s=\"1\">Klasiskais piemērs ir faktoriāls: skaitļa <code>n<\/code> faktoriāls ir <code>n<\/code> reiz <code>n - 1<\/code> faktoriāls.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lasiet ķermeni kā divus gadījumus, ko savieno trejdaļīgais operators <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">kad <code>$n<\/code> ir <code>1<\/code> vai mazāk, atbilde ir vienkārši <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">citādi atbilde ir <code>$n<\/code> reiz <code>fact($n - 1)<\/code> — tā pati apakšprogramma, izsaukta ar mazāku skaitli.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums nolobī vienu reizinātāju un pieprasa mazāku faktoriālu, līdz skaitlis sasniedz <code>1<\/code> un izsaukumi attinas: <code>fact(5)<\/code> ir <code>5 * fact(4)<\/code>, kas ir <code>5 * 4 * fact(3)<\/code>, un tā tālāk lejup līdz <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rekursija ļoti tieši izsaka daudzus uzdevumus.<\/span> <span class=\"sg\" data-s=\"1\">Ikreiz, kad uzdevumu var aprakstīt ar mazāku tā paša uzdevuma versiju, rekursīva apakšprogramma bieži ir dabiskākais veids, kā to uzrakstīt.<\/span><\/p>"]]},"ru":{"t":"Рекурсивная подпрограмма","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Рекурсивная<\/em> подпрограмма — это та, которая вызывает саму себя.<\/span> <span class=\"sg\" data-s=\"1\">Классический пример — факториал: факториал <code>n<\/code> равен <code>n<\/code>, умноженному на факториал <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прочитайте тело как два случая, соединённых тернарным оператором <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">когда <code>$n<\/code> равно <code>1<\/code> или меньше, ответ — просто <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">иначе ответ — это <code>$n<\/code>, умноженное на <code>fact($n - 1)<\/code>, то есть на ту же подпрограмму, вызванную с меньшим числом.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов отслаивает один множитель и запрашивает меньший факториал, пока число не дойдёт до <code>1<\/code>, после чего вызовы разворачиваются обратно: <code>fact(5)<\/code> — это <code>5 * fact(4)<\/code>, что есть <code>5 * 4 * fact(3)<\/code> и так далее вниз до <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рекурсия выражает многие задачи очень прямо.<\/span> <span class=\"sg\" data-s=\"1\">Всякий раз, когда задачу можно описать через её меньший вариант, рекурсивная подпрограмма часто оказывается самым естественным способом её записать.<\/span><\/p>"]]},"uk":{"t":"Рекурсивна підпрограма","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Рекурсивна<\/em> підпрограма — це така, що викликає саму себе.<\/span> <span class=\"sg\" data-s=\"1\">Класичний приклад — факторіал: факторіал <code>n<\/code> дорівнює <code>n<\/code>, помноженому на факторіал <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Читайте тіло як два випадки, з'єднані тернарним оператором <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">коли <code>$n<\/code> дорівнює <code>1<\/code> або менше, відповідь — просто <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">інакше відповідь — це <code>$n<\/code>, помножене на <code>fact($n - 1)<\/code>, тобто ту саму підпрограму, викликану з меншим числом.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик відлущує один множник і просить менший факторіал, аж поки число не досягне <code>1<\/code> і виклики не почнуть розкручуватися назад: <code>fact(5)<\/code> — це <code>5 * fact(4)<\/code>, тобто <code>5 * 4 * fact(3)<\/code>, і так далі аж до <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рекурсія виражає багато задач дуже безпосередньо.<\/span> <span class=\"sg\" data-s=\"1\">Щоразу, коли задачу можна описати через її ж менший варіант, рекурсивна підпрограма часто є найприроднішим способом її записати.<\/span><\/p>"]]},"bg":{"t":"Рекурсивна подпрограма","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Рекурсивна<\/em> е подпрограмата, която извиква сама себе си.<\/span> <span class=\"sg\" data-s=\"1\">Класическият пример е факториелът: факториелът на <code>n<\/code> е <code>n<\/code>, умножено по факториела на <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прочетете тялото като два случая, свързани с тернарния оператор <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">когато <code>$n<\/code> е <code>1<\/code> или по-малко, отговорът е просто <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">иначе отговорът е <code>$n<\/code>, умножено по <code>fact($n - 1)<\/code> — същата подпрограма, извикана с по-малко число.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване обелва по един множител и иска по-малък факториел, докато числото стигне <code>1<\/code> и извикванията се развият обратно: <code>fact(5)<\/code> е <code>5 * fact(4)<\/code>, което е <code>5 * 4 * fact(3)<\/code>, и така надолу до <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рекурсията изразява много задачи съвсем пряко.<\/span> <span class=\"sg\" data-s=\"1\">Винаги когато една задача може да бъде описана чрез по-малък свой вариант, рекурсивната подпрограма често е най-естественият начин да я напишете.<\/span><\/p>"]]},"eo":{"t":"Rekursia subprogramo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Rekursia<\/em> subprogramo estas tia, kiu vokas sin mem.<\/span> <span class=\"sg\" data-s=\"1\">La klasika ekzemplo estas la faktorialo: la faktorialo de <code>n<\/code> estas <code>n<\/code> foje la faktorialo de <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Legu la korpon kiel du kazojn kunigitajn per la ternara operatoro <code>?? !!<\/code>:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">kiam <code>$n<\/code> estas <code>1<\/code> aŭ malpli, la respondo estas simple <code>1<\/code>;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">alie, la respondo estas <code>$n<\/code> foje <code>fact($n - 1)<\/code> — la sama subprogramo vokita kun pli malgranda nombro.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko deprenas unu faktoron kaj petas pli malgrandan faktorialon, ĝis la nombro atingas <code>1<\/code> kaj la vokoj malvolviĝas: <code>fact(5)<\/code> estas <code>5 * fact(4)<\/code>, kio estas <code>5 * 4 * fact(3)<\/code>, kaj tiel plu ĝis <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rekursio esprimas multajn problemojn tre rekte.<\/span> <span class=\"sg\" data-s=\"1\">Kiam ajn tasko povas esti priskribita per pli malgranda versio de si mem, rekursia subprogramo estas ofte la plej natura maniero skribi ĝin.<\/span><\/p>"]]},"la":{"t":"Subprogramma recursivum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <em>recursivum<\/em> est id quod se ipsum vocat.<\/span> <span class=\"sg\" data-s=\"1\">Exemplum classicum est factorialis: factorialis numeri <code>n<\/code> est <code>n<\/code> per factorialem numeri <code>n - 1<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub fact($n) {\n    $n &lt;= 1 ?? 1 !! $n * fact($n - 1);\n}\n\nsay fact(5); # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lege corpus ut duos casus operatore ternario <code>?? !!<\/code> iunctos:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">cum <code>$n<\/code> est <code>1<\/code> vel minus, responsum simpliciter <code>1<\/code> est;<\/span><\/li><li><span class=\"sg\" data-s=\"1\">aliter responsum est <code>$n<\/code> per <code>fact($n - 1)<\/code> — idem subprogramma cum numero minore vocatum.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unaquaeque vocatio unum factorem detrahit et factorialem minorem petit, donec numerus ad <code>1<\/code> perveniat et vocationes se explicent: <code>fact(5)<\/code> est <code>5 * fact(4)<\/code>, quod est <code>5 * 4 * fact(3)<\/code>, et sic deorsum ad <code>1<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recursio multa problemata directissime exprimit.<\/span> <span class=\"sg\" data-s=\"1\">Quotiens munus per minorem versionem sui ipsius describi potest, subprogramma recursivum saepe est modus naturalissimus illud scribendi.<\/span><\/p>"]]}}}</script>
