<script type="application/json" id="page-data">{"u":"paradigms/recursion","n":1163,"k":"section","pv":"paradigms","nx":"paradigms/recursion/recursive-sub","tr":["paradigms"],"L":{"en":{"t":"Recursion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">This part of the course steps beyond the everyday and looks at three powerful styles of programming that Raku supports especially well — <em>functional<\/em>, <em>concurrent<\/em>, and <em>reactive<\/em> — and then puts them to work building web services.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">We begin with functional programming — a style built around subroutines that take and return other subroutines, values that are computed only when needed, and expressions rather than step-by-step statements.<\/span> <span class=\"sg\" data-s=\"1\">The first idea is <em>recursion<\/em>: a subroutine that calls itself.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A recursive subroutine solves a problem by reducing it to a smaller version of the same problem, until the problem becomes small enough to answer directly.<\/span> <span class=\"sg\" data-s=\"1\">Counting down, walking a tree, computing a factorial — all are naturally recursive.<\/span> <span class=\"sg\" data-s=\"2\">This section shows how to write a recursive subroutine and, just as importantly, how to stop it.<\/span><\/p>"]]},"de":{"t":"Rekursion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Teil des Kurses geht über das Alltägliche hinaus und betrachtet drei mächtige Programmierstile, die Raku besonders gut unterstützt — den <em>funktionalen<\/em>, den <em>nebenläufigen<\/em> und den <em>reaktiven<\/em> — und setzt sie dann ein, um Webdienste zu bauen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wir beginnen mit der funktionalen Programmierung — einem Stil, der um Subroutinen herum aufgebaut ist, die andere Subroutinen aufnehmen und zurückgeben, um Werte, die erst berechnet werden, wenn man sie braucht, und um Ausdrücke statt schrittweiser Anweisungen.<\/span> <span class=\"sg\" data-s=\"1\">Der erste Gedanke ist die <em>Rekursion<\/em>: eine Subroutine, die sich selbst aufruft.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine rekursive Subroutine löst ein Problem, indem sie es auf eine kleinere Fassung desselben Problems zurückführt, bis das Problem klein genug ist, um es unmittelbar zu beantworten.<\/span> <span class=\"sg\" data-s=\"1\">Herunterzählen, durch einen Baum gehen, eine Fakultät berechnen — all das ist von Natur aus rekursiv.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt zeigt, wie man eine rekursive Subroutine schreibt und, ebenso wichtig, wie man sie anhält.<\/span><\/p>"]]},"nl":{"t":"Recursie","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit deel van de cursus stapt voorbij het alledaagse en bekijkt drie krachtige programmeerstijlen die Raku bijzonder goed ondersteunt — <em>functioneel<\/em>, <em>concurrent<\/em> en <em>reactief<\/em> — en zet die daarna aan het werk om webservices te bouwen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">We beginnen met functioneel programmeren — een stijl die is opgebouwd rond subroutines die andere subroutines aannemen en teruggeven, waarden die pas berekend worden wanneer ze nodig zijn, en uitdrukkingen in plaats van stap-voor-stap-opdrachten.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste idee is <em>recursie<\/em>: een subroutine die zichzelf aanroept.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een recursieve subroutine lost een probleem op door het tot een kleinere versie van hetzelfde probleem terug te brengen, tot het probleem klein genoeg is om rechtstreeks te beantwoorden.<\/span> <span class=\"sg\" data-s=\"1\">Aftellen, door een boom lopen, een faculteit berekenen — het is allemaal van nature recursief.<\/span> <span class=\"sg\" data-s=\"2\">Deze sectie laat zien hoe je een recursieve subroutine schrijft en, even belangrijk, hoe je haar stopt.<\/span><\/p>"]]},"es":{"t":"Recursión","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta parte del curso va más allá de lo cotidiano y examina tres estilos potentes de programación que Raku admite especialmente bien — el <em>funcional<\/em>, el <em>concurrente<\/em> y el <em>reactivo<\/em> — para después ponerlos a trabajar construyendo servicios web.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Empezamos por la programación funcional: un estilo construido en torno a subrutinas que reciben y devuelven otras subrutinas, valores que se calculan solo cuando hacen falta y expresiones en lugar de instrucciones paso a paso.<\/span> <span class=\"sg\" data-s=\"1\">La primera idea es la <em>recursión<\/em>: una subrutina que se llama a sí misma.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una subrutina recursiva resuelve un problema reduciéndolo a una versión más pequeña del mismo problema, hasta que el problema se vuelve lo bastante pequeño como para responderlo directamente.<\/span> <span class=\"sg\" data-s=\"1\">Contar hacia atrás, recorrer un árbol, calcular un factorial: todos son naturalmente recursivos.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección muestra cómo escribir una subrutina recursiva y, no menos importante, cómo detenerla.<\/span><\/p>"]]},"it":{"t":"Ricorsione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa parte del corso va oltre la quotidianità e guarda tre stili potenti di programmazione che Raku sostiene particolarmente bene — <em>funzionale<\/em>, <em>concorrente<\/em> e <em>reattivo<\/em> — per poi metterli al lavoro nella costruzione di servizi web.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cominciamo con la programmazione funzionale: uno stile costruito attorno a subroutine che prendono e restituiscono altre subroutine, valori calcolati solo quando servono ed espressioni invece che istruzioni passo passo.<\/span> <span class=\"sg\" data-s=\"1\">La prima idea è la <em>ricorsione<\/em>: una subroutine che chiama se stessa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una subroutine ricorsiva risolve un problema riducendolo a una versione più piccola dello stesso problema, finché il problema non diventa abbastanza piccolo da rispondere direttamente.<\/span> <span class=\"sg\" data-s=\"1\">Contare alla rovescia, percorrere un albero, calcolare un fattoriale: tutti sono naturalmente ricorsivi.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione mostra come scrivere una subroutine ricorsiva e, cosa altrettanto importante, come fermarla.<\/span><\/p>"]]},"ru":{"t":"Рекурсия","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта часть курса выходит за пределы повседневного и рассматривает три мощных стиля программирования, которые Raku поддерживает особенно хорошо, — <em>функциональный<\/em>, <em>конкурентный<\/em> и <em>реактивный<\/em>, — а затем применяет их к созданию веб-сервисов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Начинаем с функционального программирования — стиля, построенного вокруг подпрограмм, которые принимают и возвращают другие подпрограммы, вокруг значений, вычисляемых только при необходимости, и вокруг выражений, а не пошаговых инструкций.<\/span> <span class=\"sg\" data-s=\"1\">Первая идея — <em>рекурсия<\/em>: подпрограмма, вызывающая саму себя.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Рекурсивная подпрограмма решает задачу, сводя её к меньшему варианту той же задачи, пока задача не станет достаточно маленькой, чтобы ответить на неё прямо.<\/span> <span class=\"sg\" data-s=\"1\">Обратный отсчёт, обход дерева, вычисление факториала — всё это естественно рекурсивно.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе показано, как написать рекурсивную подпрограмму и, что не менее важно, как её остановить.<\/span><\/p>"]]},"uk":{"t":"Рекурсія","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця частина курсу виходить за межі повсякденного й розглядає три потужні стилі програмування, які Raku підтримує особливо добре, — <em>функційний<\/em>, <em>конкурентний<\/em> та <em>реактивний<\/em>, — а потім пускає їх у справу для побудови вебсервісів.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Починаємо з функційного програмування — стилю, збудованого навколо підпрограм, що приймають і повертають інші підпрограми, значень, які обчислюються лише за потреби, та виразів замість покрокових інструкцій.<\/span> <span class=\"sg\" data-s=\"1\">Перша ідея — <em>рекурсія<\/em>: підпрограма, що викликає саму себе.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Рекурсивна підпрограма розв'язує задачу, зводячи її до меншого варіанту тієї самої задачі, аж поки задача не стане достатньо малою, щоб відповісти на неї безпосередньо.<\/span> <span class=\"sg\" data-s=\"1\">Зворотний відлік, обхід дерева, обчислення факторіала — усе це природно рекурсивне.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ показує, як написати рекурсивну підпрограму і, що не менш важливо, як її зупинити.<\/span><\/p>"]]},"bg":{"t":"Рекурсия","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази част от курса излиза отвъд ежедневното и разглежда три мощни стила на програмиране, които Raku поддържа особено добре — <em>функционален<\/em>, <em>паралелен<\/em> и <em>реактивен<\/em>, — а после ги впряга в изграждането на уеб услуги.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Започваме с функционалното програмиране — стил, изграден около подпрограми, които приемат и връщат други подпрограми, стойности, изчислявани само при нужда, и изрази вместо стъпка по стъпка инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Първата идея е <em>рекурсията<\/em>: подпрограма, която извиква сама себе си.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Рекурсивната подпрограма решава задача, като я свежда до по-малък вариант на същата задача, докато задачата стане достатъчно малка, за да се отговори направо.<\/span> <span class=\"sg\" data-s=\"1\">Обратно броене, обхождане на дърво, изчисляване на факториел — всичко това е естествено рекурсивно.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел показва как се пише рекурсивна подпрограма и, не по-малко важно, как да я спрете.<\/span><\/p>"]]}}}</script>
