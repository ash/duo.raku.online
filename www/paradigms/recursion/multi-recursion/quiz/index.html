<script type="application/json" id="page-data">{"u":"paradigms/recursion/multi-recursion/quiz","n":1169,"k":"quiz","pv":"paradigms/recursion/multi-recursion","nx":"paradigms/recursion/exercises","tr":["paradigms","paradigms/recursion","paradigms/recursion/multi-recursion"],"L":{"en":{"t":"Quiz — Recursion with multi subs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Given <code>multi fact(0) { 1 }<\/code> and <code>multi fact($n) { $n * fact($n - 1) }<\/code>, what role does the <code>multi fact(0)<\/code> candidate play?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">It is the base case — the candidate dispatch chooses when the argument is <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">It sets a default value returned for every argument<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">It runs first on every call, before the other candidate<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">It is required syntax that Raku ignores at run time<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The literal <code>0<\/code> in the signature makes that candidate match only when the argument is exactly <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is the base case expressed as its own subroutine: while the argument is larger, dispatch keeps choosing <code>multi fact($n)<\/code>, and once the recursion reaches <code>0<\/code>, it switches to <code>multi fact(0)<\/code> and stops.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Rekursion mit multi-Subs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welche Rolle spielt der Kandidat <code>multi fact(0)<\/code>, gegeben <code>multi fact(0) { 1 }<\/code> und <code>multi fact($n) { $n * fact($n - 1) }<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Er ist der Grundfall — der Kandidat, den die Auswahl wählt, wenn das Argument <code>0<\/code> ist<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Er setzt einen Standardwert, der für jedes Argument geliefert wird<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Er läuft bei jedem Aufruf zuerst, vor dem anderen Kandidaten<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Er ist vorgeschriebene Syntax, die Raku zur Laufzeit übergeht<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Literal <code>0<\/code> in der Signatur lässt diesen Kandidaten nur treffen, wenn das Argument genau <code>0<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Es ist der Grundfall, ausgedrückt als eigene Subroutine: Solange das Argument größer ist, wählt die Auswahl weiterhin <code>multi fact($n)<\/code>, und sobald die Rekursion <code>0<\/code> erreicht, wechselt sie zu <code>multi fact(0)<\/code> und hält an.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Recursie met multi-subs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Gegeven <code>multi fact(0) { 1 }<\/code> en <code>multi fact($n) { $n * fact($n - 1) }<\/code>, welke rol speelt de kandidaat <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Het is het basisgeval — de kandidaat die de dispatch kiest wanneer het argument <code>0<\/code> is<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Hij stelt een standaardwaarde in die voor elk argument teruggegeven wordt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Hij draait bij elke aanroep als eerste, vóór de andere kandidaat<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Het is verplichte syntaxis die Raku tijdens het draaien negeert<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De literal <code>0<\/code> in de signatuur laat die kandidaat alleen matchen wanneer het argument precies <code>0<\/code> is.<\/span> <span class=\"sg\" data-s=\"1\">Het is het basisgeval uitgedrukt als een eigen subroutine: zolang het argument groter is, blijft de dispatch <code>multi fact($n)<\/code> kiezen, en zodra de recursie <code>0<\/code> bereikt schakelt ze naar <code>multi fact(0)<\/code> en stopt ze.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Recursión con subrutinas multi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dados <code>multi fact(0) { 1 }<\/code> y <code>multi fact($n) { $n * fact($n - 1) }<\/code>, ¿qué papel juega el candidato <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Es el caso base: el candidato que el despacho elige cuando el argumento es <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Fija un valor por defecto que se devuelve para todo argumento<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Se ejecuta el primero en cada llamada, antes que el otro candidato<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Es sintaxis obligatoria que Raku ignora en tiempo de ejecución<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El literal <code>0<\/code> de la firma hace que ese candidato coincida solo cuando el argumento es exactamente <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es el caso base expresado como subrutina propia: mientras el argumento sea mayor, el despacho sigue eligiendo <code>multi fact($n)<\/code>, y en cuanto la recursión llega a <code>0<\/code> cambia a <code>multi fact(0)<\/code> y se detiene.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Ricorsione con subroutine multi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dati <code>multi fact(0) { 1 }<\/code> e <code>multi fact($n) { $n * fact($n - 1) }<\/code>, quale ruolo gioca il candidato <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">È il caso base — il candidato che la distribuzione sceglie quando l'argomento è <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Imposta un valore predefinito restituito per ogni argomento<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Gira per primo a ogni chiamata, prima dell'altro candidato<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">È sintassi obbligatoria che Raku ignora a runtime<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il letterale <code>0<\/code> nella firma fa corrispondere quel candidato solo quando l'argomento è esattamente <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È il caso base espresso come subroutine a sé: finché l'argomento è più grande, la distribuzione continua a scegliere <code>multi fact($n)<\/code>, e una volta che la ricorsione raggiunge <code>0<\/code> passa a <code>multi fact(0)<\/code> e si ferma.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Rekursija ar multi apakšprogrammām","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Doti <code>multi fact(0) { 1 }<\/code> un <code>multi fact($n) { $n * fact($n - 1) }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kāda loma ir kandidātam <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Tas ir bāzes gadījums — kandidāts, ko despečs izvēlas, kad arguments ir <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Tas uzstāda noklusēto vērtību, kas tiek atgriezta katram argumentam<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Tas izpildās pirmais katrā izsaukumā, pirms otrā kandidāta<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Tā ir obligāta sintakse, ko Raku izpildes laikā ignorē<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Literālis <code>0<\/code> parakstā liek šim kandidātam sakrist tikai tad, kad arguments ir tieši <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir bāzes gadījums, izteikts kā sava apakšprogramma: kamēr arguments ir lielāks, despečs turpina izvēlēties <code>multi fact($n)<\/code>, un, tiklīdz rekursija sasniedz <code>0<\/code>, tas pārslēdzas uz <code>multi fact(0)<\/code> un apstājas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Рекурсия с multi-подпрограммами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Даны <code>multi fact(0) { 1 }<\/code> и <code>multi fact($n) { $n * fact($n - 1) }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Какую роль играет кандидат <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Это базовый случай — кандидат, который диспетчеризация выбирает, когда аргумент равен <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Он задаёт значение по умолчанию, возвращаемое для любого аргумента<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Он выполняется первым при каждом вызове, до другого кандидата<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Это обязательный синтаксис, который Raku игнорирует во время выполнения<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Литерал <code>0<\/code> в сигнатуре делает так, что этот кандидат срабатывает, только когда аргумент в точности равен <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это базовый случай, выраженный собственной подпрограммой: пока аргумент больше, диспетчеризация продолжает выбирать <code>multi fact($n)<\/code>, а как только рекурсия доходит до <code>0<\/code>, она переключается на <code>multi fact(0)<\/code> и останавливается.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Рекурсія з multi-підпрограмами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Маємо <code>multi fact(0) { 1 }<\/code> та <code>multi fact($n) { $n * fact($n - 1) }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Яку роль відіграє кандидат <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Це базовий випадок — кандидат, якого диспетчеризація обирає, коли аргумент дорівнює <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Він задає типове значення, що повертається для будь-якого аргументу<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Він виконується першим на кожному виклику, перед іншим кандидатом<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Це обов'язковий синтаксис, який Raku ігнорує під час виконання<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Літерал <code>0<\/code> у сигнатурі робить так, що цей кандидат підходить лише тоді, коли аргумент дорівнює точно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це базовий випадок, виражений власною підпрограмою: поки аргумент більший, диспетчеризація й далі обирає <code>multi fact($n)<\/code>, а щойно рекурсія досягає <code>0<\/code>, вона перемикається на <code>multi fact(0)<\/code> і зупиняється.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Рекурсия с multi-подпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имаме <code>multi fact(0) { 1 }<\/code> и <code>multi fact($n) { $n * fact($n - 1) }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каква роля играе кандидатът <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Той е базовият случай — кандидатът, който диспечирането избира, когато аргументът е <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Задава стойност по подразбиране, връщана за всеки аргумент<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Изпълнява се пръв при всяко извикване, преди другия кандидат<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Задължителен синтаксис е, който Raku пренебрегва по време на изпълнение<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Литералът <code>0<\/code> в сигнатурата прави така, че този кандидат да съвпада само когато аргументът е точно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е базовият случай, изразен като собствена подпрограма: докато аргументът е по-голям, диспечирането продължава да избира <code>multi fact($n)<\/code>, а щом рекурсията стигне <code>0<\/code>, то се превключва към <code>multi fact(0)<\/code> и спира.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Rekursio per multi-subprogramoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Donite <code>multi fact(0) { 1 }<\/code> kaj <code>multi fact($n) { $n * fact($n - 1) }<\/code>, kian rolon ludas la kandidato <code>multi fact(0)<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Ĝi estas la baza kazo — la kandidato, kiun la disdono elektas, kiam la argumento estas <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Ĝi starigas defaŭltan valoron redonatan por ĉiu argumento<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Ĝi ruliĝas unue ĉe ĉiu voko, antaŭ la alia kandidato<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Ĝi estas postulata sintakso, kiun Raku ignoras je rultempo<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La literalo <code>0<\/code> en la subskribo igas tiun kandidaton kongrui nur, kiam la argumento estas ekzakte <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la baza kazo esprimita kiel propra subprogramo: dum la argumento estas pli granda, la disdono daŭre elektas <code>multi fact($n)<\/code>, kaj post kiam la rekursio atingas <code>0<\/code>, ĝi ŝanĝiĝas al <code>multi fact(0)<\/code> kaj haltas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Recursio cum subprogrammatibus multi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Datis <code>multi fact(0) { 1 }<\/code> et <code>multi fact($n) { $n * fact($n - 1) }<\/code>, quam partem candidatus <code>multi fact(0)<\/code> agit?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Est casus fundamentalis — candidatus quem missio eligit cum argumentum est <code>0<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Valorem praedefinitum ponit qui pro omni argumento redditur<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">In omni vocatione primus currit, ante alterum candidatum<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Est syntaxis necessaria quam Raku tempore exsecutionis neglegit<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Litterale <code>0<\/code> in signatura illum candidatum solum tunc congruere facit cum argumentum exacte <code>0<\/code> est.<\/span> <span class=\"sg\" data-s=\"1\">Est casus fundamentalis ut proprium subprogramma expressus: dum argumentum maius est, missio <code>multi fact($n)<\/code> eligere pergit, et cum recursio ad <code>0<\/code> pervenit, ad <code>multi fact(0)<\/code> transit et consistit.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
