<script type="application/json" id="page-data">{"u":"paradigms/recursion/multi-recursion","n":1168,"k":"topic","pv":"paradigms/recursion/base-case/quiz","nx":"paradigms/recursion/multi-recursion/quiz","tr":["paradigms","paradigms/recursion"],"L":{"en":{"t":"Recursion with multi subs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">So far the base case has been a line <em>inside<\/em> the subroutine — a ternary or an early <code>return<\/code> that checks the argument.<\/span> <span class=\"sg\" data-s=\"1\">Raku offers a more expressive way to write the same thing.<\/span> <span class=\"sg\" data-s=\"2\">Because a subroutine can have several <code>multi<\/code> candidates, you can give the base case and the recursive step <strong>their own separate subroutines<\/strong>, and let multiple dispatch pick the right one for each call.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recall the factorial.<\/span> <span class=\"sg\" data-s=\"1\">With <code>multi<\/code>, its two cases become two subroutines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The first candidate matches only when the argument is exactly <code>0<\/code> — that literal in the signature <em>is<\/em> the base case.<\/span> <span class=\"sg\" data-s=\"1\">Every other call goes to the second candidate, which multiplies and recurses.<\/span> <span class=\"sg\" data-s=\"2\">When <code>fact($n - 1)<\/code> finally reaches <code>0<\/code>, dispatch switches to the first candidate, and the chain of calls unwinds.<\/span> <span class=\"sg\" data-s=\"3\">The base case is no longer a branch buried in the body; it is a subroutine that exists for a single value.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Why <code>0<\/code> and not <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Because every step subtracts one, any starting number eventually lands exactly on <code>0<\/code>, and <code>0!<\/code> is defined as <code>1<\/code> — so <code>0<\/code> is where the descent truly ends.<\/span> <span class=\"sg\" data-s=\"2\">A literal candidate matches one <em>exact<\/em> value, so a base of <code>multi fact(1)<\/code> would compute <code>fact(1)<\/code> correctly but leave <code>fact(0)<\/code> to fall through to <code>multi fact($n)<\/code> and recurse past zero forever.<\/span> <span class=\"sg\" data-s=\"3\">Stopping at <code>0<\/code> keeps the subroutine correct for every non-negative whole number, <code>fact(0)<\/code> included.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This reads especially well when there is more than one base case.<\/span> <span class=\"sg\" data-s=\"1\">Fibonacci needs two:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each base case is its own one-line candidate, and the recursive candidate handles everything else — no nested conditionals.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A literal such as <code>0<\/code> matches only that exact value.<\/span> <span class=\"sg\" data-s=\"1\">When the base case covers a <em>range<\/em> — “<code>$n<\/code> is <code>1<\/code> or less” — use a <code>where<\/code> constraint instead:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The constrained candidate is more specific, so Raku tries it first; the plain <code>$n<\/code> candidate catches everything else.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The same discipline as before still applies: every recursive path must reach a base-case candidate.<\/span> <span class=\"sg\" data-s=\"1\">The literal-<code>0<\/code> factorial, for instance, is only safe for non-negative whole numbers — <code>fact(-1)<\/code> would step past <code>0<\/code> and recurse forever, because no candidate ever matches.<\/span> <span class=\"sg\" data-s=\"2\">Splitting the cases across <code>multi<\/code> subs does not remove the need for a base case; it just gives that base case a name and a home of its own.<\/span><\/p>"]]},"de":{"t":"Rekursion mit multi-Subs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bisher war der Grundfall eine Zeile <em>innerhalb<\/em> der Subroutine — ein ternärer Ausdruck oder ein frühes <code>return<\/code>, das das Argument prüft.<\/span> <span class=\"sg\" data-s=\"1\">Raku bietet einen ausdrucksstärkeren Weg, dasselbe zu schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Da eine Subroutine mehrere <code>multi<\/code>-Kandidaten haben kann, können Sie dem Grundfall und dem rekursiven Schritt <strong>je eine eigene Subroutine<\/strong> geben und die Mehrfachauswahl für jeden Aufruf die richtige wählen lassen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Erinnern Sie sich an die Fakultät.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>multi<\/code> werden ihre zwei Fälle zu zwei Subroutinen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der erste Kandidat trifft nur, wenn das Argument genau <code>0<\/code> ist — dieses Literal in der Signatur <em>ist<\/em> der Grundfall.<\/span> <span class=\"sg\" data-s=\"1\">Jeder andere Aufruf geht an den zweiten Kandidaten, der multipliziert und sich selbst aufruft.<\/span> <span class=\"sg\" data-s=\"2\">Wenn <code>fact($n - 1)<\/code> schließlich <code>0<\/code> erreicht, wechselt die Auswahl zum ersten Kandidaten, und die Kette der Aufrufe wickelt sich ab.<\/span> <span class=\"sg\" data-s=\"3\">Der Grundfall ist keine im Rumpf vergrabene Verzweigung mehr; er ist eine Subroutine, die für einen einzigen Wert besteht.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Warum <code>0<\/code> und nicht <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Weil jeder Schritt eins abzieht, landet jede Ausgangszahl irgendwann genau auf <code>0<\/code>, und <code>0!<\/code> ist als <code>1<\/code> festgelegt — bei <code>0<\/code> endet der Abstieg also wirklich.<\/span> <span class=\"sg\" data-s=\"2\">Ein Literal-Kandidat trifft genau <em>einen<\/em> Wert, ein Grundfall <code>multi fact(1)<\/code> würde <code>fact(1)<\/code> also richtig berechnen, aber <code>fact(0)<\/code> zu <code>multi fact($n)<\/code> durchfallen lassen und ewig über null hinaus weiterrekursieren.<\/span> <span class=\"sg\" data-s=\"3\">Bei <code>0<\/code> anzuhalten hält die Subroutine für jede nichtnegative ganze Zahl richtig, <code>fact(0)<\/code> eingeschlossen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Besonders gut liest sich das, wenn es mehr als einen Grundfall gibt.<\/span> <span class=\"sg\" data-s=\"1\">Fibonacci braucht zwei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Grundfall ist ein eigener einzeiliger Kandidat, und der rekursive Kandidat erledigt alles Übrige — ganz ohne verschachtelte Bedingungen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Literal wie <code>0<\/code> trifft nur genau diesen Wert.<\/span> <span class=\"sg\" data-s=\"1\">Deckt der Grundfall einen <em>Bereich<\/em> ab — „<code>$n<\/code> ist <code>1<\/code> oder kleiner“ —, nehmen Sie stattdessen eine <code>where<\/code>-Einschränkung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der eingeschränkte Kandidat ist spezifischer, Raku probiert ihn also zuerst; der schlichte <code>$n<\/code>-Kandidat fängt alles Übrige auf.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieselbe Sorgfalt wie zuvor gilt weiterhin: Jeder rekursive Weg muss einen Grundfall-Kandidaten erreichen.<\/span> <span class=\"sg\" data-s=\"1\">Die Fakultät mit dem Literal <code>0<\/code> ist etwa nur für nichtnegative ganze Zahlen sicher — <code>fact(-1)<\/code> würde über <code>0<\/code> hinausschreiten und ewig weiterrekursieren, weil nie ein Kandidat trifft.<\/span> <span class=\"sg\" data-s=\"2\">Die Fälle auf <code>multi<\/code>-Subs zu verteilen nimmt die Notwendigkeit eines Grundfalls nicht weg; es gibt diesem Grundfall nur einen eigenen Namen und ein eigenes Zuhause.<\/span><\/p>"]]},"nl":{"t":"Recursie met multi-subs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe was het basisgeval een regel <em>binnen<\/em> de subroutine — een ternaire uitdrukking of een vroege <code>return<\/code> die het argument controleert.<\/span> <span class=\"sg\" data-s=\"1\">Raku biedt een expressievere manier om hetzelfde te schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Omdat een subroutine meerdere <code>multi<\/code>-kandidaten kan hebben, kun je het basisgeval en de recursieve stap <strong>elk hun eigen subroutine<\/strong> geven en meervoudige dispatch voor elke aanroep de juiste laten kiezen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Denk terug aan de faculteit.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>multi<\/code> worden haar twee gevallen twee subroutines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De eerste kandidaat matcht alleen wanneer het argument precies <code>0<\/code> is — die literal in de signatuur <em>is<\/em> het basisgeval.<\/span> <span class=\"sg\" data-s=\"1\">Elke andere aanroep gaat naar de tweede kandidaat, die vermenigvuldigt en recursief aanroept.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer <code>fact($n - 1)<\/code> eindelijk <code>0<\/code> bereikt, schakelt de dispatch naar de eerste kandidaat en wikkelt de keten van aanroepen zich af.<\/span> <span class=\"sg\" data-s=\"3\">Het basisgeval is niet langer een tak die diep in de body verstopt zit; het is een subroutine die voor één enkele waarde bestaat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Waarom <code>0<\/code> en niet <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Omdat elke stap er één aftrekt, komt elk beginnend getal uiteindelijk precies op <code>0<\/code> uit, en <code>0!<\/code> is gedefinieerd als <code>1<\/code> — dus <code>0<\/code> is waar de afdaling werkelijk eindigt.<\/span> <span class=\"sg\" data-s=\"2\">Een literalkandidaat matcht één <em>exacte<\/em> waarde, dus een basis <code>multi fact(1)<\/code> zou <code>fact(1)<\/code> correct berekenen maar <code>fact(0)<\/code> naar <code>multi fact($n)<\/code> laten doorvallen en eeuwig voorbij nul recursief blijven aanroepen.<\/span> <span class=\"sg\" data-s=\"3\">Bij <code>0<\/code> stoppen houdt de subroutine correct voor elk niet-negatief geheel getal, <code>fact(0)<\/code> inbegrepen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit leest bijzonder goed wanneer er meer dan één basisgeval is.<\/span> <span class=\"sg\" data-s=\"1\">Fibonacci heeft er twee nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elk basisgeval is een eigen kandidaat van één regel, en de recursieve kandidaat handelt al het overige af — geen geneste voorwaarden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een literal als <code>0<\/code> matcht alleen die exacte waarde.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer het basisgeval een <em>bereik<\/em> omvat — \"<code>$n<\/code> is <code>1<\/code> of minder\" — gebruik je in plaats daarvan een <code>where<\/code>-beperking:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De beperkte kandidaat is specifieker, dus Raku probeert hem eerst; de kale <code>$n<\/code>-kandidaat vangt al het andere op.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dezelfde discipline als eerder geldt nog steeds: elk recursief pad moet een basisgevalkandidaat bereiken.<\/span> <span class=\"sg\" data-s=\"1\">De faculteit met de literal <code>0<\/code> is bijvoorbeeld alleen veilig voor niet-negatieve gehele getallen — <code>fact(-1)<\/code> zou voorbij <code>0<\/code> stappen en eeuwig recursief blijven aanroepen, omdat er nooit een kandidaat matcht.<\/span> <span class=\"sg\" data-s=\"2\">De gevallen over <code>multi<\/code>-subs verdelen neemt de noodzaak van een basisgeval niet weg; het geeft dat basisgeval alleen een eigen naam en een eigen plek.<\/span><\/p>"]]},"es":{"t":"Recursión con subrutinas multi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora el caso base ha sido una línea <em>dentro<\/em> de la subrutina: un ternario o un <code>return<\/code> anticipado que comprueba el argumento.<\/span> <span class=\"sg\" data-s=\"1\">Raku ofrece una forma más expresiva de escribir lo mismo.<\/span> <span class=\"sg\" data-s=\"2\">Como una subrutina puede tener varios candidatos <code>multi<\/code>, puedes darle al caso base y al paso recursivo <strong>subrutinas separadas propias<\/strong> y dejar que el despacho múltiple elija la adecuada en cada llamada.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recuerda el factorial.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>multi<\/code>, sus dos casos se convierten en dos subrutinas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El primer candidato coincide solo cuando el argumento es exactamente <code>0<\/code>: ese literal de la firma <em>es<\/em> el caso base.<\/span> <span class=\"sg\" data-s=\"1\">Cualquier otra llamada va al segundo candidato, que multiplica y recurre.<\/span> <span class=\"sg\" data-s=\"2\">Cuando <code>fact($n - 1)<\/code> llega por fin a <code>0<\/code>, el despacho cambia al primer candidato y la cadena de llamadas se desenrolla.<\/span> <span class=\"sg\" data-s=\"3\">El caso base ya no es una rama enterrada en el cuerpo; es una subrutina que existe para un solo valor.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">¿Por qué <code>0<\/code> y no <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Porque cada paso resta uno, cualquier número de partida acaba aterrizando exactamente en <code>0<\/code>, y <code>0!<\/code> está definido como <code>1<\/code>, así que <code>0<\/code> es donde termina de verdad el descenso.<\/span> <span class=\"sg\" data-s=\"2\">Un candidato literal coincide con un único valor <em>exacto<\/em>, de modo que una base <code>multi fact(1)<\/code> calcularía correctamente <code>fact(1)<\/code> pero dejaría que <code>fact(0)<\/code> cayera en <code>multi fact($n)<\/code> y recurriera más allá de cero para siempre.<\/span> <span class=\"sg\" data-s=\"3\">Detenerse en <code>0<\/code> mantiene correcta la subrutina para todo número entero no negativo, <code>fact(0)<\/code> incluido.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto se lee especialmente bien cuando hay más de un caso base.<\/span> <span class=\"sg\" data-s=\"1\">Fibonacci necesita dos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada caso base es su propio candidato de una línea, y el candidato recursivo se ocupa de todo lo demás, sin condicionales anidados.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un literal como <code>0<\/code> coincide solo con ese valor exacto.<\/span> <span class=\"sg\" data-s=\"1\">Cuando el caso base cubre un <em>rango<\/em> — «<code>$n<\/code> es <code>1<\/code> o menos» —, usa en su lugar una restricción <code>where<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El candidato restringido es más específico, así que Raku lo prueba primero; el candidato simple <code>$n<\/code> recoge todo lo demás.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sigue valiendo la misma disciplina de antes: todo camino recursivo debe alcanzar un candidato de caso base.<\/span> <span class=\"sg\" data-s=\"1\">El factorial con el literal <code>0<\/code>, por ejemplo, solo es seguro para números enteros no negativos: <code>fact(-1)<\/code> pasaría de largo <code>0<\/code> y recurriría para siempre, porque ningún candidato coincidiría nunca.<\/span> <span class=\"sg\" data-s=\"2\">Repartir los casos entre subrutinas <code>multi<\/code> no elimina la necesidad de un caso base; solo le da un nombre y una casa propia.<\/span><\/p>"]]},"it":{"t":"Ricorsione con subroutine multi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Finora il caso base è stato una riga <em>dentro<\/em> la subroutine: un ternario o un <code>return<\/code> anticipato che controlla l'argomento.<\/span> <span class=\"sg\" data-s=\"1\">Raku offre un modo più espressivo di scrivere la stessa cosa.<\/span> <span class=\"sg\" data-s=\"2\">Poiché una subroutine può avere più candidati <code>multi<\/code>, puoi dare al caso base e al passo ricorsivo <strong>subroutine separate proprie<\/strong> e lasciare che la distribuzione multipla scelga quella giusta per ogni chiamata.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ricorda il fattoriale.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>multi<\/code>, i suoi due casi diventano due subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il primo candidato corrisponde solo quando l'argomento è esattamente <code>0<\/code>: quel letterale nella firma <em>è<\/em> il caso base.<\/span> <span class=\"sg\" data-s=\"1\">Ogni altra chiamata va al secondo candidato, che moltiplica e ricorre.<\/span> <span class=\"sg\" data-s=\"2\">Quando <code>fact($n - 1)<\/code> raggiunge finalmente <code>0<\/code>, la distribuzione passa al primo candidato e la catena di chiamate si srotola.<\/span> <span class=\"sg\" data-s=\"3\">Il caso base non è più un ramo sepolto nel corpo; è una subroutine che esiste per un unico valore.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Perché <code>0<\/code> e non <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Perché ogni passo sottrae uno, qualunque numero di partenza atterra prima o poi esattamente su <code>0<\/code>, e <code>0!<\/code> è definito come <code>1<\/code> — quindi <code>0<\/code> è dove la discesa finisce davvero.<\/span> <span class=\"sg\" data-s=\"2\">Un candidato letterale corrisponde a un unico valore <em>esatto<\/em>, quindi una base <code>multi fact(1)<\/code> calcolerebbe correttamente <code>fact(1)<\/code> ma lascerebbe <code>fact(0)<\/code> cadere in <code>multi fact($n)<\/code> e ricorrere oltre lo zero per sempre.<\/span> <span class=\"sg\" data-s=\"3\">Fermarsi a <code>0<\/code> tiene corretta la subroutine per ogni numero intero non negativo, <code>fact(0)<\/code> compreso.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo si legge particolarmente bene quando i casi base sono più di uno.<\/span> <span class=\"sg\" data-s=\"1\">Fibonacci ne ha bisogno di due:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni caso base è un candidato di una riga a sé, e il candidato ricorsivo si occupa di tutto il resto — nessuna condizione annidata.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un letterale come <code>0<\/code> corrisponde solo a quel valore esatto.<\/span> <span class=\"sg\" data-s=\"1\">Quando il caso base copre un <em>intervallo<\/em> — «<code>$n<\/code> è <code>1<\/code> o meno» — usa invece un vincolo <code>where<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il candidato vincolato è più specifico, quindi Raku lo prova per primo; il candidato semplice <code>$n<\/code> raccoglie tutto il resto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vale ancora la stessa disciplina di prima: ogni percorso ricorsivo deve raggiungere un candidato di caso base.<\/span> <span class=\"sg\" data-s=\"1\">Il fattoriale con il letterale <code>0<\/code>, per esempio, è sicuro solo per i numeri interi non negativi — <code>fact(-1)<\/code> scavalcherebbe <code>0<\/code> e ricorrerebbe per sempre, perché nessun candidato corrisponderebbe mai.<\/span> <span class=\"sg\" data-s=\"2\">Dividere i casi fra subroutine <code>multi<\/code> non toglie il bisogno di un caso base; gli dà soltanto un nome e una casa propria.<\/span><\/p>"]]},"ru":{"t":"Рекурсия с multi-подпрограммами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">До сих пор базовый случай был строкой <em>внутри<\/em> подпрограммы — тернарным оператором или ранним <code>return<\/code>, проверяющим аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Raku предлагает более выразительный способ записать то же самое.<\/span> <span class=\"sg\" data-s=\"2\">Поскольку у подпрограммы может быть несколько кандидатов <code>multi<\/code>, базовому случаю и рекурсивному шагу можно отдать <strong>отдельные подпрограммы<\/strong> и позволить множественной диспетчеризации выбирать нужную при каждом вызове.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вспомните факториал.<\/span> <span class=\"sg\" data-s=\"1\">С <code>multi<\/code> два его случая становятся двумя подпрограммами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Первый кандидат срабатывает, только когда аргумент в точности равен <code>0<\/code>, — этот литерал в сигнатуре <em>и есть<\/em> базовый случай.<\/span> <span class=\"sg\" data-s=\"1\">Все остальные вызовы уходят ко второму кандидату, который умножает и рекурсивно вызывает себя.<\/span> <span class=\"sg\" data-s=\"2\">Когда <code>fact($n - 1)<\/code> наконец дойдёт до <code>0<\/code>, диспетчеризация переключится на первого кандидата и цепочка вызовов развернётся обратно.<\/span> <span class=\"sg\" data-s=\"3\">Базовый случай больше не ветка, спрятанная в теле; это подпрограмма, существующая ради единственного значения.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Почему <code>0<\/code>, а не <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Потому что каждый шаг вычитает единицу, и любое начальное число рано или поздно попадает точно на <code>0<\/code>, а <code>0!<\/code> по определению равен <code>1<\/code>, — значит, именно на <code>0<\/code> спуск по-настоящему заканчивается.<\/span> <span class=\"sg\" data-s=\"2\">Кандидат с литералом срабатывает для одного <em>точного<\/em> значения, поэтому база вида <code>multi fact(1)<\/code> вычислила бы <code>fact(1)<\/code> верно, но <code>fact(0)<\/code> провалился бы к <code>multi fact($n)<\/code> и уходил бы в рекурсию за ноль бесконечно.<\/span> <span class=\"sg\" data-s=\"3\">Остановка на <code>0<\/code> сохраняет подпрограмму правильной для любого неотрицательного целого числа, включая <code>fact(0)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Особенно хорошо это читается, когда базовых случаев больше одного.<\/span> <span class=\"sg\" data-s=\"1\">Числам Фибоначчи нужны два:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый базовый случай — собственный однострочный кандидат, а рекурсивный кандидат обрабатывает всё остальное; никаких вложенных условий.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Литерал вроде <code>0<\/code> срабатывает только для этого точного значения.<\/span> <span class=\"sg\" data-s=\"1\">Когда базовый случай покрывает <em>диапазон<\/em> — «<code>$n<\/code> равно <code>1<\/code> или меньше», — используйте вместо литерала ограничение <code>where<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кандидат с ограничением более специфичен, поэтому Raku пробует его первым; кандидат с простым <code>$n<\/code> ловит всё остальное.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прежняя дисциплина остаётся в силе: каждый рекурсивный путь обязан дойти до кандидата с базовым случаем.<\/span> <span class=\"sg\" data-s=\"1\">Факториал с литералом <code>0<\/code>, например, безопасен только для неотрицательных целых чисел — <code>fact(-1)<\/code> перешагнул бы через <code>0<\/code> и уходил бы в рекурсию бесконечно, потому что ни один кандидат так и не подошёл бы.<\/span> <span class=\"sg\" data-s=\"2\">Разнесение случаев по <code>multi<\/code>-подпрограммам не отменяет необходимости в базовом случае; оно лишь даёт этому базовому случаю имя и собственное место.<\/span><\/p>"]]},"uk":{"t":"Рекурсія з multi-підпрограмами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досі базовий випадок був рядком <em>усередині<\/em> підпрограми — тернарним оператором або раннім <code>return<\/code>, що перевіряє аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Raku пропонує виразніший спосіб записати те саме.<\/span> <span class=\"sg\" data-s=\"2\">Оскільки підпрограма може мати кілька кандидатів <code>multi<\/code>, ви можете дати базовому випадку й рекурсивному крокові <strong>власні окремі підпрограми<\/strong> й дозволити множинній диспетчеризації вибирати потрібного для кожного виклику.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пригадаймо факторіал.<\/span> <span class=\"sg\" data-s=\"1\">З <code>multi<\/code> його два випадки стають двома підпрограмами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перший кандидат підходить лише тоді, коли аргумент дорівнює точно <code>0<\/code> — цей літерал у сигнатурі <em>і є<\/em> базовим випадком.<\/span> <span class=\"sg\" data-s=\"1\">Кожен інший виклик іде до другого кандидата, який множить і рекурсує.<\/span> <span class=\"sg\" data-s=\"2\">Коли <code>fact($n - 1)<\/code> нарешті досягає <code>0<\/code>, диспетчеризація перемикається на першого кандидата, і ланцюжок викликів розкручується назад.<\/span> <span class=\"sg\" data-s=\"3\">Базовий випадок більше не є гілкою, похованою в тілі; це підпрограма, що існує заради одного-єдиного значення.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Чому <code>0<\/code>, а не <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Бо кожен крок віднімає одиницю, тож будь-яке початкове число зрештою потрапляє точно на <code>0<\/code>, а <code>0!<\/code> за означенням дорівнює <code>1<\/code> — отже, саме на <code>0<\/code> спуск справді завершується.<\/span> <span class=\"sg\" data-s=\"2\">Літеральний кандидат підходить для одного <em>точного<\/em> значення, тож база <code>multi fact(1)<\/code> обчислила б <code>fact(1)<\/code> правильно, але залишила б <code>fact(0)<\/code> провалюватися до <code>multi fact($n)<\/code> і рекурсувати за нуль без кінця.<\/span> <span class=\"sg\" data-s=\"3\">Зупинка на <code>0<\/code> тримає підпрограму правильною для кожного невід'ємного цілого числа, включно з <code>fact(0)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це читається особливо добре, коли базових випадків більше ніж один.<\/span> <span class=\"sg\" data-s=\"1\">Числам Фібоначчі їх потрібно два:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен базовий випадок є власним однорядковим кандидатом, а рекурсивний кандидат обробляє все решта — без вкладених умов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Літерал на кшталт <code>0<\/code> підходить лише для цього точного значення.<\/span> <span class=\"sg\" data-s=\"1\">Коли базовий випадок покриває <em>діапазон<\/em> — «<code>$n<\/code> дорівнює <code>1<\/code> або менше», — використовуйте натомість обмеження <code>where<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обмежений кандидат є конкретнішим, тож Raku пробує його першим; кандидат зі звичайним <code>$n<\/code> ловить усе решта.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Та сама дисципліна, що й раніше, залишається чинною: кожен рекурсивний шлях має досягти кандидата з базовим випадком.<\/span> <span class=\"sg\" data-s=\"1\">Факторіал із літеральним <code>0<\/code>, наприклад, безпечний лише для невід'ємних цілих чисел — <code>fact(-1)<\/code> переступив би <code>0<\/code> і рекурсував би вічно, бо жоден кандидат ніколи не підійшов би.<\/span> <span class=\"sg\" data-s=\"2\">Рознесення випадків по <code>multi<\/code>-підпрограмах не скасовує потреби в базовому випадку; воно лише дає цьому базовому випадку ім'я та власну домівку.<\/span><\/p>"]]},"bg":{"t":"Рекурсия с multi-подпрограми","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досега базовият случай беше ред <em>вътре<\/em> в подпрограмата — тернарен оператор или ранен <code>return<\/code>, който проверява аргумента.<\/span> <span class=\"sg\" data-s=\"1\">Raku предлага по-изразителен начин да се напише същото.<\/span> <span class=\"sg\" data-s=\"2\">Понеже подпрограмата може да има няколко кандидата <code>multi<\/code>, можете да дадете на базовия случай и на рекурсивната стъпка <strong>свои собствени отделни подпрограми<\/strong> и да оставите множественото диспечиране да избере правилната за всяко извикване.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спомнете си факториела.<\/span> <span class=\"sg\" data-s=\"1\">С <code>multi<\/code> двата му случая стават две подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact(0)  { 1 }\nmulti fact($n) { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Първият кандидат съвпада само когато аргументът е точно <code>0<\/code> — този литерал в сигнатурата <em>е<\/em> базовият случай.<\/span> <span class=\"sg\" data-s=\"1\">Всяко друго извикване отива при втория кандидат, който умножава и рекурсира.<\/span> <span class=\"sg\" data-s=\"2\">Когато <code>fact($n - 1)<\/code> най-сетне стигне <code>0<\/code>, диспечирането се превключва към първия кандидат и веригата от извиквания се развива обратно.<\/span> <span class=\"sg\" data-s=\"3\">Базовият случай вече не е клон, заровен в тялото; той е подпрограма, която съществува заради една-единствена стойност.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Защо <code>0<\/code>, а не <code>1<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Защото всяка стъпка вади единица, така че всяко начално число в крайна сметка попада точно на <code>0<\/code>, а <code>0!<\/code> е дефиниран като <code>1<\/code> — значи <code>0<\/code> е мястото, където спускането наистина свършва.<\/span> <span class=\"sg\" data-s=\"2\">Литералният кандидат съвпада с една <em>точна<\/em> стойност, така че база <code>multi fact(1)<\/code> би изчислила <code>fact(1)<\/code> правилно, но би оставила <code>fact(0)<\/code> да пропадне до <code>multi fact($n)<\/code> и да рекурсира отвъд нулата безкрайно.<\/span> <span class=\"sg\" data-s=\"3\">Спирането на <code>0<\/code> държи подпрограмата правилна за всяко неотрицателно цяло число, включително <code>fact(0)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това се чете особено добре, когато базовите случаи са повече от един.<\/span> <span class=\"sg\" data-s=\"1\">На числата на Фибоначи им трябват два:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fib(0) { 0 }\nmulti fib(1) { 1 }\nmulti fib($n) { fib($n - 1) + fib($n - 2) }\n\nsay fib(10); # 55<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всеки базов случай е свой едноредов кандидат, а рекурсивният кандидат поема всичко останало — без вложени условия.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Литерал като <code>0<\/code> съвпада само с тази точна стойност.<\/span> <span class=\"sg\" data-s=\"1\">Когато базовият случай покрива <em>диапазон<\/em> — „<code>$n<\/code> е <code>1<\/code> или по-малко“, — използвайте вместо това ограничение <code>where<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi fact($n where * &lt;= 1) { 1 }\nmulti fact($n)              { $n * fact($n - 1) }\n\nsay fact(6); # 720<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ограниченият кандидат е по-конкретен, така че Raku го опитва пръв; кандидатът с обикновено <code>$n<\/code> улавя всичко останало.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Същата дисциплина както преди остава в сила: всеки рекурсивен път трябва да стигне до кандидат с базов случай.<\/span> <span class=\"sg\" data-s=\"1\">Факториелът с литерално <code>0<\/code>, например, е безопасен само за неотрицателни цели числа — <code>fact(-1)<\/code> би прекрачил <code>0<\/code> и би рекурсирал вечно, защото нито един кандидат никога не би съвпаднал.<\/span> <span class=\"sg\" data-s=\"2\">Разделянето на случаите между <code>multi<\/code>-подпрограми не премахва нуждата от базов случай; то само дава на този базов случай име и собствен дом.<\/span><\/p>"]]}}}</script>
