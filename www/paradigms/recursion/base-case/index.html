<script type="application/json" id="page-data">{"u":"paradigms/recursion/base-case","n":1166,"k":"topic","pv":"paradigms/recursion/recursive-sub/quiz","nx":"paradigms/recursion/base-case/quiz","tr":["paradigms","paradigms/recursion"],"L":{"en":{"t":"The base case","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every recursive subroutine needs a <em>base case<\/em>: a condition under which it returns an answer <strong>without<\/strong> calling itself again.<\/span> <span class=\"sg\" data-s=\"1\">Without one, the subroutine would call itself forever.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In the factorial, the base case was “<code>$n<\/code> is <code>1<\/code> or less”.<\/span> <span class=\"sg\" data-s=\"1\">Here is another example, counting down to zero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # base case: stop\n    say $n;\n    countdown($n - 1);  # recursive step\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The first line is the base case: when <code>$n<\/code> drops below <code>1<\/code>, the subroutine returns immediately and the chain of calls ends.<\/span> <span class=\"sg\" data-s=\"1\">The recursive step always moves <strong>towards<\/strong> the base case by calling <code>countdown<\/code> with a smaller number.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you forget the base case, or the steps never reach it, the recursion never stops and the program eventually fails.<\/span> <span class=\"sg\" data-s=\"1\">A correct recursive subroutine always has two things: a base case that ends the recursion, and a step that brings each call closer to it.<\/span><\/p>"]]},"de":{"t":"Der Grundfall","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede rekursive Subroutine braucht einen <em>Grundfall<\/em>: eine Bedingung, unter der sie eine Antwort liefert, <strong>ohne<\/strong> sich erneut aufzurufen.<\/span> <span class=\"sg\" data-s=\"1\">Ohne einen solchen würde sich die Subroutine ewig selbst aufrufen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bei der Fakultät war der Grundfall „<code>$n<\/code> ist <code>1<\/code> oder kleiner“.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist ein weiteres Beispiel, das bis null herunterzählt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # base case: stop\n    say $n;\n    countdown($n - 1);  # recursive step\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die erste Zeile ist der Grundfall: Sinkt <code>$n<\/code> unter <code>1<\/code>, kehrt die Subroutine sofort zurück, und die Kette der Aufrufe endet.<\/span> <span class=\"sg\" data-s=\"1\">Der rekursive Schritt bewegt sich stets <strong>auf<\/strong> den Grundfall zu, indem er <code>countdown<\/code> mit einer kleineren Zahl aufruft.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vergessen Sie den Grundfall, oder erreichen die Schritte ihn nie, hält die Rekursion nie an, und das Programm scheitert schließlich.<\/span> <span class=\"sg\" data-s=\"1\">Eine richtige rekursive Subroutine hat stets zweierlei: einen Grundfall, der die Rekursion beendet, und einen Schritt, der jeden Aufruf näher an ihn heranbringt.<\/span><\/p>"]]},"nl":{"t":"Het basisgeval","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke recursieve subroutine heeft een <em>basisgeval<\/em> nodig: een voorwaarde waaronder ze een antwoord teruggeeft <strong>zonder<\/strong> zichzelf opnieuw aan te roepen.<\/span> <span class=\"sg\" data-s=\"1\">Zonder dat zou de subroutine zichzelf eeuwig aanroepen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bij de faculteit was het basisgeval \"<code>$n<\/code> is <code>1<\/code> of minder\".<\/span> <span class=\"sg\" data-s=\"1\">Hier is nog een voorbeeld, dat naar nul aftelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # base case: stop\n    say $n;\n    countdown($n - 1);  # recursive step\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De eerste regel is het basisgeval: wanneer <code>$n<\/code> onder <code>1<\/code> zakt, keert de subroutine onmiddellijk terug en eindigt de keten van aanroepen.<\/span> <span class=\"sg\" data-s=\"1\">De recursieve stap beweegt altijd <strong>naar<\/strong> het basisgeval toe door <code>countdown<\/code> met een kleiner getal aan te roepen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je het basisgeval vergeet, of de stappen bereiken het nooit, stopt de recursie nooit en mislukt het programma uiteindelijk.<\/span> <span class=\"sg\" data-s=\"1\">Een correcte recursieve subroutine heeft altijd twee dingen: een basisgeval dat de recursie beëindigt, en een stap die elke aanroep er dichterbij brengt.<\/span><\/p>"]]},"es":{"t":"El caso base","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Toda subrutina recursiva necesita un <em>caso base<\/em>: una condición en la que devuelve una respuesta <strong>sin<\/strong> volver a llamarse a sí misma.<\/span> <span class=\"sg\" data-s=\"1\">Sin él, la subrutina se llamaría a sí misma para siempre.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En el factorial, el caso base era «<code>$n<\/code> es <code>1<\/code> o menos».<\/span> <span class=\"sg\" data-s=\"1\">Aquí tienes otro ejemplo, que cuenta hacia atrás hasta cero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # base case: stop\n    say $n;\n    countdown($n - 1);  # recursive step\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La primera línea es el caso base: cuando <code>$n<\/code> baja de <code>1<\/code>, la subrutina retorna de inmediato y la cadena de llamadas termina.<\/span> <span class=\"sg\" data-s=\"1\">El paso recursivo siempre avanza <strong>hacia<\/strong> el caso base llamando a <code>countdown<\/code> con un número más pequeño.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si olvidas el caso base, o si los pasos nunca lo alcanzan, la recursión no se detiene y el programa acaba fallando.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina recursiva correcta siempre tiene dos cosas: un caso base que termina la recursión y un paso que acerca cada llamada a él.<\/span><\/p>"]]},"it":{"t":"Il caso base","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni subroutine ricorsiva ha bisogno di un <em>caso base<\/em>: una condizione in cui restituisce una risposta <strong>senza<\/strong> chiamare di nuovo se stessa.<\/span> <span class=\"sg\" data-s=\"1\">Senza di esso la subroutine chiamerebbe se stessa per sempre.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nel fattoriale il caso base era «<code>$n<\/code> è <code>1<\/code> o meno».<\/span> <span class=\"sg\" data-s=\"1\">Ecco un altro esempio, che conta alla rovescia fino a zero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # base case: stop\n    say $n;\n    countdown($n - 1);  # recursive step\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prima riga è il caso base: quando <code>$n<\/code> scende sotto <code>1<\/code>, la subroutine ritorna immediatamente e la catena di chiamate finisce.<\/span> <span class=\"sg\" data-s=\"1\">Il passo ricorsivo si muove sempre <strong>verso<\/strong> il caso base chiamando <code>countdown<\/code> con un numero più piccolo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se dimentichi il caso base, o se i passi non lo raggiungono mai, la ricorsione non si ferma e il programma alla fine fallisce.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine ricorsiva corretta ha sempre due cose: un caso base che chiude la ricorsione e un passo che avvicina ogni chiamata a esso.<\/span><\/p>"]]},"ru":{"t":"Базовый случай","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всякой рекурсивной подпрограмме нужен <em>базовый случай<\/em>: условие, при котором она возвращает ответ, <strong>не<\/strong> вызывая себя снова.<\/span> <span class=\"sg\" data-s=\"1\">Без него подпрограмма вызывала бы себя бесконечно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В факториале базовым случаем было «<code>$n<\/code> равно <code>1<\/code> или меньше».<\/span> <span class=\"sg\" data-s=\"1\">Вот другой пример — обратный отсчёт до нуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # базовый случай: останавливаемся\n    say $n;\n    countdown($n - 1);  # рекурсивный шаг\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Первая строка — базовый случай: когда <code>$n<\/code> опускается ниже <code>1<\/code>, подпрограмма немедленно возвращается и цепочка вызовов заканчивается.<\/span> <span class=\"sg\" data-s=\"1\">Рекурсивный шаг всегда движется <strong>к<\/strong> базовому случаю, вызывая <code>countdown<\/code> с меньшим числом.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если забыть про базовый случай или если шаги до него никогда не доберутся, рекурсия не остановится и программа в конце концов упадёт.<\/span> <span class=\"sg\" data-s=\"1\">У правильной рекурсивной подпрограммы всегда есть две вещи: базовый случай, завершающий рекурсию, и шаг, приближающий к нему каждый вызов.<\/span><\/p>"]]},"uk":{"t":"Базовий випадок","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожній рекурсивній підпрограмі потрібен <em>базовий випадок<\/em>: умова, за якої вона повертає відповідь, <strong>не<\/strong> викликаючи себе знову.<\/span> <span class=\"sg\" data-s=\"1\">Без нього підпрограма викликала б себе вічно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У факторіалі базовим випадком було «<code>$n<\/code> дорівнює <code>1<\/code> або менше».<\/span> <span class=\"sg\" data-s=\"1\">Ось інший приклад — зворотний відлік до нуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # базовий випадок: зупинка\n    say $n;\n    countdown($n - 1);  # рекурсивний крок\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма друкує:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перший рядок є базовим випадком: коли <code>$n<\/code> падає нижче за <code>1<\/code>, підпрограма негайно повертається, і ланцюжок викликів завершується.<\/span> <span class=\"sg\" data-s=\"1\">Рекурсивний крок завжди рухається <strong>до<\/strong> базового випадку, викликаючи <code>countdown<\/code> із меншим числом.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви забудете базовий випадок або кроки ніколи його не досягнуть, рекурсія не зупиниться, і програма зрештою впаде.<\/span> <span class=\"sg\" data-s=\"1\">Правильна рекурсивна підпрограма завжди має дві речі: базовий випадок, що завершує рекурсію, і крок, який наближає кожен виклик до нього.<\/span><\/p>"]]},"bg":{"t":"Базовият случай","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка рекурсивна подпрограма се нуждае от <em>базов случай<\/em>: условие, при което тя връща отговор, <strong>без<\/strong> да се извиква отново.<\/span> <span class=\"sg\" data-s=\"1\">Без него подпрограмата би се извиквала вечно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При факториела базовият случай беше „<code>$n<\/code> е <code>1<\/code> или по-малко“.<\/span> <span class=\"sg\" data-s=\"1\">Ето друг пример — обратно броене до нула:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub countdown($n) {\n    return if $n &lt; 1;   # базов случай: спираме\n    say $n;\n    countdown($n - 1);  # рекурсивна стъпка\n}\n\ncountdown(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>3\n2\n1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Първият ред е базовият случай: когато <code>$n<\/code> падне под <code>1<\/code>, подпрограмата се връща незабавно и веригата от извиквания завършва.<\/span> <span class=\"sg\" data-s=\"1\">Рекурсивната стъпка винаги се движи <strong>към<\/strong> базовия случай, като извиква <code>countdown<\/code> с по-малко число.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако забравите базовия случай или стъпките никога не стигнат до него, рекурсията не спира и програмата в крайна сметка се проваля.<\/span> <span class=\"sg\" data-s=\"1\">Правилната рекурсивна подпрограма винаги има две неща: базов случай, който прекратява рекурсията, и стъпка, която приближава всяко извикване до него.<\/span><\/p>"]]}}}</script>
