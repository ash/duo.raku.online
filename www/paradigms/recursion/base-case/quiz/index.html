<script type="application/json" id="page-data">{"u":"paradigms/recursion/base-case/quiz","n":1167,"k":"quiz","pv":"paradigms/recursion/base-case","nx":"paradigms/recursion/multi-recursion","tr":["paradigms","paradigms/recursion","paradigms/recursion/base-case"],"L":{"en":{"t":"Quiz — The base case","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What happens if a recursive subroutine has no reachable base case?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">It returns <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">It returns <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">It never stops calling itself and eventually fails<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">The compiler refuses to run it<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">With no reachable base case, each call makes another call without end.<\/span> <span class=\"sg\" data-s=\"1\">The recursion never terminates, and the program eventually runs out of call stack and fails.<\/span> <span class=\"sg\" data-s=\"2\">A base case is what lets the recursion stop.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Der Grundfall","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was geschieht, wenn eine rekursive Subroutine keinen erreichbaren Grundfall hat?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Sie liefert <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Sie liefert <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Sie hört nie auf, sich selbst aufzurufen, und scheitert schließlich<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Der Compiler weigert sich, sie auszuführen<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ohne erreichbaren Grundfall macht jeder Aufruf endlos einen weiteren Aufruf.<\/span> <span class=\"sg\" data-s=\"1\">Die Rekursion endet nie, und dem Programm geht schließlich der Aufrufstapel aus, sodass es scheitert.<\/span> <span class=\"sg\" data-s=\"2\">Ein Grundfall ist das, was die Rekursion anhalten lässt.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Het basisgeval","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat gebeurt er als een recursieve subroutine geen bereikbaar basisgeval heeft?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ze geeft <code>Nil<\/code> terug<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Ze geeft <code>0<\/code> terug<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Ze houdt nooit op zichzelf aan te roepen en mislukt uiteindelijk<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">De compiler weigert haar te draaien<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zonder bereikbaar basisgeval doet elke aanroep eindeloos een volgende aanroep.<\/span> <span class=\"sg\" data-s=\"1\">De recursie eindigt nooit, en het programma raakt uiteindelijk door zijn aanroepstapel heen en mislukt.<\/span> <span class=\"sg\" data-s=\"2\">Een basisgeval is wat de recursie laat stoppen.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — El caso base","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué ocurre si una subrutina recursiva no tiene un caso base alcanzable?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Devuelve <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Devuelve <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Nunca deja de llamarse a sí misma y acaba fallando<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">El compilador se niega a ejecutarla<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sin un caso base alcanzable, cada llamada hace otra llamada sin fin.<\/span> <span class=\"sg\" data-s=\"1\">La recursión no termina nunca y el programa acaba agotando la pila de llamadas y fallando.<\/span> <span class=\"sg\" data-s=\"2\">Es el caso base lo que permite que la recursión se detenga.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Il caso base","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa succede se una subroutine ricorsiva non ha un caso base raggiungibile?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Restituisce <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Restituisce <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Non smette mai di chiamare se stessa e alla fine fallisce<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Il compilatore si rifiuta di eseguirla<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Senza un caso base raggiungibile, ogni chiamata ne fa un'altra senza fine.<\/span> <span class=\"sg\" data-s=\"1\">La ricorsione non termina mai e il programma alla fine esaurisce lo stack delle chiamate e fallisce.<\/span> <span class=\"sg\" data-s=\"2\">È il caso base a permettere alla ricorsione di fermarsi.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Bāzes gadījums","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kas notiek, ja rekursīvai apakšprogrammai nav sasniedzama bāzes gadījuma?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Tā atgriež <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Tā atgriež <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Tā nekad nebeidz sevi izsaukt un galu galā avarē<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Kompilators atsakās to izpildīt<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bez sasniedzama bāzes gadījuma katrs izsaukums veic vēl vienu izsaukumu bez gala.<\/span> <span class=\"sg\" data-s=\"1\">Rekursija nekad nebeidzas, un programmai galu galā beidzas izsaukumu steks un tā avarē.<\/span> <span class=\"sg\" data-s=\"2\">Tieši bāzes gadījums ļauj rekursijai apstāties.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Базовый случай","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что произойдёт, если у рекурсивной подпрограммы нет достижимого базового случая?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Она вернёт <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Она вернёт <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Она будет вызывать себя без конца и в итоге упадёт<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Компилятор откажется её запускать<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Без достижимого базового случая каждый вызов порождает следующий, и так без конца.<\/span> <span class=\"sg\" data-s=\"1\">Рекурсия не завершается, у программы в конце концов кончается стек вызовов, и она падает.<\/span> <span class=\"sg\" data-s=\"2\">Именно базовый случай и позволяет рекурсии остановиться.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Базовий випадок","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що станеться, якщо рекурсивна підпрограма не має досяжного базового випадку?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Вона поверне <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Вона поверне <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Вона нескінченно викликатиме себе й зрештою впаде<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Компілятор відмовиться її запускати<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Без досяжного базового випадку кожен виклик робить ще один виклик без кінця.<\/span> <span class=\"sg\" data-s=\"1\">Рекурсія ніколи не завершується, і програма зрештою вичерпує стек викликів та падає.<\/span> <span class=\"sg\" data-s=\"2\">Саме базовий випадок дозволяє рекурсії зупинитися.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Базовият случай","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво се случва, ако рекурсивна подпрограма няма достижим базов случай?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Връща <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Връща <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Никога не спира да се извиква и в крайна сметка се проваля<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Компилаторът отказва да я изпълни<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Без достижим базов случай всяко извикване прави ново извикване без край.<\/span> <span class=\"sg\" data-s=\"1\">Рекурсията никога не завършва и програмата в крайна сметка изчерпва стека от извиквания и се проваля.<\/span> <span class=\"sg\" data-s=\"2\">Базовият случай е онова, което позволява на рекурсията да спре.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — La baza kazo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kio okazas, se rekursia subprogramo havas neniun atingeblan bazan kazon?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ĝi redonas <code>Nil<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Ĝi redonas <code>0<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Ĝi neniam ĉesas voki sin kaj fine malsukcesas<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">La kompililo rifuzas ruli ĝin<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sen atingebla baza kazo, ĉiu voko faras alian vokon senfine.<\/span> <span class=\"sg\" data-s=\"1\">La rekursio neniam finiĝas, kaj la programo fine elĉerpas sian vokstakon kaj malsukcesas.<\/span> <span class=\"sg\" data-s=\"2\">Baza kazo estas tio, kio permesas al la rekursio halti.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Casus fundamentalis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid fit si subprogramma recursivum casum fundamentalem attingibilem non habet?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Nil<\/code> reddit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>0<\/code> reddit<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">Numquam se vocare desinit et tandem deficit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Compilator illud currere recusat<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sine casu fundamentali attingibili unaquaeque vocatio aliam vocationem sine fine facit.<\/span> <span class=\"sg\" data-s=\"1\">Recursio numquam terminatur, et programma tandem acervum vocationum exhaurit et deficit.<\/span> <span class=\"sg\" data-s=\"2\">Casus fundamentalis est id quod recursioni consistere permittit.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
