<script type="application/json" id="page-data">{"u":"paradigms/recursion/exercises/count-up/solution","n":1176,"k":"solution","pv":"paradigms/recursion/exercises/count-up","nx":"paradigms/recursion/exercises/triangular-number","tr":["paradigms","paradigms/recursion"],"L":{"en":{"t":"The solution of ’Count up‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub countup($n) {\n    return if $n &lt; 1;\n    countup($n - 1);\n    say $n;\n}\n\ncountup(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/count-up.raku\" target=\"_blank\" rel=\"noopener\">count-up.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The base case <code>return if $n &lt; 1<\/code> still stops the recursion once the count passes zero.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The order of the last two lines is what makes it count <em>up<\/em>: each call first recurses all the way down to the base case, and only then prints its own number as the calls unwind. So <code>1<\/code> is printed first and <code>$n<\/code> last.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Aufwärts zählen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub countup($n) {\n    return if $n &lt; 1;\n    countup($n - 1);\n    say $n;\n}\n\ncountup(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/count-up.raku\" target=\"_blank\" rel=\"noopener\">count-up.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Grundfall <code>return if $n &lt; 1<\/code> hält die Rekursion weiterhin an, sobald die Zählung unter null geht.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Reihenfolge der letzten beiden Zeilen ist es, die <em>aufwärts<\/em> zählen lässt: Jeder Aufruf steigt zuerst bis zum Grundfall hinab und gibt erst dann seine eigene Zahl aus, während sich die Aufrufe abwickeln. <code>1<\/code> wird also zuerst ausgegeben und <code>$n<\/code> zuletzt.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Tel op","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub countup($n) {\n    return if $n &lt; 1;\n    countup($n - 1);\n    say $n;\n}\n\ncountup(3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/count-up.raku\" target=\"_blank\" rel=\"noopener\">count-up.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>1\n2\n3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het basisgeval <code>return if $n &lt; 1<\/code> stopt de recursie nog steeds zodra de telling voorbij nul komt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De volgorde van de
