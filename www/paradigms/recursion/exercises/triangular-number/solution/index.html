<script type="application/json" id="page-data">{"u":"paradigms/recursion/exercises/triangular-number/solution","n":1178,"k":"solution","pv":"paradigms/recursion/exercises/triangular-number","nx":"paradigms/higher-order","tr":["paradigms","paradigms/recursion"],"L":{"en":{"t":"The solution of ’Triangular number‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The base case is a candidate of its own: <code>multi tri(0)<\/code> matches only when the argument is exactly <code>0<\/code> and returns <code>0<\/code> without recursing.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Every other call lands in <code>multi tri($n)<\/code>, which adds <code>$n<\/code> to the triangular number of <code>$n - 1<\/code>. The calls descend <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, and when the argument reaches <code>0<\/code> dispatch switches to the base-case candidate and the sum unwinds to <code>15<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Dreieckszahl","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Grundfall ist ein eigener Kandidat: <code>multi tri(0)<\/code> trifft nur, wenn das Argument genau <code>0<\/code> ist, und liefert <code>0<\/code> ohne Rekursion.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jeder andere Aufruf landet in <code>multi tri($n)<\/code>, das <code>$n<\/code> zur Dreieckszahl von <code>$n - 1<\/code> addiert. Die Aufrufe steigen <code>5 + 4 + 3 + 2 + 1 + 0<\/code> hinab, und sobald das Argument <code>0<\/code> erreicht, wechselt die Auswahl zum Grundfall-Kandidaten, und die Summe wickelt sich zu <code>15<\/code> ab.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Driehoeksgetal","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het basisgeval is een eigen kandidaat: <code>multi tri(0)<\/code> matcht alleen wanneer het argument precies <code>0<\/code> is en geeft <code>0<\/code> terug zonder recursie.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Elke andere aanroep belandt in <code>multi tri($n)<\/code>, die <code>$n<\/code> optelt bij het driehoeksgetal van <code>$n - 1<\/code>. De aanroepen dalen af langs <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, en wanneer het argument <code>0<\/code> bereikt schakelt de dispatch naar de basisgevalkandidaat en wikkelt de som zich af tot <code>15<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Número triangular","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El caso base es un candidato propio: <code>multi tri(0)<\/code> coincide solo cuando el argumento es exactamente <code>0<\/code> y devuelve <code>0<\/code> sin recurrir.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cualquier otra llamada aterriza en <code>multi tri($n)<\/code>, que suma <code>$n<\/code> al número triangular de <code>$n - 1<\/code>. Las llamadas descienden <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, y cuando el argumento llega a <code>0<\/code> el despacho cambia al candidato del caso base y la suma se desenrolla hasta <code>15<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Numero triangolare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il caso base è un candidato a sé: <code>multi tri(0)<\/code> corrisponde solo quando l'argomento è esattamente <code>0<\/code> e restituisce <code>0<\/code> senza ricorrere.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ogni altra chiamata atterra in <code>multi tri($n)<\/code>, che aggiunge <code>$n<\/code> al numero triangolare di <code>$n - 1<\/code>. Le chiamate scendono <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, e quando l'argomento raggiunge <code>0<\/code> la distribuzione passa al candidato del caso base e la somma si srotola fino a <code>15<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Треугольное число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Базовый случай — самостоятельный кандидат: <code>multi tri(0)<\/code> срабатывает, только когда аргумент в точности равен <code>0<\/code>, и возвращает <code>0<\/code>, не уходя в рекурсию.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Все остальные вызовы попадают в <code>multi tri($n)<\/code>, который прибавляет <code>$n<\/code> к треугольному числу для <code>$n - 1<\/code>. Вызовы спускаются как <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, а когда аргумент доходит до <code>0<\/code>, диспетчеризация переключается на кандидата с базовым случаем и сумма разворачивается в <code>15<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Трикутне число»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Базовий випадок є окремим кандидатом: <code>multi tri(0)<\/code> підходить лише тоді, коли аргумент дорівнює точно <code>0<\/code>, і повертає <code>0<\/code> без рекурсії.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кожен інший виклик потрапляє в <code>multi tri($n)<\/code>, який додає <code>$n<\/code> до трикутного числа від <code>$n - 1<\/code>. Виклики спускаються <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, а коли аргумент досягає <code>0<\/code>, диспетчеризація перемикається на кандидата з базовим випадком, і сума розкручується назад у <code>15<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Триъгълно число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi tri(0)  { 0 }\nmulti tri($n) { $n + tri($n - 1) }\n\nsay tri(5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/recursion/triangular-number.raku\" target=\"_blank\" rel=\"noopener\">triangular-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Базовият случай е отделен кандидат: <code>multi tri(0)<\/code> съвпада само когато аргументът е точно <code>0<\/code>, и връща <code>0<\/code> без рекурсия.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всяко друго извикване попада в <code>multi tri($n)<\/code>, който добавя <code>$n<\/code> към триъгълното число на <code>$n - 1<\/code>. Извикванията се спускат <code>5 + 4 + 3 + 2 + 1 + 0<\/code>, а когато аргументът стигне <code>0<\/code>, диспечирането се превключва към кандидата с базовия случай и сумата се развива обратно до <code>15<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
