<script type="application/json" id="page-data">{"u":"paradigms/cro","n":1398,"k":"section","pv":"paradigms/http-server/exercises/text-response/solution","nx":"paradigms/cro/what-is-cro","tr":["paradigms"],"L":{"en":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Building real web services on raw sockets quickly becomes tedious: parsing requests, routing URLs, handling many clients, speaking HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> is the Raku framework that does all of this for you.<\/span> <span class=\"sg\" data-s=\"2\">It is the standard, modern way to write web servers and clients in Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This final section is a short tour of Cro — just enough to see its shape.<\/span> <span class=\"sg\" data-s=\"1\">Cro is not part of the core, so to run these examples you install it first with <code>zef install cro<\/code>.<\/span><\/p>"]]},"de":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Echte Webdienste auf rohen Sockets zu bauen wird schnell mühsam: Anfragen zerlegen, URLs weiterleiten, viele Clients bedienen, HTTPS sprechen.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> ist das Raku-Framework, das Ihnen all das abnimmt.<\/span> <span class=\"sg\" data-s=\"2\">Es ist der übliche, moderne Weg, in Raku Webserver und -clients zu schreiben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser abschließende Abschnitt ist ein kurzer Rundgang durch Cro — gerade genug, um seine Gestalt zu sehen.<\/span> <span class=\"sg\" data-s=\"1\">Cro gehört nicht zum Kern, um diese Beispiele auszuführen, installieren Sie es also zuerst mit <code>zef install cro<\/code>.<\/span><\/p>"]]},"nl":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Echte webservices op kale sockets bouwen wordt snel vervelend: verzoeken ontleden, URL's routeren, veel clients bedienen, HTTPS spreken.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> is het Raku-framework dat dat allemaal voor je doet.<\/span> <span class=\"sg\" data-s=\"2\">Het is de standaard, moderne manier om in Raku webservers en -clients te schrijven.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze afsluitende sectie is een korte rondleiding door Cro — net genoeg om de vorm ervan te zien.<\/span> <span class=\"sg\" data-s=\"1\">Cro hoort niet bij de kern, dus om deze voorbeelden te draaien installeer je het eerst met <code>zef install cro<\/code>.<\/span><\/p>"]]},"es":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Construir servicios web reales sobre sockets en crudo se vuelve tedioso enseguida: analizar peticiones, encaminar URL, atender a muchos clientes, hablar HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> es el framework de Raku que hace todo esto por ti.<\/span> <span class=\"sg\" data-s=\"2\">Es la manera estándar y moderna de escribir servidores y clientes web en Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta sección final es un recorrido breve por Cro, apenas lo suficiente para ver su forma.<\/span> <span class=\"sg\" data-s=\"1\">Cro no forma parte del núcleo, así que para ejecutar estos ejemplos primero lo instalas con <code>zef install cro<\/code>.<\/span><\/p>"]]},"it":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Costruire servizi web veri su socket grezzi diventa in fretta faticoso: analizzare le richieste, instradare gli URL, servire molti client, parlare HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> è il framework Raku che ti toglie tutto questo di mano.<\/span> <span class=\"sg\" data-s=\"2\">È il modo consueto e moderno di scrivere server e client web in Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sezione conclusiva è un breve giro attorno a Cro — quel tanto che basta per vederne la forma.<\/span> <span class=\"sg\" data-s=\"1\">Cro non fa parte del nucleo, quindi per eseguire questi esempi installalo prima con <code>zef install cro<\/code>.<\/span><\/p>"]]},"lv":{"t":"Cro pamati","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Īstu tīmekļa pakalpojumu būvēšana uz neapstrādātām ligzdām ātri kļūst apnicīga: pieprasījumu parsēšana, URL maršrutēšana, daudzu klientu apkalpošana, HTTPS runāšana.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> ir Raku ietvars, kas to visu izdara jūsu vietā.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir standarta, mūsdienīgais veids, kā Raku valodā rakstīt tīmekļa serverus un klientus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī pēdējā sadaļa ir īsa ekskursija pa Cro — tieši tik, lai ieraudzītu tā formu.<\/span> <span class=\"sg\" data-s=\"1\">Cro nav valodas pamatdaļa, tāpēc šo piemēru palaišanai vispirms uzstādiet to ar <code>zef install cro<\/code>.<\/span><\/p>"]]},"ru":{"t":"Основы Cro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Строить настоящие веб-сервисы на «сырых» сокетах быстро становится утомительно: разбор запросов, маршрутизация URL, обслуживание множества клиентов, поддержка HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> — фреймворк на Raku, который делает всё это за вас.<\/span> <span class=\"sg\" data-s=\"2\">Это стандартный современный способ писать на Raku веб-серверы и клиенты.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот заключительный раздел — краткая экскурсия по Cro, ровно настолько, чтобы увидеть его облик.<\/span> <span class=\"sg\" data-s=\"1\">Cro не входит в ядро, поэтому для запуска примеров сперва установите его командой <code>zef install cro<\/code>.<\/span><\/p>"]]},"uk":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Будувати справжні вебсервіси на сирих сокетах швидко стає марудно: розбір запитів, маршрутизація URL, обробка багатьох клієнтів, розмова через HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> — це фреймворк Raku, що робить усе це за вас.<\/span> <span class=\"sg\" data-s=\"2\">Це стандартний, сучасний спосіб писати вебсервери та клієнти мовою Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей останній розділ є короткою екскурсією по Cro — рівно настільки, щоб побачити його форму.<\/span> <span class=\"sg\" data-s=\"1\">Cro не входить до ядра, тож, щоб запускати ці приклади, спершу встановіть його через <code>zef install cro<\/code>.<\/span><\/p>"]]},"bg":{"t":"Cro 101","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Изграждането на истински уеб услуги върху сурови сокети бързо става досадно: разбор на заявки, маршрутизиране на URL адреси, обслужване на много клиенти, говорене по HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> е рамката на Raku, която прави всичко това вместо вас.<\/span> <span class=\"sg\" data-s=\"2\">Тя е стандартният, съвременен начин да се пишат уеб сървъри и клиенти на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този последен раздел е кратка обиколка на Cro — точно колкото да се види формата ѝ. Cro не е част от ядрото, така че за да изпълните тези примери, първо я инсталирайте с <code>zef install cro<\/code>.<\/span><\/p>"]]},"eo":{"t":"Bazoj de Cro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Konstrui verajn retajn servojn sur krudaj kontaktskatoloj rapide fariĝas teda: analizi petojn, direkti URL-ojn, trakti multajn klientojn, paroli HTTPS.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> estas la Raku-framo, kiu faras ĉion ĉi por vi.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas la norma, moderna maniero verki retservilojn kaj -klientojn en Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu fina sekcio estas mallonga rondiro tra Cro — ĝuste sufiĉe por vidi ĝian formon.<\/span> <span class=\"sg\" data-s=\"1\">Cro ne estas parto de la kerno, do por plenumi ĉi tiujn ekzemplojn vi unue instalas ĝin per <code>zef install cro<\/code>.<\/span><\/p>"]]},"la":{"t":"Fundamenta Cro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Servitia retialia vera super foraminibus nudis aedificare cito taediosum fit: petitiones resolvere, URL dirigere, multos clientes tractare, HTTPS loqui.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Cro<\/strong> compages Raku est quae haec omnia pro te agit.<\/span> <span class=\"sg\" data-s=\"2\">Est modus normalis et modernus servitores et clientes retiales in Raku scribendi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec sectio ultima brevis peregrinatio per Cro est — tantum ut formam eius videas.<\/span> <span class=\"sg\" data-s=\"1\">Cro pars nuclei non est, itaque ut haec exempla curras, illud prius per <code>zef install cro<\/code> installas.<\/span><\/p>"]]}}}</script>
