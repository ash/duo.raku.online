<script type="application/json" id="page-data">{"u":"paradigms/cro/exercises/second-route/solution","n":1408,"k":"solution","pv":"paradigms/cro/exercises/second-route","nx":"paradigms/cro/exercises/status-line","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"The solution of ’A second route‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n    get -&gt; 'bye' {\n        content 'text/plain', 'Goodbye!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/cro/second-route.raku\" target=\"_blank\" rel=\"noopener\">second-route.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Goodbye!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A <code>route<\/code> block can hold as many routes as you like; each <code>get<\/code> handles one path.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cro matches the request path to the right route, so <code>/hello<\/code> and <code>/bye<\/code> return their own responses.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">As on the theory page, <code>.start<\/code> returns immediately, so the closi enever signal(SIGINT)<\/code> para entonces el servidor y termina la reacción.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Una seconda rotta","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n    get -&gt; 'bye' {\n        content 'text/plain', 'Goodbye!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/cro/second-route.raku\" target=\"_blank\" rel=\"noopener\">second-route.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Goodbye!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un blocco <code>route<\/code> può contenere quante rotte vuoi; ogni <code>get<\/code> gestisce un percorso.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cro associa il percorso della richiesta alla rotta giusta, quindi <code>/hello<\/code> e <code>/bye<\/code> restituiscono ciascuno la propria risposta.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Come nella pagina di teoria, <code>.start<\/code> ritorna subito, quindi il blocco <code>react<\/code> finale tiene vivo il programma finché non premi Ctrl-C — <code>whenever signal(SIGINT)<\/code> ferma allora il server e chiude la reazione.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Второй маршрут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n    get -&gt; 'bye' {\n        content 'text/plain', 'Goodbye!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/cro/second-route.raku\" target=\"_blank\" rel=\"noopener\">second-route.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Goodbye!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>route<\/code> может содержать сколько угодно маршрутов; каждый <code>get<\/code> обслуживает один путь.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cro сопоставляет путь запроса с нужным маршрутом, поэтому <code>/hello<\/code> и <code>/bye<\/code> возвращают каждый свой ответ.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Как и на теоретической странице, <code>.start<\/code> возвращает управление немедленно, поэтому завершающий блок <code>react<\/code> удерживает программу в живых, пока вы не нажмёте Ctrl-C: тогда <code>whenever signal(SIGINT)<\/code> останавливает сервер и завершает реакцию.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Другий маршрут»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n    get -&gt; 'bye' {\n        content 'text/plain', 'Goodbye!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/cro/second-route.raku\" target=\"_blank\" rel=\"noopener\">second-route.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Goodbye!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>route<\/code> може містити скільки завгодно маршрутів; кожен <code>get<\/code> обробляє один шлях.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cro зіставляє шлях запиту з потрібним маршрутом, тож <code>/hello<\/code> та <code>/bye<\/code> повертають кожен свою відповідь.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Як і на теоретичній сторінці, <code>.start<\/code> повертається негайно, тож завершальний блок <code>react<\/code> тримає програму живою, аж поки ви не натиснете Ctrl-C, — тоді <code>whenever signal(SIGINT)<\/code> спиняє сервер і завершує реакцію.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Втори маршрут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n    get -&gt; 'bye' {\n        content 'text/plain', 'Goodbye!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/paradigms/cro/second-route.raku\" target=\"_blank\" rel=\"noopener\">second-route.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Goodbye!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блокът <code>route<\/code> може да съдържа колкото маршрута пожелаете; всеки <code>get<\/code> обработва един път.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cro съпоставя пътя на заявката с правилния маршрут, така че <code>/hello<\/code> и <code>/bye<\/code> връщат всеки своя отговор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Както и на теоретичната страница, <code>.start<\/code> се връща незабавно, така че завършващият блок <code>react<\/code> държи програмата жива, докато не натиснете Ctrl-C — тогава <code>whenever signal(SIGINT)<\/code> спира сървъра и прекратява реакцията.<\/span><\/li><\/ol>"]]}}}</script>
