<script type="application/json" id="page-data">{"u":"paradigms/cro/public-apis","n":1404,"k":"topic","pv":"paradigms/cro/client-modules","nx":"paradigms/cro/websockets","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"Fetching from a public API","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The client from the previous page reaches any server on the web, not only your own.<\/span> <span class=\"sg\" data-s=\"1\">Many public APIs reply with JSON, and Cro parses that for you, so <code>.body<\/code> gives back a ready-made data structure rather than text.<\/span> <span class=\"sg\" data-s=\"2\">Here we ask a free weather service for the current temperature in Berlin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">which prints something like:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The exact numbers change with the weather, of course.<\/span> <span class=\"sg\" data-s=\"1\">The two numbers in the URL are geographic coordinates — <code>52.52° N, 13.41° E<\/code> is Berlin — so put your own city's latitude and longitude there to get your local weather.<\/span> <span class=\"sg\" data-s=\"2\">Either way, one request and <code>.body<\/code> (or <code>.body-text<\/code>) gives you the answer — no sockets, no status parsing, no JSON handling by hand.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plain text for the terminal<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON is not the only shape an answer can take.<\/span> <span class=\"sg\" data-s=\"1\">The weather service <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> can serve JSON too, but its speciality is plain text drawn for the terminal — and it decides the format by looking at <strong>who is asking<\/strong>: command-line clients get text, browsers get a web page.<\/span> <span class=\"sg\" data-s=\"2\">Cro lets you set request headers, so introduce yourself as one of the terminal folk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints a one-line weather report, ready for a shell prompt or a status bar:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here the body is plain text, so it is read with <code>.body-text<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Drop the <code>?format=3<\/code> from the URL and the service replies with its full, multi-line ASCII-art weather report instead.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">These examples need Cro installed (<code>zef install cro<\/code>) and a working network connection.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Requests and responses are not the whole story, though.<\/span> <span class=\"sg\" data-s=\"1\">The final topic opens a <strong>WebSocket<\/strong> — a live, two-way channel where the reactive tools of this part get their grand finale.<\/span><\/p>"]]},"de":{"t":"Von einer öffentlichen Schnittstelle abrufen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Client der vorigen Seite erreicht jeden Server im Web, nicht nur Ihren eigenen.<\/span> <span class=\"sg\" data-s=\"1\">Viele öffentliche Schnittstellen antworten mit JSON, und Cro zerlegt das für Sie, <code>.body<\/code> liefert also eine fertige Datenstruktur statt Text.<\/span> <span class=\"sg\" data-s=\"2\">Hier fragen wir einen kostenlosen Wetterdienst nach der aktuellen Temperatur in Berlin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">was etwa dies ausgibt:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die genauen Zahlen ändern sich natürlich mit dem Wetter.<\/span> <span class=\"sg\" data-s=\"1\">Die beiden Zahlen in der URL sind geografische Koordinaten — <code>52.52° N, 13.41° O<\/code> ist Berlin —, setzen Sie also Breite und Länge Ihrer eigenen Stadt ein, um Ihr örtliches Wetter zu bekommen.<\/span> <span class=\"sg\" data-s=\"2\">So oder so geben Ihnen eine Anfrage und <code>.body<\/code> (oder <code>.body-text<\/code>) die Antwort — keine Sockets, kein Zerlegen von Status, kein JSON von Hand.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reiner Text fürs Terminal<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON ist nicht die einzige Gestalt, die eine Antwort annehmen kann.<\/span> <span class=\"sg\" data-s=\"1\">Der Wetterdienst <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> kann auch JSON liefern, doch seine Besonderheit ist reiner, fürs Terminal gezeichneter Text — und er entscheidet über das Format, indem er nachsieht, <strong>wer fragt<\/strong>: Clients auf der Befehlszeile bekommen Text, Browser eine Webseite.<\/span> <span class=\"sg\" data-s=\"2\">Cro lässt Sie Anfrage-Header setzen, stellen Sie sich also als einer vom Terminalvolk vor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt einen einzeiligen Wetterbericht aus, bereit für eine Shell-Eingabezeile oder eine Statusleiste:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist der Rumpf reiner Text, er wird also mit <code>.body-text<\/code> gelesen.<\/span> <span class=\"sg\" data-s=\"1\">Lassen Sie das <code>?format=3<\/code> aus der URL weg, und der Dienst antwortet stattdessen mit seinem vollständigen, mehrzeiligen Wetterbericht in ASCII-Kunst.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Diese Beispiele brauchen Cro installiert (<code>zef install cro<\/code>) und eine funktionierende Netzverbindung.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anfragen und Antworten sind allerdings nicht die ganze Geschichte.<\/span> <span class=\"sg\" data-s=\"1\">Das letzte Thema öffnet einen <strong>WebSocket<\/strong> — einen lebendigen Zweiwegkanal, in dem die reaktiven Werkzeuge dieses Teils ihr großes Finale bekommen.<\/span><\/p>"]]},"nl":{"t":"Ophalen van een openbare API","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De client van de vorige pagina bereikt elke server op het web, niet alleen die van jou.<\/span> <span class=\"sg\" data-s=\"1\">Veel openbare API's antwoorden met JSON, en Cro ontleedt dat voor je, zodat <code>.body<\/code> een kant-en-klare gegevensstructuur teruggeeft in plaats van tekst.<\/span> <span class=\"sg\" data-s=\"2\">Hier vragen we een gratis weerdienst om de huidige temperatuur in Berlijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">wat zoiets afdrukt als:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De precieze getallen veranderen natuurlijk met het weer.<\/span> <span class=\"sg\" data-s=\"1\">De twee getallen in de URL zijn geografische coördinaten — <code>52.52° N, 13.41° O<\/code> is Berlijn — dus zet je eigen breedte- en lengtegraad daar neer om je plaatselijke weer te krijgen.<\/span> <span class=\"sg\" data-s=\"2\">Hoe dan ook geven één verzoek en <code>.body<\/code> (of <code>.body-text<\/code>) je het antwoord — geen sockets, geen statusontleding, geen JSON met de hand afhandelen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kale tekst voor de terminal<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON is niet de enige vorm die een antwoord kan aannemen.<\/span> <span class=\"sg\" data-s=\"1\">De weerdienst <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> kan ook JSON leveren, maar zijn specialiteit is kale tekst die voor de terminal getekend is — en hij bepaalt het formaat door te kijken <strong>wie het vraagt<\/strong>: clients op de opdrachtregel krijgen tekst, browsers krijgen een webpagina.<\/span> <span class=\"sg\" data-s=\"2\">Cro laat je verzoekheaders instellen, dus stel jezelf voor als een van de terminalmensen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt een weerbericht van één regel af, klaar voor een shellprompt of een statusbalk:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is de body kale tekst, dus wordt hij met <code>.body-text<\/code> gelezen.<\/span> <span class=\"sg\" data-s=\"1\">Laat de <code>?format=3<\/code> uit de URL weg en de dienst antwoordt in plaats daarvan met haar volledige weerbericht in ASCII-kunst over meerdere regels.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Deze voorbeelden hebben Cro geïnstalleerd (<code>zef install cro<\/code>) en een werkende netwerkverbinding nodig.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verzoeken en antwoorden zijn echter niet het hele verhaal.<\/span> <span class=\"sg\" data-s=\"1\">Het laatste onderwerp opent een <strong>WebSocket<\/strong> — een levend tweewegkanaal waar de reactieve gereedschappen van dit deel hun grote finale krijgen.<\/span><\/p>"]]},"es":{"t":"Consultar una API pública","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El cliente de la página anterior alcanza cualquier servidor de la web, no solo el tuyo.<\/span> <span class=\"sg\" data-s=\"1\">Muchas API públicas responden con JSON, y Cro lo analiza por ti, de modo que <code>.body<\/code> devuelve una estructura de datos lista para usar en lugar de texto.<\/span> <span class=\"sg\" data-s=\"2\">Aquí le preguntamos a un servicio meteorológico gratuito la temperatura actual en Berlín:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">que imprime algo como:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los números exactos cambian con el tiempo meteorológico, claro.<\/span> <span class=\"sg\" data-s=\"1\">Los dos números de la URL son coordenadas geográficas — <code>52,52° N, 13,41° E<\/code> es Berlín —, así que pon ahí la latitud y la longitud de tu propia ciudad para obtener tu tiempo local.<\/span> <span class=\"sg\" data-s=\"2\">En cualquier caso, una petición y <code>.body<\/code> (o <code>.body-text<\/code>) te dan la respuesta: sin sockets, sin analizar estados, sin manejar JSON a mano.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Texto simple para la terminal<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON no es la única forma que puede tomar una respuesta.<\/span> <span class=\"sg\" data-s=\"1\">El servicio meteorológico <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> también puede servir JSON, pero su especialidad es el texto simple dibujado para la terminal, y decide el formato mirando <strong>quién pregunta<\/strong>: los clientes de línea de órdenes reciben texto, los navegadores reciben una página web.<\/span> <span class=\"sg\" data-s=\"2\">Cro te permite fijar cabeceras de petición, así que preséntate como uno de los de la terminal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime un parte meteorológico de una línea, listo para un prompt del shell o una barra de estado:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí el cuerpo es texto simple, así que se lee con <code>.body-text<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quita el <code>?format=3<\/code> de la URL y el servicio responde en cambio con su parte meteorológico completo, de varias líneas, en arte ASCII.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Estos ejemplos necesitan Cro instalado (<code>zef install cro<\/code>) y una conexión de red que funcione.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las peticiones y las respuestas no son toda la historia, con todo.<\/span> <span class=\"sg\" data-s=\"1\">El apartado final abre un <strong>WebSocket<\/strong>: un canal vivo de dos direcciones donde las herramientas reactivas de esta parte tienen su gran final.<\/span><\/p>"]]},"it":{"t":"Interrogare un'API pubblica","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il client della pagina precedente raggiunge qualunque server sul web, non solo il tuo.<\/span> <span class=\"sg\" data-s=\"1\">Molte API pubbliche rispondono con JSON, e Cro lo analizza per te, quindi <code>.body<\/code> restituisce una struttura dati pronta invece che del testo.<\/span> <span class=\"sg\" data-s=\"2\">Qui chiediamo a un servizio meteo gratuito la temperatura attuale a Berlino:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">che stampa qualcosa come:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I numeri esatti cambiano ovviamente con il tempo.<\/span> <span class=\"sg\" data-s=\"1\">I due numeri nell'URL sono coordinate geografiche — <code>52.52° N, 13.41° E<\/code> è Berlino — quindi metti la latitudine e la longitudine della tua città per avere il tuo meteo locale.<\/span> <span class=\"sg\" data-s=\"2\">In ogni caso, una richiesta e <code>.body<\/code> (oppure <code>.body-text<\/code>) ti danno la risposta: niente socket, nessuna analisi dello stato, nessun JSON a mano.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Testo semplice per il terminale<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON non è l'unica forma che una risposta può assumere.<\/span> <span class=\"sg\" data-s=\"1\">Il servizio meteo <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> sa restituire anche JSON, ma la sua particolarità è il testo semplice disegnato per il terminale — e decide il formato guardando <strong>chi chiede<\/strong>: i client da riga di comando ricevono testo, i browser una pagina web.<\/span> <span class=\"sg\" data-s=\"2\">Cro ti lascia impostare le intestazioni della richiesta, quindi presentati come uno del popolo del terminale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa un bollettino meteo di una riga, pronto per un prompt della shell o per una barra di stato:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui il corpo è testo semplice, quindi si legge con <code>.body-text<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Togli il <code>?format=3<\/code> dall'URL e il servizio risponderà invece con il suo bollettino completo su più righe in arte ASCII.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questi esempi hanno bisogno di Cro installato (<code>zef install cro<\/code>) e di una connessione di rete funzionante.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Richieste e risposte non sono però tutta la storia.<\/span> <span class=\"sg\" data-s=\"1\">L'ultimo argomento apre un <strong>WebSocket<\/strong>: un canale a due vie vivo in cui gli strumenti reattivi di questa parte hanno il loro gran finale.<\/span><\/p>"]]},"ru":{"t":"Запрос к публичному API","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Клиент с предыдущей страницы достаёт любой сервер в вебе, а не только ваш собственный.<\/span> <span class=\"sg\" data-s=\"1\">Многие публичные API отвечают в формате JSON, и Cro разбирает его за вас, так что <code>.body<\/code> возвращает готовую структуру данных, а не текст.<\/span> <span class=\"sg\" data-s=\"2\">Здесь мы спрашиваем у бесплатного погодного сервиса текущую температуру в Берлине:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает что-то вроде:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Точные числа, разумеется, меняются вместе с погодой.<\/span> <span class=\"sg\" data-s=\"1\">Два числа в URL — географические координаты: <code>52,52° с. ш., 13,41° в. д.<\/code> — это Берлин, — так что подставьте туда широту и долготу своего города, чтобы узнать местную погоду.<\/span> <span class=\"sg\" data-s=\"2\">Так или иначе, один запрос и <code>.body<\/code> (или <code>.body-text<\/code>) дают вам ответ: ни сокетов, ни разбора статуса, ни возни с JSON вручную.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Обычный текст для терминала<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON — не единственная форма, которую может принять ответ.<\/span> <span class=\"sg\" data-s=\"1\">Погодный сервис <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> умеет и JSON, но его конёк — обычный текст, нарисованный для терминала, причём формат он выбирает, глядя на то, <strong>кто спрашивает<\/strong>: клиенты командной строки получают текст, браузеры — веб-страницу.<\/span> <span class=\"sg\" data-s=\"2\">Cro позволяет задавать заголовки запроса, так что представьтесь одним из терминальных обитателей:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает однострочную сводку погоды, готовую для приглашения оболочки или строки состояния:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь тело — обычный текст, поэтому читается оно через <code>.body-text<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Уберите из URL <code>?format=3<\/code> — и сервис ответит полной многострочной сводкой, нарисованной ASCII-графикой.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этим примерам нужен установленный Cro (<code>zef install cro<\/code>) и работающая сеть.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Впрочем, запросы и ответы — ещё не вся история.<\/span> <span class=\"sg\" data-s=\"1\">Заключительная тема открывает <strong>WebSocket<\/strong>: живой двусторонний канал, где реактивные инструменты этой части получают своё большое финале.<\/span><\/p>"]]},"uk":{"t":"Отримання даних з публічного API","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Клієнт із попередньої сторінки дістає будь-який сервер у мережі, а не лише ваш власний.<\/span> <span class=\"sg\" data-s=\"1\">Багато публічних API відповідають JSON-ом, і Cro розбирає його за вас, тож <code>.body<\/code> повертає готову структуру даних, а не текст.<\/span> <span class=\"sg\" data-s=\"2\">Тут ми питаємо в безкоштовного погодного сервісу поточну температуру в Берліні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">що друкує щось на кшталт:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Точні числа, звісно, змінюються разом із погодою.<\/span> <span class=\"sg\" data-s=\"1\">Два числа в URL є географічними координатами — <code>52.52° пн. ш., 13.41° сх. д.<\/code> це Берлін, — тож поставте туди широту й довготу власного міста, щоб дізнатися свою місцеву погоду.<\/span> <span class=\"sg\" data-s=\"2\">Хай там як, один запит і <code>.body<\/code> (або <code>.body-text<\/code>) дають вам відповідь — жодних сокетів, жодного розбору стану, жодної ручної роботи з JSON.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звичайний текст для термінала<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON — не єдина форма, якої може набути відповідь.<\/span> <span class=\"sg\" data-s=\"1\">Погодний сервіс <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> вміє віддавати й JSON, але його спеціальність — звичайний текст, намальований для термінала, і формат він вирішує, дивлячись на те, <strong>хто питає<\/strong>: клієнти командного рядка отримують текст, браузери — вебсторінку.<\/span> <span class=\"sg\" data-s=\"2\">Cro дозволяє задавати заголовки запиту, тож відрекомендуйтеся одним із термінального люду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує однорядковий прогноз погоди, готовий для запрошення оболонки чи рядка стану:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут тіло є звичайним текстом, тож його читають через <code>.body-text<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Приберіть <code>?format=3<\/code> з URL — і сервіс відповість натомість своїм повним багаторядковим прогнозом у стилі ASCII-графіки.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цим прикладам потрібен встановлений Cro (<code>zef install cro<\/code>) та робоче мережеве з'єднання.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Утім, запити й відповіді — це ще не вся історія.<\/span> <span class=\"sg\" data-s=\"1\">Остання тема відкриває <strong>WebSocket<\/strong> — живий двобічний канал, у якому реактивні засоби цієї частини отримують свій урочистий фінал.<\/span><\/p>"]]},"bg":{"t":"Извличане от публичен API","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Клиентът от предишната страница достига всеки сървър в мрежата, не само вашия собствен.<\/span> <span class=\"sg\" data-s=\"1\">Много публични API-та отговарят с JSON и Cro го разбира вместо вас, така че <code>.body<\/code> връща готова структура от данни, а не текст.<\/span> <span class=\"sg\" data-s=\"2\">Тук питаме безплатна метеорологична услуга за текущата температура в Берлин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $url = 'https://api.open-meteo.com/v1/forecast'\n        ~ '?latitude=52.52&amp;longitude=13.41&amp;current=temperature_2m,wind_speed_10m';\n\nmy $response = await Cro::HTTP::Client.get($url);\nmy %current  = (await $response.body)&lt;current&gt;;\n\nsay \"Berlin right now:\";\nsay \"  temperature: %current&lt;temperature_2m&gt; °C\";\nsay \"  wind speed:  %current&lt;wind_speed_10m&gt; km/h\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">което отпечатва нещо като:<\/span><\/p>"],["code",0,"<pre><code>Berlin right now:\n  temperature: 21.9 °C\n  wind speed:  8.4 km/h<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Точните числа, разбира се, се менят с времето.<\/span> <span class=\"sg\" data-s=\"1\">Двете числа в URL адреса са географски координати — <code>52.52° с. ш., 13.41° и. д.<\/code> е Берлин, — така че сложете там ширината и дължината на своя град, за да получите местното си време.<\/span> <span class=\"sg\" data-s=\"2\">Така или иначе, една заявка и <code>.body<\/code> (или <code>.body-text<\/code>) ви дават отговора — без сокети, без разбор на състояние, без ръчна работа с JSON.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Обикновен текст за терминала<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">JSON не е единствената форма, която отговорът може да приеме.<\/span> <span class=\"sg\" data-s=\"1\">Метеорологичната услуга <a href=\"https://wttr.in\" target=\"_blank\" rel=\"noopener\">wttr.in<\/a> може да поднася и JSON, но специалността ѝ е обикновен текст, изрисуван за терминал — а форматът решава според това <strong>кой пита<\/strong>: клиентите от командния ред получават текст, браузърите получават уеб страница.<\/span> <span class=\"sg\" data-s=\"2\">Cro ви позволява да задавате заглавки на заявката, така че се представете като един от терминалните хора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Client;\n\nmy $response = await Cro::HTTP::Client.get(\n    'https://wttr.in/Berlin?format=3',\n    headers =&gt; [ User-Agent =&gt; 'curl' ],\n);\nprint await $response.body-text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва едноредова метеорологична справка, готова за подсказка на обвивката или лента за състояние:<\/span><\/p>"],["code",0,"<pre><code>Berlin: 🌤️  +25°C<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук тялото е обикновен текст, така че се чете с <code>.body-text<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Махнете <code>?format=3<\/code> от URL адреса и услугата ще отговори вместо това с пълната си многоредова метеорологична справка в стил ASCII графика.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тези примери се нуждаят от инсталиран Cro (<code>zef install cro<\/code>) и работеща мрежова връзка.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Заявките и отговорите обаче не са цялата история.<\/span> <span class=\"sg\" data-s=\"1\">Последната тема отваря <strong>WebSocket<\/strong> — жив двупосочен канал, в който реактивните средства от тази част получават своя тържествен финал.<\/span><\/p>"]]}}}</script>
