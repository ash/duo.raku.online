<script type="application/json" id="page-data">{"u":"paradigms/cro/what-is-cro","n":1399,"k":"topic","pv":"paradigms/cro","nx":"paradigms/cro/what-is-cro/quiz","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"What is Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro is a set of libraries for building <strong>services<\/strong> — programs that talk to other programs over the network.<\/span> <span class=\"sg\" data-s=\"1\">It is best known for HTTP, but it also handles WebSockets, and it builds everything on the reactive tools from earlier in this part: <a href=\"/paradigms/supplies/\">supplies<\/a>, <code>react<\/code>, and <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A Cro request handler is, at heart, a reaction to a stream of incoming requests.<\/span> <span class=\"sg\" data-s=\"3\">Its home site, with the full documentation and examples, is <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">What Cro gives you over raw sockets:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Routing<\/strong> — map URL paths to the code that handles them, instead of parsing requests by hand.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Request and response objects<\/strong> — read query parameters and send JSON without assembling text.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Concurrency<\/strong> — many clients are served at once, on the thread pool, automatically.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Composability<\/strong> — services are built from small pieces you can test and combine.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You install it from the ecosystem:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro is a big framework with many dependencies, so this takes a few minutes.<\/span> <span class=\"sg\" data-s=\"1\">If the installation stops on a dependency identity it cannot find — an error mentioning something like <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code> — your copy of <code>zef<\/code> is too old to know the archive that serves such historical module identities.<\/span> <span class=\"sg\" data-s=\"2\">Upgrade the installer itself with <code>zef install zef<\/code>, open a fresh terminal, and run the Cro installation again.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro brings the whole course together: object-oriented design for its types, the functional style in its handlers, and the reactive model for its streams of requests.<\/span> <span class=\"sg\" data-s=\"1\">The next topic shows the smallest possible Cro service so you can see how those ideas come together in real web code.<\/span><\/p>"]]},"de":{"t":"Was ist Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro ist eine Sammlung von Bibliotheken, um <strong>Dienste<\/strong> zu bauen — Programme, die über das Netz mit anderen Programmen sprechen.<\/span> <span class=\"sg\" data-s=\"1\">Am bekanntesten ist es für HTTP, es beherrscht aber auch WebSockets, und es baut alles auf den reaktiven Werkzeugen von früher in diesem Teil auf: <a href=\"https://course.raku.org/de/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">Supplies<\/a>, <code>react<\/code> und <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Cro-Anfragebearbeiter ist im Kern eine Reaktion auf einen Strom hereinkommender Anfragen.<\/span> <span class=\"sg\" data-s=\"3\">Seine Heimatseite mit der vollständigen Dokumentation und Beispielen ist <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Was Cro Ihnen gegenüber rohen Sockets gibt:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Routing<\/strong> — URL-Pfade dem Code zuordnen, der sie bearbeitet, statt Anfragen von Hand zu zerlegen.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Anfrage- und Antwortobjekte<\/strong> — Abfrageparameter lesen und JSON senden, ohne Text zusammenzubauen.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Nebenläufigkeit<\/strong> — viele Clients werden zugleich bedient, auf dem Threadpool, ganz von selbst.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Zusammensetzbarkeit<\/strong> — Dienste bestehen aus kleinen Teilen, die Sie prüfen und verbinden können.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie installieren es aus dem Ökosystem:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro ist ein großes Framework mit vielen Abhängigkeiten, das dauert also einige Minuten.<\/span> <span class=\"sg\" data-s=\"1\">Bleibt die Installation an einer Abhängigkeitskennung hängen, die sie nicht finden kann — ein Fehler, der etwas wie <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code> nennt —, ist Ihr <code>zef<\/code> zu alt, um das Archiv zu kennen, das solche historischen Modulkennungen bedient.<\/span> <span class=\"sg\" data-s=\"2\">Bringen Sie den Installierer selbst mit <code>zef install zef<\/code> auf den neuesten Stand, öffnen Sie ein frisches Terminal und starten Sie die Cro-Installation erneut.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro führt den ganzen Kurs zusammen: objektorientierten Entwurf für seine Typen, den funktionalen Stil in seinen Bearbeitern und das reaktive Modell für seine Anfrageströme.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Thema zeigt den kleinstmöglichen Cro-Dienst, damit Sie sehen, wie diese Gedanken in echtem Webcode zusammenkommen.<\/span><\/p>"]]},"nl":{"t":"Wat is Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro is een verzameling bibliotheken om <strong>services<\/strong> te bouwen — programma's die over het netwerk met andere programma's praten.<\/span> <span class=\"sg\" data-s=\"1\">Het is vooral bekend om HTTP, maar het kan ook overweg met WebSockets, en het bouwt alles op de reactieve gereedschappen van eerder in dit deel: <a href=\"https://course.raku.org/nl/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">supplies<\/a>, <code>react<\/code> en <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Een Cro-verzoekafhandelaar is in wezen een reactie op een stroom binnenkomende verzoeken.<\/span> <span class=\"sg\" data-s=\"3\">Zijn thuissite, met de volledige documentatie en voorbeelden, is <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat Cro je boven kale sockets geeft:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Routering<\/strong> — koppel URL-paden aan de code die ze afhandelt, in plaats van verzoeken met de hand te ontleden.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Verzoek- en antwoordobjecten<\/strong> — lees queryparameters en verstuur JSON zonder tekst in elkaar te zetten.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Concurrency<\/strong> — veel clients worden tegelijk bediend, automatisch op de threadpool.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Samenstelbaarheid<\/strong> — services worden gebouwd uit kleine stukken die je kunt testen en combineren.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je installeert het vanuit het ecosysteem:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro is een groot framework met veel afhankelijkheden, dus dit duurt een paar minuten.<\/span> <span class=\"sg\" data-s=\"1\">Als de installatie strandt op een afhankelijkheidsidentiteit die het niet kan vinden — een fout die iets als <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code> noemt — is jouw exemplaar van <code>zef<\/code> te oud om het archief te kennen dat zulke historische module-identiteiten bedient.<\/span> <span class=\"sg\" data-s=\"2\">Werk de installer zelf bij met <code>zef install zef<\/code>, open een verse terminal, en draai de installatie van Cro opnieuw.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro brengt de hele cursus samen: objectgeoriënteerd ontwerp voor zijn typen, de functionele stijl in zijn afhandelaars, en het reactieve model voor zijn stromen verzoeken.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp toont de kleinst mogelijke Cro-service zodat je kunt zien hoe die ideeën in echte webcode samenkomen.<\/span><\/p>"]]},"es":{"t":"Qué es Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro es un conjunto de bibliotecas para construir <strong>servicios<\/strong>: programas que hablan con otros programas por la red.<\/span> <span class=\"sg\" data-s=\"1\">Es más conocido por HTTP, pero también maneja WebSockets, y lo construye todo sobre las herramientas reactivas de antes en esta parte: los <a href=\"https://course.raku.org/es/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">supplies<\/a>, <code>react<\/code> y <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un manejador de peticiones de Cro es, en el fondo, una reacción a un flujo de peticiones entrantes.<\/span> <span class=\"sg\" data-s=\"3\">Su sitio oficial, con la documentación completa y ejemplos, es <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo que Cro te da frente a los sockets en crudo:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Encaminamiento<\/strong> — asocia rutas de URL al código que las atiende, en lugar de analizar peticiones a mano.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Objetos de petición y respuesta<\/strong> — lee parámetros de consulta y envía JSON sin montar texto.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Concurrencia<\/strong> — se atiende a muchos clientes a la vez, en el pool de hilos, automáticamente.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Componibilidad<\/strong> — los servicios se construyen a partir de piezas pequeñas que puedes probar y combinar.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se instala desde el ecosistema:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro es un framework grande con muchas dependencias, así que esto tarda unos minutos.<\/span> <span class=\"sg\" data-s=\"1\">Si la instalación se detiene en una identidad de dependencia que no encuentra — un error que menciona algo como <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code> —, tu copia de <code>zef<\/code> es demasiado antigua para conocer el archivo que sirve esas identidades históricas de módulos.<\/span> <span class=\"sg\" data-s=\"2\">Actualiza el propio instalador con <code>zef install zef<\/code>, abre una terminal nueva y vuelve a ejecutar la instalación de Cro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro reúne el curso entero: diseño orientado a objetos para sus tipos, el estilo funcional en sus manejadores y el modelo reactivo para sus flujos de peticiones.<\/span> <span class=\"sg\" data-s=\"1\">El apartado siguiente muestra el servicio Cro más pequeño posible para que veas cómo se juntan esas ideas en código web real.<\/span><\/p>"]]},"it":{"t":"Che cos'è Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro è una raccolta di librerie per costruire <strong>servizi<\/strong>: programmi che parlano con altri programmi attraverso la rete.<\/span> <span class=\"sg\" data-s=\"1\">È noto soprattutto per HTTP, ma sa anche i WebSocket, e costruisce tutto sugli strumenti reattivi visti prima in questa parte: i <a href=\"https://course.raku.org/it/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">supply<\/a>, <code>react<\/code> e <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un gestore di richieste Cro è in sostanza una reazione a un flusso di richieste in arrivo.<\/span> <span class=\"sg\" data-s=\"3\">La sua pagina principale, con la documentazione completa e gli esempi, è <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ciò che Cro ti dà rispetto ai socket grezzi:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Instradamento<\/strong> — associare i percorsi degli URL al codice che li gestisce, invece di analizzare le richieste a mano.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Oggetti richiesta e risposta<\/strong> — leggere i parametri di query e inviare JSON senza mettere insieme del testo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Concorrenza<\/strong> — molti client vengono serviti insieme, sul pool di thread, da sé.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Componibilità<\/strong> — i servizi sono fatti di piccoli pezzi che puoi mettere alla prova e collegare.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo installi dall'ecosistema:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro è un framework grande con molte dipendenze, quindi ci vogliono alcuni minuti.<\/span> <span class=\"sg\" data-s=\"1\">Se l'installazione si impunta su un identificatore di dipendenza che non riesce a trovare — un errore che nomina qualcosa come <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code> — il tuo <code>zef<\/code> è troppo vecchio per conoscere l'archivio che serve quegli identificatori storici di modulo.<\/span> <span class=\"sg\" data-s=\"2\">Aggiorna l'installatore stesso con <code>zef install zef<\/code>, apri un terminale fresco e riavvia l'installazione di Cro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro tira insieme tutto il corso: il progetto a oggetti per i suoi tipi, lo stile funzionale nei suoi gestori e il modello reattivo per i suoi flussi di richieste.<\/span> <span class=\"sg\" data-s=\"1\">L'argomento successivo mostra il più piccolo servizio Cro possibile, così che tu veda come queste idee si incontrano in codice web vero.<\/span><\/p>"]]},"ru":{"t":"Что такое Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro — это набор библиотек для создания <strong>сервисов<\/strong>, то есть программ, которые общаются с другими программами по сети.<\/span> <span class=\"sg\" data-s=\"1\">Более всего он известен по HTTP, но умеет и WebSocket, и всё это построено на реактивных инструментах из этой же части: <a href=\"https://course.raku.org/ru/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">supply<\/a>, <code>react<\/code> и <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Обработчик запроса в Cro по сути и есть реакция на поток входящих запросов.<\/span> <span class=\"sg\" data-s=\"3\">Домашний сайт проекта с полной документацией и примерами — <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Что Cro даёт вам сверх «сырых» сокетов:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Маршрутизация<\/strong> — сопоставляет пути URL с кодом, который их обрабатывает, вместо разбора запросов вручную.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Объекты запроса и ответа<\/strong> — позволяют читать параметры запроса и отправлять JSON, не собирая текст по кусочкам.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Конкурентность<\/strong> — множество клиентов обслуживается одновременно, на пуле потоков, автоматически.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Композируемость<\/strong> — сервисы собираются из небольших частей, которые можно тестировать и сочетать.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Устанавливается он из экосистемы:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro — большой фреймворк со множеством зависимостей, поэтому установка занимает несколько минут.<\/span> <span class=\"sg\" data-s=\"1\">Если она останавливается на идентификаторе зависимости, который не удаётся найти, — с ошибкой, упоминающей что-то вроде <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code>, — значит, ваш <code>zef<\/code> слишком стар и не знает архива, который обслуживает такие исторические идентификаторы модулей.<\/span> <span class=\"sg\" data-s=\"2\">Обновите сам установщик командой <code>zef install zef<\/code>, откройте новый терминал и запустите установку Cro заново.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro сводит воедино весь курс: объектно-ориентированное проектирование для его типов, функциональный стиль в обработчиках и реактивную модель для потоков запросов.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема показывает минимально возможный сервис на Cro, чтобы вы увидели, как эти идеи сходятся в настоящем веб-коде.<\/span><\/p>"]]},"uk":{"t":"Що таке Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro — це набір бібліотек для побудови <strong>сервісів<\/strong>, тобто програм, що спілкуються з іншими програмами через мережу.<\/span> <span class=\"sg\" data-s=\"1\">Найбільше він відомий завдяки HTTP, але вміє й WebSockets, і будує все на реактивних засобах із попередніх розділів цієї частини: <a href=\"https://course.raku.org/uk/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">потоках значень<\/a>, <code>react<\/code> та <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Обробник запиту в Cro є, по суті, реакцією на потік вхідних запитів.<\/span> <span class=\"sg\" data-s=\"3\">Його домівка з повною документацією та прикладами — <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що Cro дає вам понад сирі сокети:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Маршрутизація<\/strong> — відображення шляхів URL на код, що їх обробляє, замість розбору запитів вручну.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Об'єкти запиту та відповіді<\/strong> — читання параметрів запиту й надсилання JSON без збирання тексту.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Конкурентність<\/strong> — багато клієнтів обслуговуються водночас, у пулі потоків, автоматично.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Компонованість<\/strong> — сервіси будують із невеликих частин, які можна тестувати й поєднувати.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Встановлюють його з екосистеми:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro — великий фреймворк із багатьма залежностями, тож це забирає кілька хвилин.<\/span> <span class=\"sg\" data-s=\"1\">Якщо встановлення спиниться на ідентичності залежності, якої воно не може знайти, — з помилкою, що згадує щось на кшталт <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code>, — ваш примірник <code>zef<\/code> застарий, щоб знати архів, який обслуговує такі історичні ідентичності модулів.<\/span> <span class=\"sg\" data-s=\"2\">Оновіть сам встановлювач через <code>zef install zef<\/code>, відкрийте свіжий термінал і запустіть встановлення Cro знову.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro зводить увесь курс докупи: об'єктноорієнтоване проєктування для його типів, функційний стиль у його обробниках і реактивну модель для його потоків запитів.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема показує найменший можливий сервіс на Cro, щоб ви побачили, як ці ідеї сходяться в справжньому вебкоді.<\/span><\/p>"]]},"bg":{"t":"Какво е Cro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cro е набор от библиотеки за изграждане на <strong>услуги<\/strong> — програми, които говорят с други програми по мрежата.<\/span> <span class=\"sg\" data-s=\"1\">Най-известна е с HTTP, но се справя и с WebSockets, а всичко изгражда върху реактивните средства от по-рано в тази част: <a href=\"https://course.raku.org/bg/paradigms/supplies/\" target=\"_blank\" rel=\"noopener\">потоците от стойности<\/a>, <code>react<\/code> и <code>whenever<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Обработчикът на заявки в Cro по същество е реакция на поток от входящи заявки.<\/span> <span class=\"sg\" data-s=\"3\">Домашната ѝ страница с пълната документация и примери е <a href=\"https://cro.services\" target=\"_blank\" rel=\"noopener\">cro.services<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво ви дава Cro в сравнение със суровите сокети:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><strong>Маршрутизиране<\/strong> — съпоставя пътища на URL адреси с кода, който ги обработва, вместо да разбирате заявките на ръка.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><strong>Обекти за заявка и отговор<\/strong> — четете параметри на заявката и изпращате JSON, без да сглобявате текст.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><strong>Паралелност<\/strong> — много клиенти се обслужват наведнъж, върху пула от нишки, автоматично.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><strong>Компонуемост<\/strong> — услугите се изграждат от малки части, които можете да тествате и съчетавате.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Инсталира се от екосистемата:<\/span><\/p>"],["code",0,"<pre><code>zef install cro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro е голяма рамка с много зависимости, така че това отнема няколко минути.<\/span> <span class=\"sg\" data-s=\"1\">Ако инсталацията спре на идентичност на зависимост, която не може да намери — грешка, споменаваща нещо като <code>JSON::Fast:ver&lt;0.19+&gt;:auth&lt;cpan:TIMOTIMO&gt;<\/code>, — вашето копие на <code>zef<\/code> е твърде старо, за да познава архива, който обслужва такива исторически идентичности на модули.<\/span> <span class=\"sg\" data-s=\"2\">Обновете самия инсталатор с <code>zef install zef<\/code>, отворете нов терминал и пуснете инсталацията на Cro отново.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cro събира целия курс накуп: обектно-ориентирано проектиране за типовете си, функционален стил в обработчиците си и реактивния модел за потоците си от заявки.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема показва най-малката възможна услуга на Cro, за да видите как тези идеи се събират в истински уеб код.<\/span><\/p>"]]}}}</script>
