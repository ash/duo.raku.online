<script type="application/json" id="page-data">{"u":"paradigms/cro/client-modules","n":1403,"k":"topic","pv":"paradigms/cro/route-with-parameter","nx":"paradigms/cro/public-apis","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"Using a client module","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro is not only for building services — it also ships an HTTP <strong>client<\/strong> for making requests.<\/span> <span class=\"sg\" data-s=\"1\">The clearest way to meet it is to point it at the very server you built on the previous page.<\/span> <span class=\"sg\" data-s=\"2\">Here both halves run in one program: we start the service, then call it ourselves.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# the tiny service from the previous page\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# now be the client and call it\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> returns a promise — fitting, since a network request finishes later — so you <code>await<\/code> it.<\/span> <span class=\"sg\" data-s=\"1\">The response object knows its status, headers, and body; <code>await $response.body-text<\/code> hands back the text the server sent, <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Compare this with the raw socket of the <a href=\"/paradigms/connections/sending-receiving/\">connections section<\/a>: there is no <code>\\r\\n<\/code>, no status line to parse, no reading in a loop — the client and the server speak to each other in a few plain lines.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">This example needs Cro installed (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">When the page is not there<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">What if you ask for a path the service does not have?<\/span> <span class=\"sg\" data-s=\"1\">The server side is easy: a request that matches no route gets a <code>404 Not Found<\/code> from Cro automatically.<\/span> <span class=\"sg\" data-s=\"2\">On the client side, a failed request <strong>throws<\/strong> — the error travels with the promise and pops out at <code>await<\/code>, just as you saw with <a href=\"/paradigms/await/awaiting-promises/\">broken promises<\/a> — so you handle it with the usual exception tools:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Our service has a <code>hello<\/code> route but no <code>goodbye<\/code>, so this prints <code>Request failed with status 404<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The exception carries the full response in its <code>.response<\/code>, with the status code and headers there to inspect.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Your own service is just the nearest server there is, though.<\/span> <span class=\"sg\" data-s=\"1\">The next page points the same client at the wider web — <strong>public APIs<\/strong> that answer with JSON or terminal-ready text.<\/span><\/p>"]]},"de":{"t":"Ein Clientmodul verwenden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro ist nicht nur zum Bauen von Diensten da — es liefert auch einen HTTP-<strong>Client<\/strong> zum Stellen von Anfragen.<\/span> <span class=\"sg\" data-s=\"1\">Am klarsten lernen Sie ihn kennen, indem Sie ihn auf genau den Server richten, den Sie auf der vorigen Seite gebaut haben.<\/span> <span class=\"sg\" data-s=\"2\">Hier laufen beide Hälften in einem Programm: Wir starten den Dienst und rufen ihn dann selbst auf.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# the tiny service from the previous page\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# now be the client and call it\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> liefert ein Promise — passend, denn eine Netzanfrage wird später fertig —, Sie <code>await<\/code>-en es also.<\/span> <span class=\"sg\" data-s=\"1\">Das Antwortobjekt kennt seinen Status, seine Header und seinen Rumpf; <code>await $response.body-text<\/code> reicht den Text zurück, den der Server gesendet hat, <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vergleichen Sie das mit dem rohen Socket aus dem <a href=\"https://course.raku.org/de/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Verbindungen<\/a>: kein <code>\\r\\n<\/code>, keine zu zerlegende Statuszeile, kein Lesen in einer Schleife — Client und Server sprechen in wenigen schlichten Zeilen miteinander.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dieses Beispiel braucht Cro installiert (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wenn die Seite nicht da ist<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Was, wenn Sie nach einem Pfad fragen, den der Dienst nicht hat?<\/span> <span class=\"sg\" data-s=\"1\">Die Serverseite ist einfach: Eine Anfrage, die auf keine Route trifft, bekommt von Cro automatisch ein <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Auf der Clientseite <strong>wirft<\/strong> eine fehlgeschlagene Anfrage — der Fehler reist mit dem Promise mit und tritt beim <code>await<\/code> hervor, genau wie Sie es bei <a href=\"https://course.raku.org/de/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">gebrochenen Promises<\/a> gesehen haben —, Sie behandeln ihn also mit den gewohnten Ausnahmewerkzeugen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unser Dienst hat eine Route <code>hello<\/code>, aber kein <code>goodbye<\/code>, das gibt also <code>Request failed with status 404<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Die Ausnahme trägt die vollständige Antwort in ihrem <code>.response<\/code> mit sich, mit Statuscode und Headern zum Nachsehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ihr eigener Dienst ist allerdings nur der nächstgelegene Server.<\/span> <span class=\"sg\" data-s=\"1\">Die nächste Seite richtet denselben Client auf das weite Web — <strong>öffentliche Schnittstellen<\/strong>, die mit JSON oder terminaltauglichem Text antworten.<\/span><\/p>"]]},"nl":{"t":"Een clientmodule gebruiken","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro is niet alleen om services te bouwen — het levert ook een HTTP-<strong>client<\/strong> om verzoeken te doen.<\/span> <span class=\"sg\" data-s=\"1\">De duidelijkste manier om die te ontmoeten is hem op precies de server richten die je op de vorige pagina gebouwd hebt.<\/span> <span class=\"sg\" data-s=\"2\">Hier draaien beide helften in één programma: we starten de service en roepen haar daarna zelf aan.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# the tiny service from the previous page\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# now be the client and call it\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> geeft een promise terug — passend, aangezien een netwerkverzoek later klaar is — dus <code>await<\/code> je haar.<\/span> <span class=\"sg\" data-s=\"1\">Het antwoordobject kent zijn status, headers en body; <code>await $response.body-text<\/code> overhandigt de tekst die de server verstuurde, <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vergelijk dit met de kale socket uit de <a href=\"https://course.raku.org/nl/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">sectie over verbindingen<\/a>: er is geen <code>\\r\\n<\/code>, geen statusregel om te ontleden, geen lezen in een lus — de client en de server praten in een paar simpele regels met elkaar.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dit voorbeeld heeft Cro geïnstalleerd nodig (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wanneer de pagina er niet is<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wat als je om een pad vraagt dat de service niet heeft?<\/span> <span class=\"sg\" data-s=\"1\">De serverkant is eenvoudig: een verzoek dat met geen enkele route matcht, krijgt automatisch een <code>404 Not Found<\/code> van Cro.<\/span> <span class=\"sg\" data-s=\"2\">Aan de clientkant <strong>werpt<\/strong> een mislukt verzoek — de fout reist met de promise mee en komt bij <code>await<\/code> naar buiten, precies zoals je bij <a href=\"https://course.raku.org/nl/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">verbroken promises<\/a> zag — dus handel je haar met de gewone exceptiegereedschappen af:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Onze service heeft een route <code>hello<\/code> maar geen <code>goodbye<\/code>, dus drukt dit <code>Request failed with status 404<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">De exceptie draagt het volledige antwoord mee in haar <code>.response<\/code>, met de statuscode en de headers klaar om te bekijken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je eigen service is echter alleen de dichtstbijzijnde server die er is.<\/span> <span class=\"sg\" data-s=\"1\">De volgende pagina richt dezelfde client op het bredere web — <strong>openbare API's<\/strong> die met JSON of terminalklare tekst antwoorden.<\/span><\/p>"]]},"es":{"t":"Usar un módulo cliente","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro no sirve solo para construir servicios: también trae un <strong>cliente<\/strong> HTTP para hacer peticiones.<\/span> <span class=\"sg\" data-s=\"1\">La manera más clara de conocerlo es apuntarlo al mismísimo servidor que construiste en la página anterior.<\/span> <span class=\"sg\" data-s=\"2\">Aquí las dos mitades corren en un solo programa: arrancamos el servicio y después lo llamamos nosotros mismos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# the tiny service from the previous page\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# now be the client and call it\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> devuelve una promesa — apropiado, ya que una petición de red termina más tarde —, así que la esperas con <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El objeto de respuesta conoce su estado, sus cabeceras y su cuerpo; <code>await $response.body-text<\/code> devuelve el texto que envió el servidor, <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Compara esto con el socket en crudo de la <a href=\"https://course.raku.org/es/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">sección de conexiones<\/a>: no hay <code>\\r\\n<\/code>, ni línea de estado que analizar, ni lectura en un bucle; el cliente y el servidor se hablan en unas pocas líneas sencillas.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Este ejemplo necesita Cro instalado (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cuando la página no está<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">¿Y si pides una ruta que el servicio no tiene?<\/span> <span class=\"sg\" data-s=\"1\">El lado del servidor es fácil: una petición que no coincide con ninguna ruta recibe automáticamente un <code>404 Not Found<\/code> de Cro.<\/span> <span class=\"sg\" data-s=\"2\">En el lado del cliente, una petición fallida <strong>lanza<\/strong> una excepción — el error viaja con la promesa y sale a la luz en el <code>await<\/code>, igual que viste con las <a href=\"https://course.raku.org/es/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">promesas rotas<\/a> —, así que la manejas con las herramientas de excepciones de siempre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nuestro servicio tiene una ruta <code>hello<\/code> pero ninguna <code>goodbye<\/code>, así que esto imprime <code>Request failed with status 404<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La excepción lleva la respuesta completa en su <code>.response<\/code>, con el código de estado y las cabeceras ahí para inspeccionarlos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tu propio servicio, con todo, no es más que el servidor que tienes más cerca.<\/span> <span class=\"sg\" data-s=\"1\">La página siguiente apunta el mismo cliente a la web más amplia: <strong>API públicas<\/strong> que responden con JSON o con texto listo para la terminal.<\/span><\/p>"]]},"it":{"t":"Usare un modulo client","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro non serve solo a costruire servizi: fornisce anche un <strong>client<\/strong> HTTP per fare richieste.<\/span> <span class=\"sg\" data-s=\"1\">Il modo più chiaro di conoscerlo è puntarlo esattamente sul server che hai costruito nella pagina precedente.<\/span> <span class=\"sg\" data-s=\"2\">Qui entrambe le metà girano in un unico programma: avviamo il servizio e poi lo chiamiamo noi stessi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# the tiny service from the previous page\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# now be the client and call it\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> restituisce una promise — il che è appropriato, dato che una richiesta di rete finisce più tardi — quindi la <code>await<\/code>-i.<\/span> <span class=\"sg\" data-s=\"1\">L'oggetto risposta conosce il proprio stato, le proprie intestazioni e il proprio corpo; <code>await $response.body-text<\/code> restituisce il testo che il server ha inviato, <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Confrontalo con il socket grezzo della <a href=\"https://course.raku.org/it/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">sezione sulle connessioni<\/a>: niente <code>\\r\\n<\/code>, nessuna riga di stato da analizzare, nessuna lettura in un ciclo — client e server si parlano in poche righe semplici.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questo esempio ha bisogno di Cro installato (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando la pagina non c'è<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">E se chiedi un percorso che il servizio non ha?<\/span> <span class=\"sg\" data-s=\"1\">Il lato server è semplice: una richiesta che non corrisponde ad alcuna rotta riceve automaticamente da Cro un <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dal lato client, una richiesta fallita <strong>solleva un'eccezione<\/strong> — l'errore viaggia insieme alla promise e salta fuori all'<code>await<\/code>, esattamente come hai visto per le <a href=\"https://course.raku.org/it/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">promise rotte<\/a> — quindi la gestisci con i soliti strumenti per le eccezioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il nostro servizio ha una rotta <code>hello<\/code> ma nessuna <code>goodbye<\/code>, quindi questo stampa <code>Request failed with status 404<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'eccezione porta con sé la risposta completa nel suo <code>.response<\/code>, con il codice di stato e le intestazioni da consultare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il tuo servizio, però, è solo il server più vicino.<\/span> <span class=\"sg\" data-s=\"1\">La pagina successiva punta lo stesso client sul web aperto: <strong>API pubbliche<\/strong> che rispondono con JSON o con testo adatto al terminale.<\/span><\/p>"]]},"ru":{"t":"Использование клиентского модуля","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro нужен не только для создания сервисов — в его составе есть и HTTP-<strong>клиент<\/strong> для отправки запросов.<\/span> <span class=\"sg\" data-s=\"1\">Понятнее всего познакомиться с ним, направив его на тот самый сервер, который вы построили на предыдущей странице.<\/span> <span class=\"sg\" data-s=\"2\">Здесь обе половины работают в одной программе: мы запускаем сервис, а затем сами же его вызываем.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# крошечный сервис с предыдущей страницы\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# а теперь побудем клиентом и вызовем его\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> возвращает промис — что уместно, ведь сетевой запрос завершается позже, — поэтому его дожидаются через <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Объект ответа знает свой статус, заголовки и тело; <code>await $response.body-text<\/code> отдаёт текст, отправленный сервером, — <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сравните это с «сырым» сокетом из <a href=\"https://course.raku.org/ru/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">раздела о соединениях<\/a>: ни <code>\\r\\n<\/code>, ни строки состояния для разбора, ни чтения в цикле — клиент и сервер общаются в несколько простых строк.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этому примеру нужен установленный Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Когда страницы нет<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">А что, если запросить путь, которого у сервиса нет?<\/span> <span class=\"sg\" data-s=\"1\">На стороне сервера всё просто: запрос, не подошедший ни одному маршруту, автоматически получает от Cro <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На стороне клиента неудавшийся запрос <strong>бросает<\/strong> исключение — ошибка путешествует вместе с промисом и выныривает на <code>await<\/code>, как вы видели у <a href=\"https://course.raku.org/ru/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">сломанных промисов<\/a>, — так что обрабатывают её обычными средствами работы с исключениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В нашем сервисе есть маршрут <code>hello<\/code>, но нет <code>goodbye<\/code>, поэтому программа печатает <code>Request failed with status 404<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Исключение несёт полный ответ в своём <code>.response<\/code>, где можно изучить и код состояния, и заголовки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Впрочем, ваш собственный сервис — лишь ближайший из существующих серверов.<\/span> <span class=\"sg\" data-s=\"1\">На следующей странице тот же клиент направляется в большой веб — к <strong>публичным API<\/strong>, которые отвечают JSON или готовым для терминала текстом.<\/span><\/p>"]]},"uk":{"t":"Використання клієнтського модуля","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro призначений не лише для побудови сервісів — він постачає також HTTP-<strong>клієнт<\/strong> для надсилання запитів.<\/span> <span class=\"sg\" data-s=\"1\">Найзрозуміліший спосіб із ним познайомитися — спрямувати його на той самий сервер, який ви збудували на попередній сторінці.<\/span> <span class=\"sg\" data-s=\"2\">Тут обидві половини працюють в одній програмі: ми запускаємо сервіс, а потім самі його викликаємо.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# крихітний сервіс із попередньої сторінки\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# а тепер побудьмо клієнтом і викличмо його\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> повертає обіцянку — і це доречно, бо мережевий запит завершується пізніше, — тож ви робите <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Об'єкт відповіді знає свій стан, заголовки й тіло; <code>await $response.body-text<\/code> повертає текст, який надіслав сервер, — <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Порівняйте це із сирим сокетом із <a href=\"https://course.raku.org/uk/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">розділу про з'єднання<\/a>: жодного <code>\\r\\n<\/code>, жодного рядка стану для розбору, жодного читання в циклі — клієнт і сервер говорять одне з одним кількома простими рядками.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цьому прикладові потрібен встановлений Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коли сторінки немає<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">А що, як попросити шлях, якого сервіс не має?<\/span> <span class=\"sg\" data-s=\"1\">На боці сервера все просто: запит, що не збігається з жодним маршрутом, отримує від Cro <code>404 Not Found<\/code> автоматично.<\/span> <span class=\"sg\" data-s=\"2\">На боці клієнта невдалий запит <strong>кидає виняток<\/strong> — помилка мандрує разом з обіцянкою й вискакує на <code>await<\/code>, точно як ви бачили зі <a href=\"https://course.raku.org/uk/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">зламаними обіцянками<\/a>, — тож обробляєте ви її звичними засобами для винятків:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наш сервіс має маршрут <code>hello<\/code>, але не має <code>goodbye<\/code>, тож це друкує <code>Request failed with status 404<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Виняток несе повну відповідь у своєму <code>.response<\/code>, де є код стану та заголовки, готові до огляду.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Утім, ваш власний сервіс — це лише найближчий сервер, який тільки є. Наступна сторінка спрямовує той самий клієнт на ширший вебпростір — на <strong>публічні API<\/strong>, що відповідають JSON-ом або готовим до термінала текстом.<\/span><\/p>"]]},"bg":{"t":"Използване на клиентски модул","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cro не служи само за изграждане на услуги — тя доставя и HTTP <strong>клиент<\/strong> за правене на заявки.<\/span> <span class=\"sg\" data-s=\"1\">Най-ясният начин да се запознаете с него е да го насочите точно към сървъра, който изградихте на предишната страница.<\/span> <span class=\"sg\" data-s=\"2\">Тук двете половини вървят в една програма: стартираме услугата и после сами я извикваме.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\nuse Cro::HTTP::Client;\n\n# мъничката услуга от предишната страница\nmy $application = route {\n    get -&gt; 'hello' { content 'text/plain', 'Hello from Cro!'; }\n}\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'), :port(8080), :application($application),\n);\n$server.start;\n\n# а сега да бъдем клиент и да я извикаме\nmy $response = await Cro::HTTP::Client.get('http://127.0.0.1:8080/hello');\nsay await $response.body-text; # Hello from Cro!\n\n$server.stop;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Cro::HTTP::Client.get<\/code> връща обещание — което е уместно, защото мрежовата заявка приключва по-късно, — така че правите <code>await<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обектът на отговора знае състоянието си, заглавките и тялото си; <code>await $response.body-text<\/code> връща текста, който сървърът е изпратил — <code>Hello from Cro!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сравнете това със суровия сокет от <a href=\"https://course.raku.org/bg/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">раздела за връзките<\/a>: никакви <code>\\r\\n<\/code>, никакъв ред за състояние за разбор, никакво четене в цикъл — клиентът и сървърът си говорят с няколко прости реда.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Този пример се нуждае от инсталиран Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Когато страницата я няма<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ами ако поискате път, който услугата няма?<\/span> <span class=\"sg\" data-s=\"1\">Откъм сървъра е просто: заявка, която не съвпада с никакъв маршрут, получава от Cro <code>404 Not Found<\/code> автоматично.<\/span> <span class=\"sg\" data-s=\"2\">Откъм клиента неуспешната заявка <strong>хвърля изключение<\/strong> — грешката пътува заедно с обещанието и изскача при <code>await<\/code>, точно както видяхте при <a href=\"https://course.raku.org/bg/paradigms/await/awaiting-promises/\" target=\"_blank\" rel=\"noopener\">счупените обещания<\/a>, — така че я обработвате с обичайните средства за изключения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $response = try await Cro::HTTP::Client.get('http://127.0.0.1:8080/goodbye');\nif $! {\n    say 'Request failed with status ', $!.response.status; # 404\n}\nelse {\n    say await $response.body-text;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Нашата услуга има маршрут <code>hello<\/code>, но няма <code>goodbye<\/code>, така че това отпечатва <code>Request failed with status 404<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Изключението носи пълния отговор в своя <code>.response<\/code>, където са кодът на състоянието и заглавките, готови за разглеждане.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вашата собствена услуга обаче е просто най-близкият сървър, който изобщо има.<\/span> <span class=\"sg\" data-s=\"1\">Следващата страница насочва същия клиент към по-широката мрежа — към <strong>публични API-та<\/strong>, които отговарят с JSON или с готов за терминал текст.<\/span><\/p>"]]}}}</script>
