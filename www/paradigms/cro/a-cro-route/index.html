<script type="application/json" id="page-data">{"u":"paradigms/cro/a-cro-route","n":1401,"k":"topic","pv":"paradigms/cro/what-is-cro/quiz","nx":"paradigms/cro/route-with-parameter","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"A Cro route","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A Cro HTTP service is described by a set of <em>routes<\/em>: each route says which URL it handles and what to return.<\/span> <span class=\"sg\" data-s=\"1\">You build them inside a <code>route<\/code> block with the <code>get<\/code> keyword:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Read the route as “a <code>GET<\/code> request for the path <code>hello<\/code> returns the text <code>Hello from Cro!<\/code>”.<\/span> <span class=\"sg\" data-s=\"1\">The <code>content<\/code> function sets both the content type and the body — no manual status lines or <code>\\r\\n<\/code> in sight.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> ties the routes to an address and port, and <code>.start<\/code> begins serving.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One subtlety: <code>.start<\/code> does <strong>not<\/strong> block — it starts the service on background threads and returns at once, and if the program simply ended there, the server would vanish with it.<\/span> <span class=\"sg\" data-s=\"1\">The closing <code>react<\/code> block is what keeps the program alive, and it is an old friend: <code>whenever signal(SIGINT)<\/code> reacts to the interrupt signal (Ctrl-C on the keyboard) by stopping the server and calling <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The reactive tools from earlier in this part are exactly how a Cro program waits, serves, and shuts down cleanly.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">This example needs Cro installed (<code>zef install cro<\/code>). Run it, open <code>http://127.0.0.1:8080/hello<\/code>, and stop the server with Ctrl-C when you are done.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Do not worry if the server occasionally prints <code>Cannot write to a closed socket<\/code> while you browse. That is not a bug in your code: a client — typically a browser — opened a connection and dropped it before reading the reply, as browsers routinely do with speculative or cancelled requests. Cro notes the vanished client, and the server keeps serving.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A route can take URL segments as parameters, return JSON, and much more, but the shape is always this: declare what each path does, hand the routes to a server, and start it.<\/span> <span class=\"sg\" data-s=\"1\">Compared with the raw socket server of the previous section, Cro removes all the protocol bookkeeping and lets you write only the part that is specific to your service.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This route always says the same thing, though.<\/span> <span class=\"sg\" data-s=\"1\">The next page lets a route read a <strong>parameter<\/strong> from the URL, so a single route can greet <code>/hello/Anna<\/code> and <code>/hello/Bob<\/code> differently.<\/span><\/p>"]]},"de":{"t":"Eine Cro-Route","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Cro-HTTP-Dienst wird durch eine Reihe von <em>Routen<\/em> beschrieben: Jede Route sagt, welche URL sie bearbeitet und was sie liefert.<\/span> <span class=\"sg\" data-s=\"1\">Sie bauen sie in einem <code>route<\/code>-Block mit dem Schlüsselwort <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie die Route als „eine <code>GET<\/code>-Anfrage nach dem Pfad <code>hello<\/code> liefert den Text <code>Hello from Cro!<\/code>“.<\/span> <span class=\"sg\" data-s=\"1\">Die Funktion <code>content<\/code> setzt zugleich den Inhaltstyp und den Rumpf — keine handgeschriebenen Statuszeilen und kein <code>\\r\\n<\/code> weit und breit.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> bindet die Routen an eine Adresse und einen Port, und <code>.start<\/code> beginnt zu bedienen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Feinheit: <code>.start<\/code> blockiert <strong>nicht<\/strong> — es startet den Dienst auf Hintergrundthreads und kehrt sofort zurück, und würde das Programm dort schlicht enden, verschwände der Server mit ihm.<\/span> <span class=\"sg\" data-s=\"1\">Der abschließende <code>react<\/code>-Block ist es, der das Programm am Leben hält, und er ist ein alter Bekannter: <code>whenever signal(SIGINT)<\/code> reagiert auf das Unterbrechungssignal (Strg-C auf der Tastatur), indem es den Server anhält und <code>done<\/code> aufruft.<\/span> <span class=\"sg\" data-s=\"2\">Die reaktiven Werkzeuge von früher in diesem Teil sind genau das, womit ein Cro-Programm wartet, bedient und sauber herunterfährt.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dieses Beispiel braucht Cro installiert (<code>zef install cro<\/code>). Führen Sie es aus, öffnen Sie <code>http://127.0.0.1:8080/hello<\/code> und halten Sie den Server mit Strg-C an, wenn Sie fertig sind.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Machen Sie sich nichts daraus, wenn der Server beim Stöbern gelegentlich <code>Cannot write to a closed socket<\/code> ausgibt. Das ist kein Fehler in Ihrem Code: Ein Client — meist ein Browser — hat eine Verbindung geöffnet und fallen lassen, bevor er die Antwort las, wie Browser es bei spekulativen oder abgebrochenen Anfragen regelmäßig tun. Cro vermerkt den verschwundenen Client, und der Server bedient weiter.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Route kann URL-Abschnitte als Parameter aufnehmen, JSON liefern und vieles mehr, doch die Gestalt ist stets diese: erklären, was jeder Pfad tut, die Routen einem Server übergeben und ihn starten.<\/span> <span class=\"sg\" data-s=\"1\">Verglichen mit dem rohen Socket-Server des vorigen Abschnitts nimmt Cro Ihnen die ganze Protokollbuchhaltung ab und lässt Sie nur den Teil schreiben, der Ihren Dienst ausmacht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Route sagt allerdings immer dasselbe.<\/span> <span class=\"sg\" data-s=\"1\">Die nächste Seite lässt eine Route einen <strong>Parameter<\/strong> aus der URL lesen, sodass eine einzige Route <code>/hello/Anna<\/code> und <code>/hello/Bob<\/code> verschieden begrüßen kann.<\/span><\/p>"]]},"nl":{"t":"Een Cro-route","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een Cro-HTTP-service wordt beschreven door een verzameling <em>routes<\/em>: elke route zegt welke URL hij afhandelt en wat hij teruggeeft.<\/span> <span class=\"sg\" data-s=\"1\">Je bouwt ze binnen een <code>route<\/code>-blok met het sleutelwoord <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lees de route als \"een <code>GET<\/code>-verzoek voor het pad <code>hello<\/code> geeft de tekst <code>Hello from Cro!<\/code> terug\".<\/span> <span class=\"sg\" data-s=\"1\">De functie <code>content<\/code> stelt zowel het contenttype als de body in — geen handmatige statusregels of <code>\\r\\n<\/code> te bekennen.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> bindt de routes aan een adres en poort, en <code>.start<\/code> begint met bedienen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén subtiliteit: <code>.start<\/code> blokkeert <strong>niet<\/strong> — het start de service op achtergrondthreads en keert meteen terug, en als het programma daar eenvoudigweg eindigde, zou de server ermee verdwijnen.<\/span> <span class=\"sg\" data-s=\"1\">Het afsluitende <code>react<\/code>-blok is wat het programma in leven houdt, en het is een oude bekende: <code>whenever signal(SIGINT)<\/code> reageert op het onderbrekingssignaal (Ctrl-C op het toetsenbord) door de server te stoppen en <code>done<\/code> aan te roepen.<\/span> <span class=\"sg\" data-s=\"2\">De reactieve gereedschappen van eerder in dit deel zijn precies hoe een Cro-programma wacht, bedient en netjes afsluit.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dit voorbeeld heeft Cro geïnstalleerd nodig (<code>zef install cro<\/code>). Draai het, open <code>http://127.0.0.1:8080/hello<\/code>, en stop de server met Ctrl-C als je klaar bent.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Maak je geen zorgen als de server tijdens het browsen af en toe <code>Cannot write to a closed socket<\/code> afdrukt. Dat is geen fout in je code: een client — meestal een browser — opende een verbinding en liet die vallen voordat hij het antwoord las, wat browsers geregeld doen bij speculatieve of geannuleerde verzoeken. Cro noteert de verdwenen client, en de server blijft bedienen.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een route kan URL-segmenten als parameters aannemen, JSON teruggeven en veel meer, maar de vorm is altijd deze: verklaar wat elk pad doet, geef de routes aan een server, en start hem.<\/span> <span class=\"sg\" data-s=\"1\">Vergeleken met de kale socketserver van de vorige sectie neemt Cro alle protocolboekhouding weg en laat het je alleen het deel schrijven dat specifiek is voor jouw service.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze route zegt echter altijd hetzelfde.<\/span> <span class=\"sg\" data-s=\"1\">De volgende pagina laat een route een <strong>parameter<\/strong> uit de URL lezen, zodat één enkele route <code>/hello/Anna<\/code> en <code>/hello/Bob<\/code> verschillend kan begroeten.<\/span><\/p>"]]},"es":{"t":"Una ruta de Cro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un servicio HTTP de Cro se describe mediante un conjunto de <em>rutas<\/em>: cada ruta dice qué URL atiende y qué devolver.<\/span> <span class=\"sg\" data-s=\"1\">Las construyes dentro de un bloque <code>route<\/code> con la palabra clave <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lee la ruta como «una petición <code>GET<\/code> a la ruta <code>hello<\/code> devuelve el texto <code>Hello from Cro!<\/code>».<\/span> <span class=\"sg\" data-s=\"1\">La función <code>content<\/code> fija a la vez el tipo de contenido y el cuerpo: ni una línea de estado ni un <code>\\r\\n<\/code> a la vista.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> ata las rutas a una dirección y un puerto, y <code>.start<\/code> empieza a servir.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una sutileza: <code>.start<\/code> <strong>no<\/strong> se bloquea; arranca el servicio en hilos de segundo plano y retorna enseguida, y si el programa terminara sencillamente ahí, el servidor se desvanecería con él.<\/span> <span class=\"sg\" data-s=\"1\">El bloque <code>react<\/code> final es lo que mantiene vivo el programa, y es un viejo conocido: <code>whenever signal(SIGINT)<\/code> reacciona a la señal de interrupción (Ctrl-C en el teclado) parando el servidor y llamando a <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Las herramientas reactivas de antes en esta parte son exactamente la manera en que un programa Cro espera, sirve y se apaga con limpieza.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Este ejemplo necesita Cro instalado (<code>zef install cro<\/code>). Ejecútalo, abre <code>http://127.0.0.1:8080/hello<\/code> y detén el servidor con Ctrl-C cuando hayas terminado.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">No te preocupes si el servidor imprime de vez en cuando <code>Cannot write to a closed socket<\/code> mientras navegas. Eso no es un fallo de tu código: un cliente — normalmente un navegador — abrió una conexión y la soltó antes de leer la respuesta, como los navegadores hacen habitualmente con peticiones especulativas o canceladas. Cro toma nota del cliente desaparecido, y el servidor sigue sirviendo.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una ruta puede tomar segmentos de la URL como parámetros, devolver JSON y mucho más, pero la forma es siempre esta: declara qué hace cada ruta, entrega las rutas a un servidor y arráncalo.<\/span> <span class=\"sg\" data-s=\"1\">Comparado con el servidor de sockets en crudo de la sección anterior, Cro elimina toda la contabilidad del protocolo y te deja escribir solo la parte específica de tu servicio.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta ruta, sin embargo, dice siempre lo mismo.<\/span> <span class=\"sg\" data-s=\"1\">La página siguiente permite que una ruta lea un <strong>parámetro<\/strong> de la URL, de modo que una sola ruta pueda saludar de manera distinta a <code>/hello/Anna<\/code> y a <code>/hello/Bob<\/code>.<\/span><\/p>"]]},"it":{"t":"Una rotta Cro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un servizio HTTP di Cro si descrive con una serie di <em>rotte<\/em>: ogni rotta dice quale URL gestisce e che cosa restituisce.<\/span> <span class=\"sg\" data-s=\"1\">Le costruisci in un blocco <code>route<\/code> con la parola chiave <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Leggi la rotta come «una richiesta <code>GET<\/code> al percorso <code>hello<\/code> restituisce il testo <code>Hello from Cro!<\/code>».<\/span> <span class=\"sg\" data-s=\"1\">La funzione <code>content<\/code> imposta insieme il tipo di contenuto e il corpo — nessuna riga di stato scritta a mano e nessun <code>\\r\\n<\/code> all'orizzonte.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> lega le rotte a un indirizzo e a una porta, e <code>.start<\/code> comincia a servire.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una finezza: <code>.start<\/code> <strong>non<\/strong> blocca — avvia il servizio su thread in secondo piano e ritorna subito, e se il programma finisse lì il server sparirebbe con lui.<\/span> <span class=\"sg\" data-s=\"1\">È il blocco <code>react<\/code> finale a tenere vivo il programma, ed è una vecchia conoscenza: <code>whenever signal(SIGINT)<\/code> reagisce al segnale di interruzione (Ctrl-C sulla tastiera) fermando il server e chiamando <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Gli strumenti reattivi visti prima in questa parte sono esattamente ciò con cui un programma Cro aspetta, serve e chiude in modo pulito.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questo esempio ha bisogno di Cro installato (<code>zef install cro<\/code>). Eseguilo, apri <code>http://127.0.0.1:8080/hello<\/code> e ferma il server con Ctrl-C quando hai finito.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Non prendertela se, mentre curiosi, il server stampa ogni tanto <code>Cannot write to a closed socket<\/code>. Non è un errore nel tuo codice: un client — di solito un browser — ha aperto una connessione e l'ha lasciata cadere prima di leggere la risposta, come i browser fanno regolarmente per le richieste speculative o annullate. Cro prende nota del client sparito, e il server continua a servire.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una rotta può prendere pezzi dell'URL come parametri, restituire JSON e molto altro, ma la forma è sempre questa: dichiarare che cosa fa ogni percorso, consegnare le rotte a un server e avviarlo.<\/span> <span class=\"sg\" data-s=\"1\">Rispetto al server su socket grezzi della sezione precedente, Cro ti toglie di mano tutta la contabilità del protocollo e ti lascia scrivere solo la parte che costituisce il tuo servizio.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa rotta, però, dice sempre la stessa cosa.<\/span> <span class=\"sg\" data-s=\"1\">La pagina successiva fa leggere a una rotta un <strong>parametro<\/strong> dall'URL, così che una sola rotta possa salutare <code>/hello/Anna<\/code> e <code>/hello/Bob<\/code> in modo diverso.<\/span><\/p>"]]},"ru":{"t":"Маршрут Cro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP-сервис на Cro описывается набором <em>маршрутов<\/em>: каждый маршрут указывает, какой URL он обслуживает и что возвращает.<\/span> <span class=\"sg\" data-s=\"1\">Строят их внутри блока <code>route<\/code> с помощью ключевого слова <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Читайте этот маршрут так: «запрос <code>GET<\/code> по пути <code>hello<\/code> возвращает текст <code>Hello from Cro!<\/code>».<\/span> <span class=\"sg\" data-s=\"1\">Функция <code>content<\/code> задаёт сразу и тип содержимого, и тело — никаких строк состояния вручную, никаких <code>\\r\\n<\/code> в поле зрения.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> привязывает маршруты к адресу и порту, а <code>.start<\/code> начинает обслуживание.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна тонкость: <code>.start<\/code> <strong>не<\/strong> блокирует выполнение — он запускает сервис в фоновых потоках и тут же возвращает управление, и, если бы программа на этом просто закончилась, сервер исчез бы вместе с ней.<\/span> <span class=\"sg\" data-s=\"1\">В живых её удерживает завершающий блок <code>react<\/code>, и он вам давно знаком: <code>whenever signal(SIGINT)<\/code> реагирует на сигнал прерывания (Ctrl-C с клавиатуры), останавливая сервер и вызывая <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Реактивные инструменты из начала этой части — ровно то, чем программа на Cro ждёт, обслуживает и аккуратно завершается.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этому примеру нужен установленный Cro (<code>zef install cro<\/code>). Запустите его, откройте <code>http://127.0.0.1:8080/hello<\/code>, а закончив, остановите сервер по Ctrl-C.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Не пугайтесь, если сервер время от времени печатает <code>Cannot write to a closed socket<\/code>, пока вы ходите по страницам. Это не ошибка в вашем коде: клиент — обычно браузер — открыл соединение и бросил его, не дочитав ответ, как браузеры постоянно делают со спекулятивными или отменёнными запросами. Cro отмечает исчезнувшего клиента, а сервер продолжает работать.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Маршрут может принимать сегменты URL как параметры, возвращать JSON и многое другое, но форма всегда одна: объявить, что делает каждый путь, передать маршруты серверу и запустить его.<\/span> <span class=\"sg\" data-s=\"1\">По сравнению с сервером на «сырых» сокетах из предыдущего раздела Cro убирает всю протокольную бухгалтерию и позволяет писать только ту часть, которая относится именно к вашему сервису.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Впрочем, этот маршрут всегда говорит одно и то же.<\/span> <span class=\"sg\" data-s=\"1\">На следующей странице маршрут научится читать <strong>параметр<\/strong> из URL, так что один маршрут сможет по-разному приветствовать <code>/hello/Anna<\/code> и <code>/hello/Bob<\/code>.<\/span><\/p>"]]},"uk":{"t":"Маршрут у Cro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP-сервіс на Cro описують набором <em>маршрутів<\/em>: кожен маршрут каже, який URL він обробляє і що повертає.<\/span> <span class=\"sg\" data-s=\"1\">Ви будуєте їх усередині блоку <code>route<\/code> за допомогою ключового слова <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Читайте маршрут так: «запит <code>GET<\/code> до шляху <code>hello<\/code> повертає текст <code>Hello from Cro!<\/code>».<\/span> <span class=\"sg\" data-s=\"1\">Функція <code>content<\/code> задає і тип вмісту, і тіло — жодних ручних рядків стану чи <code>\\r\\n<\/code> на горизонті.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> прив'язує маршрути до адреси та порту, а <code>.start<\/code> починає обслуговування.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна тонкість: <code>.start<\/code> <strong>не<\/strong> блокує виконання — він запускає сервіс у фонових потоках і повертається одразу, і якби програма просто на цьому завершилася, сервер зник би разом із нею.<\/span> <span class=\"sg\" data-s=\"1\">Живою програму тримає завершальний блок <code>react<\/code>, і це давній знайомий: <code>whenever signal(SIGINT)<\/code> реагує на сигнал переривання (Ctrl-C на клавіатурі) тим, що спиняє сервер і викликає <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Реактивні засоби з попередніх розділів цієї частини — це рівно те, як програма на Cro чекає, обслуговує й чисто завершується.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цьому прикладові потрібен встановлений Cro (<code>zef install cro<\/code>). Запустіть його, відкрийте <code>http://127.0.0.1:8080/hello<\/code>, а коли закінчите — спиніть сервер через Ctrl-C.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Не хвилюйтеся, якщо сервер час від часу друкує <code>Cannot write to a closed socket<\/code>, поки ви гортаєте сторінки. Це не помилка у вашому коді: клієнт — зазвичай браузер — відкрив з'єднання й покинув його, не прочитавши відповіді, як браузери звично роблять зі спекулятивними чи скасованими запитами. Cro занотовує зниклого клієнта, а сервер обслуговує далі.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Маршрут може приймати сегменти URL як параметри, повертати JSON і багато чого ще, але форма завжди така: оголоси, що робить кожен шлях, передай маршрути серверові й запусти його.<\/span> <span class=\"sg\" data-s=\"1\">Порівняно з сервером на сирих сокетах із попереднього розділу, Cro прибирає весь протокольний облік і дозволяє писати лише ту частину, що властива саме вашому сервісу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Утім, цей маршрут завжди каже те саме.<\/span> <span class=\"sg\" data-s=\"1\">Наступна сторінка дозволяє маршрутові прочитати <strong>параметр<\/strong> з URL, щоб один маршрут вітав <code>/hello/Anna<\/code> та <code>/hello/Bob<\/code> по-різному.<\/span><\/p>"]]},"bg":{"t":"Маршрут в Cro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">HTTP услугата в Cro се описва с набор от <em>маршрути<\/em>: всеки маршрут казва кой URL обработва и какво връща.<\/span> <span class=\"sg\" data-s=\"1\">Изграждате ги вътре в блок <code>route<\/code> с ключовата дума <code>get<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello' {\n        content 'text/plain', 'Hello from Cro!';\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080/hello — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прочетете маршрута така: „заявка <code>GET<\/code> за пътя <code>hello<\/code> връща текста <code>Hello from Cro!<\/code>“.<\/span> <span class=\"sg\" data-s=\"1\">Функцията <code>content<\/code> задава и типа на съдържанието, и тялото — никакви ръчни редове за състояние или <code>\\r\\n<\/code> на хоризонта.<\/span> <span class=\"sg\" data-s=\"2\"><code>Cro::HTTP::Server<\/code> свързва маршрутите с адрес и порт, а <code>.start<\/code> започва обслужването.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една тънкост: <code>.start<\/code> <strong>не<\/strong> блокира — той стартира услугата във фонови нишки и се връща веднага, а ако програмата просто свършеше дотук, сървърът щеше да изчезне заедно с нея.<\/span> <span class=\"sg\" data-s=\"1\">Живa програмата държи завършващият блок <code>react<\/code>, а той е стар познат: <code>whenever signal(SIGINT)<\/code> откликва на сигнала за прекъсване (Ctrl-C на клавиатурата), като спира сървъра и извиква <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Реактивните средства от по-рано в тази част са точно начинът, по който програма на Cro чака, обслужва и се затваря чисто.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Този пример се нуждае от инсталиран Cro (<code>zef install cro<\/code>). Изпълнете го, отворете <code>http://127.0.0.1:8080/hello<\/code>, а когато приключите — спрете сървъра с Ctrl-C.<\/span><\/blockquote>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Не се тревожете, ако сървърът от време на време отпечата <code>Cannot write to a closed socket<\/code>, докато разглеждате. Това не е грешка във вашия код: клиент — обикновено браузър — е отворил връзка и я е зарязал, без да прочете отговора, както браузърите редовно правят със спекулативни или отменени заявки. Cro отбелязва изчезналия клиент, а сървърът продължава да обслужва.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Маршрутът може да приема сегменти от URL като параметри, да връща JSON и много други неща, но формата винаги е тази: обяви какво прави всеки път, подай маршрутите на сървър и го стартирай.<\/span> <span class=\"sg\" data-s=\"1\">В сравнение със сървъра върху сурови сокети от предишния раздел, Cro премахва цялото протоколно счетоводство и ви оставя да пишете само онази част, която е присъща на вашата услуга.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този маршрут обаче винаги казва едно и също.<\/span> <span class=\"sg\" data-s=\"1\">Следващата страница позволява на маршрута да прочете <strong>параметър<\/strong> от URL адреса, така че един маршрут да поздравява <code>/hello/Anna<\/code> и <code>/hello/Bob<\/code> различно.<\/span><\/p>"]]}}}</script>
