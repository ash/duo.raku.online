<script type="application/json" id="page-data">{"u":"paradigms/cro/route-with-parameter","n":1402,"k":"topic","pv":"paradigms/cro/a-cro-route","nx":"paradigms/cro/client-modules","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"A route with a parameter","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The route on the previous page always returned the same text.<\/span> <span class=\"sg\" data-s=\"1\">Real services vary their reply by what the client asks for, and the simplest way is to read part of the <strong>URL<\/strong> as a parameter.<\/span> <span class=\"sg\" data-s=\"2\">In a Cro route, a segment after the fixed path becomes a variable in the signature:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The interesting part is the signature <code>-&gt; 'hello', $name<\/code>: it matches a path of two segments — the literal <code>hello<\/code>, then anything, captured into <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The rest of the program is the same server scaffolding as on the previous page.<\/span> <span class=\"sg\" data-s=\"2\">A request for <code>/hello/Anna<\/code> binds <code>$name<\/code> to <code>Anna<\/code> and returns <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> returns <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">One route, a different answer for every name:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">This example needs Cro installed (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters are how a route stays small while handling a whole family of paths.<\/span> <span class=\"sg\" data-s=\"1\">A route can take several segments, match only certain shapes, read query strings, and return JSON — but it all builds on this one idea: name the varying parts of the URL in the signature, and use them in the response.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Paths that match no route at all are not your problem: Cro answers them with <code>404 Not Found<\/code> on its own.<\/span> <span class=\"sg\" data-s=\"1\">And when a route <em>matches<\/em> but cannot deliver — the name looks up nothing, say — call <code>not-found<\/code> inside the handler to send that same 404 deliberately.<\/span> <span class=\"sg\" data-s=\"2\">The <strong>method<\/strong> is checked just as strictly as the path: this block only declares <code>get<\/code>, so a <code>HEAD<\/code> or <code>POST<\/code> request to the same path is answered with <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">You can see it yourself with <code>curl -I<\/code>, which sends <code>HEAD<\/code> rather than <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A service is only half the picture, though — something has to call it.<\/span> <span class=\"sg\" data-s=\"1\">The next page turns Cro around and uses its <strong>client<\/strong> to talk to a server like the ones you have just built.<\/span><\/p>"]]},"de":{"t":"Eine Route mit einem Parameter","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Route auf der vorigen Seite lieferte stets denselben Text.<\/span> <span class=\"sg\" data-s=\"1\">Echte Dienste richten ihre Antwort danach, wonach der Client fragt, und am einfachsten liest man dafür einen Teil der <strong>URL<\/strong> als Parameter.<\/span> <span class=\"sg\" data-s=\"2\">In einer Cro-Route wird ein Abschnitt hinter dem festen Pfad zu einer Variablen in der Signatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Spannende ist die Signatur <code>-&gt; 'hello', $name<\/code>: Sie trifft einen Pfad aus zwei Abschnitten — das wörtliche <code>hello<\/code>, dann irgendetwas, gecapturt in <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Rest des Programms ist dasselbe Servergerüst wie auf der vorigen Seite.<\/span> <span class=\"sg\" data-s=\"2\">Eine Anfrage nach <code>/hello/Anna<\/code> bindet <code>$name<\/code> an <code>Anna<\/code> und liefert <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> liefert <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Eine Route, eine andere Antwort für jeden Namen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dieses Beispiel braucht Cro installiert (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameter sind es, die eine Route klein halten, während sie eine ganze Familie von Pfaden bearbeitet.<\/span> <span class=\"sg\" data-s=\"1\">Eine Route kann mehrere Abschnitte aufnehmen, nur bestimmte Formen treffen, Abfragezeichenketten lesen und JSON liefern — doch alles baut auf diesem einen Gedanken auf: die veränderlichen Teile der URL in der Signatur benennen und sie in der Antwort verwenden.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pfade, die auf gar keine Route treffen, sind nicht Ihr Problem: Cro beantwortet sie von selbst mit <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Und wenn eine Route zwar <em>trifft<\/em>, aber nichts liefern kann — der Name schlägt etwa nichts nach —, rufen Sie im Bearbeiter <code>not-found<\/code> auf, um dieselbe 404 absichtlich zu senden.<\/span> <span class=\"sg\" data-s=\"2\">Die <strong>Methode<\/strong> wird ebenso streng geprüft wie der Pfad: Dieser Block erklärt nur <code>get<\/code>, eine <code>HEAD<\/code>- oder <code>POST<\/code>-Anfrage an denselben Pfad wird also mit <code>405 Method Not Allowed<\/code> beantwortet.<\/span> <span class=\"sg\" data-s=\"3\">Sie können das selbst mit <code>curl -I<\/code> sehen, das <code>HEAD<\/code> statt <code>GET<\/code> sendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Dienst ist allerdings nur die halbe Geschichte — irgendetwas muss ihn aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">Die nächste Seite dreht Cro um und verwendet seinen <strong>Client<\/strong>, um mit einem Server wie den eben gebauten zu sprechen.<\/span><\/p>"]]},"nl":{"t":"Een route met een parameter","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De route op de vorige pagina gaf altijd dezelfde tekst terug.<\/span> <span class=\"sg\" data-s=\"1\">Echte services variëren hun antwoord met wat de client vraagt, en de eenvoudigste manier is een deel van de <strong>URL<\/strong> als parameter lezen.<\/span> <span class=\"sg\" data-s=\"2\">In een Cro-route wordt een segment achter het vaste pad een variabele in de signatuur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het interessante deel is de signatuur <code>-&gt; 'hello', $name<\/code>: die matcht een pad van twee segmenten — het letterlijke <code>hello<\/code>, dan wat dan ook, gecapturd in <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De rest van het programma is dezelfde serversteiger als op de vorige pagina.<\/span> <span class=\"sg\" data-s=\"2\">Een verzoek om <code>/hello/Anna<\/code> bindt <code>$name<\/code> aan <code>Anna<\/code> en geeft <code>Hello, Anna!<\/code> terug; <code>/hello/Bob<\/code> geeft <code>Hello, Bob!<\/code> terug.<\/span> <span class=\"sg\" data-s=\"3\">Eén route, een ander antwoord voor elke naam:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Dit voorbeeld heeft Cro geïnstalleerd nodig (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters zijn hoe een route klein blijft terwijl hij een hele familie paden afhandelt.<\/span> <span class=\"sg\" data-s=\"1\">Een route kan meerdere segmenten aannemen, alleen bepaalde vormen matchen, querystrings lezen en JSON teruggeven — maar het bouwt allemaal op dit ene idee: benoem de variërende delen van de URL in de signatuur en gebruik ze in het antwoord.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Paden die met geen enkele route matchen zijn jouw probleem niet: Cro beantwoordt ze uit zichzelf met <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En wanneer een route wél <em>matcht<\/em> maar niet kan leveren — de naam levert bijvoorbeeld niets op — roep je binnen de afhandelaar <code>not-found<\/code> aan om diezelfde 404 bewust te versturen.<\/span> <span class=\"sg\" data-s=\"2\">De <strong>methode<\/strong> wordt net zo strikt gecontroleerd als het pad: dit blok verklaart alleen <code>get<\/code>, dus een <code>HEAD<\/code>- of <code>POST<\/code>-verzoek naar hetzelfde pad wordt met <code>405 Method Not Allowed<\/code> beantwoord.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt het zelf zien met <code>curl -I<\/code>, dat <code>HEAD<\/code> in plaats van <code>GET<\/code> verstuurt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een service is echter maar de halve foto — er moet iets zijn dat haar aanroept.<\/span> <span class=\"sg\" data-s=\"1\">De volgende pagina draait Cro om en gebruikt zijn <strong>client<\/strong> om met een server als degene die je net gebouwd hebt te praten.<\/span><\/p>"]]},"es":{"t":"Una ruta con parámetro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La ruta de la página anterior devolvía siempre el mismo texto.<\/span> <span class=\"sg\" data-s=\"1\">Los servicios reales varían su respuesta según lo que pida el cliente, y la manera más sencilla es leer parte de la <strong>URL<\/strong> como parámetro.<\/span> <span class=\"sg\" data-s=\"2\">En una ruta de Cro, un segmento posterior a la ruta fija se convierte en una variable de la firma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La parte interesante es la firma <code>-&gt; 'hello', $name<\/code>: coincide con una ruta de dos segmentos, el literal <code>hello<\/code> y después cualquier cosa, capturada en <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El resto del programa es el mismo andamiaje de servidor de la página anterior.<\/span> <span class=\"sg\" data-s=\"2\">Una petición de <code>/hello/Anna<\/code> liga <code>$name<\/code> a <code>Anna<\/code> y devuelve <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> devuelve <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Una ruta, una respuesta distinta para cada nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Este ejemplo necesita Cro instalado (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los parámetros son lo que permite a una ruta seguir siendo pequeña mientras atiende toda una familia de rutas.<\/span> <span class=\"sg\" data-s=\"1\">Una ruta puede tomar varios segmentos, coincidir solo con ciertas formas, leer cadenas de consulta y devolver JSON, pero todo se construye sobre esta única idea: nombra en la firma las partes variables de la URL y úsalas en la respuesta.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Las rutas que no coinciden con ninguna ruta declarada no son problema tuyo: Cro las responde por su cuenta con <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Y cuando una ruta <em>sí<\/em> coincide pero no puede entregar nada — el nombre no encuentra nada, pongamos —, llama a <code>not-found<\/code> dentro del manejador para enviar ese mismo 404 deliberadamente.<\/span> <span class=\"sg\" data-s=\"2\">El <strong>método<\/strong> se comprueba con tanto rigor como la ruta: este bloque solo declara <code>get<\/code>, así que una petición <code>HEAD<\/code> o <code>POST<\/code> a la misma ruta se responde con <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puedes verlo tú mismo con <code>curl -I<\/code>, que envía <code>HEAD<\/code> en lugar de <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un servicio es solo la mitad del cuadro, sin embargo: algo tiene que llamarlo.<\/span> <span class=\"sg\" data-s=\"1\">La página siguiente da la vuelta a Cro y usa su <strong>cliente<\/strong> para hablar con un servidor como los que acabas de construir.<\/span><\/p>"]]},"it":{"t":"Una rotta con un parametro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La rotta della pagina precedente restituiva sempre lo stesso testo.<\/span> <span class=\"sg\" data-s=\"1\">I servizi veri adattano la propria risposta a ciò che il client chiede, e il modo più semplice per farlo è leggere una parte dell'<strong>URL<\/strong> come parametro.<\/span> <span class=\"sg\" data-s=\"2\">In una rotta Cro un pezzo dopo il percorso fisso diventa una variabile nella firma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La cosa interessante è la firma <code>-&gt; 'hello', $name<\/code>: riconosce un percorso di due pezzi — il letterale <code>hello<\/code>, poi qualunque cosa, catturata in <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il resto del programma è lo stesso scheletro di server della pagina precedente.<\/span> <span class=\"sg\" data-s=\"2\">Una richiesta di <code>/hello/Anna<\/code> lega <code>$name<\/code> ad <code>Anna<\/code> e restituisce <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> restituisce <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Una rotta, una risposta diversa per ogni nome:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questo esempio ha bisogno di Cro installato (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sono i parametri a tenere piccola una rotta mentre gestisce un'intera famiglia di percorsi.<\/span> <span class=\"sg\" data-s=\"1\">Una rotta può prendere più pezzi, riconoscere solo certe forme, leggere le stringhe di query e restituire JSON — ma tutto si costruisce su questa unica idea: dare un nome nella firma alle parti variabili dell'URL e usarle nella risposta.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I percorsi che non corrispondono ad alcuna rotta non sono un tuo problema: Cro risponde loro da sé con <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">E quando una rotta <em>corrisponde<\/em> ma non ha nulla da restituire — il nome non trova nulla, per esempio — chiama <code>not-found<\/code> nel gestore per inviare di proposito la stessa 404.<\/span> <span class=\"sg\" data-s=\"2\">Il <strong>metodo<\/strong> viene controllato con lo stesso rigore del percorso: questo blocco dichiara solo <code>get<\/code>, quindi a una richiesta <code>HEAD<\/code> o <code>POST<\/code> sullo stesso percorso si risponde con <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi vederlo tu stesso con <code>curl -I<\/code>, che invia <code>HEAD<\/code> invece di <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un servizio, però, è solo metà della storia: qualcosa deve pur chiamarlo.<\/span> <span class=\"sg\" data-s=\"1\">La pagina successiva capovolge Cro e usa il suo <strong>client<\/strong> per parlare con un server come quelli appena costruiti.<\/span><\/p>"]]},"lv":{"t":"Maršruts ar parametru","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējās lappuses maršruts vienmēr atgrieza vienu un to pašu tekstu.<\/span> <span class=\"sg\" data-s=\"1\">Īsti pakalpojumi savu atbildi maina atkarībā no tā, ko klients prasa, un vienkāršākais veids ir nolasīt <strong>URL<\/strong> daļu kā parametru.<\/span> <span class=\"sg\" data-s=\"2\">Cro maršrutā segments aiz nemainīgā ceļa kļūst par mainīgo parakstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Interesantākā daļa ir paraksts <code>-&gt; 'hello', $name<\/code>: tas atbilst divu segmentu ceļam — burtiskajam <code>hello<\/code> un tad jebkam, kas tiek satverts <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pārējā programma ir tāda pati servera sastatne kā iepriekšējā lappusē.<\/span> <span class=\"sg\" data-s=\"2\">Pieprasījums uz <code>/hello/Anna<\/code> piesaista <code>$name<\/code> vērtībai <code>Anna<\/code> un atgriež <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> atgriež <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Viens maršruts, atšķirīga atbilde katram vārdam:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Šim piemēram vajadzīgs uzstādīts Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri ir tas, kas maršrutam ļauj palikt mazam, apstrādājot veselu ceļu saimi.<\/span> <span class=\"sg\" data-s=\"1\">Maršruts var ņemt vairākus segmentus, atbilst tikai noteiktām formām, nolasīt vaicājuma virknes un atgriezt JSON — bet tas viss balstās uz šo vienu domu: nosauciet URL mainīgās daļas parakstā un izmantojiet tās atbildē.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ceļi, kas neatbilst nevienam maršrutam, nav jūsu rūpes: Cro tiem pats atbild ar <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un, kad maršruts <em>atbilst<\/em>, bet nespēj piegādāt — teiksim, vārds neko neatrod —, izsauciet apstrādātājā <code>not-found<\/code>, lai to pašu 404 nosūtītu apzināti.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Metode<\/strong> tiek pārbaudīta tikpat stingri kā ceļš: šis bloks deklarē tikai <code>get<\/code>, tāpēc <code>HEAD<\/code> vai <code>POST<\/code> pieprasījums tam pašam ceļam saņem <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">To var redzēt pašam ar <code>curl -I<\/code>, kas sūta <code>HEAD<\/code>, nevis <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pakalpojums tomēr ir tikai puse ainas — kādam tas ir jāizsauc.<\/span> <span class=\"sg\" data-s=\"1\">Nākamā lappuse apgriež Cro otrādi un izmanto tā <strong>klientu<\/strong>, lai sarunātos ar tādu serveri, kādus tikko uzbūvējāt.<\/span><\/p>"]]},"ru":{"t":"Маршрут с параметром","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Маршрут с предыдущей страницы всегда возвращал один и тот же текст.<\/span> <span class=\"sg\" data-s=\"1\">Настоящие сервисы меняют ответ в зависимости от того, что просит клиент, и проще всего для этого прочитать часть <strong>URL<\/strong> как параметр.<\/span> <span class=\"sg\" data-s=\"2\">В маршруте Cro сегмент после фиксированного пути становится переменной в сигнатуре:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Самое интересное — сигнатура <code>-&gt; 'hello', $name<\/code>: она сопоставляется с путём из двух сегментов, буквального <code>hello<\/code> и чего угодно, что захватывается в <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Остальная часть программы — та же серверная обвязка, что и на предыдущей странице.<\/span> <span class=\"sg\" data-s=\"2\">Запрос <code>/hello/Anna<\/code> связывает <code>$name<\/code> со строкой <code>Anna<\/code> и возвращает <code>Hello, Anna!<\/code>, а <code>/hello/Bob<\/code> возвращает <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Один маршрут — свой ответ для каждого имени:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этому примеру нужен установленный Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметры — это то, благодаря чему маршрут остаётся коротким, обслуживая целое семейство путей.<\/span> <span class=\"sg\" data-s=\"1\">Маршрут может принимать несколько сегментов, сопоставляться только с определёнными формами, читать строку запроса и возвращать JSON, — но всё это строится на одной идее: назовите изменчивые части URL в сигнатуре и используйте их в ответе.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Пути, не подошедшие ни одному маршруту, — не ваша забота: Cro сам отвечает на них <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А когда маршрут <em>подошёл<\/em>, но выдать нечего — скажем, по имени ничего не нашлось, — вызовите в обработчике <code>not-found<\/code>, чтобы отправить тот же 404 намеренно.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Метод<\/strong> проверяется так же строго, как и путь: этот блок объявляет только <code>get<\/code>, поэтому запрос <code>HEAD<\/code> или <code>POST<\/code> по тому же пути получит <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Убедиться в этом можно самому командой <code>curl -I<\/code>, которая отправляет <code>HEAD<\/code>, а не <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Впрочем, сервис — лишь половина картины: кто-то должен его вызывать.<\/span> <span class=\"sg\" data-s=\"1\">На следующей странице мы развернём Cro и воспользуемся его <strong>клиентом<\/strong>, чтобы поговорить с сервером вроде тех, что вы только что построили.<\/span><\/p>"]]},"uk":{"t":"Маршрут із параметром","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Маршрут із попередньої сторінки завжди повертав той самий текст.<\/span> <span class=\"sg\" data-s=\"1\">Справжні сервіси змінюють свою відповідь залежно від того, що просить клієнт, і найпростіший спосіб — прочитати частину <strong>URL<\/strong> як параметр.<\/span> <span class=\"sg\" data-s=\"2\">У маршруті Cro сегмент після фіксованого шляху стає змінною в сигнатурі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Найцікавіше — сигнатура <code>-&gt; 'hello', $name<\/code>: вона зіставляється зі шляхом із двох сегментів — літерального <code>hello<\/code>, а потім чого завгодно, що захоплюється в <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Решта програми є тими самими серверними риштуваннями, що й на попередній сторінці.<\/span> <span class=\"sg\" data-s=\"2\">Запит до <code>/hello/Anna<\/code> зв'язує <code>$name<\/code> з <code>Anna<\/code> й повертає <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> повертає <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Один маршрут — і своя відповідь для кожного імені:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цьому прикладові потрібен встановлений Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметри — це те, як маршрут лишається невеликим, обробляючи цілу родину шляхів.<\/span> <span class=\"sg\" data-s=\"1\">Маршрут може брати кілька сегментів, зіставлятися лише з певними формами, читати рядки запиту й повертати JSON — але все це будується на одній ідеї: назви змінні частини URL у сигнатурі й скористайся ними у відповіді.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Шляхи, що не збігаються з жодним маршрутом, — не ваша турбота: Cro відповідає на них <code>404 Not Found<\/code> самотужки.<\/span> <span class=\"sg\" data-s=\"1\">А коли маршрут <em>збігається<\/em>, але не може нічого віддати — скажімо, ім'я нічого не знаходить, — викличте <code>not-found<\/code> усередині обробника, щоб надіслати той самий 404 навмисно.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Метод<\/strong> перевіряється так само строго, як і шлях: цей блок оголошує лише <code>get<\/code>, тож на запит <code>HEAD<\/code> чи <code>POST<\/code> до того самого шляху буде відповідь <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете побачити це самі за допомогою <code>curl -I<\/code>, який надсилає <code>HEAD<\/code>, а не <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Утім, сервіс — це лише половина картини: щось має його викликати.<\/span> <span class=\"sg\" data-s=\"1\">Наступна сторінка обертає Cro в інший бік і використовує його <strong>клієнт<\/strong>, щоб поговорити із сервером на кшталт тих, які ви щойно збудували.<\/span><\/p>"]]},"bg":{"t":"Маршрут с параметър","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Маршрутът от предишната страница винаги връщаше един и същ текст.<\/span> <span class=\"sg\" data-s=\"1\">Истинските услуги менят отговора си според онова, което клиентът иска, а най-простият начин е да се прочете част от <strong>URL адреса<\/strong> като параметър.<\/span> <span class=\"sg\" data-s=\"2\">В маршрут на Cro сегмент след фиксирания път става променлива в сигнатурата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Интересната част е сигнатурата <code>-&gt; 'hello', $name<\/code>: тя съвпада с път от два сегмента — буквалното <code>hello<\/code>, а после каквото и да е, прихванато в <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Останалата част от програмата е същата сървърна обвивка като на предишната страница.<\/span> <span class=\"sg\" data-s=\"2\">Заявка за <code>/hello/Anna<\/code> свързва <code>$name<\/code> с <code>Anna<\/code> и връща <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> връща <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Един маршрут, различен отговор за всяко име:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Този пример се нуждае от инсталиран Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметрите са начинът маршрутът да остане малък, обслужвайки цяло семейство от пътища.<\/span> <span class=\"sg\" data-s=\"1\">Маршрутът може да приема няколко сегмента, да съвпада само с определени форми, да чете низове на заявката и да връща JSON — но всичко това се гради върху една идея: назовете променливите части на URL адреса в сигнатурата и ги използвайте в отговора.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Пътищата, които не съвпадат с никакъв маршрут, не са ваш проблем: Cro сам им отговаря с <code>404 Not Found<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А когато маршрут <em>съвпадне<\/em>, но не може да достави нищо — да речем, името не намира нищо, — извикайте <code>not-found<\/code> вътре в обработчика, за да изпратите същия 404 нарочно.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Методът<\/strong> се проверява също толкова строго, колкото и пътят: този блок обявява само <code>get<\/code>, така че на заявка <code>HEAD<\/code> или <code>POST<\/code> към същия път се отговаря с <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Можете да го видите сами с <code>curl -I<\/code>, който изпраща <code>HEAD<\/code>, а не <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Услугата обаче е само половината картина — нещо трябва да я вика.<\/span> <span class=\"sg\" data-s=\"1\">Следващата страница обръща Cro и използва нейния <strong>клиент<\/strong>, за да говори със сървър като онези, които току-що изградихте.<\/span><\/p>"]]},"eo":{"t":"Vojo kun parametro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La vojo sur la antaŭa paĝo ĉiam redonis la saman tekston.<\/span> <span class=\"sg\" data-s=\"1\">Veraj servoj variigas sian respondon laŭ tio, kion la kliento petas, kaj la plej simpla maniero estas legi parton de la <strong>URL<\/strong> kiel parametron.<\/span> <span class=\"sg\" data-s=\"2\">En Cro-vojo, segmento post la fiksita vojo fariĝas variablo en la signaturo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La interesa parto estas la signaturo <code>-&gt; 'hello', $name<\/code>: ĝi kongruas kun vojo el du segmentoj — la laŭvorta <code>hello<\/code>, poste io ajn, kaptita en <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La cetero de la programo estas la sama servila skafaldo kiel sur la antaŭa paĝo.<\/span> <span class=\"sg\" data-s=\"2\">Peto pri <code>/hello/Anna<\/code> ligas <code>$name<\/code> al <code>Anna<\/code> kaj redonas <code>Hello, Anna!<\/code>; <code>/hello/Bob<\/code> redonas <code>Hello, Bob!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Unu vojo, malsama respondo por ĉiu nomo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzemplo bezonas Cro instalitan (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametroj estas la maniero, laŭ kiu vojo restas malgranda dum ĝi traktas tutan familion da vojoj.<\/span> <span class=\"sg\" data-s=\"1\">Vojo povas preni plurajn segmentojn, kongrui nur kun certaj formoj, legi informpetajn ĉenojn kaj redoni JSON — sed ĉio konstruas sur ĉi tiu unu ideo: nomu la variajn partojn de la URL en la signaturo kaj uzu ilin en la respondo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vojoj, kiuj kongruas kun neniu vojo, ne estas via problemo: Cro respondas al ili per <code>404 Not Found<\/code> per si mem.<\/span> <span class=\"sg\" data-s=\"1\">Kaj kiam vojo <em>kongruas<\/em>, sed ne povas liveri — la nomo trovas nenion, ekzemple — voku <code>not-found<\/code> ene de la traktero por sendi tiun saman 404 intence.<\/span> <span class=\"sg\" data-s=\"2\">La <strong>metodo<\/strong> estas kontrolata same strikte kiel la vojo: ĉi tiu bloko deklaras nur <code>get<\/code>, do peto <code>HEAD<\/code> aŭ <code>POST<\/code> al la sama vojo estas respondata per <code>405 Method Not Allowed<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas vidi tion mem per <code>curl -I<\/code>, kiu sendas <code>HEAD<\/code> prefere ol <code>GET<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Servo tamen estas nur duono de la bildo — io devas voki ĝin.<\/span> <span class=\"sg\" data-s=\"1\">La sekva paĝo turnas Cro kaj uzas ĝian <strong>klienton<\/strong> por paroli kun servilo kiel tiuj, kiujn vi ĵus konstruis.<\/span><\/p>"]]},"la":{"t":"Via cum parametro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Via paginae prioris semper eundem textum reddebat.<\/span> <span class=\"sg\" data-s=\"1\">Servitia vera responsum suum secundum id quod cliens poscit variant, et modus simplicissimus est partem <strong>URL<\/strong> ut parametrum legere.<\/span> <span class=\"sg\" data-s=\"2\">In via Cro, segmentum post semitam fixam variabilis in signatura fit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Server;\n\nmy $application = route {\n    get -&gt; 'hello', $name {\n        content 'text/plain', \"Hello, $name!\";\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Listening on http://127.0.0.1:8080 — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pars interessans est signatura <code>-&gt; 'hello', $name<\/code>: semitae duorum segmentorum congruit — litterali <code>hello<\/code>, deinde cuilibet rei, in <code>$name<\/code> captae.<\/span> <span class=\"sg\" data-s=\"1\">Reliquum programmatis eadem machinatio servitoris est ac in pagina priore.<\/span> <span class=\"sg\" data-s=\"2\">Petitio pro <code>/hello/Anna<\/code> <code>$name<\/code> ad <code>Anna<\/code> ligat et <code>Hello, Anna!<\/code> reddit; <code>/hello/Bob<\/code> <code>Hello, Bob!<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"3\">Una via, responsum diversum pro omni nomine:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl http://127.0.0.1:8080/hello/Anna\nHello, Anna!<\/code><\/pre>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Hoc exemplum Cro installato eget (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri sunt quomodo via parva maneat dum totam familiam semitarum tractat.<\/span> <span class=\"sg\" data-s=\"1\">Via plura segmenta accipere potest, solis formis quibusdam congruere, catenas interrogationis legere, et JSON reddere — sed omnia super hac una idea aedificantur: nomina partes URL variantes in signatura, et eis in responso utere.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Semitae quae nulli viae congruunt tua cura non sunt: Cro eis <code>404 Not Found<\/code> sponte respondet.<\/span> <span class=\"sg\" data-s=\"1\">Et cum via <em>congruit<\/em> sed tradere non potest — nomen nihil invenit, exempli gratia — voca <code>not-found<\/code> intra tractatorem ut illud idem 404 consulto mittas.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Methodus<\/strong> tam stricte ac semita inspicitur: hic blocus solum <code>get<\/code> declarat, itaque petitio <code>HEAD<\/code> vel <code>POST<\/code> ad eandem semitam per <code>405 Method Not Allowed<\/code> respondetur.<\/span> <span class=\"sg\" data-s=\"3\">Id ipse videre potes per <code>curl -I<\/code>, quod <code>HEAD<\/code> pro <code>GET<\/code> mittit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Servitium tamen dimidia pars imaginis tantum est — aliquid illud vocare debet.<\/span> <span class=\"sg\" data-s=\"1\">Pagina sequens Cro invertit et <strong>cliente<\/strong> eius utitur ut cum servitore qualem modo aedificasti colloquatur.<\/span><\/p>"]]}}}</script>
