<script type="application/json" id="page-data">{"u":"paradigms/cro/websockets","n":1405,"k":"topic","pv":"paradigms/cro/public-apis","nx":"paradigms/cro/exercises","tr":["paradigms","paradigms/cro"],"L":{"en":{"t":"WebSockets","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">An HTTP conversation is one-shot: the client asks, the server answers, and the connection is done.<\/span> <span class=\"sg\" data-s=\"1\">A <strong>WebSocket<\/strong> upgrades that into a long-lived, two-way channel — either side can send a message at any moment, which is what chats, games, and live dashboards need.<\/span> <span class=\"sg\" data-s=\"2\">Cro supports WebSockets out of the box, and a WebSocket handler is built from the reactive tools you already know: a message stream is a supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here is a tiny chat server.<\/span> <span class=\"sg\" data-s=\"1\">Every message any client sends is upper-cased by the server and broadcast to everyone connected — so what comes back is visibly <em>not<\/em> what went out, proving the data really made the round trip:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Look at the <code>web-socket<\/code> block — it is the reactive part of the course in miniature.<\/span> <span class=\"sg\" data-s=\"1\">Each connected client gets a <code>supply<\/code> with two <code>whenever<\/code>s: one watches <code>$incoming<\/code>, the messages arriving <em>from<\/em> that client, upper-cases each and pushes it into the shared <code>$chat<\/code> supplier; the other watches <code>$chat<\/code> and <code>emit<\/code>s every broadcast text back <em>to<\/em> the client.<\/span> <span class=\"sg\" data-s=\"2\">One <code>Supplier<\/code>, tapped by every connection, is the entire chat room.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The little <code>LAST { done }<\/code> matters.<\/span> <span class=\"sg\" data-s=\"1\">It is the <a href=\"/advanced/block-phasers/\">phaser<\/a> you met with loops; in a <code>whenever<\/code> block it fires when the watched stream <strong>ends<\/strong> — that is, when this client disconnects.<\/span> <span class=\"sg\" data-s=\"2\">Calling <code>done<\/code> there closes the whole connection supply, unsubscribing it from <code>$chat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Without it, a departed client's <code>whenever $chat<\/code> would linger, and the next broadcast would try to write to a closed socket and print an error on the server.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A browser talks to this with a few lines of JavaScript, but so does another Raku program — Cro also provides the client side:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> fires the message off and returns at once; the reply arrives later, on another thread, in the <code>.tap<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">The main line must therefore wait before closing — and rather than sleeping and hoping, it awaits a <code>Promise<\/code> that the tap keeps the moment the reply lands: the concurrency tools from earlier in this part, doing exactly what they were made for.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Run the server in one terminal and this client in another.<\/span> <span class=\"sg\" data-s=\"1\">The client prints both directions of the conversation:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">What went out lowercase came back in capitals — the message travelled <em>to<\/em> the server, was transformed there, and travelled <em>back<\/em> over the same connection.<\/span> <span class=\"sg\" data-s=\"1\">That is the two-way channel in action.<\/span> <span class=\"sg\" data-s=\"2\">Start the client in several terminals at once and every message appears in all of them: a working chat in under thirty lines of Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">These examples need Cro installed (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This is a fitting place to end the course.<\/span> <span class=\"sg\" data-s=\"1\">A service, the client that calls it, and a live two-way channel between them stand on everything that came before — objects and exceptions, regexes and grammars, and the functional, concurrent, and reactive tools of this part — yet the code stays short and says exactly what you mean.<\/span> <span class=\"sg\" data-s=\"2\">From <a href=\"/paradigms/connections/sending-receiving/\">bytes on a socket<\/a> to a chat room in a screenful of code: that is Raku.<\/span><\/p>"]]},"de":{"t":"WebSockets","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein HTTP-Gespräch ist einmalig: Der Client fragt, der Server antwortet, und die Verbindung ist erledigt.<\/span> <span class=\"sg\" data-s=\"1\">Ein <strong>WebSocket<\/strong> macht daraus einen langlebigen Zweiwegkanal — jede Seite kann jederzeit eine Nachricht senden, und genau das brauchen Chats, Spiele und lebendige Übersichten.<\/span> <span class=\"sg\" data-s=\"2\">Cro beherrscht WebSockets von Haus aus, und ein WebSocket-Bearbeiter ist aus den reaktiven Werkzeugen gebaut, die Sie schon kennen: Ein Nachrichtenstrom ist ein Supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein winziger Chatserver.<\/span> <span class=\"sg\" data-s=\"1\">Jede Nachricht, die ein Client sendet, wird vom Server großgeschrieben und an alle Verbundenen gesendet — was zurückkommt, ist also sichtbar <em>nicht<\/em>, was hinausging, und beweist, dass die Daten wirklich die Hin- und Rückreise gemacht haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich den <code>web-socket<\/code>-Block an — er ist der reaktive Teil des Kurses im Kleinen.<\/span> <span class=\"sg\" data-s=\"1\">Jeder verbundene Client bekommt ein <code>supply<\/code> mit zwei <code>whenever<\/code>: Das eine beobachtet <code>$incoming<\/code>, die <em>von<\/em> diesem Client eintreffenden Nachrichten, schreibt jede groß und schiebt sie in den gemeinsamen <code>$chat<\/code>-Supplier; das andere beobachtet <code>$chat<\/code> und <code>emit<\/code>-tet jeden gesendeten Text <em>an<\/em> den Client zurück.<\/span> <span class=\"sg\" data-s=\"2\">Ein <code>Supplier<\/code>, von jeder Verbindung angezapft, ist der ganze Chatraum.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das kleine <code>LAST { done }<\/code> ist wichtig.<\/span> <span class=\"sg\" data-s=\"1\">Es ist der <a href=\"https://course.raku.org/de/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">Phaser<\/a>, der Ihnen bei Schleifen begegnet ist; in einem <code>whenever<\/code>-Block feuert er, wenn der beobachtete Strom <strong>endet<\/strong> — also wenn dieser Client die Verbindung trennt.<\/span> <span class=\"sg\" data-s=\"2\">Dort <code>done<\/code> aufzurufen schließt das ganze Verbindungs-Supply und meldet es von <code>$chat<\/code> ab.<\/span> <span class=\"sg\" data-s=\"3\">Ohne das bliebe das <code>whenever $chat<\/code> eines gegangenen Clients hängen, und die nächste Sendung versuchte, in einen geschlossenen Socket zu schreiben, und gäbe auf dem Server einen Fehler aus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Browser spricht mit ein paar Zeilen JavaScript damit, aber ein anderes Raku-Programm ebenso — Cro liefert auch die Clientseite:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> schickt die Nachricht los und kehrt sofort zurück; die Antwort trifft später auf einem anderen Thread im <code>.tap<\/code>-Block ein.<\/span> <span class=\"sg\" data-s=\"1\">Die Hauptlinie muss daher warten, bevor sie schließt — und statt zu schlafen und zu hoffen, wartet sie ein <code>Promise<\/code> ab, das die Zapfstelle in dem Augenblick erfüllt, in dem die Antwort eintrifft: die Nebenläufigkeitswerkzeuge von früher in diesem Teil, die genau das tun, wofür sie gemacht sind.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Führen Sie den Server in einem Terminal aus und diesen Client in einem anderen.<\/span> <span class=\"sg\" data-s=\"1\">Der Client gibt beide Richtungen des Gesprächs aus:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Was klein hinausging, kam groß zurück — die Nachricht reiste <em>zum<\/em> Server, wurde dort umgeformt und reiste über dieselbe Verbindung <em>zurück<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist der Zweiwegkanal in Aktion.<\/span> <span class=\"sg\" data-s=\"2\">Starten Sie den Client in mehreren Terminals zugleich, und jede Nachricht erscheint in allen: ein funktionierender Chat in weniger als dreißig Zeilen Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Diese Beispiele brauchen Cro installiert (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das ist ein passender Ort, um den Kurs zu beenden.<\/span> <span class=\"sg\" data-s=\"1\">Ein Dienst, der Client, der ihn aufruft, und ein lebendiger Zweiwegkanal dazwischen stehen auf allem, was vorausging — Objekten und Ausnahmen, Regexes und Grammatiken sowie den funktionalen, nebenläufigen und reaktiven Werkzeugen dieses Teils —, und dennoch bleibt der Code kurz und sagt genau, was Sie meinen.<\/span> <span class=\"sg\" data-s=\"2\">Von <a href=\"https://course.raku.org/de/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">Bytes auf einem Socket<\/a> zu einem Chatraum in einer Bildschirmseite Code: Das ist Raku.<\/span><\/p>"]]},"nl":{"t":"WebSockets","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een HTTP-gesprek is eenmalig: de client vraagt, de server antwoordt, en de verbinding is klaar.<\/span> <span class=\"sg\" data-s=\"1\">Een <strong>WebSocket<\/strong> maakt daar een langlevend tweewegkanaal van — elke kant kan op elk moment een bericht sturen, en dat is wat chats, spellen en live dashboards nodig hebben.<\/span> <span class=\"sg\" data-s=\"2\">Cro ondersteunt WebSockets meteen, en een WebSocket-afhandelaar is gebouwd uit de reactieve gereedschappen die je al kent: een berichtenstroom is een supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is een piepkleine chatserver.<\/span> <span class=\"sg\" data-s=\"1\">Elk bericht dat een client verstuurt, wordt door de server in hoofdletters gezet en naar iedereen die verbonden is uitgezonden — zodat wat terugkomt zichtbaar <em>niet<\/em> is wat eruit ging, wat bewijst dat de gegevens werkelijk de heen-en-weerreis maakten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kijk naar het <code>web-socket<\/code>-blok — het is het reactieve deel van de cursus in het klein.<\/span> <span class=\"sg\" data-s=\"1\">Elke verbonden client krijgt een <code>supply<\/code> met twee <code>whenever<\/code>s: de ene bekijkt <code>$incoming<\/code>, de berichten die <em>van<\/em> die client binnenkomen, zet ze in hoofdletters en duwt ze in de gedeelde <code>$chat<\/code>-supplier; de andere bekijkt <code>$chat<\/code> en <code>emit<\/code>-t elke uitgezonden tekst terug <em>naar<\/em> de client.<\/span> <span class=\"sg\" data-s=\"2\">Eén <code>Supplier<\/code>, door elke verbinding afgetapt, is de hele chatruimte.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De kleine <code>LAST { done }<\/code> doet ertoe.<\/span> <span class=\"sg\" data-s=\"1\">Het is de <a href=\"https://course.raku.org/nl/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">faser<\/a> die je bij lussen tegenkwam; in een <code>whenever<\/code>-blok gaat hij af wanneer de bekeken stroom <strong>eindigt<\/strong> — dat wil zeggen wanneer deze client de verbinding verbreekt.<\/span> <span class=\"sg\" data-s=\"2\">Daar <code>done<\/code> aanroepen sluit de hele verbindingssupply en meldt haar bij <code>$chat<\/code> af.<\/span> <span class=\"sg\" data-s=\"3\">Zonder dat zou de <code>whenever $chat<\/code> van een vertrokken client blijven hangen, en zou de volgende uitzending naar een gesloten socket proberen te schrijven en op de server een fout afdrukken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een browser praat hiermee met een paar regels JavaScript, maar een ander Raku-programma ook — Cro levert ook de clientkant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> stuurt het bericht weg en keert meteen terug; het antwoord komt later, op een andere thread, in het <code>.tap<\/code>-blok binnen.<\/span> <span class=\"sg\" data-s=\"1\">De hoofdlijn moet daarom wachten voordat ze sluit — en in plaats van te slapen en te hopen, wacht ze een <code>Promise<\/code> af die de tap vervult op het moment dat het antwoord binnenkomt: de concurrencygereedschappen van eerder in dit deel, die precies doen waarvoor ze gemaakt zijn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Draai de server in de ene terminal en deze client in een andere.<\/span> <span class=\"sg\" data-s=\"1\">De client drukt beide richtingen van het gesprek af:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wat er in kleine letters uitging, kwam in hoofdletters terug — het bericht reisde <em>naar<\/em> de server, werd daar omgevormd, en reisde over dezelfde verbinding <em>terug<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het tweewegkanaal in actie.<\/span> <span class=\"sg\" data-s=\"2\">Start de client in meerdere terminals tegelijk en elk bericht verschijnt in allemaal: een werkende chat in minder dan dertig regels Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Deze voorbeelden hebben Cro geïnstalleerd nodig (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit is een passende plek om de cursus te beëindigen.<\/span> <span class=\"sg\" data-s=\"1\">Een service, de client die haar aanroept, en een levend tweewegkanaal ertussen staan op alles wat eraan voorafging — objecten en excepties, regexes en grammatica's, en de functionele, concurrente en reactieve gereedschappen van dit deel — en toch blijft de code kort en zegt ze precies wat je bedoelt.<\/span> <span class=\"sg\" data-s=\"2\">Van <a href=\"https://course.raku.org/nl/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">bytes op een socket<\/a> tot een chatruimte in een schermvol code: dat is Raku.<\/span><\/p>"]]},"es":{"t":"WebSockets","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una conversación HTTP es de un solo disparo: el cliente pregunta, el servidor responde y la conexión termina.<\/span> <span class=\"sg\" data-s=\"1\">Un <strong>WebSocket<\/strong> eleva eso a un canal de dos direcciones y larga vida: cualquiera de los dos lados puede enviar un mensaje en cualquier momento, que es lo que necesitan los chats, los juegos y los paneles en vivo.<\/span> <span class=\"sg\" data-s=\"2\">Cro admite WebSockets de fábrica, y un manejador de WebSocket se construye con las herramientas reactivas que ya conoces: un flujo de mensajes es un supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un servidor de chat diminuto.<\/span> <span class=\"sg\" data-s=\"1\">Todo mensaje que envía cualquier cliente lo pasa el servidor a mayúsculas y lo difunde a todos los conectados, de modo que lo que vuelve <em>no<\/em> es visiblemente lo que salió, demostrando que los datos hicieron de verdad el viaje de ida y vuelta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mira el bloque <code>web-socket<\/code>: es la parte reactiva del curso en miniatura.<\/span> <span class=\"sg\" data-s=\"1\">Cada cliente conectado recibe un <code>supply<\/code> con dos <code>whenever<\/code>: uno observa <code>$incoming<\/code>, los mensajes que llegan <em>desde<\/em> ese cliente, pasa cada uno a mayúsculas y lo empuja al supplier compartido <code>$chat<\/code>; el otro observa <code>$chat<\/code> y <code>emit<\/code>e cada texto difundido de vuelta <em>hacia<\/em> el cliente.<\/span> <span class=\"sg\" data-s=\"2\">Un solo <code>Supplier<\/code>, enganchado por cada conexión, es la sala de chat entera.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El pequeño <code>LAST { done }<\/code> importa.<\/span> <span class=\"sg\" data-s=\"1\">Es el <a href=\"https://course.raku.org/es/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">fáser<\/a> que conociste con los bucles; en un bloque <code>whenever<\/code> se dispara cuando el flujo observado <strong>termina<\/strong>, es decir, cuando ese cliente se desconecta.<\/span> <span class=\"sg\" data-s=\"2\">Llamar allí a <code>done<\/code> cierra el supply de la conexión entera, dándolo de baja de <code>$chat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sin ello, el <code>whenever $chat<\/code> de un cliente que se fue quedaría rezagado, y la difusión siguiente intentaría escribir en un socket cerrado e imprimiría un error en el servidor.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un navegador habla con esto con unas pocas líneas de JavaScript, pero otro programa Raku también: Cro proporciona además el lado del cliente.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> dispara el mensaje y retorna enseguida; la respuesta llega más tarde, en otro hilo, en el bloque <code>.tap<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La línea principal debe por tanto esperar antes de cerrar y, en lugar de dormir y confiar en la suerte, espera una <code>Promise<\/code> que el enganche cumple en el momento en que aterriza la respuesta: las herramientas de concurrencia de antes en esta parte haciendo exactamente aquello para lo que se hicieron.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ejecuta el servidor en una terminal y este cliente en otra.<\/span> <span class=\"sg\" data-s=\"1\">El cliente imprime las dos direcciones de la conversación:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lo que salió en minúsculas volvió en mayúsculas: el mensaje viajó <em>hacia<\/em> el servidor, allí se transformó y viajó <em>de vuelta<\/em> por la misma conexión.<\/span> <span class=\"sg\" data-s=\"1\">Ese es el canal de dos direcciones en acción.<\/span> <span class=\"sg\" data-s=\"2\">Arranca el cliente en varias terminales a la vez y cada mensaje aparece en todas: un chat que funciona en menos de treinta líneas de Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Estos ejemplos necesitan Cro instalado (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este es un buen lugar para terminar el curso.<\/span> <span class=\"sg\" data-s=\"1\">Un servicio, el cliente que lo llama y un canal vivo de dos direcciones entre ambos se apoyan en todo lo anterior — objetos y excepciones, expresiones regulares y gramáticas, y las herramientas funcionales, concurrentes y reactivas de esta parte —, y sin embargo el código sigue siendo corto y dice exactamente lo que quieres decir.<\/span> <span class=\"sg\" data-s=\"2\">De <a href=\"https://course.raku.org/es/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">bytes en un socket<\/a> a una sala de chat en una pantalla de código: eso es Raku.<\/span><\/p>"]]},"it":{"t":"WebSocket","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una conversazione HTTP avviene una volta sola: il client chiede, il server risponde, e la connessione è finita.<\/span> <span class=\"sg\" data-s=\"1\">Un <strong>WebSocket<\/strong> ne fa un canale a due vie di lunga durata — ciascun lato può inviare un messaggio in qualunque momento — ed è esattamente ciò di cui hanno bisogno chat, giochi e cruscotti dal vivo.<\/span> <span class=\"sg\" data-s=\"2\">Cro sa i WebSocket di suo, e un gestore WebSocket è costruito con gli strumenti reattivi che già conosci: un flusso di messaggi è un supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco un minuscolo server di chat.<\/span> <span class=\"sg\" data-s=\"1\">Ogni messaggio che un client invia viene reso maiuscolo dal server e inviato a tutti i connessi — quindi ciò che torna indietro visibilmente <em>non<\/em> è ciò che è uscito, e dimostra che i dati hanno davvero fatto andata e ritorno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Guarda il blocco <code>web-socket<\/code>: è la parte reattiva del corso in miniatura.<\/span> <span class=\"sg\" data-s=\"1\">Ogni client connesso riceve un <code>supply<\/code> con due <code>whenever<\/code>: uno osserva <code>$incoming<\/code>, i messaggi in arrivo <em>da<\/em> quel client, rende maiuscolo ciascuno e lo spinge nel <code>$chat<\/code> condiviso; l'altro osserva <code>$chat<\/code> e con <code>emit<\/code> rimanda ogni testo inviato <em>al<\/em> client.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>Supplier<\/code>, a cui ogni connessione attinge, è tutta la stanza della chat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il piccolo <code>LAST { done }<\/code> è importante.<\/span> <span class=\"sg\" data-s=\"1\">È il <a href=\"https://course.raku.org/it/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">phaser<\/a> che hai incontrato con i cicli; dentro un blocco <code>whenever<\/code> scatta quando il flusso osservato <strong>finisce<\/strong>, cioè quando quel client si disconnette.<\/span> <span class=\"sg\" data-s=\"2\">Chiamare lì <code>done<\/code> chiude l'intero supply della connessione e la disiscrive da <code>$chat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Senza di esso il <code>whenever $chat<\/code> di un client andato resterebbe appeso, e l'invio successivo proverebbe a scrivere in un socket chiuso, stampando un errore sul server.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un browser vi parla con poche righe di JavaScript, ma anche un altro programma Raku lo fa — Cro fornisce anche il lato client:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> fa partire il messaggio e ritorna subito; la risposta arriva più tardi su un altro thread nel blocco <code>.tap<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La linea principale deve quindi aspettare prima di chiudere — e invece di dormire e sperare, attende una <code>Promise<\/code> che la presa soddisfa nell'istante in cui la risposta arriva: gli strumenti di concorrenza visti prima in questa parte che fanno esattamente ciò per cui sono nati.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esegui il server in un terminale e questo client in un altro.<\/span> <span class=\"sg\" data-s=\"1\">Il client stampa entrambe le direzioni della conversazione:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ciò che è uscito minuscolo è tornato maiuscolo: il messaggio ha viaggiato <em>verso<\/em> il server, è stato trasformato lì ed è tornato <em>indietro<\/em> sulla stessa connessione.<\/span> <span class=\"sg\" data-s=\"1\">È il canale a due vie in azione.<\/span> <span class=\"sg\" data-s=\"2\">Avvia il client in più terminali insieme, e ogni messaggio comparirà in tutti: una chat funzionante in meno di trenta righe di Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questi esempi hanno bisogno di Cro installato (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">È un buon posto per chiudere il corso.<\/span> <span class=\"sg\" data-s=\"1\">Un servizio, il client che lo chiama e un canale a due vie vivo in mezzo poggiano su tutto ciò che è venuto prima — oggetti ed eccezioni, regex e grammatiche e gli strumenti funzionali, concorrenti e reattivi di questa parte — eppure il codice resta breve e dice esattamente ciò che intendi.<\/span> <span class=\"sg\" data-s=\"2\">Dai <a href=\"https://course.raku.org/it/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">byte su un socket<\/a> a una stanza di chat in una schermata di codice: questo è Raku.<\/span><\/p>"]]},"ru":{"t":"WebSocket","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">HTTP-разговор одноразов: клиент спросил, сервер ответил — и соединение закончено.<\/span> <span class=\"sg\" data-s=\"1\"><strong>WebSocket<\/strong> превращает его в долгоживущий двусторонний канал, где любая сторона может отправить сообщение в любой момент, — именно это нужно чатам, играм и живым панелям мониторинга.<\/span> <span class=\"sg\" data-s=\"2\">Cro поддерживает WebSocket из коробки, а обработчик WebSocket строится из уже знакомых вам реактивных инструментов: поток сообщений — это supply.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот крошечный чат-сервер.<\/span> <span class=\"sg\" data-s=\"1\">Каждое сообщение любого клиента сервер переводит в верхний регистр и рассылает всем подключённым, так что обратно приходит явно <em>не<\/em> то, что уходило, — доказательство того, что данные действительно проделали путь туда и обратно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на блок <code>web-socket<\/code> — это реактивная часть курса в миниатюре.<\/span> <span class=\"sg\" data-s=\"1\">Каждый подключённый клиент получает <code>supply<\/code> с двумя <code>whenever<\/code>: один следит за <code>$incoming<\/code>, сообщениями, приходящими <em>от<\/em> этого клиента, переводит каждое в верхний регистр и проталкивает в общий поставщик <code>$chat<\/code>; другой следит за <code>$chat<\/code> и <code>emit<\/code>-ит каждый разосланный текст обратно <em>клиенту<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Один <code>Supplier<\/code>, к которому подключено каждое соединение, и есть вся чат-комната.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Маленький <code>LAST { done }<\/code> тут важен.<\/span> <span class=\"sg\" data-s=\"1\">Это <a href=\"https://course.raku.org/ru/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">фазер<\/a>, с которым вы встречались у циклов; в блоке <code>whenever<\/code> он срабатывает, когда наблюдаемый поток <strong>заканчивается<\/strong>, то есть когда этот клиент отключается.<\/span> <span class=\"sg\" data-s=\"2\">Вызов <code>done<\/code> там закрывает весь supply соединения, отписывая его от <code>$chat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Без него <code>whenever $chat<\/code> ушедшего клиента остался бы висеть, и следующая рассылка попыталась бы писать в закрытый сокет и напечатала бы ошибку на сервере.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Браузер общается с этим сервером несколькими строчками JavaScript, но точно так же может и другая программа на Raku — клиентскую сторону Cro тоже предоставляет:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> отправляет сообщение и тут же возвращает управление; ответ приходит позже, в другом потоке, в блок <code>.tap<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому основная ветвь программы должна подождать перед закрытием — и вместо того чтобы спать в надежде на лучшее, она дожидается <code>Promise<\/code>, который подключение исполняет в тот момент, когда приходит ответ: инструменты конкурентности из начала этой части занимаются ровно тем, для чего созданы.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустите сервер в одном терминале, а этот клиент — в другом.<\/span> <span class=\"sg\" data-s=\"1\">Клиент печатает обе стороны разговора:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ушедшее строчными вернулось заглавными: сообщение отправилось <em>на<\/em> сервер, было там преобразовано и вернулось <em>обратно<\/em> по тому же соединению.<\/span> <span class=\"sg\" data-s=\"1\">Вот он, двусторонний канал в действии.<\/span> <span class=\"sg\" data-s=\"2\">Запустите клиента сразу в нескольких терминалах — и каждое сообщение появится во всех: работающий чат меньше чем в тридцати строках Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этим примерам нужен установленный Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это подходящее место, чтобы завершить курс.<\/span> <span class=\"sg\" data-s=\"1\">Сервис, вызывающий его клиент и живой двусторонний канал между ними опираются на всё, что было прежде, — объекты и исключения, регулярные выражения и грамматики, функциональные, конкурентные и реактивные инструменты этой части, — а код при этом остаётся коротким и говорит ровно то, что вы имеете в виду.<\/span> <span class=\"sg\" data-s=\"2\">От <a href=\"https://course.raku.org/ru/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">байтов в сокете<\/a> до чат-комнаты на один экран кода — вот что такое Raku.<\/span><\/p>"]]},"uk":{"t":"WebSockets","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Розмова через HTTP є одноразовою: клієнт питає, сервер відповідає, і з'єднання завершено.<\/span> <span class=\"sg\" data-s=\"1\"><strong>WebSocket<\/strong> підносить це до довготривалого двобічного каналу — будь-яка сторона може надіслати повідомлення будь-якої миті, а саме цього потребують чати, ігри та живі панелі.<\/span> <span class=\"sg\" data-s=\"2\">Cro підтримує WebSockets із коробки, і обробник WebSocket збудовано з реактивних засобів, які ви вже знаєте: потік повідомлень є потоком значень.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось крихітний сервер чату.<\/span> <span class=\"sg\" data-s=\"1\">Кожне повідомлення, яке надсилає будь-який клієнт, сервер переводить у верхній регістр і транслює всім приєднаним — тож те, що повертається, видимо <em>не є<\/em> тим, що виходило, і це доводить, що дані справді зробили повний оберт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Погляньте на блок <code>web-socket<\/code> — це реактивна частина курсу в мініатюрі.<\/span> <span class=\"sg\" data-s=\"1\">Кожен приєднаний клієнт отримує <code>supply<\/code> із двома <code>whenever<\/code>: один стежить за <code>$incoming<\/code>, тобто повідомленнями, що надходять <em>від<\/em> цього клієнта, переводить кожне у верхній регістр і штовхає в спільний постачальник <code>$chat<\/code>; другий стежить за <code>$chat<\/code> і <code>emit<\/code>-ить кожен транслюваний текст назад <em>до<\/em> клієнта.<\/span> <span class=\"sg\" data-s=\"2\">Один <code>Supplier<\/code>, до якого підключається кожне з'єднання, і є всією чат-кімнатою.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Маленьке <code>LAST { done }<\/code> важить чимало.<\/span> <span class=\"sg\" data-s=\"1\">Це <a href=\"https://course.raku.org/uk/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">фазер<\/a>, з яким ви зустрічалися в циклах; у блоці <code>whenever<\/code> він спрацьовує, коли потік, за яким стежать, <strong>завершується<\/strong> — тобто коли цей клієнт від'єднується.<\/span> <span class=\"sg\" data-s=\"2\">Виклик <code>done<\/code> там закриває весь потік з'єднання, відписуючи його від <code>$chat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Без цього <code>whenever $chat<\/code> клієнта, що пішов, тинявся б і далі, а наступна трансляція спробувала б записати в закритий сокет і надрукувала б помилку на сервері.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Браузер розмовляє з ним кількома рядками JavaScript, але так само може й інша програма на Raku — Cro надає й клієнтський бік:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> вистрілює повідомлення й повертається одразу; відповідь приходить пізніше, в іншому потоці, у блоці <code>.tap<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому головна лінія має зачекати перед закриттям — і замість спати й сподіватися, вона чекає на <code>Promise<\/code>, яку підключення виконує тієї ж миті, коли надходить відповідь: засоби конкурентності з попередніх розділів цієї частини роблять рівно те, для чого їх створили.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустіть сервер в одному терміналі, а цей клієнт — в іншому.<\/span> <span class=\"sg\" data-s=\"1\">Клієнт друкує обидва напрямки розмови:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Те, що вийшло малими літерами, повернулося великими — повідомлення помандрувало <em>до<\/em> сервера, було там перетворене й помандрувало <em>назад<\/em> тим самим з'єднанням.<\/span> <span class=\"sg\" data-s=\"1\">Ось двобічний канал у дії.<\/span> <span class=\"sg\" data-s=\"2\">Запустіть клієнт одразу в кількох терміналах — і кожне повідомлення з'явиться в усіх: робочий чат менш ніж у тридцяти рядках Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цим прикладам потрібен встановлений Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це доречне місце, щоб завершити курс.<\/span> <span class=\"sg\" data-s=\"1\">Сервіс, клієнт, що його викликає, і живий двобічний канал між ними стоять на всьому, що було до них, — на об'єктах і винятках, регексах і граматиках, а також на функційних, конкурентних та реактивних засобах цієї частини, — а код при цьому лишається коротким і каже саме те, що ви маєте на увазі.<\/span> <span class=\"sg\" data-s=\"2\">Від <a href=\"https://course.raku.org/uk/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">байтів у сокеті<\/a> до чат-кімнати на один екран коду: оце і є Raku.<\/span><\/p>"]]},"bg":{"t":"WebSockets","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">HTTP разговорът е еднократен: клиентът пита, сървърът отговаря и връзката приключва.<\/span> <span class=\"sg\" data-s=\"1\"><strong>WebSocket<\/strong> го издига до дълготраен двупосочен канал — всяка от страните може да изпрати съобщение във всеки момент, а точно това е нужно на чатовете, игрите и живите табла.<\/span> <span class=\"sg\" data-s=\"2\">Cro поддържа WebSockets наготово, а обработчикът на WebSocket е изграден от реактивните средства, които вече познавате: потокът от съобщения е поток от стойности.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето мъничък сървър за чат.<\/span> <span class=\"sg\" data-s=\"1\">Всяко съобщение, което който и да е клиент изпрати, сървърът превръща в главни букви и излъчва към всички свързани — така онова, което се връща, видимо <em>не е<\/em> онова, което е излязло, и това доказва, че данните наистина са направили пълната обиколка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::HTTP::Router;\nuse Cro::HTTP::Router::WebSocket;\nuse Cro::HTTP::Server;\n\nmy $chat = Supplier.new;\n\nmy $application = route {\n    get -&gt; 'chat' {\n        web-socket -&gt; $incoming {\n            supply {\n                whenever $incoming -&gt; $message {\n                    $chat.emit(uc(await $message.body-text));\n                    LAST { done }\n                }\n                whenever $chat -&gt; $text {\n                    emit $text;\n                }\n            }\n        }\n    }\n}\n\nmy $server = Cro::HTTP::Server.new(\n    :host('127.0.0.1'),\n    :port(8080),\n    :application($application),\n);\n$server.start;\n\nsay 'Chat server on ws://127.0.0.1:8080/chat — press Ctrl-C to stop';\n\nreact {\n    whenever signal(SIGINT) {\n        $server.stop;\n        done;\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Погледнете блока <code>web-socket<\/code> — той е реактивната част на курса в миниатюра.<\/span> <span class=\"sg\" data-s=\"1\">Всеки свързан клиент получава <code>supply<\/code> с два <code>whenever<\/code>: единият следи <code>$incoming<\/code> — съобщенията, пристигащи <em>от<\/em> този клиент, — превръща всяко в главни букви и го тласка в споделения доставчик <code>$chat<\/code>; другият следи <code>$chat<\/code> и <code>emit<\/code>-ва всеки излъчен текст обратно <em>към<\/em> клиента.<\/span> <span class=\"sg\" data-s=\"2\">Един-единствен <code>Supplier<\/code>, към който се включва всяка връзка, е цялата чат стая.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Мъничкото <code>LAST { done }<\/code> има значение.<\/span> <span class=\"sg\" data-s=\"1\">Това е <a href=\"https://course.raku.org/bg/advanced/block-phasers/\" target=\"_blank\" rel=\"noopener\">фазерът<\/a>, който срещнахте при циклите; в блок <code>whenever<\/code> той се задейства, когато следеният поток <strong>приключи<\/strong> — тоест когато този клиент се разкачи.<\/span> <span class=\"sg\" data-s=\"2\">Извикването на <code>done<\/code> там затваря целия поток на връзката и го отписва от <code>$chat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Без него <code>whenever $chat<\/code> на напусналия клиент би се мотал наоколо, а следващото излъчване би се опитало да пише в затворен сокет и би отпечатало грешка на сървъра.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Браузър говори с него с няколко реда JavaScript, но същото може и друга програма на Raku — Cro предоставя и клиентската страна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Cro::WebSocket::Client;\n\nmy $conn = await Cro::WebSocket::Client.connect('ws://127.0.0.1:8080/chat');\n\nmy $got = Promise.new;\n\n$conn.messages.tap(-&gt; $message {\n    say 'Received: ', await $message.body-text;\n    $got.keep;\n});\n\nsay 'Sending:  Hello, chat!';\n$conn.send('Hello, chat!');\n\nawait $got;\nawait $conn.close;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.send<\/code> изстрелва съобщението и се връща веднага; отговорът пристига по-късно, в друга нишка, в блока <code>.tap<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова главната линия трябва да изчака, преди да затвори — и вместо да спи и да се надява, тя изчаква <code>Promise<\/code>, което включването изпълнява в мига, в който отговорът пристигне: средствата за паралелност от по-рано в тази част правят точно онова, за което са създадени.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пуснете сървъра в един терминал, а този клиент — в друг.<\/span> <span class=\"sg\" data-s=\"1\">Клиентът отпечатва и двете посоки на разговора:<\/span><\/p>"],["code",0,"<pre><code>Sending:  Hello, chat!\nReceived: HELLO, CHAT!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Онова, което излезе с малки букви, се върна с главни — съобщението е пътувало <em>до<\/em> сървъра, било е преобразувано там и е пътувало <em>обратно<\/em> по същата връзка.<\/span> <span class=\"sg\" data-s=\"1\">Ето го двупосочния канал в действие.<\/span> <span class=\"sg\" data-s=\"2\">Пуснете клиента едновременно в няколко терминала и всяко съобщение се появява във всички: работещ чат в по-малко от тридесет реда на Raku.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тези примери се нуждаят от инсталиран Cro (<code>zef install cro<\/code>).<\/span><\/blockquote>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това е подходящо място, на което курсът да завърши.<\/span> <span class=\"sg\" data-s=\"1\">Услуга, клиентът, който я вика, и жив двупосочен канал между тях стоят върху всичко, което беше преди — обекти и изключения, регулярни изрази и граматики, както и функционалните, паралелните и реактивните средства от тази част, — а кодът при това остава кратък и казва точно каквото имате предвид.<\/span> <span class=\"sg\" data-s=\"2\">От <a href=\"https://course.raku.org/bg/paradigms/connections/sending-receiving/\" target=\"_blank\" rel=\"noopener\">байтове в сокет<\/a> до чат стая в един екран код: ето това е Raku.<\/span><\/p>"]]}}}</script>
