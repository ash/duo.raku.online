<script type="application/json" id="page-data">{"u":"paradigms/junctions","n":1263,"k":"section","pv":"paradigms/lazy/exercises/tribonacci/solution","nx":"paradigms/junctions/building-junctions","tr":["paradigms"],"L":{"en":{"t":"Junctions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">This subpart turns to <em>concurrent<\/em> programming — doing more than one thing at a time.<\/span> <span class=\"sg\" data-s=\"1\">Raku has a rich, friendly toolkit for it: junctions, threads, promises, and channels.<\/span> <span class=\"sg\" data-s=\"2\">We start with the gentlest of them, the <em>junction<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A junction is a single value that holds <strong>several<\/strong> values at once, joined by a logical relationship: <em>any<\/em> of them, <em>all<\/em> of them, <em>one<\/em> of them, or <em>none<\/em> of them.<\/span> <span class=\"sg\" data-s=\"1\">When you use a junction in a comparison, Raku tests every value behind it and combines the results.<\/span> <span class=\"sg\" data-s=\"2\">This often replaces a whole loop with a single expression — and, under the hood, the tests can run in parallel.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In the early days of the language, junctions went by another name: <em>quantum superpositions<\/em> — a nod to the way one value can hold many possibilities at once, much like a particle in quantum physics.<\/span><\/p>"]]},"de":{"t":"Junctions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieser Unterteil wendet sich der <em>nebenläufigen<\/em> Programmierung zu — mehr als eine Sache zugleich zu tun.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat dafür eine reiche, freundliche Werkzeugkiste: Junctions, Threads, Promises und Kanäle.<\/span> <span class=\"sg\" data-s=\"2\">Wir beginnen mit der sanftesten davon, der <em>Junction<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Junction ist ein einzelner Wert, der <strong>mehrere<\/strong> Werte zugleich enthält, verbunden durch eine logische Beziehung: <em>irgendeiner<\/em> von ihnen, <em>alle<\/em> von ihnen, <em>einer<\/em> von ihnen oder <em>keiner<\/em> von ihnen.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie eine Junction in einem Vergleich verwenden, prüft Raku jeden Wert dahinter und fasst die Ergebnisse zusammen.<\/span> <span class=\"sg\" data-s=\"2\">Das ersetzt oft eine ganze Schleife durch einen einzigen Ausdruck — und unter der Haube können die Prüfungen nebenläufig laufen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In den frühen Tagen der Sprache liefen Junctions unter einem anderen Namen: <em>Quantensuperpositionen<\/em> — ein Wink darauf, wie ein Wert viele Möglichkeiten zugleich enthalten kann, ganz wie ein Teilchen in der Quantenphysik.<\/span><\/p>"]]},"nl":{"t":"Juncties","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel wendt zich tot <em>concurrent<\/em> programmeren — meer dan één ding tegelijk doen.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft daar een rijke, vriendelijke gereedschapskist voor: juncties, threads, promises en kanalen.<\/span> <span class=\"sg\" data-s=\"2\">We beginnen met de zachtaardigste ervan, de <em>junctie<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een junctie is één enkele waarde die <strong>meerdere<\/strong> waarden tegelijk bevat, verbonden door een logische verhouding: <em>elke<\/em> ervan, <em>alle<\/em> ervan, <em>één<\/em> ervan, of <em>geen<\/em> ervan.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer je een junctie in een vergelijking gebruikt, test Raku elke waarde erachter en combineert het de resultaten.<\/span> <span class=\"sg\" data-s=\"2\">Dat vervangt vaak een hele lus door één enkele uitdrukking — en onder de motorkap kunnen de tests parallel draaien.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In de begindagen van de taal gingen juncties onder een andere naam door: <em>kwantumsuperposities<\/em> — een knipoog naar de manier waarop één waarde vele mogelijkheden tegelijk kan bevatten, net als een deeltje in de kwantumfysica.<\/span><\/p>"]]},"es":{"t":"Junctions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta subparte se vuelve hacia la programación <em>concurrente<\/em>: hacer más de una cosa a la vez.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene para ello un juego de herramientas rico y amable: uniones, hilos, promesas y canales.<\/span> <span class=\"sg\" data-s=\"2\">Empezamos por la más suave de todas, la <em>unión<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una unión es un solo valor que contiene <strong>varios<\/strong> valores a la vez, ligados por una relación lógica: <em>cualquiera<\/em> de ellos, <em>todos<\/em> ellos, <em>uno<\/em> de ellos o <em>ninguno<\/em> de ellos.<\/span> <span class=\"sg\" data-s=\"1\">Cuando usas una unión en una comparación, Raku prueba todos los valores que hay detrás y combina los resultados.<\/span> <span class=\"sg\" data-s=\"2\">Esto sustituye a menudo un bucle entero por una sola expresión y, entre bastidores, las pruebas pueden ejecutarse en paralelo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En los primeros tiempos del lenguaje, las uniones tenían otro nombre: <em>superposiciones cuánticas<\/em>, un guiño a la manera en que un valor puede contener muchas posibilidades a la vez, muy parecido a una partícula en física cuántica.<\/span><\/p>"]]},"it":{"t":"Junction","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa sottoparte passa alla programmazione <em>concorrente<\/em> — fare più di una cosa per volta.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha per questo un armamentario ricco e amichevole: junction, thread, promise e channel.<\/span> <span class=\"sg\" data-s=\"2\">Cominciamo dal più gentile di essi, la <em>junction<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una junction è un unico valore che contiene <strong>parecchi<\/strong> valori insieme, uniti da una relazione logica: <em>uno qualunque<\/em> di essi, <em>tutti<\/em>, <em>esattamente uno<\/em> oppure <em>nessuno<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Quando usi una junction in un confronto, Raku mette alla prova ogni valore dietro di essa e combina i risultati.<\/span> <span class=\"sg\" data-s=\"2\">Questo sostituisce spesso un intero ciclo con un'unica espressione — e, sotto il cofano, le prove possono girare in parallelo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ai primi tempi del linguaggio le junction andavano sotto un altro nome: <em>sovrapposizioni quantistiche<\/em> — un cenno al modo in cui un valore può contenere molte possibilità insieme, un po' come una particella nella fisica quantistica.<\/span><\/p>"]]},"lv":{"t":"Savienojumi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī apakšdaļa pievēršas <em>konkurentajai<\/em> programmēšanai — vairāku lietu darīšanai vienlaikus.<\/span> <span class=\"sg\" data-s=\"1\">Raku tai ir bagātīgs un draudzīgs rīku komplekts: savienojumi, pavedieni, solījumi un kanāli.<\/span> <span class=\"sg\" data-s=\"2\">Sākam ar maigāko no tiem — ar <em>savienojumu<\/em> (<em>junction<\/em>).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Savienojums ir viena vērtība, kas satur <strong>vairākas<\/strong> vērtības uzreiz, saistītas ar loģisku attiecību: <em>jebkura<\/em> no tām, <em>visas<\/em> no tām, <em>tieši viena<\/em> no tām vai <em>neviena<\/em> no tām.<\/span> <span class=\"sg\" data-s=\"1\">Kad savienojumu lietojat salīdzinājumā, Raku pārbauda katru aiz tā stāvošo vērtību un rezultātus apvieno.<\/span> <span class=\"sg\" data-s=\"2\">Tas bieži vien aizstāj veselu ciklu ar vienu izteiksmi — un zem pārsega pārbaudes var izpildīties paralēli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valodas pirmsākumos savienojumus sauca citādi: par <em>kvantu superpozīcijām<\/em> — mājiens uz to, kā viena vērtība var turēt daudzas iespējas vienlaikus, gluži kā daļiņa kvantu fizikā.<\/span><\/p>"]]},"ru":{"t":"Джанкшены","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Эта подчасть обращается к <em>конкурентному<\/em> программированию — умению делать больше одного дела одновременно.<\/span> <span class=\"sg\" data-s=\"1\">У Raku для этого есть богатый и дружелюбный набор средств: джанкшены, потоки, промисы и каналы.<\/span> <span class=\"sg\" data-s=\"2\">Начнём с самого мягкого из них — с <em>джанкшена<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Джанкшен — это одно значение, которое держит <strong>несколько<\/strong> значений сразу, связанных логическим отношением: <em>любое<\/em> из них, <em>все<\/em> они, <em>ровно одно<\/em> из них или <em>ни одно<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Когда вы используете джанкшен в сравнении, Raku проверяет каждое стоящее за ним значение и объединяет результаты.<\/span> <span class=\"sg\" data-s=\"2\">Часто это заменяет целый цикл одним выражением, а под капотом проверки могут выполняться параллельно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На заре языка джанкшены назывались иначе — <em>квантовыми суперпозициями<\/em>, намёком на то, как одно значение может держать множество возможностей сразу, подобно частице в квантовой физике.<\/span><\/p>"]]},"uk":{"t":"З'єднання","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ця підчастина повертає до <em>конкурентного<\/em> програмування — виконання кількох речей водночас.<\/span> <span class=\"sg\" data-s=\"1\">У Raku для цього є багатий і привітний набір інструментів: з'єднання, потоки виконання, обіцянки та канали.<\/span> <span class=\"sg\" data-s=\"2\">Починаємо з найлагіднішого з них — із <em>з'єднання<\/em> (junction).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">З'єднання — це одне значення, що містить <strong>кілька<\/strong> значень водночас, пов'язаних логічним відношенням: <em>будь-яке<\/em> з них, <em>усі<\/em> вони, <em>рівно одне<\/em> з них або <em>жодне<\/em> з них.<\/span> <span class=\"sg\" data-s=\"1\">Коли ви використовуєте з'єднання в порівнянні, Raku перевіряє кожне значення за ним і поєднує результати.<\/span> <span class=\"sg\" data-s=\"2\">Це часто замінює цілий цикл одним виразом — а під капотом перевірки можуть виконуватися паралельно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На світанку мови з'єднання звалися інакше: <em>квантові суперпозиції<\/em> — натяк на те, як одне значення може містити багато можливостей водночас, наче частинка у квантовій фізиці.<\/span><\/p>"]]},"bg":{"t":"Съединения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази подчаст се обръща към <em>паралелното<\/em> програмиране — правенето на повече от едно нещо наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Raku има богат и дружелюбен набор от инструменти за това: съединения, нишки, обещания и канали.<\/span> <span class=\"sg\" data-s=\"2\">Започваме с най-кроткия от тях — <em>съединението<\/em> (junction).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Съединението е една стойност, която съдържа <strong>няколко<\/strong> стойности наведнъж, свързани с логическо отношение: <em>която и да е<\/em> от тях, <em>всички<\/em> от тях, <em>точно една<\/em> от тях или <em>нито една<\/em> от тях.<\/span> <span class=\"sg\" data-s=\"1\">Когато използвате съединение в сравнение, Raku проверява всяка стойност зад него и обединява резултатите.<\/span> <span class=\"sg\" data-s=\"2\">Това често заменя цял цикъл с един-единствен израз — а под капака проверките могат да се изпълняват паралелно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В ранните дни на езика съединенията са носели друго име: <em>квантови суперпозиции<\/em> — намек за начина, по който една стойност може да съдържа много възможности наведнъж, досущ като частица в квантовата физика.<\/span><\/p>"]]},"eo":{"t":"Kunligoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu subparto turnas sin al <em>samtempa<\/em> programado — fari pli ol unu aferon samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas riĉan, afablan ilaron por tio: kunligojn, fadenojn, promesojn kaj kanalojn.<\/span> <span class=\"sg\" data-s=\"2\">Ni komencas per la plej milda el ili, la <em>kunligo<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kunligo estas unu sola valoro, kiu tenas <strong>plurajn<\/strong> valorojn samtempe, kunigitajn per logika rilato: <em>iu ajn<\/em> el ili, <em>ĉiuj<\/em> el ili, <em>unu<\/em> el ili aŭ <em>neniu<\/em> el ili.<\/span> <span class=\"sg\" data-s=\"1\">Kiam vi uzas kunligon en komparo, Raku testas ĉiun valoron malantaŭ ĝi kaj kombinas la rezultojn.<\/span> <span class=\"sg\" data-s=\"2\">Tio ofte anstataŭas tutan buklon per unu sola esprimo — kaj, sub la kapuĉo, la testoj povas plenumiĝi paralele.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la fruaj tagoj de la lingvo, kunligoj havis alian nomon: <em>kvantumaj superpozicioj<\/em> — aludo al la maniero, laŭ kiu unu valoro povas teni multajn eblojn samtempe, tre kiel partiklo en kvantuma fiziko.<\/span><\/p>"]]},"la":{"t":"Iuncturae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec subpars ad programmationem <em>simultaneam<\/em> se vertit — ad plus quam unam rem simul agendam.<\/span> <span class=\"sg\" data-s=\"1\">Raku instrumentorum copiam divitem et amicam ei habet: iuncturas, fila, promissa et canales.<\/span> <span class=\"sg\" data-s=\"2\">A mitissima earum incipimus, ab <em>iunctura<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iunctura est unus valor qui <strong>plures<\/strong> valores simul tenet, relatione logica coniunctos: <em>quaelibet<\/em> eorum, <em>omnes<\/em> eorum, <em>unus<\/em> eorum, vel <em>nullus<\/em> eorum.<\/span> <span class=\"sg\" data-s=\"1\">Cum iunctura in comparatione uteris, Raku omnem valorem post eam probat et effectus coniungit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc saepe totum anulum una expressione substituit — et, sub pallio, probationes parallelae currere possunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Primis linguae temporibus iuncturae alio nomine vocabantur: <em>superpositiones quanticae<\/em> — nutus ad modum quo unus valor multas possibilitates simul tenere potest, haud aliter ac particula in physica quantica.<\/span><\/p>"]]}}}</script>
