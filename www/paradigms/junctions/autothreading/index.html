<script type="application/json" id="page-data">{"u":"paradigms/junctions/autothreading","n":1266,"k":"topic","pv":"paradigms/junctions/building-junctions/quiz","nx":"paradigms/junctions/autothreading/quiz","tr":["paradigms","paradigms/junctions"],"L":{"en":{"t":"Autothreading","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you pass a junction to something that expects a single value — a comparison, or an ordinary function — Raku quietly applies that operation to <strong>every<\/strong> value behind the junction and joins the results back into a junction.<\/span> <span class=\"sg\" data-s=\"1\">This is called <em>autothreading<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example, adding to a junction adds to each of its values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>+ 10<\/code> was applied to <code>1<\/code>, <code>2<\/code>, and <code>3<\/code> separately, giving a new <em>any<\/em> junction <code>any(11, 12, 13)<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With a comparison, the joined result collapses to a single truth value according to the junction’s kind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — every value is positive\nsay so all(3, -1, 2) &gt; 0; # False — not all are positive\nsay so none(1, 2, 3) == 5; # True — none of them is 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Autothreading is what makes junctions so concise: one comparison checks many values.<\/span> <span class=\"sg\" data-s=\"1\">Conceptually the checks are independent, so Raku is free to run them in parallel — which is why junctions sit naturally in the concurrency toolkit.<\/span><\/p>"]]},"de":{"t":"Autothreading","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie eine Junction an etwas übergeben, das einen einzelnen Wert erwartet — einen Vergleich oder eine gewöhnliche Funktion —, wendet Raku diese Operation im Stillen auf <strong>jeden<\/strong> Wert hinter der Junction an und fügt die Ergebnisse wieder zu einer Junction zusammen.<\/span> <span class=\"sg\" data-s=\"1\">Das heißt <em>Autothreading<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zu einer Junction zu addieren addiert etwa zu jedem ihrer Werte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>+ 10<\/code> wurde einzeln auf <code>1<\/code>, <code>2<\/code> und <code>3<\/code> angewandt, was eine neue <em>any<\/em>-Junction <code>any(11, 12, 13)<\/code> ergibt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einem Vergleich klappt das zusammengefügte Ergebnis gemäß der Art der Junction zu einem einzelnen Wahrheitswert zusammen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — every value is positive\nsay so all(3, -1, 2) &gt; 0; # False — not all are positive\nsay so none(1, 2, 3) == 5; # True — none of them is 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Autothreading ist es, was Junctions so knapp macht: Ein Vergleich prüft viele Werte.<\/span> <span class=\"sg\" data-s=\"1\">Dem Wesen nach sind die Prüfungen unabhängig, Raku darf sie also nebenläufig ausführen — weshalb Junctions ganz natürlich in die Werkzeugkiste für Nebenläufigkeit gehören.<\/span><\/p>"]]},"nl":{"t":"Autothreading","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een junctie meegeeft aan iets dat één enkele waarde verwacht — een vergelijking of een gewone functie — past Raku die bewerking stilletjes toe op <strong>elke<\/strong> waarde achter de junctie en voegt het de resultaten weer tot een junctie samen.<\/span> <span class=\"sg\" data-s=\"1\">Dit heet <em>autothreading<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bij een junctie optellen telt bijvoorbeeld bij elk van haar waarden op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>+ 10<\/code> werd afzonderlijk op <code>1<\/code>, <code>2<\/code> en <code>3<\/code> toegepast, wat een nieuwe <em>any<\/em>-junctie <code>any(11, 12, 13)<\/code> gaf.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bij een vergelijking klapt het samengevoegde resultaat in tot één enkele waarheidswaarde volgens de soort junctie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — every value is positive\nsay so all(3, -1, 2) &gt; 0; # False — not all are positive\nsay so none(1, 2, 3) == 5; # True — none of them is 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Autothreading is wat juncties zo beknopt maakt: één vergelijking controleert veel waarden.<\/span> <span class=\"sg\" data-s=\"1\">In wezen zijn de controles onafhankelijk, dus Raku is vrij ze parallel te draaien — en daarom horen juncties van nature bij de gereedschapskist voor concurrency.<\/span><\/p>"]]},"es":{"t":"Autohilado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando pasas una unión a algo que espera un solo valor — una comparación o una función corriente —, Raku aplica calladamente esa operación a <strong>todos<\/strong> los valores que hay detrás de la unión y vuelve a juntar los resultados en una unión.<\/span> <span class=\"sg\" data-s=\"1\">Esto se llama <em>autoenhebrado<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ejemplo, sumar a una unión suma a cada uno de sus valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El <code>+ 10<\/code> se aplicó a <code>1<\/code>, <code>2<\/code> y <code>3<\/code> por separado, dando una nueva unión <em>any<\/em> <code>any(11, 12, 13)<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con una comparación, el resultado combinado se contrae a un único valor de verdad según la clase de la unión:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — every value is positive\nsay so all(3, -1, 2) &gt; 0; # False — not all are positive\nsay so none(1, 2, 3) == 5; # True — none of them is 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El autoenhebrado es lo que hace tan concisas a las uniones: una sola comparación revisa muchos valores.<\/span> <span class=\"sg\" data-s=\"1\">Conceptualmente las comprobaciones son independientes, así que Raku es libre de ejecutarlas en paralelo, y por eso las uniones encajan de forma natural en el juego de herramientas de concurrencia.<\/span><\/p>"]]},"it":{"t":"Autothreading","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando passi una junction a qualcosa che si aspetta un valore singolo — un confronto o una funzione ordinaria — Raku applica in silenzio quell'operazione a <strong>ogni<\/strong> valore dietro la junction e riunisce i risultati in una junction.<\/span> <span class=\"sg\" data-s=\"1\">Questo si chiama <em>autothreading<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per esempio, sommare a una junction somma a ciascuno dei suoi valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il <code>+ 10<\/code> è stato applicato a <code>1<\/code>, <code>2<\/code> e <code>3<\/code> separatamente, dando una nuova junction <em>any<\/em> <code>any(11, 12, 13)<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con un confronto, il risultato riunito collassa in un unico valore di verità secondo il genere della junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — every value is positive\nsay so all(3, -1, 2) &gt; 0; # False — not all are positive\nsay so none(1, 2, 3) == 5; # True — none of them is 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'autothreading è ciò che rende le junction così concise: un unico confronto controlla molti valori.<\/span> <span class=\"sg\" data-s=\"1\">Concettualmente i controlli sono indipendenti, quindi Raku è libero di eseguirli in parallelo — ed è per questo che le junction stanno naturalmente nell'armamentario della concorrenza.<\/span><\/p>"]]},"ru":{"t":"Автопоточность","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы передаёте джанкшен туда, где ожидается одно значение — в сравнение или в обычную функцию, — Raku незаметно применяет эту операцию к <strong>каждому<\/strong> значению за джанкшеном и снова собирает результаты в джанкшен.<\/span> <span class=\"sg\" data-s=\"1\">Это называется <em>автопоточностью<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например, прибавление к джанкшену прибавляет к каждому из его значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>+ 10<\/code> применилось к <code>1<\/code>, <code>2<\/code> и <code>3<\/code> по отдельности, дав новый джанкшен <em>any<\/em> — <code>any(11, 12, 13)<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В сравнении объединённый результат схлопывается в одно логическое значение согласно виду джанкшена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — каждое значение положительно\nsay so all(3, -1, 2) &gt; 0; # False — не все положительны\nsay so none(1, 2, 3) == 5; # True — ни одно из них не равно 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Автопоточность и делает джанкшены такими лаконичными: одно сравнение проверяет много значений.<\/span> <span class=\"sg\" data-s=\"1\">Концептуально проверки независимы, поэтому Raku волен выполнять их параллельно, — вот почему джанкшены естественно оказались в наборе средств для конкурентности.<\/span><\/p>"]]},"uk":{"t":"Автопотоковість","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви передаєте з'єднання туди, де очікується одне значення — у порівняння або у звичайну функцію, — Raku тихенько застосовує цю операцію до <strong>кожного<\/strong> значення за з'єднанням і зшиває результати назад у з'єднання.<\/span> <span class=\"sg\" data-s=\"1\">Це називають <em>автопотоковістю<\/em> (autothreading).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад, додавання до з'єднання додає до кожного з його значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>+ 10<\/code> було застосовано окремо до <code>1<\/code>, <code>2<\/code> та <code>3<\/code>, даючи нове з'єднання <em>any<\/em>: <code>any(11, 12, 13)<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У порівнянні зшитий результат згортається до одного значення істинності відповідно до різновиду з'єднання:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — кожне значення додатне\nsay so all(3, -1, 2) &gt; 0; # False — не всі додатні\nsay so none(1, 2, 3) == 5; # True — жодне з них не дорівнює 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме автопотоковість робить з'єднання такими лаконічними: одне порівняння перевіряє багато значень.<\/span> <span class=\"sg\" data-s=\"1\">Концептуально перевірки незалежні, тож Raku вільний виконувати їх паралельно — саме тому з'єднання природно вписуються в набір інструментів для конкурентності.<\/span><\/p>"]]},"bg":{"t":"Автоматично разнишване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато подадете съединение там, където се очаква една стойност — в сравнение или в обикновена функция, — Raku тихо прилага тази операция върху <strong>всяка<\/strong> стойност зад съединението и сглобява резултатите обратно в съединение.<\/span> <span class=\"sg\" data-s=\"1\">Това се нарича <em>автоматично разнишване<\/em> (autothreading).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например събирането със съединение добавя към всяка от стойностите му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j + 10; # any(11, 12, 13)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>+ 10<\/code> беше приложено поотделно към <code>1<\/code>, <code>2<\/code> и <code>3<\/code>, което дава ново съединение <em>any<\/em>: <code>any(11, 12, 13)<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При сравнение сглобеният резултат се свива до една стойност на истинност според вида на съединението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so all(3, 7, 2) &gt; 0;  # True  — всяка стойност е положителна\nsay so all(3, -1, 2) &gt; 0; # False — не всички са положителни\nsay so none(1, 2, 3) == 5; # True — нито една от тях не е 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именно автоматичното разнишване прави съединенията толкова сбити: едно сравнение проверява много стойности.<\/span> <span class=\"sg\" data-s=\"1\">Концептуално проверките са независими, така че Raku е свободен да ги изпълни паралелно — затова съединенията се вписват естествено в набора инструменти за паралелност.<\/span><\/p>"]]}}}</script>
