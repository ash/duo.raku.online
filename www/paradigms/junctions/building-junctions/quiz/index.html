<script type="application/json" id="page-data">{"u":"paradigms/junctions/building-junctions/quiz","n":1265,"k":"quiz","pv":"paradigms/junctions/building-junctions","nx":"paradigms/junctions/autothreading","tr":["paradigms","paradigms/junctions","paradigms/junctions/building-junctions"],"L":{"en":{"t":"Quiz — Junctions","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An <code>all<\/code> junction is true only when <strong>every<\/strong> value matches.<\/span> <span class=\"sg\" data-s=\"1\">The test <code>4 == all(2, 4, 6)<\/code> asks whether <code>4<\/code> equals <code>2<\/code> and <code>4<\/code> and <code>6<\/code> — which it does not, so the result is <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Curious what <em>could<\/em> make it <code>True<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">The left side would have to equal each of <code>2<\/code>, <code>4<\/code>, and <code>6<\/code> at once.<\/span> <span class=\"sg\" data-s=\"2\">No single number can — but a junction on the left can: an <code>any<\/code> junction that <strong>includes all three<\/strong> of those values works, because then every one of the comparisons succeeds.<\/span> <span class=\"sg\" data-s=\"3\">The two sides need not be the same size — the left may carry extra values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The first is <code>True<\/code> because <code>any(2, 4, 6, 8)<\/code> still equals <code>2<\/code>, <code>4<\/code>, and <code>6<\/code> (the extra <code>8<\/code> is harmless).<\/span> <span class=\"sg\" data-s=\"1\">The second is <code>False<\/code> because the left side has no <code>6<\/code>, so <code>left == 6<\/code> fails.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Junctions","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <code>all<\/code>-Junction ist nur wahr, wenn <strong>jeder<\/strong> Wert trifft.<\/span> <span class=\"sg\" data-s=\"1\">Die Prüfung <code>4 == all(2, 4, 6)<\/code> fragt, ob <code>4<\/code> gleich <code>2<\/code> und <code>4<\/code> und <code>6<\/code> ist — was es nicht ist, das Ergebnis ist also <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Neugierig, was es <code>True<\/code> machen <em>könnte<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Die linke Seite müsste zugleich gleich <code>2<\/code>, <code>4<\/code> und <code>6<\/code> sein.<\/span> <span class=\"sg\" data-s=\"2\">Keine einzelne Zahl kann das — eine Junction links aber schon: Eine <code>any<\/code>-Junction, die <strong>alle drei<\/strong> dieser Werte enthält, funktioniert, denn dann gelingt jeder der Vergleiche.<\/span> <span class=\"sg\" data-s=\"3\">Die beiden Seiten müssen nicht gleich groß sein — links dürfen zusätzliche Werte stehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die erste ist <code>True<\/code>, weil <code>any(2, 4, 6, 8)<\/code> weiterhin gleich <code>2<\/code>, <code>4<\/code> und <code>6<\/code> ist (die zusätzliche <code>8<\/code> schadet nicht).<\/span> <span class=\"sg\" data-s=\"1\">Die zweite ist <code>False<\/code>, weil der linken Seite eine <code>6<\/code> fehlt, <code>links == 6<\/code> also scheitert.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Juncties","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>all<\/code>-junctie is alleen waar wanneer <strong>elke<\/strong> waarde matcht.<\/span> <span class=\"sg\" data-s=\"1\">De test <code>4 == all(2, 4, 6)<\/code> vraagt of <code>4<\/code> gelijk is aan <code>2<\/code> én <code>4<\/code> én <code>6<\/code> — wat niet zo is, dus is het resultaat <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Benieuwd wat het <code>True<\/code> <em>zou kunnen<\/em> maken?<\/span> <span class=\"sg\" data-s=\"1\">De linkerkant zou tegelijk gelijk moeten zijn aan elk van <code>2<\/code>, <code>4<\/code> en <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Geen enkel getal kan dat — maar een junctie links wel: een <code>any<\/code>-junctie die <strong>alle drie<\/strong> die waarden bevat werkt, want dan slaagt elk van de vergelijkingen.<\/span> <span class=\"sg\" data-s=\"3\">De twee kanten hoeven niet even groot te zijn — links mag extra waarden dragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De eerste is <code>True<\/code> omdat <code>any(2, 4, 6, 8)<\/code> nog steeds gelijk is aan <code>2<\/code>, <code>4<\/code> en <code>6<\/code> (de extra <code>8<\/code> is onschadelijk).<\/span> <span class=\"sg\" data-s=\"1\">De tweede is <code>False<\/code> omdat de linkerkant geen <code>6<\/code> heeft, dus <code>links == 6<\/code> mislukt.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Junctions","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una unión <code>all<\/code> es verdadera solo cuando coincide <strong>todo<\/strong> valor.<\/span> <span class=\"sg\" data-s=\"1\">La prueba <code>4 == all(2, 4, 6)<\/code> pregunta si <code>4<\/code> es igual a <code>2<\/code> y a <code>4<\/code> y a <code>6<\/code>, cosa que no ocurre, así que el resultado es <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">¿Tienes curiosidad por saber qué <em>podría<\/em> hacerlo <code>True<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">El lado izquierdo tendría que ser igual a <code>2<\/code>, <code>4<\/code> y <code>6<\/code> a la vez.<\/span> <span class=\"sg\" data-s=\"2\">Ningún número por sí solo puede, pero una unión a la izquierda sí: funciona una unión <code>any<\/code> que <strong>incluya los tres<\/strong> valores, porque entonces todas las comparaciones se cumplen.<\/span> <span class=\"sg\" data-s=\"3\">Los dos lados no tienen por qué ser del mismo tamaño: el izquierdo puede llevar valores de más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La primera es <code>True<\/code> porque <code>any(2, 4, 6, 8)<\/code> sigue siendo igual a <code>2<\/code>, <code>4<\/code> y <code>6<\/code> (el <code>8<\/code> de más es inofensivo).<\/span> <span class=\"sg\" data-s=\"1\">La segunda es <code>False<\/code> porque el lado izquierdo no tiene ningún <code>6<\/code>, así que <code>left == 6<\/code> falla.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Junction","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una junction <code>all<\/code> è vera solo quando corrisponde <strong>ogni<\/strong> valore.<\/span> <span class=\"sg\" data-s=\"1\">La prova <code>4 == all(2, 4, 6)<\/code> chiede se <code>4<\/code> sia uguale a <code>2<\/code> e a <code>4<\/code> e a <code>6<\/code> — cosa che non è, quindi il risultato è <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Curioso di sapere che cosa <em>potrebbe<\/em> renderlo <code>True<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Il lato sinistro dovrebbe essere uguale a ciascuno di <code>2<\/code>, <code>4<\/code> e <code>6<\/code> insieme.<\/span> <span class=\"sg\" data-s=\"2\">Nessun singolo numero può — ma una junction a sinistra sì: funziona una junction <code>any<\/code> che <strong>comprenda tutti e tre<\/strong> quei valori, perché allora ognuno dei confronti riesce.<\/span> <span class=\"sg\" data-s=\"3\">I due lati non devono avere la stessa dimensione: il sinistro può portare valori in più:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prima è <code>True<\/code> perché <code>any(2, 4, 6, 8)<\/code> è comunque uguale a <code>2<\/code>, <code>4<\/code> e <code>6<\/code> (l'<code>8<\/code> in più è innocuo).<\/span> <span class=\"sg\" data-s=\"1\">La seconda è <code>False<\/code> perché il lato sinistro non ha alcun <code>6<\/code>, quindi <code>sinistro == 6<\/code> fallisce.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Джанкшены","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Джанкшен <code>all<\/code> истинен, только когда совпадает <strong>каждое<\/strong> значение.<\/span> <span class=\"sg\" data-s=\"1\">Проверка <code>4 == all(2, 4, 6)<\/code> спрашивает, равно ли <code>4<\/code> и <code>2<\/code>, и <code>4<\/code>, и <code>6<\/code>; это не так, поэтому результат — <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Любопытно, что <em>могло бы<\/em> сделать его <code>True<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Левая часть должна была бы равняться сразу и <code>2<\/code>, и <code>4<\/code>, и <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ни одно отдельное число так не может — а вот джанкшен слева может: подойдёт джанкшен <code>any<\/code>, <strong>включающий все три<\/strong> этих значения, ведь тогда каждое из сравнений удастся.<\/span> <span class=\"sg\" data-s=\"3\">Стороны не обязаны быть одного размера: слева могут быть и лишние значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Первое даёт <code>True<\/code>, потому что <code>any(2, 4, 6, 8)<\/code> всё равно равен и <code>2<\/code>, и <code>4<\/code>, и <code>6<\/code> (лишняя <code>8<\/code> безвредна).<\/span> <span class=\"sg\" data-s=\"1\">Второе даёт <code>False<\/code>, потому что слева нет <code>6<\/code>, и проверка <code>левое == 6<\/code> не проходит.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — З'єднання","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що надрукує наступна програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З'єднання <code>all<\/code> істинне лише тоді, коли підходить <strong>кожне<\/strong> значення.<\/span> <span class=\"sg\" data-s=\"1\">Перевірка <code>4 == all(2, 4, 6)<\/code> питає, чи дорівнює <code>4<\/code> і <code>2<\/code>, і <code>4<\/code>, і <code>6<\/code> — а це не так, тож результатом є <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Цікаво, що ж могло б зробити його <code>True<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Ліва сторона мала б дорівнювати водночас кожному з <code>2<\/code>, <code>4<\/code> та <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Жодне окреме число цього не може — а от з'єднання ліворуч може: підійде з'єднання <code>any<\/code>, що <strong>містить усі три<\/strong> ці значення, бо тоді кожне з порівнянь буде успішним.<\/span> <span class=\"sg\" data-s=\"3\">Сторони не мусять бути однакового розміру — ліва може нести зайві значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перше дає <code>True<\/code>, бо <code>any(2, 4, 6, 8)<\/code> усе одно дорівнює <code>2<\/code>, <code>4<\/code> та <code>6<\/code> (зайва <code>8<\/code> не шкодить).<\/span> <span class=\"sg\" data-s=\"1\">Друге дає <code>False<\/code>, бо в лівій стороні немає <code>6<\/code>, тож <code>left == 6<\/code> зазнає невдачі.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Съединения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 4 == all(2, 4, 6);<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">all(2, 4, 6)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">4<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Съединението <code>all<\/code> е истина само когато съвпада <strong>всяка<\/strong> стойност.<\/span> <span class=\"sg\" data-s=\"1\">Проверката <code>4 == all(2, 4, 6)<\/code> пита дали <code>4<\/code> е равно и на <code>2<\/code>, и на <code>4<\/code>, и на <code>6<\/code> — а това не е така, така че резултатът е <code>False<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Любопитно ви е какво <em>би<\/em> могло да го направи <code>True<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Лявата страна би трябвало да е равна едновременно на всяко от <code>2<\/code>, <code>4<\/code> и <code>6<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Никое отделно число не може — но съединение отляво може: върши работа съединение <code>any<\/code>, което <strong>съдържа и трите<\/strong> тези стойности, защото тогава всяко от сравненията успява.<\/span> <span class=\"sg\" data-s=\"3\">Двете страни не е нужно да са с еднакъв размер — лявата може да носи и допълнителни стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so any(2, 4, 6, 8) == all(2, 4, 6); # True\nsay so any(2, 4)       == all(2, 4, 6); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Първото е <code>True<\/code>, защото <code>any(2, 4, 6, 8)<\/code> все пак е равно на <code>2<\/code>, <code>4<\/code> и <code>6<\/code> (излишната <code>8<\/code> не пречи).<\/span> <span class=\"sg\" data-s=\"1\">Второто е <code>False<\/code>, защото в лявата страна няма <code>6<\/code>, така че <code>лявата == 6<\/code> се проваля.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
