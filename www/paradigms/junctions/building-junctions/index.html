<script type="application/json" id="page-data">{"u":"paradigms/junctions/building-junctions","n":1264,"k":"topic","pv":"paradigms/junctions","nx":"paradigms/junctions/building-junctions/quiz","tr":["paradigms","paradigms/junctions"],"L":{"en":{"t":"Building junctions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The simplest way to build a junction is with the junctive operators.<\/span> <span class=\"sg\" data-s=\"1\">The <code>|<\/code> operator makes an <em>any<\/em> junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The value <code>$j<\/code> stands for “1 or 2 or 3”.<\/span> <span class=\"sg\" data-s=\"1\">There are four kinds of junction, each with an operator and a matching function:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> or <code>a | b<\/code> — true if <strong>any<\/strong> value matches<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> or <code>a &amp; b<\/code> — true if <strong>all<\/strong> values match<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> or <code>a ^ b<\/code> — true if <strong>exactly one<\/strong> value matches<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — true if <strong>no<\/strong> value matches (this is the only kind with no operator form — use the function)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The function forms are handy with a list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A junction is most useful in a comparison.<\/span> <span class=\"sg\" data-s=\"1\">Asking whether a number equals an <em>any<\/em> junction tests it against every value at once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The operator form reads just as naturally — <code>1 | 2 | 3<\/code> is exactly the same <em>any<\/em> junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>so<\/code> turns the junctive result into a plain Boolean.<\/span> <span class=\"sg\" data-s=\"1\">The next topic looks at what happens behind the scenes when you do this.<\/span><\/p>"]]},"de":{"t":"Junctions bauen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Am einfachsten bauen Sie eine Junction mit den junktiven Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>|<\/code> erzeugt eine <em>any<\/em>-Junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Wert <code>$j<\/code> steht für „1 oder 2 oder 3“.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt vier Arten von Junctions, jede mit einem Operator und einer passenden Funktion:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> oder <code>a | b<\/code> — wahr, wenn <strong>irgendein<\/strong> Wert trifft<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> oder <code>a &amp; b<\/code> — wahr, wenn <strong>alle<\/strong> Werte treffen<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> oder <code>a ^ b<\/code> — wahr, wenn <strong>genau ein<\/strong> Wert trifft<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — wahr, wenn <strong>kein<\/strong> Wert trifft (das ist die einzige Art ohne Operatorform — nehmen Sie die Funktion)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Funktionsformen sind bei einer Liste praktisch:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Am nützlichsten ist eine Junction in einem Vergleich.<\/span> <span class=\"sg\" data-s=\"1\">Zu fragen, ob eine Zahl gleich einer <em>any<\/em>-Junction ist, prüft sie auf einen Schlag gegen jeden Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Operatorform liest sich ebenso natürlich — <code>1 | 2 | 3<\/code> ist genau dieselbe <em>any<\/em>-Junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>so<\/code> macht aus dem junktiven Ergebnis einen schlichten Wahrheitswert.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Thema betrachtet, was dabei hinter den Kulissen geschieht.<\/span><\/p>"]]},"nl":{"t":"Juncties bouwen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste manier om een junctie te bouwen is met de junctieve operatoren.<\/span> <span class=\"sg\" data-s=\"1\">De operator <code>|<\/code> maakt een <em>any<\/em>-junctie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De waarde <code>$j<\/code> staat voor \"1 of 2 of 3\".<\/span> <span class=\"sg\" data-s=\"1\">Er zijn vier soorten juncties, elk met een operator en een bijpassende functie:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> of <code>a | b<\/code> — waar als <strong>een willekeurige<\/strong> waarde matcht<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> of <code>a &amp; b<\/code> — waar als <strong>alle<\/strong> waarden matchen<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> of <code>a ^ b<\/code> — waar als <strong>precies één<\/strong> waarde matcht<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — waar als <strong>geen enkele<\/strong> waarde matcht (dit is de enige soort zonder operatorvorm — gebruik de functie)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De functievormen zijn handig bij een lijst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een junctie is het nuttigst in een vergelijking.<\/span> <span class=\"sg\" data-s=\"1\">Vragen of een getal gelijk is aan een <em>any<\/em>-junctie test het in één keer tegen elke waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De operatorvorm leest net zo natuurlijk — <code>1 | 2 | 3<\/code> is precies dezelfde <em>any<\/em>-junctie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>so<\/code> maakt van het junctieve resultaat een simpele boolean.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp bekijkt wat er achter de schermen gebeurt wanneer je dit doet.<\/span><\/p>"]]},"es":{"t":"Construir junctions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La manera más sencilla de construir una unión es con los operadores de unión.<\/span> <span class=\"sg\" data-s=\"1\">El operador <code>|<\/code> crea una unión <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El valor <code>$j<\/code> representa «1 o 2 o 3».<\/span> <span class=\"sg\" data-s=\"1\">Hay cuatro clases de unión, cada una con un operador y una función correspondiente:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> o <code>a | b<\/code> — verdadera si coincide <strong>cualquier<\/strong> valor<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> o <code>a &amp; b<\/code> — verdadera si coinciden <strong>todos<\/strong> los valores<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> o <code>a ^ b<\/code> — verdadera si coincide <strong>exactamente un<\/strong> valor<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — verdadera si <strong>no<\/strong> coincide ningún valor (es la única clase sin forma de operador: usa la función)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las formas de función resultan cómodas con una lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una unión es más útil dentro de una comparación.<\/span> <span class=\"sg\" data-s=\"1\">Preguntar si un número es igual a una unión <em>any<\/em> lo compara con todos los valores a la vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma de operador se lee igual de bien: <code>1 | 2 | 3<\/code> es exactamente la misma unión <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>so<\/code> convierte el resultado de la unión en un booleano corriente.<\/span> <span class=\"sg\" data-s=\"1\">El tema siguiente examina lo que ocurre entre bastidores cuando haces esto.<\/span><\/p>"]]},"it":{"t":"Costruire junction","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il modo più semplice di costruire una junction è con gli operatori giuntivi.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore <code>|<\/code> crea una junction <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il valore <code>$j<\/code> sta per «1 oppure 2 oppure 3».<\/span> <span class=\"sg\" data-s=\"1\">Ci sono quattro generi di junction, ciascuno con un operatore e una funzione corrispondente:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> oppure <code>a | b<\/code> — vero se corrisponde <strong>un valore qualunque<\/strong><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> oppure <code>a &amp; b<\/code> — vero se corrispondono <strong>tutti<\/strong> i valori<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> oppure <code>a ^ b<\/code> — vero se corrisponde <strong>esattamente un<\/strong> valore<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — vero se <strong>nessun<\/strong> valore corrisponde (è l'unico genere senza forma a operatore: usa la funzione)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le forme a funzione sono comode con un elenco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una junction è utilissima in un confronto.<\/span> <span class=\"sg\" data-s=\"1\">Chiedere se un numero è uguale a una junction <em>any<\/em> lo mette alla prova contro ogni valore in una volta sola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma a operatore si legge altrettanto naturalmente — <code>1 | 2 | 3<\/code> è esattamente la stessa junction <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>so<\/code> trasforma il risultato giuntivo in un booleano semplice.<\/span> <span class=\"sg\" data-s=\"1\">L'argomento successivo guarda che cosa succede dietro le quinte quando lo fai.<\/span><\/p>"]]},"ru":{"t":"Создание джанкшенов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Проще всего построить джанкшен джанктивными операторами.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>|<\/code> создаёт джанкшен <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значение <code>$j<\/code> означает «1, или 2, или 3».<\/span> <span class=\"sg\" data-s=\"1\">Джанкшены бывают четырёх видов, у каждого есть оператор и соответствующая функция:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> или <code>a | b<\/code> — истинно, если совпадает <strong>любое<\/strong> значение<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> или <code>a &amp; b<\/code> — истинно, если совпадают <strong>все<\/strong> значения<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> или <code>a ^ b<\/code> — истинно, если совпадает <strong>ровно одно<\/strong> значение<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — истинно, если <strong>ни одно<\/strong> значение не совпадает (это единственный вид без операторной формы — используйте функцию)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Функциональные формы удобны со списком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Больше всего пользы от джанкшена в сравнении.<\/span> <span class=\"sg\" data-s=\"1\">Вопрос, равно ли число джанкшену <em>any<\/em>, проверяет его сразу со всеми значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторная форма читается не менее естественно: <code>1 | 2 | 3<\/code> — это в точности тот же джанкшен <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>so<\/code> превращает джанктивный результат в обычное логическое значение.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема рассматривает, что при этом происходит за кулисами.<\/span><\/p>"]]},"uk":{"t":"Побудова з'єднань","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Найпростіший спосіб побудувати з'єднання — це з'єднувальні оператори.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>|<\/code> створює з'єднання <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значення <code>$j<\/code> означає «1, або 2, або 3».<\/span> <span class=\"sg\" data-s=\"1\">З'єднань є чотири різновиди, кожен зі своїм оператором та відповідною функцією:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> або <code>a | b<\/code> — істинне, якщо підходить <strong>будь-яке<\/strong> значення<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> або <code>a &amp; b<\/code> — істинне, якщо підходять <strong>усі<\/strong> значення<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> або <code>a ^ b<\/code> — істинне, якщо підходить <strong>рівно одне<\/strong> значення<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — істинне, якщо не підходить <strong>жодне<\/strong> значення (це єдиний різновид без операторної форми — користуйтеся функцією)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Функційні форми зручні зі списком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З'єднання найкорисніше в порівнянні.<\/span> <span class=\"sg\" data-s=\"1\">Запит, чи дорівнює число з'єднанню <em>any<\/em>, перевіряє його одразу проти кожного значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторна форма читається так само природно — <code>1 | 2 | 3<\/code> є точно тим самим з'єднанням <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>so<\/code> перетворює з'єднувальний результат на звичайне булеве значення.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема розглядає, що відбувається за лаштунками, коли ви так робите.<\/span><\/p>"]]},"bg":{"t":"Изграждане на съединения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Най-простият начин да изградите съединение са съединителните оператори.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>|<\/code> прави съединение <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $j = 1 | 2 | 3;\nsay $j; # any(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойността <code>$j<\/code> означава „1, или 2, или 3“.<\/span> <span class=\"sg\" data-s=\"1\">Видовете съединения са четири, всеки със свой оператор и съответна функция:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>any( … )<\/code> или <code>a | b<\/code> — истина, ако съвпада <strong>която и да е<\/strong> стойност<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>all( … )<\/code> или <code>a &amp; b<\/code> — истина, ако съвпадат <strong>всички<\/strong> стойности<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>one( … )<\/code> или <code>a ^ b<\/code> — истина, ако съвпада <strong>точно една<\/strong> стойност<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>none( … )<\/code> — истина, ако не съвпада <strong>нито една<\/strong> стойност (това е единственият вид без операторна форма — използвайте функцията)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Функционалните форми са удобни със списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say all(3, 7, 2);  # all(3, 7, 2)\nsay none(1, 2, 3); # none(1, 2, 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Съединението е най-полезно в сравнение.<\/span> <span class=\"sg\" data-s=\"1\">Въпросът дали дадено число е равно на съединение <em>any<\/em> го проверява срещу всяка стойност наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == any(1, 2, 3); # True\nsay so 5 == any(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторната форма се чете също толкова естествено — <code>1 | 2 | 3<\/code> е точно същото съединение <em>any<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 2 == 1 | 2 | 3; # True\nsay so 5 == 1 | 2 | 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>so<\/code> превръща съединителния резултат в обикновена булева стойност.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема разглежда какво се случва зад кулисите, когато направите това.<\/span><\/p>"]]}}}</script>
