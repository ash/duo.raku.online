<script type="application/json" id="page-data">{"u":"paradigms/threads/starting-a-thread","n":1276,"k":"topic","pv":"paradigms/threads","nx":"paradigms/threads/starting-a-thread/quiz","tr":["paradigms","paradigms/threads"],"L":{"en":{"t":"Starting a thread","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> takes a block and runs it on a new thread, returning a <code>Thread<\/code> object that represents the running work:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The block runs concurrently with the code that follows.<\/span> <span class=\"sg\" data-s=\"1\">The main program does <strong>not<\/strong> wait for it automatically — it continues immediately, and the thread does its work in the background.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">One small but important detail: the argument must be a block of code.<\/span> <span class=\"sg\" data-s=\"1\">An empty pair of braces <code>{ }<\/code> is an empty <strong>hash<\/strong>, not an empty block, so a thread always needs a body that actually does something:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # fine: a block with a body<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because the main program and the thread now run at the same time, you cannot rely on the order in which their output appears — unless you explicitly wait for the thread to finish, which is the subject of the next topic.<\/span><\/p>"]]},"de":{"t":"Einen Thread starten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> nimmt einen Block auf und führt ihn auf einem neuen Thread aus, wobei es ein <code>Thread<\/code>-Objekt liefert, das die laufende Arbeit darstellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Block läuft nebenläufig zum nachfolgenden Code.<\/span> <span class=\"sg\" data-s=\"1\">Das Hauptprogramm wartet <strong>nicht<\/strong> von selbst auf ihn — es läuft sofort weiter, und der Thread verrichtet seine Arbeit im Hintergrund.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine kleine, aber wichtige Einzelheit: Das Argument muss ein Codeblock sein.<\/span> <span class=\"sg\" data-s=\"1\">Ein leeres Paar geschweifter Klammern <code>{ }<\/code> ist eine leere <strong>Hash<\/strong> und kein leerer Block, ein Thread braucht also stets einen Rumpf, der tatsächlich etwas tut:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # fine: a block with a body<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da Hauptprogramm und Thread nun zugleich laufen, können Sie sich nicht auf die Reihenfolge ihrer Ausgaben verlassen — es sei denn, Sie warten ausdrücklich auf das Ende des Threads, das Thema des nächsten Abschnitts.<\/span><\/p>"]]},"nl":{"t":"Een thread starten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> neemt een blok aan en draait het op een nieuwe thread, waarbij het een <code>Thread<\/code>-object teruggeeft dat het lopende werk voorstelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het blok draait gelijktijdig met de code die erop volgt.<\/span> <span class=\"sg\" data-s=\"1\">Het hoofdprogramma wacht er <strong>niet<\/strong> vanzelf op — het gaat meteen door, en de thread doet zijn werk op de achtergrond.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eén klein maar belangrijk detail: het argument moet een codeblok zijn.<\/span> <span class=\"sg\" data-s=\"1\">Een leeg paar accolades <code>{ }<\/code> is een lege <strong>hash<\/strong> en geen leeg blok, dus een thread heeft altijd een body nodig die werkelijk iets doet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # fine: a block with a body<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat het hoofdprogramma en de thread nu tegelijk lopen, kun je niet vertrouwen op de volgorde waarin hun uitvoer verschijnt — tenzij je expliciet op de thread wacht, het onderwerp van het volgende onderdeel.<\/span><\/p>"]]},"es":{"t":"Iniciar un hilo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> recibe un bloque y lo ejecuta en un hilo nuevo, devolviendo un objeto <code>Thread<\/code> que representa el trabajo en marcha:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque se ejecuta de forma concurrente con el código que sigue.<\/span> <span class=\"sg\" data-s=\"1\">El programa principal <strong>no<\/strong> lo espera automáticamente: continúa de inmediato, y el hilo hace su trabajo en segundo plano.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un detalle pequeño pero importante: el argumento debe ser un bloque de código.<\/span> <span class=\"sg\" data-s=\"1\">Un par de llaves vacío <code>{ }<\/code> es un <strong>hash<\/strong> vacío, no un bloque vacío, así que un hilo siempre necesita un cuerpo que haga realmente algo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # fine: a block with a body<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como el programa principal y el hilo corren ahora al mismo tiempo, no puedes fiarte del orden en que aparece su salida, a menos que esperes explícitamente a que el hilo termine, que es el tema del apartado siguiente.<\/span><\/p>"]]},"it":{"t":"Avviare un thread","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> prende un blocco e lo esegue su un nuovo thread, restituendo un oggetto <code>Thread<\/code> che rappresenta il lavoro in corso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco gira in modo concorrente rispetto al codice che segue.<\/span> <span class=\"sg\" data-s=\"1\">Il programma principale <strong>non<\/strong> lo aspetta automaticamente: prosegue subito, e il thread fa il proprio lavoro in secondo piano.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un dettaglio piccolo ma importante: l'argomento deve essere un blocco di codice.<\/span> <span class=\"sg\" data-s=\"1\">Una coppia vuota di graffe <code>{ }<\/code> è un <strong>hash<\/strong> vuoto, non un blocco vuoto, quindi un thread ha sempre bisogno di un corpo che faccia davvero qualcosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # fine: a block with a body<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché il programma principale e il thread girano ora nello stesso momento, non puoi contare sull'ordine in cui compare il loro output — a meno che tu non aspetti esplicitamente che il thread finisca, che è l'argomento della pagina successiva.<\/span><\/p>"]]},"ru":{"t":"Запуск потока","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> принимает блок, выполняет его в новом потоке и возвращает объект <code>Thread<\/code>, представляющий выполняющуюся работу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок выполняется одновременно с кодом, идущим следом.<\/span> <span class=\"sg\" data-s=\"1\">Основная программа <strong>не<\/strong> ждёт его автоматически: она сразу продолжается, а поток делает своё дело в фоне.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Небольшая, но важная деталь: аргументом должен быть блок кода.<\/span> <span class=\"sg\" data-s=\"1\">Пустая пара фигурных скобок <code>{ }<\/code> — это пустой <strong>хеш<\/strong>, а не пустой блок, поэтому у потока всегда должно быть тело, которое действительно что-то делает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # нормально: блок с телом<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку основная программа и поток теперь идут одновременно, полагаться на порядок, в котором появится их вывод, нельзя — если только вы явно не дождётесь завершения потока, чему и посвящена следующая тема.<\/span><\/p>"]]},"uk":{"t":"Запуск потоку виконання","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> приймає блок і виконує його в новому потоці, повертаючи об'єкт <code>Thread<\/code>, що представляє роботу, яка триває:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок виконується конкурентно з кодом, що йде далі.<\/span> <span class=\"sg\" data-s=\"1\">Головна програма <strong>не<\/strong> чекає на нього автоматично — вона продовжується негайно, а потік робить свою роботу у фоні.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Одна дрібна, але важлива деталь: аргументом має бути блок коду.<\/span> <span class=\"sg\" data-s=\"1\">Порожня пара фігурних дужок <code>{ }<\/code> є порожнім <strong>хешем<\/strong>, а не порожнім блоком, тож потокові завжди потрібне тіло, яке щось справді робить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # нормально: блок із тілом<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки головна програма й потік тепер працюють водночас, ви не можете покладатися на порядок, у якому з'являється їхній вивід, — хіба що явно дочекаєтеся завершення потоку, і це тема наступної теми.<\/span><\/p>"]]},"bg":{"t":"Стартиране на нишка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> приема блок и го изпълнява в нова нишка, като връща обект <code>Thread<\/code>, представящ течащата работа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'hello from the thread' });<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът се изпълнява паралелно с кода, който следва.<\/span> <span class=\"sg\" data-s=\"1\">Основната програма <strong>не<\/strong> го изчаква автоматично — тя продължава веднага, а нишката си върши работата във фонов режим.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Една дребна, но важна подробност: аргументът трябва да е блок код.<\/span> <span class=\"sg\" data-s=\"1\">Празната двойка фигурни скоби <code>{ }<\/code> е празен <strong>хеш<\/strong>, а не празен блок, така че на нишката винаги ѝ трябва тяло, което наистина прави нещо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ 2 + 2 }); # добре: блок с тяло<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Понеже основната програма и нишката вече вървят едновременно, не можете да разчитате на реда, в който се появява изходът им — освен ако изрично не изчакате нишката да приключи, което е темата на следващата тема.<\/span><\/p>"]]}}}</script>
