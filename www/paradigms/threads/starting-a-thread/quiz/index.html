<script type="application/json" id="page-data">{"u":"paradigms/threads/starting-a-thread/quiz","n":1277,"k":"quiz","pv":"paradigms/threads/starting-a-thread","nx":"paradigms/threads/joining-threads","tr":["paradigms","paradigms/threads","paradigms/threads/starting-a-thread"],"L":{"en":{"t":"Quiz — Threads","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does <code>Thread.start<\/code> return?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">The value the block produced<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">A <code>Thread<\/code> object representing the running work<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code> if the thread started<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Nothing — it blocks until the thread finishes<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> launches the block on a new thread and immediately returns a <code>Thread<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">The main program keeps running; you use that object later to wait for the thread to complete.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Threads","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was liefert <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Den Wert, den der Block erzeugt hat<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Ein <code>Thread<\/code>-Objekt, das die laufende Arbeit darstellt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code>, wenn der Thread gestartet ist<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Nichts — es blockiert, bis der Thread fertig ist<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> startet den Block auf einem neuen Thread und liefert sofort ein <code>Thread<\/code>-Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Das Hauptprogramm läuft weiter; dieses Objekt verwenden Sie später, um auf das Ende des Threads zu warten.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Threads","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat geeft <code>Thread.start<\/code> terug?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">De waarde die het blok opleverde<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Een <code>Thread<\/code>-object dat het lopende werk voorstelt<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code> als de thread gestart is<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Niets — het blokkeert tot de thread klaar is<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> start het blok op een nieuwe thread en geeft meteen een <code>Thread<\/code>-object terug.<\/span> <span class=\"sg\" data-s=\"1\">Het hoofdprogramma loopt door; je gebruikt dat object later om op de voltooiing van de thread te wachten.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Hilos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué devuelve <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">El valor que produjo el bloque<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Un objeto <code>Thread<\/code> que representa el trabajo en marcha<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code> si el hilo arrancó<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Nada: se bloquea hasta que el hilo termina<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> lanza el bloque en un hilo nuevo y devuelve de inmediato un objeto <code>Thread<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El programa principal sigue corriendo; usas después ese objeto para esperar a que el hilo termine.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Thread","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Che cosa restituisce <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Il valore prodotto dal blocco<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Un oggetto <code>Thread<\/code> che rappresenta il lavoro in corso<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code> se il thread è partito<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Niente — blocca finché il thread non finisce<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> lancia il blocco su un nuovo thread e restituisce subito un oggetto <code>Thread<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il programma principale continua a girare; userai quell'oggetto più tardi per aspettare che il thread finisca.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Pavedieni","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko atgriež <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Vērtību, ko radīja bloks<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Thread<\/code> objektu, kas pārstāv notiekošo darbu<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code>, ja pavediens tika palaists<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Neko — tas bloķē, līdz pavediens beidz darbu<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> palaiž bloku jaunā pavedienā un tūlīt atgriež <code>Thread<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"1\">Galvenā programma turpina darboties; šo objektu jūs vēlāk izmantojat, lai sagaidītu pavediena pabeigšanu.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Потоки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что возвращает <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Значение, которое выдал блок<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Объект <code>Thread<\/code>, представляющий выполняющуюся работу<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code>, если поток запустился<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Ничего — он блокируется, пока поток не завершится<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> запускает блок в новом потоке и немедленно возвращает объект <code>Thread<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Основная программа продолжает работу; этот объект понадобится позже, чтобы дождаться завершения потока.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Потоки виконання","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що повертає <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Значення, яке дав блок<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Об'єкт <code>Thread<\/code>, що представляє роботу, яка триває<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code>, якщо потік запустився<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Нічого — він блокує виконання, аж поки потік не завершиться<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> запускає блок у новому потоці й негайно повертає об'єкт <code>Thread<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Головна програма працює далі; цей об'єкт ви використовуєте потім, щоб дочекатися завершення потоку.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Нишки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво връща <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Стойността, която блокът е дал<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Обект <code>Thread<\/code>, представящ течащата работа<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code>, ако нишката е стартирала<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Нищо — блокира, докато нишката не приключи<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> стартира блока в нова нишка и незабавно връща обект <code>Thread<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Основната програма продължава да върви; този обект използвате по-късно, за да изчакате нишката да приключи.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Fadenoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion redonas <code>Thread.start<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">La valoron, kiun la bloko produktis<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Objekton <code>Thread<\/code>, kiu reprezentas la kurantan laboron<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code>, se la fadeno startis<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Nenion — ĝi blokas ĝis la fadeno finiĝas<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> lanĉas la blokon sur nova fadeno kaj tuj redonas objekton <code>Thread<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ĉefa programo daŭre kuras; vi uzas tiun objekton poste por atendi, ke la fadeno finiĝu.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Fila","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid <code>Thread.start<\/code> reddit?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Valorem quem blocus produxit<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">Obiectum <code>Thread<\/code> quod laborem currentem repraesentat<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>True<\/code> si filum incepit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Nihil — moratur donec filum finiat<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Thread.start<\/code> blocum in filo novo lanciat et statim obiectum <code>Thread<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Programma principale currere pergit; illo obiecto postea uteris ut filum finire exspectes.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
