<script type="application/json" id="page-data">{"u":"paradigms/threads","n":1275,"k":"section","pv":"paradigms/junctions/exercises/none-negative/solution","nx":"paradigms/threads/starting-a-thread","tr":["paradigms"],"L":{"en":{"t":"Threads","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>thread<\/em> is an independent line of execution that runs alongside the rest of your program.<\/span> <span class=\"sg\" data-s=\"1\">Starting a thread lets a piece of work happen in the background while the main program carries on.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Threads are the lowest-level concurrency tool in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In everyday code you will usually reach for the higher-level <a href=\"/paradigms/promises/\"><em>promises<\/em><\/a> of the next section, which are built on top of threads but are far easier to combine.<\/span> <span class=\"sg\" data-s=\"2\">Still, it is worth seeing the basic mechanism: how to start a thread and how to wait for it.<\/span><\/p>"]]},"de":{"t":"Threads","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Thread<\/em> ist ein eigenständiger Ausführungsstrang, der neben dem Rest Ihres Programms läuft.<\/span> <span class=\"sg\" data-s=\"1\">Einen Thread zu starten lässt ein Stück Arbeit im Hintergrund geschehen, während das Hauptprogramm weiterläuft.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Threads sind das Werkzeug für Nebenläufigkeit auf der untersten Ebene in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Im Alltag greifen Sie meist zu den übergeordneten <a href=\"https://course.raku.org/de/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>Promises<\/em><\/a> des nächsten Abschnitts, die auf Threads aufbauen, sich aber weit leichter verbinden lassen.<\/span> <span class=\"sg\" data-s=\"2\">Dennoch lohnt es sich, den grundlegenden Mechanismus zu sehen: wie man einen Thread startet und wie man auf ihn wartet.<\/span><\/p>"]]},"nl":{"t":"Threads","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>thread<\/em> is een onafhankelijke uitvoeringslijn die naast de rest van je programma loopt.<\/span> <span class=\"sg\" data-s=\"1\">Een thread starten laat een stuk werk op de achtergrond gebeuren terwijl het hoofdprogramma doorgaat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Threads zijn het gereedschap voor concurrency op het laagste niveau in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In alledaagse code grijp je meestal naar de <a href=\"https://course.raku.org/nl/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>promises<\/em><\/a> van de volgende sectie, die bovenop threads gebouwd zijn maar veel makkelijker te combineren.<\/span> <span class=\"sg\" data-s=\"2\">Toch is het de moeite waard het basismechanisme te zien: hoe je een thread start en hoe je erop wacht.<\/span><\/p>"]]},"es":{"t":"Hilos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>hilo<\/em> es una línea de ejecución independiente que corre junto al resto de tu programa.<\/span> <span class=\"sg\" data-s=\"1\">Arrancar un hilo permite que un trabajo ocurra en segundo plano mientras el programa principal sigue adelante.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los hilos son la herramienta de concurrencia de más bajo nivel de Raku.<\/span> <span class=\"sg\" data-s=\"1\">En el código de todos los días recurrirás normalmente a las <a href=\"https://course.raku.org/es/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>promesas<\/em><\/a> de más alto nivel de la sección siguiente, que están construidas sobre los hilos pero son mucho más fáciles de combinar.<\/span> <span class=\"sg\" data-s=\"2\">Aun así, merece la pena ver el mecanismo básico: cómo arrancar un hilo y cómo esperarlo.<\/span><\/p>"]]},"it":{"t":"Thread","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>thread<\/em> è una linea di esecuzione indipendente che gira accanto al resto del tuo programma.<\/span> <span class=\"sg\" data-s=\"1\">Avviare un thread permette a un pezzo di lavoro di avvenire in secondo piano mentre il programma principale prosegue.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I thread sono lo strumento di concorrenza di più basso livello in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Nel codice di tutti i giorni ricorrerai di solito alle <a href=\"https://course.raku.org/it/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>promise<\/em><\/a> di livello più alto della sezione successiva, che sono costruite sopra i thread ma sono molto più facili da combinare.<\/span> <span class=\"sg\" data-s=\"2\">Vale comunque la pena vedere il meccanismo di base: come avviare un thread e come aspettarlo.<\/span><\/p>"]]},"ru":{"t":"Потоки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Поток<\/em> — это независимая линия выполнения, идущая рядом с остальной программой.<\/span> <span class=\"sg\" data-s=\"1\">Запуск потока позволяет выполнить часть работы в фоне, пока основная программа продолжает своё дело.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потоки — самое низкоуровневое средство конкурентности в Raku.<\/span> <span class=\"sg\" data-s=\"1\">В повседневном коде вы обычно возьмёте более высокоуровневые <a href=\"https://course.raku.org/ru/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>промисы<\/em><\/a> из следующего раздела: они построены поверх потоков, но комбинировать их куда проще.<\/span> <span class=\"sg\" data-s=\"2\">И всё же базовый механизм стоит увидеть: как запустить поток и как его дождаться.<\/span><\/p>"]]},"uk":{"t":"Потоки виконання","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Потік виконання<\/em> — це незалежна лінія виконання, що працює поряд з рештою вашої програми.<\/span> <span class=\"sg\" data-s=\"1\">Запуск потоку дозволяє шматкові роботи відбуватися у фоні, поки головна програма йде далі.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потоки виконання є найнижчорівневішим засобом конкурентності в Raku.<\/span> <span class=\"sg\" data-s=\"1\">У повсякденному коді ви зазвичай звертатиметеся до вищерівневих <a href=\"https://course.raku.org/uk/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>обіцянок<\/em><\/a> із наступного розділу, які збудовані поверх потоків, але їх набагато легше поєднувати.<\/span> <span class=\"sg\" data-s=\"2\">І все ж базовий механізм варто побачити: як запустити потік і як його дочекатися.<\/span><\/p>"]]},"bg":{"t":"Нишки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Нишката<\/em> е независима линия на изпълнение, която върви успоредно с останалата част от програмата ви.<\/span> <span class=\"sg\" data-s=\"1\">Стартирането на нишка позволява на едно парче работа да се случва във фонов режим, докато основната програма продължава.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Нишките са най-нискоравнищният инструмент за паралелност в Raku.<\/span> <span class=\"sg\" data-s=\"1\">В ежедневния код обикновено ще посягате към по-високоравнищните <a href=\"https://course.raku.org/bg/paradigms/promises/\" target=\"_blank\" rel=\"noopener\"><em>обещания<\/em><\/a> от следващия раздел, които са изградени върху нишките, но са далеч по-лесни за съчетаване.<\/span> <span class=\"sg\" data-s=\"2\">Все пак си струва да видите основния механизъм: как се стартира нишка и как се изчаква.<\/span><\/p>"]]}}}</script>
