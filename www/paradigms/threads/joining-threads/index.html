<script type="application/json" id="page-data">{"u":"paradigms/threads/joining-threads","n":1278,"k":"topic","pv":"paradigms/threads/starting-a-thread/quiz","nx":"paradigms/threads/exercises","tr":["paradigms","paradigms/threads"],"L":{"en":{"t":"Joining threads","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To wait for a thread to complete, call <code>.finish<\/code> on it (also spelled <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">The main program pauses there until the thread is done:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because <code>.finish<\/code> waits, the thread’s message is guaranteed to appear before <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Without the <code>.finish<\/code>, the order would be unpredictable, and the program might even end before the thread had a chance to print.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you start several threads, you join each one to be sure they have all completed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The two threads run concurrently, and joining both before the final <code>say<\/code> guarantees that <code>both finished<\/code> is printed only once they are truly done.<\/span> <span class=\"sg\" data-s=\"1\">Joining is how you bring concurrent work back together into a predictable point in your program.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Since a method call on a <a href=\"/paradigms/junctions/\">junction<\/a> spreads to every value it holds, you can join several threads in a single expression.<\/span> <span class=\"sg\" data-s=\"1\">Combine them with the <code>all<\/code> operator <code>&amp;<\/code> and call <code>.finish<\/code> on the junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Calling <code>.finish<\/code> on <code>$a &amp; $b<\/code> runs it on both threads, so the program waits until neither is still running — the same result as joining them one by one, but it reads as “finish both of these” and works for any number of threads joined with <code>&amp;<\/code>.<\/span><\/p>"]]},"de":{"t":"Threads zusammenführen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um auf das Ende eines Threads zu warten, rufen Sie darauf <code>.finish<\/code> auf (auch als <code>.join<\/code> geschrieben).<\/span> <span class=\"sg\" data-s=\"1\">Das Hauptprogramm hält dort an, bis der Thread fertig ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das gibt aus:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Weil <code>.finish<\/code> wartet, erscheint die Meldung des Threads gewiss vor <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ohne das <code>.finish<\/code> wäre die Reihenfolge unvorhersagbar, und das Programm könnte sogar enden, bevor der Thread Gelegenheit zur Ausgabe hatte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie mehrere Threads starten, führen Sie jeden zusammen, um sicher zu sein, dass alle fertig sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die beiden Threads laufen nebenläufig, und beide vor dem abschließenden <code>say<\/code> zusammenzuführen stellt sicher, dass <code>both finished<\/code> erst ausgegeben wird, wenn sie wirklich fertig sind.<\/span> <span class=\"sg\" data-s=\"1\">Das Zusammenführen ist der Weg, nebenläufige Arbeit an einem vorhersagbaren Punkt Ihres Programms wieder zusammenzubringen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da sich ein Methodenaufruf auf einer <a href=\"https://course.raku.org/de/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">Junction<\/a> auf jeden enthaltenen Wert ausbreitet, können Sie mehrere Threads in einem einzigen Ausdruck zusammenführen.<\/span> <span class=\"sg\" data-s=\"1\">Verbinden Sie sie mit dem <code>all<\/code>-Operator <code>&amp;<\/code> und rufen Sie <code>.finish<\/code> auf der Junction auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.finish<\/code> auf <code>$a &amp; $b<\/code> aufzurufen führt es auf beiden Threads aus, das Programm wartet also, bis keiner mehr läuft — dasselbe Ergebnis wie das einzelne Zusammenführen, aber es liest sich als „führe diese beiden zu Ende“ und funktioniert für beliebig viele mit <code>&amp;<\/code> verbundene Threads.<\/span><\/p>"]]},"nl":{"t":"Threads samenvoegen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om op de voltooiing van een thread te wachten, roep je er <code>.finish<\/code> op aan (ook geschreven als <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Het hoofdprogramma pauzeert daar tot de thread klaar is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>.finish<\/code> wacht, verschijnt de melding van de thread gegarandeerd vóór <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zonder de <code>.finish<\/code> zou de volgorde onvoorspelbaar zijn, en zou het programma zelfs kunnen eindigen voordat de thread de kans had om af te drukken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je meerdere threads start, voeg je ze elk samen om er zeker van te zijn dat ze allemaal klaar zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De twee threads lopen gelijktijdig, en beide samenvoegen vóór de afsluitende <code>say<\/code> garandeert dat <code>both finished<\/code> pas afgedrukt wordt zodra ze werkelijk klaar zijn.<\/span> <span class=\"sg\" data-s=\"1\">Samenvoegen is hoe je gelijktijdig werk weer op een voorspelbaar punt in je programma bijeenbrengt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat een methodeaanroep op een <a href=\"https://course.raku.org/nl/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">junctie<\/a> zich over elke waarde erin verspreidt, kun je meerdere threads in één uitdrukking samenvoegen.<\/span> <span class=\"sg\" data-s=\"1\">Combineer ze met de <code>all<\/code>-operator <code>&amp;<\/code> en roep <code>.finish<\/code> op de junctie aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.finish<\/code> op <code>$a &amp; $b<\/code> aanroepen draait die op beide threads, dus wacht het programma tot geen van beide nog loopt — hetzelfde resultaat als ze een voor een samenvoegen, maar het leest als \"maak deze allebei af\" en werkt voor elk aantal threads dat met <code>&amp;<\/code> samengevoegd is.<\/span><\/p>"]]},"es":{"t":"Unir hilos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para esperar a que un hilo termine, llama a <code>.finish<\/code> sobre él (también se escribe <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">El programa principal se detiene ahí hasta que el hilo acaba:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como <code>.finish<\/code> espera, el mensaje del hilo tiene garantizado aparecer antes que <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sin el <code>.finish<\/code>, el orden sería impredecible, y el programa podría incluso terminar antes de que el hilo tuviera ocasión de imprimir.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando arrancas varios hilos, unes cada uno para asegurarte de que todos han terminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los dos hilos corren de forma concurrente, y unir ambos antes del <code>say<\/code> final garantiza que <code>both finished<\/code> solo se imprima cuando estén realmente acabados.<\/span> <span class=\"sg\" data-s=\"1\">Unir es la manera de traer el trabajo concurrente de vuelta a un punto predecible de tu programa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como una llamada a un método sobre una <a href=\"https://course.raku.org/es/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">unión<\/a> se propaga a todos los valores que contiene, puedes unir varios hilos en una sola expresión.<\/span> <span class=\"sg\" data-s=\"1\">Combínalos con el operador <code>all<\/code>, <code>&amp;<\/code>, y llama a <code>.finish<\/code> sobre la unión:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Llamar a <code>.finish<\/code> sobre <code>$a &amp; $b<\/code> lo ejecuta sobre ambos hilos, así que el programa espera hasta que ninguno siga corriendo: el mismo resultado que unirlos uno a uno, pero se lee como «termina estos dos» y funciona para cualquier número de hilos unidos con <code>&amp;<\/code>.<\/span><\/p>"]]},"it":{"t":"Unire i thread","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per aspettare che un thread finisca, chiamavi sopra <code>.finish<\/code> (scritto anche <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Il programma principale si mette in pausa lì finché il thread non ha finito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>.finish<\/code> aspetta, il messaggio del thread compare con certezza prima di <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Senza il <code>.finish<\/code> l'ordine sarebbe imprevedibile, e il programma potrebbe persino finire prima che il thread abbia avuto modo di stampare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando avvii parecchi thread, unisci ciascuno per essere sicuro che siano tutti finiti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I due thread girano in modo concorrente, e unirli entrambi prima del <code>say<\/code> finale garantisce che <code>both finished<\/code> venga stampato solo quando sono davvero finiti.<\/span> <span class=\"sg\" data-s=\"1\">Unire è il modo di riportare il lavoro concorrente in un punto prevedibile del tuo programma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché una chiamata di metodo su una <a href=\"https://course.raku.org/it/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">junction<\/a> si diffonde a ogni valore che essa contiene, puoi unire più thread in un'unica espressione.<\/span> <span class=\"sg\" data-s=\"1\">Combinali con l'operatore <code>all<\/code> <code>&amp;<\/code> e chiama <code>.finish<\/code> sulla junction:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Chiamare <code>.finish<\/code> su <code>$a &amp; $b<\/code> lo esegue su entrambi i thread, quindi il programma aspetta finché nessuno dei due sta ancora girando — lo stesso risultato che unirli uno per uno, ma si legge come «finisci entrambi questi» e funziona per qualunque numero di thread uniti con <code>&amp;<\/code>.<\/span><\/p>"]]},"ru":{"t":"Присоединение потоков","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы дождаться завершения потока, вызовите у него <code>.finish<\/code> (то же самое пишется и как <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Основная программа приостанавливается на этом месте, пока поток не закончит:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>.finish<\/code> ждёт, сообщение потока гарантированно появится раньше <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>.finish<\/code> порядок был бы непредсказуем, а программа могла бы даже завершиться прежде, чем поток успел бы что-то напечатать.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда вы запускаете несколько потоков, каждый из них присоединяют, чтобы убедиться, что все они завершились:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Два потока выполняются одновременно, и присоединение обоих до последнего <code>say<\/code> гарантирует, что <code>both finished<\/code> напечатается только после того, как они действительно закончат.<\/span> <span class=\"sg\" data-s=\"1\">Присоединение — это способ свести конкурентную работу обратно к предсказуемой точке в вашей программе.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку вызов метода у <a href=\"https://course.raku.org/ru/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">джанкшена<\/a> распространяется на каждое хранимое им значение, несколько потоков можно присоединить одним выражением.<\/span> <span class=\"sg\" data-s=\"1\">Объедините их оператором <code>all<\/code> — <code>&amp;<\/code> — и вызовите <code>.finish<\/code> у джанкшена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вызов <code>.finish<\/code> у <code>$a &amp; $b<\/code> выполняет его для обоих потоков, поэтому программа ждёт, пока не останется ни одного работающего, — тот же результат, что и при поочерёдном присоединении, но читается это как «заверши оба» и работает для любого числа потоков, объединённых через <code>&amp;<\/code>.<\/span><\/p>"]]},"uk":{"t":"Приєднання потоків","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб дочекатися завершення потоку, викличте на ньому <code>.finish<\/code> (пишеться також <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Головна програма зупиняється там, аж поки потік не завершиться:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це друкує:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>.finish<\/code> чекає, повідомлення потоку гарантовано з'явиться перед <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>.finish<\/code> порядок був би непередбачуваним, і програма могла б навіть завершитися раніше, ніж потік устигне щось надрукувати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли ви запускаєте кілька потоків, ви приєднуєте кожен, щоб бути певними, що всі вони завершилися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва потоки працюють конкурентно, а приєднання їх обох перед останнім <code>say<\/code> гарантує, що <code>both finished<\/code> надрукується лише тоді, коли вони справді завершаться.<\/span> <span class=\"sg\" data-s=\"1\">Приєднання — це те, як ви зводите конкурентну роботу назад до передбачуваної точки у вашій програмі.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки виклик методу на <a href=\"https://course.raku.org/uk/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">з'єднанні<\/a> поширюється на кожне значення, яке те містить, кілька потоків можна приєднати одним виразом.<\/span> <span class=\"sg\" data-s=\"1\">Поєднайте їх оператором <code>all<\/code> — <code>&amp;<\/code> — і викличте <code>.finish<\/code> на з'єднанні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Виклик <code>.finish<\/code> на <code>$a &amp; $b<\/code> запускає його на обох потоках, тож програма чекає, аж поки жоден із них уже не працюватиме, — той самий результат, що й приєднання їх по черзі, але читається це як «заверши обидва» і працює для будь-якої кількості потоків, поєднаних через <code>&amp;<\/code>.<\/span><\/p>"]]},"bg":{"t":"Присъединяване на нишки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да изчакате нишка да приключи, извикайте <code>.finish<\/code> върху нея (пише се и <code>.join<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Основната програма спира там, докато нишката не завърши:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $t = Thread.start({ say 'in the thread' });\n$t.finish;\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>in the thread\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже <code>.finish<\/code> изчаква, съобщението на нишката гарантирано се появява преди <code>done<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>.finish<\/code> редът щеше да е непредвидим и програмата дори можеше да приключи, преди нишката да успее да отпечата нещо.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато стартирате няколко нишки, присъединявате всяка от тях, за да сте сигурни, че всички са приключили:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n$a.finish;\n$b.finish;\nsay 'both finished';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двете нишки вървят паралелно, а присъединяването и на двете преди последното <code>say<\/code> гарантира, че <code>both finished<\/code> се отпечатва едва когато те наистина са приключили.<\/span> <span class=\"sg\" data-s=\"1\">Присъединяването е начинът да съберете паралелната работа обратно в предвидима точка от програмата си.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже извикването на метод върху <a href=\"https://course.raku.org/bg/paradigms/junctions/\" target=\"_blank\" rel=\"noopener\">съединение<\/a> се разпространява към всяка стойност, която то съдържа, можете да присъедините няколко нишки с един израз.<\/span> <span class=\"sg\" data-s=\"1\">Съчетайте ги с оператора <code>all<\/code> — <code>&amp;<\/code> — и извикайте <code>.finish<\/code> върху съединението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Thread.start({ 1 + 1 });\nmy $b = Thread.start({ 2 + 2 });\n\n($a &amp; $b).finish;\nsay 'both finished';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикването на <code>.finish<\/code> върху <code>$a &amp; $b<\/code> го изпълнява върху двете нишки, така че програмата чака, докато нито една вече не работи — същият резултат като присъединяването им една по една, но се чете като „приключи и двете“ и работи за произволен брой нишки, съединени с <code>&amp;<\/code>.<\/span><\/p>"]]}}}</script>
