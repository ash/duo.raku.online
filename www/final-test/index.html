<script type="application/json" id="page-data">{"u":"final-test","n":1411,"k":"part","pv":"paradigms/cro/exercises/status-line/solution","nx":"addendum","tr":[],"L":{"en":{"t":"The Final Test","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A hundred questions across the whole course, Parts 1 through 5, in roughly the order you learnt them.<\/span> <span class=\"sg\" data-s=\"1\">Each one is checked the moment you answer: you see at once whether you were right — and why — but you cannot change an answer or step back, only move forward.<\/span> <span class=\"sg\" data-s=\"2\">At the end you get your score and a link you can keep to share your result or review what you missed.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>The Final Test needs JavaScript enabled in your browser.<\/noscript>\n<\/div>"],["raw",0,"<script src=\"/assets/final-test-questions.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"de":{"t":"Der Abschlusstest","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hundert Fragen aus dem ganzen Kurs, von Teil 1 bis Teil 5, ungefähr in der Reihenfolge, in der Sie den Stoff gelernt haben.<\/span> <span class=\"sg\" data-s=\"1\">Jede Frage wird geprüft, sobald Sie antworten: Sie sehen sofort, ob Sie richtig lagen — und warum —, doch Sie können eine Antwort nicht ändern und nicht zurückgehen, nur weiter.<\/span> <span class=\"sg\" data-s=\"2\">Am Ende bekommen Sie Ihr Ergebnis und einen Link, den Sie aufbewahren können, um ihn zu teilen oder nachzusehen, was Ihnen entgangen ist.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>Der Abschlusstest braucht JavaScript, in Ihrem Browser eingeschaltet.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'de';<\/script>\n<script src=\"/assets/final-test-questions-de.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"nl":{"t":"De eindtoets","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Honderd vragen uit de hele cursus, van deel 1 tot en met deel 5, ongeveer in de volgorde waarin je de stof geleerd hebt.<\/span> <span class=\"sg\" data-s=\"1\">Elke vraag wordt nagekeken zodra je antwoordt: je ziet meteen of je goed zat — en waarom — maar je kunt een antwoord niet veranderen of teruggaan, alleen verder.<\/span> <span class=\"sg\" data-s=\"2\">Aan het eind krijg je je score en een link die je kunt bewaren om hem te delen of om terug te kijken wat je gemist hebt.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>De eindtoets heeft JavaScript nodig, aangezet in je browser.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'nl';<\/script>\n<script src=\"/assets/final-test-questions-nl.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"es":{"t":"La prueba final","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cien preguntas sobre el curso entero, de la parte 1 a la parte 5, más o menos en el orden en que aprendiste la materia.<\/span> <span class=\"sg\" data-s=\"1\">Cada pregunta se comprueba en cuanto respondes: ves enseguida si acertaste —y por qué—, pero no puedes cambiar una respuesta ni volver atrás, solo seguir adelante.<\/span> <span class=\"sg\" data-s=\"2\">Al final obtienes tu puntuación y un enlace que puedes guardar para compartirlo o para revisar lo que se te escapó.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>La prueba final necesita JavaScript activado en tu navegador.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'es';<\/script>\n<script src=\"/assets/final-test-questions-es.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"it":{"t":"La prova finale","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cento domande su tutto il corso, dalla parte 1 alla parte 5, all'incirca nell'ordine in cui hai imparato la materia.<\/span> <span class=\"sg\" data-s=\"1\">Ogni domanda viene verificata non appena rispondi: vedi subito se avevi ragione — e perché — ma non puoi cambiare una risposta né tornare indietro, solo andare avanti.<\/span> <span class=\"sg\" data-s=\"2\">Alla fine ottieni il tuo punteggio e un link da conservare per condividerlo o per rivedere ciò che ti è sfuggito.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>La prova finale ha bisogno di JavaScript, attivato nel tuo browser.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'it';<\/script>\n<script src=\"/assets/final-test-questions-it.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"ru":{"t":"Финальный тест","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сто вопросов по всему курсу, с части 1 по часть 5, примерно в том порядке, в каком вы их изучали.<\/span> <span class=\"sg\" data-s=\"1\">Каждый проверяется сразу же, как вы отвечаете: вы тут же видите, правы ли вы — и почему, — но изменить ответ или вернуться назад нельзя, только идти вперёд.<\/span> <span class=\"sg\" data-s=\"2\">В конце вы получите свой результат и ссылку, которую можно сохранить, чтобы поделиться им или разобрать то, что не далось.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>Финальному тесту нужен включённый в браузере JavaScript.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'ru';<\/script>\n<script src=\"/assets/final-test-questions-ru.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"uk":{"t":"Фінальний тест","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сто запитань з усього курсу, з частини 1 по частину 5, приблизно в тому порядку, у якому ви їх вивчали.<\/span> <span class=\"sg\" data-s=\"1\">Кожне перевіряють тієї ж миті, коли ви відповідаєте: ви одразу бачите, чи маєте рацію — і чому, — але змінити відповідь чи повернутися назад не можна, тільки йти вперед.<\/span> <span class=\"sg\" data-s=\"2\">Наприкінці ви отримаєте свій результат і посилання, яке можна зберегти, щоб поділитися ним або розібрати те, що не далося.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>Фінальному тестові потрібен увімкнений у браузері JavaScript.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'uk';<\/script>\n<script src=\"/assets/final-test-questions-uk.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]},"bg":{"t":"Финалният тест","b":[["raw",0,"<link rel=\"stylesheet\" href=\"/assets/final-test.css?v=12\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сто въпроса от целия курс, от част 1 до част 5, приблизително в реда, в който сте учили материала.<\/span> <span class=\"sg\" data-s=\"1\">Всеки се проверява в мига, в който отговорите: веднага виждате дали сте прави — и защо, — но не можете да промените отговор или да се върнете назад, а само да продължите напред.<\/span> <span class=\"sg\" data-s=\"2\">Накрая получавате своя резултат и връзка, която можете да запазите, за да я споделите или да прегледате какво сте пропуснали.<\/span><\/p>"],["raw",0,"<div id=\"final-test\">\n  <noscript>Финалният тест се нуждае от включен JavaScript в браузъра ви.<\/noscript>\n<\/div>"],["raw",0,"<script>window.FINAL_TEST_LANG = 'bg';<\/script>\n<script src=\"/assets/final-test-questions-bg.js?v=12\"><\/script>\n<script src=\"/assets/final-test.js?v=12\" defer><\/script>"]]}}}</script>
