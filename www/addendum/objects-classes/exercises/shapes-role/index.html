<script type="application/json" id="page-data">{"u":"addendum/objects-classes/exercises/shapes-role","n":1493,"k":"exercise","pv":"addendum/objects-classes/exercises/bank-account/solution","nx":"addendum/objects-classes/exercises/shapes-role/solution","tr":["addendum","addendum/objects-classes"],"L":{"en":{"t":"Exercise ’Shapes sharing a role‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Define a <code>Shape<\/code> role that requires an <code>area<\/code> method, then make <code>Circle<\/code> and <code>Square<\/code> classes that do the role.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Write a <code>describe<\/code> subroutine whose parameter is <em>typed<\/em> as <code>Shape<\/code>, so it accepts any shape and refuses anything that is not one.<\/span> <span class=\"sg\" data-s=\"1\">It should print the shape’s area labelled with its class name.<\/span> <span class=\"sg\" data-s=\"2\">Call it for a circle of radius <code>2<\/code> and a square of side <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The subroutine never checks which kind of shape it received: because its parameter is a <code>Shape<\/code>, the object is guaranteed to have an <code>area<\/code> method, so the same <code>.area<\/code> call works on whichever shape comes in.<\/span> <span class=\"sg\" data-s=\"1\">That is what the role gives you — a single type you can require, and one piece of code that treats every class doing it uniformly.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Formen mit gemeinsamer Rolle‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bestimmen Sie eine Rolle <code>Shape<\/code>, die eine Methode <code>area<\/code> verlangt, und bauen Sie dann Klassen <code>Circle<\/code> und <code>Square<\/code>, welche die Rolle erfüllen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie eine Subroutine <code>describe<\/code>, deren Parameter als <code>Shape<\/code> <em>typisiert<\/em> ist, sodass sie jede Form annimmt und alles ablehnt, was keine ist.<\/span> <span class=\"sg\" data-s=\"1\">Sie soll die Fläche der Form ausgeben, beschriftet mit ihrem Klassennamen.<\/span> <span class=\"sg\" data-s=\"2\">Rufen Sie sie für einen Kreis mit Radius <code>2<\/code> und ein Quadrat mit Seite <code>3<\/code> auf.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine prüft nie, welche Art von Form sie bekommen hat: Weil ihr Parameter eine <code>Shape<\/code> ist, hat das Objekt mit Sicherheit eine Methode <code>area<\/code>, derselbe <code>.area<\/code>-Aufruf wirkt also auf jeder Form, die hereinkommt.<\/span> <span class=\"sg\" data-s=\"1\">Das ist es, was Ihnen die Rolle gibt — ein einziger Typ, den Sie verlangen können, und ein Stück Code, das jede Klasse, die ihn erfüllt, gleich behandelt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Vormen die een rol delen‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definieer een rol <code>Shape<\/code> die een methode <code>area<\/code> vereist, en maak daarna klassen <code>Circle<\/code> en <code>Square<\/code> die de rol doen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Schrijf een subroutine <code>describe<\/code> waarvan de parameter <em>getypeerd<\/em> is als <code>Shape<\/code>, zodat ze elke vorm accepteert en alles weigert wat dat niet is.<\/span> <span class=\"sg\" data-s=\"1\">Ze moet de oppervlakte van de vorm afdrukken, gelabeld met de naam van haar klasse.<\/span> <span class=\"sg\" data-s=\"2\">Roep haar aan voor een cirkel met straal <code>2<\/code> en een vierkant met zijde <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De subroutine controleert nooit welke soort vorm ze ontving: omdat haar parameter een <code>Shape<\/code> is, heeft het object gegarandeerd een methode <code>area<\/code>, dus werkt dezelfde aanroep <code>.area<\/code> op welke vorm er ook binnenkomt.<\/span> <span class=\"sg\" data-s=\"1\">Dat is wat de rol je geeft — één enkel type dat je kunt eisen, en één stuk code dat elke klasse die de rol doet uniform behandelt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Figuras que comparten un rol","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Define un rol <code>Shape<\/code> que exija un método <code>area<\/code>, y crea después clases <code>Circle<\/code> y <code>Square<\/code> que hagan el rol.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Escribe una subrutina <code>describe<\/code> cuyo parámetro esté <em>tipado<\/em> como <code>Shape<\/code>, de modo que acepte cualquier forma y rechace lo que no lo sea.<\/span> <span class=\"sg\" data-s=\"1\">Debe imprimir el área de la forma etiquetada con el nombre de su clase.<\/span> <span class=\"sg\" data-s=\"2\">Llámala para un círculo de radio <code>2<\/code> y un cuadrado de lado <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subrutina nunca comprueba qué clase de forma ha recibido: como su parámetro es un <code>Shape<\/code>, el objeto tiene garantizado un método <code>area<\/code>, así que la misma llamada a <code>.area<\/code> funciona con cualquier forma que entre.<\/span> <span class=\"sg\" data-s=\"1\">Eso es lo que te da el rol: un único tipo que puedes exigir, y un solo fragmento de código que trata de manera uniforme a todas las clases que lo hacen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Figure che condividono un ruolo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definisci un ruolo <code>Shape<\/code> che richiede un metodo <code>area<\/code>, poi crea le classi <code>Circle<\/code> e <code>Square<\/code> che assumono il ruolo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scrivi una subroutine <code>describe<\/code> il cui parametro sia <em>tipizzato<\/em> come <code>Shape<\/code>, così che accetti qualunque figura e rifiuti tutto ciò che non lo è. Deve stampare l'area della figura etichettata con il nome della sua classe.<\/span> <span class=\"sg\" data-s=\"1\">Chiamala per un cerchio di raggio <code>2<\/code> e un quadrato di lato <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subroutine non controlla mai che genere di figura ha ricevuto: poiché il suo parametro è una <code>Shape<\/code>, l'oggetto ha con certezza un metodo <code>area<\/code>, quindi la stessa chiamata <code>.area<\/code> funziona su qualunque figura arrivi.<\/span> <span class=\"sg\" data-s=\"1\">È questo che ti dà il ruolo — un unico tipo che puoi richiedere e un solo pezzo di codice che tratta allo stesso modo ogni classe che lo assume.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"ru":{"t":"Упражнение «Фигуры с общей ролью»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Определите роль <code>Shape<\/code>, требующую метод <code>area<\/code>, а затем создайте классы <code>Circle<\/code> и <code>Square<\/code>, которые эту роль исполняют.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Напишите подпрограмму <code>describe<\/code>, параметр которой <em>типизирован<\/em> как <code>Shape<\/code>, чтобы она принимала любую фигуру и отвергала всё, что фигурой не является.<\/span> <span class=\"sg\" data-s=\"1\">Она должна печатать площадь фигуры, снабдив её именем класса.<\/span> <span class=\"sg\" data-s=\"2\">Вызовите её для круга радиусом <code>2<\/code> и квадрата со стороной <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма нигде не проверяет, какую именно фигуру она получила: раз её параметр — <code>Shape<\/code>, у объекта гарантированно есть метод <code>area<\/code>, поэтому один и тот же вызов <code>.area<\/code> работает с любой пришедшей фигурой.<\/span> <span class=\"sg\" data-s=\"1\">Это и даёт роль — единый тип, который можно потребовать, и один участок кода, одинаково обращающийся с каждым классом, эту роль исполняющим.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Фігури зі спільною роллю»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Означте роль <code>Shape<\/code>, що вимагає методу <code>area<\/code>, а потім створіть класи <code>Circle<\/code> та <code>Square<\/code>, що виконують цю роль.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишіть підпрограму <code>describe<\/code>, чий параметр <em>типізовано<\/em> як <code>Shape<\/code>, щоб вона приймала будь-яку фігуру й відмовляла всьому, що фігурою не є. Вона має друкувати площу фігури, підписану іменем її класу.<\/span> <span class=\"sg\" data-s=\"1\">Викличте її для кола радіуса <code>2<\/code> та квадрата зі стороною <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма ніколи не перевіряє, який саме різновид фігури вона отримала: оскільки її параметр є <code>Shape<\/code>, об'єкт гарантовано має метод <code>area<\/code>, тож той самий виклик <code>.area<\/code> працює з будь-якою фігурою, що надійде.<\/span> <span class=\"sg\" data-s=\"1\">Ось що дає вам роль — єдиний тип, який можна вимагати, і один шматок коду, що однаково поводиться з кожним класом, який його виконує.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма друкує:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Фигури със споделена роля“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте роля <code>Shape<\/code>, която изисква метод <code>area<\/code>, а после направете класове <code>Circle<\/code> и <code>Square<\/code>, които изпълняват ролята.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>describe<\/code>, чийто параметър е <em>типизиран<\/em> като <code>Shape<\/code>, така че тя приема всяка фигура и отказва всичко, което не е фигура.<\/span> <span class=\"sg\" data-s=\"1\">Тя трябва да отпечата площта на фигурата, надписана с името на класа ѝ. Извикайте я за окръжност с радиус <code>2<\/code> и квадрат със страна <code>3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата никога не проверява какъв вид фигура е получила: понеже параметърът ѝ е <code>Shape<\/code>, обектът гарантирано има метод <code>area<\/code>, така че едно и също извикване <code>.area<\/code> работи с която и да е постъпила фигура.<\/span> <span class=\"sg\" data-s=\"1\">Точно това ви дава ролята — един тип, който можете да изисквате, и едно парче код, което се отнася еднакво с всеки клас, изпълняващ този тип.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/objects-classes/exercises/shapes-role/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
