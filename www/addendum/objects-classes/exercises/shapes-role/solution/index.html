<script type="application/json" id="page-data">{"u":"addendum/objects-classes/exercises/shapes-role/solution","n":1494,"k":"solution","pv":"addendum/objects-classes/exercises/shapes-role","nx":"addendum/objects-classes/exercises/point-quadrant","tr":["addendum","addendum/objects-classes"],"L":{"en":{"t":"The solution of ’Shapes sharing a role‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Strictly, the call <code>$shape.area<\/code> would work <em>without<\/em> the role at all. Raku resolves methods by name at the moment of the call, so as long as each object happens to have an <code>area<\/code> method, the loop runs — this is known as <em>duck typing<\/em>. So what does the role actually buy us here? Two guarantees.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>The role is a type you can require.<\/strong> <code>describe<\/code> is declared as <code>sub describe(Shape $shape)<\/code>, so it accepts only objects that do <code>Shape<\/code> and rejects anything else <em>before the body runs<\/em>. Pass it a plain number and the program refuses to compile:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without the role there is no such type — a duck-typed routine would take any argument and only blow up later, deep inside, when it reaches <code>.area<\/code>.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>The role is a contract.<\/strong> Declaring <code>area<\/code> as a stub (<code>method area { ... }<\/code>) forces every class that does the role to supply its own <code>area<\/code>. Forget it, and the mistake cannot go unnoticed:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo reports the missing method as soon as the class is <em>composed<\/em> — the program refuses to compile before a single <code>Triangle<\/code> object exists.<\/span> <span class=\"sg\" data-s=\"1\">And even in an implementation that accepts the class definition, the mistake surfaces at the latest when the method is used: the stub <code>{ ... }<\/code> inherited from the role is real code that dies with <code>Stub code executed<\/code> as soon as anyone calls it.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> asks the object for its class name, so the same <code>describe<\/code> labels each result correctly without knowing the type in advance.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Formen mit gemeinsamer Rolle","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Streng genommen wirkte der Aufruf <code>$shape.area<\/code> auch <em>ohne<\/em> jede Rolle. Raku löst Methoden im Augenblick des Aufrufs über den Namen auf, solange also jedes Objekt zufällig eine Methode <code>area<\/code> hat, läuft die Schleife — das ist als <em>Ententypisierung<\/em> bekannt. Was bringt uns die Rolle hier also wirklich? Zwei Zusicherungen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Die Rolle ist ein Typ, den man verlangen kann.<\/strong> <code>describe<\/code> ist als <code>sub describe(Shape $shape)<\/code> erklärt, nimmt also nur Objekte an, welche <code>Shape<\/code> erfüllen, und weist alles andere zurück, <em>bevor der Rumpf läuft<\/em>. Übergeben Sie ihr eine schlichte Zahl, und das Programm weigert sich zu übersetzen:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne die Rolle gibt es keinen solchen Typ — eine entengetypte Routine nähme jedes Argument an und flöge erst später tief im Inneren auseinander, wenn sie <code>.area<\/code> erreicht.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Die Rolle ist ein Vertrag.<\/strong> <code>area<\/code> als Stummel zu erklären (<code>method area { ... }<\/code>) zwingt jede Klasse, welche die Rolle erfüllt, ihr eigenes <code>area<\/code> beizusteuern. Vergessen Sie es, und der Fehler kann nicht unbemerkt bleiben:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo meldet die fehlende Methode, sobald die Klasse <em>zusammengesetzt<\/em> wird — das Programm weigert sich zu übersetzen, bevor auch nur ein einziges <code>Triangle<\/code>-Objekt besteht.<\/span> <span class=\"sg\" data-s=\"1\">Und selbst in einer Umsetzung, welche die Klassendefinition annähme, träte der Fehler spätestens bei der Verwendung der Methode hervor: Der von der Rolle geerbte Stummel <code>{ ... }<\/code> ist echter Code, der mit <code>Stub code executed<\/code> stirbt, sobald ihn jemand aufruft.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> fragt das Objekt nach seinem Klassennamen, dasselbe <code>describe<\/code> beschriftet also jedes Ergebnis richtig, ohne den Typ im Voraus zu kennen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Vormen die een rol delen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Strikt genomen zou de aanroep <code>$shape.area<\/code> <em>zonder<\/em> de rol ook werken. Raku lost methoden op naam op op het moment van de aanroep, dus zolang elk object toevallig een methode <code>area<\/code> heeft, draait de lus — dat staat bekend als <em>duck typing<\/em>. Wat levert de rol ons hier dan werkelijk op? Twee garanties.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>De rol is een type dat je kunt eisen.<\/strong> <code>describe<\/code> is gedeclareerd als <code>sub describe(Shape $shape)<\/code>, dus accepteert ze alleen objecten die <code>Shape<\/code> doen en weigert ze al het andere <em>voordat de body draait<\/em>. Geef haar een gewoon getal en het programma weigert te compileren:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder de rol bestaat zo'n type niet — een duck-getypeerde routine zou elk argument aannemen en pas later, diep binnenin, ontploffen wanneer ze bij <code>.area<\/code> komt.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>De rol is een contract.<\/strong> <code>area<\/code> als stomp declareren (<code>method area { ... }<\/code>) dwingt elke klasse die de rol doet haar eigen <code>area<\/code> te leveren. Vergeet die, en de fout kan niet onopgemerkt blijven:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo meldt de ontbrekende methode zodra de klasse <em>samengesteld<\/em> wordt — het programma weigert te compileren voordat er ook maar één <code>Triangle<\/code>-object bestaat.<\/span> <span class=\"sg\" data-s=\"1\">En zelfs in een implementatie die de klassedefinitie aanvaardt, komt de fout uiterlijk aan het licht wanneer de methode gebruikt wordt: de stomp <code>{ ... }<\/code> die van de rol geërfd is, is echte code die met <code>Stub code executed<\/code> sterft zodra iemand haar aanroept.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> vraagt het object om zijn klassenaam, dus labelt dezelfde <code>describe<\/code> elk resultaat correct zonder het type van tevoren te kennen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Figuras que comparten un rol","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">En rigor, la llamada <code>$shape.area<\/code> funcionaría <em>sin<\/em> el rol en absoluto. Raku resuelve los métodos por nombre en el momento de la llamada, así que mientras cada objeto tenga por casualidad un método <code>area<\/code>, el bucle funciona; esto se conoce como <em>tipado pato<\/em>. Entonces, ¿qué nos aporta aquí el rol en realidad? Dos garantías.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>El rol es un tipo que puedes exigir.<\/strong> <code>describe<\/code> se declara como <code>sub describe(Shape $shape)<\/code>, así que acepta solo objetos que hagan <code>Shape<\/code> y rechaza cualquier otra cosa <em>antes de que se ejecute el cuerpo<\/em>. Pásale un número corriente y el programa se niega a compilar:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin el rol no existe ese tipo: una rutina con tipado pato aceptaría cualquier argumento y solo reventaría más tarde, muy adentro, al llegar a <code>.area<\/code>.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>El rol es un contrato.<\/strong> Declarar <code>area<\/code> como un esbozo (<code>method area { ... }<\/code>) obliga a toda clase que haga el rol a proporcionar su propio <code>area<\/code>. Olvídalo y el error no puede pasar inadvertido:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo informa del método ausente en cuanto la clase se <em>compone<\/em>: el programa se niega a compilar antes de que exista un solo objeto <code>Triangle<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">E incluso en una implementación que aceptara la definición de la clase, el error sale a la luz a más tardar cuando se usa el método: el esbozo <code>{ ... }<\/code> heredado del rol es código real que muere con <code>Stub code executed<\/code> en cuanto alguien lo llama.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> le pregunta al objeto el nombre de su clase, así que el mismo <code>describe<\/code> etiqueta cada resultado correctamente sin conocer el tipo de antemano.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Figure che condividono un ruolo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A rigore, la chiamata <code>$shape.area<\/code> funzionerebbe <em>senza<\/em> alcun ruolo. Raku risolve i metodi per nome nel momento della chiamata, quindi finché ogni oggetto ha per caso un metodo <code>area<\/code>, il ciclo gira — è ciò che si chiama <em>tipizzazione a papera<\/em>. Che cosa ci porta allora davvero il ruolo? Due garanzie.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Il ruolo è un tipo che puoi richiedere.<\/strong> <code>describe<\/code> è dichiarata come <code>sub describe(Shape $shape)<\/code>, quindi accetta solo oggetti che assumono <code>Shape<\/code> e rifiuta tutto il resto <em>prima che il corpo giri<\/em>. Passale un semplice numero e il programma si rifiuta di compilare:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza il ruolo non esiste un tipo simile: una routine tipizzata a papera prenderebbe qualunque argomento ed esploderebbe solo più tardi, in profondità, quando arriva a <code>.area<\/code>.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Il ruolo è un contratto.<\/strong> Dichiarare <code>area<\/code> come abbozzo (<code>method area { ... }<\/code>) costringe ogni classe che assume il ruolo a fornire il proprio <code>area<\/code>. Dimenticalo, e l'errore non può passare inosservato:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo segnala il metodo mancante non appena la classe viene <em>composta<\/em>: il programma si rifiuta di compilare prima ancora che esista un solo oggetto <code>Triangle<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">E anche in un'implementazione che accettasse la definizione della classe, l'errore emergerebbe al più tardi quando il metodo viene usato: l'abbozzo <code>{ ... }<\/code> ereditato dal ruolo è codice vero che muore con <code>Stub code executed<\/code> non appena qualcuno lo chiama.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> chiede all'oggetto il nome della sua classe, quindi lo stesso <code>describe<\/code> etichetta correttamente ogni risultato senza conoscere il tipo in anticipo.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Фигуры с общей ролью","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Строго говоря, вызов <code>$shape.area<\/code> сработал бы и <em>без<\/em> всякой роли. Raku разрешает методы по имени в момент вызова, поэтому, пока у каждого объекта случайно есть метод <code>area<\/code>, цикл работает, — это известно как <em>утиная типизация<\/em>. Что же тогда даёт нам здесь роль? Две гарантии.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Роль — это тип, который можно потребовать.<\/strong> <code>describe<\/code> объявлена как <code>sub describe(Shape $shape)<\/code>, поэтому она принимает только объекты, исполняющие <code>Shape<\/code>, и отвергает всё прочее <em>ещё до выполнения тела<\/em>. Передайте ей обычное число — и программа откажется компилироваться:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без роли такого типа просто нет: подпрограмма с утиной типизацией приняла бы любой аргумент и рухнула бы лишь позже, глубоко внутри, добравшись до <code>.area<\/code>.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Роль — это договор.<\/strong> Объявление <code>area<\/code> заглушкой (<code>method area { ... }<\/code>) обязывает каждый класс, исполняющий роль, предоставить собственный <code>area<\/code>. Забудьте о нём — и ошибка не сможет остаться незамеченной:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo сообщает о недостающем методе сразу при <em>композиции<\/em> класса — программа отказывается компилироваться ещё до того, как появится хоть один объект <code>Triangle<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">И даже в реализации, которая приняла бы такое определение класса, ошибка всплывёт самое позднее при использовании метода: унаследованная от роли заглушка <code>{ ... }<\/code> — это настоящий код, который умирает с <code>Stub code executed<\/code>, как только кто-нибудь её вызовет.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> спрашивает у объекта имя его класса, поэтому одна и та же <code>describe<\/code> верно подписывает каждый результат, не зная типа заранее.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Фігури зі спільною роллю»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Строго кажучи, виклик <code>$shape.area<\/code> спрацював би й <em>без<\/em> жодної ролі. Raku розв'язує методи за іменем у мить виклику, тож поки кожен об'єкт випадково має метод <code>area<\/code>, цикл працює, — це відоме як <em>качина типізація<\/em>. То що ж роль насправді нам тут дає? Дві гарантії.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Роль є типом, який можна вимагати.<\/strong> <code>describe<\/code> оголошено як <code>sub describe(Shape $shape)<\/code>, тож вона приймає лише об'єкти, що виконують <code>Shape<\/code>, і відхиляє все інше <em>ще до виконання тіла<\/em>. Передайте їй звичайне число — і програма відмовиться компілюватися:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без ролі такого типу немає — качино типізована процедура прийняла б будь-який аргумент і луснула б лише пізніше, десь глибоко всередині, коли дійшла б до <code>.area<\/code>.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Роль є контрактом.<\/strong> Оголошення <code>area<\/code> як заглушки (<code>method area { ... }<\/code>) змушує кожен клас, що виконує роль, надати власний <code>area<\/code>. Забудьте його — і помилка не пройде непоміченою:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo повідомляє про відсутній метод одразу, щойно клас <em>скомпоновано<\/em>, — програма відмовляється компілюватися ще до того, як існуватиме бодай один об'єкт <code>Triangle<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">І навіть у реалізації, що прийняла б це означення класу, помилка виринає щонайпізніше тоді, коли метод використають: заглушка <code>{ ... }<\/code>, успадкована від ролі, є справжнім кодом, що помирає з <code>Stub code executed<\/code>, щойно її хтось викличе.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> питає в об'єкта ім'я його класу, тож той самий <code>describe<\/code> правильно підписує кожен результат, не знаючи типу наперед.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Фигури със споделена роля","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Shape {\n    method area { ... }\n}\n\nclass Circle does Shape {\n    has $.radius;\n    method area { 3.14159 * $.radius ** 2 }\n}\n\nclass Square does Shape {\n    has $.side;\n    method area { $.side ** 2 }\n}\n\nsub describe(Shape $shape) {\n    say \"{$shape.^name}: {$shape.area}\";\n}\n\nfor Circle.new(radius =&gt; 2), Square.new(side =&gt; 3) -&gt; $shape {\n    describe($shape);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/shapes-role.raku\" target=\"_blank\" rel=\"noopener\">shapes-role.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Circle: 12.56636\nSquare: 9<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Строго погледнато, извикването <code>$shape.area<\/code> би работило и <em>без<\/em> никаква роля. Raku разрешава методите по име в мига на извикването, така че докато всеки обект случайно има метод <code>area<\/code>, цикълът върви — това е известно като <em>патешко типизиране<\/em>. Тогава какво всъщност ни носи ролята тук? Две гаранции.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Ролята е тип, който можете да изисквате.<\/strong> <code>describe<\/code> е обявена като <code>sub describe(Shape $shape)<\/code>, така че тя приема само обекти, изпълняващи <code>Shape<\/code>, и отхвърля всичко останало <em>още преди тялото да се изпълни<\/em>. Подайте ѝ обикновено число и програмата отказва да се компилира:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     describe(42);     # Calling describe(Int) will never work with declared signature (Shape $shape)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без ролята такъв тип няма — патешко типизирана процедура би приела всякакъв аргумент и би гръмнала едва по-късно, дълбоко вътре, когато стигне до <code>.area<\/code>.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><strong>Ролята е договор.<\/strong> Обявяването на <code>area<\/code> като заглушка (<code>method area { ... }<\/code>) принуждава всеки клас, който изпълнява ролята, да достави свой собствен <code>area<\/code>. Забравете го и грешката не може да мине незабелязана:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     class Triangle does Shape {         has $.base;         has $.height;     }     # Method 'area' must be implemented by Triangle because it is required by roles: Shape.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $t = Triangle.new(base =&gt; 3, height =&gt; 4);     say $t.area; # Stub code executed     <code><\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo съобщава за липсващия метод веднага щом класът бъде <em>композиран<\/em> — програмата отказва да се компилира още преди да съществува дори един обект <code>Triangle<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">И дори в реализация, която би приела това определение на класа, грешката изплува най-късно когато методът бъде използван: заглушката <code>{ ... }<\/code>, наследена от ролята, е истински код, който умира със <code>Stub code executed<\/code>, щом някой я извика.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$shape.^name<\/code> пита обекта за името на класа му, така че един и същ <code>describe<\/code> надписва всеки резултат правилно, без да знае типа предварително.<\/span><\/li><\/ol>"]]}}}</script>
