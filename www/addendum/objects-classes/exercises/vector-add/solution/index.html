<script type="application/json" id="page-data">{"u":"addendum/objects-classes/exercises/vector-add/solution","n":1498,"k":"solution","pv":"addendum/objects-classes/exercises/vector-add","nx":"addendum/objects-classes/exercises/animal-inheritance","tr":["addendum","addendum/objects-classes"],"L":{"en":{"t":"The solution of ’Adding vectors‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> does not change either vector; it constructs and returns a brand-new <code>Vector<\/code> from the summed components.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Notice that <code>Vector<\/code> is used <em>inside its own definition<\/em> — as the parameter type <code>Vector $v<\/code> and in <code>Vector.new<\/code>. That is perfectly fine: the type name is known from the moment its declaration starts, so a class can freely refer to itself in its own methods. There is no need for any kind of forward declaration.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> stringifies its argument with the <code>Str<\/code> method, so the custom <code>\"($.x, $.y)\"<\/code> formatting is what appears.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Vektoren addieren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> verändert keinen der beiden Vektoren; es baut aus den summierten Komponenten einen brandneuen <code>Vector<\/code> und liefert ihn zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beachten Sie, dass <code>Vector<\/code> <em>innerhalb seiner eigenen Definition<\/em> verwendet wird — als Parametertyp <code>Vector $v<\/code> und in <code>Vector.new<\/code>. Das ist völlig in Ordnung: Der Typname ist vom Beginn seiner Erklärung an bekannt, eine Klasse darf sich in ihren eigenen Methoden also frei auf sich selbst beziehen. Eine Vorwärtserklärung irgendeiner Art ist nicht nötig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> verwandelt sein Argument mit der Methode <code>Str<\/code> in eine Zeichenkette, es erscheint also die eigene Formatierung <code>\"($.x, $.y)\"<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Vectoren optellen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> verandert geen van beide vectoren; ze bouwt een gloednieuwe <code>Vector<\/code> uit de opgetelde componenten en geeft die terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Merk op dat <code>Vector<\/code> <em>binnen zijn eigen definitie<\/em> gebruikt wordt — als parametertype <code>Vector $v<\/code> en in <code>Vector.new<\/code>. Dat is volkomen in orde: de typenaam is bekend vanaf het moment dat de declaratie begint, dus een klasse kan in haar eigen methoden vrijelijk naar zichzelf verwijzen. Er is geen enkele vorm van vooruitdeclaratie nodig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> maakt van zijn argument een string met de methode <code>Str<\/code>, dus is de eigen opmaak <code>\"($.x, $.y)\"<\/code> wat er verschijnt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Sumar vectores","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> no cambia ninguno de los dos vectores; construye y devuelve un <code>Vector<\/code> completamente nuevo a partir de las componentes sumadas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fíjate en que <code>Vector<\/code> se usa <em>dentro de su propia definición<\/em>: como tipo del parámetro <code>Vector $v<\/code> y en <code>Vector.new<\/code>. Eso está perfectamente bien: el nombre del tipo se conoce desde el momento en que empieza su declaración, así que una clase puede referirse libremente a sí misma en sus propios métodos. No hace falta ninguna clase de declaración anticipada.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> convierte su argumento en cadena con el método <code>Str<\/code>, así que lo que aparece es el formato personalizado <code>\"($.x, $.y)\"<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Sommare vettori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> non cambia nessuno dei due vettori; costruisce e restituisce un <code>Vector<\/code> completamente nuovo a partire dalle componenti sommate.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nota che <code>Vector<\/code> viene usato <em>dentro la propria definizione<\/em> — come tipo del parametro <code>Vector $v<\/code> e in <code>Vector.new<\/code>. Va benissimo: il nome del tipo è noto dal momento in cui la sua dichiarazione comincia, quindi una classe può riferirsi liberamente a se stessa nei propri metodi. Non serve alcuna dichiarazione anticipata.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> trasforma il proprio argomento in stringa con il metodo <code>Str<\/code>, quindi compare la formattazione personalizzata <code>\"($.x, $.y)\"<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Сложение векторов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> не меняет ни один из векторов: он конструирует и возвращает совершенно новый <code>Vector<\/code> из сложенных компонент.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратите внимание, что <code>Vector<\/code> используется <em>внутри собственного определения<\/em> — и как тип параметра <code>Vector $v<\/code>, и в <code>Vector.new<\/code>. Это совершенно нормально: имя типа известно с момента начала его объявления, поэтому класс волен ссылаться на себя в своих же методах. Никакого предварительного объявления не требуется.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> превращает свой аргумент в строку методом <code>Str<\/code>, поэтому на экран попадает пользовательское форматирование <code>\"($.x, $.y)\"<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Додавання векторів»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> не змінює жодного з векторів; він конструює й повертає цілком новий <code>Vector<\/code> зі складених компонент.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зауважте, що <code>Vector<\/code> використано <em>усередині його ж власного означення<\/em> — як тип параметра <code>Vector $v<\/code> та у <code>Vector.new<\/code>. Це цілком нормально: ім'я типу відоме з тієї миті, коли починається його оголошення, тож клас вільно може посилатися на себе у власних методах. Жодного попереднього оголошення не потрібно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> перетворює свій аргумент на рядок за допомогою методу <code>Str<\/code>, тож з'являється саме власне форматування <code>\"($.x, $.y)\"<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Събиране на вектори","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vector {\n    has $.x;\n    has $.y;\n\n    method add(Vector $v) {\n        Vector.new(x =&gt; $.x + $v.x, y =&gt; $.y + $v.y);\n    }\n\n    method Str { \"($.x, $.y)\" }\n}\n\nmy $sum = Vector.new(x =&gt; 1, y =&gt; 2).add(Vector.new(x =&gt; 3, y =&gt; 4));\n\nput $sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/vector-add.raku\" target=\"_blank\" rel=\"noopener\">vector-add.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>(4, 6)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>add<\/code> не променя нито един от векторите; той конструира и връща изцяло нов <code>Vector<\/code> от събраните компоненти.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Забележете, че <code>Vector<\/code> се използва <em>вътре в собственото си определение<\/em> — като тип на параметъра <code>Vector $v<\/code> и във <code>Vector.new<\/code>. Това е напълно наред: името на типа е известно от мига, в който започва обявяването му, така че класът свободно може да се позовава на себе си в собствените си методи. Никакво предварително обявяване не е нужно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>put<\/code> превръща аргумента си в низ чрез метода <code>Str<\/code>, така че се появява именно собственото форматиране <code>\"($.x, $.y)\"<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
