<script type="application/json" id="page-data">{"u":"addendum/objects-classes/exercises/bank-account/solution","n":1492,"k":"solution","pv":"addendum/objects-classes/exercises/bank-account","nx":"addendum/objects-classes/exercises/shapes-role","tr":["addendum","addendum/objects-classes"],"L":{"en":{"t":"The solution of ’A bank account‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> declares the attribute <em>private<\/em> — with the <code>!<\/code> twigil it has no generated accessor at all, so the only way to change the balance is through the methods the class provides. A <code>method balance<\/code> gives the outside world a way to read it, but no way to set it.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is deliberate. Had we written <code>has $.balance<\/code>, the <code>.<\/code> twigil would add a public accessor — read-only by default, but one careless <code>is rw<\/code> on it would expose direct assignment like <code>$account.balance = 1_000_000<\/code>, letting anyone move money without going through <code>deposit<\/code> or <code>withdraw<\/code>. Keeping the attribute private rules that out by construction: the balance can only ever change by the account's own rules, such as the insufficient-funds check in <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The second withdrawal asks for more than the balance, so it is declined and the balance stays at <code>70<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein Bankkonto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> erklärt das Attribut als <em>privat<\/em> — mit dem Twigil <code>!<\/code> hat es überhaupt keinen erzeugten Zugriffsweg, der einzige Weg, den Kontostand zu ändern, führt also über die Methoden, welche die Klasse bereitstellt. Eine <code>method balance<\/code> gibt der Außenwelt eine Möglichkeit, ihn zu lesen, aber keine, ihn zu setzen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das ist Absicht. Hätten wir <code>has $.balance<\/code> geschrieben, fügte der Twigil <code>.<\/code> einen öffentlichen Zugriffsweg hinzu — standardmäßig nur lesend, doch ein unbedachtes <code>is rw<\/code> daran gäbe die unmittelbare Zuweisung wie <code>$account.balance = 1_000_000<\/code> frei und ließe jeden Geld bewegen, ohne über <code>deposit<\/code> oder <code>withdraw<\/code> zu gehen. Das Attribut privat zu halten schließt das bauartbedingt aus: Der Kontostand kann sich immer nur nach den eigenen Regeln des Kontos ändern, etwa nach der Deckungsprüfung in <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die zweite Abhebung verlangt mehr als den Kontostand, sie wird also abgelehnt, und der Kontostand bleibt bei <code>70<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een bankrekening","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> declareert het attribuut <em>private<\/em> — met de twigil <code>!<\/code> heeft het helemaal geen gegenereerde accessor, dus de enige manier om het saldo te veranderen is via de methoden die de klasse aanbiedt. Een <code>method balance<\/code> geeft de buitenwereld een manier om het te lezen, maar geen manier om het te zetten.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dat is met opzet. Hadden we <code>has $.balance<\/code> geschreven, dan zou de twigil <code>.<\/code> een publieke accessor toevoegen — standaard alleen-lezen, maar één onachtzame <code>is rw<\/code> erop zou rechtstreekse toekenning als <code>$account.balance = 1_000_000<\/code> blootleggen, waarmee iedereen geld kon verplaatsen zonder langs <code>deposit<\/code> of <code>withdraw<\/code> te gaan. Het attribuut private houden sluit dat door constructie uit: het saldo kan alleen ooit veranderen volgens de eigen regels van de rekening, zoals de controle op ontoereikend saldo in <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De tweede opname vraagt meer dan het saldo, dus wordt hij geweigerd en blijft het saldo op <code>70<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Una cuenta bancaria","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> declara el atributo como <em>privado<\/em>: con el tigilo <code>!<\/code> no tiene ningún accesor generado, así que la única manera de cambiar el saldo es a través de los métodos que la clase proporciona. Un <code>method balance<\/code> le da al mundo exterior una forma de leerlo, pero ninguna de asignarlo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esto es deliberado. Si hubiéramos escrito <code>has $.balance<\/code>, el tigilo <code>.<\/code> añadiría un accesor público —de solo lectura por omisión, pero un descuidado <code>is rw<\/code> sobre él expondría la asignación directa, como <code>$account.balance = 1_000_000<\/code>, permitiendo a cualquiera mover dinero sin pasar por <code>deposit<\/code> ni <code>withdraw<\/code>. Mantener el atributo privado lo descarta por construcción: el saldo solo puede cambiar según las reglas de la propia cuenta, como la comprobación de fondos insuficientes de <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La segunda retirada pide más de lo que hay en el saldo, así que se rechaza y el saldo se queda en <code>70<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un conto bancario","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> dichiara l'attributo come <em>privato<\/em> — con il twigil <code>!<\/code> non ha alcun accessore generato, quindi l'unico modo di cambiare il saldo è attraverso i metodi che la classe fornisce. Un <code>method balance<\/code> dà al mondo esterno un modo di leggerlo, ma nessun modo di impostarlo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">È voluto. Se avessimo scritto <code>has $.balance<\/code>, il twigil <code>.<\/code> aggiungerebbe un accessore pubblico — di sola lettura per impostazione predefinita, ma un <code>is rw<\/code> distratto su di esso esporrebbe l'assegnamento diretto come <code>$account.balance = 1_000_000<\/code>, permettendo a chiunque di muovere denaro senza passare per <code>deposit<\/code> o <code>withdraw<\/code>. Tenere privato l'attributo lo esclude per costruzione: il saldo può cambiare solo secondo le regole del conto stesso, come il controllo di copertura in <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il secondo prelievo chiede più del saldo, quindi viene rifiutato e il saldo resta a <code>70<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Bankas konts","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> deklarē atribūtu kā <em>privātu<\/em> — ar <code>!<\/code> tvigilu tam nemaz nav ģenerēta piekļuves metode, tāpēc vienīgais veids, kā atlikumu mainīt, ir klases piedāvātās metodes. <code>method balance<\/code> ārpasaulei dod veidu, kā to nolasīt, bet ne uzstādīt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tas ir apzināti. Ja mēs būtu rakstījuši <code>has $.balance<\/code>, tvigils <code>.<\/code> pievienotu publisku piekļuves metodi — pēc noklusējuma tikai lasāmu, bet viens neuzmanīgs <code>is rw<\/code> tai atvērtu tiešu piešķiršanu, piemēram, <code>$account.balance = 1_000_000<\/code>, ļaujot ikvienam pārvietot naudu, neejot caur <code>deposit<\/code> vai <code>withdraw<\/code>. Atribūta paturēšana privāta to izslēdz jau pēc konstrukcijas: atlikums var mainīties vienīgi pēc paša konta likumiem, tādiem kā nepietiekamu līdzekļu pārbaude metodē <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Otrā izņemšana prasa vairāk, nekā ir atlikumā, tāpēc tā tiek noraidīta un atlikums paliek <code>70<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Банковский счёт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> объявляет атрибут <em>приватным<\/em>: с тайглом <code>!<\/code> у него вообще нет сгенерированного аксессора, поэтому изменить баланс можно только через методы, которые предоставляет класс. Метод <code>balance<\/code> даёт внешнему миру возможность прочитать значение, но не установить его.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Так сделано намеренно. Напиши мы <code>has $.balance<\/code>, тайгл <code>.<\/code> добавил бы публичный аксессор — по умолчанию только для чтения, но одно неосторожное <code>is rw<\/code> на нём открыло бы прямое присваивание вроде <code>$account.balance = 1_000_000<\/code>, позволяя кому угодно двигать деньги в обход <code>deposit<\/code> и <code>withdraw<\/code>. Приватный атрибут исключает это по построению: баланс может меняться только по собственным правилам счёта, таким как проверка на нехватку средств в <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Второе снятие просит больше, чем есть на балансе, поэтому оно отклоняется, и баланс остаётся равным <code>70<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Банківський рахунок»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> оголошує атрибут <em>приватним<\/em> — із тайглом <code>!<\/code> він узагалі не має згенерованого аксесора, тож єдиний спосіб змінити баланс — це методи, які надає клас. <code>method balance<\/code> дає зовнішньому світові спосіб його прочитати, але не спосіб його встановити.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це зроблено навмисно. Якби ми написали <code>has $.balance<\/code>, тайгл <code>.<\/code> додав би публічний аксесор — типово лише для читання, але одне необачне <code>is rw<\/code> на ньому відкрило б пряме присвоєння на кшталт <code>$account.balance = 1_000_000<\/code>, дозволивши будь-кому рухати гроші повз <code>deposit<\/code> чи <code>withdraw<\/code>. Приватний атрибут виключає це за побудовою: баланс може змінюватися лише за власними правилами рахунку — такими, як перевірка на нестачу коштів у <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Друге знімання просить більше, ніж є на балансі, тож його відхилено, а баланс лишається на <code>70<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Банкова сметка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> обявява атрибута за <em>частен<\/em> — с туигила <code>!<\/code> той изобщо няма породен аксесор, така че единственият начин балансът да се промени са методите, които класът предоставя. <code>method balance<\/code> дава на външния свят начин да го прочете, но не и начин да го зададе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е нарочно. Ако бяхме написали <code>has $.balance<\/code>, туигилът <code>.<\/code> щеше да добави публичен аксесор — по подразбиране само за четене, но едно невнимателно <code>is rw<\/code> върху него би отворило пряко присвояване от рода на <code>$account.balance = 1_000_000<\/code> и би позволило на всекиго да движи пари, заобикаляйки <code>deposit<\/code> или <code>withdraw<\/code>. Държането на атрибута частен изключва това по устройство: балансът може да се променя само по собствените правила на сметката, като проверката за недостиг във <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Второто теглене иска повече, отколкото е балансът, така че е отказано и балансът остава на <code>70<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Banka konto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> deklaras la atributon <em>privata<\/em> — kun la tvigilo <code>!<\/code> ĝi havas tute nenian generitan atingilon, do la sola maniero ŝanĝi la saldon estas tra la metodoj, kiujn la klaso provizas. <code>method balance<\/code> donas al la ekstera mondo manieron legi ĝin, sed nenian manieron fiksi ĝin.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tio estas intenca. Se ni estus skribintaj <code>has $.balance<\/code>, la tvigilo <code>.<\/code> aldonus publikan atingilon — nurlegan defaŭlte, sed unu senzorga <code>is rw<\/code> sur ĝi malkovrus rektan atribuon kiel <code>$account.balance = 1_000_000<\/code>, permesante al iu ajn movi monon sen trairi <code>deposit<\/code> aŭ <code>withdraw<\/code>. Teni la atributon privata ekskludas tion laŭ konstruo: la saldo povas ŝanĝiĝi nur laŭ la propraj reguloj de la konto, kiel la kontrolo pri nesufiĉaj rimedoj en <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La dua elpago petas pli ol la saldo, do ĝi estas rifuzita kaj la saldo restas ĉe <code>70<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Ratio argentaria","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $!balance = 0;\n\n    method deposit($amount) {\n        $!balance += $amount;\n    }\n\n    method withdraw($amount) {\n        if $amount &gt; $!balance {\n            say 'declined: insufficient funds';\n        }\n        else {\n            $!balance -= $amount;\n        }\n    }\n\n    method balance { $!balance }\n}\n\nmy $account = Account.new;\n$account.deposit(100);\n$account.withdraw(30);\n$account.withdraw(200);\n\nsay $account.balance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/objects-classes/bank-account.raku\" target=\"_blank\" rel=\"noopener\">bank-account.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>declined: insufficient funds\n70<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>has $!balance = 0<\/code> attributum <em>privatum<\/em> declarat — cum twigil <code>!<\/code> nullum accessorem generatum omnino habet, itaque unicus modus rationem mutandi per methodos quas classis praebet est. <code>method balance<\/code> mundo externo modum eam legendi dat, sed nullum modum eam ponendi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hoc consulto fit. Si <code>has $.balance<\/code> scripsissemus, twigil <code>.<\/code> accessorem publicum adderet — solum legendum ex more, sed unum neglegens <code>is rw<\/code> in eo assignationem directam ut <code>$account.balance = 1_000_000<\/code> exponeret, quemlibet pecuniam movere sinens sine <code>deposit<\/code> vel <code>withdraw<\/code>. Attributum privatum servare hoc per constructionem excludit: ratio solum secundum regulas proprias rationis mutari potest, ut probatio pecuniae insufficientis in <code>withdraw<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Secunda retractio plus quam ratio poscit, itaque recusatur et ratio ad <code>70<\/code> manet.<\/span><\/li><\/ol>"]]}}}</script>
