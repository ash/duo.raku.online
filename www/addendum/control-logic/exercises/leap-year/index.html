ata-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/control-logic/exercises/leap-year/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Schrikkeljaren‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een jaar is een schrikkeljaar als het door 4 deelbaar is, behalve dat eeuwjaren alleen schrikkeljaar zijn wanneer ze door 400 deelbaar zijn.<\/span> <span class=\"sg\" data-s=\"1\">Druk voor de jaren <code>2000<\/code>, <code>1900<\/code>, <code>2024<\/code> en <code>2023<\/code> af of elk een schrikkeljaar of een gewoon jaar is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>2000: leap\n1900: common\n2024: leap\n2023: common<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/control-logic/exercises/leap-year/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Años bisiestos","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un año es bisiesto si es divisible por 4, salvo que los años de fin de siglo solo son bisiestos cuando son divisibles por 400.<\/span> <span class=\"sg\" data-s=\"1\">Para los años <code>2000<\/code>, <code>1900<\/code>, <code>2024<\/code> y <code>2023<\/code>, imprime si cada uno es bisiesto o común.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>2000: leap\n1900: common\n2024: leap\n2023: common<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/control-logic/exercises/leap-year/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Anni bisestili","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un anno è bisestile se è divisibile per 4, tranne che gli anni secolari sono bisestili solo quando sono divisibili per 400.<\/span> <span class=\"sg\" data-s=\"1\">Per gli anni <code>2000<\/code>, <code>1900<\/code>, <code>2024<\/code> e <code>2023<\/code>, stampa per ciascuno se è un anno bisestile o un anno comune.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>2000: leap\n1900: common\n2024: leap\n2023: common<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/control-logic/exercises/leap-year/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"ru":{"t":"Упражнение «Високосные годы»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Год является високосным, если он делится на 4, за исключением того, что годы, кратные ста, високосны лишь тогда, когда делятся на 400.<\/span> <span class=\"sg\" data-s=\"1\">Для годов <code>2000<\/code>, <code>1900<\/code>, <code>2024<\/code> и <code>2023<\/code> напечатайте, високосный это год или обычный.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>2000: leap\n1900: common\n2024: leap\n2023: common<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/control-logic/exercises/leap-year/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Високосні роки»","b":[["h",1,"<h3><span cl
