et=\"_blank\" rel=\"noopener\">triangle-kind.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>3 3 3: equilateral\n3 3 5: isosceles\n3 4 5: scalene\n1 2 10: invalid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La gardilo <code>unless<\/code> malakceptas laterajn longojn, kiuj rompas la triangulan malegalaĵon, antaŭ ol okazas ajna klasifiko.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La nombro de <em>malsamaj<\/em> lateraj longoj diras la specon: unu signifas, ke ĉiuj egalas (egallatera), du signifas, ke precize unu paro egalas (egalkrura), tri signifas, ke ĉiuj estas malsamaj (neregula).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Malkomponi la buklan variablon kiel <code>-&gt; ($a, $b, $c)<\/code> malpakas ĉiun internan liston rekte en tri nomitajn laterojn.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Genus trianguli","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub kind($a, $b, $c) {\n    return 'invalid' unless $a + $b &gt; $c &amp;&amp; $a + $c &gt; $b &amp;&amp; $b + $c &gt; $a;\n\n    given ($a, $b, $c).Set.elems {\n        when 1  { 'equilateral' }\n        when 2  { 'isosceles' }\n        default { 'scalene' }\n    }\n}\n\nfor (3, 3, 3), (3, 3, 5), (3, 4, 5), (1, 2, 10) -&gt; ($a, $b, $c) {\n    say \"$a $b $c: { kind($a, $b, $c) }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/control-logic/triangle-kind.raku\" target=\"_blank\" rel=\"noopener\">triangle-kind.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"]
