<script type="application/json" id="page-data">{"u":"addendum/numbers-math","n":1413,"k":"section","pv":"addendum","nx":"addendum/numbers-math/exercises","tr":["addendum"],"L":{"en":{"t":"Numbers and mathematics","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">These challenges combine the numeric tools from across the course — integer operations, ranges, the reduction metaoperator, and a few number methods — into small problems that need more than a single expression to solve.<\/span><\/p>"]]},"de":{"t":"Zahlen und Mathematik","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Diese Herausforderungen führen die numerischen Werkzeuge aus dem ganzen Kurs zusammen — Ganzzahloperationen, Bereiche, den Reduktions-Metaoperator und ein paar Zahlenmethoden — zu kleinen Aufgaben, die mehr als einen einzigen Ausdruck zur Lösung brauchen.<\/span><\/p>"]]},"nl":{"t":"Getallen en wiskunde","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze uitdagingen combineren de numerieke gereedschappen uit de hele cursus — bewerkingen op gehele getallen, bereiken, de reductiemeta-operator en een paar methoden op getallen — tot kleine problemen die meer dan één uitdrukking nodig hebben om op te lossen.<\/span><\/p>"]]},"es":{"t":"Números y matemáticas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Estos retos combinan las herramientas numéricas de todo el curso — operaciones con enteros, rangos, el metaoperador de reducción y unos cuantos métodos numéricos — en problemas pequeños que necesitan más de una sola expresión para resolverse.<\/span><\/p>"]]},"it":{"t":"Numeri e matematica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Queste sfide combinano gli strumenti numerici di tutto il corso — operazioni su interi, intervalli, il metaoperatore di riduzione e qualche metodo dei numeri — in piccoli problemi che per essere risolti richiedono più di una singola espressione.<\/span><\/p>"]]},"lv":{"t":"Skaitļi un matemātika","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šie pārbaudījumi apvieno visa kursa skaitliskos rīkus — veselo skaitļu darbības, diapazonus, redukcijas metaoperatoru un dažas skaitļu metodes — mazos uzdevumos, kuru atrisināšanai vajag vairāk nekā vienu izteiksmi.<\/span><\/p>"]]},"ru":{"t":"Числа и математика","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Эти задачи объединяют числовые инструменты со всего курса — операции над целыми числами, диапазоны, метаоператор свёртки и несколько числовых методов — в небольшие задачи, для решения которых одного выражения уже мало.<\/span><\/p>"]]},"uk":{"t":"Числа та математика","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ці випробування поєднують числові засоби з усього курсу — цілочислові операції, діапазони, метаоператор згортки та кілька числових методів — у невеликі задачі, що потребують більшого, ніж один вираз.<\/span><\/p>"]]},"bg":{"t":"Числа и математика","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Тези предизвикателства съчетават числовите средства от целия курс — целочислени операции, диапазони, метаоператора за свиване и няколко числови метода — в малки задачи, които изискват повече от един израз.<\/span><\/p>"]]},"eo":{"t":"Nombroj kaj matematiko","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj defioj kombinas la nombrajn ilojn el la tuta kurso — operaciojn kun entjeroj, intervalojn, la reduktan metaoperatoron kaj kelkajn metodojn de nombroj — en malgrandajn problemojn, kiuj bezonas pli ol unu solan esprimon por esti solvitaj.<\/span><\/p>"]]},"la":{"t":"Numeri et mathematica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec certamina instrumenta numerica ex toto cursu — operationes cum numeris integris, intervalla, metaoperatorem reductionis, et paucas methodos numerorum — in problemata parva coniungunt quae plus quam unam expressionem ad solvendum poscunt.<\/span><\/p>"]]}}}</script>
