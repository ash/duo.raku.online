<script type="application/json" id="page-data">{"u":"addendum/collections/exercises/running-totals/solution","n":1452,"k":"solution","pv":"addendum/collections/exercises/running-totals","nx":"addendum/collections/exercises/transpose","tr":["addendum","addendum/collections"],"L":{"en":{"t":"The solution of ’Running totals‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The block keeps a running <code>$sum<\/code> in a variable outside the map. Each call adds the current element and returns the new total, so the mapped list is the sequence of partial sums.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku has this built in. The <a href=\"/advanced/metaoperators/reduction/\">triangular reduction<\/a> <code>[\\+]<\/code> keeps every partial sum, so the whole solution is a single expression:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It returns a <code>Seq<\/code>, so its gist uses parentheses — <code>(2 6 12 20)<\/code> — rather than     the array's <code>[2 6 12 20]<\/code>, but the numbers are the same.<\/span><\/p>"]]},"de":{"t":"Lösung: Laufende Summen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Block hält eine laufende <code>$sum<\/code> in einer Variablen außerhalb des Maps. Jeder Aufruf addiert das aktuelle Element und liefert die neue Summe, die abgebildete Liste ist also die Folge der Teilsummen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku hat das eingebaut. Die <a href=\"https://course.raku.org/de/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">dreieckige Reduktion<\/a> <code>[\\+]<\/code> behält jede Teilsumme, die ganze Lösung ist also ein einziger Ausdruck:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie liefert eine <code>Seq<\/code>, ihr Gist verwendet also runde Klammern — <code>(2 6 12 20)<\/code> — statt     des <code>[2 6 12 20]<\/code> des Arrays, doch die Zahlen sind dieselben.<\/span><\/p>"]]},"nl":{"t":"Oplossing: Lopende sommen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het blok houdt een lopende <code>$sum<\/code> bij in een variabele buiten de map. Elke aanroep telt het huidige element erbij op en geeft de nieuwe som terug, dus is de gemapte lijst de reeks deelsommen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku heeft dit ingebouwd. De <a href=\"https://course.raku.org/nl/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">driehoeksreductie<\/a> <code>[\\+]<\/code> bewaart elke deelsom, dus is de hele oplossing één enkele uitdrukking:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ze geeft een <code>Seq<\/code> terug, dus haar gist gebruikt haakjes — <code>(2 6 12 20)<\/code> — in plaats van     de <code>[2 6 12 20]<\/code> van de array, maar de getallen zijn dezelfde.<\/span><\/p>"]]},"es":{"t":"Solución: Totales acumulados","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque mantiene un <code>$sum<\/code> acumulado en una variable fuera del map. Cada llamada suma el elemento actual y devuelve el total nuevo, así que la lista mapeada es la secuencia de sumas parciales.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku trae esto de fábrica. La <a href=\"https://course.raku.org/es/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">reducción triangular<\/a> <code>[\\+]<\/code> conserva todas las sumas parciales, así que la solución entera es una sola expresión:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Devuelve una <code>Seq<\/code>, así que su representación usa paréntesis — <code>(2 6 12 20)<\/code> — en     lugar del <code>[2 6 12 20]<\/code> del array, pero los números son los mismos.<\/span><\/p>"]]},"it":{"t":"Soluzione: Totali progressivi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco tiene una <code>$sum<\/code> progressiva in una variabile fuori dal map. Ogni chiamata somma l'elemento corrente e restituisce il nuovo totale, quindi la lista mappata è la sequenza delle somme parziali.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku ce l'ha incorporato. La <a href=\"https://course.raku.org/it/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">riduzione triangolare<\/a> <code>[\\+]<\/code> conserva ogni somma parziale, quindi l'intera soluzione è un'unica espressione:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Restituisce una <code>Seq<\/code>, quindi il suo gist usa le parentesi tonde — <code>(2 6 12 20)<\/code> —     invece del <code>[2 6 12 20]<\/code> dell'array, ma i numeri sono gli stessi.<\/span><\/p>"]]},"ru":{"t":"Решение: Нарастающие итоги","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок хранит нарастающую сумму <code>$sum<\/code> в переменной за пределами <code>map<\/code>. Каждый вызов прибавляет текущий элемент и возвращает новую сумму, поэтому отображённый список и есть последовательность частичных сумм.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В Raku это есть из коробки. <a href=\"https://course.raku.org/ru/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Треугольная свёртка<\/a> <code>[\\+]<\/code> сохраняет все частичные суммы, так что всё решение умещается в одно выражение:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Она возвращает <code>Seq<\/code>, поэтому его краткое представление использует круглые скобки —     <code>(2 6 12 20)<\/code> — вместо массивных <code>[2 6 12 20]<\/code>, но числа те же самые.<\/span><\/p>"]]},"uk":{"t":"Розв'язання вправи «Наростаючі підсумки»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок тримає наростаючу <code>$sum<\/code> у змінній поза map. Кожен виклик додає поточний елемент і повертає нову суму, тож відображений список є послідовністю часткових сум.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У Raku це є вбудованим. <a href=\"https://course.raku.org/uk/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Трикутна згортка<\/a> <code>[\\+]<\/code> зберігає кожну часткову суму, тож усе розв'язання є одним виразом:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вона повертає <code>Seq<\/code>, тож її загальний вигляд використовує круглі дужки —     <code>(2 6 12 20)<\/code>, — а не масивні <code>[2 6 12 20]<\/code>, але числа ті самі.<\/span><\/p>"]]},"bg":{"t":"Решение: Текущи суми","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 2, 4, 6, 8;\n\nmy $sum = 0;\nmy @totals = @numbers.map({ $sum += $_ });\n\nsay @totals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/collections/running-totals.raku\" target=\"_blank\" rel=\"noopener\">running-totals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[2 6 12 20]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блокът държи текуща <code>$sum<\/code> в променлива извън <code>map<\/code>. Всяко извикване добавя текущия елемент и връща новата сума, така че отобразеният списък е поредицата от частични суми.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В Raku това е вградено. <a href=\"https://course.raku.org/bg/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Триъгълното свиване<\/a> <code>[\\+]<\/code> пази всяка частична сума, така че цялото решение е един израз:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my @numbers = 2, 4, 6, 8;     say [\\+] @numbers; # (2 6 12 20)     <\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">То връща <code>Seq<\/code>, така че общият му вид използва кръгли скоби — <code>(2 6 12 20)<\/code>, — а не масивните <code>[2 6 12 20]<\/code>, но числата са същите.<\/span><\/p>"]]}}}</script>
