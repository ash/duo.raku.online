<script type="application/json" id="page-data">{"u":"addendum/subs-functional/exercises/accumulator/solution","n":1480,"k":"solution","pv":"addendum/subs-functional/exercises/accumulator","nx":"addendum/subs-functional/exercises/sum-even-squares","tr":["addendum","addendum/subs-functional"],"L":{"en":{"t":"The solution of ’A running accumulator‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The returned block <em>closes over<\/em> <code>$total<\/code>: that variable lives on between calls, so each call remembers the total from the previous one.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> both updates the running sum and returns it, which is what each <code>say<\/code> prints: <code>110<\/code>, then <code>135<\/code>, then <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">An alternative keeps the total inside the block itself, in a <code>state<\/code> variable. Unlike an ordinary <code>my<\/code>, a <code>state<\/code> variable is initialised only once — the first time the block runs — and then keeps its value across later calls:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each call to <code>make-accumulator<\/code> produces a fresh block with its own     <code>state $total<\/code>, so separate accumulators stay independent — and the closure     over <code>$start<\/code> still supplies each one its own starting value.<\/span><\/p>"]]},"de":{"t":"Lösung: Ein laufender Sammler","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der gelieferte Block <em>schließt über<\/em> <code>$total<\/code>: Diese Variable lebt zwischen den Aufrufen weiter, jeder Aufruf erinnert sich also an die Summe des vorigen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> erneuert die laufende Summe und liefert sie zugleich, und das ist es, was jedes <code>say<\/code> ausgibt: <code>110<\/code>, dann <code>135<\/code>, dann <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Eine Alternative hält die Summe im Block selbst, in einer <code>state<\/code>-Variablen. Anders als ein gewöhnliches <code>my<\/code> wird eine <code>state<\/code>-Variable nur einmal initialisiert — beim ersten Lauf des Blocks — und behält ihren Wert dann über spätere Aufrufe hinweg:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>make-accumulator<\/code> erzeugt einen frischen Block mit seinem eigenen     <code>state $total<\/code>, getrennte Sammler bleiben also unabhängig — und die Closure über     <code>$start<\/code> versorgt jeden weiterhin mit seinem eigenen Anfangswert.<\/span><\/p>"]]},"nl":{"t":"Oplossing: Een lopende accumulator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het teruggegeven blok <em>sluit om<\/em> <code>$total<\/code> heen: die variabele blijft tussen aanroepen bestaan, dus onthoudt elke aanroep de som van de vorige.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> werkt zowel de lopende som bij als geeft haar terug, en dat is wat elke <code>say<\/code> afdrukt: <code>110<\/code>, dan <code>135<\/code>, dan <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een alternatief houdt de som binnen het blok zelf, in een <code>state<\/code>-variabele. Anders dan een gewone <code>my<\/code> wordt een <code>state<\/code>-variabele slechts één keer geïnitialiseerd — de eerste keer dat het blok draait — en houdt ze daarna haar waarde over latere aanroepen heen:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>make-accumulator<\/code> levert een vers blok met een eigen     <code>state $total<\/code> op, dus blijven aparte accumulators onafhankelijk — en de closure     om <code>$start<\/code> geeft elk nog steeds zijn eigen beginwaarde.<\/span><\/p>"]]},"es":{"t":"Solución: Un acumulador continuo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque devuelto <em>se cierra sobre<\/em> <code>$total<\/code>: esa variable sigue viva entre llamadas, así que cada llamada recuerda el total de la anterior.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> actualiza a la vez la suma acumulada y la devuelve, que es lo que imprime cada <code>say<\/code>: <code>110<\/code>, después <code>135<\/code>, después <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una alternativa guarda el total dentro del propio bloque, en una variable <code>state<\/code>. A diferencia de un <code>my<\/code> corriente, una variable <code>state<\/code> se inicializa una sola vez —la primera vez que se ejecuta el bloque— y conserva después su valor entre llamadas posteriores:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>make-accumulator<\/code> produce un bloque nuevo con su propio     <code>state $total<\/code>, así que los acumuladores distintos siguen siendo independientes, y     la clausura sobre <code>$start<\/code> sigue dando a cada uno su propio valor inicial.<\/span><\/p>"]]},"it":{"t":"Soluzione: Un accumulatore progressivo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco restituito <em>si chiude su<\/em> <code>$total<\/code>: quella variabile sopravvive fra una chiamata e l'altra, quindi ogni chiamata ricorda il totale della precedente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> aggiorna la somma corrente e la restituisce insieme, ed è ciò che ogni <code>say<\/code> stampa: <code>110<\/code>, poi <code>135<\/code>, poi <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un'alternativa tiene il totale dentro il blocco stesso, in una variabile <code>state<\/code>. A differenza di un <code>my<\/code> ordinario, una variabile <code>state<\/code> viene inizializzata una volta sola — al primo giro del blocco — e poi conserva il proprio valore attraverso le chiamate successive:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>make-accumulator<\/code> produce un blocco fresco con il proprio     <code>state $total<\/code>, quindi accumulatori separati restano indipendenti — e la chiusura su     <code>$start<\/code> fornisce comunque a ciascuno il proprio valore di partenza.<\/span><\/p>"]]},"ru":{"t":"Решение: Накопитель значений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Возвращаемый блок <em>замыкается<\/em> на <code>$total<\/code>: эта переменная живёт между вызовами, поэтому каждый вызов помнит сумму, оставшуюся от предыдущего.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> одновременно обновляет нарастающую сумму и возвращает её, — это и печатает каждый <code>say<\/code>: сперва <code>110<\/code>, затем <code>135<\/code>, затем <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В другом варианте сумма хранится внутри самого блока, в переменной <code>state<\/code>. В отличие от обычной <code>my<\/code>, переменная <code>state<\/code> инициализируется лишь однажды — при первом выполнении блока — и затем сохраняет своё значение между последующими вызовами:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>make-accumulator<\/code> порождает новый блок со своей <code>state $total<\/code>, поэтому разные     накопители остаются независимыми, а замыкание на <code>$start<\/code> по-прежнему снабжает каждый из них     собственным начальным значением.<\/span><\/p>"]]},"uk":{"t":"Розв'язання вправи «Наростаючий акумулятор»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Повернений блок <em>замикається<\/em> на <code>$total<\/code>: ця змінна живе між викликами, тож кожен виклик пам'ятає суму з попереднього.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> водночас оновлює наростаючу суму й повертає її, а це і є те, що друкує кожен <code>say<\/code>: <code>110<\/code>, потім <code>135<\/code>, потім <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Альтернатива тримає суму всередині самого блоку, у змінній <code>state<\/code>. На відміну від звичайної <code>my<\/code>, змінна <code>state<\/code> ініціалізується лише раз — під час першого виконання блоку — і потім зберігає своє значення між подальшими викликами:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>make-accumulator<\/code> дає свіжий блок із власною <code>state $total<\/code>, тож     окремі акумулятори лишаються незалежними, — а замикання на <code>$start<\/code> і далі     постачає кожному його власне початкове значення.<\/span><\/p>"]]},"bg":{"t":"Решение: Текущ акумулатор","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub make-accumulator($start) {\n    my $total = $start;\n    return -&gt; $amount { $total += $amount };\n}\n\nmy $acc = make-accumulator(100);\n\nsay $acc(10);\nsay $acc(25);\nsay $acc(-5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/subs-functional/accumulator.raku\" target=\"_blank\" rel=\"noopener\">accumulator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>110\n135\n130<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Върнатият блок <em>се затваря<\/em> върху <code>$total<\/code>: тази променлива живее между извикванията, така че всяко извикване помни сумата от предишното.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$total += $amount<\/code> едновременно обновява текущата сума и я връща, а точно това отпечатва всяко <code>say<\/code>: <code>110<\/code>, после <code>135<\/code>, после <code>130<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Друг вариант държи сумата вътре в самия блок, в променлива <code>state<\/code>. За разлика от обикновената <code>my<\/code>, променливата <code>state<\/code> се инициализира само веднъж — при първото изпълнение на блока — и после запазва стойността си при следващите извиквания:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     sub make-accumulator($start) {         return -&gt; $amount { state $total = $start; $total += $amount };     }<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">my $acc = make-accumulator(100);     say $acc(10);     say $acc(25);     say $acc(-5);     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>make-accumulator<\/code> дава нов блок със собствена <code>state $total<\/code>, така     че отделните акумулатори остават независими — а затварянето върху <code>$start<\/code> продължава     да доставя на всеки собствената му начална стойност.<\/span><\/p>"]]}}}</script>
