<script type="application/json" id="page-data">{"u":"addendum/regex-grammars/exercises/validate-identifier/solution","n":1510,"k":"solution","pv":"addendum/regex-grammars/exercises/validate-identifier","nx":"addendum/regex-grammars/exercises/grammar-fullname","tr":["addendum","addendum/regex-grammars"],"L":{"en":{"t":"The solution of ’Validate identifiers‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The anchors <code>^<\/code> and <code>$<\/code> force the pattern to cover the <em>whole<\/em> string, so a single stray character like the hyphen in <code>my-var<\/code> makes it invalid.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The first character class allows a letter or underscore; the second, repeated with <code>*<\/code>, additionally allows digits — matching the classic identifier rule exactly.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The second class can also be written as <code>\\w<\/code>, the built-in shorthand for a word character (a letter, a digit, or an underscore):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">One difference to be aware of: <code>\\w<\/code> in Raku is Unicode-aware, so a name such as <code>café<\/code> also passes — which happens to match Raku itself, where <code>my $café = 1;<\/code> is perfectly legal.<\/span> <span class=\"sg\" data-s=\"1\">The spelled-out class <code>&lt;[A..Za..z0..9_]&gt;<\/code> keeps the check strictly ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">There is a twist, though: in Raku itself <code>my-var<\/code> is a <em>valid<\/em> identifier! Raku allows a hyphen (or an apostrophe, as in <code>isn't<\/code>) inside a name, as long as it is followed by a letter — which is why subroutines like <code>is-prime<\/code> read so naturally. To validate <em>Raku<\/em> identifiers, allow such groups after the classic part:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each bracketed group <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> accepts a hyphen only when a letter follows, so <code>my-var<\/code> is now reported as valid, while <code>2fast<\/code> — and strings like <code>a-<\/code> or <code>a-1<\/code> — still are not.<\/span><\/p>"]]},"de":{"t":"Lösung: Bezeichner prüfen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Anker <code>^<\/code> und <code>$<\/code> zwingen das Muster, die <em>ganze<\/em> Zeichenkette abzudecken, ein einziges verirrtes Zeichen wie der Bindestrich in <code>my-var<\/code> macht sie also ungültig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die erste Zeichenklasse erlaubt einen Buchstaben oder Unterstrich; die zweite, mit <code>*<\/code> wiederholt, erlaubt zusätzlich Ziffern — was genau der klassischen Bezeichnerregel entspricht.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die zweite Klasse lässt sich auch als <code>\\w<\/code> schreiben, die eingebaute Kurzform für ein Wortzeichen (einen Buchstaben, eine Ziffer oder einen Unterstrich):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Unterschied, den man kennen sollte: <code>\\w<\/code> ist in Raku Unicode-bewusst, ein Name wie <code>café<\/code> besteht die Prüfung also ebenfalls — was zufällig zu Raku selbst passt, wo <code>my $café = 1;<\/code> völlig zulässig ist.<\/span> <span class=\"sg\" data-s=\"1\">Die ausgeschriebene Klasse <code>&lt;[A..Za..z0..9_]&gt;<\/code> hält die Prüfung streng bei ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Es gibt allerdings eine Wendung: In Raku selbst ist <code>my-var<\/code> ein <em>gültiger<\/em> Bezeichner! Raku erlaubt einen Bindestrich (oder einen Apostroph, wie in <code>isn't<\/code>) innerhalb eines Namens, solange ihm ein Buchstabe folgt — und deshalb lesen sich Subroutinen wie <code>is-prime<\/code> so natürlich. Um <em>Raku<\/em>-Bezeichner zu prüfen, erlauben Sie solche Gruppen nach dem klassischen Teil:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jede geklammerte Gruppe <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> nimmt einen Bindestrich nur an, wenn ein Buchstabe folgt, <code>my-var<\/code> wird nun also als gültig gemeldet, während <code>2fast<\/code> — und Zeichenketten wie <code>a-<\/code> oder <code>a-1<\/code> — es weiterhin nicht sind.<\/span><\/p>"]]},"nl":{"t":"Oplossing: Valideer identifiers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De ankers <code>^<\/code> en <code>$<\/code> dwingen het patroon de <em>hele<\/em> string te bestrijken, dus maakt een enkel afdwalend teken als het koppelteken in <code>my-var<\/code> hem ongeldig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De eerste tekenklasse staat een letter of underscore toe; de tweede, herhaald met <code>*<\/code>, staat daarnaast cijfers toe — precies de klassieke identifierregel.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De tweede klasse kun je ook als <code>\\w<\/code> schrijven, de ingebouwde afkorting voor een woordteken (een letter, een cijfer of een underscore):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eén verschil om op te letten: <code>\\w<\/code> is in Raku Unicode-bewust, dus een naam als <code>café<\/code> slaagt ook — wat toevallig overeenkomt met Raku zelf, waar <code>my $café = 1;<\/code> volkomen geldig is.<\/span> <span class=\"sg\" data-s=\"1\">De uitgeschreven klasse <code>&lt;[A..Za..z0..9_]&gt;<\/code> houdt de controle strikt ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Er zit echter een addertje onder het gras: in Raku zelf is <code>my-var<\/code> een <em>geldige<\/em> identifier! Raku staat een koppelteken (of een apostrof, zoals in <code>isn't<\/code>) binnen een naam toe, zolang er een letter op volgt — en daarom lezen subroutines als <code>is-prime<\/code> zo natuurlijk. Om <em>Raku<\/em>-identifiers te valideren, sta je zulke groepen achter het klassieke deel toe:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke groep tussen haken <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> aanvaardt een koppelteken alleen wanneer er een letter op volgt, dus wordt <code>my-var<\/code> nu als geldig gemeld, terwijl <code>2fast<\/code> — en strings als <code>a-<\/code> of <code>a-1<\/code> — dat nog steeds niet zijn.<\/span><\/p>"]]},"es":{"t":"Solución: Valide identificadores","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los anclajes <code>^<\/code> y <code>$<\/code> obligan al patrón a cubrir la cadena <em>entera<\/em>, así que un solo carácter descarriado como el guion de <code>my-var<\/code> la hace inválida.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La primera clase de caracteres permite una letra o un guion bajo; la segunda, repetida con <code>*<\/code>, permite además dígitos, correspondiéndose exactamente con la regla clásica de identificador.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La segunda clase también se puede escribir como <code>\\w<\/code>, la abreviatura integrada para un carácter de palabra (una letra, un dígito o un guion bajo):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una diferencia que conviene tener en cuenta: en Raku, <code>\\w<\/code> es consciente de Unicode, así que un nombre como <code>café<\/code> también pasa, lo que casualmente coincide con el propio Raku, donde <code>my $café = 1;<\/code> es perfectamente legal.<\/span> <span class=\"sg\" data-s=\"1\">La clase deletreada <code>&lt;[A..Za..z0..9_]&gt;<\/code> mantiene la comprobación estrictamente en ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hay un giro, sin embargo: ¡en el propio Raku <code>my-var<\/code> <em>sí<\/em> es un identificador válido! Raku permite un guion (o un apóstrofo, como en <code>isn't<\/code>) dentro de un nombre, siempre que le siga una letra, y por eso subrutinas como <code>is-prime<\/code> se leen con tanta naturalidad. Para validar identificadores <em>de Raku<\/em>, permite esos grupos después de la parte clásica:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada grupo entre corchetes <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> acepta un guion solo cuando le sigue una letra, así que <code>my-var<\/code> se informa ahora como válido, mientras que <code>2fast<\/code> —y cadenas como <code>a-<\/code> o <code>a-1<\/code>— siguen sin serlo.<\/span><\/p>"]]},"it":{"t":"Soluzione: Convalidate gli identificatori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le ancore <code>^<\/code> e <code>$<\/code> costringono lo schema a coprire l'<em>intera<\/em> stringa, quindi un solo carattere fuori posto come il trattino in <code>my-var<\/code> lo rende non valido.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La prima classe di caratteri ammette una lettera o un trattino basso; la seconda, ripetuta con <code>*<\/code>, ammette in più le cifre — corrispondendo esattamente alla regola classica degli identificatori.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La seconda classe si può anche scrivere come <code>\\w<\/code>, la scorciatoia incorporata per un carattere di parola (una lettera, una cifra o un trattino basso):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una differenza di cui essere consapevoli: <code>\\w<\/code> in Raku è consapevole di Unicode, quindi anche un nome come <code>café<\/code> passa — cosa che per inciso corrisponde a Raku stesso, dove <code>my $café = 1;<\/code> è perfettamente lecito.<\/span> <span class=\"sg\" data-s=\"1\">La classe scritta per esteso <code>&lt;[A..Za..z0..9_]&gt;<\/code> tiene il controllo strettamente ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">C'è però un colpo di scena: in Raku stesso <code>my-var<\/code> è un identificatore <em>valido<\/em>! Raku ammette un trattino (o un apostrofo, come in <code>isn't<\/code>) dentro un nome, purché sia seguito da una lettera — ed è per questo che subroutine come <code>is-prime<\/code> si leggono così naturalmente. Per convalidare gli identificatori <em>Raku<\/em>, ammetti gruppi simili dopo la parte classica:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni gruppo fra parentesi <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> accetta un trattino solo quando segue una lettera, quindi <code>my-var<\/code> viene ora riferito come valido, mentre <code>2fast<\/code> — e stringhe come <code>a-<\/code> o <code>a-1<\/code> — continuano a non esserlo.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Pārbaudiet identifikatorus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Enkuri <code>^<\/code> un <code>$<\/code> liek paraugam nosegt <em>visu<\/em> virkni, tāpēc viena vienīga svešzīme, piemēram, defise vārdā <code>my-var<\/code>, padara to nederīgu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pirmā rakstzīmju klase pieļauj burtu vai pasvītrojumu; otrā, atkārtota ar <code>*<\/code>, papildus pieļauj ciparus, — tieši klasiskais identifikatora likums.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Otro klasi var uzrakstīt arī kā <code>\\w<\/code>, iebūvēto saīsinājumu vārda rakstzīmei (burtam, ciparam vai pasvītrojumam):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Viena atšķirība, ko vērts zināt: <code>\\w<\/code> Raku valodā prot Unikodu, tāpēc tādu vārdu kā <code>café<\/code> arī izlaiž cauri — un tas gadās sakrist ar pašu Raku, kur <code>my $café = 1;<\/code> ir pilnīgi likumīgi.<\/span> <span class=\"sg\" data-s=\"1\">Izrakstītā klase <code>&lt;[A..Za..z0..9_]&gt;<\/code> pārbaudi patur stingri ASCII robežās.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ir gan viens āķis: pašā Raku <code>my-var<\/code> ir <em>derīgs<\/em> identifikators! Raku vārda iekšienē pieļauj defisi (vai apostrofu, kā vārdā <code>isn't<\/code>), ja vien tai seko burts, — un tieši tāpēc apakšprogrammas, piemēram, <code>is-prime<\/code>, lasās tik dabiski. Lai pārbaudītu <em>Raku<\/em> identifikatorus, pieļaujiet šādas grupas pēc klasiskās daļas:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katra iekavotā grupa <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> defisi pieņem tikai tad, kad tai seko burts, tāpēc <code>my-var<\/code> tagad tiek paziņots kā derīgs, bet <code>2fast<\/code> — un tādas virknes kā <code>a-<\/code> vai <code>a-1<\/code> — joprojām nē.<\/span><\/p>"]]},"ru":{"t":"Решение: Проверьте идентификаторы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Якоря <code>^<\/code> и <code>$<\/code> заставляют шаблон покрывать <em>всю<\/em> строку, поэтому один-единственный посторонний символ вроде дефиса в <code>my-var<\/code> делает её недопустимой.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Первый класс символов допускает букву или подчёркивание, а второй, повторяемый через <code>*<\/code>, дополнительно допускает цифры — это в точности классическое правило идентификатора.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Второй класс можно записать и как <code>\\w<\/code> — встроенное сокращение для словесного символа (буквы, цифры или подчёркивания):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Об одном отличии стоит помнить: <code>\\w<\/code> в Raku учитывает Unicode, поэтому имя вроде <code>café<\/code> тоже пройдёт проверку, — что, кстати, соответствует самому Raku, где <code>my $café = 1;<\/code> совершенно законно.<\/span> <span class=\"sg\" data-s=\"1\">Выписанный класс <code>&lt;[A..Za..z0..9_]&gt;<\/code> удерживает проверку строго в рамках ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Есть, впрочем, и подвох: в самом Raku <code>my-var<\/code> — <em>допустимый<\/em> идентификатор! Raku разрешает дефис (а также апостроф, как в <code>isn't<\/code>) внутри имени, если за ним следует буква, — благодаря этому подпрограммы вроде <code>is-prime<\/code> читаются так естественно. Чтобы проверять идентификаторы <em>Raku<\/em>, разрешите такие группы после классической части:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждая группа в скобках <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> принимает дефис только тогда, когда за ним идёт буква, поэтому <code>my-var<\/code> теперь считается допустимым, а <code>2fast<\/code> — и строки вроде <code>a-<\/code> или <code>a-1<\/code> — по-прежнему нет.<\/span><\/p>"]]},"uk":{"t":"Розв'язання вправи «Перевірка ідентифікаторів»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Якорі <code>^<\/code> та <code>$<\/code> змушують шаблон покривати <em>весь<\/em> рядок, тож один-єдиний зайвий символ на кшталт дефіса в <code>my-var<\/code> робить його некоректним.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Перший клас символів дозволяє літеру або підкреслення; другий, повторений через <code>*<\/code>, дозволяє додатково й цифри — рівно за класичним правилом ідентифікатора.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Другий клас можна записати і як <code>\\w<\/code> — вбудоване скорочення для словесного символу (літери, цифри або підкреслення):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Про одну відмінність варто знати: <code>\\w<\/code> у Raku зважає на Unicode, тож ім'я на кшталт <code>café<\/code> теж проходить, — а це, до речі, збігається з поведінкою самого Raku, де <code>my $café = 1;<\/code> цілком законне.<\/span> <span class=\"sg\" data-s=\"1\">Розписаний клас <code>&lt;[A..Za..z0..9_]&gt;<\/code> тримає перевірку строго в межах ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Проте є заковика: у самому Raku <code>my-var<\/code> є <em>коректним<\/em> ідентифікатором! Raku дозволяє дефіс (або апостроф, як в <code>isn't<\/code>) усередині імені, якщо за ним іде літера, — саме тому підпрограми на кшталт <code>is-prime<\/code> читаються так природно. Щоб перевіряти ідентифікатори <em>Raku<\/em>, дозвольте такі групи після класичної частини:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожна група в дужках <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> приймає дефіс лише тоді, коли за ним іде літера, тож <code>my-var<\/code> тепер визнають коректним, а <code>2fast<\/code> — та рядки на кшталт <code>a-<\/code> чи <code>a-1<\/code> — усе ще ні.<\/span><\/p>"]]},"bg":{"t":"Решение: Проверка на идентификатори","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Котвите <code>^<\/code> и <code>$<\/code> принуждават шаблона да покрие <em>целия<\/em> низ, така че един-единствен излишен знак като тирето в <code>my-var<\/code> го прави невалиден.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Първият клас от знаци допуска буква или долна черта; вторият, повторен с <code>*<\/code>, допуска допълнително и цифри — точно по класическото правило за идентификатор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вторият клас може да се запише и като <code>\\w<\/code> — вграденото скъсяване за словесен знак (буква, цифра или долна черта):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има една разлика, за която да знаете: <code>\\w<\/code> в Raku се съобразява с Unicode, така че име като <code>café<\/code> също минава — което, между другото, съвпада с поведението на самия Raku, където <code>my $café = 1;<\/code> е напълно законно.<\/span> <span class=\"sg\" data-s=\"1\">Разписаният клас <code>&lt;[A..Za..z0..9_]&gt;<\/code> държи проверката строго в рамките на ASCII.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Има обаче една уловка: в самия Raku <code>my-var<\/code> е <em>валиден<\/em> идентификатор! Raku допуска тире (или апостроф, както в <code>isn't<\/code>) вътре в името, стига след него да следва буква — затова подпрограми като <code>is-prime<\/code> се четат толкова естествено. За да проверявате идентификатори на <em>Raku<\/em>, допуснете такива групи след класическата част:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяка група в скоби <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> приема тире само когато след него следва буква, така че <code>my-var<\/code> вече се смята за валиден, а <code>2fast<\/code> — както и низове като <code>a-<\/code> или <code>a-1<\/code> — все още не.<\/span><\/p>"]]},"eo":{"t":"Solvo: Validigu identigilojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ankroj <code>^<\/code> kaj <code>$<\/code> devigas la ŝablonon kovri la <em>tutan<\/em> ĉenon, do unu sola fremda signo kiel la streketo en <code>my-var<\/code> faras ĝin nevalida.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La unua signoklaso permesas literon aŭ substrekon; la dua, ripetata per <code>*<\/code>, aldone permesas ciferojn — kongruante precize kun la klasika regulo pri identigiloj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La duan klason oni povas ankaŭ skribi kiel <code>\\w<\/code>, la enkonstruitan mallongigon por vortsigno (litero, cifero aŭ substreko):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unu diferenco konsciendas: <code>\\w<\/code> en Raku estas Unikod-konscia, do nomo kiel <code>café<\/code> ankaŭ trapasas — kio hazarde kongruas kun Raku mem, kie <code>my $café = 1;<\/code> estas tute laŭleĝa.<\/span> <span class=\"sg\" data-s=\"1\">La plene skribita klaso <code>&lt;[A..Za..z0..9_]&gt;<\/code> tenas la kontrolon strikte ASCII-a.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Estas tamen kaptilo: en Raku mem <code>my-var<\/code> estas <em>valida<\/em> identigilo! Raku permesas streketon (aŭ apostrofon, kiel en <code>isn't<\/code>) ene de nomo, kondiĉe ke ĝin sekvas litero — kaj tial subrutinoj kiel <code>is-prime<\/code> legiĝas tiel nature. Por validigi identigilojn de <em>Raku<\/em>, permesu tiajn grupojn post la klasika parto:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu krampita grupo <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> akceptas streketon nur kiam litero sekvas, do <code>my-var<\/code> nun estas raportata kiel valida, dum <code>2fast<\/code> — kaj ĉenoj kiel <code>a-<\/code> aŭ <code>a-1<\/code> — ankoraŭ ne estas.<\/span><\/p>"]]},"la":{"t":"Solutio: Identificatores proba","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {\n    my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; &lt;[A..Za..z0..9_]&gt;* $ /;\n\n    say \"$name: { $ok ?? 'valid' !! 'invalid' }\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/validate-identifier.raku\" target=\"_blank\" rel=\"noopener\">validate-identifier.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ancorae <code>^<\/code> et <code>$<\/code> exemplar cogunt <em>totam<\/em> catenam tegere, itaque unum signum errans ut lineola in <code>my-var<\/code> illud invalidum facit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Prima classis signorum litteram vel lineolam infimam permittit; secunda, per <code>*<\/code> repetita, cifras insuper permittit — regulae identificatoris classicae exacte congruens.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Secunda classis etiam ut <code>\\w<\/code> scribi potest, compendium incorporatum pro signo verbali (littera, cifra vel lineola infima):<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* $ /;     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una differentia notanda: <code>\\w<\/code> in Raku Unicode novit, itaque nomen ut <code>café<\/code> quoque transit — quod forte Raku ipsi congruit, ubi <code>my $café = 1;<\/code> prorsus legitimum est.<\/span> <span class=\"sg\" data-s=\"1\">Classis expresse scripta <code>&lt;[A..Za..z0..9_]&gt;<\/code> probationem stricte ad ASCII servat.<\/span><\/p>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Est tamen versura: in Raku ipso <code>my-var<\/code> identificator <em>validus<\/em> est! Raku lineolam (vel apostrophum, ut in <code>isn't<\/code>) intra nomen permittit, dum littera sequitur — quapropter subprogrammata ut <code>is-prime<\/code> tam naturaliter leguntur. Ut identificatores <em>Raku<\/em> probes, permitte tales greges post partem classicam:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     for &lt;count total2 2fast my-var _hidden&gt; -&gt; $name {         my $ok = $name ~~ / ^ &lt;[A..Za..z_]&gt; \\w* [ '-' &lt;[A..Za..z]&gt; \\w* ]* $ /;<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">say \"$name: { $ok ?? 'valid' !! 'invalid' }\";     }     <code><\/code><code><\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unusquisque grex uncis inclusus <code>[ '-' &lt;[A..Za..z]&gt; \\w* ]<\/code> lineolam solum tunc accipit cum littera sequitur, itaque <code>my-var<\/code> nunc ut validus nuntiatur, dum <code>2fast<\/code> — et catenae ut <code>a-<\/code> vel <code>a-1<\/code> — adhuc non sunt.<\/span><\/p>"]]}}}</script>
