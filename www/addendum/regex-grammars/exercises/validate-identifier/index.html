<script type="application/json" id="page-data">{"u":"addendum/regex-grammars/exercises/validate-identifier","n":1509,"k":"exercise","pv":"addendum/regex-grammars/exercises/normalize-whitespace/solution","nx":"addendum/regex-grammars/exercises/validate-identifier/solution","tr":["addendum","addendum/regex-grammars"],"L":{"en":{"t":"Exercise ’Validate identifiers‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In many programming languages, a valid identifier starts with a letter or underscore and continues with letters, digits, or underscores.<\/span> <span class=\"sg\" data-s=\"1\">For <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code>, and <code>_hidden<\/code>, print whether each is a valid identifier by that classic rule.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Raku itself is more generous: <code>my-var<\/code> is a perfectly valid Raku identifier.<\/span> <span class=\"sg\" data-s=\"1\">Check the solution page for that variant too.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Übung ’Bezeichner prüfen‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In vielen Programmiersprachen beginnt ein gültiger Bezeichner mit einem Buchstaben oder Unterstrich und setzt sich mit Buchstaben, Ziffern oder Unterstrichen fort.<\/span> <span class=\"sg\" data-s=\"1\">Geben Sie für <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> und <code>_hidden<\/code> jeweils aus, ob es nach dieser klassischen Regel ein gültiger Bezeichner ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Raku selbst ist großzügiger: <code>my-var<\/code> ist ein völlig gültiger Raku-Bezeichner.<\/span> <span class=\"sg\" data-s=\"1\">Sehen Sie sich auf der Lösungsseite auch diese Abwandlung an.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Valideer identifiers‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In veel programmeertalen begint een geldige identifier met een letter of underscore en gaat hij verder met letters, cijfers of underscores.<\/span> <span class=\"sg\" data-s=\"1\">Druk voor <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> en <code>_hidden<\/code> af of elk volgens die klassieke regel een geldige identifier is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Raku zelf is ruimhartiger: <code>my-var<\/code> is een volkomen geldige Raku-identifier.<\/span> <span class=\"sg\" data-s=\"1\">Bekijk de oplossingspagina ook voor die variant.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Valide identificadores","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En muchos lenguajes de programación, un identificador válido empieza por una letra o un guion bajo y continúa con letras, dígitos o guiones bajos.<\/span> <span class=\"sg\" data-s=\"1\">Para <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> y <code>_hidden<\/code>, imprime si cada uno es un identificador válido según esa regla clásica.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Raku es más generoso: <code>my-var<\/code> es un identificador de Raku perfectamente válido.<\/span> <span class=\"sg\" data-s=\"1\">Consulta también esa variante en la página de la solución.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Convalidate gli identificatori","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In molti linguaggi di programmazione un identificatore valido comincia con una lettera o un trattino basso e prosegue con lettere, cifre o trattini bassi.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> e <code>_hidden<\/code>, stampa se ciascuno è un identificatore valido secondo quella re \">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Упражнение «Проверьте идентификаторы»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Во многих языках программирования допустимый идентификатор начинается с буквы или подчёркивания и продолжается буквами, цифрами или подчёркиваниями.<\/span> <span class=\"sg\" data-s=\"1\">Для <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> и <code>_hidden<\/code> напечатайте, является ли каждый из них допустимым идентификатором по этому классическому правилу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Сам Raku щедрее: <code>my-var<\/code> — вполне допустимый идентификатор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Этот вариант тоже разобран на странице решения.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Перевірка ідентифікаторів»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У багатьох мовах програмування коректний ідентифікатор починається з літери або підкреслення й далі містить літери, цифри чи підкреслення.<\/span> <span class=\"sg\" data-s=\"1\">Для <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> та <code>_hidden<\/code> надрукуйте, чи є кожен коректним ідентифікатором за цим класичним правилом.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Сам Raku щедріший: <code>my-var<\/code> є цілком коректним ідентифікатором Raku.<\/span> <span class=\"sg\" data-s=\"1\">Погляньте на сторінку рішення і щодо цього варіанту.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма друкує:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Проверка на идентификатори“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В много езици за програмиране валидният идентификатор започва с буква или долна черта и продължава с букви, цифри или долни черти.<\/span> <span class=\"sg\" data-s=\"1\">За <code>count<\/code>, <code>total2<\/code>, <code>2fast<\/code>, <code>my-var<\/code> и <code>_hidden<\/code> отпечатайте дали всеки е валиден идентификатор по това класическо правило.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Самият Raku е по-щедър: <code>my-var<\/code> е напълно валиден идентификатор в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Погледнете и страницата с решението за този вариант.)<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>count: valid\ntotal2: valid\n2fast: invalid\nmy-var: invalid\n_hidden: valid<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/addendum/regex-grammars/exercises/validate-identifier/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Validigu identigilojn","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",2,"<p><
