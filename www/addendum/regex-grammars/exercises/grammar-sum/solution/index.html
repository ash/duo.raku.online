<script type="application/json" id="page-data">{"u":"addendum/regex-grammars/exercises/grammar-sum/solution","n":1514,"k":"solution","pv":"addendum/regex-grammars/exercises/grammar-sum","nx":"addendum/mini-projects","tr":["addendum","addendum/regex-grammars"],"L":{"en":{"t":"The solution of ’A grammar that adds‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP    { &lt;number&gt;+ % '+' }\n    token number { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make [+] $&lt;number&gt;.map(*.Int) }\n}\n\nsay Sum.parse('3+4+5', actions =&gt; SumActions).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/grammar-sum.raku\" target=\"_blank\" rel=\"noopener\">grammar-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;number&gt;+ % '+'<\/code> matches one or more numbers separated by <code>+<\/code> signs — the <code>%<\/code> modifier describes the separator between repetitions.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The action method runs when <code>TOP<\/code> matches. <code>make<\/code> attaches a computed value — the sum of the numbers — which <code>.made<\/code> reads back after parsing.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A <code>token<\/code> never skips spaces, so this grammar is strict about its input: <code>'3+4+5'<\/code> parses, but <code>'3 + 4 + 5'<\/code> does not (<code>.parse<\/code> returns <code>Nil<\/code>). To accept spaces around r&gt;+ % '+'<\/code> trifft eine oder mehrere Zahlen, durch <code>+<\/code>-Zeichen getrennt — der Modifikator <code>%<\/code> beschreibt das Trennzeichen zwischen den Wiederholungen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Aktionsmethode läuft, wenn <code>TOP<\/code> trifft. <code>make<\/code> hängt einen berechneten Wert an — die Summe der Zahlen —, den <code>.made<\/code> nach dem Zerlegen zurückliest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein <code>token<\/code> überspringt niemals Leerraum, diese Grammatik ist bei ihrer Eingabe also streng: <code>'3+4+5'<\/code> lässt sich zerlegen, <code>'3 + 4 + 5'<\/code> nicht (<code>.parse<\/code> liefert <code>Nil<\/code>). Um Leerzeichen um die Pluszeichen anzunehmen, machen Sie <code>TOP<\/code> zu einer <code>rule<\/code> — und lösen Sie den Quantor von seinem Atom:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     grammar Sum {         rule TOP     { &lt;number&gt; + % '+' }         token number { \\d+ }     }     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In einer <code>rule<\/code> steht Leerraum im Muster für einen stillschweigenden <code>&lt;.ws&gt;<\/code>-Aufruf.<\/span> <span class=\"sg\" data-s=\"1\">Als <code>&lt;number&gt; + % '+'<\/code> geschrieben, mit einem Leerzeichen vor dem Quantor <code>+<\/code>, deckt dieser mitgemeinte Leerraum die ganze Wiederholung ab — Trennzeichen eingeschlossen —, sowohl <code>'3+4+5'<\/code> als auch <code>'3 + 4 + 5'<\/code> werden also zerlegt, und die Summe ist so wie so <code>12<\/code>. (Bleiben Sie lieber bei einem <code>token<\/code>, schreiben Sie die Leerzeichen im Trennzeichen aus: <code>&lt;number&gt;+ % [ \\s* '+' \\s* ]<\/code>.)<\/span><\/p>"]]},"nl":{"t":"Oplossing: Een grammatica die optelt","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"< авляється з одним або більше числами, розділеними знаками <code>+<\/code>, — модифікатор <code>%<\/code> описує розділювач між повтореннями.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Метод дії виконується, коли зіставляється <code>TOP<\/code>. <code>make<\/code> прикріплює обчислене значення — суму чисел, — яке <code>.made<\/code> читає назад після розбору.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>token<\/code> ніколи не пропускає пробілів, тож ця граматика строга щодо свого вхідного тексту: <code>'3+4+5'<\/code> розбирається, а <code>'3 + 4 + 5'<\/code> — ні (<code>.parse<\/code> повертає <code>Nil<\/code>). Щоб приймати пробіли навколо плюсів, зробіть <code>TOP<\/code> правилом <code>rule<\/code> — і відокремте квантифікатор від його атома:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     grammar Sum {         rule TOP     { &lt;number&gt; + % '+' }         token number { \\d+ }     }     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <code>rule<\/code> пробіли в шаблоні означають неявний виклик <code>&lt;.ws&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Записане як <code>&lt;number&gt; + % '+'<\/code>, із пробілом перед квантифікатором <code>+<\/code>, цей неявний пробіл покриває все повторення, зокрема й розділювачі, — тож розбираються і <code>'3+4+5'<\/code>, і <code>'3 + 4 + 5'<\/code>, а сума в обох випадках дорівнює <code>12<\/code>. (Якщо ви волієте лишитися з <code>token<\/code>, розпишіть пробіли в самому розділювачі: <code>&lt;number&gt;+ % [ \\s* '+' \\s* ]<\/code>.)<\/span><\/p>"]]},"bg":{"t":"Решение: Граматика, която събира","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP    { &lt;number&gt;+ % '+' }\n    token number { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make [+] $&lt;number&gt;.map(*.Int) }\n}\n\nsay Sum.parse('3+4+5', actions =&gt; SumActions).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/regex-grammars/grammar-sum.raku\" target=\"_blank\" rel=\"noopener\">grammar-sum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;number&gt;+ % '+'<\/code> съпоставя едно или повече числа, разделени със знаци <code>+<\/code> — модификаторът <code>%<\/code> описва разделителя между повторенията.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Методът за действие се изпълнява, когато <code>TOP<\/code> съвпадне. <code>make<\/code> прикачва изчислена стойност — сумата на числата, — която <code>.made<\/code> прочита обратно след разбора.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>token<\/code> никога не прескача интервали, така че тази граматика е строга към входа си: <code>'3+4+5'<\/code> се разбира, а <code>'3 + 4 + 5'<\/code> — не (<code>.parse<\/code> връща <code>Nil<\/code>). За да приемате интервали около плюсовете, направете <code>TOP<\/code> правило <code>rule<\/code> — и отделете квантификатора от атома му:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     grammar Sum {         rule TOP     { &lt;number&gt; + % '+' }         token number { \\d+ }     }     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <code>rule<\/code> интервалите в шаблона означават неявно извикване на <code>&lt;.ws&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Записано като <code>&lt;number&gt; + % '+'<\/code>, с интервал преди квантификатора <code>+<\/code>, този неявен интервал покрива цялото повторение, включително разделителите — така че се разбират и <code>'3+4+5'<\/code>, и <code>'3 + 4 + 5'<\/code>, а сумата и в двата случая е <code>12<\/code>. (Ако предпочитате да останете с <code>token<\/code>, разпишете интервалите в самия разделител: <code>&lt;number&gt;+ % [ \\s* '+' \\s* ]<\/code>.)<\/span><\/p>"]]}}}</script>
