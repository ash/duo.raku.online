<script type="application/json" id="page-data">{"u":"addendum/mini-projects/exercises/csv-averages/solution","n":1528,"k":"solution","pv":"addendum/mini-projects/exercises/csv-averages","nx":"essentials/loops/topic/exercises","tr":["addendum","addendum/mini-projects"],"L":{"en":{"t":"The solution of ’Scores from CSV lines‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @lines = 'Anna,90', 'Bob,72', 'Cara,84';\nmy %score;\n\nfor @lines -&gt; $line {\n    my ($name, $mark) = $line.split(',');\n    %score{$name} = $mark.Int;\n}\n\nmy $average = ([+] %score.values) / %score.elems;\nsay \"average: $average\";\n\nsay \"above average:\";\nfor %score.sort -&gt; $pair {\n    say \"  {$pair.key}\" if $pair.value &gt; $average;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/csv-averages.raku\" target=\"_blank\" rel=\"noopener\">csv-averages.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>average: 82\nabove average:\n  Anna\n  Cara<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Splitting each line on the comma and assigning to <code>($name, $mark)<\/code> unpacks the two fields at once; <code>.Int<\/code> turns the score text into a number.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The average is the sum of the values over their count; anyone whose score beats it is listed. Here the average works out to a whole <code>82<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">That final loop can be written as a pipeline. <code>sort<\/code> orders the pairs, 1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/csv-averages.raku\" target=\"_blank\" rel=\"noopener\">csv-averages.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>average: 82\nabove average:\n  Anna\n  Cara<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Разбиение каждой строки по запятой и присваивание в <code>($name, $mark)<\/code> распаковывает оба поля разом, а <code>.Int<\/code> превращает текст балла в число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Среднее — это сумма значений, делённая на их количество; перечисляются все, чей балл его превосходит. Здесь среднее оказывается целым <code>82<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последний цикл можно записать конвейером. <code>sort<\/code> упорядочивает пары, <code>grep<\/code> оставляет те, что выше среднего, а <code>map<\/code> сводит каждую уцелевшую пару к имени, — так что в теле цикла не остаётся логики, только печать:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say \"  $_\" for %score.sort.grep(*.value &gt; $average).map(*.key);     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Читая слева направо, мы получаем ровно то, что происходит: отсортировать, оставить тех, кто выше среднего, взять их имена.<\/span> <span class=\"sg\" data-s=\"1\">Каждый этап — небольшой самостоятельный шаг, а <code>*.value<\/code> / <code>*.key<\/code> — это <a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">звёздочки Whatever<\/a>, которые на лету строят блок с одним аргументом.<\/span><\/p>"]]},"uk":{"t":"Розв'язання вправи «Бали з рядків CSV»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @lines = 'Anna,90', 'Bob,72', 'Cara,84';\nmy %score;\n\nfor @lines -&gt; $line {\n    my ($name, $mark) = $line.split(',');\n    %score{$name} = $mark.Int;\n}\n\nmy $average = ([+] %score.values) / %score.elems;\nsay \"average: $average\";\n\nsay \"above average:\";\nfor %score.sort -&gt; $pair {\n    say \"  {$pair.key}\" if $pair.value &gt; $average;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/csv-averages.raku\" target=\"_blank\" rel=\"noopener\">csv-averages.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>average: 82\nabove average:\n  Anna\n  Cara<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Розбиття кожного рядка на комі й присвоєння в <code>($name, $mark)<\/code> розпаковує два поля одразу; <code>.Int<\/code> перетворює текст бала на число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Середнє є сумою значень, поділеною на їхню кількість; перелічують кожного, чий бал його перевищує. Тут середнє виходить цілим <code>82<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Той останній цикл можна записати конвеєром. <code>sort<\/code> упорядковує пари, <code>grep<\/code> залишає ті, що вищі за середнє, а <code>map<\/code> зводить кожну вцілілу пару до її імені, — тож у тілі циклу не лишається жодної логіки, лише друк:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say \"  $_\" for %score.sort.grep(*.value &gt; $average).map(*.key);     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Читаючи зліва направо, це каже рівно те, що робить: відсортуй, залиш тих, хто вищий за середнє, візьми їхні імена.<\/span> <span class=\"sg\" data-s=\"1\">Кожен етап є невеликим самодостатнім кроком, а <code>*.value<\/code> / <code>*.key<\/code> є <a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">зірочками Whatever<\/a>, що на льоту будують блок від одного аргументу.<\/span><\/p>"]]},"bg":{"t":"Решение: Точки от редове CSV","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @lines = 'Anna,90', 'Bob,72', 'Cara,84';\nmy %score;\n\nfor @lines -&gt; $line {\n    my ($name, $mark) = $line.split(',');\n    %score{$name} = $mark.Int;\n}\n\nmy $average = ([+] %score.values) / %score.elems;\nsay \"average: $average\";\n\nsay \"above average:\";\nfor %score.sort -&gt; $pair {\n    say \"  {$pair.key}\" if $pair.value &gt; $average;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/csv-averages.raku\" target=\"_blank\" rel=\"noopener\">csv-averages.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>average: 82\nabove average:\n  Anna\n  Cara<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Разделянето на всеки ред по запетаята и присвояването на <code>($name, $mark)<\/code> разопакова двете полета наведнъж; <code>.Int<\/code> превръща текста на точките в число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Средното е сумата на стойностите, разделена на броя им; изреждат се всички, чиито точки го надминават. Тук средното излиза цялото <code>82<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Онзи последен цикъл може да се запише като конвейер. <code>sort<\/code> подрежда двойките, <code>grep<\/code> запазва онези над средното, а <code>map<\/code> свежда всяка оцеляла двойка до името ѝ — така в тялото на цикъла не остава логика, а само печатане:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say \"  $_\" for %score.sort.grep(*.value &gt; $average).map(*.key);     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Четейки отляво надясно, това казва точно каквото прави: сортирай, запази онези над средното, вземи имената им.<\/span> <span class=\"sg\" data-s=\"1\">Всеки етап е малка самостоятелна стъпка, а <code>*.value<\/code> / <code>*.key<\/code> са <a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">звезди Whatever<\/a>, които в движение изграждат блок от един аргумент.<\/span><\/p>"]]}}}</script>
