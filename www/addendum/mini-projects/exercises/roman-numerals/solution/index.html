<script type="application/json" id="page-data">{"u":"addendum/mini-projects/exercises/roman-numerals/solution","n":1518,"k":"solution","pv":"addendum/mini-projects/exercises/roman-numerals","nx":"addendum/mini-projects/exercises/rpn-calculator","tr":["addendum","addendum/mini-projects"],"L":{"en":{"t":"The solution of ’Roman numerals‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @table =\n    1000 =&gt; 'M', 900 =&gt; 'CM', 500 =&gt; 'D', 400 =&gt; 'CD',\n    100  =&gt; 'C', 90  =&gt; 'XC', 50  =&gt; 'L', 40  =&gt; 'XL',\n    10   =&gt; 'X', 9   =&gt; 'IX', 5   =&gt; 'V', 4   =&gt; 'IV',\n    1    =&gt; 'I';\n\nmy $n = 1994;\nmy $roman = '';\n\nfor @table -&gt; $pair {\n    while $n &gt;= $pair.key {\n        $roman ~= $pair.value;\n        $n -= $pair.key;\n    }\n}\n\nsay $roman;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/roman-numerals.raku\" target=\"_blank\" rel=\"noopener\">roman-numerals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>MCMXCIV<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The table lists every symbol in descending value, including the subtractive forms like <code>CM<\/code> (900) and <code>IV<\/code> (4), so the algorithm never has to special-case them.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">For each entry, the <code>while<\/code> appends the symbol and subtracts its value as many times as it fits, so the largest pieces are used up first.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Römische Zahlen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @table =\n    1000 =&gt; 'M', 900 =&gt; 'CM', 500 =&gt; 'D', 400 =&gt; 'CD',\n    100  =&gt; 'C', 90  =&gt; 'XC', 50  =&gt; 'L', 40  =&gt; 'XL',\n    10   =&gt; 'X', 9   =&gt; 'IX', 5   =&gt; 'V', 4   =&gt; 'IV',\n    1    =&gt; 'I';\n\nmy $n = 1994;\nmy $roman = '';\n\nfor @table -&gt; $pair {\n    while $n &gt;= $pair.key {\n        $roman ~= $pair.value;\n        $n -= $pair.key;\n    }\n}\n\nsay $roman;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/roman-numerals.raku\" target=\"_blank\" rel=\"noopener\">roman-numerals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>MCMXCIV<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Tabelle führt jedes Zeichen nach absteigendem Wert auf, einschließlich der subtraktiven Formen wie <code>CM<\/code> (900) und <code>IV<\/code> (4), der Algorithmus muss sie also nie gesondert behandeln.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Für jeden Eintrag hängt das <code>while<\/code> das Zeichen an und zieht seinen Wert so oft ab, wie er hineinpasst, die größten Stücke werden also zuerst aufgebraucht.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Romeinse cijfers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @table =\n    1000 =&gt; 'M', 900 =&gt; 'CM', 500 =&gt; 'D', 400 =&gt; 'CD',\n    100  =&gt; 'C', 90  =&gt; 'XC', 50  =&gt; 'L', 40  =&gt; 'XL',\n    10   =&gt; 'X', 9   =&gt; 'IX', 5   =&gt; 'V', 4   =&gt; 'IV',\n    1    =&gt; 'I';\n\nmy $n = 1994;\nmy $roman = '';\n\nfor @table -&gt; $pair {\n    while $n &gt;= $pair.key {\n        $roman ~= $pair.value;\n        $n -= $pair.key;\n    }\n}\n\nsay $roman;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/roman-numerals.raku\" target=\"_blank\" rel=\"noopener\">roman-numerals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>MCMXCIV<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De tabel somt elk symbool in aflopende waarde op, inclusief de aftrekkende vormen als <code>CM<\/code> (900) en <code>IV<\/code> (4), zodat het algoritme ze nooit als bijzonder geval hoeft te behandelen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Voor elk item plakt de <code>while<\/code> het symbool erachter en trekt hij de waarde er zo vaak af als hij erin past, dus worden de grootste stukken het eerst opgebruikt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Números romanos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @table =\n    1000 =&gt; 'M', 900 =&gt; 'CM', 500 =&gt; 'D', 400 =&gt; 'CD',\n    100  =&gt; 'C', 90  =&gt; 'XC', 50  =&gt; 'L', 40  =&gt; 'XL',\n    10   =&gt; 'X', 9   =&gt; 'IX', 5   =&gt; 'V', 4   =&gt; 'IV',\n    1    =&gt; 'I';\n\nmy $n = 1994;\nmy $roman = '';\n\nfor @table -&gt; $pair {\n    while $n &gt;= $pair.key {\n        $roman ~= $pair.value;\n        $n -= $pair.key;\n    }\n}\n\nsay $roman;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encon ><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tabella elenca ogni simbolo in ordine di valore decrescente, comprese le forme sottrattive come <code>CM<\/code> (900) e <code>IV<\/code> (4), così l'algoritmo non deve mai trattarle come casi speciali.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Per ogni voce, il <code>while<\/code> aggiunge il simbolo e sottrae il suo valore tante volte quante ci sta, così i pezzi più grandi vengono consumati per primi.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Римские цифры","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @table =\n    1000 =&gt; 'M', 900 =&gt; 'CM', 500 =&gt; 'D', 400 =&gt; 'CD',\n    100  =&gt; 'C', 90  =&gt; 'XC', 50  =&gt; 'L', 40  =&gt; 'XL',\n    10   =&gt; 'X', 9   =&gt; 'IX', 5   =&gt; 'V', 4   =&gt; 'IV',\n    1    =&gt; 'I';\n\nmy $n = 1994;\nmy $roman = '';\n\nfor @table -&gt; $pair {\n    while $n &gt;= $pair.key {\n        $roman ~= $pair.value;\n        $n -= $pair.key;\n    }\n}\n\nsay $roman;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/addendum/mini-projects/roman-numerals.raku\" target=\"_blank\" rel=\"noopener\">roman-numerals.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>MCMXCIV<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Таблица перечисляет все символы по убыванию значения, включая вычитательные формы вроде <code>CM<\/code> (900) и <code>IV<\/code> (4), поэтому алгоритму не приходится обрабатывать их особым образом.<\/span><\/li><\/ol>"],["list",1,"<ol><li><
