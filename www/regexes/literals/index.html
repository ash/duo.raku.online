<script type="application/json" id="page-data">{"u":"regexes/literals","n":969,"k":"section","pv":"regexes","nx":"regexes/literals/literal-text","tr":["regexes"],"L":{"en":{"t":"Literals and character classes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>regex<\/em> (short for <em>regular expression<\/em>) is a pattern that describes a piece of text.<\/span> <span class=\"sg\" data-s=\"1\">With a regex you can ask questions such as “does this string contain a number?” or “does this word start with a capital letter?”, and you can pull pieces out of a string or change them.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has especially powerful and readable regexes, and they are built right into the language.<\/span> <span class=\"sg\" data-s=\"1\">The simplest way to write one is between two slashes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This pattern matches the three letters <code>c<\/code>, <code>a<\/code>, <code>t<\/code> in a row.<\/span> <span class=\"sg\" data-s=\"1\">To test a string against a pattern, use the smartmatch operator <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When the pattern is found, Raku reports the part of the string that matched, shown between the corner brackets <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You will look at this result more closely in the next section.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In this first section you will learn how to match exact (<em>literal<\/em>) text, and how to match a character that may be one of several — a <em>character class<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The following sections then add <a href=\"/regexes/quantifiers/\">quantifiers<\/a>, <a href=\"/regexes/captures/\">captures<\/a>, and everything else that makes regexes so useful.<\/span><\/p>"]]},"de":{"t":"Wörtlicher Text und Zeichenklassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Regex<\/em> (kurz für <em>regulärer Ausdruck<\/em>) ist ein Muster, das ein Stück Text beschreibt.<\/span> <span class=\"sg\" data-s=\"1\">Mit einem Regex können Sie Fragen stellen wie „Enthält diese Zeichenkette eine Zahl?“ oder „Beginnt dieses Wort mit einem Großbuchstaben?“, und Sie können Teile aus einer Zeichenkette herausziehen oder verändern.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat besonders mächtige und gut lesbare Regexes, und sie sind unmittelbar in die Sprache eingebaut.<\/span> <span class=\"sg\" data-s=\"1\">Am einfachsten schreiben Sie einen zwischen zwei Schrägstrichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieses Muster trifft die drei Buchstaben <code>c<\/code>, <code>a<\/code>, <code>t<\/code> in Folge.<\/span> <span class=\"sg\" data-s=\"1\">Um eine Zeichenkette gegen ein Muster zu prüfen, verwenden Sie den Smartmatch-Operator <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wird das Muster gefunden, meldet Raku den Teil der Zeichenkette, der getroffen wurde, dargestellt zwischen den Eckklammern <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Ergebnis sehen Sie sich im nächsten Abschnitt genauer an.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In diesem ersten Abschnitt lernen Sie, wie man genauen (<em>wörtlichen<\/em>) Text trifft und wie man ein Zeichen trifft, das eines von mehreren sein darf — eine <em>Zeichenklasse<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Die folgenden Abschnitte ergänzen <a href=\"https://course.raku.org/de/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">Quantoren<\/a>, <a href=\"https://course.raku.org/de/regexes/captures/\" target=\"_blank\" rel=\"noopener\">Captures<\/a> und alles Weitere, was Regexes so nützlich macht.<\/span><\/p>"]]},"nl":{"t":"Letterlijke tekst en tekenklassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>regex<\/em> (kort voor <em>reguliere expressie<\/em>) is een patroon dat een stuk tekst beschrijft.<\/span> <span class=\"sg\" data-s=\"1\">Met een regex kun je vragen stellen als \"bevat deze string een getal?\" of \"begint dit woord met een hoofdletter?\", en je kunt stukken uit een string halen of ze veranderen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft bijzonder krachtige en leesbare regexes, en ze zitten regelrecht in de taal ingebouwd.<\/span> <span class=\"sg\" data-s=\"1\">De eenvoudigste manier om er een te schrijven is tussen twee schuine strepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit patroon matcht de drie letters <code>c<\/code>, <code>a<\/code>, <code>t<\/code> achter elkaar.<\/span> <span class=\"sg\" data-s=\"1\">Om een string tegen een patroon te testen, gebruik je de smartmatch-operator <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer het patroon gevonden wordt, meldt Raku het deel van de string dat matchte, getoond tussen de hoekhaken <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In de volgende sectie bekijk je dit resultaat nauwkeuriger.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In deze eerste sectie leer je hoe je exacte (<em>letterlijke<\/em>) tekst matcht, en hoe je een teken matcht dat een van meerdere kan zijn — een <em>tekenklasse<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De volgende secties voegen daar <a href=\"https://course.raku.org/nl/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">kwantoren<\/a>, <a href=\"https://course.raku.org/nl/regexes/captures/\" target=\"_blank\" rel=\"noopener\">captures<\/a> en al het andere aan toe dat regexes zo nuttig maakt.<\/span><\/p>"]]},"es":{"t":"Literales y clases de caracteres","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>regex<\/em> (abreviatura de <em>regular expression<\/em>, expresión regular) es un patrón que describe un fragmento de texto.<\/span> <span class=\"sg\" data-s=\"1\">Con un regex puedes hacer preguntas como «¿contiene esta cadena un número?» o «¿empieza esta palabra por mayúscula?», y puedes extraer piezas de una cadena o cambiarlas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene regex especialmente potentes y legibles, integrados directamente en el lenguaje.<\/span> <span class=\"sg\" data-s=\"1\">La forma más sencilla de escribir uno es entre dos barras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este patrón empareja las tres letras <code>c<\/code>, <code>a<\/code>, <code>t<\/code> seguidas.<\/span> <span class=\"sg\" data-s=\"1\">Para comprobar una cadena contra un patrón, usa el operador de emparejamiento inteligente <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando el patrón se encuentra, Raku informa de la parte de la cadena que coincidió, mostrada entre las esquinas <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Examinarás este resultado más de cerca en la sección siguiente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En esta primera sección aprenderás a emparejar texto exacto (<em>literal<\/em>) y a emparejar un carácter que puede ser uno de varios: una <em>clase de caracteres<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Las secciones siguientes añaden los <a href=\"https://course.raku.org/es/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">cuantificadores<\/a>, las <a href=\"https://course.raku.org/es/regexes/captures/\" target=\"_blank\" rel=\"noopener\">capturas<\/a> y todo lo demás que hace tan útiles a los regex.<\/span><\/p>"]]},"it":{"t":"Letterali e classi di caratteri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>regex<\/em> (abbreviazione di <em>regular expression<\/em>, espressione regolare) è uno schema che descrive un pezzo di testo.<\/span> <span class=\"sg\" data-s=\"1\">Con un regex puoi porre domande come «questa stringa contiene un numero?» o «questa parola comincia con una maiuscola?», e puoi estrarre pezzi da una stringa o cambiarli.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha regex particolarmente potenti e leggibili, incorporati direttamente nel linguaggio.<\/span> <span class=\"sg\" data-s=\"1\">Il modo più semplice di scriverne uno è fra due barre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo schema riconosce le tre lettere <code>c<\/code>, <code>a<\/code>, <code>t<\/code> di fila.<\/span> <span class=\"sg\" data-s=\"1\">Per mettere alla prova una stringa contro uno schema, usa l'operatore smartmatch <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando lo schema viene trovato, Raku riferisce la parte di stringa che ha corrisposto, mostrata fra le parentesi angolari <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Guarderai questo risultato più da vicino nella sezione successiva.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In questa prima sezione imparerai come riconoscere testo esatto (<em>letterale<\/em>) e come riconoscere un carattere che può essere uno fra tanti — una <em>classe di caratteri<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Le sezioni seguenti aggiungono poi i <a href=\"https://course.raku.org/it/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">quantificatori<\/a>, le <a href=\"https://course.raku.org/it/regexes/captures/\" target=\"_blank\" rel=\"noopener\">catture<\/a> e tutto il resto che rende i regex così utili.<\/span><\/p>"]]},"lv":{"t":"Literāļi un rakstzīmju klases","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Regulārā izteiksme<\/em> (saīsināti <em>regex<\/em>) ir raksturs, kas apraksta kādu teksta gabalu.<\/span> <span class=\"sg\" data-s=\"1\">Ar regulāro izteiksmi varat uzdot tādus jautājumus kā «vai šī virkne satur skaitli?» vai «vai šis vārds sākas ar lielo burtu?», kā arī izvilkt no virknes gabalus vai tos mainīt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ir īpaši jaudīgas un labi lasāmas regulārās izteiksmes, un tās ir iebūvētas pašā valodā.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršākais veids, kā tādu uzrakstīt, ir starp divām slīpsvītrām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis raksturs piemeklē trīs burtus <code>c<\/code>, <code>a<\/code>, <code>t<\/code> pēc kārtas.<\/span> <span class=\"sg\" data-s=\"1\">Lai pārbaudītu virkni pret raksturu, izmantojiet gudrās sakritības operatoru <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad raksturs ir atrasts, Raku ziņo to virknes daļu, kas sakrita, parādot to stūra iekavās <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šo rezultātu tuvāk aplūkosiet nākamajā sadaļā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šajā pirmajā sadaļā uzzināsiet, kā piemeklēt precīzu (<em>burtisku<\/em>) tekstu un kā piemeklēt rakstzīmi, kas var būt viena no vairākām, — <em>rakstzīmju klasi<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Nākamās sadaļas tad pievieno <a href=\"https://course.raku.org/lv/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">kvantorus<\/a>, <a href=\"https://course.raku.org/lv/regexes/captures/\" target=\"_blank\" rel=\"noopener\">tvērumus<\/a> un visu pārējo, kas padara regulārās izteiksmes tik noderīgas.<\/span><\/p>"]]},"ru":{"t":"Литералы и классы символов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Регулярное выражение<\/em> (или коротко <em>регулярка<\/em>) — это шаблон, описывающий кусочек текста.<\/span> <span class=\"sg\" data-s=\"1\">С его помощью можно задавать вопросы вроде «есть ли в этой строке число?» или «начинается ли это слово с заглавной буквы?», а также вытаскивать части строки и изменять их.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku регулярные выражения особенно мощные и удобочитаемые, и они встроены прямо в язык.<\/span> <span class=\"sg\" data-s=\"1\">Проще всего записать такое выражение между двумя косыми чертами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот шаблон соответствует трём буквам <code>c<\/code>, <code>a<\/code>, <code>t<\/code>, идущим подряд.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы проверить строку на соответствие шаблону, используйте оператор умного сопоставления <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда шаблон найден, Raku показывает ту часть строки, которая совпала, — она выводится в угловых кавычках <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подробнее этот результат рассматривается в следующем разделе.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом первом разделе вы научитесь сопоставлять точный (<em>литеральный<\/em>) текст, а также символ, который может быть одним из нескольких, — <em>класс символов<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Дальнейшие разделы добавят <a href=\"https://course.raku.org/ru/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">квантификаторы<\/a>, <a href=\"https://course.raku.org/ru/regexes/captures/\" target=\"_blank\" rel=\"noopener\">захваты<\/a> и всё остальное, что делает регулярные выражения такими полезными.<\/span><\/p>"]]},"uk":{"t":"Літерали та класи символів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Регулярний вираз<\/em> (або скорочено <em>регекс<\/em>) — це шаблон, який описує шматок тексту.<\/span> <span class=\"sg\" data-s=\"1\">За допомогою регекса можна ставити запитання на кшталт «чи містить цей рядок число?» або «чи починається це слово з великої літери?», а також витягати частини рядка чи змінювати їх.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku має особливо потужні й читні регулярні вирази, і вони вбудовані просто в мову.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіший спосіб записати регекс — між двома скісними рисками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей шаблон збігається з трьома літерами <code>c<\/code>, <code>a<\/code>, <code>t<\/code>, що йдуть поспіль.<\/span> <span class=\"sg\" data-s=\"1\">Щоб перевірити рядок за шаблоном, скористайтеся оператором розумного зіставлення <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли шаблон знайдено, Raku повідомляє ту частину рядка, що збіглася, показуючи її між кутовими дужками <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Пильніше цей результат ви розглянете в наступному розділі.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У цьому першому розділі ви навчитеся зіставлятися з точним (<em>літеральним<\/em>) текстом і зі символом, який може бути одним із кількох, — <em>класом символів<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Наступні розділи додають <a href=\"https://course.raku.org/uk/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">квантифікатори<\/a>, <a href=\"https://course.raku.org/uk/regexes/captures/\" target=\"_blank\" rel=\"noopener\">захоплення<\/a> і все інше, що робить регекси такими корисними.<\/span><\/p>"]]},"bg":{"t":"Литерали и класове от знаци","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Регулярният израз<\/em> (или накратко <em>регекс<\/em>) е шаблон, който описва парче текст.<\/span> <span class=\"sg\" data-s=\"1\">С регулярен израз можете да задавате въпроси като „съдържа ли този низ число?“ или „започва ли тази дума с главна буква?“, а също да извличате парчета от низ или да ги променяте.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има особено мощни и четими регулярни изрази и те са вградени направо в езика.<\/span> <span class=\"sg\" data-s=\"1\">Най-простият начин да напишете такъв е между две наклонени черти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>/cat/<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този шаблон съпоставя трите букви <code>c<\/code>, <code>a<\/code>, <code>t<\/code> една след друга.<\/span> <span class=\"sg\" data-s=\"1\">За да проверите низ срещу шаблон, използвайте оператора за интелигентно съпоставяне <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато шаблонът бъде намерен, Raku съобщава онази част от низа, която е съвпаднала, показана между ъгловите скоби <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ще разгледате този резултат по-отблизо в следващия раздел.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В този първи раздел ще научите как да съпоставяте точен (<em>буквален<\/em>) текст и как да съпоставите знак, който може да е един от няколко — <em>клас от знаци<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Следващите раздели добавят <a href=\"https://course.raku.org/bg/regexes/quantifiers/\" target=\"_blank\" rel=\"noopener\">квантификатори<\/a>, <a href=\"https://course.raku.org/bg/regexes/captures/\" target=\"_blank\" rel=\"noopener\">прихващания<\/a> и всичко останало, което прави регулярните изрази толкова полезни.<\/span><\/p>"]]}}}</script>
