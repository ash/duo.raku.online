<script type="application/json" id="page-data">{"u":"regexes/literals/exercises/digit-class/solution","n":979,"k":"solution","pv":"regexes/literals/exercises/digit-class","nx":"regexes/literals/exercises/a-vowel","tr":["regexes","regexes/literals"],"L":{"en":{"t":"The solution of ’A letter or digit‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A class can hold several ranges, one after another. <code>&lt;[a..z 0..9]&gt;<\/code> matches one character that is a lowercase letter <strong>or<\/strong> a digit. The space between the two ranges is only there for readability — <code>&lt;[a..z0..9]&gt;<\/code> means exactly the same, because spaces inside <code>&lt;[…]&gt;<\/code> are ignored, just as they are elsewhere in a regex.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Scanning from the left, the two spaces and the <code>@<\/code> are not in the class and are skipped; the first matching character is <code>x<\/code>. (This combined class is close to what the shortcut <code>\\w<\/code> stands for.)<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein Buchstabe oder eine Ziffer","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Eine Klasse kann mehrere Bereiche enthalten, einen nach dem anderen. <code>&lt;[a..z 0..9]&gt;<\/code> trifft ein Zeichen, das ein Kleinbuchstabe <strong>oder<\/strong> eine Ziffer ist. Das Leerzeichen zwischen den beiden Bereichen dient nur der Lesbarkeit — <code>&lt;[a..z0..9]&gt;<\/code> bedeutet genau dasselbe, denn Leerzeichen innerhalb von <code>&lt;[…]&gt;<\/code> werden übergangen, genau wie sonst im Regex.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Von links durchlaufen gehören die beiden Leerzeichen und das <code>@<\/code> nicht zur Klasse und werden übersprungen; das erste passende Zeichen ist <code>x<\/code>. (Diese verbundene Klasse kommt dem nahe, wofür die Abkürzung <code>\\w<\/code> steht.)<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een letter of cijfer","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een klasse kan meerdere bereiken bevatten, het een na het ander. <code>&lt;[a..z 0..9]&gt;<\/code> matcht één teken dat een kleine letter <strong>of<\/strong> een cijfer is. De spatie tussen de twee bereiken staat er alleen voor de leesbaarheid — <code>&lt;[a..z0..9]&gt;<\/code> betekent precies hetzelfde, omdat spaties binnen <code>&lt;[…]&gt;<\/code> genegeerd worden, net als elders in een regex.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Van links doorlopen zitten de twee spaties en de <code>@<\/code> niet in de klasse en worden ze overgeslagen; het eerste matchende teken is <code>x<\/code>. (Deze gecombineerde klasse ligt dicht bij waar de afkorting <code>\\w<\/code> voor staat.)<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Una letra o un dígito","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una clase puede contener varios rangos, uno tras otro. <code>&lt;[a..z 0..9]&gt;<\/code> empareja un carácter que sea una letra minúscula <strong>o<\/strong> un dígito. El espacio entre los dos rangos está ahí solo por legibilidad: <code>&lt;[a..z0..9]&gt;<\/code> significa exactamente lo mismo, porque los espacios dentro de <code>&lt;[…]&gt;<\/code> se ignoran, igual que en el resto de un regex.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Recorriendo desde la izquierda, los dos espacios y la <code>@<\/code> no están en la clase y se saltan; el primer carácter que coincide es <code>x<\/code>. (Esta clase combinada se parece a lo que representa el atajo <code>\\w<\/code>.)<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Una lettera o una cifra","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una classe può contenere più intervalli, uno dopo l'altro. <code>&lt;[a..z 0..9]&gt;<\/code> riconosce un carattere che sia una lettera minuscola <strong>oppure<\/strong> una cifra. Lo spazio fra i due intervalli è lì solo per leggibilità — <code>&lt;[a..z0..9]&gt;<\/code> significa esattamente lo stesso, perché gli spazi dentro <code>&lt;[…]&gt;<\/code> vengono ignorati, come altrove in un regex.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Percorrendo da sinistra, i due spazi e la <code>@<\/code> non sono nella classe e vengono saltati; il primo carattere corrispondente è <code>x<\/code>. (Questa classe combinata è vicina a ciò che rappresenta la scorciatoia <code>\\w<\/code>.)<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Burts vai cipars","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Klasē var būt vairāki diapazoni cits aiz cita. <code>&lt;[a..z 0..9]&gt;<\/code> piemeklē vienu rakstzīmi, kas ir mazais burts <strong>vai<\/strong> cipars. Atstarpe starp abiem diapazoniem ir tur tikai lasāmības dēļ — <code>&lt;[a..z0..9]&gt;<\/code> nozīmē tieši to pašu, jo atstarpes <code>&lt;[…]&gt;<\/code> iekšienē tiek ignorētas, gluži tāpat kā citur regulārajā izteiksmē.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pārlūkojot no kreisās puses, abas atstarpes un <code>@<\/code> klasē neietilpst un tiek izlaistas; pirmā sakrītošā rakstzīme ir <code>x<\/code>. (Šī apvienotā klase ir tuva tam, ko apzīmē saīsinājums <code>\\w<\/code>.)<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Буква или цифра","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Класс может содержать несколько диапазонов подряд. <code>&lt;[a..z 0..9]&gt;<\/code> соответствует одному символу, который является строчной буквой <strong>или<\/strong> цифрой. Пробел между диапазонами стоит лишь для удобочитаемости: <code>&lt;[a..z0..9]&gt;<\/code> означает ровно то же самое, потому что пробелы внутри <code>&lt;[…]&gt;<\/code> игнорируются, как и везде в регулярном выражении.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Просматривая строку слева, два пробела и <code>@<\/code> в класс не входят и пропускаются; первым подходящим символом оказывается <code>x<\/code>. (Этот составной класс близок к тому, что обозначает сокращение <code>\\w<\/code>.)<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Літера або цифра","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Клас може містити кілька діапазонів, один за одним. <code>&lt;[a..z 0..9]&gt;<\/code> збігається з одним символом, що є малою літерою <strong>або<\/strong> цифрою. Пробіл між двома діапазонами стоїть лише для читності — <code>&lt;[a..z0..9]&gt;<\/code> означає точно те саме, бо пробіли всередині <code>&lt;[…]&gt;<\/code> ігноруються, як і всюди в регексі.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Скануючи зліва, два пробіли та <code>@<\/code> не належать до класу й пропускаються; першим відповідним символом є <code>x<\/code>. (Цей поєднаний клас близький до того, що позначає скорочення <code>\\w<\/code>.)<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Буква или цифра","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '  @x7' ~~ / &lt;[a..z 0..9]&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/digit-class.raku\" target=\"_blank\" rel=\"noopener\">digit-class.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>｢x｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Класът може да съдържа няколко диапазона един след друг. <code>&lt;[a..z 0..9]&gt;<\/code> съпоставя един знак, който е малка буква <strong>или<\/strong> цифра. Интервалът между двата диапазона е там само за четимост — <code>&lt;[a..z0..9]&gt;<\/code> означава точно същото, защото интервалите вътре в <code>&lt;[…]&gt;<\/code> се пренебрегват, както и навсякъде другаде в регулярния израз.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">При обхождане отляво двата интервала и <code>@<\/code> не са в класа и се прескачат; първият съвпадащ знак е <code>x<\/code>. (Този съчетан клас е близък до онова, което означава скъсяването <code>\\w<\/code>.)<\/span><\/li><\/ol>"]]}}}</script>
