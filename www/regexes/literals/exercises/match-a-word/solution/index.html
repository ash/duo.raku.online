/regexes/literals/match-a-word.raku\" target=\"_blank\" rel=\"noopener\">match-a-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>｢love Raku｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Leerzeichen zwischen den Wörtern ist hier bedeutsam, die Wortgruppe steht also in Anführungszeichen: <code>'love Raku'<\/code>. Ohne die Anführungszeichen würde die Regex-Maschine das Leerzeichen übergehen und nach <code>loveRaku<\/code> suchen, was in der Zeichenkette nicht vorkommt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Smartmatch liefert ein Match-Objekt, das die ganze angeführte Wortgruppe umfasst, und <code>say<\/code> gibt es zwischen Eckklammern aus.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Match een woordgroep","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I love Raku' ~~ / 'love Raku' /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/match-a-word.raku\" target=\"_blank\" rel=\"noopener\">match-a-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>｢love Raku｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De spatie tussen de woorden is hier betekenisvol, dus staat de woordgroep tussen aanhalingstekens: <code>'love Raku'<\/code>. Zonder de aanhalingstekens zou de regex-engine de spatie negeren en naar <code>loveRaku<\/code> zoeken, wat niet in de string staat.<\/span><\/li><\/ol>"],["list",1,"<ol> .raku\" target=\"_blank\" rel=\"noopener\">match-a-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢love Raku｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui lo spazio fra le parole è significativo, quindi la frase è avvolta fra virgolette: <code>'love Raku'<\/code>. Senza le virgolette il motore dei regex ignorerebbe lo spazio e cercherebbe <code>loveRaku<\/code>, che non è nella stringa.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Lo smartmatch restituisce un oggetto match che copre l'intera frase fra virgolette, e <code>say<\/code> lo stampa fra parentesi angolari.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Atrodiet frāzi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I love Raku' ~~ / 'love Raku' /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/literals/match-a-word.raku\" target=\"_blank\" rel=\"noopener\">match-a-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>｢love Raku｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Atstarpe starp vārdiem šeit ir nozīmīga, tāpēc frāze ir ietīta pēdiņās: <code>'love Raku'<\/code>. Bez pēdiņām regulāro izteiksmju dzinējs atstarpi ignorētu un meklētu <code>loveRaku<\/code>, kā virknē nav.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gudrā sakritība atgriež sakritības objektu, kas aptver visu pēdiņās likto frāzi un ko <code>say<\/code> izdrukā stūra iekavās.<\/span><
