a digit.<\/span> <span class=\"sg\" data-s=\"2\">The spaces there are only for readability — as everywhere in a regex, spaces inside <code>&lt;[…]&gt;<\/code> are ignored, so <code>&lt;[a..zA..Z0..9]&gt;<\/code> is exactly the same class.<\/span><\/p>"]]},"de":{"t":"Zeichenklassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oft möchten Sie kein festes Zeichen treffen, sondern ein beliebiges Zeichen aus einer Menge.<\/span> <span class=\"sg\" data-s=\"1\">Eine solche Menge heißt <em>Zeichenklasse<\/em> und wird zwischen <code>&lt;[<\/code> und <code>]&gt;<\/code> geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Klasse <code>&lt;[ae]&gt;<\/code> trifft ein einzelnes Zeichen, das entweder <code>a<\/code> oder <code>e<\/code> ist, beide Schreibweisen der Farbe werden also getroffen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Innerhalb der Klammern können Sie mit zwei Punkten einen <em>Bereich<\/em> angeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> trifft eine beliebige Ziffer; die erste Ziffer in der Zeichenkette ist <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um jedes Zeichen zu treffen, das <strong>nicht<\/strong> in der Menge ist, setzen Sie ein Minuszeichen direkt hinter die öffnende Klammer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier trifft <code>&lt;-[a..z]&gt;<\/code> das erste Zeichen, das kein Kleinbuchstabe ist, nämlich das Ausrufezeichen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können mehrere Teile in einer Klasse verbinden.<\/span> <span class=\"sg\" pan> <span class=\"sg\" data-s=\"1\">Zo matcht <code>&lt;[a..z A..Z 0..9]&gt;<\/code> een letter of een cijfer.<\/span> <span class=\"sg\" data-s=\"2\">De spaties daar zijn er alleen voor de leesbaarheid — zoals overal in een regex worden spaties binnen <code>&lt;[…]&gt;<\/code> genegeerd, dus <code>&lt;[a..zA..Z0..9]&gt;<\/code> is precies dezelfde klasse.<\/span><\/p>"]]},"es":{"t":"Clases de caracteres","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A menudo no quieres emparejar un carácter fijo, sino cualquier carácter de un conjunto.<\/span> <span class=\"sg\" data-s=\"1\">Un conjunto así se llama <em>clase de caracteres<\/em> y se escribe entre <code>&lt;[<\/code> y <code>]&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La clase <code>&lt;[ae]&gt;<\/code> empareja un solo carácter que sea <code>a<\/code> o <code>e<\/code>, así que coinciden las dos grafías del color.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro de los corchetes puedes indicar un <em>rango<\/em> con dos puntos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> empareja cualquier dígito; el primero de la cadena es <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para emparejar cualquier carácter que <strong>no<\/strong> esté en el conjunto, pon un signo menos justo después del corchete de apertura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>&lt;-[a..z]&gt;<\/code> empareja el primer carácter que no es una letra minúscula, que es el signo de exclamación.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes combinar varias piezas en una misma clase.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>&lt;[a..z A..Z 0..9]&gt;<\/code> empareja una letra o un dígito.<\/span> <span class=\"sg\" data-s=\"2\">Los espacios de ahí son solo por legibilidad: como en todo regex, los espacios dentro de <code>&lt;[…]&gt;<\/code> se ignoran, así que <code>&lt;[a..zA..Z0..9]&gt;<\/code> es exactamente la misma clase.<\/span><\/p>"]]},"it":{"t":"Classi di caratteri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Spesso non vuoi riconoscere un carattere fisso, ma un carattere qualunque preso da un insieme.<\/span> <span class=\"sg\" data-s=\"1\">Un insieme così si chiama <em>classe di caratteri<\/em> e si scrive fra <code>&lt;[<\/code> e <code>]&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La classe <code>&lt;[ae]&gt;<\/code> riconosce un singolo carattere che sia <code>a<\/code> oppure <code>e<\/code>, quindi corrispondono entrambe le grafie del colore.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro le parentesi puoi elencare un <em>intervallo<\/em> con due punti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> riconosce una cifra qualunque; la prima cifra nella stringa è <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per riconoscere un carattere qualunque che <strong>non<\/strong> sia nell'insieme, metti un segno meno subito dopo la parentesi aperta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui <code>&lt;-[a..z]&gt;<\/code> riconosce il primo carattere che non sia una lettera minuscola, cioè il punto esclamativo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi combinare più pezzi in un'unica classe.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio <code>&lt;[a..z A..Z 0..9]&gt;<\/code> riconosce una lettera o una cifra.<\/span> <span class=\"sg\" data-s=\"2\">Gli spazi lì sono solo per leggibilità: come ovunque in un regex, gli spazi dentro <code>&lt;[…]&gt;<\/code> vengono ignorati, quindi <code>&lt;[a..zA..Z0..9]&gt;<\/code> è esattamente la stessa classe.<\/span><\/p>"]]},"lv":{"t":"Rakstzīmju klases","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bieži vien gribat piemeklēt nevis vienu noteiktu rakstzīmi, bet jebkuru rakstzīmi no kādas kopas.<\/span> <span class=\"sg\" data-s=\"1\">Tādu kopu sauc par <em>rakstzīmju klasi<\/em>, un to raksta starp <code>&lt;[<\/code> un <code>]&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klase <code>&lt;[ae]&gt;<\/code> piemeklē vienu rakstzīmi, kas ir vai nu <code>a<\/code>, vai <code>e<\/code>, tāpēc sakrīt abas krāsas nosaukuma rakstības.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iekavās var uzskaitīt <em>diapazonu<\/em> ar diviem punktiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> piemeklē jebkuru vienu ciparu; pirmais cipars virknē ir <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai piemeklētu jebkuru rakstzīmi, kas <strong>nav<\/strong> kopā, tūlīt aiz atverošās iekavas lieciet mīnusa zīmi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>&lt;-[a..z]&gt;<\/code> piemeklē pirmo rakstzīmi, kas nav mazais burts, proti, izsaukuma zīmi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vienā klasē var apvienot vairākus gabalus.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, <code>&lt;[a..z A..Z 0..9]&gt;<\/code> piemeklē burtu vai ciparu.<\/span> <span class=\"sg\" data-s=\"2\">Atstarpes tur ir tikai lasāmības dēļ — tāpat kā visur regulārajā izteiksmē, arī <code>&lt;[…]&gt;<\/code> iekšienē atstarpes tiek ignorētas, tāpēc <code>&lt;[a..zA..Z0..9]&gt;<\/code> ir tieši tā pati klase.<\/span><\/p>"]]},"ru":{"t":"Классы символов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Часто нужно сопоставить не один определённый символ, а любой символ из некоторого набора.<\/span> <span class=\"sg\" data-s=\"1\">Такой набор называется <em>классом символов<\/em> и записывается между <code>&lt;[<\/code> и <code>]&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класс <code>&lt;[ae]&gt;<\/code> соответствует одному символу — либо <code>a<\/code>, либо <code>e<\/code>, — поэтому подходят оба написания слова.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Внутри скобок можно указать <em>диапазон<\/em> через две точки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> соответствует любой одной цифре; первая цифра в строке — <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы сопоставить любой символ, которого в наборе <strong>нет<\/strong>, поставьте знак минуса сразу после открывающей скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>&lt;-[a..z]&gt;<\/code> соответствует первому символу, не являющемуся строчной буквой, — это восклицательный знак.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В одном классе можно объединить несколько кусочков.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>&lt;[a..z A..Z 0..9]&gt;<\/code> соответствует букве или цифре.<\/span> <span class=\"sg\" data-s=\"2\">Пробелы там только для удобочитаемости: как и везде в регулярном выражении, пробелы внутри <code>&lt;[…]&gt;<\/code> игнорируются, поэтому <code>&lt;[a..zA..Z0..9]&gt;<\/code> — это ровно тот же класс.<\/span><\/p>"]]},"uk":{"t":"Класи символів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Часто вам потрібно зіставитися не з одним сталим символом, а з будь-яким символом із певного набору.<\/span> <span class=\"sg\" data-s=\"1\">Такий набір називають <em>класом символів<\/em> і записують між <code>&lt;[<\/code> та <code>]&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Клас <code>&lt;[ae]&gt;<\/code> збігається з одним символом, який є або <code>a<\/code>, або <code>e<\/code>, тож обидва написання кольору збігаються.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усередині дужок можна перелічити <em>діапазон<\/em> через дві крапки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> збігається з будь-якою однією цифрою; першою цифрою в рядку є <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб зіставитися з будь-яким символом, якого в наборі <strong>немає<\/strong>, поставте знак мінус одразу після відкривальної дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут <code>&lt;-[a..z]&gt;<\/code> збігається з першим символом, який не є малою літерою, тобто зі знаком оклику.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В одному класі можна поєднати кілька частин.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>&lt;[a..z A..Z 0..9]&gt;<\/code> збігається з літерою або цифрою.<\/span> <span class=\"sg\" data-s=\"2\">Пробіли там існують лише для читності — як і всюди в регексі, пробіли всередині <code>&lt;[…]&gt;<\/code> ігноруються, тож <code>&lt;[a..zA..Z0..9]&gt;<\/code> є точно тим самим класом.<\/span><\/p>"]]},"bg":{"t":"Класове от знаци","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Често не искате да съпоставите един фиксиран знак, а кой да е знак от някакво множество.<\/span> <span class=\"sg\" data-s=\"1\">Такова множество се нарича <em>клас от знаци<\/em> и се записва между <code>&lt;[<\/code> и <code>]&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'grey' ~~ / gr &lt;[ae]&gt; y /; # ｢grey｣\nsay 'gray' ~~ / gr &lt;[ae]&gt; y /; # ｢gray｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Класът <code>&lt;[ae]&gt;<\/code> съпоставя един знак, който е или <code>a<\/code>, или <code>e<\/code>, така че и двата изписа на цвета съвпадат.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вътре в скобите можете да изброите <em>диапазон<\/em> с две точки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a1b2' ~~ / &lt;[0..9]&gt; /; # ｢1｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;[0..9]&gt;<\/code> съпоставя коя да е една цифра; първата цифра в низа е <code>1<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да съпоставите знак, който <strong>не<\/strong> е в множеството, сложете знак минус веднага след отварящата скоба:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'stop!' ~~ / &lt;-[a..z]&gt; /; # ｢!｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук <code>&lt;-[a..z]&gt;<\/code> съпоставя първия знак, който не е малка буква, а това е удивителният знак.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да съчетаете няколко парчета в един клас.<\/span> <span class=\"sg\" data-s=\"1\">Например <code>&lt;[a..z A..Z 0..9]&gt;<\/code> съпоставя буква или цифра.<\/span> <span class=\"sg\" data-s=\"2\">Интервалите там са само за четимост — както навсякъде в регулярния израз, интервалите вътре в <code>&lt;[…]&gt;<\/code> се пренебрегват, така че <code>&lt;[a..zA..Z0..9]&gt;<\/code> е точно същият клас.<\/span><\/p>"]]}}}</script>
