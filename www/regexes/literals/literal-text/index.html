<script type="application/json" id="page-data">{"u":"regexes/literals/literal-text","n":970,"k":"topic","pv":"regexes/literals","nx":"regexes/literals/character-classes","tr":["regexes","regexes/literals"],"L":{"en":{"t":"Matching literal text","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The simplest pattern is a sequence of letters and digits.<\/span> <span class=\"sg\" data-s=\"1\">Such a pattern matches exactly those characters, in that order, anywhere in the string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The match does not have to start at the beginning of the string — the regex engine looks for the pattern at every position until it finds it.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A successful match produces a <code>Match<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">That <code>｢cat｣<\/code> in the first example is what such an object looks like when printed: <code>say<\/code> displays a <code>Match<\/code> as the text it matched, wrapped in the corner brackets <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">If the pattern is not present, the match fails instead: the smartmatch produces <code>Nil<\/code>, an undefined value that counts as false in a boolean test:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inside a regex, spaces are <strong>not<\/strong> significant by default — they are there only to make the pattern readable.<\/span> <span class=\"sg\" data-s=\"1\">So <code>/ ell /<\/code> matches exactly what <code>/ell/<\/code> would; the surrounding spaces are simply ignored:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because a space in the pattern is ignored, matching an <em>actual<\/em> space takes <strong>quotes<\/strong>: anything you put in quotes is matched literally.<\/span> <span class=\"sg\" data-s=\"1\">That same quoting is how you match a punctuation character that would otherwise have a special meaning in a regex:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(For whitespace you can also use the <code>\\s<\/code> class, which you will meet shortly.)<\/span><\/p>"]]},"de":{"t":"Wörtlichen Text treffen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das einfachste Muster ist eine Folge von Buchstaben und Ziffern.<\/span> <span class=\"sg\" data-s=\"1\">Ein solches Muster trifft genau diese Zeichen, in dieser Reihenfolge, irgendwo in der Zeichenkette:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Treffer muss nicht am Anfang der Zeichenkette beginnen — die Regex-Maschine sucht das Muster an jeder Position, bis sie es findet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein erfolgreicher Treffer erzeugt ein <code>Match<\/code>-Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Jenes <code>｢cat｣<\/code> im ersten Beispiel ist, wie ein solches Objekt bei der Ausgabe aussieht: <code>say<\/code> stellt einen <code>Match<\/code> als den getroffenen Text dar, umgeben von den Eckklammern <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ist das Muster nicht vorhanden, schlägt der Treffer stattdessen fehl: Der Smartmatch ergibt <code>Nil<\/code>, einen undefinierten Wert, der in einer Wahrheitsprüfung als falsch gilt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Innerhalb eines Regex sind Leerzeichen standardmäßig <strong>nicht<\/strong> bedeutsam — sie stehen nur dort, um das Muster lesbar zu machen.<\/span> <span class=\"sg\" data-s=\"1\"><code>/ ell /<\/code> trifft also genau das, was <code>/ell/<\/code> treffen würde; die umgebenden Leerzeichen werden schlicht übergangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Weil ein Leerzeichen im Muster übergangen wird, braucht es für ein <em>tatsächliches<\/em> Leerzeichen <strong>Anführungszeichen<\/strong>: Alles, was Sie in Anführungszeichen setzen, wird wörtlich getroffen.<\/span> <span class=\"sg\" data-s=\"1\">Dieselbe Anführung ist auch der Weg, ein Satzzeichen zu treffen, das in einem Regex sonst eine besondere Bedeutung hätte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Für Leerraum können Sie auch die Klasse <code>\\s<\/code> verwenden, die Ihnen gleich begegnet.)<\/span><\/p>"]]},"nl":{"t":"Letterlijke tekst matchen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het eenvoudigste patroon is een reeks letters en cijfers.<\/span> <span class=\"sg\" data-s=\"1\">Zo'n patroon matcht precies die tekens, in die volgorde, ergens in de string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De match hoeft niet aan het begin van de string te beginnen — de regex-engine zoekt het patroon op elke positie tot ze het vindt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een geslaagde match levert een <code>Match<\/code>-object op.<\/span> <span class=\"sg\" data-s=\"1\">Die <code>｢cat｣<\/code> in het eerste voorbeeld is hoe zo'n object eruitziet wanneer het afgedrukt wordt: <code>say<\/code> toont een <code>Match<\/code> als de tekst die hij matchte, omgeven door de hoekhaken <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Als het patroon niet aanwezig is, mislukt de match: de smartmatch levert <code>Nil<\/code> op, een ongedefinieerde waarde die in een booleaanse test als onwaar telt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binnen een regex zijn spaties standaard <strong>niet<\/strong> betekenisvol — ze staan er alleen om het patroon leesbaar te maken.<\/span> <span class=\"sg\" data-s=\"1\">Dus <code>/ ell /<\/code> matcht precies wat <code>/ell/<\/code> zou matchen; de omringende spaties worden eenvoudigweg genegeerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat een spatie in het patroon genegeerd wordt, heb je voor het matchen van een <em>echte<\/em> spatie <strong>aanhalingstekens<\/strong> nodig: alles wat je tussen aanhalingstekens zet wordt letterlijk gematcht.<\/span> <span class=\"sg\" data-s=\"1\">Datzelfde aanhalen is ook hoe je een leesteken matcht dat anders een bijzondere betekenis in een regex zou hebben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Voor witruimte kun je ook de klasse <code>\\s<\/code> gebruiken, die je zo tegenkomt.)<\/span><\/p>"]]},"es":{"t":"Emparejar texto literal","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El patrón más sencillo es una secuencia de letras y dígitos.<\/span> <span class=\"sg\" data-s=\"1\">Un patrón así empareja exactamente esos caracteres, en ese orden, en cualquier punto de la cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La coincidencia no tiene por qué empezar al principio de la cadena: el motor de regex busca el patrón en cada posición hasta encontrarlo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una coincidencia lograda produce un objeto <code>Match<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ese <code>｢cat｣<\/code> del primer ejemplo es el aspecto que tiene un objeto así al imprimirse: <code>say<\/code> muestra un <code>Match<\/code> como el texto que emparejó, envuelto en las esquinas <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si el patrón no está presente, la coincidencia falla: el emparejamiento inteligente produce <code>Nil<\/code>, un valor no definido que cuenta como falso en una prueba booleana:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro de un regex, los espacios <strong>no<\/strong> son significativos por omisión: están ahí solo para hacer legible el patrón.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>/ ell /<\/code> empareja exactamente lo mismo que <code>/ell/<\/code>; los espacios de alrededor simplemente se ignoran:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como un espacio del patrón se ignora, emparejar un espacio <em>de verdad<\/em> requiere <strong>comillas<\/strong>: todo lo que pongas entre comillas se empareja literalmente.<\/span> <span class=\"sg\" data-s=\"1\">Esas mismas comillas son también la forma de emparejar un signo de puntuación que de otro modo tendría un significado especial en un regex:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Para los espacios en blanco también puedes usar la clase <code>\\s<\/code>, que conocerás enseguida.)<\/span><\/p>"]]},"it":{"t":"Riconoscere testo letterale","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo schema più semplice è una sequenza di lettere e cifre.<\/span> <span class=\"sg\" data-s=\"1\">Uno schema simile riconosce esattamente quei caratteri, in quell'ordine, in qualunque punto della stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La corrispondenza non deve per forza cominciare all'inizio della stringa: il motore dei regex cerca lo schema in ogni posizione finché non lo trova.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una corrispondenza riuscita produce un oggetto <code>Match<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quel <code>｢cat｣<\/code> del primo esempio è l'aspetto che un oggetto simile ha quando viene stampato: <code>say<\/code> mostra un <code>Match<\/code> come il testo che ha riconosciuto, avvolto nelle parentesi angolari <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Se lo schema non è presente, la corrispondenza fallisce: lo smartmatch produce <code>Nil<\/code>, un valore non definito che vale come falso in una prova booleana:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro un regex gli spazi <strong>non<\/strong> sono significativi per impostazione predefinita: sono lì solo per rendere leggibile lo schema.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>/ ell /<\/code> riconosce esattamente ciò che riconoscerebbe <code>/ell/<\/code>; gli spazi attorno vengono semplicemente ignorati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché uno spazio nello schema viene ignorato, riconoscere uno spazio <em>vero<\/em> richiede le <strong>virgolette<\/strong>: tutto ciò che metti fra virgolette viene riconosciuto alla lettera.<\/span> <span class=\"sg\" data-s=\"1\">Quelle stesse virgolette servono anche a riconoscere un segno di punteggiatura che altrimenti avrebbe un significato speciale in un regex:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Per gli spazi bianchi puoi anche usare la classe <code>\\s<\/code>, che incontrerai fra poco.)<\/span><\/p>"]]},"lv":{"t":"Burtiska teksta saskaņošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākais raksturs ir burtu un ciparu virkne.<\/span> <span class=\"sg\" data-s=\"1\">Tāds raksturs piemeklē tieši šīs rakstzīmes šādā secībā jebkurā virknes vietā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sakritībai nav jāsākas virknes sākumā — regulāro izteiksmju dzinējs meklē raksturu katrā pozīcijā, līdz to atrod.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Veiksmīga sakritība rada objektu <code>Match<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šis <code>｢cat｣<\/code> pirmajā piemērā ir tas, kā šāds objekts izskatās izdrukāts: <code>say<\/code> parāda <code>Match<\/code> kā tekstu, ko tas sakritināja, ietītu stūra iekavās <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ja raksturs nav atrodams, sakritība neizdodas: gudrā sakritība dod <code>Nil<\/code> — nedefinētu vērtību, kas Būla pārbaudē skaitās aplama:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Regulārās izteiksmes iekšienē atstarpes pēc noklusējuma <strong>nav<\/strong> nozīmīgas — tās ir tur tikai tāpēc, lai raksturs būtu lasāms.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc <code>/ ell /<\/code> piemeklē tieši to pašu, ko <code>/ell/<\/code>; apkārtējās atstarpes vienkārši tiek ignorētas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā atstarpe raksturā tiek ignorēta, <em>īstas<\/em> atstarpes piemeklēšanai vajadzīgas <strong>pēdiņas<\/strong>: viss, ko liekat pēdiņās, tiek piemeklēts burtiski.<\/span> <span class=\"sg\" data-s=\"1\">Tā pati pēdiņu likšana ir arī veids, kā piemeklēt pieturzīmi, kurai regulārajā izteiksmē citādi būtu īpaša nozīme:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Atstarpēm var izmantot arī klasi <code>\\s<\/code>, ar kuru drīz iepazīsieties.)<\/span><\/p>"]]},"ru":{"t":"Сопоставление литерального текста","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Простейший шаблон — это последовательность букв и цифр.<\/span> <span class=\"sg\" data-s=\"1\">Такой шаблон соответствует именно этим символам, идущим в этом порядке, в любом месте строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Совпадение не обязано начинаться с начала строки — движок регулярных выражений ищет шаблон в каждой позиции, пока не найдёт.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Успешное сопоставление порождает объект <code>Match<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То самое <code>｢cat｣<\/code> из первого примера — это и есть вид такого объекта при печати: <code>say<\/code> показывает <code>Match<\/code> как совпавший текст, заключённый в угловые кавычки <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Если шаблона в строке нет, сопоставление не удаётся: умное сопоставление даёт <code>Nil<\/code> — неопределённое значение, которое в логической проверке считается ложным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутри регулярного выражения пробелы по умолчанию <strong>не<\/strong> значимы — они нужны лишь для удобочитаемости шаблона.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>/ ell /<\/code> соответствует ровно тому же, что и <code>/ell/<\/code>; окружающие пробелы просто игнорируются:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">А раз пробел в шаблоне игнорируется, для сопоставления <em>настоящего<\/em> пробела нужны <strong>кавычки<\/strong>: всё, что вы поместите в кавычки, сопоставляется буквально.<\/span> <span class=\"sg\" data-s=\"1\">Так же поступают и со знаком препинания, который иначе имел бы в регулярном выражении особое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Для пробельных символов можно также использовать класс <code>\\s<\/code>, с которым вы вскоре встретитесь.)<\/span><\/p>"]]},"uk":{"t":"Зіставлення з літеральним текстом","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Найпростіший шаблон — це послідовність літер і цифр.<\/span> <span class=\"sg\" data-s=\"1\">Такий шаблон збігається саме з цими символами, в такому порядку, будь-де в рядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Збіг не мусить починатися з початку рядка — механізм регексів шукає шаблон на кожній позиції, доки не знайде його.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Успішний збіг дає об'єкт <code>Match<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оте <code>｢cat｣<\/code> у першому прикладі — це те, як такий об'єкт виглядає, коли його виводять: <code>say<\/code> показує <code>Match<\/code> як текст, з яким той збігся, узятий у кутові дужки <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Якщо шаблону немає, збіг натомість зазнає невдачі: розумне зіставлення дає <code>Nil<\/code> — невизначене значення, яке в булевій перевірці рахується як хибне:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усередині регекса пробіли за замовчуванням <strong>не<\/strong> значущі — вони існують лише для того, щоб зробити шаблон читнішим.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>/ ell /<\/code> збігається точно з тим, з чим збігся б <code>/ell/<\/code>; навколишні пробіли просто ігноруються:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки пробіл у шаблоні ігнорується, зіставлення зі <em>справжнім<\/em> пробілом потребує <strong>лапок<\/strong>: усе, що ви берете в лапки, зіставляється буквально.<\/span> <span class=\"sg\" data-s=\"1\">Те саме взяття в лапки є способом зіставитися з розділовим знаком, який інакше мав би в регексі особливе значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Для пробільних символів можна також скористатися класом <code>\\s<\/code>, з яким ви незабаром познайомитеся.)<\/span><\/p>"]]},"bg":{"t":"Съпоставяне на буквален текст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Най-простият шаблон е поредица от букви и цифри.<\/span> <span class=\"sg\" data-s=\"1\">Такъв шаблон съпоставя точно тези знаци, в този ред, където и да е в низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣\nsay 'Hello'       ~~ /ell/; # ｢ell｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съвпадението не е длъжно да започва в началото на низа — машината за регулярни изрази търси шаблона на всяка позиция, докато го намери.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Успешното съпоставяне произвежда обект <code>Match<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Онова <code>｢cat｣<\/code> в първия пример е как изглежда такъв обект при отпечатване: <code>say<\/code> показва <code>Match<\/code> като текста, който е съвпаднал, обвит в ъгловите скоби <code>｢ ｣<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ако шаблонът го няма, съпоставянето се проваля: интелигентното съпоставяне произвежда <code>Nil<\/code> — недефинирана стойност, която в булева проверка минава за лъжа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ('the cat sat' ~~ /dog/);       # Nil\nsay ('the cat sat' ~~ /dog/).Bool;  # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътре в регулярния израз интервалите по подразбиране <strong>не<\/strong> са значещи — те са там само за да направят шаблона четим.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>/ ell /<\/code> съпоставя точно каквото би съпоставил <code>/ell/<\/code>; заобикалящите интервали просто се пренебрегват:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ / ell /; # ｢ell｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже интервалът в шаблона се пренебрегва, съпоставянето на <em>действителен<\/em> интервал изисква <strong>кавички<\/strong>: всичко, което сложите в кавички, се съпоставя буквално.<\/span> <span class=\"sg\" data-s=\"1\">Същото ограждане в кавички е и начинът да съпоставите пунктуационен знак, който иначе би имал специално значение в регулярния израз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a b'       ~~ / 'a b' /; # ｢a b｣\nsay 'price: $5' ~~ / '$' /;   # ｢$｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(За празни знаци можете да използвате и класа <code>\\s<\/code>, с който ще се запознаете скоро.)<\/span><\/p>"]]}}}</script>
