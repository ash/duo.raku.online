<script type="application/json" id="page-data">{"u":"regexes/creating-grammars/top-rule","n":1104,"k":"topic","pv":"regexes/creating-grammars","nx":"regexes/creating-grammars/parse-method","tr":["regexes","regexes/creating-grammars"],"L":{"en":{"t":"The TOP rule","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When you parse a string with a grammar, Raku starts from a token named <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is the entry point — the description of the <strong>whole<\/strong> input.<\/span> <span class=\"sg\" data-s=\"2\">Everything else in the grammar exists to support it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>TOP<\/code> token usually refers to other tokens by name, breaking the problem into smaller parts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Read <code>TOP<\/code> aloud: “a key, then an equals sign, then a value”.<\/span> <span class=\"sg\" data-s=\"1\">The <code>key<\/code> and <code>value<\/code> tokens say what each of those parts looks like.<\/span> <span class=\"sg\" data-s=\"2\">This division is the whole point of a grammar — each token has one small, clearly named job, and <code>TOP<\/code> assembles them.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> is only a convention enforced by <code>.parse<\/code>; the other tokens can be named however you like.<\/span> <span class=\"sg\" data-s=\"1\">The names you choose also become the named captures in the result, so a well-named grammar produces a self-describing match tree, as you will see shortly.<\/span><\/p>"]]},"de":{"t":"Die TOP-Regel","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie eine Zeichenkette mit einer Grammatik zerlegen, beginnt Raku bei einem Token namens <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es ist der Einstiegspunkt — die Beschreibung der <strong>gesamten<\/strong> Eingabe.<\/span> <span class=\"sg\" data-s=\"2\">Alles andere in der Grammatik dient dazu, es zu stützen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>TOP<\/code>-Token ruft üblicherweise andere Tokens namentlich auf und zerlegt das Problem so in kleinere Teile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie <code>TOP<\/code> laut: „ein Schlüssel, dann ein Gleichheitszeichen, dann ein Wert“.<\/span> <span class=\"sg\" data-s=\"1\">Die Tokens <code>key<\/code> und <code>value<\/code> sagen, wie jeder dieser Teile aussieht.<\/span> <span class=\"sg\" data-s=\"2\">Diese Aufteilung ist der ganze Sinn einer Grammatik — jedes Token hat eine kleine, klar benannte Aufgabe, und <code>TOP<\/code> setzt sie zusammen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> ist lediglich eine Übereinkunft, die <code>.parse<\/code> durchsetzt; die übrigen Tokens dürfen heißen, wie Sie möchten.<\/span> <span class=\"sg\" data-s=\"1\">Die von Ihnen gewählten Namen werden zugleich zu den benannten Captures im Ergebnis, eine gut benannte Grammatik erzeugt also einen sich selbst erklärenden Match-Baum, wie Sie gleich sehen werden.<\/span><\/p>"]]},"nl":{"t":"De TOP-regel","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een string met een grammatica ontleedt, begint Raku bij een token met de naam <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het startpunt — de beschrijving van de <strong>hele<\/strong> invoer.<\/span> <span class=\"sg\" data-s=\"2\">Al het andere in de grammatica bestaat om dat te ondersteunen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>TOP<\/code>-token verwijst gewoonlijk op naam naar andere tokens en breekt het probleem zo in kleinere delen op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lees <code>TOP<\/code> hardop: \"een sleutel, dan een isgelijkteken, dan een waarde\".<\/span> <span class=\"sg\" data-s=\"1\">De tokens <code>key<\/code> en <code>value<\/code> zeggen hoe elk van die delen eruitziet.<\/span> <span class=\"sg\" data-s=\"2\">Deze verdeling is de hele bedoeling van een grammatica — elk token heeft één kleine, duidelijk benoemde taak, en <code>TOP<\/code> zet ze in elkaar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> is slechts een conventie die door <code>.parse<\/code> afgedwongen wordt; de andere tokens mag je noemen zoals je wilt.<\/span> <span class=\"sg\" data-s=\"1\">De namen die je kiest worden ook de benoemde captures in het resultaat, dus een goed benoemde grammatica levert een zelfbeschrijvende matchboom op, zoals je zo zult zien.<\/span><\/p>"]]},"es":{"t":"La regla TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando analizas una cadena con una gramática, Raku empieza por un token llamado <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es el punto de entrada: la descripción de la entrada <strong>entera<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Todo lo demás en la gramática existe para sostenerlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un token <code>TOP<\/code> suele referirse a otros tokens por su nombre, dividiendo el problema en partes más pequeñas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lee <code>TOP<\/code> en voz alta: «una clave, después un signo igual, después un valor».<\/span> <span class=\"sg\" data-s=\"1\">Los tokens <code>key<\/code> y <code>value<\/code> dicen qué aspecto tiene cada una de esas partes.<\/span> <span class=\"sg\" data-s=\"2\">Esta división es todo el sentido de una gramática: cada token tiene un cometido pequeño y claramente nombrado, y <code>TOP<\/code> los ensambla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> es solo una convención que impone <code>.parse<\/code>; a los demás tokens puedes ponerles el nombre que quieras.<\/span> <span class=\"sg\" data-s=\"1\">Los nombres que elijas se convierten además en las capturas con nombre del resultado, así que una gramática bien nombrada produce un árbol de coincidencias que se describe a sí mismo, como verás enseguida.<\/span><\/p>"]]},"it":{"t":"La regola TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando analizzi una stringa con una grammatica, Raku parte da un token chiamato <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È il punto di ingresso — la descrizione dell'<strong>intero<\/strong> input.<\/span> <span class=\"sg\" data-s=\"2\">Tutto il resto nella grammatica esiste per sostenerlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un token <code>TOP<\/code> di solito si riferisce ad altri token per nome, spezzando il problema in parti più piccole:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Leggi <code>TOP<\/code> ad alta voce: «una chiave, poi un segno di uguale, poi un valore».<\/span> <span class=\"sg\" data-s=\"1\">I token <code>key<\/code> e <code>value<\/code> dicono che aspetto ha ciascuna di quelle parti.<\/span> <span class=\"sg\" data-s=\"2\">Questa divisione è tutto il senso di una grammatica: ogni token ha un compito piccolo e chiaramente nominato, e <code>TOP<\/code> li assembla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> è solo una convenzione imposta da <code>.parse<\/code>; gli altri token puoi nominarli come vuoi.<\/span> <span class=\"sg\" data-s=\"1\">I nomi che scegli diventano anche le catture con nome nel risultato, quindi una grammatica ben nominata produce un albero di corrispondenze che si descrive da sé, come vedrai fra poco.<\/span><\/p>"]]},"lv":{"t":"Likums TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad virkni parsējat ar gramatiku, Raku sāk no marķiera ar nosaukumu <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir ieejas punkts — <strong>visas<\/strong> ievades apraksts.<\/span> <span class=\"sg\" data-s=\"2\">Viss pārējais gramatikā eksistē, lai to atbalstītu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Marķieris <code>TOP<\/code> parasti atsaucas uz citiem marķieriem pēc nosaukuma, sadalot uzdevumu mazākās daļās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nolasiet <code>TOP<\/code> skaļi: «atslēga, tad vienādības zīme, tad vērtība».<\/span> <span class=\"sg\" data-s=\"1\">Marķieri <code>key<\/code> un <code>value<\/code> pasaka, kā katra no šīm daļām izskatās.<\/span> <span class=\"sg\" data-s=\"2\">Šis sadalījums ir visa gramatikas jēga — katram marķierim ir viens mazs, skaidri nosaukts uzdevums, un <code>TOP<\/code> tos saliek kopā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> ir tikai vienošanās, ko ievēro <code>.parse<\/code>; pārējos marķierus varat nosaukt, kā vēlaties.<\/span> <span class=\"sg\" data-s=\"1\">Izvēlētie nosaukumi kļūst arī par nosauktajiem tvērumiem rezultātā, tāpēc labi nosaukta gramatika rada sevi aprakstošu sakritību koku, kā drīz redzēsiet.<\/span><\/p>"]]},"ru":{"t":"Правило TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда вы разбираете строку грамматикой, Raku начинает с токена по имени <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это точка входа — описание <strong>всего<\/strong> ввода.<\/span> <span class=\"sg\" data-s=\"2\">Всё остальное в грамматике существует ради него.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Токен <code>TOP<\/code> обычно ссылается на другие токены по имени, разбивая задачу на меньшие части:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прочитайте <code>TOP<\/code> вслух: «ключ, затем знак равенства, затем значение».<\/span> <span class=\"sg\" data-s=\"1\">Токены <code>key<\/code> и <code>value<\/code> говорят, как выглядит каждая из этих частей.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделении и весь смысл грамматики: у каждого токена одна небольшая, ясно названная работа, а <code>TOP<\/code> собирает их вместе.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> — всего лишь соглашение, которого придерживается <code>.parse<\/code>; остальные токены можно называть как угодно.<\/span> <span class=\"sg\" data-s=\"1\">Выбранные вами имена становятся ещё и именованными захватами в результате, поэтому хорошо названная грамматика даёт самоописывающее дерево совпадений — как вы вскоре увидите.<\/span><\/p>"]]},"uk":{"t":"Правило TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли ви розбираєте рядок граматикою, Raku починає з токена з іменем <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це точка входу — опис <strong>усього<\/strong> вхідного тексту.<\/span> <span class=\"sg\" data-s=\"2\">Усе інше в граматиці існує, щоб його підтримати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Токен <code>TOP<\/code> зазвичай посилається на інші токени за іменем, розбиваючи задачу на дрібніші частини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прочитайте <code>TOP<\/code> уголос: «ключ, потім знак рівності, потім значення».<\/span> <span class=\"sg\" data-s=\"1\">Токени <code>key<\/code> та <code>value<\/code> кажуть, який вигляд має кожна з цих частин.<\/span> <span class=\"sg\" data-s=\"2\">Цей поділ і є всім сенсом граматики — кожен токен має одну невелику, чітко названу роботу, а <code>TOP<\/code> збирає їх докупи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> — лише домовленість, яку забезпечує <code>.parse<\/code>; інші токени можна називати як завгодно.<\/span> <span class=\"sg\" data-s=\"1\">Вибрані вами імена стають також іменованими захопленнями в результаті, тож граматика з гарними іменами дає самоописове дерево збігів, як ви незабаром побачите.<\/span><\/p>"]]},"bg":{"t":"Правилото TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато разбирате низ с граматика, Raku започва от токен на име <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той е входната точка — описанието на <strong>целия<\/strong> вход.<\/span> <span class=\"sg\" data-s=\"2\">Всичко останало в граматиката съществува, за да го подпомага.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Токенът <code>TOP<\/code> обикновено се позовава на други токени по име, разбивайки задачата на по-малки части:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прочетете <code>TOP<\/code> на глас: „ключ, после знак за равенство, после стойност“.<\/span> <span class=\"sg\" data-s=\"1\">Токените <code>key<\/code> и <code>value<\/code> казват как изглежда всяка от тези части.<\/span> <span class=\"sg\" data-s=\"2\">Точно това разделяне е целият смисъл на граматиката — всеки токен има една малка, ясно именувана задача, а <code>TOP<\/code> ги сглобява.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> е само споразумение, налагано от <code>.parse<\/code>; другите токени могат да се наричат както пожелаете.<\/span> <span class=\"sg\" data-s=\"1\">Имената, които изберете, стават и именуваните прихващания в резултата, така че граматика с добри имена дава самоописващо се дърво на съвпаденията, както ще видите скоро.<\/span><\/p>"]]},"eo":{"t":"La regulo TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam vi analizas ĉenon per gramatiko, Raku komencas de ĵetono nomata <code>TOP<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la enirpunkto — la priskribo de la <strong>tuta<\/strong> enigo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉio alia en la gramatiko ekzistas por subteni ĝin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĵetono <code>TOP<\/code> kutime referencas aliajn ĵetonojn laŭ nomo, dividante la problemon en pli malgrandajn partojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Legu <code>TOP<\/code> laŭtvoĉe: «ŝlosilo, poste egalsigno, poste valoro».<\/span> <span class=\"sg\" data-s=\"1\">La ĵetonoj <code>key<\/code> kaj <code>value<\/code> diras, kiel ĉiu el tiuj partoj aspektas.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu divido estas la tuta celo de gramatiko — ĉiu ĵetono havas unu malgrandan, klare nomitan laboron, kaj <code>TOP<\/code> kunmetas ilin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> estas nur konvencio devigata de <code>.parse<\/code>; la aliaj ĵetonoj povas esti nomitaj kiel ajn vi volas.<\/span> <span class=\"sg\" data-s=\"1\">La nomoj, kiujn vi elektas, ankaŭ fariĝas la nomitaj kaptoj en la rezulto, do bone nomita gramatiko produktas mem-priskriban kongruarbon, kiel vi vidos baldaŭ.<\/span><\/p>"]]},"la":{"t":"Regula TOP","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum catenam grammatica analysas, Raku a tessera nomine <code>TOP<\/code> incipit.<\/span> <span class=\"sg\" data-s=\"1\">Ea est ianua — descriptio <strong>totius<\/strong> introitus.<\/span> <span class=\"sg\" data-s=\"2\">Cetera omnia in grammatica exsistunt ut ei serviant.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tessera <code>TOP<\/code> plerumque ad alias tesseras nomine spectat, problema in minores partes frangens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lege <code>TOP<\/code> clara voce: «clavis, deinde signum aequalitatis, deinde valor».<\/span> <span class=\"sg\" data-s=\"1\">Tesserae <code>key<\/code> et <code>value<\/code> dicunt qualis unaquaeque illarum partium sit.<\/span> <span class=\"sg\" data-s=\"2\">Haec divisio est ipsa ratio grammaticae — unaquaeque tessera unum parvum, clare nominatum munus habet, et <code>TOP<\/code> eas componit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> sola consuetudo est a <code>.parse<\/code> firmata; ceterae tesserae quomodocumque vis nominari possunt.<\/span> <span class=\"sg\" data-s=\"1\">Nomina quae eligis etiam capturae nominatae in effectu fiunt, itaque grammatica bene nominata arborem congruentiae se ipsam describentem producit, ut mox videbis.<\/span><\/p>"]]}}}</script>
