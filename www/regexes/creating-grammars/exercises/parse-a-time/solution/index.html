<script type="application/json" id="page-data">{"u":"regexes/creating-grammars/exercises/parse-a-time/solution","n":1113,"k":"solution","pv":"regexes/creating-grammars/exercises/parse-a-time","nx":"regexes/tokens-and-rules","tr":["regexes","regexes/creating-grammars"],"L":{"en":{"t":"The solution of ’Parse a time‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> describes the whole time as three tokens separated by colons. Each part is <code>\\d ** 2<\/code> — exactly two digits — rather than an open-ended <code>\\d+<\/code>, so a malformed value like <code>09:30:456<\/code> is rejected. (If a part may be unpadded, such as the hour in <code>9:30:45<\/code>, write <code>\\d ** 1..2<\/code> to allow one or two digits.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">After parsing, each token is a named capture, so the second is read as <code>&lt;second&gt;<\/code> on the match. Adding a third part is just one more token and one more colon — the grammar scales naturally.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zerlegen Sie eine Uhrzeit","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> beschreibt die ganze Uhrzeit als drei durch Doppelpunkte getrennte Tokens. Jeder Teil ist <code>\\d ** 2<\/code> — genau zwei Ziffern — statt eines offenen <code>\\d+<\/code>, sodass ein fehlerhafter Wert wie <code>09:30:456<\/code> abgelehnt wird. (Darf ein Teil ohne führende Null stehen, etwa die Stunde in <code>9:30:45<\/code>, schreiben Sie <code>\\d ** 1..2<\/code>, um eine oder zwei Ziffern zuzulassen.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nach dem Zerlegen ist jedes Token ein benanntes Capture, die Sekunde wird also als <code>&lt;second&gt;<\/code> vom Treffer gelesen. Einen dritten Teil hinzuzufügen heißt nur, ein Token und einen Doppelpunkt mehr zu schreiben — die Grammatik wächst von selbst mit.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Ontleed een tijd","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> beschrijft de hele tijd als drie tokens gescheiden door dubbele punten. Elk deel is <code>\\d ** 2<\/code> — precies twee cijfers — in plaats van een open <code>\\d+<\/code>, zodat een misvormde waarde als <code>09:30:456<\/code> afgewezen wordt. (Als een deel niet opgevuld kan zijn, zoals het uur in <code>9:30:45<\/code>, schrijf dan <code>\\d ** 1..2<\/code> om een of twee cijfers toe te staan.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Na het ontleden is elk token een benoemde capture, dus wordt de seconde als <code>&lt;second&gt;<\/code> van de match gelezen. Een derde deel toevoegen is slechts één token en één dubbele punt extra — de grammatica schaalt vanzelf mee.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Analice una hora","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> describe la hora entera como tres tokens separados por dos puntos. Cada parte es <code>\\d ** 2<\/code> — exactamente dos dígitos — en lugar de un <code>\\d+<\/code> sin límite, así que un valor mal formado como <code>09:30:456<\/code> se rechaza. (Si una parte puede ir sin rellenar con ceros, como la hora en <code>9:30:45<\/code>, escribe <code>\\d ** 1..2<\/code> para admitir uno o dos dígitos.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tras el análisis, cada token es una captura con nombre, así que el segundo se lee como <code>&lt;second&gt;<\/code> sobre la coincidencia. Añadir una tercera parte es solo un token más y otros dos puntos: la gramática escala con naturalidad.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Analizzate un orario","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> descrive tutto l'orario come tre token separati da due punti. Ogni parte è <code>\\d ** 2<\/code> — esattamente due cifre — invece di un <code>\\d+<\/code> senza limite, così un valore malformato come <code>09:30:456<\/code> viene rifiutato. (Se una parte può non essere riempita di zeri, come l'ora in <code>9:30:45<\/code>, scrivi <code>\\d ** 1..2<\/code> per ammettere una o due cifre.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dopo l'analisi ogni token è una cattura con nome, quindi i secondi si leggono come <code>&lt;second&gt;<\/code> sulla corrispondenza. Aggiungere una terza parte è solo un token in più e un altro segno di due punti — la grammatica scala con naturalezza.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Разберите время","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> описывает время целиком как три токена, разделённых двоеточиями. Каждая часть — это <code>\\d ** 2<\/code>, ровно две цифры, а не открытое <code>\\d+<\/code>, поэтому неверное значение вроде <code>09:30:456<\/code> отвергается. (Если часть может быть без ведущего нуля, как час в <code>9:30:45<\/code>, напишите <code>\\d ** 1..2<\/code>, разрешив одну или две цифры.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">После разбора каждый токен становится именованным захватом, поэтому секунды читают у совпадения как <code>&lt;second&gt;<\/code>. Добавить третью часть — это всего один лишний токен и одно лишнее двоеточие: грамматика естественно масштабируется.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Розбір часу»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> описує весь час як три токени, розділені двокрапками. Кожна частина — це <code>\\d ** 2<\/code>, тобто рівно дві цифри, а не необмежений <code>\\d+<\/code>, тож хибно сформоване значення на кшталт <code>09:30:456<\/code> відхиляється. (Якщо частина може бути без ведучого нуля, як година в <code>9:30:45<\/code>, напишіть <code>\\d ** 1..2<\/code>, щоб дозволити одну або дві цифри.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Після розбору кожен токен є іменованим захопленням, тож секунди читають як <code>&lt;second&gt;<\/code> на збігу. Додати третю частину — це лише ще один токен і ще одна двокрапка: граматика природно масштабується.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Разбор на час","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Time {\n    token TOP    { &lt;hour&gt; ':' &lt;minute&gt; ':' &lt;second&gt; }\n    token hour   { \\d ** 2 }\n    token minute { \\d ** 2 }\n    token second { \\d ** 2 }\n}\n\nsay Time.parse('09:30:45')&lt;second&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/creating-grammars/parse-a-time.raku\" target=\"_blank\" rel=\"noopener\">parse-a-time.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>｢45｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> описва целия час като три токена, разделени с двоеточия. Всяка част е <code>\\d ** 2<\/code> — точно две цифри, — а не отворено <code>\\d+<\/code>, така че неправилно оформена стойност като <code>09:30:456<\/code> се отхвърля. (Ако някоя част може да е без водеща нула, като часа в <code>9:30:45<\/code>, напишете <code>\\d ** 1..2<\/code>, за да позволите една или две цифри.)<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След разбора всеки токен е именувано прихващане, така че секундите се четат като <code>&lt;second&gt;<\/code> върху съвпадението. Добавянето на трета част е само още един токен и още едно двоеточие — граматиката се мащабира естествено.<\/span><\/li><\/ol>"]]}}}</script>
