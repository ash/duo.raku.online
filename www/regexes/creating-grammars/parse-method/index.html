<script type="application/json" id="page-data">{"u":"regexes/creating-grammars/parse-method","n":1105,"k":"topic","pv":"regexes/creating-grammars/top-rule","nx":"regexes/creating-grammars/parse-method/quiz","tr":["regexes","regexes/creating-grammars"],"L":{"en":{"t":"Parsing with parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">To run a grammar, call its <code>.parse<\/code> method with the string to analyse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> returns a match object when the grammar matches the <strong>entire<\/strong> string, and <code>Nil<\/code> when it does not.<\/span> <span class=\"sg\" data-s=\"1\">Because the whole input must match, there is no need for <code>^<\/code> and <code>$<\/code> anchors — <code>.parse<\/code> adds that requirement for you:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <a href=\"/regexes/matching/match-object/\">match object<\/a> works just like the ones you met earlier.<\/span> <span class=\"sg\" data-s=\"1\">Each token used in the grammar becomes a named capture, so <code>$m&lt;key&gt;<\/code> and <code>$m&lt;value&gt;<\/code> give the matched parts.<\/span> <span class=\"sg\" data-s=\"2\">The tokens nest, so a grammar builds a small tree of matches — the subject of a later section.<\/span><\/p>"]]},"de":{"t":"Zerlegen mit parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Um eine Grammatik auszuführen, rufen Sie ihre Methode <code>.parse<\/code> mit der zu untersuchenden Zeichenkette auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> liefert ein Match-Objekt, wenn die Grammatik die <strong>gesamte<\/strong> Zeichenkette trifft, und <code>Nil<\/code>, wenn nicht.<\/span> <span class=\"sg\" data-s=\"1\">Weil die ganze Eingabe treffen muss, sind die Anker <code>^<\/code> und <code>$<\/code> nicht nötig — <code>.parse<\/code> fügt diese Bedingung für Sie hinzu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <a href=\"https://course.raku.org/de/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">Match-Objekt<\/a> funktioniert genau wie jene, die Ihnen früher begegnet sind.<\/span> <span class=\"sg\" data-s=\"1\">Jedes in der Grammatik verwendete Token wird zu einem benannten Capture, <code>$m&lt;key&gt;<\/code> und <code>$m&lt;value&gt;<\/code> liefern also die getroffenen Teile.<\/span> <span class=\"sg\" data-s=\"2\">Die Tokens verschachteln sich, eine Grammatik baut also einen kleinen Baum aus Treffern — das Thema eines späteren Abschnitts.<\/span><\/p>"]]},"nl":{"t":"Ontleden met parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een grammatica te draaien, roep je haar methode <code>.parse<\/code> aan met de te analyseren string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> geeft een matchobject terug wanneer de grammatica de <strong>hele<\/strong> string matcht, en <code>Nil<\/code> wanneer dat niet zo is.<\/span> <span class=\"sg\" data-s=\"1\">Omdat de hele invoer moet matchen, zijn de ankers <code>^<\/code> en <code>$<\/code> niet nodig — <code>.parse<\/code> voegt die eis voor je toe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het <a href=\"https://course.raku.org/nl/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">matchobject<\/a> werkt precies als degene die je eerder tegenkwam.<\/span> <span class=\"sg\" data-s=\"1\">Elk token dat in de grammatica gebruikt wordt, wordt een benoemde capture, dus <code>$m&lt;key&gt;<\/code> en <code>$m&lt;value&gt;<\/code> geven de gematchte delen.<\/span> <span class=\"sg\" data-s=\"2\">De tokens nestelen, dus een grammatica bouwt een kleine boom van matches — het onderwerp van een latere sectie.<\/span><\/p>"]]},"es":{"t":"Analizar con parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Para aplicar una gramática, llama a su método <code>.parse<\/code> con la cadena que quieres analizar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> devuelve un objeto de coincidencia cuando la gramática empareja la cadena <strong>entera<\/strong>, y <code>Nil<\/code> cuando no. Como toda la entrada debe coincidir, no hacen falta las anclas <code>^<\/code> y <code>$<\/code>: <code>.parse<\/code> añade ese requisito por ti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El <a href=\"https://course.raku.org/es/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">objeto de coincidencia<\/a> funciona igual que los que conociste antes.<\/span> <span class=\"sg\" data-s=\"1\">Cada token usado en la gramática se convierte en una captura con nombre, así que <code>$m&lt;key&gt;<\/code> y <code>$m&lt;value&gt;<\/code> dan las partes coincidentes.<\/span> <span class=\"sg\" data-s=\"2\">Los tokens se anidan, de modo que una gramática construye un pequeño árbol de coincidencias, el tema de una sección posterior.<\/span><\/p>"]]},"it":{"t":"Analizzare con parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Per far girare una grammatica, chiama il suo metodo <code>.parse<\/code> con la stringa da analizzare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> restituisce un oggetto match quando la grammatica riconosce l'<strong>intera<\/strong> stringa, e <code>Nil<\/code> quando non lo fa.<\/span> <span class=\"sg\" data-s=\"1\">Poiché tutto l'input deve corrispondere, non servono le ancore <code>^<\/code> e <code>$<\/code>: <code>.parse<\/code> aggiunge quel requisito al posto tuo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'<a href=\"https://course.raku.org/it/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">oggetto match<\/a> funziona proprio come quelli che hai incontrato prima.<\/span> <span class=\"sg\" data-s=\"1\">Ogni token usato nella grammatica diventa una cattura con nome, quindi <code>$m&lt;key&gt;<\/code> e <code>$m&lt;value&gt;<\/code> danno le parti riconosciute.<\/span> <span class=\"sg\" data-s=\"2\">I token si annidano, quindi una grammatica costruisce un piccolo albero di corrispondenze — l'argomento di una sezione successiva.<\/span><\/p>"]]},"ru":{"t":"Разбор с помощью parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы применить грамматику, вызовите её метод <code>.parse<\/code>, передав строку для анализа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> возвращает объект совпадения, когда грамматика сопоставляется со <strong>всей<\/strong> строкой, и <code>Nil<\/code>, когда нет.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку весь ввод обязан совпасть, якоря <code>^<\/code> и <code>$<\/code> не нужны — <code>.parse<\/code> добавляет это требование за вас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/ru/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">Объект совпадения<\/a> работает точно так же, как те, с которыми вы встречались раньше.<\/span> <span class=\"sg\" data-s=\"1\">Каждый использованный в грамматике токен становится именованным захватом, поэтому <code>$m&lt;key&gt;<\/code> и <code>$m&lt;value&gt;<\/code> дают совпавшие части.<\/span> <span class=\"sg\" data-s=\"2\">Токены вкладываются друг в друга, поэтому грамматика строит небольшое дерево совпадений — ему посвящён один из следующих разделов.<\/span><\/p>"]]},"uk":{"t":"Розбір за допомогою parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб запустити граматику, викличте її метод <code>.parse<\/code>, передавши рядок для аналізу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> повертає об'єкт збігу, коли граматика зіставляється з <strong>усім<\/strong> рядком, і <code>Nil<\/code>, коли ні.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки весь вхідний текст має зіставитися, якорі <code>^<\/code> та <code>$<\/code> не потрібні — <code>.parse<\/code> додає цю вимогу за вас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/uk/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">Об'єкт збігу<\/a> працює так само, як ті, з якими ви зустрічалися раніше.<\/span> <span class=\"sg\" data-s=\"1\">Кожен токен, використаний у граматиці, стає іменованим захопленням, тож <code>$m&lt;key&gt;<\/code> та <code>$m&lt;value&gt;<\/code> дають знайдені частини.<\/span> <span class=\"sg\" data-s=\"2\">Токени вкладаються один в одного, тож граматика будує невелике дерево збігів — тема пізнішого розділу.<\/span><\/p>"]]},"bg":{"t":"Разбор с parse","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За да изпълните граматика, извикайте нейния метод <code>.parse<\/code> с низа за анализ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.parse<\/code> връща обект на съвпадението, когато граматиката съвпадне с <strong>целия<\/strong> низ, и <code>Nil<\/code>, когато не съвпадне.<\/span> <span class=\"sg\" data-s=\"1\">Понеже целият вход трябва да съвпадне, няма нужда от котвите <code>^<\/code> и <code>$<\/code> — <code>.parse<\/code> добавя това изискване вместо вас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Pair.parse('x=5').defined; # True\nsay Pair.parse('x=').defined;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/bg/regexes/matching/match-object/\" target=\"_blank\" rel=\"noopener\">Обектът на съвпадението<\/a> работи точно като онези, които срещнахте по-рано.<\/span> <span class=\"sg\" data-s=\"1\">Всеки токен, използван в граматиката, става именувано прихващане, така че <code>$m&lt;key&gt;<\/code> и <code>$m&lt;value&gt;<\/code> дават съвпадналите части.<\/span> <span class=\"sg\" data-s=\"2\">Токените се влагат един в друг, така че граматиката изгражда малко дърво от съвпадения — темата на по-късен раздел.<\/span><\/p>"]]}}}</script>
