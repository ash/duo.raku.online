<script type="application/json" id="page-data">{"u":"regexes/creating-grammars","n":1103,"k":"section","pv":"regexes/what-is-a-grammar/exercises/year-token/solution","nx":"regexes/creating-grammars/top-rule","tr":["regexes"],"L":{"en":{"t":"Creating grammars","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You have seen that a grammar groups named tokens together.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at the two things that make a grammar work: the special <code>TOP<\/code> rule that describes the whole input, and the <code>.parse<\/code> method that runs the grammar against a string and gives you a match object back.<\/span><\/p>"]]},"de":{"t":"Grammatiken erstellen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie haben gesehen, dass eine Grammatik benannte Tokens zusammenfasst.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet die beiden Dinge, die eine Grammatik zum Laufen bringen: die besondere Regel <code>TOP<\/code>, die die gesamte Eingabe beschreibt, und die Methode <code>.parse<\/code>, die die Grammatik auf eine Zeichenkette anwendet und Ihnen ein Match-Objekt zurückgibt.<\/span><\/p>"]]},"nl":{"t":"Grammatica's maken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt gezien dat een grammatica benoemde tokens groepeert.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie bekijkt de twee dingen die een grammatica laten werken: de bijzondere regel <code>TOP<\/code> die de hele invoer beschrijft, en de methode <code>.parse<\/code> die de grammatica op een string toepast en je een matchobject teruggeeft.<\/span><\/p>"]]},"es":{"t":"Crear gramáticas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya has visto que una gramática agrupa tokens con nombre.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección examina las dos cosas que hacen funcionar a una gramática: la regla especial <code>TOP<\/code>, que describe la entrada entera, y el método <code>.parse<\/code>, que aplica la gramática a una cadena y te devuelve un objeto de coincidencia.<\/span><\/p>"]]},"it":{"t":"Creare grammatiche","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai visto che una grammatica raggruppa token con nome.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione guarda le due cose che fanno funzionare una grammatica: la regola speciale <code>TOP<\/code> che descrive l'intero input e il metodo <code>.parse<\/code> che fa girare la grammatica su una stringa e ti restituisce un oggetto match.<\/span><\/p>"]]},"lv":{"t":"Gramatiku veidošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Esat redzējuši, ka gramatika sagrupē nosauktus marķierus.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko divas lietas, kas gramatiku darbina: īpašo likumu <code>TOP<\/code>, kas apraksta visu ievadi, un metodi <code>.parse<\/code>, kas gramatiku palaiž pret virkni un atdod sakritības objektu.<\/span><\/p>"]]},"ru":{"t":"Создание грамматик","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже видели, что грамматика объединяет именованные токены.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются две вещи, благодаря которым грамматика работает: особое правило <code>TOP<\/code>, описывающее весь ввод, и метод <code>.parse<\/code>, который применяет грамматику к строке и возвращает объект совпадения.<\/span><\/p>"]]},"uk":{"t":"Створення граматик","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви бачили, що граматика групує іменовані токени разом.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає дві речі, завдяки яким граматика працює: особливе правило <code>TOP<\/code>, що описує весь вхідний текст, і метод <code>.parse<\/code>, який запускає граматику на рядку й повертає вам об'єкт збігу.<\/span><\/p>"]]},"bg":{"t":"Създаване на граматики","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Видяхте, че граматиката групира именувани токени заедно.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда двете неща, които карат граматиката да работи: специалното правило <code>TOP<\/code>, което описва целия вход, и методът <code>.parse<\/code>, който изпълнява граматиката върху низ и ви връща обект на съвпадението.<\/span><\/p>"]]}}}</script>
