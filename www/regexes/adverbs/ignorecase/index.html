<script type="application/json" id="page-data">{"u":"regexes/adverbs/ignorecase","n":1063,"k":"topic","pv":"regexes/adverbs","nx":"regexes/adverbs/ignorecase/quiz","tr":["regexes","regexes/adverbs"],"L":{"en":{"t":"Case-insensitive matching","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normally a regex distinguishes upper-case from lower-case letters: <code>/hello/<\/code> does not match <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>:i<\/code> adverb (short for <code>:ignorecase<\/code>) turns that distinction off:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With <code>:i<\/code>, the letters match regardless of case, so the lower-case pattern matches the upper-case text.<\/span> <span class=\"sg\" data-s=\"1\">It works in either direction and for mixed case too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can also write the adverb on the <code>m///<\/code> operator instead of inside the pattern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Both of these make the <strong>whole<\/strong> pattern ignore case.<\/span> <span class=\"sg\" data-s=\"1\">The <a href=\"/regexes/adverbs/adverb-scope/\">next page<\/a> looks more closely at <em>where<\/em> an adverb applies — the difference between the two placements — and how to switch case-sensitivity back on for part of a pattern.<\/span><\/p>"]]},"de":{"t":"Treffen ohne Rücksicht auf Groß- und Kleinschreibung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normalerweise unterscheidet ein Regex Groß- von Kleinbuchstaben: <code>/hello/<\/code> trifft <code>HELLO<\/code> nicht.<\/span> <span class=\"sg\" data-s=\"1\">Das Adverb <code>:i<\/code> (kurz für <code>:ignorecase<\/code>) schaltet diese Unterscheidung ab:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit <code>:i<\/code> treffen die Buchstaben unabhängig von ihrer Schreibung, das kleingeschriebene Muster trifft also den großgeschriebenen Text.<\/span> <span class=\"sg\" data-s=\"1\">Es funktioniert in beide Richtungen und auch bei gemischter Schreibung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können das Adverb auch am Operator <code>m///<\/code> statt im Muster schreiben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beides lässt das <strong>ganze<\/strong> Muster die Schreibung übergehen.<\/span> <span class=\"sg\" data-s=\"1\">Die <a href=\"https://course.raku.org/de/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">nächste Seite<\/a> betrachtet genauer, <em>wo<\/em> ein Adverb gilt — den Unterschied zwischen den beiden Stellungen — und wie Sie die Unterscheidung für einen Teil des Musters wieder einschalten.<\/span><\/p>"]]},"nl":{"t":"Matchen zonder op hoofdletters te letten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normaal onderscheidt een regex hoofdletters van kleine letters: <code>/hello/<\/code> matcht <code>HELLO<\/code> niet.<\/span> <span class=\"sg\" data-s=\"1\">Het bijwoord <code>:i<\/code> (kort voor <code>:ignorecase<\/code>) zet dat onderscheid uit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met <code>:i<\/code> matchen de letters ongeacht hoofdletter of kleine letter, dus matcht het patroon in kleine letters de tekst in hoofdletters.<\/span> <span class=\"sg\" data-s=\"1\">Het werkt in beide richtingen en ook voor gemengd hoofdlettergebruik:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt het bijwoord ook op de operator <code>m///<\/code> schrijven in plaats van binnen het patroon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide laten het <strong>hele<\/strong> patroon hoofdletters negeren.<\/span> <span class=\"sg\" data-s=\"1\">De <a href=\"https://course.raku.org/nl/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">volgende pagina<\/a> kijkt nauwkeuriger naar <em>waar<\/em> een bijwoord van toepassing is — het verschil tussen de twee plaatsingen — en hoe je hoofdlettergevoeligheid voor een deel van een patroon weer aanzet.<\/span><\/p>"]]},"es":{"t":"Emparejamiento sin distinguir mayúsculas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normalmente un regex distingue las mayúsculas de las minúsculas: <code>/hello/<\/code> no empareja <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El adverbio <code>:i<\/code> (abreviatura de <code>:ignorecase<\/code>) desactiva esa distinción:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>:i<\/code> las letras coinciden sin importar las mayúsculas, así que el patrón en minúsculas empareja el texto en mayúsculas.<\/span> <span class=\"sg\" data-s=\"1\">Funciona en ambas direcciones y también con formas mixtas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También puedes escribir el adverbio sobre el operador <code>m///<\/code> en lugar de dentro del patrón:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambas formas hacen que <strong>todo<\/strong> el patrón ignore las mayúsculas.<\/span> <span class=\"sg\" data-s=\"1\">La <a href=\"https://course.raku.org/es/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">página siguiente<\/a> examina más de cerca <em>dónde<\/em> se aplica un adverbio — la diferencia entre las dos colocaciones — y cómo volver a activar la distinción de mayúsculas para una parte del patrón.<\/span><\/p>"]]},"it":{"t":"Matching senza distinzione fra maiuscole e minuscole","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normalmente un regex distingue le maiuscole dalle minuscole: <code>/hello/<\/code> non riconosce <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'avverbio <code>:i<\/code> (abbreviazione di <code>:ignorecase<\/code>) spegne quella distinzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>:i<\/code> le lettere corrispondono a prescindere dalle maiuscole, quindi lo schema minuscolo riconosce il testo maiuscolo.<\/span> <span class=\"sg\" data-s=\"1\">Funziona in entrambe le direzioni e anche per le forme miste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi anche scrivere l'avverbio sull'operatore <code>m///<\/code> invece che dentro lo schema:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entrambe le forme fanno ignorare le maiuscole all'<strong>intero<\/strong> schema.<\/span> <span class=\"sg\" data-s=\"1\">La <a href=\"https://course.raku.org/it/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">pagina successiva<\/a> guarda più da vicino <em>dove<\/em> si applica un avverbio — la differenza fra le due collocazioni — e come riaccendere la distinzione di maiuscole per una parte dello schema.<\/span><\/p>"]]},"ru":{"t":"Сопоставление без учёта регистра","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Обычно регулярное выражение различает прописные и строчные буквы: <code>/hello/<\/code> не совпадает с <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наречие <code>:i<\/code> (сокращение от <code>:ignorecase<\/code>) это различие отключает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>:i<\/code> буквы совпадают независимо от регистра, поэтому шаблон в нижнем регистре подходит к тексту в верхнем.<\/span> <span class=\"sg\" data-s=\"1\">Работает это в обе стороны, а также при смешанном регистре:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наречие можно записать и у оператора <code>m///<\/code>, а не внутри шаблона:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оба варианта заставляют игнорировать регистр <strong>весь<\/strong> шаблон.<\/span> <span class=\"sg\" data-s=\"1\"><a href=\"https://course.raku.org/ru/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">Следующая страница<\/a> подробнее рассматривает, <em>где<\/em> действует наречие — в чём разница между двумя способами записи — и как снова включить чувствительность к регистру для части шаблона.<\/span><\/p>"]]},"uk":{"t":"Зіставлення без урахування регістру","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Зазвичай регекс відрізняє великі літери від малих: <code>/hello/<\/code> не збігається з <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Прислівник <code>:i<\/code> (скорочення від <code>:ignorecase<\/code>) вимикає цю відмінність:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>:i<\/code> літери збігаються незалежно від регістру, тож шаблон із малих літер збігається з текстом із великих.<\/span> <span class=\"sg\" data-s=\"1\">Це працює в обох напрямках, а також для мішаного регістру:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прислівник також можна записати на операторі <code>m///<\/code>, а не всередині шаблону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва варіанти змушують <strong>увесь<\/strong> шаблон ігнорувати регістр.<\/span> <span class=\"sg\" data-s=\"1\"><a href=\"https://course.raku.org/uk/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">Наступна сторінка<\/a> розглядає уважніше, <em>де<\/em> саме діє прислівник — у чому різниця між цими двома розташуваннями — і як увімкнути врахування регістру назад для частини шаблону.<\/span><\/p>"]]},"bg":{"t":"Съпоставяне без оглед на регистъра","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Обикновено регулярният израз различава главните от малките букви: <code>/hello/<\/code> не съвпада с <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наречието <code>:i<\/code> (съкращение от <code>:ignorecase<\/code>) изключва това различаване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ /:i hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>:i<\/code> буквите съвпадат независимо от регистъра, така че шаблонът с малки букви съвпада с текста с главни.<\/span> <span class=\"sg\" data-s=\"1\">Работи и в двете посоки, както и при смесен регистър:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'I use RAKU' ~~ /:i raku/; # ｢RAKU｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да запишете наречието и върху оператора <code>m///<\/code>, вместо вътре в шаблона:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'HELLO' ~~ m:i/hello/; # ｢HELLO｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двата варианта карат <strong>целия<\/strong> шаблон да пренебрегва регистъра.<\/span> <span class=\"sg\" data-s=\"1\"><a href=\"https://course.raku.org/bg/regexes/adverbs/adverb-scope/\" target=\"_blank\" rel=\"noopener\">Следващата страница<\/a> разглежда по-отблизо <em>къде<\/em> точно действа наречието — разликата между двете разположения — и как да върнете отчитането на регистъра за част от шаблона.<\/span><\/p>"]]}}}</script>
