<script type="application/json" id="page-data">{"u":"regexes/adverbs/ignorecase/quiz","n":1064,"k":"quiz","pv":"regexes/adverbs/ignorecase","nx":"regexes/adverbs/adverb-scope","tr":["regexes","regexes/adverbs","regexes/adverbs/ignorecase"],"L":{"en":{"t":"Quiz — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span> <span class=\"sg\" data-s=\"1\">The pattern is upper-case and the text is mixed-case.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>:i<\/code> adverb turns off the upper/lower-case distinction, and it works in either direction — here the upper-case pattern <code>HELLO<\/code> matches the mixed-case text.<\/span> <span class=\"sg\" data-s=\"1\">The result is the matched text as it appears in the string, <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span> <span class=\"sg\" data-s=\"1\">Das Muster steht in Großbuchstaben, der Text in gemischter Schreibung.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Adverb <code>:i<\/code> schaltet die Unterscheidung zwischen Groß- und Kleinbuchstaben ab, und es wirkt in beide Richtungen — hier trifft das großgeschriebene Muster <code>HELLO<\/code> den gemischt geschriebenen Text.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis ist der getroffene Text, wie er in der Zeichenkette steht, <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span> <span class=\"sg\" data-s=\"1\">Het patroon staat in hoofdletters en de tekst is gemengd.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het bijwoord <code>:i<\/code> zet het onderscheid tussen hoofdletters en kleine letters uit, en het werkt in beide richtingen — hier matcht het patroon <code>HELLO<\/code> in hoofdletters de gemengde tekst.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is de gematchte tekst zoals die in de string staat, <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span> <span class=\"sg\" data-s=\"1\">El patrón está en mayúsculas y el texto en forma mixta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:i<\/code> desactiva la distinción entre mayúsculas y minúsculas, y funciona en ambas direcciones: aquí el patrón en mayúsculas <code>HELLO<\/code> empareja el texto en forma mixta.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es el texto coincidente tal como aparece en la cadena, <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span> <span class=\"sg\" data-s=\"1\">Lo schema è maiuscolo e il testo è misto.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:i<\/code> spegne la distinzione fra maiuscole e minuscole, e funziona in entrambe le direzioni — qui lo schema maiuscolo <code>HELLO<\/code> riconosce il testo in forma mista.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è il testo corrispondente così come compare nella stringa, <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Игнорирование регистра","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span> <span class=\"sg\" data-s=\"1\">Шаблон записан прописными буквами, а текст — в смешанном регистре.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:i<\/code> отключает различие прописных и строчных букв, и работает это в обе стороны — здесь шаблон из прописных букв <code>HELLO<\/code> совпадает с текстом в смешанном регистре.<\/span> <span class=\"sg\" data-s=\"1\">Результат — совпавший текст в том виде, в каком он есть в строке: <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Що надрукує наступна програма?<\/span> <span class=\"sg\" data-s=\"1\">Шаблон записано великими літерами, а текст — мішаним регістром.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прислівник <code>:i<\/code> вимикає відмінність між великими та малими літерами, і працює це в обох напрямках — тут шаблон із великих літер <code>HELLO<\/code> збігається з текстом мішаного регістру.<\/span> <span class=\"sg\" data-s=\"1\">Результатом є знайдений текст у тому вигляді, у якому він стоїть у рядку: <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Ignorecase","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span> <span class=\"sg\" data-s=\"1\">Шаблонът е с главни букви, а текстът е със смесен регистър.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' ~~ /:i HELLO/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">｢Hello｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">｢HELLO｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">False<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:i<\/code> изключва различаването между главни и малки букви и работи в двете посоки — тук шаблонът с главни букви <code>HELLO<\/code> съвпада с текста със смесен регистър.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е намереният текст във вида, в който стои в низа: <code>｢Hello｣<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
