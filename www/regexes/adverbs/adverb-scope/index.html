<script type="application/json" id="page-data">{"u":"regexes/adverbs/adverb-scope","n":1065,"k":"topic","pv":"regexes/adverbs/ignorecase/quiz","nx":"regexes/adverbs/global","tr":["regexes","regexes/adverbs"],"L":{"en":{"t":"Adverb scope","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>:i<\/code> adverb can be written in two places, and the difference is <strong>where it takes effect<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">On the operator, <code>m:i/…/<\/code> makes the <strong>whole<\/strong> pattern case-insensitive.<\/span> <span class=\"sg\" data-s=\"2\">Written inside the regex, <code>:i<\/code> is <em>positional<\/em> — it applies only from the point where it appears onward.<\/span> <span class=\"sg\" data-s=\"3\">That lets you relax the case rule for just part of a pattern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here the leading <code>R<\/code> is still matched case-sensitively — so lower-case <code>raku<\/code> fails — while <code>:i<\/code> makes only the <code>aku<\/code> that follows case-insensitive.<\/span> <span class=\"sg\" data-s=\"1\">With <code>m:i/Raku/<\/code>, by contrast, every letter is case-insensitive, so both <code>RAKU<\/code> and <code>raku<\/code> match.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Confined to a group<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The effect of an internal adverb is also confined to its enclosing group.<\/span> <span class=\"sg\" data-s=\"1\">In <code>/[:i abc]def/<\/code> only <code>abc<\/code> ignores case; the <code>def<\/code> after the group is matched strictly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Switching an adverb off<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To turn an adverb back off partway through a pattern, negate it with a <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So <code>:!i<\/code> restores case sensitivity from that point on:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> relaxes the case rule for <code>abc<\/code>, then <code>:!i<\/code> puts it back so <code>def<\/code> must match exactly.<\/span> <span class=\"sg\" data-s=\"1\">Grouping and <code>:!i<\/code> are two ways to reach the same goal: limit an adverb to just the part of the pattern that needs it.<\/span> <span class=\"sg\" data-s=\"2\">The same on/off switch works for the other in-pattern adverbs too.<\/span><\/p>"]]},"de":{"t":"Geltungsbereich eines Adverbs","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Adverb <code>:i<\/code> lässt sich an zwei Stellen schreiben, und der Unterschied liegt darin, <strong>wo es wirkt<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Am Operator macht <code>m:i/…/<\/code> das <strong>ganze<\/strong> Muster schreibungsunabhängig.<\/span> <span class=\"sg\" data-s=\"2\">Innerhalb des Regex geschrieben ist <code>:i<\/code> <em>positionsgebunden<\/em> — es gilt nur ab der Stelle, an der es steht.<\/span> <span class=\"sg\" data-s=\"3\">Damit können Sie die Schreibungsregel für nur einen Teil eines Musters lockern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wird das vorangehende <code>R<\/code> weiterhin schreibungsabhängig getroffen — kleingeschriebenes <code>raku<\/code> scheitert also —, während <code>:i<\/code> nur das darauffolgende <code>aku<\/code> schreibungsunabhängig macht.<\/span> <span class=\"sg\" data-s=\"1\">Bei <code>m:i/Raku/<\/code> ist dagegen jeder Buchstabe schreibungsunabhängig, es treffen also sowohl <code>RAKU<\/code> als auch <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Auf eine Gruppe beschränkt<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Wirkung eines inneren Adverbs ist außerdem auf seine umgebende Gruppe beschränkt.<\/span> <span class=\"sg\" data-s=\"1\">In <code>/[:i abc]def/<\/code> übergeht nur <code>abc<\/code> die Schreibung; das <code>def<\/code> hinter der Gruppe wird streng getroffen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ein Adverb abschalten<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um ein Adverb mitten im Muster wieder abzuschalten, verneinen Sie es mit einem <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>:!i<\/code> stellt also ab dieser Stelle die Schreibungsabhängigkeit wieder her:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> lockert die Schreibungsregel für <code>abc<\/code>, dann setzt <code>:!i<\/code> sie wieder in Kraft, sodass <code>def<\/code> genau treffen muss.<\/span> <span class=\"sg\" data-s=\"1\">Gruppieren und <code>:!i<\/code> sind zwei Wege zum selben Ziel: ein Adverb auf genau den Teil des Musters zu beschränken, der es braucht.<\/span> <span class=\"sg\" data-s=\"2\">Derselbe Ein-Aus-Schalter funktioniert auch bei den übrigen Adverbien im Muster.<\/span><\/p>"]]},"nl":{"t":"Bereik van een bijwoord","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Het bijwoord <code>:i<\/code> kan op twee plaatsen geschreven worden, en het verschil zit in <strong>waar het effect heeft<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Op de operator maakt <code>m:i/…/<\/code> het <strong>hele<\/strong> patroon hoofdletterongevoelig.<\/span> <span class=\"sg\" data-s=\"2\">Binnen de regex geschreven is <code>:i<\/code> <em>positioneel<\/em> — het geldt alleen vanaf het punt waar het staat.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je de hoofdletterregel voor slechts een deel van een patroon versoepelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wordt de voorafgaande <code>R<\/code> nog steeds hoofdlettergevoelig gematcht — dus <code>raku<\/code> in kleine letters mislukt — terwijl <code>:i<\/code> alleen de daaropvolgende <code>aku<\/code> hoofdletterongevoelig maakt.<\/span> <span class=\"sg\" data-s=\"1\">Bij <code>m:i/Raku/<\/code> is daarentegen elke letter hoofdletterongevoelig, dus matchen zowel <code>RAKU<\/code> als <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beperkt tot een groep<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het effect van een intern bijwoord is ook beperkt tot zijn omvattende groep.<\/span> <span class=\"sg\" data-s=\"1\">In <code>/[:i abc]def/<\/code> negeert alleen <code>abc<\/code> hoofdletters; de <code>def<\/code> achter de groep wordt strikt gematcht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een bijwoord uitzetten<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een bijwoord halverwege een patroon weer uit te zetten, negeer je het met een <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dus <code>:!i<\/code> herstelt de hoofdlettergevoeligheid vanaf dat punt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> versoepelt de hoofdletterregel voor <code>abc<\/code>, waarna <code>:!i<\/code> hem terugzet zodat <code>def<\/code> exact moet matchen.<\/span> <span class=\"sg\" data-s=\"1\">Groeperen en <code>:!i<\/code> zijn twee manieren om hetzelfde doel te bereiken: een bijwoord beperken tot precies het deel van het patroon dat het nodig heeft.<\/span> <span class=\"sg\" data-s=\"2\">Dezelfde aan/uit-schakelaar werkt ook voor de andere bijwoorden binnen een patroon.<\/span><\/p>"]]},"es":{"t":"Alcance de los adverbios","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:i<\/code> se puede escribir en dos sitios, y la diferencia está en <strong>dónde surte efecto<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sobre el operador, <code>m:i/…/<\/code> hace insensible a las mayúsculas <strong>todo<\/strong> el patrón.<\/span> <span class=\"sg\" data-s=\"2\">Escrito dentro del regex, <code>:i<\/code> es <em>posicional<\/em>: se aplica solo a partir del punto donde aparece.<\/span> <span class=\"sg\" data-s=\"3\">Eso te permite relajar la regla de las mayúsculas solo para una parte del patrón:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí la <code>R<\/code> inicial se sigue emparejando distinguiendo mayúsculas — de ahí que el minúsculo <code>raku<\/code> falle —, mientras que <code>:i<\/code> hace insensible a las mayúsculas solo el <code>aku<\/code> que le sigue.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>m:i/Raku/<\/code>, en cambio, todas las letras son insensibles a las mayúsculas, así que coinciden tanto <code>RAKU<\/code> como <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Confinado a un grupo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El efecto de un adverbio interno también queda confinado al grupo que lo contiene.<\/span> <span class=\"sg\" data-s=\"1\">En <code>/[:i abc]def/<\/code> solo <code>abc<\/code> ignora las mayúsculas; el <code>def<\/code> posterior al grupo se empareja de forma estricta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Desactivar un adverbio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para volver a desactivar un adverbio a mitad de patrón, niégalo con un <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así, <code>:!i<\/code> restablece la distinción de mayúsculas a partir de ese punto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> relaja la regla de las mayúsculas para <code>abc<\/code> y después <code>:!i<\/code> la restablece, de modo que <code>def<\/code> debe coincidir exactamente.<\/span> <span class=\"sg\" data-s=\"1\">La agrupación y <code>:!i<\/code> son dos maneras de llegar al mismo objetivo: limitar un adverbio a la parte del patrón que lo necesita.<\/span> <span class=\"sg\" data-s=\"2\">El mismo interruptor de encendido y apagado funciona también con los demás adverbios internos al patrón.<\/span><\/p>"]]},"it":{"t":"Ambito degli avverbi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:i<\/code> si può scrivere in due posti, e la differenza sta in <strong>dove fa effetto<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sull'operatore, <code>m:i/…/<\/code> rende insensibile alle maiuscole l'<strong>intero<\/strong> schema.<\/span> <span class=\"sg\" data-s=\"2\">Scritto dentro il regex, <code>:i<\/code> è <em>posizionale<\/em>: si applica solo dal punto in cui compare in poi.<\/span> <span class=\"sg\" data-s=\"3\">Questo ti permette di allentare la regola sulle maiuscole per una sola parte di uno schema:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui la <code>R<\/code> iniziale viene ancora riconosciuta distinguendo le maiuscole — quindi il minuscolo <code>raku<\/code> fallisce — mentre <code>:i<\/code> rende insensibile alle maiuscole solo l'<code>aku<\/code> che segue.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>m:i/Raku/<\/code>, invece, ogni lettera è insensibile alle maiuscole, quindi corrispondono sia <code>RAKU<\/code> sia <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Confinato in un gruppo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'effetto di un avverbio interno è confinato anche al gruppo che lo racchiude.<\/span> <span class=\"sg\" data-s=\"1\">In <code>/[:i abc]def/<\/code> solo <code>abc<\/code> ignora le maiuscole; il <code>def<\/code> dopo il gruppo viene riconosciuto in modo stretto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Spegnere un avverbio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per rispegnere un avverbio a metà schema, negalo con un <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>:!i<\/code> ripristina la distinzione di maiuscole da quel punto in poi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> allenta la regola sulle maiuscole per <code>abc<\/code>, poi <code>:!i<\/code> la rimette a posto così che <code>def<\/code> debba corrispondere esattamente.<\/span> <span class=\"sg\" data-s=\"1\">Il raggruppamento e <code>:!i<\/code> sono due modi di raggiungere lo stesso obiettivo: limitare un avverbio alla sola parte di schema che ne ha bisogno.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso interruttore acceso/spento funziona anche per gli altri avverbi interni allo schema.<\/span><\/p>"]]},"ru":{"t":"Область действия наречия","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:i<\/code> можно записать в двух местах, и разница в том, <strong>где оно действует<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">У оператора запись <code>m:i/…/<\/code> делает нечувствительным к регистру <strong>весь<\/strong> шаблон.<\/span> <span class=\"sg\" data-s=\"2\">Записанное же внутри регулярного выражения, <code>:i<\/code> работает <em>позиционно<\/em>: оно действует только начиная с того места, где появилось.<\/span> <span class=\"sg\" data-s=\"3\">Это позволяет ослабить правило регистра лишь для части шаблона:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь начальная <code>R<\/code> по-прежнему сопоставляется с учётом регистра — поэтому <code>raku<\/code> в нижнем регистре не подходит, — а <code>:i<\/code> делает нечувствительным к регистру только следующее за ним <code>aku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">При записи <code>m:i/Raku/<\/code>, наоборот, нечувствительна каждая буква, и подходят и <code>RAKU<\/code>, и <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ограничено группой<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Действие внутреннего наречия ограничено также объемлющей группой.<\/span> <span class=\"sg\" data-s=\"1\">В <code>/[:i abc]def/<\/code> регистр игнорирует только <code>abc<\/code>; идущее после группы <code>def<\/code> сопоставляется строго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Как выключить наречие<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы посреди шаблона выключить наречие обратно, отрицайте его знаком <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так <code>:!i<\/code> восстанавливает чувствительность к регистру с этого места:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> ослабляет правило регистра для <code>abc<\/code>, затем <code>:!i<\/code> возвращает его на место, так что <code>def<\/code> должно совпасть в точности.<\/span> <span class=\"sg\" data-s=\"1\">Группировка и <code>:!i<\/code> — два пути к одной цели: ограничить наречие именно той частью шаблона, которой оно нужно.<\/span> <span class=\"sg\" data-s=\"2\">Такой же выключатель работает и для остальных наречий, записываемых внутри шаблона.<\/span><\/p>"]]},"uk":{"t":"Область дії прислівника","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Прислівник <code>:i<\/code> можна записати у двох місцях, і різниця полягає в тому, <strong>де він діє<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">На операторі, <code>m:i/…/<\/code>, він робить нечутливим до регістру <strong>весь<\/strong> шаблон.<\/span> <span class=\"sg\" data-s=\"2\">Записаний усередині регексу, <code>:i<\/code> є <em>позиційним<\/em> — він діє лише від того місця, де з'явився, і далі.<\/span> <span class=\"sg\" data-s=\"3\">Це дозволяє послабити правило регістру лише для частини шаблону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут початкове <code>R<\/code> усе ще зіставляється з урахуванням регістру — тож <code>raku<\/code> з малої літери не підходить, — тоді як <code>:i<\/code> робить нечутливим до регістру лише <code>aku<\/code>, що йде після нього.<\/span> <span class=\"sg\" data-s=\"1\">Натомість із <code>m:i/Raku/<\/code> кожна літера нечутлива до регістру, тож підходять і <code>RAKU<\/code>, і <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Обмеження групою<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дія внутрішнього прислівника обмежена також групою, що його охоплює.<\/span> <span class=\"sg\" data-s=\"1\">У <code>/[:i abc]def/<\/code> регістр ігнорує лише <code>abc<\/code>; <code>def<\/code> після групи зіставляється строго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вимкнення прислівника<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб вимкнути прислівник назад посеред шаблону, заперечте його за допомогою <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>:!i<\/code> відновлює чутливість до регістру від цього місця й далі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> послаблює правило регістру для <code>abc<\/code>, а потім <code>:!i<\/code> повертає його на місце, тож <code>def<\/code> має збігтися точно.<\/span> <span class=\"sg\" data-s=\"1\">Групування та <code>:!i<\/code> — це два способи досягти однієї мети: обмежити прислівник саме тією частиною шаблону, якій він потрібен.<\/span> <span class=\"sg\" data-s=\"2\">Такий самий перемикач «увімк./вимк.» працює й для інших прислівників усередині шаблону.<\/span><\/p>"]]},"bg":{"t":"Обхват на наречието","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:i<\/code> може да се запише на две места и разликата е в това <strong>къде действа<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Върху оператора, <code>m:i/…/<\/code>, то прави нечувствителен към регистъра <strong>целия<\/strong> шаблон.<\/span> <span class=\"sg\" data-s=\"2\">Записано вътре в регулярния израз, <code>:i<\/code> е <em>позиционно<\/em> — то важи само от мястото, където се появява, нататък.<\/span> <span class=\"sg\" data-s=\"3\">Това позволява да разхлабите правилото за регистъра само за част от шаблона:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'RAKU' ~~ /R :i aku/; # ｢RAKU｣\nsay 'raku' ~~ /R :i aku/; # Nil<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук началното <code>R<\/code> все още се съпоставя с оглед на регистъра — така че <code>raku<\/code> с малка буква се проваля, — докато <code>:i<\/code> прави нечувствително към регистъра само <code>aku<\/code>, което следва след него.<\/span> <span class=\"sg\" data-s=\"1\">За разлика от това, при <code>m:i/Raku/<\/code> всяка буква е нечувствителна към регистъра, така че съвпадат и <code>RAKU<\/code>, и <code>raku<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ограничено до групата<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Действието на вътрешното наречие е ограничено и до обхващащата го група.<\/span> <span class=\"sg\" data-s=\"1\">В <code>/[:i abc]def/<\/code> регистърът се пренебрегва само за <code>abc<\/code>; <code>def<\/code> след групата се съпоставя строго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ /[:i abc]def/; # ｢ABCdef｣\nsay 'ABCDEF' ~~ /[:i abc]def/; # Nil<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изключване на наречие<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да изключите наречие обратно насред шаблона, отречете го с <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Така <code>:!i<\/code> възстановява чувствителността към регистъра от това място нататък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ABCdef' ~~ / :i abc :!i def /; # ｢ABCdef｣\nsay 'ABCDEF' ~~ / :i abc :!i def /; # Nil<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>:i<\/code> разхлабва правилото за регистъра за <code>abc<\/code>, после <code>:!i<\/code> го връща на място, така че <code>def<\/code> трябва да съвпадне точно.<\/span> <span class=\"sg\" data-s=\"1\">Групирането и <code>:!i<\/code> са два начина да се стигне до една и съща цел: да се ограничи наречието само до онази част от шаблона, която се нуждае от него.<\/span> <span class=\"sg\" data-s=\"2\">Същият превключвател „включено/изключено“ работи и за другите наречия вътре в шаблона.<\/span><\/p>"]]}}}</script>
