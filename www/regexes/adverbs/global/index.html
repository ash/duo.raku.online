<script type="application/json" id="page-data">{"u":"regexes/adverbs/global","n":1066,"k":"topic","pv":"regexes/adverbs/adverb-scope","nx":"regexes/adverbs/sigspace","tr":["regexes","regexes/adverbs"],"L":{"en":{"t":"Global matching","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">By default, a regex finds only the <strong>first<\/strong> match.<\/span> <span class=\"sg\" data-s=\"1\">The <code>:g<\/code> adverb (short for <code>:global<\/code>) finds <strong>every<\/strong> match in the string.<\/span> <span class=\"sg\" data-s=\"2\">It is written on the <code>m///<\/code> operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With <code>:g<\/code>, the result behaves like a list of match objects — one for each place the pattern was found.<\/span> <span class=\"sg\" data-s=\"1\">You can count them, loop over them, or turn each into a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here <code>\\d+<\/code> matched three separate runs of digits, and <code>:g<\/code> collected all of them.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Global matching is the natural tool whenever the question is “how many …” or “all of the …” rather than “is there a …”.<\/span><\/p>"]]},"de":{"t":"Globales Treffen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig findet ein Regex nur den <strong>ersten<\/strong> Treffer.<\/span> <span class=\"sg\" data-s=\"1\">Das Adverb <code>:g<\/code> (kurz für <code>:global<\/code>) findet <strong>jeden<\/strong> Treffer in der Zeichenkette.<\/span> <span class=\"sg\" data-s=\"2\">Es wird am Operator <code>m///<\/code> geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit <code>:g<\/code> verhält sich das Ergebnis wie eine Liste von Match-Objekten — eines für jede Stelle, an der das Muster gefunden wurde.<\/span> <span class=\"sg\" data-s=\"1\">Sie können sie zählen, über sie laufen oder jedes in eine Zeichenkette verwandeln:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier hat <code>\\d+<\/code> drei getrennte Ziffernfolgen getroffen, und <code>:g<\/code> hat sie alle eingesammelt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Globales Treffen ist das natürliche Werkzeug, sobald die Frage „wie viele …“ oder „alle …“ lautet statt „gibt es ein …“.<\/span><\/p>"]]},"nl":{"t":"Globaal matchen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Standaard vindt een regex alleen de <strong>eerste<\/strong> match.<\/span> <span class=\"sg\" data-s=\"1\">Het bijwoord <code>:g<\/code> (kort voor <code>:global<\/code>) vindt <strong>elke<\/strong> match in de string.<\/span> <span class=\"sg\" data-s=\"2\">Het wordt op de operator <code>m///<\/code> geschreven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met <code>:g<\/code> gedraagt het resultaat zich als een lijst matchobjecten — een voor elke plek waar het patroon gevonden is.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ze tellen, erover lussen, of er elk een string van maken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier matchte <code>\\d+<\/code> drie afzonderlijke reeksen cijfers, en <code>:g<\/code> verzamelde ze allemaal.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Globaal matchen is het natuurlijke gereedschap zodra de vraag \"hoeveel …\" of \"alle …\" luidt in plaats van \"is er een …\".<\/span><\/p>"]]},"es":{"t":"Emparejamiento global","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por omisión, un regex encuentra solo la <strong>primera<\/strong> coincidencia.<\/span> <span class=\"sg\" data-s=\"1\">El adverbio <code>:g<\/code> (abreviatura de <code>:global<\/code>) encuentra <strong>todas<\/strong> las coincidencias de la cadena.<\/span> <span class=\"sg\" data-s=\"2\">Se escribe sobre el operador <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>:g<\/code>, el resultado se comporta como una lista de objetos de coincidencia, uno por cada sitio donde se encontró el patrón.<\/span> <span class=\"sg\" data-s=\"1\">Puedes contarlos, recorrerlos o convertir cada uno en cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>\\d+<\/code> emparejó tres series de dígitos distintas, y <code>:g<\/code> las recogió todas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El emparejamiento global es la herramienta natural siempre que la pregunta es «cuántos…» o «todos los…» en lugar de «¿hay algún…?».<\/span><\/p>"]]},"it":{"t":"Matching globale","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita un regex trova solo la <strong>prima<\/strong> corrispondenza.<\/span> <span class=\"sg\" data-s=\"1\">L'avverbio <code>:g<\/code> (abbreviazione di <code>:global<\/code>) trova <strong>ogni<\/strong> corrispondenza nella stringa.<\/span> <span class=\"sg\" data-s=\"2\">Si scrive sull'operatore <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>:g<\/code> il risultato si comporta come un elenco di oggetti match — uno per ogni punto in cui lo schema è stato trovato.<\/span> <span class=\"sg\" data-s=\"1\">Puoi contarli, scorrerli o trasformare ciascuno in una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui <code>\\d+<\/code> ha riconosciuto tre sequenze distinte di cifre, e <code>:g<\/code> le ha raccolte tutte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il riconoscimento globale è lo strumento naturale ogni volta che la domanda è «quanti…» o «tutti i…» invece di «c'è un…».<\/span><\/p>"]]},"lv":{"t":"Globāla saskaņošana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma regulārā izteiksme atrod tikai <strong>pirmo<\/strong> sakritību.<\/span> <span class=\"sg\" data-s=\"1\">Apstākļvārds <code>:g<\/code> (saīsinājums no <code>:global<\/code>) atrod <strong>katru<\/strong> sakritību virknē.<\/span> <span class=\"sg\" data-s=\"2\">To raksta uz operatora <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar <code>:g<\/code> rezultāts uzvedas kā sakritības objektu saraksts — pa vienam katrai vietai, kur raksturs atrasts.<\/span> <span class=\"sg\" data-s=\"1\">Tos var saskaitīt, tiem var iet cauri ciklā vai katru pārvērst par virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>\\d+<\/code> sakritināja trīs atsevišķas ciparu virtenes, un <code>:g<\/code> savāca tās visas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Globālā piemeklēšana ir dabiskais rīks ikreiz, kad jautājums ir «cik daudz…» vai «visi…», nevis «vai ir…».<\/span><\/p>"]]},"ru":{"t":"Глобальное сопоставление","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">По умолчанию регулярное выражение находит только <strong>первое<\/strong> совпадение.<\/span> <span class=\"sg\" data-s=\"1\">Наречие <code>:g<\/code> (сокращение от <code>:global<\/code>) находит в строке <strong>каждое<\/strong> совпадение.<\/span> <span class=\"sg\" data-s=\"2\">Записывают его у оператора <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>:g<\/code> результат ведёт себя как список объектов совпадения — по одному на каждое место, где шаблон был найден.<\/span> <span class=\"sg\" data-s=\"1\">Их можно пересчитать, обойти циклом или превратить каждый в строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>\\d+<\/code> совпал с тремя отдельными вереницами цифр, и <code>:g<\/code> собрал их все.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Глобальное сопоставление — естественный инструмент всякий раз, когда вопрос звучит как «сколько…» или «все…», а не «есть ли…».<\/span><\/p>"]]},"uk":{"t":"Глобальне зіставлення","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Типово регекс знаходить лише <strong>перший<\/strong> збіг.<\/span> <span class=\"sg\" data-s=\"1\">Прислівник <code>:g<\/code> (скорочення від <code>:global<\/code>) знаходить <strong>кожен<\/strong> збіг у рядку.<\/span> <span class=\"sg\" data-s=\"2\">Його записують на операторі <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>:g<\/code> результат поводиться як список об'єктів збігу — по одному на кожне місце, де знайшовся шаблон.<\/span> <span class=\"sg\" data-s=\"1\">Їх можна порахувати, обійти циклом або перетворити кожен на рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут <code>\\d+<\/code> знайшов три окремі послідовності цифр, а <code>:g<\/code> зібрав їх усі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Глобальне зіставлення — природний інструмент щоразу, коли питання звучить як «скільки…» чи «усі…», а не «чи є там…».<\/span><\/p>"]]},"bg":{"t":"Глобално съпоставяне","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">По подразбиране регулярният израз намира само <strong>първото<\/strong> съвпадение.<\/span> <span class=\"sg\" data-s=\"1\">Наречието <code>:g<\/code> (съкращение от <code>:global<\/code>) намира <strong>всяко<\/strong> съвпадение в низа.<\/span> <span class=\"sg\" data-s=\"2\">Записва се върху оператора <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>:g<\/code> резултатът се държи като списък от обекти на съвпадението — по един за всяко място, където шаблонът е бил намерен.<\/span> <span class=\"sg\" data-s=\"1\">Можете да ги преброите, да ги обходите в цикъл или да превърнете всеки в низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук <code>\\d+<\/code> съпостави три отделни поредици от цифри, а <code>:g<\/code> ги събра всички.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Глобалното съпоставяне е естественият инструмент винаги когато въпросът е „колко…“ или „всички…“, а не „има ли изобщо…“.<\/span><\/p>"]]},"eo":{"t":"Ĝenerala kongruigo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, regulesprimo trovas nur la <strong>unuan<\/strong> kongruon.<\/span> <span class=\"sg\" data-s=\"1\">La adverbo <code>:g<\/code> (mallongigo de <code>:global<\/code>) trovas <strong>ĉiun<\/strong> kongruon en la ĉeno.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas skribata sur la operatoro <code>m///<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun <code>:g<\/code>, la rezulto kondutas kiel listo de kongruaj objektoj — unu por ĉiu loko, kie la ŝablono estis trovita.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas kalkuli ilin, iri tra ili, aŭ transformi ĉiun en ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>\\d+<\/code> kongruis kun tri apartaj serioj de ciferoj, kaj <code>:g<\/code> kolektis ĉiujn el ili.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĝenerala kongruigo estas la natura ilo, kiam ajn la demando estas «kiom da …» aŭ «ĉiuj el la …» anstataŭ «ĉu estas …».<\/span><\/p>"]]},"la":{"t":"Congruentia universalis","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ex more regex solam <strong>primam<\/strong> congruentiam invenit.<\/span> <span class=\"sg\" data-s=\"1\">Adverbium <code>:g<\/code> (breviter pro <code>:global<\/code>) <strong>omnem<\/strong> congruentiam in catena invenit.<\/span> <span class=\"sg\" data-s=\"2\">In operatore <code>m///<\/code> scribitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @all = 'a1b2c3' ~~ m:g/\\d/;\nsay @all;       # [｢1｣ ｢2｣ ｢3｣]\nsay @all.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum <code>:g<\/code> effectus ut series obiectorum congruentiae se gerit — unum pro unoquoque loco ubi exemplar inventum est.<\/span> <span class=\"sg\" data-s=\"1\">Ea numerare, per ea percurrere, vel unumquodque in catenam vertere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @numbers = 'a12 b3 c456' ~~ m:g/\\d+/;\nsay @numbers.map(*.Str).join(', '); # 12, 3, 456<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic <code>\\d+<\/code> tres separatas cifrarum series congruit, et <code>:g<\/code> omnes collegit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Congruentia universalis instrumentum naturale est quotiens quaestio est «quot …» vel «omnes …» potius quam «estne …».<\/span><\/p>"]]}}}</script>
