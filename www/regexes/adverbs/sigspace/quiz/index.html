 <code>:s<\/code> zou de spatie in het patroon genegeerd worden en zou het patroon naar <code>helloworld<\/code> zoeken.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Adverbios","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Qué imprime el programa siguiente?<\/span> <span class=\"sg\" data-s=\"1\">Fíjate en el adverbio <code>:s<\/code> y en la serie de espacios del texto.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello   world' ~~ /:s hello world/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">｢hello   world｣<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Nil<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:s<\/code> hace significativo el espacio entre <code>hello<\/code> y <code>world<\/code> del patrón: exige que ahí haya espacio en blanco.<\/span> <span class=\"sg\" data-s=\"1\">Uno o más espacios valen todos, así que la serie de tres espacios del texto coincide y el resultado es <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sin <code>:s<\/code>, el espacio del patrón se ignoraría y el patrón buscaría <code>helloworld<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Avverbi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il programma seguente?<\/span> <span class=\"sg\" data-s=\"1\">Nota l'avverbio <code>:s<\/code> e la sequenza di spazi nel testo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello   world' ~~ /:s hello world/;<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">True<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">False<\/span><\/li><li class=\"quiz-opt\"><span c >"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:s<\/code> прави интервала между <code>hello<\/code> и <code>world<\/code> в шаблона значещ — той изисква там да има празен знак.<\/span> <span class=\"sg\" data-s=\"1\">Броят се един или повече интервала, така че поредицата от три интервала в текста съвпада и резултатът е <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без <code>:s<\/code> интервалът в шаблона би бил пренебрегнат и шаблонът би търсил <code>helloworld<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
