<script type="application/json" id="page-data">{"u":"regexes/adverbs/sigspace","n":1067,"k":"topic","pv":"regexes/adverbs/global","nx":"regexes/adverbs/sigspace/quiz","tr":["regexes","regexes/adverbs"],"L":{"en":{"t":"Significant whitespace","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Inside a regex, spaces are normally ignored — they are only there to make the pattern readable.<\/span> <span class=\"sg\" data-s=\"1\">That is why <code>/foo bar/<\/code> matches <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sometimes, though, you really do want a space in the pattern to mean “there is whitespace here”.<\/span> <span class=\"sg\" data-s=\"3\">The <code>:s<\/code> adverb (short for <code>:sigspace<\/code>, “significant space”) does exactly that:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With <code>:s<\/code>, the space between <code>foo<\/code> and <code>bar<\/code> in the pattern requires whitespace between the two words in the string.<\/span> <span class=\"sg\" data-s=\"1\">One or more spaces (or tabs) all count, so the run of spaces in <code>'foo    bar'<\/code> matches.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Significant whitespace becomes especially important with grammars, where it lets you write patterns that read like the language you are parsing.<\/span> <span class=\"sg\" data-s=\"1\">You will meet it again as the difference between a <code>token<\/code> and a <code>rule<\/code>.<\/span><\/p>"]]},"de":{"t":"Bedeutsamer Leerraum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Innerhalb eines Regex werden Leerzeichen gewöhnlich übergangen — sie stehen nur dort, um das Muster lesbar zu machen.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb trifft <code>/foo bar/<\/code> den Text <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Manchmal wollen Sie aber wirklich, dass ein Leerzeichen im Muster „hier steht Leerraum“ bedeutet.<\/span> <span class=\"sg\" data-s=\"3\">Genau das tut das Adverb <code>:s<\/code> (kurz für <code>:sigspace<\/code>, „significant space“):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit <code>:s<\/code> verlangt das Leerzeichen zwischen <code>foo<\/code> und <code>bar<\/code> im Muster Leerraum zwischen den beiden Wörtern in der Zeichenkette.<\/span> <span class=\"sg\" data-s=\"1\">Ein oder mehrere Leerzeichen (oder Tabulatoren) zählen alle, die Folge von Leerzeichen in <code>'foo    bar'<\/code> trifft also.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bedeutsamer Leerraum wird vor allem bei Grammatiken wichtig, wo er Ihnen erlaubt, Muster zu schreiben, die sich wie die Sprache lesen, die Sie zerlegen.<\/span> <span class=\"sg\" data-s=\"1\">Sie begegnen ihm wieder als Unterschied zwischen einem <code>token<\/code> und einer <code>rule<\/code>.<\/span><\/p>"]]},"nl":{"t":"Betekenisvolle witruimte","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Binnen een regex worden spaties normaal genegeerd — ze staan er alleen om het patroon leesbaar te maken.<\/span> <span class=\"sg\" data-s=\"1\">Daarom matcht <code>/foo bar/<\/code> de tekst <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Soms wil je echter werkelijk dat een spatie in het patroon \"hier staat witruimte\" betekent.<\/span> <span class=\"sg\" data-s=\"3\">Het bijwoord <code>:s<\/code> (kort voor <code>:sigspace<\/code>, \"significant space\") doet precies dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met <code>:s<\/code> eist de spatie tussen <code>foo<\/code> en <code>bar<\/code> in het patroon witruimte tussen de twee woorden in de string.<\/span> <span class=\"sg\" data-s=\"1\">Een of meer spaties (of tabs) tellen allemaal mee, dus de reeks spaties in <code>'foo    bar'<\/code> matcht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Betekenisvolle witruimte wordt vooral belangrijk bij grammatica's, waar ze je patronen laat schrijven die lezen als de taal die je aan het ontleden bent.<\/span> <span class=\"sg\" data-s=\"1\">Je komt haar weer tegen als het verschil tussen een <code>token<\/code> en een <code>rule<\/code>.<\/span><\/p>"]]},"es":{"t":"Espacios significativos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro de un regex, los espacios se ignoran normalmente: están ahí solo para hacer legible el patrón.<\/span> <span class=\"sg\" data-s=\"1\">Por eso <code>/foo bar/<\/code> empareja <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A veces, sin embargo, sí quieres que un espacio del patrón signifique «aquí hay espacio en blanco».<\/span> <span class=\"sg\" data-s=\"3\">El adverbio <code>:s<\/code> (abreviatura de <code>:sigspace<\/code>, «espacio significativo») hace exactamente eso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>:s<\/code>, el espacio entre <code>foo<\/code> y <code>bar<\/code> en el patrón exige espacio en blanco entre las dos palabras de la cadena.<\/span> <span class=\"sg\" data-s=\"1\">Uno o más espacios (o tabuladores) valen todos, así que la serie de espacios de <code>'foo    bar'<\/code> coincide.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los espacios significativos cobran especial importancia con las gramáticas, donde te permiten escribir patrones que se leen como el lenguaje que estás analizando.<\/span> <span class=\"sg\" data-s=\"1\">Volverás a encontrártelos como la diferencia entre un <code>token<\/code> y una <code>rule<\/code>.<\/span><\/p>"]]},"it":{"t":"Spazi significativi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro un regex gli spazi vengono normalmente ignorati: sono lì solo per rendere leggibile lo schema.<\/span> <span class=\"sg\" data-s=\"1\">È per questo che <code>/foo bar/<\/code> riconosce <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A volte però vuoi davvero che uno spazio nello schema significhi «qui c'è dello spazio bianco».<\/span> <span class=\"sg\" data-s=\"3\">L'avverbio <code>:s<\/code> (abbreviazione di <code>:sigspace<\/code>, «spazio significativo») fa esattamente questo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>:s<\/code>, lo spazio fra <code>foo<\/code> e <code>bar<\/code> nello schema richiede dello spazio bianco fra le due parole nella stringa.<\/span> <span class=\"sg\" data-s=\"1\">Uno o più spazi (o tabulazioni) valgono tutti, quindi la sequenza di spazi in <code>'foo    bar'<\/code> corrisponde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli spazi significativi diventano particolarmente importanti con le grammatiche, dove ti permettono di scrivere schemi che si leggono come il linguaggio che stai analizzando.<\/span> <span class=\"sg\" data-s=\"1\">Li incontrerai di nuovo come differenza fra un <code>token<\/code> e una <code>rule<\/code>.<\/span><\/p>"]]},"ru":{"t":"Значимые пробелы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Внутри регулярного выражения пробелы обычно игнорируются — они нужны лишь для удобочитаемости шаблона.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>/foo bar/<\/code> совпадает с <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но иногда пробел в шаблоне действительно должен означать «здесь есть пробельный символ».<\/span> <span class=\"sg\" data-s=\"3\">Ровно это и делает наречие <code>:s<\/code> (сокращение от <code>:sigspace<\/code>, «значимый пробел»):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>:s<\/code> пробел между <code>foo<\/code> и <code>bar<\/code> в шаблоне требует пробельного символа между этими словами в строке.<\/span> <span class=\"sg\" data-s=\"1\">Годятся один или несколько пробелов (или табуляций), поэтому вереница пробелов в <code>'foo    bar'<\/code> подходит.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значимые пробелы становятся особенно важны в грамматиках, где они позволяют писать шаблоны, читающиеся как тот язык, который вы разбираете.<\/span> <span class=\"sg\" data-s=\"1\">Вы встретите их снова как различие между <code>token<\/code> и <code>rule<\/code>.<\/span><\/p>"]]},"uk":{"t":"Значущі пробіли","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Усередині регексу пробіли зазвичай ігноруються — вони потрібні лише для того, щоб шаблон легше читався.<\/span> <span class=\"sg\" data-s=\"1\">Саме тому <code>/foo bar/<\/code> збігається з <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Проте інколи ви справді хочете, щоб пробіл у шаблоні означав «тут є пробільний символ».<\/span> <span class=\"sg\" data-s=\"3\">Прислівник <code>:s<\/code> (скорочення від <code>:sigspace<\/code>, «значущий пробіл») робить саме це:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>:s<\/code> пробіл між <code>foo<\/code> та <code>bar<\/code> у шаблоні вимагає пробільного символу між двома словами в рядку.<\/span> <span class=\"sg\" data-s=\"1\">Годиться один або більше пробілів (чи табуляцій), тож послідовність пробілів у <code>'foo    bar'<\/code> теж підходить.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значущі пробіли стають особливо важливими у граматиках, де вони дозволяють писати шаблони, що читаються як мова, яку ви розбираєте.<\/span> <span class=\"sg\" data-s=\"1\">Ви ще зустрінете їх як різницю між <code>token<\/code> та <code>rule<\/code>.<\/span><\/p>"]]},"bg":{"t":"Значещи интервали","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вътре в регулярния израз интервалите обикновено се пренебрегват — те са там само за да направят шаблона четим.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>/foo bar/<\/code> съвпада с <code>foobar<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Понякога обаче наистина искате интервалът в шаблона да означава „тук има празен знак“.<\/span> <span class=\"sg\" data-s=\"3\">Наречието <code>:s<\/code> (съкращение от <code>:sigspace<\/code>, „значещ интервал“) прави точно това:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'foo    bar' ~~ /:s foo bar/; # True\nsay so 'foobar'     ~~ /:s foo bar/; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>:s<\/code> интервалът между <code>foo<\/code> и <code>bar<\/code> в шаблона изисква празен знак между двете думи в низа.<\/span> <span class=\"sg\" data-s=\"1\">Броят се един или повече интервала (или табулации), така че поредицата от интервали в <code>'foo    bar'<\/code> съвпада.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значещите интервали стават особено важни при граматиките, където позволяват да пишете шаблони, които се четат като езика, който разбирате.<\/span> <span class=\"sg\" data-s=\"1\">Ще ги срещнете отново като разликата между <code>token<\/code> и <code>rule<\/code>.<\/span><\/p>"]]}}}</script>
