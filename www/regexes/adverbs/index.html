<script type="application/json" id="page-data">{"u":"regexes/adverbs","n":1062,"k":"section","pv":"regexes/assertions/exercises/whole-dollar/solution","nx":"regexes/adverbs/ignorecase","tr":["regexes"],"L":{"en":{"t":"Adverbs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">An <em>adverb<\/em> is an option that changes how a regex behaves.<\/span> <span class=\"sg\" data-s=\"1\">You write it as a colon-word at the start of the pattern (or on the <code>m///<\/code> operator).<\/span> <span class=\"sg\" data-s=\"2\">Adverbs let you match without regard to letter case, find <strong>all<\/strong> the matches instead of just the first, and make spaces in the pattern significant.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section covers the three you will reach for most often: <code>:i<\/code>, <code>:g<\/code>, and <code>:s<\/code>.<\/span><\/p>"]]},"de":{"t":"Adverbien","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Adverb<\/em> ist eine Option, die verändert, wie sich ein Regex verhält.<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben es als Wort mit Doppelpunkt am Anfang des Musters (oder am Operator <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Adverbien erlauben es Ihnen, ohne Rücksicht auf Groß- und Kleinschreibung zu treffen, <strong>alle<\/strong> Treffer statt nur den ersten zu finden und Leerzeichen im Muster bedeutsam zu machen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die drei, zu denen Sie am häufigsten greifen: <code>:i<\/code>, <code>:g<\/code> und <code>:s<\/code>.<\/span><\/p>"]]},"nl":{"t":"Bijwoorden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>bijwoord<\/em> is een optie die verandert hoe een regex zich gedraagt.<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft het als een woord met dubbele punt aan het begin van het patroon (of op de operator <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Bijwoorden laten je matchen zonder op hoofdlettergebruik te letten, <strong>alle<\/strong> matches vinden in plaats van alleen de eerste, en spaties in het patroon betekenisvol maken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze sectie behandelt de drie waar je het vaakst naar grijpt: <code>:i<\/code>, <code>:g<\/code> en <code>:s<\/code>.<\/span><\/p>"]]},"es":{"t":"Adverbios","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>adverbio<\/em> es una opción que cambia el comportamiento de un regex.<\/span> <span class=\"sg\" data-s=\"1\">Se escribe como una palabra precedida de dos puntos al principio del patrón (o sobre el operador <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Los adverbios te permiten emparejar sin atender a mayúsculas y minúsculas, encontrar <strong>todas<\/strong> las coincidencias en lugar de solo la primera y hacer significativos los espacios del patrón.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata los tres a los que recurrirás más a menudo: <code>:i<\/code>, <code>:g<\/code> y <code>:s<\/code>.<\/span><\/p>"]]},"it":{"t":"Avverbi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>avverbio<\/em> è un'opzione che cambia il comportamento di un regex.<\/span> <span class=\"sg\" data-s=\"1\">Lo scrivi come una parola preceduta dai due punti all'inizio dello schema (o sull'operatore <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Gli avverbi ti permettono di riconoscere senza badare alle maiuscole, di trovare <strong>tutte<\/strong> le corrispondenze invece della sola prima e di rendere significativi gli spazi nello schema.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta i tre a cui ricorrerai più spesso: <code>:i<\/code>, <code>:g<\/code> e <code>:s<\/code>.<\/span><\/p>"]]},"ru":{"t":"Наречия","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Наречие<\/em> — это параметр, меняющий поведение регулярного выражения.<\/span> <span class=\"sg\" data-s=\"1\">Записывают его словом с двоеточием в начале шаблона (или у оператора <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Наречия позволяют сопоставлять без учёта регистра букв, находить <strong>все<\/strong> совпадения вместо одного первого и делать пробелы в шаблоне значимыми.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе рассматриваются три наречия, к которым обращаются чаще всего: <code>:i<\/code>, <code>:g<\/code> и <code>:s<\/code>.<\/span><\/p>"]]},"uk":{"t":"Прислівники","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Прислівник<\/em> — це опція, що змінює поведінку регексу.<\/span> <span class=\"sg\" data-s=\"1\">Його записують як слово з двокрапкою на початку шаблону (або на операторі <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Прислівники дозволяють зіставляти без огляду на регістр літер, знаходити <strong>всі<\/strong> збіги замість лише першого, а також робити пробіли в шаблоні значущими.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює три з них, до яких ви звертатиметеся найчастіше: <code>:i<\/code>, <code>:g<\/code> та <code>:s<\/code>.<\/span><\/p>"]]},"bg":{"t":"Наречия","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Наречието<\/em> е настройка, която променя поведението на регулярния израз.<\/span> <span class=\"sg\" data-s=\"1\">Записва се като дума с двоеточие в началото на шаблона (или върху оператора <code>m///<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Наречията позволяват да съпоставяте без оглед на регистъра на буквите, да намирате <strong>всички<\/strong> съвпадения вместо само първото и да правите интервалите в шаблона значещи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел обхваща трите, към които ще посягате най-често: <code>:i<\/code>, <code>:g<\/code> и <code>:s<\/code>.<\/span><\/p>"]]}}}</script>
