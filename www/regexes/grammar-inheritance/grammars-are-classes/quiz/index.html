<script type="application/json" id="page-data">{"u":"regexes/grammar-inheritance/grammars-are-classes/quiz","n":1128,"k":"quiz","pv":"regexes/grammar-inheritance/grammars-are-classes","nx":"regexes/grammar-inheritance/proto-tokens","tr":["regexes","regexes/grammar-inheritance","regexes/grammar-inheritance/grammars-are-classes"],"L":{"en":{"t":"Quiz — Inheriting grammars","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Which keyword makes one grammar inherit from another?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A grammar is a kind of class, so it uses the same inheritance keyword: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The derived grammar then inherits the base’s tokens and may override individual ones.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Grammatiken erben","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welches Schlüsselwort lässt eine Grammatik von einer anderen erben?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Grammatik ist eine Art Klasse, sie verwendet also dasselbe Schlüsselwort für die Vererbung: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die abgeleitete Grammatik erbt dann die Tokens der Basis und darf einzelne überschreiben.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Grammatica's erven","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welk sleutelwoord laat de ene grammatica van de andere erven?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een grammatica is een soort klasse, dus gebruikt ze hetzelfde sleutelwoord voor overerving: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De afgeleide grammatica erft dan de tokens van de basis en mag afzonderlijke tokens overschrijven.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Heredar gramáticas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué palabra clave hace que una gramática herede de otra?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una gramática es una clase de clase, así que usa la misma palabra clave de herencia: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La gramática derivada hereda entonces los tokens de la base y puede sobrescribir algunos sueltos.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Ereditare una grammatica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quale parola chiave fa ereditare una grammatica da un'altra?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una grammatica è un genere di classe, quindi usa la stessa parola chiave di ereditarietà: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La grammatica derivata eredita allora i token della base e può sovrascriverne singoli.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Наследование грамматик","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какое ключевое слово заставляет одну грамматику наследовать от другой?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Грамматика — разновидность класса, поэтому она использует то же ключевое слово наследования: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Производная грамматика затем наследует токены базовой и может переопределять отдельные из них.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Успадкування граматик","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Яке ключове слово змушує одну граматику успадковувати іншу?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Граматика є різновидом класу, тож вона використовує те саме ключове слово успадкування: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Похідна граматика успадковує токени базової та може перевизначати окремі з них.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Наследяване на граматики","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Коя ключова дума кара една граматика да наследява друга?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>does<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>extends<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>inherits<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Граматиката е вид клас, така че използва същата ключова дума за наследяване: <code>grammar Loud is Base { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Изведената граматика тогава наследява токените на базовата и може да предефинира отделни от тях.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
