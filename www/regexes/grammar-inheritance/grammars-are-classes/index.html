<script type="application/json" id="page-data">{"u":"regexes/grammar-inheritance/grammars-are-classes","n":1127,"k":"topic","pv":"regexes/grammar-inheritance","nx":"regexes/grammar-inheritance/grammars-are-classes/quiz","tr":["regexes","regexes/grammar-inheritance"],"L":{"en":{"t":"Grammars are classes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When you write <code>grammar<\/code>, Raku creates something very close to a class.<\/span> <span class=\"sg\" data-s=\"1\">The tokens are methods on it, and the whole machinery of <a href=\"/oop/inheritance/\">inheritance<\/a> from the part on objects applies.<\/span> <span class=\"sg\" data-s=\"2\">So one grammar can extend another with <code>is<\/code>, just like a subclass:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> inherits <code>TOP<\/code> from <code>Base<\/code> but provides its own <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">When <code>Loud<\/code> parses, its <code>TOP<\/code> calls <code>&lt;greeting&gt;<\/code>, and the overriding token in <code>Loud<\/code> is used — exactly how an overridden method works on objects.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This makes grammars composable.<\/span> <span class=\"sg\" data-s=\"1\">You can write a general grammar for a format and then derive a specialised version that changes only the tokens that differ, without copying the rest.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Even the <code>.parse<\/code> you keep calling comes from this class nature: every grammar automatically inherits from a built-in base type called <code>Grammar<\/code>, which supplies <code>.parse<\/code> (and its partial-match cousin, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">You never write it yourself — you get it for free, just as an ordinary class inherits methods from its parent.<\/span><\/p>"]]},"de":{"t":"Grammatiken sind Klassen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie <code>grammar<\/code> schreiben, erzeugt Raku etwas, das einer Klasse sehr nahekommt.<\/span> <span class=\"sg\" data-s=\"1\">Die Tokens sind Methoden darauf, und die ganze Maschinerie der <a href=\"https://course.raku.org/de/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">Vererbung<\/a> aus dem Teil über Objekte gilt.<\/span> <span class=\"sg\" data-s=\"2\">Eine Grammatik kann eine andere also mit <code>is<\/code> erweitern, genau wie eine Unterklasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> erbt <code>TOP<\/code> von <code>Base<\/code>, liefert aber ein eigenes <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Wenn <code>Loud<\/code> zerlegt, ruft ihr <code>TOP<\/code> <code>&lt;greeting&gt;<\/code> auf, und es wird das überschreibende Token in <code>Loud<\/code> verwendet — genau so, wie eine überschriebene Methode auf Objekten wirkt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das macht Grammatiken kombinierbar.<\/span> <span class=\"sg\" data-s=\"1\">Sie können eine allgemeine Grammatik für ein Format schreiben und dann eine besondere Fassung ableiten, die nur die abweichenden Tokens ändert, ohne den Rest zu kopieren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Selbst das <code>.parse<\/code>, das Sie ständig aufrufen, kommt aus diesem Klassenwesen: Jede Grammatik erbt selbsttätig von einem eingebauten Basistyp namens <code>Grammar<\/code>, der <code>.parse<\/code> liefert (und dessen Verwandten für Teiltreffer, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben es nie selbst — Sie bekommen es umsonst, genau wie eine gewöhnliche Klasse Methoden von ihrem Elternteil erbt.<\/span><\/p>"]]},"nl":{"t":"Grammatica's zijn klassen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer je <code>grammar<\/code> schrijft, maakt Raku iets wat heel dicht bij een klasse ligt.<\/span> <span class=\"sg\" data-s=\"1\">De tokens zijn er methoden op, en de hele machinerie van <a href=\"https://course.raku.org/nl/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">overerving<\/a> uit het deel over objecten is van toepassing.<\/span> <span class=\"sg\" data-s=\"2\">Dus de ene grammatica kan de andere met <code>is<\/code> uitbreiden, precies als een subklasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> erft <code>TOP<\/code> van <code>Base<\/code> maar levert een eigen <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer <code>Loud<\/code> ontleedt, roept haar <code>TOP<\/code> <code>&lt;greeting&gt;<\/code> aan, en wordt het overschrijvende token in <code>Loud<\/code> gebruikt — precies zoals een overschreven methode op objecten werkt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit maakt grammatica's samenstelbaar.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een algemene grammatica voor een formaat schrijven en daarna een gespecialiseerde versie afleiden die alleen de tokens verandert die verschillen, zonder de rest te kopiëren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zelfs de <code>.parse<\/code> die je steeds aanroept komt uit dit klassekarakter voort: elke grammatica erft automatisch van een ingebouwd basistype dat <code>Grammar<\/code> heet, dat <code>.parse<\/code> levert (en zijn neef voor gedeeltelijke matches, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft die nooit zelf — je krijgt hem gratis, net zoals een gewone klasse methoden van haar ouder erft.<\/span><\/p>"]]},"es":{"t":"Las gramáticas son clases","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando escribes <code>grammar<\/code>, Raku crea algo muy parecido a una clase.<\/span> <span class=\"sg\" data-s=\"1\">Los tokens son métodos suyos, y se aplica toda la maquinaria de la <a href=\"https://course.raku.org/es/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">herencia<\/a> de la parte sobre objetos.<\/span> <span class=\"sg\" data-s=\"2\">Así que una gramática puede extender a otra con <code>is<\/code>, igual que una subclase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> hereda <code>TOP<\/code> de <code>Base<\/code> pero aporta su propio <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cuando <code>Loud<\/code> analiza, su <code>TOP<\/code> llama a <code>&lt;greeting&gt;<\/code>, y se usa el token sobrescrito de <code>Loud<\/code>, exactamente como funciona un método sobrescrito en los objetos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto hace componibles a las gramáticas.<\/span> <span class=\"sg\" data-s=\"1\">Puedes escribir una gramática general para un formato y derivar después una versión especializada que cambie solo los tokens que difieren, sin copiar el resto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Incluso el <code>.parse<\/code> que no dejas de llamar viene de esta naturaleza de clase: toda gramática hereda automáticamente de un tipo base incorporado llamado <code>Grammar<\/code>, que aporta <code>.parse<\/code> (y su primo de coincidencia parcial, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Nunca lo escribes tú: te llega gratis, igual que una clase ordinaria hereda métodos de su padre.<\/span><\/p>"]]},"it":{"t":"Le grammatiche sono classi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando scrivi <code>grammar<\/code>, Raku crea qualcosa di molto vicino a una classe.<\/span> <span class=\"sg\" data-s=\"1\">I token sono metodi su di essa, e vale tutto il meccanismo dell'<a href=\"https://course.raku.org/it/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">ereditarietà<\/a> della parte sugli oggetti.<\/span> <span class=\"sg\" data-s=\"2\">Quindi una grammatica può estenderne un'altra con <code>is<\/code>, proprio come una sottoclasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> eredita <code>TOP<\/code> da <code>Base<\/code> ma fornisce il proprio <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quando <code>Loud<\/code> analizza, il suo <code>TOP<\/code> chiama <code>&lt;greeting&gt;<\/code>, e viene usato il token sovrascritto in <code>Loud<\/code> — esattamente come funziona un metodo sovrascritto sugli oggetti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo rende componibili le grammatiche.<\/span> <span class=\"sg\" data-s=\"1\">Puoi scrivere una grammatica generale per un formato e poi derivarne una versione specializzata che cambia solo i token diversi, senza copiare il resto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Persino il <code>.parse<\/code> che continui a chiamare viene da questa natura di classe: ogni grammatica eredita automaticamente da un tipo base incorporato chiamato <code>Grammar<\/code>, che fornisce <code>.parse<\/code> (e il suo cugino a corrispondenza parziale, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Non lo scrivi mai tu: ti arriva gratis, proprio come una classe ordinaria eredita i metodi dalla propria genitrice.<\/span><\/p>"]]},"ru":{"t":"Грамматики — это классы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда вы пишете <code>grammar<\/code>, Raku создаёт нечто очень близкое к классу.<\/span> <span class=\"sg\" data-s=\"1\">Токены — это его методы, и к ним применима вся механика <a href=\"https://course.raku.org/ru/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">наследования<\/a> из части об объектах.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому одна грамматика может расширять другую через <code>is<\/code>, точно как подкласс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> наследует <code>TOP<\/code> от <code>Base<\/code>, но предоставляет собственный <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Когда разбирает <code>Loud<\/code>, её <code>TOP<\/code> вызывает <code>&lt;greeting&gt;<\/code> — и используется переопределяющий токен из <code>Loud<\/code>, ровно так же, как работает переопределённый метод у объектов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это делает грамматики компонуемыми.<\/span> <span class=\"sg\" data-s=\"1\">Можно написать общую грамматику для формата, а затем вывести из неё специализированный вариант, меняющий только те токены, которые отличаются, не переписывая остального.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Даже тот <code>.parse<\/code>, который вы постоянно вызываете, происходит из этой классовой природы: всякая грамматика автоматически наследует от встроенного базового типа <code>Grammar<\/code>, который и даёт <code>.parse<\/code> (а также его родственника для частичного совпадения, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Вы никогда не пишете его сами — он достаётся вам даром, как обычный класс получает методы от родителя.<\/span><\/p>"]]},"uk":{"t":"Граматики — це класи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли ви пишете <code>grammar<\/code>, Raku створює щось дуже близьке до класу.<\/span> <span class=\"sg\" data-s=\"1\">Токени є його методами, і до нього застосовується вся механіка <a href=\"https://course.raku.org/uk/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">успадкування<\/a> з частини про об'єкти.<\/span> <span class=\"sg\" data-s=\"2\">Тож одна граматика може розширювати іншу за допомогою <code>is<\/code>, точно як підклас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> успадковує <code>TOP<\/code> від <code>Base<\/code>, але надає власний <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Коли <code>Loud<\/code> розбирає текст, його <code>TOP<\/code> викликає <code>&lt;greeting&gt;<\/code>, і використовується токен, перевизначений у <code>Loud<\/code>, — точно так, як працює перевизначений метод на об'єктах.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це робить граматики компонованими.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете написати загальну граматику для формату, а потім вивести спеціалізовану версію, що змінює лише ті токени, які відрізняються, не копіюючи решту.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Навіть <code>.parse<\/code>, який ви весь час викликаєте, походить із цієї класової природи: кожна граматика автоматично успадковує вбудований базовий тип <code>Grammar<\/code>, який надає <code>.parse<\/code> (і його родича для часткового зіставлення, <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Ви ніколи не пишете його самі — ви отримуєте його задарма, так само як звичайний клас успадковує методи від свого батька.<\/span><\/p>"]]},"bg":{"t":"Граматиките са класове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато напишете <code>grammar<\/code>, Raku създава нещо много близко до клас.<\/span> <span class=\"sg\" data-s=\"1\">Токените са методи върху него и към него важи цялата машинария на <a href=\"https://course.raku.org/bg/oop/inheritance/\" target=\"_blank\" rel=\"noopener\">наследяването<\/a> от частта за обектите.<\/span> <span class=\"sg\" data-s=\"2\">Затова една граматика може да разширява друга с <code>is<\/code>, също като подклас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Base {\n    token TOP      { &lt;greeting&gt; }\n    token greeting { 'hi' }\n}\n\ngrammar Loud is Base {\n    token greeting { 'HI' }\n}\n\nsay Loud.parse('HI').defined; # True\nsay Base.parse('hi').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Loud<\/code> наследява <code>TOP<\/code> от <code>Base<\/code>, но предоставя свой собствен <code>greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Когато <code>Loud<\/code> разбира текст, неговият <code>TOP<\/code> извиква <code>&lt;greeting&gt;<\/code> и се използва предефиниращият токен в <code>Loud<\/code> — точно както работи предефиниран метод върху обекти.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това прави граматиките компонуеми.<\/span> <span class=\"sg\" data-s=\"1\">Можете да напишете обща граматика за даден формат, а после да изведете специализирана версия, която променя само онези токени, които се различават, без да преписвате останалото.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дори <code>.parse<\/code>, който постоянно извиквате, идва от тази класова природа: всяка граматика автоматично наследява вградения базов тип <code>Grammar<\/code>, който предоставя <code>.parse<\/code> (и роднината му за частично съпоставяне <code>.subparse<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Никога не го пишете сами — получавате го безплатно, точно както обикновен клас наследява методи от родителя си.<\/span><\/p>"]]}}}</script>
