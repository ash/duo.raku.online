<script type="application/json" id="page-data">{"u":"regexes/grammar-inheritance/proto-tokens","n":1129,"k":"topic","pv":"regexes/grammar-inheritance/grammars-are-classes/quiz","nx":"regexes/grammar-inheritance/proto-tokens/quiz","tr":["regexes","regexes/grammar-inheritance"],"L":{"en":{"t":"Proto tokens and alternation","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sometimes one concept has several forms — a number might be an integer or a decimal.<\/span> <span class=\"sg\" data-s=\"1\">You could write an alternation with <code>|<\/code>, but grammars offer a tidier way: a <em>proto token<\/em> with named variants.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Declare the umbrella token as <code>proto token<\/code>, then write each variant as <code>token name:sym&lt;label&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>proto token number {*}<\/code> line says “a <code>number<\/code> is one of the variants below”.<\/span> <span class=\"sg\" data-s=\"1\">Each variant carries a <code>:sym&lt;…&gt;<\/code> label that names it.<\/span> <span class=\"sg\" data-s=\"2\">When the grammar needs a <code>&lt;number&gt;<\/code>, it tries the variants and, by longest-token matching, picks the one that fits — <code>int<\/code> for <code>42<\/code>, <code>float<\/code> for <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proto tokens read better than a long chain of <code>|<\/code> alternatives, and the <code>:sym&lt;…&gt;<\/code> labels give each case a name you can act on later when you attach meaning to the parse.<\/span> <span class=\"sg\" data-s=\"1\">They are the idiomatic way to express “one of these kinds” in a grammar.<\/span><\/p>"]]},"de":{"t":"Prototokens und Alternation","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal hat ein Begriff mehrere Formen — eine Zahl kann eine ganze Zahl oder eine Dezimalzahl sein.<\/span> <span class=\"sg\" data-s=\"1\">Sie könnten eine Alternation mit <code>|<\/code> schreiben, doch Grammatiken bieten einen ordentlicheren Weg: ein <em>Prototoken<\/em> mit benannten Spielarten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deklarieren Sie das übergeordnete Token als <code>proto token<\/code> und schreiben Sie dann jede Spielart als <code>token name:sym&lt;label&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Zeile <code>proto token number {*}<\/code> sagt: „ein <code>number<\/code> ist eine der Spielarten unten“.<\/span> <span class=\"sg\" data-s=\"1\">Jede Spielart trägt ein Etikett <code>:sym&lt;…&gt;<\/code>, das sie benennt.<\/span> <span class=\"sg\" data-s=\"2\">Braucht die Grammatik ein <code>&lt;number&gt;<\/code>, probiert sie die Spielarten und wählt per longest-token matching diejenige, die passt — <code>int<\/code> für <code>42<\/code>, <code>float<\/code> für <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prototokens lesen sich besser als eine lange Kette von <code>|<\/code>-Alternativen, und die Etiketten <code>:sym&lt;…&gt;<\/code> geben jedem Fall einen Namen, auf den Sie später eingehen können, wenn Sie der Zerlegung Bedeutung geben.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind die idiomatische Art, „eine dieser Arten“ in einer Grammatik auszudrücken.<\/span><\/p>"]]},"nl":{"t":"Prototokens en alternatie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms heeft één begrip meerdere vormen — een getal kan een geheel getal of een decimaal getal zijn.<\/span> <span class=\"sg\" data-s=\"1\">Je zou een alternatie met <code>|<\/code> kunnen schrijven, maar grammatica's bieden een nettere manier: een <em>prototoken<\/em> met benoemde varianten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Declareer het overkoepelende token als <code>proto token<\/code> en schrijf daarna elke variant als <code>token naam:sym&lt;label&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De regel <code>proto token number {*}<\/code> zegt \"een <code>number<\/code> is een van de onderstaande varianten\".<\/span> <span class=\"sg\" data-s=\"1\">Elke variant draagt een label <code>:sym&lt;…&gt;<\/code> dat haar een naam geeft.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer de grammatica een <code>&lt;number&gt;<\/code> nodig heeft, probeert ze de varianten en kiest ze via longest-token matching degene die past — <code>int<\/code> voor <code>42<\/code>, <code>float<\/code> voor <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prototokens lezen beter dan een lange keten <code>|<\/code>-alternatieven, en de labels <code>:sym&lt;…&gt;<\/code> geven elk geval een naam waarop je later kunt inspelen wanneer je betekenis aan de parse hangt.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn de idiomatische manier om \"een van deze soorten\" in een grammatica uit te drukken.<\/span><\/p>"]]},"es":{"t":"Tokens proto y alternativas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A veces un concepto tiene varias formas: un número puede ser un entero o un decimal.<\/span> <span class=\"sg\" data-s=\"1\">Podrías escribir una alternativa con <code>|<\/code>, pero las gramáticas ofrecen una manera más ordenada: un <em>proto token<\/em> con variantes con nombre.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Declara el token paraguas como <code>proto token<\/code> y después escribe cada variante como <code>token nombre:sym&lt;etiqueta&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La línea <code>proto token number {*}<\/code> dice «un <code>number<\/code> es una de las variantes de abajo».<\/span> <span class=\"sg\" data-s=\"1\">Cada variante lleva una etiqueta <code>:sym&lt;…&gt;<\/code> que la nombra.<\/span> <span class=\"sg\" data-s=\"2\">Cuando la gramática necesita un <code>&lt;number&gt;<\/code>, prueba las variantes y, por emparejamiento del token más largo, elige la que encaja: <code>int<\/code> para <code>42<\/code>, <code>float<\/code> para <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los proto tokens se leen mejor que una larga cadena de alternativas con <code>|<\/code>, y las etiquetas <code>:sym&lt;…&gt;<\/code> dan a cada caso un nombre sobre el que podrás actuar más adelante, cuando adjuntes significado al análisis.<\/span> <span class=\"sg\" data-s=\"1\">Son la manera idiomática de expresar «una de estas clases» en una gramática.<\/span><\/p>"]]},"it":{"t":"Token proto e alternative","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte un concetto ha più forme — un numero potrebbe essere un intero o un decimale.<\/span> <span class=\"sg\" data-s=\"1\">Potresti scrivere un'alternativa con <code>|<\/code>, ma le grammatiche offrono un modo più ordinato: un <em>proto token<\/em> con varianti con nome.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dichiara il token ombrello come <code>proto token<\/code>, poi scrivi ogni variante come <code>token nome:sym&lt;etichetta&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La riga <code>proto token number {*}<\/code> dice «un <code>number<\/code> è una delle varianti qui sotto».<\/span> <span class=\"sg\" data-s=\"1\">Ogni variante porta un'etichetta <code>:sym&lt;…&gt;<\/code> che la nomina.<\/span> <span class=\"sg\" data-s=\"2\">Quando la grammatica ha bisogno di un <code>&lt;number&gt;<\/code>, prova le varianti e, con il riconoscimento del token più lungo, sceglie quella che calza — <code>int<\/code> per <code>42<\/code>, <code>float<\/code> per <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I proto token si leggono meglio di una lunga catena di alternative con <code>|<\/code>, e le etichette <code>:sym&lt;…&gt;<\/code> danno a ogni caso un nome su cui potrai agire più tardi, quando attacchi un significato all'analisi.<\/span> <span class=\"sg\" data-s=\"1\">Sono il modo idiomatico di esprimere «uno di questi generi» in una grammatica.<\/span><\/p>"]]},"lv":{"t":"Proto marķieri un alternatīvas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz vienam jēdzienam ir vairākas formas — skaitlis var būt vesels vai decimāls.<\/span> <span class=\"sg\" data-s=\"1\">Varētu uzrakstīt alternatīvu ar <code>|<\/code>, taču gramatikas piedāvā kārtīgāku veidu: <em>proto marķieri<\/em> ar nosauktiem variantiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deklarējiet jumta marķieri kā <code>proto token<\/code> un pēc tam uzrakstiet katru variantu kā <code>token nosaukums:sym&lt;etiķete&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rinda <code>proto token number {*}<\/code> saka: «<code>number<\/code> ir viens no zemāk esošajiem variantiem».<\/span> <span class=\"sg\" data-s=\"1\">Katrs variants nes <code>:sym&lt;…&gt;<\/code> etiķeti, kas to nosauc.<\/span> <span class=\"sg\" data-s=\"2\">Kad gramatikai vajag <code>&lt;number&gt;<\/code>, tā izmēģina variantus un pēc garākā marķiera principa izvēlas to, kurš der, — <code>int<\/code> priekš <code>42<\/code>, <code>float<\/code> priekš <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proto marķieri lasās labāk nekā gara <code>|<\/code> alternatīvu virkne, un <code>:sym&lt;…&gt;<\/code> etiķetes dod katram gadījumam nosaukumu, ar ko vēlāk var rīkoties, kad parsējumam piesaistāt nozīmi.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir raksturīgais veids, kā gramatikā izteikt «viens no šiem veidiem».<\/span><\/p>"]]},"ru":{"t":"Proto-токены и альтернативы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда у одного понятия есть несколько форм: число может быть целым или десятичным.<\/span> <span class=\"sg\" data-s=\"1\">Можно было бы написать альтернативу через <code>|<\/code>, но грамматики предлагают более аккуратный способ — <em>proto-токен<\/em> с именованными вариантами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Объявите зонтичный токен как <code>proto token<\/code>, а затем запишите каждый вариант как <code>token имя:sym&lt;метка&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Строка <code>proto token number {*}<\/code> говорит: «<code>number<\/code> — это один из вариантов ниже».<\/span> <span class=\"sg\" data-s=\"1\">Каждый вариант несёт метку <code>:sym&lt;…&gt;<\/code>, которая его называет.<\/span> <span class=\"sg\" data-s=\"2\">Когда грамматике нужен <code>&lt;number&gt;<\/code>, она пробует варианты и по правилу самого длинного токена выбирает подходящий: <code>int<\/code> для <code>42<\/code>, <code>float<\/code> для <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proto-токены читаются лучше, чем длинная цепочка альтернатив через <code>|<\/code>, а метки <code>:sym&lt;…&gt;<\/code> дают каждому случаю имя, на которое можно опереться позже, когда вы будете придавать разбору смысл.<\/span> <span class=\"sg\" data-s=\"1\">Это идиоматический способ выразить в грамматике «одно из вот таких».<\/span><\/p>"]]},"uk":{"t":"Прототокени та альтернатива","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Інколи одне поняття має кілька форм — число може бути цілим або десятковим.<\/span> <span class=\"sg\" data-s=\"1\">Ви могли б записати альтернативу через <code>|<\/code>, але граматики пропонують охайніший спосіб: <em>прототокен<\/em> з іменованими варіантами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оголосіть загальний токен як <code>proto token<\/code>, а потім запишіть кожен варіант як <code>token name:sym&lt;мітка&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Рядок <code>proto token number {*}<\/code> каже: «<code>number<\/code> — це один із варіантів нижче».<\/span> <span class=\"sg\" data-s=\"1\">Кожен варіант несе мітку <code>:sym&lt;…&gt;<\/code>, що дає йому ім'я.<\/span> <span class=\"sg\" data-s=\"2\">Коли граматиці потрібен <code>&lt;number&gt;<\/code>, вона пробує варіанти й за правилом найдовшого токена обирає той, що підходить: <code>int<\/code> для <code>42<\/code>, <code>float<\/code> для <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прототокени читаються краще, ніж довгий ланцюжок альтернатив через <code>|<\/code>, а мітки <code>:sym&lt;…&gt;<\/code> дають кожному випадку ім'я, на яке можна зважати пізніше, коли ви прикріплюватимете до розбору семантику.<\/span> <span class=\"sg\" data-s=\"1\">Це ідіоматичний спосіб виразити «один із цих різновидів» у граматиці.<\/span><\/p>"]]},"bg":{"t":"Прототокени и алтернатива","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога едно понятие има няколко форми — числото може да е цяло или десетично.<\/span> <span class=\"sg\" data-s=\"1\">Бихте могли да запишете алтернатива с <code>|<\/code>, но граматиките предлагат по-подреден начин: <em>прототокен<\/em> с именувани варианти.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Декларирайте обединяващия токен като <code>proto token<\/code>, а после запишете всеки вариант като <code>token име:sym&lt;етикет&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Number {\n    token TOP { &lt;number&gt; }\n\n    proto token number {*}\n    token number:sym&lt;int&gt;   { \\d+ }\n    token number:sym&lt;float&gt; { \\d+ '.' \\d+ }\n}\n\nsay Number.parse('42').defined;   # True\nsay Number.parse('3.14').defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Редът <code>proto token number {*}<\/code> казва „<code>number<\/code> е един от вариантите по-долу“.<\/span> <span class=\"sg\" data-s=\"1\">Всеки вариант носи етикет <code>:sym&lt;…&gt;<\/code>, който го именува.<\/span> <span class=\"sg\" data-s=\"2\">Когато на граматиката ѝ трябва <code>&lt;number&gt;<\/code>, тя опитва вариантите и по правилото за най-дълъг токен избира онзи, който приляга — <code>int<\/code> за <code>42<\/code>, <code>float<\/code> за <code>3.14<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прототокените се четат по-добре от дълга верига от алтернативи с <code>|<\/code>, а етикетите <code>:sym&lt;…&gt;<\/code> дават на всеки случай име, на което можете да реагирате по-късно, когато прикачвате семантика към разбора.<\/span> <span class=\"sg\" data-s=\"1\">Те са идиоматичният начин да изразите „един от тези видове“ в граматика.<\/span><\/p>"]]}}}</script>
