<script type="application/json" id="page-data">{"u":"regexes/grammar-inheritance/exercises/proto-bool/solution","n":1137,"k":"solution","pv":"regexes/grammar-inheritance/exercises/proto-bool","nx":"regexes/make-and-made","tr":["regexes","regexes/grammar-inheritance"],"L":{"en":{"t":"The solution of ’A boolean with proto‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The proto token <code>bool<\/code> has two named variants, <code>true<\/code> and <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Each parse selects the matching variant, so both <code>'true'<\/code> and <code>'false'<\/code> succeed. A proto token is the grammar's tidy way of saying “one of these named alternatives”.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> matches neither variant, so there is nothing for the proto token to dispatch to and the parse fails — <code>False<\/code>. The proto accepts exactly the alternatives you list, and nothing else.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein Wahrheitswert mit proto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Prototoken <code>bool<\/code> hat zwei benannte Spielarten, <code>true<\/code> und <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jede Zerlegung wählt die passende Spielart, sowohl <code>'true'<\/code> als auch <code>'false'<\/code> gelingt also. Ein Prototoken ist die ordentliche Art einer Grammatik zu sagen: „eine dieser benannten Alternativen“.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> trifft keine der beiden Spielarten, das Prototoken hat also nichts, wohin es weiterreichen könnte, und das Zerlegen scheitert — <code>False<\/code>. Die Proto nimmt genau die Alternativen an, die Sie aufführen, und sonst nichts.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een boolean met proto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het prototoken <code>bool<\/code> heeft twee benoemde varianten, <code>true<\/code> en <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Elke parse kiest de passende variant, dus slagen zowel <code>'true'<\/code> als <code>'false'<\/code>. Een prototoken is de nette manier waarop een grammatica zegt \"een van deze benoemde alternatieven\".<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> matcht geen van beide varianten, dus is er niets waar het prototoken naartoe kan verwijzen en mislukt de parse — <code>False<\/code>. De proto aanvaardt precies de alternatieven die je opsomt, en niets anders.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un booleano con proto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El proto token <code>bool<\/code> tiene dos variantes con nombre, <code>true<\/code> y <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cada análisis elige la variante que coincide, así que funcionan tanto <code>'true'<\/code> como <code>'false'<\/code>. Un proto token es la manera ordenada que tiene una gramática de decir «una de estas alternativas con nombre».<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> no coincide con ninguna variante, así que el proto token no tiene a quién delegar y el análisis falla: <code>False<\/code>. El proto acepta exactamente las alternativas que enumeras, y ninguna más.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un booleano con proto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il proto token <code>bool<\/code> ha due varianti con nome, <code>true<\/code> e <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ogni analisi sceglie la variante che corrisponde, quindi riescono sia <code>'true'<\/code> sia <code>'false'<\/code>. Un proto token è il modo ordinato in cui una grammatica dice «una di queste alternative con nome».<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> non corrisponde ad alcuna variante, quindi il proto token non ha nulla a cui affidare il lavoro e l'analisi fallisce — <code>False<\/code>. Il proto accetta esattamente le alternative che elenchi, e nient'altro.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Булево значение с proto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У proto-токена <code>bool<\/code> два именованных варианта: <code>true<\/code> и <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Каждый разбор выбирает подходящий вариант, поэтому и <code>'true'<\/code>, и <code>'false'<\/code> проходят успешно. Proto-токен — принятый в грамматиках аккуратный способ сказать «одна из вот этих именованных альтернатив».<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> не подходит ни под один вариант, поэтому proto-токену не на что диспетчеризовать и разбор не удаётся — <code>False<\/code>. Proto принимает ровно те альтернативы, которые вы перечислили, и ничего сверх того.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Булеве значення через proto»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Прототокен <code>bool<\/code> має два іменовані варіанти: <code>true<\/code> та <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кожен розбір обирає відповідний варіант, тож і <code>'true'<\/code>, і <code>'false'<\/code> успішні. Прототокен — це охайний граматичний спосіб сказати «одна з цих іменованих альтернатив».<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> не збігається з жодним варіантом, тож прототокенові немає куди диспетчеризувати, і розбір зазнає невдачі — <code>False<\/code>. Прото приймає рівно ті альтернативи, які ви перелічили, і нічого більше.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Булева стойност с proto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Bool {\n    token TOP { &lt;bool&gt; }\n\n    proto token bool {*}\n    token bool:sym&lt;true&gt;  { 'true' }\n    token bool:sym&lt;false&gt; { 'false' }\n}\n\nsay Bool.parse('true').defined;\nsay Bool.parse('false').defined;\nsay Bool.parse('unknown').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/proto-bool.raku\" target=\"_blank\" rel=\"noopener\">proto-bool.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Прототокенът <code>bool<\/code> има два именувани варианта — <code>true<\/code> и <code>false<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всеки разбор избира съответстващия вариант, така че и <code>'true'<\/code>, и <code>'false'<\/code> успяват. Прототокенът е подреденият граматичен начин да се каже „една от тези именувани възможности“.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'unknown'<\/code> не съвпада с нито един вариант, така че прототокенът няма към какво да диспечира и разборът се проваля — <code>False<\/code>. Прото приема точно онези възможности, които сте изброили, и нищо друго.<\/span><\/li><\/ol>"]]}}}</script>
