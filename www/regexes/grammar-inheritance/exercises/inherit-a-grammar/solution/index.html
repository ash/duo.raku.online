<script type="application/json" id="page-data">{"u":"regexes/grammar-inheritance/exercises/inherit-a-grammar/solution","n":1133,"k":"solution","pv":"regexes/grammar-inheritance/exercises/inherit-a-grammar","nx":"regexes/grammar-inheritance/exercises/proto-number","tr":["regexes","regexes/grammar-inheritance"],"L":{"en":{"t":"The solution of ’Inherit a grammar‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both <code>Dog is Animal<\/code> and <code>Cat is Animal<\/code> inherit the <code>TOP<\/code> token from the base unchanged; each supplies only its own <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">So one base grammar is extended two different ways. <code>Dog<\/code> matches only <code>woof<\/code> and <code>Cat<\/code> only <code>meow<\/code> — which is why <code>Dog.parse('meow')<\/code> fails: a dog keeps its own overridden <code>sound<\/code>, exactly as overridden methods behave on objects.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Erben Sie eine Grammatik","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sowohl <code>Dog is Animal<\/code> als auch <code>Cat is Animal<\/code> erbt das Token <code>TOP<\/code> unverändert von der Basis; jede liefert nur ihr eigenes <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">So wird eine Basisgrammatik auf zwei verschiedene Weisen erweitert. <code>Dog<\/code> trifft nur <code>woof<\/code> und <code>Cat<\/code> nur <code>meow<\/code> — weshalb <code>Dog.parse('meow')<\/code> scheitert: Ein Hund behält sein eigenes überschriebenes <code>sound<\/code>, genau wie sich überschriebene Methoden auf Objekten verhalten.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Erf een grammatica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Zowel <code>Dog is Animal<\/code> als <code>Cat is Animal<\/code> erft het token <code>TOP<\/code> ongewijzigd van de basis; elk levert alleen zijn eigen <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Zo wordt één basisgrammatica op twee verschillende manieren uitgebreid. <code>Dog<\/code> matcht alleen <code>woof<\/code> en <code>Cat<\/code> alleen <code>meow<\/code> — en daarom mislukt <code>Dog.parse('meow')<\/code>: een hond houdt zijn eigen overschreven <code>sound<\/code>, precies zoals overschreven methoden zich op objecten gedragen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Herede una gramática","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tanto <code>Dog is Animal<\/code> como <code>Cat is Animal<\/code> heredan sin cambios el token <code>TOP<\/code> de la base; cada una aporta solo su propio <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Así, una sola gramática base se extiende de dos maneras distintas. <code>Dog<\/code> empareja solo <code>woof<\/code> y <code>Cat<\/code> solo <code>meow<\/code>, y por eso <code>Dog.parse('meow')<\/code> falla: un perro conserva su propio <code>sound<\/code> sobrescrito, exactamente como se comportan los métodos sobrescritos en los objetos.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Ereditate una grammatica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sia <code>Dog is Animal<\/code> sia <code>Cat is Animal<\/code> ereditano immutato il token <code>TOP<\/code> dalla base; ciascuna fornisce solo il proprio <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Così un'unica grammatica base viene estesa in due modi diversi. <code>Dog<\/code> riconosce solo <code>woof<\/code> e <code>Cat<\/code> solo <code>meow<\/code> — ed è per questo che <code>Dog.parse('meow')<\/code> fallisce: un cane conserva il proprio <code>sound<\/code> sovrascritto, esattamente come si comportano i metodi sovrascritti sugli oggetti.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Mantojiet gramatiku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gan <code>Dog is Animal<\/code>, gan <code>Cat is Animal<\/code> manto marķieri <code>TOP<\/code> no bāzes nemainītu; katra nodrošina tikai savu <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tātad viena bāzes gramatika ir paplašināta divos dažādos veidos. <code>Dog<\/code> piemeklē tikai <code>woof<\/code>, bet <code>Cat<\/code> tikai <code>meow<\/code> — un tieši tāpēc <code>Dog.parse('meow')<\/code> neizdodas: suns patur savu pārrakstīto <code>sound<\/code>, tieši tāpat kā uz objektiem uzvedas pārrakstītas metodes.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Унаследуйте грамматику","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Dog is Animal<\/code>, и <code>Cat is Animal<\/code> наследуют токен <code>TOP<\/code> от базовой грамматики без изменений; каждая предоставляет только собственный <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Так одна базовая грамматика расширяется двумя разными способами. <code>Dog<\/code> сопоставляет только <code>woof<\/code>, а <code>Cat<\/code> — только <code>meow<\/code>; поэтому <code>Dog.parse('meow')<\/code> и не срабатывает: собака держится собственного переопределённого <code>sound<\/code> — ровно так же, как ведут себя переопределённые методы у объектов.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Успадкуйте граматику»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І <code>Dog is Animal<\/code>, і <code>Cat is Animal<\/code> успадковують токен <code>TOP<\/code> від базової граматики без змін; кожна надає лише власний <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тож одну базову граматику розширено двома різними способами. <code>Dog<\/code> зіставляється лише з <code>woof<\/code>, а <code>Cat<\/code> — лише з <code>meow<\/code>; саме тому <code>Dog.parse('meow')<\/code> зазнає невдачі: собака зберігає власний перевизначений <code>sound<\/code>, рівно так, як поводяться перевизначені методи на об'єктах.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Наследете граматика","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Animal {\n    token TOP   { &lt;sound&gt; }\n    token sound { \\w+ }\n}\n\ngrammar Dog is Animal {\n    token sound { 'woof' }\n}\n\ngrammar Cat is Animal {\n    token sound { 'meow' }\n}\n\nsay Dog.parse('woof').defined;\nsay Cat.parse('meow').defined;\nsay Dog.parse('meow').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/grammar-inheritance/inherit-a-grammar.raku\" target=\"_blank\" rel=\"noopener\">inherit-a-grammar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Dog is Animal<\/code>, и <code>Cat is Animal<\/code> наследяват токена <code>TOP<\/code> от базовата граматика непроменен; всяка предоставя само собствения си <code>sound<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Така една базова граматика е разширена по два различни начина. <code>Dog<\/code> съпоставя само <code>woof<\/code>, а <code>Cat<\/code> — само <code>meow<\/code>; именно затова <code>Dog.parse('meow')<\/code> се проваля: кучето пази собствения си предефиниран <code>sound<\/code>, точно както се държат предефинираните методи върху обекти.<\/span><\/li><\/ol>"]]}}}</script>
