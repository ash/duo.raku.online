<script type="application/json" id="page-data">{"u":"regexes/alternations/alternation","n":1027,"k":"topic","pv":"regexes/alternations","nx":"regexes/alternations/alternation/quiz","tr":["regexes","regexes/alternations"],"L":{"en":{"t":"Alternation","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Separate two or more alternatives with a vertical bar <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The pattern matches if <strong>any<\/strong> of them matches:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The pattern tried <code>yes<\/code> and <code>no<\/code>; the string contains <code>no<\/code>, so that is what matched.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can list as many alternatives as you like:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alternatives can be any sub-pattern, not just literal words — they may contain character classes, quantifiers, and captures.<\/span> <span class=\"sg\" data-s=\"1\">To keep an alternation together inside a larger pattern, group it with square brackets <code>[ ]<\/code>, which <a href=\"/regexes/captures/non-capturing/\">group <strong>without<\/strong> capturing<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here the alternation <code>cat | dog<\/code> is one unit, and it must be followed by <code>house<\/code>.<\/span><\/p>"]]},"de":{"t":"Alternation","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Trennen Sie zwei oder mehr Alternativen durch einen senkrechten Strich <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das Muster trifft, wenn <strong>eine<\/strong> von ihnen trifft:<\/span><\/p>"],["code",0,"<pre class=\"l sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alternatieven kunnen elk deelpatroon zijn, niet alleen letterlijke woorden — ze mogen tekenklassen, kwantoren en captures bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Om een alternatie binnen een groter patroon bij elkaar te houden, groepeer je haar met vierkante haken <code>[ ]<\/code>, die <a href=\"https://course.raku.org/nl/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">groeperen <strong>zonder<\/strong> te capturen<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is de alternatie <code>cat | dog<\/code> één eenheid, en die moet door <code>house<\/code> gevolgd worden.<\/span><\/p>"]]},"es":{"t":"Alternativa","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Separa dos o más alternativas con una barra vertical <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El patrón coincide si coincide <strong>alguna<\/strong> de ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El patrón probó <code>yes<\/code> y <code>no<\/code>; la cadena contiene <code>no<\/code>, así que eso es lo que coincidió.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes enumerar tantas alternativas como quieras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las alternativas pueden ser cualquier subpatrón, no solo palabras literales: pueden contener clases de caracteres, cuantificadores y capturas.<\/span> <span class=\"sg\" data-s=\"1\">Para mantener unida una alternativa dentro de un patrón mayor, agrúpala con corchetes <code>[ ]<\/code>, que <a href=\"https://course.raku.org/es/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">agrupan <strong>sin<\/strong> capturar<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí la alternativa <code>cat | dog<\/code> es una sola unidad, y debe ir seguida de <code>house<\/code>.<\/span><\/p>"]]},"it":{"t":"Alternativa","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Separa due o più alternative con una barra verticale <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo schema corrisponde se corrisponde <strong>una qualunque<\/strong> di esse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo schema ha provato <code>yes<\/code> e <code>no<\/code>; la stringa contiene <code>no<\/code>, quindi è quello che ha corrisposto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi elencare quante alternative vuoi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le alternative possono essere qualunque sottoschema, non solo parole letterali: possono contenere classi di caratteri, quantificatori e catture.<\/span> <span class=\"sg\" data-s=\"1\">Per tenere insieme un'alternativa dentro uno schema più grande, raggruppala con le parentesi quadre <code>[ ]<\/code>, che <a href=\"https://course.raku.org/it/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">raggruppano <strong>senza<\/strong> catturare<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui l'alternativa <code>cat | dog<\/code> è un'unica unità, e deve essere seguita da <code>house<\/code>.<\/span><\/p>"]]},"lv":{"t":"Alternatīva","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Atdaliet divas vai vairākas alternatīvas ar vertikālu svītru <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raksturs sakrīt, ja sakrīt <strong>kaut viena<\/strong> no tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raksturs izmēģināja <code>yes<\/code> un <code>no<\/code>; virkne satur <code>no<\/code>, tāpēc tas arī sakrita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alternatīvu var uzskaitīt tik, cik vēlaties:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alternatīvas var būt jebkurš apakšraksturs, ne tikai burtiski vārdi — tajās var būt rakstzīmju klases, kvantori un tvērumi.<\/span> <span class=\"sg\" data-s=\"1\">Lai alternatīvu noturētu kopā lielāka raksturā iekšienē, sagrupējiet to ar kvadrātiekavām <code>[ ]<\/code>, kas <a href=\"https://course.raku.org/lv/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">grupē <strong>bez<\/strong> tveršanas<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit alternatīva <code>cat | dog<\/code> ir viena vienība, un tai jāseko <code>house<\/code>.<\/span><\/p>"]]},"ru":{"t":"Альтернатива","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Разделите два или более варианта вертикальной чертой <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Шаблон совпадает, если совпадает <strong>любой<\/strong> из них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон попробовал <code>yes<\/code> и <code>no<\/code>; в строке есть <code>no<\/code>, оно и совпало.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вариантов можно перечислить сколько угодно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вариантами может быть любой подшаблон, а не только буквальные слова: в них могут входить классы символов, квантификаторы и захваты.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы удержать альтернативу как единое целое внутри большего шаблона, сгруппируйте её квадратными скобками <code>[ ]<\/code>, которые <a href=\"https://course.raku.org/ru/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">группируют <strong>без<\/strong> захвата<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь альтернатива <code>cat | dog<\/code> — одна единица, за которой должно следовать <code>house<\/code>.<\/span><\/p>"]]},"uk":{"t":"Альтернатива","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Розділіть дві чи більше альтернатив вертикальною рискою <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Шаблон збігається, якщо збігається <strong>будь-яка<\/strong> з них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон спробував <code>yes<\/code> і <code>no<\/code>; рядок містить <code>no<\/code>, тож саме це й збіглося.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перелічити можна скільки завгодно альтернатив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Альтернативами може бути будь-який підшаблон, а не лише літеральні слова: вони можуть містити класи символів, квантифікатори й захоплення.<\/span> <span class=\"sg\" data-s=\"1\">Щоб утримати альтернативу вкупі всередині більшого шаблону, згрупуйте її квадратними дужками <code>[ ]<\/code>, які <a href=\"https://course.raku.org/uk/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">групують <strong>без<\/strong> захоплення<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут альтернатива <code>cat | dog<\/code> є однією одиницею, за якою має йти <code>house<\/code>.<\/span><\/p>"]]},"bg":{"t":"Алтернатива","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Разделете две или повече възможности с вертикална черта <code>|<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Шаблонът съвпада, ако съвпадне <strong>която и да е<\/strong> от тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'no thanks' ~~ / yes | no /; # ｢no｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблонът опита <code>yes<\/code> и <code>no<\/code>; низът съдържа <code>no<\/code>, така че точно това съвпадна.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да изброите колкото искате възможности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the sky is blue' ~~ / red | green | blue /; # ｢blue｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Възможностите могат да са всякакъв подшаблон, а не само буквални думи — те могат да съдържат класове от знаци, квантификатори и прихващания.<\/span> <span class=\"sg\" data-s=\"1\">За да държите алтернативата заедно вътре в по-голям шаблон, групирайте я с квадратни скоби <code>[ ]<\/code>, които <a href=\"https://course.raku.org/bg/regexes/captures/non-capturing/\" target=\"_blank\" rel=\"noopener\">групират <strong>без<\/strong> прихващане<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'cathouse' ~~ / [ cat | dog ] house /; # ｢cathouse｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук алтернативата <code>cat | dog<\/code> е една единица и след нея трябва да следва <code>house<\/code>.<\/span><\/p>"]]}}}</script>
