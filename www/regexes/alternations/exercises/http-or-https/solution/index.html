> si lega solo all'atomo che lo precede immediatamente — la <code>s<\/code> — non all'intera parola, quindi <code>https?<\/code> si legge come <code>http<\/code> seguito da una <code>s<\/code> facoltativa.<\/span> <span class=\"sg\" data-s=\"1\">Quell'unico schema riconosce sia <code>http<\/code> sia <code>https<\/code>, ed essendo goloso prende la <code>s<\/code> ogni volta che c'è.<\/span><\/p>"]]},"ru":{"t":"Решение: http или https","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'https://example' ~~ / http | https /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/alternations/http-or-https.raku\" target=\"_blank\" rel=\"noopener\">http-or-https.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>｢https｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В начале строки подошли бы и <code>http<\/code>, и <code>https<\/code>, но <code>|<\/code> использует сопоставление по самому длинному токену.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поэтому побеждает более длинное <code>https<\/code>, хотя <code>http<\/code> записан первым.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другой вариант решения<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эти два слова различаются лишь конечной <code>s<\/code>, поэтому вместо альтернативы можно сделать эту <code>s<\/code> необязательной с помощью квантификатора <code>?<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'https://example' ~~ / https? /; # ｢https｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" d
