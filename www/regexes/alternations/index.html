<script type="application/json" id="page-data">{"u":"regexes/alternations","n":1026,"k":"section","pv":"regexes/captures/exercises/initial-and-surname/solution","nx":"regexes/alternations/alternation","tr":["regexes"],"L":{"en":{"t":"Alternations","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An <em>alternation<\/em> lets a pattern match any one of several possibilities — <code>red<\/code> or <code>green<\/code> or <code>blue<\/code>, <code>yes<\/code> or <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is one of the most common things you ask a regex to do.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has two alternation operators: <code>|<\/code>, which picks the <strong>longest<\/strong> match, and <code>||<\/code>, which tries the alternatives in order and takes the <strong>first<\/strong> that matches.<\/span> <span class=\"sg\" data-s=\"1\">This section explains both and when each is the one you want.<\/span><\/p>"]]},"de":{"t":"Alternativen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Alternative<\/em> lässt ein Muster eine von mehreren Möglichkeiten treffen — <code>red<\/code> oder <code>green<\/code> oder <code>blue<\/code>, <code>yes<\/code> oder <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist eines der häufigsten Dinge, um die Sie einen Regex bitten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat zwei Alternativoperatoren: <code>|<\/code>, das den <strong>längsten<\/strong> Treffer wählt, und <code>||<\/code>, das die Alternativen der Reihe nach durchgeht und die <strong>erste<\/strong> nimmt, die trifft.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt erklärt beide und wann welcher der richtige ist.<\/span><\/p>"]]},"nl":{"t":"Alternatieven","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Met een <em>alternatief<\/em> kan een patroon een van meerdere mogelijkheden matchen — <code>red<\/code> of <code>green<\/code> of <code>blue<\/code>, <code>yes<\/code> of <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een van de gewoonste dingen die je een regex vraagt te doen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft twee operatoren voor alternatieven: <code>|<\/code>, die de <strong>langste<\/strong> match kiest, en <code>||<\/code>, die de alternatieven op volgorde probeert en de <strong>eerste<\/strong> neemt die matcht.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie legt beide uit en wanneer je welke wilt.<\/span><\/p>"]]},"es":{"t":"Alternativas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>alternativa<\/em> permite que un patrón empareje cualquiera de varias posibilidades: <code>red<\/code> o <code>green<\/code> o <code>blue<\/code>, <code>yes<\/code> o <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es una de las cosas más comunes que se le piden a un regex.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene dos operadores de alternativa: <code>|<\/code>, que elige la coincidencia <strong>más larga<\/strong>, y <code>||<\/code>, que prueba las alternativas en orden y toma la <strong>primera<\/strong> que coincide.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección explica ambos y cuándo conviene cada uno.<\/span><\/p>"]]},"it":{"t":"Alternative","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un'<em>alternativa<\/em> permette a uno schema di riconoscere una qualunque fra diverse possibilità — <code>red<\/code> o <code>green<\/code> o <code>blue<\/code>, <code>yes<\/code> o <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È una delle cose più comuni che chiedi a un regex di fare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha due operatori di alternativa: <code>|<\/code>, che sceglie la corrispondenza <strong>più lunga<\/strong>, e <code>||<\/code>, che prova le alternative nell'ordine e prende la <strong>prima<\/strong> che corrisponde.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione spiega entrambi e quando ciascuno è quello che vuoi.<\/span><\/p>"]]},"ru":{"t":"Альтернативы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Альтернатива<\/em> позволяет шаблону совпасть с любой из нескольких возможностей — <code>red<\/code>, <code>green<\/code> или <code>blue<\/code>, <code>yes<\/code> или <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это одна из самых частых задач, которые ставят перед регулярным выражением.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku есть два оператора альтернативы: <code>|<\/code>, который выбирает <strong>самое длинное<\/strong> совпадение, и <code>||<\/code>, который перебирает варианты по порядку и берёт <strong>первый<\/strong> подошедший.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе разбираются оба и то, когда какой из них нужен.<\/span><\/p>"]]},"uk":{"t":"Альтернативи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Альтернатива<\/em> дозволяє шаблону зіставитися з будь-якою з кількох можливостей — <code>red<\/code>, <code>green<\/code> чи <code>blue<\/code>, <code>yes<\/code> чи <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це одна з найпоширеніших речей, яких просять від регекса.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku є два оператори альтернативи: <code>|<\/code>, який обирає <strong>найдовший<\/strong> збіг, і <code>||<\/code>, який пробує альтернативи по порядку й бере <strong>першу<\/strong>, що збіглася.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ пояснює обидва й те, коли який із них вам потрібен.<\/span><\/p>"]]},"bg":{"t":"Алтернативи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Алтернативата<\/em> позволява на шаблона да съпостави коя да е от няколко възможности — <code>red<\/code>, или <code>green<\/code>, или <code>blue<\/code>; <code>yes<\/code> или <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е едно от най-честите неща, които искате от регулярния израз.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има два оператора за алтернатива: <code>|<\/code>, който избира <strong>най-дългото<\/strong> съвпадение, и <code>||<\/code>, който опитва алтернативите по ред и взема <strong>първата<\/strong>, която съвпадне.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел обяснява и двата и кога кой ви трябва.<\/span><\/p>"]]}}}</script>
