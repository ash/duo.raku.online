<script type="application/json" id="page-data">{"u":"regexes/alternations/longest-token","n":1029,"k":"topic","pv":"regexes/alternations/alternation/quiz","nx":"regexes/alternations/longest-token/quiz","tr":["regexes","regexes/alternations"],"L":{"en":{"t":"Longest token and first match","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When two alternatives could both match at the same spot, the <code>|<\/code> operator chooses the one that matches the <strong>longest<\/strong> piece of text.<\/span> <span class=\"sg\" data-s=\"1\">This is called <em>longest-token matching<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Even though <code>cat<\/code> is written first and would match, <code>|<\/code> prefers the longer <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sometimes you want the opposite — try the alternatives in the order you wrote them and take the <strong>first<\/strong> one that matches.<\/span> <span class=\"sg\" data-s=\"1\">That is what the double bar <code>||<\/code> does:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now <code>cat<\/code> is tried first and matches, so the engine stops there and never considers <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Use <code>|<\/code> (longest token) when you want the “best” match regardless of order — this is the usual choice, and the one grammars rely on.<\/span> <span class=\"sg\" data-s=\"1\">Use <code>||<\/code> (first match) when the order of the alternatives is meaningful and you want earlier ones to win.<\/span><\/p>"]]},"de":{"t":"Längstes Token und erster Treffer","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn zwei Alternativen an derselben Stelle treffen könnten, wählt der Operator <code>|<\/code> diejenige, die das <strong>längste<\/strong> Stück Text trifft.<\/span> <span class=\"sg\" data-s=\"1\">Das nennt man <em>longest-token matching<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Obwohl <code>cat<\/code> zuerst geschrieben steht und treffen würde, zieht <code>|<\/code> das längere <code>catdog<\/code> vor.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal wollen Sie das Gegenteil — die Alternativen in der geschriebenen Reihenfolge probieren und die <strong>erste<\/strong> nehmen, die trifft.<\/span> <span class=\"sg\" data-s=\"1\">Genau das tut der doppelte Strich <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun wird <code>cat<\/code> zuerst probiert und trifft, die Maschine hält also dort an und zieht <code>catdog<\/code> nie in Betracht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nehmen Sie <code>|<\/code> (längstes Token), wenn Sie unabhängig von der Reihenfolge den „besten“ Treffer wollen — das ist die übliche Wahl und diejenige, auf die sich Grammatiken stützen.<\/span> <span class=\"sg\" data-s=\"1\">Nehmen Sie <code>||<\/code> (erster Treffer), wenn die Reihenfolge der Alternativen bedeutsam ist und frühere gewinnen sollen.<\/span><\/p>"]]},"nl":{"t":"Langste token en eerste match","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer twee alternatieven allebei op dezelfde plek zouden kunnen matchen, kiest de operator <code>|<\/code> degene die het <strong>langste<\/strong> stuk tekst matcht.<\/span> <span class=\"sg\" data-s=\"1\">Dit heet <em>longest-token matching<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ook al staat <code>cat<\/code> eerst en zou het matchen, <code>|<\/code> geeft de voorkeur aan het langere <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms wil je het tegenovergestelde — de alternatieven proberen in de volgorde waarin je ze schreef en de <strong>eerste<\/strong> nemen die matcht.<\/span> <span class=\"sg\" data-s=\"1\">Dat is wat de dubbele streep <code>||<\/code> doet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu wordt <code>cat<\/code> als eerste geprobeerd en matcht het, dus stopt de engine daar en overweegt ze <code>catdog<\/code> nooit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>|<\/code> (langste token) wanneer je de \"beste\" match wilt ongeacht de volgorde — dat is de gewone keuze, en degene waar grammatica's op steunen.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik <code>||<\/code> (eerste match) wanneer de volgorde van de alternatieven betekenisvol is en je wilt dat eerdere winnen.<\/span><\/p>"]]},"es":{"t":"Token más largo y primera coincidencia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando dos alternativas podrían coincidir ambas en el mismo punto, el operador <code>|<\/code> elige la que empareja el fragmento de texto <strong>más largo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">A esto se le llama <em>emparejamiento del token más largo<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aunque <code>cat<\/code> está escrito primero y coincidiría, <code>|<\/code> prefiere el más largo <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A veces quieres lo contrario: probar las alternativas en el orden en que las escribiste y tomar la <strong>primera<\/strong> que coincida.<\/span> <span class=\"sg\" data-s=\"1\">Eso es lo que hace la barra doble <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora <code>cat<\/code> se prueba primero y coincide, así que el motor se detiene ahí y nunca considera <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa <code>|<\/code> (token más largo) cuando quieras la «mejor» coincidencia con independencia del orden; es la elección habitual y aquella en la que se apoyan las gramáticas.<\/span> <span class=\"sg\" data-s=\"1\">Usa <code>||<\/code> (primera coincidencia) cuando el orden de las alternativas sea significativo y quieras que ganen las anteriores.<\/span><\/p>"]]},"it":{"t":"Token più lungo e prima corrispondenza","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando due alternative potrebbero corrispondere entrambe nello stesso punto, l'operatore <code>|<\/code> sceglie quella che riconosce il pezzo di testo <strong>più lungo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Questo si chiama <em>riconoscimento del token più lungo<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anche se <code>cat<\/code> è scritto per primo e corrisponderebbe, <code>|<\/code> preferisce il più lungo <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte vuoi l'opposto: provare le alternative nell'ordine in cui le hai scritte e prendere la <strong>prima<\/strong> che corrisponde.<\/span> <span class=\"sg\" data-s=\"1\">È ciò che fa la doppia barra <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora <code>cat<\/code> viene provato per primo e corrisponde, quindi il motore si ferma lì e non prende mai in considerazione <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa <code>|<\/code> (token più lungo) quando vuoi la corrispondenza «migliore» a prescindere dall'ordine — è la scelta abituale, e quella su cui contano le grammatiche.<\/span> <span class=\"sg\" data-s=\"1\">Usa <code>||<\/code> (prima corrispondenza) quando l'ordine delle alternative è significativo e vuoi che vincano quelle precedenti.<\/span><\/p>"]]},"lv":{"t":"Garākais marķieris un pirmā sakritība","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad divas alternatīvas vienā un tajā pašā vietā abas varētu sakrist, operators <code>|<\/code> izvēlas to, kas sakrīt ar <strong>garāko<\/strong> teksta gabalu.<\/span> <span class=\"sg\" data-s=\"1\">To sauc par <em>garākā marķiera piemeklēšanu<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai gan <code>cat<\/code> ir uzrakstīts pirmais un sakristu, <code>|<\/code> dod priekšroku garākajam <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz vēlaties pretējo — izmēģināt alternatīvas tādā secībā, kādā tās uzrakstījāt, un paņemt <strong>pirmo<\/strong>, kas sakrīt.<\/span> <span class=\"sg\" data-s=\"1\">Tieši to dara dubultā svītra <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad vispirms tiek izmēģināts <code>cat<\/code> un tas sakrīt, tāpēc dzinējs tur apstājas un <code>catdog<\/code> vispār neapsver.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet <code>|<\/code> (garāko marķieri), kad vēlaties «labāko» sakritību neatkarīgi no secības — tā ir ierastā izvēle un tā, uz kuru paļaujas gramatikas.<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet <code>||<\/code> (pirmo sakritību), kad alternatīvu secība ir jēgpilna un vēlaties, lai uzvarētu agrākās.<\/span><\/p>"]]},"ru":{"t":"Самый длинный токен и первое совпадение","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда в одном и том же месте могли бы совпасть сразу два варианта, оператор <code>|<\/code> выбирает тот, который сопоставляет <strong>самый длинный<\/strong> кусок текста.<\/span> <span class=\"sg\" data-s=\"1\">Это называется <em>сопоставлением по самому длинному токену<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хотя <code>cat<\/code> записан первым и подошёл бы, <code>|<\/code> предпочитает более длинное <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно обратное — перебрать варианты в том порядке, в каком вы их записали, и взять <strong>первый<\/strong> подошедший.<\/span> <span class=\"sg\" data-s=\"1\">Именно это делает двойная черта <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь <code>cat<\/code> пробуется первым и совпадает, поэтому движок на нём и останавливается, так и не дойдя до <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Используйте <code>|<\/code> (самый длинный токен), когда вам нужно «лучшее» совпадение независимо от порядка, — это обычный выбор, и именно на нём держатся грамматики.<\/span> <span class=\"sg\" data-s=\"1\">Используйте <code>||<\/code> (первое совпадение), когда порядок вариантов осмыслен и вы хотите, чтобы побеждали более ранние.<\/span><\/p>"]]},"uk":{"t":"Найдовший токен і перший збіг","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли дві альтернативи могли б збігтися на одному й тому самому місці, оператор <code>|<\/code> обирає ту, що зіставляється з <strong>найдовшим<\/strong> шматком тексту.<\/span> <span class=\"sg\" data-s=\"1\">Це називають <em>зіставленням за найдовшим токеном<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хоча <code>cat<\/code> записано першим і воно збіглося б, <code>|<\/code> віддає перевагу довшому <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді потрібне протилежне — пробувати альтернативи в тому порядку, в якому ви їх записали, і брати <strong>першу<\/strong>, що збігається.<\/span> <span class=\"sg\" data-s=\"1\">Саме це робить подвійна риска <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер <code>cat<\/code> пробується першим і збігається, тож механізм на цьому зупиняється й ніколи не розглядає <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <code>|<\/code> (найдовший токен), коли хочете «найкращий» збіг незалежно від порядку, — це звичний вибір, і саме на нього спираються граматики.<\/span> <span class=\"sg\" data-s=\"1\">Використовуйте <code>||<\/code> (перший збіг), коли порядок альтернатив має значення й ви хочете, щоб перемагали ранніші.<\/span><\/p>"]]},"bg":{"t":"Най-дълъг токен и първо съвпадение","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато две възможности биха могли да съвпаднат на едно и също място, операторът <code>|<\/code> избира онази, която съпоставя <strong>най-дългото<\/strong> парче текст.<\/span> <span class=\"sg\" data-s=\"1\">Това се нарича <em>съпоставяне по най-дълъг токен<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat | catdog /; # ｢catdog｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Макар <code>cat<\/code> да е написано първо и да би съвпаднало, <code>|<\/code> предпочита по-дългото <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога искате обратното — да опитате възможностите в реда, в който сте ги написали, и да вземете <strong>първата<\/strong>, която съвпадне.<\/span> <span class=\"sg\" data-s=\"1\">Точно това прави двойната черта <code>||<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'catdog' ~~ / cat || catdog /; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега <code>cat<\/code> се опитва първо и съвпада, така че машината спира дотам и никога не разглежда <code>catdog<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвайте <code>|<\/code> (най-дълъг токен), когато искате „най-доброто“ съвпадение независимо от реда — това е обичайният избор и онзи, на който разчитат граматиките.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте <code>||<\/code> (първо съвпадение), когато редът на възможностите е смислен и искате по-ранните да печелят.<\/span><\/p>"]]}}}</script>
