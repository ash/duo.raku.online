<script type="application/json" id="page-data">{"u":"regexes/substitution/captures-in-replacement","n":1079,"k":"topic","pv":"regexes/substitution/s-operator/quiz","nx":"regexes/substitution/transliteration","tr":["regexes","regexes/substitution"],"L":{"en":{"t":"Captures in the replacement","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The replacement part of <code>s///<\/code> can refer to the captures made by the pattern.<\/span> <span class=\"sg\" data-s=\"1\">This lets you rearrange the matched text rather than just throwing it away.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example, turn a date written as <code>year-month<\/code> into <code>month/year<\/code> by capturing both numbers and putting them back in the other order:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The pattern captures the year into <code>$0<\/code> and the month into <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In the replacement, <code>$1<\/code> and <code>$0<\/code> are written in the reversed order, with a slash between them. (The slash is escaped as <code>\\/<\/code> so it is not mistaken for the end of the substitution.)<\/span> <span class=\"sg\" data-s=\"2\">Note that spaces are insignificant on the <strong>pattern<\/strong> side but literal on the <strong>replacement<\/strong> side, so the replacement is written with no spaces around it.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Named captures work the same way.<\/span> <span class=\"sg\" data-s=\"1\">This makes a substitution read clearly even when there are several pieces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"de":{"t":"Captures in der Ersetzung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Ersatzteil von <code>s///<\/code> kann sich auf die Captures beziehen, die das Muster gemacht hat.<\/span> <span class=\"sg\" data-s=\"1\">So können Sie den getroffenen Text umstellen, statt ihn einfach wegzuwerfen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Machen Sie etwa aus einem als <code>Jahr-Monat<\/code> geschriebenen Datum ein <code>Monat/Jahr<\/code>, indem Sie beide Zahlen capturen und in der anderen Reihenfolge wieder einsetzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Muster capturt das Jahr in <code>$0<\/code> und den Monat in <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In der Ersetzung stehen <code>$1<\/code> und <code>$0<\/code> in umgekehrter Reihenfolge, mit einem Schrägstrich dazwischen. (Der Schrägstrich ist als <code>\\/<\/code> maskiert, damit er nicht für das Ende der Ersetzung gehalten wird.)<\/span> <span class=\"sg\" data-s=\"2\">Beachten Sie, dass Leerzeichen auf der <strong>Muster<\/strong>seite unbedeutend sind, auf der <strong>Ersatz<\/strong>seite aber wörtlich, die Ersetzung ist also ohne umgebende Leerzeichen geschrieben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Benannte Captures funktionieren genauso.<\/span> <span class=\"sg\" data-s=\"1\">Das lässt eine Ersetzung auch dann klar lesen, wenn es mehrere Teile gibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"nl":{"t":"Captures in de vervanging","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het vervangingsdeel van <code>s///<\/code> kan verwijzen naar de captures die het patroon gemaakt heeft.<\/span> <span class=\"sg\" data-s=\"1\">Zo kun je de gematchte tekst herschikken in plaats van haar eenvoudigweg weg te gooien.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zet bijvoorbeeld een datum die als <code>jaar-maand<\/code> geschreven is om naar <code>maand/jaar<\/code> door beide getallen te capturen en ze in de andere volgorde terug te zetten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het patroon captureert het jaar in <code>$0<\/code> en de maand in <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In de vervanging staan <code>$1<\/code> en <code>$0<\/code> in omgekeerde volgorde, met een schuine streep ertussen. (De schuine streep wordt als <code>\\/<\/code> ge-escapet zodat hij niet voor het einde van de substitutie aangezien wordt.)<\/span> <span class=\"sg\" data-s=\"2\">Merk op dat spaties aan de <strong>patroon<\/strong>kant onbetekenend zijn maar aan de <strong>vervangings<\/strong>kant letterlijk, dus is de vervanging zonder omringende spaties geschreven.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Benoemde captures werken op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"1\">Dat laat een substitutie duidelijk lezen, zelfs wanneer er meerdere stukken zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"es":{"t":"Capturas en el reemplazo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La parte de reemplazo de <code>s///<\/code> puede referirse a las capturas hechas por el patrón.<\/span> <span class=\"sg\" data-s=\"1\">Esto te permite reordenar el texto coincidente en lugar de limitarte a tirarlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ejemplo, convierte una fecha escrita como <code>año-mes<\/code> en <code>mes/año<\/code> capturando ambos números y volviéndolos a colocar en el orden inverso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El patrón captura el año en <code>$0<\/code> y el mes en <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En el reemplazo, <code>$1<\/code> y <code>$0<\/code> se escriben en orden invertido, con una barra entre ellos. (La barra se protege como <code>\\/<\/code> para que no se confunda con el final de la sustitución.)<\/span> <span class=\"sg\" data-s=\"2\">Fíjate en que los espacios son insignificantes del lado del <strong>patrón<\/strong> pero literales del lado del <strong>reemplazo<\/strong>, así que el reemplazo se escribe sin espacios alrededor.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las capturas con nombre funcionan igual.<\/span> <span class=\"sg\" data-s=\"1\">Esto hace que una sustitución se lea con claridad incluso cuando hay varias piezas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"it":{"t":"Catture nel rimpiazzo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La parte di rimpiazzo di <code>s///<\/code> può riferirsi alle catture fatte dallo schema.<\/span> <span class=\"sg\" data-s=\"1\">Questo ti permette di riordinare il testo riconosciuto invece di limitarti a buttarlo via.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per esempio, trasforma una data scritta come <code>anno-mese<\/code> in <code>mese/anno<\/code> catturando entrambi i numeri e rimettendoli nell'ordine opposto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lo schema cattura l'anno in <code>$0<\/code> e il mese in <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nel rimpiazzo, <code>$1<\/code> e <code>$0<\/code> sono scritti nell'ordine invertito, con una barra fra di essi. (La barra è protetta come <code>\\/<\/code> così da non essere scambiata per la fine della sostituzione.)<\/span> <span class=\"sg\" data-s=\"2\">Nota che gli spazi sono insignificanti dal lato dello <strong>schema<\/strong> ma letterali dal lato del <strong>rimpiazzo<\/strong>, quindi il rimpiazzo si scrive senza spazi attorno.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le catture con nome funzionano allo stesso modo.<\/span> <span class=\"sg\" data-s=\"1\">Questo fa leggere chiaramente una sostituzione anche quando i pezzi sono parecchi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"ru":{"t":"Захваты в замене","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Часть замены в <code>s///<\/code> может ссылаться на захваты, сделанные шаблоном.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет перекомпоновать совпавший текст, а не просто его выбросить.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например, превратим дату, записанную как <code>год-месяц<\/code>, в <code>месяц/год<\/code>, захватив оба числа и подставив их в обратном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Шаблон захватывает год в <code>$0<\/code>, а месяц в <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В замене <code>$1<\/code> и <code>$0<\/code> записаны в обратном порядке, а между ними стоит косая черта. (Черта экранирована как <code>\\/<\/code>, чтобы её не приняли за конец подстановки.)<\/span> <span class=\"sg\" data-s=\"2\">Заметьте, что пробелы незначимы на стороне <strong>шаблона<\/strong>, но буквальны на стороне <strong>замены<\/strong>, поэтому замена записана без пробелов вокруг.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именованные захваты работают так же.<\/span> <span class=\"sg\" data-s=\"1\">Благодаря им подстановка читается ясно даже тогда, когда частей несколько:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"uk":{"t":"Захоплення у заміні","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Частина заміни в <code>s///<\/code> може посилатися на захоплення, зроблені шаблоном.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє переставити знайдений текст, а не просто відкинути його.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад, перетворимо дату, записану як <code>рік-місяць<\/code>, на <code>місяць/рік<\/code>, захопивши обидва числа й повернувши їх у зворотному порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Шаблон захоплює рік у <code>$0<\/code>, а місяць — у <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У заміні <code>$1<\/code> та <code>$0<\/code> записані у зворотному порядку, зі скісною рискою між ними. (Риска екранована як <code>\\/<\/code>, щоб її не сприйняли за кінець підстановки.)<\/span> <span class=\"sg\" data-s=\"2\">Зауважте, що пробіли неістотні на боці <strong>шаблону<\/strong>, але літеральні на боці <strong>заміни<\/strong>, тож заміну записано без пробілів навколо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іменовані захоплення працюють так само.<\/span> <span class=\"sg\" data-s=\"1\">Завдяки цьому підстановка читається зрозуміло навіть тоді, коли частин кілька:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]},"bg":{"t":"Прихващания в замяната","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Частта за замяна в <code>s///<\/code> може да се позовава на прихващанията, направени от шаблона.<\/span> <span class=\"sg\" data-s=\"1\">Това ви позволява да пренаредите намерения текст, вместо просто да го изхвърлите.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например, превърнете дата, записана като <code>година-месец<\/code>, в <code>месец/година<\/code>, като прихванете двете числа и ги върнете в обратен ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = '2025-06';\n$d ~~ s/ (\\d+) '-' (\\d+) /$1\\/$0/;\nsay $d; # 06/2025<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Шаблонът прихваща годината в <code>$0<\/code>, а месеца в <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В замяната <code>$1<\/code> и <code>$0<\/code> са записани в обратен ред, с наклонена черта между тях. (Чертата е екранирана като <code>\\/<\/code>, за да не бъде взета за край на заместването.)<\/span> <span class=\"sg\" data-s=\"2\">Забележете, че интервалите са незначещи от страна на <strong>шаблона<\/strong>, но буквални от страна на <strong>замяната<\/strong>, така че замяната е написана без интервали около нея.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именуваните прихващания работят по същия начин.<\/span> <span class=\"sg\" data-s=\"1\">Благодарение на това заместването се чете ясно дори когато частите са няколко:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Doe, Jane';\n$name ~~ s/ $&lt;last&gt;=(\\w+) ', ' $&lt;first&gt;=(\\w+) /$&lt;first&gt; $&lt;last&gt;/;\nsay $name; # Jane Doe<\/code><\/pre>"]]}}}</script>
