<script type="application/json" id="page-data">{"u":"regexes/substitution/transliteration","n":1080,"k":"topic","pv":"regexes/substitution/captures-in-replacement","nx":"regexes/substitution/transliteration/quiz","tr":["regexes","regexes/substitution"],"L":{"en":{"t":"Transliteration","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you want to replace individual <strong>characters<\/strong> rather than a whole pattern, use the transliteration operator <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It maps each character in the first set to the character in the same position of the second set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Every lowercase letter is replaced by the uppercase letter at the matching position in the second range, so the whole word is upper-cased.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The two sets are matched up character by character.<\/span> <span class=\"sg\" data-s=\"1\">A small example that shifts three letters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here every <code>a<\/code> becomes <code>x<\/code>, every <code>b<\/code> becomes <code>y<\/code>, and every <code>c<\/code> becomes <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Transliteration is the right tool for character-level mappings — changing case, swapping a small alphabet, or encoding.<\/span> <span class=\"sg\" data-s=\"1\">For anything that depends on a pattern rather than single characters, use <code>s///<\/code>.<\/span><\/p>"]]},"de":{"t":"Transliteration","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie einzelne <strong>Zeichen<\/strong> statt eines ganzen Musters ersetzen möchten, nehmen Sie den Transliterationsoperator <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er ordnet jedem Zeichen der ersten Menge das Zeichen an derselben Stelle der zweiten Menge zu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Kleinbuchstabe wird durch den Großbuchstaben an der entsprechenden Stelle des zweiten Bereichs ersetzt, das ganze Wort wird also großgeschrieben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die beiden Mengen werden Zeichen für Zeichen einander zugeordnet.<\/span> <span class=\"sg\" data-s=\"1\">Ein kleines Beispiel, das drei Buchstaben verschiebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier wird jedes <code>a<\/code> zu <code>x<\/code>, jedes <code>b<\/code> zu <code>y<\/code> und jedes <code>c<\/code> zu <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Transliteration ist das richtige Werkzeug für Zuordnungen auf Zeichenebene — Groß- und Kleinschreibung ändern, ein kleines Alphabet austauschen oder kodieren.<\/span> <span class=\"sg\" data-s=\"1\">Für alles, was von einem Muster statt von einzelnen Zeichen abhängt, nehmen Sie <code>s///<\/code>.<\/span><\/p>"]]},"nl":{"t":"Transliteratie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je afzonderlijke <strong>tekens<\/strong> wilt vervangen in plaats van een heel patroon, gebruik je de transliteratieoperator <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij koppelt elk teken in de eerste verzameling aan het teken op dezelfde positie in de tweede verzameling:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke kleine letter wordt vervangen door de hoofdletter op de overeenkomstige positie in het tweede bereik, dus wordt het hele woord in hoofdletters gezet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De twee verzamelingen worden teken voor teken op elkaar afgestemd.<\/span> <span class=\"sg\" data-s=\"1\">Een klein voorbeeld dat drie letters verschuift:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier wordt elke <code>a<\/code> een <code>x<\/code>, elke <code>b<\/code> een <code>y<\/code> en elke <code>c<\/code> een <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Transliteratie is het juiste gereedschap voor koppelingen op tekenniveau — hoofdlettergebruik veranderen, een klein alfabet omwisselen of coderen.<\/span> <span class=\"sg\" data-s=\"1\">Voor alles wat van een patroon afhangt in plaats van van afzonderlijke tekens gebruik je <code>s///<\/code>.<\/span><\/p>"]]},"es":{"t":"Transliteración","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando quieres reemplazar <strong>caracteres<\/strong> sueltos en lugar de un patrón entero, usa el operador de transliteración <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mapea cada carácter del primer conjunto al carácter que está en la misma posición del segundo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada letra minúscula se reemplaza por la mayúscula que está en la posición correspondiente del segundo rango, así que toda la palabra pasa a mayúsculas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los dos conjuntos se emparejan carácter a carácter.<\/span> <span class=\"sg\" data-s=\"1\">Un ejemplo pequeño que desplaza tres letras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí toda <code>a<\/code> pasa a ser <code>x<\/code>, toda <code>b<\/code> pasa a ser <code>y<\/code> y toda <code>c<\/code> pasa a ser <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La transliteración es la herramienta adecuada para las correspondencias a nivel de carácter: cambiar mayúsculas, intercambiar un alfabeto pequeño o codificar.<\/span> <span class=\"sg\" data-s=\"1\">Para cualquier cosa que dependa de un patrón en lugar de caracteres sueltos, usa <code>s///<\/code>.<\/span><\/p>"]]},"it":{"t":"Traslitterazione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando vuoi rimpiazzare singoli <strong>caratteri<\/strong> invece di uno schema intero, usa l'operatore di traslitterazione <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mappa ogni carattere del primo insieme sul carattere nella stessa posizione del secondo insieme:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni lettera minuscola viene rimpiazzata dalla lettera maiuscola nella posizione corrispondente del secondo intervallo, quindi tutta la parola diventa maiuscola.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I due insiemi vengono appaiati carattere per carattere.<\/span> <span class=\"sg\" data-s=\"1\">Un piccolo esempio che sposta tre lettere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui ogni <code>a<\/code> diventa <code>x<\/code>, ogni <code>b<\/code> diventa <code>y<\/code> e ogni <code>c<\/code> diventa <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La traslitterazione è lo strumento giusto per le mappature a livello di carattere: cambiare le maiuscole, scambiare un piccolo alfabeto o codificare.<\/span> <span class=\"sg\" data-s=\"1\">Per qualunque cosa dipenda da uno schema invece che da singoli caratteri, usa <code>s///<\/code>.<\/span><\/p>"]]},"ru":{"t":"Транслитерация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда заменять нужно отдельные <strong>символы<\/strong>, а не целый шаблон, используйте оператор транслитерации <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он отображает каждый символ первого набора в символ, стоящий на той же позиции во втором наборе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждая строчная буква заменяется прописной, стоящей на соответствующей позиции во втором диапазоне, поэтому всё слово переходит в верхний регистр.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наборы сопоставляются посимвольно.<\/span> <span class=\"sg\" data-s=\"1\">Небольшой пример со сдвигом трёх букв:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь каждая <code>a<\/code> становится <code>x<\/code>, каждая <code>b<\/code> — <code>y<\/code>, а каждая <code>c<\/code> — <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Транслитерация — подходящий инструмент для посимвольных отображений: смены регистра, замены небольшого алфавита или кодирования.<\/span> <span class=\"sg\" data-s=\"1\">Для всего, что зависит от шаблона, а не от отдельных символов, берите <code>s///<\/code>.<\/span><\/p>"]]},"uk":{"t":"Транслітерація","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли потрібно замінити окремі <strong>символи<\/strong>, а не цілий шаблон, скористайтеся оператором транслітерації <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він відображає кожен символ із першого набору на символ, що стоїть на тій самій позиції у другому наборі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожна мала літера замінюється великою літерою з відповідної позиції другого діапазону, тож усе слово записується великими літерами.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва набори зіставляються символ за символом.<\/span> <span class=\"sg\" data-s=\"1\">Невеликий приклад, що зсуває три літери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут кожне <code>a<\/code> стає <code>x<\/code>, кожне <code>b<\/code> — <code>y<\/code>, а кожне <code>c<\/code> — <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Транслітерація — правильний інструмент для відображень на рівні символів: зміни регістру, заміни невеликого алфавіту або кодування.<\/span> <span class=\"sg\" data-s=\"1\">Для всього, що залежить від шаблону, а не від окремих символів, використовуйте <code>s///<\/code>.<\/span><\/p>"]]},"bg":{"t":"Транслитерация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато искате да замените отделни <strong>знаци<\/strong>, а не цял шаблон, използвайте оператора за транслитерация <code>tr///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той съпоставя всеки знак от първото множество със знака на същата позиция във второто:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello';\n$s ~~ tr/a..z/A..Z/;\nsay $s; # HELLO<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяка малка буква се заменя с главната буква на съответната позиция във втория диапазон, така че цялата дума става с главни букви.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двете множества се съпоставят знак по знак.<\/span> <span class=\"sg\" data-s=\"1\">Малък пример, който измества три букви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'abcabc';\n$s ~~ tr/abc/xyz/;\nsay $s; # xyzxyz<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук всяко <code>a<\/code> става <code>x<\/code>, всяко <code>b<\/code> става <code>y<\/code>, а всяко <code>c<\/code> става <code>z<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Транслитерацията е правилният инструмент за съответствия на ниво знаци — смяна на регистър, замяна на малка азбука или кодиране.<\/span> <span class=\"sg\" data-s=\"1\">За всичко, което зависи от шаблон, а не от отделни знаци, използвайте <code>s///<\/code>.<\/span><\/p>"]]}}}</script>
