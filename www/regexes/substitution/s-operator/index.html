<script type="application/json" id="page-data">{"u":"regexes/substitution/s-operator","n":1077,"k":"topic","pv":"regexes/substitution","nx":"regexes/substitution/s-operator/quiz","tr":["regexes","regexes/substitution"],"L":{"en":{"t":"The substitution operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The substitution operator is <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It looks like a match with a second slot: the pattern goes between the first two slashes and the replacement text between the last two:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Substitution changes the variable <strong>in place<\/strong>, so <code>$s<\/code> itself is updated.<\/span> <span class=\"sg\" data-s=\"1\">The text in the replacement part is literal — you do not put it in quotes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Like matching, substitution touches only the <strong>first<\/strong> occurrence by default.<\/span> <span class=\"sg\" data-s=\"1\">Add the <code>:g<\/code> adverb to replace every occurrence:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you want to keep the original and produce a changed <strong>copy<\/strong> instead of modifying in place, use the <strong>uppercase<\/strong> <code>S///<\/code> operator: it performs the substitution and returns the changed string, leaving the original untouched.<\/span> <span class=\"sg\" data-s=\"1\">Because it does not update a variable in place, point it at one with <code>given<\/code> rather than <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Writing <code>$orig ~~ S///<\/code> warns you to use <code>given<\/code> instead — with <code>S///<\/code> there is nothing to modify in place.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same non-destructive behaviour is also available as a method, <code>.subst<\/code>, which returns a new string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"de":{"t":"Der Ersetzungsoperator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Ersetzungsoperator ist <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er sieht aus wie ein Treffer mit einem zweiten Fach: Das Muster steht zwischen den ersten beiden Schrägstrichen und der Ersatztext zwischen den letzten beiden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Ersetzung verändert die Variable <strong>an Ort und Stelle<\/strong>, <code>$s<\/code> selbst wird also aktualisiert.<\/span> <span class=\"sg\" data-s=\"1\">Der Text im Ersatzteil ist wörtlich — Sie setzen ihn nicht in Anführungszeichen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie das Treffen berührt die Ersetzung standardmäßig nur das <strong>erste<\/strong> Vorkommen.<\/span> <span class=\"sg\" data-s=\"1\">Fügen Sie das Adverb <code>:g<\/code> hinzu, um jedes Vorkommen zu ersetzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie das Original behalten und statt einer Änderung an Ort und Stelle eine veränderte <strong>Kopie<\/strong> erzeugen möchten, nehmen Sie den Operator <code>S///<\/code> mit <strong>großem<\/strong> S: Er führt die Ersetzung aus und liefert die veränderte Zeichenkette, während das Original unberührt bleibt.<\/span> <span class=\"sg\" data-s=\"1\">Da er keine Variable an Ort und Stelle aktualisiert, richten Sie ihn mit <code>given<\/code> statt mit <code>~~<\/code> auf eine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(<code>$orig ~~ S///<\/code> zu schreiben warnt Sie, stattdessen <code>given<\/code> zu verwenden — bei <code>S///<\/code> gibt es nichts, was an Ort und Stelle zu ändern wäre.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dasselbe zerstörungsfreie Verhalten gibt es auch als Methode, <code>.subst<\/code>, die eine neue Zeichenkette liefert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"nl":{"t":"De substitutieoperator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De substitutieoperator is <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij ziet eruit als een match met een tweede vak: het patroon komt tussen de eerste twee schuine strepen en de vervangende tekst tussen de laatste twee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Substitutie verandert de variabele <strong>ter plaatse<\/strong>, dus <code>$s<\/code> zelf wordt bijgewerkt.<\/span> <span class=\"sg\" data-s=\"1\">De tekst in het vervangingsdeel is letterlijk — je zet hem niet tussen aanhalingstekens.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als bij matchen raakt substitutie standaard alleen het <strong>eerste<\/strong> voorkomen.<\/span> <span class=\"sg\" data-s=\"1\">Voeg het bijwoord <code>:g<\/code> toe om elk voorkomen te vervangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je het origineel wilt behouden en in plaats van ter plaatse te wijzigen een veranderde <strong>kopie<\/strong> wilt maken, gebruik je de operator <code>S///<\/code> met een <strong>hoofdletter<\/strong>: hij voert de substitutie uit en geeft de veranderde string terug, waarbij het origineel ongemoeid blijft.<\/span> <span class=\"sg\" data-s=\"1\">Omdat hij geen variabele ter plaatse bijwerkt, richt je hem met <code>given<\/code> op een variabele in plaats van met <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(<code>$orig ~~ S///<\/code> schrijven waarschuwt je om in plaats daarvan <code>given<\/code> te gebruiken — bij <code>S///<\/code> valt er niets ter plaatse te wijzigen.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde niet-destructieve gedrag is ook als methode beschikbaar, <code>.subst<\/code>, die een nieuwe string teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"es":{"t":"El operador de sustitución","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El operador de sustitución es <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Parece un emparejamiento con una segunda ranura: el patrón va entre las dos primeras barras y el texto de reemplazo entre las dos últimas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sustitución cambia la variable <strong>en el sitio<\/strong>, así que <code>$s<\/code> se actualiza.<\/span> <span class=\"sg\" data-s=\"1\">El texto de la parte de reemplazo es literal: no lo pones entre comillas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Igual que el emparejamiento, la sustitución toca por omisión solo la <strong>primera<\/strong> aparición.<\/span> <span class=\"sg\" data-s=\"1\">Añade el adverbio <code>:g<\/code> para reemplazar todas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si quieres conservar el original y producir una <strong>copia<\/strong> modificada en lugar de cambiarlo en el sitio, usa el operador en <strong>mayúscula<\/strong> <code>S///<\/code>: hace la sustitución y devuelve la cadena cambiada, dejando intacto el original.<\/span> <span class=\"sg\" data-s=\"1\">Como no actualiza ninguna variable en el sitio, apúntalo a una con <code>given<\/code> en lugar de con <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Escribir <code>$orig ~~ S///<\/code> te avisa de que uses <code>given<\/code> en su lugar: con <code>S///<\/code> no hay nada que modificar en el sitio.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El mismo comportamiento no destructivo está también disponible como método, <code>.subst<\/code>, que devuelve una cadena nueva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"it":{"t":"L'operatore di sostituzione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'operatore di sostituzione è <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sembra una corrispondenza con un secondo scomparto: lo schema va fra le prime due barre e il testo di rimpiazzo fra le ultime due:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sostituzione cambia la variabile <strong>sul posto<\/strong>, quindi <code>$s<\/code> stesso viene aggiornato.<\/span> <span class=\"sg\" data-s=\"1\">Il testo nella parte di rimpiazzo è letterale: non lo metti fra virgolette.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come il riconoscimento, la sostituzione tocca per impostazione predefinita solo la <strong>prima<\/strong> occorrenza.<\/span> <span class=\"sg\" data-s=\"1\">Aggiungi l'avverbio <code>:g<\/code> per rimpiazzare ogni occorrenza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vuoi conservare l'originale e produrre una <strong>copia<\/strong> modificata invece di cambiare sul posto, usa l'operatore <strong>maiuscolo<\/strong> <code>S///<\/code>: esegue la sostituzione e restituisce la stringa cambiata, lasciando intatto l'originale.<\/span> <span class=\"sg\" data-s=\"1\">Poiché non aggiorna una variabile sul posto, puntalo su una con <code>given<\/code> invece che con <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Scrivere <code>$orig ~~ S///<\/code> ti avvisa di usare invece <code>given<\/code>: con <code>S///<\/code> non c'è nulla da modificare sul posto.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo stesso comportamento non distruttivo è disponibile anche come metodo, <code>.subst<\/code>, che restituisce una nuova stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"lv":{"t":"Aizvietošanas operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Aizstāšanas operators ir <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas izskatās kā sakritība ar otru nodalījumu: raksturs nonāk starp pirmajām divām slīpsvītrām, bet aizstājuma teksts — starp pēdējām divām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aizstāšana maina mainīgo <strong>uz vietas<\/strong>, tāpēc tiek atjaunināts pats <code>$s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Teksts aizstājuma daļā ir burtisks — pēdiņās to nelieciet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā piemeklēšana, arī aizstāšana pēc noklusējuma skar tikai <strong>pirmo<\/strong> gadījumu.<\/span> <span class=\"sg\" data-s=\"1\">Pievienojiet apstākļvārdu <code>:g<\/code>, lai aizstātu visus gadījumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja vēlaties paturēt oriģinālu un radīt izmainītu <strong>kopiju<\/strong>, nevis mainīt uz vietas, izmantojiet <strong>lielo burtu<\/strong> operatoru <code>S///<\/code>: tas veic aizstāšanu un atgriež izmainīto virkni, atstājot oriģinālu neskartu.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā tas mainīgo uz vietas neatjaunina, norādiet to ar <code>given<\/code>, nevis <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Rakstot <code>$orig ~~ S///<\/code>, jūs brīdina lietot <code>given<\/code> — ar <code>S///<\/code> nav nekā, ko mainīt uz vietas.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā pati nesagraujošā uzvedība pieejama arī kā metode <code>.subst<\/code>, kas atgriež jaunu virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"ru":{"t":"Оператор подстановки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор подстановки — это <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он выглядит как сопоставление с дополнительной ячейкой: шаблон записывается между первыми двумя косыми чертами, а текст замены — между последними двумя:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подстановка изменяет переменную <strong>на месте<\/strong>, поэтому обновляется сама <code>$s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Текст в части замены берётся буквально — в кавычки его заключать не надо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и сопоставление, подстановка по умолчанию затрагивает только <strong>первое<\/strong> вхождение.<\/span> <span class=\"sg\" data-s=\"1\">Добавьте наречие <code>:g<\/code>, чтобы заменить каждое:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы хотите сохранить оригинал и получить изменённую <strong>копию<\/strong> вместо правки на месте, используйте оператор с <strong>заглавной<\/strong> буквы — <code>S///<\/code>: он выполняет подстановку и возвращает изменённую строку, оставляя исходную нетронутой.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку он не обновляет переменную на месте, направляйте его на неё через <code>given<\/code>, а не через <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Запись <code>$orig ~~ S///<\/code> выдаст предупреждение с советом использовать <code>given<\/code> — ведь у <code>S///<\/code> нет ничего, что можно было бы изменить на месте.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">То же неразрушающее поведение доступно и в виде метода <code>.subst<\/code>, который возвращает новую строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"uk":{"t":"Оператор підстановки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор підстановки — це <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він схожий на зіставлення з другим полем: шаблон іде між першими двома скісними рисками, а текст заміни — між останніми двома:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підстановка змінює змінну <strong>на місці<\/strong>, тож оновлюється сама <code>$s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Текст у частині заміни є літеральним — брати його в лапки не потрібно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і зіставлення, підстановка типово торкається лише <strong>першого<\/strong> входження.<\/span> <span class=\"sg\" data-s=\"1\">Додайте прислівник <code>:g<\/code>, щоб замінити кожне входження:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви хочете зберегти оригінал і отримати змінену <strong>копію<\/strong> замість зміни на місці, скористайтеся оператором <code>S///<\/code> з <strong>великої<\/strong> літери: він виконує підстановку й повертає змінений рядок, залишаючи оригінал недоторканим.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки він не оновлює змінну на місці, спрямуйте його на неї за допомогою <code>given<\/code>, а не <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Запис <code>$orig ~~ S///<\/code> попереджає вас про те, що слід використати <code>given<\/code> — з <code>S///<\/code> немає чого змінювати на місці.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така сама неруйнівна поведінка доступна й у вигляді методу <code>.subst<\/code>, який повертає новий рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"bg":{"t":"Операторът за заместване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторът за заместване е <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той изглежда като съпоставяне с второ поле: шаблонът стои между първите две наклонени черти, а текстът на замяната — между последните две:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Заместването променя променливата <strong>на място<\/strong>, така че се обновява самата <code>$s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Текстът в частта за замяна е буквален — не го поставяте в кавички.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както и съпоставянето, заместването по подразбиране засяга само <strong>първото<\/strong> появяване.<\/span> <span class=\"sg\" data-s=\"1\">Добавете наречието <code>:g<\/code>, за да замените всяко появяване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако искате да запазите оригинала и да получите променено <strong>копие<\/strong>, вместо да променяте на място, използвайте оператора <code>S///<\/code> с <strong>главна<\/strong> буква: той извършва заместването и връща променения низ, оставяйки оригинала недокоснат.<\/span> <span class=\"sg\" data-s=\"1\">Понеже той не обновява променлива на място, насочете го към нея с <code>given<\/code>, а не с <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Записът <code>$orig ~~ S///<\/code> ви предупреждава да използвате <code>given<\/code> — при <code>S///<\/code> няма какво да се променя на място.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същото неразрушително поведение е налично и като метод — <code>.subst<\/code>, — който връща нов низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"eo":{"t":"La operatoro de anstataŭigo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La operatoro de anstataŭigo estas <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aspektas kiel kongruo kun dua fako: la ŝablono iras inter la unuaj du oblikvoj kaj la anstataŭa teksto inter la lastaj du:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anstataŭigo ŝanĝas la variablon <strong>surloke<\/strong>, do <code>$s<\/code> mem estas ĝisdatigita.<\/span> <span class=\"sg\" data-s=\"1\">La teksto en la anstataŭa parto estas laŭlitera — vi ne metas ĝin en citilojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel kongruigo, anstataŭigo tuŝas nur la <strong>unuan<\/strong> aperon defaŭlte.<\/span> <span class=\"sg\" data-s=\"1\">Aldonu la adverbon <code>:g<\/code> por anstataŭigi ĉiun aperon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi volas konservi la originalon kaj produkti ŝanĝitan <strong>kopion<\/strong> anstataŭ modifi surloke, uzu la <strong>majusklan<\/strong> operatoron <code>S///<\/code>: ĝi faras la anstataŭigon kaj redonas la ŝanĝitan ĉenon, lasante la originalon netuŝita.<\/span> <span class=\"sg\" data-s=\"1\">Ĉar ĝi ne ĝisdatigas variablon surloke, direktu ĝin al unu per <code>given<\/code> anstataŭ <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Skribi <code>$orig ~~ S///<\/code> avertas vin uzi <code>given<\/code> anstataŭe — ĉe <code>S///<\/code> estas nenio por modifi surloke.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sama nedetrua konduto ankaŭ disponeblas kiel metodo, <code>.subst<\/code>, kiu redonas novan ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]},"la":{"t":"Operator substitutionis","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator substitutionis est <code>s///<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Similis congruentiae cum secundo loco videtur: exemplar inter duas primas lineolas obliquas it et textus permutationis inter duas ultimas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'hello world';\n$s ~~ s/world/Raku/;\nsay $s; # hello Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Substitutio variabilem <strong>in loco<\/strong> mutat, itaque ipsa <code>$s<\/code> renovatur.<\/span> <span class=\"sg\" data-s=\"1\">Textus in parte permutationis litteralis est — eum in virgulas non ponis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sicut congruentia, substitutio ex more solam <strong>primam<\/strong> occurrentiam tangit.<\/span> <span class=\"sg\" data-s=\"1\">Adde adverbium <code>:g<\/code> ut omnem occurrentiam permutes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = 'a-b-c';\n$s ~~ s:g/'-'/_/;\nsay $s; # a_b_c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si originale servare vis et <strong>exemplum<\/strong> mutatum producere loco eius quod in loco mutes, utere operatore <strong>maiusculo<\/strong> <code>S///<\/code>: substitutionem agit et catenam mutatam reddit, originali intacto relicto.<\/span> <span class=\"sg\" data-s=\"1\">Quia variabilem in loco non renovat, illud per <code>given<\/code> potius quam per <code>~~<\/code> dirige:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay S:g/o/0/ given $orig; # c0l0r\nsay $orig;                # color<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(<code>$orig ~~ S///<\/code> scribere te monet ut <code>given<\/code> loco eius adhibeas — cum <code>S///<\/code> nihil est quod in loco mutetur.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eadem agendi ratio non destruens etiam ut methodus praesto est, <code>.subst<\/code>, quae novam catenam reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $orig = 'color';\nsay $orig.subst('o', '0', :g); # c0l0r\nsay $orig;                     # color<\/code><\/pre>"]]}}}</script>
