<script type="application/json" id="page-data">{"u":"regexes/substitution","n":1076,"k":"section","pv":"regexes/adverbs/exercises/all-numbers/solution","nx":"regexes/substitution/s-operator","tr":["regexes"],"L":{"en":{"t":"Substitution and replacement","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Matching finds and extracts text. <em>Substitution<\/em> goes one step further and <strong>changes<\/strong> it — replacing the matched part with something else.<\/span> <span class=\"sg\" data-s=\"1\">This is how you censor a word, reformat a date, or clean up a string.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section covers the <code>s///<\/code> operator, how to use captures in the replacement, and <code>tr///<\/code>, which replaces characters one for one.<\/span><\/p>"]]},"de":{"t":"Ersetzung","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Treffen findet und entnimmt Text.<\/span> <span class=\"sg\" data-s=\"1\">Die <em>Ersetzung<\/em> geht einen Schritt weiter und <strong>verändert<\/strong> ihn — sie tauscht den getroffenen Teil gegen etwas anderes.<\/span> <span class=\"sg\" data-s=\"2\">So zensieren Sie ein Wort, formatieren ein Datum um oder räumen eine Zeichenkette auf.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt den Operator <code>s///<\/code>, den Gebrauch von Captures in der Ersetzung und <code>tr///<\/code>, das Zeichen eins zu eins ersetzt.<\/span><\/p>"]]},"nl":{"t":"Substitutie en vervanging","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Matchen vindt en haalt tekst eruit. <em>Substitutie<\/em> gaat een stap verder en <strong>verandert<\/strong> haar — door het gematchte deel door iets anders te vervangen.<\/span> <span class=\"sg\" data-s=\"1\">Zo censureer je een woord, herformatteer je een datum of ruim je een string op.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze sectie behandelt de operator <code>s///<\/code>, hoe je captures in de vervanging gebruikt, en <code>tr///<\/code>, die tekens een voor een vervangt.<\/span><\/p>"]]},"es":{"t":"Sustitución y reemplazo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El emparejamiento encuentra y extrae texto.<\/span> <span class=\"sg\" data-s=\"1\">La <em>sustitución<\/em> va un paso más allá y lo <strong>cambia<\/strong>, reemplazando la parte coincidente por otra cosa.<\/span> <span class=\"sg\" data-s=\"2\">Así es como censuras una palabra, reformateas una fecha o limpias una cadena.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata el operador <code>s///<\/code>, cómo usar capturas en el reemplazo y <code>tr///<\/code>, que sustituye caracteres uno por uno.<\/span><\/p>"]]},"it":{"t":"Sostituzione e rimpiazzo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il riconoscimento trova ed estrae testo.<\/span> <span class=\"sg\" data-s=\"1\">La <em>sostituzione<\/em> va un passo oltre e lo <strong>cambia<\/strong>, rimpiazzando la parte riconosciuta con qualcos'altro.<\/span> <span class=\"sg\" data-s=\"2\">È così che censuri una parola, riformatti una data o ripulisci una stringa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta l'operatore <code>s///<\/code>, come usare le catture nel rimpiazzo e <code>tr///<\/code>, che sostituisce i caratteri uno a uno.<\/span><\/p>"]]},"lv":{"t":"Aizvietošana un nomaiņa","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Piemeklēšana atrod un izvelk tekstu. <em>Aizstāšana<\/em> iet vienu soli tālāk un to <strong>maina<\/strong> — aizstājot sakritušo daļu ar kaut ko citu.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tā cenzē vārdu, pārformatē datumu vai sakārto virkni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko operatoru <code>s///<\/code>, tvērumu izmantošanu aizstājumā un <code>tr///<\/code>, kas aizstāj rakstzīmes vienu pret vienu.<\/span><\/p>"]]},"ru":{"t":"Подстановка и замена","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Сопоставление находит и извлекает текст. <em>Подстановка<\/em> идёт на шаг дальше и <strong>изменяет<\/strong> его, заменяя совпавшую часть чем-то другим.<\/span> <span class=\"sg\" data-s=\"1\">Так цензурируют слово, переформатируют дату или приводят строку в порядок.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе рассматриваются оператор <code>s///<\/code>, использование захватов в замене и <code>tr///<\/code>, который заменяет символы один на один.<\/span><\/p>"]]},"uk":{"t":"Підстановка та заміна","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Зіставлення знаходить та видобуває текст. <em>Підстановка<\/em> йде на крок далі й <strong>змінює<\/strong> його — замінює знайдену частину чимось іншим.<\/span> <span class=\"sg\" data-s=\"1\">Саме так цензурують слово, переформатовують дату або впорядковують рядок.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює оператор <code>s///<\/code>, використання захоплень у заміні, а також <code>tr///<\/code>, який замінює символи один за одним.<\/span><\/p>"]]},"bg":{"t":"Заместване и замяна","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Съпоставянето намира и извлича текст. <em>Заместването<\/em> отива една стъпка по-далеч и го <strong>променя<\/strong> — заменя намерената част с нещо друго.<\/span> <span class=\"sg\" data-s=\"1\">Точно така цензурирате дума, преформатирате дата или подреждате низ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел обхваща оператора <code>s///<\/code>, употребата на прихващания в замяната и <code>tr///<\/code>, който заменя знаци един за друг.<\/span><\/p>"]]}}}</script>
