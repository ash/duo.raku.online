<script type="application/json" id="page-data">{"u":"regexes/captures/exercises/split-filename/solution","n":1019,"k":"solution","pv":"regexes/captures/exercises/split-filename","nx":"regexes/captures/exercises/city-and-country","tr":["regexes","regexes/captures"],"L":{"en":{"t":"The solution of ’Split a filename‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The first pair of brackets captures the base name into <code>$0<\/code>, the second captures the extension into <code>$1<\/code>. The dot between them is quoted so it matches a literal <code>.<\/code> rather than any character.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>~<\/code> in front of each capture puts it into string context, so it prints as plain text. Plain <code>say $0<\/code> would instead show the match object with its corner brackets, <code>｢report｣<\/code>. Writing <code>say $0.Str<\/code> does the same as <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zerlegen Sie einen Dateinamen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das erste Klammerpaar capturt den Grundnamen in <code>$0<\/code>, das zweite capturt die Erweiterung in <code>$1<\/code>. Der Punkt dazwischen steht in Anführungszeichen, damit er einen wörtlichen <code>.<\/code> trifft und nicht ein beliebiges Zeichen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>~<\/code> vor jedem Capture setzt es in einen Zeichenketten-Zusammenhang, es wird also als blanker Text ausgegeben. Ein schlichtes <code>say $0<\/code> würde stattdessen das Match-Objekt mit seinen Eckklammern zeigen, <code>｢report｣<\/code>. <code>say $0.Str<\/code> zu schreiben tut dasselbe wie <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Splits een bestandsnaam","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het eerste haakjespaar captureert de basisnaam in <code>$0<\/code>, het tweede captureert de extensie in <code>$1<\/code>. De punt ertussen staat tussen aanhalingstekens zodat hij een letterlijke <code>.<\/code> matcht in plaats van een willekeurig teken.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>~<\/code> voor elke capture zet hem in stringcontext, zodat hij als kale tekst afgedrukt wordt. Een simpele <code>say $0<\/code> zou in plaats daarvan het matchobject met zijn hoekhaken tonen, <code>｢report｣<\/code>. <code>say $0.Str<\/code> schrijven doet hetzelfde als <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Separe un nombre de archivo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El primer par de paréntesis captura el nombre base en <code>$0<\/code> y el segundo captura la extensión en <code>$1<\/code>. El punto entre ambos va entrecomillado para que empareje un <code>.<\/code> literal en lugar de cualquier carácter.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>~<\/code> delante de cada captura la pone en contexto de cadena, de modo que se imprime como texto simple. Un <code>say $0<\/code> a secas mostraría en cambio el objeto de coincidencia con sus esquinas, <code>｢report｣<\/code>. Escribir <code>say $0.Str<\/code> hace lo mismo que <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Dividete un nome di file","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La prima coppia di parentesi cattura il nome di base in <code>$0<\/code>, la seconda cattura l'estensione in <code>$1<\/code>. Il punto fra di esse è fra virgolette perché riconosca un <code>.<\/code> letterale invece di un carattere qualunque.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il <code>~<\/code> davanti a ogni cattura la mette in contesto stringa, così si stampa come testo semplice. Un semplice <code>say $0<\/code> mostrerebbe invece l'oggetto match con le sue parentesi angolari, <code>｢report｣<\/code>. Scrivere <code>say $0.Str<\/code> fa lo stesso di <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Sadaliet faila nosaukumu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pirmais iekavu pāris satver pamatnosaukumu <code>$0<\/code>, otrais satver paplašinājumu <code>$1<\/code>. Punkts starp tiem ir likts pēdiņās, lai tas sakristu ar burtisku <code>.<\/code>, nevis ar jebkuru rakstzīmi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>~<\/code> katra tvēruma priekšā to ieliek virknes kontekstā, tāpēc tas izdrukājas kā vienkāršs teksts. Vienkāršs <code>say $0<\/code> tā vietā rādītu sakritības objektu ar stūra iekavām, <code>｢report｣<\/code>. Rakstot <code>say $0.Str<\/code>, iznāk tas pats, kas ar <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Разберите имя файла","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Первая пара скобок захватывает основное имя в <code>$0<\/code>, вторая — расширение в <code>$1<\/code>. Точка между ними взята в кавычки, поэтому соответствует именно символу <code>.<\/code>, а не любому символу.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Знак <code>~<\/code> перед каждым захватом переводит его в строковый контекст, поэтому он печатается как обычный текст. Просто <code>say $0<\/code> показал бы объект совпадения в угловых кавычках — <code>｢report｣<\/code>. Запись <code>say $0.Str<\/code> делает то же, что и <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Розділіть ім'я файлу","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Перша пара дужок захоплює базове ім'я в <code>$0<\/code>, друга — розширення в <code>$1<\/code>. Крапку між ними взято в лапки, щоб вона зіставлялася з літеральною <code>.<\/code>, а не з будь-яким символом.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>~<\/code> перед кожним захопленням ставить його в рядковий контекст, тож воно виводиться як звичайний текст. Просте <code>say $0<\/code> натомість показало б об'єкт збігу з його кутовими дужками — <code>｢report｣<\/code>. Запис <code>say $0.Str<\/code> робить те саме, що й <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Разделете име на файл","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>if 'report.txt' ~~ / (\\w+) '.' (\\w+) / {\n    say ~$0;\n    say ~$1;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/captures/split-filename.raku\" target=\"_blank\" rel=\"noopener\">split-filename.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>report\ntxt<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Първата двойка скоби прихваща основното име в <code>$0<\/code>, втората прихваща разширението в <code>$1<\/code>. Точката между тях е оградена в кавички, за да съпостави буквална <code>.<\/code>, а не кой да е знак.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>~<\/code> пред всяко прихващане го поставя в низов контекст, така че то се отпечатва като обикновен текст. Обикновеното <code>say $0<\/code> вместо това би показало обекта на съвпадението с ъгловите му скоби — <code>｢report｣<\/code>. Записът <code>say $0.Str<\/code> прави същото като <code>say ~$0<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
