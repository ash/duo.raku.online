<script type="application/json" id="page-data">{"u":"regexes/captures/named","n":1014,"k":"topic","pv":"regexes/captures/positional/quiz","nx":"regexes/captures/named/quiz","tr":["regexes","regexes/captures"],"L":{"en":{"t":"Named captures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numbered captures are handy, but when a pattern grows, names are clearer than numbers.<\/span> <span class=\"sg\" data-s=\"1\">To give a capture a name, write <code>$&lt;name&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The captured pieces are now reached by name through <code>$&lt;name&gt;<\/code> and <code>$&lt;age&gt;<\/code> instead of <code>$0<\/code> and <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is the same as writing <code>$/&lt;name&gt;<\/code>, because the names live inside the match variable <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Named captures make a pattern read almost like a description of the data:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">As with positional captures, each named capture is a match object, so <code>$&lt;age&gt;.Str<\/code> gives the plain text and <code>$&lt;age&gt;.from<\/code> gives its position.<\/span><\/p>"]]},"de":{"t":"Benannte Captures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nummerierte Captures sind praktisch, aber wenn ein Muster wächst, sind Namen klarer als Nummern.<\/span> <span class=\"sg\" data-s=\"1\">Um einem Capture einen Namen zu geben, schreiben Sie <code>$&lt;name&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die gecapturten Stücke sind nun über <code>$&lt;name&gt;<\/code> und <code>$&lt;age&gt;<\/code> namentlich erreichbar statt über <code>$0<\/code> und <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist dasselbe wie <code>$/&lt;name&gt;<\/code> zu schreiben, denn die Namen leben in der Match-Variablen <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Benannte Captures lassen ein Muster fast wie eine Beschreibung der Daten lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wie bei positionalen Captures ist jedes benannte Capture ein Match-Objekt, <code>$&lt;age&gt;.Str<\/code> liefert also den blanken Text und <code>$&lt;age&gt;.from<\/code> seine Position.<\/span><\/p>"]]},"nl":{"t":"Benoemde captures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Genummerde captures zijn handig, maar wanneer een patroon groeit zijn namen duidelijker dan nummers.<\/span> <span class=\"sg\" data-s=\"1\">Om een capture een naam te geven, schrijf je <code>$&lt;naam&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De gecapturde stukken zijn nu op naam bereikbaar via <code>$&lt;name&gt;<\/code> en <code>$&lt;age&gt;<\/code> in plaats van <code>$0<\/code> en <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is hetzelfde als <code>$/&lt;name&gt;<\/code> schrijven, omdat de namen binnen de matchvariabele <code>$/<\/code> leven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Benoemde captures laten een patroon bijna als een beschrijving van de gegevens lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Net als bij positionele captures is elke benoemde capture een matchobject, dus <code>$&lt;age&gt;.Str<\/code> geeft de kale tekst en <code>$&lt;age&gt;.from<\/code> geeft de positie ervan.<\/span><\/p>"]]},"es":{"t":"Capturas con nombre","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Las capturas numeradas son cómodas, pero cuando un patrón crece los nombres resultan más claros que los números.<\/span> <span class=\"sg\" data-s=\"1\">Para dar nombre a una captura, escribe <code>$&lt;nombre&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A las piezas capturadas se llega ahora por nombre con <code>$&lt;name&gt;<\/code> y <code>$&lt;age&gt;<\/code> en lugar de con <code>$0<\/code> y <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es lo mismo que escribir <code>$/&lt;name&gt;<\/code>, porque los nombres viven dentro de la variable de coincidencia <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las capturas con nombre hacen que un patrón se lea casi como una descripción de los datos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Igual que con las capturas posicionales, cada captura con nombre es un objeto de coincidencia, así que <code>$&lt;age&gt;.Str<\/code> da el texto simple y <code>$&lt;age&gt;.from<\/code> da su posición.<\/span><\/p>"]]},"it":{"t":"Catture con nome","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Le catture numerate sono comode, ma quando uno schema cresce i nomi sono più chiari dei numeri.<\/span> <span class=\"sg\" data-s=\"1\">Per dare un nome a una cattura, scrivi <code>$&lt;nome&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I pezzi catturati si raggiungono ora per nome con <code>$&lt;name&gt;<\/code> e <code>$&lt;age&gt;<\/code> invece che con <code>$0<\/code> e <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È lo stesso che scrivere <code>$/&lt;name&gt;<\/code>, perché i nomi vivono dentro la variabile di match <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le catture con nome fanno leggere uno schema quasi come una descrizione dei dati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come per le catture posizionali, ogni cattura con nome è un oggetto match, quindi <code>$&lt;age&gt;.Str<\/code> dà il testo semplice e <code>$&lt;age&gt;.from<\/code> dà la sua posizione.<\/span><\/p>"]]},"ru":{"t":"Именованные захваты","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Нумерованные захваты удобны, но, когда шаблон разрастается, имена понятнее номеров.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы дать захвату имя, пишут <code>$&lt;имя&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь к захваченным кусочкам обращаются по имени, через <code>$&lt;name&gt;<\/code> и <code>$&lt;age&gt;<\/code>, а не через <code>$0<\/code> и <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это то же самое, что написать <code>$/&lt;name&gt;<\/code>, потому что имена живут внутри переменной совпадения <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С именованными захватами шаблон читается почти как описание данных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как и позиционный, каждый именованный захват — это объект совпадения, поэтому <code>$&lt;age&gt;.Str<\/code> даёт простой текст, а <code>$&lt;age&gt;.from<\/code> — его позицию.<\/span><\/p>"]]},"uk":{"t":"Іменовані захоплення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пронумеровані захоплення зручні, але, коли шаблон розростається, імена зрозуміліші за числа.<\/span> <span class=\"sg\" data-s=\"1\">Щоб дати захопленню ім'я, запишіть <code>$&lt;ім'я&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До захоплених шматків тепер дістаються за іменем через <code>$&lt;name&gt;<\/code> та <code>$&lt;age&gt;<\/code> замість <code>$0<\/code> і <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це те саме, що записати <code>$/&lt;name&gt;<\/code>, бо імена живуть усередині змінної збігу <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Іменовані захоплення роблять шаблон схожим на опис самих даних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як і позиційне, кожне іменоване захоплення є об'єктом збігу, тож <code>$&lt;age&gt;.Str<\/code> дає звичайний текст, а <code>$&lt;age&gt;.from<\/code> — його позицію.<\/span><\/p>"]]},"bg":{"t":"Именувани прихващания","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Номерираните прихващания са удобни, но когато шаблонът порасне, имената са по-ясни от числата.<\/span> <span class=\"sg\" data-s=\"1\">За да дадете име на прихващане, напишете <code>$&lt;име&gt;=( … )<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'Anna:30' ~~ / $&lt;name&gt;=(\\w+) ':' $&lt;age&gt;=(\\d+) / {\n    say $&lt;name&gt;; # ｢Anna｣\n    say $&lt;age&gt;;  # ｢30｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До прихванатите парчета сега се стига по име през <code>$&lt;name&gt;<\/code> и <code>$&lt;age&gt;<\/code> вместо през <code>$0<\/code> и <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е същото като да напишете <code>$/&lt;name&gt;<\/code>, защото имената живеят вътре в променливата на съвпадението <code>$/<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именуваните прихващания правят шаблона четим почти като описание на данните:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'x=5' ~~ / $&lt;key&gt;=(\\w+) '=' $&lt;value&gt;=(\\w+) / {\n    say \"key is $&lt;key&gt;, value is $&lt;value&gt;\"; # key is x, value is 5\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както и при позиционните прихващания, всяко именувано прихващане е обект на съвпадението, така че <code>$&lt;age&gt;.Str<\/code> дава обикновения текст, а <code>$&lt;age&gt;.from<\/code> дава позицията му.<\/span><\/p>"]]}}}</script>
