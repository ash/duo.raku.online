<script type="application/json" id="page-data">{"u":"regexes/captures/positional","n":1012,"k":"topic","pv":"regexes/captures","nx":"regexes/captures/positional/quiz","tr":["regexes","regexes/captures"],"L":{"en":{"t":"Positional captures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Put a part of the pattern in round brackets <code>( )<\/code> to <em>capture<\/em> it.<\/span> <span class=\"sg\" data-s=\"1\">After a successful match, each captured piece is available as <code>$0<\/code>, <code>$1<\/code>, and so on, numbered from zero in the order the brackets open:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $0; # ｢2025｣\n    say $1; # ｢06｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The first pair of brackets captured the year into <code>$0<\/code>, the second captured the month into <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The text between them — the literal <code>-<\/code> — is matched but not captured.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each capture is itself a small match object, so you can ask it for its <code>.Str<\/code>, its position, and so on.<\/span> <span class=\"sg\" data-s=\"1\">In a double-quoted string a capture interpolates as its matched text:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'hello world' ~~ / (\\w+) ' ' (\\w+) / {\n    say \"$1 $0\"; # world hello\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, the two captured words are printed in the opposite order, which swaps them.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The captures are also stored in the match variable <code>$/<\/code>, and <code>$0<\/code> is really a short way of writing <code>$/[0]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can work through <code>$/<\/code> directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $/[0];    # ｢2025｣\n    say $/[1];    # ｢06｣\n    say $/.elems; # 2\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$/<\/code> is the whole match object, indexing it reaches the positional captures, and <code>.elems<\/code> tells you how many there are.<\/span><\/p>"]]},"de":{"t":"Positionale Captures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Setzen Sie einen Teil des Musters in runde Klammern <code>( )<\/code>, um ihn zu <em>capturen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Nach einem erfolgreichen Treffer steht jedes gecapturte Stück als <code>$0<\/code>, <code>$1<\/code> und so weiter zur Verfügung, ab null in der Reihenfolge nummeriert, in der die Klammern öffnen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $0; # ｢2025｣\n    say $1; # ｢06｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das erste Klammerpaar hat das Jahr in <code>$0<\/code> gecapturt, das zweite den Monat in <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Text dazwischen — das wörtliche <code>-<\/code> — wird getroffen, aber nicht gecapturt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Capture ist selbst ein kleines Match-Objekt, Sie können es also nach seinem <code>.Str<\/code>, seiner Position und so weiter fragen.<\/span> <span class=\"sg\" data-s=\"1\">In einer Zeichenkette mit doppelten Anführungszeichen wird ein Capture als sein getroffener Text interpoliert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'hello world' ~~ / (\\w+) ' ' (\\w+) / {\n    say \"$1 $0\"; # world hello\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier werden die beiden gecapturten Wörter in umgekehrter Reihenfolge ausgegeben, was sie vertauscht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Captures liegen außerdem in der Match-Variablen <code>$/<\/code>, und <code>$0<\/code> ist in Wahrheit eine Kurzform für <code>$/[0]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie können unmittelbar über <code>$/<\/code> arbeiten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $/[0];    # ｢2025｣\n    say $/[1];    # ｢06｣\n    say $/.elems; # 2\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$/<\/code> ist das ganze Match-Objekt, das Indizieren erreicht die positionalen Captures, und <code>.elems<\/code> sagt Ihnen, wie viele es sind.<\/span><\/p>"]]},"nl":{"t":"Positionele captures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zet een deel van het patroon tussen ronde haken <code>( )<\/code> om het te <em>capturen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Na een geslaagde match is elk gecapturd stuk beschikbaar als <code>$0<\/code>, <code>$1<\/code>, enzovoort, genummerd vanaf nul in de volgorde waarin de haken openen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $0; # ｢2025｣\n    say $1; # ｢06｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het eerste haakjespaar captureerde het jaar in <code>$0<\/code>, het tweede captureerde de maand in <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De tekst ertussen — de letterlijke <code>-<\/code> — wordt gematcht maar niet gecapturd.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke capture is zelf een klein matchobject, dus je kunt hem om zijn <code>.Str<\/code>, zijn positie enzovoort vragen.<\/span> <span class=\"sg\" data-s=\"1\">In een string met dubbele aanhalingstekens interpoleert een capture als zijn gematchte tekst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'hello world' ~~ / (\\w+) ' ' (\\w+) / {\n    say \"$1 $0\"; # world hello\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier worden de twee gecapturde woorden in omgekeerde volgorde afgedrukt, wat ze verwisselt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De captures worden ook in de matchvariabele <code>$/<\/code> bewaard, en <code>$0<\/code> is eigenlijk een korte manier om <code>$/[0]<\/code> te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt rechtstreeks via <code>$/<\/code> werken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $/[0];    # ｢2025｣\n    say $/[1];    # ｢06｣\n    say $/.elems; # 2\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$/<\/code> is het hele matchobject, het indexeren bereikt de positionele captures, en <code>.elems<\/code> vertelt je hoeveel er zijn.<\/span><\/p>"]]},"es":{"t":"Capturas posicionales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pon una parte del patrón entre paréntesis <code>( )<\/code> para <em>capturarla<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tras una coincidencia lograda, cada pieza capturada está disponible como <code>$0<\/code>, <code>$1<\/code> y así sucesivamente, numeradas desde cero en el orden en que se abren los paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $0; # ｢2025｣\n    say $1; # ｢06｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El primer par de paréntesis capturó el año en <code>$0<\/code> y el segundo capturó el mes en <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El texto entre ambos — el <code>-<\/code> literal — se empareja pero no se captura.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada captura es a su vez un pequeño objeto de coincidencia, así que puedes pedirle su <code>.Str<\/code>, su posición y demás.<\/span> <span class=\"sg\" data-s=\"1\">En una cadena entre comillas dobles una captura se interpola como el texto que emparejó:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'hello world' ~~ / (\\w+) ' ' (\\w+) / {\n    say \"$1 $0\"; # world hello\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí las dos palabras capturadas se imprimen en el orden inverso, lo que las intercambia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las capturas se guardan también en la variable de coincidencia <code>$/<\/code>, y <code>$0<\/code> es en realidad una forma abreviada de escribir <code>$/[0]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes trabajar directamente a través de <code>$/<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $/[0];    # ｢2025｣\n    say $/[1];    # ｢06｣\n    say $/.elems; # 2\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$/<\/code> es el objeto de coincidencia completo, indexarlo llega a las capturas posicionales y <code>.elems<\/code> te dice cuántas hay.<\/span><\/p>"]]},"it":{"t":"Catture posizionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metti una parte dello schema fra parentesi tonde <code>( )<\/code> per <em>catturarla<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dopo una corrispondenza riuscita, ogni pezzo catturato è disponibile come <code>$0<\/code>, <code>$1<\/code> e così via, numerato da zero nell'ordine in cui si aprono le parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $0; # ｢2025｣\n    say $1; # ｢06｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prima coppia di parentesi ha catturato l'anno in <code>$0<\/code>, la seconda ha catturato il mese in <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il testo fra di esse — il <code>-<\/code> letterale — viene riconosciuto ma non catturato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni cattura è a sua volta un piccolo oggetto match, quindi puoi chiederle il suo <code>.Str<\/code>, la sua posizione e così via.<\/span> <span class=\"sg\" data-s=\"1\">In una stringa fra virgolette doppie una cattura si interpola come il testo che ha riconosciuto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'hello world' ~~ / (\\w+) ' ' (\\w+) / {\n    say \"$1 $0\"; # world hello\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui le due parole catturate vengono stampate nell'ordine opposto, il che le scambia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le catture sono conservate anche nella variabile di match <code>$/<\/code>, e <code>$0<\/code> è in realtà un modo breve di scrivere <code>$/[0]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi lavorare direttamente attraverso <code>$/<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $/[0];    # ｢2025｣\n    say $/[1];    # ｢06｣\n    say $/.elems; # 2\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$/<\/code> è l'intero oggetto match, indicizzarlo raggiunge le catture posizionali, e <code>.elems<\/code> ti dice quante ce ne sono.<\/span><\/p>"]]},"lv":{"t":"Pozicionālie tvērumi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ielieciet raksturā daļu apaļajās iekavās <code>( )<\/code>, lai to <em>satvertu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc veiksmīgas sakritības katrs satvertais gabals ir pieejams kā <code>$0<\/code>, <code>$1<\/code> un tā tālāk, numurēts no nulles tādā secībā, kādā iekavas atveras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '2025-06' ~~ / (\\d+) '-' (\\d+) / {\n    say $0; # ｢2025｣\n    say $1; # ｢06｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pirmais iekavu pāris satvēra gadu <code>$0<\/code>, otrais satvēra mēnesi <code>$1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Teksts starp tiem — burtiskais <code>-<\/code> — tiek piemeklēts, bet ne satverts.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs tvērums pats ir mazs sakritības objekts, tāpēc tam var prasīt <code>.Str<\/code>, tā pozīciju un tā tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Virknē ar dubultpēdiņām tvērums interpolējas kā t
