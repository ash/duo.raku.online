<script type="application/json" id="page-data">{"u":"regexes/captures","n":1011,"k":"section","pv":"regexes/quantifiers/exercises/range-quantifier/solution","nx":"regexes/captures/positional","tr":["regexes"],"L":{"en":{"t":"Captures","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Matching tells you <em>whether<\/em> a pattern is present.<\/span> <span class=\"sg\" data-s=\"1\">A <em>capture<\/em> goes further: it remembers a particular piece of the match so you can use it afterwards.<\/span> <span class=\"sg\" data-s=\"2\">This is how you pull a year out of a date, a name out of a record, or the parts of any structured string.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has two kinds of captures: <em>positional<\/em> ones, numbered from zero, and <em>named<\/em> ones, which you label yourself.<\/span> <span class=\"sg\" data-s=\"1\">Both are reached through the match object.<\/span><\/p>"]]},"de":{"t":"Captures","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Treffen sagt Ihnen, <em>ob<\/em> ein Muster vorhanden ist.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Capture<\/em> geht weiter: Es merkt sich ein bestimmtes Stück des Treffers, damit Sie es hinterher verwenden können.<\/span> <span class=\"sg\" data-s=\"2\">So ziehen Sie ein Jahr aus einem Datum, einen Namen aus einem Datensatz oder die Teile jeder strukturierten Zeichenkette heraus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat zwei Arten von Captures: <em>positionale<\/em>, ab null nummeriert, und <em>benannte<\/em>, die Sie selbst beschriften.<\/span> <span class=\"sg\" data-s=\"1\">Beide erreichen Sie über das Match-Objekt.<\/span><\/p>"]]},"nl":{"t":"Captures","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Matchen vertelt je <em>of<\/em> een patroon aanwezig is.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>capture<\/em> gaat verder: hij onthoudt een bepaald stuk van de match zodat je het naderhand kunt gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">Zo haal je een jaartal uit een datum, een naam uit een record, of de onderdelen van elke gestructureerde string.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft twee soorten captures: <em>positionele<\/em>, genummerd vanaf nul, en <em>benoemde<\/em>, die je zelf een label geeft.<\/span> <span class=\"sg\" data-s=\"1\">Beide zijn via het matchobject bereikbaar.<\/span><\/p>"]]},"es":{"t":"Capturas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El emparejamiento te dice <em>si<\/em> un patrón está presente.<\/span> <span class=\"sg\" data-s=\"1\">Una <em>captura<\/em> va más allá: recuerda un fragmento concreto de la coincidencia para que puedas usarlo después.<\/span> <span class=\"sg\" data-s=\"2\">Así es como extraes un año de una fecha, un nombre de un registro o las partes de cualquier cadena estructurada.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene dos clases de capturas: las <em>posicionales<\/em>, numeradas desde cero, y las <em>con nombre<\/em>, que etiquetas tú.<\/span> <span class=\"sg\" data-s=\"1\">A ambas se llega a través del objeto de coincidencia.<\/span><\/p>"]]},"it":{"t":"Catture","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il riconoscimento ti dice <em>se<\/em> uno schema è presente.<\/span> <span class=\"sg\" data-s=\"1\">Una <em>cattura<\/em> va oltre: ricorda un pezzo preciso della corrispondenza perché tu possa usarlo dopo.<\/span> <span class=\"sg\" data-s=\"2\">È così che estrai un anno da una data, un nome da un record o le parti di qualunque stringa strutturata.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha due generi di catture: quelle <em>posizionali<\/em>, numerate da zero, e quelle <em>con nome<\/em>, che etichetti tu.<\/span> <span class=\"sg\" data-s=\"1\">Entrambe si raggiungono attraverso l'oggetto match.<\/span><\/p>"]]},"ru":{"t":"Захваты","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Сопоставление говорит, <em>есть<\/em> ли шаблон в строке. <em>Захват<\/em> идёт дальше: он запоминает определённый кусочек совпадения, чтобы им можно было воспользоваться потом.<\/span> <span class=\"sg\" data-s=\"1\">Именно так из даты вытаскивают год, из записи — имя, а из любой структурированной строки — её части.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku есть два вида захватов: <em>позиционные<\/em>, пронумерованные с нуля, и <em>именованные<\/em>, которым имя даёте вы сами.<\/span> <span class=\"sg\" data-s=\"1\">К обоим обращаются через объект совпадения.<\/span><\/p>"]]},"uk":{"t":"Захоплення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Зіставлення каже вам, <em>чи<\/em> присутній шаблон. <em>Захоплення<\/em> йде далі: воно запам'ятовує певний шматок збігу, щоб ви могли скористатися ним згодом.<\/span> <span class=\"sg\" data-s=\"1\">Саме так із дати витягають рік, із запису — ім'я, а зі структурованого рядка — його частини.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku є два різновиди захоплень: <em>позиційні<\/em>, пронумеровані від нуля, та <em>іменовані<\/em>, які ви позначаєте самі.<\/span> <span class=\"sg\" data-s=\"1\">До обох дістаються через об'єкт збігу.<\/span><\/p>"]]},"bg":{"t":"Прихващания","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Съпоставянето ви казва <em>дали<\/em> шаблонът присъства. <em>Прихващането<\/em> отива по-далеч: то запомня определено парче от съвпадението, за да можете да го използвате после.<\/span> <span class=\"sg\" data-s=\"1\">Точно така изваждате година от дата, име от запис или частите на кой да е структуриран низ.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има два вида прихващания: <em>позиционни<\/em>, номерирани от нула, и <em>именувани<\/em>, които сами обозначавате.<\/span> <span class=\"sg\" data-s=\"1\">И до двата се стига през обекта на съвпадението.<\/span><\/p>"]]}}}</script>
