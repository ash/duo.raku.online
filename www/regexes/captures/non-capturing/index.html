<script type="application/json" id="page-data">{"u":"regexes/captures/non-capturing","n":1016,"k":"topic","pv":"regexes/captures/named/quiz","nx":"regexes/captures/exercises","tr":["regexes","regexes/captures"],"L":{"en":{"t":"Non-capturing groups","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Round brackets <code>( )<\/code> do two jobs at once: they <em>group<\/em> a part of the pattern and they <em>capture<\/em> it into <code>$0<\/code>, <code>$1<\/code>, and so on.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes you only want the first job — to treat several atoms as a single unit — without spending a capture number on it.<\/span> <span class=\"sg\" data-s=\"2\">For that, use square brackets <code>[ ]<\/code>, which group <strong>without<\/strong> capturing.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Grouping matters as soon as you attach a quantifier.<\/span> <span class=\"sg\" data-s=\"1\">A quantifier binds only to the atom right before it, so the pattern below repeats just the final letter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Only the <code>c<\/code> was repeated three times.<\/span> <span class=\"sg\" data-s=\"1\">Wrap the whole piece in <code>[ ]<\/code> to repeat all of it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now <code>[ abc ]<\/code> is one unit, and <code>** 3<\/code> applies to the group.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because <code>[ ]<\/code> takes no capture slot, the numbers stay reserved for the parts you actually care about.<\/span> <span class=\"sg\" data-s=\"1\">Compare a plain key–value match:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Suppose the key may be preceded by a word you want to skip.<\/span> <span class=\"sg\" data-s=\"1\">Group that prefix with <code>[ ]<\/code> so it does not disturb the numbering:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The optional <code>[ \\w+ \\s ]?<\/code> matched <code>the <\/code> but claimed no capture, so <code>$0<\/code> is still the key and <code>$1<\/code> is still the value.<\/span> <span class=\"sg\" data-s=\"1\">Had you written that prefix with <code>( )<\/code>, everything would have shifted: the prefix would become <code>$0<\/code>, the key <code>$1<\/code>, and the value <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The rule is short: use <code>( )<\/code> when you want to keep the matched text, and <code>[ ]<\/code> when you only want to group.<\/span> <span class=\"sg\" data-s=\"1\">Both kinds accept quantifiers and alternations, which is why the earlier alternation <code>[ cat | dog ] house<\/code> used square brackets — it needed the grouping but not another capture.<\/span><\/p>"]]},"de":{"t":"Gruppen ohne Capture","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Runde Klammern <code>( )<\/code> erledigen zwei Aufgaben auf einmal: Sie <em>gruppieren<\/em> einen Teil des Musters und <em>capturen<\/em> ihn in <code>$0<\/code>, <code>$1<\/code> und so weiter.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal wollen Sie nur die erste Aufgabe — mehrere Atome als eine Einheit behandeln —, ohne dafür eine Capture-Nummer zu verbrauchen.<\/span> <span class=\"sg\" data-s=\"2\">Nehmen Sie dafür eckige Klammern <code>[ ]<\/code>, die <strong>ohne<\/strong> Capture gruppieren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Gruppieren wird wichtig, sobald Sie einen Quantor anhängen.<\/span> <span class=\"sg\" data-s=\"1\">Ein Quantor bindet nur an das Atom unmittelbar davor, das folgende Muster wiederholt also nur den letzten Buchstaben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nur das <code>c<\/code> wurde dreimal wiederholt.<\/span> <span class=\"sg\" data-s=\"1\">Hüllen Sie das ganze Stück in <code>[ ]<\/code>, um alles zu wiederholen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun ist <code>[ abc ]<\/code> eine Einheit, und <code>** 3<\/code> bezieht sich auf die Gruppe.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Weil <code>[ ]<\/code> keinen Capture-Platz belegt, bleiben die Nummern für die Teile reserviert, auf die es Ihnen wirklich ankommt.<\/span> <span class=\"sg\" data-s=\"1\">Vergleichen Sie einen schlichten Treffer aus Schlüssel und Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nehmen wir an, dem Schlüssel darf ein Wort vorangehen, das Sie überspringen möchten.<\/span> <span class=\"sg\" data-s=\"1\">Gruppieren Sie dieses Präfix mit <code>[ ]<\/code>, damit es die Nummerierung nicht stört:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das optionale <code>[ \\w+ \\s ]?<\/code> hat <code>the <\/code> getroffen, aber kein Capture beansprucht, <code>$0<\/code> ist also weiterhin der Schlüssel und <code>$1<\/code> weiterhin der Wert.<\/span> <span class=\"sg\" data-s=\"1\">Hätten Sie jenes Präfix mit <code>( )<\/code> geschrieben, wäre alles verrutscht: Das Präfix würde <code>$0<\/code>, der Schlüssel <code>$1<\/code> und der Wert <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Regel ist kurz: Nehmen Sie <code>( )<\/code>, wenn Sie den getroffenen Text behalten wollen, und <code>[ ]<\/code>, wenn Sie nur gruppieren wollen.<\/span> <span class=\"sg\" data-s=\"1\">Beide Arten nehmen Quantoren und Alternativen auf, weshalb die frühere Alternation <code>[ cat | dog ] house<\/code> eckige Klammern verwendet hat — sie brauchte die Gruppierung, aber kein weiteres Capture.<\/span><\/p>"]]},"nl":{"t":"Niet-capturende groepen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ronde haken <code>( )<\/code> doen twee dingen tegelijk: ze <em>groeperen<\/em> een deel van het patroon en ze <em>capturen<\/em> het in <code>$0<\/code>, <code>$1<\/code>, enzovoort.<\/span> <span class=\"sg\" data-s=\"1\">Soms wil je alleen het eerste — meerdere atomen als één eenheid behandelen — zonder er een capturenummer aan te besteden.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik daarvoor vierkante haken <code>[ ]<\/code>, die groeperen <strong>zonder<\/strong> te capturen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Groeperen doet ertoe zodra je er een kwantor aan hangt.<\/span> <span class=\"sg\" data-s=\"1\">Een kwantor bindt alleen aan het atoom er direct voor, dus het onderstaande patroon herhaalt slechts de laatste letter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alleen de <code>c<\/code> werd drie keer herhaald.<\/span> <span class=\"sg\" data-s=\"1\">Wikkel het hele stuk in <code>[ ]<\/code> om het geheel te herhalen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu is <code>[ abc ]<\/code> één eenheid, en <code>** 3<\/code> hoort bij de groep.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>[ ]<\/code> geen captureplek inneemt, blijven de nummers gereserveerd voor de delen waar het je werkelijk om gaat.<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk een gewone match van sleutel en waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Stel dat de sleutel voorafgegaan kan worden door een woord dat je wilt overslaan.<\/span> <span class=\"sg\" data-s=\"1\">Groepeer dat voorvoegsel met <code>[ ]<\/code> zodat het de nummering niet verstoort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De optionele <code>[ \\w+ \\s ]?<\/code> matchte <code>the <\/code> maar eiste geen capture op, dus is <code>$0<\/code> nog steeds de sleutel en <code>$1<\/code> nog steeds de waarde.<\/span> <span class=\"sg\" data-s=\"1\">Had je dat voorvoegsel met <code>( )<\/code> geschreven, dan zou alles opgeschoven zijn: het voorvoegsel zou <code>$0<\/code> worden, de sleutel <code>$1<\/code> en de waarde <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De regel is kort: gebruik <code>( )<\/code> wanneer je de gematchte tekst wilt bewaren, en <code>[ ]<\/code> wanneer je alleen wilt groeperen.<\/span> <span class=\"sg\" data-s=\"1\">Beide soorten accepteren kwantoren en alternatieven, en daarom gebruikte de eerdere alternatie <code>[ cat | dog ] house<\/code> vierkante haken — die had de groepering nodig maar geen extra capture.<\/span><\/p>"]]},"es":{"t":"Grupos sin captura","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los paréntesis <code>( )<\/code> hacen dos trabajos a la vez: <em>agrupan<\/em> una parte del patrón y la <em>capturan<\/em> en <code>$0<\/code>, <code>$1<\/code> y demás.<\/span> <span class=\"sg\" data-s=\"1\">A veces solo quieres el primer trabajo — tratar varios átomos como una sola unidad — sin gastar en ello un número de captura.<\/span> <span class=\"sg\" data-s=\"2\">Para eso usa los corchetes <code>[ ]<\/code>, que agrupan <strong>sin<\/strong> capturar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La agrupación importa en cuanto añades un cuantificador.<\/span> <span class=\"sg\" data-s=\"1\">Un cuantificador se liga solo al átomo inmediatamente anterior, así que el patrón de abajo repite únicamente la última letra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Solo se repitió la <code>c<\/code> tres veces.<\/span> <span class=\"sg\" data-s=\"1\">Envuelve toda la pieza en <code>[ ]<\/code> para repetirla entera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora <code>[ abc ]<\/code> es una sola unidad y <code>** 3<\/code> se aplica al grupo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como <code>[ ]<\/code> no ocupa ninguna plaza de captura, los números quedan reservados para las partes que de verdad te importan.<\/span> <span class=\"sg\" data-s=\"1\">Compara una simple coincidencia de clave y valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Supón que a la clave puede precederla una palabra que quieres saltarte.<\/span> <span class=\"sg\" data-s=\"1\">Agrupa ese prefijo con <code>[ ]<\/code> para que no altere la numeración:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El opcional <code>[ \\w+ \\s ]?<\/code> emparejó <code>the <\/code> pero no reclamó ninguna captura, así que <code>$0<\/code> sigue siendo la clave y <code>$1<\/code> sigue siendo el valor.<\/span> <span class=\"sg\" data-s=\"1\">Si hubieras escrito ese prefijo con <code>( )<\/code>, todo se habría desplazado: el prefijo sería <code>$0<\/code>, la clave <code>$1<\/code> y el valor <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La regla es corta: usa <code>( )<\/code> cuando quieras conservar el texto emparejado, y <code>[ ]<\/code> cuando solo quieras agrupar.<\/span> <span class=\"sg\" data-s=\"1\">Ambas clases admiten cuantificadores y alternativas, y por eso la alternativa anterior <code>[ cat | dog ] house<\/code> usaba corchetes: necesitaba la agrupación pero no otra captura.<\/span><\/p>"]]},"it":{"t":"Gruppi senza cattura","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Le parentesi tonde <code>( )<\/code> fanno due lavori insieme: <em>raggruppano<\/em> una parte dello schema e la <em>catturano<\/em> in <code>$0<\/code>, <code>$1<\/code> e così via.<\/span> <span class=\"sg\" data-s=\"1\">A volte vuoi solo il primo lavoro — trattare più atomi come un'unica unità — senza sprecarci un numero di cattura.<\/span> <span class=\"sg\" data-s=\"2\">Per questo usa le parentesi quadre <code>[ ]<\/code>, che raggruppano <strong>senza<\/strong> catturare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il raggruppamento conta non appena attacchi un quantificatore.<\/span> <span class=\"sg\" data-s=\"1\">Un quantificatore si lega solo all'atomo che lo precede immediatamente, quindi lo schema qui sotto ripete solo l'ultima lettera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Solo la <code>c<\/code> è stata ripetuta tre volte.<\/span> <span class=\"sg\" data-s=\"1\">Avvolgi tutto il pezzo in <code>[ ]<\/code> per ripeterlo per intero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora <code>[ abc ]<\/code> è un'unica unità, e <code>** 3<\/code> si applica al gruppo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>[ ]<\/code> non occupa alcun posto di cattura, i numeri restano riservati alle parti che ti interessano davvero.<\/span> <span class=\"sg\" data-s=\"1\">Confronta una semplice corrispondenza chiave-valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Supponi che la chiave possa essere preceduta da una parola che vuoi saltare.<\/span> <span class=\"sg\" data-s=\"1\">Raggruppa quel prefisso con <code>[ ]<\/code> così che non disturbi la numerazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'opzionale <code>[ \\w+ \\s ]?<\/code> ha riconosciuto <code>the <\/code> ma non ha richiesto alcuna cattura, quindi <code>$0<\/code> è ancora la chiave e <code>$1<\/code> è ancora il valore.<\/span> <span class=\"sg\" data-s=\"1\">Se avessi scritto quel prefisso con <code>( )<\/code>, tutto si sarebbe spostato: il prefisso sarebbe diventato <code>$0<\/code>, la chiave <code>$1<\/code> e il valore <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La regola è breve: usa <code>( )<\/code> quando vuoi conservare il testo riconosciuto e <code>[ ]<\/code> quando vuoi solo raggruppare.<\/span> <span class=\"sg\" data-s=\"1\">Entrambi i generi accettano quantificatori e alternative, ed è per questo che la precedente alternativa <code>[ cat | dog ] house<\/code> usava le parentesi quadre: le serviva il raggruppamento ma non un'altra cattura.<\/span><\/p>"]]},"lv":{"t":"Grupas bez tvēruma","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Apaļās iekavas <code>( )<\/code> dara divus darbus uzreiz: tās <em>sagrupē<\/em> raksturā daļu un <em>satver<\/em> to <code>$0<\/code>, <code>$1<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz vēlaties tikai pirmo darbu — uztvert vairākus atomus kā vienu vienību —, netērējot tam tvēruma numuru.<\/span> <span class=\"sg\" data-s=\"2\">Tam izmantojiet kvadrātiekavas <code>[ ]<\/code>, kas grupē <strong>bez<\/strong> tveršanas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Grupēšanai ir nozīme, tiklīdz piekabināt kvantoru.<\/span> <span class=\"sg\" data-s=\"1\">Kvantors saistās tikai ar atomu, kas ir tieši pirms tā, tāpēc zemāk redzamais raksturs atkārto tikai pēdējo burtu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Trīs reizes tika atkārtots tikai <code>c<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ietiniet visu gabalu <code>[ ]<\/code>, lai atkārtotu to visu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad <code>[ abc ]<\/code> ir viena vienība, un <code>** 3<\/code> attiecas uz grupu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>[ ]<\/code> neaizņem tvēruma vietu, numuri paliek rezervēti tām daļām, kas jums patiešām rūp.<\/span> <span class=\"sg\" data-s=\"1\">Salīdziniet vienkāršu atslēgas un vērtības sakritību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pieņemsim, ka pirms atslēgas var būt vārds, ko vēlaties izlaist.<\/span> <span class=\"sg\" data-s=\"1\">Sagrupējiet šo priedēkli ar <code>[ ]<\/code>, lai tas netraucētu numerāciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Neobligātais <code>[ \\w+ \\s ]?<\/code> sakrita ar <code>the <\/code>, taču nepieprasīja nevienu tvērumu, tāpēc <code>$0<\/code> joprojām ir atslēga un <code>$1<\/code> joprojām ir vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Ja šo priedēkli būtu uzrakstījis ar <code>( )<\/code>, viss būtu pabīdījies: priedēklis kļūtu par <code>$0<\/code>, atslēga par <code>$1<\/code> un vērtība par <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Likums ir īss: izmantojiet <code>( )<\/code>, kad vēlaties paturēt sakritušo tekstu, un <code>[ ]<\/code>, kad vēlaties tikai sagrupēt.<\/span> <span class=\"sg\" data-s=\"1\">Abi veidi pieņem kvantorus un alternatīvas, un tieši tāpēc agrākā alternatīva <code>[ cat | dog ] house<\/code> izmantoja kvadrātiekavas — tai bija vajadzīga grupēšana, nevis vēl viens tvērums.<\/span><\/p>"]]},"ru":{"t":"Незахватывающие группы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Круглые скобки <code>( )<\/code> делают сразу две работы: они <em>группируют<\/em> часть шаблона и <em>захватывают<\/em> её в <code>$0<\/code>, <code>$1<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"1\">Иногда нужна только первая работа — рассматривать несколько атомов как единое целое, — не расходуя на это номер захвата.<\/span> <span class=\"sg\" data-s=\"2\">Для этого служат квадратные скобки <code>[ ]<\/code>, которые группируют <strong>без<\/strong> захвата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Группировка становится важна, как только вы приписываете квантификатор.<\/span> <span class=\"sg\" data-s=\"1\">Квантификатор связывается только с тем атомом, который стоит прямо перед ним, поэтому шаблон ниже повторяет лишь последнюю букву:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трижды повторилась только <code>c<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Заключите весь кусочек в <code>[ ]<\/code>, чтобы повторялся он целиком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь <code>[ abc ]<\/code> — это одна единица, и <code>** 3<\/code> относится к группе.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>[ ]<\/code> не занимает ячейку захвата, номера остаются закреплёнными за теми частями, которые вам действительно нужны.<\/span> <span class=\"sg\" data-s=\"1\">Сравните с обычным сопоставлением «ключ — значение»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пусть ключу может предшествовать слово, которое надо пропустить.<\/span> <span class=\"sg\" data-s=\"1\">Сгруппируйте этот префикс через <code>[ ]<\/code>, чтобы он не сбивал нумерацию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Необязательная группа <code>[ \\w+ \\s ]?<\/code> сопоставилась с <code>the <\/code>, но не заняла захват, поэтому <code>$0<\/code> по-прежнему ключ, а <code>$1<\/code> — значение.<\/span> <span class=\"sg\" data-s=\"1\">Если бы вы записали этот префикс через <code>( )<\/code>, всё сдвинулось бы: префикс стал бы <code>$0<\/code>, ключ — <code>$1<\/code>, а значение — <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Правило короткое: используйте <code>( )<\/code>, когда совпавший текст нужно сохранить, и <code>[ ]<\/code>, когда нужна только группировка.<\/span> <span class=\"sg\" data-s=\"1\">Оба вида принимают квантификаторы и альтернативы — вот почему в приведённой ранее альтернативе <code>[ cat | dog ] house<\/code> были квадратные скобки: там требовалась группировка, а лишний захват — нет.<\/span><\/p>"]]},"uk":{"t":"Групи без захоплення","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Круглі дужки <code>( )<\/code> роблять дві справи водночас: вони <em>групують<\/em> частину шаблону і <em>захоплюють<\/em> її в <code>$0<\/code>, <code>$1<\/code> тощо.<\/span> <span class=\"sg\" data-s=\"1\">Іноді потрібна лише перша справа — розглядати кілька атомів як одну одиницю, — не витрачаючи на це номера захоплення.<\/span> <span class=\"sg\" data-s=\"2\">Для цього використовують квадратні дужки <code>[ ]<\/code>, які групують <strong>без<\/strong> захоплення.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Групування стає важливим, щойно ви чіпляєте квантифікатор.<\/span> <span class=\"sg\" data-s=\"1\">Квантифікатор зв'язується лише з атомом, що стоїть безпосередньо перед ним, тож наведений шаблон повторює саму лише останню літеру:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тричі повторилася тільки <code>c<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Загорніть увесь шматок у <code>[ ]<\/code>, щоб повторити його весь:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер <code>[ abc ]<\/code> є однією одиницею, і <code>** 3<\/code> застосовується до групи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>[ ]<\/code> не займає слота захоплення, номери лишаються за тими частинами, які вам справді важливі.<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте зі звичайним зіставленням ключа й значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Припустімо, перед ключем може стояти слово, яке ви хочете пропустити.<\/span> <span class=\"sg\" data-s=\"1\">Згрупуйте цей префікс через <code>[ ]<\/code>, щоб він не порушив нумерації:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Необов'язковий <code>[ \\w+ \\s ]?<\/code> зіставився з <code>the <\/code>, але не забрав жодного захоплення, тож <code>$0<\/code> і далі є ключем, а <code>$1<\/code> — значенням.<\/span> <span class=\"sg\" data-s=\"1\">Якби ви записали цей префікс через <code>( )<\/code>, усе б зсунулося: префікс став би <code>$0<\/code>, ключ — <code>$1<\/code>, а значення — <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Правило коротке: беріть <code>( )<\/code>, коли хочете зберегти зіставлений текст, і <code>[ ]<\/code>, коли хочете лише згрупувати.<\/span> <span class=\"sg\" data-s=\"1\">Обидва різновиди приймають квантифікатори й альтернативи, — саме тому в наведеній раніше альтернативі <code>[ cat | dog ] house<\/code> використано квадратні дужки: там потрібне було групування, а не ще одне захоплення.<\/span><\/p>"]]},"bg":{"t":"Групи без прихващане","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кръглите скоби <code>( )<\/code> вършат две работи наведнъж: те <em>групират<\/em> част от шаблона и я <em>прихващат<\/em> в <code>$0<\/code>, <code>$1<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"1\">Понякога искате само първата работа — да третирате няколко атома като една единица, — без да харчите номер на прихващане за това.<\/span> <span class=\"sg\" data-s=\"2\">За целта използвайте квадратните скоби <code>[ ]<\/code>, които групират <strong>без<\/strong> прихващане.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Групирането става важно веднага щом прикачите квантификатор.<\/span> <span class=\"sg\" data-s=\"1\">Квантификаторът се свързва само с атома непосредствено преди себе си, така че шаблонът по-долу повтаря само последната буква:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abccc' ~~ / abc ** 3 /; # ｢abccc｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Повторено три пъти беше само <code>c<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обвийте цялото парче в <code>[ ]<\/code>, за да повторите всичко:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abcabcabc' ~~ / [ abc ] ** 3 /; # ｢abcabcabc｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега <code>[ abc ]<\/code> е една единица, а <code>** 3<\/code> се отнася за групата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже <code>[ ]<\/code> не заема място за прихващане, номерата остават запазени за онези части, които наистина ви интересуват.<\/span> <span class=\"sg\" data-s=\"1\">Сравнете обикновено съпоставяне на ключ и стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'foo=42' ~~ / (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Да предположим, че ключът може да е предхождан от дума, която искате да прескочите.<\/span> <span class=\"sg\" data-s=\"1\">Групирайте тази представка с <code>[ ]<\/code>, за да не разбърка номерацията:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the foo=42' ~~ / [ \\w+ \\s ]? (\\w+) '=' (\\d+) / {\n    say $0; # ｢foo｣\n    say $1; # ｢42｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Незадължителното <code>[ \\w+ \\s ]?<\/code> съпостави <code>the <\/code>, но не претендира за прихващане, така че <code>$0<\/code> пак е ключът, а <code>$1<\/code> пак е стойността.<\/span> <span class=\"sg\" data-s=\"1\">Ако бяхте написали тази представка с <code>( )<\/code>, всичко щеше да се измести: представката щеше да стане <code>$0<\/code>, ключът <code>$1<\/code>, а стойността <code>$2<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Правилото е кратко: използвайте <code>( )<\/code>, когато искате да запазите съпоставения текст, и <code>[ ]<\/code>, когато искате само да групирате.<\/span> <span class=\"sg\" data-s=\"1\">И двата вида приемат квантификатори и алтернативи — затова по-раншната алтернатива <code>[ cat | dog ] house<\/code> използваше квадратни скоби: нуждаеше се от групиране, но не и от още едно прихващане.<\/span><\/p>"]]}}}</script>
