<script type="application/json" id="page-data">{"u":"regexes/action-classes/exercises/humanise-a-date/solution","n":1161,"k":"solution","pv":"regexes/action-classes/exercises/humanise-a-date","nx":"paradigms","tr":["regexes","regexes/action-classes"],"L":{"en":{"t":"The solution of ’Humanise a date‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Unlike a plain arithmetic action, the token methods make values of <strong>different kinds<\/strong>: <code>year<\/code> and <code>day<\/code> make integers, but <code>month<\/code> makes a <em>string<\/em> by using its numeric value as an index into a list of month names. <code>$/ - 1<\/code> numifies the two-digit match (<code>07<\/code> → <code>7<\/code>) and shifts to a zero-based index, so <code>month<\/code> <code>07<\/code> makes <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>TOP<\/code> method never re-examines the raw text. It just reads the three values the sub-methods already made — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> — and interpolates them into the final string. Reading <code>5<\/code> back from <code>day<\/code> also drops the leading zero for free.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is the everyday job of an action class: parse structured input once, then let each method turn its own piece into whatever the rest of the program needs.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Machen Sie ein Datum lesbar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anders als bei einer schlichten Rechenaktion machen die Tokenmethoden Werte <strong>verschiedener Art<\/strong>: <code>year<\/code> und <code>day<\/code> machen ganze Zahlen, <code>month<\/code> aber eine <em>Zeichenkette<\/em>, indem es seinen Zahlenwert als Index in eine Liste von Monatsnamen verwendet. <code>$/ - 1<\/code> macht aus dem zweistelligen Treffer eine Zahl (<code>07<\/code> → <code>7<\/code>) und verschiebt auf einen ab null gezählten Index, <code>month<\/code> <code>07<\/code> macht also <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Methode <code>TOP<\/code> sieht sich den blanken Text nie wieder an. Sie liest nur die drei Werte, die die Untermethoden bereits gemacht haben — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> —, und setzt sie in die endgültige Zeichenkette ein. <code>5<\/code> aus <code>day<\/code> zurückzulesen lässt nebenbei auch die führende Null wegfallen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das ist die alltägliche Aufgabe einer Aktionsklasse: strukturierte Eingabe einmal zerlegen und dann jede Methode ihr eigenes Stück in das verwandeln lassen, was der Rest des Programms braucht.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Maak een datum leesbaar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anders dan bij een gewone rekenkundige actie maken de tokenmethoden waarden van <strong>verschillende soorten<\/strong>: <code>year<\/code> en <code>day<\/code> maken gehele getallen, maar <code>month<\/code> maakt een <em>string<\/em> door zijn numerieke waarde als index in een lijst maandnamen te gebruiken. <code>$/ - 1<\/code> maakt van de match met twee cijfers een getal (<code>07<\/code> → <code>7<\/code>) en verschuift naar een index vanaf nul, dus maakt <code>month<\/code> <code>07<\/code> <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De methode <code>TOP<\/code> bekijkt de kale tekst nooit opnieuw. Ze leest alleen de drie waarden die de submethoden al gemaakt hebben — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> — en interpoleert ze in de uiteindelijke string. <code>5<\/code> uit <code>day<\/code> teruglezen laat meteen ook de voorloopnul vallen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit is het dagelijkse werk van een actieklasse: gestructureerde invoer één keer ontleden en daarna elke methode haar eigen stuk laten omzetten in wat de rest van het programma nodig heeft.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Haga una fecha legible","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A diferencia de una simple acción aritmética, los métodos de los tokens producen valores de <strong>clases distintas<\/strong>: <code>year<\/code> y <code>day<\/code> producen enteros, pero <code>month<\/code> produce una <em>cadena<\/em> usando su valor numérico como índice en una lista de nombres de mes. <code>$/ - 1<\/code> convierte en número la coincidencia de dos dígitos (<code>07<\/code> → <code>7<\/code>) y pasa a un índice que empieza en cero, así que el <code>month<\/code> <code>07<\/code> produce <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El método <code>TOP<\/code> nunca vuelve a examinar el texto en bruto. Solo lee los tres valores que ya produjeron los submétodos — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> — y los interpola en la cadena final. Leer <code>5<\/code> de vuelta desde <code>day<\/code> elimina además gratis el cero inicial.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ese es el trabajo cotidiano de una clase de acciones: analizar una vez la entrada estructurada y dejar después que cada método convierta su propia pieza en lo que el resto del programa necesite.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Rendete leggibile una data","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A differenza di una semplice azione aritmetica, i metodi dei token producono valori di <strong>generi diversi<\/strong>: <code>year<\/code> e <code>day<\/code> producono interi, ma <code>month<\/code> produce una <em>stringa<\/em> usando il proprio valore numerico come indice in un elenco di nomi di mesi. <code>$/ - 1<\/code> converte in numero la corrispondenza di due cifre (<code>07<\/code> → <code>7<\/code>) e passa a un indice che parte da zero, quindi il <code>month<\/code> <code>07<\/code> produce <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il metodo <code>TOP<\/code> non riesamina mai il testo grezzo. Legge soltanto i tre valori che i sottometodi hanno già prodotto — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> — e li interpola nella stringa finale. Rileggere <code>5<\/code> da <code>day<\/code> fa cadere gratis anche lo zero iniziale.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">È questo il lavoro quotidiano di una classe di azioni: analizzare una volta l'input strutturato, poi lasciare che ogni metodo trasformi il proprio pezzo in ciò che serve al resto del programma.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Сделайте дату человекочитаемой","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В отличие от простого арифметического действия, методы токенов делают значения <strong>разного рода<\/strong>: <code>year<\/code> и <code>day<\/code> делают целые числа, а <code>month<\/code> делает <em>строку<\/em>, используя своё числовое значение как индекс в списке названий месяцев. Выражение <code>$/ - 1<\/code> приводит двузначное совпадение к числу (<code>07<\/code> → <code>7<\/code>) и сдвигает к индексу, считаемому с нуля, поэтому месяц <code>07<\/code> делает <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Метод <code>TOP<\/code> вообще не заглядывает в сырой текст. Он просто читает три значения, уже сделанные вложенными методами, — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> — и подставляет их в итоговую строку. Чтение <code>5<\/code> обратно из <code>day<\/code> заодно бесплатно убирает ведущий ноль.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В этом и состоит повседневная работа класса действий: один раз разобрать структурированный ввод, а затем позволить каждому методу превратить свой кусочек в то, что нужно остальной программе.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Дата по-людськи»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">На відміну від простої арифметичної дії, методи токенів створюють значення <strong>різних видів<\/strong>: <code>year<\/code> та <code>day<\/code> створюють цілі числа, а <code>month<\/code> створює <em>рядок<\/em>, використовуючи своє числове значення як індекс у списку назв місяців. <code>$/ - 1<\/code> перетворює двоцифровий збіг на число (<code>07<\/code> → <code>7<\/code>) і зсуває його до індексу від нуля, тож місяць <code>07<\/code> створює <code>July<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Метод <code>TOP<\/code> жодного разу не переглядає сирий текст. Він лише читає три значення, які вже створили підметоди, — <code>$&lt;day&gt;.made<\/code>, <code>$&lt;month&gt;.made<\/code>, <code>$&lt;year&gt;.made<\/code> — і вставляє їх у підсумковий рядок. Читання <code>5<\/code> назад із <code>day<\/code> заразом задарма прибирає ведучий нуль.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це щоденна робота класу дій: один раз розібрати структурований вхідний текст, а далі дати кожному методу перетворити свій шматок на те, що потрібно решті програми.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Дата по човешки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Date {\n    token TOP   { &lt;year&gt; '-' &lt;month&gt; '-' &lt;day&gt; }\n    token year  { \\d ** 4 }\n    token month { \\d ** 2 }\n    token day   { \\d ** 2 }\n}\n\nclass Humanise {\n    method year($/)  { make $/.Int }\n    method month($/) { make &lt;January February March April May June\n                             July August September October November December&gt;[$/ - 1] }\n    method day($/)   { make $/.Int }\n    method TOP($/)   { make \"{$&lt;day&gt;.made} {$&lt;month&gt;.made} {$&lt;year&gt;.made}\" }\n}\n\nsay Date.parse('2026-07-05', actions =&gt; Humanise.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/humanise-a-date.raku\" target=\"_blank\" rel=\"noopener\">humanise-a-date.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>5 July 2026<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За разлика от обикновено аритметично дейс
