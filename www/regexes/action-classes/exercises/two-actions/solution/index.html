<script type="application/json" id="page-data">{"u":"regexes/action-classes/exercises/two-actions/solution","n":1159,"k":"solution","pv":"regexes/action-classes/exercises/two-actions","nx":"regexes/action-classes/exercises/humanise-a-date","tr":["regexes","regexes/action-classes"],"L":{"en":{"t":"The solution of ’One grammar, two actions‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The grammar only describes the shape <code>number,number<\/code>; it knows nothing about what to compute.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The two action classes attach different meanings to the same parse — one sums the numbers, the other subtracts them. Passing a different <code>actions<\/code> object to <code>.parse<\/code> is all it takes to get a different result, without changing the grammar at all.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Eine Grammatik, zwei Aktionen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Grammatik beschreibt nur die Form <code>Zahl,Zahl<\/code>; sie weiß nichts davon, was zu berechnen ist.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die beiden Aktionsklassen hängen derselben Zerlegung verschiedene Bedeutungen an — die eine summiert die Zahlen, die andere zieht sie voneinander ab. Ein anderes <code>actions<\/code>-Objekt an <code>.parse<\/code> zu übergeben genügt für ein anderes Ergebnis, ganz ohne die Grammatik zu ändern.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Eén grammatica, twee acties","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De grammatica beschrijft alleen de vorm <code>getal,getal<\/code>; ze weet niets over wat er berekend moet worden.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De twee actieklassen hangen verschillende betekenissen aan dezelfde parse — de ene telt de getallen op, de andere trekt ze af. Een ander <code>actions<\/code>-object aan <code>.parse<\/code> meegeven is alles wat nodig is voor een ander resultaat, zonder de grammatica ook maar aan te raken.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Una gramática, dos clases de acción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github. pan class=\"sg\" data-s=\"0\">La grammatica descrive solo la forma <code>numero,numero<\/code>; non sa nulla di che cosa calcolare.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le due classi di azioni attaccano significati diversi alla stessa analisi — una somma i numeri, l'altra li sottrae. Passare a <code>.parse<\/code> un oggetto <code>actions<\/code> diverso è tutto ciò che serve per ottenere un risultato diverso, senza cambiare affatto la grammatica.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Viena gramatika, divas darbību klases","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gramatika apraksta tikai formu <code>skaitlis,skaitlis<\/code>; par to, kas jāaprēķina, tā neko nezina.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abas darbību klases vienam un tam pašam parsējumam piesaista dažādas nozīmes — viena skaitļus saskaita, otra atņem. Lai iegūtu citu rezultātu, pietiek <code>.parse<\/code> padot citu <code>actions<\/code> objektu, gramatiku nemaz nemainot.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Одна грамматика, два класса действий","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Грамматика описывает лишь форму «число,число»; о том, что вычислять, она ничего не знает.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Два класса действий придают одному и тому же разбору разный смысл: один складывает числа, другой вычитает. Чтобы получить другой результат, достаточно передать в <code>.parse<\/code> другой объект <code>actions<\/code>, вообще не меняя грамматику.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Одна граматика, дві дії»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Граматика описує лише форму <code>число,число<\/code>; вона нічого не знає про те, що саме обчислювати.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Два класи дій прикріплюють до того самого розбору різні значення — один додає числа, другий віднімає. Достатньо передати в <code>.parse<\/code> інший об'єкт <code>actions<\/code>, щоб отримати інший результат, і граматику при цьому взагалі не змінюють.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Една граматика, две действия","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"h  data-s=\"0\">La gramatiko nur priskribas la formon <code>number,number<\/code>; ĝi scias nenion pri tio, kion kalkuli.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La du agoklasoj alfiksas malsamajn signifojn al la sama analizo — unu sumigas la nombrojn, la alia subtrahas ilin. Transdoni malsaman objekton <code>actions<\/code> al <code>.parse<\/code> estas ĉio, kio necesas por ricevi malsaman rezulton, sen ŝanĝi la gramatikon entute.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Una grammatica, duae classes actionum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP { &lt;a&gt; ',' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass Sum  { method TOP($/) { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\nclass Diff { method TOP($/) { make $&lt;a&gt;.Int - $&lt;b&gt;.Int } }\n\nsay Pair.parse('10,20', actions =&gt; Sum.new).made;\nsay Pair.parse('10,20', actions =&gt; Diff.new).made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/action-classes/two-actions.raku\" target=\"_blank\" rel=\"noopener\">two-actions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>30\n-10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Grammatica solum formam <code>numerus,numerus<\/code> describit; nihil scit de eo quid computandum sit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Duae classes actionum diversas significationes eidem analysi adfigunt — una numeros summat, altera eos subtrahit. Aliud obiectum <code>actions<\/code> ad <code>.parse<\/code> tradere satis est ut alium effectum accipias, sine grammatica omnino mutata.<\/span><\/li><\/ol>"]]}}}</script>
