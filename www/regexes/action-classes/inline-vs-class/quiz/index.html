<script type="application/json" id="page-data">{"u":"regexes/action-classes/inline-vs-class/quiz","n":1154,"k":"quiz","pv":"regexes/action-classes/inline-vs-class","nx":"regexes/action-classes/exercises","tr":["regexes","regexes/action-classes","regexes/action-classes/inline-vs-class"],"L":{"en":{"t":"Quiz — Action classes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">How do you tell <code>.parse<\/code> to use an action class called <code>MyActions<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The action object is passed with the <code>actions<\/code> named argument, and it must be an <strong>instance<\/strong>, created with <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">As the grammar parses, the matching token methods on that instance run and build the result.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Aktionsklassen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wie sagen Sie <code>.parse<\/code>, dass es eine Aktionsklasse namens <code>MyActions<\/code> verwenden soll?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Aktionsobjekt wird mit dem benannten Argument <code>actions<\/code> übergeben und muss eine <strong>Instanz<\/strong> sein, mit <code>.new<\/code> erzeugt.<\/span> <span class=\"sg\" data-s=\"1\">Während die Grammatik zerlegt, laufen die passenden Tokenmethoden auf dieser Instanz und bauen das Ergebnis auf.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Actieklassen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoe vertel je <code>.parse<\/code> dat hij een actieklasse met de naam <code>MyActions<\/code> moet gebruiken?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het actieobject wordt met het benoemde argument <code>actions<\/code> meegegeven, en het moet een <strong>instantie<\/strong> zijn, gemaakt met <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Terwijl de grammatica ontleedt, draaien de bijpassende tokenmethoden op die instantie en bouwen ze het resultaat op.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Clases de acción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Cómo le dices a <code>.parse<\/code> que use una clase de acciones llamada <code>MyActions<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El objeto de acciones se pasa con el argumento con nombre <code>actions<\/code>, y debe ser una <strong>instancia<\/strong>, creada con <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mientras la gramática analiza, los métodos de los tokens correspondientes de esa instancia se ejecutan y construyen el resultado.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Classi di azione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Come dici a <code>.parse<\/code> di usare una classe di azioni chiamata <code>MyActions<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'oggetto delle azioni si passa con l'argomento nominato <code>actions<\/code>, e deve essere un'<strong>istanza<\/strong>, creata con <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mentre la grammatica analizza, i metodi dei token corrispondenti su quell'istanza girano e costruiscono il risultato.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Классы действий","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Как сказать <code>.parse<\/code>, чтобы он использовал класс действий по имени <code>MyActions<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Объект действий передаётся именованным аргументом <code>actions<\/code>, и это должен быть <strong>экземпляр<\/strong>, созданный через <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">По мере разбора выполняются соответствующие методы токенов у этого экземпляра и строят результат.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Класи дій","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Як сказати <code>.parse<\/code> використовувати клас дій з іменем <code>MyActions<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Об'єкт дій передають через іменований аргумент <code>actions<\/code>, і він має бути <strong>примірником<\/strong>, створеним за допомогою <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поки граматика розбирає текст, на цьому примірнику виконуються відповідні методи токенів і будують результат.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Класове за действия","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Как казвате на <code>.parse<\/code> да използва клас за действия на име <code>MyActions<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>Grammar.parse($str, MyActions)<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>Grammar.parse($str, actions =&gt; MyActions.new)<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Grammar.parse($str).MyActions<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>Grammar.parse($str, action =&gt; MyActions)<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обектът с действия се подава чрез именувания аргумент <code>actions<\/code> и трябва да бъде <strong>екземпляр<\/strong>, създаден с <code>.new<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Докато граматиката разбира текста, върху този екземпляр се изпълняват съответните методи на токените и изграждат резултата.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
