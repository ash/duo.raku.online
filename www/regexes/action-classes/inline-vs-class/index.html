<script type="application/json" id="page-data">{"u":"regexes/action-classes/inline-vs-class","n":1153,"k":"topic","pv":"regexes/action-classes/writing-actions/quiz","nx":"regexes/action-classes/inline-vs-class/quiz","tr":["regexes","regexes/action-classes"],"L":{"en":{"t":"Inline actions vs action classes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You now have two ways to attach meaning to a parse.<\/span> <span class=\"sg\" data-s=\"1\">Which should you use?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Inline actions<\/strong> put a <code>{ make … }<\/code> block right inside the token:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">They are quick to write and fine for a tiny grammar or a one-off script.<\/span> <span class=\"sg\" data-s=\"1\">The cost is that the pattern and the logic are tangled together.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>An action class<\/strong> keeps the two apart — the grammar describes the shape, the action class describes the meaning:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This separation has real advantages as a grammar grows: the pattern stays readable, and you can pair <strong>one grammar with several action classes<\/strong> — one that evaluates, one that pretty-prints, one that builds a data structure — without touching the grammar at all.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The rule of thumb: inline actions for something small and throwaway, an action class for anything you will maintain or reuse.<\/span><\/p>"]]},"de":{"t":"Inline-Aktionen gegen Aktionsklassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie haben nun zwei Wege, einer Zerlegung Bedeutung zu geben.<\/span> <span class=\"sg\" data-s=\"1\">Welchen sollten Sie nehmen?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Inline-Aktionen<\/strong> setzen einen Block <code>{ make … }<\/code> unmittelbar in das Token:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie sind schnell geschrieben und für eine winzige Grammatik oder ein einmaliges Skript völlig in Ordnung.<\/span> <span class=\"sg\" data-s=\"1\">Der Preis ist, dass Muster und Logik ineinander verwoben sind.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Eine Aktionsklasse<\/strong> hält beides auseinander — die Grammatik beschreibt die Form, die Aktionsklasse die Bedeutung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diese Trennung bringt echte Vorteile, sobald eine Grammatik wächst: Das Muster bleibt lesbar, und Sie können <strong>eine Grammatik mit mehreren Aktionsklassen<\/strong> verbinden — eine, die auswertet, eine, die hübsch ausgibt, eine, die eine Datenstruktur baut —, ohne die Grammatik anzurühren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Faustregel: Inline-Aktionen für etwas Kleines und Wegwerfbares, eine Aktionsklasse für alles, was Sie pflegen oder wiederverwenden werden.<\/span><\/p>"]]},"nl":{"t":"Inline acties versus actieklassen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt nu twee manieren om betekenis aan een parse te hangen.<\/span> <span class=\"sg\" data-s=\"1\">Welke moet je gebruiken?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Inline acties<\/strong> zetten een blok <code>{ make … }<\/code> regelrecht binnen het token:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ze zijn snel geschreven en prima voor een piepkleine grammatica of een eenmalig script.<\/span> <span class=\"sg\" data-s=\"1\">De prijs is dat het patroon en de logica in elkaar verstrengeld raken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Een actieklasse<\/strong> houdt de twee uit elkaar — de grammatica beschrijft de vorm, de actieklasse beschrijft de betekenis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze scheiding heeft echte voordelen naarmate een grammatica groeit: het patroon blijft leesbaar, en je kunt <strong>één grammatica met meerdere actieklassen<\/strong> combineren — een die evalueert, een die netjes afdrukt, een die een gegevensstructuur bouwt — zonder de grammatica aan te raken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De vuistregel: inline acties voor iets kleins en wegwerpbaars, een actieklasse voor alles wat je gaat onderhouden of hergebruiken.<\/span><\/p>"]]},"es":{"t":"Acciones en línea frente a clases de acción","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya tienes dos formas de adjuntar significado a un análisis.<\/span> <span class=\"sg\" data-s=\"1\">¿Cuál usar?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las <strong>acciones en línea<\/strong> ponen un bloque <code>{ make … }<\/code> justo dentro del token:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Son rápidas de escribir y valen para una gramática minúscula o un guion de usar y tirar.<\/span> <span class=\"sg\" data-s=\"1\">El precio es que el patrón y la lógica quedan enredados.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una <strong>clase de acciones<\/strong> mantiene separadas ambas cosas: la gramática describe la forma y la clase de acciones describe el significado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta separación tiene ventajas reales cuando una gramática crece: el patrón sigue siendo legible y puedes emparejar <strong>una gramática con varias clases de acciones<\/strong> — una que evalúe, otra que formatee, otra que construya una estructura de datos — sin tocar la gramática en absoluto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La regla práctica: acciones en línea para algo pequeño y desechable, y una clase de acciones para cualquier cosa que vayas a mantener o reutilizar.<\/span><\/p>"]]},"it":{"t":"Azioni in linea e classi di azione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora hai due modi di attaccare un significato a un'analisi.<\/span> <span class=\"sg\" data-s=\"1\">Quale usare?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le <strong>azioni in linea<\/strong> mettono un blocco <code>{ make … }<\/code> proprio dentro il token:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sono rapide da scrivere e vanno bene per una grammatica minuscola o uno script usa e getta.<\/span> <span class=\"sg\" data-s=\"1\">Il prezzo è che lo schema e la logica restano aggrovigliati.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una <strong>classe di azioni<\/strong> tiene separate le due cose — la grammatica descrive la forma, la classe di azioni descrive il significato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa separazione ha vantaggi concreti quando una grammatica cresce: lo schema resta leggibile, e puoi accoppiare <strong>una grammatica con più classi di azioni<\/strong> — una che valuta, una che formatta, una che costruisce una struttura dati — senza toccare affatto la grammatica.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La regola pratica: azioni in linea per qualcosa di piccolo e usa e getta, una classe di azioni per qualunque cosa dovrai mantenere o riusare.<\/span><\/p>"]]},"lv":{"t":"Iekļautās darbības un darbību klases","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad jums ir divi veidi, kā parsējumam piesaistīt nozīmi.<\/span> <span class=\"sg\" data-s=\"1\">Kuru izmantot?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Iekšējās darbības<\/strong> ieliek bloku <code>{ make … }<\/code> tieši marķiera iekšienē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tās ir ātri uzrakstāmas un der sīkai gramatikai vai vienreizējam skriptam.<\/span> <span class=\"sg\" data-s=\"1\">Cena ir tā, ka raksturs un loģika ir savijušies kopā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Darbību klase<\/strong> abus tur nošķirti — gramatika apraksta formu, darbību klase apraksta nozīmi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šai nošķiršanai ir īsti ieguvumi, gramatikai augot: raksturs paliek lasāms, un <strong>vienu gramatiku var savienot ar vairākām darbību klasēm<\/strong> — vienu, kas izrēķina, otru, kas glīti izdrukā, trešo, kas uzbūvē datu struktūru —, gramatiku vispār neaiztiekot.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Īkšķa likums: iekšējās darbības kaut kam mazam un vienreizējam, darbību klase visam, ko uzturēsiet vai izmantosiet atkārtoti.<\/span><\/p>"]]},"ru":{"t":"Встроенные действия и классы действий","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь у вас есть два способа придать разбору смысл.<\/span> <span class=\"sg\" data-s=\"1\">Какой из них выбрать?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Встроенные действия<\/strong> помещают блок <code>{ make … }<\/code> прямо внутрь токена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Их быстро писать, и для крошечной грамматики или одноразового скрипта они вполне годятся.<\/span> <span class=\"sg\" data-s=\"1\">Плата за это — шаблон и логика оказываются переплетены.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Класс действий<\/strong> держит их порознь: грамматика описывает форму, а класс действий — смысл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">По мере роста грамматики у этого разделения появляются настоящие преимущества: шаблон остаётся удобочитаемым, а <strong>одну грамматику можно сочетать с несколькими классами действий<\/strong> — один вычисляет, другой красиво печатает, третий строит структуру данных, — вообще не трогая саму грамматику.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Простое правило: встроенные действия — для чего-то маленького и одноразового, класс действий — для всего, что вы будете сопровождать или переиспользовать.<\/span><\/p>"]]},"uk":{"t":"Вбудовані дії проти класів дій","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер у вас є два способи прикріпити семантику до розбору.<\/span> <span class=\"sg\" data-s=\"1\">Який із них використовувати?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Вбудовані дії<\/strong> ставлять блок <code>{ make … }<\/code> просто всередині токена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Їх швидко писати, і вони цілком годяться для крихітної граматики чи одноразового скрипту.<\/span> <span class=\"sg\" data-s=\"1\">Ціна в тому, що шаблон і логіка переплітаються між собою.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Клас дій<\/strong> тримає їх нарізно — граматика описує форму, клас дій описує значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей поділ дає справжні переваги, коли граматика росте: шаблон залишається зрозумілим, і ви можете поєднувати <strong>одну граматику з кількома класами дій<\/strong> — одним, що обчислює, другим, що гарно друкує, третім, що будує структуру даних, — узагалі не торкаючись граматики.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Правило великого пальця: вбудовані дії — для чогось дрібного й одноразового, клас дій — для всього, що ви супроводжуватимете чи використовуватимете повторно.<\/span><\/p>"]]},"bg":{"t":"Вградени действия срещу класове за действия","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече имате два начина да прикачите семантика към разбора.<\/span> <span class=\"sg\" data-s=\"1\">Кой да използвате?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Вградените действия<\/strong> слагат блок <code>{ make … }<\/code> направо вътре в токена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пишат се бързо и са напълно достатъчни за мъничка граматика или еднократен скрипт.<\/span> <span class=\"sg\" data-s=\"1\">Цената е, че шаблонът и логиката се преплитат.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Класът за действия<\/strong> ги държи разделени — граматиката описва формата, класът за действия описва значението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това разделяне има истински предимства, когато граматиката порасне: шаблонът остава четим и можете да съчетаете <strong>една граматика с няколко класа за действия<\/strong> — един, който изчислява, друг, който красиво отпечатва, трети, който изгражда структура от данни — без изобщо да докосвате граматиката.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Правило на палеца: вградени действия за нещо дребно и еднократно, клас за действия за всичко, което ще поддържате или използвате повторно.<\/span><\/p>"]]},"eo":{"t":"Enliniaj agoj kaj agoklasoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi nun havas du manierojn alfiksi signifon al analizo.<\/span> <span class=\"sg\" data-s=\"1\">Kiun vi uzu?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Enliniaj agoj<\/strong> metas blokon <code>{ make … }<\/code> rekte ene de la ĵetono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ili estas rapide skribeblaj kaj taŭgaj por eta gramatiko aŭ unufoja skripto.<\/span> <span class=\"sg\" data-s=\"1\">La kosto estas, ke la ŝablono kaj la logiko estas implikitaj kune.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Agoklaso<\/strong> tenas la du apartaj — la gramatiko priskribas la formon, la agoklaso priskribas la signifon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu apartigo havas verajn avantaĝojn, kiam gramatiko kreskas: la ŝablono restas legebla, kaj vi povas pari <strong>unu gramatikon kun pluraj agoklasoj<\/strong> — unu, kiu taksas, unu, kiu bele presas, unu, kiu konstruas datumstrukturon — sen tuŝi la gramatikon entute.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La ĝenerala regulo: enliniaj agoj por io malgranda kaj unufoja, agoklaso por io ajn, kion vi prizorgos aŭ reuzos.<\/span><\/p>"]]},"la":{"t":"Actiones insertae et classes actionum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc duos modos habes significationem analysi adfigendi.<\/span> <span class=\"sg\" data-s=\"1\">Quo uti debes?<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Actiones insertae<\/strong> clausulam <code>{ make … }<\/code> intra ipsam tesseram ponunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Celeriter scribuntur et pro parva grammatica vel scripto unius usus sufficiunt.<\/span> <span class=\"sg\" data-s=\"1\">Pretium est quod exemplar et logica inter se implicantur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Classis actionum<\/strong> duo seiungit — grammatica formam describit, classis actionum significationem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec separatio veras utilitates habet dum grammatica crescit: exemplar legibile manet, et <strong>unam grammaticam cum pluribus classibus actionum<\/strong> coniungere potes — unam quae aestimat, unam quae eleganter imprimit, unam quae structuram datorum aedificat — sine grammatica omnino tacta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Regula pollicis: actiones insertae pro re parva et abicienda, classis actionum pro quolibet quod servabis vel iterum adhibebis.<\/span><\/p>"]]}}}</script>
