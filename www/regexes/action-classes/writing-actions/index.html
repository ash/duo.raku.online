<script type="application/json" id="page-data">{"u":"regexes/action-classes/writing-actions","n":1151,"k":"topic","pv":"regexes/action-classes","nx":"regexes/action-classes/writing-actions/quiz","tr":["regexes","regexes/action-classes"],"L":{"en":{"t":"Writing an action class","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An action class is an ordinary class with one method per grammar token.<\/span> <span class=\"sg\" data-s=\"1\">Each method receives the match for that token as <code>$/<\/code>, and calls <code>make<\/code> to attach a value — exactly what the inline block did, but kept apart from the pattern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The grammar now contains only the pattern; all the meaning lives in <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Notice how the methods cooperate: <code>a<\/code> and <code>b<\/code> each <code>make<\/code> an integer, and <code>TOP<\/code> reads those with <code>$&lt;a&gt;.made<\/code> and <code>$&lt;b&gt;.made<\/code> and makes their sum.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To use the action class, pass an instance to <code>.parse<\/code> with the <code>actions<\/code> named argument, then read the top result with <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">As the grammar parses, each token’s method runs automatically and builds the value from the bottom up.<\/span> <span class=\"sg\" data-s=\"1\">The result on the top match is the value you want — here, the number <code>5<\/code>.<\/span><\/p>"]]},"de":{"t":"Eine Aktionsklasse schreiben","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Aktionsklasse ist eine gewöhnliche Klasse mit einer Methode je Grammatiktoken.<\/span> <span class=\"sg\" data-s=\"1\">Jede Methode erhält den Treffer für dieses Token als <code>$/<\/code> und ruft <code>make<\/code> auf, um einen Wert anzuhängen — genau das, was der inline stehende Block getan hat, nur getrennt vom Muster gehalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Grammatik enthält nun nur noch das Muster; alle Bedeutung lebt in <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, wie die Methoden zusammenspielen: <code>a<\/code> und <code>b<\/code> <code>make<\/code>-n je eine ganze Zahl, und <code>TOP<\/code> liest diese mit <code>$&lt;a&gt;.made<\/code> und <code>$&lt;b&gt;.made<\/code> und macht ihre Summe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um die Aktionsklasse zu verwenden, übergeben Sie <code>.parse<\/code> mit dem benannten Argument <code>actions<\/code> eine Instanz und lesen danach das oberste Ergebnis mit <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Während die Grammatik zerlegt, läuft die Methode jedes Tokens selbsttätig und baut den Wert von unten nach oben auf.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis am obersten Treffer ist der Wert, den Sie wollen — hier die Zahl <code>5<\/code>.<\/span><\/p>"]]},"nl":{"t":"Een actieklasse schrijven","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een actieklasse is een gewone klasse met één methode per grammaticatoken.<\/span> <span class=\"sg\" data-s=\"1\">Elke methode ontvangt de match voor dat token als <code>$/<\/code> en roept <code>make<\/code> aan om er een waarde aan te hangen — precies wat het inline blok deed, maar apart van het patroon gehouden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De grammatica bevat nu alleen het patroon; alle betekenis leeft in <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Merk op hoe de methoden samenwerken: <code>a<\/code> en <code>b<\/code> <code>make<\/code>-en elk een geheel getal, en <code>TOP<\/code> leest die met <code>$&lt;a&gt;.made<\/code> en <code>$&lt;b&gt;.made<\/code> en maakt hun som.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om de actieklasse te gebruiken, geef je met het benoemde argument <code>actions<\/code> een instantie aan <code>.parse<\/code> mee en lees je daarna het bovenste resultaat met <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Terwijl de grammatica ontleedt, draait de methode van elk token automatisch en wordt de waarde van onderaf opgebouwd.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat op de bovenste match is de waarde die je wilt — hier het getal <code>5<\/code>.<\/span><\/p>"]]},"es":{"t":"Escribir una clase de acción","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una clase de acciones es una clase ordinaria con un método por cada token de la gramática.<\/span> <span class=\"sg\" data-s=\"1\">Cada método recibe la coincidencia de ese token como <code>$/<\/code> y llama a <code>make<\/code> para adjuntar un valor: exactamente lo que hacía el bloque en línea, pero mantenido aparte del patrón:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La gramática contiene ahora solo el patrón; todo el significado vive en <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Fíjate en cómo cooperan los métodos: <code>a<\/code> y <code>b<\/code> producen cada uno un entero, y <code>TOP<\/code> los lee con <code>$&lt;a&gt;.made<\/code> y <code>$&lt;b&gt;.made<\/code> y produce su suma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para usar la clase de acciones, pasa una instancia a <code>.parse<\/code> con el argumento con nombre <code>actions<\/code> y lee después el resultado de arriba con <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mientras la gramática analiza, el método de cada token se ejecuta automáticamente y construye el valor de abajo arriba.<\/span> <span class=\"sg\" data-s=\"1\">El resultado de la coincidencia de arriba es el valor que quieres: aquí, el número <code>5<\/code>.<\/span><\/p>"]]},"it":{"t":"Scrivere una classe di azione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una classe di azioni è una classe ordinaria con un metodo per ogni token della grammatica.<\/span> <span class=\"sg\" data-s=\"1\">Ogni metodo riceve la corrispondenza di quel token come <code>$/<\/code> e chiama <code>make<\/code> per attaccare un valore — esattamente ciò che faceva il blocco in linea, ma tenuto separato dallo schema:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La grammatica ora contiene solo lo schema; tutto il significato vive in <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota come i metodi cooperano: <code>a<\/code> e <code>b<\/code> producono ciascuno un intero, e <code>TOP<\/code> li legge con <code>$&lt;a&gt;.made<\/code> e <code>$&lt;b&gt;.made<\/code> e ne produce la somma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per usare la classe di azioni, passa un'istanza a <code>.parse<\/code> con l'argomento nominato <code>actions<\/code>, poi leggi il risultato in cima con <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mentre la grammatica analizza, il metodo di ogni token gira automaticamente e costruisce il valore dal basso verso l'alto.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato sulla corrispondenza in cima è il valore che vuoi — qui il numero <code>5<\/code>.<\/span><\/p>"]]},"ru":{"t":"Написание класса действий","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Класс действий — это обычный класс с одним методом на каждый токен грамматики.<\/span> <span class=\"sg\" data-s=\"1\">Каждый метод получает совпадение своего токена как <code>$/<\/code> и вызывает <code>make<\/code>, чтобы прикрепить значение, — ровно то же, что делал встроенный блок, но отдельно от шаблона:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь грамматика содержит только шаблон; весь смысл живёт в <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, как методы сотрудничают: <code>a<\/code> и <code>b<\/code> каждый делают целое число, а <code>TOP<\/code> читает их через <code>$&lt;a&gt;.made<\/code> и <code>$&lt;b&gt;.made<\/code> и делает их сумму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы воспользоваться классом действий, передайте его экземпляр в <code>.parse<\/code> через именованный аргумент <code>actions<\/code>, а затем прочитайте верхний результат через <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По мере разбора метод каждого токена выполняется автоматически и строит значение снизу вверх.<\/span> <span class=\"sg\" data-s=\"1\">Результат на верхнем совпадении — это то самое значение, которое вам нужно: здесь число <code>5<\/code>.<\/span><\/p>"]]},"uk":{"t":"Написання класу дій","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Клас дій — це звичайний клас з одним методом на кожен токен граматики.<\/span> <span class=\"sg\" data-s=\"1\">Кожен метод отримує збіг для свого токена як <code>$/<\/code> і викликає <code>make<\/code>, щоб прикріпити значення, — рівно те саме, що робив вбудований блок, але окремо від шаблону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер граматика містить лише шаблон; уся семантика живе в <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, як методи співпрацюють: <code>a<\/code> та <code>b<\/code> створюють кожен своє ціле число, а <code>TOP<\/code> читає їх через <code>$&lt;a&gt;.made<\/code> та <code>$&lt;b&gt;.made<\/code> і створює їхню суму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб скористатися класом дій, передайте його примірник у <code>.parse<\/code> через іменований аргумент <code>actions<\/code>, а потім прочитайте верхній результат через <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поки граматика розбирає текст, метод кожного токена виконується автоматично й будує значення знизу вгору.<\/span> <span class=\"sg\" data-s=\"1\">Результат на верхньому збігу і є потрібним вам значенням — тут це число <code>5<\/code>.<\/span><\/p>"]]},"bg":{"t":"Писане на клас за действия","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Класът за действия е обикновен клас с по един метод за всеки токен на граматиката.<\/span> <span class=\"sg\" data-s=\"1\">Всеки метод получава съвпадението за своя токен като <code>$/<\/code> и извиква <code>make<\/code>, за да прикачи стойност — точно каквото правеше вграденият блок, но държано отделно от шаблона:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nclass SumActions {\n    method TOP($/) { make $&lt;a&gt;.made + $&lt;b&gt;.made }\n    method a($/)   { make $/.Int }\n    method b($/)   { make $/.Int }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Граматиката сега съдържа само шаблона; цялата семантика живее в <code>SumActions<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете как методите си сътрудничат: <code>a<\/code> и <code>b<\/code> създават по едно цяло число, а <code>TOP<\/code> ги прочита с <code>$&lt;a&gt;.made<\/code> и <code>$&lt;b&gt;.made<\/code> и създава сумата им.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да използвате класа за действия, подайте негов екземпляр на <code>.parse<\/code> с именувания аргумент <code>actions<\/code>, а после прочетете най-горния резултат с <code>.made<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Sum.parse('2+3', actions =&gt; SumActions.new).made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Докато граматиката разбира текста, методът на всеки токен се изпълнява автоматично и изгражда стойността отдолу нагоре.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът върху най-горното съвпадение е стойността, която искате — тук числото <code>5<\/code>.<\/span><\/p>"]]}}}</script>
