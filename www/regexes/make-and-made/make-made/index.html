<script type="application/json" id="page-data">{"u":"regexes/make-and-made/make-made","n":1141,"k":"topic","pv":"regexes/make-and-made/match-tree/quiz","nx":"regexes/make-and-made/make-made/quiz","tr":["regexes","regexes/make-and-made"],"L":{"en":{"t":"make and made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Instead of digging values out of the tree afterwards, you can attach a value to a match <strong>while<\/strong> parsing.<\/span> <span class=\"sg\" data-s=\"1\">Within a token's body you can embed a <em>code block<\/em> — an inner <code>{ … }<\/code> written among the pattern — which runs as soon as matching reaches it.<\/span> <span class=\"sg\" data-s=\"2\">Inside that block, the function <code>make<\/code> stores a value on the current match:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When <code>TOP<\/code> matches, the inner <code>{ make $&lt;number&gt;.Int }<\/code> block runs — the outer braces are just the token's body — and stores the integer on the match.<\/span> <span class=\"sg\" data-s=\"1\">You read it back afterwards with <code>made<\/code> (or its alias <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because we stored <code>$&lt;number&gt;.Int<\/code>, the value handed back by <code>made<\/code> is a real <code>Int<\/code> — the number itself, not the match object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Note that this particular <code>+ 1<\/code> would give <code>43<\/code> even without the <code>.Int<\/code>, since a match numifies to its digits in arithmetic.<\/span> <span class=\"sg\" data-s=\"1\">The point of calling <code>.Int<\/code> is that the <em>stored<\/em> value genuinely <strong>is<\/strong> a number — which is what you want once it is kept in a data structure or passed on, rather than the raw match.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The stored value can be anything — a number, a string, an array, an object.<\/span> <span class=\"sg\" data-s=\"1\">A token can also combine the values its sub-tokens made.<\/span> <span class=\"sg\" data-s=\"2\">For example, summing two captured numbers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> and <code>made<\/code> are the bridge from “it matched” to “here is the meaning”.<\/span> <span class=\"sg\" data-s=\"1\">Putting the blocks inline works, but it mixes the pattern with the logic; the next section moves that logic into a separate <a href=\"/regexes/action-classes/\"><em>action class<\/em><\/a>.<\/span><\/p>"]]},"de":{"t":"make und made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Statt die Werte hinterher aus dem Baum zu graben, können Sie <strong>während<\/strong> des Zerlegens einen Wert an einen Treffer hängen.<\/span> <span class=\"sg\" data-s=\"1\">Im Rumpf eines Tokens dürfen Sie einen <em>Codeblock<\/em> einbetten — ein inneres <code>{ … }<\/code>, zwischen das Muster geschrieben —, das läuft, sobald das Treffen dort ankommt.<\/span> <span class=\"sg\" data-s=\"2\">Innerhalb dieses Blocks legt die Funktion <code>make<\/code> einen Wert auf dem aktuellen Treffer ab:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn <code>TOP<\/code> trifft, läuft der innere Block <code>{ make $&lt;number&gt;.Int }<\/code> — die äußeren geschweiften Klammern sind nur der Rumpf des Tokens — und legt die ganze Zahl auf dem Treffer ab.<\/span> <span class=\"sg\" data-s=\"1\">Sie lesen sie hinterher mit <code>made<\/code> aus (oder mit dessen Alias <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Weil wir <code>$&lt;number&gt;.Int<\/code> abgelegt haben, ist der von <code>made<\/code> gelieferte Wert ein echter <code>Int<\/code> — die Zahl selbst, nicht das Match-Objekt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass dieses <code>+ 1<\/code> auch ohne das <code>.Int<\/code> <code>43<\/code> ergäbe, denn ein Treffer wird in der Rechnung zu seinen Ziffern.<\/span> <span class=\"sg\" data-s=\"1\">Der Sinn des <code>.Int<\/code> ist, dass der <em>abgelegte<\/em> Wert wirklich eine Zahl <strong>ist<\/strong> — und das wollen Sie, sobald er in einer Datenstruktur landet oder weitergereicht wird, statt der blanke Treffer.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der abgelegte Wert kann alles sein — eine Zahl, eine Zeichenkette, ein Array, ein Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Ein Token kann auch die Werte verbinden, die seine Unter-Tokens gemacht haben.<\/span> <span class=\"sg\" data-s=\"2\">Etwa zwei gecapturte Zahlen summieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> und <code>made<\/code> sind die Brücke von „es hat getroffen“ zu „hier ist die Bedeutung“.<\/span> <span class=\"sg\" data-s=\"1\">Die Blöcke inline zu setzen funktioniert, mischt aber das Muster mit der Logik; der nächste Abschnitt verlagert diese Logik in eine eigene <a href=\"https://course.raku.org/de/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>Aktionsklasse<\/em><\/a>.<\/span><\/p>"]]},"nl":{"t":"make en made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In plaats van de waarden er achteraf uit de boom op te diepen, kun je <strong>tijdens<\/strong> het ontleden een waarde aan een match hangen.<\/span> <span class=\"sg\" data-s=\"1\">Binnen de body van een token kun je een <em>codeblok<\/em> inbedden — een innerlijk <code>{ … }<\/code> tussen het patroon geschreven — dat draait zodra het matchen daar aankomt.<\/span> <span class=\"sg\" data-s=\"2\">Binnen dat blok bewaart de functie <code>make<\/code> een waarde op de huidige match:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer <code>TOP<\/code> matcht, draait het innerlijke blok <code>{ make $&lt;number&gt;.Int }<\/code> — de buitenste accolades zijn slechts de body van het token — en bewaart het het gehele getal op de match.<\/span> <span class=\"sg\" data-s=\"1\">Je leest het naderhand terug met <code>made<\/code> (of zijn alias <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat we <code>$&lt;number&gt;.Int<\/code> bewaarden, is de waarde die <code>made<\/code> teruggeeft een echte <code>Int<\/code> — het getal zelf, niet het matchobject:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat deze <code>+ 1<\/code> ook zonder de <code>.Int<\/code> <code>43<\/code> zou geven, omdat een match in rekenkunde tot zijn cijfers versimpelt.<\/span> <span class=\"sg\" data-s=\"1\">De reden om <code>.Int<\/code> aan te roepen is dat de <em>bewaarde<\/em> waarde werkelijk een getal <strong>is<\/strong> — en dat wil je zodra ze in een gegevensstructuur bewaard of doorgegeven wordt in plaats van de kale match.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De bewaarde waarde kan van alles zijn — een getal, een string, een array, een object.<\/span> <span class=\"sg\" data-s=\"1\">Een token kan ook de waarden combineren die zijn subtokens gemaakt hebben.<\/span> <span class=\"sg\" data-s=\"2\">Bijvoorbeeld twee gecapturde getallen optellen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> en <code>made<\/code> vormen de brug van \"het matchte\" naar \"hier is de betekenis\".<\/span> <span class=\"sg\" data-s=\"1\">De blokken inline zetten werkt, maar het mengt het patroon met de logica; de volgende sectie verplaatst die logica naar een aparte <a href=\"https://course.raku.org/nl/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>actieklasse<\/em><\/a>.<\/span><\/p>"]]},"es":{"t":"make y made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En lugar de sacar los valores del árbol después, puedes adjuntar un valor a una coincidencia <strong>mientras<\/strong> se analiza.<\/span> <span class=\"sg\" data-s=\"1\">Dentro del cuerpo de un token puedes incrustar un <em>bloque de código<\/em> — un <code>{ … }<\/code> interior escrito entre el patrón — que se ejecuta en cuanto el emparejamiento lo alcanza.<\/span> <span class=\"sg\" data-s=\"2\">Dentro de ese bloque, la función <code>make<\/code> guarda un valor en la coincidencia actual:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando <code>TOP<\/code> coincide, el bloque interior <code>{ make $&lt;number&gt;.Int }<\/code> se ejecuta — las llaves exteriores son solo el cuerpo del token — y guarda el entero en la coincidencia.<\/span> <span class=\"sg\" data-s=\"1\">Lo lees después con <code>made<\/code> (o con su alias <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como guardamos <code>$&lt;number&gt;.Int<\/code>, el valor que devuelve <code>made<\/code> es un <code>Int<\/code> de verdad: el número en sí, no el objeto de coincidencia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que este <code>+ 1<\/code> en concreto daría <code>43<\/code> incluso sin el <code>.Int<\/code>, ya que una coincidencia se convierte en número a partir de sus dígitos en aritmética.<\/span> <span class=\"sg\" data-s=\"1\">El sentido de llamar a <code>.Int<\/code> es que el valor <em>guardado<\/em> <strong>sea<\/strong> de verdad un número, que es lo que quieres una vez que acaba en una estructura de datos o se pasa a otra parte, en lugar de la coincidencia en bruto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El valor guardado puede ser cualquier cosa: un número, una cadena, un array, un objeto.<\/span> <span class=\"sg\" data-s=\"1\">Un token también puede combinar los valores producidos por sus subtokens.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, sumando dos números capturados:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> y <code>made<\/code> son el puente entre «coincidió» y «aquí está el significado».<\/span> <span class=\"sg\" data-s=\"1\">Poner los bloques en línea funciona, pero mezcla el patrón con la lógica; la sección siguiente traslada esa lógica a una <a href=\"https://course.raku.org/es/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>clase de acciones<\/em><\/a> aparte.<\/span><\/p>"]]},"it":{"t":"make e made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Invece di estrarre i valori dall'albero a posteriori, puoi attaccare un valore a una corrispondenza <strong>durante<\/strong> l'analisi.<\/span> <span class=\"sg\" data-s=\"1\">Nel corpo di un token puoi incorporare un <em>blocco di codice<\/em> — un <code>{ … }<\/code> interno scritto fra lo schema — che gira non appena il riconoscimento lo raggiunge.<\/span> <span class=\"sg\" data-s=\"2\">Dentro quel blocco, la funzione <code>make<\/code> conserva un valore sulla corrispondenza corrente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando <code>TOP<\/code> corrisponde, il blocco interno <code>{ make $&lt;number&gt;.Int }<\/code> gira — le graffe esterne sono solo il corpo del token — e conserva l'intero sulla corrispondenza.<\/span> <span class=\"sg\" data-s=\"1\">Lo rileggi dopo con <code>made<\/code> (o con il suo alias <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché abbiamo conservato <code>$&lt;number&gt;.Int<\/code>, il valore restituito da <code>made<\/code> è un vero <code>Int<\/code> — il numero in sé, non l'oggetto match:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che questo particolare <code>+ 1<\/code> darebbe <code>43<\/code> anche senza il <code>.Int<\/code>, dato che una corrispondenza si converte in numero a partire dalle sue cifre in aritmetica.<\/span> <span class=\"sg\" data-s=\"1\">Il senso di chiamare <code>.Int<\/code> è che il valore <em>conservato<\/em> <strong>è<\/strong> davvero un numero — ed è ciò che vuoi una volta che finisce in una struttura dati o viene passato oltre, invece della corrispondenza grezza.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il valore conservato può essere qualunque cosa: un numero, una stringa, un array, un oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Un token può anche combinare i valori prodotti dai suoi sottotoken.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, sommando due numeri catturati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> e <code>made<\/code> sono il ponte fra «ha corrisposto» ed «ecco il significato».<\/span> <span class=\"sg\" data-s=\"1\">Mettere i blocchi in linea funziona, ma mescola lo schema con la logica; la sezione successiva sposta quella logica in una <a href=\"https://course.raku.org/it/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>classe di azioni<\/em><\/a> separata.<\/span><\/p>"]]},"lv":{"t":"make un made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tā vietā, lai vērtības rakņātu ārā no koka pēc tam, tās sakritībai var piesaistīt <strong>parsēšanas laikā<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Marķiera ķermenī var iegult <em>koda bloku<\/em> — iekšēju <code>{ … }<\/code>, kas uzrakstīts starp raksturā daļām — un tas izpildās, tiklīdz piemeklēšana līdz tam nonāk.<\/span> <span class=\"sg\" data-s=\"2\">Šī bloka iekšienē funkcija <code>make<\/code> saglabā vērtību uz pašreizējās sakritības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad <code>TOP<\/code> sakrīt, izpildās iekšējais bloks <code>{ make $&lt;number&gt;.Int }<\/code> — ārējās figūriekavas ir tikai marķiera ķermenis — un saglabā veselo skaitli uz sakritības.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam to nolasāt atpakaļ ar <code>made<\/code> (vai tā aliasu <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā saglabājām <code>$&lt;number&gt;.Int<\/code>, vērtība, ko atdod <code>made<\/code>, ir īsts <code>Int<\/code> — pats skaitlis, nevis sakritības objekts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka tieši šis <code>+ 1<\/code> dotu <code>43<\/code> arī bez <code>.Int<\/code>, jo aritmētikā sakritība pārvēršas par saviem cipariem.<\/span> <span class=\"sg\" data-s=\"1\"><code>.Int<\/code> izsaukuma jēga ir tā, ka <em>saglabātā<\/em> vērtība patiešām <strong>ir<\/strong> skaitlis — un tieši to jūs vēlaties, tiklīdz tā tiek turēta datu struktūrā vai padota tālāk, nevis paliek neapstrādāta sakritība.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Saglabātā vērtība var būt jebkas — skaitlis, virkne, masīvs, objekts.<\/span> <span class=\"sg\" data-s=\"1\">Marķieris var arī apvienot vērtības, ko izveidojuši tā apakšmarķieri.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, saskaitot divus satvertos skaitļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> un <code>made<\/code> ir tilts no «tas sakrita» uz «lūk, nozīme».<\/span> <span class=\"sg\" data-s=\"1\">Blokus likt uz vietas darbojas, taču tas sajauc raksturu ar loģiku; nākamā sadaļa šo loģiku pārceļ uz atsevišķu <a href=\"https://course.raku.org/lv/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>darbību klasi<\/em><\/a>.<\/span><\/p>"]]},"ru":{"t":"make и made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вместо того чтобы потом выуживать значения из дерева, можно прикрепить значение к совпадению <strong>прямо во время<\/strong> разбора.<\/span> <span class=\"sg\" data-s=\"1\">В тело токена можно встроить <em>блок кода<\/em> — внутренний <code>{ … }<\/code>, записанный среди шаблона, — который выполняется, как только сопоставление до него доходит.<\/span> <span class=\"sg\" data-s=\"2\">Внутри такого блока функция <code>make<\/code> сохраняет значение на текущем совпадении:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда <code>TOP<\/code> совпадает, выполняется внутренний блок <code>{ make $&lt;number&gt;.Int }<\/code> — внешние фигурные скобки здесь просто тело токена — и сохраняет на совпадении целое число.<\/span> <span class=\"sg\" data-s=\"1\">Прочитать его обратно можно потом через <code>made<\/code> (или его синоним <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку мы сохранили <code>$&lt;number&gt;.Int<\/code>, значение, которое возвращает <code>made<\/code>, — это настоящий <code>Int<\/code>, само число, а не объект совпадения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что именно это <code>+ 1<\/code> дало бы <code>43<\/code> и без <code>.Int<\/code>, ведь в арифметике совпадение приводится к числу по своим цифрам.<\/span> <span class=\"sg\" data-s=\"1\">Смысл вызова <code>.Int<\/code> в том, что <em>сохранённое<\/em> значение действительно <strong>является<\/strong> числом, — а это как раз то, что нужно, когда оно попадает в структуру данных или передаётся дальше, а не остаётся сырым совпадением.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сохранять можно что угодно — число, строку, массив, объект.<\/span> <span class=\"sg\" data-s=\"1\">Токен может и объединить значения, которые сделали его подтокены.<\/span> <span class=\"sg\" data-s=\"2\">Например, сложить два захваченных числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> и <code>made<\/code> — это мост от «совпало» к «вот его смысл».<\/span> <span class=\"sg\" data-s=\"1\">Встроенные блоки работают, но смешивают шаблон с логикой; следующий раздел переносит эту логику в отдельный <a href=\"https://course.raku.org/ru/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>класс действий<\/em><\/a>.<\/span><\/p>"]]},"uk":{"t":"make і made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Замість того щоб вигрібати значення з дерева опісля, ви можете прикріпити значення до збігу <strong>під час<\/strong> розбору.<\/span> <span class=\"sg\" data-s=\"1\">У тілі токена можна вбудувати <em>блок коду<\/em> — внутрішні <code>{ … }<\/code>, записані серед шаблону, — який виконується щойно зіставлення до нього дійде.<\/span> <span class=\"sg\" data-s=\"2\">Усередині цього блоку функція <code>make<\/code> зберігає значення на поточному збігу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли <code>TOP<\/code> зіставляється, виконується внутрішній блок <code>{ make $&lt;number&gt;.Int }<\/code> — зовнішні фігурні дужки є просто тілом токена — і зберігає ціле число на збігу.<\/span> <span class=\"sg\" data-s=\"1\">Прочитати його назад можна потім за допомогою <code>made<\/code> (або його синоніма <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки ми зберегли <code>$&lt;number&gt;.Int<\/code>, значення, яке повертає <code>made<\/code>, є справжнім <code>Int<\/code> — самим числом, а не об'єктом збігу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зауважте, що саме це <code>+ 1<\/code> дало б <code>43<\/code> і без <code>.Int<\/code>, бо в арифметиці збіг перетворюється на число за своїми цифрами.<\/span> <span class=\"sg\" data-s=\"1\">Сенс виклику <code>.Int<\/code> у тому, що <em>збережене<\/em> значення справді <strong>є<\/strong> числом, — а це саме те, що потрібно, коли воно потрапляє в структуру даних або передається далі, а не залишається сирим збігом.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Збережене значення може бути чим завгодно — числом, рядком, масивом, об'єктом.<\/span> <span class=\"sg\" data-s=\"1\">Токен також може поєднувати значення, які створили його підтокени.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, сума двох захоплених чисел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> та <code>made<\/code> — це місток від «воно зіставилося» до «ось що воно означає».<\/span> <span class=\"sg\" data-s=\"1\">Розміщення блоків усередині шаблону працює, але змішує шаблон із логікою; наступний розділ переносить цю логіку в окремий <a href=\"https://course.raku.org/uk/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>клас дій<\/em><\/a>.<\/span><\/p>"]]},"bg":{"t":"make и made","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вместо да изравяте стойности от дървото след това, можете да прикачите стойност към съвпадение <strong>по време<\/strong> на разбора.<\/span> <span class=\"sg\" data-s=\"1\">В тялото на токен можете да вградите <em>блок код<\/em> — вътрешни <code>{ … }<\/code>, записани сред шаблона, — който се изпълнява веднага щом съпоставянето стигне до него.<\/span> <span class=\"sg\" data-s=\"2\">Вътре в този блок функцията <code>make<\/code> съхранява стойност върху текущото съвпадение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar OneNum {\n    token TOP    { &lt;number&gt; { make $&lt;number&gt;.Int } }\n    token number { \\d+ }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато <code>TOP<\/code> съвпадне, вътрешният блок <code>{ make $&lt;number&gt;.Int }<\/code> се изпълнява — външните фигурни скоби са просто тялото на токена — и съхранява цялото число върху съвпадението.<\/span> <span class=\"sg\" data-s=\"1\">Прочитате го обратно после с <code>made<\/code> (или с псевдонима му <code>.ast<\/code>):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made; # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Понеже съхранихме <code>$&lt;number&gt;.Int<\/code>, стойността, върната от <code>made<\/code>, е истински <code>Int<\/code> — самото число, а не обектът на съвпадението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say OneNum.parse('42').made + 1; # 43<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че точно това <code>+ 1<\/code> би дало <code>43<\/code> и без <code>.Int<\/code>, защото в аритметика съвпадението се превръща в число по цифрите си.<\/span> <span class=\"sg\" data-s=\"1\">Смисълът на извикването на <code>.Int<\/code> е, че <em>съхранената<\/em> стойност наистина <strong>е<\/strong> число — а това искате, щом тя попадне в структура от данни или бъде предадена нататък, вместо да остане суровото съвпадение.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Съхранената стойност може да е каквото и да е — число, низ, масив, обект.<\/span> <span class=\"sg\" data-s=\"1\">Токенът може и да съчетае стойностите, създадени от подтокените му.<\/span> <span class=\"sg\" data-s=\"2\">Например сумиране на две прихванати числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Sum {\n    token TOP { &lt;a&gt; '+' &lt;b&gt; { make $&lt;a&gt;.Int + $&lt;b&gt;.Int } }\n    token a   { \\d+ }\n    token b   { \\d+ }\n}\n\nsay Sum.parse('2+3').made; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>make<\/code> и <code>made<\/code> са мостът от „съвпадна“ до „ето какво означава“.<\/span> <span class=\"sg\" data-s=\"1\">Поставянето на блоковете вътре в шаблона работи, но смесва шаблона с логиката; следващият раздел премества тази логика в отделен <a href=\"https://course.raku.org/bg/regexes/action-classes/\" target=\"_blank\" rel=\"noopener\"><em>клас за действия<\/em><\/a>.<\/span><\/p>"]]}}}</script>
