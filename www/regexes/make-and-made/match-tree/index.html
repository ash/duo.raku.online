<script type="application/json" id="page-data">{"u":"regexes/make-and-made/match-tree","n":1139,"k":"topic","pv":"regexes/make-and-made","nx":"regexes/make-and-made/match-tree/quiz","tr":["regexes","regexes/make-and-made"],"L":{"en":{"t":"The match tree","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A grammar match is a tree.<\/span> <span class=\"sg\" data-s=\"1\">The top match has a named entry for each token that <code>TOP<\/code> used, and those entries are themselves match objects with their own captures.<\/span> <span class=\"sg\" data-s=\"2\">You navigate the tree with the same <code>&lt;name&gt;<\/code> syntax you use for named captures:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each branch is a full match object, so you can ask it for its <code>.Str<\/code>, its position, or convert it.<\/span> <span class=\"sg\" data-s=\"1\">Here the value is digits, so turning it into a real number is just a method call:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">For deeper grammars the tree has more levels — <code>$m&lt;a&gt;&lt;b&gt;<\/code> reaches a token <code>b<\/code> used inside a token <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Walking the tree like this works, but for anything beyond a couple of fields it becomes clumsy.<\/span> <span class=\"sg\" data-s=\"2\">The next topic shows a cleaner way to attach the value you actually want to each match.<\/span><\/p>"]]},"de":{"t":"Der Match-Baum","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Grammatiktreffer ist ein Baum.<\/span> <span class=\"sg\" data-s=\"1\">Der oberste Treffer hat einen benannten Eintrag für jedes Token, das <code>TOP<\/code> verwendet hat, und diese Einträge sind selbst Match-Objekte mit eigenen Captures.<\/span> <span class=\"sg\" data-s=\"2\">Sie bewegen sich mit derselben <code>&lt;name&gt;<\/code>-Schreibweise durch den Baum, die Sie für benannte Captures verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Zweig ist ein vollständiges Match-Objekt, Sie können ihn also nach seinem <code>.Str<\/code>, seiner Position oder einer Umwandlung fragen.<\/span> <span class=\"sg\" data-s=\"1\">Hier besteht der Wert aus Ziffern, ihn in eine echte Zahl zu verwandeln ist also nur ein Methodenaufruf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bei tieferen Grammatiken hat der Baum mehr Ebenen — <code>$m&lt;a&gt;&lt;b&gt;<\/code> erreicht ein Token <code>b<\/code>, das innerhalb eines Tokens <code>a<\/code> verwendet wurde.<\/span> <span class=\"sg\" data-s=\"1\">So durch den Baum zu gehen funktioniert, wird aber jenseits weniger Felder unhandlich.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Thema zeigt einen saubereren Weg, an jeden Treffer den Wert zu hängen, den Sie tatsächlich wollen.<\/span><\/p>"]]},"nl":{"t":"De matchboom","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een grammaticamatch is een boom.<\/span> <span class=\"sg\" data-s=\"1\">De bovenste match heeft een benoemd item voor elk token dat <code>TOP<\/code> gebruikte, en die items zijn zelf matchobjecten met hun eigen captures.<\/span> <span class=\"sg\" data-s=\"2\">Je navigeert door de boom met dezelfde <code>&lt;naam&gt;<\/code>-syntaxis die je voor benoemde captures gebruikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke tak is een volledig matchobject, dus je kunt hem om zijn <code>.Str<\/code>, zijn positie of een omzetting vragen.<\/span> <span class=\"sg\" data-s=\"1\">Hier is de waarde een reeks cijfers, dus er een echt getal van maken is slechts een methodeaanroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bij diepere grammatica's heeft de boom meer niveaus — <code>$m&lt;a&gt;&lt;b&gt;<\/code> bereikt een token <code>b<\/code> dat binnen een token <code>a<\/code> gebruikt is.<\/span> <span class=\"sg\" data-s=\"1\">Zo door de boom lopen werkt, maar voor meer dan een paar velden wordt het onhandig.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende onderwerp laat een nettere manier zien om aan elke match de waarde te hangen die je werkelijk wilt.<\/span><\/p>"]]},"es":{"t":"El árbol de coincidencias","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una coincidencia de gramática es un árbol.<\/span> <span class=\"sg\" data-s=\"1\">La coincidencia de arriba tiene una entrada con nombre por cada token que usó <code>TOP<\/code>, y esas entradas son a su vez objetos de coincidencia con sus propias capturas.<\/span> <span class=\"sg\" data-s=\"2\">Recorres el árbol con la misma sintaxis <code>&lt;nombre&gt;<\/code> que usas para las capturas con nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada rama es un objeto de coincidencia completo, así que puedes pedirle su <code>.Str<\/code>, su posición o convertirlo.<\/span> <span class=\"sg\" data-s=\"1\">Aquí el valor son dígitos, de modo que convertirlo en un número de verdad es solo una llamada a un método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En gramáticas más profundas el árbol tiene más niveles: <code>$m&lt;a&gt;&lt;b&gt;<\/code> llega a un token <code>b<\/code> usado dentro de un token <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Recorrer el árbol así funciona, pero para algo más que un par de campos se vuelve incómodo.<\/span> <span class=\"sg\" data-s=\"2\">El tema siguiente muestra una forma más limpia de adjuntar a cada coincidencia el valor que de verdad quieres.<\/span><\/p>"]]},"it":{"t":"L'albero delle corrispondenze","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una corrispondenza di grammatica è un albero.<\/span> <span class=\"sg\" data-s=\"1\">La corrispondenza in cima ha una voce con nome per ogni token usato da <code>TOP<\/code>, e quelle voci sono a loro volta oggetti match con le proprie catture.<\/span> <span class=\"sg\" data-s=\"2\">Percorri l'albero con la stessa sintassi <code>&lt;nome&gt;<\/code> che usi per le catture con nome:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni ramo è un oggetto match completo, quindi puoi chiedergli il suo <code>.Str<\/code>, la sua posizione o convertirlo.<\/span> <span class=\"sg\" data-s=\"1\">Qui il valore è fatto di cifre, quindi trasformarlo in un numero vero è solo una chiamata di metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per grammatiche più profonde l'albero ha più livelli — <code>$m&lt;a&gt;&lt;b&gt;<\/code> raggiunge un token <code>b<\/code> usato dentro un token <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Percorrere l'albero così funziona, ma per qualunque cosa oltre un paio di campi diventa scomodo.<\/span> <span class=\"sg\" data-s=\"2\">L'argomento successivo mostra un modo più pulito di attaccare a ogni corrispondenza il valore che vuoi davvero.<\/span><\/p>"]]},"lv":{"t":"Sakritības koks","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Gramatikas sakritība ir koks.<\/span> <span class=\"sg\" data-s=\"1\">Augšējai sakritībai ir nosaukts ieraksts katram marķierim, ko izmantoja <code>TOP<\/code>, un šie ieraksti paši ir sakritības objekti ar saviem tvērumiem.<\/span> <span class=\"sg\" data-s=\"2\">Pa koku pārvietojaties ar to pašu <code>&lt;nosaukums&gt;<\/code> sintaksi, ko lietojat nosauktiem tvērumiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs zars ir pilnvērtīgs sakritības objekts, tāpēc tam var prasīt tā <code>.Str<\/code>, tā pozīciju vai to pārveidot.<\/span> <span class=\"sg\" data-s=\"1\">Šeit vērtība ir cipari, tāpēc tās pārvēršana par īstu skaitli ir tikai viens metodes izsaukums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dziļākām gramatikām kokam ir vairāk līmeņu — <code>$m&lt;a&gt;&lt;b&gt;<\/code> sasniedz marķieri <code>b<\/code>, kas izmantots marķiera <code>a<\/code> iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Šāda staigāšana pa koku darbojas, taču visam, kas plašāks par pāris laukiem, tā kļūst neveikla.<\/span> <span class=\"sg\" data-s=\"2\">Nākamais temats parāda tīrāku veidu, kā katrai sakritībai piesaistīt to vērtību, kas jums patiešām vajadzīga.<\/span><\/p>"]]},"ru":{"t":"Дерево совпадения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Совпадение грамматики — это дерево.<\/span> <span class=\"sg\" data-s=\"1\">У верхнего совпадения есть именованная запись для каждого токена, который использовал <code>TOP<\/code>, а эти записи сами являются объектами совпадения со своими захватами.<\/span> <span class=\"sg\" data-s=\"2\">По дереву ходят тем же синтаксисом <code>&lt;имя&gt;<\/code>, что и для именованных захватов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая ветвь — полноценный объект совпадения, поэтому у неё можно спросить <code>.Str<\/code>, позицию или преобразовать её.<\/span> <span class=\"sg\" data-s=\"1\">Здесь значение состоит из цифр, поэтому превратить его в настоящее число — это всего лишь вызов метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У более глубоких грамматик в дереве больше уровней: <code>$m&lt;a&gt;&lt;b&gt;<\/code> добирается до токена <code>b<\/code>, использованного внутри токена <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ходить по дереву так можно, но для чего-то большего, чем пара полей, это становится неуклюже.<\/span> <span class=\"sg\" data-s=\"2\">Следующая тема показывает более чистый способ прикрепить к каждому совпадению именно то значение, которое вам нужно.<\/span><\/p>"]]},"uk":{"t":"Дерево збігу","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Збіг граматики — це дерево.<\/span> <span class=\"sg\" data-s=\"1\">Верхній збіг має іменований запис для кожного токена, використаного в <code>TOP<\/code>, а ці записи самі є об'єктами збігу з власними захопленнями.<\/span> <span class=\"sg\" data-s=\"2\">Деревом ви пересуваєтеся тим самим синтаксисом <code>&lt;name&gt;<\/code>, що й для іменованих захоплень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна гілка є повноцінним об'єктом збігу, тож у неї можна запитати <code>.Str<\/code>, її позицію або перетворити її.<\/span> <span class=\"sg\" data-s=\"1\">Тут значення складається з цифр, тож перетворення на справжнє число — це просто виклик методу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У глибших граматиках дерево має більше рівнів — <code>$m&lt;a&gt;&lt;b&gt;<\/code> дістає токен <code>b<\/code>, використаний усередині токена <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Такий обхід дерева працює, але для чогось складнішого за пару полів стає незграбним.<\/span> <span class=\"sg\" data-s=\"2\">Наступна тема показує чистіший спосіб прикріпити до кожного збігу саме те значення, яке вам потрібне.<\/span><\/p>"]]},"bg":{"t":"Дървото на съвпадението","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Съвпадението на граматика е дърво.<\/span> <span class=\"sg\" data-s=\"1\">Най-горното съвпадение има именуван запис за всеки токен, използван от <code>TOP<\/code>, а тези записи сами са обекти на съвпадението със свои собствени прихващания.<\/span> <span class=\"sg\" data-s=\"2\">Из дървото се движите със същия синтаксис <code>&lt;name&gt;<\/code>, който използвате за именувани прихващания:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки клон е пълноценен обект на съвпадението, така че можете да го попитате за неговия <code>.Str<\/code>, за позицията му или да го преобразувате.<\/span> <span class=\"sg\" data-s=\"1\">Тук стойността се състои от цифри, така че превръщането ѝ в истинско число е само едно извикване на метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">При по-дълбоки граматики дървото има повече нива — <code>$m&lt;a&gt;&lt;b&gt;<\/code> стига до токен <code>b<\/code>, използван вътре в токен <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Такова обхождане на дървото работи, но за нещо повече от няколко полета става тромаво.<\/span> <span class=\"sg\" data-s=\"2\">Следващата тема показва по-чист начин да прикачите към всяко съвпадение точно онази стойност, която искате.<\/span><\/p>"]]},"eo":{"t":"La kongruarbo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Gramatika kongruo estas arbo.<\/span> <span class=\"sg\" data-s=\"1\">La supra kongruo havas nomitan eron por ĉiu ĵetono, kiun <code>TOP<\/code> uzis, kaj tiuj eroj mem estas kongruaj objektoj kun siaj propraj kaptoj.<\/span> <span class=\"sg\" data-s=\"2\">Vi navigas la arbon per la sama sintakso <code>&lt;name&gt;<\/code>, kiun vi uzas por nomitaj kaptoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu branĉo estas plena kongrua objekto, do vi povas peti al ĝi sian <code>.Str<\/code>, sian pozicion, aŭ konverti ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie la valoro estas ciferoj, do transformi ĝin en veran nombron estas nur metodvoko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por pli profundaj gramatikoj la arbo havas pli da niveloj — <code>$m&lt;a&gt;&lt;b&gt;<\/code> atingas ĵetonon <code>b<\/code> uzatan ene de ĵetono <code>a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Trairi la arbon tiel funkcias, sed por io ajn preter kelkaj kampoj ĝi fariĝas mallerta.<\/span> <span class=\"sg\" data-s=\"2\">La sekva temo montras pli puran manieron alfiksi la valoron, kiun vi efektive volas, al ĉiu kongruo.<\/span><\/p>"]]},"la":{"t":"Arbor congruentiae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Congruentia grammaticae arbor est.<\/span> <span class=\"sg\" data-s=\"1\">Congruentia summa ingressum nominatum pro unaquaque tessera quam <code>TOP<\/code> adhibuit habet, et illi ingressus ipsi obiecta congruentiae sunt cum propriis capturis.<\/span> <span class=\"sg\" data-s=\"2\">Per arborem eadem syntaxi <code>&lt;nomen&gt;<\/code> navigas quam pro capturis nominatis adhibes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Pair {\n    token TOP   { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\d+ }\n}\n\nmy $m = Pair.parse('x=5');\nsay $m&lt;key&gt;;   # ｢x｣\nsay $m&lt;value&gt;; # ｢5｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unusquisque ramus plenum obiectum congruentiae est, itaque ab eo <code>.Str<\/code>, locum eius petere, vel illud vertere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hic valor cifrae sunt, itaque illum in verum numerum vertere mera vocatio methodi est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $m&lt;value&gt;.Int; # 5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pro grammaticis altioribus arbor plures gradus habet — <code>$m&lt;a&gt;&lt;b&gt;<\/code> tesseram <code>b<\/code> intra tesseram <code>a<\/code> adhibitam attingit.<\/span> <span class=\"sg\" data-s=\"1\">Per arborem sic ambulare operatur, sed pro quolibet ultra duo vel tria campos incommodum fit.<\/span> <span class=\"sg\" data-s=\"2\">Argumentum sequens mundiorem modum ostendit valorem quem revera vis unicuique congruentiae adfigendi.<\/span><\/p>"]]}}}</script>
