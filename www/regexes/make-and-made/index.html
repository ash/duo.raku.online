<script type="application/json" id="page-data">{"u":"regexes/make-and-made","n":1138,"k":"section","pv":"regexes/grammar-inheritance/exercises/proto-bool/solution","nx":"regexes/make-and-made/match-tree","tr":["regexes"],"L":{"en":{"t":"The parse tree, make and made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Parsing tells you that a string matches a grammar, and it builds a <em>parse tree<\/em> — a match object with a named capture for every token.<\/span> <span class=\"sg\" data-s=\"1\">But usually you do not want the raw text; you want a <strong>result<\/strong>: the integer <code>42<\/code>, not the characters <code>4<\/code> and <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section shows how to walk the parse tree, and how to attach a computed value to a match with <code>make<\/code>, then read it back with <code>made<\/code>.<\/span><\/p>"]]},"de":{"t":"Der Zerlegungsbaum, make und made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Zerlegen sagt Ihnen, dass eine Zeichenkette zu einer Grammatik passt, und es baut einen <em>Zerlegungsbaum<\/em> — ein Match-Objekt mit einem benannten Capture für jedes Token.<\/span> <span class=\"sg\" data-s=\"1\">Meist wollen Sie aber nicht den blanken Text, sondern ein <strong>Ergebnis<\/strong>: die ganze Zahl <code>42<\/code>, nicht die Zeichen <code>4<\/code> und <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt, wie Sie durch den Zerlegungsbaum gehen und wie Sie mit <code>make<\/code> einen berechneten Wert an einen Treffer hängen und ihn mit <code>made<\/code> wieder auslesen.<\/span><\/p>"]]},"nl":{"t":"De parseboom, make en made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ontleden vertelt je dat een string bij een grammatica past, en het bouwt een <em>parseboom<\/em> — een matchobject met een benoemde capture voor elk token.<\/span> <span class=\"sg\" data-s=\"1\">Maar meestal wil je niet de kale tekst; je wilt een <strong>resultaat<\/strong>: het gehele getal <code>42<\/code>, niet de tekens <code>4<\/code> en <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze sectie laat zien hoe je door de parseboom loopt, en hoe je met <code>make<\/code> een berekende waarde aan een match hangt en die met <code>made<\/code> weer terugleest.<\/span><\/p>"]]},"es":{"t":"El árbol de análisis, make y made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El análisis te dice que una cadena encaja en una gramática, y construye un <em>árbol de análisis<\/em>: un objeto de coincidencia con una captura con nombre por cada token.<\/span> <span class=\"sg\" data-s=\"1\">Pero normalmente no quieres el texto en bruto: quieres un <strong>resultado<\/strong>, el entero <code>42<\/code> y no los caracteres <code>4<\/code> y <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra cómo recorrer el árbol de análisis y cómo adjuntar a una coincidencia un valor calculado con <code>make<\/code>, para leerlo después con <code>made<\/code>.<\/span><\/p>"]]},"it":{"t":"L'albero di analisi, make e made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'analisi ti dice che una stringa corrisponde a una grammatica, e costruisce un <em>albero di analisi<\/em>: un oggetto match con una cattura con nome per ogni token.<\/span> <span class=\"sg\" data-s=\"1\">Ma di solito non vuoi il testo grezzo; vuoi un <strong>risultato<\/strong>: l'intero <code>42<\/code>, non i caratteri <code>4<\/code> e <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra come percorrere l'albero di analisi e come attaccare a una corrispondenza un valore calcolato con <code>make<\/code>, per poi rileggerlo con <code>made<\/code>.<\/span><\/p>"]]},"lv":{"t":"Parsēšanas koks, make un made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Parsēšana pasaka, ka virkne sakrīt ar gramatiku, un tā uzbūvē <em>parsēšanas koku<\/em> — sakritības objektu ar nosauktu tvērumu katram marķierim.<\/span> <span class=\"sg\" data-s=\"1\">Taču parasti jums nevajag neapstrādātu tekstu; jums vajag <strong>rezultātu<\/strong>: veselu skaitli <code>42<\/code>, nevis rakstzīmes <code>4<\/code> un <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda, kā staigāt pa parsēšanas koku un kā ar <code>make<\/code> piesaistīt sakritībai aprēķinātu vērtību, lai pēc tam to nolasītu ar <code>made<\/code>.<\/span><\/p>"]]},"ru":{"t":"Дерево разбора, make и made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Разбор говорит вам, что строка соответствует грамматике, и строит <em>дерево разбора<\/em> — объект совпадения с именованным захватом для каждого токена.<\/span> <span class=\"sg\" data-s=\"1\">Но обычно вам нужен не сырой текст, а <strong>результат<\/strong>: целое число <code>42<\/code>, а не символы <code>4<\/code> и <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе показано, как ходить по дереву разбора и как прикрепить к совпадению вычисленное значение с помощью <code>make<\/code>, а затем прочитать его обратно через <code>made<\/code>.<\/span><\/p>"]]},"uk":{"t":"Дерево розбору, make і made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Розбір повідомляє вам, що рядок зіставляється з граматикою, і будує <em>дерево розбору<\/em> — об'єкт збігу з іменованим захопленням для кожного токена.<\/span> <span class=\"sg\" data-s=\"1\">Але зазвичай вам потрібен не сирий текст, а <strong>результат<\/strong>: ціле число <code>42<\/code>, а не символи <code>4<\/code> та <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує, як обходити дерево розбору й як прикріпити обчислене значення до збігу за допомогою <code>make<\/code>, а потім прочитати його назад через <code>made<\/code>.<\/span><\/p>"]]},"bg":{"t":"Дървото на разбора, make и made","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Разборът ви казва, че низът съвпада с граматиката, и изгражда <em>дърво на разбора<\/em> — обект на съвпадението с именувано прихващане за всеки токен.<\/span> <span class=\"sg\" data-s=\"1\">Но обикновено не искате суровия текст, а <strong>резултат<\/strong>: цялото число <code>42<\/code>, а не знаците <code>4<\/code> и <code>2<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел показва как да обхождате дървото на разбора и как да прикачите изчислена стойност към съвпадение с <code>make<\/code>, а после да я прочетете обратно с <code>made<\/code>.<\/span><\/p>"]]}}}</script>
