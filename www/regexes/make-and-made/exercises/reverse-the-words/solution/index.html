<script type="application/json" id="page-data">{"u":"regexes/make-and-made/exercises/reverse-the-words/solution","n":1149,"k":"solution","pv":"regexes/make-and-made/exercises/reverse-the-words","nx":"regexes/action-classes","tr":["regexes","regexes/make-and-made"],"L":{"en":{"t":"The solution of ’Reverse the words‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Each <code>word<\/code> token makes its own reversed text: its inline block runs whenever a word matches, and <code>make $/.flip<\/code> stores the word — <code>$/<\/code> is the current match — spelled backwards.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> matches the words with <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — one word, then any number of “space then word” — and combines them. <code>$&lt;word&gt;<\/code> is the list of every word match; <code>».made<\/code> pulls out the reversed text each one stored, and <code>.join(' ')<\/code> rebuilds the phrase with spaces.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">That “item, then item, then item…” shape is common enough to have a shorthand: the <code>%<\/code> separator. Writing <code>&lt;word&gt;+ % ' '<\/code> means “one or more <code>&lt;word&gt;<\/code>, separated by a space”, and matches exactly the same phrases as <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — just more compactly.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">So <code>make<\/code> and <code>made<\/code> work at two levels here: the small pieces make their values, and the whole is made from them. Reading <code>.made<\/code> on the result gives <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Drehen Sie die Wörter um","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jedes Token <code>word<\/code> macht seinen eigenen umgedrehten Text: Sein inline stehender Block läuft, sobald ein Wort trifft, und <code>make $/.flip<\/code> legt das Wort — <code>$/<\/code> ist der aktuelle Treffer — rückwärts geschrieben ab.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> trifft die Wörter mit <code>&lt;word&gt; [ ' ' &lt;word&gt; \/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Elk token <code>word<\/code> maakt zijn eigen omgekeerde tekst: zijn inline blok draait telkens wanneer een woord matcht, en <code>make $/.flip<\/code> bewaart het woord — <code>$/<\/code> is de huidige match — achterstevoren gespeld.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> matcht de woorden met <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — één woord, dan een willekeurig aantal keren \"spatie plus woord\" — en combineert ze. <code>$&lt;word&gt;<\/code> is de lijst met elke woordmatch; <code>».made<\/code> haalt de omgekeerde tekst eruit die elk bewaard heeft, en <code>.join(' ')<\/code> bouwt de woordgroep met spaties weer op.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die vorm van \"item, dan item, dan item…\" komt vaak genoeg voor om een afkorting te hebben: de scheider <code>%<\/code>. <code>&lt;word&gt;+ % ' '<\/code> schrijven betekent \"een of meer <code>&lt;word&gt;<\/code>, gescheiden door een spatie\", en matcht precies dezelfde woordgroepen als <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — alleen compacter.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>make<\/code> en <code>made<\/code> werken hier dus op twee niveaus: de kleine stukjes maken hun waarden, en het geheel wordt daaruit gemaakt. <code>.made<\/code> op het resultaat lezen geeft <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Invierta las palabras","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cada token <code>word<\/code> produce su propio texto invertido: su bloque en línea se ejecuta cada vez que una palabra coincide, y <code>make $/.flip<\/code> guarda la palabra — <code>$/<\/code> es la coincidencia actual — escrita al revés.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> empareja las palabras con <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — una palabra, después cualquier número de «espacio y palabra» — y las combina. <code>$&lt;word&gt;<\/code> es la lista de todas las coincidencias de palabra; <code>».made<\/code> extrae el texto invertido que guardó cada una, y <code>.join(' ')<\/code> reconstruye la frase con espacios.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esa forma de «elemento, después elemento, después elemento…» es lo bastante común como para tener un atajo: el separador <code>%<\/code>. Escribir <code>&lt;word&gt;+ % ' '<\/code> significa «uno o más <code>&lt;word&gt;<\/code>, separados por un espacio», y empareja exactamente las mismas frases que <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code>, solo que de forma más compacta.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Así que aquí <code>make<\/code> y <code>made<\/code> trabajan en dos niveles: las piezas pequeñas producen sus valores y el todo se produce a partir de ellas. Leer <code>.made<\/code> sobre el resultado da <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Invertite le parole","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ogni token <code>word<\/code> produce il proprio testo rovesciato: il suo blocco in linea gira ogni volta che una parola corrisponde, e <code>make $/.flip<\/code> conserva la parola — <code>$/<\/code> è la corrispondenza corrente — scritta all'indietro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> riconosce le parole con <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — una parola, poi un numero qualunque di «spazio poi parola» — e le combina. <code>$&lt;word&gt;<\/code> è l'elenco di ogni corrispondenza di parola; <code>».made<\/code> ne estrae il testo rovesciato conservato da ciascuna, e <code>.join(' ')<\/code> ricostruisce la frase con gli spazi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quella forma «elemento, poi elemento, poi elemento…» è abbastanza comune da avere una scorciatoia: il separatore <code>%<\/code>. Scrivere <code>&lt;word&gt;+ % ' '<\/code> significa «uno o più <code>&lt;word&gt;<\/code>, separati da uno spazio», e riconosce esattamente le stesse frasi di <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code>, solo in modo più compatto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quindi qui <code>make<\/code> e <code>made<\/code> lavorano su due livelli: i pezzi piccoli producono i propri valori, e il tutto viene prodotto a partire da essi. Leggere <code>.made<\/code> sul risultato dà <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Apgrieziet vārdu secību","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Katrs marķieris <code>word<\/code> izveido savu apgriezto tekstu: tā iekšējais bloks izpildās ikreiz, kad vārds sakrīt, un <code>make $/.flip<\/code> saglabā vārdu — <code>$/<\/code> ir pašreizējā sakritība — uzrakstītu no otra gala.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> piemeklē vārdus ar <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — viens vārds, tad jebkurš skaits «atstarpe, tad vārds» — un tos apvieno. <code>$&lt;word&gt;<\/code> ir katras vārda sakritības saraksts; <code>».made<\/code> izvelk apgriezto tekstu, ko katra saglabājusi, un <code>.join(' ')<\/code> atkal uzbūvē frāzi ar atstarpēm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šī «elements, tad elements, tad elements…» forma ir pietiekami izplatīta, lai tai būtu saīsinājums: atdalītājs <code>%<\/code>. Rakstot <code>&lt;word&gt;+ % ' '<\/code>, tas nozīmē «viens vai vairāki <code>&lt;word&gt;<\/code>, atdalīti ar atstarpi», un tas piemeklē tieši tās pašas frāzes, ko <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code>, tikai kompaktāk.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tātad <code>make<\/code> un <code>made<\/code> šeit strādā divos līmeņos: mazie gabali izveido savas vērtības, un veselums tiek izveidots no tām. Nolasot <code>.made<\/code> uz rezultāta, iegūstam <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Переверните порядок слов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Каждый токен <code>word<\/code> делает собственный перевёрнутый текст: его встроенный блок выполняется всякий раз, когда совпадает слово, а <code>make $/.flip<\/code> сохраняет слово (<code>$/<\/code> — это текущее совпадение), записанное задом наперёд.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> сопоставляет слова через <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — одно слово, а затем сколько угодно пар «пробел и слово» — и объединяет их. <code>$&lt;word&gt;<\/code> — это список всех совпадений слов; <code>».made<\/code> вытаскивает сохранённый каждым перевёрнутый текст, а <code>.join(' ')<\/code> собирает фразу обратно с пробелами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Такая форма «элемент, потом элемент, потом элемент…» встречается достаточно часто, чтобы иметь сокращение — разделитель <code>%<\/code>. Запись <code>&lt;word&gt;+ % ' '<\/code> означает «одно или более <code>&lt;word&gt;<\/code>, разделённых пробелом» и сопоставляет ровно те же фразы, что и <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code>, только компактнее.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Итак, <code>make<\/code> и <code>made<\/code> работают здесь на двух уровнях: мелкие кусочки делают свои значения, а целое делается из них. Чтение <code>.made<\/code> у результата даёт <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Переверніть слова»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кожен токен <code>word<\/code> створює власний перевернутий текст: його вбудований блок виконується щоразу, коли слово зіставляється, а <code>make $/.flip<\/code> зберігає слово — <code>$/<\/code> є поточним збігом — записане навпаки.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> зіставляється зі словами за допомогою <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — одне слово, а потім будь-яка кількість «пробіл, потім слово» — і поєднує їх. <code>$&lt;word&gt;<\/code> є списком усіх збігів слів; <code>».made<\/code> витягає перевернутий текст, збережений кожним із них, а <code>.join(' ')<\/code> відбудовує фразу з пробілами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Форма «елемент, потім елемент, потім елемент…» трапляється достатньо часто, щоб мати скорочення: розділювач <code>%<\/code>. Запис <code>&lt;word&gt;+ % ' '<\/code> означає «одне або більше <code>&lt;word&gt;<\/code>, розділених пробілом» і зіставляється точно з тими самими фразами, що й <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code>, — просто компактніше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тож <code>make<\/code> та <code>made<\/code> працюють тут на двох рівнях: дрібні шматки створюють свої значення, а ціле створюється з них. Читання <code>.made<\/code> на результаті дає <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Обърнете думите","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    token TOP  { &lt;word&gt; [ ' ' &lt;word&gt; ]* { make $&lt;word&gt;».made.join(' ') } }\n    token word { \\w+ { make $/.flip } }\n}\n\nsay Phrase.parse('hello world').made;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/make-and-made/reverse-the-words.raku\" target=\"_blank\" rel=\"noopener\">reverse-the-words.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всеки токен <code>word<\/code> създава собствения си обърнат текст: вграденият му блок се изпълнява винаги когато съвпадне дума, а <code>make $/.flip<\/code> съхранява думата — <code>$/<\/code> е текущото съвпадение — изписана наопаки.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TOP<\/code> съпоставя думите с <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — една дума, после произволен брой пъти „интервал, после дума“ — и ги съчетава. <code>$&lt;word&gt;<\/code> е списъкът с всички съвпадения на думи; <code>».made<\/code> изважда обърнатия текст, съхранен от всяко от тях, а <code>.join(' ')<\/code> пресъздава фразата с интервали.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Формата „елемент, после елемент, после елемент…“ се среща достатъчно често, за да има съкращение: разделителят <code>%<\/code>. Записът <code>&lt;word&gt;+ % ' '<\/code> означава „една или повече <code>&lt;word&gt;<\/code>, разделени с интервал“ и съпоставя точно същите фрази като <code>&lt;word&gt; [ ' ' &lt;word&gt; ]*<\/code> — само по-сбито.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Така <code>make<\/code> и <code>made<\/code> работят тук на две нива: малките парчета създават своите стойности, а цялото се създава от тях. Прочитането на <code>.made<\/code> върху резултата дава <code>olleh dlrow<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
