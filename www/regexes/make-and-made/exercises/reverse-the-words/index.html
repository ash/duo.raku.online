\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie jedes Token <code>word<\/code> seinen eigenen Text umgedreht <code>make<\/code>-n (mit <code>flip<\/code>) und lassen Sie <code>TOP<\/code> diese zur endgültigen Wortgruppe verbinden.<\/span> <span class=\"sg\" data-s=\"1\">Zerlegen Sie <code>'hello world'<\/code> und geben Sie <code>.made<\/code> aus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/regexes/make-and-made/exercises/reverse-the-words/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Keer de woorden om‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een grammatica kan een waarde <code>make<\/code>-en uit de waarden die haar onderdelen gemaakt hebben.<\/span> <span class=\"sg\" data-s=\"1\">Ontleed een woordgroep — woorden van woordtekens, gescheiden door enkele spaties, zonder verdere leestekens — en lever de woordgroep op met <strong>elk woord omgekeerd<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Laat elk token <code>word<\/code> zijn eigen tekst omgekeerd <code>make<\/code>-en (met <code>flip<\/code>), en laat <code>TOP<\/code> die tot de uiteindelijke woordgroep combineren.<\/span> <span class=\"sg\" data-s=\"1\">Ontleed <code>'hello world'<\/code> en druk <code>.made<\/code> af.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/regexes/make-and-made/exercises/reverse-the-words/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Invierta las palabras","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una gramática puede producir con <code>make<\/code> un valor a partir de los valores que produjeron sus partes.<\/span> <span class=\"sg\" data-s=\"1\">Analiza una frase — palabras de caracteres de palabra separadas por espacios simples, sin más puntuación — y produce la frase con <strong>todas las palabras invertidas<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haz que cada token <code>word<\/code> produzca con <code>make<\/code> su propio texto invertido (con <code>flip<\/code>), y que <code>TOP<\/code> los combine en la frase final.<\/span> <span class=\"sg\" data-s=\"1\">Analiza <code>'hello world'<\/code> e imprime <code>.made<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>olleh dlrow<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/regexes/make-and-made/exercises/reverse-the-words/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Invertite le parole","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una grammatica può <code>make<\/code> un valore a partire dai valori prodotti dalle sue parti.<\/span> <span class=\"sg\" data-s=\"1\">Analizza una frase — parole di caratteri di parola separate da singoli spazi, senza altra punteggiatura — e produci la frase con <strong>ogni parola rovesciata<\/strong>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fai in modo che ogni token <code>word<\/code> produca con <code>make<\/code> il proprio testo rovesciato (con <code>flip<\/code>), e che
