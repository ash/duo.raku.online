<script type="application/json" id="page-data">{"u":"regexes/quantifiers","n":996,"k":"section","pv":"regexes/matching/exercises/where-digit/solution","nx":"regexes/quantifiers/star-plus-question","tr":["regexes"],"L":{"en":{"t":"Quantifiers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">So far every part of a pattern matched exactly one character.<\/span> <span class=\"sg\" data-s=\"1\">A <em>quantifier<\/em> says how many times the preceding piece may repeat: zero or more, one or more, an exact number, and so on.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quantifiers are what let a regex match a whole word, a run of digits, or an optional piece that may or may not be there.<\/span> <span class=\"sg\" data-s=\"1\">This section covers the three basic quantifiers, the general <code>**<\/code> quantifier, and the difference between <em>greedy<\/em> and <em>frugal<\/em> matching.<\/span><\/p>"]]},"de":{"t":"Quantoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bisher hat jeder Teil eines Musters genau ein Zeichen getroffen.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Quantor<\/em> gibt an, wie oft sich das vorangehende Stück wiederholen darf: null- oder mehrmals, ein- oder mehrmals, eine genaue Anzahl und so weiter.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quantoren sind es, die einen Regex ein ganzes Wort, eine Folge von Ziffern oder ein optionales Stück treffen lassen, das da sein kann oder auch nicht.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt die drei einfachen Quantoren, den allgemeinen Quantor <code>**<\/code> und den Unterschied zwischen <em>gierigem<\/em> und <em>sparsamem<\/em> Treffen.<\/span><\/p>"]]},"nl":{"t":"Kwantoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe matchte elk deel van een patroon precies één teken.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>kwantor<\/em> zegt hoe vaak het voorafgaande stuk herhaald mag worden: nul of meer keer, een of meer keer, een exact aantal, enzovoort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kwantoren zijn wat een regex een heel woord, een reeks cijfers of een optioneel stuk laat matchen dat er wel of niet kan zijn.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie behandelt de drie basiskwantoren, de algemene kwantor <code>**<\/code>, en het verschil tussen <em>gulzig<\/em> en <em>zuinig<\/em> matchen.<\/span><\/p>"]]},"es":{"t":"Cuantificadores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora cada parte de un patrón emparejaba exactamente un carácter.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>cuantificador<\/em> dice cuántas veces puede repetirse la pieza que lo precede: cero o más veces, una o más veces, un número exacto, etcétera.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los cuantificadores son lo que permite a un regex emparejar una palabra entera, una serie de dígitos o una pieza opcional que puede estar o no. Esta sección trata los tres cuantificadores básicos, el cuantificador general <code>**<\/code> y la diferencia entre emparejamiento <em>voraz<\/em> y <em>frugal<\/em>.<\/span><\/p>"]]},"it":{"t":"Quantificatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora ogni parte di uno schema riconosceva esattamente un carattere.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>quantificatore<\/em> dice quante volte il pezzo che lo precede può ripetersi: zero o più volte, una o più volte, un numero esatto e così via.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I quantificatori sono ciò che permette a un regex di riconoscere una parola intera, una sequenza di cifre o un pezzo facoltativo che può esserci o no. Questa sezione tratta i tre quantificatori di base, il quantificatore generale <code>**<\/code> e la differenza fra matching <em>goloso<\/em> e <em>frugale<\/em>.<\/span><\/p>"]]},"lv":{"t":"Kvantifikatori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Līdz šim katra raksturā daļa piemeklēja tieši vienu rakstzīmi. <em>Kvantors<\/em> pasaka, cik reižu iepriekšējais gabals drīkst atkārtoties: nulle vai vairāk, viena vai vairāk, precīzs skaits un tā tālāk.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tieši kvantori ļauj regulārajai izteiksmei piemeklēt veselu vārdu, ciparu virteni vai neobligātu gabalu, kas var būt vai nebūt.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko trīs pamata kvantorus, vispārīgo kvantoru <code>**<\/code> un atšķirību starp <em>rijīgu<\/em> un <em>taupīgu<\/em> piemeklēšanu.<\/span><\/p>"]]},"ru":{"t":"Квантификаторы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">До сих пор каждая часть шаблона соответствовала ровно одному символу. <em>Квантификатор<\/em> указывает, сколько раз может повториться предшествующий кусочек: ноль или более раз, один или более, точное число и так далее.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именно квантификаторы позволяют регулярному выражению сопоставить целое слово, вереницу цифр или необязательный кусочек, которого может и не быть.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются три основных квантификатора, общий квантификатор <code>**<\/code> и разница между <em>жадным<\/em> и <em>экономным<\/em> сопоставлением.<\/span><\/p>"]]},"uk":{"t":"Квантифікатори","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Досі кожна частина шаблону збігалася рівно з одним символом. <em>Квантифікатор<\/em> каже, скільки разів попередня частина може повторитися: нуль чи більше, один чи більше, точну кількість тощо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме квантифікатори дозволяють регексу зіставитися з цілим словом, низкою цифр або необов'язковою частиною, якої може й не бути.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ охоплює три базові квантифікатори, загальний квантифікатор <code>**<\/code> і різницю між <em>жадібним<\/em> та <em>бережливим<\/em> зіставленням.<\/span><\/p>"]]},"bg":{"t":"Квантификатори","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Досега всяка част от шаблона съпоставяше точно един знак. <em>Квантификаторът<\/em> казва колко пъти може да се повтори предходното парче: нула или повече пъти, един или повече, точен брой и така нататък.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Квантификаторите са онова, което позволява на регулярния израз да съпостави цяла дума, поредица от цифри или незадължително парче, което може да го има, а може и да го няма.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел обхваща трите основни квантификатора, общия квантификатор <code>**<\/code> и разликата между <em>лакомо<\/em> и <em>пестеливо<\/em> съпоставяне.<\/span><\/p>"]]}}}</script>
