<script type="application/json" id="page-data">{"u":"regexes/quantifiers/times-quantifier","n":999,"k":"topic","pv":"regexes/quantifiers/star-plus-question/quiz","nx":"regexes/quantifiers/greedy-frugal","tr":["regexes","regexes/quantifiers"],"L":{"en":{"t":"The times quantifier","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">When you need an exact number of repetitions, or a range, use the <code>**<\/code> quantifier followed by a number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> matches exactly four digits in a row.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A range with two dots allows a variable count.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>\\d ** 2..3<\/code> matches two or three digits — as many as are available, up to three:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The pattern took three digits, because three is the most it is allowed in the range <code>2..3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also leave the upper end open.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> means “two or more digits”, and <code>\\d ** 1..*<\/code> means the same as <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>**<\/code> quantifier is the general form; <code>*<\/code>, <code>+<\/code>, and <code>?<\/code> are just convenient shortcuts for the common cases <code>0..*<\/code>, <code>1..*<\/code>, and <code>0..1<\/code>.<\/span><\/p>"]]},"de":{"t":"Der Mal-Quantor","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie eine genaue Anzahl von Wiederholungen brauchen oder einen Bereich, verwenden Sie den Quantor <code>**<\/code> gefolgt von einer Zahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> trifft genau vier Ziffern in Folge.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Bereich mit zwei Punkten erlaubt eine veränderliche Anzahl.<\/span> <span class=\"sg\" data-s=\"1\">So trifft <code>\\d ** 2..3<\/code> zwei oder drei Ziffern — so viele, wie vorhanden sind, höchstens drei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Muster hat drei Ziffern genommen, weil drei das Höchste ist, was der Bereich <code>2..3<\/code> erlaubt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können das obere Ende auch offen lassen.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> bedeutet „zwei oder mehr Ziffern“, und <code>\\d ** 1..*<\/code> bedeutet dasselbe wie <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Quantor <code>**<\/code> ist die allgemeine Form; <code>*<\/code>, <code>+<\/code> und <code>?<\/code> sind lediglich bequeme Abkürzungen für die häufigen Fälle <code>0..*<\/code>, <code>1..*<\/code> und <code>0..1<\/code>.<\/span><\/p>"]]},"nl":{"t":"De maal-kwantor","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een exact aantal herhalingen nodig hebt, of een bereik, gebruik je de kwantor <code>**<\/code> gevolgd door een getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> matcht precies vier cijfers achter elkaar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een bereik met twee punten laat een variabel aantal toe.<\/span> <span class=\"sg\" data-s=\"1\">Zo matcht <code>\\d ** 2..3<\/code> twee of drie cijfers — zoveel als er beschikbaar zijn, tot drie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het patroon nam drie cijfers, omdat drie het maximum is dat het bereik <code>2..3<\/code> toestaat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt de bovenkant ook openlaten.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> betekent \"twee of meer cijfers\", en <code>\\d ** 1..*<\/code> betekent hetzelfde als <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De kwantor <code>**<\/code> is de algemene vorm; <code>*<\/code>, <code>+<\/code> en <code>?<\/code> zijn slechts handige afkortingen voor de gewone gevallen <code>0..*<\/code>, <code>1..*<\/code> en <code>0..1<\/code>.<\/span><\/p>"]]},"es":{"t":"El cuantificador de repeticiones","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando necesitas un número exacto de repeticiones, o un rango, usa el cuantificador <code>**<\/code> seguido de un número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> empareja exactamente cuatro dígitos seguidos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un rango con dos puntos admite una cantidad variable.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>\\d ** 2..3<\/code> empareja dos o tres dígitos, tantos como haya disponibles hasta tres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El patrón tomó tres dígitos, porque tres es lo máximo que le permite el rango <code>2..3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes dejar abierto el extremo superior.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> significa «dos o más dígitos», y <code>\\d ** 1..*<\/code> significa lo mismo que <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El cuantificador <code>**<\/code> es la forma general; <code>*<\/code>, <code>+<\/code> y <code>?<\/code> son solo atajos cómodos para los casos comunes <code>0..*<\/code>, <code>1..*<\/code> y <code>0..1<\/code>.<\/span><\/p>"]]},"it":{"t":"Il quantificatore di ripetizioni","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando ti serve un numero esatto di ripetizioni, o un intervallo, usa il quantificatore <code>**<\/code> seguito da un numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> riconosce esattamente quattro cifre di fila.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un intervallo con due punti ammette un conteggio variabile.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio <code>\\d ** 2..3<\/code> riconosce due o tre cifre — quante ne sono disponibili, fino a tre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo schema ha preso tre cifre, perché tre è il massimo che l'intervallo <code>2..3<\/code> gli concede.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche lasciare aperto l'estremo superiore.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> significa «due o più cifre», e <code>\\d ** 1..*<\/code> significa lo stesso di <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il quantificatore <code>**<\/code> è la forma generale; <code>*<\/code>, <code>+<\/code> e <code>?<\/code> sono solo comode scorciatoie per i casi comuni <code>0..*<\/code>, <code>1..*<\/code> e <code>0..1<\/code>.<\/span><\/p>"]]},"lv":{"t":"Skaita kvantifikators","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad vajadzīgs precīzs atkārtojumu skaits vai diapazons, izmantojiet kvantoru <code>**<\/code>, kam seko skaitlis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> piemeklē tieši četrus ciparus pēc kārtas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diapazons ar diviem punktiem atļauj mainīgu skaitu.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, <code>\\d ** 2..3<\/code> piemeklē divus vai trīs ciparus — tik, cik ir pieejami, līdz trim:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raksturs paņēma trīs ciparus, jo trīs ir visvairāk, cik diapazons <code>2..3<\/code> atļauj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Augšējo galu var arī atstāt vaļā.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> nozīmē «divi vai vairāk cipari», bet <code>\\d ** 1..*<\/code> nozīmē to pašu, ko <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kvantors <code>**<\/code> ir vispārīgā forma; <code>*<\/code>, <code>+<\/code> un <code>?<\/code> ir tikai ērti saīsinājumi biežajiem gadījumiem <code>0..*<\/code>, <code>1..*<\/code> un <code>0..1<\/code>.<\/span><\/p>"]]},"ru":{"t":"Квантификатор количества","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда нужно точное число повторений или диапазон, используйте квантификатор <code>**<\/code>, за которым следует число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> соответствует ровно четырём цифрам подряд.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Диапазон через две точки допускает переменное количество.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>\\d ** 2..3<\/code> соответствует двум или трём цифрам — столько, сколько найдётся, но не больше трёх:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон взял три цифры, потому что три — это максимум, разрешённый диапазоном <code>2..3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Верхнюю границу можно и не указывать.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> означает «две или более цифр», а <code>\\d ** 1..*<\/code> означает то же, что и <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Квантификатор <code>**<\/code> — общая форма; <code>*<\/code>, <code>+<\/code> и <code>?<\/code> — лишь удобные сокращения для частых случаев <code>0..*<\/code>, <code>1..*<\/code> и <code>0..1<\/code>.<\/span><\/p>"]]},"uk":{"t":"Квантифікатор кратності","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли потрібна точна кількість повторень або діапазон, скористайтеся квантифікатором <code>**<\/code>, за яким іде число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> збігається рівно з чотирма цифрами поспіль.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Діапазон із двома крапками допускає змінну кількість.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>\\d ** 2..3<\/code> збігається з двома або трьома цифрами — зі стількома, скільки є, але не більше трьох:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон узяв три цифри, бо три — це найбільше, що дозволяє діапазон <code>2..3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Верхню межу можна також лишити відкритою.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> означає «дві або більше цифр», а <code>\\d ** 1..*<\/code> означає те саме, що й <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Квантифікатор <code>**<\/code> є загальною формою; <code>*<\/code>, <code>+<\/code> та <code>?<\/code> — просто зручні скорочення для поширених випадків <code>0..*<\/code>, <code>1..*<\/code> та <code>0..1<\/code>.<\/span><\/p>"]]},"bg":{"t":"Квантификаторът за брой пъти","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато ви трябва точен брой повторения или диапазон, използвайте квантификатора <code>**<\/code>, следван от число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> съпоставя точно четири цифри една след друга.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Диапазон с две точки позволява променлив брой.<\/span> <span class=\"sg\" data-s=\"1\">Например <code>\\d ** 2..3<\/code> съпоставя две или три цифри — толкова, колкото са налични, до три:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблонът взе три цифри, защото три е най-многото, което му е позволено в диапазона <code>2..3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да оставите горния край и отворен.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> означава „две или повече цифри“, а <code>\\d ** 1..*<\/code> означава същото като <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Квантификаторът <code>**<\/code> е общата форма; <code>*<\/code>, <code>+<\/code> и <code>?<\/code> са само удобни скъсявания за честите случаи <code>0..*<\/code>, <code>1..*<\/code> и <code>0..1<\/code>.<\/span><\/p>"]]},"eo":{"t":"La kvantoro de nombro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi bezonas ekzaktan nombron da ripetoj, aŭ intervalon, uzu la kvantoron <code>**<\/code> sekvatan de nombro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> kongruas kun ekzakte kvar ciferoj sinsekve.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intervalo kun du punktoj permesas variablan kalkulon.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, <code>\\d ** 2..3<\/code> kongruas kun du aŭ tri ciferoj — tiom, kiom disponeblas, ĝis tri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La ŝablono prenis tri ciferojn, ĉar tri estas la plejmulto, kiun ĝi rajtas en la intervalo <code>2..3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas lasi la supran finon malfermita.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> signifas «du aŭ pli da ciferoj», kaj <code>\\d ** 1..*<\/code> signifas la samon kiel <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kvantoro <code>**<\/code> estas la ĝenerala formo; <code>*<\/code>, <code>+<\/code> kaj <code>?<\/code> estas nur oportunaj mallongigoj por la oftaj kazoj <code>0..*<\/code>, <code>1..*<\/code> kaj <code>0..1<\/code>.<\/span><\/p>"]]},"la":{"t":"Quantificator numeri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum numero exacto repetitionum vel intervallo eges, utere quantificatore <code>**<\/code> quem numerus sequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '2025' ~~ / \\d ** 4 /; # ｢2025｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\d ** 4<\/code> exacte quattuor cifras deinceps congruit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intervallum duobus punctis numerum variabilem permittit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, <code>\\d ** 2..3<\/code> duas vel tres cifras congruit — quot praesto sunt, usque ad tres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '12345' ~~ / \\d ** 2..3 /; # ｢123｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exemplar tres cifras cepit, quia tres sunt plurimae quas in intervallo <code>2..3<\/code> capere licet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Finem superiorem etiam apertum relinquere potes.<\/span> <span class=\"sg\" data-s=\"1\"><code>\\d ** 2..*<\/code> significat «duas vel plures cifras», et <code>\\d ** 1..*<\/code> idem significat quod <code>\\d+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quantificator <code>**<\/code> forma generalis est; <code>*<\/code>, <code>+<\/code> et <code>?<\/code> mera compendia commoda sunt pro casibus frequentibus <code>0..*<\/code>, <code>1..*<\/code> et <code>0..1<\/code>.<\/span><\/p>"]]}}}</script>
