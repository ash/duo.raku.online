<script type="application/json" id="page-data">{"u":"regexes/quantifiers/star-plus-question","n":997,"k":"topic","pv":"regexes/quantifiers","nx":"regexes/quantifiers/star-plus-question/quiz","tr":["regexes","regexes/quantifiers"],"L":{"en":{"t":"Star, plus, and question mark","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Three symbols cover the most common cases.<\/span> <span class=\"sg\" data-s=\"1\">Each one applies to the item right before it:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — zero or more times<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — one or more times<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — zero or one time (optional)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The plus sign matches a run of one or more characters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It matched as many <code>a<\/code>s as it could — three of them.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The star is like the plus but also succeeds when there is nothing to match, because zero repetitions are allowed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The question mark makes a piece optional — it matches whether or not the piece is there:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quantifiers apply to whatever comes immediately before them, including a character class.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>\\d+<\/code> matches a run of one or more digits — a whole number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]},"de":{"t":"Stern, Plus und Fragezeichen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Drei Zeichen decken die häufigsten Fälle ab.<\/span> <span class=\"sg\" data-s=\"1\">Jedes bezieht sich auf das Element unmittelbar davor:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — null- oder mehrmals<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — ein- oder mehrmals<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — null- oder einmal (optional)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Pluszeichen trifft eine Folge von einem oder mehreren Zeichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es hat so viele <code>a<\/code> getroffen, wie es konnte — drei davon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Stern ist wie das Plus, gelingt aber auch dann, wenn es nichts zu treffen gibt, denn null Wiederholungen sind erlaubt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Fragezeichen macht ein Stück optional — es trifft, ob das Stück da ist oder nicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quantoren beziehen sich auf das, was unmittelbar vor ihnen steht, auch auf eine Zeichenklasse.<\/span> <span class=\"sg\" data-s=\"1\">So trifft <code>\\d+<\/code> eine Folge von einer oder mehreren Ziffern — eine ganze Zahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]},"nl":{"t":"Ster, plus en vraagteken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Drie symbolen dekken de meest voorkomende gevallen.<\/span> <span class=\"sg\" data-s=\"1\">Elk ervan hoort bij het item er direct voor:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — nul of meer keer<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — een of meer keer<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — nul of een keer (optioneel)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het plusteken matcht een reeks van een of meer tekens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het matchte zoveel <code>a<\/code>'s als het kon — drie stuks.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De ster lijkt op de plus maar slaagt ook wanneer er niets te matchen valt, omdat nul herhalingen toegestaan zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het vraagteken maakt een stuk optioneel — het matcht of het stuk er nu wel of niet is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kwantoren horen bij wat er onmiddellijk voor komt, inclusief een tekenklasse.<\/span> <span class=\"sg\" data-s=\"1\">Zo matcht <code>\\d+<\/code> een reeks van een of meer cijfers — een heel getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]},"es":{"t":"Asterisco, más e interrogación","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres símbolos cubren los casos más comunes.<\/span> <span class=\"sg\" data-s=\"1\">Cada uno se aplica al elemento que lo precede inmediatamente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — cero o más veces<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — una o más veces<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — cero o una vez (opcional)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El signo más empareja una serie de uno o más caracteres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Emparejó tantas <code>a<\/code> como pudo: tres.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El asterisco es como el más, pero también funciona cuando no hay nada que emparejar, porque se admiten cero repeticiones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El signo de interrogación hace opcional una pieza: empareja tanto si la pieza está como si no:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los cuantificadores se aplican a lo que venga inmediatamente antes, clases de caracteres incluidas.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>\\d+<\/code> empareja una serie de uno o más dígitos, es decir, un número entero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]},"it":{"t":"Asterisco, più e punto interrogativo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tre simboli coprono i casi più comuni.<\/span> <span class=\"sg\" data-s=\"1\">Ciascuno si applica all'elemento che lo precede immediatamente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — zero o più volte<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — una o più volte<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — zero o una volta (facoltativo)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il segno più riconosce una sequenza di uno o più caratteri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ha riconosciuto quante più <code>a<\/code> poteva: tre.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'asterisco è come il più, ma riesce anche quando non c'è nulla da riconoscere, perché sono ammesse zero ripetizioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il punto interrogativo rende un pezzo facoltativo: riconosce sia che il pezzo ci sia sia che non ci sia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I quantificatori si applicano a qualunque cosa li preceda immediatamente, classi di caratteri comprese.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio <code>\\d+<\/code> riconosce una sequenza di una o più cifre — un numero intero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]},"ru":{"t":"Звёздочка, плюс и вопросительный знак","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Три знака покрывают самые частые случаи.<\/span> <span class=\"sg\" data-s=\"1\">Каждый из них относится к тому, что стоит прямо перед ним:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — ноль или более раз<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — один или более раз<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — ноль или один раз (необязательно)<\/span><\/li><\/ul>"],["p",1,"<p><spa an><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Він зіставився з такою кількістю <code>a<\/code>, з якою тільки міг, — з трьома.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зірочка схожа на плюс, але вдається й тоді, коли зіставлятися нема з чим, бо нуль повторень дозволено:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Знак питання робить частину необов'язковою — він збігається незалежно від того, є ця частина чи ні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Квантифікатори застосовуються до того, що стоїть безпосередньо перед ними, зокрема й до класу символів.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>\\d+<\/code> збігається з низкою з однієї чи більше цифр — тобто з цілим числом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]},"bg":{"t":"Звездичка, плюс и въпросителна","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Три символа покриват най-честите случаи.<\/span> <span class=\"sg\" data-s=\"1\">Всеки от тях се отнася за елемента непосредствено преди него:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — нула или повече пъти<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>+<\/code> — един или повече пъти<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — нула или един път (незадължително)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Знакът плюс съпоставя поредица от един или повече знака:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'aaah' ~~ / a+ /; # ｢aaa｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Той съпостави толкова <code>a<\/code>, колкото можа — три на брой.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звездичката е като плюса, но успява и когато няма какво да се съпостави, защото са позволени нула повторения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou*r /; # ｢colour｣\nsay 'color'  ~~ / colou*r /; # ｢color｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Въпросителната прави парчето незадължително — тя съпоставя независимо дали парчето е налице:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'colour' ~~ / colou?r /; # ｢colour｣\nsay 'color'  ~~ / colou?r /; # ｢color｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Квантификаторите се отнасят за онова, което идва непосредствено преди тях, включително за клас от знаци.<\/span> <span class=\"sg\" data-s=\"1\">Например <code>\\d+<\/code> съпоставя поредица от една или повече цифри — цяло число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'order 66' ~~ / \\d+ /; # ｢66｣<\/code><\/pre>"]]}}}</script>
