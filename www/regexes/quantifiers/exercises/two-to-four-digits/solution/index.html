<script type="application/json" id="page-data">{"u":"regexes/quantifiers/exercises/two-to-four-digits/solution","n":1006,"k":"solution","pv":"regexes/quantifiers/exercises/two-to-four-digits","nx":"regexes/quantifiers/exercises/frugal-match","tr":["regexes","regexes/quantifiers"],"L":{"en":{"t":"The solution of ’Two to four digits‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> matches between two and four digits in a row.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The string has five digits available, but the range caps the match at four, so the pattern takes <code>1234<\/code> and leaves the final <code>5<\/code>. Being greedy, it takes the most the range permits rather than the fewest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Greed only applies within a single match — the engine still stops at the <strong>first<\/strong> place the pattern succeeds. Even if a longer digit sequence appears later in the string, it is never reached:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here ">Hier wird <code>123<\/code> getroffen, obwohl die spätere Folge <code>6789012<\/code> den ganzen Bereich mit <code>6789<\/code> gefüllt hätte.<\/span> <span class=\"sg\" data-s=\"1\">Der am weitesten links stehende Treffer gewinnt.<\/span><\/p>"]]},"nl":{"t":"Oplossing: Twee tot vier cijfers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> matcht tussen de twee en vier cijfers achter elkaar.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De string heeft vijf cijfers beschikbaar, maar het bereik legt de match op vier vast, dus neemt het patroon <code>1234<\/code> en laat het de afsluitende <code>5<\/code> liggen. Gulzig als het is, neemt het het maximum dat het bereik toestaat in plaats van het minimum.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gulzigheid geldt alleen binnen één match — de engine stopt nog steeds op de <strong>eerste<\/strong> plek waar het patroon slaagt. Zelfs als er later in de string een langere reeks cijfers staat, wordt die nooit bereikt:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wordt <code>123<\/code> gematcht, hoewel de latere reeks <code>6789012<\/code> het hele bereik met <code>6789<\/code> gevuld zou hebben.<\/span> <span class=\"sg\" data-s=\"1\">De meest linkse match wint.<\/span><\/p>"]]},"es":{"t":"Solución: De dos a cuatro dígitos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> empareja de dos a cuatro dígitos seguidos.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La cadena tiene cinco dígitos disponibles, pero el rango limita la coincidencia a cuatro, así que el patrón toma <code>1234<\/code> y deja el <code>5<\/code> final. Al ser voraz, toma el máximo que el rango permite y no el mínimo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La voracidad solo se aplica dentro de una misma coincidencia: el motor sigue deteniéndose en el <strong>primer<\/strong> sitio donde el patrón funciona. Aunque más adelante en la cadena aparezca una serie de dígitos más larga, nunca se alcanza:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí se empareja <code>123<\/code> aunque la serie posterior <code>6789012<\/code> habría llenado todo el rango con <code>6789<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Gana la coincidencia más a la izquierda.<\/span><\/p>"]]},"it":{"t":"Soluzione: Da due a quattro cifre","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> riconosce da due a quattro cifre di fila.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La stringa ha cinque cifre disponibili, ma l'intervallo limita la corrispondenza a quattro, quindi lo schema prende <code>1234<\/code> e lascia il <code>5<\/code> finale. Essendo goloso, prende il massimo che l'intervallo permette invece del minimo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La golosità si applica solo all'interno di una singola corrispondenza: il motore si ferma comunque al <strong>primo<\/strong> punto in cui lo schema riesce. Anche se una sequenza di cifre più lunga compare più avanti nella stringa, non viene mai raggiunta:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class= 123<\/code>, lai gan vēlākā virtene <code>6789012<\/code> būtu piepildījusi visu diapazonu ar <code>6789<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Uzvar sakritība, kas ir pa kreisi.<\/span><\/p>"]]},"ru":{"t":"Решение: От двух до четырёх цифр","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> соответствует от двух до четырёх цифр подряд.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В строке доступно пять цифр, но диапазон ограничивает совпадение четырьмя, поэтому шаблон берёт <code>1234<\/code>, оставляя последнюю <code>5<\/code>. Будучи жадным, он берёт максимум из разрешённого диапазоном, а не минимум.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Жадность действует только внутри одного совпадения — движок всё равно останавливается на <strong>первом<\/strong> месте, где шаблон срабатывает. Даже если дальше в строке есть более длинная последовательность цифр, до неё дело не доходит:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь совпадает <code>123<\/code>, хотя более поздняя вереница <code>6789012<\/code> заполнила бы весь диапазон,     дав <code>6789<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Побеждает самое левое совпадение.<\/span><\/p>"]]},"uk":{"t":"Розв'язання: Від двох до чотирьох цифр","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> збігається з двома-чотирма цифрами поспіль.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У рядку є п'ять доступних цифр, але діапазон обмежує збіг чотирма, тож шаблон бере <code>1234<\/code> і лишає останню <code>5<\/code>. Будучи жадібним, він бере найбільше з дозволеного діапазоном, а не найменше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Жадібність діє лише в межах одного збігу — механізм усе одно зупиняється на <strong>першому<\/strong> місці, де шаблон вдається. Навіть якщо далі в рядку є довша послідовність цифр, до неї він так і не доходить:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут зіставляється <code>123<\/code>, хоча пізніша низка <code>6789012<\/code> заповнила б увесь діапазон, давши <code>6789<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Перемагає найлівіший збіг.<\/span><\/p>"]]},"bg":{"t":"Решение: От две до четири цифри","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc12345' ~~ / \\d ** 2..4 /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/quantifiers/two-to-four-digits.raku\" target=\"_blank\" rel=\"noopener\">two-to-four-digits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>｢1234｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>\\d ** 2..4<\/code> съпоставя от две до четири цифри една след друга.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В низа има пет налични цифри, но диапазонът ограничава съвпадението до четири, така че шаблонът взема <code>1234<\/code> и оставя последната <code>5<\/code>. Бидейки лаком, той взема най-многото, което диапазонът позволява, а не най-малкото.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Лакомията важи само в рамките на едно съвпадение — машината пак спира на <strong>първото<\/strong> място, където шаблонът успява. Дори по-дълга поредица от цифри да се появи по-нататък в низа, до нея никога не се стига:<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code><\/code><code>raku     say 'abc123def6789012z' ~~ / \\d ** 2..4 /;   # ｢123｣     <\/code><code><\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук се съпоставя <code>123<\/code>, макар че по-късната поредица <code>6789012<\/code> би запълнила целия диапазон с <code>6789<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Печели най-лявото съвпадение.<\/span><\/p>"]]}}}</script>
