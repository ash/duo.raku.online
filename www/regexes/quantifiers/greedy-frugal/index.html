<script type="application/json" id="page-data">{"u":"regexes/quantifiers/greedy-frugal","n":1000,"k":"topic","pv":"regexes/quantifiers/times-quantifier","nx":"regexes/quantifiers/greedy-frugal/quiz","tr":["regexes","regexes/quantifiers"],"L":{"en":{"t":"Greedy and frugal matching","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">By default, a quantifier is <em>greedy<\/em>: it matches as much as it possibly can while still letting the rest of the pattern succeed.<\/span> <span class=\"sg\" data-s=\"1\">Consider matching from the first <code>&lt;<\/code> to a <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>.+<\/code> swallowed as much as it could, all the way to the <strong>last<\/strong> <code>&gt;<\/code>, so the match runs across both pairs of brackets.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To make a quantifier <em>frugal<\/em> (also called <em>lazy<\/em> or <em>non-greedy<\/em>), add a <code>?<\/code> after it.<\/span> <span class=\"sg\" data-s=\"1\">A frugal quantifier matches as <strong>little<\/strong> as possible:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now <code>.+?<\/code> stops at the <strong>first<\/strong> <code>&gt;<\/code>, so only the first bracketed piece matches.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>?<\/code> suffix works on any quantifier: <code>*?<\/code> and <code>**?<\/code> are frugal too.<\/span> <span class=\"sg\" data-s=\"1\">Greedy and frugal versions match the same kinds of text — they differ only in how much they take when there is a choice.<\/span><\/p>"]]},"de":{"t":"Gieriges und sparsames Treffen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig ist ein Quantor <em>gierig<\/em>: Er trifft so viel, wie er nur kann, ohne dass der Rest des Musters scheitert.<\/span> <span class=\"sg\" data-s=\"1\">Betrachten Sie einen Treffer vom ersten <code>&lt;<\/code> bis zu einem <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>.+<\/code> hat so viel verschlungen, wie es konnte, bis zum <strong>letzten<\/strong> <code>&gt;<\/code>, der Treffer erstreckt sich also über beide Klammerpaare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um einen Quantor <em>sparsam<\/em> zu machen (auch <em>faul<\/em> oder <em>nicht gierig<\/em> genannt), setzen Sie ein <code>?<\/code> dahinter.<\/span> <span class=\"sg\" data-s=\"1\">Ein sparsamer Quantor trifft <strong>so wenig<\/strong> wie möglich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt hält <code>.+?<\/code> beim <strong>ersten<\/strong> <code>&gt;<\/code> an, es wird also nur das erste Klammerstück getroffen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das nachgestellte <code>?<\/code> funktioniert bei jedem Quantor: <code>*?<\/code> und <code>**?<\/code> sind ebenfalls sparsam.<\/span> <span class=\"sg\" data-s=\"1\">Gierige und sparsame Fassungen treffen dieselben Arten von Text — sie unterscheiden sich nur darin, wie viel sie nehmen, wenn es eine Wahl gibt.<\/span><\/p>"]]},"nl":{"t":"Gulzig en zuinig matchen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard is een kwantor <em>gulzig<\/em>: hij matcht zoveel als hij maar kan terwijl de rest van het patroon nog steeds kan slagen.<\/span> <span class=\"sg\" data-s=\"1\">Kijk naar het matchen van de eerste <code>&lt;<\/code> tot een <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>.+<\/code> slokte zoveel op als hij kon, helemaal tot de <strong>laatste<\/strong> <code>&gt;<\/code>, dus loopt de match over beide paren haken heen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een kwantor <em>zuinig<\/em> te maken (ook wel <em>lui<\/em> of <em>niet-gulzig<\/em> genoemd), zet je er een <code>?<\/code> achter.<\/span> <span class=\"sg\" data-s=\"1\">Een zuinige kwantor matcht <strong>zo weinig<\/strong> mogelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu stopt <code>.+?<\/code> bij de <strong>eerste<\/strong> <code>&gt;<\/code>, dus matcht alleen het eerste stuk tussen haken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het achtervoegsel <code>?<\/code> werkt op elke kwantor: <code>*?<\/code> en <code>**?<\/code> zijn ook zuinig.<\/span> <span class=\"sg\" data-s=\"1\">Gulzige en zuinige versies matchen dezelfde soorten tekst — ze verschillen alleen in hoeveel ze nemen wanneer er iets te kiezen valt.<\/span><\/p>"]]},"es":{"t":"Emparejamiento voraz y frugal","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por omisión, un cuantificador es <em>voraz<\/em>: empareja todo lo que puede sin impedir que el resto del patrón funcione.<\/span> <span class=\"sg\" data-s=\"1\">Considera emparejar desde el primer <code>&lt;<\/code> hasta un <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El <code>.+<\/code> se tragó todo lo que pudo, hasta el <strong>último<\/strong> <code>&gt;<\/code>, así que la coincidencia atraviesa los dos pares de corchetes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para hacer frugal un cuantificador (también llamado <em>perezoso<\/em> o <em>no voraz<\/em>), añádele un <code>?<\/code> detrás.<\/span> <span class=\"sg\" data-s=\"1\">Un cuantificador frugal empareja lo <strong>menos<\/strong> posible:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora <code>.+?<\/code> se detiene en el <strong>primer<\/strong> <code>&gt;<\/code>, así que solo coincide la primera pieza entre corchetes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El sufijo <code>?<\/code> funciona sobre cualquier cuantificador: <code>*?<\/code> y <code>**?<\/code> también son frugales.<\/span> <span class=\"sg\" data-s=\"1\">Las versiones voraz y frugal emparejan la misma clase de texto; solo se diferencian en cuánto toman cuando hay elección.<\/span><\/p>"]]},"it":{"t":"Matching goloso e frugale","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita un quantificatore è <em>goloso<\/em>: riconosce quanto più può, pur lasciando riuscire il resto dello schema.<\/span> <span class=\"sg\" data-s=\"1\">Considera il riconoscimento dal primo <code>&lt;<\/code> a un <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il <code>.+<\/code> ha inghiottito quanto poteva, fino all'<strong>ultimo<\/strong> <code>&gt;<\/code>, quindi la corrispondenza attraversa entrambe le coppie di parentesi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per rendere un quantificatore <em>frugale<\/em> (detto anche <em>pigro<\/em> o <em>non goloso<\/em>), aggiungi un <code>?<\/code> dopo di esso.<\/span> <span class=\"sg\" data-s=\"1\">Un quantificatore frugale riconosce quanto <strong>meno<\/strong> possibile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora <code>.+?<\/code> si ferma al <strong>primo<\/strong> <code>&gt;<\/code>, quindi corrisponde solo il primo pezzo fra parentesi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il suffisso <code>?<\/code> funziona su qualunque quantificatore: anche <code>*?<\/code> e <code>**?<\/code> sono frugali.<\/span> <span class=\"sg\" data-s=\"1\">Le versioni golosa e frugale riconoscono gli stessi generi di testo — differiscono solo per quanto prendono quando c'è una scelta.<\/span><\/p>"]]},"lv":{"t":"Mantkārīga un taupīga saskaņošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma kvantors ir <em>rijīgs<\/em>: tas piemeklē tik daudz, cik vien iespējams, joprojām ļaujot izdoties raksturā atlikumam.<\/span> <span class=\"sg\" data-s=\"1\">Aplūkojiet piemeklēšanu no pirmās <code>&lt;<\/code> līdz kādai <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.+<\/code> aprija tik daudz, cik varēja, — līdz pat <strong>pēdējai<\/strong> <code>&gt;<\/code>, tāpēc sakritība stiepjas pāri abiem iekavu pāriem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai padarītu kvantoru <em>taupīgu<\/em> (saukts arī par <em>slinku<\/em> vai <em>nerijīgu<\/em>), aiz tā pievienojiet <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Taupīgs kvantors piemeklē tik <strong>maz<\/strong>, cik iespējams:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad <code>.+?<\/code> apstājas pie <strong>pirmās<\/strong> <code>&gt;<\/code>, tāpēc sakrīt tikai pirmais iekavotais gabals.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Piedēklis <code>?<\/code> darbojas ar jebkuru kvantoru: arī <code>*?<\/code> un <code>**?<\/code> ir taupīgi.<\/span> <span class=\"sg\" data-s=\"1\">Rijīgās un taupīgās versijas piemeklē vienādas teksta klases — tās atšķiras tikai ar to, cik daudz paņem, kad ir izvēle.<\/span><\/p>"]]},"ru":{"t":"Жадное и экономное сопоставление","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию квантификатор <em>жаден<\/em>: он берёт столько, сколько может, лишь бы остальная часть шаблона всё же совпала.<\/span> <span class=\"sg\" data-s=\"1\">Рассмотрим сопоставление от первой <code>&lt;<\/code> до какой-нибудь <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.+<\/code> заглотил всё, что смог, вплоть до <strong>последней<\/strong> <code>&gt;<\/code>, поэтому совпадение растянулось на обе пары скобок.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы сделать квантификатор <em>экономным<\/em> (его называют также <em>ленивым<\/em> или <em>нежадным<\/em>), добавьте после него <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Экономный квантификатор берёт <strong>как можно меньше<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь <code>.+?<\/code> останавливается на <strong>первой<\/strong> <code>&gt;<\/code>, поэтому совпадает только первый кусочек в скобках.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Суффикс <code>?<\/code> работает с любым квантификатором: <code>*?<\/code> и <code>**?<\/code> тоже экономные.<\/span> <span class=\"sg\" data-s=\"1\">Жадный и экономный варианты сопоставляют один и тот же род текста — они различаются лишь тем, сколько берут, когда есть выбор.<\/span><\/p>"]]},"uk":{"t":"Жадібне та бережливе зіставлення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням квантифікатор є <em>жадібним<\/em>: він зіставляється з якнайбільшим шматком, який усе ще дозволяє решті шаблону вдатися.<\/span> <span class=\"sg\" data-s=\"1\">Розгляньмо зіставлення від першого <code>&lt;<\/code> до <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.+<\/code> проковтнув усе, що зміг, аж до <strong>останнього<\/strong> <code>&gt;<\/code>, тож збіг простягається через обидві пари дужок.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб зробити квантифікатор <em>бережливим<\/em> (його також називають <em>лінивим<\/em> чи <em>нежадібним<\/em>), додайте після нього <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Бережливий квантифікатор зіставляється з <strong>якнайменшим<\/strong> шматком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер <code>.+?<\/code> зупиняється на <strong>першому<\/strong> <code>&gt;<\/code>, тож збігається лише перша частина в дужках.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Суфікс <code>?<\/code> працює з будь-яким квантифікатором: <code>*?<\/code> та <code>**?<\/code> теж бережливі.<\/span> <span class=\"sg\" data-s=\"1\">Жадібна й бережлива версії зіставляються з тими самими різновидами тексту — вони різняться лише тим, скільки беруть, коли є вибір.<\/span><\/p>"]]},"bg":{"t":"Лакомо и пестеливо съпоставяне","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране квантификаторът е <em>лаком<\/em>: той съпоставя колкото може повече, но така, че останалата част от шаблона все пак да успее.<\/span> <span class=\"sg\" data-s=\"1\">Помислете за съпоставяне от първото <code>&lt;<\/code> до някое <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.+<\/code> погълна колкото можа, чак до <strong>последното<\/strong> <code>&gt;<\/code>, така че съвпадението обхваща и двете двойки скоби.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да направите квантификатора <em>пестелив<\/em> (наричан още <em>мързелив<\/em> или <em>нелаком<\/em>), добавете <code>?<\/code> след него.<\/span> <span class=\"sg\" data-s=\"1\">Пестеливият квантификатор съпоставя възможно <strong>най-малко<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега <code>.+?<\/code> спира на <strong>първото<\/strong> <code>&gt;<\/code>, така че съвпада само първото парче в скоби.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наставката <code>?<\/code> работи с всеки квантификатор: <code>*?<\/code> и <code>**?<\/code> също са пестеливи.<\/span> <span class=\"sg\" data-s=\"1\">Лакомите и пестеливите версии съпоставят едни и същи видове текст — те се различават само по това колко вземат, когато има избор.<\/span><\/p>"]]},"eo":{"t":"Avida kaj ŝparema kongruigo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, kvantoro estas <em>avida<\/em>: ĝi kongruas kun tiom, kiom ĝi eble povas, dum ĝi ankoraŭ lasas la reston de la ŝablono sukcesi.<\/span> <span class=\"sg\" data-s=\"1\">Konsideru kongruigon de la unua <code>&lt;<\/code> ĝis <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>.+<\/code> englutis tiom, kiom ĝi povis, ĝis la <strong>lasta<\/strong> <code>&gt;<\/code>, do la kongruo etendiĝas trans ambaŭ parojn de krampoj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por fari kvantoron <em>ŝparema<\/em> (ankaŭ nomata <em>maldiligenta<\/em> aŭ <em>neavida<\/em>), aldonu <code>?<\/code> post ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Ŝparema kvantoro kongruas kun kiel eble plej <strong>malmulte<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun <code>.+?<\/code> haltas ĉe la <strong>unua<\/strong> <code>&gt;<\/code>, do nur la unua enkrampa peco kongruas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sufikso <code>?<\/code> funkcias sur ĉiu kvantoro: <code>*?<\/code> kaj <code>**?<\/code> ankaŭ estas ŝparemaj.<\/span> <span class=\"sg\" data-s=\"1\">Avidaj kaj ŝparemaj versioj kongruas kun la samaj specoj de teksto — ili diferencas nur en tio, kiom ili prenas, kiam estas elekto.<\/span><\/p>"]]},"la":{"t":"Congruentia avida et frugalis","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ex more quantificator <em>avidus<\/em> est: tantum congruit quantum omnino potest dum reliquum exemplaris adhuc succedere sinit.<\/span> <span class=\"sg\" data-s=\"1\">Considera congruentiam a prima <code>&lt;<\/code> ad aliquam <code>&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+ '&gt;' /; # ｢&lt;a&gt;&lt;b&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.+<\/code> tantum devoravit quantum potuit, usque ad <strong>ultimam<\/strong> <code>&gt;<\/code>, itaque congruentia per utrumque uncorum par currit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut quantificatorem <em>frugalem<\/em> reddas (etiam <em>pigrum<\/em> vel <em>non avidum<\/em> appellatum), adde <code>?<\/code> post eum.<\/span> <span class=\"sg\" data-s=\"1\">Quantificator frugalis <strong>quam minimum<\/strong> congruit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '&lt;a&gt;&lt;b&gt;' ~~ / '&lt;' .+? '&gt;' /; # ｢&lt;a&gt;｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc <code>.+?<\/code> ad <strong>primam<\/strong> <code>&gt;<\/code> consistit, itaque sola prima pars uncis inclusa congruit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Suffixum <code>?<\/code> in quolibet quantificatore operatur: <code>*?<\/code> et <code>**?<\/code> quoque frugales sunt.<\/span> <span class=\"sg\" data-s=\"1\">Versiones avidae et frugales eadem genera textus congruunt — differunt solum quantum capiant cum electio est.<\/span><\/p>"]]}}}</script>
