<script type="application/json" id="page-data">{"u":"regexes/assertions/lookahead","n":1051,"k":"topic","pv":"regexes/assertions","nx":"regexes/assertions/lookahead/quiz","tr":["regexes","regexes/assertions"],"L":{"en":{"t":"Lookahead","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>lookahead<\/em> checks what comes immediately <strong>after<\/strong> the current position.<\/span> <span class=\"sg\" data-s=\"1\">It is written inside angle brackets:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — succeeds if the text ahead matches (positive lookahead)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — succeeds if the text ahead does <strong>not<\/strong> match (negative lookahead)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The assertion itself matches no characters; it only tests the position.<\/span> <span class=\"sg\" data-s=\"1\">For example, match a number only when it is followed by the word <code>dollars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The match is just <code>100<\/code> — the text <code> dollars<\/code> was checked but not included.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because the lookahead only asserts what follows, the same number matches or not depending on the currency after it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The digits are identical in both strings, but the assertion accepts <code>100<\/code> only when <code> euro<\/code> comes next.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The negative form is useful for “… but not when followed by …”.<\/span> <span class=\"sg\" data-s=\"1\">Match <code>cat<\/code> only when it is <strong>not<\/strong> followed by a digit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>cat5<\/code> the lookahead sees a digit right after <code>cat<\/code>, so the negative assertion fails and the whole match fails.<\/span><\/p>"]]},"de":{"t":"Lookahead","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Lookahead<\/em> prüft, was unmittelbar <strong>nach<\/strong> der aktuellen Position kommt.<\/span> <span class=\"sg\" data-s=\"1\">Er wird in spitzen Klammern geschrieben:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — gelingt, wenn der Text danach trifft (bejahender Lookahead)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — gelingt, wenn der Text danach <strong>nicht<\/strong> trifft (verneinender Lookahead)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Zusicherung selbst trifft keine Zeichen; sie prüft nur die Position.<\/span> <span class=\"sg\" data-s=\"1\">Treffen Sie etwa eine Zahl nur dann, wenn ihr das Wort <code>dollars<\/code> folgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Treffer ist nur <code>100<\/code> — der Text <code> dollars<\/code> wurde geprüft, aber nicht mit aufgenommen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da der Lookahead nur behauptet, was folgt, trifft dieselbe Zahl je nach der Währung dahinter oder eben nicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ziffern sind in beiden Zeichenketten gleich, doch die Zusicherung nimmt <code>100<\/code> nur an, wenn <code> euro<\/code> folgt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die verneinende Form ist nützlich für „… aber nicht, wenn darauf … folgt“.<\/span> <span class=\"sg\" data-s=\"1\">Treffen Sie <code>cat<\/code> nur dann, wenn <strong>keine<\/strong> Ziffer folgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>cat5<\/code> sieht der Lookahead direkt hinter <code>cat<\/code> eine Ziffer, die verneinende Zusicherung scheitert also, und damit scheitert der ganze Treffer.<\/span><\/p>"]]},"nl":{"t":"Lookahead","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>lookahead<\/em> controleert wat er onmiddellijk <strong>na<\/strong> de huidige positie komt.<\/span> <span class=\"sg\" data-s=\"1\">Hij wordt tussen punthaken geschreven:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — slaagt als de tekst erna matcht (positieve lookahead)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — slaagt als de tekst erna <strong>niet<\/strong> matcht (negatieve lookahead)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De assertion zelf matcht geen tekens; hij test alleen de positie.<\/span> <span class=\"sg\" data-s=\"1\">Match bijvoorbeeld een getal alleen wanneer het door het woord <code>dollars<\/code> gevolgd wordt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De match is alleen <code>100<\/code> — de tekst <code> dollars<\/code> werd gecontroleerd maar niet meegenomen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat de lookahead alleen beweert wat erna komt, matcht hetzelfde getal wel of niet, afhankelijk van de valuta erachter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De cijfers zijn in beide strings identiek, maar de assertion aanvaardt <code>100<\/code> alleen wanneer er <code> euro<\/code> op volgt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De negatieve vorm is nuttig voor \"… maar niet wanneer erop volgt …\".<\/span> <span class=\"sg\" data-s=\"1\">Match <code>cat<\/code> alleen wanneer er <strong>geen<\/strong> cijfer op volgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>cat5<\/code> ziet de lookahead vlak achter <code>cat<\/code> een cijfer, dus mislukt de negatieve assertion en mislukt de hele match.<\/span><\/p>"]]},"es":{"t":"Lookahead","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>lookahead<\/em> comprueba lo que viene inmediatamente <strong>después<\/strong> de la posición actual.<\/span> <span class=\"sg\" data-s=\"1\">Se escribe entre corchetes angulares:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — funciona si el texto que sigue coincide (lookahead positivo)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — funciona si el texto que sigue <strong>no<\/strong> coincide (lookahead negativo)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La aserción en sí no empareja ningún carácter; solo comprueba la posición.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, empareja un número solo cuando le siga la palabra <code>dollars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La coincidencia es solo <code>100<\/code>: el texto <code> dollars<\/code> se comprobó pero no se incluyó.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como el lookahead solo afirma lo que sigue, el mismo número coincide o no según la moneda que venga detrás:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los dígitos son idénticos en ambas cadenas, pero la aserción acepta <code>100<\/code> solo cuando le sigue <code> euro<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma negativa resulta útil para «… pero no cuando le sigue …».<\/span> <span class=\"sg\" data-s=\"1\">Empareja <code>cat<\/code> solo cuando <strong>no<\/strong> le siga un dígito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>cat5<\/code> el lookahead ve un dígito justo detrás de <code>cat<\/code>, así que la aserción negativa falla y falla toda la coincidencia.<\/span><\/p>"]]},"it":{"t":"Lookahead","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>lookahead<\/em> controlla ciò che viene immediatamente <strong>dopo<\/strong> la posizione corrente.<\/span> <span class=\"sg\" data-s=\"1\">Si scrive fra parentesi angolari:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — riesce se il testo che segue corrisponde (lookahead positivo)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — riesce se il testo che segue <strong>non<\/strong> corrisponde (lookahead negativo)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'asserzione in sé non riconosce alcun carattere; mette alla prova solo la posizione.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, riconosci un numero solo quando è seguito dalla parola <code>dollars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La corrispondenza è solo <code>100<\/code> — il testo <code> dollars<\/code> è stato controllato ma non incluso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché il lookahead asserisce solo ciò che segue, lo stesso numero corrisponde o no a seconda della valuta che gli sta dopo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le cifre sono identiche in entrambe le stringhe, ma l'asserzione accetta <code>100<\/code> solo quando segue <code> euro<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma negativa è utile per «… ma non quando è seguito da …».<\/span> <span class=\"sg\" data-s=\"1\">Riconosci <code>cat<\/code> solo quando <strong>non<\/strong> è seguito da una cifra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>cat5<\/code> il lookahead vede una cifra subito dopo <code>cat<\/code>, quindi l'asserzione negativa fallisce e fallisce l'intera corrispondenza.<\/span><\/p>"]]},"ru":{"t":"Просмотр вперёд","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Просмотр вперёд<\/em> проверяет, что идёт сразу <strong>после<\/strong> текущей позиции.<\/span> <span class=\"sg\" data-s=\"1\">Записывается он в угловых скобках:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — срабатывает, если текст впереди совпадает (положительный просмотр вперёд)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — срабатывает, если текст впереди <strong>не<\/strong> совпадает (отрицательный просмотр вперёд)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Само утверждение не сопоставляет ни одного символа; оно лишь проверяет позицию.<\/span> <span class=\"sg\" data-s=\"1\">Например, сопоставим число только тогда, когда за ним следует слово <code>dollars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Совпадение — только <code>100<\/code>: текст <code> dollars<\/code> был проверен, но не включён.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку просмотр вперёд лишь утверждает, что идёт следом, одно и то же число совпадает или нет в зависимости от валюты после него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цифры в обеих строках одинаковые, но утверждение принимает <code>100<\/code> только тогда, когда следом идёт <code> euro<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отрицательная форма полезна для случаев «… но не тогда, когда следом идёт …».<\/span> <span class=\"sg\" data-s=\"1\">Сопоставим <code>cat<\/code> только если за ним <strong>не<\/strong> следует цифра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В <code>cat5<\/code> просмотр вперёд видит цифру сразу после <code>cat<\/code>, поэтому отрицательное утверждение не срабатывает и всё сопоставление проваливается.<\/span><\/p>"]]},"uk":{"t":"Огляд уперед","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Огляд уперед<\/em> перевіряє, що йде безпосередньо <strong>після<\/strong> поточної позиції.<\/span> <span class=\"sg\" data-s=\"1\">Записують його в кутових дужках:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — успішний, якщо текст попереду збігається (стверджувальний огляд уперед)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — успішний, якщо текст попереду <strong>не<\/strong> збігається (заперечний огляд уперед)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме твердження не зіставляється з жодним символом; воно лише перевіряє позицію.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, зіставимо число лише тоді, коли за ним іде слово <code>dollars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Збігом є тільки <code>100<\/code> — текст <code> dollars<\/code> перевірено, але не включено.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки огляд уперед лише стверджує, що йде далі, те саме число збігається або ні залежно від валюти після нього:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цифри в обох рядках однакові, але твердження приймає <code>100<\/code> лише тоді, коли далі йде <code> euro<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Заперечна форма стає в пригоді для «… але не тоді, коли далі йде …».<\/span> <span class=\"sg\" data-s=\"1\">Зіставимо <code>cat<\/code> лише тоді, коли за ним <strong>не<\/strong> йде цифра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У <code>cat5<\/code> огляд уперед бачить цифру одразу після <code>cat<\/code>, тож заперечне твердження зазнає невдачі, і весь збіг не відбувається.<\/span><\/p>"]]},"bg":{"t":"Поглед напред","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Погледът напред<\/em> проверява какво идва непосредствено <strong>след<\/strong> текущата позиция.<\/span> <span class=\"sg\" data-s=\"1\">Записва се в ъглови скоби:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?before …&gt;<\/code> — успява, ако текстът напред съвпада (положителен поглед напред)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!before …&gt;<\/code> — успява, ако текстът напред <strong>не<\/strong> съвпада (отрицателен поглед напред)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Самото твърдение не съпоставя нито един знак; то само проверява позицията.<\/span> <span class=\"sg\" data-s=\"1\">Например съпоставете число само когато след него следва думата <code>dollars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '100 dollars' ~~ / \\d+ &lt;?before ' dollars'&gt; /; # ｢100｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съвпадението е само <code>100<\/code> — текстът <code> dollars<\/code> е проверен, но не е включен.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Понеже погледът напред само твърди какво следва, едно и също число съвпада или не в зависимост от валутата след него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '100 euro'    ~~ / \\d+ &lt;?before ' euro'&gt; /; # True\nsay so '100 dollars' ~~ / \\d+ &lt;?before ' euro'&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цифрите в двата низа са еднакви, но твърдението приема <code>100<\/code> само когато след него идва <code> euro<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отрицателната форма е полезна за „… но не когато след него следва …“.<\/span> <span class=\"sg\" data-s=\"1\">Съпоставете <code>cat<\/code> само когато след него <strong>не<\/strong> следва цифра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'cats' ~~ / cat &lt;!before \\d&gt; /; # True\nsay so 'cat5' ~~ / cat &lt;!before \\d&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В <code>cat5<\/code> погледът напред вижда цифра веднага след <code>cat<\/code>, така че отрицателното твърдение се проваля и цялото съвпадение се проваля.<\/span><\/p>"]]}}}</script>
