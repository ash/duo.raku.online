span class=\"sg\" data-s=\"0\">Dit is een geval waarin een lookahead zijn nut bewijst: \"niet gevolgd door een decimale punt\" kun je niet met een gewone capturende groep uitdrukken, omdat er niets is om te capturen — alleen een voorwaarde om te controleren.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Entre corchetes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '$50' ~~ / &lt;?after '$'&gt; \\d+ &gt;&gt; &lt;!before '.'&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/assertions/whole-dollar.raku\" target=\"_blank\" rel=\"noopener\">whole-dollar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>｢50｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after '$'&gt;<\/code> es un lookbehind positivo — exige un <code>$<\/code> justo antes del número — y <code>&lt;!before '.'&gt;<\/code> es un lookahead negativo — exige que <strong>no<\/strong> siga un <code>.<\/code>. Ni el <code>$<\/code> ni el entorno pasan a formar parte de la coincidencia, así que el resultado es solo <code>50<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>&gt;&gt;<\/code> es un límite de palabra que marca el final del número. Sin él, el voraz <code>\\d+<\/code> podría retroceder: en <code>$39.99<\/code> cedería el <code>9<\/code> y emparejaría <code>3<\/code> (al que no le sigue <code>.<\/code>). <code>&gt;&gt;<\/code> obliga a tomar el número entero, así que <code>$3.99<\/code> y <code>$39.99<\/code> no emparejan nada, como debe ser.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Este es un caso donde un lookahead se gana el sueldo: no puedes expresar «no seguido por un punto decimal» con un grupo de captura ordinario, porque ahí no hay nada que capturar, solo una condición que comprobar.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Fra parentesi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '$50' ~~ / &lt;?after '$'&gt; \\d+ &gt;&gt; &lt;!before '.'&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/assertions/whole-dollar.raku\" target=\"_blank\" rel=\"noopener\">whole-dollar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢50｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after '$'&gt;<\/code> è un lookbehind positivo — richiede un <code>$<\/code> subito prima del numero — e <code>&lt;!before '.'&gt;<\/code> è un lookahead negativo — richiede che <strong>non<\/strong> segua un <code>.<\/code>. Né il <code>$<\/code> né i dintorni entrano a far parte della corrispondenza, quindi il risultato è solo <code>50<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il <code>&gt;&gt;<\/code> è un confine di parola che segna la fine del numero. Senza di esso il goloso <code>\\d+<\/code> potrebbe tornare sui suoi passi: su <code>$39.99<\/code> rinuncerebbe al <code>9<\/code> e riconoscerebbe <code>3<\/code> (che non è seguito da <code>.<\/code>). <code>&gt;&gt;<\/code> costringe a prendere tutto il numero, così <code>$3.99<\/code> e <code>$39.99<\/code> correttamente non corrispondono a nulla.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questo è un caso in cui un lookahead si guadagna il pane: non puoi esprimere «non seguito da un punto decimale» con un gruppo di cattura ordinario, perché lì non c'è nulla da catturare — solo una condizione da controllare.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Starp iekavām","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '$50' ~~ / &lt;?after '$'&gt; \\d+ &gt;&gt; &lt;!before '.'&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/assertions/whole-dollar.raku\" target=\"_blank\" rel=\"noopener\">whole-dollar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>｢50｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after '$'&gt;<\/code> ir pozitīva lūkošanās atpakaļ — tā pieprasa <code>$<\/code> tieši pirms skaitļa —, bet <code>&lt;!before '.'&gt;<\/code> ir negatīva lūkošanās uz priekšu — tā pieprasa, lai <code>.<\/code> <strong>neseko<\/strong>. Ne <code>$<\/code>, ne apkārtne nekļūst par sakritības daļu, tāpēc rezultāts ir tikai <code>50<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;<\/code> ir vārda robeža, kas iezīmē skaitļa beigas. Bez tās rijīgais <code>\\d+<\/code> varētu atkāpties: virknē <code>$39.99<\/code> tas atdotu <code>9<\/code> un sakritinātu <code>3<\/code> (kam <code>.<\/code> neseko). <code>&gt;&gt;<\/code> piespiež paņemt visu skaitli, tāpēc <code>$3.99<\/code> un <code>$39.99<\/code> pareizi nesakrīt ne ar ko.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šis ir gadījums, kur lūkošanās uz priekšu atmaksājas: «kam neseko decimālpunkts» nevar izteikt ar parastu tverošu grupu, jo tur nav nekā, ko tvert, — ir tikai nosacījums, ko pārbaudīt.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Между скобками","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '$50' ~~ / &lt;?after '$'&gt; \\d+ &gt;&gt; &lt;!before '.'&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/assertions/whole-dollar.raku\" target=\"_blank\" rel=\"noopener\">whole-dollar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>｢50｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after '$'&gt;<\/code> — положительный просмотр назад: он требует, чтобы прямо перед числом стоял <code>$<\/code>. А <code>&lt;!before '.'&gt;<\/code> — отрицательный просмотр вперёд: он требует, чтобы точка следом <strong>не<\/strong> шла. Ни знак <code>$<\/code>, ни окружение частью совпадения не становятся, поэтому результат — просто <code>50<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;<\/code> — граница слова, отмечающая конец числа. Без неё жадный <code>\\d+<\/code> мог бы отступить назад: в строке <code>$39.99<\/code> он отдал бы <code>9<\/code> и сопоставил бы <code>3<\/code>, за которой точки нет. <code>&gt;&gt;<\/code> заставляет брать число целиком, поэтому <code>$3.99<\/code> и <code>$39.99<\/code> правильно не дают совпадения.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Это как раз тот случай, где просмотр вперёд себя оправдывает: «за этим не следует десятичная точка» нельзя выразить обычной захватывающей группой, потому что захватывать там нечего — есть лишь условие, которое нужно проверить.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Сума в цілих доларах»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '$50' ~~ / &lt;?after '$'&gt; \\d+ &gt;&gt; &lt;!before '.'&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/assertions/whole-dollar.raku\" target=\"_blank\" rel=\"noopener\">whole-dollar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>｢50｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after '$'&gt;<\/code> — це стверджувальний огляд назад: він вимагає <code>$<\/code> безпосередньо перед числом, — а <code>&lt;!before '.'&gt;<\/code> — заперечний огляд уперед: він вимагає, щоб далі <strong>не<\/strong> йшла <code>.<\/code>. Ані <code>$<\/code>, ані оточення не стають частиною збігу, тож результатом є просто <code>50<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;<\/code> — це межа слова, що позначає кінець числа. Без неї жадібний <code>\\d+<\/code> міг би відкотитися: на <code>$39.99<\/code> він віддав би <code>9<\/code> і зіставився б із <code>3<\/code> (за яким <code>.<\/code> не йде). <code>&gt;&gt;<\/code> змушує взяти все число, тож <code>$3.99<\/code> та <code>$39.99<\/code> правильно не дають збігу.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це той випадок, коли огляд уперед відпрацьовує свій хліб: «за яким не йде десяткова крапка» неможливо виразити звичайною групою захоплення, бо там немає чого захоплювати — є лише умова, яку слід перевірити.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Сума в цели долари","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say '$50' ~~ / &lt;?after '$'&gt; \\d+ &gt;&gt; &lt;!before '.'&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/assertions/whole-dollar.raku\" target=\"_blank\" rel=\"noopener\">whole-dollar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>｢50｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after '$'&gt;<\/code> е положителен поглед назад — той изисква <code>$<\/code> непосредствено преди числото, — а <code>&lt;!before '.'&gt;<\/code> е отрицателен поглед напред: той изисква след него да <strong>не<\/strong> следва <code>.<\/code>. Нито <code>$<\/code>, нито околността стават част от съвпадението, така че резултатът е само <code>50<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;<\/code> е граница на дума, отбелязваща края на числото. Без нея лакомият <code>\\d+<\/code> би могъл да се върне назад: при <code>$39.99<\/code> той би отстъпил <code>9<\/code> и би съпоставил <code>3<\/code> (след което <code>.<\/code> не следва). <code>&gt;&gt;<\/code> принуждава да се вземе цялото число, така че <code>$3.99<\/code> и <code>$39.99<\/code> правилно не дават съвпадение.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е случаят, в който погледът напред си заслужава хляба: „след което не следва десетична точка“ е невъзможно да се изрази с обикновена група за прихващане, защото там няма какво да се прихване — има само условие за проверка.<\/span><\/li><\/ol>"]]}}}</script>
