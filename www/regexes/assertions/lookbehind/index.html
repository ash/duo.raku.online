Position kommt:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — gelingt, wenn der Text davor trifft (bejahender Lookbehind)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — gelingt, wenn der Text davor <strong>nicht<\/strong> trifft (verneinender Lookbehind)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Damit können Sie etwas nur wegen dessen treffen, was ihm vorausgeht, ohne dieses Präfix ins Ergebnis aufzunehmen.<\/span> <span class=\"sg\" data-s=\"1\">Fangen Sie etwa die Ziffern hinter einem Dollarzeichen ein, aber lassen Sie das <code>$<\/code> außerhalb des Treffers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Zusicherung <code>&lt;?after '$'&gt;<\/code> verlangt ein <code>$<\/code> unmittelbar vor der aktuellen Position, dann trifft <code>\\d+<\/code> die Ziffern.<\/span> <span class=\"sg\" data-s=\"1\">Der Treffer ist <code>100<\/code>, ohne das Dollarzeichen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lookahead und Lookbehind werden oft verbunden.<\/span> <span class=\"sg\" data-s=\"1\">Ein Stück Text, umgeben von <code>&lt;?after …&gt;<\/code> und <code>&lt;?before …&gt;<\/code>, trifft nur dann, wenn es zwischen den verlangten Nachbarn steht — ein praktischer Weg, einen Wert aus einem bekannten Zusammenhang zu ziehen.<\/span><\/p>"]]},"nl":{"t":"Lookbehind","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <em>lookbehind<\/em> controleert wat er onmiddellijk <strong>vóór<\/strong> de huidige positie komt:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — slaagt als de tekst ervoor matcht (positieve lookbehind)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — slaagt als de tekst ervoor <strong>niet<\/strong> matcht (negatieve lookbehind)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zo kun je iets matchen alleen vanwege wat eraan voorafgaat, zonder dat voorvoegsel in het resultaat op te nemen.<\/span> <span class=\"sg\" data-s=\"1\">Vang bijvoorbeeld de cijfers die op een dollarteken volgen, maar laat de <code>$<\/code> buiten de match:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De assertion <code>&lt;?after '$'&gt;<\/code> eist een <code>$<\/code> vlak vóór de huidige positie, waarna <code>\\d+<\/code> de cijfers matcht.<\/span> <span class=\"sg\" data-s=\"1\">De match is <code>100<\/code>, zonder het dollarteken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lookahead en lookbehind worden vaak gecombineerd.<\/span> <span class=\"sg\" data-s=\"1\">Een stuk tekst omgeven door <code>&lt;?after …&gt;<\/code> en <code>&lt;?before …&gt;<\/code> matcht alleen wanneer het tussen de vereiste buren staat — een handige manier om een waarde uit een bekende context te halen.<\/span><\/p>"]]},"es":{"t":"Lookbehind","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <em>lookbehind<\/em> comprueba lo que viene inmediatamente <strong>antes<\/strong> de la posición actual:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — funciona si el texto anterior coincide (lookbehind positivo)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — funciona si el texto anterior <strong>no<\/strong> coincide (lookbehind negativo)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto te permite emparejar algo solo por lo que lo precede, sin incluir ese prefijo en el resultado.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, captura los dígitos que siguen a un signo de dólar dejando el <code>$<\/code> fuera de la coincidencia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La aserción <code>&lt;?after '$'&gt;<\/code> exige un <code>$<\/code> justo antes de la posición actual, y después <code>\\d+<\/code> empareja los dígitos.<\/span> <span class=\"sg\" data-s=\"1\">La coincidencia es <code>100<\/code>, sin el signo de dólar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El lookahead y el lookbehind se combinan a menudo.<\/span> <span class=\"sg\" data-s=\"1\">Un fragmento de texto envuelto en <code>&lt;?after …&gt;<\/code> y <code>&lt;?before …&gt;<\/code> coincide solo cuando está entre los vecinos exigidos, una forma cómoda de extraer un valor de un contexto conocido.<\/span><\/p>"]]},"it":{"t":"Lookbehind","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <em>lookbehind<\/em> controlla ciò che viene immediatamente <strong>prima<\/strong> della posizione corrente:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — riesce se il testo che precede corrisponde (lookbehind positivo)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — riesce se il testo che precede <strong>non<\/strong> corrisponde (lookbehind negativo)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo ti permette di riconoscere qualcosa solo per via di ciò che lo precede, senza includere quel prefisso nel risultato.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, cattura le cifre che seguono un segno di dollaro, ma lascia il <code>$<\/code> fuori dalla corrispondenza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'asserzione <code>&lt;?after '$'&gt;<\/code> richiede un <code>$<\/code> subito prima della posizione corrente, poi <code>\\d+<\/code> riconosce le cifre.<\/span> <span class=\"sg\" data-s=\"1\">La corrispondenza è <code>100<\/code>, senza il segno di dollaro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lookahead e lookbehind si combinano spesso.<\/span> <span class=\"sg\" data-s=\"1\">Un pezzo di testo avvolto in <code>&lt;?after …&gt;<\/code> e <code>&lt;?before …&gt;<\/code> corrisponde solo quando sta fra i vicini richiesti — un modo comodo di estrarre un valore da un contesto noto.<\/span><\/p>"]]},"ru":{"t":"Просмотр назад","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Просмотр назад<\/em> проверяет, что идёт непосредственно <strong>перед<\/strong> текущей позицией:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — срабатывает, если текст позади совпадает (положительный просмотр назад)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — срабатывает, если текст позади <strong>не<\/strong> совпадает (отрицательный просмотр назад)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это позволяет сопоставить что-то только из-за того, что ему предшествует, не включая этот префикс в результат.<\/span> <span class=\"sg\" data-s=\"1\">Например, захватим цифры, следующие за знаком доллара, оставив сам <code>$<\/code> вне совпадения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Утверждение <code>&lt;?after '$'&gt;<\/code> требует, чтобы прямо перед текущей позицией стоял <code>$<\/code>, а затем <code>\\d+<\/code> сопоставляет цифры.<\/span> <span class=\"sg\" data-s=\"1\">Совпадение — <code>100<\/code>, без знака доллара.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Просмотр вперёд и назад часто сочетают.<\/span> <span class=\"sg\" data-s=\"1\">Кусочек текста, обёрнутый в <code>&lt;?after …&gt;<\/code> и <code>&lt;?before …&gt;<\/code>, совпадает только тогда, когда стоит между нужными соседями, — удобный способ извлечь значение из известного контекста.<\/span><\/p>"]]},"uk":{"t":"Огляд назад","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Огляд назад<\/em> перевіряє, що стоїть безпосередньо <strong>перед<\/strong> поточною позицією:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — успішний, якщо текст позаду збігається (стверджувальний огляд назад)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — успішний, якщо текст позаду <strong>не<\/strong> збігається (заперечний огляд назад)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це дозволяє зіставити щось лише через те, що йому передує, не включаючи цей префікс у результат.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, захопимо цифри, що йдуть після знака долара, залишивши <code>$<\/code> поза збігом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Твердження <code>&lt;?after '$'&gt;<\/code> вимагає, щоб просто перед поточною позицією стояв <code>$<\/code>, а потім <code>\\d+<\/code> зіставляється з цифрами.<\/span> <span class=\"sg\" data-s=\"1\">Збігом є <code>100<\/code>, без знака долара.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Огляд уперед і огляд назад часто поєднують.<\/span> <span class=\"sg\" data-s=\"1\">Шматок тексту, обгорнутий у <code>&lt;?after …&gt;<\/code> та <code>&lt;?before …&gt;<\/code>, збігається лише тоді, коли стоїть між потрібними сусідами, — зручний спосіб видобути значення з відомого контексту.<\/span><\/p>"]]},"bg":{"t":"Поглед назад","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Погледът назад<\/em> проверява какво стои непосредствено <strong>преди<\/strong> текущата позиция:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;?after …&gt;<\/code> — успява, ако текстът назад съвпада (положителен поглед назад)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&lt;!after …&gt;<\/code> — успява, ако текстът назад <strong>не<\/strong> съвпада (отрицателен поглед назад)<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това ви позволява да съпоставите нещо само заради онова, което го предхожда, без този префикс да влиза в резултата.<\/span> <span class=\"sg\" data-s=\"1\">Например прихванете цифрите, които следват знака за долар, но оставете <code>$<\/code> извън съвпадението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if '$100' ~~ / &lt;?after '$'&gt; \\d+ / {\n    say $/; # ｢100｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Твърдението <code>&lt;?after '$'&gt;<\/code> изисква <code>$<\/code> непосредствено преди текущата позиция, а после <code>\\d+<\/code> съпоставя цифрите.<\/span> <span class=\"sg\" data-s=\"1\">Съвпадението е <code>100<\/code>, без знака за долар.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Погледът напред и погледът назад често се комбинират.<\/span> <span class=\"sg\" data-s=\"1\">Парче текст, обвито в <code>&lt;?after …&gt;<\/code> и <code>&lt;?before …&gt;<\/code>, съвпада само когато стои между изискваните съседи — удобен начин да извлечете стойност от познат контекст.<\/span><\/p>"]]}}}</script>
