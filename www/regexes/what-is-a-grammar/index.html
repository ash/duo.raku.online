<script type="application/json" id="page-data">{"u":"regexes/what-is-a-grammar","n":1091,"k":"section","pv":"regexes/substitution/exercises/mask-digits/solution","nx":"regexes/what-is-a-grammar/named-regexes","tr":["regexes"],"L":{"en":{"t":"What is a grammar","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A single regex is good at recognising one kind of text.<\/span> <span class=\"sg\" data-s=\"1\">But real data — a date, an e-mail address, a whole configuration file — has structure made of many smaller pieces.<\/span> <span class=\"sg\" data-s=\"2\">A <em>grammar<\/em> is a way to give names to those pieces and combine them into one description.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Before the grammar itself, this section introduces the building block it is made of: the <em>named regex<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Once you can name a pattern and reuse it, you are ready for the grammar — the next level up.<\/span> <span class=\"sg\" data-s=\"2\">A grammar is more than a tidy collection of named patterns: it binds them into a single, named unit that describes a whole structured format.<\/span> <span class=\"sg\" data-s=\"3\">That is the new quality it brings to regexes — the power to <em>parse<\/em> a thing as a whole, not merely match one piece of it.<\/span><\/p>"]]},"de":{"t":"Was ist eine Grammatik","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein einzelner Regex ist gut darin, eine Art von Text zu erkennen.<\/span> <span class=\"sg\" data-s=\"1\">Doch echte Daten — ein Datum, eine E-Mail-Adresse, eine ganze Konfigurationsdatei — haben einen Aufbau aus vielen kleineren Stücken.<\/span> <span class=\"sg\" data-s=\"2\">Eine <em>Grammatik<\/em> ist ein Weg, diesen Stücken Namen zu geben und sie zu einer Beschreibung zu verbinden.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vor der Grammatik selbst führt dieser Abschnitt den Baustein ein, aus dem sie besteht: den <em>benannten Regex<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sobald Sie ein Muster benennen und wiederverwenden können, sind Sie bereit für die Grammatik — die nächste Stufe.<\/span> <span class=\"sg\" data-s=\"2\">Eine Grammatik ist mehr als eine ordentliche Sammlung benannter Muster: Sie bindet sie zu einer einzigen, benannten Einheit zusammen, die ein ganzes strukturiertes Format beschreibt.<\/span> <span class=\"sg\" data-s=\"3\">Das ist die neue Eigenschaft, die sie den Regexes hinzufügt — die Fähigkeit, eine Sache als Ganzes zu <em>zerlegen<\/em> und nicht bloß ein Stück davon zu treffen.<\/span><\/p>"]]},"nl":{"t":"Wat is een grammatica","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén regex is goed in het herkennen van één soort tekst.<\/span> <span class=\"sg\" data-s=\"1\">Maar echte gegevens — een datum, een e-mailadres, een heel configuratiebestand — hebben een structuur die uit veel kleinere stukken bestaat.<\/span> <span class=\"sg\" data-s=\"2\">Een <em>grammatica<\/em> is een manier om die stukken namen te geven en ze tot één beschrijving te combineren.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vóór de grammatica zelf introduceert deze sectie de bouwsteen waaruit ze bestaat: de <em>benoemde regex<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Zodra je een patroon een naam kunt geven en het kunt hergebruiken, ben je klaar voor de grammatica — het niveau erboven.<\/span> <span class=\"sg\" data-s=\"2\">Een grammatica is meer dan een nette verzameling benoemde patronen: ze bindt ze tot één enkele, benoemde eenheid die een heel gestructureerd formaat beschrijft.<\/span> <span class=\"sg\" data-s=\"3\">Dat is de nieuwe kwaliteit die ze aan regexes toevoegt — het vermogen om een ding als geheel te <em>ontleden<\/em>, en niet slechts één stuk ervan te matchen.<\/span><\/p>"]]},"es":{"t":"Qué es una gramática","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un solo regex sirve bien para reconocer una clase de texto.<\/span> <span class=\"sg\" data-s=\"1\">Pero los datos reales — una fecha, una dirección de correo, un archivo de configuración entero — tienen una estructura hecha de muchas piezas más pequeñas.<\/span> <span class=\"sg\" data-s=\"2\">Una <em>gramática<\/em> es una forma de dar nombre a esas piezas y combinarlas en una sola descripción.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Antes de la gramática en sí, esta sección presenta el ladrillo del que está hecha: el <em>regex con nombre<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Una vez que sabes dar nombre a un patrón y reutilizarlo, estás listo para la gramática, el nivel siguiente.<\/span> <span class=\"sg\" data-s=\"2\">Una gramática es más que una colección ordenada de patrones con nombre: los une en una sola unidad con nombre que describe un formato estructurado completo.<\/span> <span class=\"sg\" data-s=\"3\">Esa es la cualidad nueva que aporta a los regex: la capacidad de <em>analizar<\/em> una cosa entera, y no solo emparejar una pieza de ella.<\/span><\/p>"]]},"it":{"t":"Che cos'è una grammatica","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un singolo regex è bravo a riconoscere un genere di testo.<\/span> <span class=\"sg\" data-s=\"1\">Ma i dati veri — una data, un indirizzo di posta elettronica, un intero file di configurazione — hanno una struttura fatta di molti pezzi più piccoli.<\/span> <span class=\"sg\" data-s=\"2\">Una <em>grammatica<\/em> è un modo di dare un nome a quei pezzi e di combinarli in un'unica descrizione.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Prima della grammatica in sé, questa sezione introduce il mattone di cui è fatta: il <em>regex con nome<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Una volta che sai dare un nome a uno schema e riusarlo, sei pronto per la grammatica — il livello successivo.<\/span> <span class=\"sg\" data-s=\"2\">Una grammatica è più di una collezione ordinata di schemi con nome: li lega in un'unica unità con un nome che descrive un intero formato strutturato.<\/span> <span class=\"sg\" data-s=\"3\">È questa la qualità nuova che porta ai regex — la capacità di <em>analizzare<\/em> una cosa nel suo insieme, non solo di riconoscerne un pezzo.<\/span><\/p>"]]},"ru":{"t":"Что такое грамматика","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Одно регулярное выражение хорошо распознаёт текст одного вида.<\/span> <span class=\"sg\" data-s=\"1\">Но у настоящих данных — даты, адреса электронной почты, целого конфигурационного файла — есть структура, составленная из множества меньших кусочков. <em>Грамматика<\/em> — это способ дать этим кусочкам имена и объединить их в одно описание.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прежде чем перейти к самой грамматике, в этом разделе вводится строительный блок, из которого она сложена, — <em>именованное регулярное выражение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Как только вы научитесь называть шаблон и использовать его повторно, вы будете готовы к грамматике, следующей ступени.<\/span> <span class=\"sg\" data-s=\"2\">Грамматика — это больше, чем аккуратное собрание именованных шаблонов: она связывает их в единое именованное целое, описывающее весь структурированный формат.<\/span> <span class=\"sg\" data-s=\"3\">В этом и состоит новое качество, которое она приносит регулярным выражениям: возможность <em>разобрать<\/em> вещь целиком, а не просто сопоставить один её кусочек.<\/span><\/p>"]]},"uk":{"t":"Що таке граматика","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окремий регекс добре розпізнає один різновид тексту.<\/span> <span class=\"sg\" data-s=\"1\">Але справжні дані — дата, адреса електронної пошти, цілий файл конфігурації — мають структуру, складену з багатьох дрібніших шматків. <em>Граматика<\/em> — це спосіб дати цим шматкам імена й поєднати їх в один опис.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перед самою граматикою цей розділ знайомить із будівельним блоком, з якого вона складається, — <em>іменованим регексом<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Щойно ви навчитеся давати шаблонові ім'я й повторно його використовувати, ви готові до граматики — наступного рівня.<\/span> <span class=\"sg\" data-s=\"2\">Граматика — це більше, ніж охайна добірка іменованих шаблонів: вона зв'язує їх в єдину іменовану одиницю, що описує цілий структурований формат.<\/span> <span class=\"sg\" data-s=\"3\">Саме цю нову якість вона привносить у регекси — здатність <em>розібрати<\/em> річ цілком, а не просто зіставитися з одним її шматком.<\/span><\/p>"]]},"bg":{"t":"Какво е граматика","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Един-единствен регулярен израз се справя добре с разпознаването на един вид текст.<\/span> <span class=\"sg\" data-s=\"1\">Но истинските данни — дата, адрес на електронна поща, цял конфигурационен файл — имат структура, съставена от много по-малки парчета. <em>Граматиката<\/em> е начин да дадете имена на тези парчета и да ги съчетаете в едно описание.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Преди самата граматика този раздел въвежда градивния блок, от който тя е направена: <em>именувания регулярен израз<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Щом веднъж можете да именувате шаблон и да го използвате повторно, вие сте готови за граматиката — следващото ниво нагоре.<\/span> <span class=\"sg\" data-s=\"2\">Граматиката е нещо повече от подредена сбирка от именувани шаблони: тя ги свързва в една-единствена именувана единица, която описва цял структуриран формат.<\/span> <span class=\"sg\" data-s=\"3\">Точно това е новото качество, което тя внася в регулярните изрази — силата да <em>разберете<\/em> нещо като цяло, а не просто да съпоставите едно негово парче.<\/span><\/p>"]]}}}</script>
