><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>｢2025｣\n｢06｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/regexes/what-is-a-grammar/exercises/year-token/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Год и месяц","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Объявите два именованных регулярных выражения: <code>year<\/code>, соответствующее ровно четырём цифрам, и <code>month<\/code>, соответствующее ровно двум.<\/span> <span class=\"sg\" data-s=\"1\">Используйте оба в одном шаблоне, чтобы сопоставить строку вроде <code>'2025-06'<\/code>, где год и месяц разделены дефисом.<\/span> <span class=\"sg\" data-s=\"2\">Напечатайте захваченные год и месяц, каждый на своей строке.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>｢2025｣\n｢06｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/regexes/what-is-a-grammar/exercises/year-token/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Рік і місяць»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оголосіть два іменовані регекси: <code>year<\/code>, що зіставляється рівно з чотирма цифрами, та <code>month<\/code>, що зіставляється рівно з двома цифрами.<\/span> <span class=\"sg\" data-s=\"1\">Використайте обидва в одному шаблоні, щоб зіставитися з рядком на кшталт <code>'2025-06'<\/code>, де рік і місяць розділені дефісом.<\/span> <span class=\"sg\" data-s=\"2\">Надрукуйте захоплені рік і місяць, кожен на своєм
