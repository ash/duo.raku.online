<script type="application/json" id="page-data">{"u":"regexes/what-is-a-grammar/named-regexes","n":1092,"k":"topic","pv":"regexes/what-is-a-grammar","nx":"regexes/what-is-a-grammar/named-regexes/quiz","tr":["regexes","regexes/what-is-a-grammar"],"L":{"en":{"t":"Named regexes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">So far you have written patterns directly inside <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can also give a pattern a <strong>name<\/strong> and reuse it, just like a subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Declare one with <code>my regex<\/code> (or <code>my token<\/code>, which you will meet properly soon):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To use a named regex inside another pattern, write its name in angle brackets, <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Calling <code>&lt;number&gt;<\/code> both matches the pattern <strong>and<\/strong> captures it under that name, so the matched text is available as <code>$&lt;number&gt;<\/code> — a named capture you get for free.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A named regex can be used several times in one pattern.<\/span> <span class=\"sg\" data-s=\"1\">When it appears more than once, the captures become a list, reached by index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Named regexes keep patterns readable and let you build larger ones out of smaller, well-named parts.<\/span> <span class=\"sg\" data-s=\"1\">That is exactly what a grammar does on a bigger scale.<\/span><\/p>"]]},"de":{"t":"Benannte Regexes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bisher haben Sie Muster unmittelbar innerhalb von <code>/ … /<\/code> geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Sie können einem Muster auch einen <strong>Namen<\/strong> geben und es wiederverwenden, genau wie eine Subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Deklarieren Sie eines mit <code>my regex<\/code> (oder <code>my token<\/code>, das Sie gleich richtig kennenlernen):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um einen benannten Regex in einem anderen Muster zu verwenden, schreiben Sie seinen Namen in spitzen Klammern, <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;number&gt;<\/code> aufzurufen trifft das Muster <strong>und<\/strong> capturt es unter diesem Namen, der getroffene Text steht also als <code>$&lt;number&gt;<\/code> zur Verfügung — ein benanntes Capture, das Sie umsonst bekommen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein benannter Regex lässt sich in einem Muster mehrfach verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Kommt er mehr als einmal vor, werden die Captures zu einer Liste, die Sie über einen Index erreichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Benannte Regexes halten Muster lesbar und erlauben es Ihnen, größere aus kleineren, gut benannten Teilen zu bauen.<\/span> <span class=\"sg\" data-s=\"1\">Genau das tut eine Grammatik in größerem Maßstab.<\/span><\/p>"]]},"nl":{"t":"Benoemde regexes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe schreef je patronen rechtstreeks binnen <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een patroon ook een <strong>naam<\/strong> geven en het hergebruiken, net als een subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Declareer er een met <code>my regex<\/code> (of <code>my token<\/code>, dat je binnenkort naar behoren tegenkomt):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een benoemde regex binnen een ander patroon te gebruiken, schrijf je zijn naam tussen punthaken, <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>&lt;number&gt;<\/code> aanroepen matcht het patroon <strong>en<\/strong> captureert het onder die naam, dus is de gematchte tekst beschikbaar als <code>$&lt;number&gt;<\/code> — een benoemde capture die je er gratis bij krijgt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een benoemde regex kan in één patroon meerdere keren gebruikt worden.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer hij meer dan één keer voorkomt, worden de captures een lijst die je op index bereikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Benoemde regexes houden patronen leesbaar en laten je grotere patronen bouwen uit kleinere, goed benoemde onderdelen.<\/span> <span class=\"sg\" data-s=\"1\">Precies dat is wat een grammatica op grotere schaal doet.<\/span><\/p>"]]},"es":{"t":"Expresiones regulares con nombre","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora has escrito patrones directamente dentro de <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También puedes darle un <strong>nombre<\/strong> a un patrón y reutilizarlo, igual que a una subrutina.<\/span> <span class=\"sg\" data-s=\"2\">Se declara con <code>my regex<\/code> (o con <code>my token<\/code>, que conocerás bien enseguida):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para usar un regex con nombre dentro de otro patrón, escribe su nombre entre corchetes angulares, <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Llamar a <code>&lt;number&gt;<\/code> empareja el patrón <strong>y<\/strong> lo captura bajo ese nombre, así que el texto coincidente está disponible como <code>$&lt;number&gt;<\/code>: una captura con nombre que te sale gratis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un regex con nombre puede usarse varias veces en un mismo patrón.<\/span> <span class=\"sg\" data-s=\"1\">Cuando aparece más de una vez, las capturas forman una lista a la que se llega por índice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los regex con nombre mantienen legibles los patrones y te permiten construir otros mayores a partir de piezas más pequeñas y bien nombradas.<\/span> <span class=\"sg\" data-s=\"1\">Eso es exactamente lo que hace una gramática a mayor escala.<\/span><\/p>"]]},"it":{"t":"Espressioni regolari con nome","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Finora hai scritto schemi direttamente dentro <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche dare a uno schema un <strong>nome<\/strong> e riusarlo, proprio come una subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Ne dichiari uno con <code>my regex<\/code> (o con <code>my token<\/code>, che incontrerai per bene fra poco):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per usare un regex con nome dentro un altro schema, scrivi il suo nome fra parentesi angolari, <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Chiamare <code>&lt;number&gt;<\/code> riconosce lo schema <strong>e<\/strong> lo cattura sotto quel nome, quindi il testo riconosciuto è disponibile come <code>$&lt;number&gt;<\/code> — una cattura con nome che ti arriva gratis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un regex con nome si può usare più volte in uno stesso schema.<\/span> <span class=\"sg\" data-s=\"1\">Quando compare più di una volta, le catture diventano un elenco, raggiungibile per indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I regex con nome tengono leggibili gli schemi e ti permettono di costruirne di più grandi a partire da parti più piccole e ben nominate.<\/span> <span class=\"sg\" data-s=\"1\">È esattamente ciò che fa una grammatica su scala maggiore.<\/span><\/p>"]]},"lv":{"t":"Nosauktas regulārās izteiksmes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Līdz šim jūs raksturus rakstījāt tieši <code>/ … /<\/code> iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Raksturam var arī dot <strong>nosaukumu<\/strong> un to atkārtoti izmantot, gluži kā apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"2\">Deklarējiet tādu ar <code>my regex<\/code> (vai <code>my token<\/code>, ar ko pienācīgi iepazīsieties drīz):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai nosauktu regulāro izteiksmi izmantotu citā raksturā, rakstiet tās nosaukumu leņķa iekavās — <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izsaucot <code>&lt;number&gt;<\/code>, raksturs tiek gan piemeklēts, <strong>gan<\/strong> satverts ar šo nosaukumu, tāpēc sakritušais teksts ir pieejams kā <code>$&lt;number&gt;<\/code> — nosaukts tvērums, ko iegūstat par velti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nosauktu regulāro izteiksmi vienā raksturā var izmantot vairākas reizes.<\/span> <span class=\"sg\" data-s=\"1\">Kad tā parādās vairāk nekā vienu reizi, tvērumi kļūst par sarakstu, kas sasniedzams pēc indeksa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nosauktas regulārās izteiksmes patur raksturus lasāmus un ļauj lielākus uzbūvēt no mazākiem, labi nosauktiem gabaliem.<\/span> <span class=\"sg\" data-s=\"1\">Tieši to lielākā mērogā dara gramatika.<\/span><\/p>"]]},"ru":{"t":"Именованные регулярные выражения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">До сих пор вы писали шаблоны прямо внутри <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но шаблону можно дать <strong>имя<\/strong> и использовать его повторно — совсем как подпрограмму.<\/span> <span class=\"sg\" data-s=\"2\">Объявляют его через <code>my regex<\/code> (или <code>my token<\/code>, с которым вы как следует познакомитесь чуть позже):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы воспользоваться именованным регулярным выражением внутри другого шаблона, напишите его имя в угловых скобках — <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вызов <code>&lt;number&gt;<\/code> и сопоставляет шаблон, <strong>и<\/strong> захватывает его под этим именем, поэтому совпавший текст доступен как <code>$&lt;number&gt;<\/code> — именованный захват достаётся вам даром.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именованное регулярное выражение можно использовать в одном шаблоне несколько раз.<\/span> <span class=\"sg\" data-s=\"1\">Когда оно встречается больше одного раза, захваты становятся списком, доступным по индексу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именованные регулярные выражения сохраняют шаблоны удобочитаемыми и позволяют собирать большие шаблоны из меньших, хорошо названных частей.<\/span> <span class=\"sg\" data-s=\"1\">Ровно этим и занимается грамматика, только в большем масштабе.<\/span><\/p>"]]},"uk":{"t":"Іменовані регекси","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досі ви писали шаблони безпосередньо всередині <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Шаблонові також можна дати <strong>ім'я<\/strong> й використовувати його повторно, як підпрограму.<\/span> <span class=\"sg\" data-s=\"2\">Оголошують такий шаблон за допомогою <code>my regex<\/code> (або <code>my token<\/code>, з яким ви як слід познайомитеся невдовзі):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб застосувати іменований регекс усередині іншого шаблону, запишіть його ім'я в кутових дужках, <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Виклик <code>&lt;number&gt;<\/code> <strong>і<\/strong> зіставляється з шаблоном, <strong>і<\/strong> захоплює його під цим іменем, тож знайдений текст доступний як <code>$&lt;number&gt;<\/code> — іменоване захоплення, яке ви отримуєте задарма.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іменований регекс можна використати в одному шаблоні кілька разів.<\/span> <span class=\"sg\" data-s=\"1\">Коли він трапляється більш ніж один раз, захоплення утворюють список, доступний за індексом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іменовані регекси зберігають шаблони зрозумілими й дозволяють будувати більші з дрібніших частин із гарними іменами.<\/span> <span class=\"sg\" data-s=\"1\">Саме це й робить граматика, тільки в більшому масштабі.<\/span><\/p>"]]},"bg":{"t":"Именувани регулярни изрази","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досега писахте шаблони направо вътре в <code>/ … /<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете също да дадете на шаблона <strong>име<\/strong> и да го използвате повторно, също като подпрограма.<\/span> <span class=\"sg\" data-s=\"2\">Декларирайте такъв с <code>my regex<\/code> (или с <code>my token<\/code>, с който ще се запознаете както трябва скоро):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да използвате именуван регулярен израз вътре в друг шаблон, напишете името му в ъглови скоби — <code>&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex number { \\d+ }\n\nif '42 cats' ~~ / &lt;number&gt; / {\n    say $&lt;number&gt;; # ｢42｣\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикването на <code>&lt;number&gt;<\/code> и съпоставя шаблона, <strong>и<\/strong> го прихваща под това име, така че съвпадналият текст е достъпен като <code>$&lt;number&gt;<\/code> — именувано прихващане, което получавате безплатно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именуван регулярен израз може да се използва няколко пъти в един шаблон.<\/span> <span class=\"sg\" data-s=\"1\">Когато се появи повече от веднъж, прихващанията стават списък, до който се стига по индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex num { \\d+ }\n\nif '3-4' ~~ / &lt;num&gt; '-' &lt;num&gt; / {\n    say $&lt;num&gt;[0]; # ｢3｣\n    say $&lt;num&gt;[1]; # ｢4｣\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именуваните регулярни изрази държат шаблоните четими и ви позволяват да строите по-големи от по-малки, добре именувани части.<\/span> <span class=\"sg\" data-s=\"1\">Точно това прави и граматиката, само в по-голям мащаб.<\/span><\/p>"]]}}}</script>
