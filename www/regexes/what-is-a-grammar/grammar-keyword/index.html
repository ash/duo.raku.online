<script type="application/json" id="page-data">{"u":"regexes/what-is-a-grammar/grammar-keyword","n":1094,"k":"topic","pv":"regexes/what-is-a-grammar/named-regexes/quiz","nx":"regexes/what-is-a-grammar/grammar-keyword/quiz","tr":["regexes","regexes/what-is-a-grammar"],"L":{"en":{"t":"The grammar keyword","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>grammar<\/em> groups named regexes together under one name, much as a class groups methods.<\/span> <span class=\"sg\" data-s=\"1\">You declare it with the <code>grammar<\/code> keyword:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Inside the grammar, each named pattern is written with <code>token<\/code> (a kind of regex you will study in detail shortly).<\/span> <span class=\"sg\" data-s=\"1\">One token, by convention called <code>TOP<\/code>, is the starting point — it describes the whole thing.<\/span> <span class=\"sg\" data-s=\"2\">Here <code>TOP<\/code> says “the text is <code>Hello, <\/code>, then a name, then <code>!<\/code>”, and <code>name<\/code> says what a name looks like.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The tokens can refer to one another by name, exactly like the <a href=\"/regexes/what-is-a-grammar/named-regexes/\">named regexes<\/a> of the previous topic.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> uses <code>&lt;name&gt;<\/code>, which keeps the grammar readable: each rule has one clear job.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To run a grammar against a string, call its <code>.parse<\/code> method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next section looks at <code>TOP<\/code> and <code>.parse<\/code> more closely.<\/span> <span class=\"sg\" data-s=\"1\">For now, the idea to take away is simple: <strong>a grammar is a named collection of named regexes that together describe a whole piece of structured text.<\/strong><\/span><\/p>"]]},"de":{"t":"Das Schlüsselwort grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Grammatik<\/em> fasst benannte Regexes unter einem Namen zusammen, ganz ähnlich wie eine Klasse Methoden zusammenfasst.<\/span> <span class=\"sg\" data-s=\"1\">Sie deklarieren sie mit dem Schlüsselwort <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Innerhalb der Grammatik wird jedes benannte Muster mit <code>token<\/code> geschrieben (einer Art Regex, die Sie gleich ausführlich kennenlernen).<\/span> <span class=\"sg\" data-s=\"1\">Ein Token, das üblicherweise <code>TOP<\/code> heißt, ist der Ausgangspunkt — es beschreibt das Ganze.<\/span> <span class=\"sg\" data-s=\"2\">Hier sagt <code>TOP<\/code>: „der Text ist <code>Hello, <\/code>, dann ein Name, dann <code>!<\/code>“, und <code>name<\/code> sagt, wie ein Name aussieht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Tokens können sich gegenseitig namentlich aufrufen, genau wie die <a href=\"https://course.raku.org/de/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">benannten Regexes<\/a> des vorigen Themas.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> verwendet <code>&lt;name&gt;<\/code>, was die Grammatik lesbar hält: Jede Regel hat eine klare Aufgabe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um eine Grammatik auf eine Zeichenkette anzuwenden, rufen Sie ihre Methode <code>.parse<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der nächste Abschnitt betrachtet <code>TOP<\/code> und <code>.parse<\/code> genauer.<\/span> <span class=\"sg\" data-s=\"1\">Für den Augenblick ist der Gedanke einfach: <strong>Eine Grammatik ist eine benannte Sammlung benannter Regexes, die zusammen ein ganzes Stück strukturierten Text beschreiben.<\/strong><\/span><\/p>"]]},"nl":{"t":"Het sleutelwoord grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>grammatica<\/em> groepeert benoemde regexes onder één naam, ongeveer zoals een klasse methoden groepeert.<\/span> <span class=\"sg\" data-s=\"1\">Je declareert er een met het sleutelwoord <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Binnen de grammatica wordt elk benoemd patroon met <code>token<\/code> geschreven (een soort regex die je binnenkort in detail bestudeert).<\/span> <span class=\"sg\" data-s=\"1\">Eén token, dat conventioneel <code>TOP<\/code> heet, is het startpunt — het beschrijft het geheel.<\/span> <span class=\"sg\" data-s=\"2\">Hier zegt <code>TOP<\/code> \"de tekst is <code>Hello, <\/code>, dan een naam, dan <code>!<\/code>\", en <code>name<\/code> zegt hoe een naam eruitziet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De tokens kunnen naar elkaar verwijzen op naam, precies als de <a href=\"https://course.raku.org/nl/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">benoemde regexes<\/a> uit het vorige onderwerp.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> gebruikt <code>&lt;name&gt;<\/code>, wat de grammatica leesbaar houdt: elke regel heeft één duidelijke taak.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een grammatica op een string toe te passen, roep je haar methode <code>.parse<\/code> aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende sectie bekijkt <code>TOP<\/code> en <code>.parse<\/code> nauwkeuriger.<\/span> <span class=\"sg\" data-s=\"1\">Voor nu is het idee om te onthouden eenvoudig: <strong>een grammatica is een benoemde verzameling benoemde regexes die samen een heel stuk gestructureerde tekst beschrijven.<\/strong><\/span><\/p>"]]},"es":{"t":"La palabra clave grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>gramática<\/em> agrupa regex con nombre bajo un solo nombre, casi como una clase agrupa métodos.<\/span> <span class=\"sg\" data-s=\"1\">Se declara con la palabra clave <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro de la gramática, cada patrón con nombre se escribe con <code>token<\/code> (una clase de regex que estudiarás en detalle enseguida).<\/span> <span class=\"sg\" data-s=\"1\">Un token, llamado por convención <code>TOP<\/code>, es el punto de partida: describe el todo.<\/span> <span class=\"sg\" data-s=\"2\">Aquí <code>TOP<\/code> dice «el texto es <code>Hello, <\/code>, después un nombre, después <code>!<\/code>», y <code>name<\/code> dice qué aspecto tiene un nombre.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tokens pueden referirse unos a otros por su nombre, exactamente igual que los <a href=\"https://course.raku.org/es/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">regex con nombre<\/a> del tema anterior.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> usa <code>&lt;name&gt;<\/code>, lo que mantiene legible la gramática: cada regla tiene un cometido claro.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para aplicar una gramática a una cadena, llama a su método <code>.parse<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sección siguiente examina <code>TOP<\/code> y <code>.parse<\/code> más de cerca.<\/span> <span class=\"sg\" data-s=\"1\">Por ahora, la idea que hay que llevarse es sencilla: <strong>una gramática es una colección con nombre de regex con nombre que juntos describen un fragmento entero de texto estructurado.<\/strong><\/span><\/p>"]]},"it":{"t":"La parola chiave grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>grammatica<\/em> raggruppa regex con nome sotto un unico nome, un po' come una classe raggruppa metodi.<\/span> <span class=\"sg\" data-s=\"1\">La dichiari con la parola chiave <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro la grammatica ogni schema con nome si scrive con <code>token<\/code> (un genere di regex che studierai in dettaglio fra poco).<\/span> <span class=\"sg\" data-s=\"1\">Un token, per convenzione chiamato <code>TOP<\/code>, è il punto di partenza: descrive il tutto.<\/span> <span class=\"sg\" data-s=\"2\">Qui <code>TOP<\/code> dice «il testo è <code>Hello, <\/code>, poi un nome, poi <code>!<\/code>», e <code>name<\/code> dice che aspetto ha un nome.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I token possono riferirsi l'uno all'altro per nome, esattamente come i <a href=\"https://course.raku.org/it/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">regex con nome<\/a> dell'argomento precedente.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> usa <code>&lt;name&gt;<\/code>, il che tiene leggibile la grammatica: ogni regola ha un compito chiaro.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per far girare una grammatica su una stringa, chiama il suo metodo <code>.parse<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sezione successiva guarda più da vicino <code>TOP<\/code> e <code>.parse<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per ora l'idea da portarsi via è semplice: <strong>una grammatica è una collezione con nome di regex con nome che insieme descrivono un intero pezzo di testo strutturato.<\/strong><\/span><\/p>"]]},"lv":{"t":"Atslēgvārds grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Gramatika<\/em> sagrupē nosauktas regulārās izteiksmes zem viena nosaukuma, gluži kā klase sagrupē metodes.<\/span> <span class=\"sg\" data-s=\"1\">To deklarējat ar atslēgvārdu <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gramatikas iekšienē katrs nosauktais raksturs tiek rakstīts ar <code>token<\/code> (regulāro izteiksmju paveidu, ko drīz aplūkosiet sīkāk).<\/span> <span class=\"sg\" data-s=\"1\">Viens marķieris, ko pēc vienošanās sauc par <code>TOP<\/code>, ir sākumpunkts — tas apraksta visu kopumu.<\/span> <span class=\"sg\" data-s=\"2\">Šeit <code>TOP<\/code> saka «teksts ir <code>Hello, <\/code>, tad vārds, tad <code>!<\/code>», bet <code>name<\/code> saka, kā izskatās vārds.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Marķieri var atsaukties cits uz citu pēc nosaukuma, tieši tāpat kā <a href=\"https://course.raku.org/lv/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">nosauktās regulārās izteiksmes<\/a> iepriekšējā tematā.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> izmanto <code>&lt;name&gt;<\/code>, kas patur gramatiku lasāmu: katram likumam ir viens skaidrs uzdevums.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai gramatiku palaistu pret virkni, izsauciet tās metodi <code>.parse<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamā sadaļa tuvāk aplūko <code>TOP<\/code> un <code>.parse<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pagaidām ideja, ko paņemt līdzi, ir vienkārša: <strong>gramatika ir nosaukta nosauktu regulāro izteiksmju kolekcija, kas kopā apraksta veselu strukturēta teksta gabalu.<\/strong><\/span><\/p>"]]},"ru":{"t":"Ключевое слово grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Грамматика<\/em> объединяет именованные регулярные выражения под одним именем — во многом так же, как класс объединяет методы.<\/span> <span class=\"sg\" data-s=\"1\">Объявляют её ключевым словом <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри грамматики каждый именованный шаблон записывается через <code>token<\/code> (разновидность регулярного выражения, которую вы вскоре изучите подробно).<\/span> <span class=\"sg\" data-s=\"1\">Один токен, по соглашению называемый <code>TOP<\/code>, служит точкой входа — он описывает вещь целиком.<\/span> <span class=\"sg\" data-s=\"2\">Здесь <code>TOP<\/code> говорит: «текст — это <code>Hello, <\/code>, затем имя, затем <code>!<\/code>», а <code>name<\/code> описывает, как выглядит имя.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Токены могут ссылаться друг на друга по имени, точно как <a href=\"https://course.raku.org/ru/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">именованные регулярные выражения<\/a> из предыдущей темы.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> использует <code>&lt;name&gt;<\/code>, и грамматика остаётся удобочитаемой: у каждого правила одна ясная работа.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы применить грамматику к строке, вызовите её метод <code>.parse<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующий раздел рассматривает <code>TOP<\/code> и <code>.parse<\/code> подробнее.<\/span> <span class=\"sg\" data-s=\"1\">Пока же вывод прост: <strong>грамматика — это именованное собрание именованных регулярных выражений, которые вместе описывают целый кусок структурированного текста.<\/strong><\/span><\/p>"]]},"uk":{"t":"Ключове слово grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Граматика<\/em> групує іменовані регекси під одним іменем, подібно до того, як клас групує методи.<\/span> <span class=\"sg\" data-s=\"1\">Оголошують її ключовим словом <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Усередині граматики кожен іменований шаблон записують через <code>token<\/code> (різновид регексу, який ви невдовзі вивчите докладно).<\/span> <span class=\"sg\" data-s=\"1\">Один токен, за домовленістю названий <code>TOP<\/code>, є відправною точкою — він описує всю річ.<\/span> <span class=\"sg\" data-s=\"2\">Тут <code>TOP<\/code> каже: «текст — це <code>Hello, <\/code>, потім ім'я, потім <code>!<\/code>», а <code>name<\/code> каже, який вигляд має ім'я.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Токени можуть посилатися один на одного за іменем, точно як <a href=\"https://course.raku.org/uk/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">іменовані регекси<\/a> з попередньої теми.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> використовує <code>&lt;name&gt;<\/code>, і це зберігає граматику зрозумілою: кожне правило має одну чітку роботу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб застосувати граматику до рядка, викличте її метод <code>.parse<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступний розділ розгляне <code>TOP<\/code> та <code>.parse<\/code> уважніше.<\/span> <span class=\"sg\" data-s=\"1\">Поки що ідея, яку варто винести, проста: <strong>граматика — це іменована добірка іменованих регексів, що разом описують цілий шматок структурованого тексту.<\/strong><\/span><\/p>"]]},"bg":{"t":"Ключовата дума grammar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Граматиката<\/em> групира именувани регулярни изрази под едно име, много както класът групира методи.<\/span> <span class=\"sg\" data-s=\"1\">Декларирате я с ключовата дума <code>grammar<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Greeting {\n    token TOP  { 'Hello, ' &lt;name&gt; '!' }\n    token name { \\w+ }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вътре в граматиката всеки именуван шаблон се записва с <code>token<\/code> (вид регулярен израз, който ще изучите подробно скоро).<\/span> <span class=\"sg\" data-s=\"1\">Един токен, по споразумение наричан <code>TOP<\/code>, е отправната точка — той описва цялото нещо.<\/span> <span class=\"sg\" data-s=\"2\">Тук <code>TOP<\/code> казва „текстът е <code>Hello, <\/code>, после име, после <code>!<\/code>“, а <code>name<\/code> казва как изглежда едно име.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Токените могат да се позовават един на друг по име, точно както <a href=\"https://course.raku.org/bg/regexes/what-is-a-grammar/named-regexes/\" target=\"_blank\" rel=\"noopener\">именуваните регулярни изрази<\/a> от предишната тема.<\/span> <span class=\"sg\" data-s=\"1\"><code>TOP<\/code> използва <code>&lt;name&gt;<\/code>, което държи граматиката четима: всяко правило има една ясна задача.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да приложите граматиката върху низ, извикайте нейния метод <code>.parse<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = Greeting.parse('Hello, Anna!');\nsay $m&lt;name&gt;; # ｢Anna｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващият раздел разглежда <code>TOP<\/code> и <code>.parse<\/code> по-отблизо.<\/span> <span class=\"sg\" data-s=\"1\">Засега идеята, която си струва да се отнесе, е проста: <strong>граматиката е именувана сбирка от именувани регулярни изрази, които заедно описват цяло парче структуриран текст.<\/strong><\/span><\/p>"]]}}}</script>
