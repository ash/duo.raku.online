<script type="application/json" id="page-data">{"u":"regexes/anchors/word-boundaries","n":1041,"k":"topic","pv":"regexes/anchors/string-anchors/quiz","nx":"regexes/anchors/word-boundaries/quiz","tr":["regexes","regexes/anchors"],"L":{"en":{"t":"Word boundaries","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Matching <code>cat<\/code> succeeds inside <code>category<\/code>, because the three letters really are there.<\/span> <span class=\"sg\" data-s=\"1\">Often that is not what you want — you mean the whole word <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A <em>word boundary<\/em> anchor solves this.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> matches at the <strong>left<\/strong> edge of a word (the start of a word)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> matches at the <strong>right<\/strong> edge of a word (the end of a word)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wrap a word in these anchors to match it only as a complete word:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>category<\/code> there is no word boundary right after <code>cat<\/code>, so the anchored pattern fails — exactly the behaviour we wanted.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A word boundary sits between a word character (<code>\\w<\/code>) and a non-word character, so it does not consume anything itself; like <code>^<\/code> and <code>$<\/code>, it only asserts a position.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The two anchors can also be written with the guillemet characters <code>«<\/code> and <code>»<\/code> if you prefer them.<\/span> <span class=\"sg\" data-s=\"1\">They behave exactly like <code>&lt;&lt;<\/code> and <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"de":{"t":"Wortgrenzen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>cat<\/code> zu treffen gelingt innerhalb von <code>category<\/code>, denn die drei Buchstaben stehen dort tatsächlich.<\/span> <span class=\"sg\" data-s=\"1\">Oft ist das nicht, was Sie wollen — Sie meinen das ganze Wort <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Anker für eine <em>Wortgrenze<\/em> löst das.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> trifft am <strong>linken<\/strong> Rand eines Wortes (dem Wortanfang)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> trifft am <strong>rechten<\/strong> Rand eines Wortes (dem Wortende)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hüllen Sie ein Wort in diese Anker, um es nur als vollständiges Wort zu treffen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>category<\/code> steht direkt hinter <code>cat<\/code> keine Wortgrenze, das verankerte Muster scheitert also — genau das Verhalten, das wir wollten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine Wortgrenze liegt zwischen einem Wortzeichen (<code>\\w<\/code>) und einem Nicht-Wortzeichen, sie verbraucht also selbst nichts; wie <code>^<\/code> und <code>$<\/code> behauptet sie nur eine Position.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die beiden Anker lassen sich auch mit den Guillemet-Zeichen <code>«<\/code> und <code>»<\/code> schreiben, wenn Ihnen die lieber sind.<\/span> <span class=\"sg\" data-s=\"1\">Sie verhalten sich genau wie <code>&lt;&lt;<\/code> und <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"nl":{"t":"Woordgrenzen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>cat<\/code> matchen slaagt binnen <code>category<\/code>, omdat de drie letters daar werkelijk staan.<\/span> <span class=\"sg\" data-s=\"1\">Vaak is dat niet wat je wilt — je bedoelt het hele woord <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Een anker voor een <em>woordgrens<\/em> lost dit op.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> matcht aan de <strong>linker<\/strong>rand van een woord (het begin van een woord)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> matcht aan de <strong>rechter<\/strong>rand van een woord (het einde van een woord)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wikkel een woord in deze ankers om het alleen als volledig woord te matchen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>category<\/code> staat vlak achter <code>cat<\/code> geen woordgrens, dus mislukt het verankerde patroon — precies het gedrag dat we wilden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een woordgrens ligt tussen een woordteken (<code>\\w<\/code>) en een niet-woordteken, dus verbruikt hij zelf niets; net als <code>^<\/code> en <code>$<\/code> beweert hij alleen een positie.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De twee ankers kunnen ook met de guillemettekens <code>«<\/code> en <code>»<\/code> geschreven worden als je die liever hebt.<\/span> <span class=\"sg\" data-s=\"1\">Ze gedragen zich precies als <code>&lt;&lt;<\/code> en <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"es":{"t":"Límites de palabra","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Emparejar <code>cat<\/code> funciona dentro de <code>category<\/code>, porque las tres letras están ahí de verdad.<\/span> <span class=\"sg\" data-s=\"1\">A menudo eso no es lo que quieres: te refieres a la palabra entera <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un ancla de <em>límite de palabra<\/em> lo resuelve.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> coincide en el borde <strong>izquierdo<\/strong> de una palabra (su principio)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> coincide en el borde <strong>derecho<\/strong> de una palabra (su final)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Envuelve una palabra en estas anclas para emparejarla solo como palabra completa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>category<\/code> no hay ningún límite de palabra justo después de <code>cat<\/code>, así que el patrón anclado falla: exactamente el comportamiento que queríamos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un límite de palabra está entre un carácter de palabra (<code>\\w<\/code>) y uno que no lo es, así que no consume nada por sí mismo; como <code>^<\/code> y <code>$<\/code>, solo afirma una posición.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las dos anclas también se pueden escribir con las comillas angulares <code>«<\/code> y <code>»<\/code>, si las prefieres.<\/span> <span class=\"sg\" data-s=\"1\">Se comportan exactamente como <code>&lt;&lt;<\/code> y <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"it":{"t":"Confini di parola","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Riconoscere <code>cat<\/code> riesce dentro <code>category<\/code>, perché le tre lettere ci sono davvero.<\/span> <span class=\"sg\" data-s=\"1\">Spesso non è quello che vuoi: intendi la parola intera <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un'ancora di <em>confine di parola<\/em> risolve la cosa.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> corrisponde al margine <strong>sinistro<\/strong> di una parola (l'inizio di una parola)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> corrisponde al margine <strong>destro<\/strong> di una parola (la fine di una parola)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Avvolgi una parola in queste ancore per riconoscerla solo come parola completa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In <code>category<\/code> non c'è alcun confine di parola subito dopo <code>cat<\/code>, quindi lo schema ancorato fallisce — esattamente il comportamento che volevamo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un confine di parola sta fra un carattere di parola (<code>\\w<\/code>) e un carattere non di parola, quindi non consuma nulla di suo; come <code>^<\/code> e <code>$<\/code>, asserisce soltanto una posizione.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le due ancore si possono anche scrivere con i caporali <code>«<\/code> e <code>»<\/code>, se li preferisci.<\/span> <span class=\"sg\" data-s=\"1\">Si comportano esattamente come <code>&lt;&lt;<\/code> e <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"ru":{"t":"Границы слов","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Сопоставление <code>cat<\/code> срабатывает и внутри <code>category<\/code>, потому что эти три буквы там действительно есть.<\/span> <span class=\"sg\" data-s=\"1\">Часто это не то, чего вы хотите: вам нужно целое слово <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эту задачу решает якорь <em>границы слова<\/em>.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> совпадает у <strong>левого<\/strong> края слова (в начале слова)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> совпадает у <strong>правого<\/strong> края слова (в конце слова)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заключите слово в эти якоря, чтобы оно сопоставлялось только как целое слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В слове <code>category<\/code> сразу после <code>cat<\/code> границы слова нет, поэтому привязанный шаблон не срабатывает — ровно то поведение, которого мы добивались.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Граница слова находится между словесным символом (<code>\\w<\/code>) и несловесным, поэтому сама она ничего не поглощает; как <code>^<\/code> и <code>$<\/code>, она лишь утверждает позицию.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти два якоря можно записать и символами угловых кавычек <code>«<\/code> и <code>»<\/code>, если они вам больше нравятся.<\/span> <span class=\"sg\" data-s=\"1\">Ведут они себя в точности как <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"uk":{"t":"Межі слів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Зіставлення з <code>cat<\/code> вдається всередині <code>category<\/code>, бо ці три літери там таки є. Часто це не те, чого ви хочете: ви маєте на увазі ціле слово <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це розв'язує якір <em>межі слова<\/em>.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> зіставляється на <strong>лівому<\/strong> краї слова (на його початку)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> зіставляється на <strong>правому<\/strong> краї слова (у його кінці)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Загорніть слово в ці якорі, щоб зіставлятися з ним лише як із цілим словом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У <code>category<\/code> одразу після <code>cat<\/code> межі слова немає, тож заякорений шаблон зазнає невдачі — саме тієї поведінки ми й хотіли.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Межа слова лежить між словесним символом (<code>\\w<\/code>) і несловесним, тож сама вона нічого не споживає; як і <code>^<\/code> та <code>$<\/code>, вона лише стверджує позицію.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ці два якорі можна також записати символами лапок-ялинок <code>«<\/code> та <code>»<\/code>, якщо вам так більше до вподоби.<\/span> <span class=\"sg\" data-s=\"1\">Вони поводяться точно як <code>&lt;&lt;<\/code> і <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]},"bg":{"t":"Граници на думи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Съпоставянето на <code>cat<\/code> успява вътре в <code>category<\/code>, защото трите букви наистина са там.<\/span> <span class=\"sg\" data-s=\"1\">Често това не е онова, което искате — имате предвид цялата дума <code>cat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Котвата за <em>граница на дума<\/em> решава това.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&lt;&lt;<\/code> съвпада на <strong>левия<\/strong> ръб на дума (началото на дума)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;<\/code> съвпада на <strong>десния<\/strong> ръб на дума (края на дума)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обвийте дума в тези котви, за да я съпоставите само като цяла дума:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /&lt;&lt; cat &gt;&gt;/;    # ｢cat｣\nsay so 'category'  ~~ /&lt;&lt; cat &gt;&gt;/;   # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В <code>category<\/code> няма граница на дума веднага след <code>cat<\/code>, така че закотвеният шаблон се проваля — точно поведението, което искахме.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Границата на дума стои между словесен знак (<code>\\w<\/code>) и несловесен знак, така че тя сама не поглъща нищо; както <code>^<\/code> и <code>$<\/code>, тя само утвърждава позиция.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двете котви могат да се запишат и със знаците гийме <code>«<\/code> и <code>»<\/code>, ако предпочитате тях.<\/span> <span class=\"sg\" data-s=\"1\">Държат се точно като <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /« cat »/;  # ｢cat｣\nsay so 'category'  ~~ /« cat »/;  # False<\/code><\/pre>"]]}}}</script>
