<script type="application/json" id="page-data">{"u":"regexes/anchors/string-anchors","n":1039,"k":"topic","pv":"regexes/anchors","nx":"regexes/anchors/string-anchors/quiz","tr":["regexes","regexes/anchors"],"L":{"en":{"t":"Start and end of string","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Two anchors mark the ends of the string:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> matches at the very <strong>start<\/strong> of the string<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> matches at the very <strong>end<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Use <code>^<\/code> to require that the match begins at the start:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The second string contains <code>http<\/code>, but not at the beginning, so the anchored pattern fails.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Putting <code>^<\/code> and <code>$<\/code> around a pattern forces it to match the <strong>whole<\/strong> string, with nothing left over on either side:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is a very common idiom for validation — “is this string exactly a number?”, for instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Line anchors<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When a string has several lines, the partners <code>^^<\/code> and <code>$$<\/code> match at the start and end of <strong>each line<\/strong> rather than the whole string.<\/span> <span class=\"sg\" data-s=\"1\">The difference from <code>^<\/code> and <code>$<\/code> shows up as soon as the text you want is not on the first line: the single anchors see only the whole string and fail, while the doubled ones match on any line.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here <code>\\n<\/code> starts a second line.<\/span> <span class=\"sg\" data-s=\"1\">The <code>^^<\/code> requires <code>dog<\/code> to sit at the start of a line and <code>$$<\/code> at the end of one; both hold on the second line, so the doubled anchors succeed where the single ones cannot.<\/span><\/p>"]]},"de":{"t":"Anfang und Ende der Zeichenkette","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zwei Anker markieren die Enden der Zeichenkette:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> trifft ganz am <strong>Anfang<\/strong> der Zeichenkette<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> trifft ganz am <strong>Ende<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verwenden Sie <code>^<\/code>, um zu verlangen, dass der Treffer am Anfang beginnt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die zweite Zeichenkette enthält <code>http<\/code>, aber nicht am Anfang, das verankerte Muster scheitert also.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>^<\/code> und <code>$<\/code> um ein Muster zu setzen zwingt es, die <strong>ganze<\/strong> Zeichenkette zu treffen, ohne dass auf einer Seite etwas übrig bleibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das ist eine sehr verbreitete Redewendung zur Prüfung — etwa „ist diese Zeichenkette genau eine Zahl?“:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Zeilenanker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Zeichenkette mehrere Zeilen hat, treffen die Partner <code>^^<\/code> und <code>$$<\/code> am Anfang und Ende <strong>jeder Zeile<\/strong> statt der ganzen Zeichenkette.<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied zu <code>^<\/code> und <code>$<\/code> zeigt sich, sobald der gesuchte Text nicht in der ersten Zeile steht: Die einfachen Anker sehen nur die ganze Zeichenkette und scheitern, während die verdoppelten in jeder Zeile treffen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier beginnt <code>\\n<\/code> eine zweite Zeile.<\/span> <span class=\"sg\" data-s=\"1\">Das <code>^^<\/code> verlangt, dass <code>dog<\/code> am Anfang einer Zeile steht, und <code>$$<\/code> am Ende einer solchen; beides gilt in der zweiten Zeile, die verdoppelten Anker gelingen also dort, wo die einfachen es nicht können.<\/span><\/p>"]]},"nl":{"t":"Begin en einde van de string","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Twee ankers markeren de uiteinden van de string:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> matcht helemaal aan het <strong>begin<\/strong> van de string<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> matcht helemaal aan het <strong>einde<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>^<\/code> om te eisen dat de match bij het begin begint:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De tweede string bevat <code>http<\/code>, maar niet aan het begin, dus het verankerde patroon mislukt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>^<\/code> en <code>$<\/code> om een patroon zetten dwingt het de <strong>hele<\/strong> string te matchen, zonder dat er aan weerskanten iets overblijft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is een heel gebruikelijk idioom voor validatie — bijvoorbeeld \"is deze string precies een getal?\":<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Regelankers<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer een string uit meerdere regels bestaat, matchen de partners <code>^^<\/code> en <code>$$<\/code> aan het begin en einde van <strong>elke regel<\/strong> in plaats van van de hele string.<\/span> <span class=\"sg\" data-s=\"1\">Het verschil met <code>^<\/code> en <code>$<\/code> blijkt zodra de tekst die je zoekt niet op de eerste regel staat: de enkele ankers zien alleen de hele string en mislukken, terwijl de verdubbelde op elke regel matchen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier begint <code>\\n<\/code> een tweede regel.<\/span> <span class=\"sg\" data-s=\"1\">De <code>^^<\/code> eist dat <code>dog<\/code> aan het begin van een regel staat en <code>$$<\/code> aan het einde van een regel; beide gelden op de tweede regel, dus slagen de verdubbelde ankers waar de enkele dat niet kunnen.<\/span><\/p>"]]},"es":{"t":"Principio y final de la cadena","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dos anclas marcan los extremos de la cadena:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> coincide justo al <strong>principio<\/strong> de la cadena<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> coincide justo al <strong>final<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usa <code>^<\/code> para exigir que la coincidencia empiece al principio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La segunda cadena contiene <code>http<\/code>, pero no al principio, así que el patrón anclado falla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poner <code>^<\/code> y <code>$<\/code> alrededor de un patrón lo obliga a emparejar <strong>toda<\/strong> la cadena, sin que sobre nada a ninguno de los dos lados:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es un giro muy común para la validación, por ejemplo «¿es esta cadena exactamente un número?»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Anclas de línea<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando una cadena tiene varias líneas, las compañeras <code>^^<\/code> y <code>$$<\/code> coinciden al principio y al final de <strong>cada línea<\/strong> en lugar de los de toda la cadena.<\/span> <span class=\"sg\" data-s=\"1\">La diferencia con <code>^<\/code> y <code>$<\/code> salta a la vista en cuanto el texto que buscas no está en la primera línea: las anclas simples solo ven la cadena entera y fallan, mientras que las dobles coinciden en cualquier línea.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>\\n<\/code> empieza una segunda línea.<\/span> <span class=\"sg\" data-s=\"1\"><code>^^<\/code> exige que <code>dog<\/code> esté al principio de una línea y <code>$$<\/code> al final de una; ambas cosas se cumplen en la segunda línea, así que las anclas dobles funcionan donde las simples no pueden.<\/span><\/p>"]]},"it":{"t":"Inizio e fine della stringa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Due ancore segnano le estremità della stringa:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> corrisponde proprio all'<strong>inizio<\/strong> della stringa<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> corrisponde proprio alla <strong>fine<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usa <code>^<\/code> per richiedere che la corrispondenza cominci dall'inizio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La seconda stringa contiene <code>http<\/code>, ma non all'inizio, quindi lo schema ancorato fallisce.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mettere <code>^<\/code> e <code>$<\/code> attorno a uno schema lo costringe a riconoscere l'<strong>intera<\/strong> stringa, senza che avanzi nulla da nessuna delle due parti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">È un modo di dire molto comune per la validazione — «questa stringa è esattamente un numero?», per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ancore di riga<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando una stringa ha più righe, le compagne <code>^^<\/code> e <code>$$<\/code> corrispondono all'inizio e alla fine di <strong>ogni riga<\/strong> invece che dell'intera stringa.<\/span> <span class=\"sg\" data-s=\"1\">La differenza rispetto a <code>^<\/code> e <code>$<\/code> salta fuori non appena il testo che vuoi non è sulla prima riga: le ancore singole vedono solo l'intera stringa e falliscono, mentre quelle doppie corrispondono su qualunque riga.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>\\n<\/code> inizia una seconda riga.<\/span> <span class=\"sg\" data-s=\"1\"><code>^^<\/code> richiede che <code>dog<\/code> stia all'inizio di una riga e <code>$$<\/code> alla fine di una; entrambe le cose valgono sulla seconda riga, quindi le ancore doppie riescono dove quelle singole non possono.<\/span><\/p>"]]},"ru":{"t":"Начало и конец строки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Два якоря отмечают концы строки:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> совпадает в самом <strong>начале<\/strong> строки<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> совпадает в самом <strong>конце<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Используйте <code>^<\/code>, чтобы потребовать, чтобы совпадение начиналось с начала:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Во второй строке <code>http<\/code> есть, но не в начале, поэтому привязанный якорем шаблон не срабатывает.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если поставить <code>^<\/code> и <code>$<\/code> вокруг шаблона, он вынужден совпасть со <strong>всей<\/strong> строкой, так что по краям ничего не останется:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это очень распространённый приём для проверки — например, «а эта строка целиком число?»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Якоря строк текста<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда в тексте несколько строк, парные якоря <code>^^<\/code> и <code>$$<\/code> совпадают в начале и конце <strong>каждой строки текста<\/strong>, а не всего значения целиком.<\/span> <span class=\"sg\" data-s=\"1\">Разница с <code>^<\/code> и <code>$<\/code> проявляется, как только нужный текст оказывается не на первой строке: одинарные якоря видят только всё значение и не срабатывают, а удвоенные совпадают на любой строке.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>\\n<\/code> начинает вторую строку.<\/span> <span class=\"sg\" data-s=\"1\"><code>^^<\/code> требует, чтобы <code>dog<\/code> стояло в начале строки, а <code>$$<\/code> — в конце; на второй строке верно и то и другое, поэтому удвоенные якоря срабатывают там, где одинарные не могут.<\/span><\/p>"]]},"uk":{"t":"Початок і кінець рядка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Два якорі позначають кінці рядка:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> зіставляється на самому <strong>початку<\/strong> рядка<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> зіставляється в самому <strong>кінці<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <code>^<\/code>, щоб вимагати, аби збіг починався з початку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другий рядок містить <code>http<\/code>, але не на початку, тож заякорений шаблон зазнає невдачі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постановка <code>^<\/code> та <code>$<\/code> навколо шаблону змушує його зіставитися з <strong>усім<\/strong> рядком, не лишаючи нічого зайвого з жодного боку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це дуже поширена ідіома для перевірки — наприклад, «чи є цей рядок точно числом?»:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Якорі рядків тексту<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли текст має кілька рядків, партнери <code>^^<\/code> та <code>$$<\/code> зіставляються на початку й у кінці <strong>кожного рядка<\/strong>, а не всього тексту.<\/span> <span class=\"sg\" data-s=\"1\">Відмінність від <code>^<\/code> та <code>$<\/code> виявляється, щойно потрібний вам текст опиняється не на першому рядку: одинарні якорі бачать лише весь текст і зазнають невдачі, а подвоєні зіставляються на будь-якому рядку.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>\\n<\/code> починає другий рядок.<\/span> <span class=\"sg\" data-s=\"1\"><code>^^<\/code> вимагає, щоб <code>dog<\/code> стояло на початку рядка, а <code>$$<\/code> — щоб у кінці; на другому рядку виконується і те, і те, тож подвоєні якорі вдаються там, де одинарні не можуть.<\/span><\/p>"]]},"bg":{"t":"Начало и край на низа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Две котви отбелязват краищата на низа:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>^<\/code> съвпада в самото <strong>начало<\/strong> на низа<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>$<\/code> съвпада в самия <strong>край<\/strong><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Използвайте <code>^<\/code>, за да изисквате съвпадението да започва от началото:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'http://example' ~~ /^ http /; # True\nsay so 'see http://x'   ~~ /^ http /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вторият низ съдържа <code>http<\/code>, но не в началото, така че закотвеният шаблон се проваля.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Слагането на <code>^<\/code> и <code>$<\/code> около шаблон го принуждава да съвпадне с <strong>целия<\/strong> низ, без нищо да остава от която и да е страна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'hello'       ~~ /^ hello $/; # True\nsay so 'hello world' ~~ /^ hello $/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е много често използван похват за проверка — например „точно число ли е този низ?“:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so '2025' ~~ /^ \\d+ $/; # True\nsay so '20a5' ~~ /^ \\d+ $/; # False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Котви за ред<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато низът има няколко реда, партньорите <code>^^<\/code> и <code>$$<\/code> съвпадат в началото и края на <strong>всеки ред<\/strong>, а не на целия низ.<\/span> <span class=\"sg\" data-s=\"1\">Разликата спрямо <code>^<\/code> и <code>$<\/code> изпъква веднага щом текстът, който търсите, не е на първия ред: единичните котви виждат само целия низ и се провалят, докато удвоените съвпадат на кой да е ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so \"cat\\ndog\" ~~ /^  dog  $/;  # False\nsay so \"cat\\ndog\" ~~ /^^ dog $$/;  # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>\\n<\/code> започва втори ред.<\/span> <span class=\"sg\" data-s=\"1\"><code>^^<\/code> изисква <code>dog<\/code> да стои в началото на ред, а <code>$$<\/code> — в края на ред; и двете важат на втория ред, така че удвоените котви успяват там, където единичните не могат.<\/span><\/p>"]]}}}</script>
