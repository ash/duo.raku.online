<script type="application/json" id="page-data">{"u":"regexes/anchors/exercises/whole-word/solution","n":1049,"k":"solution","pv":"regexes/anchors/exercises/whole-word","nx":"regexes/assertions","tr":["regexes","regexes/anchors"],"L":{"en":{"t":"The solution of ’A whole word‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>&lt;&lt;<\/code> and <code>&gt;&gt;<\/code> anchors require a word boundary on each side of <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The letters <code>is<\/code> also sit inside <code>this<\/code>, but there they have no word boundary on the left, so the engine skips that occurrence and matches the standalone word <code>is<\/code> instead.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both candidates print the same <code>｢is｣<\/code>, so how do you know which one actually matched? Change the <code>is<\/code> hidden inside <code>this<\/code> — for example, turn the string into <code>'thus is fine'<\/code>. The output is still <code>｢is｣<\/code>, unchanged, proving that occurrence was never the match. Now change the standalone word instead (say, <code>'this it fine'<\/code>) and the match disappears (<code>Nil<\/code>). You can also ask the match where it starts: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> returns <code>5<\/code>, the position of the standalone <code>is<\/code>, not <code>2<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein ganzes Wort","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Anker <code>&lt;&lt;<\/code> und <code>&gt;&gt;<\/code> verlangen auf beiden Seiten von <code>is<\/code> eine Wortgrenze.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Buchstaben <code>is<\/code> stecken auch in <code>this<\/code>, dort haben sie aber links keine Wortgrenze, die Maschine überspringt dieses Vorkommen also und trifft stattdessen das allein stehende Wort <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Kandidaten geben dasselbe <code>｢is｣<\/code> aus — woher wissen Sie also, welcher tatsächlich getroffen hat? Ändern Sie das in <code>this<\/code> versteckte <code>is<\/code> — machen Sie etwa <code>'thus is fine'<\/code> aus der Zeichenkette. Die Ausgabe bleibt unverändert <code>｢is｣<\/code>, was beweist, dass jenes Vorkommen nie der Treffer war. Ändern Sie nun stattdessen das allein stehende Wort (sagen wir <code>'this it fine'<\/code>), und der Treffer verschwindet (<code>Nil<\/code>). Sie können den Treffer auch fragen, wo er beginnt: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> liefert <code>5<\/code>, die Position des allein stehenden <code>is<\/code>, und nicht <code>2<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een heel woord","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De ankers <code>&lt;&lt;<\/code> en <code>&gt;&gt;<\/code> eisen aan beide kanten van <code>is<\/code> een woordgrens.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De letters <code>is<\/code> zitten ook binnen <code>this<\/code>, maar daar hebben ze links geen woordgrens, dus slaat de engine dat voorkomen over en matcht ze in plaats daarvan het losstaande woord <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide kandidaten drukken dezelfde <code>｢is｣<\/code> af, dus hoe weet je welke werkelijk matchte? Verander de <code>is<\/code> die in <code>this<\/code> verstopt zit — maak van de string bijvoorbeeld <code>'thus is fine'<\/code>. De uitvoer is nog steeds <code>｢is｣<\/code>, onveranderd, wat bewijst dat dat voorkomen nooit de match was. Verander nu in plaats daarvan het losstaande woord (zeg <code>'this it fine'<\/code>) en de match verdwijnt (<code>Nil<\/code>). Je kunt de match ook vragen waar hij begint: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> geeft <code>5<\/code> terug, de positie van het losstaande <code>is<\/code>, niet <code>2<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Una palabra entera","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las anclas <code>&lt;&lt;<\/code> y <code>&gt;&gt;<\/code> exigen un límite de palabra a cada lado de <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las letras <code>is<\/code> están también dentro de <code>this<\/code>, pero ahí no tienen ningún límite de palabra a la izquierda, así que el motor se salta esa aparición y empareja en su lugar la palabra suelta <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambas candidatas imprimen el mismo <code>｢is｣<\/code>, así que ¿cómo sabes cuál coincidió realmente? Cambia el <code>is<\/code> escondido dentro de <code>this<\/code>, por ejemplo convirtiendo la cadena en <code>'thus is fine'<\/code>. La salida sigue siendo <code>｢is｣<\/code>, sin cambios, lo que demuestra que esa aparición nunca fue la coincidencia. Ahora cambia en cambio la palabra suelta (digamos <code>'this it fine'<\/code>) y la coincidencia desaparece (<code>Nil<\/code>). También puedes preguntarle a la coincidencia dónde empieza: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> devuelve <code>5<\/code>, la posición del <code>is<\/code> suelto, y no <code>2<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Una parola intera","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le ancore <code>&lt;&lt;<\/code> e <code>&gt;&gt;<\/code> richiedono un confine di parola da entrambi i lati di <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le lettere <code>is<\/code> stanno anche dentro <code>this<\/code>, ma lì non hanno alcun confine di parola a sinistra, quindi il motore salta quell'occorrenza e riconosce invece la parola <code>is<\/code> che sta da sola.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Entrambi i candidati stampano lo stesso <code>｢is｣<\/code>, quindi come fai a sapere quale ha davvero corrisposto? Cambia l'<code>is<\/code> nascosto dentro <code>this<\/code> — per esempio trasforma la stringa in <code>'thus is fine'<\/code>. L'output è ancora <code>｢is｣<\/code>, immutato, il che prova che quell'occorrenza non è mai stata la corrispondenza. Ora cambia invece la parola isolata (diciamo <code>'this it fine'<\/code>) e la corrispondenza sparisce (<code>Nil<\/code>). Puoi anche chiedere alla corrispondenza dove comincia: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> restituisce <code>5<\/code>, la posizione dell'<code>is<\/code> isolato, non <code>2<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Целое слово","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Якоря <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code> требуют границы слова с каждой стороны от <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Буквы <code>is<\/code> есть и внутри <code>this<\/code>, но там слева у них нет границы слова, поэтому движок пропускает это вхождение и сопоставляет отдельно стоящее слово <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оба кандидата напечатали бы одно и то же <code>｢is｣<\/code> — так как же узнать, какой из них совпал на самом деле? Измените <code>is<\/code>, спрятанное внутри <code>this<\/code>: например, превратите строку в <code>'thus is fine'<\/code>. Вывод останется прежним, <code>｢is｣<\/code>, что доказывает: то вхождение совпадением не было. А теперь измените отдельно стоящее слово (скажем, <code>'this it fine'<\/code>) — и совпадение исчезнет (<code>Nil<\/code>). Можно и просто спросить у совпадения, где оно начинается: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> вернёт <code>5<\/code>, позицию отдельного <code>is<\/code>, а не <code>2<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Ціле слово","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Якорі <code>&lt;&lt;<\/code> та <code>&gt;&gt;<\/code> вимагають межі слова з кожного боку від <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Літери <code>is<\/code> сидять також усередині <code>this<\/code>, але там ліворуч від них межі слова немає, тож механізм пропускає це входження й натомість зіставляється з окремим словом <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидва кандидати виводять те саме <code>｢is｣<\/code> — то як же дізнатися, який із них справді збігся? Змініть <code>is<\/code>, приховане всередині <code>this<\/code>, — наприклад, перетворіть рядок на <code>'thus is fine'<\/code>. Вивід і далі буде <code>｢is｣<\/code>, без змін, що доводить: це входження ніколи не було збігом. Тепер змініть натомість окреме слово (скажімо, <code>'this it fine'<\/code>) — і збіг зникне (<code>Nil<\/code>). Можна також запитати в збігу, де він починається: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> повертає <code>5<\/code> — позицію окремого <code>is<\/code>, а не <code>2<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Цяла дума","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'this is fine' ~~ /&lt;&lt; is &gt;&gt;/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/anchors/whole-word.raku\" target=\"_blank\" rel=\"noopener\">whole-word.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>｢is｣<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Котвите <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code> изискват граница на дума от всяка страна на <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Буквите <code>is<\/code> стоят и вътре в <code>this<\/code>, но там няма граница на дума отляво, така че машината прескача това появяване и вместо него съпоставя самостоятелната дума <code>is<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата кандидата отпечатват едно и също <code>｢is｣<\/code> — как тогава да разберете кой всъщност е съвпаднал? Променете <code>is<\/code>, скрито вътре в <code>this<\/code> — например превърнете низа в <code>'thus is fine'<\/code>. Изходът пак е <code>｢is｣<\/code>, непроменен, което доказва, че това появяване никога не е било съвпадението. Сега променете самостоятелната дума (да речем <code>'this it fine'<\/code>) и съвпадението изчезва (<code>Nil<\/code>). Можете и да попитате съвпадението къде започва: <code>('this is fine' ~~ /&lt;&lt; is &gt;&gt;/).from<\/code> връща <code>5<\/code> — позицията на самостоятелното <code>is<\/code>, а не <code>2<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
