<script type="application/json" id="page-data">{"u":"regexes/anchors","n":1038,"k":"section","pv":"regexes/alternations/exercises/http-or-https/solution","nx":"regexes/anchors/string-anchors","tr":["regexes"],"L":{"en":{"t":"Anchors","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">So far a pattern could match anywhere inside a string.<\/span> <span class=\"sg\" data-s=\"1\">An <em>anchor<\/em> does not match a character at all — instead it asserts a <strong>position<\/strong>: the start of the string, the end, or the boundary of a word.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anchors are what let you say “the string must start with this”, “the whole string must be exactly this”, or “this must be a complete word, not just part of one”.<\/span><\/p>"]]},"de":{"t":"Anker","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bisher konnte ein Muster irgendwo in einer Zeichenkette treffen.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Anker<\/em> trifft überhaupt kein Zeichen — er behauptet stattdessen eine <strong>Position<\/strong>: den Anfang der Zeichenkette, das Ende oder die Grenze eines Wortes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anker sind es, mit denen Sie sagen können „die Zeichenkette muss hiermit beginnen“, „die ganze Zeichenkette muss genau das sein“ oder „das muss ein vollständiges Wort sein, nicht bloß ein Teil eines solchen“.<\/span><\/p>"]]},"nl":{"t":"Ankers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe kon een patroon overal binnen een string matchen.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>anker<\/em> matcht helemaal geen teken — het beweert in plaats daarvan een <strong>positie<\/strong>: het begin van de string, het einde, of de grens van een woord.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ankers zijn wat je laat zeggen \"de string moet hiermee beginnen\", \"de hele string moet precies dit zijn\" of \"dit moet een volledig woord zijn, niet slechts een deel ervan\".<\/span><\/p>"]]},"es":{"t":"Anclas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora un patrón podía coincidir en cualquier punto de una cadena.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>ancla<\/em> no empareja ningún carácter: en su lugar afirma una <strong>posición<\/strong>, el principio de la cadena, el final o el límite de una palabra.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las anclas son lo que te permite decir «la cadena debe empezar por esto», «toda la cadena debe ser exactamente esto» o «esto debe ser una palabra completa, no solo parte de una».<\/span><\/p>"]]},"it":{"t":"Ancore","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora uno schema poteva corrispondere in qualunque punto di una stringa.<\/span> <span class=\"sg\" data-s=\"1\">Un'<em>ancora<\/em> non riconosce affatto un carattere: asserisce invece una <strong>posizione<\/strong> — l'inizio della stringa, la fine oppure il confine di una parola.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le ancore sono ciò che ti permette di dire «la stringa deve cominciare con questo», «l'intera stringa deve essere esattamente questo» oppure «questa deve essere una parola completa, non solo una parte di una».<\/span><\/p>"]]},"lv":{"t":"Enkuri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Līdz šim raksturs varēja sakrist jebkur virknes iekšienē. <em>Enkurs<\/em> nepiemeklē nevienu rakstzīmi — tā vietā tas apgalvo kaut ko par <strong>pozīciju<\/strong>: virknes sākumu, beigas vai vārda robežu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tieši enkuri ļauj pateikt «virknei jāsākas ar šo», «visai virknei jābūt tieši šai» vai «šim jābūt veselam vārdam, nevis tikai kāda vārda daļai».<\/span><\/p>"]]},"ru":{"t":"Якоря","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">До сих пор шаблон мог совпасть где угодно внутри строки. <em>Якорь<\/em> вообще не сопоставляет ни одного символа — вместо этого он утверждает <strong>позицию<\/strong>: начало строки, конец или границу слова.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именно якоря позволяют сказать «строка должна начинаться вот с этого», «вся строка должна быть в точности такой» или «это должно быть целым словом, а не частью другого».<\/span><\/p>"]]},"uk":{"t":"Якорі","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Досі шаблон міг зіставитися будь-де всередині рядка. <em>Якір<\/em> не зіставляється із символом узагалі — натомість він стверджує <strong>позицію<\/strong>: початок рядка, кінець або межу слова.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Саме якорі дозволяють сказати «рядок має починатися з цього», «увесь рядок має бути точно таким» або «це має бути ціле слово, а не лише його частина».<\/span><\/p>"]]},"bg":{"t":"Котви","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Досега шаблонът можеше да съвпадне където и да е вътре в низа. <em>Котвата<\/em> изобщо не съпоставя знак — вместо това тя утвърждава <strong>позиция<\/strong>: началото на низа, края или границата на дума.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Котвите са онова, което ви позволява да кажете „низът трябва да започва с това“, „целият низ трябва да е точно това“ или „това трябва да е цяла дума, а не само част от друга“.<\/span><\/p>"]]},"eo":{"t":"Ankroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun ŝablono povis kongrui ie ajn ene de ĉeno. <em>Ankro<\/em> tute ne kongruas kun signo — anstataŭe ĝi asertas <strong>pozicion<\/strong>: la komencon de la ĉeno, la finon, aŭ la limon de vorto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ankroj estas tio, kio permesas al vi diri «la ĉeno devas komenciĝi per ĉi tio», «la tuta ĉeno devas esti ekzakte ĉi tio», aŭ «ĉi tio devas esti kompleta vorto, ne nur parto de unu».<\/span><\/p>"]]},"la":{"t":"Ancorae","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Adhuc exemplar ubicumque intra catenam congruere poterat. <em>Ancora<\/em> characterem omnino non congruit — loco eius <strong>locum<\/strong> asserit: initium catenae, finem, vel terminum verbi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ancorae sunt id quod tibi permittit dicere «catena hoc incipere debet», «tota catena hoc exacte esse debet», vel «hoc verbum plenum esse debet, non solum pars unius».<\/span><\/p>"]]}}}</script>
