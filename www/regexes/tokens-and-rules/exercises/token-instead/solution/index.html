<script type="application/json" id="page-data">{"u":"regexes/tokens-and-rules/exercises/token-instead/solution","n":1121,"k":"solution","pv":"regexes/tokens-and-rules/exercises/token-instead","nx":"regexes/tokens-and-rules/exercises/spaced-rule","tr":["regexes","regexes/tokens-and-rules"],"L":{"en":{"t":"The solution of ’Regex versus token‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my regex r { \\d+ '5' }\nmy token t { \\d+ '5' }\n\nsay so '12345' ~~ / &lt;r&gt; /;\nsay so '12345' ~~ / &lt;t&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/token-instead.raku\" target=\"_blank\" rel=\"noopener\">token-instead.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">In the <code>regex<\/code>, <code>\\d+<\/code> first grabs all of <code>12345<\/code>, then <strong>backtracks<\/strong> — giving back the final <code>5<\/code> so the literal <code>5<\/code> can match. So the regex succeeds.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>token<\/code> refuses to give anything back: <code>\\d+<\/code> keeps all of <code>12345<\/code>, the literal <code>5<\/code> finds nothing left, and the token fails. This non-backtracking behaviour is exactly why <code>token<\/code> is the right default inside grammars.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Regex gegen Token","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my regex r { \\d+ '5' }\nmy token t { \\d+ '5' }\n\nsay so '12345' ~~ / &lt;r&gt; /;\nsay so '12345' ~~ / &lt;t&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/token-instead.raku\" target=\"_blank\" rel=\"noopener\">token-instead.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Im <code>regex<\/code> greift sich <code>\\d+<\/code> zuerst das ganze <code>12345<\/code> und <strong>weicht<\/strong> dann <strong>zurück<\/strong> — es gibt die letzte <code>5<\/code> her, damit die wörtliche <code>5<\/code> treffen kann. Der Regex gelingt also.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>token<\/code> weigert sich, etwas herzugeben: <code>\\d+<\/code> behält das ganze <code>12345<\/code>, die wörtliche <code>5<\/code> findet nichts mehr vor, und das Token scheitert. Genau dieses Verhalten ohne Zurückweichen macht <code>token<\/code> zur richtigen Standardwahl innerhalb von Grammatiken.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Regex versus token","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my regex r { \\d+ '5' }\nmy token t { \\d+ '5' }\n\nsay so '12345' ~~ / &lt;r&gt; /;\nsay so '12345' ~~ / &lt;t&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/token-instead.raku\" target=\"_blank\" rel= sg\" data-s=\"0\">У <code>regex<\/code> <code>\\d+<\/code> спершу захоплює все <code>12345<\/code>, а потім <strong>відкочується<\/strong> — віддає останню <code>5<\/code>, щоб літеральна <code>5<\/code> могла зіставитися. Тож регекс спрацьовує.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>token<\/code> відмовляється щось віддавати: <code>\\d+<\/code> залишає собі все <code>12345<\/code>, літеральній <code>5<\/code> не залишається нічого, і токен зазнає невдачі. Саме ця поведінка без відкочування й робить <code>token<\/code> правильним типовим вибором усередині граматик.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: regex срещу token","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my regex r { \\d+ '5' }\nmy token t { \\d+ '5' }\n\nsay so '12345' ~~ / &lt;r&gt; /;\nsay so '12345' ~~ / &lt;t&gt; /;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/token-instead.raku\" target=\"_blank\" rel=\"noopener\">token-instead.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В <code>regex<\/code> <code>\\d+<\/code> първо грабва цялото <code>12345<\/code>, а после се <strong>връща назад<\/strong> — отстъпва последната <code>5<\/code>, за да може буквалната <code>5<\/code> да съвпадне. Затова регулярният израз успява.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>token<\/code> отказва да върне каквото и да било: <code>\\d+<\/code> задържа цялото <code>12345<\/code>, за буквалната <code>5<\/code> не остава нищо и ток
