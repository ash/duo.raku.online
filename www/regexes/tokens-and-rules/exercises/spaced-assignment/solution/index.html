<script type="application/json" id="page-data">{"u":"regexes/tokens-and-rules/exercises/spaced-assignment/solution","n":1125,"k":"solution","pv":"regexes/tokens-and-rules/exercises/spaced-assignment","nx":"regexes/grammar-inheritance","tr":["regexes","regexes/tokens-and-rules"],"L":{"en":{"t":"The solution of ’A spaced assignment‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Because <code>TOP<\/code> is a <code>rule<\/code>, the spaces in the pattern allow whitespace around the <code>=<\/code> in the input.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">So <code>'x = 5'<\/code> parses. With a <code>token<\/code> for <code>TOP<\/code>, only <code>'x=5'<\/code> would match.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The whitespace a <code>rule<\/code> allows is <strong>optional<\/strong>, not required: the significant space matches <em>zero<\/em> spaces just as happily as one, so the unspaced form parses too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>rule<\/code> therefore accepts <code>'x = 5'<\/code>, <code>'x=5'<\/code>, and even <code>'x =5'<\/code> alike — flexibility without spelling out where a space may or may not go.<\/span><\/p>"]]},"de":{"t":"Lösung: Eine Zuweisung mit Leerzeichen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Weil <code>TOP<\/code> eine <code>rule<\/code> ist, lassen die Leerzeichen im Muster Leerraum um das <code>=<\/code> in der Eingabe zu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>'x = 5'<\/code> wird also zerlegt. Mit einem <code>token<\/code> für <code>TOP<\/code> würde nur <code>'x=5'<\/code> treffen.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Leerraum, den eine <code>rule<\/code> zulässt, ist <strong>wahlfrei<\/strong>, nicht vorgeschrieben: Der bedeutsame Leerraum trifft genauso bereitwillig <em>null<\/em> Leerzeichen wie eines, die Form ohne Leerzeichen wird also ebenfalls zerlegt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <code>rule<\/code> nimmt daher <code>'x = 5'<\/code>, <code>'x=5'<\/code> und sogar <code>'x =5'<\/code> gleichermaßen an — Beweglichkeit, ohne auszubuchstabieren, wo ein Leerzeichen stehen darf und wo nicht.<\/span><\/p>"]]},"nl":{"t":"Oplossing: Een toekenning met spaties","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omdat <code>TOP<\/code> een <code>rule<\/code> is, staan de spaties in het patroon witruimte om de <code>=<\/code> in de invoer toe.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dus <code>'x = 5'<\/code> wordt ontleed. Met een <code>token<\/code> voor <code>TOP<\/code> zou alleen <code>'x=5'<\/code> matchen.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De witruimte die een <code>rule<\/code> toestaat is <strong>optioneel<\/strong>, niet verplicht: de betekenisvolle spatie matcht net zo graag <em>nul<\/em> spaties als één, dus wordt de vorm zonder spaties ook ontleed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>rule<\/code> aanvaardt dus <code>'x = 5'<\/code>, <code>'x=5'< e>'x=5'<\/code> e incluso <code>'x =5'<\/code>: flexibilidad sin tener que detallar dónde puede o no haber un espacio.<\/span><\/p>"]]},"it":{"t":"Soluzione: Un'assegnazione con spazi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Poiché <code>TOP<\/code> è una <code>rule<\/code>, gli spazi nello schema permettono dello spazio bianco attorno all'<code>=<\/code> nell'input.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quindi <code>'x = 5'<\/code> viene analizzato. Con un <code>token<\/code> per <code>TOP<\/code> corrisponderebbe solo <code>'x=5'<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo spazio bianco che una <code>rule<\/code> ammette è <strong>facoltativo<\/strong>, non obbligatorio: lo spazio significativo riconosce <em>zero<\/em> spazi con la stessa disinvoltura con cui ne riconosce uno, quindi viene analizzata anche la forma senza spazi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>rule<\/code> accetta perciò allo stesso modo <code>'x = 5'<\/code>, <cod ,"ru":{"t":"Решение: Присваивание с пробелами","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поскольку <code>TOP<\/code> объявлен как <code>rule<\/code>, пробелы в шаблоне разрешают пробельные символы вокруг <code>=<\/code> во вводе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поэтому <code>'x = 5'<\/code> разбирается. Будь <code>TOP<\/code> объявлен как <code>token<\/code>, подошло бы только <code>'x=5'<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пробелы, которые разрешает <code>rule<\/code>, <strong>необязательны<\/strong>, а не обязательны: значимый пробел с тем же успехом сопоставляется и с <em>нулём<\/em> пробелов, поэтому запись без пробелов тоже разбирается:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Таким образом, <code>rule<\/code> одинаково принимает и <code>'x = 5'<\/code>, и <code>'x=5'<\/code>, и даже <code>'x =5'<\/code> — гибкость без необходимости расписывать, где пробел может стоять, а где нет.<\/span><\/p>"]]},"uk":{"t":"Розв'язання вправи «Присвоєння з пробілами»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оскільки <code>TOP<\/code> є <code>rule<\/code>, пробіли в шаблоні дозволяють пробільні символи навколо <code>=<\/code> у вхідному тексті.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тож <code>'x = 5'<\/code> розбирається. Якби <code>TOP<\/code> був <code>token<\/code>, підійшло б лише <code>'x=5'<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пробіли, які дозволяє <code>rule<\/code>, є <strong>необов'язковими<\/strong>, а не обов'язковими: значущий пробіл так само радо зіставляється з <em>нулем<\/em> пробілів, як і з одним, тож форма без пробілів теж розбирається:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тому <code>rule<\/code> однаково приймає і <code>'x = 5'<\/code>, і <code>'x=5'<\/code>, і навіть <code>'x =5'<\/code> — гнучкість без потреби розписувати, де саме пробіл може бути, а де ні.<\/span><\/p>"]]},"bg":{"t":"Решение: Присвояване с интервали","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Понеже <code>TOP<\/code> е <code>rule<\/code>, интервалите в шаблона позволяват празни знаци около <code>=<\/code> във входа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Затова <code>'x = 5'<\/code> се разбира. Ако <code>TOP<\/code> беше <code>token<\/code>, щеше да съвпадне само <code>'x=5'<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Интервалите, които <code>rule<\/code> позволява, са <strong>незадължителни<\/strong>, а не задължителни: значещият интервал съпоставя <em>нула<\/em> интервала също толкова радушно, колкото и един, така че формата без интервали също се разбира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Затова <code>rule<\/code> приема еднакво <code>'x = 5'<\/code>, <code>'x=5'<\/code> и дори <code>'x =5'<\/code> — гъвкавост, без да се разписва къде точно може и къде не може да има интервал.<\/span><\/p>"]]},"eo":{"t":"Solvo: Valorizo kun spacoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉar <code>TOP<\/code> estas <code>rule<\/code>, la spacoj en la ŝablono permesas blankspacon ĉirkaŭ la <code>=<\/code> en la enigo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Do <code>'x = 5'<\/code> analiziĝas. Kun <code>token<\/code> por <code>TOP<\/code>, nur <code>'x=5'<\/code> kongruus.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La blankspaco, kiun <code>rule<\/code> permesas, estas <strong>nedeviga<\/strong>, ne postulata: la signifa spaco kongruas kun <em>nul<\/em> spacoj same volonte kiel kun unu, do la sen-spaca formo ankaŭ analiziĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>rule<\/code> do akceptas <code>'x = 5'<\/code>, <code>'x=5'<\/code> kaj eĉ <code>'x =5'<\/code> egale — fleksebleco sen literumi, kie spaco rajtas aŭ ne rajtas esti.<\/span><\/p>"]]},"la":{"t":"Solutio: Assignatio cum spatiis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius exercitationis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Assign {\n    rule TOP    { &lt;key&gt; '=' &lt;value&gt; }\n    token key   { \\w+ }\n    token value { \\w+ }\n}\n\nsay Assign.parse('x = 5').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-assignment.raku\" target=\"_blank\" rel=\"noopener\">spaced-assignment.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quia <code>TOP<\/code> <code>rule<\/code> est, spatia in exemplari spatium album circa <code>=<\/code> in introitu permittunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Itaque <code>'x = 5'<\/code> analysatur. Cum <code>token<\/code> pro <code>TOP<\/code>, sola <code>'x=5'<\/code> congrueret.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Spatium album quod <code>rule<\/code> permittit <strong>optionale<\/strong> est, non necessarium: spatium significans <em>nulla<\/em> spatia tam libenter congruit quam unum, itaque forma sine spatiis quoque analysatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Assign.parse('x=5').defined; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> ideo <code>'x = 5'<\/code>, <code>'x=5'<\/code>, et etiam <code>'x =5'<\/code> pariter accipit — flexibilitas sine eo quod explices ubi spatium esse possit vel non.<\/span><\/p>"]]}}}</script>
