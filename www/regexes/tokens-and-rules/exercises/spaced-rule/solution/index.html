pan><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поскольку <code>TOP<\/code> объявлен как <code>rule<\/code>, каждый пробел, записанный между вызовами <code>&lt;word&gt;<\/code>, требует пробельного символа во вводе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В строке <code>'the quick fox'<\/code> пробелы стоят между всеми тремя словами, поэтому она разбирается. Будь <code>TOP<\/code> объявлен как <code>token<\/code>, пробелы в шаблоне игнорировались бы и разбор не удался бы.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання вправи «Правило з пробілами»","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих розв'язань задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    rule TOP   { &lt;word&gt; &lt;word&gt; &lt;word&gt; }\n    token word { \\w+ }\n}\n\nsay Phrase.parse('the quick fox').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-rule.raku\" target=\"_blank\" rel=\"noopener\">spaced-rule.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оскільки <code>TOP<\/code> є <code>rule<\/code>, кожен пробіл, записаний між викликами <code>&lt;word&gt;<\/code>, вимагає пробільного символу у вхідному тексті.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У рядку <code>'the quick fox'<\/code> пробіли стоять між усіма трьома словами, тож він розбирається. Якби <code>TOP<\/code> був <code>token<\/code>, пробіли в шаблоні ігнорувалися б, і розбір зазнав би невдачі.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Правило с интервали","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>grammar Phrase {\n    rule TOP   { &lt;word&gt; &lt;word&gt; &lt;word&gt; }\n    token word { \\w+ }\n}\n\nsay Phrase.parse('the quick fox').defined;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/regexes/tokens-and-rules/spaced-rule.raku\" target=\"_blank\" rel=\"noopener\">spaced-rule.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Понеже <code>TOP<\/code> е <code>rule<\/code>, всеки интервал, записан между извикванията на <code>&lt;word&gt;<\/code>, изисква празен знак във входа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Низът <code>'the quick fox'<\/code> има интервали между трите думи, така че се разбира. Ако <code>TOP<\/code> беше <code>token<\/code>, интервалите в шаблона щяха да се пренебрегнат и разборът щеше да се провали.<\/span><\/li><\/ol>"]]}}}</script>
