<script type="application/json" id="page-data">{"u":"regexes/tokens-and-rules/rule-sigspace","n":1117,"k":"topic","pv":"regexes/tokens-and-rules/three-kinds/quiz","nx":"regexes/tokens-and-rules/rule-sigspace/quiz","tr":["regexes","regexes/tokens-and-rules"],"L":{"en":{"t":"Significant space in rules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <code>rule<\/code> is a <code>token<\/code> with one extra feature switched on: <code>:sigspace<\/code> (significant space), exactly the <code>:s<\/code> adverb.<\/span> <span class=\"sg\" data-s=\"1\">It turns the whitespace you write in the pattern into an automatic whitespace matcher between the parts.<\/span> <span class=\"sg\" data-s=\"2\">That is what you want whenever the text you parse has spaces between its pieces.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Compare the two.<\/span> <span class=\"sg\" data-s=\"1\">In a <code>token<\/code>, whitespace in the pattern is <strong>ignored<\/strong>, so <code>&lt;first&gt; &lt;second&gt;<\/code> asks for the two parts with nothing between them.<\/span> <span class=\"sg\" data-s=\"2\">Since <code>\\w+<\/code> stops at the space, a spaced input has no match:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You <em>can<\/em> accept the space in a <code>token<\/code> — you just have to match it yourself, for example with <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # now 'foo bar' parses<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>rule<\/code> inserts that whitespace matching for you, so simply writing a space between the parts is enough:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A common pattern is to use <code>rule<\/code> for the higher-level structure — where the parts are separated by spaces — and <code>token<\/code> for the small pieces like names and numbers, which contain no spaces.<\/span> <span class=\"sg\" data-s=\"1\">That keeps your grammar both correct and easy to read.<\/span><\/p>"]]},"de":{"t":"Bedeutsame Leerzeichen in Rules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine <code>rule<\/code> ist ein <code>token<\/code> mit einer zusätzlich eingeschalteten Möglichkeit: <code>:sigspace<\/code> (bedeutsamer Leerraum), genau dem Adverb <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es verwandelt den Leerraum, den Sie im Muster schreiben, in einen selbsttätigen Leerraum-Treffer zwischen den Teilen.<\/span> <span class=\"sg\" data-s=\"2\">Genau das wollen Sie, wann immer der zu zerlegende Text Leerzeichen zwischen seinen Stücken hat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vergleichen Sie beides.<\/span> <span class=\"sg\" data-s=\"1\">In einem <code>token<\/code> wird Leerraum im Muster <strong>übergangen<\/strong>, <code>&lt;first&gt; &lt;second&gt;<\/code> verlangt also die beiden Teile ohne irgendetwas dazwischen.<\/span> <span class=\"sg\" data-s=\"2\">Da <code>\\w+<\/code> am Leerzeichen anhält, trifft eine Eingabe mit Leerzeichen nicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie <em>können<\/em> das Leerzeichen in einem <code>token<\/code> annehmen — Sie müssen es nur selbst treffen, etwa mit <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # now 'foo bar' parses<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine <code>rule<\/code> fügt dieses Leerraum-Treffen für Sie ein, ein schlichtes Leerzeichen zwischen den Teilen genügt also:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein verbreitetes Vorgehen ist, <code>rule<\/code> für den übergeordneten Aufbau zu nehmen — wo die Teile durch Leerzeichen getrennt sind — und <code>token<\/code> für die kleinen Stücke wie Namen und Zahlen, die keine Leerzeichen enthalten.<\/span> <span class=\"sg\" data-s=\"1\">Das hält Ihre Grammatik zugleich richtig und gut lesbar.<\/span><\/p>"]]},"nl":{"t":"Betekenisvolle spaties in rules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <code>rule<\/code> is een <code>token<\/code> met één extra mogelijkheid aangezet: <code>:sigspace<\/code> (significante spatie), precies het bijwoord <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het maakt van de witruimte die je in het patroon schrijft een automatische witruimtematcher tussen de delen.<\/span> <span class=\"sg\" data-s=\"2\">Dat is wat je wilt zodra de tekst die je ontleedt spaties tussen haar stukken heeft.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vergelijk de twee.<\/span> <span class=\"sg\" data-s=\"1\">In een <code>token<\/code> wordt witruimte in het patroon <strong>genegeerd<\/strong>, dus vraagt <code>&lt;first&gt; &lt;second&gt;<\/code> om de twee delen zonder iets ertussen.<\/span> <span class=\"sg\" data-s=\"2\">Omdat <code>\\w+<\/code> bij de spatie stopt, matcht een invoer met spatie niet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je <em>kunt<\/em> de spatie in een <code>token<\/code> accepteren — je moet hem alleen zelf matchen, bijvoorbeeld met <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # now 'foo bar' parses<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>rule<\/code> voegt dat witruimtematchen voor je in, dus is eenvoudig een spatie tussen de delen schrijven al genoeg:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een gebruikelijk patroon is <code>rule<\/code> gebruiken voor de structuur op hoger niveau — waar de delen door spaties gescheiden zijn — en <code>token<\/code> voor de kleine stukjes als namen en getallen, die geen spaties bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Zo blijft je grammatica zowel correct als goed leesbaar.<\/span><\/p>"]]},"es":{"t":"Espacios significativos en las reglas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una <code>rule<\/code> es un <code>token<\/code> con una funcionalidad más activada: <code>:sigspace<\/code> (espacio significativo), exactamente el adverbio <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Convierte el espacio en blanco que escribes en el patrón en un emparejador automático de espacio en blanco entre las partes.<\/span> <span class=\"sg\" data-s=\"2\">Eso es lo que quieres siempre que el texto que analizas tenga espacios entre sus piezas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Compara ambos.<\/span> <span class=\"sg\" data-s=\"1\">En un <code>token<\/code>, el espacio en blanco del patrón se <strong>ignora<\/strong>, así que <code>&lt;first&gt; &lt;second&gt;<\/code> pide las dos partes sin nada en medio.<\/span> <span class=\"sg\" data-s=\"2\">Como <code>\\w+<\/code> se detiene en el espacio, una entrada con espacios no encuentra coincidencia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Puedes<\/em> aceptar el espacio en un <code>token<\/code>: solo tienes que emparejarlo tú mismo, por ejemplo con <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # now 'foo bar' parses<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una <code>rule<\/code> inserta ese emparejamiento de espacio en blanco por ti, así que basta con escribir un espacio entre las partes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un patrón habitual es usar <code>rule<\/code> para la estructura de nivel superior — donde las partes están separadas por espacios — y <code>token<\/code> para las piezas pequeñas como nombres y números, que no contienen espacios.<\/span> <span class=\"sg\" data-s=\"1\">Eso mantiene tu gramática a la vez correcta y fácil de leer.<\/span><\/p>"]]},"it":{"t":"Spazi significativi nelle regole","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una <code>rule<\/code> è un <code>token<\/code> con una funzionalità in più accesa: <code>:sigspace<\/code> (spazio significativo), esattamente l'avverbio <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Trasforma lo spazio bianco che scrivi nello schema in un riconoscitore automatico di spazio bianco fra le parti.<\/span> <span class=\"sg\" data-s=\"2\">È quello che vuoi ogni volta che il testo da analizzare ha spazi fra i suoi pezzi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Confronta i due.<\/span> <span class=\"sg\" data-s=\"1\">In un <code>token<\/code> lo spazio bianco nello schema viene <strong>ignorato<\/strong>, quindi <code>&lt;first&gt; &lt;second&gt;<\/code> chiede le due parti senza nulla in mezzo.<\/span> <span class=\"sg\" data-s=\"2\">Poiché <code>\\w+<\/code> si ferma allo spazio, un input spaziato non trova corrispondenza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Puoi<\/em> accettare lo spazio in un <code>token<\/code>: devi solo riconoscerlo tu, per esempio con <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # now 'foo bar' parses<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una <code>rule<\/code> inserisce quel riconoscimento dello spazio bianco al posto tuo, quindi basta scrivere uno spazio fra le parti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uno schema comune è usare <code>rule<\/code> per la struttura di livello più alto — dove le parti sono separate da spazi — e <code>token<\/code> per i pezzi piccoli come nomi e numeri, che non contengono spazi.<\/span> <span class=\"sg\" data-s=\"1\">Così la tua grammatica resta insieme corretta e facile da leggere.<\/span><\/p>"]]},"ru":{"t":"Значимые пробелы в правилах","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> — это <code>token<\/code> с одной дополнительно включённой возможностью: <code>:sigspace<\/code> (значимый пробел), ровно то же, что наречие <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оно превращает пробелы, которые вы пишете в шаблоне, в автоматическое сопоставление пробельных символов между частями.<\/span> <span class=\"sg\" data-s=\"2\">Именно это и нужно всякий раз, когда в разбираемом тексте между кусочками есть пробелы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сравните два варианта.<\/span> <span class=\"sg\" data-s=\"1\">В <code>token<\/code> пробелы в шаблоне <strong>игнорируются<\/strong>, поэтому <code>&lt;first&gt; &lt;second&gt;<\/code> требует две части подряд, без ничего между ними.<\/span> <span class=\"sg\" data-s=\"2\">А так как <code>\\w+<\/code> останавливается на пробеле, для ввода с пробелом совпадения нет:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Принять пробел в <code>token<\/code> <em>можно<\/em> — просто сопоставьте его сами, например через <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # теперь 'foo bar' разбирается<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> вставляет это сопоставление пробелов за вас, поэтому достаточно просто написать пробел между частями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Распространённый приём — брать <code>rule<\/code> для структуры верхнего уровня, где части разделены пробелами, и <code>token<\/code> для мелких кусочков вроде имён и чисел, внутри которых пробелов нет.<\/span> <span class=\"sg\" data-s=\"1\">Так грамматика остаётся и правильной, и удобочитаемой.<\/span><\/p>"]]},"uk":{"t":"Значущий пробіл у правилах","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> — це <code>token<\/code> з однією додатково увімкненою можливістю: <code>:sigspace<\/code> (значущий пробіл), тобто рівно прислівник <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він перетворює пробіли, які ви пишете в шаблоні, на автоматичне зіставлення з пробільними символами між частинами.<\/span> <span class=\"sg\" data-s=\"2\">Саме це вам потрібно щоразу, коли текст, який ви розбираєте, має пробіли між своїми шматками.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Порівняймо обидва варіанти.<\/span> <span class=\"sg\" data-s=\"1\">У <code>token<\/code> пробіли в шаблоні <strong>ігноруються<\/strong>, тож <code>&lt;first&gt; &lt;second&gt;<\/code> вимагає, щоб дві частини стояли без нічого між ними.<\/span> <span class=\"sg\" data-s=\"2\">Оскільки <code>\\w+<\/code> зупиняється на пробілі, вхід із пробілом не дає збігу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прийняти пробіл у <code>token<\/code> <em>можна<\/em> — просто вам доведеться зіставитися з ним самотужки, наприклад за допомогою <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # тепер 'foo bar' розбирається<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> вставляє це зіставлення з пробілами за вас, тож достатньо просто написати пробіл між частинами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поширений підхід — використовувати <code>rule<\/code> для структури вищого рівня, де частини розділені пробілами, і <code>token<\/code> для дрібних шматків на кшталт імен та чисел, які пробілів не містять.<\/span> <span class=\"sg\" data-s=\"1\">Це робить вашу граматику і правильною, і легкою для читання.<\/span><\/p>"]]},"bg":{"t":"Значещи интервали в правилата","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> е <code>token<\/code> с една допълнително включена възможност: <code>:sigspace<\/code> (значещ интервал), тоест точно наречието <code>:s<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То превръща интервалите, които пишете в шаблона, в автоматично съпоставяне на празни знаци между частите.<\/span> <span class=\"sg\" data-s=\"2\">Точно това искате винаги, когато текстът, който разбирате, има интервали между парчетата си.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сравнете двете.<\/span> <span class=\"sg\" data-s=\"1\">В <code>token<\/code> интервалите в шаблона се <strong>пренебрегват<\/strong>, така че <code>&lt;first&gt; &lt;second&gt;<\/code> иска двете части без нищо между тях.<\/span> <span class=\"sg\" data-s=\"2\">Понеже <code>\\w+<\/code> спира на интервала, вход с интервал не дава съвпадение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithToken {\n    token TOP    { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithToken.parse('foo bar').defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Можете<\/em> да приемете интервала и в <code>token<\/code> — просто трябва да го съпоставите сами, например с <code>\\s+<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>token TOP { &lt;first&gt; \\s+ &lt;second&gt; }      # сега 'foo bar' се разбира<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> вмъква това съпоставяне на празни знаци вместо вас, така че е достатъчно просто да напишете интервал между частите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>grammar WithRule {\n    rule TOP     { &lt;first&gt; &lt;second&gt; }\n    token first  { \\w+ }\n    token second { \\w+ }\n}\n\nsay WithRule.parse('foo bar').defined; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Често срещан подход е <code>rule<\/code> да се използва за структурата от по-високо ниво — където частите са разделени с интервали — и <code>token<\/code> за дребните парчета като имена и числа, които не съдържат интервали.<\/span> <span class=\"sg\" data-s=\"1\">Това държи граматиката ви и правилна, и лесна за четене.<\/span><\/p>"]]}}}</script>
