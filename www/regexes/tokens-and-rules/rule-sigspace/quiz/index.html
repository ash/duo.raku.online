<script type="application/json" id="page-data">{"u":"regexes/tokens-and-rules/rule-sigspace/quiz","n":1118,"k":"quiz","pv":"regexes/tokens-and-rules/rule-sigspace","nx":"regexes/tokens-and-rules/exercises","tr":["regexes","regexes/tokens-and-rules","regexes/tokens-and-rules/rule-sigspace"],"L":{"en":{"t":"Quiz — Tokens and rules","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Which keyword should you use for a named pattern that must match <strong>whitespace<\/strong> between its parts, the way it is written in the pattern?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>rule<\/code> is a <code>token<\/code> with significant whitespace turned on, so the spaces written between its parts must appear in the input.<\/span> <span class=\"sg\" data-s=\"1\">A plain <code>token<\/code> ignores those spaces, and <code>regex<\/code> does too (while also backtracking).<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Tokens und Rules","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welches Schlüsselwort nehmen Sie für ein benanntes Muster, das <strong>Leerraum<\/strong> zwischen seinen Teilen treffen muss, so wie er im Muster geschrieben steht?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <code>rule<\/code> ist ein <code>token<\/code> mit eingeschaltetem bedeutsamem Leerraum, die zwischen ihren Teilen geschriebenen Leerzeichen müssen also in der Eingabe vorkommen.<\/span> <span class=\"sg\" data-s=\"1\">Ein schlichtes <code>token<\/code> übergeht diese Leerzeichen, und <code>regex<\/code> tut das ebenfalls (und weicht zusätzlich zurück).<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Tokens en rules","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welk sleutelwoord gebruik je voor een benoemd patroon dat <strong>witruimte<\/strong> tussen zijn delen moet matchen, zoals die in het patroon geschreven staat?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>rule<\/code> is een <code>token<\/code> met betekenisvolle witruimte aangezet, dus de spaties die tussen zijn delen geschreven staan moeten in de invoer voorkomen.<\/span> <span class=\"sg\" data-s=\"1\">Een gewone <code>token<\/code> negeert die spaties, en <code>regex<\/code> ook (terwijl die bovendien terugkrabbelt).<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Tokens y reglas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué palabra clave deberías usar para un patrón con nombre que tiene que emparejar <strong>espacio en blanco<\/strong> entre sus partes, tal como está escrito en el patrón?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <code>rule<\/code> es un <code>token<\/code> con el espacio en blanco significativo activado, así que los espacios escritos entre sus partes tienen que aparecer en la entrada.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>token<\/code> a secas ignora esos espacios, y <code>regex<\/code> también (además de retroceder).<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Token e regole","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quale parola chiave dovresti usare per uno schema con nome che deve riconoscere lo <strong>spazio bianco<\/strong> fra le sue parti, così come è scritto nello schema?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <code>rule<\/code> è un <code>token<\/code> con lo spazio bianco significativo acceso, quindi gli spazi scritti fra le sue parti devono comparire nell'input.<\/span> <span class=\"sg\" data-s=\"1\">Un semplice <code>token<\/code> ignora quegli spazi, e anche <code>regex<\/code> fa lo stesso (oltre a tornare sui propri passi).<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Marķieri un likumi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kuru atslēgvārdu izmantot nosauktam raksturam, kam starp savām daļām jāsakrīt ar <strong>atstarpi<\/strong> tā, kā tas uzrakstīts raksturā?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> ir <code>token<\/code> ar ieslēgtām nozīmīgām atstarpēm, tāpēc atstarpēm, kas uzrakstītas starp tā daļām, jāparādās ievadē.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršs <code>token<\/code> šīs atstarpes ignorē, un <code>regex<\/code> arī (turklāt vēl atkāpjas).<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Токены и правила","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какое ключевое слово стоит взять для именованного шаблона, который должен сопоставлять <strong>пробельные символы<\/strong> между своими частями — так, как это записано в шаблоне?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> — это <code>token<\/code> с включёнными значимыми пробелами, поэтому пробелы, записанные между его частями, должны присутствовать во вводе.<\/span> <span class=\"sg\" data-s=\"1\">Обычный <code>token<\/code> эти пробелы игнорирует, как и <code>regex<\/code> (который вдобавок возвращается назад).<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Токени та правила","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Яке ключове слово слід використати для іменованого шаблону, що має зіставлятися з <strong>пробільними символами<\/strong> між своїми частинами так, як це записано в шаблоні?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> — це <code>token<\/code> з увімкненими значущими пробілами, тож пробіли, записані між його частинами, мають бути присутні у вхідному тексті.<\/span> <span class=\"sg\" data-s=\"1\">Звичайний <code>token<\/code> ці пробіли ігнорує, і <code>regex<\/code> теж (до того ж він ще й відкочується).<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Токени и правила","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Коя ключова дума трябва да използвате за именуван шаблон, който трябва да съпоставя <strong>празни знаци<\/strong> между частите си, така както е записано в шаблона?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> е <code>token<\/code> с включени значещи интервали, така че интервалите, записани между частите му, трябва да присъстват във входа.<\/span> <span class=\"sg\" data-s=\"1\">Обикновеният <code>token<\/code> ги пренебрегва, а <code>regex<\/code> — също (при това и се връща назад).<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Ĵetonoj kaj reguloj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiun ŝlosilvorton vi uzu por nomita ŝablono, kiu devas kongrui kun <strong>blankspaco<\/strong> inter siaj partoj, tiel kiel ĝi estas skribita en la ŝablono?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> estas <code>token<\/code> kun signifa blankspaco ŝaltita, do la spacoj skribitaj inter ĝiaj partoj devas aperi en la enigo.<\/span> <span class=\"sg\" data-s=\"1\">Simpla <code>token<\/code> ignoras tiujn spacojn, kaj <code>regex<\/code> ankaŭ (dum ĝi ankaŭ retropaŝas).<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Tesserae et regulae","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quo verbo clavis uti debes pro exemplari nominato quod <strong>spatium album<\/strong> inter partes suas congruere debet, eo modo quo in exemplari scriptum est?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>grammar<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>rule<\/code> est <code>token<\/code> cum spatio significante accenso, itaque spatia inter partes eius scripta in introitu apparere debent.<\/span> <span class=\"sg\" data-s=\"1\">Simplex <code>token<\/code> illa spatia neglegit, et <code>regex<\/code> quoque (dum etiam retro cedit).<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
