<script type="application/json" id="page-data">{"u":"regexes/tokens-and-rules/three-kinds/quiz","n":1116,"k":"quiz","pv":"regexes/tokens-and-rules/three-kinds","nx":"regexes/tokens-and-rules/rule-sigspace","tr":["regexes","regexes/tokens-and-rules","regexes/tokens-and-rules/three-kinds"],"L":{"en":{"t":"Quiz — Backtracking","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Which of the three keywords declares a named pattern that <strong>backtracks<\/strong>, like the patterns written between slashes?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none of them<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>regex<\/code> backtracks.<\/span> <span class=\"sg\" data-s=\"1\">Both <code>token<\/code> and <code>rule<\/code> are ratcheting — they do not give back characters once matched — which is why they are the right default inside grammars.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Zurückweichen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welches der drei Schlüsselwörter deklariert ein benanntes Muster, das <strong>zurückweicht<\/strong>, wie die zwischen Schrägstrichen geschriebenen Muster?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">keines davon<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>regex<\/code> weicht zurück.<\/span> <span class=\"sg\" data-s=\"1\">Sowohl <code>token<\/code> als auch <code>rule<\/code> arbeitet mit einer Sperrklinke — sie geben einmal getroffene Zeichen nicht wieder her —, weshalb sie innerhalb von Grammatiken die richtige Standardwahl sind.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Terugkrabbelen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welk van de drie sleutelwoorden declareert een benoemd patroon dat <strong>terugkrabbelt<\/strong>, zoals de patronen tussen schuine strepen?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">geen van alle<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>regex<\/code> krabbelt terug.<\/span> <span class=\"sg\" data-s=\"1\">Zowel <code>token<\/code> als <code>rule<\/code> werkt met een ratel — ze geven eenmaal gematchte tekens niet terug — en daarom zijn ze de juiste standaardkeuze binnen grammatica's.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Retroceso","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Cuál de las tres palabras clave declara un patrón con nombre que <strong>retrocede<\/strong>, como los patrones escritos entre barras?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ninguna de ellas<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>regex<\/code> retrocede.<\/span> <span class=\"sg\" data-s=\"1\">Tanto <code>token<\/code> como <code>rule<\/code> son de trinquete — no devuelven los caracteres una vez emparejados —, y por eso son la opción adecuada por omisión dentro de las gramáticas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Backtracking","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quale delle tre parole chiave dichiara uno schema con nome che <strong>torna sui propri passi<\/strong>, come gli schemi scritti fra barre?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nessuna di esse<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>regex<\/code> torna sui propri passi.<\/span> <span class=\"sg\" data-s=\"1\">Sia <code>token<\/code> sia <code>rule<\/code> sono a cricchetto — non restituiscono i caratteri una volta riconosciuti — ed è per questo che sono la scelta predefinita giusta dentro le grammatiche.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Atkāpšanās","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kurš no trim atslēgvārdiem deklarē nosauktu raksturu, kas <strong>atkāpjas<\/strong>, tāpat kā raksturi, kas rakstīti starp slīpsvītrām?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><sp /code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">жодне з них<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>regex<\/code> відкочується.<\/span> <span class=\"sg\" data-s=\"1\">І <code>token<\/code>, і <code>rule<\/code> працюють «із храповиком» — вони не віддають символи назад, коли ті вже зіставлені, — і саме тому вони є правильним типовим вибором усередині граматик.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Връщане назад","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Коя от трите ключови думи декларира именуван шаблон, който се <strong>връща назад<\/strong>, като шаблоните, записани между наклонени черти?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">никоя от тях<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>regex<\/code> се връща назад.<\/span> <span class=\"sg\" data-s=\"1\">И <code>token<\/code>, и <code>rule<\/code> работят „с тресчотка“ — те не връщат знаци, след като веднъж са ги съпоставили, — и точно затова са правилният избор по подразбиране вътре в граматиките.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Retropaŝado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiu el la tri ŝlosilvortoj deklaras nomitan ŝablonon, kiu <strong>retropaŝas<\/strong>, kiel la ŝablonoj skribitaj inter oblikvoj?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">neniu el ili<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>regex<\/code> retropaŝas.<\/span> <span class=\"sg\" data-s=\"1\">Kaj <code>token<\/code> kaj <code>rule<\/code> estas kliketaj — ili ne redonas signojn post kiam ili estas kongruitaj — kial ili estas la ĝusta defaŭlto ene de gramatikoj.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Regressio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quod ex tribus verbis clavis exemplar nominatum declarat quod <strong>retro cedit<\/strong>, sicut exemplaria inter lineolas obliquas scripta?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>regex<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>token<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>rule<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nullum eorum<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>regex<\/code> retro cedit.<\/span> <span class=\"sg\" data-s=\"1\">Et <code>token<\/code> et <code>rule<\/code> sunt retinacula — litteras semel congruentes non reddunt — quapropter electio praedefinita recta intra grammaticas sunt.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
