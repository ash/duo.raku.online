ng, doch für Grammatiken ist es genau richtig: Jedes Token soll eine saubere Sache treffen und sich darauf festlegen.<\/span> <span class=\"sg\" data-s=\"1\">Das macht das Zerlegen schneller und das Ergebnis vorhersagbar.<\/span> <span class=\"sg\" data-s=\"2\">**Nehmen Sie standardmäßig <code>token<\/code>**; greifen Sie nur zu <code>regex<\/code>, wenn Sie das Zurückweichen wirklich brauchen — und das ist selten.<\/span><\/p>"]]},"nl":{"t":"regex, token en rule","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De drie sleutelwoorden bouwen op elkaar voort:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>regex<\/code> — krabbelt terug, zoals de patronen in <code>/ … /<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>token<\/code> — krabbelt <strong>niet<\/strong> terug<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>rule<\/code> — als <code>token<\/code>, maar spaties in het patroon zijn betekenisvol<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Terugkrabbelen<\/em> (backtracking) betekent dat de engine, wanneer een later deel van het patroon mislukt, teruggaat en voor een eerder deel een kortere match probeert.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>regex<\/code> doet dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex r { \\w+ 'b' }\nsay so 'aaab' ~~ / &lt;r&gt; /; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>\\w+<\/code> grijpt eerst heel <code>aaab<\/code>, en moet dan de laatste <code>b<\/code> teruggeven zodat de letterlijke <code>b<\/code> kan matchen.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>token<\/code> weigert iets terug te geven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my token t { \\w+ 'b' }\nsay so 'aaab' ~~ / &lt;t&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier neemt <code>\\w+<\/code> heel <code>aaab<\/code>, vindt de letterlijke <code>b<\/code> niets meer, en mislukt code> hoc agit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my regex r { \\w+ 'b' }\nsay so 'aaab' ~~ / &lt;r&gt; /; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>\\w+<\/code> primum totum <code>aaab<\/code> rapit, deinde ultimam <code>b<\/code> reddere debet ut litterale <code>b<\/code> congruere possit.<\/span> <span class=\"sg\" data-s=\"1\"><code>token<\/code> nihil reddere recusat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my token t { \\w+ 'b' }\nsay so 'aaab' ~~ / &lt;t&gt; /; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic <code>\\w+<\/code> totum <code>aaab<\/code> capit, litterale <code>b<\/code> nihil reliquum invenit, et tessera simpliciter deficit loco eius quod retro cedat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc limitatio videtur, sed pro grammaticis exacte est quod vis: unaquaeque tessera unam rem mundam congruere et ei adhaerere debet.<\/span> <span class=\"sg\" data-s=\"1\">Hoc analysin celeriorem et effectum praedicibilem reddit.<\/span> <span class=\"sg\" data-s=\"2\">**Utere <code>token<\/code> ex more**; ad <code>regex<\/code> pete solum illis raris occasionibus cum regressione vere eges.<\/span><\/p>"]]}}}</script>
