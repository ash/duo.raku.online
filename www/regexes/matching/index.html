<script type="application/json" id="page-data">{"u":"regexes/matching","n":984,"k":"section","pv":"regexes/literals/exercises/first-non-digit/solution","nx":"regexes/matching/smartmatch","tr":["regexes"],"L":{"en":{"t":"Matching strings","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the previous section you wrote patterns and tested them with the smartmatch operator <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This section looks more closely at what that operator gives you back: a <em>match object<\/em> that carries all the information about what was found and where.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You will also see the different ways of writing a regex, and how to ask the simple yes-or-no question “did the string match at all?”.<\/span><\/p>"]]},"de":{"t":"Zeichenketten treffen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im vorigen Abschnitt haben Sie Muster geschrieben und sie mit dem Smartmatch-Operator <code>~~<\/code> geprüft.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet genauer, was dieser Operator Ihnen zurückgibt: ein <em>Match-Objekt<\/em>, das alle Informationen darüber trägt, was gefunden wurde und wo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie sehen außerdem die verschiedenen Schreibweisen eines Regex und wie man die schlichte Ja-oder-Nein-Frage stellt: „Hat die Zeichenkette überhaupt getroffen?“.<\/span><\/p>"]]},"nl":{"t":"Strings matchen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In de vorige sectie schreef je patronen en testte je ze met de smartmatch-operator <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie bekijkt nauwkeuriger wat die operator je teruggeeft: een <em>matchobject<\/em> dat alle informatie draagt over wat er gevonden is en waar.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je ziet ook de verschillende manieren om een regex te schrijven, en hoe je de eenvoudige ja-of-nee-vraag stelt: \"matchte de string überhaupt?\".<\/span><\/p>"]]},"es":{"t":"Emparejar cadenas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la sección anterior escribiste patrones y los comprobaste con el operador de emparejamiento inteligente <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección examina más de cerca lo que ese operador te devuelve: un <em>objeto de coincidencia<\/em> que lleva consigo toda la información sobre qué se encontró y dónde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También verás las distintas formas de escribir un regex y cómo hacer la sencilla pregunta de sí o no: «¿coincidió la cadena?».<\/span><\/p>"]]},"it":{"t":"Riconoscere le stringhe","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella sezione precedente hai scritto schemi e li hai messi alla prova con l'operatore smartmatch <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione guarda più da vicino ciò che quell'operatore ti restituisce: un <em>oggetto match<\/em> che porta con sé tutte le informazioni su che cosa è stato trovato e dove.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vedrai anche i diversi modi di scrivere un regex e come porre la semplice domanda sì-o-no «la stringa ha corrisposto?».<\/span><\/p>"]]},"lv":{"t":"Virkņu saskaņošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējā sadaļā jūs rakstījāt raksturus un pārbaudījāt tos ar gudrās sakritības operatoru <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa tuvāk aplūko, ko šis operators atdod: <em>sakritības objektu<\/em>, kas nes visu informāciju par to, kas atrasts un kur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Redzēsiet arī dažādos veidus, kā uzrakstīt regulāro izteiksmi, un to, kā uzdot vienkāršo jā vai nē jautājumu: «vai virkne vispār sakrita?».<\/span><\/p>"]]},"ru":{"t":"Сопоставление строк","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В предыдущем разделе вы писали шаблоны и проверяли их оператором умного сопоставления <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе мы внимательнее посмотрим на то, что этот оператор возвращает: <em>объект совпадения<\/em>, несущий всю информацию о том, что и где было найдено.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы также увидите разные способы записи регулярного выражения и узнаете, как задать простой вопрос «да или нет»: совпала ли строка вообще?<\/span><\/p>"]]},"uk":{"t":"Зіставлення рядків","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У попередньому розділі ви писали шаблони й перевіряли їх оператором розумного зіставлення <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ пильніше розглядає те, що цей оператор вам повертає: <em>об'єкт збігу<\/em>, який несе всі відомості про те, що знайдено й де.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також побачите різні способи запису регекса й те, як поставити просте запитання «так чи ні»: чи взагалі рядок збігся?<\/span><\/p>"]]},"bg":{"t":"Съпоставяне на низове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В предишния раздел писахте шаблони и ги проверявахте с оператора за интелигентно съпоставяне <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда по-отблизо какво връща този оператор: <em>обект на съвпадението<\/em>, който носи цялата информация за това какво е намерено и къде.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще видите и различните начини да се запише регулярен израз, както и как да зададете простия въпрос с „да“ или „не“ — „съвпадна ли изобщо низът?“.<\/span><\/p>"]]}}}</script>
