<script type="application/json" id="page-data">{"u":"regexes/matching/match-object","n":987,"k":"topic","pv":"regexes/matching/smartmatch/quiz","nx":"regexes/matching/match-object/quiz","tr":["regexes","regexes/matching"],"L":{"en":{"t":"The match object","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When a regex matches, the smartmatch returns a <em>match object<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The same object is also stored automatically in the special variable <code>$/<\/code>, which is sometimes called “the match variable”.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The match object is much more than a yes-or-no answer.<\/span> <span class=\"sg\" data-s=\"1\">As a string, it is the text that matched — either with the <code>.Str<\/code> method or with the prefix <code>~<\/code>, which is the string-coercion operator and does exactly the same thing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It also knows <strong>where<\/strong> in the string the match was found.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.from<\/code> method gives the position where it starts, and <code>.to<\/code> gives the position just after it ends:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Positions are counted from zero, so the digit <code>7<\/code> sits at index <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When the regex does <strong>not<\/strong> match, the result is not a match object at all — it is the special value <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Assigning <code>Nil<\/code> to a scalar leaves it undefined:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So you can always check <code>.defined<\/code> (or just use the value in a Boolean context) before reading the matched text.<\/span><\/p>"]]},"de":{"t":"Das Match-Objekt","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn ein Regex trifft, liefert der Smartmatch ein <em>Match-Objekt<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dasselbe Objekt wird außerdem selbsttätig in der besonderen Variablen <code>$/<\/code> abgelegt, die manchmal „die Match-Variable“ genannt wird.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Match-Objekt ist weit mehr als eine Ja-oder-Nein-Antwort.<\/span> <span class=\"sg\" data-s=\"1\">Als Zeichenkette ist es der getroffene Text — entweder über die Methode <code>.Str<\/code> oder über das Präfix <code>~<\/code>, den Operator zur Zeichenketten-Umwandlung, der genau dasselbe tut:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es weiß auch, <strong>wo<\/strong> in der Zeichenkette der Treffer gefunden wurde.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>.from<\/code> liefert die Position, an der er beginnt, und <code>.to<\/code> die Position direkt hinter seinem Ende:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Positionen werden ab null gezählt, die Ziffer <code>7<\/code> steht also an Index <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn der Regex <strong>nicht<\/strong> trifft, ist das Ergebnis gar kein Match-Objekt — es ist der besondere Wert <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Nil<\/code> einem Skalar zuzuweisen lässt ihn undefiniert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können also stets <code>.defined<\/code> prüfen (oder den Wert einfach in einem Wahrheitszusammenhang verwenden), bevor Sie den getroffenen Text lesen.<\/span><\/p>"]]},"nl":{"t":"Het matchobject","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer een regex matcht, geeft de smartmatch een <em>matchobject<\/em> terug.<\/span> <span class=\"sg\" data-s=\"1\">Datzelfde object wordt ook automatisch bewaard in de bijzondere variabele <code>$/<\/code>, die soms \"de matchvariabele\" genoemd wordt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het matchobject is veel meer dan een ja-of-nee-antwoord.<\/span> <span class=\"sg\" data-s=\"1\">Als string is het de tekst die matchte — via de methode <code>.Str<\/code> of via het voorvoegsel <code>~<\/code>, de operator voor stringcoercie, die precies hetzelfde doet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het weet ook <strong>waar<\/strong> in de string de match gevonden is.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.from<\/code> geeft de positie waar hij begint, en <code>.to<\/code> de positie net na het einde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Posities worden vanaf nul geteld, dus het cijfer <code>7<\/code> staat op index <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer de regex <strong>niet<\/strong> matcht, is het resultaat helemaal geen matchobject — het is de bijzondere waarde <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Nil<\/code> aan een scalair toekennen laat die ongedefinieerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt dus altijd <code>.defined<\/code> controleren (of de waarde gewoon in een booleaanse context gebruiken) voordat je de gematchte tekst leest.<\/span><\/p>"]]},"es":{"t":"El objeto de coincidencia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando un regex coincide, el emparejamiento inteligente devuelve un <em>objeto de coincidencia<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ese mismo objeto se guarda también automáticamente en la variable especial <code>$/<\/code>, a veces llamada «la variable de coincidencia».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El objeto de coincidencia es mucho más que una respuesta de sí o no. Como cadena, es el texto que coincidió, ya sea con el método <code>.Str<\/code> o con el prefijo <code>~<\/code>, que es el operador de conversión a cadena y hace exactamente lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También sabe <strong>dónde<\/strong> se encontró la coincidencia en la cadena.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>.from<\/code> da la posición donde empieza y <code>.to<\/code> la posición justo después de su final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las posiciones se cuentan desde cero, así que el dígito <code>7<\/code> está en el índice <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando el regex <strong>no<\/strong> coincide, el resultado no es un objeto de coincidencia en absoluto: es el valor especial <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Asignar <code>Nil<\/code> a un escalar lo deja sin definir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así que siempre puedes comprobar <code>.defined<\/code> (o simplemente usar el valor en contexto booleano) antes de leer el texto coincidente.<\/span><\/p>"]]},"it":{"t":"L'oggetto match","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando un regex corrisponde, lo smartmatch restituisce un <em>oggetto match<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso oggetto viene conservato automaticamente anche nella variabile speciale <code>$/<\/code>, che a volte si chiama «la variabile di match».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'oggetto match è molto più di una risposta sì-o-no.<\/span> <span class=\"sg\" data-s=\"1\">Come stringa è il testo che ha corrisposto — o con il metodo <code>.Str<\/code> o con il prefisso <code>~<\/code>, che è l'operatore di conversione a stringa e fa esattamente la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sa anche <strong>dove<\/strong> nella stringa la corrispondenza è stata trovata.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>.from<\/code> dà la posizione in cui comincia e <code>.to<\/code> la posizione subito dopo la sua fine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le posizioni si contano da zero, quindi la cifra <code>7<\/code> sta all'indice <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando il regex <strong>non<\/strong> corrisponde, il risultato non è affatto un oggetto match: è il valore speciale <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Assegnare <code>Nil<\/code> a uno scalare lo lascia non definito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi puoi sempre controllare <code>.defined<\/code> (o semplicemente usare il valore in contesto booleano) prima di leggere il testo corrispondente.<\/span><\/p>"]]},"lv":{"t":"Sakritības objekts","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad regulārā izteiksme sakrīt, gudrā sakritība atgriež <em>sakritības objektu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats objekts automātiski tiek saglabāts arī speciālajā mainīgajā <code>$/<\/code>, ko dažreiz sauc par «sakritības mainīgo».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sakritības objekts ir daudz vairāk nekā atbilde «jā» vai «nē».<\/span> <span class=\"sg\" data-s=\"1\">Kā virkne tas ir teksts, kas sakrita — vai nu ar metodi <code>.Str<\/code>, vai ar prefiksu <code>~<\/code>, kas ir virknes pārveidošanas operators un dara tieši to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas zina arī, <strong>kur<\/strong> virknē sakritība atrasta.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>.from<\/code> dod pozīciju, kur tā sākas, un <code>.to<\/code> — pozīciju tūlīt aiz tās beigām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pozīcijas skaita no nulles, tāpēc cipars <code>7<\/code> atrodas indeksā <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad regulārā izteiksme <strong>nesakrīt<\/strong>, rezultāts vispār nav sakritības objekts — tā ir īpašā vērtība <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Piešķirot <code>Nil<\/code> skalāram, tas paliek nedefinēts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tāpēc pirms sakritušā teksta nolasīšanas vienmēr varat pārbaudīt <code>.defined<\/code> (vai vienkārši izmantot vērtību Būla kontekstā).<\/span><\/p>"]]},"ru":{"t":"Объект совпадения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда регулярное выражение совпадает, умное сопоставление возвращает <em>объект совпадения<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Тот же объект автоматически сохраняется в специальной переменной <code>$/<\/code>, которую иногда называют «переменной совпадения».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Объект совпадения — это гораздо больше, чем ответ «да или нет».<\/span> <span class=\"sg\" data-s=\"1\">Как строка он представляет собой совпавший текст: это даёт либо метод <code>.Str<\/code>, либо префиксный <code>~<\/code>, оператор приведения к строке, который делает ровно то же самое:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Он знает и то, <strong>где<\/strong> в строке было найдено совпадение.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.from<\/code> даёт позицию, с которой оно начинается, а <code>.to<\/code> — позицию сразу за его концом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Позиции считаются от нуля, поэтому цифра <code>7<\/code> стоит на индексе <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда регулярное выражение <strong>не<\/strong> совпадает, результат вовсе не является объектом совпадения — это особое значение <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Присваивание <code>Nil<\/code> скаляру оставляет его неопределённым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так что перед чтением совпавшего текста всегда можно проверить <code>.defined<\/code> (или просто использовать значение в логическом контексте).<\/span><\/p>"]]},"uk":{"t":"Об'єкт збігу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли регекс збігається, розумне зіставлення повертає <em>об'єкт збігу<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Той самий об'єкт автоматично зберігається й у спеціальній змінній <code>$/<\/code>, яку іноді називають «змінною збігу».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Об'єкт збігу є чимось значно більшим за відповідь «так чи ні».<\/span> <span class=\"sg\" data-s=\"1\">Як рядок він є тим текстом, що збігся, — його дістають методом <code>.Str<\/code> або префіксом <code>~<\/code>, який є оператором зведення до рядка й робить точно те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Він також знає, <strong>де<\/strong> в рядку знайдено збіг.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.from<\/code> дає позицію, з якої той починається, а <code>.to<\/code> — позицію одразу після його кінця:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Позиції рахуються від нуля, тож цифра <code>7<\/code> стоїть за індексом <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли регекс <strong>не<\/strong> збігається, результатом є взагалі не об'єкт збігу, а особливе значення <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Присвоєння <code>Nil<\/code> скаляру лишає його невизначеним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тож перед читанням тексту збігу завжди можна перевірити <code>.defined<\/code> (або просто використати значення в булевому контексті).<\/span><\/p>"]]},"bg":{"t":"Обектът на съвпадението","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато регулярният израз съвпадне, интелигентното съпоставяне връща <em>обект на съвпадението<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Същият обект се съхранява автоматично и в специалната променлива <code>$/<\/code>, наричана понякога „променливата на съвпадението“.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обектът на съвпадението е много повече от отговор с „да“ или „не“.<\/span> <span class=\"sg\" data-s=\"1\">Като низ той е текстът, който е съвпаднал — било с метода <code>.Str<\/code>, било с префикса <code>~<\/code>, който е операторът за преобразуване в низ и прави точно същото:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'concatenate' ~~ /cat/;\nsay $m.Str; # cat\nsay ~$m;    # cat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Той знае и <strong>къде<\/strong> в низа е намерено съвпадението.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>.from<\/code> дава позицията, на която започва, а <code>.to<\/code> — позицията непосредствено след края му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'room 7 left' ~~ /\\d/;\nsay $m.Str;  # 7\nsay $m.from; # 5\nsay $m.to;   # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Позициите се броят от нула, така че цифрата <code>7<\/code> стои на индекс <code>5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато регулярният израз <strong>не<\/strong> съвпадне, резултатът изобщо не е обект на съвпадението — той е специалната стойност <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Присвояването на <code>Nil<\/code> на скалар го оставя недефиниран:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = 'abc' ~~ /z/;\nsay $m.defined; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Затова винаги можете да проверите <code>.defined<\/code> (или просто да използвате стойността в булев контекст), преди да прочетете съвпадналия текст.<\/span><\/p>"]]}}}</script>
