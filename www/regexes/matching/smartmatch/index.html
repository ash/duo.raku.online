<script type="application/json" id="page-data">{"u":"regexes/matching/smartmatch","n":985,"k":"topic","pv":"regexes/matching","nx":"regexes/matching/smartmatch/quiz","tr":["regexes","regexes/matching"],"L":{"en":{"t":"The smartmatch operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The operator that applies a regex to a string is the smartmatch <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A pattern written between slashes is the most common form, but there are two more that mean the same thing and are sometimes clearer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>m/.../<\/code> form emphasises that you are <em>matching<\/em>, and is handy when you want to add options to the match (you will meet those options, called <a href=\"/regexes/adverbs/\"><em>adverbs<\/em><\/a>, later).<\/span> <span class=\"sg\" data-s=\"1\">The <code>rx/.../<\/code> form constructs a regex value without matching it yet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Very often you only care whether the string matched, not what exactly was found.<\/span> <span class=\"sg\" data-s=\"1\">Because a successful match is a true value and a failed match is false, you can use the result directly in a Boolean context.<\/span> <span class=\"sg\" data-s=\"2\">The cleanest way to get a plain <code>True<\/code> or <code>False<\/code> is the <code>so<\/code> function:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This makes a regex a natural condition for <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"de":{"t":"Der Smartmatch-Operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Operator, der einen Regex auf eine Zeichenkette anwendet, ist der Smartmatch <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Muster zwischen Schrägstrichen ist die häufigste Form, doch es gibt zwei weitere, die dasselbe bedeuten und manchmal klarer sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Form <code>m/.../<\/code> betont, dass Sie <em>treffen<\/em>, und ist praktisch, wenn Sie dem Treffer Optionen mitgeben möchten (diese Optionen, <a href=\"https://course.raku.org/de/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>Adverbien<\/em><\/a> genannt, begegnen Ihnen später).<\/span> <span class=\"sg\" data-s=\"1\">Die Form <code>rx/.../<\/code> erzeugt einen Regex-Wert, ohne ihn schon anzuwenden.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sehr oft interessiert Sie nur, ob die Zeichenkette getroffen hat, und nicht, was genau gefunden wurde.<\/span> <span class=\"sg\" data-s=\"1\">Da ein erfolgreicher Treffer ein wahrer Wert ist und ein fehlgeschlagener falsch, können Sie das Ergebnis unmittelbar in einem Wahrheitszusammenhang verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Am saubersten erhalten Sie ein schlichtes <code>True<\/code> oder <code>False<\/code> mit der Funktion <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Damit wird ein Regex zu einer natürlichen Bedingung für <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"nl":{"t":"De smartmatch-operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De operator die een regex op een string toepast is de smartmatch <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een patroon tussen schuine strepen is de gebruikelijkste vorm, maar er zijn er nog twee die hetzelfde betekenen en soms duidelijker zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De vorm <code>m/.../<\/code> benadrukt dat je aan het <em>matchen<\/em> bent, en is handig wanneer je opties aan de match wilt toevoegen (die opties, <a href=\"https://course.raku.org/nl/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>bijwoorden<\/em><\/a> genoemd, kom je later tegen).<\/span> <span class=\"sg\" data-s=\"1\">De vorm <code>rx/.../<\/code> bouwt een regexwaarde zonder hem al te matchen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Heel vaak geeft het je alleen om de vraag of de string matchte, niet om wat er precies gevonden is.<\/span> <span class=\"sg\" data-s=\"1\">Omdat een geslaagde match een ware waarde is en een mislukte match onwaar, kun je het resultaat rechtstreeks in een booleaanse context gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">De nette manier om een simpele <code>True<\/code> of <code>False<\/code> te krijgen is de functie <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zo wordt een regex een natuurlijke voorwaarde voor <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"es":{"t":"El operador de emparejamiento inteligente","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">El operador que aplica un regex a una cadena es el emparejamiento inteligente <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un patrón escrito entre barras es la forma más común, pero hay dos más que significan lo mismo y a veces resultan más claras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma <code>m/.../<\/code> recalca que estás <em>emparejando<\/em>, y resulta cómoda cuando quieres añadir opciones a la coincidencia (conocerás esas opciones, llamadas <a href=\"https://course.raku.org/es/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbios<\/em><\/a>, más adelante).<\/span> <span class=\"sg\" data-s=\"1\">La forma <code>rx/.../<\/code> construye un valor de regex sin aplicarlo todavía.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Muy a menudo solo te importa si la cadena coincidió, no qué se encontró exactamente.<\/span> <span class=\"sg\" data-s=\"1\">Como una coincidencia lograda es un valor verdadero y una fallida es falsa, puedes usar el resultado directamente en un contexto booleano.<\/span> <span class=\"sg\" data-s=\"2\">La manera más limpia de obtener un <code>True<\/code> o <code>False<\/code> simple es la función <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto convierte un regex en una condición natural para un <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"it":{"t":"L'operatore smartmatch","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">L'operatore che applica un regex a una stringa è lo smartmatch <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Uno schema scritto fra barre è la forma più comune, ma ce ne sono altre due che significano la stessa cosa e a volte sono più chiare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma <code>m/.../<\/code> sottolinea che stai <em>riconoscendo<\/em>, ed è comoda quando vuoi aggiungere opzioni alla corrispondenza (incontrerai quelle opzioni, chiamate <a href=\"https://course.raku.org/it/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>avverbi<\/em><\/a>, più avanti).<\/span> <span class=\"sg\" data-s=\"1\">La forma <code>rx/.../<\/code> costruisce un valore regex senza ancora applicarlo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Molto spesso ti interessa solo se la stringa ha corrisposto, non che cosa esattamente sia stato trovato.<\/span> <span class=\"sg\" data-s=\"1\">Poiché una corrispondenza riuscita è un valore vero e una fallita è falsa, puoi usare il risultato direttamente in un contesto booleano.<\/span> <span class=\"sg\" data-s=\"2\">Il modo più pulito di ottenere un semplice <code>True<\/code> o <code>False<\/code> è la funzione <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo rende un regex una condizione naturale per un <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"lv":{"t":"Viedās saskaņošanas operators","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Operators, kas piemēro regulāro izteiksmi virknei, ir gudrā sakritība <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raksturs, kas uzrakstīts starp slīpsvītrām, ir visizplatītākā forma, taču ir vēl divas, kas nozīmē to pašu un dažreiz ir skaidrākas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Forma <code>m/.../<\/code> uzsver, ka veicat <em>piemeklēšanu<\/em>, un noder, kad sakritībai vēlaties pievienot iespējas (ar tām, sauktām par <a href=\"https://course.raku.org/lv/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>apstākļvārdiem<\/em><\/a>, iepazīsieties vēlāk).<\/span> <span class=\"sg\" data-s=\"1\">Forma <code>rx/.../<\/code> izveido regulārās izteiksmes vērtību, to vēl nepiemeklējot.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ļoti bieži jums rūp tikai tas, vai virkne sakrita, nevis kas tieši atrasts.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā veiksmīga sakritība ir patiesa vērtība, bet neveiksmīga — aplama, rezultātu var izmantot tieši Būla kontekstā.<\/span> <span class=\"sg\" data-s=\"2\">Tīrākais veids, kā iegūt vienkāršu <code>True<\/code> vai <code>False<\/code>, ir funkcija <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas padara regulāro izteiksmi par dabisku nosacījumu <code>if<\/code> konstruktam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"ru":{"t":"Оператор умного сопоставления","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор, применяющий регулярное выражение к строке, — это умное сопоставление <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон между косыми чертами — самая распространённая форма, но есть ещё две, означающие то же самое и порой более наглядные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Форма <code>m/.../<\/code> подчёркивает, что вы именно <em>сопоставляете<\/em>, и удобна, когда к сопоставлению нужно добавить параметры (с этими параметрами, которые называются <a href=\"https://course.raku.org/ru/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречиями<\/em><\/a>, вы встретитесь позже).<\/span> <span class=\"sg\" data-s=\"1\">Форма <code>rx/.../<\/code> создаёт значение — регулярное выражение, — пока его не применяя.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Очень часто важно лишь то, совпала ли строка, а не что именно нашлось.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку успешное сопоставление — истинное значение, а неудачное — ложное, результат можно использовать прямо в логическом контексте.<\/span> <span class=\"sg\" data-s=\"2\">Чище всего получить простое <code>True<\/code> или <code>False<\/code> с помощью функции <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Благодаря этому регулярное выражение естественно смотрится как условие для <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"uk":{"t":"Оператор розумного зіставлення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператором, який застосовує регекс до рядка, є розумне зіставлення <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон, записаний між скісними рисками, є найпоширенішою формою, але є ще дві, що означають те саме й іноді зрозуміліші:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Форма <code>m/.../<\/code> підкреслює, що ви <em>зіставляєте<\/em>, і стає в пригоді, коли до зіставлення хочеться додати параметри (з цими параметрами, які називають <a href=\"https://course.raku.org/uk/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наріччями<\/em><\/a>, ви познайомитеся згодом).<\/span> <span class=\"sg\" data-s=\"1\">Форма <code>rx/.../<\/code> створює значення-регекс, ще не зіставляючи його.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дуже часто вам важливо лише, чи рядок збігся, а не що саме знайдено.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки успішний збіг є істинним значенням, а невдалий — хибним, результат можна використовувати просто в булевому контексті.<\/span> <span class=\"sg\" data-s=\"2\">Найчистіший спосіб отримати звичайні <code>True<\/code> чи <code>False<\/code> — функція <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це робить регекс природною умовою для <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]},"bg":{"t":"Операторът за интелигентно съпоставяне","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторът, който прилага регулярен израз върху низ, е интелигентното съпоставяне <code>~~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ /cat/; # ｢cat｣<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шаблон, записан между наклонени черти, е най-честата форма, но има още две, които означават същото и понякога са по-ясни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'the cat sat' ~~ m/cat/;  # ｢cat｣\nsay 'the cat sat' ~~ rx/cat/; # ｢cat｣<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Формата <code>m/.../<\/code> подчертава, че <em>съпоставяте<\/em>, и е удобна, когато искате да добавите настройки към съпоставянето (ще срещнете тези настройки, наречени <a href=\"https://course.raku.org/bg/regexes/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречия<\/em><\/a>, по-нататък).<\/span> <span class=\"sg\" data-s=\"1\">Формата <code>rx/.../<\/code> конструира стойност-регулярен израз, без още да го съпоставя.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Много често ви интересува само дали низът е съвпаднал, а не какво точно е намерено.<\/span> <span class=\"sg\" data-s=\"1\">Понеже успешното съпоставяне е истинна стойност, а провалилото се — лъжлива, можете да използвате резултата направо в булев контекст.<\/span> <span class=\"sg\" data-s=\"2\">Най-чистият начин да получите обикновено <code>True<\/code> или <code>False<\/code> е функцията <code>so<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say so 'the cat sat' ~~ /cat/; # True\nsay so 'the cat sat' ~~ /dog/; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това прави регулярния израз естествено условие за <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 'the cat sat' ~~ /cat/ {\n    say 'found it';   # found it\n}<\/code><\/pre>"]]}}}</script>
