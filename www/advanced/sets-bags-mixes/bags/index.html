<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes/bags","n":491,"k":"topic","pv":"advanced/sets-bags-mixes/operations/quiz","nx":"advanced/sets-bags-mixes/exercises","tr":["advanced","advanced/sets-bags-mixes"],"L":{"en":{"t":"Bags and mixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A set remembers only <em>whether<\/em> a value is present.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes you also want to know <em>how many times<\/em> it occurs.<\/span> <span class=\"sg\" data-s=\"2\">That is what a <code>Bag<\/code> is for: it keeps a count for each value.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You create a bag with the <code>bag<\/code> routine.<\/span> <span class=\"sg\" data-s=\"1\">Repeated values are not collapsed — they are counted:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Asking the bag for a value with the <code>&lt; &gt;<\/code> subscript returns how many times that value was put in.<\/span> <span class=\"sg\" data-s=\"1\">The <code>total<\/code> method gives the sum of all the counts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>Mix<\/code> is the same idea as a bag, except that the counts (called <em>weights<\/em>) may be fractional rather than whole numbers.<\/span> <span class=\"sg\" data-s=\"1\">To assign explicit weights, pair each value with its weight and coerce the list with <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Looking up a weight with <code>&lt; &gt;<\/code> and summing them with <code>total<\/code> work exactly as for a bag — only the numbers need not be whole.<\/span> <span class=\"sg\" data-s=\"1\">Here <code>total<\/code> adds the weights <code>2.5<\/code> and <code>0.75<\/code>, giving <code>3.25<\/code> — it is the sum of the weights, not a count of the values.<\/span> <span class=\"sg\" data-s=\"2\">Bags and mixes are handy whenever you need to track quantities — for example, counting how often each word appears in a text, or assigning weights to options.<\/span><\/p>"]]},"de":{"t":"Bags und Mixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Set merkt sich nur, <em>ob<\/em> ein Wert vorhanden ist.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal möchtest du aber auch wissen, <em>wie oft<\/em> er vorkommt.<\/span> <span class=\"sg\" data-s=\"2\">Dafür gibt es den <code>Bag<\/code>: Er speichert einen Zähler für jeden Wert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du erstellst einen Bag mit der <code>bag<\/code>-Routine.<\/span> <span class=\"sg\" data-s=\"1\">Wiederholte Werte werden nicht zusammengefasst — sie werden gezählt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du den Bag mit dem <code>&lt; &gt;<\/code>-Subscript nach einem Wert fragst, erhältst du zurück, wie oft dieser Wert eingefügt wurde.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>total<\/code> gibt die Summe aller Zähler zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Mix<\/code> ist dieselbe Idee wie ein Bag, nur dass die Zähler (genannt <em>Gewichte<\/em>) auch Bruchzahlen sein können.<\/span> <span class=\"sg\" data-s=\"1\">Um explizite Gewichte zuzuweisen, ordne jedem Wert sein Gewicht als Paar zu und wandle die Liste mit <code>.Mix<\/code> um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Nachschlagen eines Gewichts mit <code>&lt; &gt;<\/code> und das Summieren mit <code>total<\/code> funktionieren genau wie bei einem Bag — nur müssen die Zahlen nicht ganzzahlig sein.<\/span> <span class=\"sg\" data-s=\"1\">Hier addiert <code>total<\/code> die Gewichte <code>2.5<\/code> und <code>0.75<\/code> und ergibt <code>3.25<\/code> — es ist die Summe der Gewichte, nicht eine Anzahl der Werte.<\/span> <span class=\"sg\" data-s=\"2\">Bags und Mixes sind praktisch, wann immer du Mengen verfolgen musst — zum Beispiel, um zu zählen, wie oft jedes Wort in einem Text vorkommt, oder um Optionen mit Gewichten zu versehen.<\/span><\/p>"]]},"nl":{"t":"Bags en mixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een set onthoudt alleen <em>of<\/em> een waarde aanwezig is.<\/span> <span class=\"sg\" data-s=\"1\">Soms wil je ook weten <em>hoe vaak<\/em> deze voorkomt.<\/span> <span class=\"sg\" data-s=\"2\">Daar is een <code>Bag<\/code> voor: die houdt een telling bij voor elke waarde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je maakt een bag aan met de <code>bag<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"1\">Herhaalde waarden worden niet samengevoegd — ze worden geteld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je de bag om een waarde vraagt met de <code>&lt; &gt;<\/code>-subscript, krijg je terug hoe vaak die waarde erin is gestopt.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>total<\/code> geeft de som van alle tellingen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>Mix<\/code> is hetzelfde idee als een bag, behalve dat de tellingen (die <em>gewichten<\/em> worden genoemd) fractioneel mogen zijn in plaats van gehele getallen.<\/span> <span class=\"sg\" data-s=\"1\">Om expliciete gewichten toe te kennen, koppel je elke waarde aan zijn gewicht en converteer je de lijst met <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het opvragen van een gewicht met <code>&lt; &gt;<\/code> en het optellen ervan met <code>total<\/code> werkt precies hetzelfde als bij een bag — alleen hoeven de getallen niet geheel te zijn.<\/span> <span class=\"sg\" data-s=\"1\">Hier telt <code>total<\/code> de gewichten <code>2.5<\/code> en <code>0.75<\/code> op, wat <code>3.25<\/code> oplevert — het is de som van de gewichten, niet een telling van de waarden.<\/span> <span class=\"sg\" data-s=\"2\">Bags en mixes zijn handig wanneer je hoeveelheden wilt bijhouden — bijvoorbeeld tellen hoe vaak elk woord in een tekst voorkomt, of gewichten toekennen aan opties.<\/span><\/p>"]]},"es":{"t":"Bolsas y mezclas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un set recuerda solo <em>si<\/em> un valor está presente.<\/span> <span class=\"sg\" data-s=\"1\">A veces también quieres saber <em>cuántas veces<\/em> aparece.<\/span> <span class=\"sg\" data-s=\"2\">Para eso sirve un <code>Bag<\/code>: mantiene un conteo para cada valor.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes crear un bag con la rutina <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los valores repetidos no se eliminan — se cuentan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al consultar el bag por un valor con el subíndice <code>&lt; &gt;<\/code>, obtienes cuántas veces se introdujo ese valor.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>total<\/code> da la suma de todos los conteos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>Mix<\/code> es la misma idea que un bag, excepto que los conteos (llamados <em>pesos<\/em>) pueden ser fraccionarios en lugar de números enteros.<\/span> <span class=\"sg\" data-s=\"1\">Para asignar pesos explícitos, empareja cada valor con su peso y convierte la lista con <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Consultar un peso con <code>&lt; &gt;<\/code> y sumarlos con <code>total<\/code> funciona exactamente igual que para un bag — solo que los números no tienen que ser enteros.<\/span> <span class=\"sg\" data-s=\"1\">Aquí <code>total<\/code> suma los pesos <code>2.5<\/code> y <code>0.75<\/code>, dando <code>3.25<\/code> — es la suma de los pesos, no un conteo de los valores.<\/span> <span class=\"sg\" data-s=\"2\">Los bags y mixes son útiles siempre que necesites rastrear cantidades — por ejemplo, contar cuántas veces aparece cada palabra en un texto, o asignar pesos a opciones.<\/span><\/p>"]]},"it":{"t":"Bag e mix","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un set ricorda solo <em>se<\/em> un valore è presente.<\/span> <span class=\"sg\" data-s=\"1\">A volte si vuole sapere anche <em>quante volte<\/em> compare.<\/span> <span class=\"sg\" data-s=\"2\">A questo serve il <code>Bag<\/code>: mantiene un conteggio per ogni valore.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si crea un bag con la routine <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">I valori ripetuti non vengono ridotti — vengono contati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interrogando il bag per un valore con il subscript <code>&lt; &gt;<\/code> si ottiene quante volte quel valore è stato inserito.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>total<\/code> restituisce la somma di tutti i conteggi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>Mix<\/code> è la stessa idea del bag, con la differenza che i conteggi (chiamati <em>pesi<\/em>) possono essere frazionari anziché numeri interi.<\/span> <span class=\"sg\" data-s=\"1\">Per assegnare pesi espliciti, si associa ogni valore al suo peso e si converte la lista con <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La consultazione di un peso con <code>&lt; &gt;<\/code> e la somma con <code>total<\/code> funzionano esattamente come per un bag — solo che i numeri non devono essere interi.<\/span> <span class=\"sg\" data-s=\"1\">Qui <code>total<\/code> somma i pesi <code>2.5<\/code> e <code>0.75<\/code>, ottenendo <code>3.25<\/code> — è la somma dei pesi, non un conteggio dei valori.<\/span> <span class=\"sg\" data-s=\"2\">I bag e i mix sono utili ogni volta che si ha bisogno di tracciare quantità — ad esempio, contare quante volte ogni parola compare in un testo, o assegnare pesi alle opzioni.<\/span><\/p>"]]},"lv":{"t":"Somas un maisījumi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kopa atceras tikai to, <em>vai<\/em> vērtība ir klāt.<\/span> <span class=\"sg\" data-s=\"1\">Reizēm vēlaties zināt arī, <em>cik reižu<\/em> tā sastopama.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tam domāts <code>Bag<\/code>: tas katrai vērtībai uztur skaitu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maisu izveido ar rutīnu <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atkārtotas vērtības netiek sapludinātas — tās tiek saskaitītas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prasot maisam vērtību ar indeksu <code>&lt; &gt;<\/code>, tiek atgriezts, cik reižu šī vērtība tajā ielikta.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>total<\/code> dod visu skaitu summu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> ir tā pati doma, kas maiss, tikai skaiti (saukti par <em>svariem<\/em>) drīkst būt daļskaitļi, nevis veseli skaitļi.<\/span> <span class=\"sg\" data-s=\"1\">Lai piešķirtu skaidri norādītus svarus, savienojiet katru vērtību ar tās svaru un pārveidojiet sarakstu ar <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Svara meklēšana ar <code>&lt; &gt;<\/code> un to summēšana ar <code>total<\/code> darbojas tieši tāpat kā maisam — tikai skaitļiem nav jābūt veseliem.<\/span> <span class=\"sg\" data-s=\"1\">Šeit <code>total<\/code> saskaita svarus <code>2.5<\/code> un <code>0.75<\/code>, dodot <code>3.25<\/code> — tā ir svaru summa, nevis vērtību skaits.<\/span> <span class=\"sg\" data-s=\"2\">Maisi un maisījumi ir noderīgi ikreiz, kad jāseko līdzi daudzumiem — piemēram, skaitot, cik bieži tekstā parādās katrs vārds, vai piešķirot svarus izvēles variantiem.<\/span><\/p>"]]},"ru":{"t":"Мультимножества и смеси","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множество запоминает лишь то, <em>присутствует<\/em> ли значение.<\/span> <span class=\"sg\" data-s=\"1\">Иногда также нужно знать, <em>сколько раз<\/em> оно встречается.<\/span> <span class=\"sg\" data-s=\"2\">Именно для этого существует <code>Bag<\/code>: он хранит счётчик для каждого значения.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Мультимножество создаётся с помощью подпрограммы <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторяющиеся значения не схлопываются — они подсчитываются:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обращение к мультимножеству по значению с помощью операции индексирования <code>&lt; &gt;<\/code> возвращает количество вхождений этого значения.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>total<\/code> возвращает сумму всех счётчиков:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> — это та же идея, что и мультимножество, только счётчики (называемые <em>весами<\/em>) могут быть дробными, а не только целыми числами.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы задать веса явно, сопоставьте каждое значение с его весом в виде пары и преобразуйте список с помощью <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Получение веса с помощью <code>&lt; &gt;<\/code> и суммирование с помощью <code>total<\/code> работают точно так же, как для мультимножества, — только числа не обязаны быть целыми.<\/span> <span class=\"sg\" data-s=\"1\">Здесь <code>total<\/code> складывает веса <code>2.5<\/code> и <code>0.75<\/code>, давая <code>3.25<\/code> — это сумма весов, а не количество значений.<\/span> <span class=\"sg\" data-s=\"2\">Мультимножества и смеси удобны, когда нужно отслеживать количества — например, подсчитывать, сколько раз каждое слово встречается в тексте, или назначать веса вариантам.<\/span><\/p>"]]},"uk":{"t":"Мультимножини та суміші","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множина пам'ятає лише те, <em>чи<\/em> присутнє значення.<\/span> <span class=\"sg\" data-s=\"1\">Іноді хочеться знати ще й <em>скільки разів<\/em> воно трапляється.<\/span> <span class=\"sg\" data-s=\"2\">Для цього й існує <code>Bag<\/code>: він зберігає лічильник для кожного значення.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Мультимножина створюється підпрограмою <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторювані значення не злипаються — вони підраховуються:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запит до мультимножини за значенням через індекс <code>&lt; &gt;<\/code> повертає, скільки разів це значення було покладено.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>total<\/code> дає суму всіх лічильників:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> — це та сама ідея, що й мультимножина, тільки лічильники (їх називають <em>вагами<\/em>) можуть бути дробовими, а не цілими.<\/span> <span class=\"sg\" data-s=\"1\">Щоб призначити явні ваги, зіставте кожне значення з його вагою та зведіть список через <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пошук ваги через <code>&lt; &gt;<\/code> і підсумовування їх через <code>total<\/code> працюють точно як для мультимножини — просто числа не мусять бути цілими.<\/span> <span class=\"sg\" data-s=\"1\">Тут <code>total<\/code> додає ваги <code>2.5<\/code> та <code>0.75<\/code>, даючи <code>3.25<\/code>: це сума ваг, а не кількість значень.<\/span> <span class=\"sg\" data-s=\"2\">Мультимножини й суміші стають у пригоді щоразу, коли потрібно відстежувати кількості, — наприклад, рахувати, як часто кожне слово трапляється в тексті, або призначати ваги варіантам.<\/span><\/p>"]]},"bg":{"t":"Торби и смеси","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множеството запомня само <em>дали<\/em> дадена стойност присъства.<\/span> <span class=\"sg\" data-s=\"1\">Понякога искате да знаете и <em>колко пъти<\/em> се среща.<\/span> <span class=\"sg\" data-s=\"2\">Точно за това служи <code>Bag<\/code>: той пази брояч за всяка стойност.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Създавате торба с подпрограмата <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повтарящите се стойности не се свиват — те се броят:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато поискате стойност от торбата с индекса <code>&lt; &gt;<\/code>, се връща колко пъти тази стойност е била добавена.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>total<\/code> дава сумата на всички броячи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> е същата идея като торбата, с тази разлика, че броячите (наречени <em>тегла<\/em>) могат да бъдат дробни, а не само цели числа.<\/span> <span class=\"sg\" data-s=\"1\">За да зададете изрични тегла, свържете всяка стойност с нейното тегло и преобразувайте списъка с <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Търсенето на тегло с <code>&lt; &gt;<\/code> и сумирането им с <code>total<\/code> работят точно както при торбата — само че числата не е задължително да са цели.<\/span> <span class=\"sg\" data-s=\"1\">Тук <code>total<\/code> събира теглата <code>2.5<\/code> и <code>0.75<\/code>, като дава <code>3.25<\/code> — това е сумата на теглата, а не брой на стойностите.<\/span> <span class=\"sg\" data-s=\"2\">Торбите и смесите са удобни, когато трябва да следите количества — например да броите колко пъти се появява всяка дума в текст или да задавате тегла на опции.<\/span><\/p>"]]},"la":{"t":"Sacculi et mixturae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Inopia tantum meminit <em>num<\/em> valor praesens sit.<\/span> <span class=\"sg\" data-s=\"1\">Interdum etiam scire vis <em>quotiens<\/em> appareat.<\/span> <span class=\"sg\" data-s=\"2\">Id est quod <code>Bag<\/code> praestat: numerum pro quoque valore servat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sacculum creas functione <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Valores repetiti non collabuntur — numerantur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si sacculum de valore interrogas subscriptione <code>&lt; &gt;<\/code>, reddit quotiens ille valor insertus sit.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>total<\/code> summam omnium numerorum dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> est eadem notio ac sacculus, nisi quod numeri (qui <em>pondera<\/em> vocantur) fracti esse possunt, non solum integri.<\/span> <span class=\"sg\" data-s=\"1\">Ad pondera explicite assignanda, quemque valorem cum suo pondere coniunge et indicem coerce cum <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pondus inspicere cum <code>&lt; &gt;<\/code> et summam cum <code>total<\/code> computare eodem modo operantur ac pro sacculo — tantum numeri integri esse non debent.<\/span> <span class=\"sg\" data-s=\"1\">Hic <code>total<\/code> pondera <code>2.5<\/code> et <code>0.75<\/code> addit, dans <code>3.25<\/code> — est summa ponderum, non numerus valorum.<\/span> <span class=\"sg\" data-s=\"2\">Sacculi et mixtiones utiles sunt quotienscumque quantitates persequi debes — exempli gratia, numerando quotiens quodque verbum in textu appareat, vel pondera optionibus assignando.<\/span><\/p>"]]}}}</script>
