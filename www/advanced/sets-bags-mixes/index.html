<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes","n":488,"k":"section","pv":"advanced/date-and-time/exercises/day-of-week/solution","nx":"advanced/sets-bags-mixes/operations","tr":["advanced"],"L":{"en":{"t":"Sets, bags, and mixes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides arrays and hashes, Raku offers a few specialised containers for collections of values.<\/span> <span class=\"sg\" data-s=\"1\">The simplest is the <code>Set<\/code> — an unordered collection of <em>distinct<\/em> values, where each value is either a member or not, and duplicates are ignored.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You create a set with the <code>set<\/code> routine.<\/span> <span class=\"sg\" data-s=\"1\">Repeated values collapse into one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Even though five numbers were passed in, the set has only three elements, because <code>1<\/code> and <code>2<\/code> appeared more than once.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The main question you ask a set is whether a value belongs to it.<\/span> <span class=\"sg\" data-s=\"1\">The <code>∈<\/code> operator (read as “is an element of”) returns a Boolean:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you prefer to stay with plain ASCII, the same operator can be written as <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following topics show how to combine sets, and introduce bags and mixes, which are close relatives of the set.<\/span><\/p>"]]},"de":{"t":"Sets, Bags und Mixes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben Arrays und Hashes bietet Raku einige spezialisierte Container für Sammlungen von Werten.<\/span> <span class=\"sg\" data-s=\"1\">Der einfachste ist das <code>Set<\/code> — eine ungeordnete Sammlung von <em>verschiedenen<\/em> Werten, bei der jeder Wert entweder enthalten ist oder nicht, und Duplikate ignoriert werden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du erstellst ein Set mit der <code>set<\/code>-Routine.<\/span> <span class=\"sg\" data-s=\"1\">Wiederholte Werte werden zu einem zusammengefasst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Obwohl fünf Zahlen übergeben wurden, hat das Set nur drei Elemente, weil <code>1<\/code> und <code>2<\/code> mehr als einmal vorkamen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die wichtigste Frage, die du an ein Set stellst, ist, ob ein Wert darin enthalten ist.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>∈<\/code> (lies: \"ist Element von\") gibt einen Booleschen Wert zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du lieber reines ASCII verwenden möchtest, kann derselbe Operator als <code>(elem)<\/code> geschrieben werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Themen zeigen, wie man Sets kombiniert, und stellen Bags und Mixes vor, die enge Verwandte des Sets sind.<\/span><\/p>"]]},"nl":{"t":"Sets, bags en mixes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast arrays en hashes biedt Raku een aantal gespecialiseerde containers voor verzamelingen van waarden.<\/span> <span class=\"sg\" data-s=\"1\">De eenvoudigste is de <code>Set<\/code> — een ongeordende verzameling van <em>unieke<\/em> waarden, waarbij elke waarde er ofwel in zit of niet, en duplicaten worden genegeerd.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je maakt een set aan met de <code>set<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"1\">Herhaalde waarden worden samengevoegd tot een:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoewel er vijf getallen zijn meegegeven, bevat de set slechts drie elementen, omdat <code>1<\/code> en <code>2<\/code> meer dan eens voorkwamen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De belangrijkste vraag die je aan een set stelt, is of een waarde erin voorkomt.<\/span> <span class=\"sg\" data-s=\"1\">De operator <code>∈<\/code> (lees: \"is een element van\") geeft een Boolean terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je liever gewone ASCII gebruikt, kan dezelfde operator geschreven worden als <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je sets kunt combineren, en introduceren bags en mixes, die nauw verwant zijn aan de set.<\/span><\/p>"]]},"es":{"t":"Conjuntos, bolsas y mezclas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de los arrays y los hashes, Raku ofrece algunos contenedores especializados para colecciones de valores.<\/span> <span class=\"sg\" data-s=\"1\">El más simple es el <code>Set<\/code> — una colección desordenada de valores <em>distintos<\/em>, donde cada valor es miembro o no lo es, y los duplicados se ignoran.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes crear un set con la rutina <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los valores repetidos se reducen a uno solo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aunque se pasaron cinco números, el set tiene solo tres elementos, porque <code>1<\/code> y <code>2<\/code> aparecieron más de una vez.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La pregunta principal que le haces a un set es si un valor pertenece a él.<\/span> <span class=\"sg\" data-s=\"1\">El operador <code>∈<\/code> (que se lee \"es un elemento de\") devuelve un Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si prefieres quedarte con ASCII simple, el mismo operador se puede escribir como <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran cómo combinar sets, e introducen los bags y los mixes, que son parientes cercanos del set.<\/span><\/p>"]]},"it":{"t":"Set, bag e mix","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre agli array e agli hash, Raku offre alcuni contenitori specializzati per collezioni di valori.<\/span> <span class=\"sg\" data-s=\"1\">Il più semplice è il <code>Set<\/code> — una collezione non ordinata di valori <em>distinti<\/em>, dove ogni valore è membro oppure no, e i duplicati vengono ignorati.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si crea un set con la routine <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">I valori ripetuti vengono ridotti a uno solo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anche se sono stati passati cinque numeri, il set contiene solo tre elementi, perché <code>1<\/code> e <code>2<\/code> compaiono più di una volta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La domanda principale che si pone a un set è se un valore gli appartiene.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore <code>∈<\/code> (che si legge \"è un elemento di\") restituisce un booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se si preferisce restare con il semplice ASCII, lo stesso operatore può essere scritto come <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti seguenti mostrano come combinare i set e introducono i bag e i mix, che sono parenti stretti del set.<\/span><\/p>"]]},"lv":{"t":"Kopas, somas un maisījumi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez masīviem un jaukteņiem Raku piedāvā dažus specializētus konteinerus vērtību kolekcijām.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršākā ir <code>Set<\/code> — nesakārtota <em>atšķirīgu<\/em> vērtību kolekcija, kurā katra vērtība vai nu ir loceklis, vai nav, un dublikāti tiek ignorēti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kopu izveido ar rutīnu <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atkārtotas vērtības saplūst vienā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai gan tika padoti pieci skaitļi, kopā ir tikai trīs elementi, jo <code>1<\/code> un <code>2<\/code> parādījās vairāk nekā vienu reizi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Galvenais jautājums, ko kopai uzdodat, ir tas, vai vērtība tai pieder.<\/span> <span class=\"sg\" data-s=\"1\">Operators <code>∈<\/code> (lasāms kā «ir elements no») atgriež Būla vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja labprātāk paliekat pie tīra ASCII, to pašu operatoru var rakstīt kā <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, kā kopas apvienot, un iepazīstina ar maisiem un maisījumiem, kas ir kopas tuvi radinieki.<\/span><\/p>"]]},"ru":{"t":"Множества, мультимножества и смеси","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Помимо массивов и хешей, Raku предлагает несколько специализированных контейнеров для коллекций значений.<\/span> <span class=\"sg\" data-s=\"1\">Простейший из них — <code>Set<\/code> — неупорядоченная коллекция <em>уникальных<\/em> значений, где каждое значение либо является элементом, либо нет, а дубликаты игнорируются.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Множество создаётся с помощью подпрограммы <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторяющиеся значения схлопываются в одно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хотя было передано пять чисел, множество содержит только три элемента, потому что <code>1<\/code> и <code>2<\/code> встречались более одного раза.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Главный вопрос, который можно задать множеству, — принадлежит ли ему значение.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>∈<\/code> (читается как «является элементом») возвращает булево значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы предпочитаете оставаться в рамках обычного ASCII, тот же оператор можно записать как <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следующих разделах показано, как комбинировать множества, а также рассказывается о мультимножествах (bags) и смесях (mixes), которые являются близкими родственниками множества.<\/span><\/p>"]]},"uk":{"t":"Множини, мультимножини та суміші","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім масивів і хешів, Raku пропонує кілька спеціалізованих контейнерів для наборів значень.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіший із них — <code>Set<\/code>, невпорядкований набір <em>різних<\/em> значень, де кожне значення або є членом, або ні, а дублікати ігноруються.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Множина створюється підпрограмою <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторювані значення злипаються в одне:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хоча передано п'ять чисел, множина має лише три елементи, бо <code>1<\/code> і <code>2<\/code> траплялися більш ніж один раз.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Головне запитання, яке ставлять множині, — чи належить їй значення.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>∈<\/code> (читається як «є елементом») повертає булеве значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо вам зручніше лишатися в межах чистого ASCII, той самий оператор можна записати як <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як поєднувати множини, і знайомлять із мультимножинами та сумішами — близькими родичами множини.<\/span><\/p>"]]},"bg":{"t":"Множества, торби и смеси","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен масиви и хешове, Raku предлага няколко специализирани контейнера за колекции от стойности.<\/span> <span class=\"sg\" data-s=\"1\">Най-простият е <code>Set<\/code> — неподредена колекция от <em>различни<\/em> стойности, където всяка стойност или е член, или не е, а дубликатите се игнорират.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Създавате множество с подпрограмата <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повтарящите се стойности се свиват до една:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Въпреки че бяха подадени пет числа, множеството има само три елемента, защото <code>1<\/code> и <code>2<\/code> се появяват повече от веднъж.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Основният въпрос, който задавате на множеството, е дали дадена стойност принадлежи към него.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>∈<\/code> (чете се като „е елемент на\") връща булева стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако предпочитате да използвате само ASCII, същият оператор може да се запише като <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да комбинирате множества и представят торбите и смесите, които са близки роднини на множеството.<\/span><\/p>"]]},"eo":{"t":"Aroj, sakoj kaj miksaĵoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom tabeloj kaj hakoj, Raku ofertas kelkajn specialajn ujojn por kolektoj de valoroj.<\/span> <span class=\"sg\" data-s=\"1\">La plej simpla estas la <code>Set<\/code> — neordigita kolekto de <em>distingaj<\/em> valoroj, kie ĉiu valoro estas aŭ membro aŭ ne, kaj duplikatoj estas ignorataj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi kreas aron per la rutino <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ripetitaj valoroj kunfandiĝas en unu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kvankam kvin nombroj estis transdonitaj, la aro havas nur tri elementojn, ĉar <code>1<\/code> kaj <code>2<\/code> aperis pli ol unufoje.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ĉefa demando, kiun vi faras al aro, estas ĉu valoro apartenas al ĝi.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro <code>∈<\/code> (legata kiel «estas elemento de») redonas Boolean valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi preferas resti ĉe simpla ASCII, la sama operatoro povas esti skribita kiel <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel kombini arojn, kaj enkondukas sakojn kaj miksaĵojn, kiuj estas proksimaj parencoj de la aro.<\/span><\/p>"]]},"la":{"t":"Coniuncta, sacculi, et mixturae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter ordines et tabulas dispersas, Raku praebet aliquot receptacula specialia ad collectiones valorum.<\/span> <span class=\"sg\" data-s=\"1\">Simplicissimum est <code>Set<\/code> — collectio non ordinata valorum <em>distinctorum<\/em>, ubi quisque valor aut membrum est aut non est, et duplicata ignorantur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inopiam creas functione <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Valores repetiti in unum collabuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Etsi quinque numeri traditi sunt, inopia tantum tria elementa habet, quia <code>1<\/code> et <code>2<\/code> plus quam semel apparuerunt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praecipua quaestio quam inopiae ponis est num valor ad eam pertineat.<\/span> <span class=\"sg\" data-s=\"1\">Operator <code>∈<\/code> (lege \"est elementum\") valorem Boolianum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si characteribus ASCII tantum uti mavis, idem operator scribi potest ut <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sequentes partes ostendunt quomodo inopiae coniungantur, et sacculos mixtionesque introducunt, quae sunt propinquae cognatae inopiae.<\/span><\/p>"]]}}}</script>
