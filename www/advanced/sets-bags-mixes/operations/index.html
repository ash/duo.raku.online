<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes/operations","n":489,"k":"topic","pv":"advanced/sets-bags-mixes","nx":"advanced/sets-bags-mixes/operations/quiz","tr":["advanced","advanced/sets-bags-mixes"],"L":{"en":{"t":"Set operations","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sets can be combined with the usual operations from set theory.<\/span> <span class=\"sg\" data-s=\"1\">Each operator has a Unicode symbol and an ASCII spelling; you can use whichever you prefer.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <em>union<\/em> <code>∪<\/code> (or <code>(|)<\/code>) collects all the values that are in either set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The two sets share the value <code>3<\/code>, so the union has five distinct elements: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <em>intersection<\/em> <code>∩<\/code> (or <code>(&amp;)<\/code>) keeps only the values that are in both sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here the intersection contains <code>2<\/code> and <code>3<\/code> — the values present in both sets.<\/span> <span class=\"sg\" data-s=\"1\">A set has no inherent order, so the two elements may appear either way round when printed.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The result of these operations is itself a set, so you can ask it the same questions: how many elements it has, and whether a particular value belongs to it.<\/span><\/p>"]]},"de":{"t":"Mengenoperationen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sets können mit den üblichen Operationen aus der Mengenlehre kombiniert werden.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Operator hat ein Unicode-Symbol und eine ASCII-Schreibweise; du kannst verwenden, was dir lieber ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <em>Vereinigung<\/em> <code>∪<\/code> (oder <code>(|)<\/code>) sammelt alle Werte, die in einem der beiden Sets enthalten sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die beiden Sets teilen den Wert <code>3<\/code>, daher hat die Vereinigung fünf verschiedene Elemente: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der <em>Durchschnitt<\/em> <code>∩<\/code> (oder <code>(&amp;)<\/code>) behält nur die Werte, die in beiden Sets enthalten sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — beachte, dass Sets ungeordnet sind\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier enthält der Durchschnitt <code>2<\/code> und <code>3<\/code> — die Werte, die in beiden Sets vorhanden sind.<\/span> <span class=\"sg\" data-s=\"1\">Ein Set hat keine feste Reihenfolge, daher können die beiden Elemente beim Ausgeben in beliebiger Reihenfolge erscheinen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis dieser Operationen ist selbst ein Set, sodass du dieselben Fragen stellen kannst: wie viele Elemente es hat und ob ein bestimmter Wert darin enthalten ist.<\/span><\/p>"]]},"nl":{"t":"Set-operaties","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sets kunnen gecombineerd worden met de gebruikelijke bewerkingen uit de verzamelingenleer.<\/span> <span class=\"sg\" data-s=\"1\">Elke operator heeft een Unicode-symbool en een ASCII-notatie; je kunt gebruiken wat je voorkeur heeft.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <em>vereniging<\/em> <code>∪<\/code> (of <code>(|)<\/code>) verzamelt alle waarden die in een van beide sets zitten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De twee sets delen de waarde <code>3<\/code>, dus de vereniging heeft vijf unieke elementen: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <em>doorsnede<\/em> <code>∩<\/code> (of <code>(&amp;)<\/code>) behoudt alleen de waarden die in beide sets zitten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — merk op dat sets ongeordend zijn\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier bevat de doorsnede <code>2<\/code> en <code>3<\/code> — de waarden die in beide sets aanwezig zijn.<\/span> <span class=\"sg\" data-s=\"1\">Een set heeft geen vaste volgorde, dus de twee elementen kunnen in willekeurige volgorde verschijnen bij het afdrukken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het resultaat van deze bewerkingen is zelf ook een set, dus je kunt dezelfde vragen stellen: hoeveel elementen het bevat, en of een bepaalde waarde erin zit.<\/span><\/p>"]]},"es":{"t":"Operaciones de conjuntos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los sets se pueden combinar con las operaciones habituales de la teoría de conjuntos.<\/span> <span class=\"sg\" data-s=\"1\">Cada operador tiene un símbolo Unicode y una forma ASCII; puedes usar la que prefieras.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>unión<\/em> <code>∪<\/code> (o <code>(|)<\/code>) reúne todos los valores que están en cualquiera de los dos sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los dos sets comparten el valor <code>3<\/code>, así que la unión tiene cinco elementos distintos: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>intersección<\/em> <code>∩<\/code> (o <code>(&amp;)<\/code>) conserva solo los valores que están en ambos sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí la intersección contiene <code>2<\/code> y <code>3<\/code> — los valores presentes en ambos sets.<\/span> <span class=\"sg\" data-s=\"1\">Un set no tiene un orden inherente, por lo que los dos elementos pueden aparecer en cualquier orden al imprimirse.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El resultado de estas operaciones es a su vez un set, así que puedes hacerle las mismas preguntas: cuántos elementos tiene y si un valor particular pertenece a él.<\/span><\/p>"]]},"it":{"t":"Operazioni sui set","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I set possono essere combinati con le consuete operazioni della teoria degli insiemi.<\/span> <span class=\"sg\" data-s=\"1\">Ogni operatore ha un simbolo Unicode e una grafia ASCII; si può usare quello che si preferisce.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'<em>unione<\/em> <code>∪<\/code> (o <code>(|)<\/code>) raccoglie tutti i valori presenti in uno dei due set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I due set condividono il valore <code>3<\/code>, quindi l'unione ha cinque elementi distinti: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'<em>intersezione<\/em> <code>∩<\/code> (o <code>(&amp;)<\/code>) conserva solo i valori presenti in entrambi i set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — nota che i set non sono ordinati\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui l'intersezione contiene <code>2<\/code> e <code>3<\/code> — i valori presenti in entrambi i set.<\/span> <span class=\"sg\" data-s=\"1\">Un set non ha un ordine intrinseco, quindi i due elementi possono apparire in qualsiasi ordine quando vengono stampati.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il risultato di queste operazioni è a sua volta un set, quindi si possono porre le stesse domande: quanti elementi contiene e se un determinato valore gli appartiene.<\/span><\/p>"]]},"lv":{"t":"Kopu operācijas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kopas var apvienot ar ierastajām kopu teorijas operācijām.<\/span> <span class=\"sg\" data-s=\"1\">Katram operatoram ir Unikoda simbols un ASCII pieraksts; varat lietot to, kurš labāk patīk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Apvienojums<\/em> <code>∪<\/code> (vai <code>(|)<\/code>) savāc visas vērtības, kas ir kaut vienā no kopām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abām kopām ir kopīga vērtība <code>3<\/code>, tāpēc apvienojumā ir pieci atšķirīgi elementi: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Šķēlums<\/em> <code>∩<\/code> (vai <code>(&amp;)<\/code>) patur tikai tās vērtības, kas ir abās kopās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit šķēlumā ir <code>2<\/code> un <code>3<\/code> — vērtības, kas klāt abās kopās.<\/span> <span class=\"sg\" data-s=\"1\">Kopai nav iedzimtas secības, tāpēc izdrukājot abi elementi var parādīties jebkurā kārtībā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šo operāciju rezultāts pats ir kopa, tāpēc tai var uzdot tos pašus jautājumus: cik tai ir elementu un vai tai pieder konkrēta vērtība.<\/span><\/p>"]]},"ru":{"t":"Операции над множествами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Множества можно комбинировать с помощью обычных операций из теории множеств.<\/span> <span class=\"sg\" data-s=\"1\">Каждый оператор имеет символ в Unicode и запись в ASCII; вы можете использовать любой вариант.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Объединение<\/em> <code>∪<\/code> (или <code>(|)<\/code>) собирает все значения, которые есть хотя бы в одном из множеств:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два множества имеют общее значение <code>3<\/code>, поэтому объединение содержит пять различных элементов: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Пересечение<\/em> <code>∩<\/code> (или <code>(&amp;)<\/code>) оставляет только те значения, которые есть в обоих множествах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — обратите внимание, что множества неупорядочены\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь пересечение содержит <code>2<\/code> и <code>3<\/code> — значения, присутствующие в обоих множествах.<\/span> <span class=\"sg\" data-s=\"1\">Множество не имеет определённого порядка, поэтому при выводе два элемента могут отображаться в любом порядке.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Результат этих операций сам является множеством, поэтому к нему можно задавать те же вопросы: сколько в нём элементов и принадлежит ли ему конкретное значение.<\/span><\/p>"]]},"uk":{"t":"Операції над множинами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Множини можна поєднувати звичними операціями з теорії множин.<\/span> <span class=\"sg\" data-s=\"1\">Кожен оператор має символ Unicode та ASCII-запис; використовуйте той, що вам більше до вподоби.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Об'єднання<\/em> <code>∪<\/code> (або <code>(|)<\/code>) збирає всі значення, що є хоч в одній із множин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидві множини мають спільне значення <code>3<\/code>, тож об'єднання має п'ять різних елементів: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Переріз<\/em> <code>∩<\/code> (або <code>(&amp;)<\/code>) залишає лише ті значення, що є в обох множинах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — зверніть увагу, що множини невпорядковані\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут переріз містить <code>2<\/code> і <code>3<\/code> — значення, наявні в обох множинах.<\/span> <span class=\"sg\" data-s=\"1\">Множина не має власного порядку, тож при виведенні ці два елементи можуть з'явитися в будь-якому порядку.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Результатом цих операцій є знову множина, тож їй можна ставити ті самі запитання: скільки в ній елементів і чи належить їй конкретне значення.<\/span><\/p>"]]},"bg":{"t":"Операции с множества","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Множествата могат да се комбинират с обичайните операции от теорията на множествата.<\/span> <span class=\"sg\" data-s=\"1\">Всеки оператор има Unicode символ и ASCII изписване; можете да използвате което предпочитате.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Обединението<\/em> <code>∪<\/code> (или <code>(|)<\/code>) събира всички стойности, които са в което и да е от двете множества:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двете множества споделят стойността <code>3<\/code>, затова обединението има пет различни елемента: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Сечението<\/em> <code>∩<\/code> (или <code>(&amp;)<\/code>) запазва само стойностите, които са и в двете множества:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук сечението съдържа <code>2<\/code> и <code>3<\/code> — стойностите, присъстващи и в двете множества.<\/span> <span class=\"sg\" data-s=\"1\">Множеството няма вътрешен ред, затова двата елемента могат да се появят в произволен ред при извеждане.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Резултатът от тези операции сам по себе си е множество, така че можете да му задавате същите въпроси: колко елемента има и дали определена стойност принадлежи към него.<\/span><\/p>"]]},"la":{"t":"Operationes coniunctorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Inopiae coniungi possunt operationibus usitatis ex theoria inopiarum.<\/span> <span class=\"sg\" data-s=\"1\">Quisque operator symbolum Unicode et scripturam ASCII habet; utroque uti potes prout mavis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Unio<\/em> <code>∪<\/code> (vel <code>(|)<\/code>) omnes valores colligit qui in alterutra inopia sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duae inopiae valorem <code>3<\/code> communem habent, itaque unio quinque elementa distincta habet: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Intersectio<\/em> <code>∩<\/code> (vel <code>(&amp;)<\/code>) tantum valores retinet qui in utraque inopia sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — nota inopias non ordinatas esse\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic intersectio <code>2<\/code> et <code>3<\/code> continet — valores in utraque inopia praesentes.<\/span> <span class=\"sg\" data-s=\"1\">Inopia ordinem intrinsecum non habet, itaque duo elementa quolibet ordine impressa apparere possunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Resultatum harum operationum ipsum inopia est, itaque easdem quaestiones ei ponere potes: quot elementa habeat, et num certus valor ad eam pertineat.<\/span><\/p>"]]}}}</script>
