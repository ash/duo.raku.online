<script type="application/json" id="page-data">{"u":"advanced/date-and-time/arithmetic","n":477,"k":"topic","pv":"advanced/date-and-time","nx":"advanced/date-and-time/arithmetic/quiz","tr":["advanced","advanced/date-and-time"],"L":{"en":{"t":"Date arithmetic","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dates support arithmetic, which makes many everyday calculations simple.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adding an integer to a date moves it forward by that many days.<\/span> <span class=\"sg\" data-s=\"1\">The result is a new date, with the month and year adjusted automatically:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Subtracting one date from another gives the number of days between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For larger steps, the <code>later<\/code> and <code>earlier<\/code> methods accept named arguments such as <code>:days<\/code>, <code>:months<\/code>, or <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">These methods keep the arithmetic correct across month and year boundaries, so you never have to worry about how many days a particular month has.<\/span><\/p>"]]},"de":{"t":"Datumsarithmetik","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Daten unterstützen Arithmetik, was viele alltägliche Berechnungen einfach macht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du eine ganze Zahl zu einem Datum addierst, wird es um diese Anzahl von Tagen nach vorne verschoben.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis ist ein neues Datum, wobei Monat und Jahr automatisch angepasst werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Datum von einem anderen subtrahierst, erhältst du die Anzahl der Tage zwischen ihnen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für größere Schritte akzeptieren die Methoden <code>later<\/code> und <code>earlier<\/code> benannte Argumente wie <code>:days<\/code>, <code>:months<\/code> oder <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diese Methoden halten die Arithmetik über Monats- und Jahresgrenzen hinweg korrekt, sodass du dir nie Gedanken darüber machen musst, wie viele Tage ein bestimmter Monat hat.<\/span><\/p>"]]},"nl":{"t":"Datumrekenen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Datums ondersteunen rekenkundige bewerkingen, waardoor veel alledaagse berekeningen eenvoudig worden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een geheel getal optellen bij een datum verschuift deze dat aantal dagen vooruit.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is een nieuwe datum, waarbij de maand en het jaar automatisch worden aangepast:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De ene datum van de andere aftrekken geeft het aantal dagen ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor grotere stappen accepteren de methoden <code>later<\/code> en <code>earlier<\/code> benoemde argumenten zoals <code>:days<\/code>, <code>:months<\/code> of <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze methoden houden de berekening correct over maand- en jaargrenzen heen, zodat je je nooit zorgen hoeft te maken over hoeveel dagen een bepaalde maand heeft.<\/span><\/p>"]]},"es":{"t":"Aritmética de fechas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Las fechas admiten aritmética, lo que hace que muchos cálculos cotidianos sean simples.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sumar un entero a una fecha la avanza esa cantidad de días.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es una nueva fecha, con el mes y el año ajustados automáticamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Restar una fecha de otra da el número de días entre ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para pasos más grandes, los métodos <code>later<\/code> y <code>earlier<\/code> aceptan argumentos con nombre como <code>:days<\/code>, <code>:months<\/code> o <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estos métodos mantienen la aritmética correcta a través de los límites de meses y años, por lo que nunca tienes que preocuparte por cuántos días tiene un mes en particular.<\/span><\/p>"]]},"it":{"t":"Aritmetica delle date","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Le date supportano l'aritmetica, il che rende semplici molti calcoli di uso quotidiano.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aggiungendo un intero a una data, questa viene spostata in avanti di quel numero di giorni.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è una nuova data, con mese e anno aggiornati automaticamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sottraendo una data da un'altra si ottiene il numero di giorni che le separano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per intervalli più ampi, i metodi <code>later<\/code> e <code>earlier<\/code> accettano argomenti con nome come <code>:days<\/code>, <code>:months<\/code> o <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questi metodi garantiscono la correttezza dell'aritmetica anche ai cambi di mese e di anno, evitando di doversi preoccupare di quanti giorni abbia un determinato mese.<\/span><\/p>"]]},"lv":{"t":"Datumu aritmētika","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Datumi atbalsta aritmētiku, kas daudzus ikdienišķus aprēķinus padara vienkāršus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pieskaitot datumam veselu skaitli, tas tiek pavirzīts uz priekšu par tik dienām.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts ir jauns datums, kuram mēnesis un gads pielāgoti automātiski:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atņemot vienu datumu no otra, tiek iegūts dienu skaits starp tiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lielākiem soļiem metodes <code>later<\/code> un <code>earlier<\/code> pieņem nosauktus argumentus, piemēram, <code>:days<\/code>, <code>:months<\/code> vai <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šīs metodes uztur aritmētiku pareizu pāri mēnešu un gadu robežām, tāpēc nekad nav jāraizējas par to, cik dienu ir konkrētajā mēnesī.<\/span><\/p>"]]},"ru":{"t":"Арифметика дат","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Даты поддерживают арифметические операции, что делает многие повседневные вычисления простыми.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прибавление целого числа к дате сдвигает её вперед на указанное количество дней.<\/span> <span class=\"sg\" data-s=\"1\">Результатом является новая дата, в которой месяц и год корректируются автоматически:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вычитание одной даты из другой дает количество дней между ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для более крупных шагов методы <code>later<\/code> и <code>earlier<\/code> принимают именованные аргументы, такие как <code>:days<\/code>, <code>:months<\/code> или <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эти методы правильно выполняют арифметику на границах месяцев и лет, поэтому вам не нужно беспокоиться о том, сколько дней в конкретном месяце.<\/span><\/p>"]]},"uk":{"t":"Арифметика дат","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Дати підтримують арифметику, що спрощує багато щоденних обчислень.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Додавання цілого числа до дати зсуває її вперед на стільки днів.<\/span> <span class=\"sg\" data-s=\"1\">Результатом є нова дата, у якій місяць і рік скориговано автоматично:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Віднімання однієї дати від іншої дає кількість днів між ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для більших кроків методи <code>later<\/code> та <code>earlier<\/code> приймають іменовані аргументи, як-от <code>:days<\/code>, <code>:months<\/code> чи <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ці методи зберігають правильність арифметики на межах місяців і років, тож вам ніколи не доведеться перейматися тим, скільки днів має конкретний місяць.<\/span><\/p>"]]},"bg":{"t":"Аритметика с дати","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Датите поддържат аритметика, което прави много ежедневни изчисления прости.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавянето на цяло число към дата я премества напред с толкова дни.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е нова дата, с автоматично коригирани месец и година:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изваждането на една дата от друга дава броя дни между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За по-големи стъпки методите <code>later<\/code> и <code>earlier<\/code> приемат именувани аргументи като <code>:days<\/code>, <code>:months<\/code> или <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тези методи поддържат коректна аритметика при преминаване през граници на месеци и години, така че никога не се налага да се притеснявате колко дни има даден месец.<\/span><\/p>"]]},"eo":{"t":"Datkalkulado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Datoj subtenas aritmetikon, kio faras multajn ĉiutagajn kalkulojn simplaj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aldoni entjeron al dato movas ĝin antaŭen je tiom da tagoj.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas nova dato, kun la monato kaj la jaro aŭtomate ĝustigitaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Subtrahi unu daton de alia donas la nombron de tagoj inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por pli grandaj paŝoj, la metodoj <code>later<\/code> kaj <code>earlier<\/code> akceptas nomitajn argumentojn kiel <code>:days<\/code>, <code>:months<\/code> aŭ <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj metodoj konservas la aritmetikon ĝusta trans monataj kaj jaraj limoj, do vi neniam devas zorgi pri tio, kiom da tagoj havas aparta monato.<\/span><\/p>"]]},"la":{"t":"Arithmetica dierum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies arithmeticam sustinent, quod multas computationes cotidianas simplices reddit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Addendo numerum integrum ad diem eum promovet tot diebus.<\/span> <span class=\"sg\" data-s=\"1\">Eventus est novus dies, mense et anno automatice accommodatis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Subtrahendo unum diem ab alio dat numerum dierum inter eos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro maioribus passibus, methodi <code>later<\/code> et <code>earlier<\/code> argumenta nominata accipiunt sicut <code>:days<\/code>, <code>:months<\/code>, vel <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hae methodi arithmeticam rectam servant trans fines mensium et annorum, itaque numquam sollicitari debes quot dies mensis particularis habeat.<\/span><\/p>"]]}}}</script>
