<script type="application/json" id="page-data">{"u":"advanced/date-and-time/time","n":480,"k":"topic","pv":"advanced/date-and-time/arithmetic/quiz2","nx":"advanced/date-and-time/exercises","tr":["advanced","advanced/date-and-time"],"L":{"en":{"t":"Working with time","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you need the time of day as well as the date, use the <code>DateTime<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\">It is created much like a <code>Date<\/code>, but you also give the hour, minute, and second:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The default text form follows the ISO 8601 standard: the date, the letter <code>T<\/code>, the time, and a trailing <code>Z<\/code> for the UTC time zone.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>DateTime<\/code> gives access to the time parts, in addition to the date parts you already know:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To get the current moment, call <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">As with <code>Date.today<\/code>, we do not show its output, because it changes every time the program runs.<\/span><\/p>"]]},"de":{"t":"Mit Uhrzeiten arbeiten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du neben dem Datum auch die Uhrzeit benötigst, verwende den Typ <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er wird ähnlich wie ein <code>Date<\/code> erstellt, aber du gibst zusätzlich die Stunde, Minute und Sekunde an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die standardmaessige Textdarstellung folgt dem ISO-8601-Standard: das Datum, der Buchstabe <code>T<\/code>, die Uhrzeit und ein abschliessendes <code>Z<\/code> für die UTC-Zeitzone.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>DateTime<\/code> bietet Zugriff auf die Zeitbestandteile, zusätzlich zu den Datumsbestandteilen, die du bereits kennst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um den aktuellen Zeitpunkt zu erhalten, rufe <code>DateTime.now<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Wie bei <code>Date.today<\/code> zeigen wir die Ausgabe nicht, da sie sich bei jeder Programmausführung ändert.<\/span><\/p>"]]},"nl":{"t":"Werken met tijd","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je naast de datum ook de tijd van de dag nodig hebt, gebruik je het <code>DateTime<\/code>-type.<\/span> <span class=\"sg\" data-s=\"1\">Het wordt op vrijwel dezelfde manier aangemaakt als een <code>Date<\/code>, maar je geeft ook het uur, de minuut en de seconde op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De standaard tekstweergave volgt de ISO 8601-standaard: de datum, de letter <code>T<\/code>, de tijd, en een afsluitende <code>Z<\/code> voor de UTC-tijdzone.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>DateTime<\/code> geeft toegang tot de tijddelen, naast de datumdelen die je al kent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om het huidige moment te krijgen, roep je <code>DateTime.now<\/code> aan.<\/span> <span class=\"sg\" data-s=\"1\">Net als bij <code>Date.today<\/code> tonen we de uitvoer niet, omdat die elke keer dat het programma wordt uitgevoerd verandert.<\/span><\/p>"]]},"es":{"t":"Trabajando con la hora","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando necesitas la hora del día además de la fecha, usa el tipo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se crea de forma similar a un <code>Date<\/code>, pero también proporcionas la hora, el minuto y el segundo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma de texto predeterminada sigue el estándar ISO 8601: la fecha, la letra <code>T<\/code>, la hora y una <code>Z<\/code> final para la zona horaria UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>DateTime<\/code> da acceso a las partes de la hora, además de las partes de la fecha que ya conoces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para obtener el momento actual, llama a <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Al igual que con <code>Date.today<\/code>, no mostramos su salida, porque cambia cada vez que se ejecuta el programa.<\/span><\/p>"]]},"it":{"t":"Lavorare con l'ora","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando oltre alla data si ha bisogno anche dell'orario, si usa il tipo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si crea in modo simile a <code>Date<\/code>, ma specificando anche ora, minuti e secondi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rappresentazione testuale predefinita segue lo standard ISO 8601: la data, la lettera <code>T<\/code>, l'orario e una <code>Z<\/code> finale per il fuso orario UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>DateTime<\/code> permette di accedere alle componenti orarie, oltre alle parti della data già note:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per ottenere l'istante corrente, si chiama <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Come per <code>Date.today<\/code>, non ne mostriamo l'output, perché cambia ogni volta che il programma viene eseguito.<\/span><\/p>"]]},"lv":{"t":"Darbs ar laiku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad līdz ar datumu nepieciešams arī diennakts laiks, izmantojiet tipu <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To izveido gluži tāpat kā <code>Date<\/code>, tikai norādot arī stundu, minūti un sekundi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Noklusētā teksta forma seko ISO 8601 standartam: datums, burts <code>T<\/code>, laiks un beigās <code>Z<\/code> par UTC laika joslu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> dod piekļuvi laika daļām papildus jau zināmajām datuma daļām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu pašreizējo brīdi, izsauciet <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā <code>Date.today<\/code> gadījumā, tā izvadi nerādām, jo tā mainās katrā programmas palaišanas reizē.<\/span><\/p>"]]},"ru":{"t":"Работа со временем","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вам нужно время суток в дополнение к дате, используйте тип <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он создается аналогично <code>Date<\/code>, но вы также указываете час, минуту и секунду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Текстовая форма по умолчанию соответствует стандарту ISO 8601: дата, буква <code>T<\/code>, время и завершающая <code>Z<\/code> для часового пояса UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> предоставляет доступ к компонентам времени в дополнение к уже знакомым компонентам даты:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить текущий момент времени, вызовите <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Как и в случае с <code>Date.today<\/code>, мы не показываем результат, потому что он меняется при каждом запуске программы.<\/span><\/p>"]]},"uk":{"t":"Робота з часом","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли крім дати потрібен і час доби, скористайтеся типом <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він створюється дуже схоже на <code>Date<\/code>, але ви додатково вказуєте годину, хвилину й секунду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типова текстова форма відповідає стандарту ISO 8601: дата, літера <code>T<\/code>, час і завершальна <code>Z<\/code> для часового поясу UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> дає доступ до складових часу на додачу до вже знайомих вам складових дати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати поточну мить, викличте <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Як і з <code>Date.today<\/code>, ми не показуємо її вивід, бо він змінюється щоразу, коли програма запускається.<\/span><\/p>"]]},"bg":{"t":"Работа с време","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато имате нужда от часа на деня, както и от датата, използвайте типа <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той се създава подобно на <code>Date<\/code>, но подавате също час, минута и секунда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Текстовата форма по подразбиране следва стандарта ISO 8601: датата, буквата <code>T<\/code>, часът и завършващо <code>Z<\/code> за часовата зона UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> дава достъп до частите на времето, в допълнение към частите на датата, които вече познавате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да получите текущия момент, извикайте <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Както при <code>Date.today<\/code>, не показваме резултата, защото той се променя всеки път, когато програмата се изпълнява.<\/span><\/p>"]]},"eo":{"t":"Laboro kun tempo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi bezonas la horon de la tago same kiel la daton, uzu la tipon <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas kreata multe kiel <code>Date<\/code>, sed vi ankaŭ donas la horon, la minuton kaj la sekundon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La defaŭlta teksta formo sekvas la normon ISO 8601: la dato, la litero <code>T<\/code>, la tempo, kaj fina <code>Z<\/code> por la horzono UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> donas aliron al la tempaj partoj, krom la datpartoj, kiujn vi jam konas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por ricevi la nunan momenton, voku <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kiel ĉe <code>Date.today<\/code>, ni ne montras ĝian eligon, ĉar ĝi ŝanĝiĝas ĉiufoje kiam la programo ruliĝas.<\/span><\/p>"]]},"la":{"t":"Laborando cum tempore","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum tempus diei necnon diem requiris, utere typo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Creatur similiter ac <code>Date<\/code>, sed etiam horam, minutum, et secundum das:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Forma textus praedefinita normam ISO 8601 sequitur: dies, littera <code>T<\/code>, tempus, et <code>Z<\/code> finalis pro zona temporis UTC.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> accessum ad partes temporis praebet, praeter partes diei quas iam cognoscis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad momentum praesens obtinendum, voca <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sicut cum <code>Date.today<\/code>, output eius non monstramus, quia mutat quotiens programma currit.<\/span><\/p>"]]}}}</script>
