<script type="application/json" id="page-data">{"u":"advanced/date-and-time","n":476,"k":"section","pv":"advanced/quoting/exercises/a-heredoc/solution","nx":"advanced/date-and-time/arithmetic","tr":["advanced"],"L":{"en":{"t":"Date and time","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku has built-in types for working with calendar dates and clock times.<\/span> <span class=\"sg\" data-s=\"1\">A calendar date is represented by the <code>Date<\/code> type.<\/span> <span class=\"sg\" data-s=\"2\">You create one by giving the year, month, and day:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Once you have a date, you can read its parts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>day-of-week<\/code> method returns which day of the week the date falls on, numbered from <code>1<\/code> for Monday to <code>7<\/code> for Sunday:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The 27th of June 2026 is a Saturday, so the result is <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>is-leap-year<\/code> method reports whether the date is in a leap year:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To get today’s date, call <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">We do not show its output here, because it depends on the day you run the program.<\/span><\/p>"]]},"de":{"t":"Datum und Uhrzeit","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku hat eingebaute Typen zur Arbeit mit Kalenderdaten und Uhrzeiten.<\/span> <span class=\"sg\" data-s=\"1\">Ein Kalenderdatum wird durch den Typ <code>Date<\/code> dargestellt.<\/span> <span class=\"sg\" data-s=\"2\">Du erstellst eines, indem du das Jahr, den Monat und den Tag angibst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sobald du ein Datum hast, kannst du seine Bestandteile auslesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>day-of-week<\/code> gibt zurück, auf welchen Wochentag das Datum fällt, nummeriert von <code>1<\/code> für Montag bis <code>7<\/code> für Sonntag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der 27.<\/span> <span class=\"sg\" data-s=\"1\">Juni 2026 ist ein Samstag, daher ist das Ergebnis <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>is-leap-year<\/code> gibt an, ob das Datum in einem Schaltjahr liegt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um das heutige Datum zu erhalten, rufe <code>Date.today<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Wir zeigen die Ausgabe hier nicht, da sie vom Tag abhängt, an dem du das Programm ausführst.<\/span><\/p>"]]},"nl":{"t":"Datum en tijd","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku heeft ingebouwde typen om te werken met kalenderdatums en kloktijden.<\/span> <span class=\"sg\" data-s=\"1\">Een kalenderdatum wordt weergegeven door het <code>Date<\/code>-type.<\/span> <span class=\"sg\" data-s=\"2\">Je maakt er een aan door het jaar, de maand en de dag op te geven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zodra je een datum hebt, kun je de onderdelen ervan uitlezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>day-of-week<\/code> geeft aan op welke dag van de week de datum valt, genummerd van <code>1<\/code> voor maandag tot <code>7<\/code> voor zondag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De 27e juni 2026 is een zaterdag, dus het resultaat is <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>is-leap-year<\/code> geeft aan of de datum in een schrikkeljaar valt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om de datum van vandaag te krijgen, roep je <code>Date.today<\/code> aan.<\/span> <span class=\"sg\" data-s=\"1\">We tonen de uitvoer hier niet, omdat die afhangt van de dag waarop je het programma uitvoert.<\/span><\/p>"]]},"es":{"t":"Fecha y hora","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku tiene tipos incorporados para trabajar con fechas de calendario y horas del reloj.<\/span> <span class=\"sg\" data-s=\"1\">Una fecha de calendario se representa con el tipo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes crear una proporcionando el año, mes y día:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una vez que tienes una fecha, puedes leer sus partes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>day-of-week<\/code> devuelve en qué día de la semana cae la fecha, numerado desde <code>1<\/code> para el lunes hasta <code>7<\/code> para el domingo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El 27 de junio de 2026 es un sábado, por lo que el resultado es <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>is-leap-year<\/code> indica si la fecha está en un año bisiesto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para obtener la fecha de hoy, llama a <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">No mostramos su salida aquí, porque depende del día en que ejecutes el programa.<\/span><\/p>"]]},"it":{"t":"Data e ora","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku dispone di tipi predefiniti per lavorare con le date del calendario e gli orari.<\/span> <span class=\"sg\" data-s=\"1\">Una data è rappresentata dal tipo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si crea fornendo l'anno, il mese e il giorno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una volta ottenuta una data, è possibile leggerne le singole parti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>day-of-week<\/code> restituisce il giorno della settimana in cui cade la data, numerato da <code>1<\/code> per il lunedì a <code>7<\/code> per la domenica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il 27 giugno 2026 è un sabato, quindi il risultato è <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>is-leap-year<\/code> indica se la data si trova in un anno bisestile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per ottenere la data odierna, si chiama <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non ne mostriamo l'output qui, perché dipende dal giorno in cui si esegue il programma.<\/span><\/p>"]]},"lv":{"t":"Datums un laiks","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ir iebūvēti tipi darbam ar kalendāra datumiem un pulksteņa laikiem.<\/span> <span class=\"sg\" data-s=\"1\">Kalendāra datumu attēlo tips <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">To izveido, norādot gadu, mēnesi un dienu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad datums ir iegūts, var nolasīt tā daļas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>day-of-week<\/code> atgriež, uz kuru nedēļas dienu datums krīt, numurējot no <code>1<\/code> par pirmdienu līdz <code>7<\/code> par svētdienu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">gada 27. jūnijs ir sestdiena, tāpēc rezultāts ir <code>6<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>is-leap-year<\/code> pasaka, vai datums ir garajā gadā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu šodienas datumu, izsauciet <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā izvadi šeit nerādām, jo tā ir atkarīga no dienas, kurā programmu palaižat.<\/span><\/p>"]]},"ru":{"t":"Дата и время","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku есть встроенные типы для работы с календарными датами и временем.<\/span> <span class=\"sg\" data-s=\"1\">Календарная дата представлена типом <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вы создаете её, указывая год, месяц и день:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Получив дату, вы можете прочитать её составные части:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>day-of-week<\/code> возвращает день недели, на который приходится дата, нумеруя дни от <code>1<\/code> для понедельника до <code>7<\/code> для воскресенья:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 июня 2026 года — суббота, поэтому результат равен <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>is-leap-year<\/code> сообщает, является ли год даты високосным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить сегодняшнюю дату, вызовите <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Мы не показываем здесь результат, так как он зависит от дня, когда вы запускаете программу.<\/span><\/p>"]]},"uk":{"t":"Дата й час","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku є вбудовані типи для роботи з календарними датами та годинниковим часом.<\/span> <span class=\"sg\" data-s=\"1\">Календарну дату подає тип <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви створюєте її, вказавши рік, місяць і день:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Маючи дату, можна прочитати її складові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>day-of-week<\/code> повертає, на який день тижня припадає дата, з нумерацією від <code>1<\/code> для понеділка до <code>7<\/code> для неділі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 червня 2026 року — субота, тож результат — <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>is-leap-year<\/code> повідомляє, чи припадає дата на високосний рік:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати сьогоднішню дату, викличте <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Її вивід ми тут не показуємо, бо він залежить від дня, коли ви запускаєте програму.<\/span><\/p>"]]},"bg":{"t":"Дата и време","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku има вградени типове за работа с календарни дати и часове.<\/span> <span class=\"sg\" data-s=\"1\">Календарната дата се представя от типа <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Създавате такава, като подадете годината, месеца и деня:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След като имате дата, можете да прочетете нейните части:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>day-of-week<\/code> връща кой ден от седмицата е датата, номериран от <code>1<\/code> за понеделник до <code>7<\/code> за неделя:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 юни 2026 г. е събота, така че резултатът е <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>is-leap-year<\/code> показва дали датата е в високосна година:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да получите днешната дата, извикайте <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Не показваме резултата тук, тъй като зависи от деня, в който стартирате програмата.<\/span><\/p>"]]},"la":{"t":"Dies et tempus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku habet typos integratos ad operandum cum diebus calendarii et temporibus horologii.<\/span> <span class=\"sg\" data-s=\"1\">Dies calendarii repraesentatur typo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Unum creas dando annum, mensem, et diem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum diem habes, partes eius legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>day-of-week<\/code> refert quem diem hebdomadis dies cadat, numeratum ab <code>1<\/code> pro die Lunae ad <code>7<\/code> pro die Solis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies 27 Iunii 2026 est dies Saturni, itaque eventus est <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>is-leap-year<\/code> refert num dies in anno bisextili sit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad diem hodiernum obtinendum, voca <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Output eius hic non monstramus, quia pendet a die quo programma curris.<\/span><\/p>"]]}}}</script>
