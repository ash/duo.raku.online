<script type="application/json" id="page-data">{"u":"advanced/containers","n":352,"k":"section","pv":"advanced/dd/exercises/dump-a-hash/solution","nx":"advanced/scalar-containers","tr":["advanced"],"L":{"en":{"t":"Understanding Raku containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Containers in the Raku programming language serve to keep data, but their role and meaning are deeper and wider than simply being a variable.<\/span> <span class=\"sg\" data-s=\"1\">This section gives an overview of the different container types available to a Raku developer.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is important to understand the concept of containers.<\/span> <span class=\"sg\" data-s=\"1\">Without it, it may seem surprising that in some cases a program appears to use a scalar where you expected an array, or the other way around.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Different containers can host data of a different nature, of a different size, or even a different number of data items.<\/span> <span class=\"sg\" data-s=\"1\">Correspondingly, each type of container has its own methods to manipulate the data it holds.<\/span><\/p>"]]},"de":{"t":"Verständnis von Raku-Containern","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Container in der Programmiersprache Raku dienen dazu, Daten aufzubewahren, aber ihre Rolle und Bedeutung sind tiefgreifender und umfassender als nur eine Variable zu sein.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt gibt einen Überblick über die verschiedenen Containertypen, die einem Raku-Entwickler zur Verfügung stehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist wichtig, das Konzept der Container zu verstehen.<\/span> <span class=\"sg\" data-s=\"1\">Ohne dieses Verständnis kann es überraschend erscheinen, dass ein Programm in manchen Fällen einen Skalar zu verwenden scheint, wo man ein Array erwartet hätte, oder umgekehrt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verschiedene Container können Daten unterschiedlicher Natur, unterschiedlicher Größe oder sogar einer unterschiedlichen Anzahl von Datenelementen aufnehmen.<\/span> <span class=\"sg\" data-s=\"1\">Entsprechend hat jeder Containertyp seine eigenen Methoden, um die darin enthaltenen Daten zu manipulieren.<\/span><\/p>"]]},"nl":{"t":"Raku-containers begrijpen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Containers in de programmeertaal Raku dienen om gegevens op te slaan, maar hun rol en betekenis zijn dieper en breder dan simpelweg een variabele zijn.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte geeft een overzicht van de verschillende containertypen die beschikbaar zijn voor een Raku-ontwikkelaar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is belangrijk om het concept van containers te begrijpen.<\/span> <span class=\"sg\" data-s=\"1\">Zonder dit begrip kan het verrassend lijken dat een programma in sommige gevallen een scalar lijkt te gebruiken waar je een array verwachtte, of andersom.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verschillende containers kunnen gegevens van een verschillende aard, van een verschillende omvang, of zelfs een verschillend aantal gegevenselementen bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Elk type container heeft dienovereenkomstig zijn eigen methoden om de gegevens die het bevat te manipuleren.<\/span><\/p>"]]},"es":{"t":"Comprender los contenedores de Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los contenedores en el lenguaje de programación Raku sirven para almacenar datos, pero su papel y significado son más profundos y amplios que simplemente ser una variable.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección ofrece una visión general de los diferentes tipos de contenedores disponibles para un desarrollador de Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es importante entender el concepto de contenedores.<\/span> <span class=\"sg\" data-s=\"1\">Sin ello, puede parecer sorprendente que en algunos casos un programa parezca usar un escalar donde esperabas un arreglo, o viceversa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diferentes contenedores pueden albergar datos de diferente naturaleza, de diferente tamaño, o incluso una cantidad diferente de elementos de datos.<\/span> <span class=\"sg\" data-s=\"1\">Correspondientemente, cada tipo de contenedor tiene sus propios métodos para manipular los datos que contiene.<\/span><\/p>"]]},"it":{"t":"Comprendere i contenitori di Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I contenitori nel linguaggio di programmazione Raku servono per conservare dati, ma il loro ruolo e significato sono più profondi e ampi del semplice essere una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione offre una panoramica dei diversi tipi di contenitori disponibili per uno sviluppatore Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È importante comprendere il concetto di contenitori.<\/span> <span class=\"sg\" data-s=\"1\">Senza di esso, potrebbe sembrare sorprendente che in alcuni casi un programma sembri usare uno scalare dove ci si aspettava un array, o viceversa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Contenitori diversi possono ospitare dati di natura diversa, di dimensioni diverse o persino un numero diverso di elementi.<\/span> <span class=\"sg\" data-s=\"1\">Di conseguenza, ogni tipo di contenitore ha i propri metodi per manipolare i dati che contiene.<\/span><\/p>"]]},"lv":{"t":"Raku konteineru izpratne","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Konteineri Raku programmēšanas valodā kalpo datu glabāšanai, taču to loma un nozīme ir plašāka un dziļāka nekā vienkārši būt mainīgajam.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā sniegts pārskats par dažādajiem konteineru veidiem, kas pieejami Raku izstrādātājam.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir svarīgi izprast konteineru konceptu.<\/span> <span class=\"sg\" data-s=\"1\">Bez tā var šķist pārsteidzoši, ka dažos gadījumos programma, šķiet, izmanto skalāru, kur jūs gaidījāt masīvu, vai otrādi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažādi konteineri var saturēt dažāda rakstura, dažāda izmēra vai pat dažāda skaita datu elementus.<\/span> <span class=\"sg\" data-s=\"1\">Attiecīgi katram konteinera veidam ir savas metodes, lai manipulētu ar tajā glabātajiem datiem.<\/span><\/p>"]]},"ru":{"t":"Понимание контейнеров Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Контейнеры в языке программирования Raku служат для хранения данных, но их роль и значение глубже и шире, чем просто быть переменной.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе даётся обзор различных типов контейнеров, доступных разработчику на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Важно понимать концепцию контейнеров.<\/span> <span class=\"sg\" data-s=\"1\">Без этого может показаться удивительным, что в некоторых случаях программа, похоже, использует скаляр там, где ожидался массив, или наоборот.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разные контейнеры могут хранить данные разной природы, разного размера или даже разное количество элементов данных.<\/span> <span class=\"sg\" data-s=\"1\">Соответственно, каждый тип контейнера имеет свои методы для работы с хранящимися в нём данными.<\/span><\/p>"]]},"uk":{"t":"Розуміння контейнерів Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Контейнери в мові програмування Raku служать для зберігання даних, але їхня роль і значення глибші й ширші, ніж просто бути змінною.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ дає огляд різних типів контейнерів, доступних розробнику на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Розуміти поняття контейнерів важливо.<\/span> <span class=\"sg\" data-s=\"1\">Без цього може здаватися дивним, що в деяких випадках програма ніби використовує скаляр там, де ви очікували масив, або навпаки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Різні контейнери можуть містити дані іншої природи, іншого розміру й навіть іншу кількість елементів.<\/span> <span class=\"sg\" data-s=\"1\">Відповідно, кожен тип контейнера має власні методи для роботи з даними, які він зберігає.<\/span><\/p>"]]},"bg":{"t":"Разбиране на Raku контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Контейнерите в програмния език Raku служат за съхранение на данни, но тяхната роля и значение са по-дълбоки и по-широки от простото използване като променлива.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел дава общ преглед на различните типове контейнери, достъпни за разработчика на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Важно е да се разбере концепцията за контейнерите.<\/span> <span class=\"sg\" data-s=\"1\">Без нея може да изглежда изненадващо, че в някои случаи програмата използва скалар, където очаквате масив, или обратното.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Различните контейнери могат да съдържат данни от различно естество, с различен размер или дори различен брой елементи от данни.<\/span> <span class=\"sg\" data-s=\"1\">Съответно, всеки тип контейнер има свои собствени методи за манипулиране на данните, които съдържа.<\/span><\/p>"]]},"eo":{"t":"Kompreno de Raku-ujoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ujoj en la programlingvo Raku servas por teni datumojn, sed ilia rolo kaj signifo estas pli profundaj kaj pli vastaj ol simple esti variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio donas superrigardon de la diversaj ujtipoj disponeblaj por Raku-programisto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gravas kompreni la koncepton de ujoj.<\/span> <span class=\"sg\" data-s=\"1\">Sen tio, povas ŝajni surprize, ke en iuj kazoj programo ŝajnas uzi skalaron kie vi atendis tabelon, aŭ inverse.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Malsamaj ujoj povas enhavi datumojn de malsama naturo, de malsama grandeco, aŭ eĉ malsama nombro da datumelementoj.<\/span> <span class=\"sg\" data-s=\"1\">Respektive, ĉiu ujtipo havas siajn proprajn metodojn por manipuli la datumojn, kiujn ĝi enhavas.<\/span><\/p>"]]},"la":{"t":"Intellectus receptaculorum Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Continentes in lingua programmandi Raku data servare possunt, sed eorum munus et significatio profundior et latior est quam simpliciter variabilis esse.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio conspectum diversorum typorum continentium quae developori Raku praesto sunt praebet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Magni momenti est conceptum continentium intellegere.<\/span> <span class=\"sg\" data-s=\"1\">Sine eo, mirabile videri potest quod in quibusdam casibus programma scalarem adhibere videtur ubi ordinem exspectabas, vel vice versa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diversi continentes data diversae naturae, diversae magnitudinis, vel etiam diversi numeri elementorum datorum hospites possunt.<\/span> <span class=\"sg\" data-s=\"1\">Correspondenter, quisque typus continentis proprias methodos ad data quae continet tractanda habet.<\/span><\/p>"]]}}}</script>
