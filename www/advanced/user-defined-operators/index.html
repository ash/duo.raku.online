<script type="application/json" id="page-data">{"u":"advanced/user-defined-operators","n":555,"k":"section","pv":"advanced/metaoperators/exercises/concatenate-a-list/solution","nx":"advanced/user-defined-operators/exercises","tr":["advanced"],"L":{"en":{"t":"User-defined operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operators in Raku are really just subroutines with special names.<\/span> <span class=\"sg\" data-s=\"1\">That means you can define your own, using the category names you met on the <a href=\"/advanced/operator-types/\">Types of Raku operators<\/a> page: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, and so on.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To declare an operator, write a <code>sub<\/code> whose name is the category, a colon, and the operator’s symbol in angle brackets.<\/span> <span class=\"sg\" data-s=\"1\">Here is a new infix operator called <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Once defined, <code>plus<\/code> is used between its two operands, exactly like any built-in infix operator.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A postfix operator follows its operand.<\/span> <span class=\"sg\" data-s=\"1\">The factorial is a classic example — here it is as the <code>!<\/code> postfix operator, built on <a href=\"/advanced/metaoperators/reduction/\">the reduction meta-operator<\/a> you met earlier:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You are not limited to letters and ASCII punctuation; an operator’s symbol can be any character.<\/span> <span class=\"sg\" data-s=\"1\">This prefix operator uses the section sign to double a number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Defining operators is a powerful tool, so use it with taste: a well-chosen operator can make code read like the problem domain, while an obscure one only puzzles the next reader.<\/span><\/p>"]]},"de":{"t":"Benutzerdefinierte Operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operatoren in Raku sind eigentlich nur Subroutinen mit speziellen Namen.<\/span> <span class=\"sg\" data-s=\"1\">Das bedeutet, du kannst deine eigenen definieren, indem du die Kategorienamen verwendest, die du auf der Seite <a href=\"https://course.raku.org/de/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Typen von Raku-Operatoren<\/a> kennengelernt hast: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> und so weiter.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um einen Operator zu deklarieren, schreibst du ein <code>sub<\/code>, dessen Name die Kategorie ist, ein Doppelpunkt und das Symbol des Operators in spitzen Klammern.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist ein neuer Infix-Operator namens <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einmal definiert, wird <code>plus<\/code> zwischen seinen zwei Operanden verwendet, genau wie jeder eingebaute Infix-Operator.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Postfix-Operator folgt seinem Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Die Fakultät ist ein klassisches Beispiel — hier als <code>!<\/code>-Postfix-Operator, aufgebaut auf dem <a href=\"https://course.raku.org/de/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Reduktions-Meta-Operator<\/a>, den du zuvor kennengelernt hast:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du bist nicht auf Buchstaben und ASCII-Satzzeichen beschränkt; das Symbol eines Operators kann ein beliebiges Zeichen sein.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Prefix-Operator verwendet das Paragraphenzeichen, um eine Zahl zu verdoppeln:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operatoren zu definieren ist ein mächtiges Werkzeug, also setze es mit Geschmack ein: Ein gut gewählter Operator kann Code wie die Problemdomäne lesbar machen, während ein obskurer nur den nächsten Leser verwirrt.<\/span><\/p>"]]},"nl":{"t":"Zelf gedefinieerde operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operatoren in Raku zijn eigenlijk gewoon subroutines met speciale namen.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat je je eigen operatoren kunt definiëren, met behulp van de categorienamen die je tegenkwam op de pagina <a href=\"https://course.raku.org/nl/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Typen Raku-operatoren<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, enzovoort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een operator te declareren, schrijf je een <code>sub<\/code> waarvan de naam bestaat uit de categorie, een dubbele punt en het symbool van de operator tussen punthaken.<\/span> <span class=\"sg\" data-s=\"1\">Hier is een nieuwe infix-operator genaamd <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eenmaal gedefinieerd wordt <code>plus<\/code> tussen zijn twee operanden gebruikt, precies zoals elke ingebouwde infix-operator.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een postfix-operator volgt na zijn operand.<\/span> <span class=\"sg\" data-s=\"1\">De faculteit is een klassiek voorbeeld — hier is het als de <code>!<\/code> postfix-operator, gebouwd op <a href=\"https://course.raku.org/nl/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">de reductie-meta-operator<\/a> die je eerder tegenkwam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je bent niet beperkt tot letters en ASCII-leestekens; het symbool van een operator kan elk willekeurig teken zijn.<\/span> <span class=\"sg\" data-s=\"1\">Deze prefix-operator gebruikt het sectieteken om een getal te verdubbelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het definiëren van operatoren is een krachtig hulpmiddel, dus gebruik het met smaak: een goed gekozen operator kan code laten lezen als het probleemdomein, terwijl een obscure operator alleen maar de volgende lezer in verwarring brengt.<\/span><\/p>"]]},"es":{"t":"Operadores definidos por el usuario","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los operadores en Raku son en realidad subrutinas con nombres especiales.<\/span> <span class=\"sg\" data-s=\"1\">Eso significa que puedes definir los tuyos propios, utilizando los nombres de categoría que conociste en la página <a href=\"https://course.raku.org/es/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipos de operadores en Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, etc.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para declarar un operador, escribe un <code>sub<\/code> cuyo nombre sea la categoría, dos puntos y el símbolo del operador entre corchetes angulares.<\/span> <span class=\"sg\" data-s=\"1\">Aquí hay un nuevo operador infijo llamado <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una vez definido, <code>plus<\/code> se usa entre sus dos operandos, exactamente como cualquier operador infijo incorporado.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operador postfijo sigue a su operando.<\/span> <span class=\"sg\" data-s=\"1\">El factorial es un ejemplo clásico: aquí está como el operador postfijo <code>!<\/code>, construido con <a href=\"https://course.raku.org/es/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">el metaoperador de reducción<\/a> que viste anteriormente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No estás limitado a letras y puntuación ASCII; el símbolo de un operador puede ser cualquier carácter.<\/span> <span class=\"sg\" data-s=\"1\">Este operador prefijo usa el signo de sección para duplicar un número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definir operadores es una herramienta poderosa, así que úsala con buen gusto: un operador bien elegido puede hacer que el código se lea como el dominio del problema, mientras que uno oscuro solo confundirá al siguiente lector.<\/span><\/p>"]]},"it":{"t":"Operatori definiti dall'utente","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli operatori in Raku sono in realtà semplici subroutine con nomi speciali.<\/span> <span class=\"sg\" data-s=\"1\">Ciò significa che puoi definire i tuoi operatori, utilizzando i nomi di categoria che hai incontrato nella pagina <a href=\"https://course.raku.org/it/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipi di operatori Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> e così via.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per dichiarare un operatore, scrivi un <code>sub<\/code> il cui nome è la categoria, i due punti e il simbolo dell'operatore tra parentesi angolari.<\/span> <span class=\"sg\" data-s=\"1\">Ecco un nuovo operatore infisso chiamato <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una volta definito, <code>plus<\/code> viene usato tra i suoi due operandi, esattamente come qualsiasi operatore infisso predefinito.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operatore postfisso segue il suo operando.<\/span> <span class=\"sg\" data-s=\"1\">Il fattoriale è un classico esempio: eccolo come operatore postfisso <code>!<\/code>, costruito sul <a href=\"https://course.raku.org/it/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">meta-operatore di riduzione<\/a> che hai incontrato in precedenza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non sei limitato a lettere e punteggiatura ASCII; il simbolo di un operatore può essere qualsiasi carattere.<\/span> <span class=\"sg\" data-s=\"1\">Questo operatore prefisso usa il segno di sezione per raddoppiare un numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definire operatori è uno strumento potente, quindi usalo con gusto: un operatore ben scelto può far leggere il codice come il dominio del problema, mentre uno oscuro non fa che confondere il lettore successivo.<\/span><\/p>"]]},"lv":{"t":"Lietotāja definēti operatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operatori Raku patiesībā ir vienkārši apakšprogrammas ar īpašiem nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka jūs varat definēt savus, izmantojot kategoriju nosaukumus, ar kuriem iepazināties lapā <a href=\"https://course.raku.org/lv/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Raku operatoru tipi<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> un tā tālāk.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai deklarētu operatoru, rakstiet <code>sub<\/code>, kura nosaukums ir kategorija, kols un operatora simbols leņķa iekavās.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir jauns infiksa operators ar nosaukumu <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc definēšanas <code>plus<\/code> tiek izmantots starp saviem diviem operandiem, tieši kā jebkurš iebūvēts infiksa operators.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operators seko aiz sava operanda.<\/span> <span class=\"sg\" data-s=\"1\">Faktoriāls ir klasisks piemērs — šeit tas ir kā <code>!<\/code> postfiksa operators, veidots uz <a href=\"https://course.raku.org/lv/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">redukcijas metaoperatora<\/a>, ar kuru iepazināties iepriekš:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs neesat ierobežoti ar burtiem un ASCII pieturzīmēm; operatora simbols var būt jebkura rakstzīme.<\/span> <span class=\"sg\" data-s=\"1\">Šis prefiksa operators izmanto paragrāfa zīmi, lai dubultotu skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operatoru definēšana ir spēcīgs rīks, tāpēc izmantojiet to ar gaumi: labi izvēlēts operators var padarīt kodu lasāmu kā priekšmeta jomu, kamēr neskaidrs operators tikai mulsina nākamo lasītāju.<\/span><\/p>"]]},"ru":{"t":"Пользовательские операторы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторы в Raku на самом деле являются обычными подпрограммами с особыми именами.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что вы можете определять свои собственные, используя названия категорий, с которыми вы познакомились на странице <a href=\"https://course.raku.org/ru/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типы операторов Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> и другие.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы объявить оператор, напишите <code>sub<\/code>, имя которого состоит из категории, двоеточия и символа оператора в угловых скобках.<\/span> <span class=\"sg\" data-s=\"1\">Вот новый инфиксный оператор с именем <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После определения <code>plus<\/code> используется между двумя операндами, точно так же, как и любой встроенный инфиксный оператор.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Постфиксный оператор следует за своим операндом.<\/span> <span class=\"sg\" data-s=\"1\">Факториал — классический пример.<\/span> <span class=\"sg\" data-s=\"2\">Вот он в виде постфиксного оператора <code>!<\/code>, построенного на <a href=\"https://course.raku.org/ru/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператоре редукции<\/a>, с которым вы познакомились ранее:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы не ограничены буквами и символами ASCII; символом оператора может быть любой символ.<\/span> <span class=\"sg\" data-s=\"1\">Этот префиксный оператор использует знак параграфа для удвоения числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Определение операторов — мощный инструмент, поэтому используйте его с умом: удачно подобранный оператор может сделать код читаемым как описание предметной области, тогда как непонятный оператор лишь озадачит следующего читателя.<\/span><\/p>"]]},"uk":{"t":"Оператори, визначені користувачем","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператори в Raku насправді є просто підпрограмами з особливими іменами.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що ви можете визначати власні, користуючись назвами категорій, з якими познайомилися на сторінці <a href=\"https://course.raku.org/uk/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типи операторів Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> тощо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб оголосити оператор, напишіть <code>sub<\/code>, іменем якого є категорія, двокрапка й символ оператора в кутових дужках.<\/span> <span class=\"sg\" data-s=\"1\">Ось новий інфіксний оператор під назвою <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щойно його визначено, <code>plus<\/code> використовують між двома операндами — точно як будь-який вбудований інфіксний оператор.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постфіксний оператор іде за своїм операндом.<\/span> <span class=\"sg\" data-s=\"1\">Класичний приклад — факторіал; ось він як постфіксний оператор <code>!<\/code>, побудований на <a href=\"https://course.raku.org/uk/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператорі згортки<\/a>, з яким ви познайомилися раніше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви не обмежені літерами та розділовими знаками ASCII: символом оператора може бути будь-який знак.<\/span> <span class=\"sg\" data-s=\"1\">Цей префіксний оператор використовує знак параграфа, щоб подвоїти число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Визначення операторів — потужний інструмент, тож користуйтеся ним зі смаком: вдало дібраний оператор може змусити код читатися як предметна область, а незрозумілий лише спантеличить наступного читача.<\/span><\/p>"]]},"bg":{"t":"Потребителски оператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторите в Raku всъщност са просто подпрограми със специални имена.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че можете да дефинирате свои собствени, като използвате имената на категориите, които срещнахте на страницата <a href=\"https://course.raku.org/bg/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типове оператори в Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> и така нататък.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да декларирате оператор, напишете <code>sub<\/code>, чието име е категорията, двоеточие и символът на оператора в ъглови скоби.<\/span> <span class=\"sg\" data-s=\"1\">Ето един нов инфиксен оператор, наречен <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Веднъж дефиниран, <code>plus<\/code> се използва между двата си операнда, точно както всеки вграден инфиксен оператор.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постфиксният оператор следва своя операнд.<\/span> <span class=\"sg\" data-s=\"1\">Факториелът е класически пример — ето го като постфиксен оператор <code>!<\/code>, изграден върху <a href=\"https://course.raku.org/bg/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператора за редукция<\/a>, който вече срещнахте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не сте ограничени до букви и ASCII пунктуация; символът на оператора може да бъде всеки знак.<\/span> <span class=\"sg\" data-s=\"1\">Този префиксен оператор използва знака за параграф, за да удвои число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирането на оператори е мощен инструмент, затова го използвайте с вкус: добре избраният оператор може да направи кода четим като проблемната област, докато неясният само ще обърка следващия читател.<\/span><\/p>"]]},"la":{"t":"Operatores ab usore definiti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operatores in Raku revera tantum subroutinae nominibus specialibus sunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat te tuos proprios definire posse, utens nominibus categoriarum quae in pagina <a href=\"https://course.raku.org/la/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Types of Raku operators<\/a> invenisti: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, et cetera.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut operatorem declares, scribe <code>sub<\/code> cuius nomen est categoria, colon, et symbolum operatoris in uncis angularibus.<\/span> <span class=\"sg\" data-s=\"1\">Hic est novus operator infixus nomine <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Semel definitus, <code>plus<\/code> inter duos operandos suos adhibetur, exacte sicut quilibet operator infixus praeconstruitus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator postfixus operandum suum sequitur.<\/span> <span class=\"sg\" data-s=\"1\">Factorialis classicum exemplum est — hic est ut operator postfixus <code>!<\/code>, super <a href=\"https://course.raku.org/la/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">meta-operatore reductionis<\/a> quem antea invenisti constructus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non limitaris ad litteras et interpunctionem ASCII; symbolum operatoris quilibet character esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Hic operator praefixus signum sectionis adhibet ad numerum duplicandum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operatores definire instrumentum potens est, ergo cum gustu utere: operator bene electus codicem ut dominium problematis legere facere potest, dum obscurus tantum proximum lectorem confundit.<\/span><\/p>"]]}}}</script>
