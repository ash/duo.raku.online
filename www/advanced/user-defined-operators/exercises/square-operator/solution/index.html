<script type="application/json" id="page-data">{"u":"advanced/user-defined-operators/exercises/square-operator/solution","n":562,"k":"solution","pv":"advanced/user-defined-operators/exercises/square-operator","nx":"advanced/user-defined-operators/quiz","tr":["advanced","advanced/user-defined-operators"],"L":{"en":{"t":"The solution of ’A squaring operator‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The operator is declared as <code>postfix:&lt;²&gt;<\/code>, so its symbol — the superscript-two character — is written after its operand, as in <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body raises the operand to the power of two, so <code>5²<\/code> evaluates to <code>25<\/code>. Nothing stops you from using a Unicode symbol that mirrors the mathematical notation.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Quadrierungsoperator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der span class=\"sg\" data-s=\"0\">De body verheft de operand tot de tweede macht, dus <code>5²<\/code> evalueert tot <code>25<\/code>. Niets weerhoudt je ervan om een Unicode-symbool te gebruiken dat de wiskundige notatie weerspiegelt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un operador de elevar al cuadrado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El operador se declara como <code>postfix:&lt;²&gt;<\/code>, por lo que su símbolo, el carácter de superíndice dos, se escribe después de su operando, como en <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo eleva el operando a la potencia de dos, así que <code>5²<\/code> se evalúa como <code>25<\/code>. Nada te impide usar un símbolo Unicode que refleje la notación matemática.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un operatore di elevamento al quadrato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'operatore è dichiarato come <code>postfix:&lt;²&gt;<\/code>, quindi il suo simbolo — il carattere apice-due — viene scritto dopo l'operando, come in <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo eleva l'operando alla seconda potenza, quindi <code>5²<\/code> restituisce <code>25<\/code>. Nulla impedisce di usare un simbolo Unicode che rispecchi la notazione matematica.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Kāpināšanas operators","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējamais uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Operators ir deklarēts kā <code>postfix:&lt;²&gt;<\/code>, tāpēc tā simbols — augšraksta divnieks — tiek rakstīts aiz operanda, kā <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ķermenis kāpina operandu otrajā pakāpē, tāpēc <code>5²< or.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оператор оголошено як <code>postfix:&lt;²&gt;<\/code>, тож його символ — знак надрядкової двійки — записують після операнда, як у <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло підносить операнд до другого степеня, тож <code>5²<\/code> обчислюється в <code>25<\/code>. Ніщо не заважає взяти символ Unicode, який віддзеркалює математичний запис.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Оператор за повдигане в квадрат","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Операторът е деклариран като <code>postfix:&lt;²&gt;<\/code>, така че неговият символ — знакът за горен индекс две — се пише след операнда, както в <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото повдига операнда на степен две, така че <code>5²<\/code> се изчислява до <code>25<\/code>. Нищо не ви пречи да използвате Unicode символ, който отразява математическата нотация.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Operator quadrandi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Operator ut <code>postfix:&lt;²&gt;<\/code> declaratur, ergo symbolum eius — character superscriptus-duo — post operandum suum scribitur, ut in <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus operandum ad potestatem duorum elevat, ergo <code>5²<\/code> ad <code>25<\/code> aestimatur. Nihil te impedit symbolum Unicode adhibere quod notationem mathematicam referat.<\/span><\/li><\/ol>"]]}}}</script>
