<script type="application/json" id="page-data">{"u":"advanced/sequences/lazy","n":502,"k":"topic","pv":"advanced/sequences/patterns/quiz","nx":"advanced/sequences/exercises","tr":["advanced","advanced/sequences"],"L":{"en":{"t":"Lazy and infinite sequences","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A sequence does not have to compute all of its values at once.<\/span> <span class=\"sg\" data-s=\"1\">Raku sequences are <em>lazy<\/em>: each value is produced only when it is actually needed.<\/span> <span class=\"sg\" data-s=\"2\">This makes it possible to describe a sequence that has no end at all.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To write an infinite sequence, use <code>Inf<\/code> as the endpoint.<\/span> <span class=\"sg\" data-s=\"1\">Wrap the sequence in parentheses, because <code>...<\/code> binds more loosely than <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Without the parentheses, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> would assign just <\/code>1<code> to the variable and then build the sequence on its own — and evaluating an endless sequence for no result would hang the program.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nothing is computed yet.<\/span> <span class=\"sg\" data-s=\"1\">The sequence will hand out values only as you ask for them.<\/span> <span class=\"sg\" data-s=\"2\">The <code>head<\/code> method takes the first few:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Even though the sequence is infinite, only the first five numbers are generated.<\/span> <span class=\"sg\" data-s=\"1\">Without laziness, a program that tried to build all of an endless sequence would never finish.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For a finite sequence, the <code>tail<\/code> method takes values from the end instead:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laziness is what lets you separate the <em>description<\/em> of a sequence from the decision of how much of it to use.<\/span><\/p>"]]},"de":{"t":"Lazy und unendliche Sequenzen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Sequenz muss nicht alle ihre Werte auf einmal berechnen.<\/span> <span class=\"sg\" data-s=\"1\">Raku-Sequenzen sind <em>lazy<\/em>: Jeder Wert wird erst erzeugt, wenn er tatsächlich benötigt wird.<\/span> <span class=\"sg\" data-s=\"2\">Das macht es möglich, eine Sequenz zu beschreiben, die überhaupt kein Ende hat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um eine unendliche Sequenz zu schreiben, verwende <code>Inf<\/code> als Endpunkt.<\/span> <span class=\"sg\" data-s=\"1\">Setze die Sequenz in Klammern, weil <code>...<\/code> schwächer bindet als <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne die Klammern würde <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> nur <\/code>1<code> der Variablen zuweisen und dann die Sequenz eigenständig aufbauen — und das Auswerten einer endlosen Sequenz ohne Ergebnis würde das Programm zum Hängen bringen.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es wird noch nichts berechnet.<\/span> <span class=\"sg\" data-s=\"1\">Die Sequenz gibt Werte erst heraus, wenn du danach fragst.<\/span> <span class=\"sg\" data-s=\"2\">Die Methode <code>head<\/code> nimmt die ersten paar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Obwohl die Sequenz unendlich ist, werden nur die ersten fünf Zahlen generiert.<\/span> <span class=\"sg\" data-s=\"1\">Ohne Laziness würde ein Programm, das versucht, eine endlose Sequenz vollständig aufzubauen, niemals fertig werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für eine endliche Sequenz nimmt die Methode <code>tail<\/code> stattdessen Werte vom Ende:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laziness ermöglicht es dir, die <em>Beschreibung<\/em> einer Sequenz von der Entscheidung zu trennen, wie viel davon du verwenden möchtest.<\/span><\/p>"]]},"nl":{"t":"Luie en oneindige reeksen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een reeks hoeft niet al zijn waarden in één keer te berekenen.<\/span> <span class=\"sg\" data-s=\"1\">Raku-reeksen zijn <em>lui<\/em> (lazy): elke waarde wordt pas geproduceerd wanneer deze daadwerkelijk nodig is.<\/span> <span class=\"sg\" data-s=\"2\">Hierdoor is het mogelijk om een reeks te beschrijven die helemaal geen einde heeft.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een oneindige reeks te schrijven, gebruik je <code>Inf<\/code> als eindpunt.<\/span> <span class=\"sg\" data-s=\"1\">Zet de reeks tussen haakjes, omdat <code>...<\/code> minder sterk bindt dan <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder de haakjes zou <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> alleen <\/code>1<code> aan de variabele toewijzen en vervolgens de reeks apart opbouwen — en het evalueren van een eindeloze reeks zonder resultaat zou het programma laten vastlopen.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er wordt nog niets berekend.<\/span> <span class=\"sg\" data-s=\"1\">De reeks levert alleen waarden wanneer je erom vraagt.<\/span> <span class=\"sg\" data-s=\"2\">De methode <code>head<\/code> neemt de eerste paar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoewel de reeks oneindig is, worden alleen de eerste vijf getallen gegenereerd.<\/span> <span class=\"sg\" data-s=\"1\">Zonder luiheid zou een programma dat een eindeloze reeks probeert op te bouwen nooit klaar zijn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een eindige reeks neemt de methode <code>tail<\/code> juist waarden van het einde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Luiheid is wat je in staat stelt om de <em>beschrijving<\/em> van een reeks te scheiden van de beslissing hoeveel ervan je wilt gebruiken.<\/span><\/p>"]]},"es":{"t":"Secuencias perezosas e infinitas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una secuencia no tiene que calcular todos sus valores de una vez.<\/span> <span class=\"sg\" data-s=\"1\">Las secuencias en Raku son <em>perezosas<\/em> (lazy): cada valor se produce solo cuando realmente se necesita.<\/span> <span class=\"sg\" data-s=\"2\">Esto hace posible describir una secuencia que no tiene fin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para escribir una secuencia infinita, usa <code>Inf<\/code> como punto final.<\/span> <span class=\"sg\" data-s=\"1\">Envuelve la secuencia entre paréntesis, porque <code>...<\/code> tiene menor precedencia que <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin los paréntesis, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> asignaría solo <\/code>1<code> a la variable y luego construiría la secuencia por su cuenta, y evaluar una secuencia interminable sin resultado colgaría el programa.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aún no se ha calculado nada.<\/span> <span class=\"sg\" data-s=\"1\">La secuencia entregará valores solo cuando los solicites.<\/span> <span class=\"sg\" data-s=\"2\">El método <code>head<\/code> toma los primeros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aunque la secuencia es infinita, solo se generan los primeros cinco números.<\/span> <span class=\"sg\" data-s=\"1\">Sin la evaluación perezosa, un programa que intentará construir toda una secuencia interminable nunca terminaría.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para una secuencia finita, el método <code>tail<\/code> toma valores del final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La evaluación perezosa es lo que te permite separar la <em>descripción<\/em> de una secuencia de la decisión de cuánto de ella usar.<\/span><\/p>"]]},"it":{"t":"Sequenze lazy e infinite","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una sequenza non deve calcolare tutti i suoi valori in una volta sola.<\/span> <span class=\"sg\" data-s=\"1\">Le sequenze in Raku sono <em>lazy<\/em>: ogni valore viene prodotto solo quando è effettivamente necessario.<\/span> <span class=\"sg\" data-s=\"2\">Questo rende possibile descrivere una sequenza che non ha alcuna fine.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per scrivere una sequenza infinita, usa <code>Inf<\/code> come punto finale.<\/span> <span class=\"sg\" data-s=\"1\">Racchiudi la sequenza tra parentesi, perché <code>...<\/code> ha una precedenza più bassa di <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza le parentesi, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> assegnerebbe solo <\/code>1<code> alla variabile e poi costruirebbe la sequenza per conto suo — e valutare una sequenza infinita senza risultato bloccherebbe il programma.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non viene calcolato ancora nulla.<\/span> <span class=\"sg\" data-s=\"1\">La sequenza fornirà i valori solo quando li richiedi.<\/span> <span class=\"sg\" data-s=\"2\">Il metodo <code>head<\/code> prende i primi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anche se la sequenza è infinita, vengono generati solo i primi cinque numeri.<\/span> <span class=\"sg\" data-s=\"1\">Senza la valutazione lazy, un programma che tentasse di costruire tutta una sequenza infinita non finirebbe mai.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per una sequenza finita, il metodo <code>tail<\/code> prende i valori dalla fine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La valutazione lazy è ciò che permette di separare la <em>descrizione<\/em> di una sequenza dalla decisione su quanta parte di essa utilizzare.<\/span><\/p>"]]},"lv":{"t":"Slinkas un bezgalīgas secības","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Virknei nav obligāti jāaprēķina visas savas vērtības uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Raku virknes ir <em>slinkas<\/em>: katra vērtība tiek radīta tikai tad, kad tā patiešām vajadzīga.<\/span> <span class=\"sg\" data-s=\"2\">Tas ļauj aprakstīt virkni, kurai vispār nav gala.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai uzrakstītu bezgalīgu virkni, izmantojiet <code>Inf<\/code> kā beigu punktu.<\/span> <span class=\"sg\" data-s=\"1\">Ielieciet virkni iekavās, jo <code>...<\/code> saistās vaļīgāk nekā <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez iekavām <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> mainīgajam piešķirtu tikai <\/code>1<code> un pēc tam būvētu virkni pašu par sevi — un bezgalīgas virknes izrēķināšana bez rezultāta programmu iekārtu.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pagaidām nekas nav aprēķināts.<\/span> <span class=\"sg\" data-s=\"1\">Virkne izdos vērtības tikai tad, kad tās prasīsiet.<\/span> <span class=\"sg\" data-s=\"2\">Metode <code>head<\/code> paņem pirmās dažas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai gan virkne ir bezgalīga, tiek ģenerēti tikai pirmie pieci skaitļi.<\/span> <span class=\"sg\" data-s=\"1\">Bez slinkuma programma, kas mēģinātu uzbūvēt visu bezgalīgo virkni, nekad nebeigtu darbu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Galīgai virknei metode <code>tail<\/code> tā vietā paņem vērtības no beigām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tieši slinkums ļauj nošķirt virknes <em>aprakstu<\/em> no lēmuma par to, cik daudz no tās izmantot.<\/span><\/p>"]]},"ru":{"t":"Ленивые и бесконечные последовательности","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Последовательность не обязана вычислять все свои значения сразу.<\/span> <span class=\"sg\" data-s=\"1\">Последовательности в Raku являются <em>ленивыми<\/em>: каждое значение вычисляется только тогда, когда оно действительно нужно.<\/span> <span class=\"sg\" data-s=\"2\">Это позволяет описывать последовательности, у которых вообще нет конца.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы записать бесконечную последовательность, используйте <code>Inf<\/code> в качестве конечной точки.<\/span> <span class=\"sg\" data-s=\"1\">Оберните последовательность в скобки, поскольку <code>...<\/code> связывает слабее, чем <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без скобок <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> присвоит переменной только <\/code>1<code>, а затем построит последовательность отдельно — и вычисление бесконечной последовательности без результата приведёт к зависанию программы.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пока ничего не вычислено.<\/span> <span class=\"sg\" data-s=\"1\">Последовательность будет выдавать значения только по мере запроса.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>head<\/code> извлекает первые несколько:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хотя последовательность бесконечна, генерируются только первые пять чисел.<\/span> <span class=\"sg\" data-s=\"1\">Без ленивости программа, пытающаяся построить всю бесконечную последовательность, никогда бы не завершилась.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для конечной последовательности метод <code>tail<\/code> извлекает значения с конца:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ленивость позволяет отделить <em>описание<\/em> последовательности от решения о том, какую её часть использовать.<\/span><\/p>"]]},"uk":{"t":"Ліниві та нескінченні послідовності","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Послідовність не мусить обчислювати всі свої значення одразу.<\/span> <span class=\"sg\" data-s=\"1\">Послідовності Raku є <em>лінивими<\/em>: кожне значення породжується лише тоді, коли воно справді потрібне.<\/span> <span class=\"sg\" data-s=\"2\">Це дає змогу описати послідовність, яка взагалі не має кінця.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб записати нескінченну послідовність, використайте <code>Inf<\/code> як кінцеву точку.<\/span> <span class=\"sg\" data-s=\"1\">Візьміть послідовність у дужки, бо <code>...<\/code> зв'язується слабше за <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без дужок <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> присвоїло б змінній лише <\/code>1<code>, а потім побудувало б послідовність саме по собі, — а обчислення нескінченної послідовності без жодного результату підвісило б програму.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поки що нічого не обчислено.<\/span> <span class=\"sg\" data-s=\"1\">Послідовність видаватиме значення лише тоді, коли ви їх попросите.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>head<\/code> бере перші кілька:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хоч послідовність і нескінченна, породжуються лише перші п'ять чисел.<\/span> <span class=\"sg\" data-s=\"1\">Без лінивості програма, яка спробувала б побудувати всю нескінченну послідовність, ніколи б не завершилася.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для скінченної послідовності метод <code>tail<\/code> натомість бере значення з кінця:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Саме лінивість дозволяє відокремити <em>опис<\/em> послідовності від рішення про те, скільки з неї використати.<\/span><\/p>"]]},"bg":{"t":"Мързеливи и безкрайни последователности","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Една последователност не е задължена да изчислява всичките си стойности наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Последователностите в Raku са <em>мързеливи<\/em>: всяка стойност се произвежда само когато наистина е необходима.<\/span> <span class=\"sg\" data-s=\"2\">Това прави възможно описването на последователност, която изобщо няма край.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да напишете безкрайна последователност, използвайте <code>Inf<\/code> като крайна точка.<\/span> <span class=\"sg\" data-s=\"1\">Оградете последователността в скоби, защото <code>...<\/code> свързва по-слабо от <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без скобите <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> ще присвои само <\/code>1<code> на променливата и след това ще създаде последователността самостоятелно — а изчисляването на безкрайна последователност без резултат ще блокира програмата.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Нищо не е изчислено все още.<\/span> <span class=\"sg\" data-s=\"1\">Последователността ще предоставя стойности само когато ги поискате.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>head<\/code> взема първите няколко:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Въпреки че последователността е безкрайна, се генерират само първите пет числа.<\/span> <span class=\"sg\" data-s=\"1\">Без мързеливост програма, която се опитва да изгради цялата безкрайна последователност, никога не би завършила.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За крайна последователност методът <code>tail<\/code> взема стойности от края:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Мързеливостта е това, което ви позволява да отделите <em>описанието<\/em> на последователността от решението колко от нея да използвате.<\/span><\/p>"]]},"la":{"t":"Pigrae et infinitae series","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Series non omnes valores suos simul computare debet.<\/span> <span class=\"sg\" data-s=\"1\">Series in Raku <em>pigrae<\/em> sunt: unusquisque valor solum cum re vera opus est producitur.<\/span> <span class=\"sg\" data-s=\"2\">Hoc efficit ut seriem describere possis quae omnino finem non habet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad seriem infinitam scribendam, <code>Inf<\/code> ut finem adhibeas.<\/span> <span class=\"sg\" data-s=\"1\">Seriem parenthesibus circumda, quia <code>...<\/code> laxius quam <code>=<\/code> ligat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sine parenthesibus, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> solum <\/code>1<code> variabili assignaret et deinde seriem per se construeret -- et series infinita sine effectu evaluata programma suspenderet.<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nihil adhuc computatum est.<\/span> <span class=\"sg\" data-s=\"1\">Series valores solum cum petis tradet.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>head<\/code> primos paucos sumit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quamvis series infinita sit, solum primi quinque numeri generantur.<\/span> <span class=\"sg\" data-s=\"1\">Sine pigritia, programma quod totam seriem infinitam construere conaretur numquam finiret.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro serie finita, methodus <code>tail<\/code> valores a fine sumit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pigritia est quae te sinit <em>descriptionem<\/em> seriei a decisione quantum eius utaris separare.<\/span><\/p>"]]}}}</script>
