<script type="application/json" id="page-data">{"u":"advanced/sequences/exercises/powers-of-two/solution","n":507,"k":"solution","pv":"advanced/sequences/exercises/powers-of-two","nx":"advanced/sequences/exercises/last-three","tr":["advanced","advanced/sequences"],"L":{"en":{"t":"The solution of ’Powers of two‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... Inf).head(8);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/sequences/powers-of-two.raku\" target=\"_blank\" rel=\"noopener\">powers-of-two.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(1 2 4 8 16 32 64 128)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The three starting values <code>1, 2, 4<\/code> grow by multiplication, so <code>...<\/code> recognises a geometric sequence; with <code>Inf<\/code> as the endpoint it never stops on its own.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(8)<\/code> pulls only the first eight values. Because the sequence is lazy, the rest are never generated — which is the only reason an infinite sequence is safe to write.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Zweierpotenzen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... Inf).head(8);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/e rs-of-two.raku\" target=\"_blank\" rel=\"noopener\">powers-of-two.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(1 2 4 8 16 32 64 128)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">I tre valori iniziali <code>1, 2, 4<\/code> crescono per moltiplicazione, quindi <code>...<\/code> riconosce una sequenza geometrica; con <code>Inf<\/code> come punto finale, non si ferma mai da sola.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(8)<\/code> prende solo i primi otto valori. Poiché la sequenza è lazy, il resto non viene mai generato — ed è l'unico motivo per cui è sicuro scrivere una sequenza infinita.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Divnieka pakāpes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... Inf).head(8);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/sequences/powers-of-two.raku\" target=\"_blank\" rel=\"noopener\">powers-of-two.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>(1 2 4 8 16 32 64 128)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Trīs sākuma vērtības <code>1, 2, 4<\/code> aug reizinoties, tāpēc <code>...<\/code> atpazīst ģeometrisku virkni; ar <code>Inf<\/code> kā beigu punktu tā pati no sevis nekad neapstājas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(8)<\/code> izvelk tikai pirmās astoņas vērtības. Tā kā virkne ir slinka, pārējās nekad netiek ģenerētas — span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(1 2 4 8 16 32 64 128)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Три початкові значення <code>1, 2, 4<\/code> зростають через множення, тож <code>...<\/code> розпізнає геометричну послідовність; із <code>Inf<\/code> як кінцевою точкою вона ніколи не зупиняється сама.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(8)<\/code> витягує лише перші вісім значень. Оскільки послідовність лінива, решта ніколи не породжується, — і лише тому нескінченну послідовність безпечно записувати.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Степени на двойката","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... Inf).head(8);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/sequences/powers-of-two.raku\" target=\"_blank\" rel=\"noopener\">powers-of-two.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>(1 2 4 8 16 32 64 128)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трите начални стойности <code>1, 2, 4<\/code> нарастват чрез умножение, така че <code>...<\/code> разпознава геометрична последователност; с <code>Inf<\/code> като крайна точка тя никога не спира сама.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(8)<\/code> взема само първите осем стойности. Тъй като последователността е мързелива, останалите никога не се генерират — което е единствената причина безкрайна последователност да е безопасна за писане.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Potestates duorum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 4 ... Inf).head(8);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/sequences/powers-of-two.raku\" target=\"_blank\" rel=\"noopener\">powers-of-two.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(1 2 4 8 16 32 64 128)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tres valores initiales <code>1, 2, 4<\/code> multiplicatione crescunt, itaque <code>...<\/code> seriem geometricam agnoscit; cum <code>Inf<\/code> ut fine, per se numquam consistit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(8)<\/code> solum primos octo valores sumit. Quia series pigra est, ceteri numquam generantur -- quae sola causa est cur seriem infinitam scribere tutum sit.<\/span><\/li><\/ol>"]]}}}</script>
