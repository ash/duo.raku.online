<script type="application/json" id="page-data">{"u":"advanced/sequences","n":499,"k":"section","pv":"advanced/sets-bags-mixes/exercises/bag-count/solution","nx":"advanced/sequences/patterns","tr":["advanced"],"L":{"en":{"t":"Sequences","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>sequence<\/em> is an ordered series of values produced one after another.<\/span> <span class=\"sg\" data-s=\"1\">Raku builds sequences with the <code>...<\/code> operator, which figures out the pattern from the values you give it and generates the rest up to an endpoint.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The simplest case counts from one value to another:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you provide two starting values, Raku takes the step between them and continues with the same step.<\/span> <span class=\"sg\" data-s=\"1\">This is how you make an arithmetic sequence:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here the starting values <code>1, 3<\/code> set the step to two, so Raku counts up in twos and stops once it reaches <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The value produced by <code>...<\/code> is of the <code>Seq<\/code> type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following topics show other patterns the <code>...<\/code> operator can recognise, and how a sequence can be lazy — even infinite.<\/span><\/p>"]]},"de":{"t":"Sequenzen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Sequenz<\/em> ist eine geordnete Reihe von Werten, die nacheinander erzeugt werden.<\/span> <span class=\"sg\" data-s=\"1\">Raku erstellt Sequenzen mit dem <code>...<\/code>-Operator, der das Muster aus den angegebenen Werten erkennt und den Rest bis zu einem Endpunkt generiert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der einfachste Fall zählt von einem Wert zu einem anderen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du zwei Startwerte angibst, nimmt Raku den Schritt zwischen ihnen und fährt mit demselben Schritt fort.<\/span> <span class=\"sg\" data-s=\"1\">So erstellst du eine arithmetische Sequenz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier setzen die Startwerte <code>1, 3<\/code> den Schritt auf zwei, sodass Raku in Zweierschritten hochzählt und stoppt, sobald <code>11<\/code> erreicht ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der von <code>...<\/code> erzeugte Wert ist vom Typ <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Themen zeigen weitere Muster, die der <code>...<\/code>-Operator erkennen kann, und wie eine Sequenz lazy sein kann — sogar unendlich.<\/span><\/p>"]]},"nl":{"t":"Reeksen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>reeks<\/em> (sequence) is een geordende serie waarden die na elkaar worden geproduceerd.<\/span> <span class=\"sg\" data-s=\"1\">Raku bouwt reeksen met de <code>...<\/code>-operator, die het patroon uit de opgegeven waarden afleidt en de rest genereert tot aan een eindpunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het eenvoudigste geval telt van de ene waarde tot de andere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je twee startwaarden opgeeft, neemt Raku de stap ertussen en gaat door met dezelfde stap.<\/span> <span class=\"sg\" data-s=\"1\">Zo maak je een rekenkundige reeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier stellen de startwaarden <code>1, 3<\/code> de stap in op twee, zodat Raku in stappen van twee optelt en stopt zodra het <code>11<\/code> bereikt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De waarde die door <code>...<\/code> wordt geproduceerd, is van het type <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten andere patronen zien die de <code>...<\/code>-operator kan herkennen, en hoe een reeks lui (lazy) kan zijn — zelfs oneindig.<\/span><\/p>"]]},"es":{"t":"Secuencias","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>secuencia<\/em> es una serie ordenada de valores producidos uno tras otro.<\/span> <span class=\"sg\" data-s=\"1\">Raku construye secuencias con el operador <code>...<\/code>, que deduce el patrón a partir de los valores que le proporcionas y genera el resto hasta un punto final.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El caso más simple cuenta de un valor a otro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si proporcionas dos valores iniciales, Raku toma el paso entre ellos y continúa con el mismo paso.<\/span> <span class=\"sg\" data-s=\"1\">Así es como se crea una secuencia aritmética:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí los valores iniciales <code>1, 3<\/code> establecen el paso en dos, así que Raku cuenta de dos en dos y se detiene al alcanzar <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El valor producido por <code>...<\/code> es del tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran otros patrones que el operador <code>...<\/code> puede reconocer, y cómo una secuencia puede ser perezosa (lazy), incluso infinita.<\/span><\/p>"]]},"it":{"t":"Sequenze","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>sequenza<\/em> è una serie ordinata di valori prodotti uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"1\">Raku costruisce le sequenze con l'operatore <code>...<\/code>, che individua il modello dai valori forniti e genera il resto fino a un punto finale.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il caso più semplice conta da un valore a un altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se fornisci due valori iniziali, Raku calcola il passo tra di essi e continua con lo stesso passo.<\/span> <span class=\"sg\" data-s=\"1\">Ecco come si crea una sequenza aritmetica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui i valori iniziali <code>1, 3<\/code> impostano il passo a due, quindi Raku conta di due in due e si ferma quando raggiunge <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il valore prodotto da <code>...<\/code> è di tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti seguenti mostrano altri modelli che l'operatore <code>...<\/code> è in grado di riconoscere e come una sequenza possa essere lazy, anche infinita.<\/span><\/p>"]]},"lv":{"t":"Secības","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Virkne<\/em> ir sakārtota vērtību rinda, kas tiek radīta cita pēc citas.<\/span> <span class=\"sg\" data-s=\"1\">Raku virknes būvē ar operatoru <code>...<\/code>, kas no dotajām vērtībām izsecina likumsakarību un ģenerē pārējo līdz beigu punktam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākais gadījums skaita no vienas vērtības līdz citai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja norādāt divas sākuma vērtības, Raku paņem soli starp tām un turpina ar to pašu soli.<\/span> <span class=\"sg\" data-s=\"1\">Tā veido aritmētisku virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit sākuma vērtības <code>1, 3<\/code> nosaka soli divi, tāpēc Raku skaita pa diviem un apstājas, tiklīdz sasniedz <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vērtība, ko rada <code>...<\/code>, ir <code>Seq<\/code> tipa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda citas likumsakarības, ko operators <code>...<\/code> atpazīst, un to, kā virkne var būt slinka — pat bezgalīga.<\/span><\/p>"]]},"ru":{"t":"Последовательности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Последовательность<\/em> — это упорядоченный ряд значений, которые генерируются одно за другим.<\/span> <span class=\"sg\" data-s=\"1\">В Raku последовательности создаются с помощью оператора <code>...<\/code>, который определяет закономерность по заданным значениям и продолжает её до указанной конечной точки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Простейший случай — отсчёт от одного значения до другого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы зададите два начальных значения, Raku определит шаг между ними и продолжит с тем же шагом.<\/span> <span class=\"sg\" data-s=\"1\">Так создаётся арифметическая последовательность:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь начальные значения <code>1, 3<\/code> задают шаг, равный двум, поэтому Raku считает с шагом два и останавливается, достигнув <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значение, создаваемое оператором <code>...<\/code>, имеет тип <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следующих темах рассматриваются другие закономерности, которые распознаёт оператор <code>...<\/code>, а также то, как последовательность может быть ленивой — и даже бесконечной.<\/span><\/p>"]]},"uk":{"t":"Послідовності","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Послідовність<\/em> — це впорядкований ряд значень, які видаються одне за одним.<\/span> <span class=\"sg\" data-s=\"1\">Raku будує послідовності оператором <code>...<\/code>, який визначає закономірність за наданими вами значеннями й породжує решту аж до кінцевої точки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпростіший випадок відлічує від одного значення до іншого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви надасте два початкові значення, Raku бере крок між ними й продовжує з тим самим кроком.<\/span> <span class=\"sg\" data-s=\"1\">Саме так створюють арифметичну послідовність:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут початкові значення <code>1, 3<\/code> задають крок у два, тож Raku лічить угору по двійках і зупиняється, щойно досягає <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значення, яке видає <code>...<\/code>, має тип <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують інші закономірності, які вміє розпізнавати оператор <code>...<\/code>, і те, як послідовність може бути лінивою — і навіть нескінченною.<\/span><\/p>"]]},"bg":{"t":"Последователности","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Последователността<\/em> е подредена серия от стойности, произвеждани една след друга.<\/span> <span class=\"sg\" data-s=\"1\">Raku създава последователности с оператора <code>...<\/code>, който разпознава шаблона от стойностите, които му давате, и генерира останалите до крайна точка.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-простият случай брои от една стойност до друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако подадете две начални стойности, Raku взема стъпката между тях и продължава със същата стъпка.<\/span> <span class=\"sg\" data-s=\"1\">Така се създава аритметична последователност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук началните стойности <code>1, 3<\/code> задават стъпка две, така че Raku брои нагоре по две и спира, когато достигне <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стойността, произведена от <code>...<\/code>, е от тип <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват други шаблони, които операторът <code>...<\/code> може да разпознае, и как една последователност може да бъде мързелива — дори безкрайна.<\/span><\/p>"]]},"eo":{"t":"Sekvencoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Sekvenco<\/em> estas ordigita serio de valoroj produktataj unu post la alia.<\/span> <span class=\"sg\" data-s=\"1\">Raku konstruas sekvencojn per la operatoro <code>...<\/code>, kiu eltrovas la ŝablonon el la valoroj, kiujn vi donas al ĝi, kaj generas la ceteron ĝis fina punkto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La plej simpla kazo nombras de unu valoro al alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi donas du komencajn valorojn, Raku prenas la paŝon inter ili kaj daŭrigas per la sama paŝo.<\/span> <span class=\"sg\" data-s=\"1\">Tiel vi faras aritmetikan sekvencon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie la komencaj valoroj <code>1, 3<\/code> starigas la paŝon al du, do Raku nombras po du kaj haltas, kiam ĝi atingas <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La valoro produktata de <code>...<\/code> estas de la tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras aliajn ŝablonojn, kiujn la operatoro <code>...<\/code> povas rekoni, kaj kiel sekvenco povas esti maldiligenta — eĉ senlima.<\/span><\/p>"]]},"la":{"t":"Series","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Series<\/em> est ordinata collectio valorum, qui unus post alterum producuntur.<\/span> <span class=\"sg\" data-s=\"1\">Raku series operatore <code>...<\/code> construit, qui exemplar ex valoribus datis agnoscit et cetera usque ad finem generat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simplicissimus casus ab uno valore ad alterum numerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si duos valores initiales praebeas, Raku gradum inter eos sumit et eodem gradu pergit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc modo seriem arithmeticam facis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic valores initiales <code>1, 3<\/code> gradum ad duo constituunt, itaque Raku binis numerat et consistit cum <code>11<\/code> attingit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valor ab operatore <code>...<\/code> productus est typi <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sequentia capita ostendunt alia exemplaria quae operator <code>...<\/code> agnoscere potest, et quomodo series pigra esse possit -- etiam infinita.<\/span><\/p>"]]}}}</script>
