<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/default","n":357,"k":"topic","pv":"advanced/scalar-containers/type-constraints/quiz","nx":"advanced/scalar-containers/proxying","tr":["advanced","advanced/scalar-containers"],"L":{"en":{"t":"Default values","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When a new scalar variable is created without an immediate assignment, the container still holds a value — its default value.<\/span> <span class=\"sg\" data-s=\"1\">The exact default depends on the type of the variable.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program below is not the best way to use Raku, but it shows the point:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int;\nsay $int + 5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The output contains <code>5<\/code>, which may be what you expected if you assumed that the default value of <code>$int<\/code> is <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">However, the program also prints a warning:<\/span><\/p>"],["code",0,"<pre><code>Use of uninitialized value $int of type Any in numeric context\n  in block &lt;unit&gt; at t.raku line 2\n5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To remove this uncertainty, either assign a value explicitly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay $int + 5; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Or declare a default value with the <code>is default<\/code> trait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(0);\nsay $int + 5; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The default value is not limited to zero.<\/span> <span class=\"sg\" data-s=\"1\">It can be any value that you consider a good candidate, for example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(1);\nsay $int + 5; # 6<\/code><\/pre>"]]},"de":{"t":"Standardwerte", ass=\"sg\" data-s=\"1\">De exacte standaardwaarde hangt af van het type van de variabele.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het onderstaande programma is niet de beste manier om Raku te gebruiken, maar het illustreert het punt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int;\nsay $int + 5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De uitvoer bevat <code>5<\/code>, wat je misschien verwachtte als je ervan uitging dat de standaardwaarde van <code>$int<\/code> gelijk is aan <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het programma drukt echter ook een waarschuwing af:<\/span><\/p>"],["code",0,"<pre><code>Use of uninitialized value $int of type Any in numeric context\n  in block &lt;unit&gt; at t.raku line 2\n5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om deze onzekerheid weg te nemen, wijs je ofwel expliciet een waarde toe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay $int + 5; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of declareer je een standaardwaarde met de <code>is default<\/code>-eigenschap:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(0);\nsay $int + 5; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De standaardwaarde is niet beperkt tot nul.<\/span> <span class=\"sg\" data-s=\"1\">Het kan elke waarde zijn die je geschikt acht, bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(1);\nsay $int + 5; # 6<\/code><\/pre>"]]},"es":{"t":"Valores predeterminados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando se crea una nueva variable escalar sin una asignación inmediata, el contenedor aun mantiene un valor — su valor por defecto.<\/span> <span class=\"sg\" data-s=\"1\">El valor por defecto exacto depende del tipo de la variable.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa a continuación no es la mejor forma de de>, che potrebbe essere quello che vi aspettavate se avete supposto che il valore predefinito di <code>$int<\/code> sia <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tuttavia, il programma stampa anche un avvertimento:<\/span><\/p>"],["code",0,"<pre><code>Use of uninitialized value $int of type Any in numeric context\n  in block &lt;unit&gt; at t.raku line 2\n5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per eliminare questa incertezza, assegnate un valore esplicitamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay $int + 5; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oppure dichiarate un valore predefinito con il trait <code>is default<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(0);\nsay $int + 5; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il valore predefinito non è limitato a zero.<\/span> <span class=\"sg\" data-s=\"1\">Può essere qualsiasi valore che ritenete un buon candidato, per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(1);\nsay $int + 5; # 6<\/code><\/pre>"]]},"lv":{"t":"Noklusējuma vērtības","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad tiek izveidots jauns skalārais mainīgais bez tūlītējas piešķiršanas, konteineris joprojām satur vērtību — tā noklusējuma vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Precīzais noklusējums ir atkarīgs no mainīgā tipa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zemāk redzamā programma nav labākais veids, kā lietot Raku, taču tā ilustrē būtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int;\nsay $int + 5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izvade satur <code>5<\/code>, kas var būt sagaidāms, ja pieņemat, ka <code>$int<\/code> noklusējuma vērtība ir <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tomēr programma arī izdrukā brīdinājumu:<\/span><\/p>"],["code",0,"<pre><co
