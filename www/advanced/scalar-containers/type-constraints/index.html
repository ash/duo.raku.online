<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/type-constraints","n":355,"k":"topic","pv":"advanced/scalar-containers/types","nx":"advanced/scalar-containers/type-constraints/quiz","tr":["advanced","advanced/scalar-containers"],"L":{"en":{"t":"Type constraints","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/essentials/typed-variables/type-constraints/\">Essentials part<\/a>, you saw how to set the type of a variable using a type constraint.<\/span> <span class=\"sg\" data-s=\"1\">It is worth stressing that it is the <em>container<\/em> that enforces this restriction on the values it is allowed to accept.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following declaration creates a scalar container that can only host integers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A typed container accepts only the values that fit its type, so all of the following assignments are valid:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku does not perform automatic type casting in this case.<\/span> <span class=\"sg\" data-s=\"1\">Assigning a floating-point number (which is a <code>Rat<\/code> value in Raku) is therefore not allowed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You already get an error at compile time:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To avoid the error, convert the value explicitly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Don’t be confused by the two dots in <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The first is the decimal point; the second calls the <code>Int<\/code> method on the rational (<code>Rat<\/code>) value.<\/span><\/p>"]]},"de":{"t":"Typbeschränkungen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">Grundlagenteil<\/a> hast du gesehen, wie man den Typ einer Variable mit einer Typeinschränkung festlegt.<\/span> <span class=\"sg\" data-s=\"1\">Es ist wichtig zu betonen, dass es der <em>Container<\/em> ist, der diese Einschränkung für die Werte durchsetzt, die er akzeptieren darf.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgende Deklaration erstellt einen Skalar-Container, der nur Ganzzahlen aufnehmen kann:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein typisierter Container akzeptiert nur Werte, die zu seinem Typ passen, sodass alle folgenden Zuweisungen gültig sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku führt in diesem Fall keine automatische Typumwandlung durch.<\/span> <span class=\"sg\" data-s=\"1\">Die Zuweisung einer Fließkommazahl (die in Raku ein <code>Rat<\/code>-Wert ist) ist daher nicht erlaubt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du bekommst bereits zur Kompilierzeit einen Fehler:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um den Fehler zu vermeiden, konvertiere den Wert explizit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lass dich nicht von den zwei Punkten in <code>123.45.Int<\/code> verwirren.<\/span> <span class=\"sg\" data-s=\"1\">Der erste ist der Dezimalpunkt; der zweite ruft die <code>Int<\/code>-Methode auf dem rationalen (<code>Rat<\/code>) Wert auf.<\/span><\/p>"]]},"nl":{"t":"Typebeperkingen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In het <a href=\"https://course.raku.org/nl/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">deel Essentieel<\/a> heb je gezien hoe je het type van een variabele kunt instellen met een typebeperking.<\/span> <span class=\"sg\" data-s=\"1\">Het is de moeite waard om te benadrukken dat het de <em>container<\/em> is die deze beperking afdwingt op de waarden die hij mag accepteren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende declaratie maakt een scalaire container aan die alleen gehele getallen kan bevatten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een container met een type accepteert alleen waarden die bij het type passen, dus alle volgende toewijzingen zijn geldig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku voert in dit geval geen automatische typeconversie uit.<\/span> <span class=\"sg\" data-s=\"1\">Het toewijzen van een kommagetal (dat in Raku een <code>Rat<\/code>-waarde is) is daarom niet toegestaan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je krijgt al een foutmelding tijdens het compileren:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om de fout te voorkomen, converteer je de waarde expliciet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Laat je niet verwarren door de twee punten in <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De eerste is het decimaalteken; de tweede roept de <code>Int<\/code>-methode aan op de rationele (<code>Rat<\/code>)-waarde.<\/span><\/p>"]]},"es":{"t":"Restricciones de tipo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">parte de Fundamentos<\/a>, viste como establecer el tipo de una variable usando una restricción de tipo.<\/span> <span class=\"sg\" data-s=\"1\">Vale la pena destacar que es el <em>contenedor<\/em> el que impone esta restricción sobre los valores que se le permite aceptar.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La siguiente declaración crea un contenedor escalar que solo puede albergar enteros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un contenedor con tipo acepta solo los valores que se ajustan a su tipo, por lo que todas las siguientes asignaciones son válidas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku no realiza conversión automática de tipos en este caso.<\/span> <span class=\"sg\" data-s=\"1\">Asignar un numero de punto flotante (que es un valor <code>Rat<\/code> en Raku) no esta permitido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ya obtienes un error en tiempo de compilación:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para evitar el error, convierte el valor explícitamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No te confundas con los dos puntos en <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El primero es el punto decimal; el segundo llama al método <code>Int<\/code> sobre el valor racional (<code>Rat<\/code>).<\/span><\/p>"]]},"it":{"t":"Vincoli di tipo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">parte Fondamenti<\/a>, avete visto come impostare il tipo di una variabile usando un vincolo di tipo.<\/span> <span class=\"sg\" data-s=\"1\">Vale la pena sottolineare che è il <em>contenitore<\/em> a imporre questa restrizione sui valori che è autorizzato ad accettare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La seguente dichiarazione crea un contenitore scalare che può ospitare solo interi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un contenitore tipizzato accetta solo i valori che corrispondono al suo tipo, quindi tutte le seguenti assegnazioni sono valide:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku non esegue la conversione automatica del tipo in questo caso.<\/span> <span class=\"sg\" data-s=\"1\">Assegnare un numero in virgola mobile (che è un valore <code>Rat<\/code> in Raku) non è quindi permesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si ottiene già un errore in fase di compilazione:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per evitare l'errore, convertite il valore esplicitamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non confondete i due punti in <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il primo è il punto decimale; il secondo chiama il metodo <code>Int<\/code> sul valore razionale (<code>Rat<\/code>).<\/span><\/p>"]]},"lv":{"t":"Tipu ierobežojumi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">Pamatu daļā<\/a> jūs redzējāt, kā iestatīt mainīgā tipu, izmantojot tipa ierobežojumu.<\/span> <span class=\"sg\" data-s=\"1\">Ir vērts uzsvērt, ka tieši <em>konteineris<\/em> uzliek šo ierobežojumu vērtībām, ko tas drīkst pieņemt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī deklarācija izveido skalāru konteineru, kas var glabāt tikai veselus skaitļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipizēts konteineris pieņem tikai tādas vērtības, kas atbilst tā tipam, tāpēc visas šīs piešķiršanas ir derīgas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku šajā gadījumā neveic automātisku tipu pārveidošanu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc piešķirt peldošā komata skaitli (kas Raku ir <code>Rat<\/code> vērtība) nav atļauts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kļūda tiek konstatēta jau kompilācijas laikā:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai izvairītos no kļūdas, pārveidojiet vērtību tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Neļaujiet sevi mulsināt diviem punktiem virknē <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais ir decimālais atdalītājs; otrais izsauc <code>Int<\/code> metodi uz racionālās (<code>Rat<\/code>) vērtības.<\/span><\/p>"]]},"ru":{"t":"Ограничения типов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">разделе «Основы»<\/a> вы видели, как задать тип переменной с помощью ограничения типа.<\/span> <span class=\"sg\" data-s=\"1\">Стоит подчеркнуть, что именно <em>контейнер<\/em> обеспечивает это ограничение на значения, которые он может принимать.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующее объявление создаёт скалярный контейнер, который может хранить только целые числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типизированный контейнер принимает только значения, соответствующие его типу, поэтому все следующие присваивания допустимы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku не выполняет автоматического приведения типов в этом случае.<\/span> <span class=\"sg\" data-s=\"1\">Присвоение числа с плавающей запятой (которое в Raku является значением типа <code>Rat<\/code>) поэтому не допускается:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ошибка возникает уже на этапе компиляции:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы избежать ошибки, преобразуйте значение явно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не путайте две точки в <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Первая — это десятичный разделитель; вторая вызывает метод <code>Int<\/code> для рационального (<code>Rat<\/code>) значения.<\/span><\/p>"]]},"uk":{"t":"Обмеження типів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">частині «Основи»<\/a> ви бачили, як задати тип змінної за допомогою обмеження типу.<\/span> <span class=\"sg\" data-s=\"1\">Варто наголосити, що саме <em>контейнер<\/em> накладає це обмеження на значення, які йому дозволено приймати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наведене оголошення створює скалярний контейнер, який може містити лише цілі числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типізований контейнер приймає лише ті значення, що відповідають його типу, тож усі наведені присвоєння дійсні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # безпосередньо ціле число\nsay $int;\n\n$int = 100 + 23;  # результат є цілим числом\nsay $int;\n\n$int = '123'.Int; # рядок, перетворений на ціле число\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У цьому випадку Raku не виконує автоматичного приведення типів.<\/span> <span class=\"sg\" data-s=\"1\">Тому присвоєння числа з рухомою комою (яке в Raku є значенням <code>Rat<\/code>) не дозволено:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви отримуєте помилку вже під час компіляції:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб уникнути помилки, перетворіть значення явно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хай вас не бентежать дві крапки в <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Перша — це десяткова крапка; друга викликає метод <code>Int<\/code> для раціонального (<code>Rat<\/code>) значення.<\/span><\/p>"]]},"bg":{"t":"Ограничения на типове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">частта Основи<\/a> видяхте как да зададете типа на променлива чрез ограничение на типа.<\/span> <span class=\"sg\" data-s=\"1\">Струва си да подчертаем, че именно <em>контейнерът<\/em> налага това ограничение върху стойностите, които може да приема.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следната декларация създава скаларен контейнер, който може да съдържа само цели числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типизиран контейнер приема само стойности, които отговарят на неговия тип, така че всички следни присвоявания са валидни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku не извършва автоматично преобразуване на типовете в този случай.<\/span> <span class=\"sg\" data-s=\"1\">Присвояването на число с плаваща запетая (което е стойност от тип <code>Rat<\/code> в Raku) следователно не е позволено:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Получавате грешка още по време на компилация:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да избегнете грешката, преобразувайте стойността изрично:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не се бъркайте от двете точки в <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Първата е десетичната точка; втората извиква метода <code>Int<\/code> върху рационалната (<code>Rat<\/code>) стойност.<\/span><\/p>"]]},"eo":{"t":"Tipaj limigoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/eo/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">parto Bazaĵoj<\/a> vi vidis kiel agordi la tipon de variablo per tipa limigo.<\/span> <span class=\"sg\" data-s=\"1\">Indas emfazi, ke estas la <em>ujo<\/em> kiu devigas ĉi tiun limigon sur la valoroj, kiujn ĝi rajtas akcepti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekva deklaro kreas skalaran ujon, kiu povas enhavi nur entjerojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipigita ujo akceptas nur la valorojn, kiuj konformas al sia tipo, do ĉiuj sekvaj asignoj estas validaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # rekte entjero\nsay $int;\n\n$int = 100 + 23;  # la rezulto estas entjero\nsay $int;\n\n$int = '123'.Int; # ĉeno konvertita al entjero\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ne faras aŭtomatan tipkonverton en ĉi tiu kazo.<\/span> <span class=\"sg\" data-s=\"1\">Asigni glitkomaban nombron (kiu estas valoro de tipo <code>Rat<\/code> en Raku) do ne estas permesata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi jam ricevas eraron dum kompiltempo:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por eviti la eraron, konvertu la valoron eksplicite:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne konfuziĝu pro la du punktoj en <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la decimala punkto; la dua vokas la metodon <code>Int<\/code> sur la racionala (<code>Rat<\/code>) valoro.<\/span><\/p>"]]},"la":{"t":"Typus limitationes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"https://course.raku.org/la/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">parte Essentialium<\/a>, vidisti quomodo typum variabilis per restrictionis typum ponere possis.<\/span> <span class=\"sg\" data-s=\"1\">Notandum est quod <em>continens<\/em> est qui hanc restrictionem in valores quos accipere licet imponit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Declaratio sequens continentem scalarem creat qui solum numeros integros hospites potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Continens cum typo solum valores qui typo suo conveniunt accipit, itaque omnes assignationes sequentes validae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123;       # directly an integer\nsay $int;\n\n$int = 100 + 23;  # the result is an integer\nsay $int;\n\n$int = '123'.Int; # a string converted to an integer\nsay $int;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku conversionem typorum automaticam in hoc casu non facit.<\/span> <span class=\"sg\" data-s=\"1\">Assignare numerum cum puncto decimali (qui est valor <code>Rat<\/code> in Raku) ergo non licet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Errorem iam tempore compilationis accipis:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling t.raku\nCannot assign a literal of type Rat (123.45) to a variable ($int) of\ntype Int.  You can declare the variable to be of type Real, or try to\ncoerce the value with 123.45.Int or Int(123.45), or just write the value\nas 123.\nat t.raku:2\n------&gt; &lt;BOL&gt;⏏$int = 123.45;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad errorem evitandum, valorem explicite converte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int;\n\n$int = 123.45.Int;\nsay $int; # 123<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne confundaris duobus punctis in <code>123.45.Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Primum est punctum decimale; secundum methodum <code>Int<\/code> in valore rationali (<code>Rat<\/code>) vocat.<\/span><\/p>"]]}}}</script>
