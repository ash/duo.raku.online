com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>Int<\/code>-typebeperking in <code>my Int $cars<\/code> zorgt ervoor dat de container elke waarde weigert die geen geheel getal is. Een directe toewijzing van <code>250.7<\/code> (een <code>Rat<\/code>) zou een compile-time fout opleveren.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het aanroepen van <code>.Int<\/code> op de rationele waarde <code>250.7<\/code> converteert deze naar het gehele getal <code>250<\/code> door het decimale deel weg te laten. De geconverteerde waarde past in de container. Verwar dit gedrag niet met afronden.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>.WHAT<\/code>-pseudomethode bevestigt dat de waarde die in de container is opgeslagen van het type <code>Int<\/code> is.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Solo enteros","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $cars;\n\n$cars = 250.7.Int;\nsay $cars;\nsay $cars.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La restricción de tipo <code>Int<\/code> en <code>my Int $cars<\/code> hace que el contenedor rechace cualquier valor que no sea un entero. Una asignación directa de <code>250.7<\/code> (un <code>Rat<\/code>) sería un error en tiempo de compilación.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Llamar a <code>.Int<\/code> sobre el valor racional <code>250.7<\/code> lo convierte al entero <code>250<\/code> eliminando la parte fraccionaria. El valor convertido se ajusta al contenedor. Asegúrate de no confundir este comportamiento con el redondeo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El pseudo-método <code>.WHAT<\/code> confirma que el valor almacenado en el contenedor es de tipo <code>Int<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Solo interi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $cars;\n\n$cars = 250.7.Int;\nsay $cars;\nsay $cars.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Potete trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il vincolo di tipo <code>Int<\/code> in <code>my Int $cars<\/code> fa sì che il contenitore rifiuti qualsiasi valore che non sia un intero. Un'assegnazione diretta di <code>250.7<\/code> (un <code>Rat<\/code>) produrrebbe un errore in fase di compilazione.<\/span><\/li><\/ol>"],["list",1,"<ol><li><spa ><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ограничението на типа <code>Int<\/code> в <code>my Int $cars<\/code> кара контейнера да отхвърля всяка стойност, която не е цяло число. Директното присвояване на <code>250.7<\/code> (стойност от тип <code>Rat<\/code>) би било грешка по време на компилация.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Извикването на <code>.Int<\/code> върху рационалната стойност <code>250.7<\/code> я преобразува в целочислената стойност <code>250<\/code>, като отхвърля дробната част. Преобразуваната стойност отговаря на контейнера. Уверете се, че не бъркате това поведение с закръгляне.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Псевдо-методът <code>.WHAT<\/code> потвърждава, че стойността, съхранена в контейнера, е от тип <code>Int<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Nur entjeroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $cars;\n\n$cars = 250.7.Int;\nsay $cars;\nsay $cars.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tipa limigo <code>Int<\/code> en <code>my Int $cars<\/code> igas la ujon rifuzi ĉiun valoron, kiu ne estas entjero. Rekta atribuo de <code>250.7<\/code> (<code>Rat<\/code>) estus kompiltempa eraro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span cl
