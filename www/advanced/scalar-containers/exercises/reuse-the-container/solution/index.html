<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/exercises/reuse-the-container/solution","n":365,"k":"solution","pv":"advanced/scalar-containers/exercises/reuse-the-container","nx":"advanced/ordered-containers","tr":["advanced","advanced/scalar-containers"],"L":{"en":{"t":"The solution of ’Typed or untyped‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> reports the two containers differently. For the untyped one it prints just <code>$untyped<\/code>, while for the typed one it prefixes the declared type: <code>Int $typed<\/code>. That prefix is exactly the difference a declared type makes.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The empty values differ too. An untyped container starts at the bare undefined value <code>Any<\/code>, whereas a typed container starts at the undefined value of <em>its<\/em> type, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">After both are assigned <code>42<\/code>, the values look the same, but <code>$typed<\/code> still carries its type and would reject a non-integer value — unlike <code>$untyped<\/code>, which accepts anything.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Typisiert oder untypisiert","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> stellt die beiden Container unterschiedlich dar. Für den untypisierten gibt es nur <code>$untyped<\/code> aus, während für den typisierten der deklarierte Typ vorangestellt wird: <code>Int $typed<\/code>. Dieses Präfix ist genau der Unterschied, den ein deklarierter Typ ausmacht.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Auch die leeren Werte unterscheiden sich. Ein untypisierter Container beginnt mit dem einfachen undefinierten Wert <code>Any<\/code>, während ein typisierter Container mit dem undefinierten Wert <em>seines<\/em> Typs beginnt, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nachdem beiden <code>42<\/code> zugewiesen wurde, sehen die Werte gleich aus, aber <code>$typed<\/code> trägt weiterhin seinen Typ und würde einen nicht-ganzzahligen Wert ablehnen — im Gegensatz zu <code>$untyped<\/code>, der alles akzeptiert.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Getypt of ongetypt","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> beschrijft de twee containers op een verschillende manier. Voor de container zonder type drukt het alleen <code>$untyped<\/code> af, terwijl het voor de container met type het gedeclareerde type als voorvoegsel plaatst: <code>Int $typed<\/code>. Dat voorvoegsel is precies het verschil dat een gedeclareerd type maakt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De lege waarden verschillen ook. Een container zonder type begint met de ongedefinieerde basiswaarde <code>Any<\/code>, terwijl een container met type begint met de ongedefinieerde waarde van <em>zijn<\/em> type, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nadat aan beide <code>42<\/code> is toegewezen, zien de waarden er hetzelfde uit, maar <code>$typed<\/code> draagt nog steeds zijn type en zou een niet-gehele waarde weigeren — in tegenstelling tot <code>$untyped<\/code>, die alles accepteert.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Tipado o sin tipar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> reporta los dos contenedores de manera diferente. Para el que no tiene tipo imprime solo <code>$untyped<\/code>, mientras que para el que tiene tipo le antepone el tipo declarado: <code>Int $typed<\/code>. Ese prefijo es exactamente la diferencia que marca un tipo declarado.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los valores vacíos también difieren. Un contenedor sin tipo comienza con el valor indefinido básico <code>Any<\/code>, mientras que un contenedor con tipo comienza con el valor indefinido de <em>su<\/em> tipo, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Después de que a ambos se les asigna <code>42<\/code>, los valores lucen iguales, pero <code>$typed<\/code> aun lleva su tipo y rechazaría un valor que no sea entero — a diferencia de <code>$untyped<\/code>, que acepta cualquier cosa.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Tipizzato o non tipizzato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una 3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> abus konteinerus apraksta atšķirīgi. Tam, kam nav tipa, tā izdrukā tikai <code>$untyped<\/code>, bet tam, kam tips ir, priekšā liek deklarēto tipu: <code>Int $typed<\/code>. Tieši šis priekšlikums ir tā atšķirība, ko rada deklarēts tips.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Atšķiras arī tukšās vērtības. Konteiners bez tipa sākas ar kailo nedefinēto vērtību <code>Any<\/code>, turpretī konteiners ar tipu sākas ar <em>sava<\/em> tipa nedefinēto vērtību <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pēc tam, kad abiem piešķirts <code>42<\/code>, vērtības izskatās vienādas, taču <code>$typed<\/code> joprojām nes savu tipu un noraidītu vērtību, kas nav vesels skaitlis, — atšķirībā no <code>$untyped<\/code>, kas pieņem jebko.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Типизированный или нетипизированный","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно из возможных решений задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> описывает два контейнера по-разному. Для нетипизированного выводится просто <code>$untyped<\/code>, тогда как для типизированного добавляется префикс с объявленным типом: <code>Int $typed<\/code>. Этот префикс и есть то отличие, которое вносит объявление типа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пустые значения тоже различаются. Нетипизированный контейнер начинает с базового неопределённого значения <code>Any<\/code>, тогда как типизированный контейнер начинает с неопределённого значения <em>своего<\/em> типа, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">После присваивания <code>42<\/code> обоим контейнерам значения выглядят одинаково, но <code>$typed<\/code> по-прежнему несёт свой тип и отклонит нецелочисленное значение — в отличие от <code>$untyped<\/code>, который принимает что угодно.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Типізований чи нетипізований","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> повідомляє про два контейнери по-різному. Для нетипізованого він виводить просто <code>$untyped<\/code>, а для типізованого додає попереду оголошений тип: <code>Int $typed<\/code>. Цей префікс і є саме тією різницею, яку створює оголошений тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порожні значення теж різняться. Нетипізований контейнер починає з голого невизначеного значення <code>Any<\/code>, тоді як типізований починає з невизначеного значення <em>свого<\/em> типу — <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Після того як обом присвоєно <code>42<\/code>, значення виглядають однаково, але <code>$typed<\/code> і далі несе свій тип і відкинув би нецілочислове значення — на відміну від <code>$untyped<\/code>, який приймає будь-що.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Типизиран или нетипизиран","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> отчита двата контейнера по различен начин. За нетипизирания отпечатва само <code>$untyped<\/code>, докато за типизирания добавя префикс с декларирания тип: <code>Int $typed<\/code>. Този префикс е точно разликата, която декларираният тип прави.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Празните стойности също се различават. Нетипизиран контейнер започва с обикновената неопределена стойност <code>Any<\/code>, докато типизиран контейнер започва с неопределената стойност на <em>своя<\/em> тип, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След като и на двата е присвоено <code>42<\/code>, стойностите изглеждат еднакви, но <code>$typed<\/code> все още носи своя тип и би отхвърлил стойност, която не е цяло число — за разлика от <code>$untyped<\/code>, който приема всичко.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Typificatum vel non typificatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> duos continentes diverse refert. Pro eo qui sine typo est, solum <code>$untyped<\/code> imprimit, dum pro eo qui typum habet, typum declaratum praeponit: <code>Int $typed<\/code>. Illud praefixum exacte est differentia quam typus declaratus facit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Valores vacui quoque differunt. Continens sine typo a valore indefinito nudo <code>Any<\/code> incipit, dum continens cum typo a valore indefinito <em>sui<\/em> typi, <code>Int<\/code>, incipit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Postquam ambis <code>42<\/code> assignatum est, valores idem apparent, sed <code>$typed<\/code> adhuc typum suum portat et valorem non integrum reiceret — dissimilis a <code>$untyped<\/code>, qui quidlibet accipit.<\/span><\/li><\/ol>"]]}}}</script>
