<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/proxying","n":358,"k":"topic","pv":"advanced/scalar-containers/default","nx":"advanced/scalar-containers/exercises","tr":["advanced","advanced/scalar-containers"],"L":{"en":{"t":"Proxying method calls","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Being a scalar container actually means being an object of the <code>Scalar<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\">In most cases, the use of scalars is so transparent that a developer does not have to think about the container at all and can imagine working directly with the values stored in it.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This works because a scalar container proxies method calls to the value that it keeps.<\/span> <span class=\"sg\" data-s=\"1\">For example, after the assignment <code>my $lang = 'Raku'<\/code>, you can call the <code>.chars<\/code> method on the variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The program prints <code>4<\/code>, which is the number of characters in the string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The result is exactly the same as if you called <code>.chars<\/code> on the string value directly, rather than on the container variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In other words, the container quietly forwards the <code>.chars<\/code> call to the string it holds, and returns the result to you.<\/span><\/p>"]]},"de":{"t":"Proxierung von Methodenaufrufen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Skalar-Container zu sein bedeutet eigentlich, ein Objekt des Typs <code>Scalar<\/code> zu sein.<\/span> <span class=\"sg\" data-s=\"1\">In den meisten Fällen ist die Verwendung von Skalaren so transparent, dass ein Entwickler überhaupt nicht an den Container denken muss und sich vorstellen kann, direkt mit den darin gespeicherten Werten zu arbeiten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das funktioniert, weil ein Skalar-Container Methodenaufrufe an den Wert weiterleitet, den er enthält.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kannst du nach der Zuweisung <code>my $lang = 'Raku'<\/code> die Methode <code>.chars<\/code> auf der Variable aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt <code>4<\/code> aus, was die Anzahl der Zeichen im String <code>'Raku'<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis ist genau dasselbe, als ob du <code>.chars<\/code> direkt auf dem Stringwert aufrufen würdest, statt auf der Containervariable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit anderen Worten: Der Container leitet den <code>.chars<\/code>-Aufruf still an den String weiter, den er enthält, und gibt dir das Ergebnis zurück.<\/span><\/p>"]]},"nl":{"t":"Proxying van methode-aanroepen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een scalaire container zijn betekent eigenlijk een object zijn van het type <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In de meeste gevallen is het gebruik van scalars zo transparant dat een ontwikkelaar helemaal niet aan de container hoeft te denken en zich kan voorstellen dat hij rechtstreeks met de opgeslagen waarden werkt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit werkt omdat een scalaire container methodeaanroepen doorstuurt naar de waarde die hij bevat.<\/span> <span class=\"sg\" data-s=\"1\">Na de toewijzing <code>my $lang = 'Raku'<\/code> kun je bijvoorbeeld de <code>.chars<\/code>-methode aanroepen op de variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt <code>4<\/code> af, het aantal tekens in de string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is precies hetzelfde als wanneer je <code>.chars<\/code> rechtstreeks op de stringwaarde zou aanroepen, in plaats van op de containervariabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met andere woorden, de container stuurt de <code>.chars<\/code>-aanroep stilletjes door naar de string die hij bevat en geeft het resultaat aan je terug.<\/span><\/p>"]]},"es":{"t":"Proxificación de llamadas a métodos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ser un contenedor escalar en realidad significa ser un objeto del tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En la mayoría de los casos, el uso de escalares es tan transparente que un desarrollador no tiene que pensar en el contenedor en absoluto y puede imaginar que trabaja directamente con los valores almacenados en el.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto funciona porque un contenedor escalar delega las llamadas a métodos al valor que contiene.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, después de la asignación <code>my $lang = 'Raku'<\/code>, puedes llamar al método <code>.chars<\/code> sobre la variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El programa imprime <code>4<\/code>, que es el numero de caracteres en la cadena <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es exactamente el mismo que si llamaras a <code>.chars<\/code> directamente sobre el valor de la cadena, en lugar de sobre la variable contenedora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En otras palabras, el contenedor reenvía silenciosamente la llamada a <code>.chars<\/code> a la cadena que contiene y te devuelve el resultado.<\/span><\/p>"]]},"it":{"t":"Proxying delle chiamate di metodo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Essere un contenitore scalare significa in realtà essere un oggetto di tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nella maggior parte dei casi, l'uso degli scalari è così trasparente che uno sviluppatore non deve pensare affatto al contenitore e può immaginare di lavorare direttamente con i valori memorizzati al suo interno.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo funziona perché un contenitore scalare delega le chiamate ai metodi al valore che contiene.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, dopo l'assegnazione <code>my $lang = 'Raku'<\/code>, è possibile chiamare il metodo <code>.chars<\/code> sulla variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa <code>4<\/code>, che è il numero di caratteri nella stringa <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è esattamente lo stesso che si otterrebbe chiamando <code>.chars<\/code> direttamente sul valore stringa, anziché sulla variabile contenitore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In altre parole, il contenitore inoltra silenziosamente la chiamata <code>.chars<\/code> alla stringa che contiene e vi restituisce il risultato.<\/span><\/p>"]]},"lv":{"t":"Metožu izsaukumu pāradresēšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Būt skalāram konteineram faktiski nozīmē būt <code>Scalar<\/code> tipa objektam.<\/span> <span class=\"sg\" data-s=\"1\">Vairumā gadījumu skalāru lietošana ir tik caurspīdīga, ka izstrādātājam nav jādomā par konteineru un var iedomāties, ka strādā tieši ar tajā glabāto vērtību.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas darbojas tāpēc, ka skalārais konteineris pārsūta metožu izsaukumus tajā glabātajai vērtībai.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, pēc piešķiršanas <code>my $lang = 'Raku'<\/code> mainīgajam var izsaukt metodi <code>.chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā <code>4<\/code>, kas ir rakstzīmju skaits virknē <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts ir tieši tāds pats, kā ja izsauktu <code>.chars<\/code> tieši uz virknes vērtības, nevis uz konteinera mainīgā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Citiem vārdiem, konteineris klusi pārsūta <code>.chars<\/code> izsaukumu virknei, ko tas glabā, un atgriež jums rezultātu.<\/span><\/p>"]]},"ru":{"t":"Проксирование вызова методов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Быть скалярным контейнером фактически означает быть объектом типа <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В большинстве случаев работа со скалярами настолько прозрачна, что разработчику не нужно думать о контейнере вообще — можно представлять, что работа идёт непосредственно со значениями, хранящимися в нём.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это работает потому, что скалярный контейнер проксирует вызовы методов к хранящемуся в нём значению.<\/span> <span class=\"sg\" data-s=\"1\">Например, после присваивания <code>my $lang = 'Raku'<\/code> можно вызвать метод <code>.chars<\/code> на переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа выводит <code>4<\/code> — количество символов в строке <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат точно такой же, как если бы вы вызвали <code>.chars<\/code> непосредственно на строковом значении, а не на переменной-контейнере:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другими словами, контейнер незаметно перенаправляет вызов <code>.chars<\/code> строке, которую он хранит, и возвращает вам результат.<\/span><\/p>"]]},"uk":{"t":"Проксіювання викликів методів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Бути скалярним контейнером насправді означає бути об'єктом типу <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У більшості випадків використання скалярів настільки прозоре, що розробнику взагалі не доводиться думати про контейнер і можна уявляти, ніби він працює напряму зі значеннями, що в ньому зберігаються.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це працює тому, що скалярний контейнер проксіює виклики методів до значення, яке він зберігає.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, після присвоєння <code>my $lang = 'Raku'<\/code> метод <code>.chars<\/code> можна викликати для змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма виводить <code>4<\/code> — кількість символів у рядку <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат точно такий самий, як якби ви викликали <code>.chars<\/code> безпосередньо для рядкового значення, а не для змінної-контейнера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Іншими словами, контейнер тихо переадресовує виклик <code>.chars<\/code> рядку, який він містить, і повертає вам результат.<\/span><\/p>"]]},"bg":{"t":"Проксиране на методни повиквания","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Да бъдеш скаларен контейнер всъщност означава да бъдеш обект от тип <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В повечето случаи използването на скалари е толкова прозрачно, че разработчикът не трябва да мисли изобщо за контейнера и може да си представя, че работи директно със стойностите, съхранени в него.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това работи, защото скаларният контейнер препраща извикванията на методи към стойността, която съдържа.<\/span> <span class=\"sg\" data-s=\"1\">Например, след присвояването <code>my $lang = 'Raku'<\/code>, можете да извикате метода <code>.chars<\/code> върху променливата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва <code>4<\/code>, което е броят на символите в низа <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е абсолютно същият, както ако извикате <code>.chars<\/code> директно върху стойността на низа, а не върху контейнерната променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С други думи, контейнерът тихо препраща извикването на <code>.chars<\/code> към низа, който съдържа, и ви връща резултата.<\/span><\/p>"]]},"eo":{"t":"Prokuranto de metodvokoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Esti skalara ujo efektive signifas esti objekto de la tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Plej ofte, la uzo de skalaroj estas tiel travidebla, ke programisto ne bezonas pensi pri la ujo mem kaj povas imagi, ke oni laboras rekte kun la valoroj konservitaj en ĝi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio funkcias ĉar skalara ujo transdonas metodvokojn al la valoro, kiun ĝi enhavas.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, post la asigno <code>my $lang = 'Raku'<\/code>, vi povas voki la metodon <code>.chars<\/code> sur la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La programo presas <code>4<\/code>, kio estas la nombro de signoj en la ĉeno <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas ekzakte la sama, kiel se vi vokus <code>.chars<\/code> rekte sur la ĉena valoro, anstataŭ sur la ujo-variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alivorte, la ujo silente transdonas la vokon <code>.chars<\/code> al la ĉeno, kiun ĝi enhavas, kaj redonas la rezulton al vi.<\/span><\/p>"]]},"la":{"t":"Procuratio vocationum methodorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Continens scalaris esse revera significat obiectum typi <code>Scalar<\/code> esse.<\/span> <span class=\"sg\" data-s=\"1\">In plerisque casibus, usus scalarium tam transparens est ut developer de continenti omnino cogitare non debeat et imaginari possit se directe cum valoribus in eo servatis laborare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc operatur quia continens scalaris vocationes methodorum ad valorem quem tenet delegat.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, post assignationem <code>my $lang = 'Raku'<\/code>, methodum <code>.chars<\/code> in variabili vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma <code>4<\/code> imprimit, qui est numerus characterum in serie <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Resultatum exacte idem est ac si <code>.chars<\/code> in valore seriei directe vocavisses, potius quam in variabili continentis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aliis verbis, continens quiete vocationem <code>.chars<\/code> ad seriem quam tenet delegat, et resultatum tibi reddit.<\/span><\/p>"]]}}}</script>
