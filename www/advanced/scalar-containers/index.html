<script type="application/json" id="page-data">{"u":"advanced/scalar-containers","n":353,"k":"section","pv":"advanced/containers","nx":"advanced/scalar-containers/types","tr":["advanced"],"L":{"en":{"t":"Scalar containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">As the name suggests, scalar containers host single (scalar) values.<\/span> <span class=\"sg\" data-s=\"1\">Such containers are marked with the <code>$<\/code> sigil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one of the simplest and most direct uses of a scalar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>$lang<\/code> variable is a scalar container.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">By default, scalar containers do not enforce a type on the data, so you can store a value of any type in them.<\/span> <span class=\"sg\" data-s=\"1\">The simplest demonstration of this is that you can reuse the same variable to store an integer and then a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(The author does not encourage you to programm like this.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Internally, this means that, by default, a new container can keep values of the <code>Any<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> is the base type for most other types, such as <code>Int<\/code> or <code>Str<\/code>.<\/span><\/p>"]]},"de":{"t":"Skalare Container","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie der Name schon sagt, nehmen Skalar-Container einzelne (skalare) Werte auf.<\/span> <span class=\"sg\" data-s=\"1\">Solche Container werden mit dem Sigil <code>$<\/code> gekennzeichnet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine der einfachsten und direktesten Verwendungen eines Skalars:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$lang<\/code> ist ein Skalar-Container.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig erzwingen Skalar-Container keinen Typ für die Daten, sodass du einen Wert beliebigen Typs darin speichern kannst.<\/span> <span class=\"sg\" data-s=\"1\">Die einfachste Demonstration dafür ist, dass du dieselbe Variable wiederverwenden kannst, um erst eine Ganzzahl und dann einen String zu speichern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Der Autor ermutigt dich nicht, so zu programmieren.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intern bedeutet dies, dass ein neuer Container standardmäßig Werte des Typs <code>Any<\/code> aufnehmen kann.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> ist der Basistyp für die meisten anderen Typen, wie <code>Int<\/code> oder <code>Str<\/code>.<\/span><\/p>"]]},"nl":{"t":"Scalaire containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zoals de naam al suggereert, bevatten scalaire containers enkele (scalaire) waarden.<\/span> <span class=\"sg\" data-s=\"1\">Zulke containers worden aangeduid met het <code>$<\/code>-sigil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een van de eenvoudigste en meest directe toepassingen van een scalar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$lang<\/code> is een scalaire container.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard leggen scalaire containers geen type op aan de gegevens, dus je kunt er een waarde van elk type in opslaan.<\/span> <span class=\"sg\" data-s=\"1\">De eenvoudigste demonstratie hiervan is dat je dezelfde variabele kunt hergebruiken om eerst een geheel getal en daarna een string op te slaan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(De auteur moedigt je niet aan om op deze manier te programmeren.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intern betekent dit dat een nieuwe container standaard waarden van het type <code>Any<\/code> kan bevatten.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> is het basistype voor de meeste andere typen, zoals <code>Int<\/code> of <code>Str<\/code>.<\/span><\/p>"]]},"es":{"t":"Contenedores escalares","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Como su nombre sugiere, los contenedores escalares albergan valores individuales (escalares).<\/span> <span class=\"sg\" data-s=\"1\">Estos contenedores se marcan con el sigilo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes uno de los usos más simples y directos de un escalar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$lang<\/code> es un contenedor escalar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por defecto, los contenedores escalares no imponen un tipo sobre los datos, por lo que puedes almacenar un valor de cualquier tipo en ellos.<\/span> <span class=\"sg\" data-s=\"1\">La demostración más simple de esto es que puedes reutilizar la misma variable para almacenar un entero y luego una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(El autor no te anima a programar de esta manera.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Internamente, esto significa que, por defecto, un nuevo contenedor puede mantener valores del tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> es el tipo base para la mayoría de los demás tipos, como <code>Int<\/code> o <code>Str<\/code>.<\/span><\/p>"]]},"it":{"t":"Contenitori scalari","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Come suggerisce il nome, i contenitori scalari ospitano valori singoli (scalari).<\/span> <span class=\"sg\" data-s=\"1\">Tali contenitori sono contrassegnati dal sigillo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco uno degli usi più semplici e diretti di uno scalare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$lang<\/code> è un contenitore scalare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita, i contenitori scalari non impongono un tipo ai dati, quindi è possibile memorizzare un valore di qualsiasi tipo al loro interno.<\/span> <span class=\"sg\" data-s=\"1\">La dimostrazione più semplice è che si può riutilizzare la stessa variabile per memorizzare un intero e poi una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(L'autore non vi incoraggia a programmare in questo modo.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Internamente, ciò significa che, per impostazione predefinita, un nuovo contenitore può contenere valori del tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> è il tipo base per la maggior parte degli altri tipi, come <code>Int<\/code> o <code>Str<\/code>.<\/span><\/p>"]]},"lv":{"t":"Skalārie konteineri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kā norāda nosaukums, skalārie konteineri glabā atsevišķas (skalāras) vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Šādus konteinerus apzīmē ar sigilu <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens no vienkāršākajiem un tiešākajiem skalāra lietošanas veidiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$lang<\/code> ir skalārs konteineris.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma skalārie konteineri neuzliek tipu datiem, tāpēc tajos var glabāt jebkura tipa vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršākais to demonstrējums ir tāds, ka varat izmantot vienu un to pašu mainīgo, lai vispirms saglabātu veselu skaitli, bet pēc tam virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Autors neaicina jūs programmēt šādā veidā.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iekšēji tas nozīmē, ka pēc noklusējuma jauns konteineris var glabāt <code>Any<\/code> tipa vērtības.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> ir bāzes tips lielākajai daļai citu tipu, piemēram, <code>Int<\/code> vai <code>Str<\/code>.<\/span><\/p>"]]},"ru":{"t":"Скалярные контейнеры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Как следует из названия, скалярные контейнеры хранят единичные (скалярные) значения.<\/span> <span class=\"sg\" data-s=\"1\">Такие контейнеры обозначаются сигилом <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из самых простых и прямолинейных примеров использования скаляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$lang<\/code> — это скалярный контейнер.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию скалярные контейнеры не накладывают ограничений на тип данных, поэтому в них можно хранить значение любого типа.<\/span> <span class=\"sg\" data-s=\"1\">Простейшая демонстрация этого — повторное использование одной и той же переменной для хранения сначала целого числа, а затем строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Автор не рекомендует вам программировать таким образом.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутренне это означает, что по умолчанию новый контейнер может хранить значения типа <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> — это базовый тип для большинства других типов, таких как <code>Int<\/code> или <code>Str<\/code>.<\/span><\/p>"]]},"uk":{"t":"Скалярні контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Як випливає з назви, скалярні контейнери містять поодинокі (скалярні) значення.<\/span> <span class=\"sg\" data-s=\"1\">Такі контейнери позначаються сигілом <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з найпростіших і найпрямолінійніших застосувань скаляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$lang<\/code> є скалярним контейнером.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням скалярні контейнери не нав'язують даним типу, тож у них можна зберігати значення будь-якого типу.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіше це показати так: ту саму змінну можна повторно використати, щоб зберегти спершу ціле число, а потім рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Автор не заохочує вас так програмувати.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усередині це означає, що за замовчуванням новий контейнер може зберігати значення типу <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> є базовим типом для більшості інших типів, як-от <code>Int<\/code> чи <code>Str<\/code>.<\/span><\/p>"]]},"bg":{"t":"Скаларни контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Както подсказва името, скаларните контейнери съхраняват единични (скаларни) стойности.<\/span> <span class=\"sg\" data-s=\"1\">Такива контейнери се означават със сигила <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно от най-простите и най-преките използвания на скалар:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$lang<\/code> е скаларен контейнер.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране скаларните контейнери не налагат тип на данните, така че можете да съхранявате стойност от всякакъв тип в тях.<\/span> <span class=\"sg\" data-s=\"1\">Най-простата демонстрация на това е, че можете да използвате повторно същата променлива, за да съхраните цяло число, а след това низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Авторът не ви насърчава да програмирате по този начин.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътрешно това означава, че по подразбиране нов контейнер може да съдържа стойности от тип <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> е базовият тип за повечето други типове, като <code>Int<\/code> или <code>Str<\/code>.<\/span><\/p>"]]},"eo":{"t":"Skalaraj ujoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel la nomo sugestas, skalaraj ujoj enhavas unuopajn (skalarajn) valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiaj ujoj estas markitaj per la sigelo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu el la plej simplaj kaj rektaj uzoj de skalaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$lang<\/code> estas skalara ujo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, skalaraj ujoj ne devigas tipon sur la datumoj, do vi povas konservi valoron de ajna tipo en ili.<\/span> <span class=\"sg\" data-s=\"1\">La plej simpla demonstrado de tio estas, ke vi povas reuzi la saman variablon por konservi entjeron kaj poste ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(La aŭtoro ne kuraĝigas vin programi tiamaniere.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interne, tio signifas, ke defaŭlte nova ujo povas teni valorojn de la tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> estas la baza tipo por plej multaj aliaj tipoj, kiel <code>Int<\/code> aŭ <code>Str<\/code>.<\/span><\/p>"]]},"la":{"t":"Scalaria receptacula","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut nomen suggerit, continentes scalares valores singulos (scalares) hospitant.<\/span> <span class=\"sg\" data-s=\"1\">Tales continentes sigillo <code>$<\/code> notantur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est unus ex simplicissimis et directissimis usibus scalaris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$lang<\/code> est continens scalaris.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per defectum, continentes scalares typum in datis non imponunt, itaque valorem cuiuslibet typi in eis servare potes.<\/span> <span class=\"sg\" data-s=\"1\">Demonstratio simplicissima huius rei est quod eandem variabilem ad numerum integrum et deinde ad seriem servandam reuti potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Auctor te hoc modo programmare non hortatur.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interne, hoc significat quod, per defectum, novus continens valores typi <code>Any<\/code> servare potest.<\/span> <span class=\"sg\" data-s=\"1\"><code>Any<\/code> est typus basalis pro plerisque aliis typis, ut <code>Int<\/code> vel <code>Str<\/code>.<\/span><\/p>"]]}}}</script>
