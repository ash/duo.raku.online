<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/types","n":354,"k":"topic","pv":"advanced/scalar-containers","nx":"advanced/scalar-containers/type-constraints","tr":["advanced","advanced/scalar-containers"],"L":{"en":{"t":"Data types and scalar containers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Let us look at a program that reuses the same variable to hold different kinds of data.<\/span> <span class=\"sg\" data-s=\"1\">We use <code>dd<\/code> to see what the container holds at each step.<\/span> <span class=\"sg\" data-s=\"2\">This example is here for demonstration purposes and is not a recommended programming style.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each <code>dd<\/code> call shows what the <code>$value<\/code> variable currently contains:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">At first, the variable is empty, and <code>dd<\/code> reports its value as <code>Any<\/code> — the undefined base value that an untyped container starts with.<\/span> <span class=\"sg\" data-s=\"1\">After the assignments, <code>dd<\/code> shows the integer and then the string.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notice that <code>dd<\/code> does not print a type before the name here.<\/span> <span class=\"sg\" data-s=\"1\">An untyped container does not commit to any type, so only the value is shown.<\/span> <span class=\"sg\" data-s=\"2\">As you will see in the next topic, <a href=\"/advanced/scalar-containers/type-constraints/\">a container with a declared type<\/a> behaves differently.<\/span><\/p>"]]},"de":{"t":"Datentypen und skalare Container","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Schauen wir uns ein Programm an, das dieselbe Variable wiederverwendet, um verschiedene Arten von Daten zu halten.<\/span> <span class=\"sg\" data-s=\"1\">Wir verwenden <code>dd<\/code>, um zu sehen, was der Container bei jedem Schritt enthält.<\/span> <span class=\"sg\" data-s=\"2\">Dieses Beispiel dient der Veranschaulichung und ist kein empfohlener Programmierstil.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder <code>dd<\/code>-Aufruf zeigt, was die Variable <code>$value<\/code> gerade enthält:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zunächst ist die Variable leer, und <code>dd<\/code> meldet ihren Wert als <code>Any<\/code> — den undefinierten Basiswert, mit dem ein untypisierter Container beginnt.<\/span> <span class=\"sg\" data-s=\"1\">Nach den Zuweisungen zeigt <code>dd<\/code> die Ganzzahl und dann den String.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass <code>dd<\/code> hier keinen Typ vor dem Namen ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">Ein untypisierter Container legt sich auf keinen Typ fest, sodass nur der Wert angezeigt wird.<\/span> <span class=\"sg\" data-s=\"2\">Wie du im nächsten Thema sehen wirst, verhält sich <a href=\"https://course.raku.org/de/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">ein Container mit deklariertem Typ<\/a> anders.<\/span><\/p>"]]},"nl":{"t":"Gegevenstypen en scalaire containers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Laten we een programma bekijken dat dezelfde variabele hergebruikt om verschillende soorten gegevens op te slaan.<\/span> <span class=\"sg\" data-s=\"1\">We gebruiken <code>dd<\/code> om te zien wat de container bij elke stap bevat.<\/span> <span class=\"sg\" data-s=\"2\">Dit voorbeeld is hier ter demonstratie en is geen aanbevolen programmeerstijl.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke <code>dd<\/code>-aanroep toont wat de variabele <code>$value<\/code> op dat moment bevat:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In het begin is de variabele leeg, en <code>dd<\/code> rapporteert de waarde als <code>Any<\/code> — de ongedefinieerde basiswaarde waarmee een container zonder type begint.<\/span> <span class=\"sg\" data-s=\"1\">Na de toewijzingen toont <code>dd<\/code> het gehele getal en vervolgens de string.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Merk op dat <code>dd<\/code> hier geen type voor de naam afdrukt.<\/span> <span class=\"sg\" data-s=\"1\">Een container zonder type bindt zich niet aan een bepaald type, dus alleen de waarde wordt getoond.<\/span> <span class=\"sg\" data-s=\"2\">Zoals je in het volgende onderwerp zult zien, gedraagt <a href=\"https://course.raku.org/nl/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">een container met een gedeclareerd type<\/a> zich anders.<\/span><\/p>"]]},"es":{"t":"Tipos de datos y contenedores escalares","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Veamos un programa que reutiliza la misma variable para contener diferentes tipos de datos.<\/span> <span class=\"sg\" data-s=\"1\">Usamos <code>dd<\/code> para ver que contiene el contenedor en cada paso.<\/span> <span class=\"sg\" data-s=\"2\">Este ejemplo esta aquí con fines demostrativos y no es un estilo de programación recomendado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>dd<\/code> muestra lo que la variable <code>$value<\/code> contiene actualmente:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al principio, la variable esta vacía, y <code>dd<\/code> reporta su valor como <code>Any<\/code> — el valor base indefinido con el que comienza un contenedor sin tipo.<\/span> <span class=\"sg\" data-s=\"1\">Después de las asignaciones, <code>dd<\/code> muestra el entero y luego la cadena.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Observa que <code>dd<\/code> no imprime un tipo antes del nombre aquí.<\/span> <span class=\"sg\" data-s=\"1\">Un contenedor sin tipo no se compromete con ningún tipo, por lo que solo se muestra el valor.<\/span> <span class=\"sg\" data-s=\"2\">Como verás en el siguiente tema, <a href=\"https://course.raku.org/es/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">un contenedor con un tipo declarado<\/a> se comporta de manera diferente.<\/span><\/p>"]]},"it":{"t":"Tipi di dati e contenitori scalari","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Esaminiamo un programma che riutilizza la stessa variabile per contenere diversi tipi di dati.<\/span> <span class=\"sg\" data-s=\"1\">Usiamo <code>dd<\/code> per vedere cosa contiene il contenitore ad ogni passaggio.<\/span> <span class=\"sg\" data-s=\"2\">Questo esempio è qui a scopo dimostrativo e non è uno stile di programmazione consigliato.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>dd<\/code> mostra cosa contiene attualmente la variabile <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">All'inizio, la variabile è vuota, e <code>dd<\/code> riporta il suo valore come <code>Any<\/code> — il valore base indefinito con cui un contenitore non tipizzato inizia.<\/span> <span class=\"sg\" data-s=\"1\">Dopo le assegnazioni, <code>dd<\/code> mostra l'intero e poi la stringa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notate che <code>dd<\/code> non stampa un tipo prima del nome in questo caso.<\/span> <span class=\"sg\" data-s=\"1\">Un contenitore non tipizzato non si vincola ad alcun tipo, quindi viene mostrato solo il valore.<\/span> <span class=\"sg\" data-s=\"2\">Come vedrete nel prossimo argomento, <a href=\"https://course.raku.org/it/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">un contenitore con un tipo dichiarato<\/a> si comporta diversamente.<\/span><\/p>"]]},"lv":{"t":"Datu tipi un skalārie konteineri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Apskatīsim programmu, kas atkārtoti izmanto vienu un to pašu mainīgo dažādu datu veidu glabāšanai.<\/span> <span class=\"sg\" data-s=\"1\">Mēs izmantojam <code>dd<\/code>, lai redzētu, ko konteineris satur katrā solī.<\/span> <span class=\"sg\" data-s=\"2\">Šis piemērs ir paredzēts demonstrācijai un nav ieteicams programmēšanas stils.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>dd<\/code> izsaukums parāda, ko mainīgais <code>$value<\/code> pašlaik satur:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sākumā mainīgais ir tukšs, un <code>dd<\/code> parāda tā vērtību kā <code>Any<\/code> — nedefinētu bāzes vērtību, ar ko sākas netipizēts konteineris.<\/span> <span class=\"sg\" data-s=\"1\">Pēc piešķiršanām <code>dd<\/code> parāda veselo skaitli un pēc tam virkni.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka <code>dd<\/code> šeit neizdrukā tipu pirms nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Netipizēts konteineris neuzņemas nekādu tipu, tāpēc tiek parādīta tikai vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Kā redzēsiet nākamajā tēmā, <a href=\"https://course.raku.org/lv/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">konteineris ar deklarētu tipu<\/a> uzvedas citādi.<\/span><\/p>"]]},"ru":{"t":"Типы данных и скалярные контейнеры","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Давайте рассмотрим программу, которая повторно использует одну и ту же переменную для хранения данных разного типа.<\/span> <span class=\"sg\" data-s=\"1\">Мы используем <code>dd<\/code>, чтобы увидеть, что содержит контейнер на каждом шаге.<\/span> <span class=\"sg\" data-s=\"2\">Этот пример приведён в демонстрационных целях и не является рекомендуемым стилем программирования.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>dd<\/code> показывает, что в данный момент содержит переменная <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сначала переменная пуста, и <code>dd<\/code> показывает её значение как <code>Any<\/code> — неопределённое базовое значение, с которого начинается нетипизированный контейнер.<\/span> <span class=\"sg\" data-s=\"1\">После присваиваний <code>dd<\/code> показывает сначала целое число, а затем строку.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что <code>dd<\/code> не выводит тип перед именем.<\/span> <span class=\"sg\" data-s=\"1\">Нетипизированный контейнер не привязан к какому-либо типу, поэтому показывается только значение.<\/span> <span class=\"sg\" data-s=\"2\">Как вы увидите в следующей теме, <a href=\"https://course.raku.org/ru/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">контейнер с объявленным типом<\/a> ведёт себя иначе.<\/span><\/p>"]]},"uk":{"t":"Типи даних і скалярні контейнери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Погляньмо на програму, яка повторно використовує ту саму змінну для зберігання даних різного роду.<\/span> <span class=\"sg\" data-s=\"1\">Ми користуємося <code>dd<\/code>, щоб побачити, що контейнер містить на кожному кроці.<\/span> <span class=\"sg\" data-s=\"2\">Цей приклад наведено з демонстраційною метою і він не є рекомендованим стилем програмування.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>dd<\/code> показує, що змінна <code>$value<\/code> містить у цю мить:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спочатку змінна порожня, і <code>dd<\/code> повідомляє її значення як <code>Any<\/code> — невизначене базове значення, з якого починає нетипізований контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Після присвоєнь <code>dd<\/code> показує ціле число, а потім рядок.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що <code>dd<\/code> тут не виводить типу перед іменем.<\/span> <span class=\"sg\" data-s=\"1\">Нетипізований контейнер не зобов'язується до жодного типу, тож показано лише значення.<\/span> <span class=\"sg\" data-s=\"2\">Як ви побачите в наступній темі, <a href=\"https://course.raku.org/uk/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">контейнер з оголошеним типом<\/a> поводиться інакше.<\/span><\/p>"]]},"bg":{"t":"Типове данни и скаларни контейнери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Нека разгледаме програма, която използва повторно същата променлива за съхраняване на различни видове данни.<\/span> <span class=\"sg\" data-s=\"1\">Използваме <code>dd<\/code>, за да видим какво съдържа контейнерът на всяка стъпка.<\/span> <span class=\"sg\" data-s=\"2\">Този пример е тук с демонстрационна цел и не е препоръчителен стил на програмиране.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>dd<\/code> показва какво съдържа в момента променливата <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В началото променливата е празна и <code>dd<\/code> отчита стойността й като <code>Any<\/code> — неопределената базова стойност, с която започва нетипизиран контейнер.<\/span> <span class=\"sg\" data-s=\"1\">След присвояванията <code>dd<\/code> показва целочислената стойност, а след това низа.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че <code>dd<\/code> не отпечатва тип преди името тук.<\/span> <span class=\"sg\" data-s=\"1\">Нетипизиран контейнер не се ангажира с никакъв тип, така че се показва само стойността.<\/span> <span class=\"sg\" data-s=\"2\">Както ще видите в следващата тема, <a href=\"https://course.raku.org/bg/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">контейнер с деклариран тип<\/a> се държи по различен начин.<\/span><\/p>"]]},"eo":{"t":"Datentipoj kaj skalaraj ujoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ni rigardu programon, kiu reuzas la saman variablon por teni malsamajn specojn de datumoj.<\/span> <span class=\"sg\" data-s=\"1\">Ni uzas <code>dd<\/code> por vidi, kion la ujo enhavas en ĉiu paŝo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu ekzemplo estas ĉi tie por demonstraj celoj kaj ne estas rekomendita programstilo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko de <code>dd<\/code> montras, kion la variablo <code>$value<\/code> nuntempe enhavas:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Komence, la variablo estas malplena, kaj <code>dd<\/code> raportas ĝian valoron kiel <code>Any<\/code> — la nedefinita baza valoro, kun kiu netipigita ujo komenciĝas.<\/span> <span class=\"sg\" data-s=\"1\">Post la asignoj, <code>dd<\/code> montras la entjeron kaj poste la ĉenon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke <code>dd<\/code> ne presas tipon antaŭ la nomo ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Netipigita ujo ne ligas sin al iu tipo, do nur la valoro estas montrata.<\/span> <span class=\"sg\" data-s=\"2\">Kiel vi vidos en la sekva temo, <a href=\"https://course.raku.org/eo/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">ujo kun deklarita tipo<\/a> kondutas malsame.<\/span><\/p>"]]},"la":{"t":"Data genera et scalaria receptacula","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Inspiciamus programma quod eandem variabilem ad diversa genera datorum tenenda reutit.<\/span> <span class=\"sg\" data-s=\"1\">Adhibemus <code>dd<\/code> ut videamus quid continens in quoque gradu contineat.<\/span> <span class=\"sg\" data-s=\"2\">Hoc exemplum hic ad demonstrationem est et non est modus programmandi commendatus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio <code>dd<\/code> ostendit quid variabilis <code>$value<\/code> nunc contineat:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Initio, variabilis vacua est, et <code>dd<\/code> valorem eius ut <code>Any<\/code> refert — valorem indefinitum basalem quo continens sine typo incipit.<\/span> <span class=\"sg\" data-s=\"1\">Post assignationes, <code>dd<\/code> numerum integrum et deinde seriem ostendit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod <code>dd<\/code> typum ante nomen hic non imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Continens sine typo nulli typo se obligat, itaque solum valor ostenditur.<\/span> <span class=\"sg\" data-s=\"2\">Ut in themate sequenti videbis, <a href=\"https://course.raku.org/la/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">continens cum typo declarato<\/a> aliter se gerit.<\/span><\/p>"]]}}}</script>
