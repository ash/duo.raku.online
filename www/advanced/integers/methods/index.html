<script type="application/json" id="page-data">{"u":"advanced/integers/methods","n":432,"k":"topic","pv":"advanced/integers/number-bases/quiz","nx":"advanced/integers/exercises","tr":["advanced","advanced/integers"],"L":{"en":{"t":"Integer methods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Integers come with a number of useful methods and routines.<\/span> <span class=\"sg\" data-s=\"1\">Here are a few that you will reach for often.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>is-prime<\/code> method tells whether a number is a prime:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>gcd<\/code> and <code>lcm<\/code> operators return the greatest common divisor and the least common multiple of two numbers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>abs<\/code> method returns the absolute value, and <code>sign<\/code> returns <code>-1<\/code>, <code>0<\/code>, or <code>1<\/code> depending on whether the number is negative, zero, or positive:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"de":{"t":"Ganzzahl-Methoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ganze Zahlen verfugen uber eine Reihe nutzlicher Methoden und Routinen.<\/span> <span class=\"sg\" data-s=\"1\">Hier sind einige, die du haufig verwenden wirst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>is-prime<\/code> gibt an, ob eine Zahl eine Primzahl ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Operatoren <code>gcd<\/code> und <code>lcm<\/code> liefern den größten gemeinsamen Teiler und das kleinste gemeinsame Vielfache zweier Zahlen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>abs<\/code> gibt den Absolutwert zuruck, und <code>sign<\/code> liefert <code>-1<\/code>, <code>0<\/code> oder <code>1<\/code>, je nachdem, ob die Zahl negativ, null oder positiv ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"nl":{"t":"Methoden voor gehele getallen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gehele getallen hebben een aantal nuttige methoden en routines.<\/span> <span class=\"sg\" data-s=\"1\">Hier zijn er een paar die je vaak zult gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>is-prime<\/code> methode vertelt of een getal een priemgetal is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>gcd<\/code> en <code>lcm<\/code> operatoren geven de grootste gemene deler en het kleinste gemene veelvoud van twee getallen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>abs<\/code> methode geeft de absolute waarde, en <code>sign<\/code> geeft <code>-1<\/code>, <code>0<\/code> of <code>1<\/code> terug, afhankelijk van of het getal negatief, nul of positief is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"es":{"t":"Métodos de enteros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los enteros vienen con varios métodos y rutinas útiles.<\/span> <span class=\"sg\" data-s=\"1\">Aquí tienes algunos que usarás con frecuencia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>is-prime<\/code> indica si un número es primo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los operadores <code>gcd<\/code> y <code>lcm<\/code> devuelven el máximo común divisor y el mínimo común múltiplo de dos números:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>abs<\/code> devuelve el valor absoluto, y <code>sign<\/code> devuelve <code>-1<\/code>, <code>0<\/code> o <code>1<\/code> dependiendo de si el número es negativo, cero o positivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"it":{"t":"Metodi degli interi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli interi dispongono di numerosi metodi e routine utili.<\/span> <span class=\"sg\" data-s=\"1\">Eccone alcuni che userai spesso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>is-prime<\/code> indica se un numero è primo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli operatori <code>gcd<\/code> e <code>lcm<\/code> restituiscono il massimo comun divisore e il minimo comune multiplo di due numeri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>abs<\/code> restituisce il valore assoluto, e <code>sign<\/code> restituisce <code>-1<\/code>, <code>0<\/code> o <code>1<\/code> a seconda che il numero sia negativo, zero o positivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"lv":{"t":"Veselo s  кратно на две числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>abs<\/code> връща абсолютната стойност, а <code>sign<\/code> връща <code>-1<\/code>, <code>0<\/code> или <code>1<\/code> в зависимост от това дали числото е отрицателно, нула или положително:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"eo":{"t":"Entjeraj metodoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Entjeroj havas kelkajn utilajn metodojn kaj rutinojn.<\/span> <span class=\"sg\" data-s=\"1\">Jen kelkaj, kiujn vi uzos ofte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>is-prime<\/code> diras, ĉu nombro estas primo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La operatoroj <code>gcd<\/code> kaj <code>lcm<\/code> redonas la plej grandan komunan divisoron kaj la plej malgrandan komunan multiplikon de du nombroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>abs<\/code> redonas la absolutan valoron, kaj <code>sign<\/code> redonas <code>-1<\/code>, <code>0<\/code>, aŭ <code>1<\/code> depende de tio, ĉu la nombro estas negativa, nulo, aŭ pozitiva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"la":{"t":"Methodi integrorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeri integri plures methodos et functiones utiles habent.<\/span> <span class=\"sg\" data-s=\"1\">Hic sunt aliquae quas saepe adhibebis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>is-prime<\/code> indicat an numerus primus
