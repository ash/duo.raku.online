<script type="application/json" id="page-data">{"u":"advanced/integers","n":429,"k":"section","pv":"advanced/introspection/exercises/container-default/solution","nx":"advanced/integers/number-bases","tr":["advanced"],"L":{"en":{"t":"Integers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You have used integers since the very beginning of the course.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at a few of their less obvious features.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The most important one is that integers in Raku have <em>arbitrary precision<\/em>: they are not limited to a fixed number of bytes, and they never silently overflow.<\/span> <span class=\"sg\" data-s=\"1\">As long as there is enough memory, an integer can grow as large as you need:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is an exact value, not an approximation.<\/span> <span class=\"sg\" data-s=\"1\">The same is true for products of large numbers — the factorial of 50, for example, is computed exactly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To make long numbers easier to read in the source code, you may group the digits with underscores.<\/span> <span class=\"sg\" data-s=\"1\">The underscores are ignored by the compiler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following topics show how to write integers in other number bases and introduce a few handy integer methods.<\/span><\/p>"]]},"de":{"t":"Ganzzahlen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Du hast seit dem Anfang des Kurses mit ganzen Zahlen gearbeitet.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Abschnitt werden einige ihrer weniger offensichtlichen Eigenschaften betrachtet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die wichtigste ist, dass ganze Zahlen in Raku <em>beliebige Genauigkeit<\/em> haben: Sie sind nicht auf eine feste Anzahl von Bytes beschrankt und laufen niemals stillschweigend uber.<\/span> <span class=\"sg\" data-s=\"1\">Solange genugend Speicher vorhanden ist, kann eine ganze Zahl so gross werden, wie du es brauchst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies ist ein exakter Wert, keine Naherung.<\/span> <span class=\"sg\" data-s=\"1\">Das Gleiche gilt fur Produkte grosser Zahlen — die Fakultat von 50 wird zum Beispiel exakt berechnet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um lange Zahlen im Quellcode lesbarer zu machen, kannst du die Ziffern mit Unterstrichen gruppieren.<\/span> <span class=\"sg\" data-s=\"1\">Die Unterstriche werden vom Compiler ignoriert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Themen zeigen, wie man ganze Zahlen in anderen Zahlensystemen schreibt, und stellen einige nutzliche Methoden fur ganze Zahlen vor.<\/span><\/p>"]]},"nl":{"t":"Gehele getallen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt gehele getallen gebruikt vanaf het allereerste begin van de cursus.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte bekijkt een paar van hun minder voor de hand liggende mogelijkheden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De belangrijkste is dat gehele getallen in Raku <em>willekeurige precisie<\/em> hebben: ze zijn niet beperkt tot een vast aantal bytes, en ze lopen nooit stilletjes over.<\/span> <span class=\"sg\" data-s=\"1\">Zolang er genoeg geheugen is, kan een geheel getal zo groot worden als je nodig hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is een exacte waarde, geen benadering.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde geldt voor producten van grote getallen — de faculteit van 50 wordt bijvoorbeeld exact berekend:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om lange getallen in de broncode leesbaarder te maken, kun je de cijfers groeperen met underscores.<\/span> <span class=\"sg\" data-s=\"1\">De underscores worden genegeerd door de compiler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je gehele getallen in andere talstelsels schrijft en introduceren een aantal handige integer methoden.<\/span><\/p>"]]},"es":{"t":"Enteros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Has utilizado enteros desde el inicio del curso.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección examina algunas de sus características menos evidentes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La más importante es que los enteros en Raku tienen <em>precisión arbitraria<\/em>: no están limitados a un número fijo de bytes, y nunca desbordan silenciosamente.<\/span> <span class=\"sg\" data-s=\"1\">Mientras haya suficiente memoria, un entero puede crecer tanto como necesites:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este es un valor exacto, no una aproximación.<\/span> <span class=\"sg\" data-s=\"1\">Lo mismo ocurre con los productos de números grandes: el factorial de 50, por ejemplo, se calcula de forma exacta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para facilitar la lectura de números largos en el código fuente, puedes agrupar los dígitos con guiones bajos.<\/span> <span class=\"sg\" data-s=\"1\">El compilador los ignora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran cómo escribir enteros en otras bases numéricas e introducen algunos métodos útiles para enteros.<\/span><\/p>"]]},"it":{"t":"Interi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai usato gli interi fin dall'inizio del corso.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione esamina alcune delle loro caratteristiche meno ovvie.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La più importante è che gli interi in Raku hanno <em>precisione arbitraria<\/em>: non sono limitati a un numero fisso di byte e non vanno mai in overflow silenziosamente.<\/span> <span class=\"sg\" data-s=\"1\">Finché c'è abbastanza memoria, un intero può crescere quanto serve:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è un valore esatto, non un'approssimazione.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso vale per i prodotti di numeri grandi — il fattoriale di 50, ad esempio, viene calcolato in modo esatto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per rendere i numeri lunghi più facili da leggere nel codice sorgente, puoi raggruppare le cifre con degli underscore.<\/span> <span class=\"sg\" data-s=\"1\">Gli underscore vengono ignorati dal compilatore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti seguenti mostrano come scrivere interi in altre basi numeriche e introducono alcuni metodi utili per gli interi.<\/span><\/p>"]]},"lv":{"t":"Veseli skaitļi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs esat lietojuši veselos skaitļus jau no paša kursa sākuma.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā aplūkotas dažas no to mazāk acīmredzamajām īpašībām.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vissvarīgākā ir tā, ka veseli skaitļi Raku ir <em>patvaļīgas precizitātes<\/em>: tie nav ierobežoti ar fiksētu baitu skaitu un tie nekad klusi nepārplūst.<\/span> <span class=\"sg\" data-s=\"1\">Kamēr pietiek atmiņas, vesels skaitlis var pieaugt tik liels, cik nepieciešams:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī ir precīza vērtība, nevis aptuvens skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats attiecas uz lielu skaitļu reizinājumiem — piemēram, 50 faktoriāls tiek aprēķināts precīzi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai garos skaitļus būtu vieglāk lasīt pirmkodā, ciparus var grupēt ar pasvītrām.<\/span> <span class=\"sg\" data-s=\"1\">Kompilators tos ignorē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tālākās tēmas parāda, kā rakstīt veselos skaitļus citās skaitīšanas sistēmās, un iepazīstina ar dažām noderīgām veselo skaitļu metodēm.<\/span><\/p>"]]},"ru":{"t":"Целые числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы используете целые числа с самого начала курса.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются несколько их менее очевидных особенностей.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Самая важная из них — целые числа в Raku имеют <em>произвольную точность<\/em>: они не ограничены фиксированным количеством байтов и никогда не переполняются без предупреждения.<\/span> <span class=\"sg\" data-s=\"1\">Пока хватает памяти, целое число может расти до любого нужного размера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это точное значение, а не приближение.<\/span> <span class=\"sg\" data-s=\"1\">То же самое относится к произведениям больших чисел — факториал 50, например, вычисляется точно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы длинные числа было легче читать в исходном коде, можно группировать цифры с помощью подчёркиваний.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор их игнорирует:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следующих темах показано, как записывать целые числа в других системах счисления, и описано несколько полезных методов для целых чисел.<\/span><\/p>"]]},"uk":{"t":"Цілі числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви користуєтеся цілими числами від самого початку курсу.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає кілька їхніх менш очевидних властивостей.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Найважливіша з них полягає в тому, що цілі числа в Raku мають <em>довільну точність<\/em>: вони не обмежені фіксованою кількістю байтів і ніколи не переповнюються тишком.<\/span> <span class=\"sg\" data-s=\"1\">Поки вистачає пам'яті, ціле число може зрости настільки, наскільки вам потрібно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це точне значення, а не наближення.<\/span> <span class=\"sg\" data-s=\"1\">Те саме стосується й добутків великих чисел: наприклад, факторіал 50 обчислюється точно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб довгі числа легше читалися у вихідному коді, цифри можна групувати підкресленнями.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор їх ігнорує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як записувати цілі числа в інших системах числення, і знайомлять із кількома зручними методами цілих чисел.<\/span><\/p>"]]},"bg":{"t":"Цели числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвали сте цели числа от самото начало на курса.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда някои от по-малко очевидните им характеристики.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Най-важната е, че целите числа в Raku имат <em>произволна точност<\/em>: те не са ограничени до фиксиран брой байтове и никога не преливат безшумно.<\/span> <span class=\"sg\" data-s=\"1\">Докато има достатъчно памет, цялото число може да расте колкото ви е необходимо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е точна стойност, не приближение.<\/span> <span class=\"sg\" data-s=\"1\">Същото важи и за произведения на големи числа — факториелът на 50, например, се изчислява точно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да направите дългите числа по-лесни за четене в изходния код, можете да групирате цифрите с долни черти.<\/span> <span class=\"sg\" data-s=\"1\">Долните черти се игнорират от компилатора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да записвате цели числа в други бройни системи и представят няколко полезни метода за цели числа.<\/span><\/p>"]]},"eo":{"t":"Entjeroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi uzis entjerojn ekde la komenco de la kurso.<\/span> <span class=\"sg\" data-s=\"1\">Tiu ĉi sekcio rigardas kelkajn el iliaj malpli evidentaj trajtoj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La plej grava estas, ke entjeroj en Raku havas <em>arbitran precizecon<\/em>: ili ne estas limigitaj al fiksa nombro da bajtoj, kaj ili neniam silente superfluas.<\/span> <span class=\"sg\" data-s=\"1\">Kiom ajn da memoro suficias, entjero povas kreski tiom granda, kiom vi bezonas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio estas ekzakta valoro, ne proksimumaĵo.<\/span> <span class=\"sg\" data-s=\"1\">Same validas por produktoj de grandaj nombroj — la faktorialo de 50, ekzemple, estas komputita ekzakte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por faciligi la legadon de longaj nombroj en la fontkodo, vi povas grupigi la ciferojn per substrekoj.<\/span> <span class=\"sg\" data-s=\"1\">La substrekoj estas ignorataj de la kompililo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras kiel skribi entjerojn en aliaj nombrobazoj kaj prezentas kelkajn utilajn entjerajn metodojn.<\/span><\/p>"]]},"la":{"t":"Integri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeros integros ab ipso initio cursus adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio aliquas eorum proprietates minus manifestas inspicit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maxime notandum est quod numeri integri in Raku <em>praecisionem arbitrariam<\/em> habent: non limitantur ad numerum fixum bytorum, et numquam tacite superfluunt.<\/span> <span class=\"sg\" data-s=\"1\">Quamdiu satis memoriae est, numerus integer tam magnus crescere potest quantum opus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic est valor exactus, non approximatio.<\/span> <span class=\"sg\" data-s=\"1\">Idem verum est de productis magnorum numerorum — factorialis numeri 50, exempli gratia, exacte computatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut longos numeros facilius legas in codice fonte, digitos cum underscores in greges dividere potes.<\/span> <span class=\"sg\" data-s=\"1\">Underscores a compilatore ignorantur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sequentia themata ostendunt quomodo numeros integros in aliis basibus numerorum scribas et aliquas utiles methodos integrorum introducunt.<\/span><\/p>"]]}}}</script>
