<script type="application/json" id="page-data">{"u":"advanced/integers/number-bases","n":430,"k":"topic","pv":"advanced/integers","nx":"advanced/integers/number-bases/quiz","tr":["advanced","advanced/integers"],"L":{"en":{"t":"Number bases","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An integer literal does not have to be written in the decimal system.<\/span> <span class=\"sg\" data-s=\"1\">Raku understands the three most common alternative bases out of the box, each with its own prefix:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Whichever base you use in the source code, the value is the same integer; only the notation differs.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For any other base, use the radix form <code>:base&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To go the other way — from a number to its representation in another base — call the <code>base<\/code> method.<\/span> <span class=\"sg\" data-s=\"1\">It returns a string of digits:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"de":{"t":"Zahlensysteme","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Integer-Literal muss nicht im Dezimalsystem geschrieben werden.<\/span> <span class=\"sg\" data-s=\"1\">Raku versteht die drei gaengigsten alternativen Zahlensysteme direkt, jedes mit einem eigenen Präfix:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadezimal (Basis 16)\nsay 0b1010; # 10   — binaer (Basis 2)\nsay 0o17;   # 15   — oktal (Basis 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unabhaengig davon, welches Zahlensystem du im Quellcode verwendest, ist der Wert dieselbe ganze Zahl; nur die Schreibweise unterscheidet sich.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für jedes andere Zahlensystem verwende die Radix-Form <code>:base&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um den umgekehrten Weg zu gehen — von einer Zahl zu ihrer Darstellung in einem anderen Zahlensystem — rufe die Methode <code>base<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt eine Zeichenkette mit Ziffern zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"nl":{"t":"Talstelsels","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een integer literal hoeft niet in het decimale stelsel geschreven te worden.<\/span> <span class=\"sg\" data-s=\"1\">Raku begrijpt de drie meest voorkomende alternatieve talstelsels direct, elk met een eigen prefix:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimaal (grondtal 16)\nsay 0b1010; # 10   — binair (grondtal 2)\nsay 0o17;   # 15   — octaal (grondtal 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Welk talstelsel je ook gebruikt in de broncode, de waarde is hetzelfde gehele getal; alleen de notatie verschilt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor elk ander talstelsel gebruik je de radix-vorm <code>:base&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om het andersom te doen — van een getal naar zijn representatie in een ander talstelsel — roep je de <code>base<\/code> methode aan.<\/span> <span class=\"sg\" data-s=\"1\">Deze geeft een string van cijfers terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"es":{"t":"Bases numéricas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un literal entero no tiene que estar escrito en el sistema decimal.<\/span> <span class=\"sg\" data-s=\"1\">Raku entiende las tres bases alternativas más comunes de forma nativa, cada una con su propio prefijo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binario (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Independientemente de la base que uses en el código fuente, el valor es el mismo entero; solo cambia la notación.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para cualquier otra base, usa la forma de raíz <code>:base&lt;número&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para hacer lo contrario — de un número a su representación en otra base — llama al método <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Devuelve una cadena de dígitos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"it":{"t":"Basi numeriche","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un letterale intero non deve essere necessariamente scritto nel sistema decimale.<\/span> <span class=\"sg\" data-s=\"1\">Raku comprende le tre basi alternative più comuni nativamente, ciascuna con il proprio prefisso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qualunque base si usi nel codice sorgente, il valore è lo stesso intero; cambia solo la notazione.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per qualsiasi altra base, usa la forma radice <code>:base&lt;numero&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per fare il contrario — da un numero alla sua rappresentazione in un'altra base — chiama il metodo <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce una stringa di cifre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"lv":{"t":"Skaitļu bāzes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vesela skaitļa literālis nav obligāti jāraksta decimālajā sistēmā.<\/span> <span class=\"sg\" data-s=\"1\">Raku saprot trīs visbiežāk lietotās alternatīvās bāzes, katrai ir savs prefikss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — heksadecimālā (bāze 16)\nsay 0b1010; # 10   — binārā (bāze 2)\nsay 0o17;   # 15   — oktālā (bāze 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Neatkarīgi no tā, kādu bāzi izmantojat pirmkodā, vērtība ir viens un tas pats vesels skaitlis; atšķiras tikai pieraksts.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jebkurai citai bāzei izmantojiet radiksa formu <code>:bāze&lt;skaitlis&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai dotos pretējā virzienā — no skaitļa uz tā attēlojumu citā bāzē — izsauciet metodi <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež ciparu virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"ru":{"t":"Системы счисления","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Целочисленный литерал не обязательно записывать в десятичной системе.<\/span> <span class=\"sg\" data-s=\"1\">Raku понимает три наиболее распространённые альтернативные системы счисления сразу, каждая со своим префиксом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какую бы систему счисления вы ни использовали в исходном коде, значение остаётся тем же целым числом; отличается только запись.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для любой другой системы счисления используйте форму <code>:основание&lt;число&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы выполнить обратное преобразование — от числа к его представлению в другой системе счисления — вызовите метод <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он возвращает строку цифр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"uk":{"t":"Системи числення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Цілочисловий літерал не обов'язково записувати в десятковій системі.<\/span> <span class=\"sg\" data-s=\"1\">Raku з коробки розуміє три найпоширеніші альтернативні основи, кожну зі своїм префіксом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — шістнадцяткова (основа 16)\nsay 0b1010; # 10   — двійкова (основа 2)\nsay 0o17;   # 15   — вісімкова (основа 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хоч би яку основу ви використали у вихідному коді, значенням буде те саме ціле число; відрізняється лише запис.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для будь-якої іншої основи скористайтеся формою <code>:основа&lt;число&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб піти у зворотний бік — від числа до його подання в іншій основі — викличте метод <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертає рядок цифр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"bg":{"t":"Бройни системи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Целочисленият литерал не е задължително да бъде записан в десетична система.<\/span> <span class=\"sg\" data-s=\"1\">Raku разбира трите най-разпространени алтернативни бройни системи директно, всяка със собствен префикс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — шестнадесетична (основа 16)\nsay 0b1010; # 10   — двоична (основа 2)\nsay 0o17;   # 15   — осмична (основа 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каквато и бройна система да използвате в изходния код, стойността е същото цяло число; различава се само записът.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За всяка друга бройна система използвайте формата с основа <code>:base&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За обратното преобразуване — от число към неговото представяне в друга бройна система — извикайте метода <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той връща низ от цифри:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"eo":{"t":"Nombraj bazoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Entjera literalo ne devas esti skribita en la dekuma sistemo.<\/span> <span class=\"sg\" data-s=\"1\">Raku komprenas la tri plej oftajn alternativajn bazojn rekte, cxiu kun sia propra prefikso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiun ajn bazon vi uzas en la fontkodo, la valoro estas la sama entjero; nur la notacio diferencas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por iu ajn alia bazo, uzu la radikan formon <code>:base&lt;number&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por iri la alian direkton -- de nombro al gxia prezento en alia bazo -- voku la metodon <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Gxi redonas cxenon de ciferoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"la":{"t":"Bases numerorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Litterale integrum non necesse est in systemate decimali scribi.<\/span> <span class=\"sg\" data-s=\"1\">Raku tres frequentissimas bases alternativas statim intelligit, unaquaeque cum suo praefixo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quamcumque basem in codice fonte adhibeas, valor idem integer est; sola notatio differt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro qualibet alia basi, formam radicis <code>:base&lt;number&gt;<\/code> adhibe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut contrario modo procedas — a numero ad eius repraesentationem in alia basi — methodum <code>base<\/code> voca.<\/span> <span class=\"sg\" data-s=\"1\">Chordam digitorum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]}}}</script>
