<script type="application/json" id="page-data">{"u":"advanced/enumerations/values-and-keys","n":513,"k":"topic","pv":"advanced/enumerations/defining/quiz","nx":"advanced/enumerations/values-and-keys/quiz","tr":["advanced","advanced/enumerations"],"L":{"en":{"t":"Values and keys","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Each enum constant carries both a name and a number.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.value<\/code> method gives the number, and the <code>.key<\/code> method gives the name as a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You do not have to accept the automatic numbering from zero.<\/span> <span class=\"sg\" data-s=\"1\">Write the constants as pairs to choose the values yourself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here the working week is numbered from one instead of zero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The enum type itself can list all of its constants.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.enums<\/code> method returns a map from each name to its value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Between <code>.value<\/code>, <code>.key<\/code>, and <code>.enums<\/code>, you can move freely from a constant to its number, from a number back to data, and over the whole set — which is what makes enums useful for things like menus, states, and lookup tables.<\/span><\/p>"]]},"de":{"t":"Werte und Schlüssel","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede Enum-Konstante trägt sowohl einen Namen als auch eine Zahl.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>.value<\/code> gibt die Zahl zurück, und die Methode <code>.key<\/code> gibt den Namen als String zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du musst die automatische Nummerierung ab Null nicht akzeptieren.<\/span> <span class=\"sg\" data-s=\"1\">Schreibe die Konstanten als Paare, um die Werte selbst zu wählen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist die Arbeitswoche ab eins statt ab Null nummeriert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Enum-Typ selbst kann alle seine Konstanten auflisten.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>.enums<\/code> gibt eine Map von jedem Namen zu seinem Wert zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit <code>.value<\/code>, <code>.key<\/code> und <code>.enums<\/code> kannst du frei von einer Konstante zu ihrer Zahl wechseln, von einer Zahl zurück zu Daten, und über die gesamte Menge iterieren — und genau das macht Enums nützlich für Dinge wie Menüs, Zustände und Nachschlagetabellen.<\/span><\/p>"]]},"nl":{"t":"Waarden en sleutels","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke enum-constante draagt zowel een naam als een getal.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.value<\/code> geeft het getal, en de methode <code>.key<\/code> geeft de naam als een tekenreeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hoeft de automatische nummering vanaf nul niet te accepteren.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf de constanten als paren om zelf de waarden te kiezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is de werkweek genummerd vanaf één in plaats van nul.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het enum-type zelf kan al zijn constanten opsommen.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.enums<\/code> geeft een map van elke naam naar zijn waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met <code>.value<\/code>, <code>.key<\/code> en <code>.enums<\/code> kun je vrij schakelen van een constante naar zijn getal, van een getal terug naar gegevens, en over de hele verzameling — en dat is wat enums nuttig maakt voor zaken als menu's, toestanden en opzoektabellen.<\/span><\/p>"]]},"es":{"t":"Valores y claves","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada constante de un enum lleva tanto un nombre como un número.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>.value<\/code> devuelve el número, y el método <code>.key<\/code> devuelve el nombre como cadena de texto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No tienes que aceptar la numeración automática desde cero.<\/span> <span class=\"sg\" data-s=\"1\">Escribe las constantes como pares para elegir los valores tú mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí la semana laboral está numerada desde uno en lugar de cero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El tipo enum en sí puede listar todas sus constantes.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>.enums<\/code> devuelve un mapa de cada nombre a su valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entre <code>.value<\/code>, <code>.key<\/code> y <code>.enums<\/code>, puedes moverte libremente de una constante a su número, de un número de vuelta a los datos, y por todo el conjunto, lo cual es lo que hace que los enums sean útiles para cosas como menús, estados y tablas de búsqueda.<\/span><\/p>"]]},"it":{"t":"Valori e chiavi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni costante di un enum porta con se' sia un nome che un numero.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>.value<\/code> restituisce il numero, e il metodo <code>.key<\/code> restituisce il nome come stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non e' obbligatorio accettare la numerazione automatica a partire da zero.<\/span> <span class=\"sg\" data-s=\"1\">Si possono scrivere le costanti come coppie per scegliere i valori manualmente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui la settimana lavorativa e' numerata a partire da uno invece che da zero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il tipo enum stesso puo' elencare tutte le sue costanti.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>.enums<\/code> restituisce una mappa da ogni nome al suo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tra <code>.value<\/code>, <code>.key<\/code> e <code>.enums<\/code>, ci si puo' muovere liberamente da una costante al suo numero, da un numero ai dati corrispondenti e sull'intero insieme, ed e' questo che rende gli enum utili per cose come menu, stati e tabelle di ricerca.<\/span><\/p>"]]},"lv":{"t":"Vērtības un atslēgas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Katra uzskaitījuma konstante nes gan nosaukumu, gan skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>.value<\/code> dod skaitli, bet metode <code>.key<\/code> — nosaukumu kā virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Automātiskā numerācija no nulles nav obligāta.<\/span> <span class=\"sg\" data-s=\"1\">Rakstiet konstantes kā pārus, lai vērtības izvēlētos pats:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit darba nedēļa numurēta no viena, nevis no nulles.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pats uzskaitījuma tips var uzskaitīt visas savas konstantes.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>.enums<\/code> atgriež attēlojumu no katra nosaukuma uz tā vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar <code>.value<\/code>, <code>.key<\/code> un <code>.enums<\/code> varat brīvi pārvietoties no konstantes uz tās skaitli, no skaitļa atpakaļ uz datiem un pāri visai kopai — un tieši tas padara uzskaitījumus noderīgus tādām lietām kā izvēlnes, stāvokļi un uzmeklēšanas tabulas.<\/span><\/p>"]]},"ru":{"t":"Значения и ключи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая константа перечисления несет в себе и имя, и число.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.value<\/code> возвращает число, а метод <code>.key<\/code> возвращает имя в виде строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам не обязательно принимать автоматическую нумерацию от нуля.<\/span> <span class=\"sg\" data-s=\"1\">Запишите константы в виде пар, чтобы выбрать значения самостоятельно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь рабочая неделя нумеруется с единицы, а не с нуля.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сам тип перечисления может перечислить все свои константы.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.enums<\/code> возвращает отображение из каждого имени в его значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С помощью <code>.value<\/code>, <code>.key<\/code> и <code>.enums<\/code> вы можете свободно переходить от константы к ее числу, от числа обратно к данным и перебирать весь набор — именно это делает перечисления полезными для таких вещей, как меню, состояния и таблицы соответствий.<\/span><\/p>"]]},"uk":{"t":"Значення та ключі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна константа перелічення несе і ім'я, і число.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.value<\/code> дає число, а метод <code>.key<\/code> — ім'я у вигляді рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приймати автоматичну нумерацію від нуля не обов'язково.<\/span> <span class=\"sg\" data-s=\"1\">Запишіть константи парами, щоб обрати значення самостійно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут робочий тиждень пронумеровано від одиниці, а не від нуля.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сам тип перелічення може перелічити всі свої константи.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.enums<\/code> повертає відображення кожного імені на його значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Маючи <code>.value<\/code>, <code>.key<\/code> та <code>.enums<\/code>, ви можете вільно переходити від константи до її числа, від числа назад до даних і по всьому набору, — саме це й робить перелічення корисними для меню, станів і таблиць пошуку.<\/span><\/p>"]]},"bg":{"t":"Стойности и ключове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка константа на изброимия тип носи както име, така и число.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>.value<\/code> дава числото, а методът <code>.key<\/code> дава името като низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не е задължително да приемате автоматичната номерация от нула.<\/span> <span class=\"sg\" data-s=\"1\">Запишете константите като двойки, за да изберете стойностите сами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук работната седмица е номерирана от едно вместо от нула.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Самият изброим тип може да изброи всичките си константи.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>.enums<\/code> връща карта от всяко име към неговата стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>.value<\/code>, <code>.key<\/code> и <code>.enums<\/code> можете свободно да преминавате от константа към нейното число, от число обратно към данни и по целия набор — което прави изброимите типове полезни за неща като менюта, състояния и таблици за справка.<\/span><\/p>"]]},"la":{"t":"Valores et claves","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Unaquaeque constans enumerationis et nomen et numerum fert.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>.value<\/code> numerum praebet, et methodus <code>.key<\/code> nomen ut seriem characterum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non necesse est numerationem automaticam ab zero accipere.<\/span> <span class=\"sg\" data-s=\"1\">Constantes ut paria scribe ad valores ipsos eligendos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic hebdomas operaria ab uno potius quam ab zero numeratur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Typus enumerationis ipse omnes suas constantes enumerare potest.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>.enums<\/code> tabulam ab unoquoque nomine ad eius valorem reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Inter <code>.value<\/code>, <code>.key<\/code>, et <code>.enums<\/code>, libere moveri potes a constante ad eius numerum, a numero retro ad data, et per totam collectionem — quod enumerationes utiles reddit ad res ut indices, status, et tabulas inspectionis.<\/span><\/p>"]]}}}</script>
