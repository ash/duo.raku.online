<script type="application/json" id="page-data">{"u":"advanced/enumerations","n":510,"k":"section","pv":"advanced/sequences/exercises/last-three/solution","nx":"advanced/enumerations/defining","tr":["advanced"],"L":{"en":{"t":"Enumerations","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">An <em>enumeration<\/em> (an <em>enum<\/em>) is a type whose values are a fixed set of named constants — the days of the week, the colours of a traffic light, the suits in a deck of cards.<\/span> <span class=\"sg\" data-s=\"1\">Instead of remembering that <code>0<\/code> means red and <code>1<\/code> means amber, you give each value a name and let Raku keep track of the numbers.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section shows how to define an enum and how to move between its names and the values behind them.<\/span><\/p>"]]},"de":{"t":"Aufzählungen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Enumeration<\/em> (ein <em>Enum<\/em>) ist ein Typ, dessen Werte eine feste Menge benannter Konstanten sind — die Wochentage, die Farben einer Ampel, die Farben in einem Kartenspiel.<\/span> <span class=\"sg\" data-s=\"1\">Anstatt sich zu merken, dass <code>0<\/code> rot und <code>1<\/code> gelb bedeutet, gibst du jedem Wert einen Namen und lässt Raku die Zahlen verwalten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt, wie man ein Enum definiert und wie man zwischen seinen Namen und den dahinterliegenden Werten wechselt.<\/span><\/p>"]]},"nl":{"t":"Enumeraties","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>enumeratie<\/em> (een <em>enum<\/em>) is een type waarvan de waarden een vaste verzameling van benoemde constanten zijn — de dagen van de week, de kleuren van een verkeerslicht, de kleuren in een kaartspel.<\/span> <span class=\"sg\" data-s=\"1\">In plaats van te onthouden dat <code>0<\/code> rood betekent en <code>1<\/code> oranje, geef je elke waarde een naam en laat je Raku de nummers bijhouden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel laat zien hoe je een enum definieert en hoe je wisselt tussen de namen en de waarden erachter.<\/span><\/p>"]]},"es":{"t":"Enumeraciones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>enumeración<\/em> (un <em>enum<\/em>) es un tipo cuyos valores son un conjunto fijo de constantes con nombre: los días de la semana, los colores de un semáforo, los palos de una baraja de cartas.<\/span> <span class=\"sg\" data-s=\"1\">En lugar de recordar que <code>0<\/code> significa rojo y <code>1<\/code> significa ámbar, le das un nombre a cada valor y dejas que Raku se encargue de los números.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra cómo definir un enum y cómo moverse entre sus nombres y los valores que hay detrás de ellos.<\/span><\/p>"]]},"it":{"t":"Enumerazioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un'<em>enumerazione<\/em> (un <em>enum<\/em>) e' un tipo i cui valori sono un insieme fisso di costanti con nome: i giorni della settimana, i colori di un semaforo, i semi in un mazzo di carte.<\/span> <span class=\"sg\" data-s=\"1\">Invece di ricordare che <code>0<\/code> significa rosso e <code>1<\/code> significa giallo, si assegna a ogni valore un nome e si lascia che Raku tenga traccia dei numeri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra come definire un enum e come spostarsi tra i nomi e i valori sottostanti.<\/span><\/p>"]]},"lv":{"t":"Uzskaitījumi 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Uzskaitījums<\/em> (<em>enum<\/em>) ir tips, kura vērtības ir noteikta nosauktu konstanšu kopa — nedēļas dienas, luksofora krāsas, kāršu mastu nosaukumi.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā, lai atcerētos, ka <code>0<\/code> nozīmē sarkano un <code>1<\/code> — dzelteno, katrai vērtībai dodat nosaukumu un ļaujat Raku sekot līdzi skaitļiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda, kā definēt uzskaitījumu un kā pārvietoties starp tā nosaukumiem un vērtībām, kas aiz tiem stāv.<\/span><\/p>"]]},"ru":{"t":"Перечисления","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Перечисление<\/em> (<em>enum<\/em>) — это тип, значения которого представляют собой фиксированный набор именованных констант: дни недели, цвета светофора, масти в колоде карт.<\/span> <span class=\"sg\" data-s=\"1\">Вместо того чтобы запоминать, что <code>0<\/code> означает красный, а <code>1<\/code> — желтый, вы даете каждому значению имя и позволяете Raku следить за числами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе показано, как определить перечисление и как переходить между именами и стоящими за ними значениями.<\/span><\/p>"]]},"uk":{"t":"Перелічення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Перелічення<\/em> (<em>enum<\/em>) — це тип, значеннями якого є сталий набір іменованих констант: дні тижня, кольори світлофора, масті в колоді карт.<\/span> <span class=\"sg\" data-s=\"1\">Замість пам'ятати, що <code>0<\/code> означає червоний, а <code>1<\/code> — жовтий, ви даєте кожному значенню ім'я й дозволяєте Raku стежити за числами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує, як визначити перелічення і як переходити між його іменами та значеннями, що за ними стоять.<\/span><\/p>"]]},"bg":{"t":"Изброявания 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Изброимият тип<\/em> (<em>enum<\/em>) е тип, чиито стойности са фиксиран набор от именувани константи — дните от седмицата, цветовете на светофар, боите в тесте карти.<\/span> <span class=\"sg\" data-s=\"1\">Вместо да помните, че <code>0<\/code> означава червено, а <code>1<\/code> означава жълто, давате на всяка стойност име и оставяте Raku да следи числата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази секция показва как да дефинирате изброим тип и как да преминавате между имената и стойностите зад тях.<\/span><\/p>"]]},"la":{"t":"Enumerationes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Enumeratio<\/em> (<em>enum<\/em>) est typus cuius valores sunt certus numerus constantium nominatarum — dies hebdomadis, colores lucernae itinerariae, genera chartarum in fasciculo.<\/span> <span class=\"sg\" data-s=\"1\">Pro eo ut memineris <code>0<\/code> significare rubrum et <code>1<\/code> significare flavum, unicuique valori nomen das et Raku numeros custodire sinis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec sectio ostendit quomodo enumerationem definias et quomodo inter nomina eius et valores post ea latentes movearis.<\/span><\/p>"]]}}}</script>
