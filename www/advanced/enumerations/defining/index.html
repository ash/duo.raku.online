e><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een enum geeft een verzameling gerelateerde constanten een naam en een type, waardoor code die ze gebruikt veel duidelijker is dan kale getallen.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp gaat over <a href=\"https://course.raku.org/nl/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">de getallen achter de namen<\/a>.<\/span><\/p>"]]},"es":{"t":"Definir un enum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Declara un enum con la palabra clave <code>enum<\/code>, un nombre y la lista de nombres de constantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto crea un nuevo tipo, <code>Colour<\/code>, y tres constantes: <code>red<\/code>, <code>green<\/code> y <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usar las constantes directamente por su nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Detrás de cada nombre hay un número, asignado automáticamente desde cero en el orden en que los listaste: <code>red<\/code> es <code>0<\/code>, <code>green<\/code> es <code>1<\/code>, <code>blue<\/code> es <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Como los valores están ordenados, puedes comparar las constantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una variable puede tener el tipo del enum, de modo que solo acepte esas constantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si un nombre pudiera entrar en conflicto con algo más en tu programa, siempre puedes referirte a una constante a través del nombre del enum con <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un enum le da a un conjunto de constantes relacionadas un nombre y un tipo, lo que hace que el código que las utiliza sea mucho más claro que usar números sueltos.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente tema trata sobre <a href=\"https://course.raku.org/es/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">los números detrás de los nombres<\/a>.<\/span><\/p>"]]},"it":{"t":"Definire un enum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Si dichiara un enum con la parola chiave <code>enum<\/code>, un nome e la lista dei nomi delle costanti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo crea un nuovo tipo, <code>Colour<\/code>, e tre costanti: <code>red<\/code>, <code>green<\/code> e <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si possono usare le costanti direttamente per nome:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dietro ogni nome c'e' un numero, assegnato automaticamente a partire da zero nell'ordine in cui sono stati elencati: <code>red<\/code> e' <code>0<\/code>, <code>green<\/code> e' <code>1<\/code>, <code>blue<\/code> e' <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poiche' i valori sono ordinati, si possono confrontare le costanti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una variabile puo' essere tipizzata con l'enum, in modo che accetti solo quelle costanti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se un nome potrebbe entrare in conflitto con qualcos'altro nel programma, si puo' sempre fare riferimento a una costante tramite il nome dell'enum con <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un enum assegna a un insieme di costanti correlate un nome e un tipo, il che rende il codice che le utilizza molto piu' chiaro rispetto ai numeri nudi.<\/span> <span class=\"sg\" data-s=\"1\">Il prossimo argomento esamina <a href=\"https://course.raku.org/it/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">i numeri dietro i nomi<\/a>.<\/span><\/p>"]]},"lv":{"t":"Uzskaitījuma definēšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Uzskaitījumu deklarē ar atslēgvārdu <code>enum<\/code>, nosaukumu un konstanšu nosaukumu sarakstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas izveido jaunu tipu <code>Colour<\/code> un trīs konstantes: <code>red<\/code>, <code>green<\/code> un <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Konstantes var lietot tieši pēc nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aiz katra nosaukuma ir skaitlis, kas piešķirts automātiski no nulles tādā secībā, kādā tos uzskaitījāt — <code>red<\/code> ir <code>0<\/code>, <code>green<\/code> ir <code>1<\/code>, <code>blue<\/code> ir <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā vērtības ir sakārtotas, konstantes var salīdzināt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīgajam var uzlikt uzskaitījuma tipu, lai tas pieņemtu tikai šīs konstantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja nosaukums varētu sadurties ar ko citu jūsu programmā, uz konstanti vienmēr var atsaukties caur uzskaitījuma nosaukumu ar <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzskaitījums dod saistītu konstanšu kopai nosaukumu un tipu, kas padara kodu, kurš tās izmanto, daudz skaidrāku nekā kaili skaitļi.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais temats aplūko <a href=\"https://course.raku.org/lv/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">skaitļus, kas stāv aiz nosaukumiem<\/a>.<\/span><\/p>"]]},"ru":{"t":"Определение перечисления","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Объявите перечисление с помощью ключевого слова <code>enum<\/code>, имени и списка имен констант:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это создает новый тип <code>Colour<\/code> и три константы: <code>red<\/code>, <code>green<\/code> и <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете использовать константы напрямую по имени:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За каждым именем стоит число, автоматически назначаемое от нуля в порядке перечисления — <code>red<\/code> равно <code>0<\/code>, <code>green<\/code> равно <code>1<\/code>, <code>blue<\/code> равно <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку значения упорядочены, константы можно сравнивать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Переменную можно типизировать перечислением, чтобы она принимала только эти константы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если имя может конфликтовать с чем-то другим в вашей программе, вы всегда можете обратиться к константе через имя перечисления с помощью <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перечисление дает набору связанных констант имя и тип, что делает код, использующий их, гораздо понятнее, чем голые числа.<\/span> <span class=\"sg\" data-s=\"1\">В следующей теме рассматриваются <a href=\"https://course.raku.org/ru/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числа, стоящие за именами<\/a>.<\/span><\/p>"]]},"uk":{"t":"Визначення перелічення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Оголосіть перелічення за допомогою ключового слова <code>enum<\/code>, імені та списку імен констант:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це створює новий тип <code>Colour<\/code> і три константи: <code>red<\/code>, <code>green<\/code> та <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Константи можна використовувати безпосередньо за іменем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За кожним іменем стоїть число, призначене автоматично від нуля в тому порядку, в якому ви їх перелічили: <code>red<\/code> — це <code>0<\/code>, <code>green<\/code> — <code>1<\/code>, <code>blue<\/code> — <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки значення впорядковані, константи можна порівнювати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Змінну можна типізувати переліченням, щоб вона приймала лише ці константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ім'я може конфліктувати з чимось іншим у вашій програмі, до константи завжди можна звернутися через ім'я перелічення з <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перелічення дає набору споріднених констант ім'я й тип, що робить код, який їх використовує, значно зрозумілішим за голі числа.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема розглядає <a href=\"https://course.raku.org/uk/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числа, що стоять за іменами<\/a>.<\/span><\/p>"]]},"bg":{"t":"Дефиниране на enum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Декларирайте изброим тип с ключовата дума <code>enum<\/code>, име и списък от имена на константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това създава нов тип, <code>Colour<\/code>, и три константи: <code>red<\/code>, <code>green<\/code> и <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да използвате константите директно по име:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зад всяко име стои число, присвоено автоматично от нула в реда, в който сте ги изброили — <code>red<\/code> е <code>0<\/code>, <code>green<\/code> е <code>1<\/code>, <code>blue<\/code> е <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тъй като стойностите са подредени, можете да сравнявате константите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Променлива може да бъде типизирана с изброимия тип, така че да приема само тези константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако дадено име може да се сблъска с нещо друго във вашата програма, винаги можете да се обърнете към константа чрез името на изброимия тип с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изброимият тип дава на набор от свързани константи име и тип, което прави кода, който ги използва, много по-ясен от голи числа.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема разглежда <a href=\"https://course.raku.org/bg/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числата зад имената<\/a>.<\/span><\/p>"]]},"la":{"t":"Enumerationem definire","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Enumerationem declara verbo <code>enum<\/code>, nomine, et indice nominum constantium:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc novum typum, <code>Colour<\/code>, et tres constantes creat: <code>red<\/code>, <code>green<\/code>, et <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Constantes directe nomine uti potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post unumquodque nomen numerus latet, automatice ab zero assignatus ordine quo ea enumeravisti — <code>red<\/code> est <code>0<\/code>, <code>green<\/code> est <code>1<\/code>, <code>blue<\/code> est <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quia valores ordinati sunt, constantes comparare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Variabilis typo enumerationis insigniri potest, ut solas illas constantes accipiat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si nomen cum alio in programmate tuo confligere possit, semper per nomen enumerationis cum <code>::<\/code> constantem nominare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Enumeratio constantibus cognatis nomen et typum dat, quod codicem qui eis utitur multo clariorem reddit quam nudos numeros.<\/span> <span class=\"sg\" data-s=\"1\">Proximum argumentum <a href=\"https://course.raku.org/la/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">numeros post nomina latentes<\/a> spectat.<\/span><\/p>"]]}}}</script>
