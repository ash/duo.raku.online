<script type="application/json" id="page-data">{"u":"advanced/enumerations/exercises/traffic-enum","n":516,"k":"exercise","pv":"advanced/enumerations/exercises","nx":"advanced/enumerations/exercises/traffic-enum/solution","tr":["advanced","advanced/enumerations"],"L":{"en":{"t":"Exercise ’Traffic lights‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Define an enum <code>Light<\/code> with the constants <code>red<\/code>, <code>amber<\/code>, and <code>green<\/code> (in that order).<\/span> <span class=\"sg\" data-s=\"1\">Declare a variable typed with the enum, <code>my Light $current<\/code>, and set it to <code>red<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Print the light together with the number behind it, in the form <code>red is 0<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Then <strong>change the light a couple of times<\/strong> — reassign <code>$current<\/code> to <code>amber<\/code>, then to <code>green<\/code>, printing it the same way after each change — so you walk <code>red<\/code> → <code>amber<\/code> → <code>green<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You might expect <code>$current++<\/code> to move to the next light on its own — give it a try and see what happens.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/enumerations/exercises/traffic-enum/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Ampeln","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Definiere ein Enum <code>Light<\/code> mit den Konstanten <code>red<\/code>, <code>amber<\/code> und <code>green<\/code> (in dieser Reihenfolge).<\/span> <span class=\"sg\" data-s=\"1\">Deklariere eine Variable mit dem Enum-Typ, <code>my Light $current<\/code>, und setze sie auf <code>red<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Gib die Ampelfarbe zusammen mit der dahinterliegenden Zahl aus, in der Form <code>red is 0<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dann <strong>wechsle die Ampel ein paar Mal<\/strong> — weise <code>$current<\/code> nacheinander <code>amber<\/code> und dann <code>green<\/code> zu, und gib sie nach jeder Änderung auf die gleiche Weise aus — sodass du den Weg <code>red<\/code> → <code>amber<\/code> → <code>green<\/code> gehst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du könntest erwarten, dass <code>$current++<\/code> von selbst zur nächsten Farbe wechselt — probiere es aus und schau, was passiert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/enumerations/exercises/traffic-enum/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Verkeerslichten","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Definieer een enum <code>Light<\/code> met de constanten <code>red<\/code>, <code>amber<\/code> en <code>green<\/code> (in die volgorde).<\/span> <span class=\"sg\" data-s=\"1\">Declareer een variabele getypeerd met de enum, <code>my Light $current<\/code>, en stel deze in op <code>red<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Print het licht samen met het getal erachter, in de vorm <code>red is 0<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Verander het месте с числом, стоящим за ним, в формате <code>red is 0<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Затем <strong>переключите сигнал несколько раз<\/strong> — переназначьте <code>$current<\/code> на <code>amber<\/code>, затем на <code>green<\/code>, печатая его тем же способом после каждого изменения — чтобы пройти путь <code>red<\/code> -&gt; <code>amber<\/code> -&gt; <code>green<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы могли бы ожидать, что <code>$current++<\/code> переключит на следующий сигнал автоматически — попробуйте и посмотрите, что произойдет.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/enumerations/exercises/traffic-enum/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Світлофор»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Визначте перелічення <code>Light<\/code> із константами <code>red<\/code>, <code>amber<\/code> та <code>green<\/code> (саме в такому порядку).<\/span> <span class=\"sg\" data-s=\"1\">Оголосіть змінну, типізовану цим переліченням, <code>my Light $current<\/code>, і встановіть її в <code>red<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Виведіть сигнал разом із числом, що за ним стоїть, у вигляді <code>red is 0<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Потім <strong>змініть сигнал кілька разів<\/strong> — перепризначте <code>$current<\/code> на <code>amber<\/code>, а тоді на <code>green<\/code>, виводячи його так само після кожної зміни, — щоб пройти <code>red<\/code> → <code>amber<\/code> → <code>green<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви могли б очікувати, що <code>$current++<\/code> сам перейде до наступного сигналу — спробуйте й подивіться, що станеться.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/enumerations/exercises/traffic-enum/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Светофар","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте изброим тип <code>Light<\/code> с константите <code>red<\/code>, <code>amber<\/code> и <code>green<\/code> (в този ред).<\/span> <span class=\"sg\" data-s=\"1\">Декларирайте променлива, типизирана с изброимия тип, <code>my Light $current<\/code>, и я задайте на <code>red<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Отпечатайте светлината заедно с числото зад нея, във формат <code>red is 0<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След това <strong>сменете светлината няколко пъти<\/strong> — преприсвоете <code>$current<\/code> на <code>amber<\/code>, после на <code>green<\/code>, като я отпечатвате по същия начин след всяка промяна — така преминавате <code>red<\/code> → <code>amber<\/code> → <code>green<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Може да очаквате <code>$current++<\/code> да премине към следващата светлина автоматично — опитайте и вижте какво ще стане.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class
