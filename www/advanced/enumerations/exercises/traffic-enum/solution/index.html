<script type="application/json" id="page-data">{"u":"advanced/enumerations/exercises/traffic-enum/solution","n":517,"k":"solution","pv":"advanced/enumerations/exercises/traffic-enum","nx":"advanced/enumerations/exercises/weekday-values","tr":["advanced","advanced/enumerations"],"L":{"en":{"t":"The solution of ’Traffic lights‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> is an ordinary, mutable variable — only constrained to the <code>Light<\/code> type. Assigning the next constant advances the light, and the number follows the name each time: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$current++<\/code> looks like it should step to the next light on its own, but it fails with a type-check error. <code>++<\/code> treats the constant as its plain number and hands back an <code>Int<\/code> (<code>red<\/code> becomes <code>1<\/code>), and an <code>Int<\/code> no longer fits the <code>Light<\/code> type. So you move the light by assignin ente constante avanza la luz, y el número sigue al nombre cada vez: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$current++<\/code> parece que debería avanzar a la siguiente luz por sí solo, pero falla con un error de verificación de tipo. <code>++<\/code> trata la constante como su número simple y devuelve un <code>Int<\/code> (<code>red<\/code> se convierte en <code>1<\/code>), y un <code>Int<\/code> ya no encaja en el tipo <code>Light<\/code>. Así que avanzas la luz asignando la siguiente constante, como se muestra arriba.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La restricción de tipo se aplica a cada asignación, no solo a la primera. <code>$current<\/code> aceptará <code>red<\/code>, <code>amber<\/code> o <code>green<\/code>, pero asignar algo que no sea un <code>Light<\/code> — un número suelto o una cadena — sería un error de verificación de tipo.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Semafori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data n><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> — это обычная изменяемая переменная, ограниченная только типом <code>Light<\/code>. Присваивание следующей константы переключает сигнал, и число следует за именем каждый раз: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$current++<\/code> выглядит так, будто должно переключить на следующий сигнал автоматически, но вызывает ошибку проверки типа. <code>++<\/code> обрабатывает константу как простое число и возвращает <code>Int<\/code> (<code>red<\/code> становится <code>1<\/code>), а <code>Int<\/code> больше не соответствует типу <code>Light<\/code>. Поэтому вы переключаете сигнал, присваивая следующую константу, как показано выше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ограничение типа действует при каждом присваивании, не только при первом. <code>$current<\/code> принимает <code>red<\/code>, <code>amber<\/code> или <code>green<\/code>, но присваивание чего-то, что не является <code>Light<\/code> — простого числа или строки — приведет к ошибке проверки типа.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Світлофор","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\ t.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> est ordinaria variabilis mutabilis — solum typo <code>Light<\/code> constricta. Proximam constantem assignando lucem promovet, et numerus nomen sequitur quaque vice: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$current++<\/code> videtur ad proximam lucem sponte progredi debere, sed errore typi verificandi deficit. <code>++<\/code> constantem ut nudum numerum tractat et <code>Int<\/code> reddit (<code>red<\/code> fit <code>1<\/code>), et <code>Int<\/code> non iam typo <code>Light<\/code> convenit. Itaque lucem mutando proximam constantem assignas, ut supra.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Constrictio typi ad omnem assignationem pertinet, non solum ad primam. <code>$current<\/code> accipiet <code>red<\/code>, <code>amber<\/code>, vel <code>green<\/code>, sed aliquid assignare quod <code>Light<\/code> non est — nudum numerum vel seriem characterum — error typi verificandi esset.<\/span><\/li><\/ol>"]]}}}</script>
