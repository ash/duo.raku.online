<script type="application/json" id="page-data">{"u":"advanced/colon-calls","n":645,"k":"section","pv":"advanced/whatever/quiz","nx":"advanced/colon-calls/exercises","tr":["advanced"],"L":{"en":{"t":"Calling with a colon","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you call a method or a subroutine, you usually put its arguments in parentheses: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku offers a second form — put a <strong>colon<\/strong> after the name, and everything after the colon becomes the argument list, with no parentheses at all:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The colon in <code>grep:<\/code> does the same job as the parentheses would: <code>(1..10).grep: * %% 2<\/code> means exactly <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The two forms are interchangeable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The colon form is most pleasant with methods that take a <strong>block<\/strong> or a <a href=\"/advanced/whatever/\">Whatever<\/a> expression, because it removes a layer of nesting.<\/span> <span class=\"sg\" data-s=\"1\">Compare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses around the block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — no closing paren to match<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Both print <code>(3 2 1)<\/code>, but the colon version reads more cleanly, especially when the block is long.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This is the method-call sibling of the parenthesis-less call you already use with list operators like <code>say 1, 2, 3<\/code> — there, <code>say<\/code> takes everything after it as its arguments.<\/span> <span class=\"sg\" data-s=\"1\">The one rule to remember is that the colon form consumes the <strong>rest of the statement<\/strong> as arguments, so it has to come at the <strong>end<\/strong> of a call chain.<\/span> <span class=\"sg\" data-s=\"2\">That is why <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> works: <code>grep<\/code> is the last call, and there is nothing to chain after it.<\/span> <span class=\"sg\" data-s=\"3\">If you need to keep calling more methods, use the parenthesised form instead or group the parts of the while expression to make it clear:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One thing to watch: do not combine the colon <strong>and<\/strong> parentheses as <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">That spelling clashes with the signature-literal syntax <code>:( … )<\/code> and fails to parse.<\/span> <span class=\"sg\" data-s=\"2\">Use either <code>.grep( … )<\/code> or <code>.grep: …<\/code> — one or the other, not both.<\/span><\/p>"]]},"de":{"t":"Aufruf mit Doppelpunkt","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du eine Methode oder eine Subroutine aufrufst, setzt du ihre Argumente normalerweise in Klammern: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku bietet eine zweite Form an — setze einen <strong>Doppelpunkt<\/strong> nach dem Namen, und alles nach dem Doppelpunkt wird zur Argumentliste, ganz ohne Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Doppelpunkt in <code>grep:<\/code> erfüllt dieselbe Aufgabe wie die Klammern: <code>(1..10).grep: * %% 2<\/code> bedeutet genau dasselbe wie <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beide Formen sind austauschbar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Doppelpunkt-Form ist besonders angenehm bei Methoden, die einen <strong>Block<\/strong> oder einen <a href=\"https://course.raku.org/de/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-Ausdruck entgegennehmen, da sie eine Verschachtelungsebene entfernt.<\/span> <span class=\"sg\" data-s=\"1\">Vergleiche:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # Klammern um den Block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # Doppelpunkt — keine schließende Klammer nötig<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide geben <code>(3 2 1)<\/code> aus, aber die Doppelpunkt-Variante liest sich sauberer, besonders wenn der Block lang ist.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dies ist das Methodenaufruf-Pendant zum klammerlosen Aufruf, den du bereits bei Listenoperatoren wie <code>say 1, 2, 3<\/code> verwendest — dort nimmt <code>say<\/code> alles nach sich als seine Argumente.<\/span> <span class=\"sg\" data-s=\"1\">Die einzige Regel, die man sich merken muss, ist, dass die Doppelpunkt-Form den <strong>Rest der Anweisung<\/strong> als Argumente verbraucht, also muss sie am <strong>Ende<\/strong> einer Aufrufkette stehen.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb funktioniert <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>: <code>grep<\/code> ist der letzte Aufruf, und es gibt nichts mehr, was danach verkettet werden könnte.<\/span> <span class=\"sg\" data-s=\"3\">Wenn du weitere Methoden aufrufen musst, verwende stattdessen die Form mit Klammern oder gruppiere die Teile des gesamten Ausdrucks, um ihn klar zu machen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Sache, auf die man achten muss: Kombiniere den Doppelpunkt <strong>nicht<\/strong> mit Klammern wie <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Diese Schreibweise kollidiert mit der Signatur-Literal-Syntax <code>:( … )<\/code> und lässt sich nicht parsen.<\/span> <span class=\"sg\" data-s=\"2\">Verwende entweder <code>.grep( … )<\/code> oder <code>.grep: …<\/code> — das eine oder das andere, nicht beides.<\/span><\/p>"]]},"nl":{"t":"Aanroepen met een dubbele punt","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een methode of een subroutine aanroept, zet je de argumenten meestal tussen haakjes: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku biedt een tweede vorm — zet een <strong>dubbele punt<\/strong> na de naam, en alles na de dubbele punt wordt de argumentenlijst, helemaal zonder haakjes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De dubbele punt in <code>grep:<\/code> doet hetzelfde als haakjes zouden doen: <code>(1..10).grep: * %% 2<\/code> betekent precies <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De twee vormen zijn onderling verwisselbaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De dubbele-puntvorm is het prettigst bij methoden die een <strong>blok<\/strong> of een <a href=\"https://course.raku.org/nl/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-expressie verwachten, omdat het een laag nesting wegneemt.<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # haakjes om het blok\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dubbele punt — geen sluithaakje nodig<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide printen <code>(3 2 1)<\/code>, maar de versie met de dubbele punt leest overzichtelijker, vooral wanneer het blok lang is.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit is het methode-aanroep equivalent van de aanroep zonder haakjes die je al kent van lijstoperatoren zoals <code>say 1, 2, 3<\/code> — daar neemt <code>say<\/code> alles erna als argumenten.<\/span> <span class=\"sg\" data-s=\"1\">De enige regel om te onthouden is dat de dubbele-puntvorm de <strong>rest van de instructie<\/strong> als argumenten consumeert, dus hij moet aan het <strong>einde<\/strong> van een aanroepketen staan.<\/span> <span class=\"sg\" data-s=\"2\">Daarom werkt <code>('a' .. 'z')&gt;&gt;.uc&gt;&gt;.ord.grep: 60 &lt; * &lt; 70<\/code>: <code>grep<\/code> is de laatste aanroep, en er is niets meer om na te ketenen.<\/span> <span class=\"sg\" data-s=\"3\">Als je meer methoden wilt aanroepen, gebruik dan de vorm met haakjes of groepeer de delen van de hele expressie om het duidelijk te maken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Let op: combineer de dubbele punt <strong>niet<\/strong> met haakjes als <code>.grep:( ... )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die schrijfwijze botst met de handtekening-literaal-syntaxis <code>:( ... )<\/code> en kan niet worden geparseerd.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik ofwel <code>.grep( ... )<\/code> ofwel <code>.grep: ...<\/code> — het een of het ander, niet allebei.<\/span><\/p>"]]},"es":{"t":"Llamadas con dos puntos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando llamas a un método o una subrutina, normalmente pones sus argumentos entre paréntesis: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ofrece una segunda forma: pon <strong>dos puntos<\/strong> después del nombre, y todo lo que sigue se convierte en la lista de argumentos, sin paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los dos puntos en <code>grep:<\/code> hacen el mismo trabajo que los paréntesis: <code>(1..10).grep: * %% 2<\/code> significa exactamente <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Las dos formas son intercambiables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma con dos puntos es más agradable con métodos que reciben un <strong>bloque<\/strong> o una expresión <a href=\"https://course.raku.org/es/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>, porque elimina un nivel de anidamiento.<\/span> <span class=\"sg\" data-s=\"1\">Compara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentesis alrededor del bloque\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dos puntos — sin parentesis de cierre que emparejar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambas imprimen <code>(3 2 1)<\/code>, pero la versión con dos puntos se lee más limpiamente, especialmente cuando el bloque es largo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta es la contraparte en llamadas a métodos de la llamada sin paréntesis que ya usas con operadores de lista como <code>say 1, 2, 3<\/code> — allí, <code>say<\/code> toma todo lo que sigue como sus argumentos.<\/span> <span class=\"sg\" data-s=\"1\">La regla que debes recordar es que la forma con dos puntos consume el <strong>resto de la sentencia<\/strong> como argumentos, así que debe ir al <strong>final<\/strong> de una cadena de llamadas.<\/span> <span class=\"sg\" data-s=\"2\">Por eso <code>('a' .. 'z')&gt;&gt;.uc&gt;&gt;.ord.grep: 60 &lt; * &lt; 70<\/code> funciona: <code>grep<\/code> es la última llamada, y no hay nada más que encadenar después.<\/span> <span class=\"sg\" data-s=\"3\">Si necesitas seguir llamando más métodos, usa la forma con paréntesis o agrupa las partes de la expresión completa para que quede claro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Algo a tener en cuenta: no combines los dos puntos <strong>y<\/strong> paréntesis como <code>.grep:( ... )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esa forma colisiona con la sintaxis de literal de firma <code>:( ... )<\/code> y falla al parsear.<\/span> <span class=\"sg\" data-s=\"2\">Usa o <code>.grep( ... )<\/code> o <code>.grep: ...<\/code> — una u otra, no ambas.<\/span><\/p>"]]},"it":{"t":"Chiamate con i due punti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando chiami un metodo o una subroutine, di solito metti i suoi argomenti tra parentesi: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku offre una seconda forma — metti un <strong>due punti<\/strong> dopo il nome, e tutto ciò che segue i due punti diventa la lista degli argomenti, senza alcuna parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I due punti in <code>grep:<\/code> svolgono lo stesso ruolo delle parentesi: <code>(1..10).grep: * %% 2<\/code> significa esattamente <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Le due forme sono intercambiabili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma con i due punti è particolarmente comoda con i metodi che accettano un <strong>blocco<\/strong> o un'espressione <a href=\"https://course.raku.org/it/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>, perché elimina un livello di annidamento.<\/span> <span class=\"sg\" data-s=\"1\">Confronta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentesi attorno al blocco\nsay @a.sort: { $^b &lt;=&gt; $^a }; # due punti — nessuna parentesi di chiusura da abbinare<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entrambi stampano <code>(3 2 1)<\/code>, ma la versione con i due punti si legge in modo più pulito, specialmente quando il blocco è lungo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo è il corrispettivo per le chiamate ai metodi della chiamata senza parentesi che già usi con gli operatori di lista come <code>say 1, 2, 3<\/code> — lì, <code>say<\/code> prende tutto ciò che segue come suoi argomenti.<\/span> <span class=\"sg\" data-s=\"1\">L'unica regola da ricordare è che la forma con i due punti consuma il <strong>resto dell'istruzione<\/strong> come argomenti, quindi deve trovarsi alla <strong>fine<\/strong> di una catena di chiamate.<\/span> <span class=\"sg\" data-s=\"2\">Ecco perché <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> funziona: <code>grep<\/code> è l'ultima chiamata e non c'è nulla da concatenare dopo di essa.<\/span> <span class=\"sg\" data-s=\"3\">Se hai bisogno di chiamare altri metodi dopo, usa la forma con le parentesi oppure raggruppa le parti dell'intera espressione per renderla chiara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una cosa a cui fare attenzione: non combinare i due punti <strong>e<\/strong> le parentesi come <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa scrittura entra in conflitto con la sintassi dei letterali di firma <code>:( … )<\/code> e non viene analizzata correttamente.<\/span> <span class=\"sg\" data-s=\"2\">Usa <code>.grep( … )<\/code> oppure <code>.grep: …<\/code> — l'una o l'altra, non entrambe.<\/span><\/p>"]]},"lv":{"t":"Izsaukšana ar kolu 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Izsaucot metodi vai apakšprogrammu, tās argumentus parasti liekat iekavās: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku piedāvā otru formu — aiz nosaukuma lieciet <strong>kolu<\/strong>, un viss, kas seko kolam, kļūst par argumentu sarakstu, pavisam bez iekavām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kols <code>grep:<\/code> dara to pašu darbu, ko darītu iekavas: <code>(1..10).grep: * %% 2<\/code> nozīmē tieši <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Abas formas ir savstarpēji aizvietojamas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kola forma ir vispatīkamākā ar metodēm, kas ņem <strong>bloku<\/strong> vai <a href=\"https://course.raku.org/lv/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> izteiksmi, jo tā noņem vienu ligzdošanas slāni.<\/span> <span class=\"sg\" data-s=\"1\">Salīdziniet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses around the block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — no closing paren to match<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abas izdrukā <code>(3 2 1)<\/code>, taču versija ar kolu lasās tīrāk, jo īpaši tad, ja bloks ir garš.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šis ir metožu izsaukumu radinieks tam izsaukumam bez iekavām, ko jau lietojat ar saraksta operatoriem, piemēram, <code>say 1, 2, 3<\/code> — tur <code>say<\/code> ņem visu, kas seko, par saviem argumentiem.<\/span> <span class=\"sg\" data-s=\"1\">Vienīgais likums, kas jāatceras, ir tas, ka kola forma par argumentiem paņem <strong>atlikušo instrukcijas daļu<\/strong>, tāpēc tai jābūt izsaukumu ķēdes <strong>beigās<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tāpēc <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> darbojas: <code>grep<\/code> ir pēdējais izsaukums, un aiz tā nav ko ķēdēt.<\/span> <span class=\"sg\" data-s=\"3\">Ja jāturpina izsaukt vēl metodes, izmantojiet iekavu formu vai sagrupējiet izteiksmes daļas, lai būtu skaidrs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kam jāpaskatās: nekombinējiet kolu <strong>un<\/strong> iekavas kā <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šāds pieraksts saduras ar parakstu literāļu sintaksi <code>:( … )<\/code> un neparsējas.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet vai nu <code>.grep( … )<\/code>, vai <code>.grep: …<\/code> — vienu vai otru, ne abus.<\/span><\/p>"]]},"ru":{"t":"Вызов через двоеточие","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы вызываете метод или подпрограмму, вы обычно указываете аргументы в скобках: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku предлагает вторую форму — поставьте <strong>двоеточие<\/strong> после имени, и всё, что следует за двоеточием, становится списком аргументов, без каких-либо скобок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двоеточие в <code>grep:<\/code> выполняет ту же роль, что и скобки: <code>(1..10).grep: * %% 2<\/code> означает то же самое, что и <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обе формы взаимозаменяемы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Форма с двоеточием особенно удобна при вызове методов, принимающих <strong>блок<\/strong> или выражение <a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>, поскольку она убирает один уровень вложенности.<\/span> <span class=\"sg\" data-s=\"1\">Сравните:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # скобки вокруг блока\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двоеточие -- нет закрывающей скобки<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оба варианта выводят <code>(3 2 1)<\/code>, но версия с двоеточием читается чище, особенно когда блок длинный.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Это аналог вызова без скобок, который вы уже используете со списковыми операторами вроде <code>say 1, 2, 3<\/code> — там <code>say<\/code> принимает всё, что следует за ним, в качестве аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Единственное правило, которое нужно запомнить: форма с двоеточием поглощает <strong>остаток выражения<\/strong> как аргументы, поэтому она должна стоять в <strong>конце<\/strong> цепочки вызовов.<\/span> <span class=\"sg\" data-s=\"2\">Именно поэтому <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> работает: <code>grep<\/code> — последний вызов в цепочке, и после него нечего вызывать.<\/span> <span class=\"sg\" data-s=\"3\">Если вам нужно продолжить цепочку методов, используйте форму со скобками или сгруппируйте части выражения, чтобы сделать его понятным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: не совмещайте двоеточие <strong>и<\/strong> скобки в виде <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Такая запись конфликтует с синтаксисом литерала сигнатуры <code>:( … )<\/code> и не будет разобрана.<\/span> <span class=\"sg\" data-s=\"2\">Используйте либо <code>.grep( … )<\/code>, либо <code>.grep: …<\/code> — что-то одно, но не оба варианта сразу.<\/span><\/p>"]]},"uk":{"t":"Виклик із двокрапкою","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви викликаєте метод чи підпрограму, аргументи зазвичай беруть у дужки: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku пропонує другу форму — поставте після імені <strong>двокрапку<\/strong>, і все, що йде після неї, стає списком аргументів, зовсім без дужок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двокрапка в <code>grep:<\/code> виконує ту саму роботу, що й дужки: <code>(1..10).grep: * %% 2<\/code> означає точно те саме, що <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ці дві форми взаємозамінні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Форма з двокрапкою найприємніша з методами, які приймають <strong>блок<\/strong> або вираз <a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>, бо вона прибирає один рівень вкладеності.<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # дужки навколо блоку\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двокрапка — закривальну дужку шукати не треба<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва варіанти виводять <code>(3 2 1)<\/code>, але версія з двокрапкою читається чистіше, надто коли блок довгий.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Це метод-побратим виклику без дужок, який ви вже використовуєте зі списковими операторами на кшталт <code>say 1, 2, 3<\/code>: там <code>say<\/code> бере все, що йде за ним, як свої аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Єдине правило, яке варто запам'ятати: форма з двокрапкою поглинає <strong>решту оператора<\/strong> як аргументи, тож вона має стояти в <strong>кінці<\/strong> ланцюжка викликів.<\/span> <span class=\"sg\" data-s=\"2\">Саме тому <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> працює: <code>grep<\/code> — останній виклик, і чіплятися далі нема до чого.<\/span> <span class=\"sg\" data-s=\"3\">Якщо потрібно викликати ще методи, скористайтеся формою з дужками або згрупуйте частини виразу, щоб було зрозуміло:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На що варто зважати: не поєднуйте двокрапку <strong>й<\/strong> дужки як <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Такий запис конфліктує із синтаксисом літерала сигнатури <code>:( … )<\/code> і не розбирається.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте або <code>.grep( … )<\/code>, або <code>.grep: …<\/code> — щось одне, але не обидва разом.<\/span><\/p>"]]},"bg":{"t":"Извикване с двоеточие 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато извиквате метод или подпрограма, обикновено поставяте аргументите в скоби: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku предлага и втора форма — поставете <strong>двоеточие<\/strong> след името и всичко след двоеточието става списъкът с аргументи, без никакви скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двоеточието в <code>grep:<\/code> изпълнява същата роля като скобите: <code>(1..10).grep: * %% 2<\/code> означава точно <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Двете форми са взаимозаменяеми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Формата с двоеточие е най-удобна при методи, които приемат <strong>блок<\/strong> или <a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> израз, защото премахва едно ниво на вложеност.<\/span> <span class=\"sg\" data-s=\"1\">Сравнете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # скоби около блока\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двоеточие — няма затваряща скоба за съвпадение<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И двете отпечатват <code>(3 2 1)<\/code>, но версията с двоеточие се чете по-чисто, особено когато блокът е дълъг.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Това е братът на извикването без скоби, което вече използвате с оператори за списъци като <code>say 1, 2, 3<\/code> — там <code>say<\/code> приема всичко след себе си като аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Правилото, което трябва да запомните, е, че формата с двоеточие поглъща <strong>остатъка от израза<\/strong> като аргументи, затова трябва да стои в <strong>края<\/strong> на верига от извиквания.<\/span> <span class=\"sg\" data-s=\"2\">Ето защо <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> работи: <code>grep<\/code> е последното извикване и няма нищо за верижно извикване след него.<\/span> <span class=\"sg\" data-s=\"3\">Ако трябва да извиквате повече методи, използвайте формата със скоби или групирайте частите на целия израз, за да стане ясно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Едно нещо, на което трябва да внимавате: не комбинирайте двоеточие <strong>и<\/strong> скоби като <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този запис влиза в конфликт със синтаксиса за сигнатурен литерал <code>:( … )<\/code> и не се разпознава.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте или <code>.grep( … )<\/code>, или <code>.grep: …<\/code> — едното или другото, но не и двете.<\/span><\/p>"]]},"eo":{"t":"Vokado per dupunkto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi vokas metodon au subfunkcion, vi kutime metas giajn argumentojn en krampojn: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ofertas duan formon -- metu <strong>dupunkton<\/strong> post la nomo, kaj chio post la dupunkto farighas la argumenta listo, tute sen krampoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dupunkto en <code>grep:<\/code> faras la saman laboron kiel la krampoj farus: <code>(1..10).grep: * %% 2<\/code> signifas ekzakte <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La du formoj estas intershanghebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dupunkta formo estas plej agrabla kun metodoj kiuj akceptas <strong>blokon<\/strong> au <a href=\"https://course.raku.org/eo/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-esprimon, char ghi forigas unu tavolon de nestado.<\/span> <span class=\"sg\" data-s=\"1\">Komparu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # krampoj chirkaue de la bloko\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dupunkto — neniu ferma krampo por pari<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambau presas <code>(3 2 1)<\/code>, sed la dupunkta versio legeblas pli klare, precipe kiam la bloko estas longa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Chi tio estas la metod-voka parenceco de la senkrampa voko kiun vi jam uzas kun listaj operatoroj kiel <code>say 1, 2, 3<\/code> -- tie, <code>say<\/code> prenas chion post ghi kiel siajn argumentojn.<\/span> <span class=\"sg\" data-s=\"1\">La sola regulo por memori estas ke la dupunkta formo konsumas la <strong>reston de la deklaro<\/strong> kiel argumentojn, do ghi devas esti che la <strong>fino<\/strong> de voka cheno.<\/span> <span class=\"sg\" data-s=\"2\">Tial <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> funkcias: <code>grep<\/code> estas la lasta voko, kaj estas nenio por cheni post ghi.<\/span> <span class=\"sg\" data-s=\"3\">Se vi bezonas daure voki pliajn metodojn, uzu la krampan formon anstatau au grupigu la partojn de la tuta esprimo por klarigi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu afero por atenti: ne kombinu la dupunkton <strong>kaj<\/strong> krampojn kiel <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiu skribmaniero kolizias kun la signatur-litera sintakso <code>:( … )<\/code> kaj ne sukcesas parsighi.<\/span> <span class=\"sg\" data-s=\"2\">Uzu au <code>.grep( … )<\/code> au <code>.grep: …<\/code> -- unu au la alia, ne ambau.<\/span><\/p>"]]},"la":{"t":"Vocatio cum duplo puncto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum methodum vel subroutinam vocas, argumenta eius plerumque in parenthesibus ponis: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku alteram formam praebet — pone <strong>colonum<\/strong> post nomen, et omnia post colonum fiunt index argumentorum, sine ullis parenthesibus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Colon in <code>grep:<\/code> idem munus praestat ac parentheses: <code>(1..10).grep: * %% 2<\/code> idem prorsus significat ac <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Duae formae inter se commutari possunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Forma cum colono maxime iucunda est cum methodis quae <strong>codicem clausum<\/strong> vel expressionem <a href=\"/advanced/whatever/\">Whatever<\/a> accipiunt, quia stratum nidificationis removet.<\/span> <span class=\"sg\" data-s=\"1\">Compara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses circa codicem clausum\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — nulla parenthesis claudenda<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Utrumque <code>(3 2 1)<\/code> imprimit, sed versio cum colono clarius legitur, praesertim cum codex clausus longus est.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec est soror vocationis methodicae vocationis sine parenthesibus quam iam cum operatoribus indicis ut <code>say 1, 2, 3<\/code> adhibes — ibi <code>say<\/code> omnia post se ut argumenta sua accipit.<\/span> <span class=\"sg\" data-s=\"1\">Una regula memoranda est formam cum colono <strong>reliquum enuntiati<\/strong> ut argumenta consumere, itaque in <strong>fine<\/strong> catenae vocationum esse debet.<\/span> <span class=\"sg\" data-s=\"2\">Quam ob rem <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> recte operatur: <code>grep<\/code> ultima vocatio est, et nihil post eam catenadum est.<\/span> <span class=\"sg\" data-s=\"3\">Si plures methodos vocare opus est, forma cum parenthesibus utere vel partes totius expressionis compone ut perspicuae sint:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unum cavendum: ne colonum <strong>et<\/strong> parentheses simul coniungas ut <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Haec scriptura cum syntaxi signaturae literalis <code>:( … )<\/code> conflicit et recte resolvi non potest.<\/span> <span class=\"sg\" data-s=\"2\">Utere vel <code>.grep( … )<\/code> vel <code>.grep: …<\/code> — alterum, non utrumque.<\/span><\/p>"]]}}}</script>
