<script type="application/json" id="page-data">{"u":"advanced/colon-calls/exercises/colon-map/solution","n":648,"k":"solution","pv":"advanced/colon-calls/exercises/colon-map","nx":"advanced/colon-calls/exercises/colon-join","tr":["advanced","advanced/colon-calls"],"L":{"en":{"t":"The solution of ’A colon map‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Only <code>grep<\/code>, the last call in the chain, can use the colon form. The colon makes <code>* &gt; 10<\/code> its argument, exactly as <code>grep(* &gt; 10)<\/code> would. As we still need to print the results, <code>say<\/code> is now used as a function, not as a method.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>map<\/code> call must keep its parentheses. If you wrote <code>.map: * * 2<\/code> instead, the colon would swallow <code>.grep(* &gt; 10)<\/code> as part of <code>map<\/code>’s arguments, and the chain would break.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Doppelpunkt-map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode findest du in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nur <code>grep<\/code>, der letzte Aufruf in der Kette, kann die Doppelpunkt-Form verwenden. Der Doppelpunkt macht <code>* &gt; 10<\/code> zu seinem Argument, genau wie es <code>grep(* &gt; 10)<\/code> tun würde. Da wir die Ergebnisse trotzdem ausgeben müssen, wird <code>say<\/code> nun als Funktion verwendet, nicht als Methode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>map<\/code>-Aufruf muss seine Klammern behalten. Würde man stattdessen <code>.map: * * 2<\/code> schreiben, würde der Doppelpunkt <code>.grep(* &gt; 10)<\/code> als Teil der Argumente von <code>map<\/code> verschlucken, und die Kette würde brechen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een dubbele-punt-map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 De broncode is te vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Alleen <code>grep<\/code>, de laatste aanroep in de keten, kan de dubbele-puntvorm gebruiken. De dubbele punt maakt <code>* &gt; 10<\/code> het argument, precies zoals <code>grep(* &gt; 10)<\/code> zou doen. Omdat we het resultaat nog moeten afdrukken, wordt <code>say<\/code> nu als functie gebruikt, niet als methode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>map<\/code>-aanroep moet zijn haakjes behouden. Als je <code>.map: * * 2<\/code> zou schrijven, zou de dubbele punt <code>.grep(* &gt; 10)<\/code> opslikken als onderdeel van de argumenten van <code>map<\/code>, en de keten zou breken.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un map con dos puntos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Solo <code>grep<\/code>, la última llamada en la cadena, puede usar la forma con dos puntos. Los dos puntos hacen que <code>* &gt; 10<\/code> sea su argumento, exactamente como lo haría <code>grep(* &gt; 10)<\/code>. Como aun necesitamos imprimir los resultados, <code>say<\/code> se usa ahora como función, no como método.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La llamada a <code>map<\/code> debe conservar sus paréntesis. Si escribieras <code>.map: * * 2<\/code> en su lugar, los dos puntos se tragarían <code>.grep(* &gt; 10)<\/code> como parte de los argumentos de <code>map<\/code>, y la cadena se rompería.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un map con due punti","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione al compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Solo <code>grep<\/code>, l'ultima chiamata nella catena, può usare la forma con i due punti. I due punti rendono <code>* &gt; 10<\/code> il suo argomento, esattamente come farebbe <code>grep(* &gt; 10)<\/code>. Poiché abbiamo ancora bisogno di stampare i risultati, <code>say<\/code> viene ora usato come funzione, non come metodo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La chiamata a <code>map<\/code> deve mantenere le sue parentesi. Se scrivessi <code>.map: * * 2<\/code>, i due punti ingloberebbero <code>.grep(* &gt; 10)<\/code> come parte degli argomenti di <code>map<\/code>, e la catena si spezzerebbe.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Map ar kolu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kola formu var izmantot tikai <code>grep<\/code>, ķēdes pēdējais izsaukums. Kols padara <code>* &gt; 10<\/code> par tā argumentu, tieši tāpat kā to darītu <code>grep(* &gt; 10)<\/code>. Tā kā rezultāti tomēr jāizdrukā, <code>say<\/code> tagad tiek lietots kā funkcija, nevis kā metode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izsaukumam <code>map<\/code> jāpatur savas iekavas. Ja tā vietā rakstītu <code>.map: * * 2<\/code>, kols aprītu <code>.grep(* &gt; 10)<\/code> kā daļu no <code>map<\/code> argumentiem, un ķēde sabruktu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: map через двоеточие","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Только <code>grep<\/code>, последний вызов в цепочке, может использовать форму с двоеточием. Двоеточие делает <code>* &gt; 10<\/code> его аргументом, точно так же, как <code>grep(* &gt; 10)<\/code>. Поскольку нам по-прежнему нужно вывести результат, <code>say<\/code> теперь используется как функция, а не как метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вызов <code>map<\/code> должен сохранить скобки. Если написать <code>.map: * * 2<\/code>, двоеточие поглотит <code>.grep(* &gt; 10)<\/code> как часть аргументов <code>map<\/code>, и цепочка сломается.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Map із двокрапкою","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Лише <code>grep<\/code>, останній виклик у ланцюжку, може використати форму з двокрапкою. Двокрапка робить <code>* &gt; 10<\/code> його аргументом — точно так само, як це зробили б дужки <code>grep(* &gt; 10)<\/code>. Оскільки результати все одно треба вивести, <code>say<\/code> тепер використовується як функція, а не як метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Виклик <code>map<\/code> мусить зберегти свої дужки. Якби ви написали <code>.map: * * 2<\/code>, двокрапка проковтнула б <code>.grep(* &gt; 10)<\/code> як частину аргументів <code>map<\/code>, і ланцюжок зламався б.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Map с двоеточие","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Само <code>grep<\/code>, последното извикване във веригата, може да използва формата с двоеточие. Двоеточието прави <code>* &gt; 10<\/code> негов аргумент, точно както би направил <code>grep(* &gt; 10)<\/code>. Тъй като все пак трябва да отпечатаме резултатите, <code>say<\/code> сега се използва като функция, а не като метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Извикването на <code>map<\/code> трябва да запази скобите си. Ако напишете <code>.map: * * 2<\/code> вместо това, двоеточието ще погълне <code>.grep(* &gt; 10)<\/code> като част от аргументите на <code>map<\/code> и веригата ще се счупи.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Dupunkta map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nur <code>grep<\/code>, la lasta voko en la cheno, povas uzi la dupunktan formon. La dupunkto faras <code>* &gt; 10<\/code> ghia argumento, ekzakte kiel <code>grep(* &gt; 10)<\/code> farus. Char ni ankorau bezonas presi la rezultojn, <code>say<\/code> estas nun uzata kiel funkcio, ne kiel metodo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>map<\/code>-voko devas konservi siajn krampojn. Se vi skribus <code>.map: * * 2<\/code> anstatau, la dupunkto englutus <code>.grep(* &gt; 10)<\/code> kiel parton de la argumentoj de <code>map<\/code>, kaj la cheno rompighus.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Map cum duplo puncto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Solum <code>grep<\/code>, ultima vocatio in catena, forma cum colono uti potest. Colon <code>* &gt; 10<\/code> eius argumentum facit, exacte ut <code>grep(* &gt; 10)<\/code> faceret. Cum adhuc exitus imprimendus sit, <code>say<\/code> nunc ut functio adhibetur, non ut methodus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vocatio <code>map<\/code> parentheses suas retinere debet. Si <code>.map: * * 2<\/code> scripsisses, colon <code>.grep(* &gt; 10)<\/code> ut partem argumentorum <code>map<\/code> absorbuisset, et catena fracta esset.<\/span><\/li><\/ol>"]]}}}</script>
