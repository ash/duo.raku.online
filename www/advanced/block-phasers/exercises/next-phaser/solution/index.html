<script type="application/json" id="page-data">{"u":"advanced/block-phasers/exercises/next-phaser/solution","n":593,"k":"solution","pv":"advanced/block-phasers/exercises/next-phaser","nx":"advanced/block-phasers/quiz","tr":["advanced","advanced/block-phasers"],"L":{"en":{"t":"The solution of ’After each step‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\n\nfor 1..3 {\n    NEXT say \"sum so far: $sum\";\n    $sum += $_;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/next-phaser.raku\" target=\"_blank\" rel=\"noopener\">next-phaser.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>sum so far: 1\nsum so far: 3\nsum so far: 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>NEXT<\/code> phaser is written first, but it runs at the <em>end<\/em> of each iteration — after the body has added the current number to <code>$sum<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">So after the first pass <code>$sum<\/code> is <code>1<\/code>, after the second it is <code>3<\/code>, and after the third it is <code>6<\/code>. <code>NEXT<\/code> is the loop counterpart of running something between iterations, distinct from <code>FIRST<\/code> (once at the start) and <code>LAST<\/code> (once at the end).<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Nach jedem Schritt","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\">
