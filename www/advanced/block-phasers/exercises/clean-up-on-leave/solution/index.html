<script type="application/json" id="page-data">{"u":"advanced/block-phasers/exercises/clean-up-on-leave/solution","n":589,"k":"solution","pv":"advanced/block-phasers/exercises/clean-up-on-leave","nx":"advanced/block-phasers/exercises/enter-a-block","tr":["advanced","advanced/block-phasers"],"L":{"en":{"t":"The solution of ’Clean up on leave‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">After <code>Working<\/code> is printed, the <code>return<\/code> exits the subroutine immediately, so <code>never reached<\/code> is never printed.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Even though the body was left early, the <code>LEAVE<\/code> phaser still fires on the way out, printing <code>Cleanup<\/code>. This guarantee is exactly why <code>LEAVE<\/code> is the right place to release resources — it runs no matter how the block ends.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Beim Verlassen aufräumen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nachdem <code>Working<\/code> ausgegeben wurde, verlässt <code>return<\/code> die Subroutine sofort, sodass <code>never reached<\/code> nie ausgegeben wird.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Obwohl der Rumpf vorzeitig verlassen wurde, wird der <code>LEAVE<\/code>-Phaser beim Verlassen trotzdem ausgelöst und gibt <code>Cleanup<\/code> aus. Diese Garantie ist genau der Grund, warum <code>LEAVE<\/code> der richtige Ort ist, um Ressourcen freizugeben — er wird ausgeführt, egal wie der Block endet.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Opruimen bij verlaten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nadat <code>Working<\/code> is afgedrukt, verlaat de <code>return<\/code> de subroutine onmiddellijk, dus <code>never reached<\/code> wordt nooit afgedrukt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hoewel de body vroegtijdig verlaten werd, wordt de <code>LEAVE<\/code>-phaser toch uitgevoerd bij het verlaten, en drukt <code>Cleanup<\/code> af. Deze garantie is precies waarom <code>LEAVE<\/code> de juiste plek is om resources vrij te geven — het wordt uitgevoerd ongeacht hoe het blok eindigt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Limpiar al salir","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Después de que se imprime <code>Working<\/code>, el <code>return<\/code> sale de la subrutina inmediatamente, por lo que <code>never reached<\/code> nunca se imprime.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aunque se salió del cuerpo antes de tiempo, el phaser <code>LEAVE<\/code> aún se dispara al salir, imprimiendo <code>Cleanup<\/code>. Esta garantía es exactamente la razón por la que <code>LEAVE<\/c дпрограмму, поэтому <code>never reached<\/code> никогда не печатается.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Несмотря на досрочный выход из тела, фазер <code>LEAVE<\/code> всё равно срабатывает при выходе и печатает <code>Cleanup<\/code>. Именно эта гарантия делает <code>LEAVE<\/code> подходящим местом для освобождения ресурсов — он выполняется независимо от того, как завершился блок.<\/span><\/li><\/ol>"]]},"uk":{"t":"Solution: Прибирання при виході","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось можливий розв'язок завдання.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Після того як <code>Working<\/code> надруковано, <code>return<\/code> негайно виходить з підпрограми, тому <code>never reached<\/code> ніколи не друкується.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Незважаючи на те, що тіло було залишено достроково, фазер <code>LEAVE<\/code> все одно спрацьовує при виході, друкуючи <code>Cleanup<\/code>. Саме ця гарантія робить <code>LEAVE<\/code> правильним місцем для звільнення ресурсів — він запускається незалежно від того, як завершується блок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Почистване при напускане","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След като <code>Working<\/code> бъде отпечатано, <code>return<\/code> излиза от подпрограмата веднага, така че <code>never reached<\/code> никога не се отпечатва.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Въпреки че тялото е напуснато преждевременно, фазерът <code>LEAVE<\/code> все пак се задейства при излизане и отпечатва <code>Cleanup<\/code>. Тази гаранция е точно причината <code>LEAVE<\/code> да е правилното място за освобождаване на ресурси — той се изпълнява независимо как завършва блокът.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Purigi ĉe foriro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub work {\n    LEAVE say 'Cleanup';\n\n    say 'Working';\n    return;\n    say 'never reached';\n}\n\nwork();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/block-phasers/clean-up-on-leave.raku\" target=\"_blank\" rel=\"noopener\">clean-up-on-leave.raku<\/a>.<\/spa
