<script type="application/json" id="page-data">{"u":"advanced/block-phasers/exercises/clean-up-on-leave","n":588,"k":"exercise","pv":"advanced/block-phasers/exercises","nx":"advanced/block-phasers/exercises/clean-up-on-leave/solution","tr":["advanced","advanced/block-phasers"],"L":{"en":{"t":"Exercise ’Clean up on leave‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The real strength of <code>LEAVE<\/code> is that it runs <em>however<\/em> the block is left — including an early <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Write a subroutine <code>work<\/code> whose body starts with a <code>LEAVE<\/code> phaser printing <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then, still inside the subroutine, print <code>Working<\/code>, <code>return<\/code> immediately, and put a <code>say 'never reached'<\/code> line after the <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Call the subroutine.<\/span> <span class=\"sg\" data-s=\"3\">The early <code>return<\/code> skips that last line, but <code>Cleanup<\/code> is still printed.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Beim Verlassen aufräumen","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die wahre Stärke von <code>LEAVE<\/code> liegt darin, dass er ausgeführt wird, <em>egal wie<\/em> der Block verlassen wird — auch bei einem vorzeitigen <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Schreibe eine Subroutine <code>work<\/code>, deren Rumpf mit einem <code>LEAVE<\/code>-Phaser beginnt, der <code>Cleanup<\/code> ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">Gib dann, noch innerhalb der Subroutine, <code>Working<\/code> aus, führe sofort ein <code>return<\/code> aus und setze eine <code>say 'never reached'<\/code>-Zeile nach dem <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Rufe die Subroutine auf.<\/span> <span class=\"sg\" data-s=\"3\">Das vorzeitige <code>return<\/code> überspringt die letzte Zeile, aber <code>Cleanup<\/code> wird trotzdem ausgegeben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Opruimen bij verlaten","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De echte kracht van <code>LEAVE<\/code> is dat het wordt uitgevoerd <em>hoe<\/em> het blok ook verlaten wordt — inclusief een vroegtijdige <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Schrijf een subroutine <code>work<\/code> waarvan de body begint met een <code>LEAVE<\/code>-phaser die <code>Cleanup<\/code> afdrukt.<\/span> <span class=\"sg\" data-s=\"1\">Druk vervolgens, nog steeds binnen de subroutine, <code>Working<\/code> af, gebruik <code>return<\/code> om onmiddellijk terug te keren, en zet een <code>say 'never reached'<\/code>-regel na de <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Roep de subroutine aan.<\/span> <span class=\"sg\" data-s=\"3\">De vroegtijdige <code>return<\/code> slaat die laatste regel over, maar <code>Cleanup<\/code> wordt nog steeds afgedrukt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Limpiar al salir","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La verdadera fortaleza de <code>LEAVE<\/code> es que se ejecuta <em>sin importar cómo<\/em> se salga del bloque, incluyendo un <code>return<\/code> anticipado.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Escribe una subrutina <code>work<\/code> cuyo cuerpo comience con un phaser <code>LEAVE<\/code> que imprima <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Luego, aún dentro de la subrutina, imprime <code>Working<\/code>, haz un <code>return<\/code> inmediato, y coloca una línea <code>say 'never reached'<\/code> después del <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Llama a la subrutina.<\/span> <span class=\"sg\" data-s=\"3\">El <code>return<\/code> anticipado omite esa última línea, pero <code>Cleanup<\/code> se sigue imprimiendo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Pulizia all'uscita","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La vera forza di <code>LEAVE<\/code> è che viene eseguito <em>in qualunque modo<\/em> si esca dal blocco, incluso un <code>return<\/code> anticipato.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Scrivi una subroutine <code>work<\/code> il cui corpo inizi con un phaser <code>LEAVE<\/code> che stampa <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poi, sempre all'interno della subroutine, stampa <code>Working<\/code>, esegui immediatamente un <code>return<\/code> e inserisci una riga <code>say 'never reached'<\/code> dopo il <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Chiama la subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Il <code>return<\/code> anticipato salta l'ultima riga, ma <code>Cleanup<\/code> viene comunque stampato.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Sakopt atstājot","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> īstais spēks ir tajā, ka tas izpildās <em>lai kā<\/em> bloks tiktu atstāts — arī tad, ja tas notiek ar priekšlaicīgu <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet apakšprogrammu <code>work<\/code>, kuras ķermenis sākas ar fāzeri <code>LEAVE<\/code>, kas izdrukā <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam, vēl apakšprogrammas iekšienē, izdrukājiet <code>Working<\/code>, uzreiz izpildiet <code>return<\/code> un aiz <code>return<\/code> ielieciet rindu <code>say 'never reached'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Izsauciet apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"3\">Priekšlaicīgais <code>return<\/code> šo pēdējo rindu izlaiž, taču <code>Cleanup<\/code> tomēr tiek izdrukāts.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Очистка при выходе","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Главная сила <code>LEAVE<\/code> в том, что он выполняется <em>независимо от того, как<\/em> произошёл выход из блока — включая досрочный <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишите подпрограмму <code>work<\/code>, тело которой начинается с фазера <code>LEAVE<\/code>, печатающего <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затем, всё ещё внутри подпрограммы, напечатайте <code>Working<\/code>, выполните <code>return<\/code> и после него поставьте строку <code>say 'never reached'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вызовите подпрограмму.<\/span> <span class=\"sg\" data-s=\"3\">Досрочный <code>return<\/code> пропускает последнюю строку, но <code>Cleanup<\/code> всё равно печатается.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Прибирання при виході","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Справжня сила <code>LEAVE<\/code> полягає в тому, що він запускається <em>незалежно від того<\/em>, як було залишено блок — включаючи дострокове <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишіть підпрограму <code>work<\/code>, тіло якої починається з фазера <code>LEAVE<\/code>, що друкує <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім, все ще всередині підпрограми, надрукуйте <code>Working<\/code>, негайно виконайте <code>return<\/code> і поставте рядок <code>say 'never reached'<\/code> після <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Викличте підпрограму.<\/span> <span class=\"sg\" data-s=\"3\">Дострокове <code>return<\/code> пропускає останній рядок, але <code>Cleanup<\/code> все одно друкується.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Розв'язок<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Дивіться розв'язок<\/a><\/span><\/p>"]]},"bg":{"t":"Почистване при напускане","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Истинската сила на <code>LEAVE<\/code> е, че се изпълнява <em>независимо как<\/em> е напуснат блокът — включително при ранен <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>work<\/code>, чието тяло започва с фазер <code>LEAVE<\/code>, който отпечатва <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това, все още вътре в подпрограмата, отпечатайте <code>Working<\/code>, извикайте <code>return<\/code> веднага и поставете ред <code>say 'never reached'<\/code> след <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Извикайте подпрограмата.<\/span> <span class=\"sg\" data-s=\"3\">Ранният <code>return<\/code> прескача последния ред, но <code>Cleanup<\/code> все пак се отпечатва.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Purigi ĉe foriro","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La vera forto de <code>LEAVE<\/code> estas, ke ĝi ruliĝas <em>kiel ajn<\/em> la bloko estas forlasita — inkluzive de frua <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Skribu subrutinon <code>work<\/code>, kies korpo komenciĝas per fazilo <code>LEAVE<\/code>, kiu presas <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste, ankoraŭ ene de la subrutino, presu <code>Working<\/code>, tuj revenu per <code>return<\/code>, kaj metu linion <code>say 'never reached'<\/code> post la <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Voku la subrutinon.<\/span> <span class=\"sg\" data-s=\"3\">La frua <code>return<\/code> preterpasas tiun lastan linion, sed <code>Cleanup<\/code> tamen estas presata.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Mundare in exitu","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vera vis <code>LEAVE<\/code> est quod currit <em>quocumque modo<\/em> copia relinquitur — includens maturum <code>return<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Scribe subroutinam <code>work<\/code> cuius corpus incipit cum phasere <code>LEAVE<\/code> imprimante <code>Cleanup<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deinde, adhuc intra subroutinam, imprime <code>Working<\/code>, statim <code>return<\/code> fac, et pone lineam <code>say 'never reached'<\/code> post <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Voca subroutinam.<\/span> <span class=\"sg\" data-s=\"3\">Maturus <code>return<\/code> ultimam lineam praeterit, sed <code>Cleanup<\/code> adhuc imprimitur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Working\nCleanup<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/clean-up-on-leave/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
