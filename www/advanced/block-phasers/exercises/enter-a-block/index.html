<script type="application/json" id="page-data">{"u":"advanced/block-phasers/exercises/enter-a-block","n":590,"k":"exercise","pv":"advanced/block-phasers/exercises/clean-up-on-leave/solution","nx":"advanced/block-phasers/exercises/enter-a-block/solution","tr":["advanced","advanced/block-phasers"],"L":{"en":{"t":"Exercise ’Enter a block‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unlike <code>FIRST<\/code>, which runs only once, an <code>ENTER<\/code> phaser fires <em>every time<\/em> the block is entered — and a loop body is entered afresh on each iteration.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Loop over <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Inside the loop, put an <code>ENTER<\/code> phaser that prints <code>--entering<\/code>, and an ordinary statement that prints <code>body<\/code> with the current number.<\/span> <span class=\"sg\" data-s=\"2\">Observe that <code>--entering<\/code> appears once per iteration.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Einen Block betreten","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Im Gegensatz zu <code>FIRST<\/code>, der nur einmal ausgeführt wird, wird ein <code>ENTER<\/code>-Phaser <em>jedes Mal<\/em> ausgelöst, wenn der Block betreten wird — und ein Schleifenrumpf wird bei jeder Iteration neu betreten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iteriere über <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Setze innerhalb der Schleife einen <code>ENTER<\/code>-Phaser, der <code>--entering<\/code> ausgibt, und eine gewöhnliche Anweisung, die <code>body<\/code> mit der aktuellen Zahl ausgibt.<\/span> <span class=\"sg\" data-s=\"2\">Beobachte, dass <code>--entering<\/code> einmal pro Iteration erscheint.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Een blok betreden","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In tegenstelling tot <code>FIRST<\/code>, dat slechts eenmaal wordt uitgevoerd, wordt een <code>ENTER<\/code>-phaser <em>elke keer<\/em> uitgevoerd wanneer het blok wordt betreden — en een lusblok wordt bij elke iteratie opnieuw betreden.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Doorloop <code>1..2<\/code> met een lus.<\/span> <span class=\"sg\" data-s=\"1\">Plaats binnen de lus een <code>ENTER<\/code>-phaser die <code>--entering<\/code> afdrukt, en een gewone instructie die <code>body<\/code> met het huidige nummer afdrukt.<\/span> <span class=\"sg\" data-s=\"2\">Merk op dat <code>--entering<\/code> eenmaal per iteratie verschijnt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Entrar en un bloque","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A diferencia de <code>FIRST<\/code>, que se ejecuta solo una vez, un phaser <code>ENTER<\/code> se dispara <em>cada vez<\/em> que se entra al bloque, y el cuerpo de un bucle se entra de nuevo en cada iteración.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Recorre <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dentro del bucle, coloca un phaser <code>ENTER<\/code> que imprima <code>--entering<\/code>, y una sentencia ordinaria que imprima <code>body<\/code> con el número actual.<\/span> <span class=\"sg\" data-s=\"2\">Observa que <code>--entering<\/code> aparece una vez por iteración.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Entrare in un blocco","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A differenza di <code>FIRST<\/code>, che viene eseguito una sola volta, un phaser <code>ENTER<\/code> viene attivato <em>ogni volta<\/em> che si entra nel blocco, e il corpo di un ciclo viene rieseguito ad ogni iterazione.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Itera su <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">All'interno del ciclo, inserisci un phaser <code>ENTER<\/code> che stampa <code>--entering<\/code> e un'istruzione ordinaria che stampa <code>body<\/code> con il numero corrente.<\/span> <span class=\"sg\" data-s=\"2\">Osserva che <code>--entering<\/code> appare una volta per iterazione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Ieiet blokā","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atšķirībā no <code>FIRST<\/code>, kas izpildās tikai vienreiz, fāzeris <code>ENTER<\/code> nostrādā <em>katru reizi<\/em>, kad blokā ieiet, un cikla ķermenī ieiet no jauna katrā iterācijā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Palaidiet ciklu pāri <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cikla iekšienē ielieciet fāzeri <code>ENTER<\/code>, kas izdrukā <code>--entering<\/code>, un parastu teikumu, kas izdrukā <code>body<\/code> ar pašreizējo skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Ievērojiet, ka <code>--entering<\/code> parādās pa vienai reizei katrā iterācijā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Вход в блок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В отличие от <code>FIRST<\/code>, который выполняется только один раз, фазер <code>ENTER<\/code> срабатывает <em>каждый раз<\/em>, когда происходит вход в блок, а тело цикла входится заново на каждой итерации.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Выполните цикл по <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Внутри цикла поместите фазер <code>ENTER<\/code>, который печатает <code>--entering<\/code>, и обычное выражение, которое печатает <code>body<\/code> с текущим числом.<\/span> <span class=\"sg\" data-s=\"2\">Убедитесь, что <code>--entering<\/code> появляется на каждой итерации.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вхід у блок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На відміну від <code>FIRST<\/code>, який запускається лише один раз, фазер <code>ENTER<\/code> спрацьовує <em>щоразу<\/em>, коли входять у блок — а тіло циклу входиться заново на кожній ітерації.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Виконайте цикл по <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всередині циклу поставте фазер <code>ENTER<\/code>, що друкує <code>--entering<\/code>, та звичайний оператор, що друкує <code>body<\/code> з поточним числом.<\/span> <span class=\"sg\" data-s=\"2\">Зверніть увагу, що <code>--entering<\/code> з'являється один раз на кожну ітерацію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Розв'язок<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Дивіться розв'язок<\/a><\/span><\/p>"]]},"bg":{"t":"Влизане в блок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За разлика от <code>FIRST<\/code>, който се изпълнява само веднъж, фазерът <code>ENTER<\/code> се задейства <em>всеки път<\/em>, когато блокът бъде влязан — а тялото на цикъла се влиза наново при всяка итерация.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Преминете с цикъл през <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в цикъла поставете фазер <code>ENTER<\/code>, който отпечатва <code>--entering<\/code>, и обикновен оператор, който отпечатва <code>body<\/code> с текущото число.<\/span> <span class=\"sg\" data-s=\"2\">Забележете, че <code>--entering<\/code> се появява веднъж на итерация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Eniri blokon","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Male al <code>FIRST<\/code>, kiu ruliĝas nur unufoje, fazilo <code>ENTER<\/code> ekfunkcias <em>ĉiufoje<\/em> kiam la bloko estas enirata — kaj bukla korpo estas enirata denove ĉe ĉiu iteracio.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Buklu tra <code>1..2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ene de la buklo, metu fazilon <code>ENTER<\/code>, kiu presas <code>--entering<\/code>, kaj ordinaran deklaron, kiu presas <code>body<\/code> kun la aktuala numero.<\/span> <span class=\"sg\" data-s=\"2\">Observu, ke <code>--entering<\/code> aperas unufoje per iteracio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Blocum intrare","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dissimilis <code>FIRST<\/code>, qui semel tantum currit, phaser <code>ENTER<\/code> accenditur <em>quotiens<\/em> copia intratur — et corpus ansae de novo intratur in quaque iteratione.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per <code>1..2<\/code> itera.<\/span> <span class=\"sg\" data-s=\"1\">Intra ansam, pone phaserem <code>ENTER<\/code> qui imprimit <code>--entering<\/code>, et ordinariam sententiam quae imprimit <code>body<\/code> cum numero currente.<\/span> <span class=\"sg\" data-s=\"2\">Observa quod <code>--entering<\/code> semel per iterationem apparet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>--entering\nbody 1\n--entering\nbody 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/block-phasers/exercises/enter-a-block/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
