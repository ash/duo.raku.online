<script type="application/json" id="page-data">{"u":"advanced/block-phasers","n":586,"k":"section","pv":"advanced/phasers/quiz","nx":"advanced/block-phasers/exercises","tr":["advanced"],"L":{"en":{"t":"Block-related phasers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Besides the program-wide phasers, Raku has phasers tied to the life of a single block or loop.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entering and leaving a block<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>ENTER<\/code> phaser runs each time execution enters a block, and the <code>LEAVE<\/code> phaser runs each time it leaves — whichever line they are written on:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The output shows that <code>ENTER<\/code> runs first and <code>LEAVE<\/code> runs last, around the body of the block:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> is especially useful because it runs even if the block is left early, which makes it a reliable place to release a resource.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A phaser can take a full <code>{ }<\/code> block instead of a single statement, and you may set up several of them.<\/span> <span class=\"sg\" data-s=\"1\">When a block has more than one <code>LEAVE<\/code>, they fire in reverse order — the last one registered runs first, so the block unwinds like a stack:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Resource <code>A<\/code> is opened first and closed last:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This last-in, first-out ordering is exactly what you want for cleanup: whatever was set up most recently is torn down first.<\/span> <span class=\"sg\" data-s=\"1\">The program-wide <code>END<\/code> phaser behaves the same way — several <code>END<\/code> blocks also run in reverse of the order they were written.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Loop phasers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Inside loops, three more phasers mark the stages of the iteration: <code>FIRST<\/code> runs once before the first iteration, <code>LAST<\/code> runs once after the last, and <code>NEXT<\/code> runs at the end of each iteration:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The loop produces:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">As with the other phasers, the position of <code>FIRST<\/code>, <code>NEXT<\/code>, and <code>LAST<\/code> in the source does not matter — each runs at its own moment.<\/span><\/p>"]]},"de":{"t":"Block-bezogene Phasers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Neben den programmweiten Phasern hat Raku auch Phaser, die an den Lebenszyklus eines einzelnen Blocks oder einer Schleife gebunden sind.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Einen Block betreten und verlassen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der <code>ENTER<\/code>-Phaser wird jedes Mal ausgeführt, wenn die Ausführung einen Block betritt, und der <code>LEAVE<\/code>-Phaser wird jedes Mal ausgeführt, wenn sie ihn verlässt — egal in welcher Zeile sie geschrieben stehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe zeigt, dass <code>ENTER<\/code> zuerst und <code>LEAVE<\/code> zuletzt ausgeführt wird, jeweils um den Rumpf des Blocks herum:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> ist besonders nützlich, weil er auch dann ausgeführt wird, wenn der Block vorzeitig verlassen wird, was ihn zu einem zuverlässigen Ort macht, um eine Ressource freizugeben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Phaser kann einen vollständigen <code>{ }<\/code>-Block anstelle einer einzelnen Anweisung enthalten, und du kannst mehrere davon einrichten.<\/span> <span class=\"sg\" data-s=\"1\">Wenn ein Block mehr als einen <code>LEAVE<\/code> hat, werden sie in umgekehrter Reihenfolge ausgelöst — der zuletzt registrierte wird zuerst ausgeführt, sodass der Block wie ein Stapel abgebaut wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ressource <code>A<\/code> wird zuerst geöffnet und zuletzt geschlossen:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Last-in-first-out-Reihenfolge ist genau das, was du für Aufräumarbeiten brauchst: Was zuletzt eingerichtet wurde, wird zuerst abgebaut.<\/span> <span class=\"sg\" data-s=\"1\">Der programmweite <code>END<\/code>-Phaser verhält sich genauso — mehrere <code>END<\/code>-Blöcke werden ebenfalls in umgekehrter Reihenfolge ihrer Niederschrift ausgeführt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Schleifen-Phaser<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Innerhalb von Schleifen markieren drei weitere Phaser die Phasen der Iteration: <code>FIRST<\/code> wird einmal vor der ersten Iteration ausgeführt, <code>LAST<\/code> einmal nach der letzten, und <code>NEXT<\/code> am Ende jeder Iteration:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Schleife erzeugt:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wie bei den anderen Phasern spielt die Position von <code>FIRST<\/code>, <code>NEXT<\/code> und <code>LAST<\/code> im Quelltext keine Rolle — jeder wird zu seinem eigenen Zeitpunkt ausgeführt.<\/span><\/p>"]]},"nl":{"t":"Blokgerelateerde phasers","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Naast de programma-brede phasers heeft Raku phasers die gekoppeld zijn aan de levensduur van een enkel blok of een lus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een blok betreden en verlaten<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>ENTER<\/code>-phaser wordt uitgevoerd telkens wanneer de uitvoering een blok betreedt, en de <code>LEAVE<\/code>-phaser wordt uitgevoerd telkens wanneer het blok verlaten wordt — ongeacht op welke regel ze geschreven staan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De uitvoer laat zien dat <code>ENTER<\/code> als eerste wordt uitgevoerd en <code>LEAVE<\/code> als laatste, rondom de body van het blok:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> is bijzonder nuttig omdat het ook wordt uitgevoerd als het blok vroegtijdig verlaten wordt, wat het een betrouwbare plek maakt om een resource vrij te geven.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een phaser kan een volledig <code>{ }<\/code>-blok bevatten in plaats van een enkele instructie, en je kunt er meerdere instellen.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer een blok meer dan een <code>LEAVE<\/code> heeft, worden ze in omgekeerde volgorde uitgevoerd — de laatst geregistreerde wordt als eerste uitgevoerd, zodat het blok als een stapel wordt afgewikkeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Resource <code>A<\/code> wordt als eerste geopend en als laatste gesloten:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze last-in, first-out volgorde is precies wat je wilt voor opruimwerk: wat het meest recent is ingesteld, wordt als eerste afgebroken.<\/span> <span class=\"sg\" data-s=\"1\">De programma-brede <code>END<\/code>-phaser gedraagt zich op dezelfde manier — meerdere <code>END<\/code>-blokken worden ook in omgekeerde volgorde uitgevoerd ten opzichte van de volgorde waarin ze geschreven zijn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lus-phasers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Binnen lussen markeren drie extra phasers de fasen van de iteratie: <code>FIRST<\/code> wordt eenmalig uitgevoerd voor de eerste iteratie, <code>LAST<\/code> wordt eenmalig uitgevoerd na de laatste, en <code>NEXT<\/code> wordt aan het einde van elke iteratie uitgevoerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De lus produceert:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Net als bij de andere phasers maakt de positie van <code>FIRST<\/code>, <code>NEXT<\/code> en <code>LAST<\/code> in de broncode niet uit — elk wordt op het eigen moment uitgevoerd.<\/span><\/p>"]]},"es":{"t":"Phasers de bloque","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Además de los phasers a nivel de programa, Raku tiene phasers vinculados al ciclo de vida de un solo bloque o bucle.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entrada y salida de un bloque<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El phaser <code>ENTER<\/code> se ejecuta cada vez que la ejecución entra en un bloque, y el phaser <code>LEAVE<\/code> se ejecuta cada vez que sale de él, sin importar en qué línea estén escritos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La salida muestra que <code>ENTER<\/code> se ejecuta primero y <code>LEAVE<\/code> se ejecuta al final, alrededor del cuerpo del bloque:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> es especialmente útil porque se ejecuta incluso si se sale del bloque antes de tiempo, lo que lo convierte en un lugar confiable para liberar un recurso.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un phaser puede tomar un bloque completo <code>{ }<\/code> en lugar de una sola sentencia, y puedes configurar varios de ellos.<\/span> <span class=\"sg\" data-s=\"1\">Cuando un bloque tiene más de un <code>LEAVE<\/code>, se disparan en orden inverso: el último registrado se ejecuta primero, de modo que el bloque se deshace como una pila:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El recurso <code>A<\/code> se abre primero y se cierra al final:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este orden de último en entrar, primero en salir es exactamente lo que necesitas para la limpieza: lo que se configuró más recientemente se desmonta primero.<\/span> <span class=\"sg\" data-s=\"1\">El phaser <code>END<\/code> a nivel de programa se comporta de la misma manera: varios bloques <code>END<\/code> también se ejecutan en orden inverso al que fueron escritos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phasers de bucle<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro de los bucles, tres phasers más marcan las etapas de la iteración: <code>FIRST<\/code> se ejecuta una vez antes de la primera iteración, <code>LAST<\/code> se ejecuta una vez después de la última, y <code>NEXT<\/code> se ejecuta al final de cada iteración:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El bucle produce:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Al igual que con los otros phasers, la posición de <code>FIRST<\/code>, <code>NEXT<\/code> y <code>LAST<\/code> en el código fuente no importa: cada uno se ejecuta en su propio momento.<\/span><\/p>"]]},"it":{"t":"Phaser di blocco","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Oltre ai phaser a livello di programma, Raku dispone di phaser legati al ciclo di vita di un singolo blocco o ciclo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entrare e uscire da un blocco<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il phaser <code>ENTER<\/code> viene eseguito ogni volta che l'esecuzione entra in un blocco, mentre il phaser <code>LEAVE<\/code> viene eseguito ogni volta che ne esce, indipendentemente dalla riga in cui sono scritti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'output mostra che <code>ENTER<\/code> viene eseguito per primo e <code>LEAVE<\/code> per ultimo, attorno al corpo del blocco:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> è particolarmente utile perché viene eseguito anche se il blocco viene abbandonato anticipatamente, il che lo rende un posto affidabile per rilasciare una risorsa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un phaser può contenere un intero blocco <code>{ }<\/code> invece di una singola istruzione, e se ne possono impostare diversi.<\/span> <span class=\"sg\" data-s=\"1\">Quando un blocco ha più di un <code>LEAVE<\/code>, questi vengono eseguiti in ordine inverso: l'ultimo registrato viene eseguito per primo, quindi il blocco si srotola come uno stack:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La risorsa <code>A<\/code> viene aperta per prima e chiusa per ultima:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo ordinamento last-in, first-out è esattamente ciò che si desidera per la pulizia: qualunque cosa sia stata configurata più di recente viene smontata per prima.<\/span> <span class=\"sg\" data-s=\"1\">Il phaser <code>END<\/code> a livello di programma si comporta allo stesso modo: più blocchi <code>END<\/code> vengono eseguiti in ordine inverso rispetto a quello in cui sono stati scritti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaser dei cicli<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">All'interno dei cicli, tre ulteriori phaser contrassegnano le fasi dell'iterazione: <code>FIRST<\/code> viene eseguito una volta prima della prima iterazione, <code>LAST<\/code> viene eseguito una volta dopo l'ultima, e <code>NEXT<\/code> viene eseguito alla fine di ogni iterazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il ciclo produce:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come per gli altri phaser, la posizione di <code>FIRST<\/code>, <code>NEXT<\/code> e <code>LAST<\/code> nel codice sorgente non ha importanza: ognuno viene eseguito al proprio momento.<\/span><\/p>"]]},"lv":{"t":"Bloku fāzeri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez visai programmai piesaistītajiem fāzeriem Raku ir arī fāzeri, kas piesaistīti viena bloka vai cikla dzīvei.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ieiešana blokā un iziešana no tā<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fāzeris <code>ENTER<\/code> izpildās katru reizi, kad izpilde ieiet blokā, un fāzeris <code>LEAVE<\/code> — katru reizi, kad tā to atstāj, neatkarīgi no tā, kurā rindā tie uzrakstīti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izvade rāda, ka <code>ENTER<\/code> izpildās pirmais un <code>LEAVE<\/code> — pēdējais, apņemot bloka ķermeni:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> ir īpaši noderīgs tāpēc, ka izpildās pat tad, ja bloks tiek atstāts priekšlaikus, un tas padara to par uzticamu vietu, kur atbrīvot resursu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fāzeris viena teikuma vietā var ņemt pilnu <code>{ }<\/code> bloku, un tādus var iestatīt vairākus.<\/span> <span class=\"sg\" data-s=\"1\">Kad blokam ir vairāk nekā viens <code>LEAVE<\/code>, tie nostrādā apgrieztā secībā — pēdējais reģistrētais izpildās pirmais, tāpēc bloks attinas kā steks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Resurss <code>A<\/code> tiek atvērts pirmais un aizvērts pēdējais:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī «pēdējais iekšā, pirmais ārā» kārtība ir tieši tas, ko vēlaties sakopšanai: tas, kas iestatīts pēdējais, tiek nojaukts pirmais.<\/span> <span class=\"sg\" data-s=\"1\">Visai programmai piesaistītais fāzeris <code>END<\/code> uzvedas tāpat — arī vairāki <code>END<\/code> bloki izpildās apgrieztā secībā salīdzinājumā ar to, kādā tie uzrakstīti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cikla fāzeri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ciklu iekšienē vēl trīs fāzeri iezīmē iterācijas posmus: <code>FIRST<\/code> izpildās vienreiz pirms pirmās iterācijas, <code>LAST<\/code> — vienreiz pēc pēdējās, un <code>NEXT<\/code> — katras iterācijas beigās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cikls dod:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā pārējiem fāzeriem, <code>FIRST<\/code>, <code>NEXT<\/code> un <code>LAST<\/code> novietojumam pirmkodā nav nozīmes — katrs izpildās savā brīdī.<\/span><\/p>"]]},"ru":{"t":"Фазеры блоков","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Помимо фазеров уровня программы, в Raku есть фазеры, привязанные к жизненному циклу отдельного блока или цикла.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вход и выход из блока<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>ENTER<\/code> выполняется каждый раз, когда исполнение входит в блок, а фазер <code>LEAVE<\/code> выполняется каждый раз, когда выходит из блока — независимо от того, на какой строке они написаны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вывод показывает, что <code>ENTER<\/code> выполняется первым, а <code>LEAVE<\/code> — последним, оборачивая тело блока:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> особенно полезен тем, что выполняется даже при досрочном выходе из блока, что делает его надёжным местом для освобождения ресурсов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Фазер может принимать полный блок <code>{ }<\/code> вместо одного выражения, и можно задавать несколько фазеров.<\/span> <span class=\"sg\" data-s=\"1\">Если в блоке несколько <code>LEAVE<\/code>, они срабатывают в обратном порядке — последний зарегистрированный выполняется первым, так что блок разматывается как стек:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ресурс <code>A<\/code> открывается первым и закрывается последним:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот порядок «последним пришёл — первым ушёл» — именно то, что нужно для очистки: то, что было настроено последним, разрушается первым.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>END<\/code> уровня программы ведёт себя так же — несколько блоков <code>END<\/code> также выполняются в порядке, обратном порядку их написания.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазеры цикла<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Внутри циклов доступны ещё три фазера, отмечающие этапы итерации: <code>FIRST<\/code> выполняется один раз перед первой итерацией, <code>LAST<\/code> — один раз после последней, а <code>NEXT<\/code> — в конце каждой итерации:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цикл выводит:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как и с другими фазерами, положение <code>FIRST<\/code>, <code>NEXT<\/code> и <code>LAST<\/code> в исходном коде не имеет значения — каждый выполняется в свой момент.<\/span><\/p>"]]},"uk":{"t":"Блокові фейзери","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Окрім фазерів, що стосуються всієї програми, Raku має фазери, прив'язані до життєвого циклу окремого блоку або циклу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Входження та вихід з блоку<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>ENTER<\/code> запускається щоразу, коли виконання входить у блок, а фазер <code>LEAVE<\/code> запускається щоразу, коли воно виходить — незалежно від того, на якому рядку вони написані:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вивід показує, що <code>ENTER<\/code> запускається першим, а <code>LEAVE<\/code> — останнім, навколо тіла блоку:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> особливо корисний, тому що він запускається навіть якщо блок залишено достроково, що робить його надійним місцем для звільнення ресурсів.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Фазер може приймати повний блок <code>{ }<\/code> замість одного оператора, і ви можете налаштувати декілька з них.<\/span> <span class=\"sg\" data-s=\"1\">Коли блок має більше одного <code>LEAVE<\/code>, вони спрацьовують у зворотному порядку — останній зареєстрований запускається першим, тож блок розгортається як стек:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ресурс <code>A<\/code> відкривається першим і закривається останнім:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей порядок «останнім прийшов — першим пішов» — саме те, що потрібно для очищення: те, що було налаштовано останнім, розбирається першим.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>END<\/code>, що стосується всієї програми, поводиться так само — кілька блоків <code>END<\/code> також запускаються у зворотному порядку їх написання.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазери циклу<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всередині циклів три додаткові фазери позначають етапи ітерації: <code>FIRST<\/code> запускається один раз перед першою ітерацією, <code>LAST<\/code> запускається один раз після останньої, а <code>NEXT<\/code> запускається наприкінці кожної ітерації:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цикл виводить:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як і з іншими фазерами, позиція <code>FIRST<\/code>, <code>NEXT<\/code> та <code>LAST<\/code> у вихідному коді не має значення — кожен запускається у свій момент.<\/span><\/p>"]]},"bg":{"t":"Фейзъри за блокове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Освен фазерите за цялата програма, Raku има фазери, свързани с живота на единичен блок или цикъл.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Влизане и излизане от блок<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фазерът <code>ENTER<\/code> се изпълнява всеки път, когато изпълнението влезе в блок, а фазерът <code>LEAVE<\/code> се изпълнява всеки път, когато го напусне — независимо на кой ред са написани:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изходът показва, че <code>ENTER<\/code> се изпълнява първи, а <code>LEAVE<\/code> — последен, около тялото на блока:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> е особено полезен, защото се изпълнява дори ако блокът бъде напуснат преждевременно, което го прави надеждно място за освобождаване на ресурс.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Фазерът може да приеме пълен блок <code>{ }<\/code> вместо единичен оператор, а можете да зададете и няколко от тях.<\/span> <span class=\"sg\" data-s=\"1\">Когато блокът има повече от един <code>LEAVE<\/code>, те се задействат в обратен ред — последният регистриран се изпълнява първи, така че блокът се разгръща като стек:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ресурс <code>A<\/code> се отваря първи и се затваря последен:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този ред „последен влязъл, първи излязъл\" е точно това, което искате за почистване: каквото е настроено най-скоро, се разрушава първо.<\/span> <span class=\"sg\" data-s=\"1\">Фазерът за цялата програма <code>END<\/code> се държи по същия начин — няколко блока <code>END<\/code> също се изпълняват в обратен ред спрямо реда, в който са написани.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цикъл фазери<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вътре в цикли три допълнителни фазера маркират етапите на итерацията: <code>FIRST<\/code> се изпълнява веднъж преди първата итерация, <code>LAST<\/code> се изпълнява веднъж след последната, а <code>NEXT<\/code> се изпълнява в края на всяка итерация:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цикълът произвежда:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както при другите фазери, позицията на <code>FIRST<\/code>, <code>NEXT<\/code> и <code>LAST<\/code> в изходния код няма значение — всеки се изпълнява в своя момент.<\/span><\/p>"]]},"eo":{"t":"Blok-rilataj faziloj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Krom la programvasttaj faziloj, Raku havas fazilojn ligitajn al la vivo de unu bloko aŭ buklo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eniro kaj eliro de bloko<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La fazilo <code>ENTER<\/code> ruliĝas ĉiufoje kiam ekzekuto eniras blokon, kaj la fazilo <code>LEAVE<\/code> ruliĝas ĉiufoje kiam ĝi eliras — sendepende de la linio, kie ili estas skribitaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La eligo montras, ke <code>ENTER<\/code> ruliĝas unue kaj <code>LEAVE<\/code> ruliĝas laste, ĉirkaŭ la korpo de la bloko:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> estas aparte utila, ĉar ĝi ruliĝas eĉ se la bloko estas forlasita frue, kio faras ĝin fidinda loko por liberigi rimedojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fazilo povas enhavi plenan <code>{ }<\/code> blokon anstataŭ unu sola deklaro, kaj vi povas difini plurajn.<\/span> <span class=\"sg\" data-s=\"1\">Kiam bloko havas pli ol unu <code>LEAVE<\/code>, ili ekfunkcias en inversa ordo — la laste registrita ruliĝas unue, do la bloko malvolviĝas kiel stako:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rimedo <code>A<\/code> estas malfermita unue kaj fermita laste:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu laste-en-unue-el ordo estas ĝuste tio, kion vi bezonas por purigado: kio ajn estis preparita plej lastatempe, estas malmuntita unue.<\/span> <span class=\"sg\" data-s=\"1\">La programvasta fazilo <code>END<\/code> funkcias same — pluraj <code>END<\/code>-blokoj ankaŭ ruliĝas en inversa ordo kompare al tiu, en kiu ili estis skribitaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Buklaj faziloj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ene de bukloj, tri pliaj faziloj markas la stadiojn de la iteracio: <code>FIRST<\/code> ruliĝas unufoje antaŭ la unua iteracio, <code>LAST<\/code> ruliĝas unufoje post la lasta, kaj <code>NEXT<\/code> ruliĝas ĉe la fino de ĉiu iteracio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La buklo produktas:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Same kiel ĉe la aliaj faziloj, la pozicio de <code>FIRST<\/code>, <code>NEXT<\/code> kaj <code>LAST<\/code> en la fontkodo ne gravas — ĉiu ruliĝas en sia propra momento.<\/span><\/p>"]]},"la":{"t":"Phaseres blocorum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Praeter phaseres qui totum programma spectant, Raku habet phaseres qui ad vitam singulae copiae vel ansae pertinent.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Intrare et relinquere copiam<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Phaser <code>ENTER<\/code> currit quotiens exsecutio copiam intrat, et phaser <code>LEAVE<\/code> currit quotiens eam relinquit — in quacumque linea scripti sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Output ostendit quod <code>ENTER<\/code> primus currit et <code>LEAVE<\/code> ultimus, circa corpus copiae:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> praecipue utilis est quia currit etiam si copia mature relinquitur, quod eum locum fidum facit ad liberandas res.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Phaser potest plenam copiam <code>{ }<\/code> accipere loco singulae sententiae, et plures eorum constituere potes.<\/span> <span class=\"sg\" data-s=\"1\">Cum copia plus quam unum <code>LEAVE<\/code> habet, ordine inverso accenduntur — ultimus registratus primus currit, ita copia se resolvit sicut cumulus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Res <code>A<\/code> prima aperitur et ultima clauditur:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic ordo ultimo-intrans-primo-exiens est exacte quod vis pro purgatione: quidquid recentissime constitutum est, primum dissolvitur.<\/span> <span class=\"sg\" data-s=\"1\">Phaser <code>END<\/code> pro toto programmate eodem modo se gerit — plures copiae <code>END<\/code> etiam in ordine inverso scripturae currunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaseres ansarum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Intra ansas, tres plures phaseres stadia iterationis signant: <code>FIRST<\/code> semel currit ante primam iterationem, <code>LAST<\/code> semel currit post ultimam, et <code>NEXT<\/code> currit in fine cuiusque iterationis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ansa producit:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sicut cum aliis phaseribus, positio <code>FIRST<\/code>, <code>NEXT<\/code>, et <code>LAST<\/code> in fonte non refert — quisque in suo momento currit.<\/span><\/p>"]]}}}</script>
