<script type="application/json" id="page-data">{"u":"advanced/nested-subroutines","n":672,"k":"section","pv":"advanced/more-on-main/quiz","nx":"advanced/nested-subroutines/exercises","tr":["advanced"],"L":{"en":{"t":"Nested subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A subroutine may be defined <em>inside<\/em> another subroutine.<\/span> <span class=\"sg\" data-s=\"1\">A nested subroutine is a normal subroutine, but it is visible only within the subroutine that contains it.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here <code>inner<\/code> is declared inside <code>outer<\/code>, and <code>outer<\/code> calls it.<\/span> <span class=\"sg\" data-s=\"1\">This works because <code>inner<\/code> is in scope throughout the body of <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Outside <code>outer<\/code>, however, the name <code>inner<\/code> does not exist.<\/span> <span class=\"sg\" data-s=\"1\">The following program fails to compile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nesting is useful when a helper routine is needed by one subroutine only.<\/span> <span class=\"sg\" data-s=\"1\">Keeping it inside makes clear that it is a private detail and prevents it from being called from anywhere else by mistake.<\/span><\/p>"]]},"de":{"t":"Verschachtelte Unterprogramme","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Unterroutine kann <em>innerhalb<\/em> einer anderen Unterroutine definiert werden.<\/span> <span class=\"sg\" data-s=\"1\">Eine verschachtelte Unterroutine ist eine normale Unterroutine, aber sie ist nur innerhalb der Unterroutine sichtbar, die sie enthält.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wird <code>inner<\/code> innerhalb von <code>outer<\/code> deklariert, und <code>outer<\/code> ruft sie auf.<\/span> <span class=\"sg\" data-s=\"1\">Das funktioniert, weil <code>inner<\/code> im gesamten Körper von <code>outer<\/code> im Gültigkeitsbereich liegt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Außerhalb von <code>outer<\/code> existiert der Name <code>inner<\/code> jedoch nicht.<\/span> <span class=\"sg\" data-s=\"1\">Das folgende Programm lässt sich nicht kompilieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verschachtelung ist nützlich, wenn eine Hilfsroutine nur von einer einzigen Unterroutine benötigt wird.<\/span> <span class=\"sg\" data-s=\"1\">Sie darin zu belassen, macht deutlich, dass es sich um ein privates Detail handelt, und verhindert, dass sie versehentlich von anderswo aufgerufen wird.<\/span><\/p>"]]},"nl":{"t":"Geneste subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een subroutine kan <em>binnen<\/em> een andere subroutine worden gedefinieerd.<\/span> <span class=\"sg\" data-s=\"1\">Een geneste subroutine is een normale subroutine, maar is alleen zichtbaar binnen de subroutine die haar bevat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wordt <code>inner<\/code> gedeclareerd binnen <code>outer<\/code>, en <code>outer<\/code> roept haar aan.<\/span> <span class=\"sg\" data-s=\"1\">Dit werkt omdat <code>inner<\/code> binnen het bereik van het hele lichaam van <code>outer<\/code> valt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Buiten <code>outer<\/code> bestaat de naam <code>inner<\/code> echter niet.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende programma kan niet worden gecompileerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nesten is handig wanneer een hulproutine slechts door een enkele subroutine nodig is.<\/span> <span class=\"sg\" data-s=\"1\">Door deze erin te plaatsen wordt duidelijk dat het een privédetail is en wordt voorkomen dat ze per ongeluk van elders wordt aangeroepen.<\/span><\/p>"]]},"es":{"t":"Subrutinas anidadas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina puede definirse <em>dentro<\/em> de otra subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina anidada es una subrutina normal, pero solo es visible dentro de la subrutina que la contiene.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>inner<\/code> se declara dentro de <code>outer<\/code>, y <code>outer<\/code> la llama.<\/span> <span class=\"sg\" data-s=\"1\">Esto funciona porque <code>inner<\/code> está en el ámbito durante todo el cuerpo de <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fuera de <code>outer<\/code>, sin embargo, el nombre <code>inner<\/code> no existe.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente programa no compila:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La anidación es útil cuando una rutina auxiliar solo es necesaria para una subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Mantenerla dentro deja claro que es un detalle privado y evita que sea llamada desde cualquier otro lugar por error.<\/span><\/p>"]]},"it":{"t":"Subroutine annidate","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine puo essere definita <em>all'interno<\/em> di un'altra subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine annidata e una subroutine normale, ma e visibile solo all'interno della subroutine che la contiene.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>inner<\/code> e dichiarata all'interno di <code>outer<\/code>, e <code>outer<\/code> la chiama.<\/span> <span class=\"sg\" data-s=\"1\">Questo funziona perche <code>inner<\/code> e nello scope di tutto il corpo di <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al di fuori di <code>outer<\/code>, tuttavia, il nome <code>inner<\/code> non esiste.<\/span> <span class=\"sg\" data-s=\"1\">Il seguente programma non riesce a compilare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'annidamento e utile quando una routine ausiliaria e necessaria solo per una singola subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Tenerla all'interno rende chiaro che si tratta di un dettaglio privato e impedisce che venga chiamata per errore da altre parti del programma.<\/span><\/p>"]]},"lv":{"t":"Ligzdotas apakšprogrammas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammu var definēt <em>iekšpus<\/em> citas apakšprogrammas.<\/span> <span class=\"sg\" data-s=\"1\">Ligzdota apakšprogramma ir parasta apakšprogramma, taču tā ir redzama tikai tajā apakšprogrammā, kas to satur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>inner<\/code> ir deklarēta iekšpus <code>outer<\/code>, un <code>outer<\/code> to izsauc.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas tāpēc, ka <code>inner<\/code> ir redzama visā <code>outer<\/code> ķermenī.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ārpus <code>outer<\/code> nosaukums <code>inner<\/code> tomēr neeksistē.<\/span> <span class=\"sg\" data-s=\"1\">Šī programma nekompilējas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ligzdošana noder, kad palīgrutīna vajadzīga tikai vienai apakšprogrammai.<\/span> <span class=\"sg\" data-s=\"1\">Turot to iekšpusē, kļūst skaidrs, ka tā ir privāta detaļa, un tā tiek pasargāta no izsaukšanas no citurienes pa kļūdai.<\/span><\/p>"]]},"ru":{"t":"Вложенные подпрограммы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма может быть определена <em>внутри<\/em> другой подпрограммы.<\/span> <span class=\"sg\" data-s=\"1\">Вложенная подпрограмма — это обычная подпрограмма, но она видна только внутри той подпрограммы, которая её содержит.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>inner<\/code> объявлена внутри <code>outer<\/code>, и <code>outer<\/code> её вызывает.<\/span> <span class=\"sg\" data-s=\"1\">Это работает, потому что <code>inner<\/code> находится в области видимости на протяжении всего тела <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Однако за пределами <code>outer<\/code> имя <code>inner<\/code> не существует.<\/span> <span class=\"sg\" data-s=\"1\">Следующая программа не скомпилируется:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вложенность полезна, когда вспомогательная подпрограмма нужна только одной подпрограмме.<\/span> <span class=\"sg\" data-s=\"1\">Размещение её внутри делает очевидным, что это внутренняя деталь реализации, и предотвращает случайный вызов из другого места.<\/span><\/p>"]]},"uk":{"t":"Вкладені підпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограму можна визначити <em>всередині<\/em> іншої підпрограми.<\/span> <span class=\"sg\" data-s=\"1\">Вкладена підпрограма є звичайною підпрограмою, але видима лише в межах тієї, що її містить.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>inner<\/code> оголошено всередині <code>outer<\/code>, і <code>outer<\/code> її викликає.<\/span> <span class=\"sg\" data-s=\"1\">Це працює, бо <code>inner<\/code> перебуває в області видимості впродовж усього тіла <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Проте за межами <code>outer<\/code> імені <code>inner<\/code> не існує.<\/span> <span class=\"sg\" data-s=\"1\">Наведена програма не компілюється:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # помилка: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вкладення корисне, коли допоміжна підпрограма потрібна лише одній підпрограмі.<\/span> <span class=\"sg\" data-s=\"1\">Тримання її всередині ясно показує, що це приватна деталь, і не дає випадково викликати її звідкись іще.<\/span><\/p>"]]},"bg":{"t":"Вложени подпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограма може да бъде дефинирана <em>вътре<\/em> в друга подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Вложената подпрограма е обикновена подпрограма, но е видима само в подпрограмата, която я съдържа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>inner<\/code> е декларирана вътре в <code>outer<\/code>, а <code>outer<\/code> я извиква.<\/span> <span class=\"sg\" data-s=\"1\">Това работи, защото <code>inner<\/code> е в обхвата на цялото тяло на <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Извън <code>outer<\/code> обаче името <code>inner<\/code> не съществува.<\/span> <span class=\"sg\" data-s=\"1\">Следната програма не се компилира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Влагането е полезно, когато помощна подпрограма е необходима само на една подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Поставянето й вътре прави ясно, че тя е частен детайл, и предотвратява случайното й извикване от друго място.<\/span><\/p>"]]},"eo":{"t":"Nestitaj subrutinaj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Subprogramo povas esti difinita <em>ene de<\/em> alia subprogramo.<\/span> <span class=\"sg\" data-s=\"1\">Nestita subprogramo estas normala subprogramo, sed ĝi estas videbla nur ene de la subprogramo, kiu enhavas ĝin.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>inner<\/code> estas deklarita ene de <code>outer<\/code>, kaj <code>outer<\/code> vokas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias, ĉar <code>inner<\/code> estas en la videbla amplekso tra la tuta korpo de <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ekster <code>outer<\/code> tamen, la nomo <code>inner<\/code> ne ekzistas.<\/span> <span class=\"sg\" data-s=\"1\">La sekva programo malsukcesas kompili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nestado estas utila, kiam helpanta subprogramo estas bezonata de nur unu subprogramo.<\/span> <span class=\"sg\" data-s=\"1\">Konservi ĝin ene klaras, ke ĝi estas privata detalo, kaj malhelpas ĝin esti vokita de aliloke erare.<\/span><\/p>"]]},"la":{"t":"Subprogrammata nidificata","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Subroutina <em>intra<\/em> aliam subroutinam definiri potest.<\/span> <span class=\"sg\" data-s=\"1\">Subroutina inclusa est subroutina ordinaria, sed tantum intra subroutinam continentem visibilis est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <code>inner<\/code> intra <code>outer<\/code> declaratur, et <code>outer<\/code> eam vocat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc operatur quia <code>inner<\/code> per totum corpus subroutinae <code>outer<\/code> in ambitu est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Extra <code>outer<\/code> autem, nomen <code>inner<\/code> non exsistit.<\/span> <span class=\"sg\" data-s=\"1\">Programma sequens compilari non potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inclusio utilis est cum subroutina auxiliaris ab una sola subroutina requiritur.<\/span> <span class=\"sg\" data-s=\"1\">Eam intus servare clare indicat eam rem privatam esse et impedit ne aliunde per errorem vocetur.<\/span><\/p>"]]}}}</script>
