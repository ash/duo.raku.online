<script type="application/json" id="page-data">{"u":"advanced/nested-subroutines/exercises/closure-over-outer","n":676,"k":"exercise","pv":"advanced/nested-subroutines/exercises/private-helper/solution","nx":"advanced/nested-subroutines/exercises/closure-over-outer/solution","tr":["advanced","advanced/nested-subroutines"],"L":{"en":{"t":"Exercise ’Closing over the outer‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A nested subroutine is a <em>closure<\/em>: it can see the variables of the subroutine that contains it.<\/span> <span class=\"sg\" data-s=\"1\">Write a subroutine <code>greet($name)<\/code> that defines a nested helper <code>message<\/code> taking <strong>no<\/strong> arguments.<\/span> <span class=\"sg\" data-s=\"2\">The helper returns <code>\"Hello, $name!\"<\/code>, reading <code>$name<\/code> straight from the enclosing <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Inside <code>greet<\/code>, print what <code>message<\/code> returns, and call <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Über den äußeren Bereich schließen","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine verschachtelte Unterroutine ist ein <em>Closure<\/em>: Sie kann die Variablen der Unterroutine sehen, die sie enthält.<\/span> <span class=\"sg\" data-s=\"1\">Schreiben Sie eine Unterroutine <code>greet($name)<\/code>, die einen verschachtelten Helfer <code>message<\/code> definiert, der <strong>keine<\/strong> Argumente entgegennimmt.<\/span> <span class=\"sg\" data-s=\"2\">Der Helfer gibt <code>\"Hello, $name!\"<\/code> zurück und liest <code>$name<\/code> direkt aus dem umgebenden <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Geben Sie innerhalb von <code>greet<\/code> aus, was <code>message<\/code> zurückgibt, und rufen Sie <code>greet('Anna')<\/code> auf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Afsluiten over de buitenste","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een geneste subroutine is een <em>closure<\/em>: ze kan de variabelen zien van de subroutine die haar bevat.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf een subroutine <code>greet($name)<\/code> die een geneste hulpfunctie <code>message<\/code> definieert die <strong>geen<\/strong> argumenten aanneemt.<\/span> <span class=\"sg\" data-s=\"2\">De hulpfunctie retourneert <code>\"Hello, $name!\"<\/code>, waarbij <code>$name<\/code> rechtstreeks uit de omsluitende <code>greet<\/code> wordt gelezen.<\/span> <span class=\"sg\" data-s=\"3\">Druk binnen <code>greet<\/code> af wat <code>message<\/code> retourneert, en roep <code>greet('Anna')<\/code> aan.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Clausura sobre lo externo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una subrutina anidada es una <em>clausura<\/em>: puede ver las variables de la subrutina que la contiene.<\/span> <span class=\"sg\" data-s=\"1\">Escribe una subrutina <code>greet($name)<\/code> que defina una función auxiliar anidada <code>message<\/code> que <strong>no<\/strong> tome argumentos.<\/span> <span class=\"sg\" data-s=\"2\">La función auxiliar devuelve <code>\"Hello, $name!\"<\/code>, leyendo <code>$name<\/code> directamente de la subrutina contenedora <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dentro de <code>greet<\/code>, imprime lo que devuelve <code>message<\/code>, y llama a <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Chiusura sull'esterno","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una subroutine annidata e una <em>closure<\/em>: puo vedere le variabili della subroutine che la contiene.<\/span> <span class=\"sg\" data-s=\"1\">Scrivi una subroutine <code>greet($name)<\/code> che definisca un helper annidato <code>message<\/code> che <strong>non<\/strong> accetta argomenti.<\/span> <span class=\"sg\" data-s=\"2\">L'helper restituisce <code>\"Hello, $name!\"<\/code>, leggendo <code>$name<\/code> direttamente dalla <code>greet<\/code> che la racchiude.<\/span> <span class=\"sg\" data-s=\"3\">All'interno di <code>greet<\/code>, stampa cio che <code>message<\/code> restituisce e chiama <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Noslēgt ārējo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ligzdota apakšprogramma ir <em>slēgums<\/em>: tā redz to apakšprogrammu mainīgos, kas to satur.<\/span> <span class=\"sg\" data-s=\"1\">Uzrakstiet apakšprogrammu <code>greet($name)<\/code>, kas definē ligzdotu palīgu <code>message<\/code> <strong>bez<\/strong> argumentiem.<\/span> <span class=\"sg\" data-s=\"2\">Palīgs atgriež <code>\"Hello, $name!\"<\/code>, nolasot <code>$name<\/code> tieši no apņemošās <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Iekšpus <code>greet<\/code> izdrukājiet to, ko atgriež <code>message<\/code>, un izsauciet <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Замыкание на внешнюю переменную","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вложенная подпрограмма является <em>замыканием<\/em>: она может видеть переменные подпрограммы, которая её содержит.<\/span> <span class=\"sg\" data-s=\"1\">Напишите подпрограмму <code>greet($name)<\/code>, которая определяет вложенный помощник <code>message<\/code>, не принимающий <strong>никаких<\/strong> аргументов.<\/span> <span class=\"sg\" data-s=\"2\">Помощник возвращает <code>\"Hello, $name!\"<\/code>, считывая <code>$name<\/code> непосредственно из объемлющей <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Внутри <code>greet<\/code> выведите то, что возвращает <code>message<\/code>, и вызовите <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Замикання на зовнішню»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вкладена підпрограма є <em>замиканням<\/em>: вона бачить змінні тієї підпрограми, що її містить.<\/span> <span class=\"sg\" data-s=\"1\">Напишіть підпрограму <code>greet($name)<\/code>, яка визначає вкладеного помічника <code>message<\/code>, що <strong>не<\/strong> приймає аргументів.<\/span> <span class=\"sg\" data-s=\"2\">Помічник повертає <code>\"Hello, $name!\"<\/code>, читаючи <code>$name<\/code> просто з обгортальної <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Усередині <code>greet<\/code> виведіть те, що повертає <code>message<\/code>, і викличте <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Затваряне над външна","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Условие<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вложена подпрограма е <em>затваряне<\/em> (closure): тя може да вижда променливите на подпрограмата, която я съдържа.<\/span> <span class=\"sg\" data-s=\"1\">Напишете подпрограма <code>greet($name)<\/code>, която дефинира вложен помощник <code>message<\/code>, приемащ <strong>нула<\/strong> аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Помощникът връща <code>\"Hello, $name!\"<\/code>, като чете <code>$name<\/code> директно от обхващащата <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вътре в <code>greet<\/code> отпечатайте това, което <code>message<\/code> връща, и извикайте <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Fermi super la ekstera","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nestita subprogramo estas <em>fermo<\/em>: ĝi povas vidi la variablojn de la subprogramo, kiu enhavas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Skribu subprogramon <code>greet($name)<\/code>, kiu difinas nestitan helpanton <code>message<\/code> prenantan <strong>neniujn<\/strong> argumentojn.<\/span> <span class=\"sg\" data-s=\"2\">La helpanto redonas <code>\"Hello, $name!\"<\/code>, legante <code>$name<\/code> rekte el la enferma <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ene de <code>greet<\/code>, presi tion, kion <code>message<\/code> redonas, kaj voku <code>greet('Anna')<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Clausura super externo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subroutina inclusa est <em>clausura<\/em>: variabiles subroutinae continentis videre potest.<\/span> <span class=\"sg\" data-s=\"1\">Scribe subroutinam <code>greet($name)<\/code> quae subroutinam auxiliarem inclusam <code>message<\/code> definit, quae <strong>nullos<\/strong> argumentos accipit.<\/span> <span class=\"sg\" data-s=\"2\">Auxiliaris <code>\"Hello, $name!\"<\/code> reddit, <code>$name<\/code> directe ex subroutina circumdante <code>greet<\/code> legens.<\/span> <span class=\"sg\" data-s=\"3\">Intra <code>greet<\/code>, quod <code>message<\/code> reddit imprime, et <code>greet('Anna')<\/code> voca.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/nested-subroutines/exercises/closure-over-outer/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
