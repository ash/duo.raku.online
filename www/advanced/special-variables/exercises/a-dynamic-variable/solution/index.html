<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/a-dynamic-variable/solution","n":412,"k":"solution","pv":"advanced/special-variables/exercises/a-dynamic-variable","nx":"advanced/special-variables/exercises/override-dynamic","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"The solution of ’A dynamic variable‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>*<\/code> twigil makes <code>$*user<\/code> dynamic. <code>whoami<\/code> never takes it as a parameter — it finds the value by looking outward through the call stack, so the first call reports the default <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The inner block redeclares <code>$*user<\/code> as <code>admin<\/code> for the duration of that block. The <em>same<\/em> <code>whoami<\/code> now sees <code>admin<\/code>, because dynamic lookup follows whoever is currently on the stack. Overriding a dynamic variable in a scope is how you grant elevated context to everything called from it — without changing <code>whoami<\/code> at all.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Eine dynamische Variable","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>*<\/code>-Twigil macht <code>$*user<\/code> dynamisch. <code>whoami<\/code> nimmt es nie als Parameter entgegen — es findet den Wert, indem es nach außen durch den Aufrufstapel schaut. Der erste Aufruf meldet daher den Standardwert <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der innere Block deklariert <code>$*user<\/code> als <code>admin<\/code> für die Dauer dieses Blocks neu. Dieselbe <code>whoami<\/code>-Funktion sieht jetzt <code>admin<\/code>, weil die dynamische Auflösung demjenigen folgt, der sich gerade auf dem Stapel befindet. Das Überschreiben einer dynamischen Variablen in einem Geltungsbereich ist die Art, wie du allem, was von dort aufgerufen wird, einen erweiterten Kontext gibst — ohne <code>whoami<\/code> selbst zu ändern.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een dynamische variabele","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>*<\/code>-twigil maakt <code>$*user<\/code> dynamisch. <code>whoami<\/code> neemt het nooit als parameter — het vindt de waarde door naar buiten te zoeken via de call stack, dus de eerste aanroep rapporteert de standaardwaarde <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het binnenste blok declareert <code>$*user<\/code> opnieuw als <code>admin<\/code> voor de duur van dat blok. Dezelfde <code>whoami<\/code> ziet nu <code>admin<\/code>, omdat dynamisch opzoeken volgt wie er momenteel op de stack staat. Het overschrijven van een dynamische variabele in een scope is hoe je verhoogde context verleent aan alles wat van daaruit wordt aangeroepen — zonder <code>whoami<\/code> zelf te wijzigen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Una variable dinámica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El twigil <code>*<\/code> hace que <code>$*user<\/code> sea dinámica. <code>whoami<\/code> nunca la recibe como parámetro — encuentra el valor buscando hacia afuera a través de la pila de llamadas, así que la primera llamada reporta el valor predeterminado <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque interno redeclara <code>$*user<\/code> como <code>admin<\/code> durante la duración de ese bloque. La <em>misma<\/em> <code>whoami<\/code> ahora ve <code>admin<\/code>, porque la búsqueda dinámica sigue a quien está actualmente en la pila. Sobreescribir una variable dinámica en un ámbito es la forma de otorgar contexto elevado a todo lo que se llame desde él — sin modificar <code>whoami<\/code> en absoluto.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Una variabile dinamica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il twigil <code>*<\/code> rende <code>$*user<\/code> dinamica. <code>whoami<\/code> non la riceve mai come parametro — trova il valore cercando verso l'esterno attraverso lo stack delle chiamate, quindi la prima chiamata riporta il valore predefinito <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco interno ridichiara <code>$*user<\/code> come <code>admin<\/code> per la durata di quel blocco. La <em>stessa<\/em> <code>whoami<\/code> ora vede <code>admin<\/code>, perche' la ricerca dinamica segue chi si trova attualmente nello stack. Sovrascrivere una variabile dinamica in uno scope e' il modo in cui si concede un contesto elevato a tutto cio' che viene chiamato da esso — senza modificare affatto <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Dinamisks mainīgais","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tvigils <code>*<\/code> padara <code>$*user<\/code> dinamisku. <code>whoami<\/code> to nekad neņem kā parametru — tā atrod vērtību, skatoties uz āru pa izsaukumu steku, tāpēc pirmais izsaukums ziņo noklusējumu <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Iekšējais bloks sava bloka laikā <code>$*user<\/code> pārdeklarē kā <code>admin<\/code>. <em>Tā pati<\/em> <code>whoami<\/code> tagad redz <code>admin<\/code>, jo dinamiskā meklēšana seko tam, kas pašlaik atrodas stekā. Dinamiska mainīgā pārmākšana kādā redzamības apgabalā ir veids, kā piešķirt paaugstinātu kontekstu visam, kas no tā izsaukts, — nemainot <code>whoami<\/code> ne mazākajā mērā.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Динамическая переменная","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Твигил <code>*<\/code> делает <code>$*user<\/code> динамической переменной. <code>whoami<\/code> никогда не принимает её как параметр — она находит значение, просматривая стек вызовов наружу, поэтому первый вызов сообщает значение по умолчанию <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внутренний блок переобъявляет <code>$*user<\/code> как <code>admin<\/code> на время действия этого блока. Та же самая <code>whoami<\/code> теперь видит <code>admin<\/code>, потому что динамический поиск следует за тем, кто находится на стеке в данный момент. Переопределение динамической переменной в области видимости — это способ предоставить расширенный контекст всему, что вызывается из неё, без какого-либо изменения <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Динамічна змінна","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Твіґіл <code>*<\/code> робить <code>$*user<\/code> динамічною. <code>whoami<\/code> ніколи не приймає її параметром — вона знаходить значення, дивлячись назовні по стеку викликів, тож перший виклик повідомляє типове <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внутрішній блок перевизначає <code>$*user<\/code> як <code>admin<\/code> на час цього блоку. <em>Та сама<\/em> <code>whoami<\/code> тепер бачить <code>admin<\/code>, бо динамічний пошук іде за тим, хто зараз перебуває у стеку. Перекриття динамічної змінної в області видимості — це спосіб надати підвищений контекст усьому, що з неї викликається, зовсім не змінюючи <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Динамична променлива","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Туигилът <code>*<\/code> прави <code>$*user<\/code> динамична. <code>whoami<\/code> никога не я приема като параметър — тя намира стойността, като гледа навън през стека на извикванията, така че първото извикване докладва стойността по подразбиране <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вътрешният блок предекларира <code>$*user<\/code> като <code>admin<\/code> за времетраенето на този блок. <em>Същата<\/em> <code>whoami<\/code> сега вижда <code>admin<\/code>, защото динамичното търсене следва този, който е в момента на стека. Заменянето на динамична променлива в обхват е начинът, по който предоставяте повишен контекст на всичко, извикано от него — без да променяте <code>whoami<\/code> изобщо.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Dinamika variablo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tvigilo <code>*<\/code> faras <code>$*user<\/code> dinamika. <code>whoami<\/code> neniam prenas ĝin kiel parametron — ĝi trovas la valoron per rigardado eksteren tra la voka stako, do la unua voko raportas la defaŭltan <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La interna bloko redeklaras <code>$*user<\/code> kiel <code>admin<\/code> dum la daŭro de tiu bloko. La <em>sama<\/em> <code>whoami<\/code> nun vidas <code>admin<\/code>, ĉar dinamika serĉado sekvas tiun, kiu nuntempe estas sur la stako. Anstataŭigi dinamikan variablon en amplekso estas kiel vi donas pliigitan kuntekston al ĉio, kio estas vokita el ĝi — sen ŝanĝi <code>whoami<\/code> entute.<\/span><\/li><\/ol>"]]}}}</script>
