<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/a-dynamic-variable","n":411,"k":"exercise","pv":"advanced/special-variables/exercises","nx":"advanced/special-variables/exercises/a-dynamic-variable/solution","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"Exercise ’A dynamic variable‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A dynamic variable — one written with the <code>*<\/code> twigil — is looked up by searching outward through the call stack, not by lexical scope.<\/span> <span class=\"sg\" data-s=\"1\">So the value a subroutine sees depends on who called it, which lets a block run the code it calls under a different identity.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declare a dynamic variable <code>$*user<\/code> with the value <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Write a subroutine <code>whoami<\/code> that prints <code>running as <\/code> followed by the current <code>$*user<\/code> (for example, <code>running as guest<\/code>). It must read <code>$*user<\/code> directly — it takes no parameters.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Call <code>whoami<\/code> once at the top level: it reports <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Then, inside a block that redeclares <code>$*user<\/code> as <code>'admin'<\/code>, call the <em>same<\/em> <code>whoami<\/code> again: it now reports <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Eine dynamische Variable","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine dynamische Variable — geschrieben mit dem <code>*<\/code>-Twigil — wird aufgelöst, indem nach außen durch den Aufrufstapel gesucht wird, nicht über den lexikalischen Geltungsbereich.<\/span> <span class=\"sg\" data-s=\"1\">Der Wert, den eine Subroutine sieht, hängt also davon ab, wer sie aufgerufen hat, was es einem Block ermöglicht, den von ihm aufgerufenen Code unter einer anderen Identität auszuführen.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklariere eine dynamische Variable <code>$*user<\/code> mit dem Wert <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Schreibe eine Subroutine <code>whoami<\/code>, die <code>running as <\/code> gefolgt vom aktuellen <code>$*user<\/code> ausgibt (zum Beispiel <code>running as guest<\/code>). Sie muss <code>$*user<\/code> direkt lesen — sie nimmt keine Parameter entgegen.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Rufe <code>whoami<\/code> einmal auf der obersten Ebene auf: sie meldet <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Dann rufe innerhalb eines Blocks, der <code>$*user<\/code> als <code>'admin'<\/code> neu deklariert, dieselbe <code>whoami<\/code> erneut auf: sie meldet jetzt <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Een dynamische variabele","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een dynamische variabele — geschreven met de <code>*<\/code>-twigil — wordt opgezocht door naar buiten te zoeken via de call stack, niet via lexicale scope.<\/span> <span class=\"sg\" data-s=\"1\">De waarde die een subroutine ziet hangt dus af van wie deze heeft aangeroepen, waardoor een blok de code die het aanroept onder een andere identiteit kan laten draaien.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declareer een dynamische variabele <code>$*user<\/code> met de waarde <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Schrijf een subroutine <code>whoami<\/code> die <code>running as <\/code> print gevolgd door de huidige <code>$*user<\/code> (bijvoorbeeld <code>running as guest<\/code>). Deze moet <code>$*user<\/code> direct uitlezen — zonder parameters.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Roep <code>whoami<\/code> eenmaal aan op het bovenste niveau: het rapporteert <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Roep vervolgens binnen een blok dat <code>$*user<\/code> opnieuw declareert als <code>'admin'<\/code> dezelfde <code>whoami<\/code> nogmaals aan: nu rapporteert het <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Una variable dinámica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una variable dinámica — una escrita con el twigil <code>*<\/code> — se busca recorriendo hacia afuera la pila de llamadas, no por ámbito léxico.<\/span> <span class=\"sg\" data-s=\"1\">Así, el valor que ve una subrutina depende de quién la llamó, lo que permite que un bloque ejecute el código que invoca bajo una identidad diferente.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declara una variable dinámica <code>$*user<\/code> con el valor <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Escribe una subrutina <code>whoami<\/code> que imprima <code>running as <\/code> seguido del valor actual de <code>$*user<\/code> (por ejemplo, <code>running as guest<\/code>). Debe leer <code>$*user<\/code> directamente — no recibe parámetros.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Llama a <code>whoami<\/code> una vez en el nivel superior: reporta <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Luego, dentro de un bloque que redeclara <code>$*user<\/code> como <code>'admin'<\/code>, llama a la <em>misma<\/em> <code>whoami<\/code> de nuevo: ahora reporta <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Una variabile dinamica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una variabile dinamica — scritta con il twigil <code>*<\/code> — viene cercata esplorando verso l'esterno lo stack delle chiamate, non tramite lo scope lessicale.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il valore che una subroutine vede dipende da chi l'ha chiamata, il che permette a un blocco di eseguire il codice che chiama sotto un'identita' diversa.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Dichiara una variabile dinamica <code>$*user<\/code> con il valore <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Scrivi una subroutine <code>whoami<\/code> che stampa <code>running as <\/code> seguito dal valore corrente di <code>$*user<\/code> (ad esempio, <code>running as guest<\/code>). Deve leggere <code>$*user<\/code> direttamente — non accetta parametri.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Chiama <code>whoami<\/code> una volta al livello superiore: riporta <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poi, all'interno di un blocco che ridichiara <code>$*user<\/code> come <code>'admin'<\/code>, chiama la <em>stessa<\/em> <code>whoami<\/code> di nuovo: ora riporta <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Dinamisks mainīgais","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dinamisks mainīgais — tāds, kas rakstīts ar tvigilu <code>*<\/code> — tiek meklēts, virzoties uz āru pa izsaukumu steku, nevis pēc leksiskā redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"1\">Tātad vērtība, ko apakšprogramma redz, ir atkarīga no tā, kas to izsaucis, un tas ļauj blokam izpildīt izsaukto kodu ar citu identitāti.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklarējiet dinamisku mainīgo <code>$*user<\/code> ar vērtību <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Uzrakstiet apakšprogrammu <code>whoami<\/code>, kas izdrukā <code>running as <\/code> un tam sekojošu pašreizējo <code>$*user<\/code> (piemēram, <code>running as guest<\/code>). Tai <code>$*user<\/code> jānolasa tieši — tā neņem nevienu parametru.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Izsauciet <code>whoami<\/code> vienreiz augšējā līmenī: tā ziņo <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Pēc tam blokā, kas <code>$*user<\/code> pārdeklarē kā <code>'admin'<\/code>, izsauciet <em>to pašu<\/em> <code>whoami<\/code> vēlreiz: tagad tā ziņo <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Динамическая переменная","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Динамическая переменная — та, что записывается с твигилом <code>*<\/code> — ищется не по лексической области видимости, а путём обхода стека вызовов наружу.<\/span> <span class=\"sg\" data-s=\"1\">Таким образом, значение, которое видит подпрограмма, зависит от того, кто её вызвал, что позволяет блоку выполнять вызываемый код в другом контексте.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Объявите динамическую переменную <code>$*user<\/code> со значением <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишите подпрограмму <code>whoami<\/code>, которая выводит <code>running as <\/code>, за которым следует текущее значение <code>$*user<\/code> (например, <code>running as guest<\/code>). Она должна читать <code>$*user<\/code> напрямую — без параметров.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Вызовите <code>whoami<\/code> один раз на верхнем уровне: она выведет <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Затем внутри блока, который переобъявляет <code>$*user<\/code> как <code>'admin'<\/code>, вызовите ту же самую <code>whoami<\/code> снова: теперь она выведет <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Динамічна змінна»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Динамічну змінну — записану з твіґілом <code>*<\/code> — шукають, рухаючись назовні по стеку викликів, а не за лексичною областю видимості.<\/span> <span class=\"sg\" data-s=\"1\">Тож значення, яке бачить підпрограма, залежить від того, хто її викликав, і це дозволяє блоку виконувати викликаний ним код під іншою особистістю.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Оголосіть динамічну змінну <code>$*user<\/code> зі значенням <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишіть підпрограму <code>whoami<\/code>, яка виводить <code>running as <\/code>, а за ним — поточне значення <code>$*user<\/code> (наприклад, <code>running as guest<\/code>). Вона має читати <code>$*user<\/code> безпосередньо — параметрів вона не приймає.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Викличте <code>whoami<\/code> один раз на верхньому рівні: вона повідомляє <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Потім усередині блоку, який перевизначає <code>$*user<\/code> як <code>'admin'<\/code>, викличте <em>ту саму<\/em> <code>whoami<\/code> знову: тепер вона повідомляє <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Динамична променлива","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Динамичната променлива — написана с туигила <code>*<\/code> — се търси чрез обхождане навън през стека на извикванията, а не чрез лексикален обхват.<\/span> <span class=\"sg\" data-s=\"1\">Така стойността, която подпрограмата вижда, зависи от това кой я е извикал, което позволява на блок да изпълни кода, който извиква, под различна идентичност.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Декларирайте динамична променлива <code>$*user<\/code> със стойност <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишете подпрограма <code>whoami<\/code>, която отпечатва <code>running as <\/code>, последвано от текущата <code>$*user<\/code> (например <code>running as guest<\/code>). Тя трябва да чете <code>$*user<\/code> директно — не приема параметри.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Извикайте <code>whoami<\/code> веднъж на най-горното ниво: тя докладва <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">След това, вътре в блок, който предекларира <code>$*user<\/code> като <code>'admin'<\/code>, извикайте <em>същата<\/em> <code>whoami<\/code> отново: сега тя докладва <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Dinamika variablo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dinamika variablo — skribita kun la tvigilo <code>*<\/code> — estas serĉata per trarigardo eksteren tra la voka stako, ne per leksika amplekso.<\/span> <span class=\"sg\" data-s=\"1\">Do la valoro, kiun subrutino vidas, dependas de tiu, kiu vokis ĝin, kio ebligas al bloko ruli la kodon, kiun ĝi vokas, sub malsama identeco.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklaru dinamikan variablon <code>$*user<\/code> kun la valoro <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Skribu subrutinon <code>whoami<\/code>, kiu presas <code>running as <\/code> sekvatan de la nuna <code>$*user<\/code> (ekzemple, <code>running as guest<\/code>). Ĝi devas legi <code>$*user<\/code> rekte — ĝi prenas neniun parametron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Voku <code>whoami<\/code> unufoje ĉe la supra nivelo: ĝi raportas <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poste, ene de bloko kiu redeklaras <code>$*user<\/code> kiel <code>'admin'<\/code>, voku la <em>saman<\/em> <code>whoami<\/code> denove: ĝi nun raportas <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]}}}</script>
