> y luego <code>'cherry'<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dentro de la cadena, <code>$_<\/code> interpola la palabra actual, y la llamada con punto inicial <code>.chars<\/code> — abreviatura de <code>$_.chars<\/code> — devuelve su longitud. Ambas se refieren al mismo tópico, por eso el conteo siempre coincide con la palabra en la línea.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: La variabile topic","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for 'apple', 'fig', 'cherry' {\n    say \"$_ has {.chars} letters\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/topic-variable.raku\" target=\"_blank\" rel=\"noopener\">topic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>apple has 5 letters\nfig has 3 letters\ncherry has 6 letters<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un ciclo <code>for<\/code> imposta la variabile topic <code>$_<\/code> a ciascun elemento a turno, quindi il blocco viene eseguito tre volte, con <code>$_<\/code> uguale a <code>'apple'<\/code>, poi <code>'fig'<\/code>, poi <code>'cherry'<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">All'interno della stringa, <code>$_<\/code> interpola la parola corrente, e la chiamata con punto iniziale <code>.chars<\/code> — abbreviazione di <code>$_.chars<\/code> — ne restituisce la lunghezza. Entrambe si riferiscono allo stesso topic, motivo per cui il conteggio corrisponde sempre alla parola sulla riga.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Tēmas ma code> дорівнює <code>'apple'<\/code>, потім <code>'fig'<\/code>, потім <code>'cherry'<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Усередині рядка <code>$_<\/code> інтерполює поточне слово, а виклик <code>.chars<\/code> із провідною крапкою — скорочення від <code>$_.chars<\/code> — дає його довжину. Обидва посилаються на той самий топік, тому кількість завжди відповідає слову в рядку.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Тематичната променлива","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for 'apple', 'fig', 'cherry' {\n    say \"$_ has {.chars} letters\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/topic-variable.raku\" target=\"_blank\" rel=\"noopener\">topic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>apple has 5 letters\nfig has 3 letters\ncherry has 6 letters<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикълът <code>for<\/code> задава тематичната променлива <code>$_<\/code> на всеки елемент последователно, така че блокът се изпълнява три пъти, като <code>$_<\/code> е равна на <code>'apple'<\/code>, после <code>'fig'<\/code>, после <code>'cherry'<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вътре в низа <code>$_<\/code> интерполира текущата дума, а извикването с водеща точка <code>.chars<\/code> — съкратено от <code>$_.chars<\/code> — дава нейната дължина. И двете се отнасят до една и съща тема, затова броят винаги съответства на думата на реда.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: La temv
