<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/override-dynamic","n":413,"k":"exercise","pv":"advanced/special-variables/exercises/a-dynamic-variable/solution","nx":"advanced/special-variables/exercises/override-dynamic/solution","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"Exercise ’Override the dynamic‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Show how a dynamic variable flows through an intermediate routine that knows nothing about it.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Write a <code>log-it($msg)<\/code> subroutine that prints the message prefixed with a dynamic variable <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Write a second subroutine <code>task<\/code> that simply calls <code>log-it('working')<\/code> — and never mentions <code>$*prefix<\/code> itself.<\/span> <span class=\"sg\" data-s=\"2\">Then call <code>task<\/code> twice, each time from inside a block that sets <code>$*prefix<\/code> to a different value (<code>INFO<\/code>, then <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Die dynamische Variable überschreiben","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zeige, wie eine dynamische Variable durch eine Zwischenroutine hindurchfließt, die nichts von ihr weiß.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Schreibe eine Subroutine <code>log-it($msg)<\/code>, die die Nachricht mit einer dynamischen Variablen <code>$*prefix<\/code> als Präfix ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">Schreibe eine zweite Subroutine <code>task<\/code>, die einfach <code>log-it('working')<\/code> aufruft — und <code>$*prefix<\/code> selbst nie erwähnt.<\/span> <span class=\"sg\" data-s=\"2\">Rufe dann <code>task<\/code> zweimal auf, jedes Mal aus einem Block heraus, der <code>$*prefix<\/code> auf einen anderen Wert setzt (<code>INFO<\/code>, dann <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"De dynamische overschrijven","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laat zien hoe een dynamische variabele door een tussenliggende routine stroomt die er niets van afweet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Schrijf een subroutine <code>log-it($msg)<\/code> die het bericht print met een dynamische variabele <code>$*prefix<\/code> ervoor.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf een tweede subroutine <code>task<\/code> die simpelweg <code>log-it('working')<\/code> aanroept — en zelf nooit <code>$*prefix<\/code> noemt.<\/span> <span class=\"sg\" data-s=\"2\">Roep vervolgens <code>task<\/code> twee keer aan, telkens vanuit een blok dat <code>$*prefix<\/code> op een andere waarde zet (<code>INFO<\/code>, dan <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Sobrescribir la dinámica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Muestra cómo una variable dinámica fluye a través de una rutina intermedia que no sabe nada sobre ella.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Escribe una subrutina <code>log-it($msg)<\/code> que imprima el mensaje precedido por una variable dinámica <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Escribe una segunda subrutina <code>task<\/code> que simplemente llame a <code>log-it('working')<\/code> — y nunca mencione <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Luego llama a <code>task<\/code> dos veces, cada vez desde dentro de un bloque que establece <code>$*prefix<\/code> con un valor diferente (<code>INFO<\/code>, luego <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Sovrascrivere la dinamica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mostra come una variabile dinamica fluisce attraverso una routine intermedia che non ne sa nulla.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scrivi una subroutine <code>log-it($msg)<\/code> che stampa il messaggio preceduto da una variabile dinamica <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Scrivi una seconda subroutine <code>task<\/code> che semplicemente chiama <code>log-it('working')<\/code> — e non menziona mai <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi chiama <code>task<\/code> due volte, ogni volta dall'interno di un blocco che imposta <code>$*prefix<\/code> a un valore diverso (<code>INFO<\/code>, poi <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Pārrakstīt dinamisko","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Parādiet, kā dinamisks mainīgais plūst cauri starprutīnai, kas par to neko nezina.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet apakšprogrammu <code>log-it($msg)<\/code>, kas izdrukā paziņojumu ar priekšā liktu dinamisko mainīgo <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Uzrakstiet otru apakšprogrammu <code>task<\/code>, kas vienkārši izsauc <code>log-it('working')<\/code> — un pati <code>$*prefix<\/code> nekad nepiemin.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam izsauciet <code>task<\/code> divreiz, katru reizi no bloka, kas <code>$*prefix<\/code> uzstāda uz citu vērtību (<code>INFO<\/code>, tad <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Переопределение динамической переменной","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Покажите, как динамическая переменная проходит через промежуточную подпрограмму, которая ничего о ней не знает.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Напишите подпрограмму <code>log-it($msg)<\/code>, которая выводит сообщение с префиксом из динамической переменной <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Напишите вторую подпрограмму <code>task<\/code>, которая просто вызывает <code>log-it('working')<\/code> и никогда не упоминает <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затем вызовите <code>task<\/code> дважды, каждый раз из блока, в котором <code>$*prefix<\/code> задаётся разными значениями (<code>INFO<\/code>, затем <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Перекрийте динамічну»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Покажіть, як динамічна змінна перетікає крізь проміжну підпрограму, яка про неї нічого не знає.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Напишіть підпрограму <code>log-it($msg)<\/code>, яка виводить повідомлення з префіксом із динамічної змінної <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Напишіть другу підпрограму <code>task<\/code>, яка просто викликає <code>log-it('working')<\/code> — і сама ніколи не згадує <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потім викличте <code>task<\/code> двічі, щоразу зсередини блоку, який встановлює <code>$*prefix<\/code> в інше значення (<code>INFO<\/code>, а потім <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Презаписване на динамична променлива","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Покажете как динамичната променлива преминава през междинна подпрограма, която не знае нищо за нея.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>log-it($msg)<\/code>, която отпечатва съобщението с префикс от динамичната променлива <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Напишете втора подпрограма <code>task<\/code>, която просто извиква <code>log-it('working')<\/code> — и никога не споменава <code>$*prefix<\/code> сама.<\/span> <span class=\"sg\" data-s=\"2\">След това извикайте <code>task<\/code> два пъти, всеки път от вътре на блок, който задава <code>$*prefix<\/code> на различна стойност (<code>INFO<\/code>, след това <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Superregi la dinamikan","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Montru kiel dinamika variablo fluas tra meza subrutino, kiu scias nenion pri ĝi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Skribu subrutinon <code>log-it($msg)<\/code>, kiu presas la mesaĝon prefiksitan per dinamika variablo <code>$*prefix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Skribu duan subrutinon <code>task<\/code>, kiu simple vokas <code>log-it('working')<\/code> — kaj neniam mencias <code>$*prefix<\/code> mem.<\/span> <span class=\"sg\" data-s=\"2\">Poste voku <code>task<\/code> dufoje, ĉiufoje el ene de bloko, kiu agordas <code>$*prefix<\/code> al malsama valoro (<code>INFO<\/code>, poste <code>DEBUG<\/code>).<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/override-dynamic/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]}}}</script>
