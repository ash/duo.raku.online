<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/override-dynamic/solution","n":414,"k":"solution","pv":"advanced/special-variables/exercises/override-dynamic","nx":"advanced/special-variables/exercises/topic-variable","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"The solution of ’Override the dynamic‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> calls <code>log-it<\/code> but never mentions <code>$*prefix<\/code>. The value still reaches <code>log-it<\/code>, because dynamic lookup follows the call stack outward — past <code>task<\/code> — to whoever is on the stack at the time.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The two blocks set different values, so the <em>same<\/em> <code>task()<\/code> call produces a different prefix each time. This is what makes dynamic variables useful: context flows into deeply nested code without being threaded through every intermediate routine as an argument.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Die dynamische Variable überschreiben","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> ruft <code>log-it<\/code> auf, erwähnt aber nie <code>$*prefix<\/code>. Der Wert erreicht <code>log-it<\/code> trotzdem, weil die dynamische Auflösung dem Aufrufstapel nach außen folgt — an <code>task<\/code> vorbei — zu demjenigen, der sich gerade auf dem Stapel befindet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die beiden Blöcke setzen unterschiedliche Werte, sodass derselbe <code>task()<\/code>-Aufruf jedes Mal ein anderes Präfix erzeugt. Das macht dynamische Variablen nützlich: Kontext fließt in tief verschachtelten Code, ohne durch jede Zwischenroutine als Argument durchgereicht zu werden.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: De dynamische overschrijven","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> roept <code>log-it<\/code> aan maar noemt nooit <code>$*prefix<\/code>. De waarde bereikt <code>log-it<\/code> toch, omdat dynamisch opzoeken de call stack naar buiten volgt — voorbij <code>task<\/code> — naar wie er op dat moment op de stack staat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De twee blokken stellen verschillende waarden in, dus dezelfde <code>task()<\/code>-aanroep produceert elke keer een ander prefix. Dit is wat dynamische variabelen nuttig maakt: context stroomt naar diep geneste code zonder als argument door elke tussenliggende routine te worden geleid.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Sobrescribir la dinámica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> llama a <code>log-it<\/code> pero nunca menciona <code>$*prefix<\/code>. El valor aún llega a <code>log-it<\/code>, porque la búsqueda dinámica sigue la pila de llamadas hacia afuera — pasando por <code>task<\/code> — hasta quien esté en la pila en ese momento.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los dos bloques establecen valores diferentes, así que la <em>misma<\/em> llamada a <code>task()<\/code> produce un prefijo diferente cada vez. Esto es lo que hace útiles a las variables dinámicas: el contexto fluye hacia código profundamente anidado sin necesidad de pasarlo a través de cada rutina intermedia como argumento.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Sovrascrivere la dinamica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> chiama <code>log-it<\/code> ma non menziona mai <code>$*prefix<\/code>. Il valore raggiunge comunque <code>log-it<\/code>, perche' la ricerca dinamica segue lo stack delle chiamate verso l'esterno — oltre <code>task<\/code> — fino a chi si trova nello stack in quel momento.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">I due blocchi impostano valori diversi, quindi la <em>stessa<\/em> chiamata <code>task()<\/code> produce un prefisso diverso ogni volta. Questo e' cio' che rende utili le variabili dinamiche: il contesto fluisce nel codice profondamente annidato senza dover essere passato attraverso ogni routine intermedia come argomento.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pārrakstīt dinamisko","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> izsauc <code>log-it<\/code>, taču <code>$*prefix<\/code> nekad nepiemin. Vērtība tomēr sasniedz <code>log-it<\/code>, jo dinamiskā meklēšana seko izsaukumu stekam uz āru — garām <code>task<\/code> — līdz tam, kas tajā brīdī ir stekā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abi bloki uzstāda dažādas vērtības, tāpēc <em>viens un tas pats<\/em> izsaukums <code>task()<\/code> katrreiz dod citu priedēkli. Tieši tas padara dinamiskos mainīgos noderīgus: konteksts ieplūst dziļi ligzdotā kodā, netiekot izvilkts cauri katrai starprutīnai kā arguments.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Переопределение динамической переменной","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-it($msg) {\n    say \"$*prefix: $msg\";\n}\n\nsub task {\n    log-it('working');\n}\n\n{\n    my $*prefix = 'INFO';\n    task();\n}\n\n{\n    my $*prefix = 'DEBUG';\n    task();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/override-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> вызывает <code>log-it<\/code>, но никогда не упоминает <code>$*prefix<\/code>. Тем не менее значение достигает <code>log-it<\/code>, потому что динамический поиск следует по стеку вызовов наружу — через <code>task<\/code> — к тому, кто находится на стеке в данный момент.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Два блока задают разные значения, поэтому один и тот же вызов <code>task()<\/code> каждый раз выдаёт разный префикс. Именно это делает динамические переменные полезными: контекст проникает в глубоко вложенный код без необходимости передавать его через каждую промежуточную подпро ride-dynamic.raku\" target=\"_blank\" rel=\"noopener\">override-dynamic.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>INFO: working\nDEBUG: working<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>task<\/code> vokas <code>log-it<\/code> sed neniam mencias <code>$*prefix<\/code>. La valoro tamen atingas <code>log-it<\/code>, ĉar dinamika serĉado sekvas la vokan stakon eksteren — preter <code>task<\/code> — al tiu, kiu estas sur la stako en tiu momento.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La du blokoj agordas malsamajn valorojn, do la <em>sama<\/em> voko <code>task()<\/code> produktas malsaman prefikson ĉiufoje. Jen kio faras dinamikajn variablojn utilaj: kunteksto fluas en profunde nestitan kodon sen esti pasigita tra ĉiu meza subrutino kiel argumento.<\/span><\/li><\/ol>"]]}}}</script>
