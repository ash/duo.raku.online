<script type="application/json" id="page-data">{"u":"advanced/special-variables/built-in","n":408,"k":"topic","pv":"advanced/special-variables/dynamic-variables/quiz","nx":"advanced/special-variables/built-in/quiz","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"Built-in special variables","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku predefines a set of variables for you.<\/span> <span class=\"sg\" data-s=\"1\">Most of them are <em>dynamic<\/em> (the <code>*<\/code> twigil), so — as you saw with <a href=\"/advanced/special-variables/dynamic-variables/\">dynamic variables<\/a> — you can read them anywhere and even override them for a scope.<\/span> <span class=\"sg\" data-s=\"2\">Here are the ones you will reach for most often.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standard streams<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Input and output flow through three dynamic variables: <code>$*OUT<\/code> (standard output), <code>$*ERR<\/code> (standard error), and <code>$*IN<\/code> (standard input).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> and <code>print<\/code> write to <code>$*OUT<\/code>; to send text to standard error instead, call the method on <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because these are dynamic, redirecting <code>$*OUT<\/code> in a block sends the output of everything called inside that block to the new destination — without changing any of that code.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The program and its process<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A few variables describe the running program itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Their values change from run to run, so no fixed output is shown here.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Command line and environment<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The arguments and the environment arrive in two ready-made containers:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — the list of command-line arguments (the same ones a <code>MAIN<\/code> subroutine receives)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — the environment variables, as a hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">These built-ins save you from wiring up the same information by hand.<\/span> <span class=\"sg\" data-s=\"1\">And because they are dynamic, looked up through the call stack, any <code>$*<\/code> built-in can be overridden for a scope exactly like a <code>$*<\/code> variable of your own.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alongside these dynamic variables, Raku also has the compile-time <code>?<\/code> built-ins — <code>$?FILE<\/code> and <code>$?LINE<\/code> — which you already met on the <a href=\"/advanced/special-variables/twigils/\">twigils<\/a> page.<\/span><\/p>"]]},"de":{"t":"Eingebaute spezielle Variablen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku definiert eine Reihe von Variablen für dich vor.<\/span> <span class=\"sg\" data-s=\"1\">Die meisten davon sind <em>dynamisch<\/em> (das <code>*<\/code>-Twigil), also kannst du sie — wie du bei den <a href=\"https://course.raku.org/de/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamischen Variablen<\/a> gesehen hast — überall lesen und sogar für einen Geltungsbereich überschreiben.<\/span> <span class=\"sg\" data-s=\"2\">Hier sind diejenigen, die du am häufigsten brauchen wirst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standardströme<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein- und Ausgabe fließen durch drei dynamische Variablen: <code>$*OUT<\/code> (Standardausgabe), <code>$*ERR<\/code> (Standardfehlerausgabe) und <code>$*IN<\/code> (Standardeingabe).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> und <code>print<\/code> schreiben nach <code>$*OUT<\/code>; um Text stattdessen an die Standardfehlerausgabe zu senden, rufst du die Methode auf <code>$*ERR<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da diese dynamisch sind, leitet das Umdeklarieren von <code>$*OUT<\/code> in einem Block die Ausgabe von allem, was innerhalb dieses Blocks aufgerufen wird, an das neue Ziel um — ohne irgendetwas an diesem Code zu ändern.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das Programm und sein Prozess<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige Variablen beschreiben das laufende Programm selbst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ihre Werte ändern sich von Ausführung zu Ausführung, daher wird hier keine feste Ausgabe gezeigt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommandozeile und Umgebung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Argumente und die Umgebung kommen in zwei vorgefertigten Containern:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — die Liste der Kommandozeilenargumente (dieselben, die eine <code>MAIN<\/code>-Subroutine empfängt)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — die Umgebungsvariablen als Hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese eingebauten Variablen ersparen dir, dieselben Informationen von Hand zu verdrahten.<\/span> <span class=\"sg\" data-s=\"1\">Und weil sie dynamisch sind und über den Aufrufstapel aufgelöst werden, kann jede <code>$*<\/code>-eingebaute Variable für einen Geltungsbereich genau wie eine eigene <code>$*<\/code>-Variable überschrieben werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Neben diesen dynamischen Variablen hat Raku auch die <code>?<\/code>-Kompilierzeit-Variablen — <code>$?FILE<\/code> und <code>$?LINE<\/code> — die du bereits auf der Seite über <a href=\"https://course.raku.org/de/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">Twigils<\/a> kennengelernt hast.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde speciale variabelen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku definieert een reeks variabelen voor je vooraf.<\/span> <span class=\"sg\" data-s=\"1\">De meeste zijn <em>dynamisch<\/em> (de <code>*<\/code>-twigil), dus — zoals je zag bij <a href=\"https://course.raku.org/nl/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamische variabelen<\/a> — kun je ze overal uitlezen en zelfs voor een bepaalde scope overschrijven.<\/span> <span class=\"sg\" data-s=\"2\">Hier zijn de variabelen die je het vaakst zult gebruiken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standaardstreams<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Invoer en uitvoer lopen via drie dynamische variabelen: <code>$*OUT<\/code> (standaarduitvoer), <code>$*ERR<\/code> (standaardfout) en <code>$*IN<\/code> (standaardinvoer).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> en <code>print<\/code> schrijven naar <code>$*OUT<\/code>; om tekst naar standaardfout te sturen, roep je de methode aan op <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat deze dynamisch zijn, stuurt het omleiden van <code>$*OUT<\/code> in een blok de uitvoer van alles wat binnen dat blok wordt aangeroepen naar de nieuwe bestemming — zonder die code te hoeven aanpassen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het programma en zijn proces<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een paar variabelen beschrijven het draaiende programma zelf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hun waarden veranderen per uitvoering, dus er wordt hier geen vaste uitvoer getoond.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commandoregel en omgeving<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De argumenten en de omgevingsvariabelen komen aan in twee kant-en-klare containers:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — de lijst met commandoregelargumenten (dezelfde die een <code>MAIN<\/code>-subroutine ontvangt)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — de omgevingsvariabelen, als een hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze ingebouwde variabelen besparen je het handmatig opzetten van dezelfde informatie.<\/span> <span class=\"sg\" data-s=\"1\">En omdat ze dynamisch zijn en via de call stack worden opgezocht, kan elke <code>$*<\/code>-ingebouwde variabele voor een scope worden overschreven, precies zoals een eigen <code>$*<\/code>-variabele.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Naast deze dynamische variabelen heeft Raku ook de compile-time <code>?<\/code>-ingebouwde variabelen — <code>$?FILE<\/code> en <code>$?LINE<\/code> — die je al bent tegengekomen op de pagina over <a href=\"https://course.raku.org/nl/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigils<\/a>.<\/span><\/p>"]]},"es":{"t":"Variables especiales integradas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku predefine un conjunto de variables para ti.<\/span> <span class=\"sg\" data-s=\"1\">La mayoría de ellas son <em>dinámicas<\/em> (el twigil <code>*<\/code>), así que — como viste con las <a href=\"https://course.raku.org/es/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variables dinámicas<\/a> — puedes leerlas en cualquier lugar e incluso anularlas para un ámbito.<\/span> <span class=\"sg\" data-s=\"2\">Estas son las que usarás con más frecuencia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Flujos estándar<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La entrada y salida fluyen a través de tres variables dinámicas: <code>$*OUT<\/code> (salida estándar), <code>$*ERR<\/code> (error estándar) y <code>$*IN<\/code> (entrada estándar).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> y <code>print<\/code> escriben en <code>$*OUT<\/code>; para enviar texto al error estándar, llama al método sobre <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como son dinámicas, redirigir <code>$*OUT<\/code> en un bloque envía la salida de todo lo que se llame dentro de ese bloque al nuevo destino — sin cambiar nada de ese código.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El programa y su proceso<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunas variables describen el programa en ejecución:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sus valores cambian de una ejecución a otra, por lo que aquí no se muestra una salida fija.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Línea de comandos y entorno<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los argumentos y el entorno llegan en dos contenedores predefinidos:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la lista de argumentos de línea de comandos (los mismos que recibe una subrutina <code>MAIN<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — las variables de entorno, como un hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas variables integradas te ahorran tener que configurar la misma información manualmente.<\/span> <span class=\"sg\" data-s=\"1\">Y como son dinámicas, buscadas a través de la pila de llamadas, cualquier variable integrada <code>$*<\/code> puede anularse para un ámbito exactamente como una variable <code>$*<\/code> propia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Junto a estas variables dinámicas, Raku también tiene las variables integradas de tiempo de compilación <code>?<\/code> — <code>$?FILE<\/code> y <code>$?LINE<\/code> — que ya conociste en la página de <a href=\"https://course.raku.org/es/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigils<\/a>.<\/span><\/p>"]]},"it":{"t":"Variabili speciali integrate","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku predefinisce un insieme di variabili per te.<\/span> <span class=\"sg\" data-s=\"1\">La maggior parte di esse sono <em>dinamiche<\/em> (il twigil <code>*<\/code>), quindi — come hai visto con le <a href=\"https://course.raku.org/it/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabili dinamiche<\/a> — puoi leggerle ovunque e persino sovrascriverle per un determinato scope.<\/span> <span class=\"sg\" data-s=\"2\">Ecco quelle che userai piu' spesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stream standard<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'input e l'output passano attraverso tre variabili dinamiche: <code>$*OUT<\/code> (standard output), <code>$*ERR<\/code> (standard error) e <code>$*IN<\/code> (standard input).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> e <code>print<\/code> scrivono su <code>$*OUT<\/code>; per inviare testo allo standard error, chiama il metodo su <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiche' queste sono dinamiche, reindirizzare <code>$*OUT<\/code> in un blocco invia l'output di tutto cio' che viene chiamato all'interno di quel blocco alla nuova destinazione — senza modificare nessuna parte di quel codice.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il programma e il suo processo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcune variabili descrivono il programma in esecuzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I loro valori cambiano ad ogni esecuzione, quindi qui non viene mostrato un output fisso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Riga di comando e ambiente<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti e l'ambiente arrivano in due contenitori gia' pronti:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la lista degli argomenti da riga di comando (gli stessi che riceve una subroutine <code>MAIN<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — le variabili d'ambiente, come hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Queste variabili predefinite ti evitano di configurare manualmente le stesse informazioni.<\/span> <span class=\"sg\" data-s=\"1\">E poiche' sono dinamiche, cercate attraverso lo stack delle chiamate, qualsiasi variabile predefinita <code>$*<\/code> puo' essere sovrascritta per uno scope esattamente come una variabile <code>$*<\/code> creata da te.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oltre a queste variabili dinamiche, Raku ha anche le variabili predefinite di compilazione con il twigil <code>?<\/code> — <code>$?FILE<\/code> e <code>$?LINE<\/code> — che hai gia' incontrato nella pagina sui <a href=\"https://course.raku.org/it/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigil<\/a>.<\/span><\/p>"]]},"lv":{"t":"Iebūvētie speciālie mainīgie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku jums iepriekš definē virkni mainīgo.<\/span> <span class=\"sg\" data-s=\"1\">Vairums no tiem ir <em>dinamiski<\/em> (tvigils <code>*<\/code>), tāpēc — kā redzējāt pie <a href=\"https://course.raku.org/lv/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamiskajiem mainīgajiem<\/a> — tos var nolasīt jebkur un pat pārmākt kādam redzamības apgabalam.<\/span> <span class=\"sg\" data-s=\"2\">Lūk, tie, pie kuriem ķersieties visbiežāk.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standarta plūsmas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievade un izvade plūst caur trim dinamiskiem mainīgajiem: <code>$*OUT<\/code> (standarta izvade), <code>$*ERR<\/code> (standarta kļūdas) un <code>$*IN<\/code> (standarta ievade).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> un <code>print<\/code> raksta uz <code>$*OUT<\/code>; lai tekstu tā vietā nosūtītu uz standarta kļūdām, izsauciet metodi uz <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā tie ir dinamiski, <code>$*OUT<\/code> novirzīšana blokā nosūta uz jauno galamērķi visu, ko izvada šajā blokā izsauktais kods, — neko no šī koda nemainot.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma un tās process<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži mainīgie apraksta pašu darbojošos programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To vērtības katrā palaišanas reizē mainās, tāpēc noteikta izvade šeit nav parādīta.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komandrinda un vide<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumenti un vide pienāk divos gatavos konteineros:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — komandrindas argumentu saraksts (tie paši, ko saņem apakšprogramma <code>MAIN<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — vides mainīgie kā jauktenis<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šie iebūvētie mainīgie pasargā jūs no to pašu ziņu savākšanas ar roku.<\/span> <span class=\"sg\" data-s=\"1\">Un, tā kā tie ir dinamiski un tiek meklēti caur izsaukumu steku, jebkuru <code>$*<\/code> iebūvēto mainīgo var pārmākt kādam redzamības apgabalam tieši tāpat kā savu paša <code>$*<\/code> mainīgo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Līdzās šiem dinamiskajiem mainīgajiem Raku ir arī kompilēšanas laika <code>?<\/code> iebūvētie mainīgie — <code>$?FILE<\/code> un <code>$?LINE<\/code> —, ar kuriem jau iepazināties <a href=\"https://course.raku.org/lv/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">tvigilu<\/a> lappusē.<\/span><\/p>"]]},"ru":{"t":"Встроенные специальные переменные","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku предоставляет набор предопределённых переменных.<\/span> <span class=\"sg\" data-s=\"1\">Большинство из них <em>динамические<\/em> (с твигилом <code>*<\/code>), поэтому — как вы видели на примере <a href=\"https://course.raku.org/ru/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамических переменных<\/a> — вы можете читать их где угодно и даже перекрывать их для определённой области видимости.<\/span> <span class=\"sg\" data-s=\"2\">Вот те из них, которые вам понадобятся чаще всего.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартные потоки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ввод и вывод проходят через три динамические переменные: <code>$*OUT<\/code> (стандартный вывод), <code>$*ERR<\/code> (стандартный поток ошибок) и <code>$*IN<\/code> (стандартный ввод).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> и <code>print<\/code> пишут в <code>$*OUT<\/code>; чтобы отправить текст в стандартный поток ошибок, вызовите метод у <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку эти переменные динамические, перенаправление <code>$*OUT<\/code> в блоке направляет вывод всего, что вызывается внутри этого блока, в новое место назначения — без изменения какого-либо кода.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Программа и её процесс<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Несколько переменных описывают саму запущенную программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Их значения меняются от запуска к запуску, поэтому фиксированный вывод здесь не показан.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Командная строка и окружение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аргументы и окружение поступают в два готовых контейнера:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — список аргументов командной строки (те же, которые получает подпрограмма <code>MAIN<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — переменные окружения в виде хэша<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти встроенные переменные избавляют вас от необходимости настраивать ту же информацию вручную.<\/span> <span class=\"sg\" data-s=\"1\">А поскольку они динамические и ищутся по стеку вызовов, любую встроенную переменную с <code>$*<\/code> можно перекрыть для области видимости точно так же, как и собственную переменную с <code>$*<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Помимо этих динамических переменных, в Raku также есть встроенные переменные времени компиляции с твигилом <code>?<\/code> — <code>$?FILE<\/code> и <code>$?LINE<\/code> — с которыми вы уже познакомились на странице о <a href=\"https://course.raku.org/ru/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">твигилах<\/a>.<\/span><\/p>"]]},"uk":{"t":"Вбудовані спеціальні змінні","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku наперед визначає для вас набір змінних.<\/span> <span class=\"sg\" data-s=\"1\">Більшість із них є <em>динамічними<\/em> (твіґіл <code>*<\/code>), тож — як ви бачили з <a href=\"https://course.raku.org/uk/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамічними змінними<\/a> — їх можна читати будь-де й навіть перекривати в межах області видимості.<\/span> <span class=\"sg\" data-s=\"2\">Ось ті, до яких ви звертатиметеся найчастіше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартні потоки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Введення й виведення проходять через три динамічні змінні: <code>$*OUT<\/code> (стандартний вивід), <code>$*ERR<\/code> (стандартний потік помилок) та <code>$*IN<\/code> (стандартне введення).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> і <code>print<\/code> пишуть у <code>$*OUT<\/code>; щоб натомість надіслати текст у стандартний потік помилок, викличте метод на <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # іде в стандартний вивід\n$*ERR.say('a diagnostic');  # іде в стандартний потік помилок<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки вони динамічні, перенаправлення <code>$*OUT<\/code> у блоці спрямовує вивід усього, що викликано всередині цього блоку, до нового призначення — без жодних змін у тому коді.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Програма та її процес<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кілька змінних описують саму запущену програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # шлях до скрипта, який виконується\nsay $*PID;          # ідентифікатор процесу цієї програми\nsay $*CWD;          # поточний робочий каталог<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Їхні значення змінюються від запуску до запуску, тож сталого виводу тут не наведено.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Командний рядок і середовище<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аргументи та середовище надходять у двох готових контейнерах:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — список аргументів командного рядка (тих самих, які отримує підпрограма <code>MAIN<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — змінні середовища у вигляді хеша<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # скільки аргументів було передано\nsay %*ENV&lt;HOME&gt;;  # значення змінної середовища HOME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ці вбудовані змінні позбавляють вас необхідності збирати ті самі відомості вручну.<\/span> <span class=\"sg\" data-s=\"1\">А оскільки вони динамічні й шукаються через стек викликів, будь-яку вбудовану змінну з <code>$*<\/code> можна перекрити в області видимості точно так само, як власну змінну з <code>$*<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поряд із цими динамічними змінними Raku має й компіляційні вбудовані змінні з <code>?<\/code> — <code>$?FILE<\/code> та <code>$?LINE<\/code>, — з якими ви вже зустрічалися на сторінці про <a href=\"https://course.raku.org/uk/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">твіґіли<\/a>.<\/span><\/p>"]]},"bg":{"t":"Вградени специални променливи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku предефинира набор от променливи за вас.<\/span> <span class=\"sg\" data-s=\"1\">Повечето от тях са <em>динамични<\/em> (туигилът <code>*<\/code>), така че — както видяхте при <a href=\"https://course.raku.org/bg/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамичните променливи<\/a> — можете да ги четете навсякъде и дори да ги заменяте за даден обхват.<\/span> <span class=\"sg\" data-s=\"2\">Ето тези, които ще използвате най-често.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартни потоци<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Входът и изходът преминават през три динамични променливи: <code>$*OUT<\/code> (стандартен изход), <code>$*ERR<\/code> (стандартна грешка) и <code>$*IN<\/code> (стандартен вход).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> и <code>print<\/code> пишат в <code>$*OUT<\/code>; за да изпратите текст към стандартната грешка вместо това, извикайте метода върху <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като те са динамични, пренасочването на <code>$*OUT<\/code> в блок изпраща изхода на всичко, извикано вътре в този блок, към новата дестинация — без да променяте нищо от този код.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Програмата и нейният процес<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Няколко променливи описват самата изпълняваща се програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стойностите им се променят при всяко изпълнение, затова тук не е показан фиксиран изход.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Команден ред и среда<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аргументите и средата пристигат в два готови контейнера:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — списъкът с аргументи от командния ред (същите, които подпрограмата <code>MAIN<\/code> получава)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — променливите на средата, като хеш<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тези вградени променливи ви спестяват ръчното свързване на същата информация.<\/span> <span class=\"sg\" data-s=\"1\">И тъй като са динамични, търсени през стека на извикванията, всяка вградена <code>$*<\/code> променлива може да бъде заменена за даден обхват точно както <code>$*<\/code> променлива, създадена от вас.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наред с тези динамични променливи, Raku има и вградените по време на компилация <code>?<\/code> — <code>$?FILE<\/code> и <code>$?LINE<\/code> — които вече срещнахте на страницата за <a href=\"https://course.raku.org/bg/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">туигилите<\/a>.<\/span><\/p>"]]},"eo":{"t":"Enkonstruitaj specialaj variabloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku antaŭdifinas aron de variabloj por vi.<\/span> <span class=\"sg\" data-s=\"1\">Plejparto el ili estas <em>dinamikaj<\/em> (la tvigilo <code>*<\/code>), do — kiel vi vidis ĉe <a href=\"https://course.raku.org/eo/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamikaj variabloj<\/a> — vi povas legi ilin ĉie kaj eĉ anstataŭigi ilin por certa amplekso.<\/span> <span class=\"sg\" data-s=\"2\">Jen tiuj, kiujn vi uzos plej ofte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Normaj fluoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Enigo kaj eligo fluas tra tri dinamikaj variabloj: <code>$*OUT<\/code> (norma eligo), <code>$*ERR<\/code> (norma eraro), kaj <code>$*IN<\/code> (norma enigo).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> kaj <code>print<\/code> skribas al <code>$*OUT<\/code>; por sendi tekston al norma eraro anstataŭe, voku la metodon sur <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar ĉi tiuj estas dinamikaj, redirektado de <code>$*OUT<\/code> en bloko sendas la eligon de ĉio, kio estas vokita ene de tiu bloko, al la nova celo — sen ŝanĝi iun ajn el tiu kodo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La programo kaj ĝia procezo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj variabloj priskribas la rulantan programon mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iliaj valoroj ŝanĝiĝas de ekzekuto al ekzekuto, do neniu fiksa eligo estas montrata ĉi tie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komandlinio kaj medio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La argumentoj kaj la medio alvenas en du pretaj ujo:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la listo de komandliniaj argumentoj (la samaj, kiujn subrutino <code>MAIN<\/code> ricevas)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — la mediaj variabloj, kiel hakilo (asocia tabelo)<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj enkonstruitaj variabloj ŝparas al vi la bezonon mane aranĝi la samajn informojn.<\/span> <span class=\"sg\" data-s=\"1\">Kaj ĉar ili estas dinamikaj, serĉataj tra la voka stako, ĉiu enkonstruita <code>$*<\/code>-variablo povas esti anstataŭigita por certa amplekso precize kiel via propra <code>$*<\/code>-variablo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Krom ĉi tiuj dinamikaj variabloj, Raku ankaŭ havas la kompiltempe enkonstruitajn <code>?<\/code>-variablojn — <code>$?FILE<\/code> kaj <code>$?LINE<\/code> — kiujn vi jam renkontis sur la paĝo pri <a href=\"https://course.raku.org/eo/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">tvigiloj<\/a>.<\/span><\/p>"]]},"la":{"t":"Incorporatae speciales variabiles","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku seriem variabilium pro te praedefinit.<\/span> <span class=\"sg\" data-s=\"1\">Pleraeque <em>dynamicae<\/em> sunt (twigil <code>*<\/code>), itaque — ut apud <a href=\"https://course.raku.org/la/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabiles dynamicas<\/a> vidisti — eas ubique legere et etiam pro circumscriptione superare potes.<\/span> <span class=\"sg\" data-s=\"2\">Ecce eae quas saepissime adhibebis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fluenta vulgaria<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Introitus et exitus per tres variabiles dynamicas fluunt: <code>$*OUT<\/code> (exitus vulgaris), <code>$*ERR<\/code> (error vulgaris) et <code>$*IN<\/code> (introitus vulgaris).<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> et <code>print<\/code> in <code>$*OUT<\/code> scribunt; ut textum ad errorem vulgarem mittas, methodum in <code>$*ERR<\/code> voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # ad exitum vulgarem it\n$*ERR.say('a diagnostic');  # ad errorem vulgarem it<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia hae dynamicae sunt, <code>$*OUT<\/code> in clausula redirigens exitum omnium quae intus vocantur ad novam destinationem mittis — nullo illius codicis mutato.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma et processus eius<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Paucae variabiles ipsum programma currens describunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # semita scripti quod curritur\nsay $*PID;          # identificator processus huius programmatis\nsay $*CWD;          # directoria laboris currens<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valores earum a cursu ad cursum mutantur, itaque nullus exitus fixus hic ostenditur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Linea imperandi et ambitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumenta et ambitus in duobus receptaculis paratis adveniunt:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — series argumentorum lineae imperandi (eadem quae subprogramma <code>MAIN<\/code> accipit)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — variabiles ambitus, ut mappa<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # quot argumenta tradita sint\nsay %*ENV&lt;HOME&gt;;  # valor variabilis ambitus HOME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec inbuilta te ab eadem informatione manu conectenda liberant.<\/span> <span class=\"sg\" data-s=\"1\">Et quia dynamica sunt, per acervum vocationum quaesita, quodlibet inbuiltum <code>$*<\/code> pro circumscriptione superari potest exacte sicut variabilis <code>$*<\/code> tua propria.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Praeter has variabiles dynamicas, Raku etiam inbuilta <code>?<\/code> temporis compilationis habet — <code>$?FILE<\/code> et <code>$?LINE<\/code> — quibus iam in pagina de <a href=\"https://course.raku.org/la/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigiliis<\/a> occurristi.<\/span><\/p>"]]}}}</script>
