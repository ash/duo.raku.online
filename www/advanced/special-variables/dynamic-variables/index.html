<script type="application/json" id="page-data">{"u":"advanced/special-variables/dynamic-variables","n":406,"k":"topic","pv":"advanced/special-variables/twigils/quiz","nx":"advanced/special-variables/dynamic-variables/quiz","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"Dynamic variables","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>dynamic<\/em> variable has the <code>*<\/code> twigil.<\/span> <span class=\"sg\" data-s=\"1\">Unlike a lexical variable, which is visible only in the block where it is declared, a dynamic variable is found by looking <strong>outward through the call stack<\/strong> — through whoever called the current code, no matter where that code is defined.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The subroutine <code>greet<\/code> does not declare <code>$*greeting<\/code> and does not receive it as an argument, yet it can see it, because the variable is dynamic and <code>greet<\/code> was called from a place where it is in scope.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This example would work with a simple global scalar variable <code>$greeting<\/code>, but the nature of dynamic variables will be seen in the next example.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because the lookup follows the call stack, a closer declaration <strong>overrides<\/strong> a farther one for the duration of its block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The same <code>show<\/code> prints <code>outer<\/code> the first time and <code>inner<\/code> when called from inside the block that redeclared <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is <em>dynamic scoping<\/em>, and it is how Raku’s built-in <code>$*OUT<\/code>, <code>$*IN<\/code>, and <code>$*ERR<\/code> work — you can temporarily redirect output by redeclaring <code>$*OUT<\/code> in a block, and every routine you call inside it sees the new value.<\/span> <span class=\"sg\" data-s=\"2\">Dynamic variables are ideal for context that should flow into called code without being passed as an explicit argument.<\/span><\/p>"]]},"de":{"t":"Dynamische Variablen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <em>dynamische<\/em> Variable hat das <code>*<\/code>-Twigil.<\/span> <span class=\"sg\" data-s=\"1\">Anders als eine lexikalische Variable, die nur in dem Block sichtbar ist, in dem sie deklariert wurde, wird eine dynamische Variable gefunden, indem <strong>nach außen durch den Aufrufstapel<\/strong> geschaut wird — durch denjenigen, der den aktuellen Code aufgerufen hat, unabhängig davon, wo dieser Code definiert ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine <code>greet<\/code> deklariert <code>$*greeting<\/code> nicht und empfängt es nicht als Argument, kann es aber trotzdem sehen, weil die Variable dynamisch ist und <code>greet<\/code> von einer Stelle aufgerufen wurde, an der sie im Geltungsbereich liegt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Beispiel würde auch mit einer einfachen globalen Skalarvariablen <code>$greeting<\/code> funktionieren, aber die Natur dynamischer Variablen zeigt sich im nächsten Beispiel.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da die Auflösung dem Aufrufstapel folgt, <strong>überschreibt<\/strong> eine nähere Deklaration eine weiter entfernte für die Dauer ihres Blocks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieselbe <code>show<\/code>-Funktion gibt beim ersten Mal <code>outer<\/code> aus und <code>inner<\/code>, wenn sie aus dem Block heraus aufgerufen wird, der <code>$*level<\/code> neu deklariert hat.<\/span> <span class=\"sg\" data-s=\"1\">Das ist <em>dynamisches Scoping<\/em>, und so funktionieren Rakus eingebaute Variablen <code>$*OUT<\/code>, <code>$*IN<\/code> und <code>$*ERR<\/code> — du kannst die Ausgabe vorübergehend umleiten, indem du <code>$*OUT<\/code> in einem Block neu deklarierst, und jede Routine, die du darin aufrufst, sieht den neuen Wert.<\/span> <span class=\"sg\" data-s=\"2\">Dynamische Variablen sind ideal für Kontext, der in aufgerufenen Code fließen soll, ohne als explizites Argument übergeben zu werden.<\/span><\/p>"]]},"nl":{"t":"Dynamische variabelen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>dynamische<\/em> variabele heeft de <code>*<\/code>-twigil.<\/span> <span class=\"sg\" data-s=\"1\">In tegenstelling tot een lexicale variabele, die alleen zichtbaar is in het blok waar deze is gedeclareerd, wordt een dynamische variabele gevonden door <strong>naar buiten te zoeken via de call stack<\/strong> — door wie de huidige code heeft aangeroepen, ongeacht waar die code is gedefinieerd.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De subroutine <code>greet<\/code> declareert <code>$*greeting<\/code> niet en ontvangt het niet als argument, maar kan het toch zien, omdat de variabele dynamisch is en <code>greet<\/code> werd aangeroepen vanaf een plek waar deze in scope is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit voorbeeld zou ook werken met een eenvoudige globale scalar variabele <code>$greeting<\/code>, maar de aard van dynamische variabelen wordt zichtbaar in het volgende voorbeeld.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat het opzoeken de call stack volgt, <strong>overschrijft<\/strong> een dichterbij liggende declaratie een verder weg liggende voor de duur van het blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dezelfde <code>show<\/code> print <code>outer<\/code> de eerste keer en <code>inner<\/code> wanneer deze wordt aangeroepen vanuit het blok dat <code>$*level<\/code> opnieuw declareerde.<\/span> <span class=\"sg\" data-s=\"1\">Dit is <em>dynamische scoping<\/em>, en zo werken de ingebouwde <code>$*OUT<\/code>, <code>$*IN<\/code> en <code>$*ERR<\/code> van Raku — je kunt uitvoer tijdelijk omleiden door <code>$*OUT<\/code> in een blok opnieuw te declareren, en elke routine die je daarbinnen aanroept ziet de nieuwe waarde.<\/span> <span class=\"sg\" data-s=\"2\">Dynamische variabelen zijn ideaal voor context die naar aangeroepen code moet doorstromen zonder als expliciet argument te worden meegegeven.<\/span><\/p>"]]},"es":{"t":"Variables dinámicas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una variable <em>dinámica<\/em> tiene el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A diferencia de una variable léxica, que solo es visible en el bloque donde se declara, una variable dinámica se encuentra buscando <strong>hacia afuera a través de la pila de llamadas<\/strong> — a través de quien llamó al código actual, sin importar dónde esté definido ese código.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La subrutina <code>greet<\/code> no declara <code>$*greeting<\/code> y no la recibe como argumento, pero puede verla, porque la variable es dinámica y <code>greet<\/code> fue llamada desde un lugar donde está en ámbito.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este ejemplo funcionaría con una simple variable escalar global <code>$greeting<\/code>, pero la naturaleza de las variables dinámicas se verá en el siguiente ejemplo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como la búsqueda sigue la pila de llamadas, una declaración más cercana <strong>anula<\/strong> a una más lejana durante la duración de su bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La misma <code>show<\/code> imprime <code>outer<\/code> la primera vez e <code>inner<\/code> cuando se llama desde dentro del bloque que redeclaró <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es el <em>ámbito dinámico<\/em>, y así es como funcionan las variables integradas de Raku <code>$*OUT<\/code>, <code>$*IN<\/code> y <code>$*ERR<\/code> — puedes redirigir temporalmente la salida redeclarando <code>$*OUT<\/code> en un bloque, y cada rutina que llames dentro de él ve el nuevo valor.<\/span> <span class=\"sg\" data-s=\"2\">Las variables dinámicas son ideales para contexto que debe fluir hacia el código llamado sin pasarse como argumento explícito.<\/span><\/p>"]]},"it":{"t":"Variabili dinamiche","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una variabile <em>dinamica<\/em> ha il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A differenza di una variabile lessicale, che e' visibile solo nel blocco in cui e' dichiarata, una variabile dinamica viene trovata cercando <strong>verso l'esterno attraverso lo stack delle chiamate<\/strong> — attraverso chi ha chiamato il codice corrente, indipendentemente da dove quel codice e' definito.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La subroutine <code>greet<\/code> non dichiara <code>$*greeting<\/code> e non la riceve come argomento, eppure puo' vederla, perche' la variabile e' dinamica e <code>greet<\/code> e' stata chiamata da un punto in cui essa e' nello scope.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo esempio funzionerebbe anche con una semplice variabile scalare globale <code>$greeting<\/code>, ma la natura delle variabili dinamiche si vedra' nel prossimo esempio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiche' la ricerca segue lo stack delle chiamate, una dichiarazione piu' vicina <strong>sovrascrive<\/strong> una piu' lontana per la durata del suo blocco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La stessa <code>show<\/code> stampa <code>outer<\/code> la prima volta e <code>inner<\/code> quando viene chiamata dall'interno del blocco che ha ridichiarato <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo e' lo <em>scope dinamico<\/em>, ed e' cosi' che funzionano le variabili predefinite <code>$*OUT<\/code>, <code>$*IN<\/code> e <code>$*ERR<\/code> di Raku — puoi reindirizzare temporaneamente l'output ridichiarando <code>$*OUT<\/code> in un blocco, e ogni routine che chiami al suo interno vedra' il nuovo valore.<\/span> <span class=\"sg\" data-s=\"2\">Le variabili dinamiche sono ideali per il contesto che deve fluire nel codice chiamato senza essere passato come argomento esplicito.<\/span><\/p>"]]},"lv":{"t":"Dinamiskie mainīgie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Dinamiskam<\/em> mainīgajam ir tvigils <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirībā no leksiska mainīgā, kas redzams tikai tajā blokā, kur deklarēts, dinamisks mainīgais tiek atrasts, skatoties <strong>uz āru pa izsaukumu steku<\/strong> — caur to, kurš izsauca pašreizējo kodu, neatkarīgi no tā, kur šis kods definēts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma <code>greet<\/code> <code>$*greeting<\/code> nedeklarē un nesaņem to kā argumentu, tomēr var to redzēt, jo mainīgais ir dinamisks un <code>greet<\/code> tika izsaukta no vietas, kur tas ir redzams.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis piemērs strādātu arī ar vienkāršu globālu skalāro mainīgo <code>$greeting<\/code>, taču dinamisko mainīgo daba parādīsies nākamajā piemērā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā meklēšana seko izsaukumu stekam, tuvāka deklarācija sava bloka laikā <strong>pārmāc<\/strong> tālāku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tā pati <code>show<\/code> pirmoreiz izdrukā <code>outer<\/code> un <code>inner<\/code> tad, kad izsaukta no bloka, kurš <code>$*level<\/code> pārdeklarējis.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir <em>dinamiskais redzamības apgabals<\/em>, un tieši tā darbojas Raku iebūvētie <code>$*OUT<\/code>, <code>$*IN<\/code> un <code>$*ERR<\/code> — izvadi var uz laiku novirzīt, blokā pārdeklarējot <code>$*OUT<\/code>, un katra tā iekšienē izsauktā rutīna redz jauno vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Dinamiskie mainīgie ir ideāli kontekstam, kam jāplūst uz izsaukto kodu, netiekot padotam kā skaidrs arguments.<\/span><\/p>"]]},"ru":{"t":"Динамические переменные","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Динамическая<\/em> переменная имеет твигил <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В отличие от лексической переменной, которая видна только в блоке, где она объявлена, динамическая переменная ищется <strong>вверх по стеку вызовов<\/strong> — через того, кто вызвал текущий код, независимо от того, где этот код определён.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>greet<\/code> не объявляет <code>$*greeting<\/code> и не получает её в качестве аргумента, но может видеть её, потому что переменная динамическая и <code>greet<\/code> была вызвана из места, где эта переменная находится в области видимости.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этот пример мог бы работать с простой глобальной скалярной переменной <code>$greeting<\/code>, но природа динамических переменных проявится в следующем примере.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку поиск идёт по стеку вызовов, более близкое объявление <strong>перекрывает<\/strong> более далёкое на время действия своего блока:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна и та же <code>show<\/code> выводит <code>outer<\/code> при первом вызове и <code>inner<\/code>, когда вызывается изнутри блока, который переобъявил <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это <em>динамическая область видимости<\/em>, и именно так работают встроенные переменные Raku <code>$*OUT<\/code>, <code>$*IN<\/code> и <code>$*ERR<\/code> — вы можете временно перенаправить вывод, переобъявив <code>$*OUT<\/code> в блоке, и каждая подпрограмма, вызванная внутри него, увидит новое значение.<\/span> <span class=\"sg\" data-s=\"2\">Динамические переменные идеальны для контекста, который должен передаваться в вызываемый код без явной передачи в качестве аргумента.<\/span><\/p>"]]},"uk":{"t":"Динамічні змінні","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Динамічна<\/em> змінна має твіґіл <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">На відміну від лексичної змінної, видимої лише в тому блоці, де її оголошено, динамічну змінну знаходять, дивлячись <strong>назовні по стеку викликів<\/strong> — через того, хто викликав поточний код, хоч би де цей код був визначений.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>greet<\/code> не оголошує <code>$*greeting<\/code> і не отримує її аргументом, а проте бачить її, бо змінна є динамічною, а <code>greet<\/code> викликано з місця, де ця змінна перебуває в області видимості.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей приклад працював би й зі звичайною глобальною скалярною змінною <code>$greeting<\/code>, але природу динамічних змінних видно в наступному прикладі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки пошук іде за стеком викликів, ближче оголошення <strong>перекриває<\/strong> дальше на час свого блоку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Той самий <code>show<\/code> виводить <code>outer<\/code> першого разу й <code>inner<\/code>, коли його викликано зсередини блоку, який перевизначив <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це <em>динамічна область видимості<\/em>, і саме так працюють вбудовані <code>$*OUT<\/code>, <code>$*IN<\/code> та <code>$*ERR<\/code> у Raku: ви можете тимчасово перенаправити вивід, перевизначивши <code>$*OUT<\/code> у блоці, і кожна підпрограма, яку ви викликаєте всередині, бачитиме нове значення.<\/span> <span class=\"sg\" data-s=\"2\">Динамічні змінні ідеальні для контексту, який має перетікати у викликаний код, не передаючись явним аргументом.<\/span><\/p>"]]},"bg":{"t":"Динамични променливи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Динамичната<\/em> променлива има туигил <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За разлика от лексикалната променлива, която е видима само в блока, където е декларирана, динамичната променлива се намира чрез търсене <strong>навън през стека на извикванията<\/strong> — през този, който е извикал текущия код, независимо къде е дефиниран този код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата <code>greet<\/code> не декларира <code>$*greeting<\/code> и не я получава като аргумент, но въпреки това може да я види, защото променливата е динамична и <code>greet<\/code> е извикана от място, където тя е в обхват.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този пример би работил и с обикновена глобална скаларна променлива <code>$greeting<\/code>, но природата на динамичните променливи ще се види в следващия пример.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като търсенето следва стека на извикванията, по-близка декларация <strong>заменя<\/strong> по-далечната за времетраенето на нейния блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Същата <code>show<\/code> отпечатва <code>outer<\/code> първия път и <code>inner<\/code>, когато е извикана отвътре на блока, който предекларира <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е <em>динамично обхващане<\/em> и именно така работят вградените <code>$*OUT<\/code>, <code>$*IN<\/code> и <code>$*ERR<\/code> на Raku — можете временно да пренасочите изхода, като предекларирате <code>$*OUT<\/code> в блок, и всяка подпрограма, която извикате вътре в него, вижда новата стойност.<\/span> <span class=\"sg\" data-s=\"2\">Динамичните променливи са идеални за контекст, който трябва да тече в извиквания код, без да се предава като изричен аргумент.<\/span><\/p>"]]},"eo":{"t":"Dinamikaj variabloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Dinamika<\/em> variablo havas la tvigilon <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Male al leksika variablo, kiu estas videbla nur en la bloko kie ĝi estas deklarita, dinamika variablo estas trovata per serĉado <strong>eksteren tra la voka stako<\/strong> — tra tiu, kiu vokis la nunan kodon, sendepende de kie tiu kodo estas difinita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La subrutino <code>greet<\/code> ne deklaras <code>$*greeting<\/code> kaj ne ricevas ĝin kiel argumenton, tamen ĝi povas vidi ĝin, ĉar la variablo estas dinamika kaj <code>greet<\/code> estis vokita el loko kie ĝi estas en amplekso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzemplo funkcius ankaŭ kun simpla tutmonda skalara variablo <code>$greeting<\/code>, sed la naturo de dinamikaj variabloj estos videbla en la sekva ekzemplo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar la serĉado sekvas la vokan stakon, pli proksima deklaro <strong>anstataŭigas<\/strong> pli malproksiman dum la daŭro de sia bloko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sama <code>show<\/code> presas <code>outer<\/code> la unuan fojon kaj <code>inner<\/code> kiam ĝi estas vokita de ene de la bloko, kiu redeklaras <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas <em>dinamika ampleksado<\/em>, kaj tiel funkcias la enkonstruitaj <code>$*OUT<\/code>, <code>$*IN<\/code>, kaj <code>$*ERR<\/code> de Raku — vi povas provizore redirekti eligon redeklarante <code>$*OUT<\/code> en bloko, kaj ĉiu rutino, kiun vi vokas ene de ĝi, vidas la novan valoron.<\/span> <span class=\"sg\" data-s=\"2\">Dinamikaj variabloj estas idealaj por kunteksto, kiu devus flui en vokitan kodon sen esti pasigita kiel eksplicita argumento.<\/span><\/p>"]]}}}</script>
