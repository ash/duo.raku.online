<script type="application/json" id="page-data">{"u":"advanced/special-variables","n":403,"k":"section","pv":"advanced/subscript-adverbs/exercises/key-and-value/solution","nx":"advanced/special-variables/twigils","tr":["advanced"],"L":{"en":{"t":"Special and dynamic variables","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku variable names can carry a second marker after the sigil, called a <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The twigil tells you something about where the variable lives and how it is found — whether it is dynamically scoped, provided by the compiler, or tied to an object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section explains twigils, looks closely at the most useful kind — <em>dynamic<\/em> variables, which are looked up through the call stack rather than by ordinary lexical scope — and surveys the special variables that Raku predefines for you.<\/span><\/p>"]]},"de":{"t":"Spezielle und dynamische Variablen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku-Variablennamen können nach dem Sigil ein zweites Zeichen tragen, das <em>Twigil<\/em> genannt wird.<\/span> <span class=\"sg\" data-s=\"1\">Das Twigil verrät dir etwas darüber, wo die Variable lebt und wie sie gefunden wird — ob sie dynamisch gescoped ist, vom Compiler bereitgestellt wird oder an ein Objekt gebunden ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt erklärt Twigils, betrachtet die nützlichste Art genauer — <em>dynamische<\/em> Variablen, die über den Aufrufstapel statt über den gewöhnlichen lexikalischen Geltungsbereich aufgelöst werden — und gibt einen Überblick über die speziellen Variablen, die Raku für dich vordefiniert.<\/span><\/p>"]]},"nl":{"t":"Speciale en dynamische variabelen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku-variabelenamen kunnen een tweede markering dragen na de sigil, een zogenaamde <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De twigil vertelt je iets over waar de variabele zich bevindt en hoe deze wordt gevonden — of deze dynamisch van scope is, door de compiler wordt aangeleverd, of aan een object is gekoppeld.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel legt twigils uit, kijkt uitgebreid naar het meest bruikbare type — <em>dynamische<\/em> variabelen, die via de call stack worden opgezocht in plaats van via gewone lexicale scope — en geeft een overzicht van de speciale variabelen die Raku voor je vooraf definieert.<\/span><\/p>"]]},"es":{"t":"Variables especiales y dinámicas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los nombres de variables en Raku pueden llevar un segundo marcador después del sigilo, llamado <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El twigil te indica algo sobre dónde vive la variable y cómo se encuentra — si tiene ámbito dinámico, si la proporciona el compilador o si está vinculada a un objeto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección explica los twigils, examina de cerca el tipo más útil — las variables <em>dinámicas<\/em>, que se buscan a través de la pila de llamadas en lugar del ámbito léxico habitual — y repasa las variables especiales que Raku predefine para ti.<\/span><\/p>"]]},"it":{"t":"Variabili speciali e dinamiche","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I nomi delle variabili in Raku possono contenere un secondo marcatore dopo il sigillo, chiamato <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il twigil indica qualcosa su dove risiede la variabile e come viene trovata — se ha scope dinamico, se e' fornita dal compilatore, o se e' legata a un oggetto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione spiega i twigil, esamina da vicino il tipo piu' utile — le variabili <em>dinamiche<\/em>, che vengono cercate attraverso lo stack delle chiamate anziche' tramite il normale scope lessicale — e passa in rassegna le variabili speciali che Raku predefinisce per te.<\/span><\/p>"]]},"lv":{"t":"Speciālie un dinamiskie mainīgie 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku mainīgo nosaukumi aiz sigila var nest otru apzīmētāju, ko sauc par <em>tvigilu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tvigils pasaka kaut ko par to, kur mainīgais dzīvo un kā tas tiek atrasts — vai tam ir dinamisks redzamības apgabals, vai to nodrošina kompilators, vai tas ir piesaistīts objektam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa izskaidro tvigilus, tuvāk aplūko noderīgāko to veidu — <em>dinamiskos<\/em> mainīgos, kas tiek meklēti caur izsaukumu steku, nevis pēc parastā leksiskā redzamības apgabala —, un apskata speciālos mainīgos, ko Raku jums iepriekš definē.<\/span><\/p>"]]},"ru":{"t":"Специальные и динамические переменные","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имена переменных в Raku могут содержать второй маркер после сигила, называемый <em>твигилом<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Твигил сообщает о том, где переменная находится и как она ищется — является ли она динамически ограниченной, предоставленной компилятором или привязанной к объекту.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе объясняются твигилы, подробно рассматривается самый полезный их вид — <em>динамические<\/em> переменные, которые ищутся по стеку вызовов, а не по обычной лексической области видимости — а также приводится обзор специальных переменных, которые Raku предоставляет вам заранее.<\/span><\/p>"]]},"uk":{"t":"Спеціальні та динамічні змінні","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Імена змінних у Raku можуть нести другий позначник після сигіла, який називають <em>твіґілом<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Твіґіл повідомляє щось про те, де живе змінна і як її знаходять, — чи є вона динамічно областевою, чи наданою компілятором, чи прив'язаною до об'єкта.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ пояснює твіґіли, пильно розглядає найкорисніший їхній різновид — <em>динамічні<\/em> змінні, які шукають через стек викликів, а не за звичайною лексичною областю видимості, — і оглядає спеціальні змінні, які Raku наперед визначає для вас.<\/span><\/p>"]]},"bg":{"t":"Специални и динамични променливи 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имената на променливите в Raku могат да носят втори маркер след сигила, наречен <em>туигил<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Туигилът ви казва нещо за това къде живее променливата и как се намира — дали е с динамичен обхват, предоставена от компилатора, или свързана с обект.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел обяснява туигилите, разглежда подробно най-полезния вид — <em>динамичните<\/em> променливи, които се търсят през стека на извикванията, а не чрез обикновен лексикален обхват — и прави преглед на специалните променливи, които Raku предефинира за вас.<\/span><\/p>"]]},"eo":{"t":"Specialaj kaj dinamikaj variabloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomoj de variabloj en Raku povas porti duan signilon post la sigelo, nomatan <em>tvigilon<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La tvigilo diras al vi ion pri kie la variablo loĝas kaj kiel ĝi estas trovata — ĉu ĝi estas dinamike ampleksata, provizita de la kompililo, aŭ ligita al objekto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio klarigas tvigilojn, rigardas detale la plej utilan specon — <em>dinamikajn<\/em> variablojn, kiuj estas serĉataj tra la voka stako anstataŭ per ordinara leksika amplekso — kaj superrigardas la specialajn variablojn, kiujn Raku antaŭdifinas por vi.<\/span><\/p>"]]}}}</script>
