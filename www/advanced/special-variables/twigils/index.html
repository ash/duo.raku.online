<script type="application/json" id="page-data">{"u":"advanced/special-variables/twigils","n":404,"k":"topic","pv":"advanced/special-variables","nx":"advanced/special-variables/twigils/quiz","tr":["advanced","advanced/special-variables"],"L":{"en":{"t":"Twigils","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <em>twigil<\/em> is a character placed between the sigil and the name of a variable.<\/span> <span class=\"sg\" data-s=\"1\">It does not change the name; it changes how the variable behaves and is resolved.<\/span> <span class=\"sg\" data-s=\"2\">The common ones are:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — a <strong>dynamic<\/strong> variable, e.g. <code>$*OUT<\/code>, looked up through the call stack<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — a <strong>compile-time<\/strong> value provided by the compiler, e.g. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — a <strong>private<\/strong> attribute of an object, e.g. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — an attribute reached through its accessor method, e.g. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You have already met several of these without naming the twigil: <code>$*OUT<\/code> and <code>$*IN<\/code> (dynamic), and <code>$!<\/code>/<code>$.<\/code> in <a href=\"/oop/\">the part on objects<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The compiler-provided <code>?<\/code> variables are filled in as your program is compiled:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each twigil signals a different kind of variable at a glance, so reading <code>$*foo<\/code> you immediately know it is dynamic, and <code>$?foo<\/code> that it is a compile-time constant.<\/span> <span class=\"sg\" data-s=\"1\">The next topic looks at <a href=\"/advanced/special-variables/dynamic-variables/\">dynamic variables<\/a> in detail, since they behave quite differently from the lexical variables you have used so far.<\/span><\/p>"]]},"de":{"t":"Twigils","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Twigil<\/em> ist ein Zeichen, das zwischen dem Sigil und dem Namen einer Variablen steht.<\/span> <span class=\"sg\" data-s=\"1\">Es ändert nicht den Namen; es ändert, wie sich die Variable verhält und aufgelöst wird.<\/span> <span class=\"sg\" data-s=\"2\">Die gebräuchlichsten sind:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — eine <strong>dynamische<\/strong> Variable, z. B. <code>$*OUT<\/code>, wird über den Aufrufstapel aufgelöst<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — ein <strong>Kompilierzeit<\/strong>-Wert, der vom Compiler bereitgestellt wird, z. B. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — ein <strong>privates<\/strong> Attribut eines Objekts, z. B. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — ein Attribut, das über seine Accessor-Methode erreicht wird, z. B. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du bist bereits mehreren davon begegnet, ohne das Twigil beim Namen zu nennen: <code>$*OUT<\/code> und <code>$*IN<\/code> (dynamisch) sowie <code>$!<\/code>/<code>$.<\/code> im <a href=\"https://course.raku.org/de/oop/\" target=\"_blank\" rel=\"noopener\">Teil über Objekte<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die vom Compiler bereitgestellten <code>?<\/code>-Variablen werden beim Kompilieren deines Programms befüllt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes Twigil signalisiert auf einen Blick eine andere Art von Variable.<\/span> <span class=\"sg\" data-s=\"1\">Wenn du also <code>$*foo<\/code> liest, weißt du sofort, dass es dynamisch ist, und bei <code>$?foo<\/code>, dass es eine Kompilierzeit-Konstante ist.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Thema betrachtet <a href=\"https://course.raku.org/de/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamische Variablen<\/a> im Detail, da sie sich ganz anders verhalten als die lexikalischen Variablen, die du bisher verwendet hast.<\/span><\/p>"]]},"nl":{"t":"Twigils","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>twigil<\/em> is een teken dat tussen de sigil en de naam van een variabele wordt geplaatst.<\/span> <span class=\"sg\" data-s=\"1\">Het verandert de naam niet; het verandert hoe de variabele zich gedraagt en wordt opgezocht.<\/span> <span class=\"sg\" data-s=\"2\">De meest voorkomende zijn:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — een <strong>dynamische<\/strong> variabele, bijv. <code>$*OUT<\/code>, opgezocht via de call stack<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — een <strong>compile-time<\/strong> waarde die door de compiler wordt aangeleverd, bijv. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — een <strong>privaat<\/strong> attribuut van een object, bijv. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — een attribuut dat via zijn accessor-methode wordt benaderd, bijv. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je bent er al een aantal van tegengekomen zonder de twigil bij naam te noemen: <code>$*OUT<\/code> en <code>$*IN<\/code> (dynamisch), en <code>$!<\/code>/<code>$.<\/code> in <a href=\"https://course.raku.org/nl/oop/\" target=\"_blank\" rel=\"noopener\">het deel over objecten<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De door de compiler aangeleverde <code>?<\/code>-variabelen worden ingevuld terwijl je programma wordt gecompileerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke twigil duidt in één oogopslag een ander soort variabele aan, dus als je <code>$*foo<\/code> leest, weet je meteen dat het dynamisch is, en bij <code>$?foo<\/code> dat het een compile-time constante is.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp bekijkt <a href=\"https://course.raku.org/nl/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamische variabelen<\/a> in detail, omdat ze zich heel anders gedragen dan de lexicale variabelen die je tot nu toe hebt gebruikt.<\/span><\/p>"]]},"es":{"t":"Twigils","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>twigil<\/em> es un carácter que se coloca entre el sigilo y el nombre de una variable.<\/span> <span class=\"sg\" data-s=\"1\">No cambia el nombre; cambia cómo se comporta y se resuelve la variable.<\/span> <span class=\"sg\" data-s=\"2\">Los más comunes son:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — una variable <strong>dinámica<\/strong>, p. ej. <code>$*OUT<\/code>, buscada a través de la pila de llamadas<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — un valor de <strong>tiempo de compilación<\/strong> proporcionado por el compilador, p. ej. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — un atributo <strong>privado<\/strong> de un objeto, p. ej. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — un atributo al que se accede a través de su método accesor, p. ej. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ya has encontrado varios de estos sin nombrar el twigil: <code>$*OUT<\/code> y <code>$*IN<\/code> (dinámicos), y <code>$!<\/code>/<code>$.<\/code> en <a href=\"https://course.raku.org/es/oop/\" target=\"_blank\" rel=\"noopener\">la parte sobre objetos<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las variables <code>?<\/code> proporcionadas por el compilador se rellenan mientras tu programa se compila:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada twigil señala un tipo diferente de variable a simple vista, así que al leer <code>$*foo<\/code> sabes inmediatamente que es dinámica, y <code>$?foo<\/code> que es una constante de tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente tema examina las <a href=\"https://course.raku.org/es/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variables dinámicas<\/a> en detalle, ya que se comportan de manera bastante diferente a las variables léxicas que has usado hasta ahora.<\/span><\/p>"]]},"it":{"t":"Twigil","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>twigil<\/em> e' un carattere posto tra il sigillo e il nome di una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Non cambia il nome; cambia il comportamento della variabile e il modo in cui viene risolta.<\/span> <span class=\"sg\" data-s=\"2\">I piu' comuni sono:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — una variabile <strong>dinamica<\/strong>, ad es. <code>$*OUT<\/code>, cercata attraverso lo stack delle chiamate<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — un valore <strong>in fase di compilazione<\/strong> fornito dal compilatore, ad es. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — un attributo <strong>privato<\/strong> di un oggetto, ad es. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — un attributo raggiunto tramite il suo metodo accessore, ad es. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai gia' incontrato diversi di questi senza nominare il twigil: <code>$*OUT<\/code> e <code>$*IN<\/code> (dinamici), e <code>$!<\/code>/<code>$.<\/code> nella <a href=\"https://course.raku.org/it/oop/\" target=\"_blank\" rel=\"noopener\">parte sugli oggetti<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le variabili <code>?<\/code> fornite dal compilatore vengono riempite durante la compilazione del programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni twigil segnala a colpo d'occhio un tipo diverso di variabile, cosi' leggendo <code>$*foo<\/code> sai immediatamente che e' dinamica, e <code>$?foo<\/code> che e' una costante in fase di compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Il prossimo argomento esamina le <a href=\"https://course.raku.org/it/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabili dinamiche<\/a> in dettaglio, poiche' si comportano in modo molto diverso dalle variabili lessicali che hai usato finora.<\/span><\/p>"]]},"lv":{"t":"Tvigili","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Tvigils<\/em> ir rakstzīme, kas novietota starp sigilu un mainīgā nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā nemaina nosaukumu; tā maina to, kā mainīgais uzvedas un kā tas tiek atrisināts.<\/span> <span class=\"sg\" data-s=\"2\">Izplatītākie ir:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>dinamisks<\/strong> mainīgais, piemēram, <code>$*OUT<\/code>, kas tiek meklēts caur izsaukumu steku<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>kompilēšanas laika<\/strong> vērtība, ko nodrošina kompilators, piemēram, <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — objekta <strong>privāts<\/strong> atribūts, piemēram, <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — atribūts, kas sasniedzams caur savu piekļuves metodi, piemēram, <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar vairākiem no tiem jau esat sastapušies, tvigilu nenosaucot: <code>$*OUT<\/code> un <code>$*IN<\/code> (dinamiskie) un <code>$!<\/code>/<code>$.<\/code> <a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">daļā par objektiem<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompilatora nodrošinātie <code>?<\/code> mainīgie tiek aizpildīti programmas kompilēšanas laikā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs tvigils uzreiz signalizē par citu mainīgā veidu, tāpēc, lasot <code>$*foo<\/code>, jūs nekavējoties zināt, ka tas ir dinamisks, bet <code>$?foo<\/code> — ka tā ir kompilēšanas laika konstante.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais temats sīkāk aplūko <a href=\"https://course.raku.org/lv/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamiskos mainīgos<\/a>, jo tie uzvedas gluži citādi nekā līdz šim lietotie leksiskie mainīgie.<\/span><\/p>"]]},"ru":{"t":"Твигилы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Твигил<\/em> — это символ, размещаемый между сигилом и именем переменной.<\/span> <span class=\"sg\" data-s=\"1\">Он не меняет имя, но меняет то, как переменная ведёт себя и как она разрешается.<\/span> <span class=\"sg\" data-s=\"2\">Наиболее распространённые твигилы:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамическая<\/strong> переменная, например <code>$*OUT<\/code>, ищется по стеку вызовов<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — значение <strong>времени компиляции<\/strong>, предоставленное компилятором, например <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>приватный<\/strong> атрибут объекта, например <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, доступный через метод-аксессор, например <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы уже встречали несколько из них, не называя твигилом: <code>$*OUT<\/code> и <code>$*IN<\/code> (динамические), а также <code>$!<\/code>/<code>$.<\/code> в <a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">части об объектах<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Переменные компилятора с твигилом <code>?<\/code> заполняются на этапе компиляции вашей программы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый твигил обозначает определённый вид переменной с первого взгляда: увидев <code>$*foo<\/code>, вы сразу понимаете, что это динамическая переменная, а <code>$?foo<\/code> — что это константа времени компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема подробно рассматривает <a href=\"https://course.raku.org/ru/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамические переменные<\/a>, поскольку они ведут себя совершенно иначе, чем лексические переменные, которые вы использовали до сих пор.<\/span><\/p>"]]},"uk":{"t":"Твіґіли","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Твіґіл<\/em> — це символ, поставлений між сигілом та іменем змінної.<\/span> <span class=\"sg\" data-s=\"1\">Він не змінює імені; він змінює те, як змінна поводиться і як її розв'язують.<\/span> <span class=\"sg\" data-s=\"2\">Найпоширеніші такі:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамічна<\/strong> змінна, наприклад <code>$*OUT<\/code>, яку шукають через стек викликів<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>компіляційне<\/strong> значення, надане компілятором, наприклад <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>приватний<\/strong> атрибут об'єкта, наприклад <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, до якого дістаються через його метод доступу, наприклад <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З кількома з них ви вже стикалися, не називаючи твіґіла: <code>$*OUT<\/code> та <code>$*IN<\/code> (динамічні) і <code>$!<\/code>/<code>$.<\/code> у <a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">частині про об'єкти<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Змінні з <code>?<\/code>, надані компілятором, заповнюються під час компіляції вашої програми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # номер рядка цього оператора\nsay $?FILE; # шлях до цього файлу з вихідним кодом<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен твіґіл із першого погляду сигналізує про інший різновид змінної, тож, читаючи <code>$*foo<\/code>, ви одразу знаєте, що вона динамічна, а <code>$?foo<\/code> — що це компіляційна стала.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема детально розглядає <a href=\"https://course.raku.org/uk/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамічні змінні<\/a>, бо вони поводяться зовсім не так, як лексичні змінні, якими ви користувалися досі.<\/span><\/p>"]]},"bg":{"t":"Twigils","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Туигил<\/em> е символ, поставен между сигила и името на променливата.<\/span> <span class=\"sg\" data-s=\"1\">Той не променя името; той променя как се държи и как се разрешава променливата.<\/span> <span class=\"sg\" data-s=\"2\">Най-често срещаните са:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамична<\/strong> променлива, напр. <code>$*OUT<\/code>, търсена през стека на извикванията<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — стойност по <strong>време на компилация<\/strong>, предоставена от компилатора, напр. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>частен<\/strong> атрибут на обект, напр. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, достъпен чрез неговия метод за достъп, напр. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вече сте срещали няколко от тях, без да назовавате туигила: <code>$*OUT<\/code> и <code>$*IN<\/code> (динамични), и <code>$!<\/code>/<code>$.<\/code> в <a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">частта за обектите<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Предоставените от компилатора <code>?<\/code> променливи се попълват, докато програмата ви се компилира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки туигил сигнализира различен вид променлива с един поглед, така че четейки <code>$*foo<\/code>, веднага знаете, че е динамична, а <code>$?foo<\/code> — че е константа по време на компилация.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема разглежда <a href=\"https://course.raku.org/bg/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамичните променливи<\/a> в детайли, тъй като те се държат доста по-различно от лексикалните променливи, които сте използвали досега.<\/span><\/p>"]]},"eo":{"t":"Duoblaj sigeloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Tvigilo<\/em> estas signo metita inter la sigelo kaj la nomo de variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne ŝanĝas la nomon; ĝi ŝanĝas kiel la variablo kondutas kaj estas solvata.<\/span> <span class=\"sg\" data-s=\"2\">La oftaj estas:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>dinamika<\/strong> variablo, ekz. <code>$*OUT<\/code>, serĉata tra la voka stako<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>kompiltempa<\/strong> valoro provizita de la kompililo, ekz. <code>$?FILE<\/code>, <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>privata<\/strong> atributo de objekto, ekz. <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — atributo atingita per ĝia aliriga metodo, ekz. <code>$.name<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi jam renkontis kelkajn el ĉi tiuj sen nomi la tvigilon: <code>$*OUT<\/code> kaj <code>$*IN<\/code> (dinamikaj), kaj <code>$!<\/code>/<code>$.<\/code> en <a href=\"/oop/\">la parto pri objektoj<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kompilile provizitaj <code>?<\/code>-variabloj estas plenigitaj dum via programo estas kompilata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu tvigilo signalas malsaman specon de variablo unuavide, do legante <code>$*foo<\/code> vi tuj scias, ke ĝi estas dinamika, kaj <code>$?foo<\/code>, ke ĝi estas kompiltempa konstanto.<\/span> <span class=\"sg\" data-s=\"1\">La sekva temo rigardas detale <a href=\"https://course.raku.org/eo/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamikajn variablojn<\/a>, ĉar ili kondutas tre malsame ol la leksikaj variabloj, kiujn vi uzis ĝis nun.<\/span><\/p>"]]}}}</script>
