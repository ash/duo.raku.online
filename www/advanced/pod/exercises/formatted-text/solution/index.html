pan class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> позначає слово жирним; у звичайному текстовому відображенні воно виглядає як звичайний текст, але багатші формати показують його жирним.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> відображає Pod, не виконуючи жодного коду програми.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щоб справді <em>побачити<\/em> жирний, відображайте у формат, який несе оформлення. Встановіть форматувальник на кшталт <code>Pod::To::HTML<\/code> через <code>zef install Pod::To::HTML<\/code>, а потім запустіть <code>raku --doc=HTML formatted-text.raku<\/code>; тепер слово виходить загорнутим в елемент HTML <code>&lt;b&gt;<\/code>. Звичайний текстовий вивід <code>--doc<\/code>, навпаки, не має способу показати жирний, щойно його записано у файл чи канал.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Форматиран текст","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте с <code>raku --doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> маркира думата като удебелена; при визуализиране като обикновен текст тя се показва като нормален текст, но по-богатите формати я показват удебелено.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> визуализира Pod, без да изпълнява програмния код.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За да видите действително <em>удебеления текст<\/em>, визуализирайте във формат, който поддържа стилове. Инсталирайте форматиращ модул като <code>Pod::To::HTML<\/code> с <code>zef install Pod::To::HTML<\/code>, след което стартирайте <code>raku --doc=HTML formatted-text.raku<\/code>; думата сега ще излезе обвита в HTML елемент <code>&lt;b&gt;<\/code>. Обикновеният текстов изход от <code>--doc<\/code>, за разлика от това, няма начин да покаже удебелен текст, веднъж записан във файл или подаден по тръба.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Textum formatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius muneris.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Fontem codicis in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum <code>raku --doc<\/code> exsequere:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> verbum crasse notat; in redditione textuali simplici ut textus ordinarius apparet, sed formata ditiora id crasse ostendunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> Pod reddit sine ullo codice programmatis exsequendo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ut re vera crassum videas, in formatum quod ornamentum fert redde. Formatorem ut <code>Pod::To::HTML<\/code> installa cum <code>zef install Pod::To::HTML<\/code>, deinde <code>raku --doc=HTML formatted-text.raku<\/code> exsequere; verbum nunc in elemento HTML <code>&lt;b&gt;<\/code> involutum exit. Redditio textualis simplex cum <code>--doc<\/code>, e contra, nullum modum habet crassum ostendendi postquam in fasciculum vel tubum scriptum est.<\/span><\/li><\/ol>"]]}}}</script>
