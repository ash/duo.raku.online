<script type="application/json" id="page-data">{"u":"advanced/pod/rendering-pod","n":759,"k":"topic","pv":"advanced/pod/pod-formatting","nx":"advanced/pod/accessing-pod","tr":["advanced","advanced/pod"],"L":{"en":{"t":"Rendering Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Once a file carries Pod, the compiler can turn it into formatted text without running the program, using the <code>--doc<\/code> option:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For the heading-and-paragraph example from earlier, this prints something like:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lists and code blocks render too.<\/span> <span class=\"sg\" data-s=\"1\">Take this Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rendered with <code>raku --doc<\/code>, it prints:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each <code>=item<\/code> becomes a bullet, and the <code>=begin code … =end code<\/code> block is shown verbatim and indented, exactly as written.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rendering to HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The same mechanism can produce other formats.<\/span> <span class=\"sg\" data-s=\"1\">For HTML you install a formatter module once, then name it after <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now the very same document comes out as HTML — the heading becomes an <code>&lt;h1&gt;<\/code>, the list a <code>&lt;ul&gt;<\/code> of <code>&lt;li&gt;<\/code>, and the code block a <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(The tool wraps this in a complete HTML page.)<\/span> <span class=\"sg\" data-s=\"1\">This is how the official Raku documentation at <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> is produced from the Pod in Rakudo's own source.<\/span><\/p>"]]},"de":{"t":"Pod rendern","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sobald eine Datei Pod enthält, kann der Compiler sie in formatierten Text umwandeln, ohne das Programm auszuführen, indem die Option <code>--doc<\/code> verwendet wird:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für das Beispiel mit Ueberschrift und Absatz von vorhin gibt dies etwa Folgendes aus:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Listen und Codeblöcke werden ebenfalls gerendert.<\/span> <span class=\"sg\" data-s=\"1\">Nimm dieses Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gerendert mit <code>raku --doc<\/code> gibt es Folgendes aus:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jedes <code>=item<\/code> wird zu einem Aufzählungszeichen, und der <code>=begin code ... =end code<\/code>-Block wird wörtlich und eingerückt angezeigt, genau wie geschrieben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rendern als HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der gleiche Mechanismus kann andere Formate erzeugen.<\/span> <span class=\"sg\" data-s=\"1\">Für HTML installierst du einmalig ein Formatierungsmodul und gibst es dann nach <code>--doc<\/code> an:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun wird dasselbe Dokument als HTML ausgegeben — die Ueberschrift wird zu einem <code>&lt;h1&gt;<\/code>, die Liste zu einer <code>&lt;ul&gt;<\/code> mit <code>&lt;li&gt;<\/code>, und der Codeblock zu einem <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Das Werkzeug verpackt dies in eine vollständige HTML-Seite.)<\/span> <span class=\"sg\" data-s=\"1\">So wird die offizielle Raku-Dokumentation auf <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> aus dem Pod in Rakudos eigenem Quellcode erzeugt.<\/span><\/p>"]]},"nl":{"t":"Pod renderen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zodra een bestand Pod bevat, kan de compiler het omzetten naar opgemaakte tekst zonder het programma uit te voeren, met behulp van de optie <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor het eerdere voorbeeld met kop en alinea print dit iets als:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lijsten en codeblokken worden ook weergegeven.<\/span> <span class=\"sg\" data-s=\"1\">Neem deze Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Weergegeven met <code>raku --doc<\/code> print het:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elk <code>=item<\/code> wordt een opsommingsteken, en het blok <code>=begin code ... =end code<\/code> wordt letterlijk en ingesprongen weergegeven, precies zoals geschreven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Renderen naar HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde mechanisme kan andere formaten produceren.<\/span> <span class=\"sg\" data-s=\"1\">Voor HTML installeer je eenmalig een formatter-module en geef je deze op na <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu komt hetzelfde document als HTML tevoorschijn — de kop wordt een <code>&lt;h1&gt;<\/code>, de lijst een <code>&lt;ul&gt;<\/code> van <code>&lt;li&gt;<\/code>'s, en het codeblok een <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(De tool verpakt dit in een complete HTML-pagina.)<\/span> <span class=\"sg\" data-s=\"1\">Dit is hoe de officiele Raku-documentatie op <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> wordt geproduceerd vanuit de Pod in Rakudo's eigen broncode.<\/span><\/p>"]]},"es":{"t":"Renderizar Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Una vez que un archivo contiene Pod, el compilador puede convertirlo en texto formateado sin ejecutar el programa, usando la opción <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para el ejemplo de encabezado y párrafo anterior, esto imprime algo como:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las listas y los bloques de código también se renderizan.<\/span> <span class=\"sg\" data-s=\"1\">Toma este Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Renderizado con <code>raku --doc<\/code>, imprime:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada <code>=item<\/code> se convierte en una viñeta, y el bloque <code>=begin code … =end code<\/code> se muestra tal cual y con sangría, exactamente como fue escrito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Renderizado a HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El mismo mecanismo puede producir otros formatos.<\/span> <span class=\"sg\" data-s=\"1\">Para HTML, instalas un módulo formateador una vez y luego lo nombras después de <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora el mismo documento sale como HTML — el encabezado se convierte en un <code>&lt;h1&gt;<\/code>, la lista en un <code>&lt;ul&gt;<\/code> de <code>&lt;li&gt;<\/code>, y el bloque de código en un <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(La herramienta envuelve esto en una página HTML completa.)<\/span> <span class=\"sg\" data-s=\"1\">Así es como se produce la documentación oficial de Raku en <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> a partir del Pod en el código fuente de Rakudo.<\/span><\/p>"]]},"it":{"t":"Rendering di Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Una volta che un file contiene Pod, il compilatore può trasformarlo in testo formattato senza eseguire il programma, usando l'opzione <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per l'esempio con intestazione e paragrafo visto in precedenza, questo stampa qualcosa come:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anche gli elenchi e i blocchi di codice vengono renderizzati.<\/span> <span class=\"sg\" data-s=\"1\">Prendiamo questo Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Renderizzato con <code>raku --doc<\/code>, stampa:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>=item<\/code> diventa un punto elenco, e il blocco <code>=begin code … =end code<\/code> viene mostrato testualmente e indentato, esattamente come scritto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rendering in HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso meccanismo può produrre altri formati.<\/span> <span class=\"sg\" data-s=\"1\">Per l'HTML si installa un modulo di formattazione una sola volta, poi lo si indica dopo <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora lo stesso identico documento viene prodotto come HTML — l'intestazione diventa un <code>&lt;h1&gt;<\/code>, l'elenco un <code>&lt;ul&gt;<\/code> di <code>&lt;li&gt;<\/code>, e il blocco di codice un <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Lo strumento racchiude il tutto in una pagina HTML completa.)<\/span> <span class=\"sg\" data-s=\"1\">È così che viene prodotta la documentazione ufficiale di Raku su <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> dal Pod presente nel sorgente di Rakudo stesso.<\/span><\/p>"]]},"lv":{"t":"Pod renderēšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad fails nes Pod, kompilators to var pārvērst formatētā tekstā, programmu neizpildot, ar opciju <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējam virsraksta un rindkopas piemēram tas izdrukā apmēram šo:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atveidojas arī saraksti un koda bloki.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet šo Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atveidots ar <code>raku --doc<\/code>, tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>=item<\/code> kļūst par aizzīmi, un bloks <code>=begin code … =end code<\/code> tiek parādīts burtiski un ar atkāpi, tieši tā, kā uzrakstīts.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Atveidošana HTML formātā<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas pats mehānisms var radīt arī citus formātus.<\/span> <span class=\"sg\" data-s=\"1\">HTML gadījumā vienreiz instalējat atveidotāja moduli un pēc tam nosaucat to aiz <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad tas pats dokuments iznāk kā HTML — virsraksts kļūst par <code>&lt;h1&gt;<\/code>, saraksts par <code>&lt;ul&gt;<\/code> ar <code>&lt;li&gt;<\/code>, bet koda bloks par <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Rīks to ietin pilnā HTML lappusē.)<\/span> <span class=\"sg\" data-s=\"1\">Tieši tā oficiālā Raku dokumentācija vietnē <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> tiek radīta no Pod paša Rakudo pirmkodā.<\/span><\/p>"]]},"ru":{"t":"Рендеринг Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Если файл содержит Pod, компилятор может превратить его в форматированный текст без запуска программы, используя опцию <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для примера с заголовком и абзацем из предыдущей темы это выведет что-то вроде:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Списки и блоки кода тоже отрисовываются.<\/span> <span class=\"sg\" data-s=\"1\">Возьмём такой Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При отрисовке с помощью <code>raku --doc<\/code> будет выведено:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый <code>=item<\/code> превращается в маркер списка, а блок <code>=begin code … =end code<\/code> отображается дословно с отступом, именно так, как написан.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрисовка в HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тот же механизм может создавать другие форматы.<\/span> <span class=\"sg\" data-s=\"1\">Для HTML нужно один раз установить модуль-форматтер, а затем указать его после <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь тот же самый документ выводится как HTML — заголовок становится элементом <code>&lt;h1&gt;<\/code>, список — <code>&lt;ul&gt;<\/code> из <code>&lt;li&gt;<\/code>, а блок кода — <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Инструмент оборачивает это в полную HTML-страницу.)<\/span> <span class=\"sg\" data-s=\"1\">Именно так создаётся официальная документация Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> из Pod в исходном коде Rakudo.<\/span><\/p>"]]},"uk":{"t":"Відображення Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щойно файл несе Pod, компілятор може перетворити його на форматований текст, не виконуючи програми, за допомогою опції <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для наведеного раніше прикладу із заголовком та абзацом це виводить приблизно таке:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Списки й блоки коду теж відображаються.<\/span> <span class=\"sg\" data-s=\"1\">Візьмімо такий Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Відображений через <code>raku --doc<\/code>, він виводить:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>=item<\/code> стає пунктом списку, а блок <code>=begin code … =end code<\/code> показується дослівно й з відступом, точно як записано.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Відображення в HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Той самий механізм може давати й інші формати.<\/span> <span class=\"sg\" data-s=\"1\">Для HTML ви одноразово встановлюєте модуль-форматувальник, а потім називаєте його після <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер той самий документ виходить як HTML: заголовок стає <code>&lt;h1&gt;<\/code>, список — <code>&lt;ul&gt;<\/code> із <code>&lt;li&gt;<\/code>, а блок коду — <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Інструмент загортає це в повноцінну HTML-сторінку.)<\/span> <span class=\"sg\" data-s=\"1\">Саме так офіційну документацію Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> створюють із Pod у власному вихідному коді Rakudo.<\/span><\/p>"]]},"bg":{"t":"Рендериране на Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато файлът съдържа Pod, компилаторът може да го превърне във форматиран текст, без да изпълнява програмата, като използва опцията <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За примера със заглавие и параграф от по-рано, това отпечатва нещо подобно на:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Списъците и кодовите блокове също се визуализират.<\/span> <span class=\"sg\" data-s=\"1\">Вземете този Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Визуализиран с <code>raku --doc<\/code>, той отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>=item<\/code> става точка от списък, а блокът <code>=begin code … =end code<\/code> се показва без промяна и с отстъп, точно както е написан.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Визуализиране като HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същият механизъм може да произведе и други формати.<\/span> <span class=\"sg\" data-s=\"1\">За HTML инсталирате веднъж модул-форматиращ, след което го посочвате след <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега същият документ излиза като HTML — заглавието става <code>&lt;h1&gt;<\/code>, списъкът — <code>&lt;ul&gt;<\/code> с <code>&lt;li&gt;<\/code>, а кодовият блок — <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Инструментът обвива това в пълна HTML страница.)<\/span> <span class=\"sg\" data-s=\"1\">Именно по този начин се създава официалната документация на Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> от Pod в изходния код на Rakudo.<\/span><\/p>"]]},"eo":{"t":"Bildigi Pod","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Post kiam dosiero portas Pod, la kompililo povas transformi ĝin en formatitan tekston sen ruli la programon, per la opcio <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por la titol-kaj-alinea ekzemplo el pli frue, ĉi tio presas ion kiel:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Listoj kaj kodblokoj ankaŭ bildiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Prenu ĉi tiun Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bildigita per <code>raku --doc<\/code>, ĝi presas:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>=item<\/code> fariĝas bulo, kaj la bloko <code>=begin code … =end code<\/code> estas montrata laŭvorte kaj indentita, ekzakte kiel skribita.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bildigi al HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sama mekanismo povas produkti aliajn formatojn.<\/span> <span class=\"sg\" data-s=\"1\">Por HTML vi instalas formatilan modulon unufoje, poste nomas ĝin post <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun la sama dokumento eliras kiel HTML — la titolo fariĝas <code>&lt;h1&gt;<\/code>, la listo <code>&lt;ul&gt;<\/code> el <code>&lt;li&gt;<\/code>, kaj la kodbloko <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(La ilo envolvas tion en kompletan HTML-paĝon.)<\/span> <span class=\"sg\" data-s=\"1\">Tiel la oficiala dokumentado de Raku ĉe <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> estas produktata el la Pod en la propra fontkodo de Rakudo.<\/span><\/p>"]]},"la":{"t":"Pod reddere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ubi fasciculus Pod continet, compilator eum in textum formatum convertere potest sine programmate exsequendo, optione <code>--doc<\/code> utens:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro exemplo tituli et paragraphi de supra, hoc aliquid tale imprimit:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Indices et trunci codicis quoque redduntur.<\/span> <span class=\"sg\" data-s=\"1\">Hunc Pod sume:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum <code>raku --doc<\/code> redditur, hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quodque <code>=item<\/code> punctum fit, et truncus <code>=begin code … =end code<\/code> ad verbum et cum incisuris ostenditur, prorsus ut scriptus est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Redditio in HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem mechanismum alia formata producere potest.<\/span> <span class=\"sg\" data-s=\"1\">Pro HTML, modulum formatoris semel installes, deinde eum post <code>--doc<\/code> nomines:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc idem documentum in HTML exit — titulus fit <code>&lt;h1&gt;<\/code>, index fit <code>&lt;ul&gt;<\/code> cum <code>&lt;li&gt;<\/code>, et truncus codicis fit <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">(Instrumentum hoc in paginam HTML integram involuit.)<\/span> <span class=\"sg\" data-s=\"1\">Sic documentatio officialis Raku apud <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> e Pod in ipso fonte Rakudo producitur.<\/span><\/p>"]]}}}</script>
