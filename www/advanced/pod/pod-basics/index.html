<script type="application/json" id="page-data">{"u":"advanced/pod/pod-basics","n":756,"k":"topic","pv":"advanced/pod","nx":"advanced/pod/pod-basics/quiz","tr":["advanced","advanced/pod"],"L":{"en":{"t":"Pod basics","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pod documentation lives in your source file, set off by lines that begin with <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The simplest way to write a block of it is between <code>=begin pod<\/code> and <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Inside, directives describe the structure:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — headings at different levels<\/span><\/li><li><span class=\"sg\" data-s=\"1\">an ordinary paragraph — just text on its own lines<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — an item in a bulleted list<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>=head1<\/code> line is a top-level heading; the three <code>=item<\/code> lines form a list.<\/span> <span class=\"sg\" data-s=\"1\">Pod sits alongside your code without affecting it — the compiler ignores it when running the program, but can extract and render it on demand, as the last topic shows.<\/span><\/p>"]]},"de":{"t":"Pod-Grundlagen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pod-Dokumentation befindet sich in deiner Quelldatei und wird durch Zeilen abgegrenzt, die mit <code>=<\/code> beginnen.<\/span> <span class=\"sg\" data-s=\"1\">Der einfachste Weg, einen Block zu schreiben, ist zwischen <code>=begin pod<\/code> und <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre cl junto a tu código sin afectarlo — el compilador lo ignora al ejecutar el programa, pero puede extraerlo y renderizarlo bajo demanda, como muestra el último tema.<\/span><\/p>"]]},"it":{"t":"Basi di Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La documentazione Pod risiede nel file sorgente, delimitata da righe che iniziano con <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il modo più semplice per scrivere un blocco di documentazione è racchiuderlo tra <code>=begin pod<\/code> e <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">All'interno, le direttive descrivono la struttura:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — intestazioni a diversi livelli<\/span><\/li><li><span class=\"sg\" data-s=\"1\">un paragrafo ordinario — semplicemente testo sulle proprie righe<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — un elemento in un elenco puntato<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La riga <code>=head1<\/code> è un'intestazione di primo livello; le tre righe <code>=item<\/code> formano un elenco.<\/span> <span class=\"sg\" data-s=\"1\">Il Pod si affianca al codice senza influenzarlo — il compilatore lo ignora durante l'esecuzione del programma, ma può estrarlo e renderizzarlo su richiesta, come mostra l'ultimo argomento.<\/span><\/p>"]]},"lv":{"t":"Pod pamati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pod dokumentācija dzīvo jūsu pirmkoda failā, atdalīta ar rindām, kas sākas ar <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršākais veids, kā uzrakstīt tās bloku, ir starp <code>=begin pod<\/code> un <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iekšpusē direktīvas apraksta struktūru:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — dažādu līmeņu virsraksti<\/span><\/li><li><span class=\"sg\" data-s=\"1\">parasta rindkopa — vienkārši teksts savās rindās<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — punkts aizzīmētā sarakstā<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rinda <code>=head1<\/code> ir augstākā līmeņa virsraksts; trīs <code>=item<\/code> rindas veido sarakstu.<\/span> <span class=\"sg\" data-s=\"1\">Pod atrodas līdzās jūsu kodam, to neietekmējot — kompilators to ignorē, kad programma izpildās, taču pēc pieprasījuma var izvilkt un atveidot, kā rāda pēdējais temats.<\/span><\/p>"]]},"ru":{"t":"Основы Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Документация Pod находится в вашем исходном файле и выделяется строками, начинающимися с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Самый простой способ написать блок документации — поместить его между <code>=begin pod<\/code> и <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Внутри блока директивы описывают структуру:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — заголовки разных уровней<\/span><\/li><li><span class=\"sg\" data-s=\"1\">обычный абзац — просто текст на отдельных строках<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — элемент маркированного списка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Строка <code>=head1<\/code> — это заголовок верхнего уровня; три строки <code>=item<\/code> формируют список.<\/span> <span class=\"sg\" data-s=\"1\">Pod располагается рядом с вашим кодом, не влияя на него — компилятор игнорирует его при выполнении программы, но может извлечь и отрисовать его по запросу, как показано в последней теме.<\/span><\/p>"]]},"uk":{"t":"Основи Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Документація Pod живе у вашому файлі з вихідним кодом, відокремлена рядками, що починаються з <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіший спосіб записати її блок — між <code>=begin pod<\/code> та <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усередині структуру описують директиви:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — заголовки різних рівнів<\/span><\/li><li><span class=\"sg\" data-s=\"1\">звичайний абзац — просто текст на власних рядках<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — пункт маркованого списку<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рядок <code>=head1<\/code> є заголовком верхнього рівня; три рядки <code>=item<\/code> утворюють список.<\/span> <span class=\"sg\" data-s=\"1\">Pod розташовується поруч із вашим кодом, не впливаючи на нього: компілятор ігнорує його під час виконання програми, але може видобути й відобразити на вимогу, як показує остання тема.<\/span><\/p>"]]},"bg":{"t":"Основи на Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pod документацията се намира във вашия изходен файл, отделена с редове, които започват с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Най-простият начин да напишете блок от нея е между <code>=begin pod<\/code> и <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вътре директивите описват структурата:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — заглавия на различни нива<\/span><\/li><li><span class=\"sg\" data-s=\"1\">обикновен параграф — просто текст на собствени редове<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — елемент в списък с точки<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Редът <code>=head1<\/code> е заглавие от най-високо ниво; трите реда <code>=item<\/code> формират списък.<\/span> <span class=\"sg\" data-s=\"1\">Pod стои до вашия код, без да го засяга — компилаторът го игнорира при изпълнение на програмата, но може да го извлече и визуализира при поискване, както показва последната тема.<\/span><\/p>"]]},"eo":{"t":"Pod-bazaĵoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pod-dokumentado loĝas en via fontdosiero, apartigita per linioj, kiuj komenciĝas per <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La plej simpla maniero skribi blokon de ĝi estas inter <code>=begin pod<\/code> kaj <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ene, direktivoj priskribas la strukturon:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — titoloj je malsamaj niveloj<\/span><\/li><li><span class=\"sg\" data-s=\"1\">ordinara alineo — nur teksto sur propraj linioj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — ero en bula listo<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La linio <code>=head1<\/code> estas supranivela titolo; la tri linioj <code>=item<\/code> formas liston.<\/span> <span class=\"sg\" data-s=\"1\">Pod sidas apud via kodo sen influi ĝin — la kompililo ignoras ĝin, kiam ĝi rulas la programon, sed povas eltiri kaj bildigi ĝin laŭpete, kiel la lasta temo montras.<\/span><\/p>"]]},"la":{"t":"Fundamenta Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Documentatio Pod in fonte tuo habitat, lineis quae ab <code>=<\/code> incipiunt separata.<\/span> <span class=\"sg\" data-s=\"1\">Simplicissimus modus eius partem scribendi est inter <code>=begin pod<\/code> et <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Intus, directivae structuram describunt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — tituli diversorum graduum<\/span><\/li><li><span class=\"sg\" data-s=\"1\">paragraphus ordinarius — mera verba in lineis suis<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — elementum in indice punctato<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Linea <code>=head1<\/code> est titulus summi gradus; tres lineae <code>=item<\/code> indicem efficiunt.<\/span> <span class=\"sg\" data-s=\"1\">Pod iuxta codicem tuum stat sine eo afficiendo — compilator eum ignorat cum programma exsequitur, sed extrahere et reddere potest cum postulatur, ut ultimum thema ostendit.<\/span><\/p>"]]}}}</script>
