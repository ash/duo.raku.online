<script type="application/json" id="page-data">{"u":"advanced/pod","n":755,"k":"section","pv":"advanced/testing/exercises/test-a-list/solution","nx":"advanced/pod/pod-basics","tr":["advanced"],"L":{"en":{"t":"Documenting code","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has a documentation markup built into the language, called <em>Pod<\/em> (or <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">You write documentation directly in your source file using <code>=<\/code> directives, and the compiler can both render it and make it available to your program.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section covers the basic Pod directives, the formatting codes for marking up text, and how to access the documentation — either as rendered text with <code>raku --doc<\/code>, or as data through the <code>$=pod<\/code> variable.<\/span><\/p>"]]},"de":{"t":"Code dokumentieren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine in die Sprache eingebaute Dokumentations-Auszeichnungssprache namens <em>Pod<\/em> (oder <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Du schreibst Dokumentation direkt in deiner Quelldatei mithilfe von <code>=<\/code>-Direktiven, und der Compiler kann sie sowohl rendern als auch deinem Programm zur Verfügung stellen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die grundlegenden Pod-Direktiven, die Formatierungscodes zum Auszeichnen von Text und den Zugriff auf die Dokumentation — entweder als gerenderten Text mit <code>raku --doc<\/code> oder als Daten über die Variable <code>$=pod<\/code>.<\/span><\/p>"]]},"nl":{"t":"Code documenteren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een documentatie-opmaaktaal die in de taal zelf is ingebouwd, genaamd <em>Pod<\/em> (of <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft documentatie rechtstreeks in je bronbestand met behulp van <code>=<\/code>-directieven, en de compiler kan deze zowel weergeven als beschikbaar maken voor je programma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit gedeelte behandelt de basis Pod-directieven, de opmaakcodes voor het markeren van tekst, en hoe je de documentatie kunt benaderen — hetzij als weergegeven tekst met <code>raku --doc<\/code>, hetzij als gegevens via de variabele <code>$=pod<\/code>.<\/span><\/p>"]]},"es":{"t":"Documentar código","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene un marcado de documentación integrado en el lenguaje, llamado <em>Pod<\/em> (o <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Escribes la documentación directamente en tu archivo fuente usando directivas <code>=<\/code>, y el compilador puede tanto renderizarla como ponerla a disposición de tu programa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección cubre las directivas básicas de Pod, los códigos de formato para marcar texto y cómo acceder a la documentación — ya sea como texto renderizado con <code>raku --doc<\/code>, o como datos a través de la variable <code>$=pod<\/code>.<\/span><\/p>"]]},"it":{"t":"Documentare il codice","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha un linguaggio di markup per la documentazione integrato nel linguaggio stesso, chiamato <em>Pod<\/em> (o <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Si scrive la documentazione direttamente nel file sorgente usando le direttive <code>=<\/code>, e il compilatore può sia renderizzarla sia renderla disponibile al programma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta le direttive Pod di base, i codici di formattazione per la marcatura del testo e come accedere alla documentazione — sia come testo formattato con <code>raku --doc<\/code>, sia come dati attraverso la variabile <code>$=pod<\/code>.<\/span><\/p>"]]},"lv":{"t":"Koda dokumentēšana 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ir valodā iebūvēta dokumentācijas marķēšana, ko sauc par <em>Pod<\/em> (vai <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Dokumentāciju rakstāt tieši pirmkoda failā, izmantojot <code>=<\/code> direktīvas, un kompilators to var gan atveidot, gan padarīt pieejamu jūsu programmai.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko Pod pamatdirektīvas, formatēšanas kodus teksta izcelšanai un to, kā piekļūt dokumentācijai — vai nu kā atveidotam tekstam ar <code>raku --doc<\/code>, vai kā datiem caur mainīgo <code>$=pod<\/code>.<\/span><\/p>"]]},"ru":{"t":"Документирование кода","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku есть встроенная в язык разметка для документации, называемая <em>Pod<\/em> (или <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Вы пишете документацию прямо в исходном файле, используя директивы с <code>=<\/code>, и компилятор может как отрисовать её, так и сделать доступной для вашей программы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе рассматриваются основные директивы Pod, коды форматирования для разметки текста, а также способы доступа к документации — либо в виде отрисованного текста с помощью <code>raku --doc<\/code>, либо в виде данных через переменную <code>$=pod<\/code>.<\/span><\/p>"]]},"uk":{"t":"Документування коду","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku має вбудовану в мову розмітку документації, яку називають <em>Pod<\/em> (або <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Ви пишете документацію просто у файлі з вихідним кодом за допомогою директив <code>=<\/code>, а компілятор може і відобразити її, і зробити доступною вашій програмі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює базові директиви Pod, коди форматування для розмічування тексту й способи дістатися документації — чи то як відображеного тексту через <code>raku --doc<\/code>, чи то як даних через змінну <code>$=pod<\/code>.<\/span><\/p>"]]},"bg":{"t":"Документиране на код 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има вграден маркиращ синтаксис за документация, наречен <em>Pod<\/em> (или <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Пишете документацията директно във вашия изходен файл, като използвате директиви с <code>=<\/code>, а компилаторът може както да я визуализира, така и да я направи достъпна за вашата програма.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този раздел обхваща основните Pod директиви, форматиращите кодове за маркиране на текст и как да достъпите документацията — като визуализиран текст с <code>raku --doc<\/code> или като данни чрез променливата <code>$=pod<\/code>.<\/span><\/p>"]]},"eo":{"t":"Dokumentado de kodo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku havas dokumentadan markadon enkonstruitan en la lingvon, nomatan <em>Pod<\/em> (aŭ <em>Rakudoc<\/em>).<\/span> <span class=\"sg\" data-s=\"1\">Vi skribas dokumentadon rekte en via fontdosiero per direktivoj <code>=<\/code>, kaj la kompililo povas kaj bildigi ĝin kaj fari ĝin disponebla al via programo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas la bazajn Pod-direktivojn, la formatajn kodojn por marki tekston, kaj kiel aliri la dokumentadon — aŭ kiel bildigitan tekston per <code>raku --doc<\/code>, aŭ kiel datumojn per la variablo <code>$=pod<\/code>.<\/span><\/p>"]]},"la":{"t":"Codicem documentare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku notationem documentationis in ipsa lingua insitam habet, quae <em>Pod<\/em> (vel <em>Rakudoc<\/em>) appellatur.<\/span> <span class=\"sg\" data-s=\"1\">Documentationem directe in fonte tuo scribis directivis <code>=<\/code> utens, et compilator eam et reddere et programmate tuo praebere potest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec sectio fundamentales Pod directivas, notas formationis ad textum ornandas, et modum documentationem adeundi pertractat — sive ut textum redditum cum <code>raku --doc<\/code>, sive ut data per variabilem <code>$=pod<\/code>.<\/span><\/p>"]]}}}</script>
