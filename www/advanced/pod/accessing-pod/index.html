<script type="application/json" id="page-data">{"u":"advanced/pod/accessing-pod","n":760,"k":"topic","pv":"advanced/pod/rendering-pod","nx":"advanced/pod/exercises","tr":["advanced","advanced/pod"],"L":{"en":{"t":"Accessing the Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides rendering it, a program can read its own Pod from <strong>inside<\/strong>, while it runs.<\/span> <span class=\"sg\" data-s=\"1\">The special variable <code>$=pod<\/code> holds the Pod of the current file as a list of block objects, so a program can inspect its own documentation:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> here has one element — the <code>pod<\/code> block — and you can walk into it to read headings, paragraphs, and items as data.<\/span> <span class=\"sg\" data-s=\"1\">This is what tools that generate documentation, or test that it is present, rely on.<\/span> <span class=\"sg\" data-s=\"2\">Whether rendered with <code>--doc<\/code> or read through <code>$=pod<\/code>, the documentation is a first-class part of the program, not a comment to be stripped away.<\/span><\/p>"]]},"de":{"t":"Auf Pod zugreifen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben dem Rendern kann ein Programm sein eigenes Pod auch <strong>von innen<\/strong> lesen, während es läuft.<\/span> <span class=\"sg\" data-s=\"1\">Die spezielle Variable <code>$=pod<\/code> enthält das Pod der aktuellen Datei als Liste von Block-Objekten, sodass ein Programm seine eigene Dokumentation inspizieren kann:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> hat hier ein Element — den <code>pod<\/code>-Block — und du kannst in ihn hineinnavigieren, um Ueberschriften, Absaetze und Elemente als Daten zu lesen.<\/span> <span class=\"sg\" data-s=\"1\">Darauf verlassen sich Werkzeuge, die Dokumentation generieren oder prüfen, ob sie vorhanden ist.<\/span> <span class=\"sg\" data-s=\"2\">Ob mit <code>--doc<\/code> gerendert oder über <code>$=pod<\/code> gelesen — die Dokumentation ist ein vollwertiger Teil des Programms, kein Kommentar, der entfernt wird.<\/span><\/p>"]]},"nl":{"t":"Toegang tot de Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast het renderen kan een programma zijn eigen Pod ook van <strong>binnenuit<\/strong> lezen, terwijl het draait.<\/span> <span class=\"sg\" data-s=\"1\">De speciale variabele <code>$=pod<\/code> bevat de Pod van het huidige bestand als een lijst van blokobjecten, zodat een programma zijn eigen documentatie kan inspecteren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> heeft hier een element — het <code>pod<\/code>-blok — en je kunt erin navigeren om koppen, alinea's en items als gegevens te lezen.<\/span> <span class=\"sg\" data-s=\"1\">Dit is waar tools die documentatie genereren, of testen of deze aanwezig is, op vertrouwen.<\/span> <span class=\"sg\" data-s=\"2\">Of het nu wordt weergegeven met <code>--doc<\/code> of gelezen via <code>$=pod<\/code>, de documentatie is een volwaardig onderdeel van het programma, geen commentaar dat wordt weggegooid.<\/span><\/p>"]]},"es":{"t":"Acceder al Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de renderizarlo, un programa puede leer su propio Pod <strong>desde dentro<\/strong>, mientras se ejecuta.<\/span> <span class=\"sg\" data-s=\"1\">La variable especial <code>$=pod<\/code> contiene el Pod del archivo actual como una lista de objetos de bloque, de modo que un programa puede inspeccionar su propia documentación:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> aquí tiene un elemento — el bloque <code>pod<\/code> — y puedes adentrarte en él para leer encabezados, párrafos y elementos como datos.<\/span> <span class=\"sg\" data-s=\"1\">Esto es en lo que se basan las herramientas que generan documentación, o que verifican que está presente.<\/span> <span class=\"sg\" data-s=\"2\">Ya sea renderizada con <code>--doc<\/code> o leída a través de <code>$=pod<\/code>, la documentación es una parte de primera clase del programa, no un comentario que se descarta.<\/span><\/p>"]]},"it":{"t":"Accedere al Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre a renderizzarlo, un programma può leggere il proprio Pod <strong>dall'interno<\/strong>, mentre è in esecuzione.<\/span> <span class=\"sg\" data-s=\"1\">La variabile speciale <code>$=pod<\/code> contiene il Pod del file corrente come una lista di oggetti blocco, così un programma può ispezionare la propria documentazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> qui ha un solo elemento — il blocco <code>pod<\/code> — e si può navigare al suo interno per leggere intestazioni, paragrafi ed elementi come dati.<\/span> <span class=\"sg\" data-s=\"1\">È su questo che si basano gli strumenti che generano documentazione, o che verificano che sia presente.<\/span> <span class=\"sg\" data-s=\"2\">Che venga renderizzata con <code>--doc<\/code> o letta tramite <code>$=pod<\/code>, la documentazione è una parte di prima classe del programma, non un commento da eliminare.<\/span><\/p>"]]},"lv":{"t":"Piekļuve Pod datiem","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez atveidošanas programma savu Pod var nolasīt <strong>no iekšpuses<\/strong>, kamēr tā darbojas.<\/span> <span class=\"sg\" data-s=\"1\">Speciālais mainīgais <code>$=pod<\/code> satur pašreizējā faila Pod kā bloku objektu sarakstu, tāpēc programma var izpētīt savu dokumentāciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> šeit ir viens elements — bloks <code>pod<\/code> —, un tajā var ieiet, lai nolasītu virsrakstus, rindkopas un punktus kā datus.<\/span> <span class=\"sg\" data-s=\"1\">Tieši uz to paļaujas rīki, kas ģenerē dokumentāciju vai pārbauda, ka tā ir klāt.<\/span> <span class=\"sg\" data-s=\"2\">Vai atveidota ar <code>--doc<\/code>, vai nolasīta caur <code>$=pod<\/code>, dokumentācija ir pilntiesīga programmas daļa, nevis komentārs, kas jānomet.<\/span><\/p>"]]},"ru":{"t":"Доступ к Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Помимо отрисовки, программа может читать свой собственный Pod <strong>изнутри<\/strong>, во время выполнения.<\/span> <span class=\"sg\" data-s=\"1\">Специальная переменная <code>$=pod<\/code> содержит Pod текущего файла в виде списка блочных объектов, поэтому программа может просматривать свою собственную документацию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В данном примере <code>$=pod<\/code> содержит один элемент — блок <code>pod<\/code> — и вы можете углубиться в него, чтобы прочитать заголовки, абзацы и элементы как данные.<\/span> <span class=\"sg\" data-s=\"1\">Именно на этом основана работа инструментов, которые генерируют документацию или проверяют её наличие.<\/span> <span class=\"sg\" data-s=\"2\">Независимо от того, отрисована ли документация с помощью <code>--doc<\/code> или прочитана через <code>$=pod<\/code>, она является полноценной частью программы, а не комментарием, который будет удалён.<\/span><\/p>"]]},"uk":{"t":"Доступ до Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім відображення, програма може читати власний Pod <strong>зсередини<\/strong>, під час виконання.<\/span> <span class=\"sg\" data-s=\"1\">Спеціальна змінна <code>$=pod<\/code> містить Pod поточного файлу у вигляді списку об'єктів-блоків, тож програма може досліджувати власну документацію:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> тут має один елемент — блок <code>pod<\/code>, — і в нього можна зайти, щоб читати заголовки, абзаци й пункти як дані.<\/span> <span class=\"sg\" data-s=\"1\">Саме на це спираються інструменти, які генерують документацію або перевіряють її наявність.<\/span> <span class=\"sg\" data-s=\"2\">Хоч відображена через <code>--doc<\/code>, хоч прочитана через <code>$=pod<\/code>, документація є повноцінною частиною програми, а не коментарем, який належить викинути.<\/span><\/p>"]]},"bg":{"t":"Достъп до Pod","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен да го визуализира, програмата може да прочете собствения си Pod <strong>отвътре<\/strong>, докато се изпълнява.<\/span> <span class=\"sg\" data-s=\"1\">Специалната променлива <code>$=pod<\/code> съдържа Pod на текущия файл като списък от блокови обекти, така че програмата може да инспектира собствената си документация:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> тук има един елемент — блокът <code>pod<\/code> — и можете да навлезете в него, за да прочетете заглавия, параграфи и елементи като данни.<\/span> <span class=\"sg\" data-s=\"1\">Именно на това разчитат инструментите, които генерират документация или проверяват дали тя присъства.<\/span> <span class=\"sg\" data-s=\"2\">Независимо дали е визуализирана с <code>--doc<\/code> или прочетена чрез <code>$=pod<\/code>, документацията е пълноценна част от програмата, а не коментар, който да бъде премахнат.<\/span><\/p>"]]},"la":{"t":"Pod accedere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter redditionem, programma suum Pod <strong>ab intus<\/strong> legere potest, dum currit.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis specialis <code>$=pod<\/code> Pod fasciculi currentis ut indicem obiectorum truncorum continet, itaque programma suam documentationem inspicere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$=pod<\/code> hic unum elementum habet — truncum <code>pod<\/code> — et in eum descendere potes ut titulos, paragraphos, et elementa ut data legas.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est quo instrumenta nituntur quae documentationem generant, vel probant eam adesse.<\/span> <span class=\"sg\" data-s=\"2\">Sive cum <code>--doc<\/code> redditus sive per <code>$=pod<\/code> lectus, documentatio pars prima classis programmatis est, non commentarium abiciendum.<\/span><\/p>"]]}}}</script>
