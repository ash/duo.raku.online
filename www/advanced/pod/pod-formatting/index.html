<script type="application/json" id="page-data">{"u":"advanced/pod/pod-formatting","n":758,"k":"topic","pv":"advanced/pod/pod-basics/quiz","nx":"advanced/pod/rendering-pod","tr":["advanced","advanced/pod"],"L":{"en":{"t":"Formatting and code","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Within Pod text you mark up words with single-letter <em>formatting codes<\/em>, written as a letter followed by angle brackets around the text:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — bold<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — italic<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — code (monospace)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — a link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When rendered, <code>important<\/code> appears in bold and <code>say<\/code> in a code font.<\/span> <span class=\"sg\" data-s=\"1\">The codes nest and can be combined, so <code>B&lt;C&lt;say&gt;&gt;<\/code> is bold code.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For a whole block of code rather than an inline snippet, use a delimited code block — <code>=begin code … =end code<\/code> — which preserves the text verbatim:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The lines inside the code block are shown exactly as written, without being interpreted as Pod.<\/span> <span class=\"sg\" data-s=\"1\">Between the inline codes and code blocks, Pod can document an API with formatted prose and runnable-looking examples, all kept next to the code it describes.<\/span><\/p>"]]},"de":{"t":"Formatierung und Code","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Innerhalb von Pod-Text markierst du Wörter mit einbuchstabigen <em>Formatierungscodes<\/em>, die als Buchstabe gefolgt von spitzen Klammern um den Text geschrieben werden:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;...&gt;<\/code> — fett<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;...&gt;<\/code> — kursiv<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;...&gt;<\/code> — Code (Festbreitenschrift)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;...&gt;<\/code> — ein Link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beim Rendern erscheint <code>important<\/code> fett und <code>say<\/code> in einer Code-Schriftart.<\/span> <span class=\"sg\" data-s=\"1\">Die Codes können verschachtelt und kombiniert werden, sodass <code>B&lt;C&lt;say&gt;&gt;<\/code> fetter Code ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für einen ganzen Codeblock statt eines Inline-Ausschnitts verwendest du einen begrenzten Codeblock — <code>=begin code ... =end code<\/code> — der den Text wörtlich bewaehrt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Zeilen innerhalb des Codeblocks werden genau so angezeigt, wie sie geschrieben sind, ohne als Pod interpretiert zu werden.<\/span> <span class=\"sg\" data-s=\"1\">Mit den Inline-Codes und Codebloecken kann Pod eine API mit formatierter Prosa und ausführbar aussehenden Beispielen dokumentieren, alles direkt neben dem Code, den es beschreibt.<\/span><\/p>"]]},"nl":{"t":"Opmaak en code","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Binnen Pod-tekst markeer je woorden met <em>opmaakcodes<\/em> van een enkele letter, geschreven als een letter gevolgd door punthaken rond de tekst:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;...&gt;<\/code> — vet<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;...&gt;<\/code> — cursief<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;...&gt;<\/code> — code (monospace)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;...&gt;<\/code> — een link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bij het renderen verschijnt <code>important<\/code> vetgedrukt en <code>say<\/code> in een codelettertype.<\/span> <span class=\"sg\" data-s=\"1\">De codes kunnen genest en gecombineerd worden, dus <code>B&lt;C&lt;say&gt;&gt;<\/code> is vetgedrukte code.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een heel blok code in plaats van een inline fragment, gebruik je een begrensd codeblok — <code>=begin code ... =end code<\/code> — dat de tekst letterlijk bewaart:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De regels binnen het codeblok worden exact weergegeven zoals ze zijn geschreven, zonder als Pod te worden geinterpreteerd.<\/span> <span class=\"sg\" data-s=\"1\">Met de inline codes en codeblokken kan Pod een API documenteren met opgemaakte tekst en uitvoerbaar ogende voorbeelden, allemaal naast de code die het beschrijft.<\/span><\/p>"]]},"es":{"t":"Formato y código","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dentro del texto Pod, marcas las palabras con <em>códigos de formato<\/em> de una sola letra, escritos como una letra seguida de paréntesis angulares alrededor del texto:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — negrita<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — cursiva<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — código (monoespaciado)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — un enlace<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al renderizarlo, <code>important<\/code> aparece en negrita y <code>say<\/code> en fuente de código.<\/span> <span class=\"sg\" data-s=\"1\">Los códigos se anidan y pueden combinarse, así que <code>B&lt;C&lt;say&gt;&gt;<\/code> es código en negrita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un bloque completo de código en lugar de un fragmento en línea, usa un bloque de código delimitado — <code>=begin code … =end code<\/code> — que preserva el texto tal cual:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las líneas dentro del bloque de código se muestran exactamente como fueron escritas, sin ser interpretadas como Pod.<\/span> <span class=\"sg\" data-s=\"1\">Entre los códigos en línea y los bloques de código, Pod puede documentar una API con prosa formateada y ejemplos con apariencia ejecutable, todo mantenido junto al código que describe.<\/span><\/p>"]]},"it":{"t":"Formattazione e codice","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">All'interno del testo Pod si marcano le parole con <em>codici di formattazione<\/em> a lettera singola, scritti come una lettera seguita da parentesi angolari attorno al testo:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — grassetto<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — corsivo<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — codice (a spaziatura fissa)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — un collegamento<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando viene renderizzato, <code>important<\/code> appare in grassetto e <code>say<\/code> in un carattere a spaziatura fissa.<\/span> <span class=\"sg\" data-s=\"1\">I codici si annidano e possono essere combinati, quindi <code>B&lt;C&lt;say&gt;&gt;<\/code> è codice in grassetto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un intero blocco di codice anziché un frammento in linea, si usa un blocco di codice delimitato — <code>=begin code … =end code<\/code> — che preserva il testo così com'è:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le righe all'interno del blocco di codice vengono mostrate esattamente come scritte, senza essere interpretate come Pod.<\/span> <span class=\"sg\" data-s=\"1\">Tra i codici in linea e i blocchi di codice, Pod può documentare un'API con prosa formattata e esempi dall'aspetto eseguibile, il tutto mantenuto vicino al codice che descrive.<\/span><\/p>"]]},"lv":{"t":"Formatēšana un kods","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Pod tekstā vārdus izceļat ar viena burta <em>formatēšanas kodiem<\/em>, kas rakstāmi kā burts, kam seko leņķa iekavas ap tekstu:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — treknraksts<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursīvs<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — kods (vienplatuma)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — saite<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atveidojot <code>important<\/code> parādās treknrakstā, bet <code>say<\/code> — koda fontā.<\/span> <span class=\"sg\" data-s=\"1\">Kodi ligzdojas un tos var kombinēt, tāpēc <code>B&lt;C&lt;say&gt;&gt;<\/code> ir trekns kods.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Veselam koda blokam, nevis iekļautam fragmentam, izmantojiet norobežotu koda bloku — <code>=begin code … =end code<\/code> —, kas saglabā tekstu burtiski:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rindas koda bloka iekšienē tiek parādītas tieši tā, kā uzrakstītas, netiekot uztvertas kā Pod.<\/span> <span class=\"sg\" data-s=\"1\">Ar iekļautajiem kodiem un koda blokiem Pod var dokumentēt API ar formatētu tekstu un izpildāmi izskatošiem piemēriem, un tas viss tiek turēts blakus kodam, ko apraksta.<\/span><\/p>"]]},"ru":{"t":"Форматирование и код","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Внутри текста Pod вы размечаете слова с помощью однобуквенных <em>кодов форматирования<\/em>, которые записываются как буква, за которой следуют угловые скобки вокруг текста:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — жирный<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (моноширинный)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ссылка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При отрисовке слово <code>important<\/code> отображается жирным шрифтом, а <code>say<\/code> — моноширинным.<\/span> <span class=\"sg\" data-s=\"1\">Коды могут быть вложенными и комбинироваться, так что <code>B&lt;C&lt;say&gt;&gt;<\/code> — это жирный код.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для целого блока кода, а не встроенного фрагмента, используйте ограниченный блок кода — <code>=begin code … =end code<\/code> — который сохраняет текст дословно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Строки внутри блока кода отображаются именно так, как написаны, без интерпретации как Pod.<\/span> <span class=\"sg\" data-s=\"1\">Благодаря встроенным кодам и блокам кода Pod позволяет документировать API с форматированным текстом и примерами, похожими на выполняемый код, — всё это рядом с описываемым кодом.<\/span><\/p>"]]},"uk":{"t":"Форматування та код","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">У тексті Pod слова розмічують однолітерними <em>кодами форматування<\/em>, які записують як літеру, за якою йдуть кутові дужки навколо тексту:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — жирний<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (моноширинний)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — посилання<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Після відображення <code>important<\/code> з'явиться жирним, а <code>say<\/code> — кодовим шрифтом.<\/span> <span class=\"sg\" data-s=\"1\">Коди вкладаються й поєднуються, тож <code>B&lt;C&lt;say&gt;&gt;<\/code> є жирним кодом.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для цілого блоку коду, а не вбудованого уривка, використовуйте обмежений блок коду — <code>=begin code … =end code<\/code>, — який зберігає текст дослівно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рядки всередині блоку коду показуються точно так, як записані, і не тлумачаться як Pod.<\/span> <span class=\"sg\" data-s=\"1\">Поєднуючи вбудовані коди та блоки коду, Pod може документувати API форматованою прозою й прикладами, що виглядають придатними до запуску, — і все це поруч із кодом, який він описує.<\/span><\/p>"]]},"bg":{"t":"Форматиране и код","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В рамките на Pod текста маркирате думи с еднобуквени <em>форматиращи кодове<\/em>, записани като буква, последвана от ъглови скоби около текста:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — удебелен<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (моноширинен шрифт)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — връзка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При визуализиране <code>important<\/code> се показва удебелено, а <code>say<\/code> — с шрифт за код.<\/span> <span class=\"sg\" data-s=\"1\">Кодовете се влагат и могат да се комбинират, така че <code>B&lt;C&lt;say&gt;&gt;<\/code> е удебелен код.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За цял блок от код, а не вграден фрагмент, използвайте ограден кодов блок — <code>=begin code … =end code<\/code> — който запазва текста без промяна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Редовете вътре в кодовия блок се показват точно както са написани, без да бъдат интерпретирани като Pod.<\/span> <span class=\"sg\" data-s=\"1\">Между вградените кодове и кодовите блокове, Pod може да документира API с форматирана проза и примери, приличащи на изпълним код, като всичко се съхранява до кода, който описва.<\/span><\/p>"]]},"eo":{"t":"Formatado kaj kodo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ene de Pod-teksto vi markas vortojn per unu-literaj <em>formataj kodoj<\/em>, skribataj kiel litero sekvata de angulaj krampoj ĉirkaŭ la teksto:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — grasa<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursiva<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — kodo (egallarĝa)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ligilo<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam bildigita, <code>important<\/code> aperas grase kaj <code>say<\/code> en koda tiparo.<\/span> <span class=\"sg\" data-s=\"1\">La kodoj nestiĝas kaj povas esti kombinitaj, do <code>B&lt;C&lt;say&gt;&gt;<\/code> estas grasa kodo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por tuta bloko de kodo anstataŭ enteksta fragmento, uzu limigitan kodblokon — <code>=begin code … =end code<\/code> — kiu konservas la tekston laŭvorte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La linioj ene de la kodbloko estas montrataj ekzakte kiel skribitaj, sen esti interpretataj kiel Pod.<\/span> <span class=\"sg\" data-s=\"1\">Inter la entekstaj kodoj kaj kodblokoj, Pod povas dokumenti API-on per formatita prozo kaj rulebl-aspektaj ekzemploj, ĉiuj tenataj apud la kodo, kiun ili priskribas.<\/span><\/p>"]]},"la":{"t":"Formatio et codex","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Intra textum Pod verba <em>notis formationis<\/em> una littera ornare potes, quae littera scribitur et uncis angularibus circa textum:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — crassum<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — obliquum<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — codex (monospatio)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — nexus<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum redditur, <code>important<\/code> crasse apparet et <code>say<\/code> fonte codicis.<\/span> <span class=\"sg\" data-s=\"1\">Notae nidificantur et componi possunt, itaque <code>B&lt;C&lt;say&gt;&gt;<\/code> est codex crassus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad integrum codicis truncum potius quam breviloquium in linea, trunco codicis delimitato utere — <code>=begin code … =end code<\/code> — qui textum ad verbum servat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lineae intra truncum codicis prorsus ut scriptae sunt ostenduntur, sine interpretatione ut Pod.<\/span> <span class=\"sg\" data-s=\"1\">Inter notas in linea et truncos codicis, Pod API documentare potest cum prosa ornata et exemplis quae exsecutionem simulant, omnia iuxta codicem quem describunt servata.<\/span><\/p>"]]}}}</script>
