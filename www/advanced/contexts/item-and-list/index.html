<script type="application/json" id="page-data">{"u":"advanced/contexts/item-and-list","n":383,"k":"topic","pv":"advanced/contexts/coercion-contexts/quiz","nx":"advanced/contexts/item-and-list/quiz","tr":["advanced","advanced/contexts"],"L":{"en":{"t":"Item and list context","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Two further contexts decide whether something is treated as a <strong>list<\/strong> of several values or as a single <strong>item<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">This is the difference behind the <code>@<\/code> and <code>$<\/code> sigils.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>list context<\/em>, an array spreads out into its elements.<\/span> <span class=\"sg\" data-s=\"1\">A <code>for<\/code> loop puts its argument in list context, so it iterates over each element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>item context<\/em>, the same array is treated as one single value.<\/span> <span class=\"sg\" data-s=\"1\">The <code>$( … )<\/code> contextualiser forces item context, so the loop now sees just one thing and runs once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is why assigning an array to a scalar packs it as a single item rather than copying its elements: <code>my $x = @a<\/code> puts <code>@a<\/code> in item context.<\/span> <span class=\"sg\" data-s=\"1\">Note that that single element can be another container with many items in it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>$var<\/code> variable now contains a single (as it’s a scalar container) object, which is an <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can easily prove this by treating <code>$x<\/code> as a kind of array reference (as you would call it in other languages):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The matching <code>@( … )<\/code> contextualiser does the opposite, forcing list context.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There is also <em>sink context<\/em> — the context of a statement whose value is thrown away, like a line that exists only for its side effect.<\/span> <span class=\"sg\" data-s=\"1\">When a value lands in sink context with nothing useful to do, Raku may warn about a “useless use”, which is a handy hint that you forgot to use a result.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The sigil you choose (<code>$<\/code> versus <code>@<\/code>) is really a choice of context, and the contextualisers <code>$( )<\/code> and <code>@( )<\/code> let you override it where needed.<\/span><\/p>"]]},"de":{"t":"Item- und Listenkontext","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zwei weitere Kontexte entscheiden, ob etwas als eine <strong>Liste<\/strong> mehrerer Werte oder als ein einzelnes <strong>Element<\/strong> behandelt wird.<\/span> <span class=\"sg\" data-s=\"1\">Das ist der Unterschied hinter den Sigils <code>@<\/code> und <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Im <em>Listenkontext<\/em> breitet sich ein Array in seine Elemente aus.<\/span> <span class=\"sg\" data-s=\"1\">Eine <code>for<\/code>-Schleife setzt ihr Argument in den Listenkontext, sodass sie über jedes Element iteriert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Im <em>Elementkontext<\/em> wird dasselbe Array als ein einzelner Wert behandelt.<\/span> <span class=\"sg\" data-s=\"1\">Der Kontextualisierer <code>$( … )<\/code> erzwingt den Elementkontext, sodass die Schleife jetzt nur eine Sache sieht und einmal durchläuft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deshalb packt die Zuweisung eines Arrays an einen Skalar es als einzelnes Element ein, statt seine Elemente zu kopieren: <code>my $x = @a<\/code> setzt <code>@a<\/code> in den Elementkontext.<\/span> <span class=\"sg\" data-s=\"1\">Beachte, dass dieses einzelne Element ein weiterer Container mit vielen Elementen darin sein kann:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$var<\/code> enthält jetzt ein einzelnes (da es ein Skalar-Container ist) Objekt, das ein <code>Array<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst das leicht beweisen, indem du <code>$x<\/code> wie eine Art Array-Referenz behandelst (wie man es in anderen Sprachen nennen würde):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der passende Kontextualisierer <code>@( … )<\/code> bewirkt das Gegenteil und erzwingt den Listenkontext.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch den <em>Sink-Kontext<\/em> — den Kontext einer Anweisung, deren Wert verworfen wird, wie eine Zeile, die nur wegen ihres Seiteneffekts existiert.<\/span> <span class=\"sg\" data-s=\"1\">Wenn ein Wert im Sink-Kontext landet und nichts Nützliches damit zu tun ist, kann Raku vor einer \"useless use\" warnen, was ein hilfreicher Hinweis ist, dass du vergessen hast, ein Ergebnis zu verwenden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Sigil, das du wählst (<code>$<\/code> versus <code>@<\/code>), ist eigentlich eine Wahl des Kontexts, und die Kontextualisierer <code>$( )<\/code> und <code>@( )<\/code> ermöglichen es dir, ihn bei Bedarf zu überschreiben.<\/span><\/p>"]]},"nl":{"t":"Item- en lijstcontext","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Twee verdere contexten bepalen of iets wordt behandeld als een <strong>lijst<\/strong> van meerdere waarden of als een enkel <strong>item<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is het verschil achter de <code>@<\/code>- en <code>$<\/code>-sigils.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>lijstcontext<\/em> wordt een array uitgespreid tot zijn elementen.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>for<\/code>-lus plaatst zijn argument in lijstcontext, zodat het over elk element itereert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>itemcontext<\/em> wordt dezelfde array behandeld als één enkele waarde.<\/span> <span class=\"sg\" data-s=\"1\">De <code>$( … )<\/code>-contextomzetter dwingt itemcontext af, zodat de lus nu slechts één ding ziet en één keer wordt uitgevoerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is de reden waarom het toewijzen van een array aan een scalar deze als een enkel item verpakt in plaats van de elementen te kopiëren: <code>my $x = @a<\/code> plaatst <code>@a<\/code> in itemcontext.<\/span> <span class=\"sg\" data-s=\"1\">Merk op dat dat enkele element een andere container kan zijn met veel items erin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$var<\/code> bevat nu een enkel (want het is een scalaire container) object, dat een <code>Array<\/code> is.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dit eenvoudig bewijzen door <code>$x<\/code> te behandelen als een soort array-referentie (zoals je het in andere talen zou noemen):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De bijbehorende <code>@( … )<\/code>-contextomzetter doet het tegenovergestelde en dwingt lijstcontext af.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er is ook <em>sink-context<\/em> — de context van een statement waarvan de waarde wordt weggegooid, zoals een regel die alleen bestaat vanwege zijn neveneffect.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer een waarde in sink-context terechtkomt zonder iets nuttigs te doen, kan Raku waarschuwen voor een \"useless use\", wat een handige hint is dat je vergeten bent een resultaat te gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De sigil die je kiest (<code>$<\/code> versus <code>@<\/code>) is eigenlijk een keuze van context, en de contextomzetters <code>$( )<\/code> en <code>@( )<\/code> laten je deze waar nodig overschrijven.<\/span><\/p>"]]},"es":{"t":"Contexto de ítem y de lista","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dos contextos adicionales deciden si algo se trata como una <strong>lista<\/strong> de varios valores o como un solo <strong>elemento<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Esta es la diferencia detrás de los sigils <code>@<\/code> y <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <em>contexto de lista<\/em>, un array se despliega en sus elementos.<\/span> <span class=\"sg\" data-s=\"1\">Un bucle <code>for<\/code> pone su argumento en contexto de lista, así que itera sobre cada elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <em>contexto de elemento<\/em>, el mismo array se trata como un solo valor.<\/span> <span class=\"sg\" data-s=\"1\">El contextualizador <code>$( … )<\/code> fuerza el contexto de elemento, así que el bucle ahora ve solo una cosa y se ejecuta una vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por eso, asignar un array a un escalar lo empaqueta como un solo elemento en lugar de copiar sus elementos: <code>my $x = @a<\/code> pone <code>@a<\/code> en contexto de elemento.<\/span> <span class=\"sg\" data-s=\"1\">Ten en cuenta que ese único elemento puede ser otro contenedor con muchos elementos dentro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$var<\/code> ahora contiene un solo objeto (ya que es un contenedor escalar), que es un <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes demostrar esto fácilmente tratando <code>$x<\/code> como una especie de referencia a array (como lo llamarías en otros lenguajes):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El contextualizador correspondiente <code>@( … )<\/code> hace lo opuesto, forzando el contexto de lista.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También existe el <em>contexto sink<\/em> — el contexto de una sentencia cuyo valor se descarta, como una línea que existe solo por su efecto secundario.<\/span> <span class=\"sg\" data-s=\"1\">Cuando un valor cae en contexto sink sin nada útil que hacer, Raku puede advertir sobre un \"uso inútil\", lo cual es una pista útil de que olvidaste usar un resultado.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El sigil que eliges (<code>$<\/code> versus <code>@<\/code>) es realmente una elección de contexto, y los contextualizadores <code>$( )<\/code> y <code>@( )<\/code> te permiten anularlo cuando sea necesario.<\/span><\/p>"]]},"it":{"t":"Contesto elemento e lista","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Due ulteriori contesti decidono se qualcosa viene trattato come una <strong>lista<\/strong> di piu valori o come un singolo <strong>elemento<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Questa e la differenza alla base dei sigilli <code>@<\/code> e <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nel <em>contesto lista<\/em>, un array si espande nei suoi elementi.<\/span> <span class=\"sg\" data-s=\"1\">Un ciclo <code>for<\/code> mette il suo argomento in contesto lista, quindi itera su ciascun elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nel <em>contesto elemento<\/em>, lo stesso array viene trattato come un singolo valore.<\/span> <span class=\"sg\" data-s=\"1\">Il contestualizzatore <code>$( … )<\/code> forza il contesto elemento, quindi il ciclo ora vede una sola cosa e viene eseguito una volta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco perche assegnare un array a uno scalare lo impacchetta come un singolo elemento piuttosto che copiarne gli elementi: <code>my $x = @a<\/code> mette <code>@a<\/code> in contesto elemento.<\/span> <span class=\"sg\" data-s=\"1\">Nota che quel singolo elemento puo essere un altro contenitore con molti elementi al suo interno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$var<\/code> ora contiene un singolo oggetto (essendo un contenitore scalare), che e un <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi facilmente verificarlo trattando <code>$x<\/code> come una sorta di riferimento ad array (come lo chiameresti in altri linguaggi):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il contestualizzatore corrispondente <code>@( … )<\/code> fa l'opposto, forzando il contesto lista.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esiste anche il <em>contesto sink<\/em> — il contesto di un'istruzione il cui valore viene scartato, come una riga che esiste solo per il suo effetto collaterale.<\/span> <span class=\"sg\" data-s=\"1\">Quando un valore finisce in contesto sink senza nulla di utile da fare, Raku puo avvisare di un \"useless use\", che e un utile suggerimento che hai dimenticato di usare un risultato.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il sigillo che scegli (<code>$<\/code> contro <code>@<\/code>) e in realta una scelta di contesto, e i contestualizzatori <code>$( )<\/code> e <code>@( )<\/code> ti permettono di sovrascriverlo dove necessario.<\/span><\/p>"]]},"lv":{"t":"Vienuma un saraksta konteksts","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vēl divi konteksti nosaka, vai kaut kas tiek uzskatīts par <strong>sarakstu<\/strong> ar vairākām vērtībām vai par vienu <strong>elementu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir atšķirība, kas slēpjas aiz <code>@<\/code> un <code>$<\/code> sigiliem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Saraksta kontekstā<\/em> masīvs izklājas savos elementos.<\/span> <span class=\"sg\" data-s=\"1\"><code>for<\/code> cikls ievieto savu argumentu saraksta kontekstā, tāpēc tas iterē cauri katram elementam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Elementa kontekstā<\/em> tas pats masīvs tiek uzskatīts par vienu vērtību.<\/span> <span class=\"sg\" data-s=\"1\"><code>$( … )<\/code> kontekstualizators piespiedu kārtā uzliek elementa kontekstu, tāpēc tagad cikls redz tikai vienu lietu un izpildās vienu reizi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpēc, piešķirot masīvu skalāram, tas tiek iesaiņots kā viens elements, nevis kopēti tā elementi: <code>my $x = @a<\/code> ievieto <code>@a<\/code> elementa kontekstā.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā, ka šis vienīgais elements var būt cits konteiners ar daudziem elementiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$var<\/code> tagad satur vienu (jo tas ir skalārs konteiners) objektu, kas ir <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To var viegli pierādīt, apstrādājot <code>$x<\/code> kā masīva atsauci (kā to sauktu citās valodās):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atbilstošais <code>@( … )<\/code> kontekstualizators dara pretējo — piespiedu kārtā uzliek saraksta kontekstu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pastāv arī <em>izlietnes konteksts<\/em> (sink context) — izteikuma konteksts, kura vērtība tiek izmesta, piemēram, rinda, kas pastāv tikai sava blakusefekta dēļ.<\/span> <span class=\"sg\" data-s=\"1\">Kad vērtība nonāk izlietnes kontekstā bez noderīga pielietojuma, Raku var brīdināt par \"bezjēdzīgu lietojumu\" (useless use), kas ir noderīgs padoms, ka esat aizmirsis izmantot rezultātu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izvēlētais sigils (<code>$<\/code> vai <code>@<\/code>) faktiski ir konteksta izvēle, un kontekstualizatori <code>$( )<\/code> un <code>@( )<\/code> ļauj to vajadzības gadījumā mainīt.<\/span><\/p>"]]},"ru":{"t":"Элементный и списковый контекст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Два дополнительных контекста определяют, будет ли что-то рассматриваться как <strong>список<\/strong> из нескольких значений или как один <strong>элемент<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">В этом заключается различие между сигилами <code>@<\/code> и <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <em>контексте списка<\/em> массив раскрывается в свои элементы.<\/span> <span class=\"sg\" data-s=\"1\">Цикл <code>for<\/code> помещает свой аргумент в контекст списка, поэтому он перебирает каждый элемент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <em>контексте элемента<\/em> тот же массив рассматривается как одно единственное значение.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуализатор <code>$( … )<\/code> принудительно задаёт контекст элемента, поэтому цикл теперь видит только одну вещь и выполняется один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот почему присвоение массива скаляру упаковывает его как единый элемент, а не копирует его элементы: <code>my $x = @a<\/code> помещает <code>@a<\/code> в контекст элемента.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что этот единственный элемент может быть другим контейнером с множеством элементов внутри:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$var<\/code> теперь содержит один (поскольку это скалярный контейнер) объект, который является <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете легко убедиться в этом, обращаясь к <code>$x<\/code> как к своего рода ссылке на массив (как это называлось бы в других языках):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Соответствующий контекстуализатор <code>@( … )<\/code> делает обратное, принудительно задавая контекст списка.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Существует также <em>контекст поглощения (sink context)<\/em> — контекст выражения, значение которого отбрасывается, например, строка кода, существующая только ради побочного эффекта.<\/span> <span class=\"sg\" data-s=\"1\">Когда значение попадает в контекст поглощения без полезного применения, Raku может предупредить о «бесполезном использовании» (useless use), что является полезной подсказкой о том, что вы забыли использовать результат.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сигил, который вы выбираете (<code>$<\/code> или <code>@<\/code>), — это по сути выбор контекста, а контекстуализаторы <code>$( )<\/code> и <code>@( )<\/code> позволяют при необходимости его переопределить.<\/span><\/p>"]]},"uk":{"t":"Штучний та списковий контекст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ще два контексти вирішують, чи розглядати щось як <strong>список<\/strong> із кількох значень, чи як один <strong>елемент<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Саме в цьому полягає різниця між сигілами <code>@<\/code> та <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <em>списковому контексті<\/em> масив розгортається у свої елементи.<\/span> <span class=\"sg\" data-s=\"1\">Цикл <code>for<\/code> ставить свій аргумент у списковий контекст, тож проходить по кожному елементу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <em>штучному контексті<\/em> той самий масив розглядається як одне-єдине значення.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуалізатор <code>$( … )<\/code> задає штучний контекст, тож цикл тепер бачить лише одну річ і виконується один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме тому присвоєння масиву скаляру пакує його як один елемент, а не копіює його елементи: <code>my $x = @a<\/code> ставить <code>@a<\/code> у штучний контекст.<\/span> <span class=\"sg\" data-s=\"1\">Зауважте, що цим одним елементом може бути інший контейнер із багатьма елементами всередині:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$var<\/code> тепер містить один (адже це скалярний контейнер) об'єкт, яким є <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Легко довести це, розглядаючи <code>$x<\/code> як своєрідне посилання на масив (як його назвали б в інших мовах):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Парний контекстуалізатор <code>@( … )<\/code> робить протилежне — задає списковий контекст.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Є ще <em>контекст стоку<\/em> (sink context) — контекст оператора, значення якого відкидається, як-от рядок, що існує лише заради побічного ефекту.<\/span> <span class=\"sg\" data-s=\"1\">Коли значення потрапляє в контекст стоку, не маючи чого корисного робити, Raku може попередити про «useless use», і це зручний натяк, що ви забули скористатися результатом.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сигіл, який ви обираєте (<code>$<\/code> проти <code>@<\/code>), насправді є вибором контексту, а контекстуалізатори <code>$( )<\/code> та <code>@( )<\/code> дозволяють перевизначити його там, де це потрібно.<\/span><\/p>"]]},"bg":{"t":"Елементен и списъчен контекст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Два допълнителни контекста определят дали нещо се третира като <strong>списък<\/strong> от няколко стойности или като единичен <strong>елемент<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Това е разликата зад сигилите <code>@<\/code> и <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <em>контекст на списък<\/em> масивът се разгъва в своите елементи.<\/span> <span class=\"sg\" data-s=\"1\">Цикълът <code>for<\/code> поставя аргумента си в контекст на списък, така че итерира по всеки елемент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <em>контекст на елемент<\/em> същият масив се третира като една единствена стойност.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуализаторът <code>$( … )<\/code> налага контекст на елемент, така че цикълът вижда само едно нещо и се изпълнява веднъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Затова присвояването на масив към скалар го опакова като единичен елемент, вместо да копира елементите му: <code>my $x = @a<\/code> поставя <code>@a<\/code> в контекст на елемент.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание, че този единичен елемент може да бъде друг контейнер с много елементи в него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$var<\/code> сега съдържа единичен (тъй като е скаларен контейнер) обект, който е <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете лесно да докажете това, като третирате <code>$x<\/code> като вид препратка към масив (както бихте го нарекли в други езици):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съответният контекстуализатор <code>@( … )<\/code> прави обратното, налагайки контекст на списък.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Съществува и <em>sink контекст<\/em> — контекстът на оператор, чиято стойност се изхвърля, като ред, който съществува само заради страничния си ефект.<\/span> <span class=\"sg\" data-s=\"1\">Когато стойност попадне в sink контекст без нищо полезно за правене, Raku може да предупреди за „useless use\", което е полезна подсказка, че сте забравили да използвате резултата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сигилът, който избирате (<code>$<\/code> срещу <code>@<\/code>), всъщност е избор на контекст, а контекстуализаторите <code>$( )<\/code> и <code>@( )<\/code> ви позволяват да го промените, когато е необходимо.<\/span><\/p>"]]},"eo":{"t":"Era kaj lista kunteksto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Du pluaj kuntekstoj decidas, ĉu io estas traktata kiel <strong>listo<\/strong> de pluraj valoroj aŭ kiel unuopa <strong>ero<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas la diferenco malantaŭ la sigeloj <code>@<\/code> kaj <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <em>lista kunteksto<\/em>, tabelo disvastiĝas en siajn elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Buklo <code>for<\/code> metas sian argumenton en listan kuntekston, do ĝi iteras tra ĉiu elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <em>era kunteksto<\/em>, la sama tabelo estas traktata kiel unu sola valoro.<\/span> <span class=\"sg\" data-s=\"1\">La kuntekstigilo <code>$( … )<\/code> trudas eran kuntekston, do la buklo nun vidas nur unu aferon kaj ruliĝas unufoje:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tial asigno de tabelo al skalaro pakas ĝin kiel unuopan eron anstataŭ kopii ĝiajn elementojn: <code>my $x = @a<\/code> metas <code>@a<\/code> en eran kuntekston.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, ke tiu unuopa elemento povas esti alia ujo kun multaj eroj en ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$var<\/code> nun enhavas unuopan (ĉar ĝi estas skalara ujo) objekton, kiu estas <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas facile pruvi tion traktante <code>$x<\/code> kiel specon de tabela referenco (kiel vi nomus ĝin en aliaj lingvoj):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La responda kuntekstigilo <code>@( … )<\/code> faras la malon, trudante listan kuntekston.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ <em>sink-kunteksto<\/em> — la kunteksto de deklaro, kies valoro estas forĵetata, kiel linio kiu ekzistas nur por sia flanka efiko.<\/span> <span class=\"sg\" data-s=\"1\">Kiam valoro trafas sink-kuntekston sen io utila por fari, Raku povas averti pri \"senutila uzo\", kio estas utila indiko, ke vi forgesis uzi rezulton.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sigelo, kiun vi elektas (<code>$<\/code> kontraŭ <code>@<\/code>), estas vere elekto de kunteksto, kaj la kuntekstigiloj <code>$( )<\/code> kaj <code>@( )<\/code> permesas al vi superregi ĝin kie necese.<\/span><\/p>"]]},"la":{"t":"Elementalis et listae contextus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Duo contextus ulterius decernunt utrum aliquid tractetur ut <strong>lista<\/strong> plurium valorum an ut unum <strong>item<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Haec est differentia post sigilla <code>@<\/code> et <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>contextu listae<\/em>, ordo in elementa sua expanditur.<\/span> <span class=\"sg\" data-s=\"1\">Ansa <code>for<\/code> argumentum suum in contextum listae ponit, itaque per unumquodque elementum iterat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>contextu item<\/em>, idem ordo ut unus valor tractatur.<\/span> <span class=\"sg\" data-s=\"1\">Contextualiser <code>$( … )<\/code> contextum item cogit, itaque ansa nunc unum tantum videt et semel currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec est causa cur assignatio ordinis ad scalarem eum ut unum item componat potius quam elementa eius copiet: <code>my $x = @a<\/code> ordinem <code>@a<\/code> in contextum item ponit.<\/span> <span class=\"sg\" data-s=\"1\">Nota quod illud unum elementum potest esse alius container cum multis itemis in eo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$var<\/code> nunc continet unum (quia container scalaris est) obiectum, quod est <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc facile probare potes tractando <code>$x<\/code> ut genus referentiae ordinis (ut in aliis linguis diceres):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Contextualiser congruens <code>@( … )<\/code> contrarium facit, contextum listae cogens.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Est etiam <em>contextus sink<\/em> — contextus enuntiati cuius valor abicitur, ut linea quae solum propter effectum lateralem existit.<\/span> <span class=\"sg\" data-s=\"1\">Cum valor in contextum sink cadit nihil utile faciens, Raku monere potest de \"useless use\", quod est utile indicium te oblitum esse resultatum adhibere.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sigillum quod eligis (<code>$<\/code> contra <code>@<\/code>) revera est electio contextus, et contextualisers <code>$( )<\/code> et <code>@( )<\/code> sinunt te id ubi opus est superscribere.<\/span><\/p>"]]}}}</script>
