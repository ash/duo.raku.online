<script type="application/json" id="page-data">{"u":"advanced/contexts/coercion-contexts","n":381,"k":"topic","pv":"advanced/contexts","nx":"advanced/contexts/coercion-contexts/quiz","tr":["advanced","advanced/contexts"],"L":{"en":{"t":"Numeric, string, and Boolean context","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Three very common contexts ask a value to behave as a number, a string, or a Boolean value.<\/span> <span class=\"sg\" data-s=\"1\">Each has a prefix operator that forces it explicitly:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numeric context<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — string context<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Boolean context<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Applied to an array, they give its length, its elements joined by spaces, and whether it has any elements:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An empty array is <code>0<\/code> in numeric context and <code>False<\/code> in Boolean context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You don’t need to always write these operators by hand, because the language can impose the right context for you.<\/span> <span class=\"sg\" data-s=\"1\">Arithmetic puts its operands in numeric context, concatenation puts them in string context, and <code>if<\/code>, <code>while<\/code>, and <code>and<\/code>/<code>or<\/code> put their condition in Boolean context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So <code>if @array { … }<\/code> works exactly as you would hope: a non-empty array is true.<\/span> <span class=\"sg\" data-s=\"1\">The prefix operators are the explicit way to ask for the same coercions.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In a compination with a postfix <code>if<\/code>, this allows to create really expressive code:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"de":{"t":"Numerischer, String- und Boolescher Kontext","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Drei sehr häufige Kontexte fordern einen Wert auf, sich als Zahl, als String oder als Boolescher Wert zu verhalten.<\/span> <span class=\"sg\" data-s=\"1\">Jeder hat einen Präfixoperator, der ihn explizit erzwingt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numerischer Kontext<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — Stringkontext<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Boolescher Kontext<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auf ein Array angewendet, ergeben sie seine Länge, seine durch Leerzeichen verbundenen Elemente und ob es Elemente enthält:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein leeres Array ist im numerischen Kontext <code>0<\/code> und im Booleschen Kontext <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du musst diese Operatoren nicht immer von Hand schreiben, denn die Sprache kann den richtigen Kontext für dich festlegen.<\/span> <span class=\"sg\" data-s=\"1\">Arithmetik setzt ihre Operanden in den numerischen Kontext, Verkettung setzt sie in den Stringkontext, und <code>if<\/code>, <code>while<\/code> und <code>and<\/code>/<code>or<\/code> setzen ihre Bedingung in den Booleschen Kontext:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>if @array { … }<\/code> funktioniert also genau so, wie man es erhoffen würde: Ein nicht-leeres Array ist wahr.<\/span> <span class=\"sg\" data-s=\"1\">Die Präfixoperatoren sind die explizite Art, dieselben Umwandlungen anzufordern.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In Kombination mit einem nachgestellten <code>if<\/code> ermöglicht dies wirklich ausdrucksstarken Code:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"nl":{"t":"Numerieke, string- en Booleaanse context","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Drie veel voorkomende contexten vragen een waarde om zich te gedragen als een getal, een string of een Booleaanse waarde.<\/span> <span class=\"sg\" data-s=\"1\">Elk heeft een prefix-operator die dit expliciet afdwingt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numerieke context<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — stringcontext<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Booleaanse context<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Toegepast op een array geven ze respectievelijk de lengte, de elementen gescheiden door spaties, en of de array elementen bevat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een lege array is <code>0<\/code> in numerieke context en <code>False<\/code> in Booleaanse context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hoeft deze operatoren niet altijd handmatig te schrijven, want de taal kan de juiste context voor je opleggen.<\/span> <span class=\"sg\" data-s=\"1\">Rekenkundige bewerkingen plaatsen hun operanden in numerieke context, aaneenschakeling plaatst ze in stringcontext, en <code>if<\/code>, <code>while<\/code> en <code>and<\/code>/<code>or<\/code> plaatsen hun voorwaarde in Booleaanse context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dus <code>if @array { … }<\/code> werkt precies zoals je zou hopen: een niet-lege array is waar.<\/span> <span class=\"sg\" data-s=\"1\">De prefix-operatoren zijn de expliciete manier om dezelfde conversies aan te vragen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In combinatie met een postfix <code>if<\/code> maakt dit echt expressieve code mogelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"es":{"t":"Contexto numérico, de cadena y booleano","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres contextos muy comunes piden a un valor que se comporte como un número, una cadena o un valor booleano.<\/span> <span class=\"sg\" data-s=\"1\">Cada uno tiene un operador prefijo que lo fuerza explícitamente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contexto numérico<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contexto de cadena<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contexto booleano<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aplicados a un array, devuelven su longitud, sus elementos unidos por espacios, y si tiene algún elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un array vacío es <code>0<\/code> en contexto numérico y <code>False<\/code> en contexto booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No necesitas escribir siempre estos operadores a mano, porque el lenguaje puede imponer el contexto correcto por ti.<\/span> <span class=\"sg\" data-s=\"1\">La aritmética pone sus operandos en contexto numérico, la concatenación los pone en contexto de cadena, e <code>if<\/code>, <code>while<\/code> y <code>and<\/code>/<code>or<\/code> ponen su condición en contexto booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que <code>if @array { … }<\/code> funciona exactamente como esperarías: un array no vacío es verdadero.<\/span> <span class=\"sg\" data-s=\"1\">Los operadores prefijo son la forma explícita de pedir las mismas coerciones.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En combinación con un <code>if<\/code> postfijo, esto permite crear código realmente expresivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"it":{"t":"Contesto numerico, stringa e booleano","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tre contesti molto comuni richiedono a un valore di comportarsi come un numero, una stringa o un valore Booleano.<\/span> <span class=\"sg\" data-s=\"1\">Ciascuno ha un operatore prefisso che lo forza esplicitamente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contesto numerico<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contesto stringa<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contesto Booleano<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Applicati a un array, restituiscono rispettivamente la sua lunghezza, i suoi elementi uniti da spazi, e se contiene elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un array vuoto e <code>0<\/code> in contesto numerico e <code>False<\/code> in contesto Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non e necessario scrivere sempre questi operatori manualmente, perche il linguaggio puo imporre il contesto corretto al posto vostro.<\/span> <span class=\"sg\" data-s=\"1\">L'aritmetica mette i suoi operandi in contesto numerico, la concatenazione li mette in contesto stringa, e <code>if<\/code>, <code>while<\/code> e <code>and<\/code>/<code>or<\/code> mettono la loro condizione in contesto Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>if @array { … }<\/code> funziona esattamente come ci si aspetterebbe: un array non vuoto e vero.<\/span> <span class=\"sg\" data-s=\"1\">Gli operatori prefisso sono il modo esplicito per richiedere le stesse conversioni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In combinazione con un <code>if<\/code> postfisso, questo permette di creare codice davvero espressivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"lv":{"t":"Skaitliskais, virkņu un Būla konteksts","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Trīs ļoti bieži konteksti pieprasa vērtībai uzvesties kā skaitlim, virknei vai Būla vērtībai.<\/span> <span class=\"sg\" data-s=\"1\">Katram no tiem ir prefiksa operators, kas to piespiedu kārtā uzliek:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — skaitliskais konteksts<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — virknes konteksts<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Būla konteksts<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemērojot masīvam, tie atgriež tā garumu, tā elementus apvienotus ar atstarpēm un to, vai tam ir kādi elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tukšs masīvs ir <code>0<\/code> skaitliskajā kontekstā un <code>False<\/code> Būla kontekstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jums nav vienmēr jāraksta šie operatori manuāli, jo valoda var uzlikt pareizo kontekstu jūsu vietā.<\/span> <span class=\"sg\" data-s=\"1\">Aritmētika ievieto savus operandus skaitliskajā kontekstā, konkatenācija — virknes kontekstā, un <code>if<\/code>, <code>while<\/code>, un <code>and<\/code>/<code>or<\/code> ievieto savu nosacījumu Būla kontekstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>if @array { … }<\/code> darbojas tieši tā, kā jūs cerētu: nepustošs masīvs ir patiess.<\/span> <span class=\"sg\" data-s=\"1\">Prefiksa operatori ir tiešais veids, kā pieprasīt tās pašas pārvēršanas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kombinācijā ar postfiksa <code>if<\/code> tas ļauj izveidot patiešām izteiksmīgu kodu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"ru":{"t":"Числовой, строковый и булев контекст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Три наиболее распространённых контекста требуют от значения вести себя как число, строка или логическое значение.<\/span> <span class=\"sg\" data-s=\"1\">Каждый из них имеет префиксный оператор, который принудительно задаёт контекст:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числовой контекст<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — строковый контекст<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — логический контекст<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Применённые к массиву, они возвращают его длину, его элементы, объединённые через пробел, и наличие в нём элементов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пустой массив равен <code>0<\/code> в числовом контексте и <code>False<\/code> в логическом контексте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам не всегда нужно писать эти операторы вручную, потому что язык может наложить нужный контекст за вас.<\/span> <span class=\"sg\" data-s=\"1\">Арифметика помещает свои операнды в числовой контекст, конкатенация — в строковый контекст, а <code>if<\/code>, <code>while<\/code> и <code>and<\/code>/<code>or<\/code> помещают своё условие в логический контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таким образом, <code>if @array { … }<\/code> работает именно так, как вы ожидаете: непустой массив является истинным.<\/span> <span class=\"sg\" data-s=\"1\">Префиксные операторы — это явный способ запросить те же приведения.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В сочетании с постфиксным <code>if<\/code> это позволяет создавать действительно выразительный код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"uk":{"t":"Числовий, рядковий та булевий контекст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Три дуже поширені контексти просять значення повестися як число, як рядок або як булеве значення.<\/span> <span class=\"sg\" data-s=\"1\">Кожен має префіксний оператор, що задає його явно:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числовий контекст<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — рядковий контекст<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — булевий контекст<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Застосовані до масиву, вони дають його довжину, його елементи, з'єднані пробілами, і те, чи є в ньому взагалі елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порожній масив у числовому контексті дорівнює <code>0<\/code>, а в булевому — <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Писати ці оператори вручну щоразу не потрібно, бо мова може накинути потрібний контекст за вас.<\/span> <span class=\"sg\" data-s=\"1\">Арифметика ставить свої операнди в числовий контекст, конкатенація — у рядковий, а <code>if<\/code>, <code>while<\/code> та <code>and<\/code>/<code>or<\/code> ставлять свою умову в булевий контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, тут @a це його довжина: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тож <code>if @array { … }<\/code> працює саме так, як ви й сподівалися: непорожній масив є істинним.<\/span> <span class=\"sg\" data-s=\"1\">Префіксні оператори — це явний спосіб попросити те саме перетворення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У поєднанні з постфіксним <code>if<\/code> це дозволяє писати справді виразний код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"bg":{"t":"Числов, низов и булев контекст","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Три много често срещани контекста изискват стойността да се държи като число, низ или булева стойност.<\/span> <span class=\"sg\" data-s=\"1\">Всеки от тях има префиксен оператор, който го налага изрично:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числов контекст<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — низов контекст<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — булев контекст<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приложени към масив, те дават неговата дължина, елементите му, обединени с интервали, и дали съдържа елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Празен масив е <code>0<\/code> в числов контекст и <code>False<\/code> в булев контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не е необходимо винаги да изписвате тези оператори ръчно, защото езикът може да наложи правилния контекст вместо вас.<\/span> <span class=\"sg\" data-s=\"1\">Аритметиката поставя операндите си в числов контекст, конкатенацията ги поставя в низов контекст, а <code>if<\/code>, <code>while<\/code> и <code>and<\/code>/<code>or<\/code> поставят условието си в булев контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така <code>if @array { … }<\/code> работи точно както бихте очаквали: непразен масив е истина.<\/span> <span class=\"sg\" data-s=\"1\">Префиксните оператори са явният начин да поискате същите преобразувания.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В комбинация с постфиксен <code>if<\/code>, това позволява да се създаде наистина изразителен код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"eo":{"t":"Nombra, ĉena kaj Boolea kunteksto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tri tre oftaj kuntekstoj petas valoron konduti kiel nombro, ĉeno aŭ bulea valoro.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu havas prefiksan operatoron, kiu trudas ĝin eksplicite:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — nombra kunteksto<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — ĉena kunteksto<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — bulea kunteksto<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aplikataj al tabelo, ili donas ĝian longon, ĝiajn elementojn kunigitajn per spacoj, kaj ĉu ĝi havas iujn elementojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Malplena tabelo estas <code>0<\/code> en nombra kunteksto kaj <code>False<\/code> en bulea kunteksto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ne ĉiam bezonas skribi ĉi tiujn operatorojn mane, ĉar la lingvo povas trudi la ĝustan kuntekston por vi.<\/span> <span class=\"sg\" data-s=\"1\">Aritmetiko metas siajn operandojn en nombran kuntekston, kunigo metas ilin en ĉenan kuntekston, kaj <code>if<\/code>, <code>while<\/code>, kaj <code>and<\/code>/<code>or<\/code> metas sian kondiĉon en bulean kuntekston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do <code>if @array { … }<\/code> funkcias ĝuste kiel vi esperus: nemalplena tabelo estas vera.<\/span> <span class=\"sg\" data-s=\"1\">La prefiksaj operatoroj estas la eksplicita maniero peti la samajn konvertojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En kombino kun postfiksa <code>if<\/code>, tio permesas krei vere esprimplenan kodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"la":{"t":"Numericus, catenarius, et Booleanus contextus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres contextus frequentissimi valorem postulant ut se gerat tamquam numerus, chorda, vel valor Booleanus.<\/span> <span class=\"sg\" data-s=\"1\">Quisque habet operatorem praefixum qui id expresse cogit:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contextus numericus<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contextus chordae<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contextus Booleanus<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad ordinem applicati, dant eius longitudinem, eius elementa spatiis coniuncta, et utrum elementa habeat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ordo vacuus est <code>0<\/code> in contextu numerico et <code>False<\/code> in contextu Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non semper necesse est hos operatores manu scribere, quia lingua rectum contextum pro te imponere potest.<\/span> <span class=\"sg\" data-s=\"1\">Arithmetica operandos suos in contextum numericum ponit, concatenatio eos in contextum chordae ponit, et <code>if<\/code>, <code>while<\/code>, et <code>and<\/code>/<code>or<\/code> condicionem suam in contextum Booleanum ponunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>if @array { … }<\/code> exacte ita operatur ut speres: ordo non vacuus verus est.<\/span> <span class=\"sg\" data-s=\"1\">Operatores praefixi sunt modus expressus easdem coercitiones postulandi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In combinatione cum postfixo <code>if<\/code>, hoc sinit codicem vere expressum creare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]}}}</script>
