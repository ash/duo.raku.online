<script type="application/json" id="page-data">{"u":"advanced/contexts","n":380,"k":"section","pv":"advanced/ordered-containers/exercises/bind-a-scalar/solution","nx":"advanced/contexts/coercion-contexts","tr":["advanced"],"L":{"en":{"t":"Contexts","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A value in Raku can sometimes behave differently as it adapts to the <em>context<\/em> in which it is used.<\/span> <span class=\"sg\" data-s=\"1\">For example, the same array can act as a number (its length), as a string (its elements joined), or as a truth value (array’s empty or not), depending on what the surrounding code asks for.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Understanding context explains a lot of Raku that would otherwise look surprising: why <code>+@array<\/code> is a number, why an array put in a scalar behaves as a single item, and why <code>if @array<\/code> tests emptiness.<\/span> <span class=\"sg\" data-s=\"1\">This section covers the main contexts.<\/span><\/p>"]]},"de":{"t":"Kontexte","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Wert in Raku kann sich manchmal unterschiedlich verhalten, da er sich an den <em>Kontext<\/em> anpasst, in dem er verwendet wird.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kann dasselbe Array als Zahl (seine Länge), als String (seine verbundenen Elemente) oder als Wahrheitswert (ob das Array leer ist oder nicht) fungieren, je nachdem, was der umgebende Code verlangt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Verständnis von Kontexten erklärt vieles in Raku, was sonst überraschend wirken würde: warum <code>+@array<\/code> eine Zahl ist, warum ein Array in einem Skalar sich als einzelnes Element verhält und warum <code>if @array<\/code> auf Leerheit prüft.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt die wichtigsten Kontexte.<\/span><\/p>"]]},"nl":{"t":"Contexten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een waarde in Raku kan zich soms anders gedragen doordat het zich aanpast aan de <em>context<\/em> waarin het wordt gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Dezelfde array kan bijvoorbeeld fungeren als een getal (de lengte), als een string (de elementen samengevoegd), of als een waarheidswaarde (array is leeg of niet), afhankelijk van wat de omringende code vraagt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het begrijpen van context verklaart veel van Raku dat anders verrassend zou lijken: waarom <code>+@array<\/code> een getal is, waarom een array die in een scalar wordt geplaatst zich als een enkel item gedraagt, en waarom <code>if @array<\/code> op leegte test.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte behandelt de belangrijkste contexten.<\/span><\/p>"]]},"es":{"t":"Contextos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un valor en Raku puede a veces comportarse de manera diferente al adaptarse al <em>contexto<\/em> en el que se usa.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, el mismo array puede actuar como un número (su longitud), como una cadena (sus elementos unidos), o como un valor de verdad (si el array está vacío o no), dependiendo de lo que el código circundante solicite.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entender los contextos explica mucho de Raku que de otro modo parecería sorprendente: por qué <code>+@array<\/code> es un número, por qué un array puesto en un escalar se comporta como un solo elemento, y por qué <code>if @array<\/code> comprueba si está vacío.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección cubre los contextos principales.<\/span><\/p>"]]},"it":{"t":"Contesti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un valore in Raku a volte puo comportarsi in modo diverso adattandosi al <em>contesto<\/em> in cui viene utilizzato.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, lo stesso array puo agire come un numero (la sua lunghezza), come una stringa (i suoi elementi uniti), o come un valore di verita (array vuoto o meno), a seconda di cio che il codice circostante richiede.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Comprendere il contesto spiega molto di Raku che altrimenti sembrerebbe sorprendente: perche <code>+@array<\/code> e un numero, perche un array inserito in uno scalare si comporta come un singolo elemento, e perche <code>if @array<\/code> verifica se e vuoto.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione copre i contesti principali.<\/span><\/p>"]]},"lv":{"t":"Konteksti 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vērtība Raku valodā dažreiz var uzvesties atšķirīgi, pielāgojoties <em>kontekstam<\/em>, kurā tā tiek izmantota.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, viens un tas pats masīvs var darboties kā skaitlis (tā garums), kā virkne (tā elementi apvienoti) vai kā patiesuma vērtība (masīvs ir tukšs vai nē), atkarībā no tā, ko apkārtējais kods pieprasa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kontekstu izpratne izskaidro daudzas Raku lietas, kas citādi izskatītos pārsteidzoši: kāpēc <code>+@array<\/code> ir skaitlis, kāpēc masīvs, kas ievietots skalārā, uzvedas kā viens elements, un kāpēc <code>if @array<\/code> pārbauda tukšumu.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko galvenos kontekstus.<\/span><\/p>"]]},"ru":{"t":"Контексты","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Значение в Raku иногда может вести себя по-разному, адаптируясь к <em>контексту<\/em>, в котором оно используется.<\/span> <span class=\"sg\" data-s=\"1\">Например, один и тот же массив может выступать как число (его длина), как строка (его элементы, объединённые через пробел) или как логическое значение (пустой массив или нет), в зависимости от того, чего требует окружающий код.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понимание контекстов объясняет многое в Raku, что иначе выглядело бы неожиданным: почему <code>+@array<\/code> — это число, почему массив, помещённый в скаляр, ведёт себя как один элемент и почему <code>if @array<\/code> проверяет пустоту.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются основные контексты.<\/span><\/p>"]]},"uk":{"t":"Контексти","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Значення в Raku інколи може поводитися по-різному, пристосовуючись до <em>контексту<\/em>, в якому його вжито.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, той самий масив може виступати як число (його довжина), як рядок (з'єднані елементи) або як істиннісне значення (порожній масив чи ні) — залежно від того, чого просить код навколо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Розуміння контексту пояснює багато чого в Raku, що інакше виглядало б несподівано: чому <code>+@array<\/code> є числом, чому масив, покладений у скаляр, поводиться як один елемент і чому <code>if @array<\/code> перевіряє порожність.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ охоплює основні контексти.<\/span><\/p>"]]},"bg":{"t":"Контексти 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойност в Raku понякога може да се държи различно, като се адаптира към <em>контекста<\/em>, в който се използва.<\/span> <span class=\"sg\" data-s=\"1\">Например, един и същ масив може да действа като число (неговата дължина), като низ (елементите му, обединени в текст), или като истинностна стойност (празен ли е масивът или не), в зависимост от това какво изисква заобикалящият код.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разбирането на контекстите обяснява много неща в Raku, които иначе биха изглеждали изненадващо: защо <code>+@array<\/code> е число, защо масив, поставен в скалар, се държи като единичен елемент, и защо <code>if @array<\/code> проверява за празнота.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда основните контексти.<\/span><\/p>"]]},"eo":{"t":"Kuntekstoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Valoro en Raku povas foje konduti malsame laŭ la <em>kunteksto<\/em> en kiu ĝi estas uzata.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la sama tabelo povas agi kiel nombro (ĝia longo), kiel ĉeno (ĝiaj elementoj kunigitaj), aŭ kiel vera valoro (ĉu la tabelo estas malplena aŭ ne), depende de tio, kion la ĉirkaŭa kodo petas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kompreno de kunteksto klarigas multon en Raku, kio alie aspektus surprize: kial <code>+@array<\/code> estas nombro, kial tabelo metita en skalaron kondutas kiel unuopa ero, kaj kial <code>if @array<\/code> testas malplenecon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio traktas la ĉefajn kuntekstojn.<\/span><\/p>"]]},"la":{"t":"Contextus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor in Raku interdum aliter se gerit prout ad <em>contextum<\/em> in quo adhibetur accommodatur.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, idem ordo agere potest ut numerus (eius longitudo), ut chorda (eius elementa coniuncta), vel ut valor veritatis (ordo vacuus est an non), pro eo quod codex circumdans postulat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intellectus contextus multum Raku explicat quod aliter mirum videretur: cur <code>+@array<\/code> numerus sit, cur ordo in scalarem positus ut unum item se gerat, et cur <code>if @array<\/code> vacuitatem probet.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio contextus praecipuos tractat.<\/span><\/p>"]]}}}</script>
