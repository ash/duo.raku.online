<script type="application/json" id="page-data">{"u":"advanced/quoting/adverbs","n":466,"k":"topic","pv":"advanced/quoting/q-qq-big-q/quiz","nx":"advanced/quoting/adverbs/quiz","tr":["advanced","advanced/quoting"],"L":{"en":{"t":"Quoting adverbs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The behaviour of a quoting construct can be tuned with <em>adverbs<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Each quoting feature — interpolating scalars, running embedded closures, processing backslashes — is controlled by its own adverb, which switches that one feature on or off, so you can start from <code>q<\/code> or <code>Q<\/code> and add back exactly the features you need.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Some common adverbs:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpolate scalar variables (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpolate embedded code in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — process backslash escapes like <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Add one to <code>q<\/code> to enable a single feature.<\/span> <span class=\"sg\" data-s=\"1\">For example, allow embedded code but nothing else:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">With plain <code>q<\/code> the <code>{ 3 * 4 }<\/code> is printed verbatim; only <code>:c<\/code> makes the block run and inserts its value, while a <code>$variable<\/code> would still be left alone.<\/span> <span class=\"sg\" data-s=\"1\">Note the <code>/…/<\/code> delimiters here: delimiting the string with <code>{…}<\/code> would still parse — the compiler counts the nested braces correctly — but then the inner <code>{ 3 * 4 }<\/code> is read as part of the delimited text rather than as a closure, so <code>:c<\/code> would leave it literal.<\/span> <span class=\"sg\" data-s=\"2\">Whenever the text contains a <code>{ … }<\/code> block, pick a delimiter other than <code>{…}<\/code> so the closure actually runs.<\/span> <span class=\"sg\" data-s=\"3\">You can add scalar interpolation to the otherwise-literal <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverbs also turn features <strong>off<\/strong> with a <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To use <code>qq<\/code> but keep <code>$<\/code> literal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> is equivalent to <code>Q<\/code> with all the interpolation adverbs switched on, and <code>q<\/code> is equivalent to <code>Q<\/code> with a smaller set.<\/span> <span class=\"sg\" data-s=\"1\">The adverbs give you fine-grained control between those two extremes.<\/span><\/p>"]]},"de":{"t":"Quoting-Adverbien","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Verhalten eines Quoting-Konstrukts kann mit <em>Adverbien<\/em> angepasst werden.<\/span> <span class=\"sg\" data-s=\"1\">Jede Quoting-Funktion — Interpolation von Skalaren, Ausführung eingebetteter Closures, Verarbeitung von Backslashes — wird durch ein eigenes Adverb gesteuert, das diese eine Funktion ein- oder ausschaltet.<\/span> <span class=\"sg\" data-s=\"2\">So kannst du von <code>q<\/code> oder <code>Q<\/code> ausgehen und genau die Funktionen hinzufügen, die du brauchst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige gebräuchliche Adverbien:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpoliert skalare Variablen (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpoliert eingebetteten Code in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — verarbeitet Backslash-Escape-Sequenzen wie <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Füge eines zu <code>q<\/code> hinzu, um eine einzelne Funktion zu aktivieren.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel: eingebetteten Code erlauben, aber sonst nichts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mit einfachem <code>q<\/code> wird <code>{ 3 * 4 }<\/code> wörtlich ausgegeben; erst <code>:c<\/code> lässt den Block ausführen und fügt seinen Wert ein, während eine <code>$variable<\/code> weiterhin unberührt bleibt.<\/span> <span class=\"sg\" data-s=\"1\">Beachte die <code>/…/<\/code>-Trennzeichen hier: Die Begrenzung des Strings mit <code>{…}<\/code> würde zwar funktionieren — der Compiler zählt die verschachtelten Klammern korrekt — aber dann wird das innere <code>{ 3 * 4 }<\/code> als Teil des begrenzten Textes gelesen und nicht als Closure, sodass <code>:c<\/code> es wörtlich lassen würde.<\/span> <span class=\"sg\" data-s=\"2\">Wenn der Text einen <code>{ … }<\/code>-Block enthält, wähle ein anderes Trennzeichen als <code>{…}<\/code>, damit die Closure tatsächlich ausgeführt wird.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst skalare Interpolation zum ansonsten wörtlichen <code>Q<\/code> hinzufügen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverbien können Funktionen auch <strong>ausschalten<\/strong>, und zwar mit einem <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Um <code>qq<\/code> zu verwenden, aber <code>$<\/code> wörtlich zu belassen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> entspricht <code>Q<\/code> mit allen Interpolations-Adverbien eingeschaltet, und <code>q<\/code> entspricht <code>Q<\/code> mit einer kleineren Auswahl.<\/span> <span class=\"sg\" data-s=\"1\">Die Adverbien geben dir feinkörnige Kontrolle zwischen diesen beiden Extremen.<\/span><\/p>"]]},"nl":{"t":"Aanhalingsadverbia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het gedrag van een quoting-constructie kan worden afgestemd met <em>bijwoorden<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Elke quoting-functie — het interpoleren van scalars, het uitvoeren van ingebedde closures, het verwerken van backslashes — wordt bestuurd door een eigen bijwoord, dat die ene functie in- of uitschakelt, zodat je kunt beginnen met <code>q<\/code> of <code>Q<\/code> en precies de functies kunt toevoegen die je nodig hebt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Enkele veelgebruikte bijwoorden:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpoleer scalaire variabelen (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpoleer ingebedde code in <code>{ ... }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — verwerk backslash-escapes zoals <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voeg er een toe aan <code>q<\/code> om een enkele functie in te schakelen.<\/span> <span class=\"sg\" data-s=\"1\">Sta bijvoorbeeld ingebedde code toe maar niets anders:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — gewone q laat het blok onaangeroerd\nsay q:c/result: {3 * 4}/; # result: 12        — :c voert het blok uit<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Met gewone <code>q<\/code> wordt <code>{ 3 * 4 }<\/code> letterlijk afgedrukt; alleen <code>:c<\/code> zorgt ervoor dat het blok wordt uitgevoerd en de waarde wordt ingevoegd, terwijl een <code>$variabele<\/code> nog steeds onaangeroerd zou blijven.<\/span> <span class=\"sg\" data-s=\"1\">Let op de <code>/.../<\/code>-scheidingstekens hier: als je de string begrenst met <code>{...}<\/code> zou het nog steeds werken — de compiler telt de geneste accolades correct — maar dan wordt de binnenste <code>{ 3 * 4 }<\/code> gelezen als onderdeel van de begrensde tekst in plaats van als een closure, dus <code>:c<\/code> zou het letterlijk laten.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer de tekst een <code>{ ... }<\/code>-blok bevat, kies dan een ander scheidingsteken dan <code>{...}<\/code> zodat de closure daadwerkelijk wordt uitgevoerd.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt scalaire interpolatie toevoegen aan de anders letterlijke <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bijwoorden schakelen functies ook <strong>uit<\/strong> met een <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Om <code>qq<\/code> te gebruiken maar <code>$<\/code> letterlijk te houden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> is gelijk aan <code>Q<\/code> met alle interpolatie-bijwoorden ingeschakeld, en <code>q<\/code> is gelijk aan <code>Q<\/code> met een kleinere set.<\/span> <span class=\"sg\" data-s=\"1\">De bijwoorden geven je fijnmazige controle tussen die twee uitersten.<\/span><\/p>"]]},"es":{"t":"Adverbios de entrecomillado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El comportamiento de una construcción de entrecomillado se puede ajustar con <em>adverbios<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Cada característica del entrecomillado — interpolar escalares, ejecutar closures incrustados, procesar barras invertidas — se controla con su propio adverbio, que activa o desactiva esa única característica, de modo que puedes partir de <code>q<\/code> o <code>Q<\/code> y añadir exactamente las funciones que necesites.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos adverbios comunes:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpola variables escalares (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpola código incrustado en <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — procesa secuencias de escape con barra invertida como <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Añade uno a <code>q<\/code> para habilitar una sola característica.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, permitir código incrustado pero nada más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con <code>q<\/code> simple, <code>{ 3 * 4 }<\/code> se imprime tal cual; solo <code>:c<\/code> hace que el bloque se ejecute e inserta su valor, mientras que un <code>$variable<\/code> seguiría sin tocarse.<\/span> <span class=\"sg\" data-s=\"1\">Observa los delimitadores <code>/…/<\/code> aquí: delimitar la cadena con <code>{…}<\/code> también funcionaría — el compilador cuenta las llaves anidadas correctamente — pero entonces el <code>{ 3 * 4 }<\/code> interior se lee como parte del texto delimitado en lugar de como un closure, así que <code>:c<\/code> lo dejaría literal.<\/span> <span class=\"sg\" data-s=\"2\">Cuando el texto contiene un bloque <code>{ … }<\/code>, elige un delimitador distinto de <code>{…}<\/code> para que el closure realmente se ejecute.<\/span> <span class=\"sg\" data-s=\"3\">Puedes añadir interpolación escalar al <code>Q<\/code>, que por defecto es literal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los adverbios también <strong>desactivan<\/strong> características con un <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para usar <code>qq<\/code> pero mantener <code>$<\/code> literal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> equivale a <code>Q<\/code> con todos los adverbios de interpolación activados, y <code>q<\/code> equivale a <code>Q<\/code> con un conjunto más reducido.<\/span> <span class=\"sg\" data-s=\"1\">Los adverbios te dan control detallado entre esos dos extremos.<\/span><\/p>"]]},"it":{"t":"Avverbi di quoting","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il comportamento di un costrutto di quoting può essere regolato con gli <em>avverbi<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni funzionalità di quoting — interpolazione degli scalari, esecuzione di closure incorporate, elaborazione dei backslash — è controllata dal proprio avverbio, che attiva o disattiva quella singola funzionalità, così puoi partire da <code>q<\/code> o <code>Q<\/code> e aggiungere esattamente le funzionalità di cui hai bisogno.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcuni avverbi comuni:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpola le variabili scalari (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpola il codice incorporato in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — elabora le sequenze di escape con backslash come <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aggiungine uno a <code>q<\/code> per abilitare una singola funzionalità.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, permetti il codice incorporato ma nient'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con il semplice <code>q<\/code> il blocco <code>{ 3 * 4 }<\/code> viene stampato letteralmente; solo <code>:c<\/code> fa eseguire il blocco e ne inserisce il valore, mentre un <code>$variable<\/code> verrebbe comunque lasciato invariato.<\/span> <span class=\"sg\" data-s=\"1\">Nota i delimitatori <code>/…/<\/code> qui: delimitare la stringa con <code>{…}<\/code> funzionerebbe comunque — il compilatore conta correttamente le parentesi graffe annidate — ma in quel caso il blocco interno <code>{ 3 * 4 }<\/code> viene letto come parte del testo delimitato invece che come una closure, quindi <code>:c<\/code> lo lascerebbe letterale.<\/span> <span class=\"sg\" data-s=\"2\">Quando il testo contiene un blocco <code>{ … }<\/code>, scegli un delimitatore diverso da <code>{…}<\/code> affinché la closure venga effettivamente eseguita.<\/span> <span class=\"sg\" data-s=\"3\">Puoi aggiungere l'interpolazione scalare alla forma altrimenti letterale <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli avverbi possono anche <strong>disattivare<\/strong> funzionalità con un <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per usare <code>qq<\/code> ma mantenere <code>$<\/code> letterale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> è equivalente a <code>Q<\/code> con tutti gli avverbi di interpolazione attivati, e <code>q<\/code> è equivalente a <code>Q<\/code> con un insieme ridotto.<\/span> <span class=\"sg\" data-s=\"1\">Gli avverbi ti danno un controllo fine tra questi due estremi.<\/span><\/p>"]]},"lv":{"t":"Citēšanas apzīmētāji","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Citēšanas konstrukcijas uzvedību var pielāgot ar <em>adverbiem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Katra citēšanas funkcija — skalāru interpolēšana, iegultu slēgumu izpilde, atpakaļsvītru apstrāde — tiek kontrolēta ar savu adverbu, kas ieslēdz vai izslēdz tieši šo vienu funkciju, tāpēc varat sākt no <code>q<\/code> vai <code>Q<\/code> un pievienot tieši tās funkcijas, kas nepieciešamas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži bieži lietotie adverbi:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpolē skalāros mainīgos (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpolē iegultu kodu <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — apstrādā atpakaļsvītras aizbēgšanas secības, piemēram, <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pievienojiet vienu pie <code>q<\/code>, lai ieslēgtu vienu funkciju.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, atļaujiet iegultu kodu, bet neko citu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — parasts q atstāj bloku neskartu\nsay q:c/result: {3 * 4}/; # result: 12        — :c izpilda bloku<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ar parastu <code>q<\/code> bloks <code>{ 3 * 4 }<\/code> tiek izdrukāts burtiski; tikai <code>:c<\/code> liek blokam izpildīties un ievieto tā vērtību, kamēr <code>$mainīgais<\/code> joprojām tiktu atstāts mierā.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet norobežotājus <code>/…/<\/code>: ja virkni norobežotu ar <code>{…}<\/code>, kompilators pareizi saskaitītu ligzdotas figūriekavas, bet tad iekšējais <code>{ 3 * 4 }<\/code> tiktu nolasīts kā daļa no norobežotā teksta, nevis kā slēgums, tāpēc <code>:c<\/code> to atstātu burtisku.<\/span> <span class=\"sg\" data-s=\"2\">Kad teksts satur <code>{ … }<\/code> bloku, izvēlieties citu norobežotāju, nevis <code>{…}<\/code>, lai slēgums patiešām izpildītos.<\/span> <span class=\"sg\" data-s=\"3\">Skalāro interpolēšanu var pievienot citādi burtiskajam <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverbi arī <strong>izslēdz<\/strong> funkcijas ar <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lai izmantotu <code>qq<\/code>, bet atstātu <code>$<\/code> burtisku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> ir ekvivalents <code>Q<\/code> ar visiem interpolēšanas adverbiem ieslēgtiem, bet <code>q<\/code> ir ekvivalents <code>Q<\/code> ar mazāku kopu.<\/span> <span class=\"sg\" data-s=\"1\">Adverbi dod precīzu kontroli starp šīm divām galējībām.<\/span><\/p>"]]},"ru":{"t":"Наречия кавычек","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Поведение конструкции цитирования можно настроить с помощью <em>наречий<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Каждая функция цитирования — интерполяция скаляров, выполнение встроенных замыканий, обработка обратных косых черт — управляется своим собственным наречием, которое включает или выключает именно эту функцию, так что вы можете начать с <code>q<\/code> или <code>Q<\/code> и добавить ровно те возможности, которые вам нужны.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Некоторые распространённые наречия:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — интерполировать скалярные переменные (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — интерполировать встроенный код в <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обрабатывать управляющие последовательности с обратной косой чертой, такие как <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавьте одно к <code>q<\/code>, чтобы включить отдельную функцию.<\/span> <span class=\"sg\" data-s=\"1\">Например, разрешить встроенный код, но ничего больше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С простым <code>q<\/code> блок <code>{ 3 * 4 }<\/code> выводится как есть; только <code>:c<\/code> заставляет блок выполниться и подставляет его значение, тогда как <code>$переменная<\/code> по-прежнему останется нетронутой.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание на разделители <code>/…/<\/code> здесь: если бы строка была ограничена <code>{…}<\/code>, парсер бы всё равно справился — компилятор корректно считает вложенные фигурные скобки — но тогда внутренний <code>{ 3 * 4 }<\/code> был бы прочитан как часть ограниченного текста, а не как замыкание, поэтому <code>:c<\/code> оставил бы его буквально.<\/span> <span class=\"sg\" data-s=\"2\">Когда текст содержит блок <code>{ … }<\/code>, выбирайте разделитель, отличный от <code>{…}<\/code>, чтобы замыкание действительно выполнилось.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете добавить интерполяцию скаляров к иначе буквальному <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречия также <strong>выключают<\/strong> функции с помощью <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы использовать <code>qq<\/code>, но оставить <code>$<\/code> буквальным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> эквивалентен <code>Q<\/code> со всеми включёнными наречиями интерполяции, а <code>q<\/code> эквивалентен <code>Q<\/code> с меньшим набором.<\/span> <span class=\"sg\" data-s=\"1\">Наречия дают вам тонкий контроль между этими двумя крайностями.<\/span><\/p>"]]},"uk":{"t":"Наріччя цитування","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Поведінку конструкції цитування можна налаштувати <em>наріччями<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Кожна можливість цитування — інтерполяція скалярів, виконання вбудованих замикань, обробка зворотних косих рисок — керується власним наріччям, яке вмикає або вимикає саме її, тож ви можете почати з <code>q<\/code> чи <code>Q<\/code> і повернути назад рівно ті можливості, які вам потрібні.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кілька поширених наріч:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — інтерполювати скалярні змінні (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — інтерполювати вбудований код у <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обробляти екрановані послідовності на кшталт <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Додайте одне до <code>q<\/code>, щоб увімкнути одну можливість.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, дозволити вбудований код і більше нічого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — звичайний q залишає блок недоторканим\nsay q:c/result: {3 * 4}/; # result: 12        — :c виконує блок<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зі звичайним <code>q<\/code> вираз <code>{ 3 * 4 }<\/code> виводиться дослівно; лише <code>:c<\/code> змушує блок виконатися й вставляє його значення, тоді як <code>$змінна<\/code> все одно залишиться недоторканою.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу на роздільники <code>/…/<\/code>: обмеження рядка через <code>{…}<\/code> теж розібралося б — компілятор правильно рахує вкладені фігурні дужки, — але тоді внутрішнє <code>{ 3 * 4 }<\/code> читається як частина обмеженого тексту, а не як замикання, тож <code>:c<\/code> залишило б його буквальним.<\/span> <span class=\"sg\" data-s=\"2\">Щоразу, коли текст містить блок <code>{ … }<\/code>, обирайте роздільник, відмінний від <code>{…}<\/code>, щоб замикання справді виконалося.<\/span> <span class=\"sg\" data-s=\"3\">До буквального в інших випадках <code>Q<\/code> можна додати інтерполяцію скалярів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наріччя також <strong>вимикають<\/strong> можливості за допомогою <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щоб скористатися <code>qq<\/code>, але залишити <code>$<\/code> буквальним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> рівносильне <code>Q<\/code> з усіма увімкненими наріччями інтерполяції, а <code>q<\/code> рівносильне <code>Q<\/code> з меншим набором.<\/span> <span class=\"sg\" data-s=\"1\">Наріччя дають вам тонке керування між цими двома крайнощами.<\/span><\/p>"]]},"bg":{"t":"Наречия за цитиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Поведението на конструкция за цитиране може да се настрои с <em>наречия<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка функция на цитирането — интерполиране на скалари, изпълнение на вградени затваряния, обработка на обратни наклонени черти — се контролира от собственото си наречие, което включва или изключва тази единствена функция, така че можете да започнете от <code>q<\/code> или <code>Q<\/code> и да добавите обратно точно функциите, от които имате нужда.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Някои често срещани наречия:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — интерполиране на скаларни променливи (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — интерполиране на вграден код в <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обработване на екраниращи последователности с обратна наклонена черта като <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавете едно към <code>q<\/code>, за да активирате единична функция.<\/span> <span class=\"sg\" data-s=\"1\">Например, разрешете вграден код, но нищо друго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — обикновено q оставя блока непроменен\nsay q:c/result: {3 * 4}/; # result: 12        — :c изпълнява блока<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С обикновено <code>q<\/code> блокът <code>{ 3 * 4 }<\/code> се отпечатва буквално; само <code>:c<\/code> кара блока да се изпълни и вмъква стойността му, докато <code>$variable<\/code> все пак би останала непроменена.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание на разделителите <code>/…/<\/code> тук: ограждането на низа с <code>{…}<\/code> все пак би работило — компилаторът брои вложените фигурни скоби правилно — но тогава вътрешният <code>{ 3 * 4 }<\/code> се чете като част от огранадения текст, а не като затваряне, така че <code>:c<\/code> би го оставило буквално.<\/span> <span class=\"sg\" data-s=\"2\">Когато текстът съдържа блок <code>{ … }<\/code>, изберете разделител, различен от <code>{…}<\/code>, за да може затварянето наистина да се изпълни.<\/span> <span class=\"sg\" data-s=\"3\">Можете да добавите интерполиране на скалари към иначе буквалния <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречията също могат да <strong>изключват<\/strong> функции с <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За да използвате <code>qq<\/code>, но да запазите <code>$<\/code> буквален:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> е еквивалентно на <code>Q<\/code> с всички наречия за интерполация включени, а <code>q<\/code> е еквивалентно на <code>Q<\/code> с по-малък набор.<\/span> <span class=\"sg\" data-s=\"1\">Наречията ви дават фин контрол между тези две крайности.<\/span><\/p>"]]},"eo":{"t":"Citaj adverboj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La konduto de cita konstruaĵo povas esti agordita per <em>adverboj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu cita funkcio — interpoli skalarojn, ruli enkonstruitajn fermojn, prilabori maldekstrajn streketojn — estas kontrolata de sia propra adverbo, kiu ŝaltas aŭ malŝaltas tiun unu funkcion, do vi povas komenci de <code>q<\/code> aŭ <code>Q<\/code> kaj aldoni reen ĝuste la funkciojn, kiujn vi bezonas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj oftaj adverboj:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpoli skalarajn variablojn (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpoli enkonstruitan kodon en <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — prilabori maldekstre-streketajn eskapojn kiel <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aldonu unu al <code>q<\/code> por ebligi ununuran funkcion.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, permesi enkonstruitan kodon sed nenion alian:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — simpla q lasas la blokon netuŝita\nsay q:c/result: {3 * 4}/; # result: 12        — :c ruligas la blokon<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kun simpla <code>q<\/code>, la <code>{ 3 * 4 }<\/code> estas presita laŭlitere; nur <code>:c<\/code> ruligas la blokon kaj enmetas ĝian valoron, dum <code>$variablo<\/code> ankoraŭ estus lasita sola.<\/span> <span class=\"sg\" data-s=\"1\">Notu la <code>/…/<\/code>-limigilojn ĉi tie: limigi la ĉenon per <code>{…}<\/code> ankoraŭ funkcius — la kompililo ĝuste kalkulas la nestitajn krampojn — sed tiam la interna <code>{ 3 * 4 }<\/code> estas legita kiel parto de la limigita teksto anstataŭ kiel fermo, do <code>:c<\/code> lasus ĝin laŭlitera.<\/span> <span class=\"sg\" data-s=\"2\">Kiam ajn la teksto enhavas <code>{ … }<\/code>-blokon, elektu limigilon alian ol <code>{…}<\/code> por ke la fermo efektive ruliĝu.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas aldoni skalaran interpoladon al la alie-laŭlitera <code>Q<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverboj ankaŭ <strong>malŝaltas<\/strong> funkciojn per <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por uzi <code>qq<\/code> sed teni <code>$<\/code> laŭlitera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> ekvivalentas al <code>Q<\/code> kun ĉiuj interpolaj adverboj ŝaltitaj, kaj <code>q<\/code> ekvivalentas al <code>Q<\/code> kun pli malgranda aro.<\/span> <span class=\"sg\" data-s=\"1\">La adverboj donas al vi detalan kontrolon inter tiuj du ekstremoj.<\/span><\/p>"]]},"la":{"t":"Adverbia quotationis","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Modus constructionis citandi <em>adverbiis<\/em> temperari potest.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque proprietas citandi — interpolatio scalarium, executio clausurarum insertarum, processus obliquorum reversorum — suo adverbio regitur, quod illam unam proprietatem accendit vel exstinguit, ita ut a <code>q<\/code> vel <code>Q<\/code> incipere possis et accurate eas proprietates quas opus est addere.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nonnulla adverbia communia:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — variabiles scalares interpola (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — codicem insertum in <code>{ … }<\/code> interpola<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — effugia per obliquum reversum ut <code>\\n<\/code> processa<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unum ad <code>q<\/code> adde ut unam proprietatem accendas.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, codicem insertum permitte sed nihil aliud:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum simplici <code>q<\/code> forma <code>{ 3 * 4 }<\/code> ad verbum imprimitur; solum <code>:c<\/code> efficit ut clausura exsequatur et valorem eius inserat, dum <code>$variable<\/code> adhuc intacta relinqueretur.<\/span> <span class=\"sg\" data-s=\"1\">Nota delimitatores <code>/…/<\/code> hic: si seriem delimitatoribus <code>{…}<\/code> circumscripsisses — compilator recte enumerat — tunc interior <code>{ 3 * 4 }<\/code> ut pars textus delimitati legitur potius quam clausura, itaque <code>:c<\/code> eam ad litteram relinqueret.<\/span> <span class=\"sg\" data-s=\"2\">Quotienscumque textus clausuram <code>{ … }<\/code> continet, delimitatorem alium quam <code>{…}<\/code> elige ut clausura re vera exsequatur.<\/span> <span class=\"sg\" data-s=\"3\">Interpolationem scalarem ad formam aliter maxime ad litteram <code>Q<\/code> addere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverbia etiam proprietates <strong>exstinguunt<\/strong> cum <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ut <code>qq<\/code> adhibeas sed <code>$<\/code> ad litteram relinquas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> aequivalet <code>Q<\/code> cum omnibus adverbiis interpolationis accensis, et <code>q<\/code> aequivalet <code>Q<\/code> cum minore numero.<\/span> <span class=\"sg\" data-s=\"1\">Adverbia tibi subtile imperium inter haec duo extrema praebent.<\/span><\/p>"]]}}}</script>
