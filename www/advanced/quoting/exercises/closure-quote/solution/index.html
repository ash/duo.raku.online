class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наріччя <code>:c<\/code> (closure) вмикає інтерполяцію вбудованого коду <code>{ … }<\/code> у буквальній в інших випадках формі <code>q<\/code>. Усередині фігурних дужок <code>$x<\/code> є справжнім кодом, тож <code>{$x ** 2}<\/code> обчислюється в <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> за межами дужок залишається точно таким, як записано, бо наріччя скалярів <code>:s<\/code> <em>не<\/em> ввімкнено. У цьому й полягає весь сенс наріч для окремих можливостей: ви отримуєте вбудований код, не вмикаючи заразом інтерполяцію <code>$<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наріччя можна нанизувати. Додайте ще й <code>:s<\/code> — і провідний <code>$x<\/code> теж інтерполюється: обидві можливості тепер увімкнено водночас:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"bg":{"t":"Solution: Closure в q низ","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наречието <code>:c<\/code> (closure — затваряне) включва интерполирането на вграден код <code>{ … }<\/code> в иначе буквалната форма <code>q<\/code>. Вътре във фигурните скоби <code>$x<\/code> е истински код, така че <code>{$x ** 2}<\/code> се изчислява на <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> извън фигурните скоби остава точно както е написано, защото скаларното наречие <code>:s<\/code> <em>не<\/em> е активирано. В това е цялата идея на наречията за отделни функции: получавате вграден код, без да включвате и <code>$<\/code>-интерполиране.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наречията могат да се комбинират. Добавете и <code>:s<\/code> и водещото <code>$x<\/code> също ще бъде интерполирано — и двете функции вече са включени едновременно:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"eo":{"t":"Solution: Fermilo en q-ĉeno","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La adverbo <code>:c<\/code> (fermo) ŝaltas interpoladon de enkonstruita <code>{ … }<\/code>-kodo en la alie-laŭlitera <code>q<\/code>-formo. Ene de la krampoj, <code>$x<\/code> estas vera kodo, do <code>{$x ** 2}<\/code> taksas al <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>$x<\/code> ekster la krampoj restas ĝuste kiel skribita, ĉar la skalara adverbo <code>:s<\/code> <em>ne<\/em> estas ŝaltita. Tio estas la tuta senco de la per-funkciaj adverboj: vi ricevas enkonstruitan kodon sen ankaŭ ŝalti <code>$<\/code>-interpoladon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Adverboj povas esti stakitaj. Aldonu ankaŭ <code>:s<\/code>, kaj la komenca <code>$x<\/code> estas interpolata ankaŭ — ambaŭ funkcioj nun estas ŝaltitaj samtempe:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"la":{"t":"Solution: Clausura in q catena","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius exercitii.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Adverbium <code>:c<\/code> (clausura) interpolationem codicis inserti <code>{ … }<\/code> in forma aliter ad litteram <code>q<\/code> accendit. Intra uncos, <code>$x<\/code> verus codex est, itaque <code>{$x ** 2}<\/code> ad <code>100<\/code> aestimatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> extra uncos exacte ut scriptum est relinquitur, quia adverbium scalare <code>:s<\/code> <em>non<\/em> accensum est. Hic est totus sensus adverbiorum per proprietatem: codicem insertum accipis sine etiam interpolatione <code>$<\/code> accensa.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Adverbia cumulari possunt. Si etiam <code>:s<\/code> addas, <code>$x<\/code> praecedens quoque interpolatur — ambae proprietates nunc simul accensae sunt:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]}}}</script>
