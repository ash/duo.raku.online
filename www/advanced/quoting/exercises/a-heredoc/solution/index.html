<span class=\"sg\" data-s=\"0\">The body and the closing <code>END<\/code> are indented by the same four spaces. The indentation of the terminator is stripped from every line, so those four spaces never reach the string — the output starts at the left margin.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The heredoc already ends with a newline, so <code>print<\/code> is used rather than <code>say<\/code> to avoid adding a second blank line.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Heredoc beginnt mit <code>qq:to<\/code> statt <code>q:to<\/code>, ist also interpolierend. Wie ein <code>qq<\/code>-String füllt es Skalare ein — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>und<\/em> führt eingebetteten Code aus: Der Block <code>{$count * $price}<\/code> berechnet <code>3 * 25<\/code>, sodass die Gesamtsumme <code>75<\/code> inline erscheint.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die doppelten Anführungszeichen um <code>\"$item\"<\/code> sind hier einfach wörtliche Zeichen; innerhalb eines Heredocs gibt es kein Trennzeichen zum Escapen, sodass sie wie geschrieben ausgegeben werden, während <code>$item<\/code> trotzdem interpoliert wird.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Rumpf und das schließende <code>END<\/code> sind um die gleichen vier Leerzeichen eingerückt. Die Einrückung des Abschlusswortes wird von jeder Zeile entfernt, sodass diese vier Leerzeichen nie im String landen — die Ausgabe beginnt am linken Rand.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Heredoc endet bereits mit einem Zeilenumbruch, daher wird <code>print<\/code> statt <code>say<\/code> verwendet, um eine zusätzliche Leerzeile zu vermeiden.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De heredoc begint met <code>qq:to<\/code> in plaats van <code>q:to<\/code>, dus hij interpoleert. Net als een <code>qq<\/code>-string vult hij scalars in — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>en<\/em> voert hij ingebedde code uit: het blok <code>{$count * $price}<\/code> berekent <code>3 * 25<\/code>, dus het totaal <code>75<\/code> verschijnt inline.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De dubbele aanhalingstekens rond <code>\"$item\"<\/code> zijn hier gewoon letterlijke tekens; binnen een heredoc is er geen scheidingsteken om te escapen, dus ze worden afgedrukt zoals ze zijn terwijl <code>$item<\/code> toch wordt geinterpoleerd.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De inhoud en het afsluitende <code>END<\/code> zijn met dezelfde vier spaties ingesprongen. De inspringging van het afsluitwoord wordt van elke regel verwijderd, dus die vier spaties bereiken de string nooit — de uitvoer begint aan de linkerkantlijn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De heredoc eindigt al met een nieuwe regel, dus <code>print<\/code> wordt gebruikt in plaats van <code>say<\/code> om te voorkomen dat er een tweede lege regel wordt toegevoegd.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una de las posibles soluciones:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El heredoc comienza con <code>qq:to<\/code> en lugar de <code>q:to<\/code>, por lo que interpola. Al igual que una cadena <code>qq<\/code>, rellena los escalares — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>y<\/em> ejecuta código incrustado: el bloque <code>{$count * $price}<\/code> calcula <code>3 * 25<\/code>, de modo que el total <code>75<\/code> aparece en línea.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las comillas dobles alrededor de <code>\"$item\"<\/code> son simplemente caracteres literales aquí; dentro de un heredoc no hay delimitador que escapar, por lo que se imprimen tal cual mientras <code>$item<\/code> sigue interpolándose.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo y el <code>END<\/code> de cierre están indentados con los mismos cuatro espacios. La indentación del terminador se elimina de cada línea, así que esos cuatro espacios nunca llegan a la cadena — la salida comienza en el margen izquierdo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El heredoc ya termina con un salto de línea, por lo que se usa <code>print<\/code> en lugar de <code>say<\/code> para evitar añadir una segunda línea en blanco.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'heredoc inizia con <code>qq:to<\/code> anziché <code>q:to<\/code>, quindi interpola. Come una stringa <code>qq<\/code>, inserisce gli scalari — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>e<\/em> esegue il codice incorporato: il blocco <code>{$count * $price}<\/code> calcola <code>3 * 25<\/code>, così il totale <code>75<\/code> appare inline.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le virgolette doppie attorno a <code>\"$item\"<\/code> sono solo caratteri letterali qui; dentro un heredoc non c'è nessun delimitatore da cui fare l'escape, quindi vengono stampate così come sono mentre <code>$item<\/code> viene comunque interpolato.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo e il terminatore di chiusura <code>END<\/code> sono indentati degli stessi quattro spazi. L'indentazione del terminatore viene rimossa da ogni riga, quindi quei quattro spazi non raggiungono mai la stringa — l'output inizia dal margine sinistro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'heredoc termina già con un carattere di nuova riga, quindi viene usato <code>print<\/code> anziché <code>say<\/code> per evitare di aggiungere una seconda riga vuota.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Heredoc" <\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc jau beidzas ar jaunrindu, tāpēc tiek izmantots <code>print<\/code>, nevis <code>say<\/code>, lai nepievienotu otru tukšu rindu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно из возможных решений задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc начинается с <code>qq:to<\/code>, а не с <code>q:to<\/code>, поэтому он интерполирует. Как и строка в <code>qq<\/code>, он подставляет скаляры — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>и<\/em> выполняет встроенный код: блок <code>{$count * $price}<\/code> вычисляет <code>3 * 25<\/code>, поэтому итоговая сумма <code>75<\/code> появляется в тексте.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Двойные кавычки вокруг <code>\"$item\"<\/code> здесь — просто обычные символы; внутри heredoc'а нет разделителя, который нужно экранировать, поэтому они выводятся как есть, а <code>$item<\/code> по-прежнему интерполируется.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тело и закрывающий <code>END<\/code> имеют одинаковый отступ в четыре пробела. Отступ терминатора удаляется из каждой строки, поэтому эти четыре пробела не попадают в строку — вывод начинается от левого края.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc уже заканчивается переводом строки, поэтому используется <code>print<\/code>, а не <code>say<\/code>, чтобы не добавить вторую пустую строку.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc починається з <code>qq:to<\/code>, а не з <code>q:to<\/code>, тож він інтерполює. Як і рядок <code>qq<\/code>, він підставляє скаляри — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>і<\/em> виконує вбудований код: блок <code>{$count * $price}<\/code> обчислює <code>3 * 25<\/code>, тож підсумок <code>75<\/code> з'являється просто в тексті.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Подвійні лапки навколо <code>\"$item\"<\/code> тут є просто буквальними символами; усередині heredoc-а немає роздільника, який треба екранувати, тож вони виводяться як записано, а <code>$item<\/code> усе одно інтерполюється.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло й закривальне <code>END<\/code> мають однаковий відступ у чотири пробіли. Відступ термінатора прибирається з кожного рядка, тож ці чотири пробіли ніколи не потрапляють у рядок — вивід починається з лівого краю.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc уже закінчується переходом рядка, тож використано <code>print<\/code>, а не <code>say<\/code>, щоб не додати другого порожнього рядка.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc-ът започва с <code>qq:to<\/code> вместо <code>q:to<\/code>, така че интерполира. Подобно на низ с <code>qq<\/code>, той попълва скаларите — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>и<\/em> изпълнява вграден код: блокът <code>{$count * $price}<\/code> изчислява <code>3 * 25<\/code>, така че общата сума <code>75<\/code> се появява директно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Двойните кавички около <code>\"$item\"<\/code> тук са просто буквални символи; вътре в heredoc няма разделител, който да се екранира, така че те се отпечатват както са написани, докато <code>$item<\/code> все пак се интерполира.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото и затварящият <code>END<\/code> са отместени с еднакви четири интервала. Отстъпът на терминатора се премахва от всеки ред, така че тези четири интервала никога не достигат до низа — изходът започва от левия край.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc-ът вече завършва с нов ред, така че се използва <code>print<\/code> вместо <code>say<\/code>, за да се избегне добавянето на втори празен ред.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Heredoko","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La heredoc komenciĝas per <code>qq:to<\/code> anstataŭ <code>q:to<\/code>, do ĝi interpolatas. Kiel <code>qq<\/code>-ĉeno, ĝi plenigas skalarojn — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — <em>kaj<\/em> ruligas enkonstruitan kodon: la bloko <code>{$count * $price}<\/code> kalkulas <code>3 * 25<\/code>, do la totalo <code>75<\/code> aperas enlinie.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La duoblaj citiloj ĉirkaŭ <code>\"$item\"<\/code> estas nur laŭliteraj signoj ĉi tie; ene de heredoc ne ekzistas limigilo por eskapi, do ili presiĝas kiel skribitaj dum <code>$item<\/code> ankoraŭ interpoliĝas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La korpo kaj la ferma <code>END<\/code> estas krommarĝenigitaj per la samaj kvar spacetoj. La krommarĝeno de la finilo estas forigita el ĉiu linio, do tiuj kvar spacetoj neniam atingas la ĉenon — la eligo komenciĝas ĉe la maldekstra marĝeno.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La heredoc jam finiĝas per novlinio, do <code>print<\/code> estas uzata anstataŭ <code>say<\/code> por eviti aldoni duan malplenan linion.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius exercitii.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc cum <code>qq:to<\/code> incipit potius quam <code>q:to<\/code>, itaque interpolat. Sicut series <code>qq<\/code>, variabiles scalares — <code>$name<\/code>, <code>$count<\/code>, <code>$item<\/code> — implet <em>atque<\/em> codicem insertum exsequitur: clausura <code>{$count * $price}<\/code> computat <code>3 * 25<\/code>, itaque summa <code>75<\/code> in linea apparet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Apostrophi duplices circa <code>\"$item\"<\/code> hic solum characteres ad litteram sunt; intra heredoc nullus delimitator effugiendus est, itaque ut scripti imprimuntur dum <code>$item<\/code> adhuc interpolatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus et terminans <code>END<\/code> claudens iisdem quattuor spatiis indentantur. Indentatio terminatoris ab omni linea detrahitur, itaque illa quattuor spatia numquam ad seriem perveniunt — output a margine sinistra incipit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc iam in lineae fine desinit, itaque <code>print<\/code> adhibetur potius quam <code>say<\/code> ad vitandam alteram lineam vacuam.<\/span><\/li><\/ol>"]]}}}</script>
