<script type="application/json" id="page-data">{"u":"advanced/quoting/q-qq-big-q","n":464,"k":"topic","pv":"advanced/quoting","nx":"advanced/quoting/q-qq-big-q/quiz","tr":["advanced","advanced/quoting"],"L":{"en":{"t":"q, qq, and Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">There are three base quoting operators, differing in how much they process the text inside:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — like single quotes: almost everything is literal<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — like double quotes: variables and escapes are interpolated<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — the most literal of all: <strong>nothing<\/strong> is processed<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each takes the text between a pair of delimiters.<\/span> <span class=\"sg\" data-s=\"1\">The familiar <code>'…'<\/code> is a shorthand for <code>q<\/code>, and <code>\"…\"<\/code> is a shorthand for <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> leaves <code>$name<\/code> untouched; <code>qq<\/code> interpolates it.<\/span> <span class=\"sg\" data-s=\"1\">Backslash escapes such as <code>\\n<\/code> behave the same way: only <code>qq<\/code> (and <code>\"…\"<\/code>) turns <code>\\n<\/code> into a real newline, while both <code>q<\/code> and <code>Q<\/code> leave it as the two characters <code>\\<\/code> and <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So where do <code>q<\/code> and <code>Q<\/code> differ?<\/span> <span class=\"sg\" data-s=\"1\"><cod data-s=\"0\">Puoi scegliere qualsiasi delimitatore — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code> — il che è comodo quando il testo stesso contiene virgolette.<\/span> <span class=\"sg\" data-s=\"1\">I tre operatori sono la base; l'argomento successivo mostra come gli <a href=\"https://course.raku.org/it/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>avverbi<\/em><\/a> ti permettono di combinare esattamente quali funzionalità sono attive.<\/span><\/p>"]]},"lv":{"t":"q, qq un Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir trīs bāzes citēšanas operatori, kas atšķiras pēc tā, cik daudz tie apstrādā tekstu iekšpusē:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — kā vienpēdiņas: gandrīz viss ir burtiski<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — kā dubultpēdiņas: mainīgie un aizbēgšanas secības tiek interpolēti<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — visburtiskākais no visiem: <strong>nekas<\/strong> netiek apstrādāts<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs ņem tekstu starp norobežotāju pāri.<\/span> <span class=\"sg\" data-s=\"1\">Pazīstamais <code>'…'<\/code> ir saīsinājums <code>q<\/code>, bet <code>\"…\"<\/code> ir saīsinājums <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> atstāj <code>$name<\/code> neskartu; <code>qq<\/code> to interpolē.<\/span> <span class=\"sg\" data-s=\"1\">Atpakaļsvītras aizbēgšanas secības, piemēram, <code>\\n<\/code>, darbojas tāpat: tikai <code>qq<\/code> (un <code>\"…\"<\/code>) pārvērš <code>\\n<\/code> par īstu jaunrindu, bet gan <code>q<\/code>, gan <code>Q<\/code> to atstāj kā divas rakstzīmes <code>\\<\/code> un <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tad ar ko atšķiras <code>q<\/code> un <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code>, tāpat kā vienpēdiņas, tomēr apstrādā <em>nelielu<\/em> aizbēgšanas secību kopu — dubultota atpakaļsvītra <code>\\\\<\/code> kļūst par vienu, un var aizbēgt no aizverošā norobežotāja — turpretī vienkāršā <code>Q<\/code> forma neapstrādā <strong>pilnīgi neko<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q saspiež aizēto atpakaļsvītru\nsay Q{a\\\\b}; # a\\\\b  — Q saglabā abas rakstzīmes<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Var izvēlēties jebkurus norobežotājus — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code> — tas ir ērti, kad teksts pats satur pēdiņas.<\/span> <span class=\"sg\" data-s=\"1\">Šie trīs operatori ir pamats; nākamā tēma parāda, kā <a href=\"https://course.raku.org/lv/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbi<\/em><\/a> ļauj precīzi regulēt, kuras funkcijas ir aktīvas.<\/span><\/p>"]]},"ru":{"t":"q, qq и Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Существуют три базовых оператора цитирования, различающихся тем, насколько они обрабатывают текст внутри:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — как одинарные кавычки: почти всё воспринимается буквально<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — как двойные кавычки: переменные и управляющие последовательности интерполируются<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — самая буквальная форма из всех: <strong>ничего<\/strong> не обрабатывается<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый оператор заключает текст в пару разделителей.<\/span> <span class=\"sg\" data-s=\"1\">Привычные <code>'…'<\/code> — это сокращение для <code>q<\/code>, а <code>\"…\"<\/code> — сокращение для <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> оставляет <code>$name<\/code> нетронутым; <code>qq<\/code> интерполирует его.<\/span> <span class=\"sg\" data-s=\"1\">Обратные косые черты, такие как <code>\\n<\/code>, ведут себя аналогично: только <code>qq<\/code> (и <code>\"…\"<\/code>) превращает <code>\\n<\/code> в настоящий перевод строки, тогда как и <code>q<\/code>, и <code>Q<\/code> оставляют его как два символа <code>\\<\/code> и <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так в чём же разница между <code>q<\/code> и <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code>, как и одинарные кавычки, всё же обрабатывает <em>небольшой<\/em> набор управляющих последовательностей — удвоенная обратная косая черта <code>\\\\<\/code> превращается в одну, и можно экранировать закрывающий разделитель — тогда как простая форма <code>Q<\/code> не обрабатывает <strong>вообще ничего<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете выбирать любые разделители — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code> — что удобно, когда сам текст содержит кавычки.<\/span> <span class=\"sg\" data-s=\"1\">Эти три оператора являются основой; в следующей теме показано, как <a href=\"https://course.raku.org/ru/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречия<\/em><\/a> позволяют точно выбирать, какие возможности активны.<\/span><\/p>"]]},"uk":{"t":"q, qq та Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Існує три базові оператори цитування, які різняться тим, наскільки вони обробляють текст усередині:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — як одинарні лапки: майже все буквальне<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — як подвійні лапки: змінні та екрановані послідовності інтерполюються<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — найбуквальніший з усіх: <strong>нічого<\/strong> не обробляється<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен бере текст між парою роздільників.<\/span> <span class=\"sg\" data-s=\"1\">Знайоме <code>'…'<\/code> є скороченням для <code>q<\/code>, а <code>\"…\"<\/code> — для <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> залишає <code>$name<\/code> недоторканим; <code>qq<\/code> його інтерполює.<\/span> <span class=\"sg\" data-s=\"1\">Екрановані послідовності на кшталт <code>\\n<\/code> поводяться так само: лише <code>qq<\/code> (і <code>\"…\"<\/code>) перетворює <code>\\n<\/code> на справжній перехід рядка, тоді як і <code>q<\/code>, і <code>Q<\/code> залишають його як два символи <code>\\<\/code> та <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;новий рядок&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">То чим же різняться <code>q<\/code> та <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code>, як і одинарні лапки, все ж обробляє <em>невеликий<\/em> набір екранованих послідовностей: подвоєна зворотна коса риска <code>\\\\<\/code> стає однією, а закривальний роздільник можна екранувати, — тоді як проста форма <code>Q<\/code> не обробляє <strong>нічого<\/strong> взагалі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q згортає екрановану зворотну косу риску\nsay Q{a\\\\b}; # a\\\\b  — Q зберігає обидва символи<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете обрати будь-які роздільники — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>, — що стає в пригоді, коли сам текст містить лапки.<\/span> <span class=\"sg\" data-s=\"1\">Ці три оператори є основою; наступна тема показує, як <a href=\"https://course.raku.org/uk/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наріччя<\/em><\/a> дозволяють добирати саме ті можливості, які мають бути ввімкнені.<\/span><\/p>"]]},"bg":{"t":"q, qq и Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Има три основни оператора за цитиране, които се различават по това колко обработват текста вътре:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — като единични кавички: почти всичко е буквално<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — като двойни кавички: променливите и екраниращите последователности се интерполират<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — най-буквалният от всички: <strong>нищо<\/strong> не се обработва<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки от тях приема текста между двойка разделители.<\/span> <span class=\"sg\" data-s=\"1\">Познатите <code>'…'<\/code> са съкращение за <code>q<\/code>, а <code>\"…\"<\/code> е съкращение за <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> оставя <code>$name<\/code> непроменено; <code>qq<\/code> го интерполира.<\/span> <span class=\"sg\" data-s=\"1\">Екраниращите последователности с обратна наклонена черта като <code>\\n<\/code> се държат по същия начин: само <code>qq<\/code> (и <code>\"…\"<\/code>) превръща <code>\\n<\/code> в истински нов ред, докато и <code>q<\/code>, и <code>Q<\/code> го оставят като двата символа <code>\\<\/code> и <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тогава по какво се различават <code>q<\/code> и <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code>, подобно на единичните кавички, все пак обработва <em>малък<\/em> набор от екранирания — удвоена обратна наклонена черта <code>\\\\<\/code> се превръща в една, и можете да екранирате затварящия разделител — докато обикновената форма <code>Q<\/code> не обработва <strong>абсолютно нищо<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q колапсира екранираната обратна наклонена черта\nsay Q{a\\\\b}; # a\\\\b  — Q запазва и двата символа<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да изберете всякакви разделители — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code> — което е удобно, когато самият текст съдържа кавички.<\/span> <span class=\"sg\" data-s=\"1\">Трите оператора са основата; следващата тема показва как <a href=\"https://course.raku.org/bg/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречията<\/em><\/a> ви позволяват да комбинирате точно кои функции са активни.<\/span><\/p>"]]},"eo":{"t":"q, qq, kaj Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzistas tri bazaj citaj operatoroj, kiuj diferencas laŭ tio, kiom ili prilaboras la tekston interne:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — kiel unuopaj citiloj: preskaŭ ĉio estas laŭlitera<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — kiel duoblaj citiloj: variabloj kaj eskapoj estas interpolataj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — la plej laŭlitera el ĉiuj: <strong>nenio<\/strong> estas prilaborata<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu prenas la tekston inter paro de limigiloj.<\/span> <span class=\"sg\" data-s=\"1\">La konata <code>'…'<\/code> estas mallongigo por <code>q<\/code>, kaj <code>\"…\"<\/code> estas mallongigo por <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> lasas <code>$name<\/code> netuŝita; <code>qq<\/code> interpolatas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Maldekstre-streketaj eskapoj kiel <code>\\n<\/code> kondutas same: nur <code>qq<\/code> (kaj <code>\"…\"<\/code>) transformas <code>\\n<\/code> en veran novlinion, dum kaj <code>q<\/code> kaj <code>Q<\/code> lasas ĝin kiel la du signojn <code>\\<\/code> kaj <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do kie diferencas <code>q<\/code> kaj <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code>, kiel unuopaj citiloj, ankoraŭ traktas <em>malgrandan<\/em> aron da eskapoj — duobligita maldekstra streketo <code>\\\\<\/code> fariĝas unu, kaj vi povas eskapi la fermilon — dum la simpla <code>Q<\/code>-formo prilaboras <strong>nenion<\/strong> tute:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q kolapsas la eskapitan maldekstran streketon\nsay Q{a\\\\b}; # a\\\\b  — Q konservas ambaŭ signojn<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas elekti ajnajn limigilojn — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code> — kio utilas kiam la teksto mem enhavas citilojn.<\/span> <span class=\"sg\" data-s=\"1\">La tri operatoroj estas la fundamento; la sekva temo montras kiel <a href=\"https://course.raku.org/eo/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverboj<\/em><\/a> ebligas vin miksi kaj agordi ĝuste kiuj funkcioj estas aktivaj.<\/span><\/p>"]]},"la":{"t":"q, qq, et Q","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tres operatores citandi fundamentales sunt, qui differunt quantum textum intus processent:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — sicut apostrophi simplices: fere omnia ad litteram sunt<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — sicut apostrophi duplices: variabiles et effugia interpolantur<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — maxime ad litteram omnium: <strong>nihil<\/strong> processatur<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quisque textum inter par delimitatorum accipit.<\/span> <span class=\"sg\" data-s=\"1\">Nota forma <code>'…'<\/code> est abbreviatio pro <code>q<\/code>, et <code>\"…\"<\/code> est abbreviatio pro <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> relinquit <code>$name<\/code> intactum; <code>qq<\/code> eam interpolat.<\/span> <span class=\"sg\" data-s=\"1\">Effugia per obliquum reversum ut <code>\\n<\/code> eodem modo se gerunt: solum <code>qq<\/code> (et <code>\"…\"<\/code>) convertit <code>\\n<\/code> in verum lineae finem, dum tam <code>q<\/code> quam <code>Q<\/code> eam relinquunt ut duos characteres <code>\\<\/code> et <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ubi ergo <code>q<\/code> et <code>Q<\/code> differunt?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code>, sicut apostrophi simplices, adhuc <em>parvum<\/em> numerum effugiorum tractat — obliquus reversus duplicatus <code>\\\\<\/code> fit unus, et delimitatorem claudentem effugere potes — dum forma simplex <code>Q<\/code> <strong>nihil<\/strong> omnino processat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quoslibet delimitatores eligere potes — <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code> — quod commodum est cum textus ipse apostrophos continet.<\/span> <span class=\"sg\" data-s=\"1\">Hi tres operatores fundamentum sunt; thema proximum ostendit quomodo <a href=\"https://course.raku.org/la/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbia<\/em><\/a> tibi permittant accurate miscere et aptare quae proprietates activae sint.<\/span><\/p>"]]}}}</script>
