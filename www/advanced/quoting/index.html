<script type="application/json" id="page-data">{"u":"advanced/quoting","n":463,"k":"section","pv":"advanced/strings/exercises/find-domain/solution","nx":"advanced/quoting/q-qq-big-q","tr":["advanced"],"L":{"en":{"t":"Quoting constructs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part you used <a href=\"/essentials/strings/\">single and double quotes to write strings<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Those are the two most common members of a whole family of <em>quoting constructs<\/em> that Raku gives you for building strings with exactly the amount of processing you want — from “take every character literally” to “interpolate variables, escapes, and even embedded code”.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section covers the three base forms <code>q<\/code>, <code>qq<\/code>, and <code>Q<\/code>, the adverbs that fine-tune them, and <em>heredocs<\/em> for multi-line text.<\/span><\/p>"]]},"de":{"t":"Quoting-Konstrukte","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im Grundlagenteil hast du <a href=\"https://course.raku.org/de/essentials/strings/\" target=\"_blank\" rel=\"noopener\">einfache und doppelte Anführungszeichen zum Schreiben von Strings<\/a> verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Diese sind die beiden häufigsten Vertreter einer ganzen Familie von <em>Quoting-Konstrukten<\/em>, die Raku dir zum Erstellen von Strings bietet — mit genau dem Grad an Verarbeitung, den du möchtest — von „nimm jedes Zeichen wörtlich\" bis „interpoliere Variablen, Escape-Sequenzen und sogar eingebetteten Code\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die drei Grundformen <code>q<\/code>, <code>qq<\/code> und <code>Q<\/code>, die Adverbien, die sie feinjustieren, und <em>Heredocs<\/em> für mehrzeiligen Text.<\/span><\/p>"]]},"nl":{"t":"Aanhalingsconstructies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <a href=\"https://course.raku.org/nl/essentials/strings/\" target=\"_blank\" rel=\"noopener\">enkele en dubbele aanhalingstekens gebruikt om strings te schrijven<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn de twee meest voorkomende leden van een hele familie van <em>quoting-constructies<\/em> die Raku je biedt om strings op te bouwen met precies de hoeveelheid verwerking die je wilt — van \"neem elk teken letterlijk\" tot \"interpoleer variabelen, escape-reeksen en zelfs ingebedde code\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel behandelt de drie basisvormen <code>q<\/code>, <code>qq<\/code> en <code>Q<\/code>, de bijwoorden die ze verfijnen, en <em>heredocs<\/em> voor tekst over meerdere regels.<\/span><\/p>"]]},"es":{"t":"Construcciones de entrecomillado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales utilizaste <a href=\"https://course.raku.org/es/essentials/strings/\" target=\"_blank\" rel=\"noopener\">comillas simples y dobles para escribir cadenas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Esas son las dos formas más comunes de toda una familia de <em>construcciones de entrecomillado<\/em> que Raku te ofrece para construir cadenas con exactamente la cantidad de procesamiento que deseas — desde «tomar cada carácter literalmente» hasta «interpolar variables, secuencias de escape e incluso código incrustado».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección cubre las tres formas base <code>q<\/code>, <code>qq<\/code> y <code>Q<\/code>, los adverbios que las ajustan, y los <em>heredocs<\/em> para texto multilínea.<\/span><\/p>"]]},"it":{"t":"Costrutti di quoting","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials hai usato <a href=\"https://course.raku.org/it/essentials/strings/\" target=\"_blank\" rel=\"noopener\">virgolette singole e doppie per scrivere stringhe<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Queste sono i due membri più comuni di un'intera famiglia di <em>costrutti di quoting<\/em> che Raku ti offre per costruire stringhe con esattamente il livello di elaborazione che desideri — da \"prendi ogni carattere letteralmente\" a \"interpola variabili, sequenze di escape e persino codice incorporato\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta le tre forme base <code>q<\/code>, <code>qq<\/code> e <code>Q<\/code>, gli avverbi che le regolano con precisione e gli <em>heredoc<\/em> per il testo su più righe.<\/span><\/p>"]]},"lv":{"t":"Citēšanas konstrukcijas 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs izmantojāt <a href=\"https://course.raku.org/lv/essentials/strings/\" target=\"_blank\" rel=\"noopener\">vienpēdiņas un dubultpēdiņas, lai rakstītu virknes<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir divi visbiežāk lietotie locekļi veselā <em>citēšanas konstrukciju<\/em> saimē, ko Raku piedāvā, lai veidotu virknes ar tieši tādu apstrādes apjomu, kādu vēlaties — no \"ņem katru rakstzīmi burtiski\" līdz \"interpolē mainīgos, aizbēgšanas secības un pat iegultu kodu\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko trīs bāzes formas <code>q<\/code>, <code>qq<\/code> un <code>Q<\/code>, adverbus, kas tos precizē, un <em>heredoc<\/em> konstrukcijas daudzrindu tekstam.<\/span><\/p>"]]},"ru":{"t":"Конструкции кавычек","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В части «Основы» вы использовали <a href=\"https://course.raku.org/ru/essentials/strings/\" target=\"_blank\" rel=\"noopener\">одинарные и двойные кавычки для записи строк<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Это два самых распространённых представителя целого семейства <em>конструкций цитирования<\/em>, которые Raku предоставляет для построения строк с именно тем уровнем обработки, который вам нужен — от «воспринимать каждый символ буквально» до «интерполировать переменные, управляющие последовательности и даже встроенный код».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе рассматриваются три базовые формы <code>q<\/code>, <code>qq<\/code> и <code>Q<\/code>, наречия, которые позволяют их настраивать, а также <em>heredoc'и<\/em> для многострочного текста.<\/span><\/p>"]]},"uk":{"t":"Конструкції цитування","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви користувалися <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">одинарними та подвійними лапками для запису рядків<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Це два найпоширеніші представники цілої родини <em>конструкцій цитування<\/em>, які Raku дає вам для побудови рядків саме з тим обсягом обробки, який вам потрібен, — від «сприймай кожен символ буквально» до «інтерполюй змінні, екрановані послідовності та навіть вбудований код».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює три базові форми <code>q<\/code>, <code>qq<\/code> та <code>Q<\/code>, наріччя, що їх тонко налаштовують, і <em>heredoc<\/em>-и для багаторядкового тексту.<\/span><\/p>"]]},"bg":{"t":"Конструкции за цитиране 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" използвахте <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">единични и двойни кавички за писане на низове<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Те са двата най-често срещани члена на цяло семейство от <em>конструкции за цитиране<\/em>, които Raku ви предоставя за изграждане на низове с точно толкова обработка, колкото желаете — от „приеми всеки символ буквално\" до „интерполирай променливи, екраниращи последователности и дори вграден код\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази секция обхваща трите основни форми <code>q<\/code>, <code>qq<\/code> и <code>Q<\/code>, наречията, които ги настройват, и <em>heredoc<\/em> за многоредов текст.<\/span><\/p>"]]},"eo":{"t":"Citaj konstruoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parto Essentials vi uzis <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">unuopajn kaj duoblajn citilojn por skribi ĉenojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tiuj estas la du plej oftaj membroj de tuta familio de <em>citaj konstruaĵoj<\/em>, kiujn Raku donas al vi por konstrui ĉenojn kun ĝuste la kvanto de prilaborado, kiun vi volas — de \"prenu ĉiun signon laŭlitere\" ĝis \"interpoli variablojn, eskapojn, kaj eĉ enkonstruitan kodon\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas la tri bazajn formojn <code>q<\/code>, <code>qq<\/code>, kaj <code>Q<\/code>, la adverbojn, kiuj agordigas ilin, kaj <em>heredoc<\/em>-ojn por plur-linia teksto.<\/span><\/p>"]]},"la":{"t":"Constructiones quotationis","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">apostrophos simplices et duplices ad scribendas series<\/a> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Hae sunt duo frequentissima membra totius familiae <em>constructionum citandi<\/em> quas Raku tibi praebet ad series aedificandas cum ea ipsa quantitate processus quam vis — ab \"omnem characterem ad litteram sume\" usque ad \"variabiles, effugia, atque etiam codicem insertum interpola\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec sectio tres formas fundamentales <code>q<\/code>, <code>qq<\/code>, et <code>Q<\/code> tractat, adverbia quae eas subtiliter moderantur, et <em>heredocs<\/em> pro textu plurium linearum.<\/span><\/p>"]]}}}</script>
