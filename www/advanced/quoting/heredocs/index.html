<script type="application/json" id="page-data">{"u":"advanced/quoting/heredocs","n":468,"k":"topic","pv":"advanced/quoting/adverbs/quiz","nx":"advanced/quoting/exercises","tr":["advanced","advanced/quoting"],"L":{"en":{"t":"Heredocs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>heredoc<\/em> is a quoting form for multi-line text.<\/span> <span class=\"sg\" data-s=\"1\">Instead of delimiters around the text, you give a terminator word with <code>:to<\/code>, and the string runs from the next line until a line containing just that word:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The terminator (<code>END<\/code> here — any word will do) marks where the text ends.<\/span> <span class=\"sg\" data-s=\"1\">Note the <code>print<\/code>: the text keeps the newline that sits before the terminator, so it already ends in a line break — using <code>say<\/code> would add a second one and leave a trailing blank line.<\/span> <span class=\"sg\" data-s=\"2\">Because the heredoc starts with <code>q:to<\/code>, the text is not interpolated; use <code>qq:to<\/code> to interpolate variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A useful detail: the <strong>indentation of the closing terminator<\/strong> is stripped from every line of the text.<\/span> <span class=\"sg\" data-s=\"1\">This lets you indent a heredoc to match the surrounding code without that indentation ending up in the string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This prints the same <code>Hello,<\/code> and <code>World!<\/code> as the first example.<\/span> <span class=\"sg\" data-s=\"1\">Here the closing <code>END<\/code> is indented by eight spaces, so eight spaces are removed from each line, and the returned string is just <code>Hello,\\nWorld!<\/code> with no leading spaces.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The closing terminator sets how much is stripped, so every line of the text must be indented at least that much.<\/span> <span class=\"sg\" data-s=\"1\">If a line has fewer leading spaces, Raku cannot remove the full amount and warns — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Keep the terminator no deeper than the shallowest line to avoid it.<\/span> <span class=\"sg\" data-s=\"3\">Heredocs are the natural choice for templates, messages, and any block of text that spans several lines.<\/span><\/p>"]]},"de":{"t":"Heredocs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Heredoc<\/em> ist eine Quoting-Form für mehrzeiligen Text.<\/span> <span class=\"sg\" data-s=\"1\">Anstelle von Trennzeichen um den Text herum gibst du mit <code>:to<\/code> ein Abschlusswort an, und der String reicht von der nächsten Zeile bis zu einer Zeile, die nur dieses Wort enthält:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe ist:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Abschlusswort (<code>END<\/code> hier — jedes Wort ist möglich) markiert, wo der Text endet.<\/span> <span class=\"sg\" data-s=\"1\">Beachte das <code>print<\/code>: Der Text behält den Zeilenumbruch, der vor dem Abschlusswort steht, sodass er bereits mit einem Zeilenumbruch endet — <code>say<\/code> würde einen zweiten hinzufügen und eine zusätzliche Leerzeile erzeugen.<\/span> <span class=\"sg\" data-s=\"2\">Da das Heredoc mit <code>q:to<\/code> beginnt, wird der Text nicht interpoliert; verwende <code>qq:to<\/code>, um Variablen zu interpolieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein nützliches Detail: Die <strong>Einrückung des schließenden Abschlusswortes<\/strong> wird von jeder Zeile des Textes entfernt.<\/span> <span class=\"sg\" data-s=\"1\">So kannst du ein Heredoc passend zum umgebenden Code einrücken, ohne dass diese Einrückung im String landet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies gibt dasselbe <code>Hello,<\/code> und <code>World!<\/code> wie das erste Beispiel aus.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist das schließende <code>END<\/code> um acht Leerzeichen eingerückt, also werden acht Leerzeichen von jeder Zeile entfernt, und der zurückgegebene String ist einfach <code>Hello,\\nWorld!<\/code> ohne führende Leerzeichen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das schließende Abschlusswort bestimmt, wie viel entfernt wird, daher muss jede Zeile des Textes mindestens so weit eingerückt sein.<\/span> <span class=\"sg\" data-s=\"1\">Wenn eine Zeile weniger führende Leerzeichen hat, kann Raku die volle Menge nicht entfernen und warnt — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Halte das Abschlusswort nicht tiefer eingerückt als die am wenigsten eingerückte Zeile, um dies zu vermeiden.<\/span> <span class=\"sg\" data-s=\"3\">Heredocs sind die natürliche Wahl für Templates, Nachrichten und jeden Textblock, der mehrere Zeilen umfasst.<\/span><\/p>"]]},"nl":{"t":"Heredocs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>heredoc<\/em> is een quoting-vorm voor tekst over meerdere regels.<\/span> <span class=\"sg\" data-s=\"1\">In plaats van scheidingstekens om de tekst heen, geef je een afsluitwoord op met <code>:to<\/code>, en de string loopt vanaf de volgende regel tot een regel die alleen dat woord bevat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het afsluitwoord (<code>END<\/code> hier — elk woord is mogelijk) markeert waar de tekst eindigt.<\/span> <span class=\"sg\" data-s=\"1\">Let op de <code>print<\/code>: de tekst behoudt de nieuwe regel die voor het afsluitwoord staat, dus hij eindigt al met een regelafbreking — het gebruik van <code>say<\/code> zou er een tweede toevoegen en een lege regel aan het einde achterlaten.<\/span> <span class=\"sg\" data-s=\"2\">Omdat de heredoc begint met <code>q:to<\/code>, wordt de tekst niet geinterpoleerd; gebruik <code>qq:to<\/code> om variabelen te interpoleren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een nuttig detail: de <strong>inspringging van het afsluitende afsluitwoord<\/strong> wordt van elke regel van de tekst verwijderd.<\/span> <span class=\"sg\" data-s=\"1\">Hierdoor kun je een heredoc laten inspringen om aan te sluiten bij de omringende code zonder dat die inspringging in de string terechtkomt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit drukt hetzelfde <code>Hello,<\/code> en <code>World!<\/code> af als het eerste voorbeeld.<\/span> <span class=\"sg\" data-s=\"1\">Hier is het afsluitende <code>END<\/code> acht spaties ingesprongen, dus acht spaties worden van elke regel verwijderd, en de teruggegeven string is gewoon <code>Hello,\\nWorld!<\/code> zonder voorloopspaties.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het afsluitende afsluitwoord bepaalt hoeveel er wordt verwijderd, dus elke regel van de tekst moet minstens zo ver zijn ingesprongen.<\/span> <span class=\"sg\" data-s=\"1\">Als een regel minder voorloopspaties heeft, kan Raku niet de volledige hoeveelheid verwijderen en geeft een waarschuwing — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Houd het afsluitwoord niet dieper dan de minst ingesprongen regel om dit te voorkomen.<\/span> <span class=\"sg\" data-s=\"3\">Heredocs zijn de natuurlijke keuze voor sjablonen, berichten en elk blok tekst dat meerdere regels beslaat.<\/span><\/p>"]]},"es":{"t":"Heredocs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>heredoc<\/em> es una forma de entrecomillado para texto multilínea.<\/span> <span class=\"sg\" data-s=\"1\">En lugar de delimitadores alrededor del texto, se indica una palabra terminadora con <code>:to<\/code>, y la cadena se extiende desde la siguiente línea hasta una línea que contenga solo esa palabra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El terminador (<code>END<\/code> aquí — cualquier palabra sirve) marca dónde termina el texto.<\/span> <span class=\"sg\" data-s=\"1\">Observa el uso de <code>print<\/code>: el texto conserva el salto de línea que precede al terminador, por lo que ya termina con un salto de línea — usar <code>say<\/code> añadiría un segundo y dejaría una línea en blanco al final.<\/span> <span class=\"sg\" data-s=\"2\">Como el heredoc comienza con <code>q:to<\/code>, el texto no se interpola; usa <code>qq:to<\/code> para interpolar variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un detalle útil: la <strong>indentación del terminador de cierre<\/strong> se elimina de cada línea del texto.<\/span> <span class=\"sg\" data-s=\"1\">Esto te permite indentar un heredoc para que coincida con el código circundante sin que esa indentación termine en la cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto imprime lo mismo que el primer ejemplo: <code>Hello,<\/code> y <code>World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aquí el <code>END<\/code> de cierre está indentado ocho espacios, así que se eliminan ocho espacios de cada línea, y la cadena resultante es simplemente <code>Hello,\\nWorld!<\/code> sin espacios iniciales.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El terminador de cierre establece cuánto se elimina, por lo que cada línea del texto debe estar indentada al menos esa cantidad.<\/span> <span class=\"sg\" data-s=\"1\">Si una línea tiene menos espacios iniciales, Raku no puede eliminar la cantidad completa y muestra una advertencia — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Mantén el terminador a una profundidad igual o menor que la línea menos indentada para evitarlo.<\/span> <span class=\"sg\" data-s=\"3\">Los heredocs son la opción natural para plantillas, mensajes y cualquier bloque de texto que abarque varias líneas.<\/span><\/p>"]]},"it":{"t":"Heredoc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>heredoc<\/em> è una forma di quoting per testo su più righe.<\/span> <span class=\"sg\" data-s=\"1\">Invece di delimitatori attorno al testo, si indica una parola terminatore con <code>:to<\/code>, e la stringa va dalla riga successiva fino a una riga che contiene solo quella parola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il terminatore (<code>END<\/code> qui — qualsiasi parola va bene) indica dove finisce il testo.<\/span> <span class=\"sg\" data-s=\"1\">Nota il <code>print<\/code>: il testo mantiene il carattere di nuova riga che si trova prima del terminatore, quindi termina già con un'interruzione di riga — usare <code>say<\/code> ne aggiungerebbe una seconda e lascerebbe una riga vuota finale.<\/span> <span class=\"sg\" data-s=\"2\">Poiché l'heredoc inizia con <code>q:to<\/code>, il testo non viene interpolato; usa <code>qq:to<\/code> per interpolare le variabili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un dettaglio utile: l'<strong>indentazione del terminatore di chiusura<\/strong> viene rimossa da ogni riga del testo.<\/span> <span class=\"sg\" data-s=\"1\">Questo ti permette di indentare un heredoc per allinearlo al codice circostante senza che quell'indentazione finisca nella stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo stampa lo stesso <code>Hello,<\/code> e <code>World!<\/code> del primo esempio.<\/span> <span class=\"sg\" data-s=\"1\">Qui il terminatore di chiusura <code>END<\/code> è indentato di otto spazi, quindi otto spazi vengono rimossi da ogni riga, e la stringa restituita è semplicemente <code>Hello,\\nWorld!<\/code> senza spazi iniziali.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il terminatore di chiusura stabilisce quanto viene rimosso, quindi ogni riga del testo deve essere indentata almeno altrettanto.<\/span> <span class=\"sg\" data-s=\"1\">Se una riga ha meno spazi iniziali, Raku non può rimuovere l'intera quantità e avvisa — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Mantieni il terminatore non più profondo della riga con meno indentazione per evitarlo.<\/span> <span class=\"sg\" data-s=\"3\">Gli heredoc sono la scelta naturale per template, messaggi e qualsiasi blocco di testo che si estende su più righe.<\/span><\/p>"]]},"lv":{"t":"Heredoc","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> ir citēšanas forma daudzrindu tekstam.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā, lai lietotu norobežotājus ap tekstu, jūs norādāt terminatora vārdu ar <code>:to<\/code>, un virkne turpinās no nākamās rindas līdz rindai, kas satur tikai šo vārdu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Terminators (<code>END<\/code> šeit — jebkurš vārds derēs) atzīmē, kur teksts beidzas.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet <code>print<\/code>: teksts saglabā jaunrindu, kas atrodas pirms terminatora, tāpēc tas jau beidzas ar rindu pārtraukumu — izmantojot <code>say<\/code>, tiktu pievienota vēl viena un paliktu tukša rinda beigās.<\/span> <span class=\"sg\" data-s=\"2\">Tā kā heredoc sākas ar <code>q:to<\/code>, teksts netiek interpolēts; izmantojiet <code>qq:to<\/code>, lai interpolētu mainīgos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noderīga detaļa: <strong>aizverošā terminatora atkāpe<\/strong> tiek noņemta no katras teksta rindas.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj atkāpēt heredoc, lai tas atbilstu apkārtējam kodam, un šī atkāpe nenonāk virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā to pašu <code>Hello,<\/code> un <code>World!<\/code> kā pirmajā piemērā.<\/span> <span class=\"sg\" data-s=\"1\">Šeit aizverošais <code>END<\/code> ir atkāpēts par astoņām atstarpēm, tāpēc astoņas atstarpes tiek noņemtas no katras rindas, un atgrieztā virkne ir vienkārši <code>Hello,\\nWorld!<\/code> bez vadošajām atstarpēm.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aizverošais terminators nosaka, cik daudz tiek noņemts, tāpēc katrai teksta rindai jābūt atkāpētai vismaz tik daudz.<\/span> <span class=\"sg\" data-s=\"1\">Ja kādai rindai ir mazāk vadošo atstarpes, Raku nevar noņemt pilnu apjomu un brīdina — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Turiet terminatoru ne dziļāk par vismazāk atkāpēto rindu, lai no tā izvairītos.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc ir dabiska izvēle veidnēm, ziņojumiem un jebkuram teksta blokam, kas aptver vairākas rindas.<\/span><\/p>"]]},"ru":{"t":"Heredoc-строки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> — это форма цитирования для многострочного текста.<\/span> <span class=\"sg\" data-s=\"1\">Вместо разделителей вокруг текста вы указываете слово-терминатор с помощью <code>:to<\/code>, и строка продолжается от следующей строки до строки, содержащей только это слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это выводит:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Терминатор (<code>END<\/code> в данном случае — подойдёт любое слово) обозначает, где заканчивается текст.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание на <code>print<\/code>: текст сохраняет перевод строки, который стоит перед терминатором, поэтому он уже заканчивается переносом строки — использование <code>say<\/code> добавило бы второй перенос и оставило бы пустую строку в конце.<\/span> <span class=\"sg\" data-s=\"2\">Поскольку heredoc начинается с <code>q:to<\/code>, текст не интерполируется; используйте <code>qq:to<\/code> для интерполяции переменных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Полезная деталь: <strong>отступ закрывающего терминатора<\/strong> удаляется из каждой строки текста.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет оформлять heredoc с отступом, соответствующим окружающему коду, без того чтобы этот отступ попал в строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это выводит те же <code>Hello,<\/code> и <code>World!<\/code>, что и первый пример.<\/span> <span class=\"sg\" data-s=\"1\">Здесь закрывающий <code>END<\/code> имеет отступ в восемь пробелов, поэтому восемь пробелов убираются из каждой строки, и возвращаемая строка — просто <code>Hello,\\nWorld!<\/code> без начальных пробелов.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Закрывающий терминатор определяет, сколько удаляется, поэтому каждая строка текста должна иметь отступ не менее этого значения.<\/span> <span class=\"sg\" data-s=\"1\">Если в какой-то строке начальных пробелов меньше, Raku не сможет удалить полный отступ и выдаст предупреждение — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Следите, чтобы терминатор был не глубже самой мелкой строки, чтобы избежать этого.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc'и — это естественный выбор для шаблонов, сообщений и любого блока текста, который занимает несколько строк.<\/span><\/p>"]]},"uk":{"t":"Heredoc-и","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> — це форма цитування для багаторядкового тексту.<\/span> <span class=\"sg\" data-s=\"1\">Замість роздільників навколо тексту ви вказуєте слово-термінатор через <code>:to<\/code>, і рядок триває з наступного рядка до рядка, що містить лише це слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Термінатор (тут <code>END<\/code> — годиться будь-яке слово) позначає, де текст закінчується.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу на <code>print<\/code>: текст зберігає перехід рядка, що стоїть перед термінатором, тож він уже закінчується розривом рядка — використання <code>say<\/code> додало б другий і залишило б наприкінці порожній рядок.<\/span> <span class=\"sg\" data-s=\"2\">Оскільки heredoc починається з <code>q:to<\/code>, текст не інтерполюється; щоб інтерполювати змінні, використовуйте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Корисна деталь: <strong>відступ закривального термінатора<\/strong> прибирається з кожного рядка тексту.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє зробити heredoc з відступом під навколишній код так, щоб цей відступ не потрапив у рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це виводить ті самі <code>Hello,<\/code> та <code>World!<\/code>, що й перший приклад.<\/span> <span class=\"sg\" data-s=\"1\">Тут закривальне <code>END<\/code> має відступ у вісім пробілів, тож із кожного рядка прибирається вісім пробілів, і поверненим рядком є просто <code>Hello,\\nWorld!<\/code> без жодних провідних пробілів.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Закривальний термінатор задає, скільки саме прибирається, тож кожен рядок тексту має мати відступ щонайменше такої довжини.<\/span> <span class=\"sg\" data-s=\"1\">Якщо в рядку менше провідних пробілів, Raku не може прибрати повну кількість і попереджає: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб цього уникнути, тримайте термінатор не глибше за найменш відступлений рядок.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc-и є природним вибором для шаблонів, повідомлень і будь-якого блоку тексту, що займає кілька рядків.<\/span><\/p>"]]},"bg":{"t":"Heredocs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> е форма на цитиране за многоредов текст.<\/span> <span class=\"sg\" data-s=\"1\">Вместо разделители около текста, задавате терминиращо слово с <code>:to<\/code> и низът продължава от следващия ред до ред, съдържащ само това слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Терминаторът (<code>END<\/code> тук — всяка дума е подходяща) маркира къде свършва текстът.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание на <code>print<\/code>: текстът запазва новия ред, който стои преди терминатора, така че вече завършва с край на ред — използването на <code>say<\/code> би добавило втори и би оставило празен ред в края.<\/span> <span class=\"sg\" data-s=\"2\">Тъй като heredoc-ът започва с <code>q:to<\/code>, текстът не се интерполира; използвайте <code>qq:to<\/code> за интерполиране на променливи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Полезен детайл: <strong>отстъпът на затварящия терминатор<\/strong> се премахва от всеки ред на текста.<\/span> <span class=\"sg\" data-s=\"1\">Това ви позволява да отместите heredoc-а, за да съвпада с обкръжаващия код, без този отстъп да попадне в низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва същото <code>Hello,<\/code> и <code>World!<\/code> като първия пример.<\/span> <span class=\"sg\" data-s=\"1\">Тук затварящият <code>END<\/code> е отместен с осем интервала, така че осем интервала се премахват от всеки ред и върнатият низ е просто <code>Hello,\\nWorld!<\/code> без водещи интервали.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Затварящият терминатор определя колко се премахва, така че всеки ред от текста трябва да е отместен поне толкова.<\/span> <span class=\"sg\" data-s=\"1\">Ако даден ред има по-малко водещи интервали, Raku не може да премахне пълното количество и предупреждава — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Дръжте терминатора не по-навътре от най-плиткия ред, за да избегнете това.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc-ите са естественият избор за шаблони, съобщения и всякакъв блок текст, който обхваща няколко реда.<\/span><\/p>"]]},"eo":{"t":"Heredokoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> estas cita formo por plur-linia teksto.<\/span> <span class=\"sg\" data-s=\"1\">Anstataŭ limigiloj ĉirkaŭ la teksto, vi donas finan vorton per <code>:to<\/code>, kaj la ĉeno daŭras de la sekva linio ĝis linio enhavanta nur tiun vorton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio presas:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La finilo (<code>END<\/code> ĉi tie — ajna vorto taŭgas) markas kie la teksto finiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Notu la <code>print<\/code>: la teksto konservas la novlinion kiu sidas antaŭ la finilo, do ĝi jam finiĝas per liniorompo — uzi <code>say<\/code> aldonus duan kaj lasus finan malplenan linion.<\/span> <span class=\"sg\" data-s=\"2\">Ĉar la heredoc komenciĝas per <code>q:to<\/code>, la teksto ne estas interpolata; uzu <code>qq:to<\/code> por interpoli variablojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Utila detalo: la <strong>krommarĝeno de la ferma finilo<\/strong> estas forigita el ĉiu linio de la teksto.<\/span> <span class=\"sg\" data-s=\"1\">Tio ebligas vin krommarĝenigi heredoc-on por kongrui kun la ĉirkaŭa kodo sen ke tiu krommarĝeno aperu en la ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio presas la samajn <code>Hello,<\/code> kaj <code>World!<\/code> kiel la unua ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie la ferma <code>END<\/code> estas krommarĝenigita per ok spacetoj, do ok spacetoj estas forigitaj el ĉiu linio, kaj la returnita ĉeno estas nur <code>Hello,\\nWorld!<\/code> sen komencaj spacetoj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La ferma finilo determinas kiom estas forigita, do ĉiu linio de la teksto devas esti krommarĝenigita almenaŭ tiom.<\/span> <span class=\"sg\" data-s=\"1\">Se linio havas malpli da komencaj spacetoj, Raku ne povas forigi la plenan kvanton kaj avertas — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tenu la finilon ne pli profunde ol la plej malprofunda linio por eviti tion.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc-oj estas la natura elekto por ŝablonoj, mesaĝoj, kaj ajna tekstobloko kiu etendas tra pluraj linioj.<\/span><\/p>"]]},"la":{"t":"Heredocs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> est forma citandi pro textu plurium linearum.<\/span> <span class=\"sg\" data-s=\"1\">Loco delimitatorum circa textum, verbum terminans cum <code>:to<\/code> das, et series a proxima linea usque ad lineam quae solum illud verbum continet currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Terminator (<code>END<\/code> hic — quodlibet verbum convenit) indicat ubi textus desinat.<\/span> <span class=\"sg\" data-s=\"1\">Nota <code>print<\/code>: textus lineae finem qui ante terminatorem sedet retinet, itaque iam in lineae fractura desinit — si <code>say<\/code> adhibeas, alterum adderet et lineam vacuam post relinqueret.<\/span> <span class=\"sg\" data-s=\"2\">Quia heredoc cum <code>q:to<\/code> incipit, textus non interpolatur; <code>qq:to<\/code> adhibe ut variabiles interpoles:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Res utilis: <strong>indentatio terminatoris claudentis<\/strong> ab omni linea textus detrahitur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc tibi permittit heredoc indentare ut cum codice circumdante congruat sine illa indentatione in seriem perveniente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc idem <code>Hello,<\/code> et <code>World!<\/code> ac primum exemplum imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Hic terminans <code>END<\/code> octo spatiis indentatus est, itaque octo spatia ab omni linea removentur, et series reddita solum <code>Hello,\\nWorld!<\/code> est sine spatiis praecedentibus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Terminator claudens statuit quantum detrahatur, itaque omnis linea textus saltem tantundem indentata esse debet.<\/span> <span class=\"sg\" data-s=\"1\">Si linea pauciora spatia praecedentia habet, Raku plenam quantitatem removere non potest et monet — <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Terminatorem non profundius quam lineam minime indentam serva ad hoc vitandum.<\/span> <span class=\"sg\" data-s=\"3\">Heredocs sunt naturalis electio pro exemplaribus, nuntiis, et quolibet textu qui plures lineas occupat.<\/span><\/p>"]]}}}</script>
