<script type="application/json" id="page-data">{"u":"advanced/module-introspection","n":714,"k":"section","pv":"advanced/modules-basics/exercises/require-at-runtime/solution","nx":"advanced/module-introspection/exercises","tr":["advanced"],"L":{"en":{"t":"Module introspection","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A module’s name introduces a <em>package<\/em> — a namespace that holds the names defined in it.<\/span> <span class=\"sg\" data-s=\"1\">Earlier, in <a href=\"/advanced/containers/\">the section about containers<\/a>, you met <code>WHO<\/code>, which returns the <code>Stash<\/code> (the symbol table) of a package.<\/span> <span class=\"sg\" data-s=\"2\">Module introspection puts that to use.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The examples below use the <code>Greeting<\/code> module built up in the earlier topics — an exported subroutine and a shared <code>our<\/code> variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The package of a module is written with a trailing <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Adding <code>.keys<\/code> lists the names it contains:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>Greeting<\/code> module from the earlier topics defines an <code>our<\/code> variable, <code>$version<\/code>, so its package contains that name — with the sigil included.<\/span> <span class=\"sg\" data-s=\"1\">Next to it sits <code>EXPORT<\/code>, which may look surprising.<\/span> <span class=\"sg\" data-s=\"2\">It is a package Raku creates automatically to hold everything a module marks <code>is export<\/code>, such as the <code>hello<\/code> subroutine.<\/span> <span class=\"sg\" data-s=\"3\">An exported name therefore does <em>not<\/em> appear directly in the package; it lives inside that <code>EXPORT<\/code> sub-package. (The keys come back in no fixed order, so the example sorts them for a stable result.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also look a name up in the package by using it as a key.<\/span> <span class=\"sg\" data-s=\"1\">This reaches the same value as the qualified <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listing what a module exports<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>EXPORT<\/code> package seen above is where the exported names actually live, so you can list them by looking one level deeper.<\/span> <span class=\"sg\" data-s=\"1\">Exports without a tag go into the <code>DEFAULT<\/code> group (see <a href=\"/advanced/modules-basics/export-tags/\">Export tags<\/a>), and its <code>.keys<\/code> are the exported routines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each key is an exported name with its sigil — here the single subroutine <code>&amp;hello<\/code>, shown with the <code>&amp;<\/code> that marks a routine.<\/span> <span class=\"sg\" data-s=\"1\">This is how you discover what a module makes available to its users without reading its source: ask its <code>EXPORT::DEFAULT<\/code> package what it holds.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Introspecting a package this way is handy when you want to discover what a module provides, or to reach its names dynamically rather than writing each one out in the source code.<\/span><\/p>"]]},"de":{"t":"Modul-Introspektion","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Name eines Moduls führt ein <em>Package<\/em> ein — einen Namensraum, der die darin definierten Namen enthält.<\/span> <span class=\"sg\" data-s=\"1\">Früher, im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a>, hast du <code>WHO<\/code> kennengelernt, das den <code>Stash<\/code> (die Symboltabelle) eines Packages zurückgibt.<\/span> <span class=\"sg\" data-s=\"2\">Modul-Introspection macht davon Gebrauch.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Beispiele verwenden das <code>Greeting<\/code>-Modul, das in den vorherigen Themen aufgebaut wurde — eine exportierte Subroutine und eine gemeinsam genutzte <code>our<\/code>-Variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Package eines Moduls wird mit einem nachgestellten <code>::<\/code> geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>.keys<\/code> listest du die darin enthaltenen Namen auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das <code>Greeting<\/code>-Modul aus den vorherigen Themen definiert eine <code>our<\/code>-Variable, <code>$version<\/code>, sodass sein Package diesen Namen enthält — einschließlich des Sigils.<\/span> <span class=\"sg\" data-s=\"1\">Daneben befindet sich <code>EXPORT<\/code>, was überraschend wirken mag.<\/span> <span class=\"sg\" data-s=\"2\">Es ist ein Package, das Raku automatisch erstellt, um alles aufzunehmen, was ein Modul mit <code>is export<\/code> markiert, wie die Subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ein exportierter Name erscheint daher <em>nicht<\/em> direkt im Package; er befindet sich innerhalb dieses <code>EXPORT<\/code>-Unter-Packages. (Die Schlüssel kommen in keiner festen Reihenfolge zurück, daher sortiert das Beispiel sie für ein stabiles Ergebnis.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst einen Namen auch im Package nachschlagen, indem du ihn als Schlüssel verwendest.<\/span> <span class=\"sg\" data-s=\"1\">Dies erreicht denselben Wert wie das qualifizierte <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Auflisten, was ein Modul exportiert<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das oben gezeigte <code>EXPORT<\/code>-Package ist der Ort, an dem die exportierten Namen tatsächlich liegen.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst sie auflisten, indem du eine Ebene tiefer schaust.<\/span> <span class=\"sg\" data-s=\"2\">Exporte ohne Tag gehen in die <code>DEFAULT<\/code>-Gruppe (siehe <a href=\"https://course.raku.org/de/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Export-Tags<\/a>), und ihre <code>.keys<\/code> sind die exportierten Routinen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Schlüssel ist ein exportierter Name mit seinem Sigil — hier die einzelne Subroutine <code>&amp;hello<\/code>, dargestellt mit dem <code>&amp;<\/code>, das eine Routine kennzeichnet.<\/span> <span class=\"sg\" data-s=\"1\">So kannst du herausfinden, was ein Modul seinen Nutzern zur Verfügung stellt, ohne dessen Quellcode zu lesen: Frage sein <code>EXPORT::DEFAULT<\/code>-Package, was es enthält.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Package auf diese Weise zu inspizieren ist praktisch, wenn du herausfinden möchtest, was ein Modul bereitstellt, oder wenn du seine Namen dynamisch erreichen willst, anstatt jeden einzeln im Quellcode auszuschreiben.<\/span><\/p>"]]},"nl":{"t":"Module-introspectie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De naam van een module introduceert een <em>pakket<\/em> — een naamruimte die de namen bevat die erin gedefinieerd zijn.<\/span> <span class=\"sg\" data-s=\"1\">Eerder, in <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">de sectie over containers<\/a>, heb je <code>WHO<\/code> leren kennen, dat de <code>Stash<\/code> (de symbooltabel) van een pakket teruggeeft.<\/span> <span class=\"sg\" data-s=\"2\">Module-introspectie maakt daar gebruik van.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De onderstaande voorbeelden gebruiken de <code>Greeting<\/code>-module die in de eerdere onderwerpen is opgebouwd — een geëxporteerde subroutine en een gedeelde <code>our<\/code>-variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het pakket van een module wordt geschreven met een afsluitende <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Door <code>.keys<\/code> toe te voegen worden de namen weergegeven die het bevat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De <code>Greeting<\/code>-module uit de eerdere onderwerpen definieert een <code>our<\/code>-variabele, <code>$version<\/code>, dus het pakket bevat die naam — inclusief de sigil.<\/span> <span class=\"sg\" data-s=\"1\">Daarnaast staat <code>EXPORT<\/code>, wat misschien verrassend lijkt.<\/span> <span class=\"sg\" data-s=\"2\">Dit is een pakket dat Raku automatisch aanmaakt om alles te bewaren wat een module markeert met <code>is export<\/code>, zoals de <code>hello<\/code>-subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Een geëxporteerde naam verschijnt daarom <em>niet<\/em> direct in het pakket; het bevindt zich in dat <code>EXPORT<\/code>-subpakket. (De sleutels komen in geen vaste volgorde terug, dus het voorbeeld sorteert ze voor een stabiel resultaat.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook een naam opzoeken in het pakket door het als sleutel te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Dit bereikt dezelfde waarde als de gekwalificeerde <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Weergeven wat een module exporteert<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>EXPORT<\/code>-pakket dat hierboven te zien is, is de plek waar de geëxporteerde namen daadwerkelijk leven, dus je kunt ze weergeven door een niveau dieper te kijken.<\/span> <span class=\"sg\" data-s=\"1\">Exports zonder een tag gaan naar de <code>DEFAULT<\/code>-groep (zie <a href=\"https://course.raku.org/nl/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Exporttags<\/a>), en de <code>.keys<\/code> daarvan zijn de geëxporteerde routines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke sleutel is een geëxporteerde naam met zijn sigil — hier de enkele subroutine <code>&amp;hello<\/code>, weergegeven met de <code>&amp;<\/code> die een routine aanduidt.<\/span> <span class=\"sg\" data-s=\"1\">Zo kun je ontdekken wat een module beschikbaar stelt aan zijn gebruikers zonder de broncode te lezen: vraag het <code>EXPORT::DEFAULT<\/code>-pakket wat het bevat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het inspecteren van een pakket op deze manier is handig wanneer je wilt ontdekken wat een module biedt, of om de namen dynamisch te benaderen in plaats van ze allemaal uit te schrijven in de broncode.<\/span><\/p>"]]},"es":{"t":"Introspección de módulos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El nombre de un módulo introduce un <em>paquete<\/em> — un espacio de nombres que contiene los nombres definidos en el.<\/span> <span class=\"sg\" data-s=\"1\">Anteriormente, en <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">la sección sobre contenedores<\/a>, conociste <code>WHO<\/code>, que devuelve el <code>Stash<\/code> (la tabla de símbolos) de un paquete.<\/span> <span class=\"sg\" data-s=\"2\">La introspección de módulos aprovecha eso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los ejemplos a continuación usan el módulo <code>Greeting<\/code> construido en los temas anteriores — una subrutina exportada y una variable compartida <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El paquete de un módulo se escribe con <code>::<\/code> al final.<\/span> <span class=\"sg\" data-s=\"1\">Agregar <code>.keys<\/code> lista los nombres que contiene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El módulo <code>Greeting<\/code> de los temas anteriores define una variable <code>our<\/code>, <code>$version<\/code>, así que su paquete contiene ese nombre — con el sigilo incluido.<\/span> <span class=\"sg\" data-s=\"1\">A su lado esta <code>EXPORT<\/code>, que puede parecer sorprendente.<\/span> <span class=\"sg\" data-s=\"2\">Es un paquete que Raku crea automáticamente para contener todo lo que un módulo marca como <code>is export<\/code>, como la subrutina <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Un nombre exportado, por lo tanto, <em>no<\/em> aparece directamente en el paquete; vive dentro de ese sub-paquete <code>EXPORT<\/code>. (Las claves se devuelven sin un orden fijo, así que el ejemplo las ordena para obtener un resultado estable.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes buscar un nombre en el paquete usandolo como clave.<\/span> <span class=\"sg\" data-s=\"1\">Esto accede al mismo valor que el calificado <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listar lo que exporta un módulo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El paquete <code>EXPORT<\/code> visto arriba es donde realmente viven los nombres exportados, así que puedes listarlos mirando un nivel más profundo.<\/span> <span class=\"sg\" data-s=\"1\">Las exportaciones sin etiqueta van al grupo <code>DEFAULT<\/code> (consulta <a href=\"https://course.raku.org/es/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Etiquetas de exportación<\/a>), y sus <code>.keys<\/code> son las rutinas exportadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada clave es un nombre exportado con su sigilo — aquí la única subrutina <code>&amp;hello<\/code>, mostrada con el <code>&amp;<\/code> que marca una rutina.<\/span> <span class=\"sg\" data-s=\"1\">Así es como descubres lo que un módulo pone a disposición de sus usuarios sin leer su código fuente: preguntale a su paquete <code>EXPORT::DEFAULT<\/code> que contiene.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Introspeccionar un paquete de esta manera es útil cuando quieres descubrir lo que un módulo proporciona, o para acceder a sus nombres dinamicamente en lugar de escribir cada uno en el código fuente.<\/span><\/p>"]]},"it":{"t":"Introspezione dei moduli","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il nome di un modulo introduce un <em>package<\/em> — uno spazio dei nomi che contiene i nomi definiti al suo interno.<\/span> <span class=\"sg\" data-s=\"1\">In precedenza, nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui container<\/a>, hai incontrato <code>WHO<\/code>, che restituisce lo <code>Stash<\/code> (la tabella dei simboli) di un package.<\/span> <span class=\"sg\" data-s=\"2\">L'introspezione dei moduli sfrutta proprio questo meccanismo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli esempi seguenti utilizzano il modulo <code>Greeting<\/code> costruito nei capitoli precedenti — una subroutine esportata e una variabile <code>our<\/code> condivisa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il package di un modulo si scrive con <code>::<\/code> finale.<\/span> <span class=\"sg\" data-s=\"1\">Aggiungendo <code>.keys<\/code> si ottiene l'elenco dei nomi che contiene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il modulo <code>Greeting<\/code> dei capitoli precedenti definisce una variabile <code>our<\/code>, <code>$version<\/code>, quindi il suo package contiene quel nome — sigillo incluso.<\/span> <span class=\"sg\" data-s=\"1\">Accanto ad esso si trova <code>EXPORT<\/code>, che potrebbe sembrare inaspettato.<\/span> <span class=\"sg\" data-s=\"2\">Si tratta di un package che Raku crea automaticamente per contenere tutto ciò che un modulo contrassegna come <code>is export<\/code>, come la subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Un nome esportato quindi <em>non<\/em> appare direttamente nel package; risiede all'interno di quel sotto-package <code>EXPORT<\/code>. (Le chiavi vengono restituite senza un ordine fisso, quindi l'esempio le ordina per ottenere un risultato stabile.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si può anche cercare un nome nel package usandolo come chiave.<\/span> <span class=\"sg\" data-s=\"1\">Questo raggiunge lo stesso valore del qualificato <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Elencare ciò che un modulo esporta<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il package <code>EXPORT<\/code> visto sopra è dove risiedono effettivamente i nomi esportati, quindi è possibile elencarli guardando un livello più in profondità.<\/span> <span class=\"sg\" data-s=\"1\">Le esportazioni senza un tag finiscono nel gruppo <code>DEFAULT<\/code> (vedi <a href=\"https://course.raku.org/it/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Tag di esportazione<\/a>), e le sue <code>.keys<\/code> sono le routine esportate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni chiave è un nome esportato con il suo sigillo — qui l'unica subroutine <code>&amp;hello<\/code>, mostrata con il <code>&amp;<\/code> che indica una routine.<\/span> <span class=\"sg\" data-s=\"1\">Questo è il modo per scoprire ciò che un modulo mette a disposizione dei suoi utenti senza leggerne il codice sorgente: basta chiedere al suo package <code>EXPORT::DEFAULT<\/code> cosa contiene.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fare introspezione su un package in questo modo è utile quando si vuole scoprire cosa offre un modulo, o per raggiungere i suoi nomi in modo dinamico anziché scriverli uno per uno nel codice sorgente.<\/span><\/p>"]]},"lv":{"t":"Moduļu introspekcija","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduļa nosaukums ievieš <em>pakotni<\/em> — nosaukumtelpu, kas satur tajā definētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"1\">Iepriekš, <a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sadaļā par konteineriem<\/a>, jūs iepazināties ar <code>WHO<\/code>, kas atgriež pakotnes <code>Stash<\/code> (simbolu tabulu).<\/span> <span class=\"sg\" data-s=\"2\">Moduļu introspekcija to izmanto praksē.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Turpmākajos piemēros tiek izmantots modulis <code>Greeting<\/code>, kas tika izveidots iepriekšējās tēmās — eksportēta apakšprogramma un koplietota <code>our<\/code> mainīgais:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduļa pakotne tiek pierakstīta ar <code>::<\/code> beigās.<\/span> <span class=\"sg\" data-s=\"1\">Pievienojot <code>.keys<\/code>, tiek uzskaitīti tajā esošie nosaukumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulis <code>Greeting<\/code> no iepriekšējām tēmām definē <code>our<\/code> mainīgo <code>$version<\/code>, tāpēc tā pakotnē ir šis nosaukums — ar sigilu iekļautu.<\/span> <span class=\"sg\" data-s=\"1\">Blakus tam atrodas <code>EXPORT<\/code>, kas var šķist pārsteidzoši.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir pakotne, ko Raku automātiski izveido, lai glabātu visu, ko modulis atzīmē ar <code>is export<\/code>, piemēram, apakšprogrammu <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc eksportēts nosaukums <em>neparādās<\/em> tieši pakotnē; tas atrodas šajā <code>EXPORT<\/code> apakšpakotnē. (Atslēgas tiek atgrieztas nefiksētā secībā, tāpēc piemērā tās tiek sakārtotas, lai iegūtu stabilu rezultātu.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī meklēt nosaukumu pakotnē, izmantojot to kā atslēgu.<\/span> <span class=\"sg\" data-s=\"1\">Tas sasniedz to pašu vērtību kā kvalificētais <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduļa eksportēto elementu uzskaitīšana<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iepriekš redzētā pakotne <code>EXPORT<\/code> ir vieta, kur faktiski atrodas eksportētie nosaukumi, tāpēc tos var uzskaitīt, ieskatoties vienu līmeni dziļāk.<\/span> <span class=\"sg\" data-s=\"1\">Eksporti bez birkas nonāk grupā <code>DEFAULT<\/code> (skatiet <a href=\"https://course.raku.org/lv/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Eksporta birkas<\/a>), un tās <code>.keys<\/code> ir eksportētās rutīnas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katra atslēga ir eksportēts nosaukums ar tā sigilu — šeit vienīgā apakšprogramma <code>&amp;hello<\/code>, parādīta ar <code>&amp;<\/code>, kas apzīmē rutīnu.<\/span> <span class=\"sg\" data-s=\"1\">Šādi jūs varat uzzināt, ko modulis piedāvā saviem lietotājiem, nelasot tā pirmkodu: pajautājiet tā <code>EXPORT::DEFAULT<\/code> pakotnei, ko tā satur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pakotnes introspekcija šādā veidā ir noderīga, ja vēlaties uzzināt, ko modulis piedāvā, vai dinamiski piekļūt tā nosaukumiem, nevis katru no tiem ierakstīt pirmkodā.<\/span><\/p>"]]},"ru":{"t":"Интроспекция модулей","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Имя модуля вводит <em>пакет<\/em> — пространство имён, в котором хранятся определённые в нём имена.<\/span> <span class=\"sg\" data-s=\"1\">Ранее, в <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a>, вы познакомились с <code>WHO<\/code>, который возвращает <code>Stash<\/code> (таблицу символов) пакета.<\/span> <span class=\"sg\" data-s=\"2\">Интроспекция модулей использует это на практике.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В примерах ниже используется модуль <code>Greeting<\/code>, созданный в предыдущих темах — экспортированная подпрограмма и разделяемая переменная <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пакет модуля записывается с завершающим <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Добавление <code>.keys<\/code> выводит список содержащихся в нём имён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Модуль <code>Greeting<\/code> из предыдущих тем определяет переменную <code>our<\/code> — <code>$version<\/code>, поэтому его пакет содержит это имя — вместе с сигилом.<\/span> <span class=\"sg\" data-s=\"1\">Рядом с ним находится <code>EXPORT<\/code>, что может показаться неожиданным.<\/span> <span class=\"sg\" data-s=\"2\">Это пакет, который Raku создаёт автоматически для хранения всего, что модуль помечает как <code>is export<\/code>, например подпрограммы <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Экспортированное имя, таким образом, <em>не<\/em> появляется непосредственно в пакете; оно находится внутри подпакета <code>EXPORT<\/code>. (Ключи возвращаются в произвольном порядке, поэтому в примере они сортируются для стабильного результата.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы также можете найти имя в пакете, используя его как ключ.<\/span> <span class=\"sg\" data-s=\"1\">Это обращается к тому же значению, что и квалифицированное <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Список экспортируемых имён модуля<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пакет <code>EXPORT<\/code>, показанный выше, — это место, где фактически находятся экспортированные имена, поэтому вы можете перечислить их, заглянув на один уровень глубже.<\/span> <span class=\"sg\" data-s=\"1\">Экспорты без тега попадают в группу <code>DEFAULT<\/code> (см.<\/span> <span class=\"sg\" data-s=\"2\"><a href=\"https://course.raku.org/ru/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Теги экспорта<\/a>), и его <code>.keys<\/code> — это экспортированные подпрограммы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый ключ — это экспортированное имя с его сигилом — здесь единственная подпрограмма <code>&amp;hello<\/code>, показанная с <code>&amp;<\/code>, обозначающим подпрограмму.<\/span> <span class=\"sg\" data-s=\"1\">Так вы можете узнать, что модуль предоставляет своим пользователям, не читая его исходный код: достаточно спросить у пакета <code>EXPORT::DEFAULT<\/code>, что в нём содержится.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Интроспекция пакета таким способом удобна, когда вы хотите узнать, что предоставляет модуль, или обратиться к его именам динамически, а не прописывать каждое из них в исходном коде.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція модулів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ім'я модуля вводить <em>пакунок<\/em> — простір імен, який містить визначені в ньому імена.<\/span> <span class=\"sg\" data-s=\"1\">Раніше, у <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a>, ви познайомилися з <code>WHO<\/code>, який повертає <code>Stash<\/code> (таблицю символів) пакунка.<\/span> <span class=\"sg\" data-s=\"2\">Інтроспекція модулів пускає це в діло.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наведені нижче приклади використовують модуль <code>Greeting<\/code>, побудований у попередніх темах, — з експортованою підпрограмою та спільною змінною <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пакунок модуля записують із завершальним <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Додавання <code>.keys<\/code> перелічує імена, які він містить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Модуль <code>Greeting<\/code> із попередніх тем визначає змінну <code>our<\/code> під назвою <code>$version<\/code>, тож його пакунок містить це ім'я — разом із сигілом.<\/span> <span class=\"sg\" data-s=\"1\">Поруч із ним стоїть <code>EXPORT<\/code>, що може здатися несподіваним.<\/span> <span class=\"sg\" data-s=\"2\">Це пакунок, який Raku створює автоматично, щоб зберігати все, що модуль позначає <code>is export<\/code>, як-от підпрограму <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Отже, експортоване ім'я <em>не<\/em> з'являється в пакунку безпосередньо; воно живе всередині цього підпакунка <code>EXPORT<\/code>. (Ключі повертаються без сталого порядку, тож приклад сортує їх заради стабільного результату.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ім'я можна також знайти в пакунку, використавши його як ключ.<\/span> <span class=\"sg\" data-s=\"1\">Це дістає те саме значення, що й кваліфіковане <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перелік того, що експортує модуль<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пакунок <code>EXPORT<\/code>, побачений вище, і є тим місцем, де насправді живуть експортовані імена, тож їх можна перелічити, зазирнувши на рівень глибше.<\/span> <span class=\"sg\" data-s=\"1\">Експорти без мітки потрапляють до групи <code>DEFAULT<\/code> (див.<\/span> <span class=\"sg\" data-s=\"2\"><a href=\"https://course.raku.org/uk/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Мітки експорту<\/a>), і її <code>.keys<\/code> — це експортовані підпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен ключ є експортованим іменем із його сигілом — тут єдина підпрограма <code>&amp;hello<\/code>, показана з <code>&amp;<\/code>, що позначає підпрограму.<\/span> <span class=\"sg\" data-s=\"1\">Саме так ви дізнаєтеся, що модуль надає своїм користувачам, не читаючи його вихідного коду: спитайте в його пакунка <code>EXPORT::DEFAULT<\/code>, що той містить.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така інтроспекція пакунка стає в пригоді, коли ви хочете дізнатися, що надає модуль, або дістатися його імен динамічно, а не виписувати кожне у вихідному коді.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на модули","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Името на модула въвежда <em>пакет<\/em> — пространство от имена, което съдържа дефинираните в него имена.<\/span> <span class=\"sg\" data-s=\"1\">По-рано, в <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a>, се запознахте с <code>WHO<\/code>, който връща <code>Stash<\/code> (таблицата със символи) на пакета.<\/span> <span class=\"sg\" data-s=\"2\">Интроспекцията на модули използва именно това.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Примерите по-долу използват модула <code>Greeting<\/code>, изграден в предишните теми — експортирана подпрограма и споделена <code>our<\/code> променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пакетът на модул се записва с <code>::<\/code> в края.<\/span> <span class=\"sg\" data-s=\"1\">Добавянето на <code>.keys<\/code> изброява съдържащите се в него имена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Модулът <code>Greeting<\/code> от предишните теми дефинира <code>our<\/code> променлива <code>$version<\/code>, така че пакетът му съдържа това име — включително сигила.<\/span> <span class=\"sg\" data-s=\"1\">До нея стои <code>EXPORT<\/code>, което може да изглежда изненадващо.<\/span> <span class=\"sg\" data-s=\"2\">Това е пакет, който Raku създава автоматично, за да съхранява всичко, маркирано с <code>is export<\/code>, като подпрограмата <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Следователно експортираното име <em>не<\/em> се появява директно в пакета — то се намира във вътрешния подпакет <code>EXPORT<\/code>. (Ключовете се връщат в произволен ред, затова примерът ги сортира за стабилен резултат.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете също да потърсите име в пакета, като го използвате като ключ.<\/span> <span class=\"sg\" data-s=\"1\">Така достигате същата стойност като квалифицираната <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изброяване на експортите на модул<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пакетът <code>EXPORT<\/code>, показан по-горе, е мястото, където действително се намират експортираните имена, така че можете да ги изброите, като погледнете едно ниво по-навътре.<\/span> <span class=\"sg\" data-s=\"1\">Експортите без таг попадат в групата <code>DEFAULT<\/code> (вижте <a href=\"https://course.raku.org/bg/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Тагове за експортиране<\/a>), а <code>.keys<\/code> показва експортираните подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки ключ е експортирано име с неговия сигил — тук единствената подпрограма <code>&amp;hello<\/code>, показана със <code>&amp;<\/code>, което маркира подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Така можете да разберете какво предоставя модулът на своите потребители, без да четете изходния му код: попитайте пакета <code>EXPORT::DEFAULT<\/code> какво съдържа.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Интроспекцията на пакет по този начин е удобна, когато искате да откриете какво предоставя даден модул, или да достигнете до имената му динамично, вместо да ги записвате едно по едно в изходния код.<\/span><\/p>"]]},"eo":{"t":"Modula introspekto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La nomo de modulo enkondukas <em>pakaĵon<\/em> — nomspacon, kiu enhavas la nomojn difinitajn en ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Pli frue, en <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">la sekcio pri ujoj<\/a>, vi renkontis <code>WHO<\/code>, kiu redonas la <code>Stash<\/code> (la simboltabelon) de pakaĵo.<\/span> <span class=\"sg\" data-s=\"2\">Modula introspektado utiligas tion.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La subaj ekzemploj uzas la modulon <code>Greeting<\/code>, konstruitan en la antaŭaj temoj — eksportita subrutino kaj dividata <code>our<\/code>-variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La pakaĵo de modulo estas skribata kun fina <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aldono de <code>.keys<\/code> listigas la nomojn, kiujn ĝi enhavas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La modulo <code>Greeting<\/code> el la antaŭaj temoj difinas <code>our<\/code>-variablon, <code>$version<\/code>, do ĝia pakaĵo enhavas tiun nomon — inkluzive de la sigelo.<\/span> <span class=\"sg\" data-s=\"1\">Apud ĝi sidas <code>EXPORT<\/code>, kiu eble ŝajnas surpriza.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas pakaĵo, kiun Raku kreas aŭtomate por enhavi ĉion, kion modulo markas per <code>is export<\/code>, kiel la subrutino <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Eksportita nomo do <em>ne<\/em> aperas rekte en la pakaĵo; ĝi loĝas ene de tiu sub-pakaĵo <code>EXPORT<\/code>. (La ŝlosiloj revenas en neniu fiksita ordo, do la ekzemplo ordigas ilin por stabila rezulto.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas serĉi nomon en la pakaĵo uzante ĝin kiel ŝlosilon.<\/span> <span class=\"sg\" data-s=\"1\">Tio atingas la saman valoron kiel la kvalifikita <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listigo de tio, kion modulo eksportas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La pakaĵo <code>EXPORT<\/code> vidita supre estas kie la eksportitaj nomoj efektive loĝas, do vi povas listigi ilin rigardante unu nivelon pli profunde.<\/span> <span class=\"sg\" data-s=\"1\">Eksportaĵoj sen etikedo iras en la grupon <code>DEFAULT<\/code> (vidu <a href=\"https://course.raku.org/eo/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Eksportaj etikedoj<\/a>), kaj ĝiaj <code>.keys<\/code> estas la eksportitaj rutinoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ŝlosilo estas eksportita nomo kun sia sigelo — ĉi tie la sola subrutino <code>&amp;hello<\/code>, montrita kun la <code>&amp;<\/code>, kiu markas rutinon.<\/span> <span class=\"sg\" data-s=\"1\">Tiel vi povas malkovri, kion modulo disponebligas al siaj uzantoj sen legi ĝian fontkodon: demandu al ĝia pakaĵo <code>EXPORT::DEFAULT<\/code>, kion ĝi enhavas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Introspekti pakaĵon tiamaniere estas oportuna, kiam vi volas malkovri, kion modulo provizas, aŭ atingi ĝiajn nomojn dinamike anstataŭ skribi ĉiun aparte en la fontkodo.<\/span><\/p>"]]},"la":{"t":"Introspectio modulorum","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomen moduli <em>fasciculum<\/em> introducit — spatium nominum quod nomina in eo definita continet.<\/span> <span class=\"sg\" data-s=\"1\">Antea, in <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de continentibus<\/a>, <code>WHO<\/code> cognovisti, quod <code>Stash<\/code> (tabulam symbolorum) fasciculi reddit.<\/span> <span class=\"sg\" data-s=\"2\">Introspectio moduli hoc in usum ponit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exempla infra modulum <code>Greeting<\/code> adhibent, qui in prioribus argumentis constructus est — subroutina exportata et variabilis communis <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fasciculus moduli cum <code>::<\/code> postposito scribitur.<\/span> <span class=\"sg\" data-s=\"1\">Addendo <code>.keys<\/code> nomina quae continet enumerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulus <code>Greeting<\/code> ex prioribus argumentis variabilem <code>our<\/code>, <code>$version<\/code>, definit, itaque fasciculus eius illud nomen continet — cum sigillo incluso.<\/span> <span class=\"sg\" data-s=\"1\">Iuxta id sedet <code>EXPORT<\/code>, quod mirum videri potest.<\/span> <span class=\"sg\" data-s=\"2\">Est fasciculus quem Raku automatice creat ad omnia quae modulus <code>is export<\/code> notat continenda, sicut subroutinam <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nomen exportatum igitur <em>non<\/em> directe in fasciculo apparet; intra illum sub-fasciculum <code>EXPORT<\/code> habitat. (Claves nullo ordine fixo redeunt, itaque exemplum eas ordinat ad stabile resultat obtinendum.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomen etiam in fasciculo quaerere potes eo ut clave utaris.<\/span> <span class=\"sg\" data-s=\"1\">Hoc eundem valorem attingit ac qualificatum <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enumeratio eorum quae modulus exportat<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fasciculus <code>EXPORT<\/code> supra visus est locus ubi nomina exportata re vera habitant, itaque ea enumerare potes unum gradum profundius inspiciendo.<\/span> <span class=\"sg\" data-s=\"1\">Exportata sine indice in gregem <code>DEFAULT<\/code> ineunt (vide <a href=\"/advanced/modules-basics/export-tags/\">Indices exportationis<\/a>), et eius <code>.keys<\/code> sunt subroutinae exportatae:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaeque clavis nomen exportatum cum sigillo suo est — hic unica subroutina <code>&amp;hello<\/code>, cum <code>&amp;<\/code> quod routinam designat ostensa.<\/span> <span class=\"sg\" data-s=\"1\">Hoc modo cognoscere potes quid modulus utentibus suis praebeat sine eius fonte legendo: eius fasciculum <code>EXPORT::DEFAULT<\/code> interroga quid contineat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fasciculum hoc modo introspicere utile est cum vis cognoscere quid modulus praebeat, vel eius nomina dynamice attingere potius quam unumquodque in fonte scribere.<\/span><\/p>"]]}}}</script>
