<script type="application/json" id="page-data">{"u":"advanced/operators-overview","n":533,"k":"section","pv":"advanced/operator-types/quiz3","nx":"advanced/operators-overview/exercises","tr":["advanced"],"L":{"en":{"t":"Review of operator behaviour","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When an expression contains several operators, Raku has to decide in what order to apply them.<\/span> <span class=\"sg\" data-s=\"1\">Two rules govern this: <em>precedence<\/em> and <em>associativity<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Precedence<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Precedence decides which operator binds more tightly.<\/span> <span class=\"sg\" data-s=\"1\">Multiplication has higher precedence than addition, so it happens first:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The expression is read as <code>2 + (3 * 4)<\/code>, giving <code>14<\/code> rather than <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can always use parentheses to force a different order:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Associativity<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Associativity decides the order between operators of the <em>same<\/em> precedence.<\/span> <span class=\"sg\" data-s=\"1\">Subtraction is left-associative, so it groups from the left:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is <code>(8 - 3) - 2<\/code>, which is <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exponentiation, on the other hand, is right-associative:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here the expression groups as <code>2 ** (3 ** 2)<\/code>, that is <code>2 ** 9<\/code>, which is <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Chained comparisons<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Comparison operators can be <em>chained<\/em>, which reads naturally and does what you expect from mathematics:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The middle value is compared with both neighbours: <code>1 &lt; 2 &lt; 3<\/code> is true because <code>1 &lt; 2<\/code> and <code>2 &lt; 3<\/code> are both true.<\/span><\/p>"]]},"de":{"t":"Überblick über Operatorverhalten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn ein Ausdruck mehrere Operatoren enthält, muss Raku entscheiden, in welcher Reihenfolge sie angewendet werden.<\/span> <span class=\"sg\" data-s=\"1\">Zwei Regeln bestimmen dies: <em>Vorrang<\/em> und <em>Assoziativität<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vorrang<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Vorrang entscheidet, welcher Operator stärker bindet.<\/span> <span class=\"sg\" data-s=\"1\">Die Multiplikation hat einen höheren Vorrang als die Addition, daher wird sie zuerst ausgeführt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Ausdruck wird als <code>2 + (3 * 4)<\/code> gelesen, was <code>14<\/code> ergibt und nicht <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie können immer Klammern verwenden, um eine andere Reihenfolge zu erzwingen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Assoziativität<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Assoziativität bestimmt die Reihenfolge zwischen Operatoren mit <em>gleichem<\/em> Vorrang.<\/span> <span class=\"sg\" data-s=\"1\">Die Subtraktion ist linksassoziativ, sie gruppiert also von links:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist <code>(8 - 3) - 2<\/code>, also <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die Potenzierung hingegen ist rechtsassoziativ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier gruppiert sich der Ausdruck als <code>2 ** (3 ** 2)<\/code>, also <code>2 ** 9<\/code>, was <code>512<\/code> ergibt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Verkettete Vergleiche<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergleichsoperatoren können <em>verkettet<\/em> werden, was sich natürlich liest und das erwartete mathematische Ergebnis liefert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der mittlere Wert wird mit beiden Nachbarn verglichen: <code>1 &lt; 2 &lt; 3<\/code> ist wahr, weil sowohl <code>1 &lt; 2<\/code> als auch <code>2 &lt; 3<\/code> wahr sind.<\/span><\/p>"]]},"nl":{"t":"Overzicht van operatorgedrag","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer een expressie meerdere operatoren bevat, moet Raku beslissen in welke volgorde ze worden toegepast.<\/span> <span class=\"sg\" data-s=\"1\">Twee regels bepalen dit: <em>voorrang<\/em> en <em>associativiteit<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorrang<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voorrang bepaalt welke operator sterker bindt.<\/span> <span class=\"sg\" data-s=\"1\">Vermenigvuldiging heeft een hogere voorrang dan optelling, dus wordt deze eerst uitgevoerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De expressie wordt gelezen als <code>2 + (3 * 4)<\/code>, wat <code>14<\/code> oplevert in plaats van <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt altijd haakjes gebruiken om een andere volgorde af te dwingen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Associativiteit<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Associativiteit bepaalt de volgorde tussen operatoren met <em>dezelfde<\/em> voorrang.<\/span> <span class=\"sg\" data-s=\"1\">Aftrekking is links-associatief, dus wordt er van links naar rechts gegroepeerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is <code>(8 - 3) - 2<\/code>, wat <code>3<\/code> oplevert.<\/span> <span class=\"sg\" data-s=\"1\">Machtsverheffing daarentegen is rechts-associatief:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier wordt de expressie gegroepeerd als <code>2 ** (3 ** 2)<\/code>, dat wil zeggen <code>2 ** 9<\/code>, wat <code>512<\/code> is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Geschakelde vergelijkingen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergelijkingsoperatoren kunnen <em>geschakeld<\/em> worden, wat natuurlijk leest en doet wat je verwacht vanuit de wiskunde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De middelste waarde wordt met beide buren vergeleken: <code>1 &lt; 2 &lt; 3<\/code> is waar omdat <code>1 &lt; 2<\/code> en <code>2 &lt; 3<\/code> beide waar zijn.<\/span><\/p>"]]},"es":{"t":"Repaso del comportamiento de operadores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando una expresión contiene varios operadores, Raku tiene que decidir en qué orden aplicarlos.<\/span> <span class=\"sg\" data-s=\"1\">Dos reglas gobiernan esto: la <em>precedencia<\/em> y la <em>asociatividad<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Precedencia<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La precedencia decide qué operador se vincula con más fuerza.<\/span> <span class=\"sg\" data-s=\"1\">La multiplicación tiene mayor precedencia que la suma, por lo que se ejecuta primero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La expresión se lee como <code>2 + (3 * 4)<\/code>, dando <code>14<\/code> en lugar de <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Siempre puedes usar paréntesis para forzar un orden diferente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asociatividad<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La asociatividad decide el orden entre operadores de la <em>misma<\/em> precedencia.<\/span> <span class=\"sg\" data-s=\"1\">La resta es asociativa por la izquierda, así que se agrupa desde la izquierda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es <code>(8 - 3) - 2<\/code>, que es <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La exponenciación, por otro lado, es asociativa por la derecha:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí la expresión se agrupa como <code>2 ** (3 ** 2)<\/code>, es decir <code>2 ** 9<\/code>, que es <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparaciones encadenadas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los operadores de comparación pueden <em>encadenarse<\/em>, lo que se lee de forma natural y hace lo que esperas desde las matemáticas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El valor del medio se compara con ambos vecinos: <code>1 &lt; 2 &lt; 3<\/code> es verdadero porque tanto <code>1 &lt; 2<\/code> como <code>2 &lt; 3<\/code> son verdaderos.<\/span><\/p>"]]},"it":{"t":"Panoramica del comportamento degli operatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando un'espressione contiene diversi operatori, Raku deve decidere in quale ordine applicarli.<\/span> <span class=\"sg\" data-s=\"1\">Due regole governano questo processo: la <em>precedenza<\/em> e l'<em>associatività<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Precedenza<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La precedenza decide quale operatore ha un legame più stretto.<\/span> <span class=\"sg\" data-s=\"1\">La moltiplicazione ha una precedenza più alta dell'addizione, quindi viene eseguita per prima:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'espressione viene letta come <code>2 + (3 * 4)<\/code>, dando <code>14<\/code> anziché <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi sempre usare le parentesi per forzare un ordine diverso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Associatività<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'associatività decide l'ordine tra operatori con la <em>stessa<\/em> precedenza.<\/span> <span class=\"sg\" data-s=\"1\">La sottrazione è associativa a sinistra, quindi viene raggruppata da sinistra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo equivale a <code>(8 - 3) - 2<\/code>, che è <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'elevamento a potenza, invece, è associativo a destra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui l'espressione viene raggruppata come <code>2 ** (3 ** 2)<\/code>, cioè <code>2 ** 9<\/code>, che è <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Confronti concatenati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli operatori di confronto possono essere <em>concatenati<\/em>, il che si legge in modo naturale e fa quello che ci si aspetta dalla matematica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il valore centrale viene confrontato con entrambi i vicini: <code>1 &lt; 2 &lt; 3<\/code> è vero perché <code>1 &lt; 2<\/code> e <code>2 &lt; 3<\/code> sono entrambi veri.<\/span><\/p>"]]},"lv":{"t":"Operatoru uzvedības pārskats","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad izteiksmē ir vairāki operatori, Raku ir jāizlemj, kādā secībā tos piemērot.<\/span> <span class=\"sg\" data-s=\"1\">To nosaka divi noteikumi: <em>prioritāte<\/em> un <em>asociativitāte<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Prioritāte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prioritāte nosaka, kurš operators saistās ciešāk.<\/span> <span class=\"sg\" data-s=\"1\">Reizināšanai ir augstāka prioritāte nekā saskaitīšanai, tāpēc tā tiek izpildīta pirmā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izteiksme tiek lasīta kā <code>2 + (3 * 4)<\/code>, kas dod <code>14<\/code>, nevis <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs vienmēr varat izmantot iekavas, lai noteiktu citu secību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asociativitāte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Asociativitāte nosaka secību starp operatoriem ar <em>vienādu<\/em> prioritāti.<\/span> <span class=\"sg\" data-s=\"1\">Atņemšana ir kreisi asociatīva, tāpēc tā grupējas no kreisās puses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir <code>(8 - 3) - 2<\/code>, kas ir <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kāpināšana, savukārt, ir labēji asociatīva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit izteiksme grupējas kā <code>2 ** (3 ** 2)<\/code>, tas ir <code>2 ** 9<\/code>, kas ir <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ķēdētas salīdzināšanas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Salīdzināšanas operatorus var <em>ķēdēt<\/em>, kas lasās dabiski un darbojas tā, kā sagaidāms no matemātikas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vidējā vērtība tiek salīdzināta ar abiem kaimiņiem: <code>1 &lt; 2 &lt; 3<\/code> ir patiess, jo gan <code>1 &lt; 2<\/code>, gan <code>2 &lt; 3<\/code> ir patiesi.<\/span><\/p>"]]},"ru":{"t":"Обзор поведения операторов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда выражение содержит несколько операторов, Raku должен решить, в каком порядке их применять.<\/span> <span class=\"sg\" data-s=\"1\">Два правила определяют это: <em>приоритет<\/em> и <em>ассоциативность<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приоритет<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приоритет определяет, какой оператор связывается теснее.<\/span> <span class=\"sg\" data-s=\"1\">Умножение имеет более высокий приоритет, чем сложение, поэтому выполняется первым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Выражение читается как <code>2 + (3 * 4)<\/code>, давая <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы всегда можете использовать скобки, чтобы задать другой порядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ассоциативность<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ассоциативность определяет порядок между операторами с <em>одинаковым<\/em> приоритетом.<\/span> <span class=\"sg\" data-s=\"1\">Вычитание является левоассоциативным, поэтому группируется слева:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это <code>(8 - 3) - 2<\/code>, что равно <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Возведение в степень, напротив, является правоассоциативным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь выражение группируется как <code>2 ** (3 ** 2)<\/code>, то есть <code>2 ** 9<\/code>, что равно <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цепочки сравнений<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторы сравнения можно <em>объединять в цепочки<\/em>, что читается естественно и работает так, как вы ожидаете из математики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Среднее значение сравнивается с обоими соседями: <code>1 &lt; 2 &lt; 3<\/code> истинно, потому что <code>1 &lt; 2<\/code> и <code>2 &lt; 3<\/code> оба истинны.<\/span><\/p>"]]},"uk":{"t":"Огляд поведінки операторів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли вираз містить кілька операторів, Raku має вирішити, в якому порядку їх застосовувати.<\/span> <span class=\"sg\" data-s=\"1\">Цим керують два правила: <em>пріоритет<\/em> і <em>асоціативність<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пріоритет<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пріоритет визначає, який оператор зв'язується міцніше.<\/span> <span class=\"sg\" data-s=\"1\">Множення має вищий пріоритет за додавання, тож воно відбувається першим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вираз читається як <code>2 + (3 * 4)<\/code>, даючи <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви завжди можете скористатися дужками, щоб нав'язати інший порядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Асоціативність<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Асоціативність визначає порядок між операторами <em>однакового<\/em> пріоритету.<\/span> <span class=\"sg\" data-s=\"1\">Віднімання є лівоасоціативним, тож воно групується зліва:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це <code>(8 - 3) - 2<\/code>, тобто <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Піднесення до степеня, навпаки, є правоасоціативним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут вираз групується як <code>2 ** (3 ** 2)<\/code>, тобто <code>2 ** 9<\/code>, що дорівнює <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ланцюжки порівнянь<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператори порівняння можна об'єднувати в <em>ланцюжки<\/em>, що читається природно й робить те, чого ви очікуєте з математики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Середнє значення порівнюється з обома сусідами: <code>1 &lt; 2 &lt; 3<\/code> істинне, бо істинні і <code>1 &lt; 2<\/code>, і <code>2 &lt; 3<\/code>.<\/span><\/p>"]]},"bg":{"t":"Преглед на поведението на операторите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато един израз съдържа няколко оператора, Raku трябва да реши в какъв ред да ги приложи.<\/span> <span class=\"sg\" data-s=\"1\">Две правила управляват това: <em>приоритет<\/em> и <em>асоциативност<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приоритет<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приоритетът определя кой оператор свързва по-силно.<\/span> <span class=\"sg\" data-s=\"1\">Умножението има по-висок приоритет от събирането, затова се изпълнява първо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изразът се чете като <code>2 + (3 * 4)<\/code>, което дава <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Винаги можете да използвате скоби, за да наложите различен ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Асоциативност<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Асоциативността определя реда между оператори с <em>еднакъв<\/em> приоритет.<\/span> <span class=\"sg\" data-s=\"1\">Изваждането е ляво-асоциативно, затова се групира отляво:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е <code>(8 - 3) - 2<\/code>, което е <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Степенуването, от друга страна, е дясно-асоциативно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук изразът се групира като <code>2 ** (3 ** 2)<\/code>, тоест <code>2 ** 9<\/code>, което е <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Верижни сравнения<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторите за сравнение могат да бъдат <em>верижни<\/em>, което се чете естествено и прави точно това, което бихте очаквали от математиката:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Средната стойност се сравнява с двата си съседа: <code>1 &lt; 2 &lt; 3<\/code> е вярно, защото и <code>1 &lt; 2<\/code>, и <code>2 &lt; 3<\/code> са верни.<\/span><\/p>"]]},"la":{"t":"Conspectus operatorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum expressio plures operatores continet, Raku decidere debet quo ordine eos applicet.<\/span> <span class=\"sg\" data-s=\"1\">Duae regulae hoc regunt: <em>praecedentia<\/em> et <em>associativitas<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Praecedentia<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praecedentia decernit quis operator arctius ligat.<\/span> <span class=\"sg\" data-s=\"1\">Multiplicatio altiorem praecedentiam quam additio habet, ergo primum fit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Expressio legitur ut <code>2 + (3 * 4)<\/code>, dans <code>14<\/code> potius quam <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Semper parenthesibus uti potes ut alium ordinem imperes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Associativitas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Associativitas ordinem inter operatores <em>eiusdem<\/em> praecedentiae decernit.<\/span> <span class=\"sg\" data-s=\"1\">Subtractio sinistro-associativa est, ergo a sinistra congregat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc est <code>(8 - 3) - 2<\/code>, quod est <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Elevatio ad potestatem autem dextro-associativa est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic expressio congregat ut <code>2 ** (3 ** 2)<\/code>, id est <code>2 ** 9<\/code>, quod est <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparationes catenatae<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operatores comparationis <em>catenari<\/em> possunt, quod naturaliter legitur et id quod ex mathematica exspectas facit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valor medius cum ambobus vicinis comparatur: <code>1 &lt; 2 &lt; 3<\/code> verum est quia <code>1 &lt; 2<\/code> et <code>2 &lt; 3<\/code> ambo vera sunt.<\/span><\/p>"]]}}}</script>
