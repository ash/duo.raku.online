<script type="application/json" id="page-data">{"u":"advanced/operators-overview/exercises/chained-comparison/solution","n":540,"k":"solution","pv":"advanced/operators-overview/exercises/chained-comparison","nx":"advanced/operators-overview/quiz","tr":["advanced","advanced/operators-overview"],"L":{"en":{"t":"The solution of ’Chained comparison‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Comparison operators can be chained, so <code>0 &lt;= 73 &lt;= 100<\/code> reads as “0 is at most 73, and 73 is at most 100”. The <code>&lt;=<\/code> operator allows the endpoints, so a score of exactly <code>0<\/code> or <code>100<\/code> would also count as valid.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both parts are true, so the whole expression is <code>True<\/code>. Note that the middle value <code>73<\/code> is written only once, even though it is compared with both neighbours.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Without the chaining feature, you would have to spell out both comparisons and join them with <code>&amp;&amp;<\/code>, repeating the middle value: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. The chained form says the same thing more concisely.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Verketteter Vergleich","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vergleichsoperatoren können verkettet werden, sodass <code>0 &lt;= 73 &lt;= 100<\/code> gelesen wird als „0 ist höchstens 73, und 73 ist höchstens 100\". Der Operator <code>&lt;=<\/code> erlaubt die Endpunkte, sodass ein Ergebnis von genau <code>0<\/code> oder <code>100<\/code> ebenfalls als gültig zählt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Teile sind wahr, daher ist der gesamte Ausdruck <code>True<\/code>. Beachten Sie, dass der mittlere Wert <code>73<\/code> nur einmal geschrieben wird, obwohl er mit beiden Nachbarn verglichen wird.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ohne die Verkettungsfunktion müssten Sie beide Vergleiche ausschreiben und mit <code>&amp;&amp;<\/code> verbinden, wobei der mittlere Wert wiederholt wird: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Die verkettete Form drückt dasselbe kürzer aus.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Gekoppelde vergelijking","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vergelijkingsoperatoren kunnen geschakeld worden, dus <code>0 &lt;= 73 &lt;= 100<\/code> leest als \"0 is hoogstens 73, en 73 is hoogstens 100\". De operator <code>&lt;=<\/code> staat de eindpunten toe, dus een score van precies <code>0<\/code> of <code>100<\/code> zou ook als geldig tellen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide delen zijn waar, dus de hele expressie is <code>True<\/code>. Merk op dat de middelste waarde <code>73<\/code> slechts een keer wordt geschreven, ook al wordt deze met beide buren vergeleken.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Zonder de schakelingsmogelijkheid zou je beide vergelijkingen moeten uitschrijven en ze met <code>&amp;&amp;<\/code> moeten verbinden, waarbij de middelste waarde herhaald wordt: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. De geschakelde vorm zegt hetzelfde op een beknoptere manier.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Comparación encadenada","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los operadores de comparación pueden encadenarse, así que <code>0 &lt;= 73 &lt;= 100<\/code> se lee como \"0 es como máximo 73, y 73 es como máximo 100\". El operador <code>&lt;=<\/code> permite los extremos, por lo que una puntuación de exactamente <code>0<\/code> o <code>100<\/code> también se consideraría válida.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambas partes son verdaderas, así que la expresión completa es <code>True<\/code>. Observa que el valor del medio <code>73<\/code> se escribe una sola vez, aunque se compara con ambos vecinos.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sin la funcionalidad de encadenamiento, tendrías que escribir ambas comparaciones y unirlas con <code>&amp;&amp;<\/code>, repitiendo el valor del medio: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. La forma encadenada dice lo mismo de manera más concisa.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Confronto concatenato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gli operatori di confronto possono essere concatenati, quindi <code>0 &lt;= 73 &lt;= 100<\/code> si legge come \"0 è al massimo 73, e 73 è al massimo 100\". L'operatore <code>&lt;=<\/code> include gli estremi, quindi un punteggio esattamente di <code>0<\/code> o <code>100<\/code> sarebbe anch'esso considerato valido.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Entrambe le parti sono vere, quindi l'intera espressione è <code>True<\/code>. Nota che il valore centrale <code>73<\/code> viene scritto una sola volta, anche se viene confrontato con entrambi i vicini.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Senza la funzionalità di concatenazione, bisognerebbe scrivere entrambi i confronti e unirli con <code>&amp;&amp;<\/code>, ripetendo il valore centrale: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. La forma concatenata esprime lo stesso concetto in modo più conciso.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Ķēdēts salīdzinājums","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējamais uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Salīdzināšanas operatorus var ķēdēt, tāpēc <code>0 &lt;= 73 &lt;= 100<\/code> lasās kā \"0 ir ne lielāks par 73, un 73 ir ne lielāks par 100\". Operators <code>&lt;=<\/code> iekļauj galapunktus, tāpēc arī tieši <code>0<\/code> vai <code>100<\/code> tiktu uzskatīts par derīgu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abas daļas ir patiesas, tāpēc visa izteiksme ir <code>True<\/code>. Ievērojiet, ka vidējā vērtība <code>73<\/code> ir rakstīta tikai vienu reizi, kaut arī tā tiek salīdzināta ar abiem kaimiņiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Bez ķēdēšanas iespējas jums būtu jāuzraksta abas salīdzināšanas un jāsavieno ar <code>&amp;&amp;<\/code>, atkārtojot vidējo vērtību: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Ķēdētā forma izsaka to pašu kodolīgāk.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Цепочечное сравнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Операторы сравнения можно объединять в цепочки, поэтому <code>0 &lt;= 73 &lt;= 100<\/code> читается как «0 не больше 73, а 73 не больше 100». Оператор <code>&lt;=<\/code> допускает граничные значения, так что результат ровно <code>0<\/code> или <code>100<\/code> тоже считается допустимым.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обе части истинны, поэтому всё выражение равно <code>True<\/code>. Обратите внимание, что среднее значение <code>73<\/code> записано только один раз, хотя сравнивается с обоими соседями.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без возможности объединения в цепочки пришлось бы записывать оба сравнения отдельно и соединять их с помощью <code>&amp;&amp;<\/code>, повторяя среднее значение: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Цепочечная форма выражает то же самое более кратко.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Ланцюжок порівнянь","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оператори порівняння можна об'єднувати в ланцюжки, тож <code>0 &lt;= 73 &lt;= 100<\/code> читається як «0 не більше за 73, і 73 не більше за 100». Оператор <code>&lt;=<\/code> дозволяє краї, тож бал рівно <code>0<\/code> чи <code>100<\/code> теж вважався б дійсним.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидві частини істинні, тож увесь вираз дає <code>True<\/code>. Зверніть увагу, що середнє значення <code>73<\/code> записано лише раз, хоча його порівнюють з обома сусідами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без можливості будувати ланцюжки довелося б виписати обидва порівняння й з'єднати їх через <code>&amp;&amp;<\/code>, повторивши середнє значення: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Ланцюжкова форма каже те саме стисліше.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Верижно сравнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Операторите за сравнение могат да бъдат верижни, затова <code>0 &lt;= 73 &lt;= 100<\/code> се чете като „0 е най-много 73, и 73 е най-много 100\". Операторът <code>&lt;=<\/code> позволява крайните стойности, така че резултат от точно <code>0<\/code> или <code>100<\/code> също би бил валиден.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двете части са верни, затова целият израз е <code>True<\/code>. Забележете, че средната стойност <code>73<\/code> е записана само веднъж, въпреки че се сравнява с двата си съседа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без верижното свойство би трябвало да запишете двете сравнения поотделно и да ги свържете с <code>&amp;&amp;<\/code>, повтаряйки средната стойност: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Верижната форма изразява същото по-кратко.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Comparatio catenata","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Operatores comparationis catenari possunt, ergo <code>0 &lt;= 73 &lt;= 100<\/code> legitur ut \"0 est ad summum 73, et 73 est ad summum 100\". Operator <code>&lt;=<\/code> fines permittit, ergo punctum exacte <code>0<\/code> vel <code>100<\/code> quoque validum esset.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambae partes verae sunt, ergo tota expressio <code>True<\/code> est. Nota valorem medium <code>73<\/code> semel tantum scribi, etsi cum ambobus vicinis comparatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sine proprietate catenationis, ambas comparationes explicite scribere et cum <code>&amp;&amp;<\/code> coniungere deberes, valorem medium repetens: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Forma catenata idem brevius dicit.<\/span><\/li><\/ol>"]]}}}</script>
