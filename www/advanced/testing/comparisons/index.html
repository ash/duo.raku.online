<script type="application/json" id="page-data">{"u":"advanced/testing/comparisons","n":746,"k":"topic","pv":"advanced/testing/test-module/quiz","nx":"advanced/testing/running-tests","tr":["advanced","advanced/testing"],"L":{"en":{"t":"Comparisons and plans","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Beyond <code>ok<\/code> and <code>is<\/code>, the <code>Test<\/code> module has comparisons for different kinds of value.<\/span> <span class=\"sg\" data-s=\"1\">The most useful are:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — compares two values for equality (as strings/numbers)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — compares two data structures for exact, type-aware equality<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — checks that a string matches a regex<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — passes when two values are <strong>not<\/strong> equal<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> is the right choice for arrays, hashes, and nested data, because it compares structure and type precisely:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Where <code>is<\/code> would stringify and compare loosely, <code>is-deeply<\/code> insists the structures truly match.<\/span> <span class=\"sg\" data-s=\"1\">Note that <code>done-testing<\/code> puts the plan <code>1..1<\/code> at the end, after the check.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Instead of letting <code>done-testing<\/code> count the tests for you, you can state the number up front with <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This guards against a test file that exits early and silently skips checks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This time the plan comes <strong>first<\/strong>, ahead of the results:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">That is the visible difference from <code>done-testing<\/code>: <code>plan<\/code> prints the count <code>1..2<\/code> at the top, before any checks run, whereas <code>done-testing<\/code> prints it at the very end.<\/span> <span class=\"sg\" data-s=\"1\">Either way, with <code>plan 2<\/code> the run expects exactly two tests; if fewer (or more) actually run, the suite is reported as failing.<\/span> <span class=\"sg\" data-s=\"2\">Use <code>plan<\/code> when the count is fixed and known, and <code>done-testing<\/code> when it is easier to let the framework count.<\/span><\/p>"]]},"de":{"t":"Vergleiche und Pläne","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Über <code>ok<\/code> und <code>is<\/code> hinaus bietet das <code>Test<\/code>-Modul Vergleiche für verschiedene Arten von Werten.<\/span> <span class=\"sg\" data-s=\"1\">Die nützlichsten sind:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — vergleicht zwei Werte auf Gleichheit (als Strings/Zahlen)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — vergleicht zwei Datenstrukturen auf exakte, typbewusste Gleichheit<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — prüft, ob ein String zu einer Regex passt<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — wird bestanden, wenn zwei Werte <strong>nicht<\/strong> gleich sind<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> ist die richtige Wahl für Arrays, Hashes und verschachtelte Daten, weil es Struktur und Typ genau vergleicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies gibt aus:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Während <code>is<\/code> die Werte in Strings umwandeln und lose vergleichen würde, besteht <code>is-deeply<\/code> darauf, dass die Strukturen wirklich übereinstimmen.<\/span> <span class=\"sg\" data-s=\"1\">Beachte, dass <code>done-testing<\/code> den Plan <code>1..1<\/code> am Ende ausgibt, nach der Prüfung.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anstatt <code>done-testing<\/code> die Tests für dich zählen zu lassen, kannst du die Anzahl mit <code>plan<\/code> im Voraus angeben.<\/span> <span class=\"sg\" data-s=\"1\">Dies schützt vor einer Testdatei, die vorzeitig beendet wird und stillschweigend Prüfungen überspringt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diesmal kommt der Plan <strong>zuerst<\/strong>, vor den Ergebnissen:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das ist der sichtbare Unterschied zu <code>done-testing<\/code>: <code>plan<\/code> gibt die Anzahl <code>1..2<\/code> oben aus, bevor irgendeine Prüfung läuft, während <code>done-testing<\/code> sie ganz am Ende ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">In jedem Fall erwartet <code>plan 2<\/code> genau zwei Tests; wenn tatsächlich weniger (oder mehr) ausgeführt werden, wird die Suite als fehlgeschlagen gemeldet.<\/span> <span class=\"sg\" data-s=\"2\">Verwende <code>plan<\/code>, wenn die Anzahl fest und bekannt ist, und <code>done-testing<\/code>, wenn es einfacher ist, das Framework zählen zu lassen.<\/span><\/p>"]]},"nl":{"t":"Vergelijkingen en plannen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast <code>ok<\/code> en <code>is<\/code> heeft de <code>Test<\/code>-module vergelijkingen voor verschillende soorten waarden.<\/span> <span class=\"sg\" data-s=\"1\">De meest bruikbare zijn:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — vergelijkt twee waarden op gelijkheid (als strings/getallen)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — vergelijkt twee datastructuren op exacte, typebewuste gelijkheid<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — controleert of een string overeenkomt met een regex<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — slaagt wanneer twee waarden <strong>niet<\/strong> gelijk zijn<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> is de juiste keuze voor arrays, hashes en geneste data, omdat het structuur en type nauwkeurig vergelijkt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit geeft:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Waar <code>is<\/code> zou omzetten naar strings en losjes zou vergelijken, eist <code>is-deeply<\/code> dat de structuren werkelijk overeenkomen.<\/span> <span class=\"sg\" data-s=\"1\">Merk op dat <code>done-testing<\/code> het plan <code>1..1<\/code> aan het einde plaatst, na de controle.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In plaats van <code>done-testing<\/code> de tests voor je te laten tellen, kun je het aantal vooraf opgeven met <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit beschermt tegen een testbestand dat vroegtijdig afsluit en stilletjes controles overslaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit keer komt het plan <strong>eerst<\/strong>, voor de resultaten:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dat is het zichtbare verschil met <code>done-testing<\/code>: <code>plan<\/code> toont het aantal <code>1..2<\/code> bovenaan, voordat er controles worden uitgevoerd, terwijl <code>done-testing<\/code> het helemaal aan het einde toont.<\/span> <span class=\"sg\" data-s=\"1\">Hoe dan ook, met <code>plan 2<\/code> verwacht de uitvoering precies twee tests; als er minder (of meer) daadwerkelijk worden uitgevoerd, wordt de suite als mislukt gerapporteerd.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik <code>plan<\/code> wanneer het aantal vaststaat en bekend is, en <code>done-testing<\/code> wanneer het makkelijker is om het framework te laten tellen.<\/span><\/p>"]]},"es":{"t":"Comparaciones y planes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de <code>ok<\/code> e <code>is<\/code>, el módulo <code>Test<\/code> tiene comparaciones para diferentes tipos de valores.<\/span> <span class=\"sg\" data-s=\"1\">Las más útiles son:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — compara dos valores para verificar igualdad (como cadenas/números)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — compara dos estructuras de datos para verificar igualdad exacta con reconocimiento de tipos<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — comprueba que una cadena coincide con una expresión regular<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — pasa cuando dos valores <strong>no<\/strong> son iguales<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> es la opción correcta para arreglos, hashes y datos anidados, porque compara la estructura y el tipo con precisión:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Donde <code>is<\/code> convertiría a cadena y compararía de forma flexible, <code>is-deeply<\/code> exige que las estructuras realmente coincidan.<\/span> <span class=\"sg\" data-s=\"1\">Observa que <code>done-testing<\/code> coloca el plan <code>1..1<\/code> al final, después de la comprobación.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En lugar de dejar que <code>done-testing<\/code> cuente las pruebas por ti, puedes indicar el número de antemano con <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto protege contra un archivo de pruebas que termina antes de tiempo y omite comprobaciones en silencio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta vez el plan aparece <strong>primero<\/strong>, antes de los resultados:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esa es la diferencia visible con <code>done-testing<\/code>: <code>plan<\/code> imprime el conteo <code>1..2<\/code> al principio, antes de que se ejecute cualquier comprobación, mientras que <code>done-testing<\/code> lo imprime al final.<\/span> <span class=\"sg\" data-s=\"1\">En cualquier caso, con <code>plan 2<\/code> la ejecución espera exactamente dos pruebas; si se ejecutan menos (o más), el conjunto se reporta como fallido.<\/span> <span class=\"sg\" data-s=\"2\">Usa <code>plan<\/code> cuando el conteo es fijo y conocido, y <code>done-testing<\/code> cuando es más fácil dejar que el marco lo cuente.<\/span><\/p>"]]},"it":{"t":"Confronti e piani","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre a <code>ok<\/code> e <code>is<\/code>, il modulo <code>Test<\/code> dispone di confronti per diversi tipi di valore.<\/span> <span class=\"sg\" data-s=\"1\">I più utili sono:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — confronta due valori per uguaglianza (come stringhe/numeri)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — confronta due strutture dati per uguaglianza esatta e consapevole dei tipi<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — verifica che una stringa corrisponda a un'espressione regolare<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — ha successo quando due valori <strong>non<\/strong> sono uguali<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> è la scelta giusta per array, hash e dati annidati, perché confronta struttura e tipo in modo preciso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dove <code>is<\/code> convertirebbe in stringa e confronterebbe in modo approssimativo, <code>is-deeply<\/code> esige che le strutture corrispondano davvero.<\/span> <span class=\"sg\" data-s=\"1\">Nota che <code>done-testing<\/code> pone il piano <code>1..1<\/code> alla fine, dopo il controllo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Invece di lasciare che <code>done-testing<\/code> conti i test per te, puoi dichiarare il numero in anticipo con <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo protegge da un file di test che termina prematuramente e salta silenziosamente dei controlli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa volta il piano viene <strong>prima<\/strong>, davanti ai risultati:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa è la differenza visibile rispetto a <code>done-testing<\/code>: <code>plan<\/code> stampa il conteggio <code>1..2<\/code> in cima, prima che qualsiasi controllo venga eseguito, mentre <code>done-testing<\/code> lo stampa alla fine.<\/span> <span class=\"sg\" data-s=\"1\">In ogni caso, con <code>plan 2<\/code> l'esecuzione si aspetta esattamente due test; se ne vengono eseguiti di meno (o di più), la suite viene segnalata come fallita.<\/span> <span class=\"sg\" data-s=\"2\">Usa <code>plan<\/code> quando il conteggio è fisso e noto, e <code>done-testing<\/code> quando è più facile lasciare che il framework conti.<\/span><\/p>"]]},"lv":{"t":"Salīdzinājumi un plāni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez <code>ok<\/code> un <code>is<\/code> modulim <code>Test<\/code> ir salīdzinājumi dažādiem vērtību veidiem.<\/span> <span class=\"sg\" data-s=\"1\">Noderīgākie ir:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — salīdzina divas vērtības uz vienlīdzību (kā virknes/skaitļus)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — salīdzina divas datu struktūras uz precīzu, tipu ievērojošu vienlīdzību<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — pārbauda, vai virkne atbilst regulārajai izteiksmei<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — izdodas, kad divas vērtības <strong>nav<\/strong> vienādas<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> ir pareizā izvēle masīviem, jaukteņiem un ligzdotiem datiem, jo tas precīzi salīdzina struktūru un tipu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kamēr <code>is<\/code> pārvērstu virknēs un salīdzinātu brīvi, <code>is-deeply<\/code> prasa, lai struktūras patiešām sakristu.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka <code>done-testing<\/code> plānu <code>1..1<\/code> liek beigās, pēc pārbaudes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā vietā, lai ļautu <code>done-testing<\/code> testus saskaitīt jūsu vietā, skaitu var pateikt jau iepriekš ar <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas pasargā no testu faila, kas beidzas priekšlaikus un klusi izlaiž pārbaudes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šoreiz plāns nāk <strong>pirmais<\/strong>, pirms rezultātiem:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tieši ar to tas redzami atšķiras no <code>done-testing<\/code>: <code>plan<\/code> izdrukā skaitu <code>1..2<\/code> augšā, pirms izpildās kaut viena pārbaude, turpretī <code>done-testing<\/code> to izdrukā pašās beigās.<\/span> <span class=\"sg\" data-s=\"1\">Jebkurā gadījumā ar <code>plan 2<\/code> izpilde gaida tieši divus testus; ja patiesībā izpildās mazāk (vai vairāk), kopa tiek ziņota kā neizdevusies.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet <code>plan<\/code>, kad skaits ir noteikts un zināms, un <code>done-testing<\/code>, kad ērtāk ļaut ietvaram skaitīt pašam.<\/span><\/p>"]]},"ru":{"t":"Сравнения и планы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Помимо <code>ok<\/code> и <code>is<\/code>, модуль <code>Test<\/code> содержит функции сравнения для различных типов значений.<\/span> <span class=\"sg\" data-s=\"1\">Наиболее полезные из них:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> --- сравнивает два значения на равенство (как строки/числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> --- сравнивает две структуры данных на точное, типизированное равенство<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> --- проверяет, что строка соответствует регулярному выражению<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> --- проходит, когда два значения <strong>не<\/strong> равны<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> --- правильный выбор для массивов, хэшей и вложенных данных, потому что он точно сравнивает структуру и типы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вывод:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Там, где <code>is<\/code> привёл бы значения к строкам и сравнил бы нестрого, <code>is-deeply<\/code> настаивает на точном совпадении структур.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что <code>done-testing<\/code> помещает план <code>1..1<\/code> в конец, после проверки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вместо того чтобы позволять <code>done-testing<\/code> подсчитывать тесты за вас, можно указать их количество заранее с помощью <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это защищает от ситуации, когда тестовый файл завершается раньше времени и молча пропускает проверки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На этот раз план стоит <strong>первым<\/strong>, перед результатами:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом видимое отличие от <code>done-testing<\/code>: <code>plan<\/code> выводит количество <code>1..2<\/code> в начале, до выполнения проверок, тогда как <code>done-testing<\/code> выводит его в самом конце.<\/span> <span class=\"sg\" data-s=\"1\">В обоих случаях при <code>plan 2<\/code> ожидается ровно два теста; если выполнится меньше (или больше), набор тестов будет считаться неудачным.<\/span> <span class=\"sg\" data-s=\"2\">Используйте <code>plan<\/code>, когда количество фиксировано и известно, а <code>done-testing<\/code> --- когда проще позволить фреймворку подсчитать.<\/span><\/p>"]]},"uk":{"t":"Порівняння та плани","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім <code>ok<\/code> та <code>is<\/code>, модуль <code>Test<\/code> має порівняння для різних видів значень.<\/span> <span class=\"sg\" data-s=\"1\">Найкорисніші такі:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — порівнює два значення на рівність (як рядки чи числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — порівнює дві структури даних на точну рівність з урахуванням типів<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — перевіряє, що рядок збігається з регулярним виразом<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — проходить, коли два значення <strong>не<\/strong> рівні<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> є правильним вибором для масивів, хешів і вкладених даних, бо він точно порівнює структуру й тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це виводить:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Там, де <code>is<\/code> перетворив би на рядки й порівняв нестрого, <code>is-deeply<\/code> наполягає, щоб структури справді збігалися.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що <code>done-testing<\/code> ставить план <code>1..1<\/code> наприкінці, після перевірки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Замість того щоб дозволити <code>done-testing<\/code> порахувати тести за вас, ви можете заздалегідь оголосити їхню кількість через <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це захищає від файлу тестів, який завершується передчасно й мовчки пропускає перевірки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цього разу план іде <strong>першим<\/strong>, попереду результатів:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це і є видима відмінність від <code>done-testing<\/code>: <code>plan<\/code> виводить кількість <code>1..2<\/code> угорі, ще до виконання будь-яких перевірок, тоді як <code>done-testing<\/code> виводить її в самому кінці.<\/span> <span class=\"sg\" data-s=\"1\">Так чи так, із <code>plan 2<\/code> запуск очікує рівно двох тестів; якщо їх насправді виконається менше (або більше), набір буде визнано невдалим.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте <code>plan<\/code>, коли кількість стала й відома, і <code>done-testing<\/code>, коли простіше дозволити фреймворку порахувати.<\/span><\/p>"]]},"bg":{"t":"Сравнения и планове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен <code>ok<\/code> и <code>is<\/code>, модулът <code>Test<\/code> има сравнения за различни видове стойности.<\/span> <span class=\"sg\" data-s=\"1\">Най-полезните са:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — сравнява две стойности за равенство (като низове/числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — сравнява две структури от данни за точно, типово-осъзнато равенство<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — проверява дали низ съвпада с регулярен израз<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — минава, когато две стойности <strong>не<\/strong> са равни<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> е правилният избор за масиви, хешове и вложени данни, защото сравнява структурата и типа прецизно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това извежда:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Там, където <code>is<\/code> би преобразувало към низ и сравнило свободно, <code>is-deeply<\/code> настоява структурите наистина да съвпадат.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че <code>done-testing<\/code> поставя плана <code>1..1<\/code> в края, след проверката.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вместо да оставите <code>done-testing<\/code> да брои тестовете вместо вас, можете да зададете броя предварително с <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това предпазва от тестов файл, който завършва преждевременно и тихо пропуска проверки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този път планът идва <strong>пръв<\/strong>, преди резултатите:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това е видимата разлика спрямо <code>done-testing<\/code>: <code>plan<\/code> извежда броя <code>1..2<\/code> в началото, преди изпълнението на проверки, докато <code>done-testing<\/code> го извежда в самия край.<\/span> <span class=\"sg\" data-s=\"1\">Във всеки случай, с <code>plan 2<\/code> изпълнението очаква точно два теста; ако реално се изпълнят по-малко (или повече), наборът се отчита като неуспешен.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте <code>plan<\/code>, когато броят е фиксиран и известен, и <code>done-testing<\/code>, когато е по-лесно да оставите рамката да брои.<\/span><\/p>"]]},"eo":{"t":"Komparoj kaj planoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom <code>ok<\/code> kaj <code>is<\/code>, la modulo <code>Test<\/code> havas komparojn por diversaj specoj de valoroj.<\/span> <span class=\"sg\" data-s=\"1\">La plej utilaj estas:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — komparas du valorojn por egaleco (kiel ĉenoj/nombroj)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — komparas du datumstrukturojn por preciza, tipokonscian egalecon<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — kontrolas, ke ĉeno kongruas kun regula esprimo<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — sukcesas kiam du valoroj <strong>ne<\/strong> estas egalaj<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> estas la ĝusta elekto por tabeloj, asociaj tabeloj kaj nestitaj datumoj, ĉar ĝi komparas strukturon kaj tipon precize:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio presas:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kie <code>is<\/code> ĉenigus kaj komparus malrigore, <code>is-deeply<\/code> insistas, ke la strukturoj vere kongruas.<\/span> <span class=\"sg\" data-s=\"1\">Notu, ke <code>done-testing<\/code> metas la planon <code>1..1<\/code> ĉe la fino, post la kontrolo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anstataŭ lasi <code>done-testing<\/code> kalkuli la testojn por vi, vi povas deklari la nombron anticipe per <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio protektas kontraŭ testodosiero, kiu finiĝas frue kaj silente preterlasas kontrolojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje la plano venas <strong>unue<\/strong>, antaŭ la rezultoj:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio estas la videbla diferenco de <code>done-testing<\/code>: <code>plan<\/code> presas la kalkulon <code>1..2<\/code> supre, antaŭ ol iuj kontroloj ruliĝas, dum <code>done-testing<\/code> presas ĝin tute ĉe la fino.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiukaze, per <code>plan 2<\/code> la rulo atendas ĝuste du testojn; se malpli (aŭ pli) efektive ruliĝas, la testoserio estas raportita kiel malsukcesinta.<\/span> <span class=\"sg\" data-s=\"2\">Uzu <code>plan<\/code> kiam la kalkulo estas fiksita kaj konata, kaj <code>done-testing<\/code> kiam estas pli facile lasi la kadron kalkuli.<\/span><\/p>"]]}}}</script>
