<script type="application/json" id="page-data">{"u":"advanced/testing","n":743,"k":"section","pv":"advanced/distributing/exercises/module-layout/solution","nx":"advanced/testing/test-module","tr":["advanced"],"L":{"en":{"t":"Testing","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tests check that your code does what it should — and keeps doing so as you change it.<\/span> <span class=\"sg\" data-s=\"1\">Raku ships with a testing module, <code>Test<\/code>, and the conventions to run whole suites of tests at once.<\/span> <span class=\"sg\" data-s=\"2\">Writing tests is a core part of developing real Raku programs and modules.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This section covers the <code>Test<\/code> module’s building blocks, the different kinds of comparison it offers, and how tests are run.<\/span><\/p>"]]},"de":{"t":"Testen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tests überprüfen, ob dein Code das tut, was er soll — und es auch weiterhin tut, wenn du ihn änderst.<\/span> <span class=\"sg\" data-s=\"1\">Raku wird mit einem Testmodul, <code>Test<\/code>, und den Konventionen geliefert, um ganze Testsuiten auf einmal auszuführen.<\/span> <span class=\"sg\" data-s=\"2\">Tests zu schreiben ist ein wesentlicher Bestandteil der Entwicklung von echten Raku-Programmen und -Modulen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die Grundbausteine des <code>Test<\/code>-Moduls, die verschiedenen Vergleichsarten, die es bietet, und wie Tests ausgeführt werden.<\/span><\/p>"]]},"nl":{"t":"Testen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tests controleren of je code doet wat het moet doen — en dat ook blijft doen als je er iets aan verandert.<\/span> <span class=\"sg\" data-s=\"1\">Raku wordt geleverd met een testmodule, <code>Test<\/code>, en de conventies om hele reeksen tests tegelijk uit te voeren.<\/span> <span class=\"sg\" data-s=\"2\">Tests schrijven is een essentieel onderdeel van het ontwikkelen van echte Raku-programma's en -modules.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel behandelt de bouwstenen van de <code>Test<\/code>-module, de verschillende soorten vergelijkingen die het biedt, en hoe tests worden uitgevoerd.<\/span><\/p>"]]},"es":{"t":"Pruebas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Las pruebas verifican que tu código hace lo que debe — y sigue haciéndolo a medida que lo modificas.<\/span> <span class=\"sg\" data-s=\"1\">Raku incluye un módulo de pruebas, <code>Test<\/code>, y las convenciones para ejecutar conjuntos completos de pruebas de una sola vez.<\/span> <span class=\"sg\" data-s=\"2\">Escribir pruebas es una parte fundamental del desarrollo de programas y módulos reales en Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta sección cubre los elementos básicos del módulo <code>Test<\/code>, los diferentes tipos de comparación que ofrece y cómo se ejecutan las pruebas.<\/span><\/p>"]]},"it":{"t":"Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">I test verificano che il codice faccia ciò che deve fare — e che continui a farlo mentre lo modifichi.<\/span> <span class=\"sg\" data-s=\"1\">Raku include un modulo di test, <code>Test<\/code>, e le convenzioni per eseguire intere suite di test in una volta sola.<\/span> <span class=\"sg\" data-s=\"2\">Scrivere test è una parte fondamentale dello sviluppo di programmi e moduli Raku reali.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta i componenti di base del modulo <code>Test<\/code>, i diversi tipi di confronto che offre e come vengono eseguiti i test.<\/span><\/p>"]]},"lv":{"t":"Testēšana 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Testi pārbauda, vai jūsu kods dara to, kas tam jādara, — un vai turpina to darīt, kad to maināt.<\/span> <span class=\"sg\" data-s=\"1\">Raku nāk komplektā ar testēšanas moduli <code>Test<\/code> un vienošanos par to, kā izpildīt veselas testu kopas uzreiz.<\/span> <span class=\"sg\" data-s=\"2\">Testu rakstīšana ir īstu Raku programmu un moduļu izstrādes pamatdaļa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko moduļa <code>Test<\/code> pamatelementus, dažādos salīdzināšanas veidus, ko tas piedāvā, un to, kā testi tiek izpildīti.<\/span><\/p>"]]},"ru":{"t":"Тестирование","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тесты проверяют, что ваш код делает то, что должен, и продолжает это делать по мере внесения изменений.<\/span> <span class=\"sg\" data-s=\"1\">Raku поставляется с модулем для тестирования <code>Test<\/code> и соглашениями для запуска целых наборов тестов за один раз.<\/span> <span class=\"sg\" data-s=\"2\">Написание тестов --- неотъемлемая часть разработки реальных программ и модулей на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этот раздел охватывает основные инструменты модуля <code>Test<\/code>, различные виды сравнений, которые он предлагает, и способы запуска тестов.<\/span><\/p>"]]},"uk":{"t":"Тестування","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тести перевіряють, що ваш код робить те, що має, — і продовжує це робити, коли ви його змінюєте.<\/span> <span class=\"sg\" data-s=\"1\">Raku постачається з модулем тестування <code>Test<\/code> і угодами для запуску цілих наборів тестів за раз.<\/span> <span class=\"sg\" data-s=\"2\">Написання тестів є невіддільною частиною розробки справжніх програм і модулів на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює будівельні блоки модуля <code>Test<\/code>, різні види порівнянь, які він пропонує, і те, як тести запускають.<\/span><\/p>"]]},"bg":{"t":"Тестване 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тестовете проверяват дали вашият код прави това, което трябва — и продължава да го прави, докато го променяте.<\/span> <span class=\"sg\" data-s=\"1\">Raku се доставя с модул за тестване, <code>Test<\/code>, и конвенции за изпълнение на цели набори от тестове наведнъж.<\/span> <span class=\"sg\" data-s=\"2\">Писането на тестове е основна част от разработката на истински програми и модули на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази секция обхваща основните градивни елементи на модула <code>Test<\/code>, различните видове сравнения, които предлага, и как се изпълняват тестовете.<\/span><\/p>"]]},"eo":{"t":"Testado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Testoj kontrolas, ke via kodo faras tion, kion ĝi devus — kaj daŭre faras tion, kiam vi ŝanĝas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Raku liveras testadan modulon, <code>Test<\/code>, kaj la konvenciojn por ruli tutajn testoseriojn samtempe.<\/span> <span class=\"sg\" data-s=\"2\">Skribi testojn estas kerna parto de la evoluigo de realaj programoj kaj moduloj en Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas la konstrubrikojn de la modulo <code>Test<\/code>, la diversajn specojn de komparo, kiujn ĝi ofertas, kaj kiel testoj estas rulitaj.<\/span><\/p>"]]}}}</script>
