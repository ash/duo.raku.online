<script type="application/json" id="page-data">{"u":"advanced/testing/running-tests","n":747,"k":"topic","pv":"advanced/testing/comparisons","nx":"advanced/testing/exercises","tr":["advanced","advanced/testing"],"L":{"en":{"t":"Running tests","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">A single test file is just a Raku program, so you can run it directly:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">It prints its TAP output to the screen.<\/span> <span class=\"sg\" data-s=\"1\">For more than a file or two, you want a <em>test runner<\/em> that runs a whole directory of tests and summarises the results.<\/span> <span class=\"sg\" data-s=\"2\">Raku’s runner is <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This runs every test file under <code>t/<\/code> and reports how many files and tests passed, with a single overall pass/fail at the end — far easier to read than the raw TAP from each file.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When a distribution has a <code>META6.json<\/code>, the module tool runs its tests for you:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> finds the <code>t/<\/code> directory, runs the suite, and reports the result — which is exactly what happens automatically before a distribution is installed.<\/span> <span class=\"sg\" data-s=\"1\">So tests serve double duty: you run them while developing with <code>prove6<\/code>, and the ecosystem runs them to verify a distribution before anyone installs it.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Test files are named with a <code>.rakutest<\/code> (or <code>.t<\/code>) extension and conventionally numbered, as in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"de":{"t":"Tests ausführen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine einzelne Testdatei ist einfach ein Raku-Programm, du kannst sie also direkt ausführen:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie gibt ihre TAP-Ausgabe auf dem Bildschirm aus.<\/span> <span class=\"sg\" data-s=\"1\">Für mehr als ein oder zwei Dateien brauchst du einen <em>Test-Runner<\/em>, der ein ganzes Verzeichnis von Tests ausführt und die Ergebnisse zusammenfasst.<\/span> <span class=\"sg\" data-s=\"2\">Rakus Runner ist <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies führt jede Testdatei unter <code>t/<\/code> aus und meldet, wie viele Dateien und Tests bestanden wurden, mit einem einzigen Gesamtergebnis am Ende — viel leichter zu lesen als die rohe TAP-Ausgabe jeder einzelnen Datei.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Distribution eine <code>META6.json<\/code> hat, führt das Modultool die Tests für dich aus:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> findet das <code>t/<\/code>-Verzeichnis, führt die Suite aus und meldet das Ergebnis — was genau das ist, was automatisch passiert, bevor eine Distribution installiert wird.<\/span> <span class=\"sg\" data-s=\"1\">Tests erfüllen also einen doppelten Zweck: Du führst sie während der Entwicklung mit <code>prove6<\/code> aus, und das Ökosystem führt sie aus, um eine Distribution zu verifizieren, bevor jemand sie installiert.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testdateien haben die Endung <code>.rakutest<\/code> (oder <code>.t<\/code>) und werden konventionell nummeriert, wie in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"nl":{"t":"Tests uitvoeren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Een enkel testbestand is gewoon een Raku-programma, dus je kunt het direct uitvoeren:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het toont de TAP-uitvoer op het scherm.<\/span> <span class=\"sg\" data-s=\"1\">Voor meer dan een paar bestanden wil je een <em>test runner<\/em> die een hele map met tests uitvoert en de resultaten samenvat.<\/span> <span class=\"sg\" data-s=\"2\">De runner van Raku is <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit voert elk testbestand in <code>t/<\/code> uit en rapporteert hoeveel bestanden en tests geslaagd zijn, met een enkel totaalresultaat van slagen/falen aan het einde — veel makkelijker te lezen dan de ruwe TAP van elk bestand.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer een distributie een <code>META6.json<\/code> heeft, voert de moduletool de tests voor je uit:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> vindt de <code>t/<\/code>-map, voert de suite uit en rapporteert het resultaat — wat precies hetzelfde is als wat automatisch gebeurt voordat een distributie wordt geinstalleerd.<\/span> <span class=\"sg\" data-s=\"1\">Tests dienen dus een dubbel doel: je voert ze uit tijdens het ontwikkelen met <code>prove6<\/code>, en het ecosysteem voert ze uit om een distributie te verifieren voordat iemand het installeert.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testbestanden hebben de extensie <code>.rakutest<\/code> (of <code>.t<\/code>) en zijn conventioneel genummerd, zoals <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"es":{"t":"Ejecutar pruebas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un archivo de pruebas individual es simplemente un programa Raku, así que puedes ejecutarlo directamente:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Imprime su salida TAP en la pantalla.<\/span> <span class=\"sg\" data-s=\"1\">Para más de uno o dos archivos, necesitas un <em>ejecutor de pruebas<\/em> que ejecute un directorio completo de pruebas y resuma los resultados.<\/span> <span class=\"sg\" data-s=\"2\">El ejecutor de Raku es <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto ejecuta cada archivo de pruebas en <code>t/<\/code> e informa cuántos archivos y pruebas pasaron, con un resultado global de aprobado/fallido al final — mucho más fácil de leer que la salida TAP cruda de cada archivo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando una distribución tiene un <code>META6.json<\/code>, la herramienta de módulos ejecuta sus pruebas por ti:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> encuentra el directorio <code>t/<\/code>, ejecuta el conjunto de pruebas e informa el resultado — que es exactamente lo que sucede automáticamente antes de que se instale una distribución.<\/span> <span class=\"sg\" data-s=\"1\">Así, las pruebas cumplen una doble función: tú las ejecutas mientras desarrollas con <code>prove6<\/code>, y el ecosistema las ejecuta para verificar una distribución antes de que alguien la instale.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Los archivos de pruebas se nombran con la extensión <code>.rakutest<\/code> (o <code>.t<\/code>) y convencionalmente se numeran, como en <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"it":{"t":"Eseguire i test","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un singolo file di test è semplicemente un programma Raku, quindi puoi eseguirlo direttamente:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Stampa il suo output TAP sullo schermo.<\/span> <span class=\"sg\" data-s=\"1\">Per più di uno o due file, ti serve un <em>test runner<\/em> che esegua un'intera directory di test e riassuma i risultati.<\/span> <span class=\"sg\" data-s=\"2\">Il runner di Raku è <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo esegue ogni file di test sotto <code>t/<\/code> e riporta quanti file e test sono passati, con un unico risultato complessivo di superamento/fallimento alla fine — molto più facile da leggere rispetto al TAP grezzo di ciascun file.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando una distribuzione ha un <code>META6.json<\/code>, lo strumento per i moduli esegue i test per te:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> trova la directory <code>t/<\/code>, esegue la suite e riporta il risultato — che è esattamente ciò che avviene automaticamente prima che una distribuzione venga installata.<\/span> <span class=\"sg\" data-s=\"1\">Quindi i test hanno una doppia funzione: li esegui durante lo sviluppo con <code>prove6<\/code>, e l'ecosistema li esegue per verificare una distribuzione prima che chiunque la installi.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">I file di test hanno estensione <code>.rakutest<\/code> (o <code>.t<\/code>) e sono convenzionalmente numerati, come in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"lv":{"t":"Testu palaišana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Atsevišķs testu fails ir vienkārši Raku programma, tāpēc to var palaist tieši:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā savu TAP izvadi ekrānā.<\/span> <span class=\"sg\" data-s=\"1\">Ja failu ir vairāk par vienu vai diviem, noder <em>testu palaidējs<\/em>, kas izpilda veselu testu direktoriju un apkopo rezultātus.<\/span> <span class=\"sg\" data-s=\"2\">Raku palaidējs ir <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izpilda katru testu failu zem <code>t/<\/code> un ziņo, cik failu un testu izdevās, ar vienu kopēju izdevās/neizdevās vērtējumu beigās — daudz vieglāk lasāms nekā katra faila neapstrādāts TAP.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad distribūcijai ir <code>META6.json<\/code>, moduļu rīks tās testus izpilda jūsu vietā:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> atrod direktoriju <code>t/<\/code>, izpilda kopu un ziņo rezultātu — un tieši tas notiek automātiski, pirms distribūcija tiek instalēta.<\/span> <span class=\"sg\" data-s=\"1\">Tātad testi kalpo divkārši: izstrādes laikā tos palaižat ar <code>prove6<\/code>, un ekosistēma tos izpilda, lai pārbaudītu distribūciju, pirms kāds to instalē.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testu failus nosauc ar paplašinājumu <code>.rakutest<\/code> (vai <code>.t<\/code>) un pēc vienošanās numurē, kā <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"ru":{"t":"Запуск тестов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Отдельный тестовый файл --- это обычная программа на Raku, поэтому его можно запустить напрямую:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Он выводит TAP-вывод на экран.<\/span> <span class=\"sg\" data-s=\"1\">Для более чем одного-двух файлов удобнее использовать <em>средство запуска тестов<\/em>, которое запускает целую директорию с тестами и обобщает результаты.<\/span> <span class=\"sg\" data-s=\"2\">В Raku это <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта команда запускает все тестовые файлы в директории <code>t/<\/code> и сообщает, сколько файлов и тестов прошло, с общим итогом в конце --- это гораздо удобнее для чтения, чем необработанный TAP-вывод каждого файла.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда у дистрибутива есть <code>META6.json<\/code>, инструмент управления модулями запускает тесты за вас:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> находит директорию <code>t/<\/code>, запускает набор тестов и сообщает результат --- именно это происходит автоматически перед установкой дистрибутива.<\/span> <span class=\"sg\" data-s=\"1\">Таким образом, тесты выполняют двойную функцию: вы запускаете их во время разработки с помощью <code>prove6<\/code>, а экосистема запускает их для проверки дистрибутива перед его установкой.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тестовые файлы имеют расширение <code>.rakutest<\/code> (или <code>.t<\/code>) и по соглашению нумеруются, например <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"uk":{"t":"Запуск тестів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Окремий файл тестів є просто програмою на Raku, тож його можна запустити напряму:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Він виводить свій TAP-вивід на екран.<\/span> <span class=\"sg\" data-s=\"1\">Якщо файлів більше ніж один-два, вам знадобиться <em>запускач тестів<\/em>, який виконує цілий каталог тестів і підсумовує результати.<\/span> <span class=\"sg\" data-s=\"2\">Запускачем у Raku є <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це виконує кожен файл тестів у каталозі <code>t/<\/code> і повідомляє, скільки файлів і тестів пройшло, з єдиним загальним підсумком «пройдено/не пройдено» наприкінці — це значно легше читати, ніж сирий TAP із кожного файлу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли дистрибутив має <code>META6.json<\/code>, засіб роботи з модулями виконує його тести за вас:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> знаходить каталог <code>t/<\/code>, виконує набір і повідомляє результат — саме це й відбувається автоматично перед установленням дистрибутива.<\/span> <span class=\"sg\" data-s=\"1\">Тож тести служать подвійно: ви запускаєте їх під час розробки через <code>prove6<\/code>, а екосистема запускає їх, щоб перевірити дистрибутив, перш ніж хтось його встановить.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Файли тестів іменують із розширенням <code>.rakutest<\/code> (або <code>.t<\/code>) і за угодою нумерують, як-от <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"bg":{"t":"Стартиране на тестове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Единичен тестов файл е просто програма на Raku, така че можете да го стартирате директно:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Той извежда TAP резултата на екрана.<\/span> <span class=\"sg\" data-s=\"1\">За повече от един-два файла е нужен <em>тестов изпълнител<\/em>, който стартира цяла директория с тестове и обобщава резултатите.<\/span> <span class=\"sg\" data-s=\"2\">Изпълнителят на Raku е <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Той изпълнява всеки тестов файл в <code>t/<\/code> и отчита колко файла и теста са минали, с единствен общ резултат успех/неуспех в края — далеч по-лесно за четене от суровия TAP от всеки файл.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато дистрибуцията има <code>META6.json<\/code>, инструментът за модули стартира тестовете вместо вас:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> намира директорията <code>t/<\/code>, изпълнява набора и отчита резултата — което е точно това, което се случва автоматично преди инсталирането на дистрибуция.<\/span> <span class=\"sg\" data-s=\"1\">Така тестовете служат двойно: вие ги изпълнявате по време на разработка с <code>prove6<\/code>, а екосистемата ги изпълнява, за да провери дистрибуцията, преди някой да я инсталира.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тестовите файлове се именуват с разширение <code>.rakutest<\/code> (или <code>.t<\/code>) и по конвенция са номерирани, както в <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"eo":{"t":"Rulado de testoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ununura testodosiero estas simple Raku-programo, do vi povas ruli ĝin rekte:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝi presas sian TAP-eligon al la ekrano.<\/span> <span class=\"sg\" data-s=\"1\">Por pli ol unu aŭ du dosieroj, vi bezonas <em>testorulanton<\/em>, kiu rulas tutan dosierujon de testoj kaj resumas la rezultojn.<\/span> <span class=\"sg\" data-s=\"2\">La rulanto de Raku estas <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio rulas ĉiun testodosieron sub <code>t/<\/code> kaj raportas kiom da dosieroj kaj testoj sukcesis, kun unu ĝenerala sukceso/malsukceso ĉe la fino — multe pli facile legebla ol la kruda TAP el ĉiu dosiero.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam distribuo havas <code>META6.json<\/code>, la modula ilo rulas ĝiajn testojn por vi:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> trovas la dosierujon <code>t/<\/code>, rulas la testoserio kaj raportas la rezulton — kio estas ĝuste tio, kio aŭtomate okazas antaŭ ol distribuo estas instalita.<\/span> <span class=\"sg\" data-s=\"1\">Do testoj servas duoblan celon: vi rulas ilin dum evoluigo per <code>prove6<\/code>, kaj la ekosistemo rulas ilin por kontroli distribuon antaŭ ol iu ajn instalas ĝin.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testodosieroj estas nomataj kun la sufikso <code>.rakutest<\/code> (aŭ <code>.t<\/code>) kaj konvencie numeritaj, ekzemple <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]}}}</script>
