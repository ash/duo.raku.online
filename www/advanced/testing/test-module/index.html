<script type="application/json" id="page-data">{"u":"advanced/testing/test-module","n":744,"k":"topic","pv":"advanced/testing","nx":"advanced/testing/test-module/quiz","tr":["advanced","advanced/testing"],"L":{"en":{"t":"The Test module","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bring in the testing tools with <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The most basic check is <code>ok<\/code>, which passes when its condition is true.<\/span> <span class=\"sg\" data-s=\"2\">Each check takes an optional description:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Running this prints, in the standard test format known as <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Each passing check is reported as <code>ok<\/code> with its number and description; a failing one would be <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The final <code>1..2<\/code> is the <em>plan<\/em>, stating how many tests ran.<\/span> <span class=\"sg\" data-s=\"2\">The <code>done-testing<\/code> call at the end emits that plan automatically.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you expect a specific value, <code>is<\/code> is clearer than <code>ok<\/code>, because it reports both the expected and the actual value on failure:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This prints <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To see that reporting in action, give <code>is<\/code> a wrong expectation:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now the check fails, and the output explains exactly how:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>not ok<\/code> line marks the failure, and the diagnostic lines beneath it show what was expected against what actually turned up — which is why <code>is<\/code> is more helpful than a bare <code>ok<\/code> when a specific value matters.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code>, and <code>done-testing<\/code> are already enough to write a useful test file; the next topic adds <a href=\"/advanced/testing/comparisons/\">the other comparisons<\/a>.<\/span><\/p>"]]},"de":{"t":"Das Test-Modul","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lade die Testwerkzeuge mit <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die grundlegendste Prüfung ist <code>ok<\/code>, die bestanden wird, wenn ihre Bedingung wahr ist.<\/span> <span class=\"sg\" data-s=\"2\">Jede Prüfung nimmt eine optionale Beschreibung entgegen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausführung gibt Folgendes im Standardtestformat namens <em>TAP<\/em> aus:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jede bestandene Prüfung wird als <code>ok<\/code> mit ihrer Nummer und Beschreibung ausgegeben; eine fehlgeschlagene wäre <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das abschließende <code>1..2<\/code> ist der <em>Plan<\/em>, der angibt, wie viele Tests ausgeführt wurden.<\/span> <span class=\"sg\" data-s=\"2\">Der Aufruf von <code>done-testing<\/code> am Ende gibt diesen Plan automatisch aus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du einen bestimmten Wert erwartest, ist <code>is<\/code> klarer als <code>ok<\/code>, weil es bei einem Fehlschlag sowohl den erwarteten als auch den tatsächlichen Wert ausgibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies gibt <code>ok 1 - addition works<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Um diese Berichterstattung in Aktion zu sehen, gib <code>is<\/code> eine falsche Erwartung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt schlägt die Prüfung fehl, und die Ausgabe erklärt genau, warum:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Zeile <code>not ok<\/code> markiert den Fehlschlag, und die darunterliegenden Diagnosezeilen zeigen, was erwartet wurde im Vergleich zu dem, was tatsächlich herauskam — deshalb ist <code>is<\/code> hilfreicher als ein bloßes <code>ok<\/code>, wenn ein bestimmter Wert wichtig ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> und <code>done-testing<\/code> reichen bereits aus, um eine nützliche Testdatei zu schreiben; das nächste Thema fügt <a href=\"https://course.raku.org/de/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">die anderen Vergleichsarten<\/a> hinzu.<\/span><\/p>"]]},"nl":{"t":"De Test-module","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Laad de testtools met <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De meest basale controle is <code>ok<\/code>, die slaagt wanneer de voorwaarde waar is.<\/span> <span class=\"sg\" data-s=\"2\">Elke controle accepteert een optionele beschrijving:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit geeft de volgende uitvoer, in het standaard testformaat bekend als <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke geslaagde controle wordt gerapporteerd als <code>ok<\/code> met het nummer en de beschrijving; een falende controle zou <code>not ok<\/code> zijn.<\/span> <span class=\"sg\" data-s=\"1\">De laatste regel <code>1..2<\/code> is het <em>plan<\/em>, dat aangeeft hoeveel tests er zijn uitgevoerd.<\/span> <span class=\"sg\" data-s=\"2\">De <code>done-testing<\/code>-aanroep aan het einde genereert dat plan automatisch.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een specifieke waarde verwacht, is <code>is<\/code> duidelijker dan <code>ok<\/code>, omdat het bij een fout zowel de verwachte als de werkelijke waarde toont:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit geeft <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Om die rapportage in actie te zien, geef je <code>is<\/code> een verkeerde verwachting:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu faalt de controle, en de uitvoer legt precies uit hoe:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>not ok<\/code>-regel markeert de fout, en de diagnostische regels eronder tonen wat verwacht werd tegenover wat er daadwerkelijk uitkwam — daarom is <code>is<\/code> nuttiger dan een kale <code>ok<\/code> wanneer een specifieke waarde van belang is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> en <code>done-testing<\/code> zijn al voldoende om een bruikbaar testbestand te schrijven; het volgende onderwerp voegt <a href=\"https://course.raku.org/nl/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">de andere vergelijkingen<\/a> toe.<\/span><\/p>"]]},"es":{"t":"El módulo Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Importa las herramientas de pruebas con <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La comprobación más básica es <code>ok<\/code>, que pasa cuando su condición es verdadera.<\/span> <span class=\"sg\" data-s=\"2\">Cada comprobación acepta una descripción opcional:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Al ejecutarlo se imprime, en el formato estándar de pruebas conocido como <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada comprobación que pasa se muestra como <code>ok<\/code> con su número y descripción; una que falle aparecería como <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La línea final <code>1..2<\/code> es el <em>plan<\/em>, que indica cuántas pruebas se ejecutaron.<\/span> <span class=\"sg\" data-s=\"2\">La llamada a <code>done-testing<\/code> al final emite ese plan automáticamente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando esperas un valor específico, <code>is<\/code> es más claro que <code>ok<\/code>, porque informa tanto el valor esperado como el valor real en caso de fallo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto imprime <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para ver ese informe en acción, dale a <code>is<\/code> una expectativa incorrecta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora la comprobación falla, y la salida explica exactamente cómo:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La línea <code>not ok<\/code> marca el fallo, y las líneas de diagnóstico debajo muestran lo que se esperaba frente a lo que realmente se obtuvo — por eso <code>is<\/code> es más útil que un simple <code>ok<\/code> cuando importa un valor específico.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> y <code>done-testing<\/code> ya son suficientes para escribir un archivo de pruebas útil; el siguiente tema añade <a href=\"https://course.raku.org/es/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">las otras comparaciones<\/a>.<\/span><\/p>"]]},"it":{"t":"Il modulo Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Importa gli strumenti di test con <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il controllo più basilare è <code>ok<\/code>, che ha successo quando la sua condizione è vera.<\/span> <span class=\"sg\" data-s=\"2\">Ogni controllo accetta una descrizione opzionale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'esecuzione stampa, nel formato di test standard noto come <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni controllo superato viene riportato come <code>ok<\/code> con il suo numero e la descrizione; uno fallito sarebbe <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>1..2<\/code> finale è il <em>piano<\/em>, che indica quanti test sono stati eseguiti.<\/span> <span class=\"sg\" data-s=\"2\">La chiamata a <code>done-testing<\/code> alla fine emette quel piano automaticamente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando ci si aspetta un valore specifico, <code>is<\/code> è più chiaro di <code>ok<\/code>, perché in caso di fallimento riporta sia il valore atteso che quello effettivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per vedere il reporting in azione, passa a <code>is<\/code> un'aspettativa errata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora il controllo fallisce, e l'output spiega esattamente come:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La riga <code>not ok<\/code> segna il fallimento, e le righe diagnostiche sotto di essa mostrano cosa era atteso rispetto a cosa è stato effettivamente ottenuto — ecco perché <code>is<\/code> è più utile di un semplice <code>ok<\/code> quando conta un valore specifico.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> e <code>done-testing<\/code> sono già sufficienti per scrivere un file di test utile; l'argomento successivo aggiunge <a href=\"https://course.raku.org/it/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">gli altri confronti<\/a>.<\/span><\/p>"]]},"lv":{"t":"Test modulis","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Testēšanas rīkus ievelciet ar <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pamata pārbaude ir <code>ok<\/code>, kas izdodas, kad tās nosacījums ir patiess.<\/span> <span class=\"sg\" data-s=\"2\">Katra pārbaude ņem neobligātu aprakstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaižot to, tiek izdrukāts standarta testu formātā, kas pazīstams kā <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katra izdevusies pārbaude tiek ziņota kā <code>ok<\/code> ar savu numuru un aprakstu; neizdevusies būtu <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nobeiguma <code>1..2<\/code> ir <em>plāns<\/em>, kas pasaka, cik testu izpildījās.<\/span> <span class=\"sg\" data-s=\"2\">Izsaukums <code>done-testing<\/code> beigās šo plānu izdod automātiski.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad gaidāt konkrētu vērtību, <code>is<\/code> ir skaidrāks nekā <code>ok<\/code>, jo neveiksmes gadījumā tas ziņo gan gaidīto, gan faktisko vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lai redzētu šo ziņošanu darbībā, dodiet <code>is<\/code> nepareizu gaidīto vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad pārbaude neizdodas, un izvade paskaidro tieši, kā:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rinda <code>not ok<\/code> iezīmē neveiksmi, un diagnostikas rindas zem tās parāda, kas tika gaidīts, pretstatā tam, kas patiešām iznāca, — un tieši tāpēc <code>is<\/code> ir noderīgāks nekā kails <code>ok<\/code>, kad svarīga ir konkrēta vērtība.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar <code>ok<\/code>, <code>is<\/code> un <code>done-testing<\/code> jau pietiek, lai uzrakstītu noderīgu testu failu; nākamais temats pievieno <a href=\"https://course.raku.org/lv/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">pārējos salīdzinājumus<\/a>.<\/span><\/p>"]]},"ru":{"t":"Модуль Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подключите инструменты для тестирования с помощью <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Самая базовая проверка --- это <code>ok<\/code>, которая проходит, если условие истинно.<\/span> <span class=\"sg\" data-s=\"2\">Каждая проверка принимает необязательное описание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При запуске выводится стандартный формат тестов, известный как <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждая пройденная проверка выводится как <code>ok<\/code> с номером и описанием; непройденная была бы отмечена как <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Финальная строка <code>1..2<\/code> --- это <em>план<\/em>, указывающий, сколько тестов было выполнено.<\/span> <span class=\"sg\" data-s=\"2\">Вызов <code>done-testing<\/code> в конце автоматически генерирует этот план.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда вы ожидаете конкретное значение, <code>is<\/code> нагляднее, чем <code>ok<\/code>, потому что при ошибке выводятся и ожидаемое, и фактическое значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта программа выведет <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы увидеть, как работает вывод при ошибке, передайте <code>is<\/code> неверное ожидаемое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь проверка не проходит, и вывод точно объясняет почему:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Строка <code>not ok<\/code> обозначает неудачу, а диагностические строки под ней показывают, что ожидалось, в сравнении с тем, что было получено --- именно поэтому <code>is<\/code> полезнее, чем простой <code>ok<\/code>, когда важно конкретное значение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> и <code>done-testing<\/code> --- этого уже достаточно, чтобы написать полезный тестовый файл; в следующей теме описаны <a href=\"https://course.raku.org/ru/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">другие виды сравнений<\/a>.<\/span><\/p>"]]},"uk":{"t":"Модуль Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Підключіть інструменти тестування через <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Найпростішою перевіркою є <code>ok<\/code>, яка проходить, коли її умова істинна.<\/span> <span class=\"sg\" data-s=\"2\">Кожна перевірка приймає необов'язковий опис:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запуск цього виводить у стандартному форматі тестів, відомому як <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожну успішну перевірку повідомляють як <code>ok<\/code> із її номером і описом; невдалу було б позначено <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Завершальне <code>1..2<\/code> — це <em>план<\/em>, який каже, скільки тестів виконалося.<\/span> <span class=\"sg\" data-s=\"2\">Виклик <code>done-testing<\/code> наприкінці видає цей план автоматично.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли ви очікуєте конкретне значення, <code>is<\/code> зрозуміліший за <code>ok<\/code>, бо в разі невдачі повідомляє і очікуване, і фактичне значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це виводить <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щоб побачити це повідомлення в дії, дайте <code>is<\/code> хибне очікування:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер перевірка провалюється, і вивід пояснює, як саме:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рядок <code>not ok<\/code> позначає невдачу, а діагностичні рядки під ним показують, що очікувалося, проти того, що насправді вийшло, — саме тому <code>is<\/code> корисніший за голий <code>ok<\/code>, коли має значення конкретне значення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> та <code>done-testing<\/code> уже достатньо, щоб написати корисний файл тестів; наступна тема додає <a href=\"https://course.raku.org/uk/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">інші порівняння<\/a>.<\/span><\/p>"]]},"bg":{"t":"Модулът Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Заредете инструментите за тестване с <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Най-основната проверка е <code>ok<\/code>, която минава, когато условието е вярно.<\/span> <span class=\"sg\" data-s=\"2\">Всяка проверка приема незадължително описание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изпълнението на това извежда в стандартния тестов формат, известен като <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяка успешна проверка се отчита като <code>ok<\/code> с нейния номер и описание; неуспешна би била <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Последният ред <code>1..2<\/code> е <em>планът<\/em>, който указва колко теста са се изпълнили.<\/span> <span class=\"sg\" data-s=\"2\">Извикването на <code>done-testing<\/code> в края автоматично извежда този план.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато очаквате конкретна стойност, <code>is<\/code> е по-ясно от <code>ok<\/code>, защото при неуспех отчита както очакваната, така и действителната стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това извежда <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За да видите отчитането в действие, дайте на <code>is<\/code> грешно очакване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега проверката се проваля и резултатът обяснява точно как:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Редът <code>not ok<\/code> маркира неуспеха, а диагностичните редове под него показват какво е било очаквано спрямо това, което действително е излязло — затова <code>is<\/code> е по-полезно от обикновено <code>ok<\/code>, когато конкретна стойност е от значение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> и <code>done-testing<\/code> вече са достатъчни за писане на полезен тестов файл; следващата тема добавя <a href=\"https://course.raku.org/bg/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">другите сравнения<\/a>.<\/span><\/p>"]]},"eo":{"t":"La modulo Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Importu la testadajn ilojn per <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La plej baza kontrolo estas <code>ok<\/code>, kiu sukcesas kiam ĝia kondiĉo estas vera.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu kontrolo akceptas nedevigan priskribon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ruli tion presas, en la normiga testformato konata kiel <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu sukcesinta kontrolo estas raportita kiel <code>ok<\/code> kun sia numero kaj priskribo; malsukcesinta estus <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La fina <code>1..2<\/code> estas la <em>plano<\/em>, indikanta kiom da testoj ruliĝis.<\/span> <span class=\"sg\" data-s=\"2\">La alvoko <code>done-testing<\/code> ĉe la fino aŭtomate eligas tiun planon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi atendas specifan valoron, <code>is<\/code> estas pli klara ol <code>ok<\/code>, ĉar ĝi raportas kaj la atendatan kaj la realan valoron ĉe malsukceso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio presas <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por vidi tiun raportadon en ago, donu al <code>is<\/code> malĝustan atendon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun la kontrolo malsukcesas, kaj la eligo klarigas precize kiel:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La linio <code>not ok<\/code> markas la malsukceson, kaj la diagnozaj linioj sub ĝi montras kio estis atendata kontraŭ kio efektive aperis — tial <code>is<\/code> estas pli helpema ol nuda <code>ok<\/code> kiam specifa valoro gravas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code>, kaj <code>done-testing<\/code> jam sufiĉas por skribi utilan testodosieron; la sekva temo aldonas <a href=\"https://course.raku.org/eo/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">la aliajn komparojn<\/a>.<\/span><\/p>"]]}}}</script>
