<script type="application/json" id="page-data">{"u":"advanced/packages/exercises/a-package/solution","n":730,"k":"solution","pv":"advanced/packages/exercises/a-package","nx":"advanced/packages/exercises/nested-name","tr":["advanced","advanced/packages"],"L":{"en":{"t":"The solution of ’A package‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both the variable and the subroutine are declared with <code>our<\/code>, so both become part of the <code>Temperature<\/code> namespace and are reachable from outside.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The variable is reached as <code>$Temperature::freezing<\/code> — sigil, package name, then variable name — while the subroutine is called as <code>Temperature::fahrenheit(100)<\/code>. Converting <code>100<\/code> gives <code>100 * 9/5 + 32<\/code>, which is <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A plain <code>package<\/code> provides just the namespace. For a reusable library we would have used <code>module<\/code> instead — and, once objects are on the table, a <code>class<\/code> — but the namespace mechanism is the same in each case.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Paket","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sowohl die Variable als auch die Subroutine sind mit <code>our<\/code> deklariert, sodass beide Teil des <code>Temperature<\/code>-Namensraums werden und von außen erreichbar sind.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Variable wird als <code>$Temperature::freezing<\/code> erreicht — Sigil, Package-Name, dann Variablenname — während die Subroutine als <code>Temperature::fahrenheit(100)<\/code> aufgerufen wird. Die Umrechnung von <code>100<\/code> ergibt <code>100 * 9/5 + 32<\/code>, also <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein einfaches <code>package<\/code> stellt nur den Namensraum bereit. Für eine wiederverwendbare Bibliothek hätten wir stattdessen <code>module<\/code> verwendet — und sobald Objekte ins Spiel kommen, eine <code>class<\/code> — aber der Namensraum-Mechanismus ist in jedem Fall derselbe.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een pakket","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Zowel de variabele als de subroutine zijn gedeclareerd met <code>our<\/code>, dus beide worden onderdeel van de <code>Temperature<\/code>-naamruimte en zijn van buitenaf bereikbaar.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De variabele wordt benaderd als <code>$Temperature::freezing<\/code> — sigil, pakketnaam, dan variabelenaam — terwijl de subroutine wordt aangeroepen als <code>Temperature::fahrenheit(100)<\/code>. Het omrekenen van <code>100<\/code> geeft <code>100 * 9/5 + 32<\/code>, wat <code>212<\/code> is.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een gewoon <code>package<\/code> biedt alleen de naamruimte. Voor een herbruikbare bibliotheek zouden we <code>module<\/code> hebben gebruikt — en zodra objecten in beeld komen, een <code>class<\/code> — maar het naamruimtemechanisme is in elk geval hetzelfde.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un paquete","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tanto la variable como la subrutina se declaran con <code>our<\/code>, por lo que ambas pasan a formar parte del espacio de nombres <code>Temperature<\/code> y son accesibles desde afuera.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La variable se accede como <code>$Temperature::freezing<\/code> — sigilo, nombre del paquete y luego nombre de la variable — mientras que la subrutina se llama como <code>Temperature::fahrenheit(100)<\/code>. Convertir <code>100<\/code> da <code>100 * 9/5 + 32<\/code>, que es <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>package<\/code> simple proporciona solo el espacio de nombres. Para una biblioteca reutilizable habríamos usado <code>module<\/code> en su lugar — y, una vez que los objetos entran en juego, una <code>class<\/code> — pero el mecanismo de espacio de nombres es el mismo en cada caso.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un pacchetto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione al compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sia la variabile che la subroutine sono dichiarate con <code>our<\/code>, quindi entrambe diventano parte del namespace <code>Temperature<\/code> e sono raggiungibili dall'esterno.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La variabile viene raggiunta come <code>$Temperature::freezing<\/code> — sigillo, nome del package, poi nome della variabile — mentre la subroutine viene chiamata come <code>Temperature::fahrenheit(100)<\/code>. Convertendo <code>100<\/code> si ottiene <code>100 * 9/5 + 32<\/code>, che fa <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un semplice <code>package<\/code> fornisce solo il namespace. Per una libreria riutilizzabile avremmo usato <code>module<\/code> — e, quando entrano in gioco gli oggetti, una <code>class<\/code> — ma il meccanismo del namespace è lo stesso in ogni caso.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pakotne","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens no iespējamiem uzdevuma risinājumiem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Šīs programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gan mainīgais, gan apakšprogramma ir deklarēti ar <code>our<\/code>, tāpēc abi kļūst par <code>Temperature<\/code> vārdtelpas daļu un ir sasniedzami no ārpuses.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mainīgajam piekļūst kā <code>$Temperature::freezing<\/code> — sigils, pakotnes nosaukums, tad mainīgā nosaukums —, savukārt apakšprogrammu izsauc kā <code>Temperature::fahrenheit(100)<\/code>. Pārvēršot <code>100<\/code>, iegūst <code>100 * 9/5 + 32<\/code>, kas ir <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vienkāršs <code>package<\/code> nodrošina tikai vārdtelpu. Atkārtoti lietojamai bibliotēkai mēs būtu izmantojuši <code>module<\/code> — un, kad nonākam pie objektiem, <code>class<\/code> —, bet vārdtelpas mehānisms katrā gadījumā ir vienāds.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Пакет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И переменная, и подпрограмма объявлены с <code>our<\/code>, поэтому обе становятся частью пространства имён <code>Temperature<\/code> и доступны извне.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">К переменной обращаются как <code>$Temperature::freezing<\/code> — сигил, имя пакета, затем имя переменной, — а подпрограмма вызывается как <code>Temperature::fahrenheit(100)<\/code>. Преобразование <code>100<\/code> даёт <code>100 * 9/5 + 32<\/code>, что равно <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Простой <code>package<\/code> предоставляет только пространство имён. Для повторно используемой библиотеки мы бы использовали <code>module<\/code>, а когда дело доходит до объектов — <code>class<\/code>, но механизм пространства имён во всех случаях одинаков.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Пакунок","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І змінну, і підпрограму оголошено через <code>our<\/code>, тож обидві стають частиною простору імен <code>Temperature<\/code> й доступні ззовні.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">До змінної дістаються як <code>$Temperature::freezing<\/code> — сигіл, ім'я пакунка, потім ім'я змінної, — а підпрограму викликають як <code>Temperature::fahrenheit(100)<\/code>. Переведення <code>100<\/code> дає <code>100 * 9/5 + 32<\/code>, тобто <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Звичайний <code>package<\/code> дає лише простір імен. Для придатної до повторного використання бібліотеки ми взяли б <code>module<\/code>, а коли на кону об'єкти — <code>class<\/code>, але механізм простору імен у кожному з випадків той самий.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Пакет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И променливата, и подпрограмата са декларирани с <code>our<\/code>, така че и двете стават част от пространството от имена <code>Temperature<\/code> и са достъпни отвън.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Променливата се достъпва като <code>$Temperature::freezing<\/code> — сигил, име на пакета, след това име на променливата — докато подпрограмата се извиква като <code>Temperature::fahrenheit(100)<\/code>. Преобразуването на <code>100<\/code> дава <code>100 * 9/5 + 32<\/code>, което е <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обикновеният <code>package<\/code> предоставя само пространството от имена. За преизползваема библиотека бихме използвали <code>module<\/code> вместо това — а след като обектите влязат в играта, <code>class<\/code> — но механизмът на пространството от имена е един и същ във всеки случай.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Pako","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kaj la variablo kaj la subrutino estas deklaritaj per <code>our<\/code>, do ambaŭ fariĝas parto de la nomspaco <code>Temperature<\/code> kaj estas atingeblaj de ekstere.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La variablo estas atingata kiel <code>$Temperature::freezing<\/code> — sigelo, paka nomo, poste variabla nomo — dum la subrutino estas vokata kiel <code>Temperature::fahrenheit(100)<\/code>. Konverti <code>100<\/code> donas <code>100 * 9/5 + 32<\/code>, kio estas <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simpla <code>package<\/code> provizas nur la nomspacon. Por reuzebla biblioteko ni estus uzintaj <code>module<\/code> anstataŭe — kaj, kiam objektoj estas en la ludo, <code>class<\/code> — sed la nomspaca mekanismo estas la sama en ĉiu kazo.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Fasciculus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tam variabilis quam subroutina cum <code>our<\/code> declaratae sunt, itaque ambae partes spatii nominum <code>Temperature<\/code> fiunt et ab extra attingibiles sunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Variabilis attingitur ut <code>$Temperature::freezing<\/code> — sigillum, nomen fasciculi, deinde nomen variabilis — dum subroutina vocatur ut <code>Temperature::fahrenheit(100)<\/code>. Conversio <code>100<\/code> dat <code>100 * 9/5 + 32<\/code>, quod est <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simplex <code>package<\/code> tantum spatium nominum praebet. Pro bibliotheca reusabili <code>module<\/code> adhibuissemus — et, cum obiecta in promptu sunt, <code>class<\/code> — sed mechanismus spatii nominum in unoquoque casu idem est.<\/span><\/li><\/ol>"]]}}}</script>
