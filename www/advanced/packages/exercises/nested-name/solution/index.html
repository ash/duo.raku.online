<script type="application/json" id="page-data">{"u":"advanced/packages/exercises/nested-name/solution","n":732,"k":"solution","pv":"advanced/packages/exercises/nested-name","nx":"advanced/distributing","tr":["advanced","advanced/packages"],"L":{"en":{"t":"The solution of ’A nested name‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nesting one namespace inside another builds a longer <code>::<\/code> path. Both the variable and the subroutine live two levels deep, in <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The full name <code>$Outer::Inner::base<\/code> reaches the variable, and <code>Outer::Inner::doubled()<\/code> reaches the subroutine through the same two levels. A sub name carries no sigil, so unlike the variable it has no <code>$<\/code> in front.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both members are declared with <code>our<\/code>, which is what makes them visible outside their module. A <code>my<\/code> declaration would have kept them private to <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein verschachtelter Name","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Verschachteln eines Namensraums in einem anderen ergibt einen längeren <code>::<\/code>-Pfad. Sowohl die Variable als auch die Subroutine befinden sich zwei Ebenen tief in <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der vollständige Name <code>$Outer::Inner::base<\/code> erreicht die Variable, und <code>Outer::Inner::doubled()<\/code> erreicht die Subroutine über dieselben zwei Ebenen. Ein Subroutinenname hat kein Sigil, daher steht im Gegensatz zur Variable kein <code>$<\/code> davor.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Mitglieder sind mit <code>our<\/code> deklariert, wodurch sie außerhalb ihres Moduls sichtbar werden. Eine <code>my<\/code>-Deklaration hätte sie privat in <code>Inner<\/code> gehalten.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een geneste naam","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het nesten van de ene naamruimte in de andere bouwt een langer <code>::<\/code>-pad op. Zowel de variabele als de subroutine bevinden zich twee niveaus diep, in <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De volledige naam <code>$Outer::Inner::base<\/code> bereikt de variabele, en <code>Outer::Inner::doubled()<\/code> bereikt de subroutine via dezelfde twee niveaus. Een subroutinenaam heeft geen sigil, dus in tegenstelling tot de variabele staat er geen <code>$<\/code> voor.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide leden zijn gedeclareerd met <code>our<\/code>, wat ze zichtbaar maakt buiten hun module. Een <code>my<\/code>-declaratie zou ze priv&eacute; hebben gehouden binnen <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un nombre anidado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anidar un espacio de nombres dentro de otro construye una ruta <code>::<\/code> más larga. Tanto la variable como la subrutina están a dos niveles de profundidad, en <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El nombre completo <code>$Outer::Inner::base<\/code> accede a la variable, y <code>Outer::Inner::doubled()<\/code> accede a la subrutina a través de los mismos dos niveles. El nombre de una subrutina no lleva sigilo, por lo que a diferencia de la variable no tiene un <code>$<\/code> delante.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambos miembros se declaran con <code>our<\/code>, que es lo que los hace visibles fuera de su módulo. Una declaración con <code>my<\/code> los habría mantenido privados dentro de <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un nome annidato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione al compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Annidare un namespace all'interno di un altro costruisce un percorso <code>::<\/code> più lungo. Sia la variabile che la subroutine si trovano a due livelli di profondità, in <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il nome completo <code>$Outer::Inner::base<\/code> raggiunge la variabile, e <code>Outer::Inner::doubled()<\/code> raggiunge la subroutine attraverso gli stessi due livelli. Il nome di una sub non ha sigillo, quindi a differenza della variabile non ha <code>$<\/code> davanti.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Entrambi i membri sono dichiarati con <code>our<\/code>, che è ciò che li rende visibili fuori dal loro modulo. Una dichiarazione <code>my<\/code> li avrebbe mantenuti privati all'interno di <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Ligzdots nosaukums","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens no iespējamiem uzdevuma risinājumiem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Šīs programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vienas vārdtelpas ievietošana otrā veido garāku <code>::<\/code> ceļu. Gan mainīgais, gan apakšprogramma atrodas divos līmeņos dziļi, vārdtelpā <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pilnais nosaukums <code>$Outer::Inner::base<\/code> sasniedz mainīgo, un <code>Outer::Inner::doubled()<\/code> sasniedz apakšprogrammu caur tiem pašiem diviem līmeņiem. Apakšprogrammas nosaukumam nav sigila, tāpēc atšķirībā no mainīgā tam priekšā nav <code>$<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abi elementi ir deklarēti ar <code>our<\/code>, kas padara tos redzamus ārpus to moduļa. Deklarācija ar <code>my<\/code> būtu padarījusi tos privātus modulim <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Вложенное имя","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вложение одного пространства имён в другое строит более длинный путь <code>::<\/code>. И переменная, и подпрограмма находятся на двух уровнях вложенности, в <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Полное имя <code>$Outer::Inner::base<\/code> обращается к переменной, а <code>Outer::Inner::doubled()<\/code> обращается к подпрограмме через те же два уровня. Имя подпрограммы не несёт сигила, поэтому, в отличие от переменной, перед ним нет <code>$<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оба члена объявлены с <code>our<\/code>, что делает их видимыми за пределами их модуля. Объявление с <code>my<\/code> сохранило бы их приватными для <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Вкладене ім'я","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вкладення одного простору імен в інший будує довший шлях із <code>::<\/code>. І змінна, і підпрограма живуть на два рівні вглиб, у <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Повне ім'я <code>$Outer::Inner::base<\/code> дістає змінну, а <code>Outer::Inner::doubled()<\/code> дістає підпрограму через ті самі два рівні. Ім'я підпрограми не несе сигіла, тож, на відміну від змінної, перед ним немає <code>$<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидва члени оголошено через <code>our<\/code>, — саме це й робить їх видимими за межами їхнього модуля. Оголошення через <code>my<\/code> лишило б їх приватними для <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Вложено име","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Влагането на едно пространство от имена вътре в друго изгражда по-дълъг път с <code>::<\/code>. И променливата, и подпрограмата се намират на две нива навътре, в <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пълното име <code>$Outer::Inner::base<\/code> достига до променливата, а <code>Outer::Inner::doubled()<\/code> достига до подпрограмата чрез същите две нива. Името на подпрограмата не носи сигил, така че за разлика от променливата няма <code>$<\/code> отпред.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата члена са декларирани с <code>our<\/code>, което ги прави видими извън техния модул. Декларация с <code>my<\/code> би ги запазила частни за <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Nomen nidificatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce solutio possibilis huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Egressus<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nidificatio unius spatii nominum intra alterum longiorem viam <code>::<\/code> aedificat. Tam variabilis quam subroutina duobus nivellis profunde habitant, in <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nomen plenum <code>$Outer::Inner::base<\/code> variabilem attingit, et <code>Outer::Inner::doubled()<\/code> subroutinam per eosdem duos nivellos attingit. Nomen subroutinae sigillum non habet, itaque dissimiliter a variabili <code>$<\/code> ante se non habet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambo membra cum <code>our<\/code> declarata sunt, quod ea extra modulum suum visibilia facit. Declaratio <code>my<\/code> ea intra <code>Inner<\/code> privata servavisset.<\/span><\/li><\/ol>"]]}}}</script>
