<script type="application/json" id="page-data">{"u":"advanced/packages/packages-modules","n":723,"k":"topic","pv":"advanced/packages","nx":"advanced/packages/packages-modules/quiz","tr":["advanced","advanced/packages"],"L":{"en":{"t":"Packages and modules","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>package<\/code> keyword introduces a namespace.<\/span> <span class=\"sg\" data-s=\"1\">Anything declared inside it with <code>our<\/code> becomes part of that namespace and can be reached from outside through the package’s name and the <code>::<\/code> separator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable is reached as <code>$Maths::pi<\/code> — the sigil, then the package name, then the variable name.<\/span> <span class=\"sg\" data-s=\"1\">A subroutine is called as <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Both <code>package<\/code> and <code>module<\/code> create a namespace; they differ in what else they do.<\/span> <span class=\"sg\" data-s=\"1\">A <code>module<\/code> is the usual choice for a unit of reusable code, while a plain <code>package<\/code> is just the namespace with nothing extra. (A <code>class<\/code>, which you will meet in <a href=\"/oop/\">the next part<\/a>, creates a namespace too and adds object-oriented machinery on top.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So the namespace you have been getting from <code>module<\/code> is the same mechanism a <code>package<\/code> provides on its own.<\/span> <span class=\"sg\" data-s=\"1\">Choosing between them is mostly about intent: <code>module<\/code> for libraries, <code>package<\/code> for a bare namespace — and, once you reach objects, <code>class<\/code> for types.<\/span><\/p>"]]},"de":{"t":"Pakete und Module","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Schlüsselwort <code>package<\/code> führt einen Namensraum ein.<\/span> <span class=\"sg\" data-s=\"1\">Alles, was darin mit <code>our<\/code> deklariert wird, wird Teil dieses Namensraums und kann von außen über den Package-Namen und den <code>::<\/code>-Trenner erreicht werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable wird als <code>$Maths::pi<\/code> erreicht — das Sigil, dann der Package-Name, dann der Variablenname.<\/span> <span class=\"sg\" data-s=\"1\">Eine Subroutine wird als <code>Maths::double(...)<\/code> aufgerufen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sowohl <code>package<\/code> als auch <code>module<\/code> erzeugen einen Namensraum; sie unterscheiden sich darin, was sie darüber hinaus tun.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>module<\/code> ist die übliche Wahl für eine Einheit wiederverwendbaren Codes, während ein einfaches <code>package<\/code> nur der Namensraum ohne Extras ist. (Eine <code>class<\/code>, die du im <a href=\"https://course.raku.org/de/oop/\" target=\"_blank\" rel=\"noopener\">nächsten Teil<\/a> kennenlernen wirst, erzeugt ebenfalls einen Namensraum und fügt zusätzlich objektorientierte Mechanismen hinzu.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Namensraum, den du bisher von <code>module<\/code> erhalten hast, ist also derselbe Mechanismus, den ein <code>package<\/code> allein bereitstellt.<\/span> <span class=\"sg\" data-s=\"1\">Die Wahl zwischen ihnen ist hauptsächlich eine Frage der Absicht: <code>module<\/code> für Bibliotheken, <code>package<\/code> für einen reinen Namensraum — und, sobald du bei Objekten angekommen bist, <code>class<\/code> für Typen.<\/span><\/p>"]]},"nl":{"t":"Pakketten en modules","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het sleutelwoord <code>package<\/code> introduceert een naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Alles wat erin gedeclareerd wordt met <code>our<\/code> wordt onderdeel van die naamruimte en is van buitenaf bereikbaar via de naam van het pakket en het <code>::<\/code>-scheidingsteken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele wordt benaderd als <code>$Maths::pi<\/code> — het sigil, dan de pakketnaam, dan de variabelenaam.<\/span> <span class=\"sg\" data-s=\"1\">Een subroutine wordt aangeroepen als <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zowel <code>package<\/code> als <code>module<\/code> maken een naamruimte aan; ze verschillen in wat ze verder doen.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>module<\/code> is de gebruikelijke keuze voor een herbruikbare code-eenheid, terwijl een gewoon <code>package<\/code> alleen de naamruimte biedt zonder extra's. (Een <code>class<\/code>, die je leert kennen in <a href=\"https://course.raku.org/nl/oop/\" target=\"_blank\" rel=\"noopener\">het volgende deel<\/a>, maakt ook een naamruimte aan en voegt daar objectgeorienteerde functionaliteit aan toe.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De naamruimte die je van <code>module<\/code> hebt gekregen is dus hetzelfde mechanisme dat een <code>package<\/code> op zichzelf biedt.<\/span> <span class=\"sg\" data-s=\"1\">De keuze ertussen is vooral een kwestie van intentie: <code>module<\/code> voor bibliotheken, <code>package<\/code> voor een kale naamruimte — en zodra je bij objecten komt, <code>class<\/code> voor typen.<\/span><\/p>"]]},"es":{"t":"Paquetes y módulos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La palabra clave <code>package<\/code> introduce un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Todo lo que se declare dentro de él con <code>our<\/code> pasa a formar parte de ese espacio de nombres y puede ser accedido desde afuera a través del nombre del paquete y el separador <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable se accede como <code>$Maths::pi<\/code> — el sigilo, luego el nombre del paquete y después el nombre de la variable.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina se llama como <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tanto <code>package<\/code> como <code>module<\/code> crean un espacio de nombres; difieren en lo que hacen adicionalmente.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>module<\/code> es la opción habitual para una unidad de código reutilizable, mientras que un <code>package<\/code> simple es solo el espacio de nombres sin nada extra. (Una <code>class<\/code>, que conocerás en <a href=\"https://course.raku.org/es/oop/\" target=\"_blank\" rel=\"noopener\">la siguiente parte<\/a>, también crea un espacio de nombres y agrega la maquinaria de programación orientada a objetos encima.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que el espacio de nombres que has estado obteniendo de <code>module<\/code> es el mismo mecanismo que un <code>package<\/code> proporciona por sí solo.<\/span> <span class=\"sg\" data-s=\"1\">Elegir entre ellos es principalmente una cuestión de intención: <code>module<\/code> para bibliotecas, <code>package<\/code> para un espacio de nombres básico — y, una vez que llegues a los objetos, <code>class<\/code> para tipos.<\/span><\/p>"]]},"it":{"t":"Pacchetti e moduli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La parola chiave <code>package<\/code> introduce un namespace.<\/span> <span class=\"sg\" data-s=\"1\">Tutto ciò che viene dichiarato al suo interno con <code>our<\/code> diventa parte di quel namespace e può essere raggiunto dall'esterno tramite il nome del package e il separatore <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile viene raggiunta come <code>$Maths::pi<\/code> — il sigillo, poi il nome del package, poi il nome della variabile.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine viene chiamata come <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sia <code>package<\/code> che <code>module<\/code> creano un namespace; differiscono in ciò che fanno in più.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>module<\/code> è la scelta abituale per un'unità di codice riutilizzabile, mentre un semplice <code>package<\/code> è solo il namespace senza nient'altro. (Una <code>class<\/code>, che incontrerai nella <a href=\"https://course.raku.org/it/oop/\" target=\"_blank\" rel=\"noopener\">prossima parte<\/a>, crea anch'essa un namespace e aggiunge il meccanismo orientato agli oggetti.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi il namespace che hai ottenuto da <code>module<\/code> è lo stesso meccanismo che un <code>package<\/code> fornisce da solo.<\/span> <span class=\"sg\" data-s=\"1\">La scelta tra i due è principalmente una questione di intento: <code>module<\/code> per le librerie, <code>package<\/code> per un namespace puro — e, una volta arrivati agli oggetti, <code>class<\/code> per i tipi.<\/span><\/p>"]]},"lv":{"t":"Pakotnes un moduļi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Atslēgvārds <code>package<\/code> ievieš vārdtelpu.<\/span> <span class=\"sg\" data-s=\"1\">Viss, kas tajā deklarēts ar <code>our<\/code>, kļūst par šīs vārdtelpas daļu un ir sasniedzams no ārpuses, izmantojot pakotnes nosaukumu un <code>::<\/code> atdalītāju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgajam piekļūst kā <code>$Maths::pi<\/code> — sigils, tad pakotnes nosaukums, tad mainīgā nosaukums.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogrammu izsauc kā <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gan <code>package<\/code>, gan <code>module<\/code> izveido vārdtelpu; tie atšķiras ar to, ko vēl papildus dara.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> ir parastā izvēle atkārtoti lietojamam kodam, savukārt vienkāršs <code>package<\/code> ir tikai vārdtelpa bez papildinājumiem. (<code>class<\/code>, ar kuru iepazīsieties <a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">nākamajā daļā<\/a>, arī izveido vārdtelpu un papildus pievieno objektorientēto mehānismu.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad vārdtelpa, ko jūs saņēmāt no <code>module<\/code>, ir tas pats mehānisms, ko <code>package<\/code> nodrošina pats par sevi.<\/span> <span class=\"sg\" data-s=\"1\">Izvēle starp tiem lielākoties ir par nodomu: <code>module<\/code> bibliotēkām, <code>package<\/code> tīrai vārdtelpai — un, kad nonākat pie objektiem, <code>class<\/code> tipiem.<\/span><\/p>"]]},"ru":{"t":"Пакеты и модули","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ключевое слово <code>package<\/code> вводит пространство имён.<\/span> <span class=\"sg\" data-s=\"1\">Всё, что объявлено внутри него с помощью <code>our<\/code>, становится частью этого пространства имён и может быть доступно извне через имя пакета и разделитель <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">К переменной обращаются как <code>$Maths::pi<\/code> — сигил, затем имя пакета, затем имя переменной.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограмма вызывается как <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И <code>package<\/code>, и <code>module<\/code> создают пространство имён; они различаются тем, что ещё они делают.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> — обычный выбор для единицы повторно используемого кода, тогда как простой <code>package<\/code> — это просто пространство имён без ничего лишнего. (<code>class<\/code>, с которым вы познакомитесь в <a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">следующей части<\/a>, тоже создаёт пространство имён и добавляет поверх него объектно-ориентированный механизм.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таким образом, пространство имён, которое вы получали от <code>module<\/code>, — это тот же механизм, который <code>package<\/code> предоставляет сам по себе.<\/span> <span class=\"sg\" data-s=\"1\">Выбор между ними — в основном вопрос намерения: <code>module<\/code> для библиотек, <code>package<\/code> для простого пространства имён, а когда дело доходит до объектов — <code>class<\/code> для типов.<\/span><\/p>"]]},"uk":{"t":"Пакунки та модулі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ключове слово <code>package<\/code> вводить простір імен.<\/span> <span class=\"sg\" data-s=\"1\">Усе, оголошене всередині нього через <code>our<\/code>, стає частиною цього простору імен, і до нього можна дістатися ззовні через ім'я пакунка та роздільник <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До змінної дістаються як <code>$Maths::pi<\/code> — сигіл, потім ім'я пакунка, потім ім'я змінної.<\/span> <span class=\"sg\" data-s=\"1\">Підпрограму викликають як <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">І <code>package<\/code>, і <code>module<\/code> створюють простір імен; вони різняться тим, що роблять понад це.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> є звичним вибором для одиниці повторно використовуваного коду, тоді як звичайний <code>package<\/code> — це просто простір імен без нічого зайвого. (<code>class<\/code>, з яким ви познайомитеся в <a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">наступній частині<\/a>, теж створює простір імен і додає згори об'єктно-орієнтовану механіку.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, простір імен, який ви досі отримували від <code>module<\/code>, є тим самим механізмом, що його <code>package<\/code> дає сам по собі.<\/span> <span class=\"sg\" data-s=\"1\">Вибір між ними здебільшого стосується наміру: <code>module<\/code> — для бібліотек, <code>package<\/code> — для голого простору імен, а коли дійде до об'єктів, <code>class<\/code> — для типів.<\/span><\/p>"]]},"bg":{"t":"Пакети и модули","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ключовата дума <code>package<\/code> въвежда пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Всичко, декларирано вътре в него с <code>our<\/code>, става част от това пространство от имена и може да бъде достъпно отвън чрез името на пакета и разделителя <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата се достъпва като <code>$Maths::pi<\/code> — сигилът, след това името на пакета, след това името на променливата.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограма се извиква като <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И <code>package<\/code>, и <code>module<\/code> създават пространство от имена; те се различават по това какво друго правят.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> е обичайният избор за единица от преизползваем код, докато обикновеният <code>package<\/code> е просто пространство от имена без нищо допълнително. (<code>class<\/code>, който ще срещнете в <a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">следващата част<\/a>, също създава пространство от имена и добавя обектно-ориентирана машинария отгоре.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така че пространството от имена, което сте получавали от <code>module<\/code>, е същият механизъм, който <code>package<\/code> предоставя сам по себе си.<\/span> <span class=\"sg\" data-s=\"1\">Изборът между тях е предимно въпрос на намерение: <code>module<\/code> за библиотеки, <code>package<\/code> за голо пространство от имена — а след като стигнете до обекти, <code>class<\/code> за типове.<\/span><\/p>"]]},"la":{"t":"Fasciculi et moduli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Verbum clave <code>package<\/code> spatium nominum introducit.<\/span> <span class=\"sg\" data-s=\"1\">Quidquid intra id cum <code>our<\/code> declaratur, pars illius spatii nominum fit et ab extra per nomen fasciculi et separatorem <code>::<\/code> attingi potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis attingitur ut <code>$Maths::pi<\/code> — sigillum, deinde nomen fasciculi, deinde nomen variabilis.<\/span> <span class=\"sg\" data-s=\"1\">Subroutina vocatur ut <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tam <code>package<\/code> quam <code>module<\/code> spatium nominum creant; differunt in eo quod praeterea faciunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> est electio usitata pro unitate codicis reusabilis, dum simplex <code>package<\/code> tantum spatium nominum est sine additamentis. (<code>class<\/code>, quam in <a href=\"/oop/\">parte sequente<\/a> invenies, spatium nominum quoque creat et machinam obiectorum addit.)<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque spatium nominum quod a <code>module<\/code> accepisti idem mechanismum est quod <code>package<\/code> per se praebet.<\/span> <span class=\"sg\" data-s=\"1\">Electio inter ea maxime de proposito est: <code>module<\/code> pro bibliothecis, <code>package<\/code> pro spatio nominum nudo — et, cum ad obiecta perveneris, <code>class<\/code> pro typis.<\/span><\/p>"]]}}}</script>
