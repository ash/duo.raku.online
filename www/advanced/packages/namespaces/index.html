<script type="application/json" id="page-data">{"u":"advanced/packages/namespaces","n":725,"k":"topic","pv":"advanced/packages/packages-modules/quiz","nx":"advanced/packages/exercises","tr":["advanced","advanced/packages"],"L":{"en":{"t":"Namespaces and our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>our<\/code> declarator is what makes something visible in its namespace.<\/span> <span class=\"sg\" data-s=\"1\">A variable declared with <code>my<\/code> is lexical — private to its block — whereas one declared with <code>our<\/code> is also a package variable, reachable from outside through the <code>::<\/code> path:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> works because <code>count<\/code> was declared with <code>our<\/code>; <code>$Counter::secret<\/code> would fail, because <code>secret<\/code> is lexical.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Namespaces can <strong>nest<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">A package inside a package builds a longer <code>::<\/code> path:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The full name <code>$Outer::Inner::val<\/code> walks from the outer namespace, into the inner one, to the variable.<\/span> <span class=\"sg\" data-s=\"1\">This is exactly how the standard library is organised — names like <code>IO::Socket::INET<\/code> are nested namespaces — and how a module you write groups its parts under one top-level name.<\/span><\/p>"]]},"de":{"t":"Namensräume und our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>our<\/code>-Deklarator macht etwas in seinem Namensraum sichtbar.<\/span> <span class=\"sg\" data-s=\"1\">Eine mit <code>my<\/code> deklarierte Variable ist lexikalisch — privat für ihren Block — während eine mit <code>our<\/code> deklarierte Variable auch eine Package-Variable ist, die von außen über den <code>::<\/code>-Pfad erreichbar ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funktioniert, weil <code>count<\/code> mit <code>our<\/code> deklariert wurde; <code>$Counter::secret<\/code> würde fehlschlagen, weil <code>secret<\/code> lexikalisch ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Namensräume können <strong>verschachtelt<\/strong> werden.<\/span> <span class=\"sg\" data-s=\"1\">Ein Package innerhalb eines Packages ergibt einen längeren <code>::<\/code>-Pfad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der vollständige Name <code>$Outer::Inner::val<\/code> navigiert vom äußeren Namensraum in den inneren zur Variable.<\/span> <span class=\"sg\" data-s=\"1\">Genau so ist die Standardbibliothek organisiert — Namen wie <code>IO::Socket::INET<\/code> sind verschachtelte Namensräume — und so gruppiert ein von dir geschriebenes Modul seine Teile unter einem übergeordneten Namen.<\/span><\/p>"]]},"nl":{"t":"Naamruimten en our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>our<\/code>-declarator is wat iets zichtbaar maakt in zijn naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele gedeclareerd met <code>my<\/code> is lexicaal — priv&eacute; voor zijn blok — terwijl een variabele gedeclareerd met <code>our<\/code> ook een pakketvariabele is, bereikbaar van buitenaf via het <code>::<\/code>-pad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> werkt omdat <code>count<\/code> gedeclareerd is met <code>our<\/code>; <code>$Counter::secret<\/code> zou mislukken, omdat <code>secret<\/code> lexicaal is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Naamruimten kunnen <strong>genest<\/strong> worden.<\/span> <span class=\"sg\" data-s=\"1\">Een pakket binnen een pakket bouwt een langer <code>::<\/code>-pad op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volledige naam <code>$Outer::Inner::val<\/code> loopt van de buitenste naamruimte, naar de binnenste, tot aan de variabele.<\/span> <span class=\"sg\" data-s=\"1\">Dit is precies hoe de standaardbibliotheek is georganiseerd — namen zoals <code>IO::Socket::INET<\/code> zijn geneste naamruimten — en hoe een module die je schrijft zijn onderdelen groepeert onder een naam op het hoogste niveau.<\/span><\/p>"]]},"es":{"t":"Espacios de nombres y our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El declarador <code>our<\/code> es lo que hace que algo sea visible en su espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Una variable declarada con <code>my<\/code> es léxica — privada a su bloque — mientras que una declarada con <code>our<\/code> es también una variable de paquete, accesible desde afuera a través de la ruta <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funciona porque <code>count<\/code> fue declarada con <code>our<\/code>; <code>$Counter::secret<\/code> fallaría, porque <code>secret<\/code> es léxica.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los espacios de nombres pueden <strong>anidarse<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Un paquete dentro de otro paquete construye una ruta <code>::<\/code> más larga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El nombre completo <code>$Outer::Inner::val<\/code> recorre desde el espacio de nombres externo, hacia el interno, hasta la variable.<\/span> <span class=\"sg\" data-s=\"1\">Así es exactamente como está organizada la biblioteca estándar — nombres como <code>IO::Socket::INET<\/code> son espacios de nombres anidados — y cómo un módulo que escribas agrupa sus partes bajo un nombre de nivel superior.<\/span><\/p>"]]},"it":{"t":"Namespace e our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il dichiaratore <code>our<\/code> è ciò che rende qualcosa visibile nel suo namespace.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile dichiarata con <code>my<\/code> è lessicale — privata al suo blocco — mentre una dichiarata con <code>our<\/code> è anche una variabile di package, raggiungibile dall'esterno attraverso il percorso <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funziona perché <code>count<\/code> è stata dichiarata con <code>our<\/code>; <code>$Counter::secret<\/code> fallirebbe, perché <code>secret<\/code> è lessicale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I namespace possono essere <strong>annidati<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Un package all'interno di un altro package costruisce un percorso <code>::<\/code> più lungo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il nome completo <code>$Outer::Inner::val<\/code> parte dal namespace esterno, entra in quello interno e arriva alla variabile.<\/span> <span class=\"sg\" data-s=\"1\">È esattamente così che è organizzata la libreria standard — nomi come <code>IO::Socket::INET<\/code> sono namespace annidati — ed è il modo in cui un modulo che scrivi raggruppa le sue parti sotto un unico nome di primo livello.<\/span><\/p>"]]},"lv":{"t":"Vārdtelpas un our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Deklarators <code>our<\/code> padara kaut ko redzamu tā vārdtelpā.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais, kas deklarēts ar <code>my<\/code>, ir leksisks — privāts savam blokam —, savukārt mainīgais, kas deklarēts ar <code>our<\/code>, ir arī pakotnes mainīgais, sasniedzams no ārpuses caur <code>::<\/code> ceļu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> darbojas, jo <code>count<\/code> tika deklarēts ar <code>our<\/code>; <code>$Counter::secret<\/code> nedarbotos, jo <code>secret<\/code> ir leksisks.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vārdtelpas var būt <strong>ligzdotas<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Pakotne pakotnes iekšienē veido garāku <code>::<\/code> ceļu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pilnais nosaukums <code>$Outer::Inner::val<\/code> ved no ārējās vārdtelpas uz iekšējo un līdz mainīgajam.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tā ir organizēta standarta bibliotēka — nosaukumi kā <code>IO::Socket::INET<\/code> ir ligzdotas vārdtelpas —, un tieši tā modulis, ko jūs rakstāt, grupē savas daļas zem viena augstākā līmeņa nosaukuma.<\/span><\/p>"]]},"ru":{"t":"Пространства имён и our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Декларатор <code>our<\/code> делает что-либо видимым в его пространстве имён.<\/span> <span class=\"sg\" data-s=\"1\">Переменная, объявленная с помощью <code>my<\/code>, является лексической — приватной для своего блока, — тогда как переменная, объявленная с помощью <code>our<\/code>, также является переменной пакета, доступной извне через путь <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> работает, потому что <code>count<\/code> была объявлена с <code>our<\/code>; <code>$Counter::secret<\/code> вызвало бы ошибку, потому что <code>secret<\/code> является лексической переменной.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пространства имён могут быть <strong>вложенными<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Пакет внутри пакета строит более длинный путь <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Полное имя <code>$Outer::Inner::val<\/code> проходит от внешнего пространства имён через внутреннее к переменной.<\/span> <span class=\"sg\" data-s=\"1\">Именно так организована стандартная библиотека — имена вроде <code>IO::Socket::INET<\/code> являются вложенными пространствами имён — и именно так модуль, написанный вами, группирует свои части под одним именем верхнего уровня.<\/span><\/p>"]]},"uk":{"t":"Простори імен та our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме декларатор <code>our<\/code> робить щось видимим у своєму просторі імен.<\/span> <span class=\"sg\" data-s=\"1\">Змінна, оголошена через <code>my<\/code>, є лексичною — приватною для свого блоку, — тоді як оголошена через <code>our<\/code> є ще й змінною пакунка, до якої можна дістатися ззовні через шлях із <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # змінна пакунка\n    my  $secret = 42; # лексична, ззовні не видима\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> працює, бо <code>count<\/code> оголошено через <code>our<\/code>; <code>$Counter::secret<\/code> зазнав би невдачі, бо <code>secret<\/code> є лексичною.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Простори імен можуть <strong>вкладатися<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Пакунок усередині пакунка будує довший шлях із <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Повне ім'я <code>$Outer::Inner::val<\/code> проходить від зовнішнього простору імен усередину внутрішнього до змінної.<\/span> <span class=\"sg\" data-s=\"1\">Саме так організовано стандартну бібліотеку — імена на кшталт <code>IO::Socket::INET<\/code> є вкладеними просторами імен — і саме так написаний вами модуль групує свої частини під одним іменем верхнього рівня.<\/span><\/p>"]]},"bg":{"t":"Пространства от имена и our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Декларацията <code>our<\/code> е това, което прави нещо видимо в неговото пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Променлива, декларирана с <code>my<\/code>, е лексикална — частна за своя блок — докато променлива, декларирана с <code>our<\/code>, е също и пакетна променлива, достъпна отвън чрез пътя с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> работи, защото <code>count<\/code> е декларирана с <code>our<\/code>; <code>$Counter::secret<\/code> ще се провали, защото <code>secret<\/code> е лексикална.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пространствата от имена могат да бъдат <strong>вложени<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Пакет вътре в пакет изгражда по-дълъг път с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пълното име <code>$Outer::Inner::val<\/code> минава от външното пространство от имена, навътре във вътрешното, до променливата.<\/span> <span class=\"sg\" data-s=\"1\">Точно така е организирана стандартната библиотека — имена като <code>IO::Socket::INET<\/code> са вложени пространства от имена — и по този начин модул, който пишете, групира частите си под едно име от най-високо ниво.<\/span><\/p>"]]},"la":{"t":"Spatia nominum et our","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Declarator <code>our<\/code> id facit quod aliquid in suo spatio nominum visibile sit.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis declarata cum <code>my<\/code> lexicalis est — privata suo blocco — dum variabilis declarata cum <code>our<\/code> etiam variabilis fasciculi est, ab extra per viam <code>::<\/code> attingibilis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> operatur quia <code>count<\/code> cum <code>our<\/code> declarata est; <code>$Counter::secret<\/code> falleret, quia <code>secret<\/code> lexicalis est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Spatia nominum <strong>nidificari<\/strong> possunt.<\/span> <span class=\"sg\" data-s=\"1\">Fasciculus intra fasciculum longiorem viam <code>::<\/code> aedificat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomen plenum <code>$Outer::Inner::val<\/code> ab exteriore spatio nominum per interiorem ad variabilem progreditur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est exacte quomodo bibliotheca ordinaria disposita est — nomina ut <code>IO::Socket::INET<\/code> sunt spatia nominum nidificata — et quomodo modulus a te scriptus partes suas sub uno nomine summo colligit.<\/span><\/p>"]]}}}</script>
