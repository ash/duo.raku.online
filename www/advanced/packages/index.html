<script type="application/json" id="page-data">{"u":"advanced/packages","n":722,"k":"section","pv":"advanced/installing-modules","nx":"advanced/packages/packages-modules","tr":["advanced"],"L":{"en":{"t":"Packages and namespaces","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <em>namespace<\/em> is a named container for other named things, such as variables and subroutines.<\/span> <span class=\"sg\" data-s=\"1\">It keeps names from colliding: <code>Maths::pi<\/code> and <code>Physics::pi<\/code> can both exist without clashing.<\/span> <span class=\"sg\" data-s=\"2\">A <em>package<\/em> is the most basic kind of namespace.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You have already used a namespace without naming it: every <code>module<\/code> creates one.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at packages directly, and at how <code>our<\/code> variables and the <code>::<\/code> separator let you reach into a namespace from outside.<\/span><\/p>"]]},"de":{"t":"Pakete und Namensräume","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Namensraum<\/em> (Namespace) ist ein benannter Behälter für andere benannte Dinge, wie Variablen und Subroutinen.<\/span> <span class=\"sg\" data-s=\"1\">Er verhindert Namenskollisionen: <code>Maths::pi<\/code> und <code>Physics::pi<\/code> können beide existieren, ohne sich gegenseitig zu stören.<\/span> <span class=\"sg\" data-s=\"2\">Ein <em>Package<\/em> ist die einfachste Art von Namensraum.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du hast bereits einen Namensraum verwendet, ohne ihn zu benennen: Jedes <code>module<\/code> erzeugt einen.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet Packages direkt und zeigt, wie <code>our<\/code>-Variablen und der <code>::<\/code>-Trenner es dir ermöglichen, von außen auf einen Namensraum zuzugreifen.<\/span><\/p>"]]},"nl":{"t":"Pakketten en naamruimten","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>naamruimte<\/em> (namespace) is een benoemde container voor andere benoemde zaken, zoals variabelen en subroutines.<\/span> <span class=\"sg\" data-s=\"1\">Het voorkomt dat namen met elkaar botsen: <code>Maths::pi<\/code> en <code>Physics::pi<\/code> kunnen allebei bestaan zonder conflicten.<\/span> <span class=\"sg\" data-s=\"2\">Een <em>pakket<\/em> (package) is het meest basale type naamruimte.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt al een naamruimte gebruikt zonder er een naam aan te geven: elke <code>module<\/code> maakt er een aan.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte kijkt direct naar pakketten, en naar hoe <code>our<\/code>-variabelen en het <code>::<\/code>-scheidingsteken je in staat stellen om van buitenaf een naamruimte te benaderen.<\/span><\/p>"]]},"es":{"t":"Paquetes y espacios de nombres","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>espacio de nombres<\/em> (namespace) es un contenedor con nombre para otros elementos con nombre, como variables y subrutinas.<\/span> <span class=\"sg\" data-s=\"1\">Mantiene los nombres separados para evitar colisiones: <code>Maths::pi<\/code> y <code>Physics::pi<\/code> pueden existir sin conflicto.<\/span> <span class=\"sg\" data-s=\"2\">Un <em>paquete<\/em> (package) es el tipo más básico de espacio de nombres.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya has utilizado un espacio de nombres sin nombrarlo: cada <code>module<\/code> crea uno.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección examina los paquetes directamente y cómo las variables <code>our<\/code> y el separador <code>::<\/code> te permiten acceder a un espacio de nombres desde afuera.<\/span><\/p>"]]},"it":{"t":"Pacchetti e namespace","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>namespace<\/em> è un contenitore con un nome per altri elementi con nome, come variabili e subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Impedisce ai nomi di entrare in conflitto: <code>Maths::pi<\/code> e <code>Physics::pi<\/code> possono coesistere senza problemi.<\/span> <span class=\"sg\" data-s=\"2\">Un <em>package<\/em> è il tipo più basilare di namespace.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai già utilizzato un namespace senza dargli un nome: ogni <code>module<\/code> ne crea uno.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione esamina i package direttamente e come le variabili <code>our<\/code> e il separatore <code>::<\/code> permettono di accedere a un namespace dall'esterno.<\/span><\/p>"]]},"lv":{"t":"Pakotnes un vārdtelpas 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Vārdtelpa<\/em> (namespace) ir nosaukts konteiners citām nosauktām lietām, piemēram, mainīgajiem un apakšprogrammām.<\/span> <span class=\"sg\" data-s=\"1\">Tā nodrošina, lai nosaukumi nekonfliktē: <code>Maths::pi<\/code> un <code>Physics::pi<\/code> var pastāvēt vienlaicīgi bez sadursmes. <em>Pakotne<\/em> (package) ir vienkāršākais vārdtelpas veids.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat izmantojuši vārdtelpu, to nenosaucot: katrs <code>module<\/code> izveido vienu.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā aplūkotas pakotnes tieši, kā arī tas, kā <code>our<\/code> mainīgie un <code>::<\/code> atdalītājs ļauj piekļūt vārdtelpai no ārpuses.<\/span><\/p>"]]},"ru":{"t":"Пакеты и пространства имён","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Пространство имён<\/em> — это именованный контейнер для других именованных сущностей, таких как переменные и подпрограммы.<\/span> <span class=\"sg\" data-s=\"1\">Оно предотвращает конфликты имён: <code>Maths::pi<\/code> и <code>Physics::pi<\/code> могут существовать одновременно, не мешая друг другу. <em>Пакет<\/em> — это самый базовый вид пространства имён.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали пространство имён, не называя его: каждый <code>module<\/code> создаёт такое пространство.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются пакеты напрямую, а также то, как переменные <code>our<\/code> и разделитель <code>::<\/code> позволяют обращаться к содержимому пространства имён извне.<\/span><\/p>"]]},"uk":{"t":"Пакунки та простори імен","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Простір імен<\/em> — це іменований контейнер для інших іменованих речей, як-от змінних і підпрограм.<\/span> <span class=\"sg\" data-s=\"1\">Він не дає іменам стикатися: <code>Maths::pi<\/code> та <code>Physics::pi<\/code> можуть існувати водночас, не конфліктуючи. <em>Пакунок<\/em> є найпростішим різновидом простору імен.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися простором імен, не називаючи його: кожен <code>module<\/code> створює такий.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає пакунки безпосередньо, а також те, як змінні <code>our<\/code> та роздільник <code>::<\/code> дозволяють дотягнутися до простору імен ззовні.<\/span><\/p>"]]},"bg":{"t":"Пакети и пространства от имена 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Пространството от имена<\/em> е именуван контейнер за други именувани неща, като променливи и подпрограми.<\/span> <span class=\"sg\" data-s=\"1\">То предотвратява сблъсъци на имена: <code>Maths::pi<\/code> и <code>Physics::pi<\/code> могат да съществуват едновременно без конфликт. <em>Пакетът<\/em> е най-основният вид пространство от имена.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали пространство от имена, без да го назовавате: всеки <code>module<\/code> създава такова.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда пакетите директно и как <code>our<\/code> променливите и разделителят <code>::<\/code> ви позволяват да достигнете до пространство от имена отвън.<\/span><\/p>"]]},"la":{"t":"Fasciculi et spatia nominum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Spatium nominum<\/em> est receptaculum nominatum aliarum rerum nominatarum, ut variabilium et subroutinarum.<\/span> <span class=\"sg\" data-s=\"1\">Nomina a collisione servat: <code>Maths::pi<\/code> et <code>Physics::pi<\/code> ambo exsistere possunt sine conflictu. <em>Fasciculus<\/em> (package) est genus spatii nominum maxime fundamentale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Spatium nominum iam sine nominatione adhibuisti: quaelibet <code>module<\/code> declaratio unum creat.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio fasciculos directe inspicit, et quomodo variabiles <code>our<\/code> et separator <code>::<\/code> tibi permittant in spatium nominum ab extra accedere.<\/span><\/p>"]]}}}</script>
