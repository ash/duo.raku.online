<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs","n":392,"k":"section","pv":"advanced/contexts/exercises/item-or-list/solution","nx":"advanced/subscript-adverbs/exists-and-delete","tr":["advanced"],"L":{"en":{"t":"Subscript adverbs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you subscript an array or a hash — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — you can attach an <em>adverb<\/em> to change what the subscript does.<\/span> <span class=\"sg\" data-s=\"1\">Instead of just fetching the value, you can ask whether a key exists, delete it, or get the key and the value together.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">These adverbs are written after the subscript with a colon, and they work the same way on both arrays and hashes.<\/span> <span class=\"sg\" data-s=\"1\">This section covers the most useful ones.<\/span><\/p>"]]},"de":{"t":"Subskript-Adverbien","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Array oder einen Hash indizierst — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — kannst du ein <em>Adverb<\/em> anhängen, um das Verhalten der Indizierung zu ändern.<\/span> <span class=\"sg\" data-s=\"1\">Anstatt nur den Wert abzurufen, kannst du abfragen, ob ein Schlüssel existiert, ihn löschen oder den Schlüssel und den Wert zusammen erhalten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Adverbien werden nach dem Index mit einem Doppelpunkt geschrieben und funktionieren sowohl bei Arrays als auch bei Hashes gleich.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt die nützlichsten davon.<\/span><\/p>"]]},"nl":{"t":"Subscript-adverbia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een array of een hash subscript — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — kun je een <em>adverb<\/em> toevoegen om te veranderen wat de subscript doet.<\/span> <span class=\"sg\" data-s=\"1\">In plaats van alleen de waarde op te halen, kun je vragen of een sleutel bestaat, hem verwijderen, of de sleutel en de waarde samen opvragen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze adverbs worden na de subscript geschreven met een dubbele punt, en ze werken op dezelfde manier bij zowel arrays als hashes.<\/span> <span class=\"sg\" data-s=\"1\">Dit deel behandelt de meest nuttige.<\/span><\/p>"]]},"es":{"t":"Adverbios de subíndice","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando accedes a un array o un hash mediante subíndice — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — puedes añadir un <em>adverbio<\/em> para cambiar lo que hace el subíndice.<\/span> <span class=\"sg\" data-s=\"1\">En lugar de simplemente obtener el valor, puedes preguntar si una clave existe, eliminarla u obtener la clave y el valor juntos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estos adverbios se escriben después del subíndice con dos puntos, y funcionan de la misma manera tanto en arrays como en hashes.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección cubre los más útiles.<\/span><\/p>"]]},"it":{"t":"Avverbi di subscript","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando accedi a un array o a un hash tramite indice — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — puoi aggiungere un <em>avverbio<\/em> per modificare il comportamento dell'accesso.<\/span> <span class=\"sg\" data-s=\"1\">Invece di ottenere semplicemente il valore, puoi chiedere se una chiave esiste, eliminarla, oppure ottenere la chiave e il valore insieme.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questi avverbi si scrivono dopo l'indice con i due punti e funzionano allo stesso modo sia per gli array che per gli hash.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione copre quelli più utili.<\/span><\/p>"]]},"lv":{"t":"Indeksa apzīmētāji 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad indeksējat masīvu vai jaukteni — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> —, indeksam var piekabināt <em>apstākļvārdu<\/em>, kas maina to, ko indekss dara.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā, lai tikai paņemtu vērtību, varat pajautāt, vai atslēga eksistē, dzēst to vai iegūt atslēgu un vērtību kopā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šie apstākļvārdi tiek rakstīti aiz indeksa ar kolu, un tie darbojas vienādi gan ar masīviem, gan ar jaukteņiem.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko noderīgākos no tiem.<\/span><\/p>"]]},"ru":{"t":"Наречия индексации","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы обращаетесь по индексу к массиву или хешу — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — вы можете добавить <em>наречие<\/em> (adverb), чтобы изменить поведение обращения.<\/span> <span class=\"sg\" data-s=\"1\">Вместо простого получения значения можно проверить, существует ли ключ, удалить его или получить ключ и значение одновременно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти наречия записываются после индекса через двоеточие и одинаково работают как с массивами, так и с хешами.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются наиболее полезные из них.<\/span><\/p>"]]},"uk":{"t":"Наріччя індексів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви індексуєте масив чи хеш — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code>, — до індексу можна причепити <em>наріччя<\/em>, щоб змінити те, що індекс робить.<\/span> <span class=\"sg\" data-s=\"1\">Замість просто дістати значення, ви можете запитати, чи існує ключ, видалити його або отримати ключ і значення разом.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ці наріччя записуються після індексу через двокрапку й працюють однаково і з масивами, і з хешами.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ охоплює найкорисніші з них.<\/span><\/p>"]]},"bg":{"t":"Наречия за индексиране 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато индексирате масив или хеш — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — можете да добавите <em>наречие<\/em> (adverb), за да промените какво прави индексирането.<\/span> <span class=\"sg\" data-s=\"1\">Вместо просто да извлича стойността, можете да попитате дали даден ключ съществува, да го изтриете или да получите ключа и стойността заедно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тези наречия се записват след индекса с двоеточие и работят по един и същи начин както за масиви, така и за хешове.<\/span> <span class=\"sg\" data-s=\"1\">В тази секция ще разгледаме най-полезните от тях.<\/span><\/p>"]]},"la":{"t":"Subscripti adverbia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum ordinem vel tabulam subscriptis — <code>@a[2]<\/code>, <code>%h&lt;key&gt;<\/code> — potes <em>adverbium<\/em> adiungere ut mutet quod subscriptum facit.<\/span> <span class=\"sg\" data-s=\"1\">Non solum valorem obtines, sed potes quaerere num clavis existat, eam delere, vel clavem et valorem simul accipere.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec adverbia post subscriptum cum duobus punctis scribuntur, et eodem modo in ordinibus et tabulis operantur.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio utilissima adverbia tractat.<\/span><\/p>"]]}}}</script>
