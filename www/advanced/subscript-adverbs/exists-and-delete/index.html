<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs/exists-and-delete","n":393,"k":"topic","pv":"advanced/subscript-adverbs","nx":"advanced/subscript-adverbs/exists-and-delete/quiz","tr":["advanced","advanced/subscript-adverbs"],"L":{"en":{"t":"Exists and delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>:exists<\/code> adverb turns a subscript into a question: is there a value at this key or index?<\/span> <span class=\"sg\" data-s=\"1\">It returns a Boolean without fetching anything:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is the right way to test for a key, because simply reading <code>%h&lt;plum&gt;<\/code> would either return an undefined value or, depending on the data, hide the difference between “missing” and “present but undefined”.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>:delete<\/code> adverb removes the entry and returns the value it held:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>apple<\/code> entry is gone, and the deleted value <code>1<\/code> is handed back so you can use it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Both adverbs work on arrays as well, by index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you are curious how the array will look like after a middle item is removed, here’s the answer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So a single, consistent notation lets you query and modify containers in place, rather than reaching for separate methods.<\/span><\/p>"]]},"de":{"t":"Exists und delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Adverb <code>:exists<\/code> verwandelt eine Indizierung in eine Frage: Gibt es einen Wert an diesem Schlüssel oder Index?<\/span> <span class=\"sg\" data-s=\"1\">Es gibt einen Boolean zurück, ohne etwas abzurufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies ist der richtige Weg, um auf einen Schlüssel zu prüfen, denn das einfache Lesen von <code>%h&lt;plum&gt;<\/code> würde entweder einen undefinierten Wert zurückgeben oder, je nach den Daten, den Unterschied zwischen \"fehlend\" und \"vorhanden, aber undefiniert\" verbergen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Adverb <code>:delete<\/code> entfernt den Eintrag und gibt den gespeicherten Wert zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Eintrag <code>apple<\/code> ist verschwunden, und der gelöschte Wert <code>1<\/code> wird zurückgegeben, sodass du ihn weiterverwenden kannst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide Adverbien funktionieren auch bei Arrays, über den Index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Falls du neugierig bist, wie das Array aussieht, nachdem ein mittleres Element entfernt wurde, hier ist die Antwort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine einheitliche Notation ermöglicht es dir also, Container direkt abzufragen und zu verändern, anstatt auf separate Methoden zurückzugreifen.<\/span><\/p>"]]},"nl":{"t":"Exists en delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>:exists<\/code> adverb verandert een subscript in een vraag: is er een waarde bij deze sleutel of index?<\/span> <span class=\"sg\" data-s=\"1\">Het retourneert een Boolean zonder iets op te halen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is de juiste manier om te testen op een sleutel, want het simpelweg lezen van <code>%h&lt;plum&gt;<\/code> zou een ongedefinieerde waarde retourneren of, afhankelijk van de data, het verschil verbergen tussen \"afwezig\" en \"aanwezig maar ongedefinieerd\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het <code>:delete<\/code> adverb verwijdert het item en retourneert de waarde die het bevatte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het <code>apple<\/code> item is verdwenen, en de verwijderde waarde <code>1<\/code> wordt teruggegeven zodat je hem kunt gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide adverbs werken ook op arrays, via de index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je benieuwd bent hoe het array eruitziet nadat een middelste element is verwijderd, hier is het antwoord:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zo kun je met een enkele, consistente notatie containers ter plekke bevragen en wijzigen, in plaats van aparte methoden te gebruiken.<\/span><\/p>"]]},"es":{"t":"Exists y delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:exists<\/code> convierte un subíndice en una pregunta: ¿hay un valor en esta clave o índice?<\/span> <span class=\"sg\" data-s=\"1\">Devuelve un valor booleano sin obtener nada:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta es la forma correcta de comprobar si una clave existe, porque simplemente leer <code>%h&lt;plum&gt;<\/code> devolvería un valor indefinido o, dependiendo de los datos, ocultaría la diferencia entre \"ausente\" y \"presente pero indefinido\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:delete<\/code> elimina la entrada y devuelve el valor que contenía:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La entrada <code>apple<\/code> ha desaparecido, y el valor eliminado <code>1<\/code> se devuelve para que puedas usarlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambos adverbios funcionan también con arrays, por índice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si tienes curiosidad por saber cómo se verá el array después de eliminar un elemento del medio, aquí está la respuesta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así, una notación única y consistente te permite consultar y modificar contenedores en su lugar, en vez de recurrir a métodos separados.<\/span><\/p>"]]},"it":{"t":"Exists e delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:exists<\/code> trasforma un accesso tramite indice in una domanda: c'è un valore a questa chiave o indice?<\/span> <span class=\"sg\" data-s=\"1\">Restituisce un booleano senza recuperare nulla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo è il modo corretto per verificare la presenza di una chiave, perché leggere semplicemente <code>%h&lt;plum&gt;<\/code> restituirebbe un valore indefinito oppure, a seconda dei dati, nasconderebbe la differenza tra \"assente\" e \"presente ma indefinito\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:delete<\/code> rimuove l'elemento e restituisce il valore che conteneva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'elemento <code>apple<\/code> non c'è più, e il valore eliminato <code>1<\/code> viene restituito così da poterlo utilizzare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entrambi gli avverbi funzionano anche con gli array, tramite indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se sei curioso di sapere come apparirà l'array dopo la rimozione di un elemento centrale, ecco la risposta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi una notazione unica e coerente ti permette di interrogare e modificare i contenitori direttamente, senza dover ricorrere a metodi separati.<\/span><\/p>"]]},"lv":{"t":"Exists un delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Apstākļvārds <code>:exists<\/code> pārvērš indeksu par jautājumu: vai pie šīs atslēgas vai indeksa ir vērtība?<\/span> <span class=\"sg\" data-s=\"1\">Tas atgriež Būla vērtību, neko nepaņemot:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis ir pareizais veids, kā pārbaudīt atslēgu, jo vienkārša <code>%h&lt;plum&gt;<\/code> nolasīšana vai nu atgrieztu nedefinētu vērtību, vai — atkarībā no datiem — noslēptu atšķirību starp «nav» un «ir, bet nedefinēta».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apstākļvārds <code>:delete<\/code> noņem ierakstu un atgriež vērtību, ko tas saturēja:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ieraksta <code>apple<\/code> vairs nav, un dzēstā vērtība <code>1<\/code> tiek atdota atpakaļ, lai to varētu izmantot.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abi apstākļvārdi darbojas arī ar masīviem — pēc indeksa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jums interesē, kā masīvs izskatīsies pēc tam, kad noņemts elements no vidus, lūk, atbilde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tātad viens vienots pieraksts ļauj konteinerus izprašņāt un pārveidot uz vietas, nevis ķerties pie atsevišķām metodēm.<\/span><\/p>"]]},"ru":{"t":"Существование и удаление","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:exists<\/code> превращает обращение по индексу в вопрос: есть ли значение по данному ключу или индексу?<\/span> <span class=\"sg\" data-s=\"1\">Оно возвращает булево значение, не извлекая сами данные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это правильный способ проверить наличие ключа, потому что простое чтение <code>%h&lt;plum&gt;<\/code> вернуло бы неопределённое значение или, в зависимости от данных, скрыло бы разницу между «отсутствует» и «присутствует, но не определён».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:delete<\/code> удаляет запись и возвращает значение, которое она содержала:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запись <code>apple<\/code> удалена, а удалённое значение <code>1<\/code> возвращается обратно, чтобы вы могли его использовать.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оба наречия работают и с массивами — по индексу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вам интересно, как будет выглядеть массив после удаления элемента из середины, вот ответ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Таким образом, единая согласованная нотация позволяет запрашивать и изменять контейнеры на месте, не прибегая к отдельным методам.<\/span><\/p>"]]},"uk":{"t":"Exists та delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Наріччя <code>:exists<\/code> перетворює індекс на запитання: чи є значення за цим ключем або індексом?<\/span> <span class=\"sg\" data-s=\"1\">Воно повертає булеве значення, нічого не дістаючи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це правильний спосіб перевірити наявність ключа, бо просте читання <code>%h&lt;plum&gt;<\/code> або повернуло б невизначене значення, або, залежно від даних, приховало б різницю між «відсутнє» та «є, але невизначене».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наріччя <code>:delete<\/code> вилучає запис і повертає значення, яке той містив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запису <code>apple<\/code> більше немає, а видалене значення <code>1<\/code> повертається, щоб ви могли ним скористатися.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва наріччя працюють і з масивами, за індексом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо вам цікаво, який вигляд матиме масив після вилучення середнього елемента, ось відповідь:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отже, єдиний послідовний запис дозволяє запитувати й змінювати контейнери на місці, не звертаючись до окремих методів.<\/span><\/p>"]]},"bg":{"t":"Съществуване и изтриване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:exists<\/code> превръща индексирането във въпрос: има ли стойност на този ключ или индекс?<\/span> <span class=\"sg\" data-s=\"1\">То връща булева стойност, без да извлича нищо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е правилният начин да проверите за наличието на ключ, защото простото четене на <code>%h&lt;plum&gt;<\/code> би върнало недефинирана стойност или, в зависимост от данните, би скрило разликата между „липсващ\" и „наличен, но недефиниран\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:delete<\/code> премахва записа и връща стойността, която е съдържал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Записът <code>apple<\/code> вече не съществува, а изтритата стойност <code>1<\/code> се връща обратно, за да можете да я използвате.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И двете наречия работят и с масиви, по индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако се чудите как ще изглежда масивът след премахване на елемент от средата, ето отговорът:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така една единна, последователна нотация ви позволява да проверявате и модифицирате контейнери на място, вместо да прибягвате до отделни методи.<\/span><\/p>"]]},"la":{"t":"Exists et delete","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverbium <code>:exists<\/code> subscriptum in quaestionem vertit: estne valor sub hac clave vel indice?<\/span> <span class=\"sg\" data-s=\"1\">Valorem Booleanum reddit sine ullo valore obtento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est rectus modus clavem probandi, quia simplex lectio <code>%h&lt;plum&gt;<\/code> vel valorem indefinitum redderet, vel, secundum data, differentiam inter \"absentem\" et \"praesentem sed indefinitum\" celaret.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Adverbium <code>:delete<\/code> introitum removet et valorem quem continebat reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Introitus <code>apple<\/code> ablatus est, et valor deletus <code>1<\/code> redditur ut eo uti possis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambo adverbia etiam in ordinibus operantur, per indicem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si scire vis quomodo ordo post medium item deletum appareat, hic est responsio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Itaque una et constans notatio tibi permittit continentia quaerere et in loco mutare, potius quam methodos separatas adhibere.<\/span><\/p>"]]}}}</script>
