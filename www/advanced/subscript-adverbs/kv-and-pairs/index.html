<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs/kv-and-pairs","n":395,"k":"topic","pv":"advanced/subscript-adverbs/exists-and-delete/quiz","nx":"advanced/subscript-adverbs/exercises","tr":["advanced","advanced/subscript-adverbs"],"L":{"en":{"t":"Keys, values, and pairs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Other adverbs change <strong>what<\/strong> a subscript gives back.<\/span> <span class=\"sg\" data-s=\"1\">By default, a subscript returns the value; these return more:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — the value (the default)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — the key (or index)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — both the key and the value<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — a <code>Pair<\/code> of key and value<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For an array, the “key” is the index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> returns the index and the value together as a list, and <code>@a[1]:p<\/code> returns them as a pair.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same works for hashes, and it is especially handy across a slice of several keys at once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, a two-key slice comes back as alternating keys and values.<\/span> <span class=\"sg\" data-s=\"1\">These adverbs are what <code>map<\/code>, <code>for<\/code>, and friends often rely on when you want to process keys and values side by side, without splitting the work into separate lookups.<\/span><\/p>"]]},"de":{"t":"Schlüssel, Werte und Paare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere Adverbien ändern, <strong>was<\/strong> eine Indizierung zurückgibt.<\/span> <span class=\"sg\" data-s=\"1\">Standardmäßig gibt eine Indizierung den Wert zurück; diese geben mehr zurück:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — den Wert (Standard)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — den Schlüssel (oder Index)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — sowohl den Schlüssel als auch den Wert<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — ein <code>Pair<\/code> aus Schlüssel und Wert<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einem Array ist der \"Schlüssel\" der Index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> gibt den Index und den Wert zusammen als Liste zurück, und <code>@a[1]:p<\/code> gibt sie als Pair zurück.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Gleiche funktioniert bei Hashes, und es ist besonders praktisch bei einem Slice über mehrere Schlüssel auf einmal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier kommt ein Zwei-Schlüssel-Slice als abwechselnde Schlüssel und Werte zurück.<\/span> <span class=\"sg\" data-s=\"1\">Diese Adverbien werden häufig von <code>map<\/code>, <code>for<\/code> und ähnlichen Konstrukten verwendet, wenn du Schlüssel und Werte nebeneinander verarbeiten möchtest, ohne die Arbeit in separate Abfragen aufzuteilen.<\/span><\/p>"]]},"nl":{"t":"Sleutels, waarden en paren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere adverbs veranderen <strong>wat<\/strong> een subscript teruggeeft.<\/span> <span class=\"sg\" data-s=\"1\">Standaard geeft een subscript de waarde terug; deze geven meer:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — de waarde (de standaard)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — de sleutel (of index)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — zowel de sleutel als de waarde<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — een <code>Pair<\/code> van sleutel en waarde<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een array is de \"sleutel\" de index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> geeft de index en de waarde samen terug als een lijst, en <code>@a[1]:p<\/code> geeft ze terug als een paar.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde werkt voor hashes, en het is bijzonder handig bij een slice van meerdere sleutels tegelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier komt een slice van twee sleutels terug als afwisselende sleutels en waarden.<\/span> <span class=\"sg\" data-s=\"1\">Deze adverbs zijn waar <code>map<\/code>, <code>for<\/code> en soortgelijke functies vaak op vertrouwen wanneer je sleutels en waarden naast elkaar wilt verwerken, zonder het werk op te splitsen in aparte opzoekingen.<\/span><\/p>"]]},"es":{"t":"Keys, values y pairs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Otros adverbios cambian <strong>qué<\/strong> devuelve un subíndice.<\/span> <span class=\"sg\" data-s=\"1\">Por defecto, un subíndice devuelve el valor; estos devuelven más:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — el valor (lo predeterminado)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la clave (o el índice)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — tanto la clave como el valor<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — un <code>Pair<\/code> de clave y valor<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un array, la \"clave\" es el índice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> devuelve el índice y el valor juntos como una lista, y <code>@a[1]:p<\/code> los devuelve como un par.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo mismo funciona para hashes, y es especialmente útil con un segmento de varias claves a la vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, un segmento de dos claves devuelve claves y valores alternados.<\/span> <span class=\"sg\" data-s=\"1\">Estos adverbios son lo que <code>map<\/code>, <code>for<\/code> y similares suelen usar cuando quieres procesar claves y valores lado a lado, sin dividir el trabajo en consultas separadas.<\/span><\/p>"]]},"it":{"t":"Chiavi, valori e coppie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri avverbi cambiano <strong>cosa<\/strong> restituisce un accesso tramite indice.<\/span> <span class=\"sg\" data-s=\"1\">Per impostazione predefinita, un indice restituisce il valore; questi restituiscono di più:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — il valore (il comportamento predefinito)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la chiave (o l'indice)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — sia la chiave che il valore<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — una <code>Pair<\/code> di chiave e valore<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un array, la \"chiave\" è l'indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> restituisce l'indice e il valore insieme come lista, e <code>@a[1]:p<\/code> li restituisce come coppia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo stesso funziona per gli hash, ed è particolarmente comodo quando si accede a una fetta di più chiavi contemporaneamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui, una fetta di due chiavi viene restituita come chiavi e valori alternati.<\/span> <span class=\"sg\" data-s=\"1\">Questi avverbi sono quelli su cui <code>map<\/code>, <code>for<\/code> e simili si basano spesso quando vuoi elaborare chiavi e valori fianco a fianco, senza suddividere il lavoro in ricerche separate.<\/span><\/p>"]]},"lv":{"t":"Atslēgas, vērtības un pāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Citi apstākļvārdi maina to, <strong>ko<\/strong> indekss atdod.<\/span> <span class=\"sg\" data-s=\"1\">Pēc noklusējuma indekss atgriež vērtību; šie atgriež vairāk:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — vērtību (noklusējums)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — atslēgu (vai indeksu)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — gan atslēgu, gan vērtību<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — atslēgas un vērtības <code>Pair<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Masīvam «atslēga» ir indekss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> atgriež indeksu un vērtību kopā kā sarakstu, bet <code>@a[1]:p<\/code> atgriež tos kā pāri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas pats darbojas ar jaukteņiem, un tas ir īpaši ērti pār vairāku atslēgu šķēli uzreiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit divu atslēgu šķēle atgriežas kā pamīšus atslēgas un vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Tieši uz šiem apstākļvārdiem <code>map<\/code>, <code>for<\/code> un tamlīdzīgi bieži paļaujas, kad vēlaties apstrādāt atslēgas un vērtības līdzās, nesadalot darbu atsevišķos meklējumos.<\/span><\/p>"]]},"ru":{"t":"Ключи, значения и пары","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Другие наречия изменяют <strong>то, что<\/strong> возвращает обращение по индексу.<\/span> <span class=\"sg\" data-s=\"1\">По умолчанию возвращается значение; эти наречия позволяют получить больше:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — значение (по умолчанию)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключ (или индекс)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — и ключ, и значение<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — пару (<code>Pair<\/code>) из ключа и значения<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для массива «ключом» является индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> возвращает индекс и значение в виде списка, а <code>@a[1]:p<\/code> — в виде пары.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">То же самое работает и для хешей, и это особенно удобно при срезе нескольких ключей сразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь срез из двух ключей возвращается в виде чередующихся ключей и значений.<\/span> <span class=\"sg\" data-s=\"1\">Эти наречия часто используются в <code>map<\/code>, <code>for<\/code> и других конструкциях, когда нужно обрабатывать ключи и значения параллельно, без разделения работы на отдельные запросы.<\/span><\/p>"]]},"uk":{"t":"Ключі, значення та пари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Інші наріччя змінюють те, <strong>що<\/strong> індекс повертає.<\/span> <span class=\"sg\" data-s=\"1\">За замовчуванням індекс повертає значення; ці повертають більше:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — значення (за замовчуванням)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключ (або індекс)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — і ключ, і значення<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> із ключа та значення<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для масиву «ключем» є індекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> повертає індекс і значення разом як список, а <code>@a[1]:p<\/code> повертає їх як пару.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Те саме працює для хешів і особливо стає в пригоді на зрізі з кількох ключів одразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут зріз із двох ключів повертається як чергування ключів і значень.<\/span> <span class=\"sg\" data-s=\"1\">Саме на ці наріччя часто спираються <code>map<\/code>, <code>for<\/code> та їхні побратими, коли потрібно обробляти ключі й значення пліч-о-пліч, не розбиваючи роботу на окремі пошуки.<\/span><\/p>"]]},"bg":{"t":"Ключове, стойности и двойки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Други наречия променят <strong>какво<\/strong> връща индексирането.<\/span> <span class=\"sg\" data-s=\"1\">По подразбиране индексирането връща стойността; тези връщат повече:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — стойността (по подразбиране)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключа (или индекса)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — както ключа, така и стойността<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> от ключ и стойност<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За масив „ключът\" е индексът:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> връща индекса и стойността заедно като списък, а <code>@a[1]:p<\/code> ги връща като двойка (pair).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същото работи и за хешове, и е особено удобно при срез (slice) на няколко ключа наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук срезът от два ключа се връща като редуващи се ключове и стойности.<\/span> <span class=\"sg\" data-s=\"1\">Тези наречия са това, на което <code>map<\/code>, <code>for<\/code> и подобни конструкции често разчитат, когато искате да обработвате ключове и стойности едновременно, без да разделяте работата на отделни търсения.<\/span><\/p>"]]},"la":{"t":"Claves, valores, et paria","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Alia adverbia mutant <strong>quid<\/strong> subscriptum reddat.<\/span> <span class=\"sg\" data-s=\"1\">Per defaltam, subscriptum valorem reddit; haec plus reddunt:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — valorem (per defaltam)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — clavem (vel indicem)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — et clavem et valorem<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> clavis et valoris<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In ordine, \"clavis\" est index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> indicem et valorem simul ut listam reddit, et <code>@a[1]:p<\/code> ea ut par reddit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Idem in tabulis operatur, et praecipue utile est per segmentum plurium clavium simul:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic segmentum duarum clavium claves et valores alternantes reddit.<\/span> <span class=\"sg\" data-s=\"1\">Haec adverbia sunt quibus <code>map<\/code>, <code>for<\/code>, et similia saepe utuntur cum claves et valores pariter tractare vis, sine operibus separatis.<\/span><\/p>"]]}}}</script>
