<script type="application/json" id="page-data">{"u":"advanced/installing-modules","n":721,"k":"section","pv":"advanced/module-introspection/quiz","nx":"advanced/packages","tr":["advanced"],"L":{"en":{"t":"Installing modules from the web","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Beyond the modules you write yourself, there is a large collection of modules published by the Raku community.<\/span> <span class=\"sg\" data-s=\"1\">They cover everything from web frameworks to data formats, and you can install them and use them in your own programs.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>zef<\/code> installer<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modules are installed with <code>zef<\/code>, the standard module manager that ships with Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">To install a module, give <code>zef<\/code> the module’s name:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> downloads the module along with anything it depends on, runs its tests, and installs it.<\/span> <span class=\"sg\" data-s=\"1\">Once installed, a module is on the search path automatically, so a program can load it with a plain <code>use<\/code> — no <code>-I<\/code> option is needed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can also search the ecosystem and update or remove modules:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Where modules come from<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Published modules live in the Raku <em>ecosystem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">You can browse it on the website <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, which lists the available distributions and their documentation.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A distribution that is meant to be shared includes a description file named <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It records the distribution’s name, version, the modules it provides, and the other distributions it depends on.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> reads this file to know what to install and how the pieces fit together.<\/span> <span class=\"sg\" data-s=\"3\">When you publish your own module, providing a correct <code>META6.json<\/code> is what makes it installable by everyone else.<\/span><\/p>"]]},"de":{"t":"Module aus dem Web installieren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben den Modulen, die du selbst schreibst, gibt es eine große Sammlung von Modulen, die von der Raku-Community veröffentlicht wurden.<\/span> <span class=\"sg\" data-s=\"1\">Sie decken alles ab, von Web-Frameworks bis hin zu Datenformaten, und du kannst sie installieren und in deinen eigenen Programmen verwenden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der <code>zef<\/code>-Installer<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Module werden mit <code>zef<\/code> installiert, dem Standard-Modulmanager, der mit Rakudo mitgeliefert wird.<\/span> <span class=\"sg\" data-s=\"1\">Um ein Modul zu installieren, gibst du <code>zef<\/code> den Namen des Moduls:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> lädt das Modul zusammen mit allen Abhängigkeiten herunter, führt seine Tests aus und installiert es. Sobald ein Modul installiert ist, befindet es sich automatisch im Suchpfad, sodass ein Programm es einfach mit <code>use<\/code> laden kann — die Option <code>-I<\/code> wird nicht benötigt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du kannst auch das Ökosystem durchsuchen und Module aktualisieren oder entfernen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Woher Module kommen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Veröffentlichte Module befinden sich im Raku-<em>Ökosystem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst es auf der Website <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a> durchstöbern, die die verfügbaren Distributionen und deren Dokumentation auflistet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Distribution, die geteilt werden soll, enthält eine Beschreibungsdatei namens <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie enthält den Namen der Distribution, die Version, die bereitgestellten Module und die anderen Distributionen, von denen sie abhängt.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> liest diese Datei, um zu wissen, was installiert werden muss und wie die Teile zusammenpassen.<\/span> <span class=\"sg\" data-s=\"3\">Wenn du dein eigenes Modul veröffentlichst, ist eine korrekte <code>META6.json<\/code> das, was es für alle anderen installierbar macht.<\/span><\/p>"]]},"nl":{"t":"Modules installeren van het web","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast de modules die je zelf schrijft, is er een grote verzameling modules gepubliceerd door de Raku-gemeenschap.<\/span> <span class=\"sg\" data-s=\"1\">Ze bestrijken alles van webframeworks tot dataformaten, en je kunt ze installeren en gebruiken in je eigen programma's.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De <code>zef<\/code>-installer<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modules worden geïnstalleerd met <code>zef<\/code>, de standaard modulebeheerder die wordt meegeleverd met Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Om een module te installeren, geef je <code>zef<\/code> de naam van de module:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> downloadt de module samen met alles waar deze van afhankelijk is, voert de tests uit en installeert deze.<\/span> <span class=\"sg\" data-s=\"1\">Na installatie staat een module automatisch op het zoekpad, zodat een programma deze kan laden met een gewone <code>use<\/code> — de optie <code>-I<\/code> is niet nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook het ecosysteem doorzoeken en modules bijwerken of verwijderen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Waar modules vandaan komen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gepubliceerde modules bevinden zich in het Raku-<em>ecosysteem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het bekijken op de website <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, waar de beschikbare distributies en hun documentatie worden vermeld.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een distributie die bedoeld is om te delen, bevat een beschrijvingsbestand genaamd <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit bestand registreert de naam van de distributie, de versie, de modules die het aanbiedt en de andere distributies waar het van afhankelijk is.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> leest dit bestand om te weten wat er geïnstalleerd moet worden en hoe de onderdelen in elkaar passen.<\/span> <span class=\"sg\" data-s=\"3\">Wanneer je je eigen module publiceert, is het aanleveren van een correct <code>META6.json<\/code> wat het voor iedereen installeerbaar maakt.<\/span><\/p>"]]},"es":{"t":"Instalar módulos desde la web","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Más allá de los módulos que escribes tú mismo, existe una gran colección de módulos publicados por la comunidad de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Cubren todo, desde frameworks web hasta formatos de datos, y puedes instalarlos y usarlos en tus propios programas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El instalador <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los módulos se instalan con <code>zef<\/code>, el gestor de módulos estándar que viene con Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Para instalar un módulo, proporciona a <code>zef<\/code> el nombre del módulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> descarga el módulo junto con todo lo que necesita, ejecuta sus pruebas y lo instala.<\/span> <span class=\"sg\" data-s=\"1\">Una vez instalado, el módulo se encuentra automáticamente en la ruta de búsqueda, así que un programa puede cargarlo con un simple <code>use<\/code> — no se necesita la opción <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También puedes buscar en el ecosistema y actualizar o eliminar módulos:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De dónde vienen los módulos<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los módulos publicados residen en el <em>ecosistema<\/em> de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puedes explorarlo en el sitio web <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, que lista las distribuciones disponibles y su documentación.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una distribución destinada a ser compartida incluye un archivo de descripción llamado <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Este registra el nombre de la distribución, la versión, los módulos que proporciona y las otras distribuciones de las que depende.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> lee este archivo para saber qué instalar y cómo encajan las piezas.<\/span> <span class=\"sg\" data-s=\"3\">Cuando publicas tu propio módulo, proporcionar un <code>META6.json<\/code> correcto es lo que hace que sea instalable por todos los demás.<\/span><\/p>"]]},"it":{"t":"Installare moduli dal web","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre ai moduli che scrivi tu stesso, esiste una vasta raccolta di moduli pubblicati dalla comunità Raku.<\/span> <span class=\"sg\" data-s=\"1\">Coprono tutto, dai framework web ai formati dati, e puoi installarli e utilizzarli nei tuoi programmi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">L'installer <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I moduli si installano con <code>zef<\/code>, il gestore di moduli standard che viene distribuito insieme a Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Per installare un modulo, indica a <code>zef<\/code> il nome del modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> scarica il modulo insieme a tutte le sue dipendenze, esegue i test e lo installa.<\/span> <span class=\"sg\" data-s=\"1\">Una volta installato, il modulo viene aggiunto automaticamente al percorso di ricerca, quindi un programma può caricarlo con un semplice <code>use<\/code> — non è necessaria l'opzione <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi anche cercare nell'ecosistema e aggiornare o rimuovere moduli:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Da dove provengono i moduli<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I moduli pubblicati si trovano nell'<em>ecosistema<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puoi esplorarlo sul sito <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, che elenca le distribuzioni disponibili e la relativa documentazione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una distribuzione destinata alla condivisione include un file descrittivo chiamato <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo file registra il nome della distribuzione, la versione, i moduli che fornisce e le altre distribuzioni da cui dipende.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> legge questo file per sapere cosa installare e come i vari pezzi si collegano tra loro.<\/span> <span class=\"sg\" data-s=\"3\">Quando pubblichi un tuo modulo, fornire un <code>META6.json<\/code> corretto è ciò che lo rende installabile da tutti gli altri.<\/span><\/p>"]]},"lv":{"t":"Moduļu instalēšana no tīmekļa","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Papildus moduļiem, kurus rakstāt pats, pastāv liela kopienas publicēto moduļu kolekcija.<\/span> <span class=\"sg\" data-s=\"1\">Tie aptver visu, sākot no tīmekļa ietvariem līdz datu formātiem, un jūs varat tos instalēt un izmantot savās programmās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Instalētājs <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduļi tiek instalēti ar <code>zef<\/code> — standarta moduļu pārvaldnieku, kas tiek piegādāts kopā ar Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Lai instalētu moduli, norādiet <code>zef<\/code> moduļa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> lejupielādē moduli kopā ar visām tā atkarībām, izpilda tā testus un instalē to.<\/span> <span class=\"sg\" data-s=\"1\">Pēc instalēšanas modulis automātiski atrodas meklēšanas ceļā, tāpēc programma var to ielādēt ar vienkāršu <code>use<\/code> — opcija <code>-I<\/code> nav nepieciešama:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī meklēt ekosistēmā un atjaunināt vai noņemt moduļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No kurienes nāk moduļi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Publicētie moduļi atrodas Raku <em>ekosistēmā<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">To var pārlūkot tīmekļa vietnē <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, kur ir uzskaitītas pieejamās distribūcijas un to dokumentācija.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Distribūcija, kas paredzēta kopīgošanai, ietver apraksta failu ar nosaukumu <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir ierakstīts distribūcijas nosaukums, versija, moduļi, kurus tā nodrošina, un citas distribūcijas, no kurām tā ir atkarīga.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> nolasa šo failu, lai zinātu, ko instalēt un kā daļas saskan kopā.<\/span> <span class=\"sg\" data-s=\"3\">Kad publicējat savu moduli, pareiza <code>META6.json<\/code> nodrošināšana ir tas, kas padara to instalējamu visiem pārējiem.<\/span><\/p>"]]},"ru":{"t":"Установка модулей из сети","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Помимо модулей, которые вы пишете сами, существует большая коллекция модулей, опубликованных сообществом Raku.<\/span> <span class=\"sg\" data-s=\"1\">Они охватывают всё, от веб-фреймворков до форматов данных, и вы можете установить их и использовать в своих программах.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Установщик <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модули устанавливаются с помощью <code>zef<\/code> — стандартного менеджера модулей, поставляемого вместе с Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы установить модуль, укажите <code>zef<\/code> его имя:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> скачивает модуль вместе со всеми его зависимостями, запускает тесты и устанавливает его.<\/span> <span class=\"sg\" data-s=\"1\">После установки модуль автоматически попадает в путь поиска, поэтому программа может загрузить его простым <code>use<\/code> — никакая опция <code>-I<\/code> не нужна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы также можете искать в экосистеме, обновлять или удалять модули:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Откуда берутся модули<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Опубликованные модули хранятся в <em>экосистеме<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Просмотреть её можно на сайте <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, где перечислены доступные дистрибутивы и их документация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив, предназначенный для распространения, включает файл описания <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В нём записаны имя дистрибутива, версия, предоставляемые модули и дистрибутивы, от которых он зависит.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> читает этот файл, чтобы знать, что устанавливать и как всё устроено.<\/span> <span class=\"sg\" data-s=\"3\">Когда вы публикуете свой модуль, правильный <code>META6.json<\/code> — это то, что делает его устанавливаемым для всех остальных.<\/span><\/p>"]]},"uk":{"t":"Встановлення модулів із мережі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім модулів, які ви пишете самі, існує велика збірка модулів, опублікованих спільнотою Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вони охоплюють усе — від вебфреймворків до форматів даних, — і ви можете встановлювати їх та використовувати у власних програмах.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Встановлювач <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модулі встановлюють за допомогою <code>zef<\/code> — стандартного менеджера модулів, що постачається разом із Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Щоб встановити модуль, дайте <code>zef<\/code> його назву:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> завантажує модуль разом з усім, від чого той залежить, виконує його тести й встановлює його.<\/span> <span class=\"sg\" data-s=\"1\">Після встановлення модуль автоматично опиняється на шляху пошуку, тож програма може завантажити його звичайним <code>use<\/code> — опція <code>-I<\/code> не потрібна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також можете шукати в екосистемі, оновлювати та вилучати модулі:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звідки беруться модулі<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Опубліковані модулі живуть в <em>екосистемі<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Переглянути її можна на сайті <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, де перелічено доступні дистрибутиви та їхню документацію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив, призначений для поширення, містить файл опису під назвою <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У ньому записано назву дистрибутива, версію, модулі, які він надає, та інші дистрибутиви, від яких він залежить.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> читає цей файл, щоб знати, що встановлювати і як частини поєднуються між собою.<\/span> <span class=\"sg\" data-s=\"3\">Коли ви публікуєте власний модуль, саме правильний <code>META6.json<\/code> робить його придатним до встановлення всіма іншими.<\/span><\/p>"]]},"bg":{"t":"Инсталиране на модули от мрежата","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен модулите, които пишете сами, съществува голяма колекция от модули, публикувани от общността на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Те покриват всичко - от уеб фреймуърки до формати за данни, и можете да ги инсталирате и използвате в собствените си програми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Инсталаторът <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модулите се инсталират с <code>zef<\/code> - стандартният мениджър на модули, който се доставя с Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">За да инсталирате модул, подайте на <code>zef<\/code> името на модула:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> изтегля модула заедно с всичко, от което той зависи, изпълнява тестовете му и го инсталира.<\/span> <span class=\"sg\" data-s=\"1\">След инсталирането модулът автоматично е в пътя за търсене, така че програмата може да го зареди с обикновен <code>use<\/code> - не е необходима опцията <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да търсите в екосистемата и да обновявате или премахвате модули:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Откъде идват модулите<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Публикуваните модули се намират в <em>екосистемата<\/em> на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я разгледате на уебсайта <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, който съдържа списък с наличните дистрибуции и тяхната документация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дистрибуция, предназначена за споделяне, включва описателен файл с име <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той записва името на дистрибуцията, версията, модулите, които тя предоставя, и другите дистрибуции, от които зависи.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> чете този файл, за да знае какво да инсталира и как частите се свързват помежду си.<\/span> <span class=\"sg\" data-s=\"3\">Когато публикувате собствен модул, предоставянето на коректен <code>META6.json<\/code> е това, което го прави инсталируем от всички останали.<\/span><\/p>"]]},"eo":{"t":"Instali modulojn el la reto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom la moduloj, kiujn vi mem skribas, ekzistas granda kolekto de moduloj publikigitaj de la Raku-komunumo.<\/span> <span class=\"sg\" data-s=\"1\">Ili kovras ĉion de retkadroj ĝis datumformatoj, kaj vi povas instali ilin kaj uzi ilin en viaj propraj programoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La instalilo <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduloj estas instalataj per <code>zef<\/code>, la norma modula administrilo, kiu estas inkluzivita kun Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Por instali modulon, donu al <code>zef<\/code> la nomon de la modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> elŝutas la modulon kune kun ĉio, de kio ĝi dependas, rulas ĝiajn testojn kaj instalas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Post instalado, modulo troviĝas aŭtomate en la serĉvojo, do programo povas ŝargi ĝin per simpla <code>use<\/code> — neniu opcio <code>-I<\/code> estas bezonata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas serĉi en la ekosistemo kaj ĝisdatigi aŭ forigi modulojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De kie venas moduloj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Publikigitaj moduloj loĝas en la Raku-<em>ekosistemo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trarigardi ĝin sur la retejo <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>, kiu listigas la disponeblajn distribuaĵojn kaj ilian dokumentadon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Distribuaĵo destinita por kunhavigo inkluzivas priskribdosieron nomitan <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi registras la nomon de la distribuaĵo, la version, la modulojn, kiujn ĝi provizas, kaj la aliajn distribuaĵojn, de kiuj ĝi dependas.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> legas ĉi tiun dosieron por scii, kion instali kaj kiel la partoj kunfitas.<\/span> <span class=\"sg\" data-s=\"3\">Kiam vi publikigas vian propran modulon, provizado de ĝusta <code>META6.json<\/code> estas tio, kio igas ĝin instalebla de ĉiuj aliaj.<\/span><\/p>"]]},"la":{"t":"Modulos ex interrete installare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter modulos quos ipse scribis, magna collectio modulorum a communitate Raku editorum exstat.<\/span> <span class=\"sg\" data-s=\"1\">Omnia complectuntur a compagibus interretialibus usque ad formas datorum, et eos installare atque in tuis programmatis uti potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Instrumentum <code>zef<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduli per <code>zef<\/code> installantur, quod est instrumentum moderandi modulos normatum, quod una cum Rakudo distribuitur.<\/span> <span class=\"sg\" data-s=\"1\">Ad modulum installandum, nomen moduli <code>zef<\/code> praebe:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> modulum una cum omnibus eius dependentiis deponit, probationes eius exsequitur, et eum installat.<\/span> <span class=\"sg\" data-s=\"1\">Modulo installato, is automatice in via inquisitionis est, ita ut programma eum simplici <code>use<\/code> instructione onerare possit — optio <code>-I<\/code> non necessaria est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potes etiam oecosystema perscrutari et modulos renovare vel removere:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unde moduli proveniant<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduli editi in <em>oecosystemate<\/em> Raku habitant.<\/span> <span class=\"sg\" data-s=\"1\">Id in situ interretiali <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a> perlustrare potes, ubi distributiones praesto et earum documentatio enumerantur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Distributio quae communicanda est fasciculum descriptionis nomine <code>META6.json<\/code> includit.<\/span> <span class=\"sg\" data-s=\"1\">Hic nomen distributionis, versionem, modulos quos praebet, et alias distributiones a quibus pendet memorat.<\/span> <span class=\"sg\" data-s=\"2\"><code>zef<\/code> hunc fasciculum legit ut sciat quid installandum sit et quomodo partes inter se cohaereant.<\/span> <span class=\"sg\" data-s=\"3\">Cum modulum tuum proprium edis, fasciculum <code>META6.json<\/code> recte praebere id est quod efficit ut ab omnibus aliis installari possit.<\/span><\/p>"]]}}}</script>
