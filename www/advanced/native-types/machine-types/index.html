<script type="application/json" id="page-data">{"u":"advanced/native-types/machine-types","n":441,"k":"topic","pv":"advanced/native-types","nx":"advanced/native-types/machine-types/quiz","tr":["advanced","advanced/native-types"],"L":{"en":{"t":"Machine-level types","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The native types have lower-case names: <code>int<\/code>, <code>num<\/code>, and <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You declare a variable with one of them just as you would with <code>Int<\/code> or <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A native value corresponds directly to a machine register or word, without the wrapper object that a normal Raku value carries.<\/span> <span class=\"sg\" data-s=\"1\">This makes native types faster and more compact, which matters in tight numeric loops and large arrays.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There is one behaviour to be aware of straight away: a native variable can never be undefined.<\/span> <span class=\"sg\" data-s=\"1\">Where an ordinary <code>Int<\/code> container starts as the undefined <code>Any<\/code>, a native <code>int<\/code> starts at <strong>zero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same applies to native arrays, declared by putting the native type before the <code>@<\/code> variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Such an array stores its elements as raw machine integers rather than as boxed <code>Int<\/code> objects, so it uses less memory.<\/span> <span class=\"sg\" data-s=\"1\">When you introspect a native value it is automatically <em>boxed<\/em> into the matching full type, which is why <code>(my int $b).WHAT<\/code> reports <code>(Int)<\/code>.<\/span><\/p>"]]},"de":{"t":"Maschinennahe Typen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nativen Typen haben kleingeschriebene Namen: <code>int<\/code>, <code>num<\/code> und <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Du deklarierst eine Variable mit einem davon genauso wie mit <code>Int<\/code> oder <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein nativer Wert entspricht direkt einem Maschinenregister oder -wort, ohne das Wrapper-Objekt, das ein normaler Raku-Wert mit sich trägt.<\/span> <span class=\"sg\" data-s=\"1\">Dadurch sind native Typen schneller und kompakter, was in engen numerischen Schleifen und großen Arrays wichtig ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt ein Verhalten, das du sofort kennen solltest: Eine native Variable kann niemals undefiniert sein.<\/span> <span class=\"sg\" data-s=\"1\">Während ein gewöhnlicher <code>Int<\/code>-Container als undefiniertes <code>Any<\/code> beginnt, startet ein nativer <code>int<\/code> bei <strong>Null<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Gleiche gilt für native Arrays, die deklariert werden, indem der native Typ vor die <code>@<\/code>-Variable gesetzt wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein solches Array speichert seine Elemente als rohe Maschinen-Ganzzahlen und nicht als geboxte <code>Int<\/code>-Objekte, wodurch es weniger Speicher verbraucht.<\/span> <span class=\"sg\" data-s=\"1\">Wenn du einen nativen Wert introspektierst, wird er automatisch in den passenden vollwertigen Typ <em>geboxt<\/em>, weshalb <code>(my int $b).WHAT<\/code> als Ergebnis <code>(Int)<\/code> liefert.<\/span><\/p>"]]},"nl":{"t":"Typen op machineniveau","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De native typen hebben namen in kleine letters: <code>int<\/code>, <code>num<\/code> en <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je declareert een variabele met een van deze typen op dezelfde manier als met <code>Int<\/code> of <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een native waarde komt direct overeen met een machineregister of -woord, zonder het wrapper-object dat een normale Raku-waarde met zich meedraagt.<\/span> <span class=\"sg\" data-s=\"1\">Dit maakt native typen sneller en compacter, wat belangrijk is bij intensieve numerieke lussen en grote arrays.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er is een gedrag waar je meteen op moet letten: een native variabele kan nooit ongedefinieerd zijn.<\/span> <span class=\"sg\" data-s=\"1\">Terwijl een gewone <code>Int<\/code>-container begint als het ongedefinieerde <code>Any<\/code>, begint een native <code>int<\/code> op <strong>nul<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde geldt voor native arrays, gedeclareerd door het native type voor de <code>@<\/code>-variabele te plaatsen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zo'n array slaat zijn elementen op als ruwe machine-integers in plaats van als boxed <code>Int<\/code>-objecten, waardoor het minder geheugen gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer je een native waarde introspecteert, wordt deze automatisch <em>geboxt<\/em> naar het overeenkomstige volledige type, daarom rapporteert <code>(my int $b).WHAT<\/code> als <code>(Int)<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipos a nivel de máquina","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tipos nativos tienen nombres en minúsculas: <code>int<\/code>, <code>num<\/code> y <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Declaras una variable con uno de ellos de la misma forma que lo harías con <code>Int<\/code> o <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un valor nativo corresponde directamente a un registro o palabra de la máquina, sin el objeto envolvente que lleva un valor normal de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Esto hace que los tipos nativos sean más rápidos y compactos, lo cual importa en bucles numéricos intensivos y en arrays grandes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay un comportamiento que debes tener en cuenta desde el principio: una variable nativa nunca puede ser indefinida.<\/span> <span class=\"sg\" data-s=\"1\">Mientras que un contenedor ordinario <code>Int<\/code> comienza como el indefinido <code>Any<\/code>, un <code>int<\/code> nativo comienza en <strong>cero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo mismo aplica a los arrays nativos, que se declaran colocando el tipo nativo antes de la variable <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un array así almacena sus elementos como enteros crudos de la máquina en lugar de objetos <code>Int<\/code> encapsulados, por lo que usa menos memoria.<\/span> <span class=\"sg\" data-s=\"1\">Cuando introspecciones un valor nativo, se <em>encapsula<\/em> automáticamente en el tipo completo correspondiente, razón por la cual <code>(my int $b).WHAT<\/code> reporta <code>(Int)<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipi a livello macchina","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I tipi nativi hanno nomi in minuscolo: <code>int<\/code>, <code>num<\/code> e <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si dichiara una variabile con uno di essi esattamente come si farebbe con <code>Int<\/code> o <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un valore nativo corrisponde direttamente a un registro o una parola della macchina, senza l'oggetto wrapper che un normale valore Raku porta con sé.<\/span> <span class=\"sg\" data-s=\"1\">Questo rende i tipi nativi più veloci e più compatti, il che conta nei cicli numerici intensivi e negli array di grandi dimensioni.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">C'è un comportamento da tenere presente fin da subito: una variabile nativa non può mai essere indefinita.<\/span> <span class=\"sg\" data-s=\"1\">Mentre un normale contenitore <code>Int<\/code> inizia come <code>Any<\/code> indefinito, un <code>int<\/code> nativo inizia a <strong>zero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo stesso vale per gli array nativi, dichiarati mettendo il tipo nativo prima della variabile <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un array di questo tipo memorizza i suoi elementi come interi macchina grezzi anziché come oggetti <code>Int<\/code> boxed, quindi usa meno memoria.<\/span> <span class=\"sg\" data-s=\"1\">Quando si introspeziona un valore nativo, viene automaticamente <em>boxed<\/em> nel tipo completo corrispondente, ed è per questo che <code>(my int $b).WHAT<\/code> restituisce <code>(Int)<\/code>.<\/span><\/p>"]]},"lv":{"t":"Mašīnas līmeņa tipi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Natīvajiem tipiem ir nosaukumi ar mazajiem burtiem: <code>int<\/code>, <code>num<\/code> un <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgo ar kādu no tiem deklarē tāpat kā ar <code>Int<\/code> vai <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Natīvā vērtība tieši atbilst mašīnas reģistram vai vārdam bez iesaiņojuma objekta, kāds ir parastajai Raku vērtībai.<\/span> <span class=\"sg\" data-s=\"1\">Tas padara natīvos tipus ātrākus un kompaktākus, kas ir svarīgi intensīvās skaitliskās cilpās un lielos masīvos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir viena uzvedība, kas jāzina uzreiz: natīvais mainīgais nekad nevar būt nedefinēts.<\/span> <span class=\"sg\" data-s=\"1\">Kamēr parasts <code>Int<\/code> konteiners sākas kā nedefinēts <code>Any<\/code>, natīvais <code>int<\/code> sākas ar <strong>nulli<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas pats attiecas uz natīvajiem masīviem, kurus deklarē, liekot natīvo tipu pirms <code>@<\/code> mainīgā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šāds masīvs glabā savus elementus kā neapstrādātus mašīnas veselos skaitļus, nevis kā iesaiņotus <code>Int<\/code> objektus, tāpēc tas izmanto mazāk atmiņas.<\/span> <span class=\"sg\" data-s=\"1\">Introspektējot natīvo vērtību, tā automātiski tiek <em>iesaiņota<\/em> atbilstošajā pilnajā tipā, tāpēc <code>(my int $b).WHAT<\/code> ziņo <code>(Int)<\/code>.<\/span><\/p>"]]},"ru":{"t":"Типы машинного уровня","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Нативные типы имеют имена, записанные строчными буквами: <code>int<\/code>, <code>num<\/code> и <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Объявить переменную с одним из них можно точно так же, как с <code>Int<\/code> или <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Нативное значение соответствует непосредственно машинному регистру или слову, без объекта-обёртки, который несёт обычное значение Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это делает нативные типы быстрее и компактнее, что важно в плотных числовых циклах и больших массивах.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть одна особенность поведения, о которой нужно знать сразу: нативная переменная никогда не может быть неопределённой.<\/span> <span class=\"sg\" data-s=\"1\">Если обычный контейнер <code>Int<\/code> начинает с неопределённого значения <code>Any<\/code>, то нативный <code>int<\/code> начинает с <strong>нуля<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">То же относится к нативным массивам, которые объявляются с указанием нативного типа перед переменной с <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такой массив хранит элементы как «сырые» машинные целые числа, а не как обёрнутые объекты <code>Int<\/code>, и поэтому использует меньше памяти.<\/span> <span class=\"sg\" data-s=\"1\">При интроспекции нативное значение автоматически <em>упаковывается<\/em> в соответствующий полный тип, поэтому <code>(my int $b).WHAT<\/code> выводит <code>(Int)<\/code>.<\/span><\/p>"]]},"uk":{"t":"Типи машинного рівня","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Машинні типи мають імена з малих літер: <code>int<\/code>, <code>num<\/code> та <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оголошують змінну з одним із них так само, як з <code>Int<\/code> чи <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Машинне значення прямо відповідає регістру чи слову машини, без об'єкта-обгортки, який несе звичайне значення Raku.<\/span> <span class=\"sg\" data-s=\"1\">Це робить машинні типи швидшими й компактнішими, що має значення у щільних числових циклах і великих масивах.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Є одна поведінка, про яку варто знати одразу: машинна змінна ніколи не може бути невизначеною.<\/span> <span class=\"sg\" data-s=\"1\">Там, де звичайний контейнер <code>Int<\/code> починає з невизначеного <code>Any<\/code>, машинний <code>int<\/code> починає з <strong>нуля<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Те саме стосується машинних масивів, які оголошують, ставлячи машинний тип перед змінною з <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такий масив зберігає свої елементи як сирі машинні цілі числа, а не як упаковані об'єкти <code>Int<\/code>, тож споживає менше пам'яті.<\/span> <span class=\"sg\" data-s=\"1\">Коли ви робите інтроспекцію машинного значення, воно автоматично <em>упаковується<\/em> у відповідний повний тип, — саме тому <code>(my int $b).WHAT<\/code> повідомляє <code>(Int)<\/code>.<\/span><\/p>"]]},"bg":{"t":"Типове на машинно ниво","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Нативните типове имат имена с малки букви: <code>int<\/code>, <code>num<\/code> и <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Декларирате променлива с един от тях по същия начин, както с <code>Int<\/code> или <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Нативната стойност съответства директно на машинен регистър или дума, без обвиващия обект, който нормалната Raku стойност носи.<\/span> <span class=\"sg\" data-s=\"1\">Това прави нативните типове по-бързи и по-компактни, което е от значение при интензивни числови цикли и големи масиви.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има едно поведение, за което трябва да знаете веднага: нативна променлива никога не може да бъде недефинирана.<\/span> <span class=\"sg\" data-s=\"1\">Докато обикновен <code>Int<\/code> контейнер започва като недефинирано <code>Any<\/code>, нативен <code>int<\/code> започва от <strong>нула<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същото важи и за нативни масиви, декларирани чрез поставяне на нативния тип преди променливата с <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такъв масив съхранява елементите си като сурови машинни цели числа, а не като обвити <code>Int<\/code> обекти, така че използва по-малко памет.<\/span> <span class=\"sg\" data-s=\"1\">Когато правите интроспекция на нативна стойност, тя автоматично се <em>обвива<\/em> в съответния пълен тип, затова <code>(my int $b).WHAT<\/code> показва <code>(Int)<\/code>.<\/span><\/p>"]]},"eo":{"t":"Maŝin-nivelaj tipoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La indiĝenaj tipoj havas minusklajn nomojn: <code>int<\/code>, <code>num<\/code> kaj <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi deklaras variablon per unu el ili same kiel vi farus per <code>Int<\/code> aŭ <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Indiĝena valoro korespondas rekte al maŝina registro aŭ vorto, sen la envolva objekto, kiun portas normala Raku-valoro.<\/span> <span class=\"sg\" data-s=\"1\">Tio igas indiĝenajn tipojn pli rapidaj kaj pli kompaktaj, kio gravas en striktaj nombraj bukloj kaj grandaj tabeloj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas unu konduto, pri kiu vi tuj konsciu: indiĝena variablo neniam povas esti nedefinita.<\/span> <span class=\"sg\" data-s=\"1\">Dum ordinara <code>Int<\/code>-ujo komenciĝas kiel nedefinita <code>Any<\/code>, indiĝena <code>int<\/code> komenciĝas je <strong>nulo<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sama validas por indiĝenaj tabeloj, deklaritaj per metado de la indiĝena tipo antaŭ la <code>@<\/code>-variablon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tia tabelo konservas siajn elementojn kiel krudajn maŝinajn entjerojn anstataŭ kiel enkastitajn <code>Int<\/code>-objektojn, do ĝi uzas malpli da memoro.<\/span> <span class=\"sg\" data-s=\"1\">Kiam vi introspektas indiĝenan valoron, ĝi estas aŭtomate <em>enkastita<\/em> en la konvenan plenan tipon, tial <code>(my int $b).WHAT<\/code> raportas <code>(Int)<\/code>.<\/span><\/p>"]]},"la":{"t":"Typi machinae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Typi nativi nomina minuscula habent: <code>int<\/code>, <code>num<\/code>, et <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Variabilem cum uno eorum declaras sicut cum <code>Int<\/code> vel <code>Str<\/code> faceres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor nativus directe registro vel verbo machinae respondet, sine objecto involucro quod valor normalis Raku portat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc typos nativos celeriores et compactiores facit, quod in arctiis cyclis numericis et magnis indicibus refert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una proprietas statim cognoscenda est: variabilis nativa numquam indefinita esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Ubi ordinarium <code>Int<\/code> receptaculum ut indefinitum <code>Any<\/code> incipit, nativus <code>int<\/code> a <strong>nulla<\/strong> incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Idem ad indices nativos pertinet, qui declarantur ponendo typum nativum ante variabilem <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Talis index elementa sua ut integros crudos machinae reponit potius quam ut objecta involuta <code>Int<\/code>, itaque minus memoriae utitur.<\/span> <span class=\"sg\" data-s=\"1\">Cum valorem nativum introspicis, automatice in typum plenum correspondentem <em>involvitur<\/em>, quare <code>(my int $b).WHAT<\/code> refert <code>(Int)<\/code>.<\/span><\/p>"]]}}}</script>
