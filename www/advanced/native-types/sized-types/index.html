<script type="application/json" id="page-data">{"u":"advanced/native-types/sized-types","n":443,"k":"topic","pv":"advanced/native-types/machine-types/quiz","nx":"advanced/native-types/sized-types/quiz","tr":["advanced","advanced/native-types"],"L":{"en":{"t":"Sized types and overflow","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides the plain <code>int<\/code>, Raku has integers of a fixed bit width: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code>, and their unsigned partners <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The number is how many bits the value occupies.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A fixed width means a fixed range.<\/span> <span class=\"sg\" data-s=\"1\">An <code>int8<\/code> holds values from <code>-128<\/code> to <code>127<\/code>; a <code>uint8<\/code> holds <code>0<\/code> to <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Because the storage cannot grow, going past the top wraps around to the bottom — this is <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adding one to the largest <code>int8<\/code> does not produce <code>128<\/code> (which would not fit); it wraps to the smallest value, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unsigned types wrap too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is the opposite of a normal <code>Int<\/code>, which simply grows as large as needed and never overflows.<\/span> <span class=\"sg\" data-s=\"1\">The trade-off is the whole point of sized natives: you accept a fixed range in return for predictable, compact, fast storage.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Use a sized native type when you know the range of your data and want the efficiency — for example, bytes of binary data in a <code>uint8<\/code> array.<\/span> <span class=\"sg\" data-s=\"1\">For ordinary arithmetic where numbers may grow without bound, stick with <code>Int<\/code>.<\/span><\/p>"]]},"de":{"t":"Typen mit fester Größe und Überlauf","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben dem einfachen <code>int<\/code> bietet Raku Ganzzahlen mit fester Bitbreite: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> und ihre vorzeichenlosen Gegenstücke <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die Zahl gibt an, wie viele Bits der Wert belegt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine feste Breite bedeutet einen festen Bereich.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>int8<\/code> fasst Werte von <code>-128<\/code> bis <code>127<\/code>; ein <code>uint8<\/code> fasst <code>0<\/code> bis <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Da der Speicher nicht wachsen kann, führt das Überschreiten des oberen Endes zu einem Umlauf zum unteren Ende — das ist ein <em>Überlauf<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Addieren von Eins zum größten <code>int8<\/code> ergibt nicht <code>128<\/code> (das würde nicht hineinpassen), sondern es springt zum kleinsten Wert, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vorzeichenlose Typen haben ebenfalls einen Umlauf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist das Gegenteil eines normalen <code>Int<\/code>, der einfach so groß wird wie nötig und niemals überläuft.<\/span> <span class=\"sg\" data-s=\"1\">Der Kompromiss ist genau der Sinn von nativen Typen mit fester Größe: Du akzeptierst einen festen Bereich im Austausch für vorhersagbaren, kompakten und schnellen Speicher.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verwende einen nativen Typ mit fester Größe, wenn du den Bereich deiner Daten kennst und die Effizienz möchtest — zum Beispiel Bytes von Binärdaten in einem <code>uint8<\/code>-Array.<\/span> <span class=\"sg\" data-s=\"1\">Für gewöhnliche Arithmetik, bei der Zahlen unbegrenzt wachsen können, bleibe bei <code>Int<\/code>.<\/span><\/p>"]]},"nl":{"t":"Typen met vaste grootte en overflow","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast het gewone <code>int<\/code> heeft Raku gehele getallen met een vaste bitbreedte: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code>, en hun unsigned tegenhangers <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het getal geeft aan hoeveel bits de waarde in beslag neemt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een vaste breedte betekent een vast bereik.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>int8<\/code> bevat waarden van <code>-128<\/code> tot <code>127<\/code>; een <code>uint8<\/code> bevat <code>0<\/code> tot <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Omdat de opslag niet kan groeien, wordt bij het overschrijden van de bovenkant teruggewrapped naar de onderkant — dit is <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het optellen van een bij de grootste <code>int8<\/code> levert niet <code>128<\/code> op (dat zou niet passen); het wrapt naar de kleinste waarde, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unsigned typen wrappen ook:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is het tegenovergestelde van een normaal <code>Int<\/code>, dat gewoon zo groot groeit als nodig is en nooit overflowt.<\/span> <span class=\"sg\" data-s=\"1\">De afweging is precies het doel van native typen met vaste grootte: je accepteert een vast bereik in ruil voor voorspelbare, compacte en snelle opslag.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik een native type met vaste grootte wanneer je het bereik van je gegevens kent en de efficientie wilt — bijvoorbeeld bytes van binaire gegevens in een <code>uint8<\/code>-array.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik voor gewone rekenkundige bewerkingen waarbij getallen onbegrensd kunnen groeien gewoon <code>Int<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipos con tamaño y desbordamiento","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además del simple <code>int<\/code>, Raku tiene enteros con un ancho de bits fijo: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code>, y sus equivalentes sin signo <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El número indica cuántos bits ocupa el valor.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un ancho fijo significa un rango fijo.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>int8<\/code> contiene valores de <code>-128<\/code> a <code>127<\/code>; un <code>uint8<\/code> contiene de <code>0<\/code> a <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Como el almacenamiento no puede crecer, sobrepasar el límite superior provoca que el valor vuelva al inicio — esto es el <em>desbordamiento<\/em> (overflow):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sumar uno al mayor <code>int8<\/code> no produce <code>128<\/code> (que no cabría); se envuelve al valor más pequeño, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los tipos sin signo también se desbordan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es lo contrario de un <code>Int<\/code> normal, que simplemente crece tanto como sea necesario y nunca se desborda.<\/span> <span class=\"sg\" data-s=\"1\">Esta compensación es precisamente la razón de ser de los nativos con tamaño definido: aceptas un rango fijo a cambio de un almacenamiento predecible, compacto y rápido.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa un tipo nativo con tamaño cuando conozcas el rango de tus datos y quieras eficiencia — por ejemplo, bytes de datos binarios en un array <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para aritmética ordinaria donde los números pueden crecer sin límite, usa <code>Int<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipi dimensionati e overflow","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre al semplice <code>int<\/code>, Raku dispone di interi con una larghezza in bit fissa: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> e le loro controparti senza segno <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il numero indica quanti bit occupa il valore.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una larghezza fissa significa un intervallo fisso.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>int8<\/code> contiene valori da <code>-128<\/code> a <code>127<\/code>; un <code>uint8<\/code> contiene da <code>0<\/code> a <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poiché lo spazio di memorizzazione non può crescere, superare il massimo fa ricominciare dal minimo — questo è l'<em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aggiungere uno al valore massimo di <code>int8<\/code> non produce <code>128<\/code> (che non ci starebbe); il valore si riavvolge al minimo, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Anche i tipi senza segno si riavvolgono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è l'opposto di un normale <code>Int<\/code>, che semplicemente cresce quanto necessario e non va mai in overflow.<\/span> <span class=\"sg\" data-s=\"1\">Il compromesso è proprio il punto dei nativi con dimensione fissa: si accetta un intervallo limitato in cambio di una memorizzazione prevedibile, compatta e veloce.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa un tipo nativo con dimensione fissa quando conosci l'intervallo dei tuoi dati e vuoi l'efficienza — ad esempio, byte di dati binari in un array <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per l'aritmetica ordinaria dove i numeri possono crescere senza limiti, resta con <code>Int<\/code>.<\/span><\/p>"]]},"lv":{"t":"Izmēra tipi un pārpilde","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Papildus parastajam <code>int<\/code>, Raku piedāvā veselos skaitļus ar fiksētu bitu platumu: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> un to neparakstītos partnerus <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Skaitlis norāda, cik bitus vērtība aizņem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fiksēts platums nozīmē fiksētu diapazonu.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> satur vērtības no <code>-128<\/code> līdz <code>127<\/code>; <code>uint8<\/code> satur no <code>0<\/code> līdz <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā kā krātuve nevar pieaugt, pārkāpjot augšējo robežu, vērtība apgriežas uz apakšējo — tā ir <em>pārplūšana<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pievienojot vieninieku lielākajam <code>int8<\/code>, netiek iegūts <code>128<\/code> (kas neietilptu); vērtība apgriežas uz mazāko vērtību, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Neparakstītie tipi arī apgriežas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir pretēji parastajam <code>Int<\/code>, kurš vienkārši pieaug tik liels, cik nepieciešams, un nekad nepārplūst.<\/span> <span class=\"sg\" data-s=\"1\">Kompromiss ir viss natīvo tipu ar fiksētu izmēru jēga: jūs pieņemat fiksētu diapazonu apmaiņā pret paredzamu, kompaktu un ātru krātuvi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet natīvo tipu ar fiksētu izmēru, kad zināt savu datu diapazonu un vēlaties efektivitāti — piemēram, bināro datu baiti <code>uint8<\/code> masīvā.<\/span> <span class=\"sg\" data-s=\"1\">Parastai aritmētikai, kur skaitļi var pieaugt bez ierobežojumiem, palieciet pie <code>Int<\/code>.<\/span><\/p>"]]},"ru":{"t":"Типы с фиксированным размером и переполнение","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Помимо обычного <code>int<\/code>, в Raku есть целочисленные типы фиксированной разрядности: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> и их беззнаковые аналоги <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Число в имени обозначает, сколько бит занимает значение.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фиксированная разрядность означает фиксированный диапазон.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> хранит значения от <code>-128<\/code> до <code>127<\/code>; <code>uint8<\/code> — от <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поскольку размер хранилища не может увеличиваться, выход за верхнюю границу приводит к «обороту» к нижней — это <em>переполнение<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прибавление единицы к наибольшему значению <code>int8<\/code> не даёт <code>128<\/code> (которое не поместилось бы); вместо этого происходит переход к наименьшему значению, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Беззнаковые типы также переполняются:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это противоположность обычного <code>Int<\/code>, который просто увеличивается настолько, насколько нужно, и никогда не переполняется.<\/span> <span class=\"sg\" data-s=\"1\">Компромисс — это и есть суть типов фиксированного размера: вы принимаете ограниченный диапазон в обмен на предсказуемое, компактное и быстрое хранение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Используйте нативный тип фиксированного размера, когда вы знаете диапазон ваших данных и хотите повысить эффективность — например, для байтов двоичных данных в массиве <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для обычной арифметики, где числа могут расти без ограничений, используйте <code>Int<\/code>.<\/span><\/p>"]]},"uk":{"t":"Типи фіксованого розміру та переповнення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім звичайного <code>int<\/code>, Raku має цілі числа сталої бітової ширини: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> та їхні беззнакові партнери <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Число вказує, скільки бітів займає значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стала ширина означає сталий діапазон.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> містить значення від <code>-128<\/code> до <code>127<\/code>; <code>uint8<\/code> — від <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Оскільки сховище не може зрости, вихід за верхню межу загортається до нижньої — це <em>переповнення<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Додавання одиниці до найбільшого <code>int8<\/code> не дає <code>128<\/code> (яке б не вмістилося); воно загортається до найменшого значення, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Беззнакові типи теж загортаються:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це протилежність звичайному <code>Int<\/code>, який просто зростає настільки, наскільки потрібно, і ніколи не переповнюється.<\/span> <span class=\"sg\" data-s=\"1\">У цьому компромісі й полягає весь сенс машинних типів фіксованого розміру: ви приймаєте сталий діапазон в обмін на передбачуване, компактне й швидке сховище.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Використовуйте машинний тип фіксованого розміру, коли знаєте діапазон своїх даних і хочете ефективності, — наприклад, для байтів двійкових даних у масиві <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для звичайної арифметики, де числа можуть зростати без меж, тримайтеся <code>Int<\/code>.<\/span><\/p>"]]},"bg":{"t":"Типове с размер и препълване","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен обикновения <code>int<\/code>, Raku има цели числа с фиксирана битова ширина: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> и техните беззнакови партньори <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Числото показва колко бита заема стойността.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фиксираната ширина означава фиксиран диапазон.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> съдържа стойности от <code>-128<\/code> до <code>127<\/code>; <code>uint8<\/code> съдържа от <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тъй като хранилището не може да расте, преминаването над горната граница води до връщане в началото — това е <em>препълване<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавянето на единица към най-голямата стойност на <code>int8<\/code> не дава <code>128<\/code> (което не би се побрало); вместо това стойността се обръща до най-малката, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Беззнаковите типове също се обръщат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е обратното на нормалния <code>Int<\/code>, който просто расте колкото е необходимо и никога не препълва.<\/span> <span class=\"sg\" data-s=\"1\">Компромисът е целият смисъл на нативните типове с размер: приемате фиксиран диапазон в замяна на предвидимо, компактно и бързо съхранение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвайте нативен тип с размер, когато знаете диапазона на данните си и искате ефективност — например байтове от двоични данни в <code>uint8<\/code> масив.<\/span> <span class=\"sg\" data-s=\"1\">За обикновена аритметика, при която числата могат да растат неограничено, използвайте <code>Int<\/code>.<\/span><\/p>"]]},"eo":{"t":"Grandecaj tipoj kaj superfluo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom la simpla <code>int<\/code>, Raku havas entjerojn kun fiksa bitlarĝo: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> kaj iliajn sensignajn partnerojn <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La nombro indikas, kiom da bitoj la valoro okupas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fiksa larĝo signifas fiksan amplekson.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> enhavas valorojn de <code>-128<\/code> ĝis <code>127<\/code>; <code>uint8<\/code> enhavas <code>0<\/code> ĝis <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉar la stokado ne povas kreski, transiri la supron ĉirkaŭvolvas al la malsupro — tio estas <em>superfluo<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aldoni unu al la plej granda <code>int8<\/code> ne produktas <code>128<\/code> (kiu ne konvenus); ĝi ĉirkaŭvolvas al la plej malgranda valoro, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sensignaj tipoj ankaŭ ĉirkaŭvolvas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio estas la malo de normala <code>Int<\/code>, kiu simple kreskas tiel grande kiom necese kaj neniam superfluiĝas.<\/span> <span class=\"sg\" data-s=\"1\">La kompromiso estas la tuta celo de grandigitaj indiĝenaj tipoj: vi akceptas fiksan amplekson kontraŭ antaŭvidebla, kompakta, rapida stokado.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzu grandigitan indiĝenan tipon kiam vi konas la amplekson de viaj datumoj kaj volas la efikecon — ekzemple, bajtojn de binaraj datumoj en <code>uint8<\/code>-tabelo.<\/span> <span class=\"sg\" data-s=\"1\">Por ordinara aritmetiko, kie nombroj povas kreski senlime, restu ĉe <code>Int<\/code>.<\/span><\/p>"]]},"la":{"t":"Typi cum magnitudine et superfluentia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter simplicem <code>int<\/code>, Raku integros latitudinis bitorum fixae habet: <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code>, et eorum socios non signatos <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Numerus indicat quot bitos valor occupat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Latitudo fixa significat ambitum fixum.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> valores a <code>-128<\/code> ad <code>127<\/code> continet; <code>uint8<\/code> continet <code>0<\/code> ad <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quia repositorium crescere non potest, transire ultra summum ad imum circumvolvitur — hic est <em>superfluxus<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unum addere ad maximum <code>int8<\/code> non producit <code>128<\/code> (quod non caperet); circumvolvitur ad minimum valorem, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Typi non signati quoque circumvolvuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc contrarium est normalis <code>Int<\/code>, qui simpliciter tam magnus crescit quantum opus est et numquam superfluit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc compromissum est totum propositum nativorum dimensorum: ambitum fixum acceptas pro repositorio praedictabili, compacto, celeri.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Typum nativum dimensum adhibe cum ambitum datorum tuorum cognoscis et efficientiam vis — exempli gratia, bytes datorum binariorum in indice <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pro arithmetica ordinaria ubi numeri sine limite crescere possunt, <code>Int<\/code> adhibe.<\/span><\/p>"]]}}}</script>
