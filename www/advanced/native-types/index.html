<script type="application/json" id="page-data">{"u":"advanced/native-types","n":440,"k":"section","pv":"advanced/integers/exercises/prime-check/solution","nx":"advanced/native-types/machine-types","tr":["advanced"],"L":{"en":{"t":"Native types","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The types you have used so far — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — are full Raku objects: flexible, introspectable, and arbitrarily large.<\/span> <span class=\"sg\" data-s=\"1\">Raku also offers a parallel family of <em>native<\/em> types that map directly onto the machine’s own representation: <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, and a set of sized integers.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Native types are written in lower case.<\/span> <span class=\"sg\" data-s=\"1\">They trade flexibility for speed and a fixed size, and they behave a little differently from their boxed counterparts.<\/span> <span class=\"sg\" data-s=\"2\">This section shows what they are and how their fixed size leads to overflow.<\/span><\/p>"]]},"de":{"t":"Native Typen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Typen, die du bisher verwendet hast — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — sind vollwertige Raku-Objekte: flexibel, introspektierbar und beliebig groß.<\/span> <span class=\"sg\" data-s=\"1\">Raku bietet zusätzlich eine parallele Familie von <em>nativen<\/em> Typen, die direkt auf die maschineneigene Darstellung abgebildet werden: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> sowie eine Reihe von Ganzzahlen mit fester Größe.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Native Typen werden klein geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Sie tauschen Flexibilität gegen Geschwindigkeit und eine feste Größe ein und verhalten sich etwas anders als ihre geboxten Gegenstücke.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt zeigt, was sie sind und wie ihre feste Größe zu einem Überlauf führen kann.<\/span><\/p>"]]},"nl":{"t":"Native typen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De typen die je tot nu toe hebt gebruikt — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — zijn volwaardige Raku-objecten: flexibel, introspecteerbaar en willekeurig groot.<\/span> <span class=\"sg\" data-s=\"1\">Raku biedt ook een parallelle familie van <em>native<\/em> typen die direct overeenkomen met de representatie van de machine: <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, en een reeks gehele getallen met vaste grootte.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Native typen worden met kleine letters geschreven.<\/span> <span class=\"sg\" data-s=\"1\">Ze ruilen flexibiliteit in voor snelheid en een vaste grootte, en ze gedragen zich een beetje anders dan hun boxed tegenhangers.<\/span> <span class=\"sg\" data-s=\"2\">Dit deel laat zien wat ze zijn en hoe hun vaste grootte tot overflow leidt.<\/span><\/p>"]]},"es":{"t":"Tipos nativos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tipos que has usado hasta ahora — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — son objetos completos de Raku: flexibles, introspectables y de tamaño arbitrario.<\/span> <span class=\"sg\" data-s=\"1\">Raku también ofrece una familia paralela de tipos <em>nativos<\/em> que se corresponden directamente con la representación propia de la máquina: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> y un conjunto de enteros con tamaño definido.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los tipos nativos se escriben en minúsculas.<\/span> <span class=\"sg\" data-s=\"1\">Sacrifican flexibilidad a cambio de velocidad y un tamaño fijo, y se comportan de manera un poco diferente a sus equivalentes encapsulados.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección muestra qué son y cómo su tamaño fijo puede provocar desbordamiento.<\/span><\/p>"]]},"it":{"t":"Tipi nativi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I tipi che hai usato finora — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — sono oggetti Raku completi: flessibili, introspezionabili e di dimensione arbitraria.<\/span> <span class=\"sg\" data-s=\"1\">Raku offre anche una famiglia parallela di tipi <em>nativi<\/em> che corrispondono direttamente alla rappresentazione della macchina: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> e un insieme di interi di dimensione fissa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I tipi nativi si scrivono in minuscolo.<\/span> <span class=\"sg\" data-s=\"1\">Sacrificano la flessibilità in favore della velocità e di una dimensione fissa, e si comportano in modo leggermente diverso rispetto alle loro controparti boxed.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione mostra cosa sono e come la loro dimensione fissa porta all'overflow.<\/span><\/p>"]]},"lv":{"t":"Natīvie tipi 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tipi, kurus esat lietojuši līdz šim — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — ir pilnvērtīgi Raku objekti: elastīgi, introspektīvi un patvaļīgi lieli.<\/span> <span class=\"sg\" data-s=\"1\">Raku piedāvā arī paralēlu <em>natīvo<\/em> tipu saimi, kas tieši atbilst mašīnas pašas attēlojumam: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> un fiksēta izmēra veselo skaitļu kopa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Natīvie tipi tiek rakstīti ar mazajiem burtiem.<\/span> <span class=\"sg\" data-s=\"1\">Tie apmaina elastību pret ātrumu un fiksētu izmēru, un tie uzvedas nedaudz atšķirīgi no saviem iesaiņotajiem ekvivalentiem.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa parāda, kas tie ir un kā to fiksētais izmērs noved pie pārplūšanas.<\/span><\/p>"]]},"ru":{"t":"Нативные типы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Типы, которые вы использовали до сих пор — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — являются полноценными объектами Raku: гибкими, поддерживающими интроспекцию и произвольно большими.<\/span> <span class=\"sg\" data-s=\"1\">Raku также предлагает параллельное семейство <em>нативных<\/em> типов, которые отображаются непосредственно на машинное представление: <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, а также набор целочисленных типов фиксированного размера.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Нативные типы пишутся строчными буквами.<\/span> <span class=\"sg\" data-s=\"1\">Они жертвуют гибкостью ради скорости и фиксированного размера и ведут себя несколько иначе, чем их обёрточные аналоги.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе показано, что они собой представляют и как их фиксированный размер приводит к переполнению.<\/span><\/p>"]]},"uk":{"t":"Машинні типи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Типи, якими ви користувалися досі — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code>, — є повноцінними об'єктами Raku: гнучкими, придатними до інтроспекції та довільно великими.<\/span> <span class=\"sg\" data-s=\"1\">Raku пропонує також паралельну родину <em>машинних<\/em> типів, які прямо відображаються на власне подання машини: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> і набір цілих чисел фіксованого розміру.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Машинні типи записують малими літерами.<\/span> <span class=\"sg\" data-s=\"1\">Вони міняють гнучкість на швидкість і сталий розмір і поводяться дещо інакше за своїх упакованих відповідників.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ показує, що вони собою являють і як їхній сталий розмір призводить до переповнення.<\/span><\/p>"]]},"bg":{"t":"Нативни типове 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Типовете, които сте използвали досега — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — са пълноценни Raku обекти: гъвкави, достъпни за интроспекция и с произволен размер.<\/span> <span class=\"sg\" data-s=\"1\">Raku предлага и паралелно семейство от <em>нативни<\/em> типове, които се преобразуват директно в машинното представяне: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> и набор от целочислени типове с определен размер.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Нативните типове се изписват с малки букви.<\/span> <span class=\"sg\" data-s=\"1\">Те жертват гъвкавост в полза на скорост и фиксиран размер и се държат малко по-различно от техните обвити аналози.<\/span> <span class=\"sg\" data-s=\"2\">Тази секция показва какво представляват и как фиксираният им размер води до препълване.<\/span><\/p>"]]},"eo":{"t":"Denaskaj tipoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La tipoj, kiujn vi uzis ĝis nun — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — estas plenaj Raku-objektoj: flekseblaj, introspekteblaj kaj arbitre grandaj.<\/span> <span class=\"sg\" data-s=\"1\">Raku ankaŭ ofertas paralelan familion de <em>indiĝenaj<\/em> tipoj, kiuj mapas rekte al la propra reprezentado de la maŝino: <code>int<\/code>, <code>num<\/code>, <code>str<\/code> kaj aro de grandigitaj entjeroj.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Indiĝenaj tipoj estas skribitaj per minusklaj literoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili interŝanĝas flekseblecon kontraŭ rapideco kaj fiksa grando, kaj ili kondutas iom malsame ol siaj enkastitaj ekvivalentoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio montras, kio ili estas kaj kiel ilia fiksa grando kondukas al superfluo.<\/span><\/p>"]]},"la":{"t":"Typi nativi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Typi quos adhuc adhibuisti — <code>Int<\/code>, <code>Num<\/code>, <code>Str<\/code> — pleni objecti Raku sunt: flexibiles, introspectabiles, et arbitrarie magni.<\/span> <span class=\"sg\" data-s=\"1\">Raku etiam familiam parallelam typorum <em>nativorum<\/em> offert qui directe ad repraesentationem machinae ipsam referuntur: <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, et series integrorum dimensorum.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Typi nativi litteris minusculis scribuntur.<\/span> <span class=\"sg\" data-s=\"1\">Flexibilitatem pro celeritate et magnitudine fixa commutant, et paulo aliter se gerunt quam eorum aequivalentes involuti.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio ostendit quid sint et quomodo eorum magnitudo fixa ad superfluxum ducat.<\/span><\/p>"]]}}}</script>
