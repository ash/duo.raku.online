es that guarantee the <code>0<\/code> and empty-string defaults.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Der native Standardwert","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Eine native <code>num<\/code> kann nicht undefiniert sein, daher beginnt sie wie ein nativer <code>int<\/code> bei <code>0<\/code> statt bei <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein nativer <code>str<\/code> beginnt als leerer String, weshalb die Klammern ohne Inhalt dazwischen ausgegeben werden. Keiner der nativen Typen enthält jemals einen undefinierten Wert.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Typangaben sind hier entscheidend. Lässt du sie weg — schreibst also <code>my $n; my $s;<\/code> — werden die Variablen zu gewöhnlichen Containern, die <em>undefiniert<\/em> (<code>Any<\/code>) starten. Dann gibt <code>say $n<\/code> den Wert <code>(Any)<\/code> aus, und die Interpolation des undefinierten <code>$s<\/code> warnt mit <em>„Use of uninitialized value … in string context\"<\/em>. Es sind die nativen Typen <code>num<\/code> und <code>str<\/code>, die die Standardwerte <code>0<\/code> und leerer String garantieren.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: De native standaardwaarde","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een native <code>num<\/code> kan niet ongedefinieerd zijn, dus net als een native <code>int<\/code> begint het op <code>0<\/code> in plaats van op <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een native <code>str<\/code> begint als de lege string, daarom komen de haken uit zonder iets ertussen. Geen van de native typen bevat ooit een ongedefinieerde waarde.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De typespecificaties zijn hier essentieel. Laat ze weg — schrijf <code>my $n; my $s;<\/code> — en de variabelen worden gewone containers die <em>ongedefinieerd<\/em> (<code>Any<\/code>) beginnen. Dan drukt <code>say $n<\/code> <code>(Any)<\/code> af, en het interpoleren van de ongedefinieerde <code>$s<\/code> geeft de waarschuwing <em>\"Use of uninitialized value ... in string context\"<\/em>. Het zijn de native <code>num<\/code>- en <code>str<\/code>-typen die de standaardwaarden <code>0<\/code> en lege string garanderen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: El valor predeterminado nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una de las posibles soluciones:<\/span><\/p>"],[" $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>num<\/code> nativo non può essere indefinito, quindi come un <code>int<\/code> nativo inizia a <code>0<\/code> anziché a <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una <code>str<\/code> nativa inizia come stringa vuota, ed è per questo che le parentesi quadre appaiono senza nulla tra di esse. Nessuno dei tipi nativi contiene mai un valore indefinito.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gli specificatori di tipo sono essenziali qui. Rimuovendoli — scrivendo <code>my $n; my $s;<\/code> — le variabili diventano contenitori ordinari che iniziano come <em>indefiniti<\/em> (<code>Any<\/code>). In quel caso <code>say $n<\/code> stampa <code>(Any)<\/code>, e interpolare la <code>$s<\/code> indefinita genera l'avviso <em>\"Use of uninitialized value … in string context\"<\/em>. Sono i tipi nativi <code>num<\/code> e <code>str<\/code> a garantire i valori predefiniti <code>0<\/code> e stringa vuota.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Natīvā noklusējuma vērtība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Natīvais <code>num<\/code> nevar būt nedefinēts, tāpēc, tāpat kā natīvais <code>int<\/code>, tas sākas ar <code>0<\/code>, nevis ar <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Natīvais <code>str<\/code> sākas kā tukša virkne, tāpēc iekavas iznāk bez nekā starp tām. Neviens no natīvajiem tipiem nekad nesatur nedefinētu vērtību.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tipu specifikatori šeit ir būtiski. Izlaidiet tos — rakstiet <code>my $n; my $s;<\/code> — un mainīgie kļūst par parastiem konteineriem, kas sākas kā <em>nedefinēti<\/em> (<code>Any<\/code>). Tad <code>say $n<\/code> izdrukā <code>(Any)<\/code>, un nedefinētā <code>$s<\/code> interpolēšana brīdina <em>\"Use of uninitialized value … in string context\"<\/em>. Tieši natīvie <code>num<\/code> un <code>str<\/code> tipi garantē <code>0<\/code> un tukšas virknes noklusējuma vērtības.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Значение по умолчанию нативного типа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативный <code>num<\/code> не может быть неопределённым, поэтому, как и нативный <code>int<\/code>, он начинает с <code>0<\/code>, а не с <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативный <code>str<\/code> начинает с пустой строки, поэтому в квадратных скобках ничего не появляется. Ни один нативный тип никогда не содержит неопределённого значения.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Указание типов здесь принципиально. Уберите их — напишите <code>my $n; my $s;<\/code> — и переменные станут обычными контейнерами, которые начинают как <em>неопределённые<\/em> (<code>Any<\/code>). Тогда <code>say $n<\/code> выведет <code>(Any)<\/code>, а интерполяция неопределённого <code>$s<\/code> вызовет предупреждение <em>«Use of uninitialized value … in string context»<\/em>. Именно нативные типы <code>num<\/code> и <code>str<\/code> гарантируют значения по умолчанию <code>0<\/code> и пустую строку.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Типове значення машинного типу","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Машинний <code>num<\/code> не може бути невизначеним, тож, як і машинний <code>int<\/code>, він починає з <code>0<\/code>, а не з <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Машинний <code>str<\/code> починає з порожнього рядка, — саме тому між дужками нічого немає. Жоден із машинних типів ніколи не містить невизначеного значення.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Специфікатори типів тут украй важливі. Приберіть їх — напишіть <code>my $n; my $s;<\/code> — і змінні стануть звичайними контейнерами, які починають <em>невизначеними<\/em> (<code>Any<\/code>). Тоді <code>say $n<\/code> виводить <code>(Any)<\/code>, а інтерполяція невизначеної <code>$s<\/code> попереджає: <em>«Use of uninitialized value … in string context»<\/em>. Саме машинні типи <code>num<\/code> та <code>str<\/code> гарантують типові значення <code>0<\/code> та порожній рядок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Нативна стойност по подразбиране","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативен <code>num<\/code> не може да бъде недефиниран, така че подобно на нативен <code>int<\/code> започва от <code>0<\/code>, а не от <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативен <code>str<\/code> започва като празен низ, затова скобите излизат без нищо между тях. Никой от нативните типове никога не съдържа недефинирана стойност.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Спецификаторите на типа са от съществено значение тук. Ако ги пропуснете — напишете <code>my $n; my $s;<\/code> — променливите стават обикновени контейнери, които започват като <em>недефинирани<\/em> (<code>Any<\/code>). Тогава <code>say $n<\/code> отпечатва <code>(Any)<\/code>, а интерполирането на недефинирания <code>$s<\/code> предупреждава <em>\"Use of uninitialized value … in string context\"<\/em>. Именно нативните типове <code>num<\/code> и <code>str<\/code> гарантират стойностите по подразбиране <code>0<\/code> и празен низ.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: La denaska defaŭlto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indiĝena <code>num<\/code> ne povas esti nedefinita, do same kiel indiĝena <code>int<\/code> ĝi komenciĝas je <code>0<\/code> anstataŭ je <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indiĝena <code>str<\/code> komenciĝas kiel malplena ĉeno, tial la krampoj aperas kun nenio inter ili. Neniu el la indiĝenaj tipoj iam ajn enhavas nedefinitan valoron.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tipspecifiloj estas esencaj ĉi tie. Forigu ilin — skribu <code>my $n; my $s;<\/code> — kaj la variabloj fariĝos ordinaraj ujoj, kiuj komenciĝas kiel <em>nedefinitaj<\/em> (<code>Any<\/code>). Tiam <code>say $n<\/code> presas <code>(Any)<\/code>, kaj interpoli la nedefinitan <code>$s<\/code> avertas <em>\"Use of uninitialized value … in string context\"<\/em>. Estas la indiĝenaj tipoj <code>num<\/code> kaj <code>str<\/code>, kiuj garantias la defaŭltajn <code>0<\/code> kaj malplenan ĉenon.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Praedefinitum nativum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nativus <code>num<\/code> indefinitus esse non potest, itaque sicut nativus <code>int<\/code> a <code>0<\/code> incipit potius quam a <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nativus <code>str<\/code> ut chorda vacua incipit, quare parentheses quadratae sine ullo inter eas apparent. Nullus typorum nativorum umquam valorem indefinitum continet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Specificatores typorum hic essentiales sunt. Eos omitte — scribe <code>my $n; my $s;<\/code> — et variabiles ordinaria receptacula fiunt quae <em>indefinite<\/em> (<code>Any<\/code>) incipiunt. Tunc <code>say $n<\/code> imprimit <code>(Any)<\/code>, et interpolatio indefiniti <code>$s<\/code> monet <em>\"Use of uninitialized value … in string context\"<\/em>. Typi nativi <code>num<\/code> et <code>str<\/code> sunt qui valores defaltarum <code>0<\/code> et chordae vacuae garantiunt.<\/span><\/li><\/ol>"]]}}}</script>
