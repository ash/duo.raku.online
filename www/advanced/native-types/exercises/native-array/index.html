m<\/code> gibt einen gewöhnlichen <code>Int<\/code> zurück.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/native-types/exercises/native-array/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Een native array","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het natuurlijke gebruik van een native type met vaste grootte is een compacte array van bytes.<\/span> <span class=\"sg\" data-s=\"1\">Declareer een <code>uint8<\/code>-array met de waarden <code>100<\/code>, <code>200<\/code> en <code>255<\/code> — elk past in een enkele byte — en druk de som van de elementen af.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de elementen binnen <code>0..255<\/code> blijven, maar hun som hoeft dat niet: <code>.sum<\/code> geeft een gewoon <code>Int<\/code> terug.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/native-types/exercises/native-array/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Un array nativo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El uso natural de un tipo nativo con tamaño es un array compacto de bytes.<\/span> <span class=\"sg\" data-s=\"1\">Declara un array <code>uint8<\/code> con los valores <code>100<\/code>, <code>200<\/code> y <code>255<\/code> — cada uno cabe en un solo byte — e im "b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Природне застосування машинного типу фіксованого розміру — компактний масив байтів.<\/span> <span class=\"sg\" data-s=\"1\">Оголосіть масив <code>uint8<\/code>, що містить значення <code>100<\/code>, <code>200<\/code> та <code>255<\/code> — кожне вміщується в один байт, — і виведіть суму його елементів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що елементи лишаються в межах <code>0..255<\/code>, але їхня сума не мусить: <code>.sum<\/code> повертає звичайний <code>Int<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/native-types/exercises/native-array/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Нативен масив","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Естественото приложение на нативен тип с размер е компактен масив от байтове.<\/span> <span class=\"sg\" data-s=\"1\">Декларирайте <code>uint8<\/code> масив, съдържащ стойностите <code>100<\/code>, <code>200<\/code> и <code>255<\/code> — всяка се побира в един байт — и отпечатайте сумата на елементите му.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че елементите остават в диапазона <code>0..255<\/code>, но тяхната сума не е задължително да е в него: <code>.sum<\/code> връща обикновен <code>Int<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/native-types/exercises/native-array/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Denaska tabelo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La natura uzo por grandigita indiĝena tipo estas kompakta tabelo de bajtoj.<\/span> <span class=\"sg\" data-s=\"1\">Deklaru <code>uint8<\/code>-tabelon enhavantan la valorojn <code>100<\/code>, <code>200<\/code> kaj <code>255<\/code> — ĉiu konvenas en unu bajto — kaj presu la sumon de ĝiaj elementoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la elementoj restas ene de <code>0..255<\/code>, sed ilia sumo ne devas: <code>.sum<\/code> redonas ordinaran <code>Int<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/native-types/exercises/native-array/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Array nativum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usus naturalis typi nativi dimensi est index compactus bytorum.<\/span> <span class=\"sg\" data-s=\"1\">Declara indicem <code>uint8<\/code> qui valores <code>100<\/code>, <code>200<\/code>, et <code>255<\/code> continet — quisque in unum byte capit — et summam elementorum eius imprime.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod elementa intra <code>0..255<\/code> manent, sed summa eorum non debet: <code>.sum<\/code> ordinarium <code>Int<\/code> reddit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma imprimit:<\/
