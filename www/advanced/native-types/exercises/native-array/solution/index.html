en array waarin elk element als een enkele unsigned byte wordt opgeslagen — de compacte indeling die geschikt is voor binaire gegevens.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De wrap-around-limiet geldt voor elk <em>element<\/em> (<code>0..255<\/code>), niet voor het resultaat van het optellen ervan. <code>.sum<\/code> boxt het totaal naar een gewoon <code>Int<\/code>, dus <code>100 + 200 + 255<\/code> geeft de volledige <code>555<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un array nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una de las posibles soluciones:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 @bytes = 100, 200, 255;\nsay @bytes.sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-array.raku\" target=\"_blank\" rel=\"noopener\">native-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Colocar el tipo nativo con tamaño <code>uint8<\/code> antes del array <code>@<\/code> declara un array donde cada elemento se almacena como un solo byte sin signo — la disposición compacta que se adapta a los datos binarios.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El límite de desbordamiento se aplica a cada <em>elemento<\/em> (<code>0..255<\/code>), no al resultado de sumarlos. <code>.sum<\/code> encapsula el total en un <code>Int<\/code> ordinario, así que <code>100 + 200 + 255<\/code> da el <code>555<\/code> completo.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un array nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una p <\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Liekot natīvo tipu ar fiksētu izmēru <code>uint8<\/code> pirms <code>@<\/code> masīva, tiek deklarēts masīvs, kur katrs elements tiek glabāts kā viens neparakstīts baits — kompakts izkārtojums, kas piemērots binārajiem datiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Apgriešanās limits attiecas uz katru <em>elementu<\/em> (<code>0..255<\/code>), nevis uz to summēšanas rezultātu. <code>.sum<\/code> iesaiņo summu parastajā <code>Int<\/code>, tāpēc <code>100 + 200 + 255<\/code> dod pilno <code>555<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Нативный массив","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 @bytes = 100, 200, 255;\nsay @bytes.sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-array.raku\" target=\"_blank\" rel=\"noopener\">native-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Указание нативного типа фиксированного размера <code>uint8<\/code> перед массивом с <code>@<\/code> объявляет массив, в котором каждый элемент хранится как один беззнаковый байт — компактная структура, подходящая для двоичных данных.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ограничение на обёртывание применяется к каждому <em>элементу<\/em> (<code>0..255<\/code>), а не к результату их суммирования. <code>.sum<\/code> упаковывает итог в обычный <code>Int<\/code>, п
