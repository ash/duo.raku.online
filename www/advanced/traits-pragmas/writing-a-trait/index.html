<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/writing-a-trait","n":567,"k":"topic","pv":"advanced/traits-pragmas/built-in-traits/quiz","nx":"advanced/traits-pragmas/pragmas","tr":["advanced","advanced/traits-pragmas"],"L":{"en":{"t":"Writing a trait","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Traits are ordinary multi-subroutines with a special name, so you can write your own.<\/span> <span class=\"sg\" data-s=\"1\">To add a trait spelled <code>is something<\/code>, define a <code>multi sub trait_mod:&lt;is&gt;<\/code> whose parameters say what it applies to and name the trait:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is one of the more advanced corners of Raku, so do not worry if it feels intricate.<\/span> <span class=\"sg\" data-s=\"1\">You can use the built-in traits perfectly well without knowing how they are made, and you will rarely need to write one yourself — treat this page as a look under the hood.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Read the signature: the first parameter, <code>Routine:D $r<\/code>, is the thing the trait is attached to — here a subroutine.<\/span> <span class=\"sg\" data-s=\"1\">The <code>:D<\/code> is a type <em>smiley<\/em> that demands a <strong>defined<\/strong> value — an actual routine object, not the bare, undefined <code>Routine<\/code> type itself. (Its partners are <code>:U<\/code>, which requires the undefined type object, and <code>:_<\/code>, which accepts either.)<\/span> <span class=\"sg\" data-s=\"2\">The named parameter <code>:$traced!<\/code> is the trait’s own name; its presence is what makes <code>is traced<\/code> call this sub.<\/span> <span class=\"sg\" data-s=\"3\">Because traits run at <strong>compile time<\/strong>, both <code>foo<\/code> and <code>bar<\/code> are registered as they are declared, so <code>@traced<\/code> already lists them by the time the program runs — you could even move the <code>say @traced<\/code> line up above the two <code>sub<\/code> definitions and it would still print <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This tiny trait only records names, but the same mechanism can do much more: wrap a routine to add logging, validate an attribute, or attach metadata.<\/span> <span class=\"sg\" data-s=\"1\">Writing the first parameter as an <code>Attribute<\/code> or <code>Variable<\/code> instead of a <code>Routine<\/code> lets a trait apply to attributes or variables.<\/span> <span class=\"sg\" data-s=\"2\">Traits are how Raku keeps its declaration syntax open — <code>is rw<\/code> and your own <code>is traced<\/code> are built the same way.<\/span><\/p>"]]},"de":{"t":"Einen Trait schreiben","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Traits sind gewöhnliche Multi-Subroutinen mit einem speziellen Namen, sodass Sie Ihre eigenen schreiben können.<\/span> <span class=\"sg\" data-s=\"1\">Um ein Trait mit der Schreibweise <code>is something<\/code> hinzuzufügen, definieren Sie ein <code>multi sub trait_mod:&lt;is&gt;<\/code>, dessen Parameter angeben, worauf es sich bezieht, und das Trait benennen:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies ist eine der fortgeschritteneren Ecken von Raku, also machen Sie sich keine Sorgen, wenn es kompliziert wirkt.<\/span> <span class=\"sg\" data-s=\"1\">Sie können die eingebauten Traits problemlos verwenden, ohne zu wissen, wie sie aufgebaut sind, und Sie werden selten eines selbst schreiben müssen — betrachten Sie diese Seite als einen Blick unter die Haube.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie die Signatur: Der erste Parameter, <code>Routine:D $r<\/code>, ist das Element, an das das Trait angehängt wird — hier eine Subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Das <code>:D<\/code> ist ein Typ-<em>Smiley<\/em>, der einen <strong>definierten<\/strong> Wert verlangt — ein tatsächliches Routine-Objekt, nicht den bloßen, undefinierten Typ <code>Routine<\/code> selbst. (Seine Partner sind <code>:U<\/code>, das das undefinierte Typ-Objekt erfordert, und <code>:_<\/code>, das beides akzeptiert.)<\/span> <span class=\"sg\" data-s=\"2\">Der benannte Parameter <code>:$traced!<\/code> ist der eigene Name des Traits; sein Vorhandensein bewirkt, dass <code>is traced<\/code> diese Sub aufruft.<\/span> <span class=\"sg\" data-s=\"3\">Da Traits zur <strong>Kompilierzeit<\/strong> ausgeführt werden, sind sowohl <code>foo<\/code> als auch <code>bar<\/code> registriert, sobald sie deklariert werden, sodass <code>@traced<\/code> sie bereits auflistet, wenn das Programm läuft — Sie könnten sogar die Zeile <code>say @traced<\/code> über die beiden <code>sub<\/code>-Definitionen verschieben, und sie würde trotzdem <code>[foo bar]<\/code> ausgeben.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieses kleine Trait zeichnet nur Namen auf, aber derselbe Mechanismus kann viel mehr: eine Routine umhüllen, um Protokollierung hinzuzufügen, ein Attribut validieren oder Metadaten anhängen.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie den ersten Parameter als <code>Attribute<\/code> oder <code>Variable<\/code> statt als <code>Routine<\/code> schreiben, kann ein Trait auf Attribute oder Variablen angewendet werden.<\/span> <span class=\"sg\" data-s=\"2\">Traits sind der Weg, wie Raku seine Deklarationssyntax offen hält — <code>is rw<\/code> und Ihr eigenes <code>is traced<\/code> sind auf dieselbe Weise aufgebaut.<\/span><\/p>"]]},"nl":{"t":"Een trait schrijven","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Traits zijn gewone multi-subroutines met een speciale naam, dus je kunt er zelf een schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Om een trait toe te voegen die je als <code>is something<\/code> schrijft, definieer je een <code>multi sub trait_mod:&lt;is&gt;<\/code> waarvan de parameters zeggen waarop hij van toepassing is en hoe de trait heet:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is een van de meer gevorderde hoekjes van Raku, dus geen zorgen als het ingewikkeld aanvoelt.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt de ingebouwde traits prima gebruiken zonder te weten hoe ze gemaakt zijn, en je zult er zelden zelf een hoeven schrijven — beschouw deze pagina als een blik onder de motorkap.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lees de signatuur: de eerste parameter, <code>Routine:D $r<\/code>, is datgene waaraan de trait hangt — hier een subroutine.<\/span> <span class=\"sg\" data-s=\"1\">De <code>:D<\/code> is een type-<em>smiley<\/em> die een <strong>gedefinieerde<\/strong> waarde eist — een echt routineobject, niet het kale, ongedefinieerde type <code>Routine<\/code> zelf. (Zijn partners zijn <code>:U<\/code>, die het ongedefinieerde typeobject vereist, en <code>:_<\/code>, die beide accepteert.)<\/span> <span class=\"sg\" data-s=\"2\">De benoemde parameter <code>:$traced!<\/code> is de naam van de trait zelf; zijn aanwezigheid is wat <code>is traced<\/code> deze sub laat aanroepen.<\/span> <span class=\"sg\" data-s=\"3\">Omdat traits <strong>tijdens het compileren<\/strong> draaien, worden zowel <code>foo<\/code> als <code>bar<\/code> geregistreerd zodra ze gedeclareerd worden, zodat <code>@traced<\/code> ze al bevat tegen de tijd dat het programma draait — je zou de regel <code>say @traced<\/code> zelfs boven de twee <code>sub<\/code>-definities kunnen zetten en hij zou nog steeds <code>[foo bar]<\/code> afdrukken.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze piepkleine trait legt alleen namen vast, maar hetzelfde mechanisme kan veel meer: een routine omwikkelen om logging toe te voegen, een attribuut valideren of metadata aanhangen.<\/span> <span class=\"sg\" data-s=\"1\">Door de eerste parameter als <code>Attribute<\/code> of <code>Variable<\/code> te schrijven in plaats van als <code>Routine<\/code>, laat je een trait op attributen of variabelen werken.<\/span> <span class=\"sg\" data-s=\"2\">Traits zijn de manier waarop Raku zijn declaratiesyntaxis open houdt — <code>is rw<\/code> en je eigen <code>is traced<\/code> zijn op dezelfde manier gebouwd.<\/span><\/p>"]]},"es":{"t":"Escribir un trait","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los traits son subrutinas multi ordinarias con un nombre especial, por lo que puedes escribir los tuyos.<\/span> <span class=\"sg\" data-s=\"1\">Para agregar un trait que se escriba <code>is something<\/code>, define un <code>multi sub trait_mod:&lt;is&gt;<\/code> cuyos parámetros indiquen a qué se aplica y nombren el trait:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este es uno de los rincones más avanzados de Raku, así que no te preocupes si parece intrincado.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usar los traits incorporados perfectamente bien sin saber cómo están hechos, y rara vez necesitarás escribir uno tú mismo — trata esta página como una mirada bajo el capó.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lee la firma: el primer parámetro, <code>Routine:D $r<\/code>, es el elemento al que el trait está asociado — aquí una subrutina.<\/span> <span class=\"sg\" data-s=\"1\">El <code>:D<\/code> es un <em>smiley<\/em> de tipo que exige un valor <strong>definido<\/strong> — un objeto rutina real, no el tipo <code>Routine<\/code> vacío e indefinido en sí mismo. (Sus compañeros son <code>:U<\/code>, que requiere el objeto de tipo indefinido, y <code>:_<\/code>, que acepta cualquiera de los dos.)<\/span> <span class=\"sg\" data-s=\"2\">El parámetro nombrado <code>:$traced!<\/code> es el nombre propio del trait; su presencia es lo que hace que <code>is traced<\/code> llame a esta sub.<\/span> <span class=\"sg\" data-s=\"3\">Como los traits se ejecutan en <strong>tiempo de compilación<\/strong>, tanto <code>foo<\/code> como <code>bar<\/code> se registran al ser declarados, así que <code>@traced<\/code> ya los lista para cuando el programa se ejecuta — incluso podrías mover la línea <code>say @traced<\/code> arriba de las dos definiciones <code>sub<\/code> y aún así imprimiría <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este pequeño trait solo registra nombres, pero el mismo mecanismo puede hacer mucho más: envolver una rutina para agregar registro de eventos, validar un atributo, o adjuntar metadatos.<\/span> <span class=\"sg\" data-s=\"1\">Escribir el primer parámetro como un <code>Attribute<\/code> o <code>Variable<\/code> en lugar de un <code>Routine<\/code> permite que un trait se aplique a atributos o variables.<\/span> <span class=\"sg\" data-s=\"2\">Los traits son la forma en que Raku mantiene abierta su sintaxis de declaración — <code>is rw<\/code> y tu propio <code>is traced<\/code> están construidos de la misma manera.<\/span><\/p>"]]},"it":{"t":"Scrivere un trait","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I trait sono normali multi-subroutine con un nome speciale, quindi puoi scrivere i tuoi.<\/span> <span class=\"sg\" data-s=\"1\">Per aggiungere un trait scritto <code>is something<\/code>, definisci una <code>multi sub trait_mod:&lt;is&gt;<\/code> i cui parametri specificano a cosa si applica e il nome del trait:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è uno degli aspetti più avanzati di Raku, quindi non preoccuparti se ti sembra complesso.<\/span> <span class=\"sg\" data-s=\"1\">Puoi usare perfettamente i trait integrati senza sapere come sono realizzati, e raramente avrai bisogno di scriverne uno tu stesso — considera questa pagina come uno sguardo sotto il cofano.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Leggi la firma: il primo parametro, <code>Routine:D $r<\/code>, è l'elemento a cui il trait è associato — qui una subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>:D<\/code> è uno <em>smiley<\/em> di tipo che richiede un valore <strong>definito<\/strong> — un oggetto routine reale, non il tipo <code>Routine<\/code> indefinito. (I suoi compagni sono <code>:U<\/code>, che richiede l'oggetto tipo indefinito, e <code>:_<\/code>, che accetta entrambi.)<\/span> <span class=\"sg\" data-s=\"2\">Il parametro nominato <code>:$traced!<\/code> è il nome del trait stesso; la sua presenza è ciò che fa sì che <code>is traced<\/code> chiami questa sub.<\/span> <span class=\"sg\" data-s=\"3\">Poiché i trait vengono eseguiti al <strong>momento della compilazione<\/strong>, sia <code>foo<\/code> che <code>bar<\/code> vengono registrati al momento della dichiarazione, quindi <code>@traced<\/code> li elenca già quando il programma viene eseguito — potresti persino spostare la riga <code>say @traced<\/code> sopra le due definizioni <code>sub<\/code> e stamperebbe comunque <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo piccolo trait registra solo i nomi, ma lo stesso meccanismo può fare molto di più: avvolgere una routine per aggiungere logging, validare un attributo o associare metadati.<\/span> <span class=\"sg\" data-s=\"1\">Scrivendo il primo parametro come <code>Attribute<\/code> o <code>Variable<\/code> invece di <code>Routine<\/code>, un trait può applicarsi ad attributi o variabili.<\/span> <span class=\"sg\" data-s=\"2\">I trait sono il modo in cui Raku mantiene aperta la sintassi delle dichiarazioni — <code>is rw<\/code> e il tuo <code>is traced<\/code> sono costruiti allo stesso modo.<\/span><\/p>"]]},"lv":{"t":"Īpašības rakstīšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Īpašības ir parastas multi-apakšprogrammas ar īpašu nosaukumu, tāpēc jūs varat rakstīt savas.<\/span> <span class=\"sg\" data-s=\"1\">Lai pievienotu īpašību, kas rakstīta <code>is kautkas<\/code>, definējiet <code>multi sub trait_mod:&lt;is&gt;<\/code>, kura parametri norāda, kam tā piemērojama, un nosauc īpašību:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis ir viens no Raku sarežģītākajiem stūriem, tāpēc neuztraucieties, ja tas šķiet sarežģīts.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat lieliski izmantot iebūvētās īpašības, nezinot, kā tās veidotas, un reti kad būs nepieciešamība rakstīt savu — uztveriet šo lapu kā ieskatu iekšējā uzbūvē.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izlasiet signatūru: pirmais parametrs, <code>Routine:D $r<\/code>, ir objekts, kuram īpašība ir pievienota — šeit apakšprogramma.<\/span> <span class=\"sg\" data-s=\"1\"><code>:D<\/code> ir tipa <em>smailijs<\/em>, kas pieprasa <strong>definētu<\/strong> vērtību — reālu apakšprogrammas objektu, nevis tukšu, nedefinētu <code>Routine<\/code> tipu pašu par sevi. (Tā partneri ir <code>:U<\/code>, kas pieprasa nedefinētu tipa objektu, un <code>:_<\/code>, kas pieņem abus.)<\/span> <span class=\"sg\" data-s=\"2\">Nosauktais parametrs <code>:$traced!<\/code> ir pašas īpašības nosaukums; tā klātbūtne ir tas, kas liek <code>is traced<\/code> izsaukt šo apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"3\">Tā kā īpašības tiek izpildītas <strong>kompilēšanas laikā<\/strong>, gan <code>foo<\/code>, gan <code>bar<\/code> tiek reģistrētas to deklarēšanas brīdī, tāpēc <code>@traced<\/code> jau satur tos, kad programma sāk darboties — jūs pat varētu pārcelt <code>say @traced<\/code> rindu virs abām <code>sub<\/code> definīcijām, un tā joprojām izdrukātu <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī mazā īpašība tikai reģistrē nosaukumus, bet tas pats mehānisms var darīt daudz vairāk: ietvert apakšprogrammu, lai pievienotu žurnalēšanu, validēt atribūtu vai pievienot metadatus.<\/span> <span class=\"sg\" data-s=\"1\">Rakstot pirmo parametru kā <code>Attribute<\/code> vai <code>Variable<\/code> nevis <code>Routine<\/code>, īpašību var piemērot atribūtiem vai mainīgajiem.<\/span> <span class=\"sg\" data-s=\"2\">Īpašības ir veids, kā Raku uztur savu deklarēšanas sintaksi atvērtu — <code>is rw<\/code> un jūsu pašu <code>is traced<\/code> ir veidoti vienādi.<\/span><\/p>"]]},"ru":{"t":"Написание трейта","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Типажи — это обычные мультиподпрограммы с особым именем, поэтому вы можете написать собственный.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы добавить типаж, записываемый как <code>is something<\/code>, определите <code>multi sub trait_mod:&lt;is&gt;<\/code>, параметры которого указывают, к чему он применяется, и задают имя типажа:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это один из более сложных уголков Raku, поэтому не беспокойтесь, если покажется запутанным.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете прекрасно использовать встроенные типажи, не зная, как они устроены, и вам редко понадобится писать собственный — считайте эту страницу заглядыванием под капот.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прочтём сигнатуру: первый параметр, <code>Routine:D $r<\/code>, — это то, к чему прикреплён типаж, в данном случае подпрограмма.<\/span> <span class=\"sg\" data-s=\"1\"><code>:D<\/code> — это типовой <em>смайлик<\/em>, требующий <strong>определённое<\/strong> значение — настоящий объект подпрограммы, а не голый, неопределённый тип <code>Routine<\/code> сам по себе. (Его партнёры: <code>:U<\/code>, который требует неопределённый объект типа, и <code>:_<\/code>, который принимает оба варианта.)<\/span> <span class=\"sg\" data-s=\"2\">Именованный параметр <code>:$traced!<\/code> — это имя самого типажа; именно его наличие заставляет <code>is traced<\/code> вызывать эту подпрограмму.<\/span> <span class=\"sg\" data-s=\"3\">Поскольку типажи выполняются во время <strong>компиляции<\/strong>, и <code>foo<\/code>, и <code>bar<\/code> регистрируются при объявлении, так что <code>@traced<\/code> уже содержит их к моменту выполнения программы — вы даже могли бы переместить строку <code>say @traced<\/code> выше двух определений <code>sub<\/code>, и она всё равно напечатала бы <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот маленький типаж только записывает имена, но тот же механизм может делать гораздо больше: оборачивать подпрограмму для добавления логирования, валидировать атрибут или прикреплять метаданные.<\/span> <span class=\"sg\" data-s=\"1\">Если записать первый параметр как <code>Attribute<\/code> или <code>Variable<\/code> вместо <code>Routine<\/code>, типаж можно применять к атрибутам или переменным.<\/span> <span class=\"sg\" data-s=\"2\">Типажи — это способ, которым Raku сохраняет открытость синтаксиса объявлений: <code>is rw<\/code> и ваш собственный <code>is traced<\/code> построены одинаково.<\/span><\/p>"]]},"uk":{"t":"Написання трейта","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Трейти є звичайними мульти-підпрограмами з особливим іменем, тож ви можете написати власний.<\/span> <span class=\"sg\" data-s=\"1\">Щоб додати трейт, який записується як <code>is something<\/code>, визначте <code>multi sub trait_mod:&lt;is&gt;<\/code>, параметри якого кажуть, до чого він застосовується, і називають трейт:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це один із просунутіших закутків Raku, тож не переймайтеся, якщо він видається заплутаним.<\/span> <span class=\"sg\" data-s=\"1\">Вбудованими трейтами можна чудово користуватися, не знаючи, як вони влаштовані, а писати власний вам доведеться рідко — сприймайте цю сторінку як погляд під капот.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прочитайте сигнатуру: перший параметр, <code>Routine:D $r<\/code>, є тим, до чого приєднано трейт, — тут підпрограмою.<\/span> <span class=\"sg\" data-s=\"1\"><code>:D<\/code> — це <em>смайлик<\/em> типу, який вимагає <strong>визначеного<\/strong> значення: справжнього об'єкта-підпрограми, а не голого невизначеного типу <code>Routine<\/code>. (Його партнери — <code>:U<\/code>, що вимагає невизначеного об'єкта типу, і <code>:_<\/code>, що приймає будь-що з двох.)<\/span> <span class=\"sg\" data-s=\"2\">Іменований параметр <code>:$traced!<\/code> є власним іменем трейта; саме його присутність змушує <code>is traced<\/code> викликати цю підпрограму.<\/span> <span class=\"sg\" data-s=\"3\">Оскільки трейти виконуються <strong>під час компіляції<\/strong>, і <code>foo<\/code>, і <code>bar<\/code> реєструються в міру їхнього оголошення, тож <code>@traced<\/code> уже перелічує їх на момент запуску програми — ви могли б навіть підняти рядок <code>say @traced<\/code> над двома означеннями <code>sub<\/code>, і він однаково вивів би <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей крихітний трейт лише записує імена, але той самий механізм може значно більше: обгорнути підпрограму, щоб додати журналювання, перевірити атрибут або приєднати метадані.<\/span> <span class=\"sg\" data-s=\"1\">Якщо записати перший параметр як <code>Attribute<\/code> чи <code>Variable<\/code> замість <code>Routine<\/code>, трейт застосовуватиметься до атрибутів або змінних.<\/span> <span class=\"sg\" data-s=\"2\">Саме трейти залишають синтаксис оголошень Raku відкритим: <code>is rw<\/code> і ваш власний <code>is traced<\/code> побудовані однаково.<\/span><\/p>"]]},"bg":{"t":"Писане на трейт","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Трейтовете са обикновени multi-подпрограми със специално име, така че можете да напишете собствен.<\/span> <span class=\"sg\" data-s=\"1\">За да добавите трейт, записван като <code>is something<\/code>, дефинирайте <code>multi sub trait_mod:&lt;is&gt;<\/code>, чиито параметри указват към какво се прилага и именуват трейта:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е един от по-сложните ъгли на Raku, така че не се тревожете, ако изглежда заплетено.<\/span> <span class=\"sg\" data-s=\"1\">Можете да използвате вградените трейтове напълно добре, без да знаете как са направени, и рядко ще имате нужда да пишете собствен — гледайте на тази страница като на поглед под капака.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прочетете сигнатурата: първият параметър, <code>Routine:D $r<\/code>, е обектът, към който е прикрепен трейтът — тук подпрограма.<\/span> <span class=\"sg\" data-s=\"1\"><code>:D<\/code> е типов <em>смайли<\/em>, който изисква <strong>дефинирана<\/strong> стойност — действителен обект-подпрограма, а не голия, недефиниран тип <code>Routine<\/code> сам по себе си. (Неговите партньори са <code>:U<\/code>, който изисква недефиниран типов обект, и <code>:_<\/code>, който приема и двата варианта.)<\/span> <span class=\"sg\" data-s=\"2\">Именуваният параметър <code>:$traced!<\/code> е собственото име на трейта; неговото присъствие е това, което кара <code>is traced<\/code> да извика тази подпрограма.<\/span> <span class=\"sg\" data-s=\"3\">Тъй като трейтовете се изпълняват по <strong>време на компилация<\/strong>, и <code>foo<\/code>, и <code>bar<\/code> са регистрирани при декларирането им, така че <code>@traced<\/code> вече ги съдържа, когато програмата се изпълнява — дори можете да преместите реда <code>say @traced<\/code> над двете <code>sub<\/code> дефиниции и пак ще отпечата <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този малък трейт само записва имена, но същият механизъм може да направи много повече: да обвие подпрограма за добавяне на логване, да валидира атрибут или да прикрепи метаданни.<\/span> <span class=\"sg\" data-s=\"1\">Записването на първия параметър като <code>Attribute<\/code> или <code>Variable<\/code> вместо <code>Routine<\/code> позволява на трейта да се прилага към атрибути или променливи.<\/span> <span class=\"sg\" data-s=\"2\">Трейтовете са начинът, по който Raku поддържа синтаксиса за декларации отворен — <code>is rw<\/code> и вашият собствен <code>is traced<\/code> са изградени по един и същи начин.<\/span><\/p>"]]},"eo":{"t":"Skribi trajton","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Trajtoj estas ordinaraj multi-subrutinoj kun speciala nomo, do vi povas skribi viajn proprajn.<\/span> <span class=\"sg\" data-s=\"1\">Por aldoni trajton literumitan <code>is something<\/code>, difinu <code>multi sub trait_mod:&lt;is&gt;<\/code>, kies parametroj diras, al kio ĝi aplikiĝas, kaj nomas la trajton:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas unu el la pli progresintaj anguloj de Raku, do ne maltrankviliĝu, se ĝi ŝajnas komplika.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi la enkonstruitajn trajtojn tute bone sen scii, kiel ili estas faritaj, kaj vi malofte bezonos skribi propran — traktu ĉi tiun paĝon kiel rigardon sub la kapoton.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Legu la subskribon: la unua parametro, <code>Routine:D $r<\/code>, estas la aĵo, al kiu la trajto estas alfiksita — ĉi tie subrutino.<\/span> <span class=\"sg\" data-s=\"1\">La <code>:D<\/code> estas tipa <em>rideto<\/em>, kiu postulas <strong>difinitan<\/strong> valoron — efektivan rutinan objekton, ne la nudan, nedifinitan tipon <code>Routine<\/code> mem. (Ĝiaj partneroj estas <code>:U<\/code>, kiu postulas la nedifinitan tipobjekton, kaj <code>:_<\/code>, kiu akceptas ambaŭ.)<\/span> <span class=\"sg\" data-s=\"2\">La nomita parametro <code>:$traced!<\/code> estas la propra nomo de la trajto; ĝia ĉeesto estas tio, kio igas <code>is traced<\/code> voki ĉi tiun subrutinon.<\/span> <span class=\"sg\" data-s=\"3\">Ĉar trajtoj ruliĝas dum <strong>kompilado<\/strong>, kaj <code>foo<\/code> kaj <code>bar<\/code> estas registritaj dum ili estas deklaritaj, do <code>@traced<\/code> jam listigas ilin, kiam la programo ruliĝas — vi eĉ povus movi la linion <code>say @traced<\/code> supren antaŭ la du difinojn <code>sub<\/code>, kaj ĝi ankoraŭ presus <code>[foo bar]<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu eta trajto nur registras nomojn, sed la sama mekanismo povas fari multe pli: envolvi rutinon por aldoni protokoladon, validigi atributon, aŭ alfiksi metadatumojn.<\/span> <span class=\"sg\" data-s=\"1\">Skribi la unuan parametron kiel <code>Attribute<\/code> aŭ <code>Variable<\/code> anstataŭ <code>Routine<\/code> permesas al trajto apliki al atributoj aŭ variabloj.<\/span> <span class=\"sg\" data-s=\"2\">Trajtoj estas tio, kiel Raku tenas sian deklaran sintakson malfermita — <code>is rw<\/code> kaj via propra <code>is traced<\/code> estas konstruitaj same.<\/span><\/p>"]]},"la":{"t":"Proprietatem scribere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Traits sunt ordinariae multi-subroutinae nomine speciali, itaque tuum proprium scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Ad trait addendum quod <code>is something<\/code> scribitur, defini <code>multi sub trait_mod:&lt;is&gt;<\/code> cuius parametra dicunt cui applicetur et trait nominant:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic est unus ex partibus magis provectis Raku, itaque noli sollicitari si intricatum videtur.<\/span> <span class=\"sg\" data-s=\"1\">Traits incorporatos perfecte uti potes sine scientia quomodo facti sint, et raro tuum proprium scribere debebis — hanc paginam tracta ut inspectionem sub tegumento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lege signaturam: primum parametrum, <code>Routine:D $r<\/code>, est res cui trait adiunctum est — hic subroutina.<\/span> <span class=\"sg\" data-s=\"1\"><code>:D<\/code> est typus <em>smiley<\/em> qui valorem <strong>definitum<\/strong> requirit — obiectum routinae actuale, non typum nudum, indefinitum <code>Routine<\/code> ipsum. (Socii eius sunt <code>:U<\/code>, qui obiectum typi indefinitum requirit, et <code>:_<\/code>, qui utrumque accipit.)<\/span> <span class=\"sg\" data-s=\"2\">Parametrum nominatum <code>:$traced!<\/code> est nomen proprium trait; eius praesentia est quod <code>is traced<\/code> hanc sub vocat.<\/span> <span class=\"sg\" data-s=\"3\">Quia traits tempore <strong>compilationis<\/strong> currunt, tam <code>foo<\/code> quam <code>bar<\/code> registrantur dum declarantur, itaque <code>@traced<\/code> iam eos enumerat antequam programma currit — etiam lineam <code>say @traced<\/code> supra duas definitiones <code>sub<\/code> movere posses et adhuc <code>[foo bar]<\/code> imprimeret.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic parvus trait tantum nomina registrat, sed idem mechanismus multo plus facere potest: routinam involvere ad logificationem addendam, attributum validare, vel metadata adiungere.<\/span> <span class=\"sg\" data-s=\"1\">Primum parametrum scribendo ut <code>Attribute<\/code> vel <code>Variable<\/code> loco <code>Routine<\/code>, trait attributis vel variabilibus applicari permittit.<\/span> <span class=\"sg\" data-s=\"2\">Traits sunt quomodo Raku syntaxin declarationis suae apertam servat — <code>is rw<\/code> et tuum proprium <code>is traced<\/code> eodem modo constructa sunt.<\/span><\/p>"]]}}}</script>
