<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas","n":564,"k":"section","pv":"advanced/user-defined-operators/quiz","nx":"advanced/traits-pragmas/built-in-traits","tr":["advanced"],"L":{"en":{"t":"Traits and pragmas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Two features let you influence how code is <strong>compiled<\/strong>, before it ever runs.<\/span> <span class=\"sg\" data-s=\"1\">A <em>trait<\/em> is a modifier attached to a declaration — a variable or a routine — written with <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A <em>pragma<\/em> is a module-like directive, switched on with <code>use<\/code> (or off with <code>no<\/code>), that changes a rule for the rest of the lexical scope.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You have already used a trait such as <code>is default<\/code> in passing.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at traits as a feature in their own right, shows how to write your own, and introduces pragmas.<\/span><\/p>"]]},"de":{"t":"Traits und Pragmas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Zwei Funktionen ermöglichen es Ihnen, die <strong>Kompilierung<\/strong> von Code zu beeinflussen, noch bevor er ausgeführt wird.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Trait<\/em> ist ein Modifikator, der an eine Deklaration angehängt wird — eine Variable oder eine Routine — und mit <code>is<\/code> geschrieben wird.<\/span> <span class=\"sg\" data-s=\"2\">Ein <em>Pragma<\/em> ist eine modulähnliche Direktive, die mit <code>use<\/code> aktiviert (oder mit <code>no<\/code> deaktiviert) wird und eine Regel für den Rest des lexikalischen Gültigkeitsbereichs ändert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie haben bereits ein Trait wie <code>is default<\/code> im Vorbeigehen verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet Traits als eigenständige Funktion, zeigt, wie Sie Ihre eigenen schreiben können, und führt Pragmas ein.<\/span><\/p>"]]},"nl":{"t":"Traits en pragma's","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Twee mogelijkheden laten je beïnvloeden hoe code <strong>gecompileerd<\/strong> wordt, nog voordat ze draait.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>trait<\/em> is een modificator die aan een declaratie hangt — een variabele of een routine — en met <code>is<\/code> geschreven wordt.<\/span> <span class=\"sg\" data-s=\"2\">Een <em>pragma<\/em> is een moduleachtige aanwijzing, aangezet met <code>use<\/code> (of uit met <code>no<\/code>), die een regel verandert voor de rest van het lexicale bereik.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt en passant al een trait als <code>is default<\/code> gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie bekijkt traits als een mogelijkheid op zichzelf, laat zien hoe je er zelf een schrijft, en introduceert pragma's.<\/span><\/p>"]]},"es":{"t":"Traits y pragmas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Dos características permiten influir en cómo se <strong>compila<\/strong> el código, antes de que se ejecute.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>trait<\/em> es un modificador asociado a una declaración — una variable o una rutina — escrito con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Una <em>pragma<\/em> es una directiva similar a un módulo, que se activa con <code>use<\/code> (o se desactiva con <code>no<\/code>), y que cambia una regla para el resto del ámbito léxico.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya has utilizado un trait como <code>is default<\/code> de pasada.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección examina los traits como una característica por sí misma, muestra cómo escribir los tuyos propios e introduce las pragmas.<\/span><\/p>"]]},"it":{"t":"Trait e pragma","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Due funzionalità permettono di influenzare il modo in cui il codice viene <strong>compilato<\/strong>, prima ancora che venga eseguito.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>trait<\/em> è un modificatore associato a una dichiarazione — una variabile o una routine — scritto con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <em>pragma<\/em> è una direttiva simile a un modulo, attivata con <code>use<\/code> (o disattivata con <code>no<\/code>), che cambia una regola per il resto dello scope lessicale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai già usato un trait come <code>is default<\/code> di passaggio.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione esamina i trait come funzionalità a sé stante, mostra come scriverne di propri e introduce i pragma.<\/span><\/p>"]]},"lv":{"t":"Īpašības un pragmas 🆕","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Divas iespējas ļauj ietekmēt, kā kods tiek <strong>kompilēts<\/strong>, pirms tas vispār tiek izpildīts. <em>Īpašība<\/em> (trait) ir modifikators, kas pievienots deklarācijai — mainīgajam vai apakšprogrammai — un rakstīts ar <code>is<\/code>. <em>Pragma<\/em> ir moduļveida direktīva, ko ieslēdz ar <code>use<\/code> (vai izslēdz ar <code>no<\/code>), un kas maina kādu noteikumu pārējā leksiskā tvēruma ietvaros.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat garāmejot izmantojuši īpašību, piemēram, <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā īpašības tiek aplūkotas kā atsevišķa funkcionalitāte, parādīts, kā rakstīt savas, un iepazīstināts ar pragmām.<\/span><\/p>"]]},"ru":{"t":"Трейты и прагмы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Две возможности позволяют влиять на то, как код <strong>компилируется<\/strong>, ещё до того, как он будет выполнен. <em>Типаж<\/em> (trait) — это модификатор, прикреплённый к объявлению — переменной или подпрограммы — и записанный с помощью <code>is<\/code>. <em>Прагма<\/em> — это директива, похожая на модуль, которая включается с помощью <code>use<\/code> (или выключается с помощью <code>no<\/code>) и изменяет правило для остальной части лексической области видимости.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали типаж, такой как <code>is default<\/code>, мимоходом.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе типажи рассматриваются как самостоятельная возможность, показано, как писать собственные типажи, а также представлены прагмы.<\/span><\/p>"]]},"uk":{"t":"Трейти та прагми","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Дві можливості дозволяють впливати на те, як код <strong>компілюється<\/strong>, ще до того, як він виконається. <em>Трейт<\/em> — це модифікатор, приєднаний до оголошення змінної чи підпрограми, який записують через <code>is<\/code>. <em>Прагма<\/em> — це схожа на модуль директива, яку вмикають через <code>use<\/code> (або вимикають через <code>no<\/code>) і яка змінює правило до кінця лексичної області видимості.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трейтом на кшталт <code>is default<\/code> ви вже мимохідь користувалися.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає трейти як самостійну можливість, показує, як написати власний, і знайомить із прагмами.<\/span><\/p>"]]},"bg":{"t":"Трейтове и прагми 🆕","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Две средства ви позволяват да повлияете на начина, по който кодът се <strong>компилира<\/strong>, преди изобщо да се изпълни. <em>Трейтът<\/em> е модификатор, прикрепен към декларация — на променлива или функция — записан с <code>is<\/code>. <em>Прагмата<\/em> е директива, подобна на модул, която се включва с <code>use<\/code> (или се изключва с <code>no<\/code>) и променя правило за останалата част от лексикалния обхват.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали трейт като <code>is default<\/code> мимоходом.<\/span> <span class=\"sg\" data-s=\"1\">В тази секция ще разгледаме трейтовете като самостоятелно средство, ще покажем как да напишете собствен и ще въведем прагмите.<\/span><\/p>"]]},"la":{"t":"Proprietates et pragmata","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Duae proprietates tibi permittunt influere quomodo codex <strong>compiletur<\/strong>, antequam umquam currat. <em>Trait<\/em> est modificator declarationi adiunctus — variabili vel routinae — scriptus cum <code>is<\/code>. <em>Pragma<\/em> est directivum simile modulo, activatum cum <code>use<\/code> (vel deactivatum cum <code>no<\/code>), quod regulam mutat pro reliquo ambitu lexicali.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iam trait ut <code>is default<\/code> obiter usus es. Haec sectio traits ut proprietatem per se considerat, ostendit quomodo tuum proprium scribas, et pragmata introducit.<\/span><\/p>"]]}}}</script>
