<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/built-in-traits/quiz","n":566,"k":"quiz","pv":"advanced/traits-pragmas/built-in-traits","nx":"advanced/traits-pragmas/writing-a-trait","tr":["advanced","advanced/traits-pragmas","advanced/traits-pragmas/built-in-traits"],"L":{"en":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Which trait lets a subroutine <strong>change the caller’s variable<\/strong> through a parameter?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none — parameters are writable by default<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A parameter is read-only by default, so a plain one cannot be assigned to.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> binds the parameter to the caller’s own variable, so a change inside the routine is visible outside.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> would instead give a modifiable <em>copy<\/em>, leaving the caller untouched.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welches Trait ermöglicht es einer Subroutine, <strong>die Variable des Aufrufers<\/strong> über einen Parameter zu ändern?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">keines — Parameter sind standardmäßig beschreibbar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Parameter ist standardmäßig schreibgeschützt, sodass einem einfachen Parameter nichts zugewiesen werden kann.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> bindet den Parameter an die eigene Variable des Aufrufers, sodass eine Änderung innerhalb der Routine auch außerhalb sichtbar ist.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> würde stattdessen eine veränderbare <em>Kopie<\/em> liefern und den Aufrufer unberührt lassen.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welke trait laat een subroutine <strong>de variabele van de aanroeper wijzigen<\/strong> via een parameter?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">geen — parameters zijn standaard schrijfbaar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een parameter is standaard alleen-lezen, dus aan een gewone parameter kun je niets toekennen.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> bindt de parameter aan de eigen variabele van de aanroeper, zodat een wijziging binnen de routine ook buiten zichtbaar is.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> zou in plaats daarvan een wijzigbare <em>kopie<\/em> geven en de aanroeper ongemoeid laten.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué trait permite que una subrutina <strong>modifique la variable del llamador<\/strong> a través de un parámetro?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ninguno — los parámetros son modificables por defecto<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un parámetro es de solo lectura por defecto, por lo que uno simple no puede ser asignado.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> vincula el parámetro a la propia variable del llamador, de modo que un cambio dentro de la rutina es visible fuera.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> en cambio daría una <em>copia<\/em> modificable, dejando al llamador intacto.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quale trait permette a una subroutine di <strong>modificare la variabile del chiamante<\/strong> attraverso un parametro?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nessuno — i parametri sono scrivibili per impostazione predefinita<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un parametro è in sola lettura per impostazione predefinita, quindi non è possibile assegnargli un valore.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> lega il parametro alla variabile del chiamante, quindi una modifica all'interno della routine è visibile all'esterno.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> invece fornirebbe una <em>copia<\/em> modificabile, lasciando inalterata la variabile del chiamante.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Īpašības","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kura īpašība ļauj apakšprogrammai <strong>mainīt izsaucēja mainīgo<\/strong> caur parametru?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none — parameters are writable by default<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametrs pēc noklusējuma ir tikai lasāms, tāpēc tam nevar piešķirt vērtību.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> sasaista parametru ar izsaucēja paša mainīgo, tāpēc izmaiņas apakšprogrammas iekšienē ir redzamas ārpusē.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> tā vietā dotu modificējamu <em>kopiju<\/em>, atstājot izsaucēja mainīgo neskartu.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Трейты","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какой типаж позволяет подпрограмме <strong>изменять переменную вызывающей стороны<\/strong> через параметр?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ни один — параметры по умолчанию доступны для записи<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">По умолчанию параметр доступен только для чтения, поэтому обычному параметру нельзя присвоить значение.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> привязывает параметр к самой переменной вызывающей стороны, так что изменение внутри подпрограммы видно снаружи.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> вместо этого создал бы изменяемую <em>копию<\/em>, оставив переменную вызывающей стороны нетронутой.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Трейти","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Який трейт дозволяє підпрограмі <strong>змінювати змінну викликача<\/strong> через параметр?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">жоден — параметри доступні для запису за замовчуванням<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням параметр доступний лише для читання, тож звичайному параметру нічого присвоїти не можна.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> зв'язує параметр із власною змінною викликача, тож зміна всередині підпрограми видима назовні.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> натомість дав би змінювану <em>копію<\/em>, лишивши змінну викликача недоторканою.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Трейтове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Кой трейт позволява на подпрограмата да <strong>промени променливата на извикващия<\/strong> чрез параметър?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">нито един — параметрите са записваеми по подразбиране<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметърът е само за четене по подразбиране, затова на обикновен параметър не може да се присвоява стойност.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> свързва параметъра с променливата на извикващия, така че промяна вътре в подпрограмата е видима навън.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> вместо това би дало модифицируемо <em>копие<\/em>, оставяйки извикващия незасегнат.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Proprietates","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quis trait subroutinae permittit <strong>variabilem vocantis mutare<\/strong> per parametrum?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nullus — parametra ex defectu scribilia sunt<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametrum ex defectu tantum-lectu est, itaque simplex parametrum assignari non potest.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> parametrum variabili propria vocantis ligat, ita ut mutatio intra routinam facta foris visibilis sit.<\/span> <span class=\"sg\" data-s=\"2\"><code>is copy<\/code> potius <em>copiam<\/em> mutabilem daret, vocantem intactum relinquens.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
