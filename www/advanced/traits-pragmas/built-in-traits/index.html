<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/built-in-traits","n":565,"k":"topic","pv":"advanced/traits-pragmas","nx":"advanced/traits-pragmas/built-in-traits/quiz","tr":["advanced","advanced/traits-pragmas"],"L":{"en":{"t":"Built-in traits","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <em>trait<\/em> is applied with the <code>is<\/code> keyword right after a declaration.<\/span> <span class=\"sg\" data-s=\"1\">It runs at compile time and changes some fixed property of the thing it is attached to.<\/span> <span class=\"sg\" data-s=\"2\">Raku ships with many; you have already used a few.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">By default, a subroutine’s parameters are <strong>read-only<\/strong> — you cannot assign to them inside the routine.<\/span> <span class=\"sg\" data-s=\"1\">The <code>is copy<\/code> trait gives you a private, modifiable copy of the argument, which you can change without affecting the caller:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>is rw<\/code> trait goes further: it binds the parameter to the caller’s variable, so a change made inside the routine is visible outside:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without one of these traits, <code>$n++<\/code> would be a compile-time error, because the parameter would be read-only.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Another common trait sets a default value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here <code>is default<\/code> gives the variable a value to fall back on.<\/span> <span class=\"sg\" data-s=\"1\">Each built-in trait — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code>, and more — attaches one specific, compile-time behaviour to a declaration.<\/span> <span class=\"sg\" data-s=\"2\">The next topic shows that traits are not a closed set: <a href=\"/advanced/traits-pragmas/writing-a-trait/\">you can define your own<\/a>.<\/span><\/p>"]]},"de":{"t":"Eingebaute Traits","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Trait<\/em> wird mit dem Schlüsselwort <code>is<\/code> direkt nach einer Deklaration angewendet.<\/span> <span class=\"sg\" data-s=\"1\">Es wird zur Kompilierzeit ausgeführt und ändert eine feste Eigenschaft des Elements, an das es angehängt ist.<\/span> <span class=\"sg\" data-s=\"2\">Raku wird mit vielen ausgeliefert; Sie haben bereits einige davon verwendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig sind die Parameter einer Subroutine <strong>schreibgeschützt<\/strong> — Sie können ihnen innerhalb der Routine nichts zuweisen.<\/span> <span class=\"sg\" data-s=\"1\">Das Trait <code>is copy<\/code> gibt Ihnen eine private, veränderbare Kopie des Arguments, die Sie ändern können, ohne den Aufrufer zu beeinflussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Trait <code>is rw<\/code> geht noch weiter: Es bindet den Parameter an die Variable des Aufrufers, sodass eine Änderung innerhalb der Routine auch außerhalb sichtbar ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne eines dieser Traits wäre <code>$n++<\/code> ein Kompilierzeitfehler, da der Parameter schreibgeschützt wäre.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein weiteres häufiges Trait setzt einen Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier gibt <code>is default<\/code> der Variablen einen Wert, auf den sie zurückfallen kann.<\/span> <span class=\"sg\" data-s=\"1\">Jedes eingebaute Trait — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> und weitere — fügt einer Deklaration ein bestimmtes Verhalten zur Kompilierzeit hinzu.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Thema zeigt, dass Traits keine geschlossene Menge sind: <a href=\"https://course.raku.org/de/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Sie können Ihre eigenen definieren<\/a>.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde traits","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>trait<\/em> wordt toegepast met het sleutelwoord <code>is<\/code>, direct na een declaratie.<\/span> <span class=\"sg\" data-s=\"1\">Hij draait tijdens het compileren en verandert een vaste eigenschap van datgene waaraan hij hangt.<\/span> <span class=\"sg\" data-s=\"2\">Raku levert er veel mee; een paar heb je al gebruikt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard zijn de parameters van een subroutine <strong>alleen-lezen<\/strong> — je kunt er binnen de routine niets aan toekennen.<\/span> <span class=\"sg\" data-s=\"1\">De trait <code>is copy<\/code> geeft je een eigen, wijzigbare kopie van het argument, die je kunt veranderen zonder de aanroeper te raken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — de variabele van de aanroeper blijft ongemoeid<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De trait <code>is rw<\/code> gaat verder: hij bindt de parameter aan de variabele van de aanroeper, zodat een wijziging binnen de routine ook buiten zichtbaar is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder een van deze traits zou <code>$n++<\/code> een compilatiefout zijn, omdat de parameter alleen-lezen zou zijn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een andere veelgebruikte trait stelt een standaardwaarde in:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier geeft <code>is default<\/code> de variabele een waarde om op terug te vallen.<\/span> <span class=\"sg\" data-s=\"1\">Elke ingebouwde trait — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> en meer — hangt één specifiek gedrag tijdens het compileren aan een declaratie.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende onderwerp laat zien dat traits geen gesloten verzameling zijn: <a href=\"https://course.raku.org/nl/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">je kunt er zelf een definiëren<\/a>.<\/span><\/p>"]]},"es":{"t":"Traits integrados","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>trait<\/em> se aplica con la palabra clave <code>is<\/code> justo después de una declaración.<\/span> <span class=\"sg\" data-s=\"1\">Se ejecuta en tiempo de compilación y cambia alguna propiedad fija del elemento al que está asociado.<\/span> <span class=\"sg\" data-s=\"2\">Raku incluye muchos; ya has utilizado algunos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por defecto, los parámetros de una subrutina son de <strong>solo lectura<\/strong> — no puedes asignarles un valor dentro de la rutina.<\/span> <span class=\"sg\" data-s=\"1\">El trait <code>is copy<\/code> te da una copia privada y modificable del argumento, que puedes cambiar sin afectar al llamador:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El trait <code>is rw<\/code> va más allá: vincula el parámetro a la variable del llamador, de modo que un cambio realizado dentro de la rutina es visible fuera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin uno de estos traits, <code>$n++<\/code> sería un error en tiempo de compilación, porque el parámetro sería de solo lectura.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otro trait común establece un valor por defecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>is default<\/code> le da a la variable un valor al que recurrir.<\/span> <span class=\"sg\" data-s=\"1\">Cada trait incorporado — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code>, y más — asocia un comportamiento específico en tiempo de compilación a una declaración.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente tema muestra que los traits no son un conjunto cerrado: <a href=\"https://course.raku.org/es/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">puedes definir los tuyos propios<\/a>.<\/span><\/p>"]]},"it":{"t":"Trait integrati","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>trait<\/em> viene applicato con la parola chiave <code>is<\/code> subito dopo una dichiarazione.<\/span> <span class=\"sg\" data-s=\"1\">Viene eseguito al momento della compilazione e modifica una proprietà fissa dell'elemento a cui è associato.<\/span> <span class=\"sg\" data-s=\"2\">Raku ne fornisce molti; ne hai già usati alcuni.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita, i parametri di una subroutine sono <strong>in sola lettura<\/strong> — non è possibile assegnare loro un valore all'interno della routine.<\/span> <span class=\"sg\" data-s=\"1\">Il trait <code>is copy<\/code> fornisce una copia privata e modificabile dell'argomento, che puoi cambiare senza influire sul chiamante:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il trait <code>is rw<\/code> va oltre: lega il parametro alla variabile del chiamante, quindi una modifica effettuata all'interno della routine è visibile all'esterno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza uno di questi trait, <code>$n++<\/code> causerebbe un errore di compilazione, perché il parametro sarebbe in sola lettura.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un altro trait comune imposta un valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui <code>is default<\/code> assegna alla variabile un valore di fallback.<\/span> <span class=\"sg\" data-s=\"1\">Ogni trait integrato — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> e altri — associa uno specifico comportamento a tempo di compilazione a una dichiarazione.<\/span> <span class=\"sg\" data-s=\"2\">Il prossimo argomento mostra che i trait non sono un insieme chiuso: <a href=\"https://course.raku.org/it/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">puoi definire i tuoi<\/a>.<\/span><\/p>"]]},"lv":{"t":"Iebūvētās īpašības","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Īpašība<\/em> tiek piemērota ar atslēgvārdu <code>is<\/code> uzreiz pēc deklarācijas.<\/span> <span class=\"sg\" data-s=\"1\">Tā tiek izpildīta kompilēšanas laikā un maina kādu fiksētu tās objekta īpašību.<\/span> <span class=\"sg\" data-s=\"2\">Raku nāk ar daudzām iebūvētām īpašībām; dažas jūs jau esat izmantojuši.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma apakšprogrammas parametri ir <strong>tikai lasāmi<\/strong> — jūs nevarat tiem piešķirt vērtību apakšprogrammas iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Īpašība <code>is copy<\/code> dod jums privātu, modificējamu argumenta kopiju, kuru varat mainīt, neietekmējot izsaucēju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Īpašība <code>is rw<\/code> iet tālāk: tā sasaista parametru ar izsaucēja mainīgo, tāpēc izmaiņas apakšprogrammas iekšienē ir redzamas ārpusē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez kādas no šīm īpašībām <code>$n++<\/code> radītu kompilēšanas laika kļūdu, jo parametrs būtu tikai lasāms.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl viena izplatīta īpašība nosaka noklusējuma vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>is default<\/code> piešķir mainīgajam vērtību, uz kuru atgriezties.<\/span> <span class=\"sg\" data-s=\"1\">Katra iebūvētā īpašība — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> un citas — pievieno vienu konkrētu kompilēšanas laika uzvedību deklarācijai.<\/span> <span class=\"sg\" data-s=\"2\">Nākamā tēma parāda, ka īpašības nav slēgta kopa: <a href=\"https://course.raku.org/lv/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">jūs varat definēt savas<\/a>.<\/span><\/p>"]]},"ru":{"t":"Встроенные трейты","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Типаж<\/em> применяется с помощью ключевого слова <code>is<\/code> сразу после объявления.<\/span> <span class=\"sg\" data-s=\"1\">Он выполняется во время компиляции и изменяет некоторое фиксированное свойство того, к чему он прикреплён.<\/span> <span class=\"sg\" data-s=\"2\">В Raku их много; некоторые вы уже использовали.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию параметры подпрограммы доступны <strong>только для чтения<\/strong> — вы не можете присваивать им значения внутри подпрограммы.<\/span> <span class=\"sg\" data-s=\"1\">Типаж <code>is copy<\/code> даёт вам приватную, изменяемую копию аргумента, которую можно менять, не затрагивая вызывающую сторону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типаж <code>is rw<\/code> идёт дальше: он привязывает параметр к переменной вызывающей стороны, так что изменение, сделанное внутри подпрограммы, видно снаружи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без одного из этих типажей <code>$n++<\/code> вызвало бы ошибку компиляции, потому что параметр был бы доступен только для чтения.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другой распространённый типаж задаёт значение по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>is default<\/code> задаёт переменной значение, к которому можно вернуться.<\/span> <span class=\"sg\" data-s=\"1\">Каждый встроенный типаж — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> и другие — прикрепляет одно конкретное поведение на этапе компиляции к объявлению.<\/span> <span class=\"sg\" data-s=\"2\">Следующая тема показывает, что типажи — это не закрытый набор: <a href=\"https://course.raku.org/ru/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">вы можете определить собственные<\/a>.<\/span><\/p>"]]},"uk":{"t":"Вбудовані трейти","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Трейт<\/em> застосовують ключовим словом <code>is<\/code> одразу після оголошення.<\/span> <span class=\"sg\" data-s=\"1\">Він виконується під час компіляції й змінює якусь сталу властивість того, до чого його приєднано.<\/span> <span class=\"sg\" data-s=\"2\">Raku постачається з багатьма; кількома ви вже користувалися.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням параметри підпрограми доступні <strong>лише для читання<\/strong> — присвоїти їм щось усередині підпрограми не можна.<\/span> <span class=\"sg\" data-s=\"1\">Трейт <code>is copy<\/code> дає вам приватну змінювану копію аргументу, яку можна змінювати, не зачіпаючи того, хто викликав:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — власна змінна викликача недоторкана<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Трейт <code>is rw<\/code> іде далі: він зв'язує параметр із змінною викликача, тож зміна, зроблена всередині підпрограми, видима назовні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без одного з цих трейтів <code>$n++<\/code> був би помилкою під час компіляції, бо параметр був би доступний лише для читання.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще один поширений трейт задає типове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>is default<\/code> дає змінній значення, до якого можна вдатися.<\/span> <span class=\"sg\" data-s=\"1\">Кожен вбудований трейт — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> та інші — приєднує до оголошення одну конкретну поведінку на етапі компіляції.<\/span> <span class=\"sg\" data-s=\"2\">Наступна тема показує, що трейти не є замкненим набором: <a href=\"https://course.raku.org/uk/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">ви можете визначати власні<\/a>.<\/span><\/p>"]]},"bg":{"t":"Вградени трейтове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Трейтът<\/em> се прилага с ключовата дума <code>is<\/code> веднага след декларацията.<\/span> <span class=\"sg\" data-s=\"1\">Той се изпълнява по време на компилация и променя някое фиксирано свойство на обекта, към който е прикрепен.<\/span> <span class=\"sg\" data-s=\"2\">Raku предлага много вградени трейтове; вече сте използвали няколко от тях.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране параметрите на подпрограмата са <strong>само за четене<\/strong> — не можете да им присвоявате стойност вътре в подпрограмата.<\/span> <span class=\"sg\" data-s=\"1\">Трейтът <code>is copy<\/code> ви дава частно, модифицируемо копие на аргумента, което можете да променяте, без да засягате извикващия:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Трейтът <code>is rw<\/code> отива по-далеч: той свързва параметъра с променливата на извикващия, така че промяна, направена вътре в подпрограмата, е видима навън:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без един от тези трейтове <code>$n++<\/code> би предизвикало грешка по време на компилация, защото параметърът би бил само за четене.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друг често срещан трейт задава стойност по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>is default<\/code> задава на променливата стойност, към която да се върне.<\/span> <span class=\"sg\" data-s=\"1\">Всеки вграден трейт — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> и други — прикрепва едно конкретно поведение по време на компилация към декларацията.<\/span> <span class=\"sg\" data-s=\"2\">Следващата тема показва, че трейтовете не са затворено множество: <a href=\"https://course.raku.org/bg/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">можете да дефинирате собствени<\/a>.<\/span><\/p>"]]},"la":{"t":"Proprietates incorporatae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Trait<\/em> applicatur cum verbo clave <code>is<\/code> statim post declarationem.<\/span> <span class=\"sg\" data-s=\"1\">Tempore compilationis currit et aliquam proprietatem fixam rei cui adiunctum est mutat.<\/span> <span class=\"sg\" data-s=\"2\">Raku multas habet; iam paucas usus es.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ex defectu, parametra subroutinae sunt <strong>tantum-lectu<\/strong> — eis intra routinam assignare non potes.<\/span> <span class=\"sg\" data-s=\"1\">Trait <code>is copy<\/code> tibi copiam privatam et mutabilem argumenti dat, quam mutare potes sine affectione vocantis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Trait <code>is rw<\/code> longius procedit: parametrum variabili vocantis ligat, ita ut mutatio intra routinam facta foris visibilis sit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine uno horum traituum, <code>$n++<\/code> error tempore compilationis esset, quia parametrum tantum-lectu esset.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alius trait communis valorem defectivum statuit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic <code>is default<\/code> variabili valorem dat ad quem recurrat.<\/span> <span class=\"sg\" data-s=\"1\">Quisque trait incorporatus — <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code>, et plura — unum specificum comportamentum tempore compilationis declarationi adiungit.<\/span> <span class=\"sg\" data-s=\"2\">Thema proximum ostendit traits non esse coniunctionem clausam: <a href=\"https://course.raku.org/la/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">tuum proprium definire potes<\/a>.<\/span><\/p>"]]}}}</script>
