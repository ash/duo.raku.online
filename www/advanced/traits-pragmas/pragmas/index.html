<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/pragmas","n":568,"k":"topic","pv":"advanced/traits-pragmas/writing-a-trait","nx":"advanced/traits-pragmas/pragmas/quiz","tr":["advanced","advanced/traits-pragmas"],"L":{"en":{"t":"Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>pragma<\/em> looks like a module loaded with <code>use<\/code>, but instead of bringing in code it changes a compilation rule for the rest of the current scope.<\/span> <span class=\"sg\" data-s=\"1\">Turn one on with <code>use<\/code> and (where it makes sense) off with <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The most important pragma, <code>strict<\/code>, is <strong>on by default<\/strong> in Raku: it requires every variable to be declared before use, which is why a typo in a variable name is caught rather than silently creating a new variable.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Turning <code>strict<\/code> off with <code>no strict<\/code> lifts that requirement, so you can assign to a variable that was never declared with <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With the default <code>strict<\/code> in force, that bare <code>$x = 42<\/code> would be a compile-time error — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>no strict<\/code> line relaxes the rule for the rest of the enclosing scope.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Other pragmas include <code>fatal<\/code> (which turns a quiet failure into a thrown exception — handy once you have met exception handling), <code>isms<\/code> (to allow idioms borrowed from other languages), and <code>variables<\/code> (to tune variable rules).<\/span> <span class=\"sg\" data-s=\"1\">A pragma’s effect is <em>lexical<\/em> — it lasts only to the end of the block it appears in — so you can tighten or loosen a rule for exactly the region of code where you want it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One pragma takes an argument: <code>lib<\/code> adds a directory to the list Raku searches when loading modules — the in-program equivalent of the <code>-I<\/code> command-line option:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You will reach for it once you start writing and loading your own <a href=\"/advanced/modules-basics/using-modules/\">modules<\/a>.<\/span><\/p>"]]},"de":{"t":"Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Pragma<\/em> sieht aus wie ein mit <code>use<\/code> geladenes Modul, aber anstatt Code einzubinden, ändert es eine Kompilierungsregel für den Rest des aktuellen Gültigkeitsbereichs.<\/span> <span class=\"sg\" data-s=\"1\">Aktivieren Sie eines mit <code>use<\/code> und (wo es sinnvoll ist) deaktivieren Sie es mit <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das wichtigste Pragma, <code>strict<\/code>, ist in Raku <strong>standardmäßig aktiviert<\/strong>: Es erfordert, dass jede Variable vor der Verwendung deklariert wird, weshalb ein Tippfehler in einem Variablennamen erkannt wird, anstatt stillschweigend eine neue Variable zu erzeugen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Deaktivieren von <code>strict<\/code> mit <code>no strict<\/code> hebt diese Anforderung auf, sodass Sie einer Variablen einen Wert zuweisen können, die nie mit <code>my<\/code> deklariert wurde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit dem standardmäßig aktiven <code>strict<\/code> wäre das bloße <code>$x = 42<\/code> ein Kompilierzeitfehler — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Die Zeile <code>no strict<\/code> lockert die Regel für den Rest des umschließenden Gültigkeitsbereichs.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Weitere Pragmas sind <code>fatal<\/code> (das einen stillen Fehler in eine ausgelöste Ausnahme verwandelt — nützlich, sobald Sie die Ausnahmebehandlung kennengelernt haben), <code>isms<\/code> (um Idiome aus anderen Sprachen zu erlauben) und <code>variables<\/code> (um Variablenregeln anzupassen).<\/span> <span class=\"sg\" data-s=\"1\">Die Wirkung eines Pragmas ist <em>lexikalisch<\/em> — sie dauert nur bis zum Ende des Blocks, in dem es erscheint — sodass Sie eine Regel genau für den Codebereich verschärfen oder lockern können, in dem Sie es möchten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Pragma nimmt ein Argument entgegen: <code>lib<\/code> fügt ein Verzeichnis zur Liste hinzu, die Raku beim Laden von Modulen durchsucht — das programmierbare Äquivalent der Kommandozeilenoption <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie werden es verwenden, sobald Sie beginnen, Ihre eigenen <a href=\"https://course.raku.org/de/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">Module<\/a> zu schreiben und zu laden.<\/span><\/p>"]]},"nl":{"t":"Pragma's","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>pragma<\/em> ziet eruit als een module die je met <code>use<\/code> laadt, maar in plaats van code binnen te halen verandert hij een compilatieregel voor de rest van het huidige bereik.<\/span> <span class=\"sg\" data-s=\"1\">Zet er een aan met <code>use<\/code> en (waar dat zin heeft) uit met <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het belangrijkste pragma, <code>strict<\/code>, staat in Raku <strong>standaard aan<\/strong>: het eist dat elke variabele gedeclareerd is voor gebruik, en daarom wordt een typefout in een variabelenaam opgemerkt in plaats van stilzwijgend een nieuwe variabele aan te maken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> uitzetten met <code>no strict<\/code> heft die eis op, zodat je kunt toekennen aan een variabele die nooit met <code>my<\/code> gedeclareerd is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met het standaard <code>strict<\/code> van kracht zou die kale <code>$x = 42<\/code> een compilatiefout zijn — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De regel <code>no strict<\/code> versoepelt de regel voor de rest van het omvattende bereik.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere pragma's zijn onder meer <code>fatal<\/code> (dat een stille mislukking omzet in een geworpen exceptie — handig zodra je exceptieafhandeling hebt gezien), <code>isms<\/code> (om idiomen uit andere talen toe te staan) en <code>variables<\/code> (om de regels voor variabelen bij te stellen).<\/span> <span class=\"sg\" data-s=\"1\">De werking van een pragma is <em>lexicaal<\/em> — hij duurt slechts tot het einde van het blok waarin hij staat — dus je kunt een regel aanscherpen of versoepelen voor precies dat stuk code waar je dat wilt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eén pragma neemt een argument: <code>lib<\/code> voegt een map toe aan de lijst die Raku doorzoekt bij het laden van modules — het equivalent binnen het programma van de opdrachtregeloptie <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je grijpt ernaar zodra je je eigen <a href=\"https://course.raku.org/nl/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modules<\/a> gaat schrijven en laden.<\/span><\/p>"]]},"es":{"t":"Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <em>pragma<\/em> se parece a un módulo cargado con <code>use<\/code>, pero en lugar de incorporar código, cambia una regla de compilación para el resto del ámbito actual.<\/span> <span class=\"sg\" data-s=\"1\">Se activa con <code>use<\/code> y (cuando tiene sentido) se desactiva con <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La pragma más importante, <code>strict<\/code>, está <strong>activada por defecto<\/strong> en Raku: requiere que cada variable sea declarada antes de usarse, razón por la cual un error tipográfico en el nombre de una variable se detecta en lugar de crear silenciosamente una nueva variable.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Desactivar <code>strict<\/code> con <code>no strict<\/code> elimina ese requisito, de modo que puedes asignar a una variable que nunca fue declarada con <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con la pragma <code>strict<\/code> activada por defecto, ese <code>$x = 42<\/code> sin declarar sería un error en tiempo de compilación — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La línea <code>no strict<\/code> relaja la regla para el resto del ámbito que la contiene.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otras pragmas incluyen <code>fatal<\/code> (que convierte un fallo silencioso en una excepción lanzada — útil una vez que hayas conocido el manejo de excepciones), <code>isms<\/code> (para permitir expresiones idiomáticas tomadas de otros lenguajes), y <code>variables<\/code> (para ajustar las reglas de variables).<\/span> <span class=\"sg\" data-s=\"1\">El efecto de una pragma es <em>léxico<\/em> — dura solo hasta el final del bloque en el que aparece — así que puedes endurecer o relajar una regla exactamente en la región de código donde lo desees.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una pragma acepta un argumento: <code>lib<\/code> agrega un directorio a la lista que Raku consulta al cargar módulos — el equivalente en programa de la opción de línea de comandos <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La utilizarás cuando empieces a escribir y cargar tus propios <a href=\"https://course.raku.org/es/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">módulos<\/a>.<\/span><\/p>"]]},"it":{"t":"Pragma","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>pragma<\/em> si presenta come un modulo caricato con <code>use<\/code>, ma invece di importare codice modifica una regola di compilazione per il resto dello scope corrente.<\/span> <span class=\"sg\" data-s=\"1\">Si attiva con <code>use<\/code> e (dove ha senso) si disattiva con <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il pragma più importante, <code>strict<\/code>, è <strong>attivo per impostazione predefinita<\/strong> in Raku: richiede che ogni variabile sia dichiarata prima dell'uso, motivo per cui un errore di battitura in un nome di variabile viene intercettato anziché creare silenziosamente una nuova variabile.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Disattivando <code>strict<\/code> con <code>no strict<\/code> si elimina questo requisito, permettendo di assegnare un valore a una variabile mai dichiarata con <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con il <code>strict<\/code> predefinito attivo, quel semplice <code>$x = 42<\/code> sarebbe un errore di compilazione — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La riga <code>no strict<\/code> rilassa la regola per il resto dello scope che la contiene.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri pragma includono <code>fatal<\/code> (che trasforma un fallimento silenzioso in un'eccezione lanciata — utile una volta che hai conosciuto la gestione delle eccezioni), <code>isms<\/code> (per consentire idiomi presi in prestito da altri linguaggi) e <code>variables<\/code> (per regolare le regole sulle variabili).<\/span> <span class=\"sg\" data-s=\"1\">L'effetto di un pragma è <em>lessicale<\/em> — dura solo fino alla fine del blocco in cui appare — quindi puoi restringere o allentare una regola esattamente per la porzione di codice dove lo desideri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un pragma accetta un argomento: <code>lib<\/code> aggiunge una directory alla lista in cui Raku cerca quando carica i moduli — l'equivalente nel programma dell'opzione da riga di comando <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo userai quando inizierai a scrivere e caricare i tuoi <a href=\"https://course.raku.org/it/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">moduli<\/a>.<\/span><\/p>"]]},"lv":{"t":"Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Pragma<\/em> izskatās kā modulis, kas ielādēts ar <code>use<\/code>, bet tā vietā, lai ieviestu kodu, tā maina kompilēšanas noteikumu pārējā pašreizējā tvēruma ietvaros.<\/span> <span class=\"sg\" data-s=\"1\">Ieslēdziet to ar <code>use<\/code> un (kur tas ir jēgpilni) izslēdziet ar <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vissvarīgākā pragma, <code>strict<\/code>, Raku ir <strong>ieslēgta pēc noklusējuma<\/strong>: tā pieprasa, lai katrs mainīgais tiktu deklarēts pirms izmantošanas, tāpēc pārrakstīšanās mainīgā nosaukumā tiek uztverta, nevis klusi izveido jaunu mainīgo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izslēdzot <code>strict<\/code> ar <code>no strict<\/code>, šī prasība tiek atcelta, tāpēc jūs varat piešķirt vērtību mainīgajam, kas nekad nav ticis deklarēts ar <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar noklusēto <code>strict<\/code> spēkā, šis <code>$x = 42<\/code> būtu kompilēšanas laika kļūda — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Rinda <code>no strict<\/code> atslābina noteikumu pārējā aptvēruma tvēruma ietvaros.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Citas pragmas ietver <code>fatal<\/code> (kas pārveido klusu kļūdu izmestā izņēmumā — noderīgi, kad esat iepazinuši izņēmumu apstrādi), <code>isms<\/code> (lai atļautu idiomas no citām valodām) un <code>variables<\/code> (lai pielāgotu mainīgo noteikumus).<\/span> <span class=\"sg\" data-s=\"1\">Pragmas iedarbība ir <em>leksiska<\/em> — tā ilgst tikai līdz bloka beigām, kurā tā parādās — tāpēc jūs varat pastiprināt vai atslābināt noteikumu tieši tajā koda reģionā, kur tas ir nepieciešams.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Viena pragma pieņem argumentu: <code>lib<\/code> pievieno direktoriju sarakstam, kurā Raku meklē, ielādējot moduļus — tas ir programmas iekšējais ekvivalents <code>-I<\/code> komandrindas opcijai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs to izmantosiet, kad sāksiet rakstīt un ielādēt savus <a href=\"https://course.raku.org/lv/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">moduļus<\/a>.<\/span><\/p>"]]},"ru":{"t":"Прагмы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Прагма<\/em> выглядит как модуль, загружаемый с помощью <code>use<\/code>, но вместо подключения кода она изменяет правило компиляции для остальной части текущей области видимости.<\/span> <span class=\"sg\" data-s=\"1\">Включается с помощью <code>use<\/code> и (где это имеет смысл) выключается с помощью <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Самая важная прагма, <code>strict<\/code>, в Raku <strong>включена по умолчанию<\/strong>: она требует, чтобы каждая переменная была объявлена перед использованием, благодаря чему опечатка в имени переменной обнаруживается, а не молча создаёт новую переменную.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отключение <code>strict<\/code> с помощью <code>no strict<\/code> снимает это требование, так что можно присваивать значение переменной, которая никогда не была объявлена с <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При включённой по умолчанию <code>strict<\/code> голое <code>$x = 42<\/code> привело бы к ошибке компиляции — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Строка <code>no strict<\/code> ослабляет это правило для остальной части охватывающей области видимости.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Среди других прагм: <code>fatal<\/code> (превращает тихую ошибку в выброшенное исключение — полезно, когда вы познакомитесь с обработкой исключений), <code>isms<\/code> (позволяет использовать идиомы, заимствованные из других языков), и <code>variables<\/code> (настройка правил для переменных).<\/span> <span class=\"sg\" data-s=\"1\">Действие прагмы <em>лексическое<\/em> — оно длится только до конца блока, в котором она появляется, — так что вы можете ужесточить или ослабить правило именно для той области кода, где это нужно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Одна прагма принимает аргумент: <code>lib<\/code> добавляет каталог в список, в котором Raku ищет модули при загрузке — это программный эквивалент параметра командной строки <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Она вам понадобится, когда вы начнёте писать и загружать собственные <a href=\"https://course.raku.org/ru/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модули<\/a>.<\/span><\/p>"]]},"uk":{"t":"Прагми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Прагма<\/em> виглядає як модуль, завантажений через <code>use<\/code>, але замість того щоб принести код, вона змінює правило компіляції до кінця поточної області видимості.<\/span> <span class=\"sg\" data-s=\"1\">Вмикають її через <code>use<\/code>, а вимикають (де це має сенс) через <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найважливіша прагма, <code>strict<\/code>, у Raku <strong>увімкнена за замовчуванням<\/strong>: вона вимагає оголошувати кожну змінну перед використанням, — саме тому одрук в імені змінної виявляється, а не мовчки створює нову змінну.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вимкнення <code>strict<\/code> через <code>no strict<\/code> знімає цю вимогу, тож можна присвоїти значення змінній, яку ніколи не оголошували через <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За чинної типової <code>strict<\/code> цей голий <code>$x = 42<\/code> був би помилкою під час компіляції — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Рядок <code>no strict<\/code> послаблює правило до кінця обгортальної області видимості.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Серед інших прагм — <code>fatal<\/code> (яка перетворює тихий збій на кинуте виняткове становище, зручна, щойно ви познайомитеся з обробкою винятків), <code>isms<\/code> (щоб дозволити ідіоми, запозичені з інших мов) і <code>variables<\/code> (щоб налаштувати правила для змінних).<\/span> <span class=\"sg\" data-s=\"1\">Дія прагми є <em>лексичною<\/em> — вона триває лише до кінця блоку, в якому з'явилася, — тож правило можна затягнути чи послабити рівно на тій ділянці коду, де вам треба.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Одна прагма приймає аргумент: <code>lib<\/code> додає каталог до списку, в якому Raku шукає модулі під час завантаження, — це програмний відповідник опції командного рядка <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви звернетеся до неї, щойно почнете писати й завантажувати власні <a href=\"https://course.raku.org/uk/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модулі<\/a>.<\/span><\/p>"]]},"bg":{"t":"Прагми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Прагмата<\/em> прилича на модул, зареден с <code>use<\/code>, но вместо да внася код, тя променя правило за компилация за останалата част от текущия обхват.<\/span> <span class=\"sg\" data-s=\"1\">Включва се с <code>use<\/code> и (когато има смисъл) се изключва с <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-важната прагма, <code>strict<\/code>, е <strong>включена по подразбиране<\/strong> в Raku: тя изисква всяка променлива да бъде декларирана преди употреба, което е причината правописна грешка в име на променлива да бъде уловена, вместо мълчаливо да създаде нова променлива.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изключването на <code>strict<\/code> с <code>no strict<\/code> премахва това изискване, така че можете да присвоявате на променлива, която никога не е била декларирана с <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С активирана <code>strict<\/code> по подразбиране, това голо <code>$x = 42<\/code> би било грешка по време на компилация — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Редът <code>no strict<\/code> отпуска правилото за останалата част от обхващащия обхват.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Други прагми включват <code>fatal<\/code> (която превръща тихия неуспех в хвърлено изключение — удобна, когато сте се запознали с обработката на изключения), <code>isms<\/code> (за разрешаване на идиоми, заимствани от други езици) и <code>variables<\/code> (за настройка на правилата за променливи).<\/span> <span class=\"sg\" data-s=\"1\">Ефектът на прагмата е <em>лексикален<\/em> — продължава само до края на блока, в който се появява — така можете да затегнете или разхлабите правило точно за областта от код, в която го искате.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Една прагма приема аргумент: <code>lib<\/code> добавя директория към списъка, в който Raku търси при зареждане на модули — програмният еквивалент на опцията <code>-I<\/code> от командния ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще я използвате, когато започнете да пишете и зареждате собствени <a href=\"https://course.raku.org/bg/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модули<\/a>.<\/span><\/p>"]]},"la":{"t":"Pragmata","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Pragma<\/em> simile videtur modulo cum <code>use<\/code> onerato, sed loco codicis importandi regulam compilationis mutat pro reliquo ambitu currenti.<\/span> <span class=\"sg\" data-s=\"1\">Unum activa cum <code>use<\/code> et (ubi sensum habet) deactiva cum <code>no<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pragma maximi momenti, <code>strict<\/code>, <strong>ex defectu activum<\/strong> est in Raku: requirit ut omnis variabilis declaretur ante usum, quod est cur error typographicus in nomine variabilis deprehendatur potius quam silenter novam variabilem creet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> deactivando cum <code>no strict<\/code> illud requisitum tollitur, ita ut variabili quae numquam cum <code>my<\/code> declarata est assignare possis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum defectu <code>strict<\/code> vigente, illud nudum <code>$x = 42<\/code> error tempore compilationis esset — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Linea <code>no strict<\/code> regulam pro reliquo ambitu circumdantis relaxat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alia pragmata includunt <code>fatal<\/code> (quod defectum quietum in exceptionem iactam convertit — utile postquam tractationem exceptionum cognovisti), <code>isms<\/code> (ad idiomata ex aliis linguis mutuata permittenda), et <code>variables<\/code> (ad regulas variabilium moderandas).<\/span> <span class=\"sg\" data-s=\"1\">Effectus pragmatis <em>lexicalis<\/em> est — tantum ad finem blocki in quo apparet durat — ita ut regulam pro exacta regione codicis ubi eam vis stringere vel laxare possis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unum pragma argumentum accipit: <code>lib<\/code> directorium addit ad indicem quem Raku perscrutatur cum modulos onerat — aequivalens in-programmate optionis <code>-I<\/code> lineae mandatorum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad id pervenies cum tuos proprios <a href=\"/advanced/modules-basics/using-modules/\">modulos<\/a> scribere et onerare incipies.<\/span><\/p>"]]}}}</script>
