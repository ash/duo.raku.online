<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/pragmas/quiz","n":569,"k":"quiz","pv":"advanced/traits-pragmas/pragmas","nx":"advanced/traits-pragmas/exercises","tr":["advanced","advanced/traits-pragmas","advanced/traits-pragmas/pragmas"],"L":{"en":{"t":"Quiz — Pragmas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">With Raku’s default <code>strict<\/code> pragma in force, what happens when you assign to a variable you never declared, as in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">It is a compile-time error<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">It silently creates <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">It prints a warning but runs<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">It sets <code>$x<\/code> to <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> is on by default and requires every variable to be declared with <code>my<\/code> first, so a bare <code>$x = 42<\/code> fails to compile — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Turning the pragma off with <code>no strict<\/code> would let the assignment through.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Pragmas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was passiert mit dem standardmäßig aktivierten <code>strict<\/code>-Pragma von Raku, wenn Sie einer Variablen einen Wert zuweisen, die Sie nie deklariert haben, wie in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Es ist ein Kompilierzeitfehler<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Es erzeugt stillschweigend <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Es gibt eine Warnung aus, läuft aber<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Es setzt <code>$x<\/code> auf <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> ist standardmäßig aktiviert und erfordert, dass jede Variable zuerst mit <code>my<\/code> deklariert wird, sodass ein bloßes <code>$x = 42<\/code> nicht kompiliert werden kann — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das Deaktivieren des Pragmas mit <code>no strict<\/code> würde die Zuweisung durchlassen.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Pragma's","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat gebeurt er, met Raku's standaard pragma <code>strict<\/code> van kracht, als je toekent aan een variabele die je nooit gedeclareerd hebt, zoals in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Het is een compilatiefout<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Het maakt stilzwijgend <code>$x<\/code> aan<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Het drukt een waarschuwing af maar draait<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Het zet <code>$x<\/code> op <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> staat standaard aan en eist dat elke variabele eerst met <code>my<\/code> gedeclareerd wordt, dus een kale <code>$x = 42<\/code> compileert niet — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Het pragma uitzetten met <code>no strict<\/code> zou de toekenning wel toelaten.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Pragmas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Con la pragma <code>strict<\/code> de Raku activada por defecto, ¿qué sucede cuando asignas a una variable que nunca declaraste, como en <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Es un error en tiempo de compilación<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Crea <code>$x<\/code> silenciosamente<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Imprime una advertencia pero se ejecuta<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Establece <code>$x<\/code> en <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> está activada por defecto y requiere que cada variable sea declarada primero con <code>my<\/code>, así que un <code>$x = 42<\/code> sin declarar no compila — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Desactivar la pragma con <code>no strict<\/code> permitiría que la asignación se realice.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Pragma","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Con il pragma <code>strict<\/code> di Raku attivo per impostazione predefinita, cosa succede quando si assegna un valore a una variabile mai dichiarata, come in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">È un errore di compilazione<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Crea silenziosamente <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Stampa un avviso ma viene eseguito<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Imposta <code>$x<\/code> a <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> è attivo per impostazione predefinita e richiede che ogni variabile sia dichiarata prima con <code>my<\/code>, quindi un semplice <code>$x = 42<\/code> non viene compilato — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Disattivando il pragma con <code>no strict<\/code> l'assegnamento verrebbe accettato.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Pragmas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar Raku noklusēto <code>strict<\/code> pragmu spēkā, kas notiek, kad piešķirat vērtību mainīgajam, kuru nekad neesat deklarējuši, kā <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">It is a compile-time error<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">It silently creates <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">It prints a warning but runs<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">It sets <code>$x<\/code> to <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> ir ieslēgta pēc noklusējuma un pieprasa, lai katrs mainīgais tiktu vispirms deklarēts ar <code>my<\/code>, tāpēc <code>$x = 42<\/code> bez deklarācijas nevar tikt kompilēts — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Izslēdzot pragmu ar <code>no strict<\/code>, piešķiršana tiktu pieņemta.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Прагмы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">При включённой по умолчанию прагме <code>strict<\/code> в Raku, что произойдёт, если присвоить значение переменной, которую вы никогда не объявляли, например <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Это ошибка времени компиляции<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Он молча создаёт <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Он выводит предупреждение, но работает<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Он устанавливает <code>$x<\/code> в <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> включена по умолчанию и требует, чтобы каждая переменная была сначала объявлена с <code>my<\/code>, поэтому голое <code>$x = 42<\/code> не скомпилируется — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Отключение прагмы с помощью <code>no strict<\/code> позволило бы выполнить это присваивание.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Прагми","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За чинної типової прагми <code>strict<\/code> у Raku, що станеться, коли ви присвоїте значення змінній, яку ніколи не оголошували, як у <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Це помилка під час компіляції<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Це мовчки створює <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Це виводить попередження, але виконується<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Це встановлює <code>$x<\/code> у <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> увімкнена за замовчуванням і вимагає, щоб кожну змінну спершу оголосили через <code>my<\/code>, тож голий <code>$x = 42<\/code> не компілюється — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Вимкнення прагми через <code>no strict<\/code> пропустило б це присвоєння.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Прагми","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">При активирана по подразбиране прагма <code>strict<\/code> в Raku, какво се случва, когато присвоите на променлива, която никога не сте декларирали, например <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Грешка по време на компилация<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Мълчаливо създава <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Извежда предупреждение, но се изпълнява<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Задава <code>$x<\/code> на <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> е включена по подразбиране и изисква всяка променлива да бъде декларирана първо с <code>my<\/code>, така че голо <code>$x = 42<\/code> не се компилира — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Изключването на прагмата с <code>no strict<\/code> би позволило присвояването.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Pragmata","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum pragma defectu <code>strict<\/code> in Raku vigens est, quid accidit cum variabili quam numquam declaravisti assignas, ut in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Error tempore compilationis est<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Silenter <code>$x<\/code> creat<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Admonitionem imprimit sed currit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>$x<\/code> ad <code>Nil<\/code> statuit<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> ex defectu activum est et requirit ut omnis variabilis prius cum <code>my<\/code> declaretur, itaque nudum <code>$x = 42<\/code> compilari non potest — <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pragma deactivando cum <code>no strict<\/code> assignationem permitteret.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
