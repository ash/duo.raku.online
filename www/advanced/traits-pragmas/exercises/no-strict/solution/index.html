 змінні через <code>my<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Отпускане на strict","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> изключва изискването променливите да бъдат декларирани, така че на <code>$a<\/code> и <code>$b<\/code> може да се присвояват стойности без <code>my<\/code>. При подразбиращия се <code>strict<\/code> режим всеки от тези редове би бил грешка при компилация.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След като са присвоени, променливите се държат нормално, така че <code>$a + $b<\/code> е <code>30<\/code>. Отпускането е лексикално — то важи само до края на обхвата, в който се появява <code>no strict<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е демонстрация, а не препоръчителна практика: <code>strict<\/code> е включен по подразбиране с основателна причина — той улавя правописни грешки в имената на променливите по време на компилация. В реален код го оставете включен и декларирайте променливите си с <code>my<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Malstreĉi strict","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> malŝaltas la postulon, ke variabloj estu deklaritaj, do <code>$a<\/code> kaj <code>$b<\/code> povas esti atribuitaj sen <code>my<\/code>. Sub la defaŭlta <code>strict<\/code>, ĉiu el tiuj linioj estus kompiltempa eraro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Post la atribuo la variabloj kondutas normale, do <code>$a + $b<\/code> estas <code>30<\/code>. La malstreĉo estas leksika — ĝi daŭras nur ĝis la fino de la amplekso, kie <code>no strict<\/code> aperas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tio estas demonstro, ne rekomendata praktiko: <code>strict<\/code> estas ŝaltita defaŭlte pro bona kialo — ĝi kaptas tajperarojn en variablaj nomoj dum kompilado. En vera kodo, tenu ĝin ŝaltita kaj deklaru viajn variablojn per <code>my<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Strictum relaxare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> requisitum deactivat ut variabiles declarentur, itaque <code>$a<\/code> et <code>$b<\/code> sine <code>my<\/code> assignari possunt. Sub defectu <code>strict<\/code>, quaeque illarum linearum error tempore compilationis esset.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Post assignationem, variabiles normaliter se gerunt, itaque <code>$a + $b<\/code> est <code>30<\/code>. Relaxatio lexicalis est — tantum ad finem ambitus ubi <code>no strict<\/code> apparet durat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haec demonstratio est, non praxis commendanda: <code>strict<\/code> ex defectu activum est bona ratione — errores typographicos in nominibus variabilium tempore compilationis deprehendit. In codice reali, activum serva et variabiles tuas cum <code>my<\/code> declara.<\/span><\/li><\/ol>"]]}}}</script>
