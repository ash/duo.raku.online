<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/exercises/writable-parameter","n":571,"k":"exercise","pv":"advanced/traits-pragmas/exercises","nx":"advanced/traits-pragmas/exercises/writable-parameter/solution","tr":["advanced","advanced/traits-pragmas"],"L":{"en":{"t":"Exercise ’A writable parameter‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">By default a subroutine’s parameters are read-only, so a routine cannot change the caller’s variable.<\/span> <span class=\"sg\" data-s=\"1\">The <code>is rw<\/code> trait removes that restriction.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Write a subroutine <code>double<\/code> whose single parameter is marked <code>is rw<\/code>, and which doubles it in place (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Call it on a variable holding <code>21<\/code>, then print the variable to show that it has become <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Ein beschreibbarer Parameter","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig sind die Parameter einer Subroutine schreibgeschützt, sodass eine Routine die Variable des Aufrufers nicht ändern kann.<\/span> <span class=\"sg\" data-s=\"1\">Das Trait <code>is rw<\/code> hebt diese Einschränkung auf.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie eine Subroutine <code>double<\/code>, deren einziger Parameter mit <code>is rw<\/code> markiert ist und die ihn direkt verdoppelt (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Rufen Sie sie mit einer Variablen auf, die <code>21<\/code> enthält, und geben Sie dann die Variable aus, um zu zeigen, dass sie zu <code>42<\/code> geworden ist.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Een schrijfbare parameter‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard zijn de parameters van een subroutine alleen-lezen, dus een routine kan de variabele van de aanroeper niet wijzigen.<\/span> <span class=\"sg\" data-s=\"1\">De trait <code>is rw<\/code> heft die beperking op.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Schrijf een subroutine <code>double<\/code> waarvan de enige parameter met <code>is rw<\/code> gemarkeerd is en die hem ter plaatse verdubbelt (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Roep hem aan op een variabele met de waarde <code>21<\/code> en druk daarna de variabele af om te laten zien dat die <code>42<\/code> geworden is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Un parámetro modificable","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por defecto, los parámetros de una subrutina son de solo lectura, por lo que una rutina no puede cambiar la variable del llamador.<\/span> <span class=\"sg\" data-s=\"1\">El trait <code>is rw<\/code> elimina esa restricción.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Escribe una subrutina <code>double<\/code> cuyo único parámetro esté marcado con <code>is rw<\/code>, y que lo duplique en su lugar (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Llámala sobre una variable que contenga <code>21<\/code>, luego imprime la variable para mostrar que se ha convertido en <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Un parametro scrivibile","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita i parametri di una subroutine sono in sola lettura, quindi una routine non può modificare la variabile del chiamante.<\/span> <span class=\"sg\" data-s=\"1\">Il trait <code>is rw<\/code> rimuove questa restrizione.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scrivi una subroutine <code>double<\/code> il cui unico parametro sia contrassegnato con <code>is rw<\/code>, e che raddoppi il valore sul posto (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Chiamala su una variabile contenente <code>21<\/code>, poi stampa la variabile per mostrare che è diventata <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Rakstāms parametrs","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma apakšprogrammas parametri ir tikai lasāmi, tāpēc apakšprogramma nevar mainīt izsaucēja mainīgo.<\/span> <span class=\"sg\" data-s=\"1\">Īpašība <code>is rw<\/code> noņem šo ierobežojumu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet apakšprogrammu <code>double<\/code>, kuras vienīgais parametrs ir atzīmēts ar <code>is rw<\/code> un kas dubulto to uz vietas (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Izsauciet to ar mainīgo, kurā ir <code>21<\/code>, pēc tam izdrukājiet mainīgo, lai parādītu, ka tas ir kļuvis par <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Изменяемый параметр","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию параметры подпрограммы доступны только для чтения, поэтому подпрограмма не может изменить переменную вызывающей стороны.<\/span> <span class=\"sg\" data-s=\"1\">Типаж <code>is rw<\/code> снимает это ограничение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишите подпрограмму <code>double<\/code>, единственный параметр которой помечен <code>is rw<\/code>, и которая удваивает его на месте (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Вызовите её для переменной со значением <code>21<\/code>, затем выведите переменную, чтобы показать, что она стала <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Параметр, доступний для запису»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням параметри підпрограми доступні лише для читання, тож підпрограма не може змінити змінну викликача.<\/span> <span class=\"sg\" data-s=\"1\">Трейт <code>is rw<\/code> знімає це обмеження.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишіть підпрограму <code>double<\/code>, єдиний параметр якої позначено <code>is rw<\/code> і яка подвоює його на місці (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Викличте її для змінної, що містить <code>21<\/code>, а потім виведіть змінну, щоб показати, що вона стала <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Записваем параметър","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране параметрите на подпрограмата са само за четене, така че подпрограмата не може да промени променливата на извикващия.<\/span> <span class=\"sg\" data-s=\"1\">Трейтът <code>is rw<\/code> премахва това ограничение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>double<\/code>, чийто единствен параметър е маркиран с <code>is rw<\/code> и който удвоява стойността на място (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Извикайте я с променлива, съдържаща <code>21<\/code>, след което отпечатайте променливата, за да покажете, че е станала <code>42<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"la":{"t":"Parametrum scribibile","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ex defectu parametra subroutinae tantum-lectu sunt, itaque routina variabilem vocantis mutare non potest.<\/span> <span class=\"sg\" data-s=\"1\">Trait <code>is rw<\/code> illam restrictionem tollit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scribe subroutinam <code>double<\/code> cuius unicum parametrum <code>is rw<\/code> signatum est, et quae illud in loco duplicat (<code>$n *= 2<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Eam voca in variabili quae <code>21<\/code> continet, deinde variabilem imprime ut ostendas eam <code>42<\/code> factam esse.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/traits-pragmas/exercises/writable-parameter/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
