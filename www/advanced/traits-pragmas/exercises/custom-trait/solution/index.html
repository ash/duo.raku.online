<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/exercises/custom-trait/solution","n":574,"k":"solution","pv":"advanced/traits-pragmas/exercises/custom-trait","nx":"advanced/traits-pragmas/exercises/no-strict","tr":["advanced","advanced/traits-pragmas"],"L":{"en":{"t":"The solution of ’A custom trait‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The trait is a <code>multi sub trait_mod:&lt;is&gt;<\/code> whose named parameter <code>:$role!<\/code> triggers it for <code>is role(...)<\/code>. Unlike a presence-only trait, this one <em>receives<\/em> the argument: <code>is role('admin')<\/code> binds <code>'admin'<\/code> to <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body stores that value under the subroutine’s name. Reading <code>%role&lt;login&gt;<\/code> back afterwards gives <code>admin<\/code>. (Traits run at compile time, so the entry is already there by the time the program runs.)<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein benutzerdefinierter Trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Trait ist ein <code>multi sub trait_mod:&lt;is&gt;<\/code>, dessen benannter Parameter <code>:$role!<\/code> es für <code>is role(...)<\/code> auslöst. Im Gegensatz zu einem reinen Vorhandenseits-Trait <em>empfängt<\/em> dieses das Argument: <code>is role('admin')<\/code> bindet <code>'admin'<\/code> an <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Rumpf speichert diesen Wert unter dem Namen der Subroutine. Das anschließende Lesen von <code>%role&lt;login&gt;<\/code> ergibt <code>admin<\/code>. (Traits werden zur Kompilierzeit ausgeführt, sodass der Eintrag bereits vorhanden ist, wenn das Programm läuft.)<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een eigen trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de taak.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De trait is een <code>multi sub trait_mod:&lt;is&gt;<\/code> waarvan de benoemde parameter <code>:$role!<\/code> hem laat afgaan bij <code>is role(...)<\/code>. Anders dan een trait die alleen aanwezig is, <em>ontvangt<\/em> deze het argument: <code>is role('admin')<\/code> bindt <code>'admin'<\/code> aan <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De body slaat die waarde op onder de naam van de subroutine. Als je daarna <code>%role&lt;login&gt;<\/code> terugleest, krijg je <code>admin<\/code>. (Traits draaien tijdens het compileren, dus de vermelding staat er al tegen de tijd dat het programma draait.)<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un trait personalizado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El trait es un <code>multi sub trait_mod:&lt;is&gt;<\/code> cuyo parámetro nombrado <code>:$role!<\/code> lo activa para <code>is role(...)<\/code>. A diferencia de un trait de solo presencia, este <em>recibe<\/em> el argumento: <code>is role('admin')<\/code> vincula <code>'admin'<\/code> a <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo almacena ese valor bajo el nombre de la subrutina. Leer <code>%role&lt;login&gt;<\/code> después devuelve <code>admin<\/code>. (Los traits se ejecutan en tiempo de compilación, así que la entrada ya existe para cuando el programa se ejecuta.)<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un trait personalizzato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il trait è una <code>multi sub trait_mod:&lt;is&gt;<\/code> il cui parametro nominato <code>:$role!<\/code> lo attiva per <code>is role(...)<\/code>. A differenza di un trait di sola presenza, questo <em>riceve<\/em> l'argomento: <code>is role('admin')<\/code> lega <code>'admin'<\/code> a <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo memorizza quel valore sotto il nome della subroutine. Leggendo <code>%role&lt;login&gt;<\/code> successivamente si ottiene <code>admin<\/code>. (I trait vengono eseguiti al momento della compilazione, quindi la voce è già presente quando il programma viene eseguito.)<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pielāgota īpašība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējamais uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Īpašība ir <code>multi sub trait_mod:&lt;is&gt;<\/code>, kura nosauktais parametrs <code>:$role!<\/code> aktivizē to priekš <code>is role(...)<\/code>. Atšķirībā no klātbūtnes-tipa īpašības, šī <em>saņem<\/em> argumentu: <code>is role('admin')<\/code> piesaista <code>'admin'<\/code> pie <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ķermenis saglabā šo vērtību ar apakšprogrammas nosaukumu kā atslēgu. Nolasot <code>%role&lt;login&gt;<\/code> pēc tam, iegūstam <code>admin<\/code>. (Īpašības tiek izpildītas kompilēšanas laikā, tāpēc ieraksts jau ir tur, kad programma sāk darboties.)<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Пользовательский трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Типаж — это <code>multi sub trait_mod:&lt;is&gt;<\/code>, именованный параметр которого <code>:$role!<\/code> активирует его для <code>is role(...)<\/code>. В отличие от типажа, работающего по наличию, этот <em>получает<\/em> аргумент: <code>is role('admin')<\/code> привязывает <code>'admin'<\/code> к <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тело сохраняет это значение под именем подпрограммы. Чтение <code>%role&lt;login&gt;<\/code> после этого возвращает <code>admin<\/code>. (Типажи выполняются во время компиляции, поэтому запись уже существует к моменту выполнения программы.)<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Власний трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span rvas tiun valoron sub la nomo de la subrutino. Legi <code>%role&lt;login&gt;<\/code> poste donas <code>admin<\/code>. (Trajtoj ruliĝas dum kompilado, do la ero jam estas tie, kiam la programo ruliĝas.)<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Proprietas personalis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Trait est <code>multi sub trait_mod:&lt;is&gt;<\/code> cuius parametrum nominatum <code>:$role!<\/code> illud pro <code>is role(...)<\/code> activat. Dissimile trait tantum-praesentiae, hoc argumentum <em>accipit<\/em>: <code>is role('admin')<\/code> <code>'admin'<\/code> parametro <code>$role<\/code> ligat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus illum valorem sub nomine subroutinae reponit. <code>%role&lt;login&gt;<\/code> postea relegendo <code>admin<\/code> dat. (Traits tempore compilationis currunt, itaque insertio iam adest antequam programma currit.)<\/span><\/li><\/ol>"]]}}}</script>
