<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/arrays","n":367,"k":"topic","pv":"advanced/ordered-containers","nx":"advanced/ordered-containers/lists","tr":["advanced","advanced/ordered-containers"],"L":{"en":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">An array is an ordered container whose elements are themselves scalar containers.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>@<\/code> sigil indicates that such a variable behaves as a <code>Positional<\/code> object, so you can subscript it to access individual elements:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because every element is a scalar container, you can assign a new value to it, exactly as you would with a standalone scalar variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can also assign a value of a different type, for example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is what makes arrays <em>mutable<\/em>: each slot is a container that can receive a new value.<\/span> <span class=\"sg\" data-s=\"1\">As you will see in the next topic, <a href=\"/advanced/ordered-containers/lists/\">lists<\/a> behave differently.<\/span><\/p>"]]},"de":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Array ist ein geordneter Container, dessen Elemente selbst Skalar-Container sind.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Sigil <code>@<\/code> zeigt an, dass sich eine solche Variable als <code>Positional<\/code>-Objekt verhält, sodass du sie indizieren kannst, um auf einzelne Elemente zuzugreifen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da jedes Element ein Skalar-Container ist, kannst du ihm einen neuen Wert zuweisen, genau wie bei einer eigenständigen Skalarvariable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du kannst auch einen Wert eines anderen Typs zuweisen, zum Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist es, was Arrays <em>veränderbar<\/em> macht: Jeder Platz ist ein Container, der einen neuen Wert empfangen kann.<\/span> <span class=\"sg\" data-s=\"1\">Wie du im nächsten Thema sehen wirst, verhalten sich <a href=\"https://course.raku.org/de/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">Listen<\/a> anders.<\/span><\/p>"]]},"nl":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Een array is een geordende container waarvan de elementen zelf scalar containers zijn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>@<\/code> sigil geeft aan dat zo'n variabele zich gedraagt als een <code>Positional<\/code> object, zodat je het kunt subscripten om individuele elementen te benaderen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat elk element een scalar container is, kun je er een nieuwe waarde aan toekennen, precies zoals je zou doen met een losstaande scalar variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook een waarde van een ander type toekennen, bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is wat arrays <em>muteerbaar<\/em> maakt: elke plek is een container die een nieuwe waarde kan ontvangen.<\/span> <span class=\"sg\" data-s=\"1\">Zoals je in het volgende onderwerp zult zien, gedragen <a href=\"https://course.raku.org/nl/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">lists<\/a> zich anders.<\/span><\/p>"]]},"es":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un array es un contenedor ordenado cuyos elementos son a su vez contenedores escalares.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El sigilo <code>@<\/code> indica que dicha variable se comporta como un objeto <code>Positional<\/code>, por lo que puedes usar subíndices para acceder a elementos individuales:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Debido a que cada elemento es un contenedor escalar, puedes asignarle un nuevo valor, exactamente como lo harías con una variable escalar independiente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También puedes asignar un valor de un tipo diferente, por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es lo que hace que los arrays sean <em>mutables<\/em>: cada posición es un contenedor que puede recibir un nuevo valor.<\/span> <span class=\"sg\" data-s=\"1\">Como verás en el siguiente tema, las <a href=\"https://course.raku.org/es/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">listas<\/a> se comportan de manera diferente.<\/span><\/p>"]]},"it":{"t":"Array","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un array è un contenitore ordinato i cui elementi sono a loro volta contenitori scalari.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il sigillo <code>@<\/code> indica che tale variabile si comporta come un oggetto <code>Positional<\/code>, quindi puoi indicizzarla per accedere ai singoli elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché ogni elemento è un contenitore scalare, puoi assegnargli un nuovo valore, esattamente come faresti con una variabile scalare indipendente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi anche assegnare un valore di un tipo diverso, ad esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è ciò che rende gli array <em>mutabili<\/em>: ogni posizione è un contenitore che può ricevere un nuovo valore.<\/span> <span class=\"sg\" data-s=\"1\">Come vedrai nel prossimo argomento, le <a href=\"https://course.raku.org/it/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">liste<\/a> si comportano diversamente.<\/span><\/p>"]]},"lv":{"t":"Masīvi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Masīvs ir sakārtots konteineris, kura elementi paši ir skalāri konteineri.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sigils <code>@<\/code> norāda, ka šāds mainīgais uzvedas kā <code>Positional<\/code> objekts, tāpēc to var indeksēt, lai piekļūtu atsevišķiem elementiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā katrs elements ir skalārs konteineris, tam var piešķirt jaunu vērtību tieši tāpat kā parastam skalāram mainīgajam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī piešķirt cita tipa vērtību, piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir tas, kas padara masīvus <em>maināmus<\/em>: katra vieta ir konteineris, kas var saņemt jaunu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Kā redzēsiet nākamajā tēmā, <a href=\"https://course.raku.org/lv/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">saraksti<\/a> uzvedas citādi.<\/span><\/p>"]]},"ru":{"t":"Массивы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Массив — это упорядоченный контейнер, элементы которого сами являются скалярными контейнерами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сигил <code>@<\/code> указывает на то, что переменная ведёт себя как объект <code>Positional<\/code>, поэтому вы можете обращаться к отдельным элементам по индексу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку каждый элемент является скалярным контейнером, вы можете присвоить ему новое значение точно так же, как обычной скалярной переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы также можете присвоить значение другого типа, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Именно это делает массивы <em>изменяемыми<\/em>: каждый элемент — это контейнер, который может принять новое значение.<\/span> <span class=\"sg\" data-s=\"1\">Как вы увидите в следующей теме, <a href=\"https://course.raku.org/ru/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">списки<\/a> ведут себя иначе.<\/span><\/p>"]]},"uk":{"t":"Масиви","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Масив — це впорядкований контейнер, елементи якого самі є скалярними контейнерами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сигіл <code>@<\/code> вказує, що така змінна поводиться як об'єкт <code>Positional<\/code>, тож її можна індексувати, щоб дістатися до окремих елементів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки кожен елемент є скалярним контейнером, йому можна присвоїти нове значення точно так само, як окремій скалярній змінній:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можна також присвоїти значення іншого типу, наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Саме це робить масиви <em>змінюваними<\/em>: кожна комірка є контейнером, який може прийняти нове значення.<\/span> <span class=\"sg\" data-s=\"1\">Як ви побачите в наступній темі, <a href=\"https://course.raku.org/uk/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">списки<\/a> поводяться інакше.<\/span><\/p>"]]},"bg":{"t":"Масиви","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Масивът е подреден контейнер, чиито елементи сами по себе си са скаларни контейнери.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сигилът <code>@<\/code> показва, че такава променлива се държи като обект от тип <code>Positional<\/code>, така че можете да я индексирате, за да достъпите отделни елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като всеки елемент е скаларен контейнер, можете да му присвоите нова стойност, точно както бихте направили със самостоятелна скаларна променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да присвоите стойност от различен тип, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е, което прави масивите <em>изменяеми<\/em>: всяка позиция е контейнер, който може да приеме нова стойност.<\/span> <span class=\"sg\" data-s=\"1\">Както ще видите в следващата тема, <a href=\"https://course.raku.org/bg/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">списъците<\/a> се държат по различен начин.<\/span><\/p>"]]},"la":{"t":"Array","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ordo est continens ordinatus cuius elementa ipsa continentes scalares sunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sigillum <code>@<\/code> indicat talem variabilem ut obiectum <code>Positional<\/code> se gerere, ut eam subscribere possis ad elementa singula accedenda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia quodque elementum continens scalaris est, valorem novum ei assignare potes, exacte ut cum variabili scalari separata faceres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valorem typi diversi quoque assignare potes, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc est quod ordines <em>mutabiles<\/em> facit: quaeque positio est continens qui valorem novum accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">Ut in themate sequenti videbis, <a href=\"https://course.raku.org/la/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">indices<\/a> aliter se gerunt.<\/span><\/p>"]]}}}</script>
