<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/lists","n":368,"k":"topic","pv":"advanced/ordered-containers/arrays","nx":"advanced/ordered-containers/lists/quiz","tr":["advanced","advanced/ordered-containers"],"L":{"en":{"t":"Lists","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A list is also an ordered collection of values, but, unlike an array, it is <em>immutable<\/em>: you cannot change, add, or remove its elements.<\/span> <span class=\"sg\" data-s=\"1\">A list is written as a comma-separated sequence of values, often placed inside parentheses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can read the elements of a list by their index, and ask how many there are, just as with an array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The difference shows up when you try to change an element.<\/span> <span class=\"sg\" data-s=\"1\">With an array it works, because each element is a container:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With a list it is an error, as the elements of a list are plain values, not containers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The second program stops with a message:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So, use an array (the <code>@<\/code> sigil) when you need to change the contents, and a list when you only need to keep a fixed sequence of values.<\/span><\/p>"]]},"de":{"t":"Listen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Liste ist ebenfalls eine geordnete Sammlung von Werten, aber im Gegensatz zu einem Array ist sie <em>unveränderlich<\/em>: Du kannst ihre Elemente nicht ändern, hinzufügen oder entfernen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Liste wird als kommagetrennte Folge von Werten geschrieben, oft in Klammern eingeschlossen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du kannst die Elemente einer Liste über ihren Index lesen und abfragen, wie viele es gibt, genau wie bei einem Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Unterschied zeigt sich, wenn du versuchst, ein Element zu ändern.<\/span> <span class=\"sg\" data-s=\"1\">Bei einem Array funktioniert es, weil jedes Element ein Container ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einer Liste ist es ein Fehler, da die Elemente einer Liste einfache Werte und keine Container sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das zweite Programm bricht mit einer Meldung ab:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verwende also ein Array (das Sigil <code>@<\/code>), wenn du den Inhalt ändern musst, und eine Liste, wenn du nur eine feste Folge von Werten aufbewahren willst.<\/span><\/p>"]]},"nl":{"t":"Lijsten","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een list is ook een geordende verzameling van waarden, maar in tegenstelling tot een array is hij <em>onveranderlijk<\/em>: je kunt de elementen niet wijzigen, toevoegen of verwijderen.<\/span> <span class=\"sg\" data-s=\"1\">Een list wordt geschreven als een door komma's gescheiden reeks waarden, vaak tussen haakjes geplaatst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt de elementen van een list opvragen via hun index, en vragen hoeveel er zijn, net als bij een array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het verschil wordt zichtbaar wanneer je probeert een element te wijzigen.<\/span> <span class=\"sg\" data-s=\"1\">Bij een array werkt het, omdat elk element een container is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bij een list is het een fout, omdat de elementen van een list gewone waarden zijn, geen containers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het tweede programma stopt met een melding:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gebruik dus een array (de <code>@<\/code> sigil) wanneer je de inhoud wilt wijzigen, en een list wanneer je alleen een vaste reeks waarden wilt bewaren.<\/span><\/p>"]]},"es":{"t":"Listas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una lista también es una colección ordenada de valores, pero, a diferencia de un array, es <em>inmutable<\/em>: no puedes cambiar, agregar ni eliminar sus elementos.<\/span> <span class=\"sg\" data-s=\"1\">Una lista se escribe como una secuencia de valores separados por comas, a menudo colocada dentro de paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes leer los elementos de una lista por su índice, y preguntar cuántos hay, igual que con un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La diferencia se muestra cuando intentas cambiar un elemento.<\/span> <span class=\"sg\" data-s=\"1\">Con un array funciona, porque cada elemento es un contenedor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con una lista es un error, ya que los elementos de una lista son valores simples, no contenedores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El segundo programa se detiene con un mensaje:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entonces, usa un array (el sigilo <code>@<\/code>) cuando necesites cambiar el contenido, y una lista cuando solo necesites mantener una secuencia fija de valores.<\/span><\/p>"]]},"it":{"t":"Liste","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una lista è anch'essa una collezione ordinata di valori, ma, a differenza di un array, è <em>immutabile<\/em>: non puoi modificare, aggiungere o rimuovere i suoi elementi.<\/span> <span class=\"sg\" data-s=\"1\">Una lista si scrive come una sequenza di valori separati da virgola, spesso racchiusa tra parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi leggere gli elementi di una lista tramite il loro indice, e chiedere quanti sono, proprio come con un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La differenza emerge quando provi a modificare un elemento.<\/span> <span class=\"sg\" data-s=\"1\">Con un array funziona, perché ogni elemento è un contenitore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con una lista è un errore, poiché gli elementi di una lista sono semplici valori, non contenitori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il secondo programma si ferma con un messaggio:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi, usa un array (il sigillo <code>@<\/code>) quando hai bisogno di modificare il contenuto, e una lista quando devi solo mantenere una sequenza fissa di valori.<\/span><\/p>"]]},"lv":{"t":"Saraksti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Saraksts arī ir sakārtota vērtību kolekcija, bet atšķirībā no masīva tas ir <em>nemainīgs<\/em>: jūs nevarat mainīt, pievienot vai noņemt tā elementus.<\/span> <span class=\"sg\" data-s=\"1\">Sarakstu raksta kā ar komatiem atdalītu vērtību virkni, bieži ievietotu iekavās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat nolasīt saraksta elementus pēc to indeksa un noskaidrot, cik to ir, tieši tāpat kā masīvam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atšķirība parādās, kad mēģināt mainīt elementu.<\/span> <span class=\"sg\" data-s=\"1\">Masīvam tas darbojas, jo katrs elements ir konteineris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sarakstam tā ir kļūda, jo saraksta elementi ir vienkāršas vērtības, nevis konteineri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otrā programma apstājas ar paziņojumu:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tāpēc izmantojiet masīvu (sigilu <code>@<\/code>), kad nepieciešams mainīt saturu, un sarakstu, kad nepieciešams tikai saglabāt fiksētu vērtību secību.<\/span><\/p>"]]},"ru":{"t":"Списки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Список — это тоже упорядоченная коллекция значений, но, в отличие от массива, он <em>неизменяем<\/em>: вы не можете изменять, добавлять или удалять его элементы.<\/span> <span class=\"sg\" data-s=\"1\">Список записывается как последовательность значений, разделённых запятыми, часто заключённая в скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы можете читать элементы списка по индексу и узнавать их количество, так же как и у массива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разница проявляется, когда вы пытаетесь изменить элемент.<\/span> <span class=\"sg\" data-s=\"1\">С массивом это работает, потому что каждый элемент — это контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Со списком это ошибка, так как элементы списка — это простые значения, а не контейнеры:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вторая программа завершится с сообщением:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поэтому используйте массив (сигил <code>@<\/code>), когда вам нужно менять содержимое, и список, когда вам нужна только фиксированная последовательность значений.<\/span><\/p>"]]},"uk":{"t":"Списки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Список — це теж упорядкований набір значень, але, на відміну від масиву, він <em>незмінний<\/em>: змінити, додати чи вилучити його елементи не можна.<\/span> <span class=\"sg\" data-s=\"1\">Список записують як послідовність значень через кому, часто взяту в дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Читати елементи списку за індексом і питати, скільки їх, можна так само, як і з масивом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Різниця виявляється, коли ви намагаєтеся змінити елемент.<\/span> <span class=\"sg\" data-s=\"1\">З масивом це працює, бо кожен елемент є контейнером:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зі списком це помилка, бо елементи списку є простими значеннями, а не контейнерами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друга програма зупиняється з повідомленням:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отже, використовуйте масив (сигіл <code>@<\/code>), коли потрібно змінювати вміст, і список — коли потрібно лише зберігати сталу послідовність значень.<\/span><\/p>"]]},"bg":{"t":"Списъци","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Списъкът също е подредена колекция от стойности, но за разлика от масива той е <em>неизменяем<\/em>: не можете да променяте, добавяте или премахвате елементите му.<\/span> <span class=\"sg\" data-s=\"1\">Списък се записва като последователност от стойности, разделени със запетая, често поставени в скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да прочетете елементите на списък по техния индекс и да попитате колко са, точно както при масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разликата се проявява, когато се опитате да промените елемент.<\/span> <span class=\"sg\" data-s=\"1\">При масив това работи, защото всеки елемент е контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При списък това е грешка, тъй като елементите на списък са обикновени стойности, а не контейнери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Втората програма спира със съобщение:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така че използвайте масив (сигил <code>@<\/code>), когато трябва да променяте съдържанието, и списък, когато трябва само да съхранявате фиксирана последователност от стойности.<\/span><\/p>"]]},"la":{"t":"Listae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Index quoque collectio ordinata valorum est, sed, dissimilis ab ordine, <em>immutabilis<\/em> est: elementa eius mutare, addere, vel removere non potes.<\/span> <span class=\"sg\" data-s=\"1\">Index ut series valorum virgula separatorum scribitur, saepe intra parentheses posita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elementa indicis per indicem suum legere potes, et quot sint quaerere, sicut cum ordine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Differentia apparet cum elementum mutare conaris.<\/span> <span class=\"sg\" data-s=\"1\">Cum ordine operatur, quia quodque elementum continens est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum indice error est, quia elementa indicis valores plani sunt, non continentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Secundum programma cum nuntio sistit:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Itaque, utere ordine (sigillo <code>@<\/code>) cum contenta mutare debes, et indice cum solum seriem fixam valorum servare debes.<\/span><\/p>"]]}}}</script>
