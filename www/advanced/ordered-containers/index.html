<script type="application/json" id="page-data">{"u":"advanced/ordered-containers","n":366,"k":"section","pv":"advanced/scalar-containers/exercises/reuse-the-container/solution","nx":"advanced/ordered-containers/arrays","tr":["advanced"],"L":{"en":{"t":"Ordered containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordered containers keep several elements and preserve their order, so each element can be reached by its position. (In special cases they may also hold a single element or none at all.)<\/span> <span class=\"sg\" data-s=\"1\">The most common ordered containers are <em>arrays<\/em> and <em>lists<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>@<\/code> sigil tells you that a variable is meant to hold many elements.<\/span> <span class=\"sg\" data-s=\"1\">A variable with the <code>@<\/code> sigil supports subscripting, so you can read an element by its index, as you already saw in the Essentials part.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In this section, we take a closer look at how arrays and lists differ <em>as containers<\/em>: which of them you can modify, what happens when you put one container inside another, and how <em>binding<\/em> gives a name to a container without copying anything.<\/span><\/p>"]]},"de":{"t":"Geordnete Container","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Geordnete Container speichern mehrere Elemente und bewahren deren Reihenfolge, sodass jedes Element über seine Position erreichbar ist. (In Sonderfällen können sie auch nur ein einzelnes Element oder gar keines enthalten.)<\/span> <span class=\"sg\" data-s=\"1\">Die gebräuchlichsten geordneten Container sind <em>Arrays<\/em> und <em>Listen<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Sigil <code>@<\/code> zeigt an, dass eine Variable dafür vorgesehen ist, viele Elemente aufzunehmen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variable mit dem Sigil <code>@<\/code> unterstützt Indizierung, sodass du ein Element über seinen Index lesen kannst, wie du es bereits im Grundlagenteil gesehen hast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt schauen wir uns genauer an, wie sich Arrays und Listen <em>als Container<\/em> unterscheiden: Welche davon du ändern kannst, was passiert, wenn du einen Container in einen anderen steckst, und wie <em>Binding<\/em> einem Container einen Namen gibt, ohne etwas zu kopieren.<\/span><\/p>"]]},"nl":{"t":"Geordende containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Geordende containers bewaren meerdere elementen en behouden hun volgorde, zodat elk element bereikt kan worden via zijn positie. (In bijzondere gevallen kunnen ze ook een enkel element bevatten, of helemaal geen.)<\/span> <span class=\"sg\" data-s=\"1\">De meest voorkomende geordende containers zijn <em>arrays<\/em> en <em>lists<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>@<\/code> sigil geeft aan dat een variabele bedoeld is om meerdere elementen te bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele met de <code>@<\/code> sigil ondersteunt subscripting, zodat je een element kunt opvragen via zijn index, zoals je al hebt gezien in het deel Essentials.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In dit deel bekijken we van dichtbij hoe arrays en lists verschillen <em>als containers<\/em>: welke je kunt wijzigen, wat er gebeurt als je de ene container in de andere plaatst, en hoe <em>binding<\/em> een naam aan een container geeft zonder iets te kopiëren.<\/span><\/p>"]]},"es":{"t":"Contenedores ordenados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los contenedores ordenados almacenan varios elementos y preservan su orden, de modo que cada elemento puede ser accedido por su posición. (En casos especiales, también pueden contener un solo elemento o ninguno.)<\/span> <span class=\"sg\" data-s=\"1\">Los contenedores ordenados más comunes son los <em>arrays<\/em> y las <em>listas<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El sigilo <code>@<\/code> indica que una variable está destinada a contener muchos elementos.<\/span> <span class=\"sg\" data-s=\"1\">Una variable con el sigilo <code>@<\/code> admite subíndices, por lo que puedes leer un elemento por su índice, como ya viste en la parte de Esenciales.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En esta sección, examinamos más de cerca cómo los arrays y las listas difieren <em>como contenedores<\/em>: cuáles puedes modificar, qué sucede cuando colocas un contenedor dentro de otro, y cómo la <em>vinculación<\/em> (binding) asigna un nombre a un contenedor sin copiar nada.<\/span><\/p>"]]},"it":{"t":"Contenitori ordinati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I contenitori ordinati mantengono diversi elementi e ne preservano l'ordine, così ogni elemento può essere raggiunto tramite la sua posizione. (In casi speciali possono anche contenere un singolo elemento o nessuno.)<\/span> <span class=\"sg\" data-s=\"1\">I contenitori ordinati più comuni sono gli <em>array<\/em> e le <em>liste<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il sigillo <code>@<\/code> indica che una variabile è destinata a contenere molti elementi.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile con il sigillo <code>@<\/code> supporta l'indicizzazione, così puoi leggere un elemento tramite il suo indice, come hai già visto nella parte Essenziali.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In questa sezione, esaminiamo più da vicino come gli array e le liste differiscono <em>come contenitori<\/em>: quali di essi puoi modificare, cosa succede quando metti un contenitore dentro un altro, e come il <em>binding<\/em> dà un nome a un contenitore senza copiare nulla.<\/span><\/p>"]]},"lv":{"t":"Kārtotie konteineri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sakārtotie konteineri glabā vairākus elementus un saglabā to secību, tāpēc katram elementam var piekļūt pēc tā pozīcijas. (Īpašos gadījumos tie var saturēt arī vienu elementu vai nevienu.)<\/span> <span class=\"sg\" data-s=\"1\">Visizplatītākie sakārtotie konteineri ir <em>masīvi<\/em> un <em>saraksti<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sigils <code>@<\/code> norāda, ka mainīgais ir paredzēts vairāku elementu glabāšanai.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais ar sigilu <code>@<\/code> atbalsta indeksēšanu, tāpēc jūs varat nolasīt elementu pēc tā indeksa, kā jau redzējāt daļā Pamati.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā mēs tuvāk aplūkosim, kā masīvi un saraksti atšķiras <em>kā konteineri<\/em>: kurus no tiem var modificēt, kas notiek, kad ievietojat vienu konteineru citā, un kā <em>saistīšana<\/em> piešķir nosaukumu konteineram bez kopēšanas.<\/span><\/p>"]]},"ru":{"t":"Упорядоченные контейнеры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Упорядоченные контейнеры хранят несколько элементов и сохраняют их порядок, так что каждый элемент доступен по своей позиции. (В особых случаях они могут содержать один элемент или вообще ни одного.)<\/span> <span class=\"sg\" data-s=\"1\">Наиболее распространённые упорядоченные контейнеры — это <em>массивы<\/em> и <em>списки<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигил <code>@<\/code> указывает на то, что переменная предназначена для хранения множества элементов.<\/span> <span class=\"sg\" data-s=\"1\">Переменная с сигилом <code>@<\/code> поддерживает индексирование, поэтому вы можете получить элемент по его индексу, как вы уже видели в части «Основы».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом разделе мы подробнее рассмотрим, чем массивы и списки различаются <em>как контейнеры<\/em>: какие из них можно изменять, что происходит, когда один контейнер помещается внутрь другого, и как <em>привязка<\/em> (binding) даёт контейнеру имя без копирования.<\/span><\/p>"]]},"uk":{"t":"Впорядковані контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Впорядковані контейнери зберігають кілька елементів і підтримують їхній порядок, тож до кожного елемента можна дістатися за його позицією. (В окремих випадках вони можуть містити й один елемент або жодного.)<\/span> <span class=\"sg\" data-s=\"1\">Найпоширенішими впорядкованими контейнерами є <em>масиви<\/em> та <em>списки<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигіл <code>@<\/code> каже вам, що змінна призначена для зберігання багатьох елементів.<\/span> <span class=\"sg\" data-s=\"1\">Змінна із сигілом <code>@<\/code> підтримує індексування, тож ви можете прочитати елемент за його індексом, як уже бачили в частині «Основи».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі ми пильніше розглянемо, чим масиви й списки відрізняються <em>як контейнери<\/em>: який із них можна змінювати, що стається, коли ви кладете один контейнер усередину іншого, і як <em>зв'язування<\/em> дає контейнеру ім'я, нічого не копіюючи.<\/span><\/p>"]]},"bg":{"t":"Подредени контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подредените контейнери съхраняват няколко елемента и запазват реда им, така че всеки елемент може да бъде достъпен по позицията си. (В специални случаи те могат да съдържат и само един елемент или нито един.)<\/span> <span class=\"sg\" data-s=\"1\">Най-разпространените подредени контейнери са <em>масивите<\/em> и <em>списъците<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигилът <code>@<\/code> показва, че дадена променлива е предназначена да съхранява много елементи.<\/span> <span class=\"sg\" data-s=\"1\">Променлива със сигил <code>@<\/code> поддържа индексиране, така че можете да прочетете елемент по неговия индекс, както вече видяхте в частта „Основи\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В тази секция ще разгледаме по-подробно как масивите и списъците се различават <em>като контейнери<\/em>: кои от тях могат да се променят, какво се случва, когато поставите един контейнер в друг, и как <em>свързването<\/em> дава име на контейнер, без да копира нищо.<\/span><\/p>"]]},"eo":{"t":"Ordigitaj ujoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordigitaj ujoj tenas plurajn elementojn kaj konservas ilian ordon, do ĉiu elemento atingeblas laŭ sia pozicio. (En specialaj kazoj ili povas ankaŭ teni unu solan elementon aŭ neniun.)<\/span> <span class=\"sg\" data-s=\"1\">La plej oftaj ordigitaj ujoj estas <em>tabeloj<\/em> kaj <em>listoj<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sigelo <code>@<\/code> diras al vi, ke variablo estas destinita teni multajn elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Variablo kun la sigelo <code>@<\/code> subtenas subskribadon, do vi povas legi elementon laŭ ĝia indekso, kiel vi jam vidis en la parto Esencoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu sekcio ni pli detale rigardas, kiel tabeloj kaj listoj diferencas <em>kiel ujoj<\/em>: kiun el ili vi povas modifi, kio okazas, kiam vi metas unu ujon en alian, kaj kiel <em>ligado<\/em> donas nomon al ujo sen kopii ion ajn.<\/span><\/p>"]]},"la":{"t":"Ordinata receptacula","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Continentes ordinati plura elementa servant et ordinem eorum conservant, ut quodque elementum per positionem suam attingi possit. (In casibus specialibus etiam unum elementum vel nullum tenere possunt.)<\/span> <span class=\"sg\" data-s=\"1\">Continentes ordinati frequentissimi sunt <em>ordines<\/em> et <em>indices<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sigillum <code>@<\/code> indicat variabilem multa elementa tenere destinatam.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis cum sigillo <code>@<\/code> subscriptionem sustinet, ut elementum per indicem suum legere possis, sicut iam in parte Essentialium vidisti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In hac sectione, propius inspiciemus quomodo ordines et indices <em>ut continentes<\/em> differant: quos eorum mutare possis, quid accidat cum unum continentem intra alterum ponas, et quomodo <em>vinculum<\/em> nomen continenti sine copia ulla det.<\/span><\/p>"]]}}}</script>
