<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/exercises/bind-a-scalar/solution","n":379,"k":"solution","pv":"advanced/ordered-containers/exercises/bind-a-scalar","nx":"advanced/contexts","tr":["advanced","advanced/ordered-containers"],"L":{"en":{"t":"The solution of ’Bind a scalar‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Binding with <code>:=<\/code> makes <code>$bound<\/code> another name for the same container as <code>$source<\/code>, rather than a copy. So changing <code>$source<\/code> is visible through <code>$bound<\/code>, which prints <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordinary assignment with <code>=<\/code> copies the value into a separate container, so <code>$copy<\/code> is unaffected by the later change and still prints <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Seeing the two side by side is the whole point: <code>:=<\/code> shares a container, <code>=<\/code> duplicates the value.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Einen Skalar binden","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Binding mit <code>:=<\/code> macht <code>$bound<\/code> zu einem anderen Namen für denselben Container wie <code>$source<\/code>, statt zu einer Kopie. Daher ist die Änderung von <code>$source<\/code> durch <code>$bound<\/code> sichtbar, das <code>9<\/code> ausgibt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gewöhnliche Zuweisung mit <code>=<\/code> kopiert den Wert in einen separaten Container, sodass <code>$copy<\/code> von der späteren Änderung nicht betroffen ist und weiterhin <code>1<\/code> ausgibt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide nebeneinander zu sehen ist der ganze Sinn: <code>:=<\/code> teilt einen Container, <code>=<\/code> dupliziert den Wert.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een scalar binden","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Binding met <code>:=<\/code> maakt <code>$bound<\/code> een andere naam voor dezelfde container als <code>$source<\/code>, in plaats van een kopie. Het wijzigen van <code>$source<\/code> is dus zichtbaar via <code>$bound<\/code>, die <code>9<\/code> print.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gewone toekenning met <code>=<\/code> kopieert de waarde naar een aparte container, dus <code>$copy<\/code> wordt niet beïnvloed door de latere wijziging en print nog steeds <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De twee naast elkaar zien is het hele punt: <code>:=<\/code> deelt een container, <code>=<\/code> dupliceert de waarde.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Enlazar un escalar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La vinculación con <code>:=<\/code> hace que <code>$bound<\/code> sea otro nombre para el mismo contenedor que <code>$source<\/code>, en lugar de una copia. Por lo tanto, cambiar <code>$source<\/code> es visible a través de <code>$bound<\/code>, que imprime <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La asignación ordinaria con <code>=<\/code> copia el valor en un contenedor separado, por lo que <code>$copy<\/code> no se ve afectado por el cambio posterior y sigue imprimiendo <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ver los dos lado a lado es precisamente el objetivo: <code>:=<\/code> comparte un contenedor, <code>=<\/code> duplica el valor.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Legare uno scalare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il binding con <code>:=<\/code> fa di <code>$bound<\/code> un altro nome per lo stesso contenitore di <code>$source<\/code>, piuttosto che una copia. Quindi modificare <code>$source<\/code> è visibile attraverso <code>$bound<\/code>, che stampa <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'assegnazione ordinaria con <code>=<\/code> copia il valore in un contenitore separato, quindi <code>$copy<\/code> non è influenzato dalla modifica successiva e stampa ancora <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vedere i due affiancati è proprio il punto: <code>:=<\/code> condivide un contenitore, <code>=<\/code> duplica il valore.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Saistīt skalāru","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens no iespējamiem uzdevuma risinājumiem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Šīs programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Saistīšana ar <code>:=<\/code> padara <code>$bound<\/code> par citu nosaukumu tam pašam konteineram, kas ir <code>$source<\/code>, nevis par kopiju. Tāpēc mainot <code>$source<\/code>, izmaiņa ir redzama caur <code>$bound<\/code>, kas izdrukā <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Parastā piešķiršana ar <code>=<\/code> kopē vērtību atsevišķā konteinerā, tāpēc <code>$copy<\/code> nav ietekmēts no vēlākajām izmaiņām un joprojām izdrukā <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Redzēt abus blakus ir visa būtība: <code>:=<\/code> kopīgo konteineru, <code>=<\/code> dublicē vērtību.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Свяжите скаляр","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Связывание через <code>:=<\/code> делает <code>$bound<\/code> ещё одним именем того же контейнера, что и <code>$source<\/code>, а не его копией. Поэтому изменение <code>$source<\/code> видно через <code>$bound<\/code>, и он печатает <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обычное присваивание через <code>=<\/code> копирует значение в отдельный контейнер, поэтому позднейшее изменение на <code>$copy<\/code> не влияет, и он по-прежнему печатает <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Увидеть их рядом — и есть весь смысл: <code>:=<\/code> разделяет контейнер, а <code>=<\/code> дублирует значение.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Зв'яжіть скаляр","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зв'язування через <code>:=<\/code> робить <code>$bound<\/code> іще одним іменем того самого контейнера, що й <code>$source<\/code>, а не копією. Тож зміна <code>$source<\/code> видима через <code>$bound<\/code>, який виводить <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Звичайне присвоєння через <code>=<\/code> копіює значення в окремий контейнер, тож пізніша зміна на <code>$copy<\/code> не впливає, і він досі виводить <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Побачити це поруч — і є весь сенс: <code>:=<\/code> розділяє контейнер, <code>=<\/code> дублює значення.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Свържете скалар","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Свързването с <code>:=<\/code> прави <code>$bound<\/code> друго име за същия контейнер като <code>$source<\/code>, а не негово копие. Затова промяната на <code>$source<\/code> е видима чрез <code>$bound<\/code>, което отпечатва <code>9<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обикновеното присвояване с <code>=<\/code> копира стойността в отделен контейнер, така че <code>$copy<\/code> не е засегнат от по-късната промяна и все още отпечатва <code>1<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Виждането на двете едно до друго е целият смисъл: <code>:=<\/code> споделя контейнер, <code>=<\/code> дублира стойността.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Scalarem ligare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $source = 1;\nmy $bound := $source;\nmy $copy = $source;\n\n$source = 9;\nsay $bound;\nsay $copy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/bind-a-scalar.raku\" target=\"_blank\" rel=\"noopener\">bind-a-scalar.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>9\n1<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vinculum cum <code>:=<\/code> facit <code>$bound<\/code> aliud nomen pro eodem continenti ac <code>$source<\/code>, non copiam. Itaque mutatio <code>$source<\/code> per <code>$bound<\/code> visibilis est, quod <code>9<\/code> imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Assignatio ordinaria cum <code>=<\/code> valorem in continentem separatum copiat, itaque <code>$copy<\/code> a mutatione posteriori non afficitur et adhuc <code>1<\/code> imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambos iuxta positos videre totum propositum est: <code>:=<\/code> continentem communicat, <code>=<\/code> valorem duplicat.<\/span><\/li><\/ol>"]]}}}</script>
