<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/exercises/alias-an-array/solution","n":375,"k":"solution","pv":"advanced/ordered-containers/exercises/alias-an-array","nx":"advanced/ordered-containers/exercises/flatten-the-parts","tr":["advanced","advanced/ordered-containers"],"L":{"en":{"t":"The solution of ’Alias an array‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The binding <code>@alias := @original<\/code> makes <code>@alias<\/code> another name for the same array container, rather than a copy of it.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The change is made through <code>@original<\/code> this time, and it is a structural one — <code>push<\/code> adds an element. Because both names are the very same container, <code>@alias<\/code> sees the new element too. The two names are completely interchangeable: it does not matter which one you use to read or to modify the array.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Array aliasieren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Binding <code>@alias := @original<\/code> macht <code>@alias<\/code> zu einem anderen Namen für denselben Array-Container, statt zu einer Kopie davon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Änderung wird diesmal über <code>@original<\/code> vorgenommen, und es ist eine strukturelle Änderung — <code>push<\/code> fügt ein Element hinzu. Da beide Namen derselbe Container sind, sieht <code>@alias<\/code> das neue Element ebenfalls. Die beiden Namen sind vollständig austauschbar: Es spielt keine Rolle, welchen du zum Lesen oder zum Ändern des Arrays verwendest.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een array aliassen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code", e>push<\/code> agrega un elemento. Debido a que ambos nombres son exactamente el mismo contenedor, <code>@alias<\/code> también ve el nuevo elemento. Los dos nombres son completamente intercambiables: no importa cuál uses para leer o modificar el array.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Alias di un array","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il binding <code>@alias := @original<\/code> fa di <code>@alias<\/code> un altro nome per lo stesso contenitore array, piuttosto che una copia di esso.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La modifica viene effettuata tramite <code>@original<\/code> questa volta, ed è una modifica strutturale — <code>push<\/code> aggiunge un elemento. Poiché entrambi i nomi sono lo stesso identico contenitore, <code>@alias<\/code> vede il nuovo elemento. I due nomi sono completamente intercambiabili: non importa quale usi per leggere o per modificare l'array.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Masīva aizstājvārds","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens no iespējamiem uzdevuma risinājumiem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0," ass=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Связывание <code>@alias := @original<\/code> делает <code>@alias<\/code> ещё одним именем того же самого контейнера-массива, а не его копией.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изменение на этот раз выполняется через <code>@original<\/code>, и оно структурное — <code>push<\/code> добавляет элемент. Поскольку оба имени обозначают один и тот же контейнер, <code>@alias<\/code> тоже видит новый элемент. Эти два имени полностью взаимозаменяемы: неважно, каким из них вы читаете или изменяете массив.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Псевдонім масиву","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зв'язування <code>@alias := @original<\/code> робить <code>@alias<\/code> іще одним іменем того самого контейнера-масиву, а не його копією.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цього разу зміну зроблено через <code>@original<\/code>, і вона є структурною — <code>push<\/code> додає елемент. Оскільки обидва імені є тим самим контейнером, <code>@alias<\/code> теж бачить новий елемент. Ці два імені цілком взаємозамінні: байдуже, яким із них ви читаєте чи змінюєте масив.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Псевдоним на масив","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Свързването <code>@alias := @original<\/code> прави <code>@alias<\/code> друго име за същия контейнер-масив, а не негово копие.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Промяната се извършва чрез <code>@original<\/code> този път и е структурна — <code>push<\/code> добавя елемент. Тъй като двете имена са абсолютно същият контейнер, <code>@alias<\/code> вижда и новия елемент. Двете имена са напълно взаимозаменяеми: няма значение кое от тях ще използвате за четене или промяна на масива.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Aliasi tabelon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ligado <code>@alias := @original<\/code> faras <code>@alias<\/code> alia nomo por la sama tabela ujo, anstataŭ kopio de ĝi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ŝanĝo estas farita tra <code>@original<\/code> ĉi-foje, kaj ĝi estas struktura — <code>push<\/code> aldonas elementon. Ĉar ambaŭ nomoj estas la sama ujo, <code>@alias<\/code> vidas ankaŭ la novan elementon. La du nomoj estas tute interŝanĝeblaj: ne gravas, kiun vi uzas por legi aŭ modifi la tabelon.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Alias pro array","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @original = 10, 20, 30;\nmy @alias := @original;\n\n@original.push(40);\nsay @alias;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/ordered-containers/alias-an-array.raku\" target=\"_blank\" rel=\"noopener\">alias-an-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>[10 20 30 40]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vinculum <code>@alias := @original<\/code> facit <code>@alias<\/code> aliud nomen pro eodem continenti ordinis, non copiam eius.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mutatio hac vice per <code>@original<\/code> fit,
