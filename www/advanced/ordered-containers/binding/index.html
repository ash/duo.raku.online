<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/binding","n":370,"k":"topic","pv":"advanced/ordered-containers/lists/quiz","nx":"advanced/ordered-containers/flattening","tr":["advanced","advanced/ordered-containers"],"L":{"en":{"t":"Binding with <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">So far, every variable you created spawned a new container, and assignment with <code>=<\/code> placed a value <em>into<\/em> that container.<\/span> <span class=\"sg\" data-s=\"1\">Binding, written with <code>:=<\/code>, is different: it makes a name refer to an <em>existing<\/em> container instead of creating a new one.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">After binding, the two names share the same container, so a change made through one of them is visible through the other:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, <code>$y := $x<\/code> does not copy the value <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It makes <code>$y<\/code> another name for the very same container as <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">When <code>$x<\/code> is later set to <code>20<\/code>, reading <code>$y<\/code> returns <code>20<\/code> as well.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compare this with ordinary assignment, which copies the value into a separate container:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binding works with arrays too.<\/span> <span class=\"sg\" data-s=\"1\">The following makes <code>@alias<\/code> another name for <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One more detail: if you bind a name directly to a literal value, there is no container behind it, so the name becomes read-only:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"de":{"t":"Bindung mit <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bisher hat jede Variable, die du erstellt hast, einen neuen Container erzeugt, und die Zuweisung mit <code>=<\/code> hat einen Wert <em>in<\/em> diesen Container gelegt.<\/span> <span class=\"sg\" data-s=\"1\">Binding, geschrieben mit <code>:=<\/code>, ist anders: Es lässt einen Namen auf einen <em>bereits existierenden<\/em> Container verweisen, statt einen neuen zu erstellen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nach dem Binding teilen sich die beiden Namen denselben Container, sodass eine Änderung über einen von ihnen durch den anderen sichtbar ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier kopiert <code>$y := $x<\/code> nicht den Wert <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es macht <code>$y<\/code> zu einem anderen Namen für genau denselben Container wie <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wenn <code>$x<\/code> später auf <code>20<\/code> gesetzt wird, gibt das Lesen von <code>$y<\/code> ebenfalls <code>20<\/code> zurück.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergleiche dies mit einer gewöhnlichen Zuweisung, die den Wert in einen separaten Container kopiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binding funktioniert auch mit Arrays.<\/span> <span class=\"sg\" data-s=\"1\">Das Folgende macht <code>@alias<\/code> zu einem anderen Namen für <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein weiteres Detail: Wenn du einen Namen direkt an einen Literalwert bindest, gibt es keinen Container dahinter, sodass der Name schreibgeschützt wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"nl":{"t":"Binding met <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe maakte elke variabele die je aanmaakte een nieuwe container aan, en toekenning met <code>=<\/code> plaatste een waarde <em>in<\/em> die container.<\/span> <span class=\"sg\" data-s=\"1\">Binding, geschreven met <code>:=<\/code>, is anders: het laat een naam verwijzen naar een <em>bestaande<\/em> container in plaats van een nieuwe aan te maken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Na binding delen de twee namen dezelfde container, zodat een wijziging via de ene zichtbaar is via de andere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier kopieert <code>$y := $x<\/code> niet de waarde <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het maakt <code>$y<\/code> een andere naam voor exact dezelfde container als <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer <code>$x<\/code> later op <code>20<\/code> wordt gezet, geeft het lezen van <code>$y<\/code> ook <code>20<\/code> terug.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergelijk dit met gewone toekenning, die de waarde kopieert naar een aparte container:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binding werkt ook met arrays.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende maakt <code>@alias<\/code> een andere naam voor <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nog een detail: als je een naam direct bindt aan een letterlijke waarde, is er geen container erachter, waardoor de naam alleen-lezen wordt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"es":{"t":"Enlace con <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, cada variable que creaste generaba un nuevo contenedor, y la asignación con <code>=<\/code> colocaba un valor <em>dentro<\/em> de ese contenedor.<\/span> <span class=\"sg\" data-s=\"1\">La vinculación (binding), escrita con <code>:=<\/code>, es diferente: hace que un nombre se refiera a un contenedor <em>existente<\/em> en lugar de crear uno nuevo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Después de la vinculación, los dos nombres comparten el mismo contenedor, por lo que un cambio realizado a través de uno de ellos es visible a través del otro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>$y := $x<\/code> no copia el valor <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hace que <code>$y<\/code> sea otro nombre para el mismo contenedor que <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cuando <code>$x<\/code> se establece posteriormente en <code>20<\/code>, leer <code>$y<\/code> también devuelve <code>20<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compara esto con la asignación ordinaria, que copia el valor en un contenedor separado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # una copia simple\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La vinculación también funciona con arrays.<\/span> <span class=\"sg\" data-s=\"1\">Lo siguiente hace que <code>@alias<\/code> sea otro nombre para <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un detalle más: si vinculas un nombre directamente a un valor literal, no hay contenedor detrás de él, por lo que el nombre se convierte en solo lectura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"it":{"t":"Binding con <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora, ogni variabile che hai creato ha generato un nuovo contenitore, e l'assegnazione con <code>=<\/code> ha inserito un valore <em>dentro<\/em> quel contenitore.<\/span> <span class=\"sg\" data-s=\"1\">Il binding, scritto con <code>:=<\/code>, è diverso: fa sì che un nome si riferisca a un contenitore <em>esistente<\/em> invece di crearne uno nuovo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo il binding, i due nomi condividono lo stesso contenitore, quindi una modifica effettuata tramite uno dei due è visibile attraverso l'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>$y := $x<\/code> non copia il valore <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Fa sì che <code>$y<\/code> sia un altro nome per lo stesso identico contenitore di <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quando <code>$x<\/code> viene poi impostato a <code>20<\/code>, leggendo <code>$y<\/code> si ottiene <code>20<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Confronta questo con l'assegnazione ordinaria, che copia il valore in un contenitore separato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il binding funziona anche con gli array.<\/span> <span class=\"sg\" data-s=\"1\">Il seguente esempio fa di <code>@alias<\/code> un altro nome per <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un altro dettaglio: se fai il binding di un nome direttamente a un valore letterale, non c'è alcun contenitore dietro di esso, quindi il nome diventa di sola lettura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"lv":{"t":"Saistīšana ar <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Līdz šim katrs jūsu izveidotais mainīgais radīja jaunu konteineru, un piešķiršana ar <code>=<\/code> ievietoja vērtību <em>tajā konteinerā<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Saistīšana, ko raksta ar <code>:=<\/code>, ir citāda: tā liek nosaukumam norādīt uz <em>jau esošu<\/em> konteineru, nevis veidot jaunu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc saistīšanas abi nosaukumi dalās ar to pašu konteineru, tāpēc izmaiņa, kas veikta caur vienu no tiem, ir redzama caur otru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>$y := $x<\/code> nekopē vērtību <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas padara <code>$y<\/code> par citu nosaukumu tam pašam konteineram, kas ir <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kad <code>$x<\/code> vēlāk tiek iestatīts uz <code>20<\/code>, nolasot <code>$y<\/code> arī atgriež <code>20<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar parasto piešķiršanu, kas kopē vērtību atsevišķā konteinerā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Saistīšana darbojas arī ar masīviem.<\/span> <span class=\"sg\" data-s=\"1\">Šis piemērs padara <code>@alias<\/code> par citu nosaukumu masīvam <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl viena detaļa: ja saistāt nosaukumu tieši ar literālu vērtību, aiz tā nav konteinera, tāpēc nosaukums kļūst tikai lasāms:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"ru":{"t":"Привязка с помощью <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">До сих пор каждая созданная вами переменная порождала новый контейнер, и присваивание через <code>=<\/code> помещало значение <em>в<\/em> этот контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Привязка, записываемая через <code>:=<\/code>, работает иначе: она делает имя ссылкой на <em>уже существующий<\/em> контейнер, а не создаёт новый.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После привязки оба имени разделяют один и тот же контейнер, поэтому изменение через одно из них видно через другое:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>$y := $x<\/code> не копирует значение <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оно делает <code>$y<\/code> другим именем для того же контейнера, что и <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когда <code>$x<\/code> позже устанавливается в <code>20<\/code>, чтение <code>$y<\/code> тоже возвращает <code>20<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравните это с обычным присваиванием, которое копирует значение в отдельный контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # обычная копия\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Привязка работает и с массивами.<\/span> <span class=\"sg\" data-s=\"1\">Следующий пример делает <code>@alias<\/code> другим именем для <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ещё один нюанс: если вы привяжете имя непосредственно к литеральному значению, за ним не стоит контейнер, поэтому имя становится доступным только для чтения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"uk":{"t":"Зв'язування через <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Досі кожна створена вами змінна породжувала новий контейнер, а присвоєння через <code>=<\/code> клало значення <em>всередину<\/em> цього контейнера.<\/span> <span class=\"sg\" data-s=\"1\">Зв'язування, що записується як <code>:=<\/code>, працює інакше: воно змушує ім'я посилатися на <em>наявний<\/em> контейнер, а не створювати новий.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після зв'язування два імені спільно володіють одним контейнером, тож зміна, зроблена через одне з них, видима через інше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$y := $x<\/code> не копіює значення <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Воно робить <code>$y<\/code> іще одним іменем того самого контейнера, що й <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коли <code>$x<\/code> пізніше встановлюють у <code>20<\/code>, читання <code>$y<\/code> теж повертає <code>20<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порівняйте це зі звичайним присвоєнням, яке копіює значення в окремий контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # звичайна копія\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зв'язування працює й з масивами.<\/span> <span class=\"sg\" data-s=\"1\">Наведений код робить <code>@alias<\/code> іще одним іменем для <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще одна деталь: якщо зв'язати ім'я безпосередньо з літеральним значенням, за ним не стоїть жодного контейнера, тож ім'я стає доступним лише для читання:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"bg":{"t":"Свързване с <code>:=<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Досега всяка създадена от вас променлива създаваше нов контейнер, а присвояването с <code>=<\/code> поставяше стойност <em>в<\/em> този контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Свързването, записвано с <code>:=<\/code>, е различно: то кара едно име да сочи към <em>съществуващ<\/em> контейнер, вместо да създава нов.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След свързване двете имена споделят един и същ контейнер, така че промяна, направена чрез едното от тях, е видима и чрез другото:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$y := $x<\/code> не копира стойността <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То прави <code>$y<\/code> друго име за абсолютно същия контейнер като <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когато по-късно <code>$x<\/code> бъде зададен на <code>20<\/code>, четенето на <code>$y<\/code> също връща <code>20<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравнете с обикновеното присвояване, което копира стойността в отделен контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Свързването работи и с масиви.<\/span> <span class=\"sg\" data-s=\"1\">Следното прави <code>@alias<\/code> друго име за <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Още един детайл: ако свържете име директно с литерална стойност, зад него няма контейнер, така че името става само за четене:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/co
