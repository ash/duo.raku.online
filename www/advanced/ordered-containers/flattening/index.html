<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/flattening","n":371,"k":"topic","pv":"advanced/ordered-containers/binding","nx":"advanced/ordered-containers/flattening/quiz","tr":["advanced","advanced/ordered-containers"],"L":{"en":{"t":"Flattening and itemisation (itemization)","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">When you put one array inside another, Raku does <em>not<\/em> automatically merge their elements.<\/span> <span class=\"sg\" data-s=\"1\">Examine the following program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The array <code>@c<\/code> has only two elements: the arrays <code>@a<\/code> and <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku keeps each container as a single item rather than spilling its contents into the outer array.<\/span> <span class=\"sg\" data-s=\"2\">The same happens for a value placed among others:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you actually want a single flat sequence, ask for it explicitly with the <code>flat<\/code> routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisation (Itemization)<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sometimes you want the opposite: to protect a container from being flattened, even inside <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>$(...)<\/code> construct <em>itemises<\/em> its argument — it marks the result as a single item.<\/span> <span class=\"sg\" data-s=\"2\">Compare the previous example with this one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, <code>$(@a)<\/code> keeps <code>@a<\/code> as one element, while <code>@b<\/code> is still flattened into its two values.<\/span> <span class=\"sg\" data-s=\"1\">This is the <code>$<\/code> sigil idea once more: a <code>$<\/code> means “treat this as a single thing”.<\/span><\/p>"]]},"de":{"t":"Flattening und Itemisierung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Array in ein anderes steckst, verschmilzt Raku ihre Elemente <em>nicht<\/em> automatisch.<\/span> <span class=\"sg\" data-s=\"1\">Betrachte das folgende Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Array <code>@c<\/code> hat nur zwei Elemente: die Arrays <code>@a<\/code> und <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku behält jeden Container als einzelnes Element bei, statt seinen Inhalt in das äußere Array auszuschütten.<\/span> <span class=\"sg\" data-s=\"2\">Dasselbe passiert, wenn ein Wert zwischen anderen platziert wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du tatsächlich eine einzelne flache Sequenz haben willst, frage explizit danach mit der Routine <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisierung<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Manchmal willst du das Gegenteil: einen Container davor schützen, abgeflacht zu werden, auch innerhalb von <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das Konstrukt <code>$(...)<\/code> <em>itemisiert<\/em> sein Argument — es markiert das Ergebnis als einzelnes Element.<\/span> <span class=\"sg\" data-s=\"2\">Vergleiche das vorherige Beispiel mit diesem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier behält <code>$(@a)<\/code> <code>@a<\/code> als ein Element bei, während <code>@b<\/code> weiterhin in seine beiden Werte abgeflacht wird.<\/span> <span class=\"sg\" data-s=\"1\">Das ist wieder die Idee des <code>$<\/code>-Sigils: Ein <code>$<\/code> bedeutet \"behandle dies als eine einzelne Sache\".<\/span><\/p>"]]},"nl":{"t":"Afvlakken en itemisatie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wanneer je een array in een ander array plaatst, voegt Raku hun elementen <em>niet<\/em> automatisch samen.<\/span> <span class=\"sg\" data-s=\"1\">Bekijk het volgende programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het array <code>@c<\/code> heeft slechts twee elementen: de arrays <code>@a<\/code> en <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku bewaart elke container als een enkel item in plaats van de inhoud uit te storten in het buitenste array.<\/span> <span class=\"sg\" data-s=\"2\">Hetzelfde gebeurt voor een waarde die tussen andere wordt geplaatst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je daadwerkelijk een enkele platte reeks wilt, vraag er dan expliciet om met de <code>flat<\/code> routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisatie (Itemization)<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Soms wil je het tegenovergestelde: een container beschermen tegen flattening, zelfs binnen <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De <code>$(...)<\/code> constructie <em>itemiseert<\/em> zijn argument — het markeert het resultaat als een enkel item.<\/span> <span class=\"sg\" data-s=\"2\">Vergelijk het vorige voorbeeld met dit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier houdt <code>$(@a)<\/code> het array <code>@a<\/code> als één element, terwijl <code>@b<\/code> nog steeds wordt platgeslagen tot zijn twee waarden.<\/span> <span class=\"sg\" data-s=\"1\">Dit is het <code>$<\/code> sigil-idee opnieuw: een <code>$<\/code> betekent \"behandel dit als een enkel ding\".<\/span><\/p>"]]},"es":{"t":"Aplanamiento e itemización","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando colocas un array dentro de otro, Raku <em>no<\/em> fusiona automáticamente sus elementos.<\/span> <span class=\"sg\" data-s=\"1\">Examina el siguiente programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El array <code>@c<\/code> tiene solo dos elementos: los arrays <code>@a<\/code> y <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku mantiene cada contenedor como un único elemento en lugar de derramar su contenido en el array externo.<\/span> <span class=\"sg\" data-s=\"2\">Lo mismo sucede con un valor colocado entre otros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando realmente quieres una secuencia plana única, solicítalo explícitamente con la rutina <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemización<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A veces quieres lo contrario: proteger un contenedor de ser aplanado, incluso dentro de <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La construcción <code>$(...)<\/code> <em>itemiza<\/em> su argumento, lo marca como un único elemento.<\/span> <span class=\"sg\" data-s=\"2\">Compara el ejemplo anterior con este:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>$(@a)<\/code> mantiene <code>@a<\/code> como un solo elemento, mientras que <code>@b<\/code> sigue siendo aplanado en sus dos valores.<\/span> <span class=\"sg\" data-s=\"1\">Esta es la idea del sigilo <code>$<\/code> una vez más: un <code>$<\/code> significa \"trata esto como una sola cosa\".<\/span><\/p>"]]},"it":{"t":"Appiattimento e itemizzazione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando metti un array dentro un altro, Raku <em>non<\/em> unisce automaticamente i loro elementi.<\/span> <span class=\"sg\" data-s=\"1\">Esamina il seguente programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'array <code>@c<\/code> ha solo due elementi: gli array <code>@a<\/code> e <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku mantiene ogni contenitore come un singolo elemento piuttosto che riversarne il contenuto nell'array esterno.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso accade per un valore posto tra altri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando vuoi effettivamente una singola sequenza piatta, richiedila esplicitamente con la routine <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemizzazione (Itemization)<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A volte vuoi l'opposto: proteggere un contenitore dall'essere appiattito, anche dentro <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il costrutto <code>$(...)<\/code> <em>itemizza<\/em> il suo argomento — contrassegna il risultato come un singolo elemento.<\/span> <span class=\"sg\" data-s=\"2\">Confronta l'esempio precedente con questo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>$(@a)<\/code> mantiene <code>@a<\/code> come un unico elemento, mentre <code>@b<\/code> viene comunque appiattito nei suoi due valori.<\/span> <span class=\"sg\" data-s=\"1\">Questa è ancora l'idea del sigillo <code>$<\/code>: un <code>$<\/code> significa \"tratta questo come una singola cosa\".<\/span><\/p>"]]},"lv":{"t":"Saplacināšana un vienuma veidošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad ievietojat vienu masīvu citā, Raku <em>automātiski neapvieno<\/em> to elementus.<\/span> <span class=\"sg\" data-s=\"1\">Aplūkojiet šādu programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Masīvam <code>@c<\/code> ir tikai divi elementi: masīvi <code>@a<\/code> un <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku saglabā katru konteineru kā vienu vienību, nevis izlej tā saturu ārējā masīvā.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats notiek ar vērtību, kas novietota starp citām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jums tiešām nepieciešama viena plakana secība, pieprasiet to tieši ar rutīnu <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemizācija (Itemization)<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums ir nepieciešams pretējais: pasargāt konteineru no izlīdzināšanas pat <code>flat<\/code> iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Konstrukcija <code>$(...)<\/code> <em>itemizē<\/em> savu argumentu — tā atzīmē rezultātu kā vienu vienību.<\/span> <span class=\"sg\" data-s=\"2\">Salīdziniet iepriekšējo piemēru ar šo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>$(@a)<\/code> saglabā <code>@a<\/code> kā vienu elementu, bet <code>@b<\/code> joprojām tiek izlīdzināts savās divās vērtībās.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir sigila <code>$<\/code> ideja vēlreiz: <code>$<\/code> nozīmē \"uztvert šo kā vienu lietu\".<\/span><\/p>"]]},"ru":{"t":"Сглаживание и элементизация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы помещаете один массив внутрь другого, Raku <em>не<\/em> объединяет их элементы автоматически.<\/span> <span class=\"sg\" data-s=\"1\">Рассмотрите следующую программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Массив <code>@c<\/code> содержит всего два элемента: массивы <code>@a<\/code> и <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku сохраняет каждый контейнер как отдельный элемент, а не рассыпает его содержимое во внешний массив.<\/span> <span class=\"sg\" data-s=\"2\">То же самое происходит, если значение помещается среди других:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда вам действительно нужна единая плоская последовательность, запросите это явно с помощью функции <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Упаковка в элемент (Itemisation)<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно противоположное: защитить контейнер от разворачивания, даже внутри <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Конструкция <code>$(...)<\/code> <em>упаковывает<\/em> свой аргумент, помечая результат как один элемент.<\/span> <span class=\"sg\" data-s=\"2\">Сравните предыдущий пример с этим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>$(@a)<\/code> сохраняет <code>@a<\/code> как один элемент, тогда как <code>@b<\/code> по-прежнему разворачивается в свои два значения.<\/span> <span class=\"sg\" data-s=\"1\">Это снова идея сигила <code>$<\/code>: <code>$<\/code> означает «рассматривать это как одну вещь».<\/span><\/p>"]]},"uk":{"t":"Сплощення та штучність","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви кладете один масив усередину іншого, Raku <em>не<\/em> зливає їхні елементи автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Розгляньмо таку програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Масив <code>@c<\/code> має лише два елементи — масиви <code>@a<\/code> та <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku зберігає кожен контейнер як один елемент, а не висипає його вміст у зовнішній масив.<\/span> <span class=\"sg\" data-s=\"2\">Те саме стається зі значенням, поставленим серед інших:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли вам справді потрібна одна плоска послідовність, попросіть про неї явно за допомогою підпрограми <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Штучність<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді потрібно протилежне: захистити контейнер від сплощення, навіть усередині <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Конструкція <code>$(...)<\/code> робить свій аргумент <em>штучним<\/em> — позначає результат як один елемент.<\/span> <span class=\"sg\" data-s=\"2\">Порівняйте попередній приклад із цим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$(@a)<\/code> зберігає <code>@a<\/code> як один елемент, тоді як <code>@b<\/code> усе одно сплощується у свої два значення.<\/span> <span class=\"sg\" data-s=\"1\">Це знову та сама ідея сигіла <code>$<\/code>: <code>$<\/code> означає «розглядай це як одну річ».<\/span><\/p>"]]},"bg":{"t":"Изравняване и елементизация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато поставите един масив в друг, Raku <em>не<\/em> обединява автоматично елементите им.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте следната програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Масивът <code>@c<\/code> има само два елемента: масивите <code>@a<\/code> и <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku запазва всеки контейнер като единичен елемент, вместо да излива съдържанието му във външния масив.<\/span> <span class=\"sg\" data-s=\"2\">Същото се случва и за стойност, поставена сред други:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато наистина искате единна плоска последователност, поискайте го изрично с рутината <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Айтемизация (Itemization)<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понякога искате обратното: да защитите контейнер от изравняване, дори вътре в <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Конструкцията <code>$(...)<\/code> <em>айтемизира<\/em> аргумента си — маркира резултата като единичен елемент.<\/span> <span class=\"sg\" data-s=\"2\">Сравнете предишния пример с този:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$(@a)<\/code> запазва <code>@a<\/code> като един елемент, докато <code>@b<\/code> все още се изравнява до двете си стойности.<\/span> <span class=\"sg\" data-s=\"1\">Това е идеята на сигила <code>$<\/code> отново: <code>$<\/code> означава „третирай това като едно нещо\".<\/span><\/p>"]]},"la":{"t":"Complanatio et itemisatio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum unum ordinem intra alterum ponis, Raku elementa eorum <em>non<\/em> automatice confundit.<\/span> <span class=\"sg\" data-s=\"1\">Inspice programma sequens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ordo <code>@c<\/code> solum duo elementa habet: ordines <code>@a<\/code> et <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku quemque continentem ut unum elementum servat potius quam contenta eius in ordinem exteriorem effundit.<\/span> <span class=\"sg\" data-s=\"2\">Idem accidit pro valore inter alios posito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum revera unam seriem planam vis, explicite eam cum subroutina <code>flat<\/code> pete:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisatio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum contrarium vis: continentem ab explanatione protegere, etiam intra <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Constructio <code>$(...)<\/code> argumentum suum <em>itemisat<\/em> — resultatum ut unum elementum notat.<\/span> <span class=\"sg\" data-s=\"2\">Compara exemplum praecedens cum hoc:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>$(@a)<\/code> ordinem <code>@a<\/code> ut unum elementum servat, dum <code>@b<\/code> adhuc in duos valores suos explanatur.<\/span> <span class=\"sg\" data-s=\"1\">Haec est idea sigilli <code>$<\/code> iterum: <code>$<\/code> significat \"hoc ut rem unam tracta\".<\/span><\/p>"]]}}}</script>
