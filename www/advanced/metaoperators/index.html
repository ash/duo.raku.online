<script type="application/json" id="page-data">{"u":"advanced/metaoperators","n":542,"k":"section","pv":"advanced/operators-overview/quiz","nx":"advanced/metaoperators/reduction","tr":["advanced"],"L":{"en":{"t":"Meta-operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>meta-operator<\/em> is not an operator on its own — it is a wrapper that turns an ordinary operator into a new one.<\/span> <span class=\"sg\" data-s=\"1\">With a meta-operator you can, for example, apply the same operator across a whole list of values at once, instead of writing it out between every pair of them.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has several meta-operators.<\/span> <span class=\"sg\" data-s=\"1\">This section covers the most useful families: <em>reduction<\/em>, which collapses a list into a single value; <em>zip<\/em>, which combines two lists element by element; and — on the last page — the <em>cross<\/em>, <em>hyper<\/em>, and <em>negated<\/em> operators.<\/span><\/p>"]]},"de":{"t":"Meta-Operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Meta-Operator<\/em> ist kein eigenständiger Operator — er ist eine Hülle, die einen gewöhnlichen Operator in einen neuen verwandelt.<\/span> <span class=\"sg\" data-s=\"1\">Mit einem Meta-Operator können Sie beispielsweise denselben Operator auf eine ganze Liste von Werten auf einmal anwenden, anstatt ihn zwischen jedem Paar einzeln auszuschreiben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku verfügt über mehrere Meta-Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt die nützlichsten Familien: <em>Reduktion<\/em>, die eine Liste zu einem einzelnen Wert zusammenfasst; <em>Zip<\/em>, das zwei Listen elementweise kombiniert; und — auf der letzten Seite — die <em>Kreuz-<\/em>, <em>Hyper-<\/em> und <em>negierten<\/em> Operatoren.<\/span><\/p>"]]},"nl":{"t":"Meta-operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>meta-operator<\/em> is op zichzelf geen operator — het is een omhulsel dat een gewone operator omzet in een nieuwe.<\/span> <span class=\"sg\" data-s=\"1\">Met een meta-operator kun je bijvoorbeeld dezelfde operator in een keer op een hele lijst waarden toepassen, in plaats van hem tussen elk paar uit te schrijven.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft verschillende meta-operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte behandelt de meest nuttige families: <em>reductie<\/em>, die een lijst tot een enkele waarde samenvouwt; <em>zip<\/em>, die twee lijsten element voor element combineert; en — op de laatste pagina — de <em>cross<\/em>-, <em>hyper<\/em>- en <em>genegeerde<\/em> operatoren.<\/span><\/p>"]]},"es":{"t":"Metaoperadores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>meta-operador<\/em> no es un operador por si mismo, sino un envoltorio que convierte un operador ordinario en uno nuevo.<\/span> <span class=\"sg\" data-s=\"1\">Con un meta-operador puedes, por ejemplo, aplicar el mismo operador a toda una lista de valores a la vez, en lugar de escribirlo entre cada par de ellos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene varios meta-operadores.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección cubre las familias más útiles: <em>reducción<\/em>, que colapsa una lista en un único valor; <em>zip<\/em>, que combina dos listas elemento por elemento; y, en la última página, los operadores <em>cross<\/em>, <em>hyper<\/em> y <em>negado<\/em>.<\/span><\/p>"]]},"it":{"t":"Meta-operatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>meta-operatore<\/em> non è un operatore a sé stante — è un involucro che trasforma un operatore ordinario in uno nuovo.<\/span> <span class=\"sg\" data-s=\"1\">Con un meta-operatore puoi, ad esempio, applicare lo stesso operatore a un'intera lista di valori contemporaneamente, invece di scriverlo tra ogni coppia di essi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku dispone di diversi meta-operatori.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione tratta le famiglie più utili: la <em>riduzione<\/em>, che comprime una lista in un singolo valore; lo <em>zip<\/em>, che combina due liste elemento per elemento; e — nell'ultima pagina — gli operatori <em>cross<\/em>, <em>hyper<\/em> e <em>negato<\/em>.<\/span><\/p>"]]},"lv":{"t":"Metaoperatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Metaoperators<\/em> nav patstāvīgi operatori — tie ir apvalki, kas pārveido parastu operatoru jaunā operatorā.<\/span> <span class=\"sg\" data-s=\"1\">Ar metaoperatoru jūs varat, piemēram, lietot vienu un to pašu operatoru visam vērtību sarakstam uzreiz, nevis rakstīt to starp katru vērtību pāri.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ir vairāki metaoperatori.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā apskatītas visnoderīgākās saimes: <em>redukcija<\/em>, kas samazina sarakstu līdz vienai vērtībai; <em>zip<\/em>, kas apvieno divus sarakstus pa elementiem; un — pēdējā lapā — <em>krusteniskais<\/em>, <em>hiper<\/em> un <em>negācijas<\/em> operatori.<\/span><\/p>"]]},"ru":{"t":"Метаоператоры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператор<\/em> — это не самостоятельный оператор, а обёртка, которая превращает обычный оператор в новый.<\/span> <span class=\"sg\" data-s=\"1\">С помощью метаоператора можно, например, применить один и тот же оператор сразу ко всему списку значений, вместо того чтобы выписывать его между каждой парой.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku есть несколько метаоператоров.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются самые полезные семейства: <em>свёртка<\/em>, которая сворачивает список в одно значение; <em>zip<\/em>, который объединяет два списка поэлементно; и — на последней странице — <em>перекрёстные<\/em>, <em>гипер-<\/em> и <em>отрицающие<\/em> операторы.<\/span><\/p>"]]},"uk":{"t":"Метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператор<\/em> не є оператором сам по собі — це обгортка, яка перетворює звичайний оператор на новий.<\/span> <span class=\"sg\" data-s=\"1\">За допомогою метаоператора можна, наприклад, застосувати той самий оператор одразу до цілого списку значень, замість виписувати його між кожною парою.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku є кілька метаоператорів.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ охоплює найкорисніші родини: <em>згортку<\/em>, яка стискає список до одного значення; <em>zip<\/em>, яка поєднує два списки поелементно; а на останній сторінці — <em>перехресний<\/em>, <em>гіпер<\/em>- та <em>заперечний<\/em> оператори.<\/span><\/p>"]]},"bg":{"t":"Метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператорът<\/em> не е самостоятелен оператор — той е обвивка, която превръща обикновен оператор в нов.<\/span> <span class=\"sg\" data-s=\"1\">С метаоператор можете например да приложите един и същ оператор върху цял списък от стойности наведнъж, вместо да го изписвате между всяка двойка.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има няколко метаоператора.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда най-полезните семейства: <em>редукция<\/em>, която свива списък до една стойност; <em>zip<\/em>, който комбинира два списъка елемент по елемент; и — на последната страница — операторите <em>cross<\/em>, <em>хипер<\/em> и <em>отрицание<\/em>.<\/span><\/p>"]]},"eo":{"t":"Metaoperatoroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Meta-operatoro<\/em> ne estas operatoro per si mem — ĝi estas ĉirkaŭaĵo, kiu transformas ordinaran operatoron al nova.<\/span> <span class=\"sg\" data-s=\"1\">Per meta-operatoro vi povas, ekzemple, apliki la saman operatoron al tuta listo de valoroj samtempe, anstataŭ skribi ĝin inter ĉiu paro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku havas plurajn meta-operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio traktas la plej utilajn familiojn: <em>redukto<\/em>, kiu kunfandas liston al unu valoro; <em>zipado<\/em>, kiu kombinas du listojn elemento post elemento; kaj — sur la lasta paĝo — la <em>kruca<\/em>, <em>hiper-<\/em> kaj <em>neiga<\/em> operatoroj.<\/span><\/p>"]]},"la":{"t":"Meta-operatores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Meta-operator<\/em> non est operator per se — involucrum est quod operatorem ordinarium in novum convertit.<\/span> <span class=\"sg\" data-s=\"1\">Cum meta-operatore potes, exempli gratia, eundem operatorem per totam listam valorum simul applicare, loco eum inter omne par scribendi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku plures meta-operatores habet.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio familias utilissimas tractat: <em>reductionem<\/em>, quae listam in unum valorem contrahit; <em>zip<\/em>, qui duas listas elementum per elementum coniungit; et — in ultima pagina — operatores <em>cross<\/em>, <em>hyper<\/em>, et <em>negatos<\/em>.<\/span><\/p>"]]}}}</script>
