<script type="application/json" id="page-data">{"u":"advanced/metaoperators/zip","n":545,"k":"topic","pv":"advanced/metaoperators/reduction/quiz","nx":"advanced/metaoperators/more","tr":["advanced","advanced/metaoperators"],"L":{"en":{"t":"Zip metaoperators","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The zip meta-operator <code>Z<\/code> takes two (or more) lists and pairs up their elements by position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The result is a list of groups: the first element of each list together, then the second of each, and so on.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">More ingeniously, you can combine <code>Z<\/code> with an operator to act on each pair.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>Z+<\/code> adds the elements position by position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is the zip meta-operator wrapping the <code>+<\/code> operator: it computes <code>1 + 10<\/code>, <code>2 + 20<\/code>, and <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In the same way, <code>Z*<\/code> multiplies corresponding elements:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And <code>Z~<\/code> concatenates corresponding strings:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"de":{"t":"Zip-Metaoperatoren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Zip-Meta-Operator <code>Z<\/code> nimmt zwei (oder mehr) Listen und paart ihre Elemente nach Position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis ist eine Liste von Gruppen: zuerst das erste Element jeder Liste zusammen, dann das zweite jeder Liste, und so weiter.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noch raffinierter: Sie können <code>Z<\/code> mit einem Operator kombinieren, um auf jedes Paar einzuwirken.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel addiert <code>Z+<\/code> die Elemente positionsweise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies ist der Zip-Meta-Operator, der den <code>+<\/code>-Operator umhüllt: Er berechnet <code>1 + 10<\/code>, <code>2 + 20<\/code> und <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ebenso multipliziert <code>Z*<\/code> die entsprechenden Elemente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und <code>Z~<\/code> verkettet die entsprechenden Zeichenketten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"nl":{"t":"Zip-meta-operatoren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De zip-meta-operator <code>Z<\/code> neemt twee (of meer) lijsten en koppelt hun elementen op positie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het resultaat is een lijst van groepen: het eerste element van elke lijst samen, dan het tweede van elk, enzovoort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nog slimmer: je kunt <code>Z<\/code> combineren met een operator om op elk paar te werken.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, <code>Z+<\/code> telt de elementen positie voor positie op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is de zip-meta-operator die de <code>+<\/code>-operator omhult: hij berekent <code>1 + 10<\/code>, <code>2 + 20<\/code> en <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Op dezelfde manier vermenigvuldigt <code>Z*<\/code> overeenkomstige elementen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>Z~<\/code> voegt overeenkomstige tekenreeksen samen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"es":{"t":"Metaoperadores zip","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">El meta-operador zip <code>Z<\/code> toma dos (o más) listas y empareja sus elementos por posición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El resultado es una lista de grupos: el primer elemento de cada lista juntos, luego el segundo de cada una, y así sucesivamente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De forma más ingeniosa, puedes combinar <code>Z<\/code> con un operador para actuar sobre cada par.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>Z+<\/code> suma los elementos posición por posición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este es el meta-operador zip envolviendo al operador <code>+<\/code>: calcula <code>1 + 10<\/code>, <code>2 + 20<\/code> y <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De la misma manera, <code>Z*<\/code> multiplica los elementos correspondientes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y <code>Z~<\/code> concatena las cadenas correspondientes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"it":{"t":"Meta-operatori zip","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Il meta-operatore zip <code>Z<\/code> prende due (o più) liste e accoppia i loro elementi per posizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il risultato è una lista di gruppi: il primo elemento di ogni lista insieme, poi il secondo di ciascuna, e così via.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In modo ancora più ingegnoso, è possibile combinare <code>Z<\/code> con un operatore per agire su ogni coppia.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, <code>Z+<\/code> somma gli elementi posizione per posizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è il meta-operatore zip che avvolge l'operatore <code>+<\/code>: calcola <code>1 + 10<\/code>, <code>2 + 20<\/code> e <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allo stesso modo, <code>Z*<\/code> moltiplica gli elementi corrispondenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E <code>Z~<\/code> concatena le stringhe corrispondenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"lv":{"t":"Zip metaoperatori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip metaoperators <code>Z<\/code> paņem divus (vai vairākus) sarakstus un sapāro to elementus pēc pozīcijas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rezultāts ir grupu saraksts: pirmie elementi no katra saraksta kopā, tad otrie no katra un tā tālāk.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vēl interesantāk — <code>Z<\/code> var apvienot ar operatoru, lai darbotos ar katru pāri.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, <code>Z+<\/code> saskaita elementus pa pozīcijām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis ir zip metaoperators, kas ietver <code>+<\/code> operatoru: tas aprēķina <code>1 + 10<\/code>, <code>2 + 20<\/code> un <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat <code>Z*<\/code> sareizina atbilstošos elementus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Z~<\/code> savieno atbilstošās virknes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"ru":{"t":"Метаоператоры zip","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаоператор zip <code>Z<\/code> берёт два (или больше) списка и объединяет их элементы попарно по позициям:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Результат — список групп: первые элементы всех списков вместе, затем вторые и так далее.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ещё интереснее то, что <code>Z<\/code> можно совместить с оператором, чтобы подействовать на каждую пару.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>Z+<\/code> складывает элементы попозиционно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это метаоператор zip, обёрнутый вокруг оператора <code>+<\/code>: он вычисляет <code>1 + 10<\/code>, <code>2 + 20<\/code> и <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Точно так же <code>Z*<\/code> перемножает соответствующие элементы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> соединяет соответствующие строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"uk":{"t":"Метаоператори zip","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаоператор zip <code>Z<\/code> бере два (або більше) списки й парує їхні елементи за позиціями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Результатом є список груп: перші елементи кожного списку разом, потім другі з кожного й так далі.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ще дотепніше те, що <code>Z<\/code> можна поєднати з оператором, щоб діяти на кожну пару.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>Z+<\/code> додає елементи позиція до позиції:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це метаоператор zip, що огортає оператор <code>+<\/code>: він обчислює <code>1 + 10<\/code>, <code>2 + 20<\/code> та <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так само <code>Z*<\/code> перемножує відповідні елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> з'єднує відповідні рядки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"bg":{"t":"Zip метаоператори","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip метаоператорът <code>Z<\/code> взима два (или повече) списъка и сдвоява елементите им по позиция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Резултатът е списък от групи: първият елемент от всеки списък заедно, после вторият от всеки и така нататък.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По-остроумно е, че можете да комбинирате <code>Z<\/code> с оператор, за да действа върху всяка двойка.<\/span> <span class=\"sg\" data-s=\"1\">Например <code>Z+<\/code> събира елементите позиция по позиция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е zip метаоператорът, обвиващ оператора <code>+<\/code>: той изчислява <code>1 + 10<\/code>, <code>2 + 20<\/code> и <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">По същия начин <code>Z*<\/code> умножава съответните елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> конкатенира съответните низове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"eo":{"t":"Zip-metaoperatoroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La zipa meta-operatoro <code>Z<\/code> prenas du (aŭ pli) listojn kaj kunigas iliajn elementojn laŭ pozicio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rezulto estas listo de grupoj: la unua elemento de ĉiu listo kune, poste la dua de ĉiu, kaj tiel plu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pli inventeme, vi povas kombini <code>Z<\/code> kun operatoro por agi sur ĉiun paron.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, <code>Z+<\/code> adicias la elementojn pozicio post pozicio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio estas la zipa meta-operatoro ĉirkaŭanta la operatoron <code>+<\/code>: ĝi kalkulas <code>1 + 10<\/code>, <code>2 + 20<\/code>, kaj <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Same, <code>Z*<\/code> multobligas respondajn elementojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>Z~<\/code> kunĉenas respondajn ĉenojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"la":{"t":"Zip meta-operatores","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Meta-operator zip <code>Z<\/code> duas (vel plures) listas accipit et elementa earum per positionem coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eventus est lista gregum: primum elementum cuiusque listae simul, deinde secundum cuiusque, et ita porro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ingeniosius, <code>Z<\/code> cum operatore combinare potes ut in unoquoque pare agat.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, <code>Z+<\/code> elementa per positionem addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic est meta-operator zip operatorem <code>+<\/code> involvens: computat <code>1 + 10<\/code>, <code>2 + 20<\/code>, et <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eodem modo, <code>Z*<\/code> elementa correspondentia multiplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et <code>Z~<\/code> fila correspondentia concatenat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]}}}</script>
