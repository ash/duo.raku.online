<script type="application/json" id="page-data">{"u":"advanced/metaoperators/exercises/factorial/solution","n":552,"k":"solution","pv":"advanced/metaoperators/exercises/factorial","nx":"advanced/metaoperators/exercises/concatenate-a-list","tr":["advanced","advanced/metaoperators"],"L":{"en":{"t":"The solution of ’Every factorial at once‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The backslash inside the brackets turns <code>[*]<\/code> into a <em>triangular<\/em> reduction. Instead of collapsing the list to a single value, it keeps every partial product: <code>1<\/code>, then <code>1*2<\/code>, then <code>1*2*3<\/code>, and so on.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Each partial product <code>1*2*...*k<\/code> is exactly <em>k!<\/em>, so the result is the list of factorials of <code>1<\/code> through <code>6<\/code>. A plain <code>[*] 1..6<\/code> would have given only the last of these, <code>720<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Jede Fakultät auf einmal","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><spa >.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Ogni fattoriale in una volta","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il backslash all'interno delle parentesi quadre trasforma <code>[*]<\/code> in una riduzione <em>triangolare<\/em>. Invece di comprimere la lista in un singolo valore, conserva ogni prodotto parziale: <code>1<\/code>, poi <code>1*2<\/code>, poi <code>1*2*3<\/code>, e così via.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ogni prodotto parziale <code>1*2*...*k<\/code> è esattamente <em>k!<\/em>, quindi il risultato è la lista dei fattoriali da <code>1<\/code> a <code>6<\/code>. Un semplice <code>[*] 1..6<\/code> avrebbe restituito solo l'ultimo di questi, <code>720<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Visi faktoriāli uzreiz","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējamais uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Atpakaļsvītra iekavās pārveido <code>[*]<\/code> par <em>trīsstūra<\/em> redukciju. Tā vietā, lai samazinātu sarakstu līdz vienai vērtībai, tā saglabā katru daļējo reizinājumu: <code>1<\/code>, tad <code>1*2<\/code>, tad <code>1*2*3<\/code> un tā tālāk.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Katrs daļējais reizinājums <code>1*2*...*k<\/code> ir tieši <em>k!<\/em>, tāpēc rezultāts ir faktoriālu saraksts no <code>1<\/code> līdz <code>6<\/code>. Parasta <code>[*] 1..6<\/code> būtu devusi tikai pēdējo no tiem, <code>720<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Все факториалы сразу","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратная косая черта внутри скобок превращает <code>[*]<\/code> в <em>треугольную<\/em> свёртку. Вместо того чтобы свернуть список к одному значению, она сохраняет каждое частичное произведение: <code>1<\/code>, затем <code>1*2<\/code>, затем <code>1*2*3<\/code> и так далее.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Каждое частичное произведение <code>1*2*...*k<\/code> — это в точности <em>k!<\/em>, поэтому результатом оказывается список факториалов чисел от <code>1<\/code> до <code>6<\/code>. Обычная свёртка <code>[*] 1..6<\/code> дала бы только последнее из них — <code>720<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Усі факторіали одразу","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зворотна коса риска всередині дужок перетворює <code>[*]<\/code> на <em>трикутну<\/em> згортку. Замість стиснути список до одного значення вона зберігає кожен частковий добуток: <code>1<\/code>, потім <code>1*2<\/code>, потім <code>1*2*3<\/code> і так далі.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кожен частковий добуток <code>1*2*...*k<\/code> є точно <em>k!<\/em>, тож результатом є список факторіалів чисел від <code>1<\/code> до <code>6<\/code>. Звичайний <code>[*] 1..6<\/code> дав би лише останній із них — <code>720<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Всеки факториел наведнъж","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратната наклонена черта вътре в скобите превръща <code>[*]<\/code> в <em>триъгълна<\/em> редукция. Вместо да свива списъка до една стойност, тя запазва всяко частично произведение: <code>1<\/code>, после <code>1*2<\/code>, после <code>1*2*3<\/code> и така нататък.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всяко частично произведение <code>1*2*...*k<\/code> е точно <em>k!<\/em>, така че резултатът е списъкът с факториелите от <code>1<\/code> до <code>6<\/code>. Обикновеното <code>[*] 1..6<\/code> щеше да даде само последния от тях, <code>720<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Ĉiuj faktorialoj samtempe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La retrokliniĝo ene de la krampoj igas <code>[*]<\/code> triangula redukto. Anstataŭ kunfandi la liston al ununura valoro, ĝi konservas ĉiun partan produkton: <code>1<\/code>, poste <code>1*2<\/code>, poste <code>1*2*3<\/code>, kaj tiel plu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiu parta produkto <code>1*2*...*k<\/code> estas ĝuste <em>k!<\/em>, do la rezulto estas la listo de faktorialoj de <code>1<\/code> ĝis <code>6<\/code>. Simpla <code>[*] 1..6<\/code> estus doninta nur la lastan el tiuj, <code>720<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Omnes factoriales simul","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\*] 1..6;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/metaoperators/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Linea obliqua inversa intra uncos <code>[*]<\/code> in reductionem <em>triangularem<\/em> convertit. Loco listam in unum valorem contrahendi, omne productum partiale servat: <code>1<\/code>, deinde <code>1*2<\/code>, deinde <code>1*2*3<\/code>, et ita porro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Unumquodque productum partiale <code>1*2*...*k<\/code> est exacte <em>k!<\/em>, ergo eventus est lista factorialium <code>1<\/code> per <code>6<\/code>. Simplex <code>[*] 1..6<\/code> tantum ultimum ex his dedisset, <code>720<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
