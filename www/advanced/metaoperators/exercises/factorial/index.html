<script type="application/json" id="page-data">{"u":"advanced/metaoperators/exercises/factorial","n":551,"k":"exercise","pv":"advanced/metaoperators/exercises/sum-of-array/solution","nx":"advanced/metaoperators/exercises/factorial/solution","tr":["advanced","advanced/metaoperators"],"L":{"en":{"t":"Exercise ’Every factorial at once‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A single <code>[*]<\/code> reduction gives one factorial.<\/span> <span class=\"sg\" data-s=\"1\">Your task is to print <em>every<\/em> factorial from <em>1!<\/em> up to <em>6!<\/em> on a single line, in order, using one reduction.<\/span> <span class=\"sg\" data-s=\"2\">Use the triangular form of the reduction meta-operator so that all the intermediate products are kept, not just the final one.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints the list of factorials of 1 through 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Jede Fakultät auf einmal","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine einzelne <code>[*]<\/code>-Reduktion ergibt eine Fakultät.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Aufgabe ist es, <em>jede<\/em> Fakultät von <em>1!<\/em> bis <em>6!<\/em> in einer einzigen Zeile auszugeben, der Reihe nach, mit einer einzigen Reduktion.<\/span> <span class=\"sg\" data-s=\"2\">Verwenden Sie die dreieckige Form des Reduktions-Meta-Operators, sodass alle Zwischenprodukte erhalten bleiben, nicht nur das letzte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt die Liste der Fakultäten von 1 bis 6 aus:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Elke faculteit tegelijk","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een enkele <code>[*]<\/code>-reductie geeft een faculteit.<\/span> <span class=\"sg\" data-s=\"1\">Jouw taak is om <em>elke<\/em> faculteit van <em>1!<\/em> tot en met <em>6!<\/em> op een enkele regel af te drukken, op volgorde, met behulp van een reductie.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik de driehoeksvorm van de reductie-meta-operator zodat alle tussenproducten bewaard blijven, niet alleen het eindresultaat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt de lijst van faculteiten van 1 tot en met 6 af:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Todos los factoriales a la vez","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una sola reducción <code>[*]<\/code> da un único factorial.<\/span> <span class=\"sg\" data-s=\"1\">Tu tarea es imprimir <em>todos<\/em> los factoriales desde <em>1!<\/em> hasta <em>6!<\/em> en una sola línea, en orden, usando una sola reducción.<\/span> <span class=\"sg\" data-s=\"2\">Usa la forma triangular del meta-operador de reducción para que se conserven todos los productos intermedios, no solo el final.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime la lista de factoriales del 1 al 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Ogni fattoriale in una volta","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una singola riduzione <code>[*]<\/code> produce un solo fattoriale.<\/span> <span class=\"sg\" data-s=\"1\">Il tuo compito è stampare <em>tutti<\/em> i fattoriali da <em>1!<\/em> a <em>6!<\/em> su una singola riga, in ordine, usando una sola riduzione.<\/span> <span class=\"sg\" data-s=\"2\">Usa la forma triangolare del meta-operatore di riduzione in modo che tutti i prodotti intermedi vengano conservati, non solo quello finale.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa la lista dei fattoriali da 1 a 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Visi faktoriāli uzreiz","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Viena <code>[*]<\/code> redukcija dod vienu faktoriālu.<\/span> <span class=\"sg\" data-s=\"1\">Jūsu uzdevums ir izdrukāt <em>visus<\/em> faktoriālus no <em>1!<\/em> līdz <em>6!<\/em> vienā rindā, secībā, izmantojot vienu redukciju.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet redukcijas metaoperatora trīsstūra formu, lai saglabātu visus starprezultātus, ne tikai gala rezultātu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā faktoriālu sarakstu no 1 līdz 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Все факториалы сразу","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна свёртка <code>[*]<\/code> даёт один факториал.<\/span> <span class=\"sg\" data-s=\"1\">Ваша задача — напечатать в одной строке по порядку <em>все<\/em> факториалы от <em>1!<\/em> до <em>6!<\/em>, использовав одну-единственную свёртку.<\/span> <span class=\"sg\" data-s=\"2\">Возьмите треугольную форму метаоператора свёртки, чтобы сохранились все промежуточные произведения, а не только итоговое.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает список факториалов чисел от 1 до 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Усі факторіали одразу»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна згортка <code>[*]<\/code> дає один факторіал.<\/span> <span class=\"sg\" data-s=\"1\">Ваше завдання — вивести в одному рядку по порядку <em>всі<\/em> факторіали від <em>1!<\/em> до <em>6!<\/em>, скориставшись однією-єдиною згорткою.<\/span> <span class=\"sg\" data-s=\"2\">Візьміть трикутну форму метаоператора згортки, щоб збереглися всі проміжні добутки, а не лише підсумковий.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить список факторіалів чисел від 1 до 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Всеки факториел наведнъж","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една редукция <code>[*]<\/code> дава един факториел.<\/span> <span class=\"sg\" data-s=\"1\">Вашата задача е да отпечатате <em>всеки<\/em> факториел от <em>1!<\/em> до <em>6!<\/em> на един ред, по ред, като използвате една редукция.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте триъгълната форма на метаоператора за редукция, за да се запазят всички междинни произведения, а не само крайното.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва списъка с факториелите от 1 до 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Ĉiuj faktorialoj samtempe","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ununura redukto <code>[*]<\/code> donas unu faktorialon.<\/span> <span class=\"sg\" data-s=\"1\">Via tasko estas presi <em>ĉiun<\/em> faktorialon de <em>1!<\/em> ĝis <em>6!<\/em> sur ununura linio, en ordo, per unu redukto.<\/span> <span class=\"sg\" data-s=\"2\">Uzu la triangulan formon de la redukta meta-operatoro por ke ĉiuj intermediaj produktoj estu konservataj, ne nur la fina.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas la liston de faktorialoj de 1 ĝis 6:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Omnes factoriales simul","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una reductio <code>[*]<\/code> unum factorialem dat.<\/span> <span class=\"sg\" data-s=\"1\">Tuum munus est <em>omnem<\/em> factorialem ab <em>1!<\/em> usque ad <em>6!<\/em> in una linea, ordine, imprimere utens una reductione.<\/span> <span class=\"sg\" data-s=\"2\">Utere forma triangulari meta-operatoris reductionis ut omnia producta intermedia serventur, non tantum ultimum.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma listam factorialium 1 per 6 imprimit:<\/span><\/p>"],["code",0,"<pre><code>(1 2 6 24 120 720)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/metaoperators/exercises/factorial/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
