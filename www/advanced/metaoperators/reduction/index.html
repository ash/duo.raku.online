<script type="application/json" id="page-data">{"u":"advanced/metaoperators/reduction","n":543,"k":"topic","pv":"advanced/metaoperators","nx":"advanced/metaoperators/reduction/quiz","tr":["advanced","advanced/metaoperators"],"L":{"en":{"t":"Reduction metaoperators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A reduction meta-operator is written as a regular operator wrapped in square brackets, such as <code>[+]<\/code> or <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It takes a list of values and inserts the operator between every pair of them, reducing the whole list to a single value.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example, <code>[+]<\/code> adds up all the elements of a list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The construct <code>[+] @data<\/code> is equivalent to writing the operator out by hand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Any suitable infix operator works the same way.<\/span> <span class=\"sg\" data-s=\"1\">With <code>[*]<\/code> you get the product of the list, so applying it to the range <code>1..$n<\/code> is a handy way to compute a factorial:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, the range <code>1..$n<\/code> produces the numbers from 1 to 5, and <code>[*]<\/code> multiplies them: <code>1 * 2 * 3 * 4 * 5<\/code>, which is <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">String concatenation works too.<\/span> <span class=\"sg\" data-s=\"1\">The <code>[~]<\/code> reduction joins a list of strings into one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Even comparison operators can be reduced.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> reports whether the values are in strictly increasing order:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Triangular reduction<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you put a backslash inside the brackets, you get a <em>triangular<\/em> reduction, which keeps all the intermediate results instead of only the final one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each element of the result is a partial sum: <code>1<\/code>, then <code>1+2<\/code>, then <code>1+2+3<\/code>, and so on up to the sum of the whole list.<\/span><\/p>"]]},"de":{"t":"Reduktions-Metaoperatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Reduktions-Meta-Operator wird als regulärer Operator in eckigen Klammern geschrieben, wie z. B. <code>[+]<\/code> oder <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er nimmt eine Liste von Werten und fügt den Operator zwischen jedes Paar ein, wodurch die gesamte Liste auf einen einzelnen Wert reduziert wird.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zum Beispiel addiert <code>[+]<\/code> alle Elemente einer Liste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Konstrukt <code>[+] @data<\/code> entspricht dem manuellen Ausschreiben des Operators:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder geeignete Infix-Operator funktioniert auf die gleiche Weise.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>[*]<\/code> erhalten Sie das Produkt der Liste, sodass die Anwendung auf den Bereich <code>1..$n<\/code> eine praktische Methode ist, eine Fakultät zu berechnen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier erzeugt der Bereich <code>1..$n<\/code> die Zahlen von 1 bis 5, und <code>[*]<\/code> multipliziert sie: <code>1 * 2 * 3 * 4 * 5<\/code>, das ist <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zeichenkettenverkettung funktioniert ebenfalls.<\/span> <span class=\"sg\" data-s=\"1\">Die <code>[~]<\/code>-Reduktion verbindet eine Liste von Zeichenketten zu einer einzigen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sogar Vergleichsoperatoren können reduziert werden.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> prüft, ob die Werte in streng aufsteigender Reihenfolge stehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dreieckige Reduktion<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie einen Backslash in die Klammern setzen, erhalten Sie eine <em>dreieckige<\/em> Reduktion, die alle Zwischenergebnisse behält, anstatt nur das endgültige:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jedes Element des Ergebnisses ist eine Teilsumme: <code>1<\/code>, dann <code>1+2<\/code>, dann <code>1+2+3<\/code>, und so weiter bis zur Summe der gesamten Liste.<\/span><\/p>"]]},"nl":{"t":"Reductie-meta-operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een reductie-meta-operator wordt geschreven als een gewone operator tussen vierkante haken, zoals <code>[+]<\/code> of <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt een lijst waarden en plaatst de operator tussen elk paar, waardoor de hele lijst tot een enkele waarde wordt gereduceerd.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bijvoorbeeld, <code>[+]<\/code> telt alle elementen van een lijst op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De constructie <code>[+] @data<\/code> is gelijkwaardig aan het met de hand uitschrijven van de operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke geschikte infix-operator werkt op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>[*]<\/code> krijg je het product van de lijst, dus het toepassen ervan op het bereik <code>1..$n<\/code> is een handige manier om een faculteit te berekenen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier produceert het bereik <code>1..$n<\/code> de getallen van 1 tot 5, en <code>[*]<\/code> vermenigvuldigt ze: <code>1 * 2 * 3 * 4 * 5<\/code>, wat <em>5!<\/em> is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tekenreeksconcatenatie werkt ook.<\/span> <span class=\"sg\" data-s=\"1\">De <code>[~]<\/code>-reductie voegt een lijst tekenreeksen samen tot een:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zelfs vergelijkingsoperatoren kunnen worden gereduceerd.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> geeft aan of de waarden in strikt oplopende volgorde staan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Driehoeksreductie<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je een backslash binnen de haken plaatst, krijg je een _driehoeks_reductie, die alle tussenresultaten bewaart in plaats van alleen het eindresultaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elk element van het resultaat is een gedeeltelijke som: <code>1<\/code>, dan <code>1+2<\/code>, dan <code>1+2+3<\/code>, enzovoort tot aan de som van de hele lijst.<\/span><\/p>"]]},"es":{"t":"Metaoperadores de reducción","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un meta-operador de reducción se escribe como un operador regular envuelto en corchetes, como <code>[+]<\/code> o <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Toma una lista de valores e inserta el operador entre cada par de ellos, reduciendo toda la lista a un único valor.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ejemplo, <code>[+]<\/code> suma todos los elementos de una lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La construcción <code>[+] @data<\/code> es equivalente a escribir el operador a mano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cualquier operador infijo adecuado funciona de la misma manera.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>[*]<\/code> obtienes el producto de la lista, por lo que aplicarlo al rango <code>1..$n<\/code> es una forma práctica de calcular un factorial:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí, el rango <code>1..$n<\/code> produce los números del 1 al 5, y <code>[*]<\/code> los multiplica: <code>1 * 2 * 3 * 4 * 5<\/code>, que es <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La concatenación de cadenas también funciona.<\/span> <span class=\"sg\" data-s=\"1\">La reducción <code>[~]<\/code> une una lista de cadenas en una sola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Incluso los operadores de comparación se pueden reducir.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> indica si los valores están en orden estrictamente creciente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reducción triangular<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si colocas una barra invertida dentro de los corchetes, obtienes una reducción <em>triangular<\/em>, que conserva todos los resultados intermedios en lugar de solo el final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada elemento del resultado es una suma parcial: <code>1<\/code>, luego <code>1+2<\/code>, luego <code>1+2+3<\/code>, y así sucesivamente hasta la suma de toda la lista.<\/span><\/p>"]]},"it":{"t":"Meta-operatori di riduzione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un meta-operatore di riduzione si scrive come un operatore normale racchiuso tra parentesi quadre, ad esempio <code>[+]<\/code> o <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Prende una lista di valori e inserisce l'operatore tra ogni coppia di essi, riducendo l'intera lista a un singolo valore.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per esempio, <code>[+]<\/code> somma tutti gli elementi di una lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il costrutto <code>[+] @data<\/code> equivale a scrivere l'operatore a mano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qualsiasi operatore infisso adatto funziona allo stesso modo.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>[*]<\/code> si ottiene il prodotto della lista, quindi applicarlo all'intervallo <code>1..$n<\/code> è un modo pratico per calcolare un fattoriale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui, l'intervallo <code>1..$n<\/code> produce i numeri da 1 a 5, e <code>[*]<\/code> li moltiplica: <code>1 * 2 * 3 * 4 * 5<\/code>, cioè <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funziona anche la concatenazione di stringhe.<\/span> <span class=\"sg\" data-s=\"1\">La riduzione <code>[~]<\/code> unisce una lista di stringhe in una sola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anche gli operatori di confronto possono essere ridotti.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> verifica se i valori sono in ordine strettamente crescente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Riduzione triangolare<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se si inserisce un backslash all'interno delle parentesi quadre, si ottiene una riduzione <em>triangolare<\/em>, che conserva tutti i risultati intermedi invece del solo risultato finale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni elemento del risultato è una somma parziale: <code>1<\/code>, poi <code>1+2<\/code>, poi <code>1+2+3<\/code>, e così via fino alla somma dell'intera lista.<\/span><\/p>"]]},"lv":{"t":"Reducēšanas metaoperatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Redukcijas metaoperators tiek rakstīts kā parasts operators, ievietots kvadrātiekavās, piemēram, <code>[+]<\/code> vai <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas paņem vērtību sarakstu un ievieto operatoru starp katru vērtību pāri, reducējot visu sarakstu līdz vienai vērtībai.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemēram, <code>[+]<\/code> saskaita visus saraksta elementus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konstrukcija <code>[+] @data<\/code> ir ekvivalenta operatora pierakstam pilnā formā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jebkurš piemērots infiksa operators darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>[*]<\/code> jūs iegūstat saraksta reizinājumu, tāpēc, piemērojot to diapazonam <code>1..$n<\/code>, var ērti aprēķināt faktoriālu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit diapazons <code>1..$n<\/code> ģenerē skaitļus no 1 līdz 5, un <code>[*]<\/code> tos sareizina: <code>1 * 2 * 3 * 4 * 5<\/code>, kas ir <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Darbojas arī virkņu konkatenācija.<\/span> <span class=\"sg\" data-s=\"1\">Redukcija <code>[~]<\/code> savieno virkņu sarakstu vienā virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Arī salīdzināšanas operatorus var reducēt.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> pārbauda, vai vērtības ir stingri augošā secībā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Trīsstūra redukcija<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja iekavās ieliek atpakaļsvītru, iegūst <em>trīsstūra<\/em> redukciju, kas saglabā visus starprezultātus, nevis tikai gala rezultātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs rezultāta elements ir daļēja summa: <code>1<\/code>, tad <code>1+2<\/code>, tad <code>1+2+3<\/code> un tā tālāk līdz visa saraksta summai.<\/span><\/p>"]]},"ru":{"t":"Метаоператоры свёртки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператор свёртки записывается как обычный оператор, заключённый в квадратные скобки, например <code>[+]<\/code> или <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он берёт список значений и вставляет оператор между каждой парой, сворачивая весь список в одно значение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например, <code>[+]<\/code> складывает все элементы списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конструкция <code>[+] @data<\/code> равносильна тому, чтобы выписать оператор вручную:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Точно так же работает любой подходящий инфиксный оператор.<\/span> <span class=\"sg\" data-s=\"1\">С <code>[*]<\/code> вы получите произведение списка, поэтому применение его к диапазону <code>1..$n<\/code> — удобный способ вычислить факториал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь диапазон <code>1..$n<\/code> порождает числа от 1 до 5, а <code>[*]<\/code> перемножает их: <code>1 * 2 * 3 * 4 * 5<\/code>, то есть <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Конкатенация строк тоже работает.<\/span> <span class=\"sg\" data-s=\"1\">Свёртка <code>[~]<\/code> соединяет список строк в одну:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Свернуть можно даже операторы сравнения.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> сообщает, идут ли значения строго по возрастанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Треугольная свёртка<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если поставить внутри скобок обратную косую черту, получится <em>треугольная<\/em> свёртка, которая сохраняет все промежуточные результаты, а не только итоговый:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый элемент результата — это частичная сумма: <code>1<\/code>, затем <code>1+2<\/code>, затем <code>1+2+3<\/code> и так далее вплоть до суммы всего списка.<\/span><\/p>"]]},"uk":{"t":"Метаоператори згортки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператор згортки записується як звичайний оператор, узятий у квадратні дужки, наприклад <code>[+]<\/code> або <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він бере список значень і вставляє оператор між кожною їхньою парою, згортаючи весь список до одного значення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад, <code>[+]<\/code> додає всі елементи списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конструкція <code>[+] @data<\/code> рівносильна тому, щоб виписати оператор вручну:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Будь-який придатний інфіксний оператор працює так само.<\/span> <span class=\"sg\" data-s=\"1\">З <code>[*]<\/code> ви отримуєте добуток списку, тож застосування його до діапазону <code>1..$n<\/code> є зручним способом обчислити факторіал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут діапазон <code>1..$n<\/code> дає числа від 1 до 5, а <code>[*]<\/code> їх перемножує: <code>1 * 2 * 3 * 4 * 5<\/code>, тобто <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Конкатенація рядків працює теж.<\/span> <span class=\"sg\" data-s=\"1\">Згортка <code>[~]<\/code> з'єднує список рядків в один:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Згортати можна навіть оператори порівняння.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> повідомляє, чи розташовані значення в строго зростальному порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Трикутна згортка<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо поставити всередині дужок зворотну косу риску, ви отримаєте <em>трикутну<\/em> згортку, яка зберігає всі проміжні результати, а не лише кінцевий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен елемент результату є частковою сумою: <code>1<\/code>, потім <code>1+2<\/code>, потім <code>1+2+3<\/code> і так далі аж до суми всього списку.<\/span><\/p>"]]},"bg":{"t":"Метаоператори за редукция","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът за редукция се записва като обикновен оператор, обвит в квадратни скоби, например <code>[+]<\/code> или <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той взима списък от стойности и поставя оператора между всяка двойка от тях, свивайки целия списък до една стойност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например <code>[+]<\/code> събира всички елементи на списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конструкцията <code>[+] @data<\/code> е еквивалентна на ръчно изписване на оператора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки подходящ инфиксен оператор работи по същия начин.<\/span> <span class=\"sg\" data-s=\"1\">С <code>[*]<\/code> получавате произведението на списъка, така че прилагането му върху диапазона <code>1..$n<\/code> е удобен начин за пресмятане на факториел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук диапазонът <code>1..$n<\/code> генерира числата от 1 до 5, а <code>[*]<\/code> ги умножава: <code>1 * 2 * 3 * 4 * 5<\/code>, което е <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Конкатенацията на низове също работи.<\/span> <span class=\"sg\" data-s=\"1\">Редукцията <code>[~]<\/code> съединява списък от низове в един:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дори оператори за сравнение могат да бъдат редуцирани.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> проверява дали стойностите са в строго нарастващ ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Триъгълна редукция<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако поставите обратна наклонена черта вътре в скобите, получавате <em>триъгълна<\/em> редукция, която запазва всички междинни резултати, а не само крайния:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент от резултата е частична сума: <code>1<\/code>, после <code>1+2<\/code>, после <code>1+2+3<\/code> и така нататък до сумата на целия списък.<\/span><\/p>"]]},"eo":{"t":"Reduktaj metaoperatoroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Redukta meta-operatoro estas skribata kiel ordinara operatoro ĉirkaŭita de kvadrataj krampoj, ekzemple <code>[+]<\/code> aŭ <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas liston da valoroj kaj enmetas la operatoron inter ĉiun paron, reduktante la tutan liston al unu valoro.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzemple, <code>[+]<\/code> sumigas ĉiujn elementojn de listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La konstruo <code>[+] @data<\/code> egalas al mane skribi la operatoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ajna taŭga infiksa operatoro funkcias same.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>[*]<\/code> vi ricevas la produkton de la listo, do apliki ĝin al la gamo <code>1..$n<\/code> estas oportuna maniero kalkuli faktorialon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie la gamo <code>1..$n<\/code> produktas la nombrojn de 1 ĝis 5, kaj <code>[*]<\/code> multobligas ilin: <code>1 * 2 * 3 * 4 * 5<\/code>, kio estas <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉenkunigo ankaŭ funkcias.<\/span> <span class=\"sg\" data-s=\"1\">La redukto <code>[~]<\/code> kunigas liston da ĉenoj en unu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eĉ komparaj operatoroj estas redukteblaj.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> raportas ĉu la valoroj estas en strikte kreskanta ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Triangula redukto<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi metas retrokliniĝon ene de la krampoj, vi ricevas <em>triangulan<\/em> redukton, kiu konservas ĉiujn intermediajn rezultojn anstataŭ nur la finan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu elemento de la rezulto estas parta sumo: <code>1<\/code>, poste <code>1+2<\/code>, poste <code>1+2+3<\/code>, kaj tiel plu ĝis la sumo de la tuta listo.<\/span><\/p>"]]},"la":{"t":"Reductionis meta-operatores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Meta-operator reductionis scribitur ut operator regularis uncis quadratis involutus, ut <code>[+]<\/code> vel <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Listam valorum accipit et operatorem inter omne par eorum inserit, totam listam ad unum valorem reducens.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exempli gratia, <code>[+]<\/code> omnia elementa listae addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Constructio <code>[+] @data<\/code> aequivalet operatorem manu scribendo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quilibet idoneus operator infixus eodem modo operatur.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>[*]<\/code> productum listae obtines, ergo eum ad intervallum <code>1..$n<\/code> applicare commodus modus est factorialem computandi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic, intervallum <code>1..$n<\/code> numeros ab 1 ad 5 producit, et <code>[*]<\/code> eos multiplicat: <code>1 * 2 * 3 * 4 * 5<\/code>, quod est <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Concatenatio filorum quoque operatur.<\/span> <span class=\"sg\" data-s=\"1\">Reductio <code>[~]<\/code> listam filorum in unum coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam operatores comparationis reduci possunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> refert an valores in ordine stricte crescente sint:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reductio triangularis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si lineam obliquam inversam intra uncos ponis, <em>reductionem triangularem<\/em> obtines, quae omnes eventus intermedios servat loco solius ultimi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unumquodque elementum eventus est summa partialis: <code>1<\/code>, deinde <code>1+2<\/code>, deinde <code>1+2+3<\/code>, et ita porro usque ad summam totius listae.<\/span><\/p>"]]}}}</script>
