<script type="application/json" id="page-data">{"u":"advanced/metaoperators/more","n":546,"k":"topic","pv":"advanced/metaoperators/zip","nx":"advanced/metaoperators/more/quiz","tr":["advanced","advanced/metaoperators"],"L":{"en":{"t":"Cross, hyper, and negated meta-operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides reduction and zip, Raku has several more meta-operators.<\/span> <span class=\"sg\" data-s=\"1\">Three of them are worth knowing here.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The cross meta-operator <code>X<\/code> pairs <strong>every<\/strong> element of one list with <strong>every<\/strong> element of another — the cartesian product:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Like zip, it can wrap an operator to act on each pair.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> joins each pair into a string, and <code>X*<\/code> multiplies:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Where zip walks two lists in step, cross combines them in every possible way.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A hyper meta-operator applies an operator to <strong>each element<\/strong> of a list.<\/span> <span class=\"sg\" data-s=\"1\">The operator is wrapped in the pointy <code>»…«<\/code> (or the ASCII <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">With two lists it works element by element, like zip; with a single value on one side, it stretches that value across the whole list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The two arrows need not point the same way, and their direction decides what happens when the lists differ in length — a tip pointing <strong>at<\/strong> a list lets that list be repeated to match the other.<\/span> <span class=\"sg\" data-s=\"1\">In the ASCII <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> spelling, the four combinations are:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — neither side stretches; the lists must already be the same length, or it is an error;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — the <strong>right<\/strong> list is repeated to match the left;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — the <strong>left<\/strong> list is repeated to match the right;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — the <strong>shorter<\/strong> list is repeated to match the longer.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There is a unary form too, which calls a method on every element.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> upper-cases each string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hyper operations also signal that the work <em>may<\/em> be done in parallel — you will meet the related <code>.hyper<\/code> method later, in <a href=\"/paradigms/hyper-race/\">the section on concurrent programming<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negated — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Putting <code>!<\/code> in front of a comparison operator negates its result.<\/span> <span class=\"sg\" data-s=\"1\">The familiar <code>!=<\/code> (not equal) is exactly this meta-operator applied to <code>==<\/code>, and the same works for other Boolean operators such as <code>eq<\/code> and <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In short, <code>$a !op $b<\/code> is just a tidier way of writing <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is on purpose.<\/span> <span class=\"sg\" data-s=\"1\">Unlike a deliberately minimal language such as Esperanto, which aims for one regular way to express each thing, Raku is happy to give you several — so the negated <code>!eq<\/code> lives right alongside the dedicated <code>ne<\/code> operator, and the two mean exactly the same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"de":{"t":"Kreuz-, Hyper- und negierte Operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben Reduktion und Zip hat Raku mehrere weitere Meta-Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Drei davon sind hier wissenswert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kreuz — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Kreuz-Meta-Operator <code>X<\/code> paart <strong>jedes<\/strong> Element einer Liste mit <strong>jedem<\/strong> Element einer anderen — das kartesische Produkt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie Zip kann er einen Operator umhüllen, um auf jedes Paar einzuwirken.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> verbindet jedes Paar zu einer Zeichenkette, und <code>X*<\/code> multipliziert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Während Zip zwei Listen im Gleichschritt durchläuft, kombiniert Kreuz sie auf jede mögliche Weise.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Hyper-Meta-Operator wendet einen Operator auf <strong>jedes Element<\/strong> einer Liste an.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator wird in die spitzen <code>»…«<\/code> (oder die ASCII-Variante <code>&gt;&gt;…&lt;&lt;<\/code>) eingehüllt.<\/span> <span class=\"sg\" data-s=\"2\">Mit zwei Listen arbeitet er elementweise, wie Zip; mit einem einzelnen Wert auf einer Seite wird dieser Wert über die gesamte Liste gestreckt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die beiden Pfeile müssen nicht in die gleiche Richtung zeigen, und ihre Richtung bestimmt, was passiert, wenn die Listen unterschiedlich lang sind — eine Spitze, die <strong>auf<\/strong> eine Liste zeigt, lässt diese Liste wiederholt werden, um zur anderen zu passen.<\/span> <span class=\"sg\" data-s=\"1\">In der ASCII-Schreibweise <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> sind die vier Kombinationen:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — keine Seite wird gestreckt; die Listen müssen bereits gleich lang sein, sonst ist es ein Fehler;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — die <strong>rechte<\/strong> Liste wird wiederholt, um zur linken zu passen;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — die <strong>linke<\/strong> Liste wird wiederholt, um zur rechten zu passen;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — die <strong>kürzere<\/strong> Liste wird wiederholt, um zur längeren zu passen.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch eine unäre Form, die eine Methode auf jedes Element aufruft.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> wandelt jede Zeichenkette in Großbuchstaben um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hyper-Operationen signalisieren auch, dass die Arbeit <em>möglicherweise parallel<\/em> ausgeführt werden kann — Sie werden die verwandte <code>.hyper<\/code>-Methode später im <a href=\"https://course.raku.org/de/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">Abschnitt über nebenläufige Programmierung<\/a> kennenlernen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negiert — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>!<\/code> vor einem Vergleichsoperator negiert dessen Ergebnis.<\/span> <span class=\"sg\" data-s=\"1\">Das vertraute <code>!=<\/code> (ungleich) ist genau dieser Meta-Operator, angewendet auf <code>==<\/code>, und dasselbe funktioniert für andere boolesche Operatoren wie <code>eq<\/code> und <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — nicht gleich als Zeichenketten\nsay 5 !%% 2;     # True  — 5 ist nicht teilbar durch 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kurz gesagt: <code>$a !op $b<\/code> ist nur eine sauberere Schreibweise von <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist Absicht.<\/span> <span class=\"sg\" data-s=\"1\">Im Gegensatz zu einer bewusst minimalistischen Sprache wie Esperanto, die einen einzigen regelmäßigen Weg anstrebt, jede Sache auszudrücken, bietet Raku Ihnen gerne mehrere — so lebt das negierte <code>!eq<\/code> direkt neben dem dedizierten <code>ne<\/code>-Operator, und beide bedeuten genau dasselbe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — derselbe Test wie 'a' !eq 'b'<\/code><\/pre>"]]},"nl":{"t":"Cross, hyper en genegeerd","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast reductie en zip heeft Raku nog verschillende andere meta-operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Drie ervan zijn hier het vermelden waard.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De cross-meta-operator <code>X<\/code> koppelt <strong>elk<\/strong> element van de ene lijst aan <strong>elk<\/strong> element van de andere — het cartesisch product:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als zip kan hij een operator omhullen om op elk paar te werken.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> voegt elk paar samen tot een tekenreeks, en <code>X*<\/code> vermenigvuldigt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Waar zip twee lijsten gelijktijdig doorloopt, combineert cross ze op elke mogelijke manier.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>&gt;&gt;...&lt;&lt;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een hyper-meta-operator past een operator toe op <strong>elk element<\/strong> van een lijst.<\/span> <span class=\"sg\" data-s=\"1\">De operator wordt omhuld door de puntige <code>&gt;&gt;...&lt;&lt;<\/code> (of de ASCII-variant <code>&gt;&gt;...&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Met twee lijsten werkt hij element voor element, net als zip; met een enkele waarde aan een kant wordt die waarde over de hele lijst uitgestrekt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De twee pijlen hoeven niet dezelfde kant op te wijzen, en hun richting bepaalt wat er gebeurt wanneer de lijsten in lengte verschillen — een punt die <strong>naar<\/strong> een lijst wijst, laat die lijst herhaald worden om bij de andere te passen.<\/span> <span class=\"sg\" data-s=\"1\">In de ASCII-notatie <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> zijn de vier combinaties:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — geen van beide kanten wordt uitgestrekt; de lijsten moeten al dezelfde lengte hebben, anders is het een fout;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — de <strong>rechter<\/strong> lijst wordt herhaald om bij de linker te passen;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — de <strong>linker<\/strong> lijst wordt herhaald om bij de rechter te passen;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — de <strong>kortere<\/strong> lijst wordt herhaald om bij de langere te passen.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 herhaalt tot 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er is ook een unaire vorm, die een methode op elk element aanroept.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> maakt elke tekenreeks in hoofdletters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hyper-operaties geven ook aan dat het werk <em>parallel uitgevoerd mag worden<\/em> — je zult de verwante <code>.hyper<\/code>-methode later tegenkomen, in <a href=\"https://course.raku.org/nl/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">het gedeelte over gelijktijdig programmeren<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Genegeerd — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het plaatsen van <code>!<\/code> voor een vergelijkingsoperator negeert het resultaat.<\/span> <span class=\"sg\" data-s=\"1\">Het bekende <code>!=<\/code> (niet gelijk) is precies deze meta-operator toegepast op <code>==<\/code>, en hetzelfde werkt voor andere Booleaanse operatoren zoals <code>eq<\/code> en <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — niet gelijk als tekenreeksen\nsay 5 !%% 2;     # True  — 5 is niet deelbaar door 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kort gezegd is <code>$a !op $b<\/code> gewoon een nettere manier om <code>!($a op $b)<\/code> te schrijven.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is opzettelijk zo.<\/span> <span class=\"sg\" data-s=\"1\">In tegenstelling tot een bewust minimalistische taal zoals Esperanto, die streeft naar een regelmatige manier om elk ding uit te drukken, geeft Raku je graag meerdere mogelijkheden — dus het genegeerde <code>!eq<\/code> bestaat naast de speciale <code>ne<\/code>-operator, en beide betekenen precies hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — dezelfde test als 'a' !eq 'b'<\/code><\/pre>"]]},"es":{"t":"Cross, hyper y negados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de la reducción y el zip, Raku tiene varios meta-operadores más.<\/span> <span class=\"sg\" data-s=\"1\">Tres de ellos merecen ser mencionados aquí.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El meta-operador cross <code>X<\/code> empareja <strong>cada<\/strong> elemento de una lista con <strong>cada<\/strong> elemento de otra, es decir, el producto cartesiano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al igual que zip, puede envolver un operador para actuar sobre cada par.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> une cada par en una cadena, y <code>X*<\/code> multiplica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mientras que zip recorre dos listas en paralelo, cross las combina de todas las formas posibles.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>&gt;&gt;...&lt;&lt;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un meta-operador hyper aplica un operador a <strong>cada elemento<\/strong> de una lista.<\/span> <span class=\"sg\" data-s=\"1\">El operador se envuelve con las flechas <code>&gt;&gt;...&lt;&lt;<\/code> (o en Unicode <code>&gt;&gt;...&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Con dos listas funciona elemento por elemento, como zip; con un único valor en un lado, ese valor se extiende a toda la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las dos flechas no tienen que apuntar en la misma dirección, y su orientación decide que ocurre cuando las listas difieren en longitud: una punta que apunta <strong>hacia<\/strong> una lista permite que esa lista se repita para igualar a la otra.<\/span> <span class=\"sg\" data-s=\"1\">En la notación ASCII <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code>, las cuatro combinaciones son:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — ninguno de los lados se extiende; las listas deben tener ya la misma longitud, o se produce un error;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — la lista <strong>derecha<\/strong> se repite para igualar a la izquierda;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — la lista <strong>izquierda<\/strong> se repite para igualar a la derecha;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — la lista <strong>más corta<\/strong> se repite para igualar a la más larga.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También existe una forma unaria, que llama a un método en cada elemento.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> convierte cada cadena a mayúsculas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las operaciones hyper también indican que el trabajo <em>puede<\/em> realizarse en paralelo; más adelante conocerás el método relacionado <code>.hyper<\/code>, en <a href=\"https://course.raku.org/es/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">la sección sobre programación concurrente<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negado — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Colocar <code>!<\/code> delante de un operador de comparación niega su resultado.<\/span> <span class=\"sg\" data-s=\"1\">El conocido <code>!=<\/code> (no igual) es exactamente este meta-operador aplicado a <code>==<\/code>, y lo mismo funciona para otros operadores booleanos como <code>eq<\/code> y <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En resumen, <code>$a !op $b<\/code> es simplemente una forma más ordenada de escribir <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es a propósito.<\/span> <span class=\"sg\" data-s=\"1\">A diferencia de un lenguaje deliberadamente minimalista como el Esperanto, que busca una forma regular de expresar cada cosa, Raku esta encantado de ofrecerte varias, por lo que el negado <code>!eq<\/code> convive junto al operador dedicado <code>ne<\/code>, y ambos significan exactamente lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"it":{"t":"Cross, hyper e negati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre alla riduzione e allo zip, Raku dispone di diversi altri meta-operatori.<\/span> <span class=\"sg\" data-s=\"1\">Tre di essi meritano di essere conosciuti qui.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il meta-operatore cross <code>X<\/code> accoppia <strong>ogni<\/strong> elemento di una lista con <strong>ogni<\/strong> elemento di un'altra — il prodotto cartesiano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come lo zip, può avvolgere un operatore per agire su ogni coppia.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> unisce ogni coppia in una stringa, e <code>X*<\/code> moltiplica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dove lo zip percorre due liste in parallelo, il cross le combina in ogni modo possibile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un meta-operatore hyper applica un operatore a <strong>ciascun elemento<\/strong> di una lista.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore è racchiuso tra i simboli <code>»…«<\/code> (o nella versione ASCII <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Con due liste funziona elemento per elemento, come lo zip; con un singolo valore da un lato, quel valore viene esteso a tutta la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le due frecce non devono necessariamente puntare nella stessa direzione, e la loro direzione determina cosa succede quando le liste hanno lunghezze diverse — una punta rivolta <strong>verso<\/strong> una lista consente a quella lista di essere ripetuta per corrispondere all'altra.<\/span> <span class=\"sg\" data-s=\"1\">Nella scrittura ASCII <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code>, le quattro combinazioni sono:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — nessun lato si estende; le liste devono avere già la stessa lunghezza, altrimenti si verifica un errore;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — la lista <strong>destra<\/strong> viene ripetuta per corrispondere alla sinistra;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — la lista <strong>sinistra<\/strong> viene ripetuta per corrispondere alla destra;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — la lista <strong>più corta<\/strong> viene ripetuta per corrispondere alla più lunga.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 si ripete come 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esiste anche una forma unaria, che chiama un metodo su ogni elemento.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> converte in maiuscolo ogni stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le operazioni hyper segnalano anche che il lavoro <em>può<\/em> essere eseguito in parallelo — incontrerai il metodo correlato <code>.hyper<\/code> più avanti, nella <a href=\"https://course.raku.org/it/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">sezione sulla programmazione concorrente<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negato — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mettendo <code>!<\/code> davanti a un operatore di confronto si nega il suo risultato.<\/span> <span class=\"sg\" data-s=\"1\">Il familiare <code>!=<\/code> (diverso da) è esattamente questo meta-operatore applicato a <code>==<\/code>, e lo stesso funziona per altri operatori booleani come <code>eq<\/code> e <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — non uguale come stringhe\nsay 5 !%% 2;     # True  — 5 non è divisibile per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In breve, <code>$a !op $b<\/code> è solo un modo più ordinato di scrivere <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è intenzionale.<\/span> <span class=\"sg\" data-s=\"1\">A differenza di un linguaggio volutamente minimale come l'Esperanto, che mira a un unico modo regolare di esprimere ogni cosa, Raku è felice di offrirti diverse possibilità — così il negato <code>!eq<\/code> convive con l'operatore dedicato <code>ne<\/code>, e i due significano esattamente la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — lo stesso test di 'a' !eq 'b'<\/code><\/pre>"]]},"lv":{"t":"Krustojuma, hiper un noliedzošie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Papildus redukcijai un zip, Raku ir vēl vairāki metaoperatori.<\/span> <span class=\"sg\" data-s=\"1\">Trīs no tiem ir vērts zināt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Krusteniskais — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Krusteniskais metaoperators <code>X<\/code> sapāro <strong>katru<\/strong> viena saraksta elementu ar <strong>katru<\/strong> otra saraksta elementu — Dekarta reizinājums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā zip, tas var ietvert operatoru, lai darbotos ar katru pāri.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> savieno katru pāri virknē, un <code>X*<\/code> sareizina:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kamēr zip apstaigā divus sarakstus sinhroni, krusteniskais operators tos apvieno visos iespējamos veidos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hiper — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hiper metaoperators piemēro operatoru <strong>katram<\/strong> saraksta elementam.<\/span> <span class=\"sg\" data-s=\"1\">Operators tiek ietversts starp smailo <code>»…«<\/code> (vai ASCII <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Ar diviem sarakstiem tas strādā pa elementiem, līdzīgi kā zip; ar vienu vērtību vienā pusē tā tiek izstiepta pār visu sarakstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Abām bultiņām nav jārāda vienā virzienā, un to virziens nosaka, kas notiek, ja saraksti atšķiras garumā — bultiņa, kas rāda <strong>uz<\/strong> sarakstu, ļauj šo sarakstu atkārtot, lai saskaņotu ar otru.<\/span> <span class=\"sg\" data-s=\"1\">ASCII pierakstā <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> četras kombinācijas ir:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — neviena puse netiek izstiepta; sarakstiem jau jābūt vienāda garuma, pretējā gadījumā rodas kļūda;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>labais<\/strong> saraksts tiek atkārtots, lai sasniegtu kreiso;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>kreisais<\/strong> saraksts tiek atkārtots, lai sasniegtu labo;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>īsākais<\/strong> saraksts tiek atkārtots, lai sasniegtu garāko.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir arī unārā forma, kas izsauc metodi katram elementam.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> pārveido katru virkni lielajos burtos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hiper operācijas arī signalizē, ka darbu <em>var<\/em> veikt paralēli — ar saistīto <code>.hyper<\/code> metodi jūs iepazīsieties vēlāk <a href=\"https://course.raku.org/lv/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">konkurentās programmēšanas sadaļā<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negācijas — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pievienojot <code>!<\/code> salīdzināšanas operatora priekšā, tiek negēts tā rezultāts.<\/span> <span class=\"sg\" data-s=\"1\">Pazīstamais <code>!=<\/code> (nav vienāds) ir tieši šis metaoperators, piemērots <code>==<\/code>, un tas pats darbojas citiem Būla operatoriem, piemēram, <code>eq<\/code> un <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Īsāk sakot, <code>$a !op $b<\/code> ir vienkārši glītāks veids, kā rakstīt <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir apzināti.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirībā no tādas minimālisma valodas kā esperanto, kas cenšas piedāvāt vienu regulāru veidu katras lietas izteikšanai, Raku labprāt piedāvā vairākus — tāpēc negācijas <code>!eq<\/code> pastāv līdzās specializētajam <code>ne<\/code> operatoram, un abi nozīmē tieši to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"ru":{"t":"Перекрёстные, гипер- и отрицающие","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кроме свёртки и zip в Raku есть ещё несколько метаоператоров.<\/span> <span class=\"sg\" data-s=\"1\">Три из них стоит знать уже сейчас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перекрёстный — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перекрёстный метаоператор <code>X<\/code> сочетает <strong>каждый<\/strong> элемент одного списка с <strong>каждым<\/strong> элементом другого — это декартово произведение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и zip, он может обернуть оператор, чтобы подействовать на каждую пару.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> соединяет каждую пару в строку, а <code>X*<\/code> перемножает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если zip проходит по двум спискам в ногу, то перекрёстный оператор сочетает их всеми возможными способами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гипероператор — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Гипероператор применяет оператор к <strong>каждому элементу<\/strong> списка.<\/span> <span class=\"sg\" data-s=\"1\">Оператор заключается в угловые стрелки <code>»…«<\/code> (или в ASCII-запись <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">С двумя списками он работает поэлементно, как zip; а если с одной стороны стоит одно значение, оно растягивается на весь список:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стрелки не обязаны смотреть в одну сторону, и их направление решает, что произойдёт, если длины списков не совпадают: остриё, направленное <strong>на<\/strong> список, разрешает повторять этот список, подгоняя его под другой.<\/span> <span class=\"sg\" data-s=\"1\">В ASCII-записи <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> возможны четыре сочетания:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — ни одна сторона не растягивается; списки должны быть одной длины, иначе будет ошибка;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>правый<\/strong> список повторяется, подгоняясь под левый;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>левый<\/strong> список повторяется, подгоняясь под правый;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>более короткий<\/strong> список повторяется, подгоняясь под более длинный.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 повторяется как 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть и унарная форма, которая вызывает метод у каждого элемента.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> переводит каждую строку в верхний регистр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Гипероперации к тому же означают, что работа <em>может<\/em> выполняться параллельно — со связанным методом <code>.hyper<\/code> вы встретитесь позже, в <a href=\"https://course.raku.org/ru/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">разделе о конкурентном программировании<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрицающий — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если поставить <code>!<\/code> перед оператором сравнения, его результат меняется на противоположный.<\/span> <span class=\"sg\" data-s=\"1\">Привычный <code>!=<\/code> (не равно) — это ровно тот же метаоператор, применённый к <code>==<\/code>, и точно так же он работает с другими логическими операторами, например <code>eq<\/code> и <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не равны как строки\nsay 5 !%% 2;     # True  — 5 не делится на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коротко говоря, <code>$a !op $b<\/code> — это просто более аккуратная запись для <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И так задумано.<\/span> <span class=\"sg\" data-s=\"1\">В отличие от нарочито минималистичного языка вроде эсперанто, который стремится дать один правильный способ выразить каждую мысль, Raku охотно предлагает несколько — поэтому отрицающий <code>!eq<\/code> соседствует с отдельным оператором <code>ne<\/code>, и означают они ровно одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — та же проверка, что и 'a' !eq 'b'<\/code><\/pre>"]]},"uk":{"t":"Перехресний, гіпер- та заперечний метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім згортки та zip, у Raku є ще кілька метаоператорів.<\/span> <span class=\"sg\" data-s=\"1\">Три з них варто знати вже тут.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перехресний — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перехресний метаоператор <code>X<\/code> парує <strong>кожен<\/strong> елемент одного списку з <strong>кожним<\/strong> елементом іншого — це декартів добуток:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і zip, він може огортати оператор, щоб діяти на кожну пару.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> з'єднує кожну пару в рядок, а <code>X*<\/code> перемножує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо zip іде двома списками в ногу, то перехресний оператор поєднує їх усіма можливими способами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гіпер — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Гіпероператор застосовує оператор до <strong>кожного елемента<\/strong> списку.<\/span> <span class=\"sg\" data-s=\"1\">Оператор загортається у кутові <code>»…«<\/code> (або ASCII-варіант <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">З двома списками він працює поелементно, як zip; з одним значенням з одного боку він розтягує це значення на весь список:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дві стрілки не мусять дивитися в один бік, і їхній напрямок вирішує, що станеться, коли списки різної довжини: вістря, спрямоване <strong>на<\/strong> список, дозволяє повторювати цей список, щоб зрівнятися з іншим.<\/span> <span class=\"sg\" data-s=\"1\">У ASCII-записі <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> можливі чотири поєднання:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — жодна зі сторін не розтягується; списки мають бути однакової довжини, інакше це помилка;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>правий<\/strong> список повторюється, щоб зрівнятися з лівим;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>лівий<\/strong> список повторюється, щоб зрівнятися з правим;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>коротший<\/strong> список повторюється, щоб зрівнятися з довшим.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 повторюється як 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Є й унарна форма, яка викликає метод для кожного елемента.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> переводить кожен рядок у верхній регістр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Гіпероперації також сигналізують, що роботу <em>можна<\/em> виконати паралельно — зі спорідненим методом <code>.hyper<\/code> ви познайомитеся пізніше, у <a href=\"https://course.raku.org/uk/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">розділі про конкурентне програмування<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заперечний — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постановка <code>!<\/code> перед оператором порівняння заперечує його результат.<\/span> <span class=\"sg\" data-s=\"1\">Знайомий <code>!=<\/code> (не дорівнює) — це саме цей метаоператор, застосований до <code>==<\/code>, і так само працює для інших булевих операторів, як-от <code>eq<\/code> та <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не рівні як рядки\nsay 5 !%% 2;     # True  — 5 не ділиться на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коротко кажучи, <code>$a !op $b<\/code> — це просто охайніший спосіб записати <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так задумано.<\/span> <span class=\"sg\" data-s=\"1\">На відміну від навмисно мінімалістичної мови на кшталт есперанто, яка прагне одного правильного способу висловити кожну річ, Raku радо дає вам кілька, — тож заперечний <code>!eq<\/code> живе поруч зі спеціальним оператором <code>ne<\/code>, і обидва означають точно те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — та сама перевірка, що й 'a' !eq 'b'<\/code><\/pre>"]]},"bg":{"t":"Кръстосани, хипер и отрицателни","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен редукция и zip, Raku има и няколко други метаоператора.<\/span> <span class=\"sg\" data-s=\"1\">Три от тях заслужават внимание тук.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът cross <code>X<\/code> сдвоява <strong>всеки<\/strong> елемент от единия списък с <strong>всеки<\/strong> елемент от другия — декартово произведение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както zip, той може да обвие оператор, за да действа върху всяка двойка.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> съединява всяка двойка в низ, а <code>X*<\/code> умножава:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Докато zip обхожда два списъка в крак, cross ги комбинира по всеки възможен начин.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Хипер — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Хипер метаоператорът прилага оператор към <strong>всеки елемент<\/strong> от списък.<\/span> <span class=\"sg\" data-s=\"1\">Операторът е обвит в остри <code>»…«<\/code> (или ASCII <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">С два списъка работи елемент по елемент, както zip; с единична стойност от едната страна, тя се разтяга върху целия списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Двете стрелки не е задължително да сочат в една и съща посока, а тяхната посока определя какво се случва, когато списъците се различават по дължина — стрелка, сочеща <strong>към<\/strong> списък, позволява този списък да бъде повторен, за да съвпадне с другия.<\/span> <span class=\"sg\" data-s=\"1\">В ASCII изписването <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> четирите комбинации са:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — нито една страна не се разтяга; списъците трябва вече да са с еднаква дължина, иначе е грешка;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>десният<\/strong> списък се повтаря, за да съвпадне с левия;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>левият<\/strong> списък се повтаря, за да съвпадне с десния;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>по-късият<\/strong> списък се повтаря, за да съвпадне с по-дългия.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има и унарна форма, която извиква метод върху всеки елемент.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> превръща всеки низ в главни букви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хипер операциите също сигнализират, че работата <em>може<\/em> да бъде изпълнена паралелно — ще се запознаете със свързания метод <code>.hyper<\/code> по-късно, в <a href=\"https://course.raku.org/bg/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">раздела за конкурентно програмиране<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрицание — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поставянето на <code>!<\/code> пред оператор за сравнение отрича резултата му.<\/span> <span class=\"sg\" data-s=\"1\">Познатият <code>!=<\/code> (не е равно) е точно този метаоператор, приложен към <code>==<\/code>, и същото работи за други булеви оператори като <code>eq<\/code> и <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не са равни като низове\nsay 5 !%% 2;     # True  — 5 не се дели на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Накратко, <code>$a !op $b<\/code> е просто по-подреден начин да се запише <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е нарочно.<\/span> <span class=\"sg\" data-s=\"1\">За разлика от умишлено минималистичен език като есперанто, който цели един единствен правилен начин за изразяване на всяко нещо, Raku с удоволствие ви предлага няколко — така отрицателният <code>!eq<\/code> съжителства с отделния оператор <code>ne<\/code>, и двата означават абсолютно едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — същата проверка като 'a' !eq 'b'<\/code><\/pre>"]]},"eo":{"t":"Kruca, hiper kaj neita","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom redukto kaj zipado, Raku havas plurajn aliajn meta-operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Tri el ili meritas mencion ĉi tie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kruca — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kruca meta-operatoro <code>X<\/code> parigas <strong>ĉiun<\/strong> elementon de unu listo kun <strong>ĉiu<\/strong> elemento de alia — la kartezia produto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel zipado, ĝi povas ĉirkaŭi operatoron por agi sur ĉiun paron.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> kunigas ĉiun paron en ĉenon, kaj <code>X*<\/code> multobligas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dum zipado marŝas laŭ du listoj paŝe, krucado kombinas ilin en ĉiu ebla maniero.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hipera — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hipera meta-operatoro aplikas operatoron al <strong>ĉiu elemento<\/strong> de listo.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro estas ĉirkaŭita per la pintaj <code>»…«<\/code> (aŭ la askia <code>&gt;&gt;…&lt;&lt;<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Kun du listoj ĝi funkcias elemento post elemento, kiel zipado; kun ununura valoro ĉe unu flanko, ĝi etendas tiun valoron tra la tuta listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La du sagoj ne devas montri al la sama direkto, kaj ilia direkto decidas kio okazas kiam la listoj malsamas en longeco — pinto montranta <strong>al<\/strong> listo permesas, ke tiu listo estu ripetata por egali la alian.<\/span> <span class=\"sg\" data-s=\"1\">En la askia <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code> skribo, la kvar kombinoj estas:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — nek unu flanko etendiĝas; la listoj devas jam havi saman longon, alie estas eraro;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — la <strong>dekstra<\/strong> listo estas ripetata por egali la maldekstran;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — la <strong>maldekstra<\/strong> listo estas ripetata por egali la dekstran;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — la <strong>pli mallonga<\/strong> listo estas ripetata por egali la pli longan.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ unuargumenta formo, kiu vokas metodon sur ĉiu elemento.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> majuskligas ĉiun ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hiperaj operacioj ankaŭ signalas, ke la laboro <em>povas<\/em> esti farata paralele — vi renkontos la rilatan metodon <code>.hyper<\/code> poste, en <a href=\"/paradigms/hyper-race/\">la sekcio pri samtempa programado<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neiga — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metante <code>!<\/code> antaŭ komparan operatoron vi neas ĝian rezulton.<\/span> <span class=\"sg\" data-s=\"1\">La konata <code>!=<\/code> (ne-egala) estas ĝuste ĉi tiu meta-operatoro aplikata al <code>==<\/code>, kaj la samo funkcias por aliaj buleaj operatoroj kiel <code>eq<\/code> kaj <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — ne-egalaj kiel ĉenoj\nsay 5 !%% 2;     # True  — 5 ne estas dividebla per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Resume, <code>$a !op $b<\/code> estas nur pli pura maniero skribi <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio estas intenca.<\/span> <span class=\"sg\" data-s=\"1\">Male al intence minimuma lingvo kiel Esperanto, kiu celas unu regulan manieron esprimi ĉiun aĵon, Raku volonte donas al vi plurajn — do la neiga <code>!eq<\/code> vivas tuj apud la dediĉita operatoro <code>ne<\/code>, kaj ambaŭ signifas ĝuste la samon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — la sama testo kiel 'a' !eq 'b'<\/code><\/pre>"]]},"la":{"t":"Crux, hyper, et negati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter reductionem et zip, Raku plures alios meta-operatores habet.<\/span> <span class=\"sg\" data-s=\"1\">Tres eorum hic cognoscendi sunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Meta-operator cross <code>X<\/code> <strong>omne<\/strong> elementum unius listae cum <strong>omni<\/strong> elemento alterius coniungit — productum Cartesianum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sicut zip, operatorem involvere potest ut in unoquoque pare agat.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> unumquodque par in filum coniungit, et <code>X*<\/code> multiplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ubi zip duas listas simul percurrit, cross eas omni modo possibili combinat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Meta-operator hyper operatorem ad <strong>unumquodque elementum<\/strong> listae applicat.<\/span> <span class=\"sg\" data-s=\"1\">Operator in acutis <code>»…«<\/code> (vel ASCII <code>&gt;&gt;…&lt;&lt;<\/code>) involvitur.<\/span> <span class=\"sg\" data-s=\"2\">Cum duabus listis elementum per elementum operatur, sicut zip; cum uno valore ab una parte, illum valorem per totam listam extendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Duae sagittae non necesse est eandem partem spectent, et eorum directio decernit quid fiat cum listae longitudine differunt — apex <strong>ad<\/strong> listam spectans eam listam repeti permittit ut alteri respondeat.<\/span> <span class=\"sg\" data-s=\"1\">In scriptura ASCII <code>&lt;&lt;<\/code>/<code>&gt;&gt;<\/code>, quattuor combinationes sunt:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — neutra pars extenditur; listae iam eiusdem longitudinis esse debent, aut error est;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — lista <strong>dextra<\/strong> repetitur ut sinistrae respondeat;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — lista <strong>sinistra<\/strong> repetitur ut dextrae respondeat;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — lista <strong>brevior<\/strong> repetitur ut longiori respondeat.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repetitur ad 10, 20, 10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Forma unaria quoque est, quae methodum in omni elemento vocat.<\/span> <span class=\"sg\" data-s=\"1\"><code>&gt;&gt;.uc<\/code> unumquodque filum in maiusculas convertit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operationes hyper etiam significant opus <em>fortasse<\/em> paralleliter fieri posse — methodum coniunctam <code>.hyper<\/code> postea invenies, in <a href=\"/paradigms/hyper-race/\">sectione de programmatione concurrenti<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negatus — <code>!<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ponens <code>!<\/code> ante operatorem comparationis eventum eius negat.<\/span> <span class=\"sg\" data-s=\"1\">Familiaris <code>!=<\/code> (non aequalis) est exacte hic meta-operator ad <code>==<\/code> applicatus, et idem operatur pro aliis operatoribus Booleanis ut <code>eq<\/code> et <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — non aequales ut fila\nsay 5 !%% 2;     # True  — 5 non est divisibilis per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Breviter, <code>$a !op $b<\/code> est tantum elegantior modus scribendi <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc de industria est.<\/span> <span class=\"sg\" data-s=\"1\">Dissimilis linguae deliberate minimae ut Esperanto, quae unum regularem modum exprimendi unamquamque rem quaerit, Raku libenter tibi plures dat — ergo negatus <code>!eq<\/code> iuxta dedicatum operatorem <code>ne<\/code> vivit, et ambo exacte idem significant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — idem experimentum ac 'a' !eq 'b'<\/code><\/pre>"]]}}}</script>
