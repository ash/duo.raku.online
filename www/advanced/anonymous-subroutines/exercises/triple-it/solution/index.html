ale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het pointy block gebruikt <code>$factor<\/code>, een variabele uit het omliggende bereik, hoewel het slechts een parameter <code>$x<\/code> heeft. Het vastleggen van zulke variabelen is wat het tot een closure maakt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Met <code>$factor<\/code> gelijk aan <code>3<\/code> geeft het aanroepen van <code>$scale(7)<\/code> het resultaat <code>21<\/code>. Verander <code>$factor<\/code> en hetzelfde blok zou met de nieuwe waarde schalen:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat de closure de <em>variabele<\/em> vastlegt in plaats van de waarde op het moment dat hij geschreven werd, ziet de latere aanroep de bijgewerkte <code>$factor<\/code> en geeft <code>35<\/code> terug.<\/span><\/p>"]]},"es":{"t":"Solution: Triplicar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque puntiagudo usa <code>$factor<\/code>, una variable del ámbito circundante, aunque solo tiene un parámetro <code>$x<\/code>. Capturar tales variables es lo que lo convierte en una clausura.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Con <code>$factor<\/code> igual a <code>3<\/code>, llamar a <code>$scale(7)<\/code> da <code>21<\/code>. Cambia <code>$factor<\/code> y el mismo bloque escalaría por el nuevo valor:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dado que la clausura captura la <em>variable<\/em> en lugar de su valor en el momento en que fue escrita, la llamada posterior ve el <code>$factor<\/code> actualizado y devuelve <code>35<\/code>.<\/span><\/p>"]]},"it":{"t":"Solution: Triplicare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco a freccia usa <code>$factor<\/code>, una variabile dallo scope circostante, anche se ha solo un parametro <code>$x<\/code>. Catturare tali variabili e cio che lo rende una closure.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Con <code>$factor<\/code> uguale a <code>3<\/code>, chiamare <code>$scale(7)<\/code> da <code>21<\/code>. Cambiando <code>$factor<\/code>, lo stesso blocco scalerebbe con il nuovo valore:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiche la closure cattura la <em>variabile<\/em> piuttosto che il suo valore al momento in cui e stata scritta, la chiamata successiva vede il <code>$factor<\/code> aggiornato e restituisce <code>35<\/code>.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Trīskāršot","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Bultiņas bloks izmanto <code>$factor<\/code> — mainīgo no apkārtējā redzamības apgabala —, lai gan tam trūkst tikai parametra <code>$x<\/code>. Tieši šādu mainīgo satveršana padara to par slēgumu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ar <code>$factor<\/code>, kas vienāds ar <code>3<\/code>, izsaukums <code>$scale(7)<\/code> dod <code>21<\/code>. Nomainiet <code>$factor<\/code>, un \"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Стрелковият блок използва <code>$factor<\/code>, променлива от заобикалящия обхват, въпреки че приема само параметъра <code>$x<\/code>. Улавянето на такива променливи е това, което го прави затваряне (closure).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">При <code>$factor<\/code> равно на <code>3<\/code>, извикването на <code>$scale(7)<\/code> дава <code>21<\/code>. Променете <code>$factor<\/code> и същият блок ще мащабира с новата стойност:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като затварянето улавя самата <em>променлива<\/em>, а не стойността й в момента на написване, по-късното извикване вижда обновения <code>$factor<\/code> и връща <code>35<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solution: Triobligi ĝin","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La pinta bloko uzas <code>$factor<\/code>, variablon el la cxirkauxanta amplekso, kvankam gxi havas nur parametron <code>$x<\/code>. Kapti tiajn variablojn estas tio, kio faras gxin fermo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kun <code>$factor<\/code> egala al <code>3<\/code>, voko de <code>$scale(7)<\/code> donas <code>21<\/code>. Sxangxu <code>$factor<\/code> kaj la sama bloko skalus per la nova valoro:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cxar la fermo kaptas la <em>variablon<\/em> anstataux gxian valoron en la momento kiam gxi estis skribita, la posta voko vidas la gxisdatigitan <code>$factor<\/code> kaj liveras <code>35<\/code>.<\/span><\/p>"]]},"la":{"t":"Solution: Triplicare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cuspis acuta <code>$factor<\/code> utitur, variabili ex ambitu circumiecto, quamvis solum parametrum <code>$x<\/code> habeat. Tales variabiles capere est quod eam clausuram facit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cum <code>$factor<\/code> aequalis sit <code>3<\/code>, vocatio <code>$scale(7)<\/code> dat <code>21<\/code>. Muta <code>$factor<\/code> et eadem clausura novo valore multiplicabit:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia clausura <em>variabilem<\/em> ipsam capit, non valorem eius eo tempore quo scripta est, vocatio posterior <code>$factor<\/code> renovatum videt et <code>35<\/code> reddit.<\/span><\/p>"]]}}}</script>
