<script type="application/json" id="page-data">{"u":"advanced/anonymous-subroutines","n":681,"k":"section","pv":"advanced/nested-subroutines/quiz","nx":"advanced/anonymous-subroutines/exercises","tr":["advanced"],"L":{"en":{"t":"Anonymous subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A subroutine does not have to have a name.<\/span> <span class=\"sg\" data-s=\"1\">An <em>anonymous<\/em> subroutine is written just like a normal one, but without a name, and is usually stored in a variable so that you can call it later.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$double<\/code> holds the subroutine, and <code>$double(5)<\/code> calls it with the argument <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy blocks<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku offers a shorter notation for the same thing — the <em>pointy block<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">It uses the arrow <code>-&gt;<\/code> to introduce the parameters, and needs neither the word <code>sub<\/code> nor parentheses around them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is the most common way to write a small anonymous subroutine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>&amp;<\/code> sigil<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you would rather call the subroutine by a name than through a <code>$<\/code> variable, declare the variable with the <code>&amp;<\/code> sigil.<\/span> <span class=\"sg\" data-s=\"1\">Then you can call it without the sigil, exactly like an ordinary subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Passing one to another function<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You do not have to store an anonymous subroutine in a variable at all.<\/span> <span class=\"sg\" data-s=\"1\">Because it is just a value, you can hand it straight to a function that expects one — such as <code>map<\/code>, <code>grep<\/code>, or <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The pointy block is the anonymous subroutine here, and <code>map<\/code> calls it once for each element.<\/span> <span class=\"sg\" data-s=\"1\">This is, in fact, what you have been doing all along: every <code>{ ... }<\/code> block and <code>-&gt; $x { ... }<\/code> you have passed to <code>map<\/code> and <code>grep<\/code> is a small anonymous subroutine, written right where it is needed instead of being named first.<\/span><\/p>"]]},"de":{"t":"Anonyme Unterprogramme","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine muss keinen Namen haben.<\/span> <span class=\"sg\" data-s=\"1\">Eine <em>anonyme<\/em> Subroutine wird genauso geschrieben wie eine normale, aber ohne Namen, und wird üblicherweise in einer Variablen gespeichert, damit man sie später aufrufen kann.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$double<\/code> enthält die Subroutine, und <code>$double(5)<\/code> ruft sie mit dem Argument <code>5<\/code> auf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy Blocks<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku bietet eine kürzere Schreibweise für dasselbe — den <em>Pointy Block<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Er verwendet den Pfeil <code>-&gt;<\/code> zur Einführung der Parameter und braucht weder das Wort <code>sub<\/code> noch Klammern um sie herum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies ist die gebräuchlichste Art, eine kleine anonyme Subroutine zu schreiben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das <code>&amp;<\/code>-Sigil<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie die Subroutine lieber über einen Namen als über eine <code>$<\/code>-Variable aufrufen möchten, deklarieren Sie die Variable mit dem <code>&amp;<\/code>-Sigil.<\/span> <span class=\"sg\" data-s=\"1\">Dann können Sie sie ohne Sigil aufrufen, genau wie eine gewöhnliche Subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Übergabe an eine andere Funktion<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie müssen eine anonyme Subroutine gar nicht in einer Variablen speichern.<\/span> <span class=\"sg\" data-s=\"1\">Da sie nur ein Wert ist, können Sie sie direkt an eine Funktion übergeben, die eine erwartet — wie <code>map<\/code>, <code>grep<\/code> oder <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Pointy Block ist hier die anonyme Subroutine, und <code>map<\/code> ruft sie einmal für jedes Element auf.<\/span> <span class=\"sg\" data-s=\"1\">Genau das haben Sie die ganze Zeit getan: Jeder <code>{ ... }<\/code>-Block und jedes <code>-&gt; $x { ... }<\/code>, das Sie an <code>map<\/code> und <code>grep<\/code> übergeben haben, ist eine kleine anonyme Subroutine, die direkt dort geschrieben wird, wo sie gebraucht wird, anstatt zuerst benannt zu werden.<\/span><\/p>"]]},"nl":{"t":"Anonieme subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een subroutine hoeft geen naam te hebben.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>anonieme<\/em> subroutine wordt geschreven net als een gewone, maar zonder naam, en wordt meestal opgeslagen in een variabele zodat je hem later kunt aanroepen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$double<\/code> bevat de subroutine, en <code>$double(5)<\/code> roept hem aan met het argument <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy blocks<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku biedt een kortere notatie voor hetzelfde — het <em>pointy block<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Het gebruikt de pijl <code>-&gt;<\/code> om de parameters te introduceren, en heeft noch het woord <code>sub<\/code> noch haakjes eromheen nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is de meest gebruikelijke manier om een kleine anonieme subroutine te schrijven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De <code>&amp;<\/code>-sigil<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je de subroutine liever bij naam aanroept dan via een <code>$<\/code>-variabele, declareer de variabele dan met de <code>&amp;<\/code>-sigil.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je hem zonder sigil aanroepen, precies zoals een gewone subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Doorgeven aan een andere functie<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hoeft een anonieme subroutine helemaal niet in een variabele op te slaan.<\/span> <span class=\"sg\" data-s=\"1\">Omdat het gewoon een waarde is, kun je het direct doorgeven aan een functie die er een verwacht — zoals <code>map<\/code>, <code>grep<\/code> of <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het pointy block is hier de anonieme subroutine, en <code>map<\/code> roept het een keer aan voor elk element.<\/span> <span class=\"sg\" data-s=\"1\">Dit is in feite wat je al die tijd al deed: elk <code>{ ... }<\/code>-blok en <code>-&gt; $x { ... }<\/code> dat je aan <code>map<\/code> en <code>grep<\/code> hebt doorgegeven, is een kleine anonieme subroutine, ter plekke geschreven in plaats van eerst een naam te geven.<\/span><\/p>"]]},"es":{"t":"Subrutinas anónimas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina no tiene que tener un nombre.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina <em>anonima<\/em> se escribe igual que una normal, pero sin nombre, y normalmente se almacena en una variable para poder llamarla después.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$double<\/code> contiene la subrutina, y <code>$double(5)<\/code> la llama con el argumento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bloques puntiagudos<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ofrece una notación más corta para lo mismo: el <em>bloque puntiagudo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Usa la flecha <code>-&gt;<\/code> para introducir los parámetros, y no necesita ni la palabra <code>sub<\/code> ni paréntesis alrededor de ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta es la forma más común de escribir una pequeña subrutina anonima.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El sigilo <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si prefieres llamar a la subrutina por un nombre en lugar de a través de una variable <code>$<\/code>, declara la variable con el sigilo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes llamarla sin el sigilo, exactamente como una subrutina ordinaria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pasandola a otra función<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No es necesario almacenar una subrutina anonima en una variable.<\/span> <span class=\"sg\" data-s=\"1\">Como es simplemente un valor, puedes pasarla directamente a una función que espere una, como <code>map<\/code>, <code>grep<\/code> o <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque puntiagudo es la subrutina anonima aquí, y <code>map<\/code> la llama una vez por cada elemento.<\/span> <span class=\"sg\" data-s=\"1\">Esto es, de hecho, lo que has estado haciendo todo el tiempo: cada bloque <code>{ ... }<\/code> y <code>-&gt; $x { ... }<\/code> que has pasado a <code>map<\/code> y <code>grep<\/code> es una pequeña subrutina anonima, escrita justo donde se necesita en lugar de ser nombrada primero.<\/span><\/p>"]]},"it":{"t":"Subroutine anonime","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine non deve necessariamente avere un nome.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine <em>anonima<\/em> viene scritta come una normale, ma senza nome, e di solito viene memorizzata in una variabile in modo da poterla chiamare successivamente.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$double<\/code> contiene la subroutine, e <code>$double(5)<\/code> la chiama con l'argomento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Blocchi a freccia<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku offre una notazione piu breve per la stessa cosa: il <em>blocco a freccia<\/em> (pointy block).<\/span> <span class=\"sg\" data-s=\"1\">Usa la freccia <code>-&gt;<\/code> per introdurre i parametri e non necessita ne della parola <code>sub<\/code> ne delle parentesi attorno ad essi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo e il modo piu comune per scrivere una piccola subroutine anonima.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il sigillo <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se preferisci chiamare la subroutine con un nome piuttosto che attraverso una variabile <code>$<\/code>, dichiara la variabile con il sigillo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In questo modo puoi chiamarla senza il sigillo, esattamente come una subroutine ordinaria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Passarla a un'altra funzione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non e necessario memorizzare una subroutine anonima in una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Poiche e semplicemente un valore, puoi passarla direttamente a una funzione che ne accetta una, come <code>map<\/code>, <code>grep<\/code> o <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco a freccia e la subroutine anonima qui, e <code>map<\/code> lo chiama una volta per ogni elemento.<\/span> <span class=\"sg\" data-s=\"1\">Questo, in effetti, e cio che hai fatto finora: ogni blocco <code>{ ... }<\/code> e <code>-&gt; $x { ... }<\/code> che hai passato a <code>map<\/code> e <code>grep<\/code> e una piccola subroutine anonima, scritta direttamente dove serve invece di essere prima nominata.<\/span><\/p>"]]},"lv":{"t":"Anonīmas apakšprogrammas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammai nav obligāti jābūt ar nosaukumu. <em>Anonīmu<\/em> apakšprogrammu raksta tāpat kā parastu, tikai bez nosaukuma, un parasti to saglabā mainīgajā, lai vēlāk varētu izsaukt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$double<\/code> satur apakšprogrammu, un <code>$double(5)<\/code> to izsauc ar argumentu <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bultiņu bloki<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku piedāvā īsāku pierakstu tam pašam — <em>bultiņas bloku<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tas parametrus ievada ar bultiņu <code>-&gt;<\/code>, un tam nav vajadzīgs ne vārds <code>sub<\/code>, ne iekavas ap parametriem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis ir visizplatītākais veids, kā uzrakstīt nelielu anonīmu apakšprogrammu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sigils <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja vēlaties apakšprogrammu izsaukt pēc nosaukuma, nevis caur <code>$<\/code> mainīgo, deklarējiet mainīgo ar sigilu <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad to var izsaukt bez sigila, tieši tāpat kā parastu apakšprogrammu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nodošana citai funkcijai<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anonīmu apakšprogrammu nemaz nav obligāti glabāt mainīgajā.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā tā vienkārši ir vērtība, to var nodot tieši funkcijai, kas tādu gaida, — piemēram, <code>map<\/code>, <code>grep<\/code> vai <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bultiņas bloks šeit ir anonīmā apakšprogramma, un <code>map<\/code> to izsauc pa vienai reizei katram elementam.<\/span> <span class=\"sg\" data-s=\"1\">Patiesībā tieši to jūs visu laiku esat darījuši: katrs bloks <code>{ ... }<\/code> un <code>-&gt; $x { ... }<\/code>, ko esat nodevuši <code>map<\/code> un <code>grep<\/code>, ir maza anonīma apakšprogramma, uzrakstīta tieši tur, kur tā vajadzīga, nevis vispirms nosaukta.<\/span><\/p>"]]},"ru":{"t":"Анонимные подпрограммы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма не обязана иметь имя. <em>Анонимная<\/em> подпрограмма записывается так же, как и обычная, но без имени, и обычно сохраняется в переменной, чтобы её можно было вызвать позже.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$double<\/code> хранит подпрограмму, а <code>$double(5)<\/code> вызывает её с аргументом <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Остроконечные блоки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku предлагает более короткую запись для того же самого — <em>остроконечный блок<\/em> (pointy block).<\/span> <span class=\"sg\" data-s=\"1\">Он использует стрелку <code>-&gt;<\/code> для объявления параметров и не требует ни слова <code>sub<\/code>, ни скобок вокруг них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это самый распространённый способ записи небольшой анонимной подпрограммы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигил <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы предпочитаете вызывать подпрограмму по имени, а не через переменную с <code>$<\/code>, объявите переменную с сигилом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда её можно вызывать без сигила, точно так же, как обычную подпрограмму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача в другую функцию<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Анонимную подпрограмму вовсе не обязательно сохранять в переменной.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку это просто значение, его можно передать напрямую в функцию, которая его ожидает, — например, в <code>map<\/code>, <code>grep<\/code> или <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Остроконечный блок здесь является анонимной подпрограммой, и <code>map<\/code> вызывает его для каждого элемента.<\/span> <span class=\"sg\" data-s=\"1\">На самом деле именно это вы делали всё это время: каждый блок <code>{ ... }<\/code> и <code>-&gt; $x { ... }<\/code>, который вы передавали в <code>map<\/code> и <code>grep<\/code>, — это небольшая анонимная подпрограмма, написанная прямо там, где она нужна, вместо того чтобы сначала давать ей имя.<\/span><\/p>"]]},"uk":{"t":"Анонімні підпрограми","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма не обов'язково повинна мати ім'я. <em>Анонімна<\/em> підпрограма записується так само, як звичайна, але без імені, і зазвичай зберігається у змінній, щоб її можна було викликати пізніше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$double<\/code> зберігає підпрограму, а <code>$double(5)<\/code> викликає її з аргументом <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стрілочні блоки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku пропонує коротший запис для того ж самого — <em>стрілочний блок<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Він використовує стрілку <code>-&gt;<\/code> для введення параметрів і не потребує ні слова <code>sub<\/code>, ні дужок навколо них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це найпоширеніший спосіб написання невеликої анонімної підпрограми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигіл <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви хочете викликати підпрограму за іменем, а не через змінну з <code>$<\/code>, оголосіть змінну з сигілом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви зможете викликати її без сигіла, точно так само, як звичайну підпрограму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача в іншу функцію<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам зовсім не обов'язково зберігати анонімну підпрограму у змінній.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки це просто значення, ви можете передати її безпосередньо у функцію, яка очікує підпрограму — наприклад, <code>map<\/code>, <code>grep<\/code> або <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стрілочний блок тут є анонімною підпрограмою, і <code>map<\/code> викликає її один раз для кожного елемента.<\/span> <span class=\"sg\" data-s=\"1\">Фактично, саме це ви робили весь час: кожен блок <code>{ ... }<\/code> та <code>-&gt; $x { ... }<\/code>, який ви передавали в <code>map<\/code> і <code>grep<\/code>, — це невелика анонімна підпрограма, написана прямо там, де вона потрібна, замість того щоб спочатку давати їй ім'я.<\/span><\/p>"]]},"bg":{"t":"Анонимни подпрограми","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата не е задължително да има име. <em>Анонимна<\/em> подпрограма се записва точно като обикновена, но без име, и обикновено се съхранява в променлива, за да можете да я извикате по-късно.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$double<\/code> съдържа подпрограмата, а <code>$double(5)<\/code> я извиква с аргумент <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стрелкови блокове<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku предлага по-кратък запис за същото нещо — <em>стрелковият блок<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Той използва стрелката <code>-&gt;<\/code> за въвеждане на параметрите и не се нуждае нито от думата <code>sub<\/code>, нито от скоби около тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е най-разпространеният начин за писане на малка анонимна подпрограма.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигилът <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако предпочитате да извиквате подпрограмата по име, вместо чрез променлива с <code>$<\/code>, декларирайте променливата със сигила <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да я извикате без сигила, точно като обикновена подпрограма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Предаване на друга функция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не е задължително да съхранявате анонимна подпрограма в променлива.<\/span> <span class=\"sg\" data-s=\"1\">Тъй като тя е просто стойност, можете да я подадете директно на функция, която очаква такава — като <code>map<\/code>, <code>grep<\/code> или <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стрелковият блок тук е анонимната подпрограма, а <code>map<\/code> я извиква веднъж за всеки елемент.<\/span> <span class=\"sg\" data-s=\"1\">Всъщност точно това правехте досега: всеки блок <code>{ ... }<\/code> и <code>-&gt; $x { ... }<\/code>, който сте подавали на <code>map<\/code> и <code>grep<\/code>, е малка анонимна подпрограма, записана точно там, където е необходима, вместо първо да бъде именувана.<\/span><\/p>"]]},"eo":{"t":"Anonimaj subrutinaj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Subrutino ne devas havi nomon. <em>Anonima<\/em> subrutino estas skribata same kiel ordinara, sed sen nomo, kaj kutime estas konservita en variablo por ke vi povu voki ĝin poste.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$double<\/code> enhavas la subrutinon, kaj <code>$double(5)<\/code> vokas ĝin kun la argumento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pintaj blokoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ofertas pli mallongan notacion por la sama afero — la <em>pinta bloko<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi uzas la sagon <code>-&gt;<\/code> por enkonduki la parametrojn, kaj bezonas nek la vorton <code>sub<\/code> nek krampojn ĉirkaŭ ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio estas la plej ofta maniero skribi malgrandan anoniman subrutinon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La sigelo <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi preferas voki la subrutinon per nomo anstataŭ per <code>$<\/code>-variablo, deklaru la variablon kun la sigelo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas voki ĝin sen la sigelo, tute same kiel ordinaran subrutinon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Transdoni al alia funkcio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi tute ne devas konservi anoniman subrutinon en variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉar ĝi estas simple valoro, vi povas transdoni ĝin rekte al funkcio kiu atendas tian — ekzemple <code>map<\/code>, <code>grep<\/code>, aŭ <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La pinta bloko estas la anonima subrutino ĉi tie, kaj <code>map<\/code> vokas ĝin unufoje por ĉiu elemento.<\/span> <span class=\"sg\" data-s=\"1\">Fakte, tio estas kion vi faris la tutan tempon: ĉiu <code>{ ... }<\/code> bloko kaj <code>-&gt; $x { ... }<\/code> kiujn vi transdonis al <code>map<\/code> kaj <code>grep<\/code> estas malgranda anonima subrutino, skribita ĝuste tie kie ĝi estas bezonata anstataŭ esti unue nomita.<\/span><\/p>"]]},"la":{"t":"Subprogrammata anonyma","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Subroutina nomen habere non debet.<\/span> <span class=\"sg\" data-s=\"1\">Subroutina <em>anonyma<\/em> eodem modo scribitur quo subroutina ordinaria, sed sine nomine, et plerumque in variabili servatur ut postea eam vocare possis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$double<\/code> subroutinam continet, et <code>$double(5)<\/code> eam cum argumento <code>5<\/code> vocat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cuspides acutae<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku breviorem notationem eiusdem rei offert -- <em>cuspidem acutam<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sagitta <code>-&gt;<\/code> utitur ad parametros introducendos, et neque verbo <code>sub<\/code> neque parenthesibus circa eos eget:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est modus usitatissimus parvam subroutinam anonymam scribendi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sigillum <code>&amp;<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si subroutinam potius nomine quam per variabilem <code>$<\/code> vocare vis, variabilem cum sigillo <code>&amp;<\/code> declara.<\/span> <span class=\"sg\" data-s=\"1\">Tum eam sine sigillo vocare potes, prorsus sicut subroutinam ordinariam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Transmissio ad aliam functionem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subroutinam anonymam in variabili servare omnino non opus est.<\/span> <span class=\"sg\" data-s=\"1\">Quia mera est valor, eam statim functioni tradere potes quae talem exspectat -- ut <code>map<\/code>, <code>grep<\/code>, vel <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuspis acuta hic est subroutina anonyma, et <code>map<\/code> eam semel pro quoque elemento vocat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc re vera est quod semper fecisti: omnis <code>{ ... }<\/code> clausura et <code>-&gt; $x { ... }<\/code> quam ad <code>map<\/code> et <code>grep<\/code> tradidisti, parva subroutina anonyma est, ibi scripta ubi opus est, non prius nominata.<\/span><\/p>"]]}}}</script>
