<script type="application/json" id="page-data">{"u":"advanced/anonymous-subroutines/quiz","n":689,"k":"quiz","pv":"advanced/anonymous-subroutines/exercises/sum-with-sigil/solution","nx":"advanced/modules-basics","tr":["advanced","advanced/anonymous-subroutines"],"L":{"en":{"t":"Quiz — Pointy blocks","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A pointy block can list several parameters: <code>-&gt; $a, $b<\/code> takes two.<\/span> <span class=\"sg\" data-s=\"1\">Here it is not stored in a variable at all — it is wrapped in parentheses and called straight away with <code>(3, 4)<\/code>, binding <code>$a<\/code> to <code>3<\/code> and <code>$b<\/code> to <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The block multiplies them to give <code>12<\/code>, and the postfix <code>.say<\/code> prints it.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Pointy Blocks","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Pointy Block kann mehrere Parameter auflisten: <code>-&gt; $a, $b<\/code> nimmt zwei entgegen.<\/span> <span class=\"sg\" data-s=\"1\">Hier wird er gar nicht in einer Variablen gespeichert — er wird in Klammern eingeschlossen und sofort mit <code>(3, 4)<\/code> aufgerufen, wobei <code>$a<\/code> an <code>3<\/code> und <code>$b<\/code> an <code>4<\/code> gebunden wird.<\/span> <span class=\"sg\" data-s=\"2\">Der Block multipliziert sie und ergibt <code>12<\/code>, und das nachgestellte <code>.say<\/code> gibt es aus.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Pointy blocks","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat drukt het volgende programma af?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een pointy block kan meerdere parameters hebben: <code>-&gt; $a, $b<\/code> accepteert er twee.<\/span> <span class=\"sg\" data-s=\"1\">Hier wordt het helemaal niet in een variabele opgeslagen — het wordt tussen haakjes gezet en direct aangeroepen met <code>(3, 4)<\/code>, waarbij <code>$a<\/code> wordt gebonden aan <code>3<\/code> en <code>$b<\/code> aan <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het blok vermenigvuldigt ze om <code>12<\/code> te geven, en de postfix <code>.say<\/code> drukt het af.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Bloques pointy","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Que imprime el siguiente programa?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un bloque puntiagudo puede enumerar varios parámetros: <code>-&gt; $a, $b<\/code> toma dos.<\/span> <span class=\"sg\" data-s=\"1\">Aquí no se almacena en una variable en absoluto: se envuelve entre paréntesis y se llama directamente con <code>(3, 4)<\/code>, asignando <code>$a<\/code> a <code>3<\/code> y <code>$b<\/code> a <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El bloque los multiplica para dar <code>12<\/code>, y el <code>.say<\/code> postfijo lo imprime.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Blocchi pointy","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il seguente programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un blocco a freccia puo elencare diversi parametri: <code>-&gt; $a, $b<\/code> ne accetta due.<\/span> <span class=\"sg\" data-s=\"1\">Qui non viene memorizzato in alcuna variabile: e racchiuso tra parentesi e chiamato immediatamente con <code>(3, 4)<\/code>, associando <code>$a<\/code> a <code>3<\/code> e <code>$b<\/code> a <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il blocco li moltiplica ottenendo <code>12<\/code>, e il <code>.say<\/code> postfisso lo stampa.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Smailīgie bloki","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko izdrukā šī programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">kļūda<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bultiņas bloks var uzskaitīt vairākus parametrus: <code>-&gt; $a, $b<\/code> ņem divus.<\/span> <span class=\"sg\" data-s=\"1\">Šeit tas vispār netiek glabāts mainīgajā — tas ir ielikts iekavās un uzreiz izsaukts ar <code>(3, 4)<\/code>, piesaistot <code>$a<\/code> vērtību <code>3<\/code> un <code>$b<\/code> vērtību <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bloks tos sareizina, dodot <code>12<\/code>, un postfiksais <code>.say<\/code> to izdrukā.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Остроконечные блоки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что напечатает следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Остроконечный блок может принимать несколько параметров: <code>-&gt; $a, $b<\/code> принимает два.<\/span> <span class=\"sg\" data-s=\"1\">Здесь он не сохраняется в переменной — он заключён в скобки и вызывается сразу с аргументами <code>(3, 4)<\/code>, привязывая <code>$a<\/code> к <code>3<\/code>, а <code>$b<\/code> к <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок перемножает их и даёт <code>12<\/code>, а постфиксный <code>.say<\/code> выводит результат.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Стрілкові блоки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що виведе наступна програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стрілочний блок може мати кілька параметрів: <code>-&gt; $a, $b<\/code> приймає два.<\/span> <span class=\"sg\" data-s=\"1\">Тут він не зберігається у змінній — він обгорнутий у дужки і одразу викликається з <code>(3, 4)<\/code>, прив'язуючи <code>$a<\/code> до <code>3<\/code>, а <code>$b<\/code> до <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок перемножує їх і дає <code>12<\/code>, а постфіксний <code>.say<\/code> виводить це значення.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Pointy блокове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стрелковият блок може да изброява няколко параметъра: <code>-&gt; $a, $b<\/code> приема два.<\/span> <span class=\"sg\" data-s=\"1\">Тук той изобщо не е записан в променлива — обвит е в скоби и е извикан директно с <code>(3, 4)<\/code>, като свързва <code>$a<\/code> с <code>3<\/code> и <code>$b<\/code> с <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блокът ги умножава и дава <code>12<\/code>, а постфиксният <code>.say<\/code> го отпечатва.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Pintaj blokoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion presas la jena programo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pinta bloko povas listigi plurajn parametrojn: <code>-&gt; $a, $b<\/code> akceptas du.<\/span> <span class=\"sg\" data-s=\"1\">Cxi tie gxi ne estas konservita en variablo -- gxi estas envolvita en krampoj kaj vokita tuj kun <code>(3, 4)<\/code>, ligante <code>$a<\/code> al <code>3<\/code> kaj <code>$b<\/code> al <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La bloko multiplikas ilin por doni <code>12<\/code>, kaj la postfiksa <code>.say<\/code> presas tion.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Bloci sagittati","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid sequens programma imprimit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>(-&gt; $a, $b { $a * $b })(3, 4).say<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">12<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">7<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">34<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">an error<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuspis acuta plures parametros enumerare potest: <code>-&gt; $a, $b<\/code> duos accipit.<\/span> <span class=\"sg\" data-s=\"1\">Hic in variabili omnino non servatur -- parenthesibus circumdatur et statim cum <code>(3, 4)<\/code> vocatur, <code>$a<\/code> ad <code>3<\/code> et <code>$b<\/code> ad <code>4<\/code> ligans.<\/span> <span class=\"sg\" data-s=\"2\">Clausura eos multiplicat ut <code>12<\/code> det, et postpositum <code>.say<\/code> id imprimit.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
