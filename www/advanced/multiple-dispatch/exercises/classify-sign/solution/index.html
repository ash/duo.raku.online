<script type="application/json" id="page-data">{"u":"advanced/multiple-dispatch/exercises/classify-sign/solution","n":661,"k":"solution","pv":"advanced/multiple-dispatch/exercises/classify-sign","nx":"advanced/multiple-dispatch/quiz","tr":["advanced","advanced/multiple-dispatch"],"L":{"en":{"t":"The solution of ’Classify the size‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">All three candidates take a single <code>Int<\/code>, so without the <code>where<\/code> clauses they would clash. The conditions on the first two make them distinct, and the third is the catch-all.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>where<\/code> clauses test <code>$n.abs<\/code>, so the magnitude alone decides the result and the sign is ignored. <code>size(7)<\/code> matches the first candidate (<code>small<\/code>), while <code>size(-250)<\/code> has an absolute value of <code>250<\/code>, which fails both conditions and falls through to the catch-all (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The candidates are tested from the most specific to the most general — exactly the order in which they are written here.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Die Größe klassifizieren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Alle drei Kandidaten nehmen ein einzelnes <code>Int<\/code> entgegen, sodass sie ohne die <code>where<\/code>-Klauseln kollidieren würden. Die Bedingungen bei den ersten beiden machen sie unterscheidbar, und der dritte ist der Auffangfall.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die <code>where<\/code>-Klauseln prüfen <code>$n.abs<\/code>, sodass allein der Betrag das Ergebnis bestimmt und das Vorzeichen ignoriert wird. <code>size(7)<\/code> passt zum ersten Kandidaten (<code>small<\/code>), während <code>size(-250)<\/code> einen Absolutwert von <code>250<\/code> hat, der beide Bedingungen nicht erfüllt und zum Auffangfall (<code>large<\/code>) durchfällt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Kandidaten werden vom spezifischsten zum allgemeinst jn.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Clasificar el tamaño","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los tres candidatos toman un único <code>Int<\/code>, así que sin las cláusulas <code>where<\/code> entrarían en conflicto. Las condiciones en los dos primeros los hacen distintos, y el tercero es el comodín.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las cláusulas <code>where<\/code> prueban <code>$n.abs<\/code>, así que solo la magnitud decide el resultado y el signo se ignora. <code>size(7)<\/code> coincide con el primer candidato (<code>small<\/code>), mientras que <code>size(-250)<\/code> tiene un valor absoluto de <code>250<\/code>, que no cumple ninguna de las dos condiciones y cae al comodín (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los candidatos se prueban del más específico al más general — exactamente en el orden en que están escritos aquí.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Classificare la dimensione","b":[["p",1,"<p><span c  where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Все три кандидата принимают один <code>Int<\/code>, поэтому без конструкций <code>where<\/code> они бы конфликтовали. Условия в первых двух делают их различными, а третий является перехватчиком.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Конструкции <code>where<\/code> проверяют <code>$n.abs<\/code>, поэтому результат определяется только абсолютной величиной, а знак игнорируется. <code>size(7)<\/code> совпадает с первым кандидатом (<code>small<\/code>), тогда как <code>size(-250)<\/code> имеет абсолютное значение <code>250<\/code>, которое не проходит оба условия и попадает в перехватчик (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кандидаты проверяются от наиболее конкретного к наиболее общему — именно в том порядке, в котором они здесь записаны.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Класифікуйте величину","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Усі три кандидати приймають один <code>Int<\/code>, тож без речень <code>where<\/code> вони конфліктували б. Умови на перших двох роблять їх різними, а третій є всеохопним.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Речення <code>where<\/code> перевіряють <code>$n.abs<\/code>, тож результат визначає сама лише величина, а знак ігнорується. <code>size(7)<\/code> збігається з першим кандидатом (<code>small<\/code>), тоді як <code>size(-250)<\/code> має абсолютне значення <code>250<\/code>, яке не проходить жодної з умов і провалюється до всеохопного (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кандидати перевіряються від найспецифічнішого до найзагальнішого — саме в тому порядку, в якому їх тут записано.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Класифицирайте размера","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във \/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiuj tri kandidatoj prenas unuopan <code>Int<\/code>, do sen la <code>where<\/code>-frazoj ili kolizius. La kondiĉoj ĉe la unuaj du igas ilin distinktaj, kaj la tria estas la ĝenerala kazo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>where<\/code>-frazoj testas <code>$n.abs<\/code>, do nur la amplekso decidas la rezulton kaj la signo estas ignorata. <code>size(7)<\/code> kongruas kun la unua kandidato (<code>small<\/code>), dum <code>size(-250)<\/code> havas absolutan valoron de <code>250<\/code>, kiu malsukcesas ĉe ambaŭ kondiĉoj kaj transiras al la ĝenerala kazo (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La kandidatoj estas testataj de la plej specifa al la plej ĝenerala — ĝuste en la ordo, en kiu ili estas skribitaj ĉi tie.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Magnitudinem classificare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omnes tres candidati unum <code>Int<\/code> accipiunt, itaque sine clausulis <code>where<\/code> inter se confligerent. Condiciones in primis duobus eos distinctos faciunt, et tertius receptaculum omnium est.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Clausulae <code>where<\/code> <code>$n.abs<\/code> probant, itaque sola magnitudo resultatum determinat et signum ignoratur. <code>size(7)<\/code> primo candidato congruit (<code>small<\/code>), dum <code>size(-250)<\/code> valorem absolutum <code>250<\/code> habet, qui ambabus condicionibus non satisfacit et ad receptaculum omnium cadit (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Candidati a specificissimo ad generalissimum probantur — exacte eo ordine quo hic scripti sunt.<\/span><\/li><\/ol>"]]}}}</script>
