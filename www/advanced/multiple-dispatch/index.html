<script type="application/json" id="page-data">{"u":"advanced/multiple-dispatch","n":654,"k":"section","pv":"advanced/colon-calls/quiz","nx":"advanced/multiple-dispatch/exercises","tr":["advanced"],"L":{"en":{"t":"Multiple dispatch","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part you met <a href=\"/essentials/more-on-functions/multi-functions/\"><em>multi-functions<\/em><\/a>: several subroutines that share a name, where Raku picks the right one by looking at the types of the arguments.<\/span> <span class=\"sg\" data-s=\"1\">This mechanism is called <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So far, the choice was made by the <em>type<\/em> of the arguments.<\/span> <span class=\"sg\" data-s=\"1\">A <code>where<\/code> clause lets you go further and dispatch on the <em>value<\/em> as well.<\/span> <span class=\"sg\" data-s=\"2\">It is written after a parameter and holds a condition that the argument must satisfy for that candidate to be chosen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each call goes to the candidate whose condition is true for the given value:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">All three candidates have the same signature as far as types go — a single <code>Int<\/code> — so without the <code>where<\/code> clauses they would clash.<\/span> <span class=\"sg\" data-s=\"1\">The conditions make them distinct.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">A base case for recursion<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A common use of <code>where<\/code> is to provide the stopping point of a recursion as a separate candidate.<\/span> <span class=\"sg\" data-s=\"1\">Here is the factorial again, split into two multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The first candidate handles the base case (<code>$n<\/code> of <code>1<\/code> or less) and simply returns <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Every other value goes to the second candidate, which calls <code>fact<\/code> again with a smaller number.<\/span> <span class=\"sg\" data-s=\"2\">There is no <code>if<\/code> inside the function — the choice of base case versus recursive step is made by the dispatcher.<\/span><\/p>"]]},"de":{"t":"Mehrfach-Dispatch","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im Teil „Grundlagen\" haben Sie <a href=\"https://course.raku.org/de/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>Multi-Funktionen<\/em><\/a> kennengelernt: mehrere Subroutinen, die denselben Namen teilen, wobei Raku anhand der Typen der Argumente die richtige auswählt.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Mechanismus wird <em>Multiple Dispatch<\/em> genannt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bisher wurde die Auswahl anhand des <em>Typs<\/em> der Argumente getroffen.<\/span> <span class=\"sg\" data-s=\"1\">Eine <code>where<\/code>-Klausel erlaubt es, noch weiter zu gehen und auch anhand des <em>Werts<\/em> zu dispatchen.<\/span> <span class=\"sg\" data-s=\"2\">Sie wird nach einem Parameter geschrieben und enthält eine Bedingung, die das Argument erfüllen muss, damit dieser Kandidat gewählt wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf geht an den Kandidaten, dessen Bedingung für den gegebenen Wert wahr ist:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alle drei Kandidaten haben dieselbe Signatur, was die Typen betrifft — ein einzelnes <code>Int<\/code> — ohne die <code>where<\/code>-Klauseln würden sie also kollidieren.<\/span> <span class=\"sg\" data-s=\"1\">Die Bedingungen machen sie unterscheidbar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ein Basisfall für die Rekursion<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein häufiger Einsatz von <code>where<\/code> besteht darin, den Endpunkt einer Rekursion als separaten Kandidaten bereitzustellen.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist erneut die Fakultät, aufgeteilt in zwei Multi-Subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der erste Kandidat behandelt den Basisfall (<code>$n<\/code> von <code>1<\/code> oder kleiner) und gibt einfach <code>1<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Jeder andere Wert geht an den zweiten Kandidaten, der <code>fact<\/code> erneut mit einer kleineren Zahl aufruft.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt kein <code>if<\/code> innerhalb der Funktion — die Wahl zwischen Basisfall und rekursivem Schritt wird vom Dispatcher getroffen.<\/span><\/p>"]]},"nl":{"t":"Meervoudige dispatch","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials maakte je kennis met <a href=\"https://course.raku.org/nl/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-functies<\/em><\/a>: meerdere subroutines die dezelfde naam delen, waarbij Raku de juiste kiest door naar de typen van de argumenten te kijken.<\/span> <span class=\"sg\" data-s=\"1\">Dit mechanisme heet <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe werd de keuze gemaakt op basis van het <em>type<\/em> van de argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Met een <code>where<\/code>-clausule kun je verder gaan en ook op de <em>waarde<\/em> dispatchen.<\/span> <span class=\"sg\" data-s=\"2\">Deze wordt na een parameter geschreven en bevat een voorwaarde waaraan het argument moet voldoen om die kandidaat te kiezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep gaat naar de kandidaat wiens voorwaarde waar is voor de gegeven waarde:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alle drie de kandidaten hebben dezelfde signatuur wat typen betreft — een enkele <code>Int<\/code> — dus zonder de <code>where<\/code>-clausules zouden ze botsen.<\/span> <span class=\"sg\" data-s=\"1\">De voorwaarden maken ze onderscheidend.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een basisgeval voor recursie<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een veelvoorkomend gebruik van <code>where<\/code> is het bieden van het stopcriterium van een recursie als een aparte kandidaat.<\/span> <span class=\"sg\" data-s=\"1\">Hier is de faculteit opnieuw, opgesplitst in twee multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De eerste kandidaat behandelt het basisgeval (<code>$n<\/code> van <code>1<\/code> of minder) en geeft simpelweg <code>1<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">Elke andere waarde gaat naar de tweede kandidaat, die <code>fact<\/code> opnieuw aanroept met een kleiner getal.<\/span> <span class=\"sg\" data-s=\"2\">Er is geen <code>if<\/code> in de functie — de keuze tussen basisgeval en recursieve stap wordt door de dispatcher gemaakt.<\/span><\/p>"]]},"es":{"t":"Despacho múltiple","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales conociste las <a href=\"https://course.raku.org/es/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funciones<\/em><\/a>: varias subrutinas que comparten un nombre, donde Raku elige la correcta observando los tipos de los argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Este mecanismo se llama <em>despacho múltiple<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, la elección se hacía por el <em>tipo<\/em> de los argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Una cláusula <code>where<\/code> te permite ir más allá y despachar también por el <em>valor<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Se escribe después de un parámetro y contiene una condición que el argumento debe satisfacer para que ese candidato sea elegido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada va al candidato cuya condición es verdadera para el valor dado:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tres candidatos tienen la misma firma en cuanto a tipos — un único <code>Int<\/code> — así que sin las cláusulas <code>where<\/code> entrarían en conflicto.<\/span> <span class=\"sg\" data-s=\"1\">Las condiciones los hacen distintos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Un caso base para la recursión<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un uso común de <code>where<\/code> es proporcionar el punto de parada de una recursión como un candidato separado.<\/span> <span class=\"sg\" data-s=\"1\">Aquí está el factorial de nuevo, dividido en dos multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El primer candidato maneja el caso base (<code>$n<\/code> de <code>1<\/code> o menos) y simplemente devuelve <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cualquier otro valor va al segundo candidato, que llama a <code>fact<\/code> de nuevo con un número más pequeño.<\/span> <span class=\"sg\" data-s=\"2\">No hay ningún <code>if<\/code> dentro de la función — la elección entre el caso base y el paso recursivo la hace el despachador.<\/span><\/p>"]]},"it":{"t":"Dispatch multiplo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essenziali hai incontrato le <a href=\"https://course.raku.org/it/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funzioni<\/em><\/a>: diverse subroutine che condividono lo stesso nome, dove Raku sceglie quella giusta in base ai tipi degli argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Questo meccanismo si chiama <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Finora la scelta veniva fatta in base al <em>tipo<\/em> degli argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Una clausola <code>where<\/code> permette di andare oltre e effettuare il dispatch anche in base al <em>valore<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Si scrive dopo un parametro e contiene una condizione che l'argomento deve soddisfare affinche quel candidato venga scelto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata va al candidato la cui condizione risulta vera per il valore dato:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutti e tre i candidati hanno la stessa firma per quanto riguarda i tipi — un singolo <code>Int<\/code> — quindi senza le clausole <code>where<\/code> entrerebbero in conflitto.<\/span> <span class=\"sg\" data-s=\"1\">Le condizioni li rendono distinti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Un caso base per la ricorsione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un uso comune di <code>where<\/code> e fornire il punto di arresto di una ricorsione come candidato separato.<\/span> <span class=\"sg\" data-s=\"1\">Ecco di nuovo il fattoriale, suddiviso in due multi-sub:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il primo candidato gestisce il caso base (<code>$n<\/code> uguale a <code>1<\/code> o inferiore) e restituisce semplicemente <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni altro valore va al secondo candidato, che chiama di nuovo <code>fact<\/code> con un numero piu piccolo.<\/span> <span class=\"sg\" data-s=\"2\">Non c'e nessun <code>if<\/code> all'interno della funzione — la scelta tra caso base e passo ricorsivo viene fatta dal dispatcher.<\/span><\/p>"]]},"lv":{"t":"Daudzkārtēja nosūtīšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sadaļā \"Pamati\" jūs iepazināties ar <a href=\"https://course.raku.org/lv/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funkcijām<\/em><\/a>: vairākām apakšprogrammām ar vienādu nosaukumu, kur Raku izvēlas pareizo, apskatot argumentu tipus.<\/span> <span class=\"sg\" data-s=\"1\">Šo mehānismu sauc par <em>vairākkārtēju dispečēšanu<\/em> (multiple dispatch).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Līdz šim izvēle tika veikta pēc argumentu <em>tipa<\/em>.<\/span> <span class=\"sg\" data-s=\"1\"><code>where<\/code> klauzula ļauj iet tālāk un veikt dispečēšanu arī pēc <em>vērtības<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tā tiek rakstīta aiz parametra un satur nosacījumu, kuram argumentam jāatbilst, lai šis kandidāts tiktu izvēlēts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums nonāk pie tā kandidāta, kura nosacījums ir patiess dotajai vērtībai:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visiem trim kandidātiem ir vienāda signatūra tipu ziņā — viens <code>Int<\/code> — tāpēc bez <code>where<\/code> klauzulām tie konfliktētu.<\/span> <span class=\"sg\" data-s=\"1\">Nosacījumi padara tos atšķirīgus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bāzes gadījums rekursijai<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bieži <code>where<\/code> lieto, lai nodrošinātu rekursijas apturēšanas punktu kā atsevišķu kandidātu.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir faktoriāls, sadalīts divās multi-apakšprogrammās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmais kandidāts apstrādā bāzes gadījumu (<code>$n<\/code> ir <code>1<\/code> vai mazāks) un vienkārši atgriež <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katra cita vērtība nonāk pie otrā kandidāta, kas izsauc <code>fact<\/code> vēlreiz ar mazāku skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Funkcijā nav neviena <code>if<\/code> — bāzes gadījuma un rekursīvā soļa izvēli veic dispečeris.<\/span><\/p>"]]},"ru":{"t":"Мультиметоды","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В разделе «Основы» вы познакомились с <a href=\"https://course.raku.org/ru/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мульти-функциями<\/em><\/a>: несколькими подпрограммами с одним именем, где Raku выбирает нужную, анализируя типы аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Этот механизм называется <em>множественная диспетчеризация<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">До сих пор выбор определялся <em>типом<\/em> аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Конструкция <code>where<\/code> позволяет пойти дальше и выполнять диспетчеризацию также по <em>значению<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Она записывается после параметра и содержит условие, которому должен удовлетворять аргумент, чтобы был выбран данный кандидат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов направляется к тому кандидату, чьё условие истинно для данного значения:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Все три кандидата имеют одинаковую сигнатуру с точки зрения типов — один <code>Int<\/code> — и без конструкций <code>where<\/code> они бы конфликтовали.<\/span> <span class=\"sg\" data-s=\"1\">Условия делают их различными.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Базовый случай для рекурсии<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Частое применение <code>where<\/code> — определение точки остановки рекурсии в виде отдельного кандидата.<\/span> <span class=\"sg\" data-s=\"1\">Вот факториал, разделённый на два мульти-подпрограммы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Первый кандидат обрабатывает базовый случай (<code>$n<\/code> равно <code>1<\/code> или меньше) и просто возвращает <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Все остальные значения попадают во второй кандидат, который вызывает <code>fact<\/code> снова с меньшим числом.<\/span> <span class=\"sg\" data-s=\"2\">Внутри функции нет никакого <code>if<\/code> — выбор между базовым случаем и рекурсивным шагом делается диспетчером.<\/span><\/p>"]]},"uk":{"t":"Множинна диспетчеризація","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви познайомилися з <a href=\"https://course.raku.org/uk/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мульти-функціями<\/em><\/a> — кількома підпрограмами зі спільним іменем, серед яких Raku обирає потрібну, дивлячись на типи аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Цей механізм називають <em>множинною диспетчеризацією<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Досі вибір робився за <em>типом<\/em> аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Речення <code>where<\/code> дозволяє піти далі й диспетчеризувати ще й за <em>значенням<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Воно записується після параметра й містить умову, яку аргумент має задовольнити, щоб було обрано саме цього кандидата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик потрапляє до того кандидата, чия умова істинна для даного значення:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усі три кандидати мають однакову сигнатуру з погляду типів — один <code>Int<\/code>, — тож без речень <code>where<\/code> вони конфліктували б. Умови роблять їх різними.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Базовий випадок для рекурсії<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поширене застосування <code>where<\/code> — задати точку зупинки рекурсії окремим кандидатом.<\/span> <span class=\"sg\" data-s=\"1\">Ось знову факторіал, розділений на дві мульти-підпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перший кандидат обробляє базовий випадок (<code>$n<\/code>, що дорівнює <code>1<\/code> або менше) і просто повертає <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кожне інше значення потрапляє до другого кандидата, який знову викликає <code>fact<\/code> із меншим числом.<\/span> <span class=\"sg\" data-s=\"2\">Усередині функції немає жодного <code>if<\/code> — вибір між базовим випадком і рекурсивним кроком робить диспетчер.<\/span><\/p>"]]},"bg":{"t":"Множествена диспечеризация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" се запознахте с <a href=\"https://course.raku.org/bg/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мулти-функциите<\/em><\/a>: няколко подпрограми, които споделят едно и също име, като Raku избира правилната, като разглежда типовете на аргументите.<\/span> <span class=\"sg\" data-s=\"1\">Този механизъм се нарича <em>множествено диспечиране<\/em> (multiple dispatch).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Досега изборът се правеше по <em>типа<\/em> на аргументите.<\/span> <span class=\"sg\" data-s=\"1\">Клаузата <code>where<\/code> ви позволява да отидете по-далеч и да диспечирате и по <em>стойността<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Тя се записва след параметъра и съдържа условие, което аргументът трябва да удовлетвори, за да бъде избран съответният кандидат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване отива към кандидата, чието условие е вярно за дадената стойност:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И трите кандидата имат една и съща сигнатура, що се отнася до типовете — единичен <code>Int<\/code> — така че без клаузите <code>where<\/code> те биха се сблъскали.<\/span> <span class=\"sg\" data-s=\"1\">Условията ги правят различни.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Базов случай за рекурсия<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Често срещана употреба на <code>where<\/code> е да се осигури точка на спиране на рекурсията като отделен кандидат.<\/span> <span class=\"sg\" data-s=\"1\">Ето отново факториелът, разделен на два мулти-подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Първият кандидат обработва базовия случай (<code>$n<\/code> равно на <code>1<\/code> или по-малко) и просто връща <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка друга стойност отива към втория кандидат, който извиква <code>fact<\/code> отново с по-малко число.<\/span> <span class=\"sg\" data-s=\"2\">Няма <code>if<\/code> вътре във функцията — изборът между базовия случай и рекурсивната стъпка се прави от диспечера.<\/span><\/p>"]]},"eo":{"t":"Multobla dissendo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencaĵoj vi renkontis <a href=\"https://course.raku.org/eo/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funkciojn<\/em><\/a>: plurajn subrutinojn kiuj havas la saman nomon, kie Raku elektas la ĝustan laŭ la tipoj de la argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Tiu mekanismo nomiĝas <em>multnivela sendo<\/em> (multiple dispatch).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, la elekto estis farita laŭ la <em>tipo<\/em> de la argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Frazo <code>where<\/code> ebligas iri plu kaj sendi ankaŭ laŭ la <em>valoro<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas skribita post parametro kaj enhavas kondiĉon, kiun la argumento devas plenumi por ke tiu kandidato estu elektita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko iras al la kandidato, kies kondiĉo estas vera por la donita valoro:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj tri kandidatoj havas la saman signaturon laŭ tipoj — unuopa <code>Int<\/code> — do sen la <code>where<\/code>-frazoj ili kolizius.<\/span> <span class=\"sg\" data-s=\"1\">La kondiĉoj igas ilin distinktaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Baza kazo por rekursio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ofta uzo de <code>where<\/code> estas provizi la haltan punkton de rekursio kiel apartan kandidaton.<\/span> <span class=\"sg\" data-s=\"1\">Jen la faktorialo denove, dividita en du multi-subrutinojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La unua kandidato traktas la bazan kazon (<code>$n<\/code> de <code>1<\/code> aŭ malpli) kaj simple redonas <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu alia valoro iras al la dua kandidato, kiu vokas <code>fact<\/code> denove kun pli malgranda nombro.<\/span> <span class=\"sg\" data-s=\"2\">Ne estas <code>if<\/code> ene de la funkcio — la elekton inter baza kazo kaj rekursia paŝo faras la sendilo.<\/span><\/p>"]]},"la":{"t":"Multiplex dispatch","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialia occurristi <a href=\"https://course.raku.org/la/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-functionibus<\/em><\/a>: pluribus subroutinis quae nomen commune habent, ubi Raku rectam eligit inspiciendo genera argumentorum.<\/span> <span class=\"sg\" data-s=\"1\">Hic mechanismus <em>multiplex dispatium<\/em> vocatur.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hactenus, electio ex <em>genere<\/em> argumentorum facta est.<\/span> <span class=\"sg\" data-s=\"1\">Clausula <code>where<\/code> te longius ire sinit et ex <em>valore<\/em> quoque dispatchere.<\/span> <span class=\"sg\" data-s=\"2\">Post parametrum scribitur et condicionem continet quam argumentum satisfacere debet ut ille candidatus eligatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio ad candidatum it cuius condicio vera est pro dato valore:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnes tres candidati eandem signaturam habent quantum ad genera pertinet — unum <code>Int<\/code> — itaque sine clausulis <code>where<\/code> inter se confligerent.<\/span> <span class=\"sg\" data-s=\"1\">Condiciones eos distinctos faciunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Casus basis pro recursione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usus communis clausulae <code>where<\/code> est ut punctum sistendi recursionis ut candidatum separatum praebeat.<\/span> <span class=\"sg\" data-s=\"1\">Hic est factorialis iterum, in duos multi-subs divisus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Primus candidatus casum basem tractat (<code>$n<\/code> valoris <code>1<\/code> vel minoris) et simpliciter <code>1<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Omnis alius valor ad secundum candidatum it, qui <code>fact<\/code> iterum cum numero minore vocat.<\/span> <span class=\"sg\" data-s=\"2\">Nullum <code>if<\/code> intra functionem est — electio inter casum basem et gradum recursivum a dispatchore fit.<\/span><\/p>"]]}}}</script>
