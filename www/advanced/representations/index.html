<script type="application/json" id="page-data">{"u":"advanced/representations","n":335,"k":"section","pv":"advanced","nx":"advanced/representations/gist","tr":["advanced"],"L":{"en":{"t":"Turning values into text","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Whenever a program shows a value — when you <code>say<\/code> it, print it, or drop it into a string — that value has to be turned into text.<\/span> <span class=\"sg\" data-s=\"1\">Raku does not have a single fixed way of doing this.<\/span> <span class=\"sg\" data-s=\"2\">Instead, every value carries a few standard methods, each producing a string for a different purpose:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — a human-friendly form, the one <code>say<\/code> prints.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — the plain string form, used in string context.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — a code-like form, handy while debugging.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">All three are ordinary methods defined for every value in the language, so they work the same way on a number, a string, an array, or an object of your own.<\/span> <span class=\"sg\" data-s=\"1\">The next pages look at each method in turn and then help you pick the right one; <a href=\"/advanced/dd/\">the section after that introduces <code>dd<\/code><\/a>, a Rakudo tool built on top of <code>.raku<\/code>.<\/span><\/p>"]]},"de":{"t":"Werte in Text umwandeln","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn ein Programm einen Wert anzeigt — wenn du ihn mit <code>say<\/code> ausgibst, ihn druckst oder in einen String einfügst — muss dieser Wert in Text umgewandelt werden.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat dafür keinen einzigen festen Weg.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen verfügt jeder Wert über einige Standardmethoden, die jeweils einen String für einen bestimmten Zweck erzeugen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — eine menschenfreundliche Form, die <code>say<\/code> ausgibt.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — die einfache Stringform, die im Stringkontext verwendet wird.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — eine codeähnliche Form, praktisch beim Debuggen.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alle drei sind gewöhnliche Methoden, die für jeden Wert in der Sprache definiert sind, sodass sie auf eine Zahl, einen String, ein Array oder ein eigenes Objekt gleich funktionieren.<\/span> <span class=\"sg\" data-s=\"1\">Die nächsten Seiten betrachten jede Methode der Reihe nach und helfen dir dann, die richtige auszuwählen; <a href=\"https://course.raku.org/de/advanced/dd/\" target=\"_blank\" rel=\"noopener\">der Abschnitt danach stellt <code>dd<\/code> vor<\/a>, ein Rakudo-Werkzeug, das auf <code>.raku<\/code> aufbaut.<\/span><\/p>"]]},"nl":{"t":"Waarden omzetten naar tekst","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer een programma een waarde toont — wanneer je het <code>say<\/code>t, print, of in een string invoegt — moet die waarde omgezet worden naar tekst.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft niet een enkele vaste manier om dit te doen.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan heeft elke waarde een paar standaardmethodes, die elk een string produceren voor een ander doel:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — een mensvriendelijke vorm, die <code>say<\/code> afdrukt.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — de gewone stringvorm, gebruikt in stringcontext.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — een codeachtige vorm, handig bij het debuggen.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alle drie zijn gewone methodes die voor elke waarde in de taal gedefinieerd zijn, dus ze werken op dezelfde manier voor een getal, een string, een array of een eigen object.<\/span> <span class=\"sg\" data-s=\"1\">De volgende pagina's bekijken elke methode op zijn beurt en helpen je vervolgens de juiste te kiezen; <a href=\"https://course.raku.org/nl/advanced/dd/\" target=\"_blank\" rel=\"noopener\">het volgende deel introduceert <code>dd<\/code><\/a>, een Rakudo-hulpmiddel dat bovenop <code>.raku<\/code> gebouwd is.<\/span><\/p>"]]},"es":{"t":"Convirtiendo valores en texto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Siempre que un programa muestra un valor — cuando usas <code>say<\/code>, lo imprimes o lo insertas en una cadena — ese valor debe convertirse en texto.<\/span> <span class=\"sg\" data-s=\"1\">Raku no tiene una única forma fija de hacerlo.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, cada valor lleva consigo algunos métodos estándar, cada uno de los cuales produce una cadena con un propósito diferente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — una forma legible para humanos, la que imprime <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la forma de cadena simple, usada en contexto de cadena.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — una forma similar a código, útil para depuración.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tres son métodos ordinarios definidos para cada valor en el lenguaje, así que funcionan de la misma manera con un número, una cadena, un arreglo o un objeto propio.<\/span> <span class=\"sg\" data-s=\"1\">Las páginas siguientes examinan cada método por turno y luego te ayudan a elegir el correcto; <a href=\"https://course.raku.org/es/advanced/dd/\" target=\"_blank\" rel=\"noopener\">la sección siguiente presenta <code>dd<\/code><\/a>, una herramienta de Rakudo construida sobre <code>.raku<\/code>.<\/span><\/p>"]]},"it":{"t":"Trasformare valori in testo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni volta che un programma mostra un valore — quando lo si stampa con <code>say<\/code>, con <code>print<\/code>, o lo si inserisce in una stringa — quel valore deve essere convertito in testo.<\/span> <span class=\"sg\" data-s=\"1\">Raku non ha un unico modo fisso per farlo.<\/span> <span class=\"sg\" data-s=\"2\">Invece, ogni valore porta con sé alcuni metodi standard, ciascuno dei quali produce una stringa per uno scopo diverso:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — una forma leggibile e pensata per l'uomo, quella che <code>say<\/code> stampa.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la forma stringa semplice, usata nel contesto stringa.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — una forma simile al codice, utile durante il debug.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutti e tre sono metodi ordinari definiti per ogni valore del linguaggio, quindi funzionano allo stesso modo su un numero, una stringa, un array o un oggetto creato da te.<\/span> <span class=\"sg\" data-s=\"1\">Le pagine seguenti esaminano ciascun metodo a turno e poi ti aiutano a scegliere quello giusto; <a href=\"https://course.raku.org/it/advanced/dd/\" target=\"_blank\" rel=\"noopener\">la sezione successiva introduce <code>dd<\/code><\/a>, uno strumento di Rakudo costruito sopra <code>.raku<\/code>.<\/span><\/p>"]]},"lv":{"t":"Vērtību pārvēršana tekstā","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Katru reizi, kad programma parāda vērtību — kad jūs to izvadāt ar <code>say<\/code>, izdrukājat vai ievietojat virknē — šī vērtība ir jāpārvērš tekstā.<\/span> <span class=\"sg\" data-s=\"1\">Raku neizmanto vienu fiksētu veidu, kā to darīt.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā katra vērtība satur dažas standarta metodes, no kurām katra izveido virkni atšķirīgam mērķim:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — cilvēkam draudzīga forma, ko izdrukā <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — vienkārša virknes forma, ko izmanto virknes kontekstā.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — kodam līdzīga forma, noderīga atkļūdošanas laikā.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visas trīs ir parastas metodes, kas definētas katrai vērtībai valodā, tāpēc tās darbojas vienādi gan ar skaitli, gan ar virkni, gan ar masīvu, gan ar jūsu paša objektu.<\/span> <span class=\"sg\" data-s=\"1\">Nākamajās lappusēs apskatīsim katru metodi atsevišķi un pēc tam palīdzēsim izvēlēties pareizo; <a href=\"https://course.raku.org/lv/advanced/dd/\" target=\"_blank\" rel=\"noopener\">nākamajā sadaļā tiek ieviests <code>dd<\/code><\/a> — Rakudo rīks, kas balstīts uz <code>.raku<\/code>.<\/span><\/p>"]]},"ru":{"t":"Преобразование значений в текст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждый раз, когда программа показывает значение — когда вы используете <code>say<\/code>, печатаете его или вставляете в строку — это значение должно быть преобразовано в текст.<\/span> <span class=\"sg\" data-s=\"1\">В Raku нет единого фиксированного способа сделать это.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого каждое значение несёт в себе несколько стандартных методов, каждый из которых создаёт строку для определённой цели:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — удобная для человека форма, именно её печатает <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — простая строковая форма, используемая в строковом контексте.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, похожая на код, удобная при отладке.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Все три — обычные методы, определённые для каждого значения в языке, поэтому они одинаково работают для числа, строки, массива или объекта вашего собственного класса.<\/span> <span class=\"sg\" data-s=\"1\">На следующих страницах мы рассмотрим каждый метод по очереди, а затем поможем выбрать подходящий; <a href=\"https://course.raku.org/ru/advanced/dd/\" target=\"_blank\" rel=\"noopener\">следующий раздел знакомит с <code>dd<\/code><\/a> — инструментом Rakudo, построенным поверх <code>.raku<\/code>.<\/span><\/p>"]]},"uk":{"t":"Перетворення значень у текст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоразу, коли програма показує значення — коли ви використовуєте <code>say<\/code>, друкуєте його або вставляєте в рядок — це значення має бути перетворене на текст.<\/span> <span class=\"sg\" data-s=\"1\">У Raku немає єдиного фіксованого способу це зробити.<\/span> <span class=\"sg\" data-s=\"2\">Натомість кожне значення має кілька стандартних методів, кожен з яких створює рядок для різних цілей:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — зручна для людини форма, яку друкує <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — проста рядкова форма, що використовується в рядковому контексті.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, подібна до коду, зручна під час налагодження.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усі три — це звичайні методи, визначені для кожного значення в мові, тому вони однаково працюють для числа, рядка, масиву чи вашого власного об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">На наступних сторінках ми розглянемо кожен метод по черзі, а потім допоможемо вам вибрати правильний; <a href=\"https://course.raku.org/uk/advanced/dd/\" target=\"_blank\" rel=\"noopener\">наступний розділ знайомить з <code>dd<\/code><\/a>, інструментом Rakudo, побудованим на основі <code>.raku<\/code>.<\/span><\/p>"]]},"bg":{"t":"Превръщане на стойности в текст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато програма показва стойност — когато я изведете с <code>say<\/code>, я отпечатате или я вмъкнете в низ — тази стойност трябва да бъде превърната в текст.<\/span> <span class=\"sg\" data-s=\"1\">Raku няма един единствен фиксиран начин за това.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това всяка стойност разполага с няколко стандартни метода, всеки от които произвежда низ за различна цел:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма, удобна за четене от човек, тази която <code>say<\/code> отпечатва.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — обикновена текстова форма, използвана в контекст на низ.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, подобна на код, полезна при дебъгване.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И трите са обикновени методи, дефинирани за всяка стойност в езика, така че работят по един и същи начин за числа, низове, масиви или обекти от ваш собствен клас.<\/span> <span class=\"sg\" data-s=\"1\">Следващите страници разглеждат всеки метод поотделно и след това ви помагат да изберете правилния; <a href=\"https://course.raku.org/bg/advanced/dd/\" target=\"_blank\" rel=\"noopener\">следващият раздел представя <code>dd<\/code><\/a>, инструмент на Rakudo, построен върху <code>.raku<\/code>.<\/span><\/p>"]]},"eo":{"t":"Konverti valorojn al teksto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam ajn programo montras valoron — kiam vi <code>say<\/code>-as ĝin, presas ĝin, aŭ enmetas ĝin en ĉenon — tiu valoro devas esti transformita al teksto.<\/span> <span class=\"sg\" data-s=\"1\">Raku ne havas ununuran fiksan manieron fari tion.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ĉiu valoro portas kelkajn normajn metodojn, ĉiu produktante ĉenon por malsama celo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — homlegebla formo, tio kion <code>say<\/code> presas.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la simpla ĉenformo, uzata en ĉenkonteksto.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — kodosimila formo, utila dum sencimigo.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj tri estas ordinaraj metodoj difinitaj por ĉiu valoro en la lingvo, do ili funkcias same por nombro, ĉeno, tabelo, aŭ via propra objekto.<\/span> <span class=\"sg\" data-s=\"1\">La sekvaj paĝoj rigardas ĉiun metodon laŭvice kaj poste helpas vin elekti la ĝustan; <a href=\"https://course.raku.org/eo/advanced/dd/\" target=\"_blank\" rel=\"noopener\">la sekvanta sekcio prezentas <code>dd<\/code><\/a>, Rakudo-ilon konstruitan sur <code>.raku<\/code>.<\/span><\/p>"]]},"la":{"t":"Valores in textum convertere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quotienscumque programma valorem ostendit — cum eum <code>say<\/code> dicis, imprimis, vel in seriem inseris — ille valor in textum converti debet.<\/span> <span class=\"sg\" data-s=\"1\">Raku non habet unum fixum modum hoc faciendi.<\/span> <span class=\"sg\" data-s=\"2\">Potius, quilibet valor aliquot methodos normales portat, quarum quaeque seriem ad diversum propositum producit:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — forma homini amica, quam <code>say<\/code> imprimit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — forma seriei planae, in contextu serierum adhibita.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — forma codici similis, utilis dum errores corrigis.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnes tres sunt methodi ordinariae pro quolibet valore in lingua definitae, itaque eodem modo in numero, serie, ordine, vel obiecto tuo proprio operantur.<\/span> <span class=\"sg\" data-s=\"1\">Paginae sequentes quamque methodum singillatim inspiciunt et deinde te adiuvant rectam eligere; <a href=\"https://course.raku.org/la/advanced/dd/\" target=\"_blank\" rel=\"noopener\">sectio sequens <code>dd<\/code> introducit<\/a>, instrumentum Rakudo supra <code>.raku<\/code> aedificatum.<\/span><\/p>"]]}}}</script>
