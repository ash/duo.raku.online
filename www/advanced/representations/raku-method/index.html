<script type="application/json" id="page-data">{"u":"advanced/representations/raku-method","n":339,"k":"topic","pv":"advanced/representations/str/quiz","nx":"advanced/representations/choosing","tr":["advanced","advanced/representations"],"L":{"en":{"t":"The <code>.raku<\/code> method","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The third representation method, <code>.raku<\/code>, returns a string with a <strong>code-like<\/strong> representation of the value — ideally, a string that you could paste back into a program to recreate the same value.<\/span> <span class=\"sg\" data-s=\"1\">Every value in Raku has it.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice how the string <code>'Raku'<\/code> comes back with the quotes around it, so you can tell a number from a string at a glance — exactly the kind of detail you want while debugging.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The method also works for compound data, including nested structures:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because <code>.raku<\/code> returns an ordinary string, you can use it anywhere a string is expected, for example inside an interpolated message:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Use <code>.raku<\/code> whenever you want that code-like representation as a string to combine with your own messages.<\/span> <span class=\"sg\" data-s=\"1\">Very soon we’ll introduce <code>dd<\/code>, a Rakudo tool that prints the same kind of representation for you in one step.<\/span><\/p>"]]},"de":{"t":"Die <code>.raku<\/code>-Methode","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die dritte Darstellungsmethode, <code>.raku<\/code>, gibt einen String mit einer <strong>codeähnlichen<\/strong> Darstellung des Wertes zurück — idealerweise einen String, den du in ein Programm einfügen könntest, um denselben Wert wiederherzustellen.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Wert in Raku verfügt über diese Methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachte, wie der String <code>'Raku'<\/code> mit den Anführungszeichen zurückkommt, sodass du auf einen Blick eine Zahl von einem String unterscheiden kannst — genau die Art von Detail, die man beim Debuggen braucht.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode funktioniert auch für zusammengesetzte Daten, einschließlich verschachtelter Strukturen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da <code>.raku<\/code> einen gewöhnlichen String zurückgibt, kannst du ihn überall verwenden, wo ein String erwartet wird, zum Beispiel in einer interpolierten Nachricht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verwende <code>.raku<\/code>, wann immer du diese codeähnliche Darstellung als String haben möchtest, um sie mit eigenen Nachrichten zu kombinieren.<\/span> <span class=\"sg\" data-s=\"1\">Sehr bald werden wir <code>dd<\/code> vorstellen, ein Rakudo-Werkzeug, das dieselbe Art von Darstellung in einem Schritt für dich ausgibt.<\/span><\/p>"]]},"nl":{"t":"De <code>.raku<\/code>-methode","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De derde representatiemethode, <code>.raku<\/code>, geeft een string terug met een <strong>codeachtige<\/strong> representatie van de waarde — idealiter een string die je terug in een programma zou kunnen plakken om dezelfde waarde opnieuw te creeren.<\/span> <span class=\"sg\" data-s=\"1\">Elke waarde in Raku heeft deze methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op hoe de string <code>'Raku'<\/code> terugkomt met aanhalingstekens eromheen, zodat je in een oogopslag een getal van een string kunt onderscheiden — precies het soort detail dat je wilt bij het debuggen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode werkt ook voor samengestelde gegevens, inclusief geneste structuren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>.raku<\/code> een gewone string teruggeeft, kun je het overal gebruiken waar een string verwacht wordt, bijvoorbeeld in een geinterpoleerd bericht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>.raku<\/code> wanneer je die codeachtige representatie als string wilt om te combineren met je eigen berichten.<\/span> <span class=\"sg\" data-s=\"1\">Binnenkort introduceren we <code>dd<\/code>, een Rakudo-hulpmiddel dat dezelfde soort representatie in een stap voor je afdrukt.<\/span><\/p>"]]},"es":{"t":"El método <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El tercer método de representación, <code>.raku<\/code>, devuelve una cadena con una representación <strong>similar a código<\/strong> del valor — idealmente, una cadena que podrías pegar de vuelta en un programa para recrear el mismo valor.<\/span> <span class=\"sg\" data-s=\"1\">Cada valor en Raku lo tiene.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa cómo la cadena <code>'Raku'<\/code> regresa con las comillas alrededor, para que puedas distinguir un número de una cadena de un vistazo — exactamente el tipo de detalle que quieres al depurar.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método también funciona con datos compuestos, incluyendo estructuras anidadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como <code>.raku<\/code> devuelve una cadena ordinaria, puedes usarlo en cualquier lugar donde se espere una cadena, por ejemplo dentro de un mensaje interpolado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa <code>.raku<\/code> siempre que quieras esa representación similar a código como cadena para combinarla con tus propios mensajes.<\/span> <span class=\"sg\" data-s=\"1\">Muy pronto presentaremos <code>dd<\/code>, una herramienta de Rakudo que imprime el mismo tipo de representación por ti en un solo paso.<\/span><\/p>"]]},"it":{"t":"Il metodo <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il terzo metodo di rappresentazione, <code>.raku<\/code>, restituisce una stringa con una rappresentazione del valore <strong>simile al codice<\/strong> — idealmente, una stringa che potresti incollare di nuovo in un programma per ricreare lo stesso valore.<\/span> <span class=\"sg\" data-s=\"1\">Ogni valore in Raku lo possiede.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota come la stringa <code>'Raku'<\/code> viene restituita con le virgolette attorno, così puoi distinguere a colpo d'occhio un numero da una stringa — esattamente il tipo di dettaglio che vuoi durante il debug.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo funziona anche per dati composti, incluse le strutture annidate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>.raku<\/code> restituisce una stringa ordinaria, puoi usarlo ovunque sia prevista una stringa, ad esempio all'interno di un messaggio interpolato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa <code>.raku<\/code> ogni volta che vuoi quella rappresentazione simile al codice come stringa da combinare con i tuoi messaggi.<\/span> <span class=\"sg\" data-s=\"1\">Molto presto introdurremo <code>dd<\/code>, uno strumento di Rakudo che stampa lo stesso tipo di rappresentazione in un solo passaggio.<\/span><\/p>"]]},"lv":{"t":"Metode <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Trešā attēlojuma metode, <code>.raku<\/code>, atgriež virkni ar <strong>kodam līdzīgu<\/strong> vērtības attēlojumu — ideālā gadījumā virkni, ko varētu ielīmēt atpakaļ programmā, lai atjaunotu to pašu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir pieejama katrai vērtībai Raku.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, kā virkne <code>'Raku'<\/code> tiek atgriezta ar pēdiņām ap to, lai jūs varētu uzreiz atšķirt skaitli no virknes — tieši tāda veida detaļa, kas nepieciešama atkļūdošanas laikā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode darbojas arī ar saliktiem datiem, tostarp ligzdotām struktūrām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>.raku<\/code> atgriež parastu virkni, to var izmantot visur, kur tiek gaidīta virkne, piemēram, interpolētā ziņojumā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet <code>.raku<\/code> ikreiz, kad vēlaties šādu kodam līdzīgu attēlojumu kā virkni, lai to apvienotu ar saviem ziņojumiem.<\/span> <span class=\"sg\" data-s=\"1\">Ļoti drīz mēs iepazīstināsim ar <code>dd<\/code> — Rakudo rīku, kas viena soļa vietā izdrukā tāda paša veida attēlojumu.<\/span><\/p>"]]},"ru":{"t":"Метод <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Третий метод представления, <code>.raku<\/code>, возвращает строку с <strong>кодоподобным<\/strong> представлением значения — в идеале строку, которую можно вставить обратно в программу для воссоздания того же значения.<\/span> <span class=\"sg\" data-s=\"1\">Он есть у каждого значения в Raku.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что строка <code>'Raku'<\/code> возвращается с кавычками, так что вы можете с первого взгляда отличить число от строки — именно такие детали важны при отладке.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этот метод также работает для составных данных, включая вложенные структуры:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>.raku<\/code> возвращает обычную строку, вы можете использовать его везде, где ожидается строка, например внутри интерполированного сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Используйте <code>.raku<\/code>, когда вам нужно кодоподобное представление в виде строки для комбинирования с вашими собственными сообщениями.<\/span> <span class=\"sg\" data-s=\"1\">Совсем скоро мы познакомимся с <code>dd<\/code> — инструментом Rakudo, который печатает такое же представление за один шаг.<\/span><\/p>"]]},"uk":{"t":"Метод <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Третій метод представлення, <code>.raku<\/code>, повертає рядок із <strong>подібним до коду<\/strong> представленням значення — в ідеалі рядок, який можна вставити назад у програму, щоб відтворити те саме значення.<\/span> <span class=\"sg\" data-s=\"1\">Кожне значення в Raku має цей метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що рядок <code>'Raku'<\/code> повертається з лапками навколо нього, тому ви можете відрізнити число від рядка з першого погляду — саме такі деталі потрібні під час налагодження.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод також працює для складених даних, включаючи вкладені структури:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>.raku<\/code> повертає звичайний рядок, ви можете використовувати його будь-де, де очікується рядок, наприклад, всередині інтерпольованого повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <code>.raku<\/code>, коли вам потрібне подібне до коду представлення у вигляді рядка для поєднання з вашими власними повідомленнями.<\/span> <span class=\"sg\" data-s=\"1\">Дуже скоро ми познайомимося з <code>dd<\/code>, інструментом Rakudo, який друкує таке саме представлення за один крок.<\/span><\/p>"]]},"bg":{"t":"Методът <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Третият метод за представяне, <code>.raku<\/code>, връща низ с представяне на стойността, <strong>подобно на код<\/strong> — в идеалния случай низ, който можете да поставите обратно в програма, за да пресъздадете същата стойност.<\/span> <span class=\"sg\" data-s=\"1\">Всяка стойност в Raku го има.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете как низът <code>'Raku'<\/code> се връща с кавички около него, за да можете с един поглед да различите число от низ — точно този вид детайл е полезен при дебъгване.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът работи и за съставни данни, включително вложени структури:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като <code>.raku<\/code> връща обикновен низ, можете да го използвате навсякъде, където се очаква низ, например вътре в интерполирано съобщение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвайте <code>.raku<\/code>, когато искате това подобно на код представяне като низ, който да комбинирате с вашите собствени съобщения.<\/span> <span class=\"sg\" data-s=\"1\">Много скоро ще представим <code>dd<\/code>, инструмент на Rakudo, който отпечатва същия вид представяне вместо вас в една стъпка.<\/span><\/p>"]]},"eo":{"t":"La metodo <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La tria reprezenta metodo, <code>.raku<\/code>, redonas ĉenon kun <strong>kodosimila<\/strong> reprezento de la valoro — ideale, ĉenon kiun vi povus enmeti reen en programon por rekrei la saman valoron.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu valoro en Raku havas ĝin.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rimarku kiel la ĉeno <code>'Raku'<\/code> revenas kun la citiloj ĉirkaŭ ĝi, por ke vi povu distingi nombron de ĉeno unuavide — ĝuste tia detalo estas utila dum sencimigo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo ankaŭ funkcias por kunmetitaj datumoj, inkluzive de nestitaj strukturoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar <code>.raku<\/code> redonas ordinaran ĉenon, vi povas uzi ĝin ĉie kie ĉeno estas atendata, ekzemple ene de interpolita mesaĝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzu <code>.raku<\/code> kiam ajn vi volas tiun kodosimilan reprezenton kiel ĉenon por kombini kun viaj propraj mesaĝoj.<\/span> <span class=\"sg\" data-s=\"1\">Tre baldaŭ ni prezentos <code>dd<\/code>, Rakudo-ilon kiu presas la saman specon de reprezento por vi en unu paŝo.<\/span><\/p>"]]},"la":{"t":"Methodus <code>.raku<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tertia methodus repraesentationis, <code>.raku<\/code>, seriem cum repraesentatione valoris <strong>codici simili<\/strong> reddit — idealiter, seriem quam in programma reinserere possis ad eundem valorem recreandum.<\/span> <span class=\"sg\" data-s=\"1\">Quilibet valor in Raku eam habet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quomodo series <code>'Raku'<\/code> cum signis citationis redit, ut numerum a serie primo aspectu distinguere possis — exacte genus detailii quod dum errores corrigis desideras.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus etiam pro datis compositis operatur, inclusis structuris insertis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia <code>.raku<\/code> seriem ordinariam reddit, eam ubicumque series expectatur adhibere potes, exempli gratia intra nuntium interpolatum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Utere <code>.raku<\/code> quotienscumque illam repraesentationem codici similem ut seriem vis, quam cum propriis nuntiis componas.<\/span> <span class=\"sg\" data-s=\"1\">Mox <code>dd<\/code> introducemus, instrumentum Rakudo quod eandem repraesentationem uno gradu pro te imprimit.<\/span><\/p>"]]}}}</script>
