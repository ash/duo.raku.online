<script type="application/json" id="page-data">{"u":"advanced/representations/gist","n":336,"k":"topic","pv":"advanced/representations","nx":"advanced/representations/str","tr":["advanced","advanced/representations"],"L":{"en":{"t":"The <code>.gist<\/code> method","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>.gist<\/code> method returns a <strong>human-friendly<\/strong> representation of a value — the form you would want to <em>read<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This is exactly what <code>say<\/code> (and <code>note<\/code>) print: they call <code>.gist<\/code> on each argument.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For simple values the gist is just the value itself.<\/span> <span class=\"sg\" data-s=\"1\">For compound data, <code>.gist<\/code> adds a little formatting so the structure stays readable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A type object — a value that stands for the type itself — gists as its name in parentheses, which makes it easy to spot in the output:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"de":{"t":"Die <code>.gist<\/code>-Methode","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.gist<\/code> gibt eine <strong>menschenfreundliche<\/strong> Darstellung eines Wertes zurück — die Form, die man am liebsten <em>lesen<\/em> möchte.<\/span> <span class=\"sg\" data-s=\"1\">Genau das geben <code>say<\/code> (und <code>note<\/code>) aus: Sie rufen <code>.gist<\/code> auf jedem Argument auf.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bei einfachen Werten ist der Gist einfach der Wert selbst.<\/span> <span class=\"sg\" data-s=\"1\">Bei zusammengesetzten Daten fügt <code>.gist<\/code> ein wenig Formatierung hinzu, damit die Struktur lesbar bleibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Typobjekt — ein Wert, der den Typ selbst repräsentiert — wird von gist als sein Name in Klammern dargestellt, was es leicht macht, ihn in der Ausgabe zu erkennen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"nl":{"t":"De <code>.gist<\/code>-methode","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>.gist<\/code>-methode geeft een <strong>mensvriendelijke<\/strong> representatie van een waarde terug — de vorm die je zou willen <em>lezen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is precies wat <code>say<\/code> (en <code>note<\/code>) afdrukken: ze roepen <code>.gist<\/code> aan op elk argument.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voor eenvoudige waarden is de gist gewoon de waarde zelf.<\/span> <span class=\"sg\" data-s=\"1\">Voor samengestelde gegevens voegt <code>.gist<\/code> een beetje opmaak toe, zodat de structuur leesbaar blijft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een type-object — een waarde die staat voor het type zelf — wordt door gist weergegeven als de naam tussen haakjes, waardoor het makkelijk te herkennen is in de uitvoer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"es":{"t":"El método <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>.gist<\/code> devuelve una representación <strong>legible para humanos<\/strong> de un valor — la forma que querrías <em>leer<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es exactamente lo que imprimen <code>say<\/code> (y <code>note<\/code>): llaman a <code>.gist<\/code> sobre cada argumento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para valores simples, el gist es simplemente el valor en sí.<\/span> <span class=\"sg\" data-s=\"1\">Para datos compuestos, <code>.gist<\/code> añade un poco de formato para que la estructura siga siendo legible:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un objeto de tipo — un valor que representa al tipo en sí — se muestra con gist como su nombre entre paréntesis, lo que facilita identificarlo en la salida:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"it":{"t":"Il metodo <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.gist<\/code> restituisce una rappresentazione del valore <strong>leggibile per l'uomo<\/strong> — la forma che vorresti <em>leggere<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È esattamente ciò che <code>say<\/code> (e <code>note<\/code>) stampano: chiamano <code>.gist<\/code> su ogni argomento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per valori semplici, il gist è semplicemente il valore stesso.<\/span> <span class=\"sg\" data-s=\"1\">Per dati composti, <code>.gist<\/code> aggiunge un po' di formattazione in modo che la struttura resti leggibile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un oggetto tipo — un valore che rappresenta il tipo stesso — viene mostrato da gist come il suo nome tra parentesi, il che lo rende facile da individuare nell'output:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"lv":{"t":"Metode <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.gist<\/code> atgriež <strong>cilvēkam draudzīgu<\/strong> vērtības attēlojumu — formu, ko jūs vēlētos <em>lasīt<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tieši to izdrukā <code>say<\/code> (un <code>note<\/code>): tās izsauc <code>.gist<\/code> katram argumentam.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienkāršām vērtībām kopsavilkums ir vienkārši pati vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Saliktu datu gadījumā <code>.gist<\/code> pievieno nelielu formatējumu, lai struktūra paliktu lasāma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipa objekts — vērtība, kas apzīmē pašu tipu — tiek attēlots kā tā nosaukums iekavās, kas atvieglo tā pamanīšanu izvadē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"ru":{"t":"Метод <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.gist<\/code> возвращает <strong>удобное для человека<\/strong> представление значения — ту форму, которую вы хотели бы <em>прочитать<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Именно это печатают <code>say<\/code> (и <code>note<\/code>): они вызывают <code>.gist<\/code> для каждого аргумента.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для простых значений gist — это просто само значение.<\/span> <span class=\"sg\" data-s=\"1\">Для составных данных <code>.gist<\/code> добавляет немного форматирования, чтобы структура оставалась читаемой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типовой объект — значение, которое представляет сам тип — отображается через gist как имя в скобках, что позволяет легко заметить его в выводе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"uk":{"t":"Метод <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.gist<\/code> повертає <strong>зручне для людини<\/strong> представлення значення — форму, яку ви хотіли б <em>прочитати<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Саме це друкують <code>say<\/code> (та <code>note<\/code>): вони викликають <code>.gist<\/code> для кожного аргументу.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для простих значень gist — це просто саме значення.<\/span> <span class=\"sg\" data-s=\"1\">Для складених даних <code>.gist<\/code> додає невелике форматування, щоб структура залишалася читабельною:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Об'єкт типу — значення, що представляє сам тип — відображається як його ім'я в дужках, що дозволяє легко помітити його у виводі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"bg":{"t":"Методът <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.gist<\/code> връща <strong>удобно за четене от човек<\/strong> представяне на стойност — формата, която бихте искали да <em>прочетете<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Точно това отпечатват <code>say<\/code> (и <code>note<\/code>): те извикват <code>.gist<\/code> за всеки аргумент.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За прости стойности gist е просто самата стойност.<\/span> <span class=\"sg\" data-s=\"1\">За съставни данни <code>.gist<\/code> добавя малко форматиране, за да остане структурата четима:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типов обект — стойност, която представлява самия тип — се показва чрез gist като името му в скоби, което улеснява разпознаването му в изхода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"eo":{"t":"La metodo <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.gist<\/code> redonas <strong>homlegeblan<\/strong> reprezenton de valoro — la formon, kiun vi volus <em>legi<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝuste tion <code>say<\/code> (kaj <code>note<\/code>) presas: ili vokas <code>.gist<\/code> sur ĉiu argumento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por simplaj valoroj la gist estas simple la valoro mem.<\/span> <span class=\"sg\" data-s=\"1\">Por kunmetitaj datumoj, <code>.gist<\/code> aldonas iom da formatado por ke la strukturo restu legebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipobjekto — valoro kiu reprezentas la tipon mem — estas montrata per <code>.gist<\/code> kiel sia nomo en krampoj, kio faciligas ĝian rekonon en la eligo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"la":{"t":"Methodus <code>.gist<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.gist<\/code> repraesentationem valoris <strong>homini amicam<\/strong> reddit — formam quam <em>legere<\/em> velles.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est exacte quod <code>say<\/code> (et <code>note<\/code>) imprimit: methodum <code>.gist<\/code> in quolibet argumento vocat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro valoribus simplicibus, gist est ipse valor.<\/span> <span class=\"sg\" data-s=\"1\">Pro datis compositis, <code>.gist<\/code> paulum formationis addit ut structura legibilis maneat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Obiectum typi — valor qui typum ipsum repraesentat — gist suum nomen in parenthesibus ostendit, quod facile in output animadverti potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]}}}</script>
