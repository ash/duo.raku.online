<script type="application/json" id="page-data">{"u":"advanced/representations/str","n":337,"k":"topic","pv":"advanced/representations/gist","nx":"advanced/representations/str/quiz","tr":["advanced","advanced/representations"],"L":{"en":{"t":"The <code>.Str<\/code> method","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>.Str<\/code> method returns the <strong>plain string<\/strong> form of a value.<\/span> <span class=\"sg\" data-s=\"1\">It is called whenever a value is used in <em>string context<\/em>: by <code>print<\/code> and <code>put<\/code>, by the <code>~<\/code> concatenation operator, and by string interpolation inside double quotes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notice that the array came back <strong>without the brackets<\/strong>, with its elements simply joined by spaces — that is the visible difference from <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, which keeps them.<\/span> <span class=\"sg\" data-s=\"1\">Compare the two side by side:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because interpolation uses <code>.Str<\/code>, an array placed inside a string is shown the plain way:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"de":{"t":"Die <code>.Str<\/code>-Methode","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.Str<\/code> gibt die <strong>einfache Stringform<\/strong> eines Wertes zurück.<\/span> <span class=\"sg\" data-s=\"1\">Sie wird aufgerufen, wann immer ein Wert im <em>Stringkontext<\/em> verwendet wird: durch <code>print<\/code> und <code>put<\/code>, durch den Verkettungsoperator <code>~<\/code> und durch Stringinterpolation in doppelten Anführungszeichen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass das Array <strong>ohne Klammern<\/strong> zurückkam, mit seinen Elementen einfach durch Leerzeichen verbunden — das ist der sichtbare Unterschied zu <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, das sie beibehält.<\/span> <span class=\"sg\" data-s=\"1\">Vergleiche die beiden nebeneinander:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da die Interpolation <code>.Str<\/code> verwendet, wird ein Array innerhalb eines Strings auf die einfache Art dargestellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"nl":{"t":"De <code>.Str<\/code>-methode","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>.Str<\/code>-methode geeft de <strong>gewone string<\/strong>-vorm van een waarde terug.<\/span> <span class=\"sg\" data-s=\"1\">Deze wordt aangeroepen wanneer een waarde in <em>stringcontext<\/em> wordt gebruikt: door <code>print<\/code> en <code>put<\/code>, door de <code>~<\/code> concatenatie-operator en door stringinterpolatie binnen dubbele aanhalingstekens.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de array <strong>zonder de vierkante haken<\/strong> terugkomt, met de elementen eenvoudig door spaties gescheiden — dat is het zichtbare verschil met <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, dat ze wel behoudt.<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk de twee naast elkaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat interpolatie <code>.Str<\/code> gebruikt, wordt een array in een string op de gewone manier weergegeven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"es":{"t":"El método <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>.Str<\/code> devuelve la forma de <strong>cadena simple<\/strong> de un valor.<\/span> <span class=\"sg\" data-s=\"1\">Se invoca siempre que un valor se usa en <em>contexto de cadena<\/em>: por <code>print<\/code> y <code>put<\/code>, por el operador de concatenación <code>~<\/code>, y por la interpolación dentro de comillas dobles.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Observa que el arreglo regresó <strong>sin los corchetes<\/strong>, con sus elementos simplemente unidos por espacios — esa es la diferencia visible con <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, que los conserva.<\/span> <span class=\"sg\" data-s=\"1\">Compara los dos lado a lado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como la interpolación usa <code>.Str<\/code>, un arreglo colocado dentro de una cadena se muestra de la forma simple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"it":{"t":"Il metodo <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.Str<\/code> restituisce la forma <strong>stringa semplice<\/strong> di un valore.<\/span> <span class=\"sg\" data-s=\"1\">Viene chiamato ogni volta che un valore è usato in <em>contesto stringa<\/em>: da <code>print<\/code> e <code>put<\/code>, dall'operatore di concatenazione <code>~<\/code> e dall'interpolazione di stringhe tra virgolette doppie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che l'array è stato restituito <strong>senza le parentesi quadre<\/strong>, con i suoi elementi semplicemente uniti da spazi — questa è la differenza visibile rispetto a <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, che le mantiene.<\/span> <span class=\"sg\" data-s=\"1\">Confronta i due fianco a fianco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché l'interpolazione usa <code>.Str<\/code>, un array inserito all'interno di una stringa viene mostrato nella forma semplice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"lv":{"t":"Metode <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.Str<\/code> atgriež <strong>vienkāršu virknes<\/strong> formu vērtībai.<\/span> <span class=\"sg\" data-s=\"1\">Tā tiek izsaukta ikreiz, kad vērtība tiek izmantota <em>virknes kontekstā<\/em>: ar <code>print<\/code> un <code>put<\/code>, ar <code>~<\/code> konkatenācijas operatoru un ar virknes interpolāciju dubultpēdiņās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka masīvs tika atgriezts <strong>bez iekavām<\/strong>, ar elementiem, kas vienkārši savienoti ar atstarpēm — tā ir redzamā atšķirība no <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, kas tās saglabā.<\/span> <span class=\"sg\" data-s=\"1\">Salīdziniet abus blakus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā interpolācija izmanto <code>.Str<\/code>, masīvs, kas ievietots virknē, tiek parādīts vienkāršajā veidā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"ru":{"t":"Метод <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.Str<\/code> возвращает <strong>простую строковую<\/strong> форму значения.<\/span> <span class=\"sg\" data-s=\"1\">Он вызывается каждый раз, когда значение используется в <em>строковом контексте<\/em>: функциями <code>print<\/code> и <code>put<\/code>, оператором конкатенации <code>~<\/code> и при интерполяции внутри двойных кавычек.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что массив вернулся <strong>без скобок<\/strong>, его элементы просто соединены пробелами — в этом видимое отличие от <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, который их сохраняет.<\/span> <span class=\"sg\" data-s=\"1\">Сравните два варианта рядом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку интерполяция использует <code>.Str<\/code>, массив, помещённый внутрь строки, отображается в простом виде:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"uk":{"t":"Метод <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.Str<\/code> повертає <strong>просту рядкову<\/strong> форму значення.<\/span> <span class=\"sg\" data-s=\"1\">Він викликається щоразу, коли значення використовується в <em>рядковому контексті<\/em>: функціями <code>print<\/code> та <code>put<\/code>, оператором конкатенації <code>~<\/code> та при інтерполяції рядків у подвійних лапках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що масив повернувся <strong>без дужок<\/strong>, з елементами, просто з'єднаними пробілами — це видима відмінність від <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, який їх зберігає.<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте два методи поруч:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки інтерполяція використовує <code>.Str<\/code>, масив, розміщений усередині рядка, відображається у простому вигляді:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"bg":{"t":"Методът <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.Str<\/code> връща формата на <strong>обикновен низ<\/strong> на стойността.<\/span> <span class=\"sg\" data-s=\"1\">Той се извиква, когато стойност се използва в <em>контекст на низ<\/em>: от <code>print<\/code> и <code>put<\/code>, от оператора за конкатенация <code>~<\/code> и от интерполацията на низове вътре в двойни кавички.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че масивът се върна <strong>без скобите<\/strong>, с елементите му просто свързани с интервали — това е видимата разлика от <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, който ги запазва.<\/span> <span class=\"sg\" data-s=\"1\">Сравнете двата един до друг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като интерполацията използва <code>.Str<\/code>, масив, поставен вътре в низ, се показва по обикновения начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"eo":{"t":"La metodo <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.Str<\/code> redonas la <strong>simplan ĉen<\/strong>-formon de valoro.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas vokita kiam ajn valoro estas uzata en <em>ĉenkonteksto<\/em>: de <code>print<\/code> kaj <code>put<\/code>, de la kunmeta operatoro <code>~<\/code>, kaj de ĉeninterpolado ene de duoblaj citiloj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke la tabelo revenis <strong>sen la krampoj<\/strong>, kun siaj elementoj simple kunigitaj per spacoj — tio estas la videbla diferenco de <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, kiu konservas ilin.<\/span> <span class=\"sg\" data-s=\"1\">Komparu la du flankon ĉe flanko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar interpolado uzas <code>.Str<\/code>, tabelo metita ene de ĉeno estas montrata en la simpla maniero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"la":{"t":"Methodus <code>.Str<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.Str<\/code> formam <strong>seriei planae<\/strong> valoris reddit.<\/span> <span class=\"sg\" data-s=\"1\">Vocatur quotienscumque valor in <em>contextu serierum<\/em> adhibetur: a <code>print<\/code> et <code>put<\/code>, ab operatore concatenationis <code>~<\/code>, et per interpolationem serierum intra signa citationis duplicia.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod ordo <strong>sine uncis<\/strong> rediit, elementis simpliciter spatiis iunctis — haec est differentia visibilis a <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, quae eos retinet.<\/span> <span class=\"sg\" data-s=\"1\">Compara ambos iuxta positos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia interpolatio <code>.Str<\/code> adhibet, ordo intra seriem insertus modo plano ostenditur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]}}}</script>
