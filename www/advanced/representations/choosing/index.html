<script type="application/json" id="page-data">{"u":"advanced/representations/choosing","n":340,"k":"topic","pv":"advanced/representations/raku-method","nx":"advanced/dd","tr":["advanced","advanced/representations"],"L":{"en":{"t":"Choosing the right one","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">For everyday scalars such as numbers and strings, all three representations look the same.<\/span> <span class=\"sg\" data-s=\"1\">They start to differ for compound or undefined values.<\/span> <span class=\"sg\" data-s=\"2\">Here is a <code>Pair<\/code> shown three ways:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A rough rule of thumb:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — for output meant to be <em>read<\/em> by a person (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — for output that is <em>plain text<\/em> (<code>print<\/code>, <code>put<\/code>, interpolation, the <code>~<\/code> operator).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — for a <em>code-like<\/em> representation while debugging (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Every one of these methods can be given your own definition when you write a class, so your own objects print nicely too.<\/span> <span class=\"sg\" data-s=\"1\">We return to that when we <a href=\"/oop/classes/\">create classes<\/a> in the next part.<\/span><\/p>"]]},"de":{"t":"Die richtige Methode wählen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bei alltäglichen Skalaren wie Zahlen und Strings sehen alle drei Darstellungen gleich aus.<\/span> <span class=\"sg\" data-s=\"1\">Sie beginnen sich bei zusammengesetzten oder undefinierten Werten zu unterscheiden.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist ein <code>Pair<\/code>, auf drei Arten dargestellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine grobe Faustregel:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — für Ausgaben, die von einer Person <em>gelesen<\/em> werden sollen (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — für Ausgaben, die <em>reiner Text<\/em> sind (<code>print<\/code>, <code>put<\/code>, Interpolation, der Operator <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — für eine <em>codeähnliche<\/em> Darstellung beim Debuggen (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede dieser Methoden kann in eigenen Klassen mit einer eigenen Definition versehen werden, sodass auch eigene Objekte schön ausgegeben werden.<\/span> <span class=\"sg\" data-s=\"1\">Darauf kommen wir zurück, wenn wir im nächsten Teil <a href=\"https://course.raku.org/de/oop/classes/\" target=\"_blank\" rel=\"noopener\">Klassen erstellen<\/a>.<\/span><\/p>"]]},"nl":{"t":"De juiste kiezen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Voor alledaagse scalaire waarden zoals getallen en strings zien alle drie de representaties er hetzelfde uit.<\/span> <span class=\"sg\" data-s=\"1\">Ze beginnen te verschillen bij samengestelde of ongedefinieerde waarden.<\/span> <span class=\"sg\" data-s=\"2\">Hier is een <code>Pair<\/code> op drie manieren weergegeven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een grove vuistregel:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — voor uitvoer bedoeld om door een persoon <em>gelezen<\/em> te worden (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — voor uitvoer die <em>platte tekst<\/em> is (<code>print<\/code>, <code>put<\/code>, interpolatie, de <code>~<\/code> operator).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — voor een <em>codeachtige<\/em> representatie bij het debuggen (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk van deze methodes kan je eigen definitie krijgen wanneer je een klasse schrijft, zodat je eigen objecten ook netjes worden afgedrukt.<\/span> <span class=\"sg\" data-s=\"1\">Daar komen we op terug wanneer we <a href=\"https://course.raku.org/nl/oop/classes/\" target=\"_blank\" rel=\"noopener\">klassen maken<\/a> in het volgende deel.<\/span><\/p>"]]},"es":{"t":"Eligiendo el correcto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Para escalares comunes como números y cadenas, las tres representaciones se ven iguales.<\/span> <span class=\"sg\" data-s=\"1\">Empiezan a diferir con valores compuestos o indefinidos.<\/span> <span class=\"sg\" data-s=\"2\">Aquí tienes un <code>Pair<\/code> mostrado de tres formas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una regla general aproximada:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — para salida destinada a ser <em>leída<\/em> por una persona (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — para salida que es <em>texto plano<\/em> (<code>print<\/code>, <code>put<\/code>, interpolación, el operador <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — para una representación <em>similar a código<\/em> durante la depuración (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada uno de estos métodos puede recibir tu propia definición cuando escribes una clase, de modo que tus propios objetos también se impriman de forma legible.<\/span> <span class=\"sg\" data-s=\"1\">Volveremos a esto cuando <a href=\"https://course.raku.org/es/oop/classes/\" target=\"_blank\" rel=\"noopener\">creemos clases<\/a> en la siguiente parte.<\/span><\/p>"]]},"it":{"t":"Scegliere quello giusto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per gli scalari di uso comune come numeri e stringhe, tutte e tre le rappresentazioni hanno lo stesso aspetto.<\/span> <span class=\"sg\" data-s=\"1\">Iniziano a differire per valori composti o indefiniti.<\/span> <span class=\"sg\" data-s=\"2\">Ecco un <code>Pair<\/code> mostrato in tre modi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una regola generale approssimativa:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — per output destinato a essere <em>letto<\/em> da una persona (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — per output che è <em>testo semplice<\/em> (<code>print<\/code>, <code>put<\/code>, interpolazione, l'operatore <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — per una rappresentazione <em>simile al codice<\/em> durante il debug (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ciascuno di questi metodi può ricevere una tua definizione personalizzata quando scrivi una classe, così anche i tuoi oggetti vengono stampati in modo leggibile.<\/span> <span class=\"sg\" data-s=\"1\">Torneremo su questo argomento quando <a href=\"https://course.raku.org/it/oop/classes/\" target=\"_blank\" rel=\"noopener\">creeremo le classi<\/a> nella parte successiva.<\/span><\/p>"]]},"lv":{"t":"Pareizā metode","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ikdienišķiem skalāriem, piemēram, skaitļiem un virknēm, visi trīs atveidojumi izskatās vienādi.<\/span> <span class=\"sg\" data-s=\"1\">Tie sāk atšķirties saliktām vai nedefinētām vērtībām.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir <code>Pair<\/code> trijos veidos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aptuvens īkšķa likums:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — izvadei, ko paredzēts <em>lasīt<\/em> cilvēkam (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — izvadei, kas ir <em>vienkāršs teksts<\/em> (<code>print<\/code>, <code>put<\/code>, interpolācija, operators <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — <em>kodam līdzīgam<\/em> atveidojumam atkļūdošanas laikā (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ikvienai no šīm metodēm, rakstot klasi, var dot savu definīciju, tā ka arī jūsu paša objekti izdrukājas glīti.<\/span> <span class=\"sg\" data-s=\"1\">Pie tā atgriezīsimies, kad nākamajā daļā <a href=\"https://course.raku.org/lv/oop/classes/\" target=\"_blank\" rel=\"noopener\">veidosim klases<\/a>.<\/span><\/p>"]]},"ru":{"t":"Выбор подходящего метода","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Для обычных скалярных значений, таких как числа и строки, все три представления выглядят одинаково.<\/span> <span class=\"sg\" data-s=\"1\">Различия начинаются для составных или неопределённых значений.<\/span> <span class=\"sg\" data-s=\"2\">Вот <code>Pair<\/code>, показанный тремя способами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приблизительное правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — для вывода, который предназначен для <em>чтения<\/em> человеком (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — для вывода в виде <em>простого текста<\/em> (<code>print<\/code>, <code>put<\/code>, интерполяция, оператор <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — для <em>кодоподобного<\/em> представления при отладке (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый из этих методов можно переопределить при написании класса, чтобы ваши собственные объекты печатались красиво.<\/span> <span class=\"sg\" data-s=\"1\">Мы вернёмся к этому, когда будем <a href=\"https://course.raku.org/ru/oop/classes/\" target=\"_blank\" rel=\"noopener\">создавать классы<\/a> в следующей части.<\/span><\/p>"]]},"uk":{"t":"Вибір правильного методу","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Для повсякденних скалярних значень, таких як числа та рядки, усі три представлення виглядають однаково.<\/span> <span class=\"sg\" data-s=\"1\">Вони починають відрізнятися для складених або невизначених значень.<\/span> <span class=\"sg\" data-s=\"2\">Ось <code>Pair<\/code>, показаний трьома способами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Загальне правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — для виводу, призначеного для <em>читання<\/em> людиною (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — для виводу, який є <em>простим текстом<\/em> (<code>print<\/code>, <code>put<\/code>, інтерполяція, оператор <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — для <em>подібного до коду<\/em> представлення під час налагодження (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен із цих методів може мати вашу власну реалізацію, коли ви пишете клас, тому ваші власні об'єкти теж будуть гарно друкуватися.<\/span> <span class=\"sg\" data-s=\"1\">Ми повернемося до цього, коли будемо <a href=\"https://course.raku.org/uk/oop/classes/\" target=\"_blank\" rel=\"noopener\">створювати класи<\/a> у наступній частині.<\/span><\/p>"]]},"bg":{"t":"Избор на правилния метод","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За обичайни скалари като числа и низове и трите представяния изглеждат еднакво.<\/span> <span class=\"sg\" data-s=\"1\">Те започват да се различават при съставни или недефинирани стойности.<\/span> <span class=\"sg\" data-s=\"2\">Ето една <code>Pair<\/code>, показана по три начина:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Едно общо правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — за изход, предназначен да бъде <em>четен<\/em> от човек (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — за изход, който е <em>обикновен текст<\/em> (<code>print<\/code>, <code>put<\/code>, интерполация, оператор <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — за представяне, <em>подобно на код<\/em>, при дебъгване (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки от тези методи може да получи ваша собствена дефиниция, когато пишете клас, така че вашите обекти също ще се отпечатват добре.<\/span> <span class=\"sg\" data-s=\"1\">Ще се върнем към това, когато <a href=\"https://course.raku.org/bg/oop/classes/\" target=\"_blank\" rel=\"noopener\">създаваме класове<\/a> в следващата част.<\/span><\/p>"]]},"eo":{"t":"Elekti la ĝustan","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por ĉiutagaj skalaroj kiel nombroj kaj ĉenoj, ĉiuj tri reprezentoj aspektas same.<\/span> <span class=\"sg\" data-s=\"1\">Ili komencas diferenci por kunmetitaj aŭ nedifinitaj valoroj.<\/span> <span class=\"sg\" data-s=\"2\">Jen <code>Pair<\/code> montrata en tri manieroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Proksimuma gvidregulo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — por eligo destinita por esti <em>legata<\/em> de persono (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — por eligo kiu estas <em>simpla teksto<\/em> (<code>print<\/code>, <code>put<\/code>, interpolado, la operatoro <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — por <em>kodosimila<\/em> reprezento dum sencimigo (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu el ĉi tiuj metodoj povas ricevi vian propran difinon kiam vi skribas klason, por ke viaj propraj objektoj ankaŭ presu bele.<\/span> <span class=\"sg\" data-s=\"1\">Ni revenos al tio kiam ni <a href=\"/oop/classes/\">kreos klasojn<\/a> en la sekva parto.<\/span><\/p>"]]},"la":{"t":"Rectam eligere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pro scalaribus quotidianis ut numeris et seriebus, omnes tres repraesentationes idem apparent.<\/span> <span class=\"sg\" data-s=\"1\">Differre incipiunt pro valoribus compositis vel indefinitis.<\/span> <span class=\"sg\" data-s=\"2\">Hic est <code>Pair<\/code> tribus modis ostensus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Regula approximata:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — pro output quod ab homine <em>legendum<\/em> est (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — pro output quod <em>textus planus<\/em> est (<code>print<\/code>, <code>put<\/code>, interpolatio, operator <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — pro repraesentatione <em>codici simili<\/em> dum errores corrigis (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaelibet harum methodorum propriam definitionem accipere potest cum classem scribis, ut obiecta tua quoque pulchre imprimantur.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc redibimus cum <a href=\"/oop/classes/\">classes creamus<\/a> in parte sequenti.<\/span><\/p>"]]}}}</script>
