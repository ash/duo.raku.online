<script type="application/json" id="page-data">{"u":"advanced/operator-types/quiz3","n":532,"k":"quiz","pv":"advanced/operator-types/quiz2","nx":"advanced/operators-overview","tr":["advanced","advanced/operator-types"],"L":{"en":{"t":"Quiz — A word operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>x<\/code> operator repeats a string, so <code>'ab' x 3<\/code> gives <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sitting between its two operands, what category does <code>x<\/code> belong to?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">What counts is position, not whether the operator is a symbol or a word.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> sits <em>between<\/em> two operands, so it is an <strong>infix<\/strong> operator — just like <code>+<\/code> or <code>~<\/code>, only spelled as a letter.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Ein Wort-Operator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Operator <code>x<\/code> wiederholt einen String, sodass <code>'ab' x 3<\/code> das Ergebnis <code>'ababab'<\/code> liefert.<\/span> <span class=\"sg\" data-s=\"1\">Da er zwischen seinen beiden Operanden steht, welcher Kategorie gehört <code>x<\/code> an?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entscheidend ist die Position, nicht ob der Operator ein Symbol oder ein Wort ist.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> steht <em>zwischen<\/em> zwei Operanden und ist daher ein <strong>Infix<\/strong>-Operator — genau wie <code>+<\/code> oder <code>~<\/code>, nur als Buchstabe geschrieben.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Een woordoperator","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>x<\/code>-operator herhaalt een string, dus <code>'ab' x 3<\/code> geeft <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tussen zijn twee operanden geplaatst, tot welke categorie behoort <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wat telt is de positie, niet of de operator een symbool of een woord is.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> staat <em>tussen<\/em> twee operanden, dus het is een <strong>infix<\/strong>-operator — net als <code>+<\/code> of <code>~<\/code>, alleen geschreven als een letter.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Un operador de palabra","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El operador <code>x<\/code> repite una cadena, de modo que <code>'ab' x 3<\/code> da <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Al situarse entre sus dos operandos, a que categoría pertenece <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo que importa es la posición, no si el operador es un símbolo o una palabra.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> se situa <em>entre<\/em> dos operandos, por lo que es un operador <strong>infijo<\/strong>, igual que <code>+<\/code> o <code>~<\/code>, solo que se escribe con una letra.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Un operatore parola","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'operatore <code>x<\/code> ripete una stringa, quindi <code>'ab' x 3<\/code> produce <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Trovandosi tra i suoi due operandi, a quale categoria appartiene <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ciò che conta è la posizione, non se l'operatore è un simbolo o una parola.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> si trova <em>tra<\/em> due operandi, quindi è un operatore <strong>infisso<\/strong>, proprio come <code>+<\/code> o <code>~<\/code>, solo scritto come una lettera.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Vārdu operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operators <code>x<\/code> atkārto virkni, tāpēc <code>'ab' x 3<\/code> dod <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atrodoties starp diviem operandiem, kādai kategorijai pieder <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Svarīga ir pozīcija, nevis tas, vai operators ir simbols vai vārds.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> atrodas <em>starp<\/em> diviem operandiem, tāpēc tas ir <strong>infiksa<\/strong> operators — tāpat kā <code>+<\/code> vai <code>~<\/code>, tikai rakstīts kā burts.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Словесный оператор","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>x<\/code> повторяет строку, поэтому <code>'ab' x 3<\/code> даёт <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Находясь между двумя операндами, к какой категории принадлежит <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Важна позиция, а не то, является ли оператор символом или словом.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> стоит <em>между<\/em> двумя операндами, поэтому это <strong>инфиксный<\/strong> оператор — точно так же, как <code>+<\/code> или <code>~<\/code>, только записанный буквой.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Оператор-слово","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>x<\/code> повторює рядок, тож <code>'ab' x 3<\/code> дає <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стоячи між двома своїми операндами, до якої категорії належить <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Важить позиція, а не те, чи є оператор символом, чи словом.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> стоїть <em>між<\/em> двома операндами, тож він є <strong>інфіксним<\/strong> оператором — так само як <code>+<\/code> чи <code>~<\/code>, тільки записаним літерою.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Оператор-дума","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>x<\/code> повтаря низ, така че <code>'ab' x 3<\/code> дава <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стоейки между двата си операнда, към коя категория принадлежи <code>x<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Важна е позицията, а не дали операторът е символ или дума.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> стои <em>между<\/em> два операнда, така че е <strong>инфиксен<\/strong> оператор — точно като <code>+<\/code> или <code>~<\/code>, само че е изписан с буква.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Operator verbalis","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator <code>x<\/code> filum repetit, itaque <code>'ab' x 3<\/code> dat <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Inter duos operandos suos sedens, ad quam categoriam <code>x<\/code> pertinet?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quod interest est positio, non utrum operator symbolum sit an verbum.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> <em>inter<\/em> duos operandos sedet, ergo operator <strong>infixus<\/strong> est — sicut <code>+<\/code> vel <code>~<\/code>, tantum ut littera scriptus.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
