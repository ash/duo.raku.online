stfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A postfix operator comes <em>after<\/em> a single operand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> and <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A circumfix operator <em>surrounds<\/em> its operand.<\/span> <span class=\"sg\" data-s=\"1\">The square brackets that build an array are a circumfix operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A postcircumfix operator surrounds something but follows a term.<\/span> <span class=\"sg\" data-s=\"1\">Subscripting is a postcircumfix operator — the <code>[1]<\/code> after <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">These names — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code>, and <code>postcircumfix<\/code> — are the same words Raku uses when you <a href=\"/advanced/user-defined-operators/\">declare a new operator<\/a>, as you will see later.<\/span><\/p>"]]},"de":{"t":"Typen von Raku-Operatoren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie haben bereits viele Operatoren verwendet — <code>+<\/code>, <code>~<\/code>, <code>++<\/code> und so weiter.<\/span> <span class=\"sg\" data-s=\"1\">In Raku werden Operatoren danach klassifiziert, <em>wo<\/em> sie relativ zu ihren Operanden stehen.<\/span> <span class=\"sg\" data-s=\"2\">Die Kenntnis dieser Kategorien hilft Ihnen später, wenn Sie eigene Operatoren definieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Präfix-Operator steht <em>vor<\/em> einem einzelnen Operanden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier negiert <code>-<\/code> die Zahl und <code>?<\/code> wandelt einen Wert in seinen Booleschen Wert um.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Infix-Operator steht <em>zwischen<\/em> zwei Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Die meisten bekannten Arithmetik- und String-Operatoren sind Infix-Operatoren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Infix-Operator ist nicht immer ein Satzzeichen — er kann auch ein Wort sein.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>gcd<\/code>, den Sie bei den <a href=\"https://course.raku.org/de/advanced/integers/\" target=\"_blank\" rel=\"noopener\">ganzen Zahlen<\/a> kennengelernt haben, ist zum Beispiel ein Infix-Operator, der als Name zwischen seinen beiden Operanden steht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Postfix-Operator steht <em>nach<\/em> einem einzelnen Operanden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> und <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Circumfix-Operator <em>umschließt<\/em> seinen Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Die eckigen Klammern, die ein Array erzeugen, sind ein Circumfix-Operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" dat fix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un operador postfijo va <em>después<\/em> de un único operando:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> y <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operador circumfijo <em>rodea<\/em> su operando.<\/span> <span class=\"sg\" data-s=\"1\">Los corchetes que construyen un arreglo son un operador circumfijo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operador postcircumfijo rodea algo pero sigue a un termino.<\/span> <span class=\"sg\" data-s=\"1\">La indexación es un operador postcircumfijo: el <code>[1]<\/code> después de <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estos nombres — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> y <code>postcircumfix<\/code> — son las mismas palabras que Raku utiliza cuando <a href=\"https://course.raku.org/es/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">declaras un nuevo operador<\/a>, como verás más adelante.<\/span><\/p>"]]},"it":{"t":"Tipi di operatori Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hai già utilizzato molti operatori: <code>+<\/code>, <code>~<\/code>, <code>++<\/code> e così via.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, gli operatori sono classificati in base a <em>dove<\/em> si trovano rispetto ai loro operandi.<\/span> <span class=\"sg\" data-s=\"2\">Conoscere le categorie è utile in seguito, quando definirai operatori personalizzati.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un operatore prefisso viene <em>prima<\/em> di un singolo operando:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>-<\/code> nega il numero e <code>?<\/code> converte un valore nel suo Booleano.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operatore infisso si trova <em>tra<\/em> due operandi.<\/span> <span class=\"sg\" data-s=\"1\">La maggior parte degli operatori aritmetici e di stringa familiari sono infissi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operatore infisso non è sempre un simbolo di punteggiatura: può essere una parola.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore <code>gcd<\/code> che hai incontrato con gli <a href=\"https://course.raku.org/it/advanced/integers/\" target=\"_blank\" rel=\"noopener\">interi<\/a>, ad esempio, è un operatore infisso scritto come nome tra i suoi due operandi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un operatore postfisso viene <em>dopo<\/em> un singolo operando:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> e <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operatore circumfisso <em>circonda<\/em> il suo operando.<\/span> <span class=\"sg\" data-s=\"1\">Le parentesi quadre che costruiscono un array sono un operatore circumfisso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un operatore postcircumfisso circonda qualcosa ma segue un termine.<\/span> <span class=\"sg\" data-s=\"1\">L'indicizzazione è un operatore postcircumfisso: il <code>[1]<\/code> dopo <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questi nomi, <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> e <code>postcircumfix<\/code>, sono le stesse parole che Raku utilizza quando <a href=\"https://course.raku.org/it/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">dichiari un nuovo operatore<\/a>, come vedrai in seguito.<\/span><\/p>"]]},"lv":{"t":"Raku operatoru tipi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat lietojuši daudzus operatorus — <code>+<\/code>, <code>~<\/code>, <code>++<\/code> un citus.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā operatorus klasificē pēc tā, <em>kur<\/em> tie atrodas attiecībā pret saviem operandiem.<\/span> <span class=\"sg\" data-s=\"2\">Kategoriju pārzināšana noderēs vēlāk, kad jūs definēsiet savus operatorus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prefiksa operators atrodas <em>pirms<\/em> viena operanda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>-<\/code> apgriež skaitļa zīmi, bet <code>?<\/code> pārvērš vērtību tās Būla izteiksmē.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Infiksa operators atrodas <em>starp<\/em> diviem operandiem.<\/span> <span class=\"sg\" data-s=\"1\">Lielākā daļa pazīstamo aritmētisko un virkņu operatoru ir infiksa operatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Infiksa operators ne vienmēr ir pieturzīme — tas var būt vārds.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, operators <code>gcd<\/code>, ar kuru jūs iepazināties, apskatot <a href=\"https://course.raku.org/lv/advanced/integers/\" target=\"_blank\" rel=\"noopener\">veselus skaitļus<\/a>, ir infiksa operators, kas rakstīts kā nosaukums starp diviem operandiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operators atrodas <em>aiz<\/em> viena operanda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> un <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cirkumfiksa operators <em>aptver<\/em> savu operandu.<\/span> <span class=\"sg\" data-s=\"1\">Kvadrātiekavas, kas veido masīvu, ir cirkumfiksa operators:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postcirkumfiksa operators aptver kaut ko, bet seko aiz terma.<\/span> <span class=\"sg\" data-s=\"1\">Indeksēšana ir postcirkumfiksa operators — <code>[1]<\/code> aiz <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šie nosaukumi — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> un <code>postcircumfix<\/code> — ir tie paši vārdi, ko Raku lieto, kad jūs <a href=\"https://course.raku.org/lv/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">deklarējat jaunu operatoru<\/a>, kā jūs redzēsiet vēlāk.<\/span><\/p>"]]},"ru":{"t":"Типы операторов Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали множество операторов — <code>+<\/code>, <code>~<\/code>, <code>++<\/code> и другие.<\/span> <span class=\"sg\" data-s=\"1\">В Raku операторы классифицируются по тому, <em>где<\/em> они расположены относительно своих операндов.<\/span> <span class=\"sg\" data-s=\"2\">Знание категорий пригодится позже, когда вы будете определять собственные операторы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксный оператор стоит <em>перед<\/em> единственным операндом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-<\/code> меняет знак числа, а <code>?<\/code> преобразует значение в его булево представление.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Инфиксный оператор стоит <em>между<\/em> двумя операндами.<\/span> <span class=\"sg\" data-s=\"1\">Большинство знакомых арифметических и строковых операторов являются инфиксными:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Инфиксный оператор не обязательно является символом пунктуации — он может быть словом.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>gcd<\/code>, с которым вы встречались при изучении <a href=\"https://course.raku.org/ru/advanced/integers/\" target=\"_blank\" rel=\"noopener\">целых чисел<\/a>, например, является инфиксным оператором, записанным как имя между двумя операндами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постфиксный оператор стоит <em>после<\/em> единственного операнда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> и <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Циркумфиксный оператор <em>окружает<\/em> свой операнд.<\/span> <span class=\"sg\" data-s=\"1\">Квадратные скобки, создающие массив, являются циркумфиксным оператором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постциркумфиксный оператор окружает что-то, но следует за термом.<\/span> <span class=\"sg\" data-s=\"1\">Обращение по индексу является постциркумфиксным оператором — <code>[1]<\/code> после <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эти названия — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> и <code>postcircumfix<\/code> — это те же слова, которые Raku использует при <a href=\"https://course.raku.org/ru/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">объявлении нового оператора<\/a>, как вы увидите позже.<\/span><\/p>"]]},"uk":{"t":"Типи операторів Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися багатьма операторами — <code>+<\/code>, <code>~<\/code>, <code>++<\/code> тощо.<\/span> <span class=\"sg\" data-s=\"1\">У Raku оператори класифікують за тим, <em>де<\/em> вони стоять відносно своїх операндів.<\/span> <span class=\"sg\" data-s=\"2\">Знання цих категорій стане в пригоді згодом, коли ви визначатимете власні оператори.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префіксний оператор стоїть <em>перед<\/em> єдиним операндом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут <code>-<\/code> змінює знак числа, а <code>?<\/code> перетворює значення на його булевий відповідник.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інфіксний оператор стоїть <em>між<\/em> двома операндами.<\/span> <span class=\"sg\" data-s=\"1\">Більшість знайомих арифметичних і рядкових операторів є інфіксними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інфіксний оператор не завжди є розділовим знаком — ним може бути й слово.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>gcd<\/code>, з яким ви познайомилися в темі про <a href=\"https://course.raku.org/uk/advanced/integers/\" target=\"_blank\" rel=\"noopener\">цілі числа<\/a>, наприклад, є інфіксним оператором, записаним як ім'я між двома операндами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постфіксний оператор стоїть <em>після<\/em> єдиного операнда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> та <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Циркумфіксний оператор <em>оточує<\/em> свій операнд.<\/span> <span class=\"sg\" data-s=\"1\">Квадратні дужки, що будують масив, є циркумфіксним оператором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постциркумфіксний оператор оточує щось, але стоїть після терма.<\/span> <span class=\"sg\" data-s=\"1\">Індексування є постциркумфіксним оператором — це <code>[1]<\/code> після <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ці назви — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> та <code>postcircumfix<\/code> — є тими самими словами, які Raku використовує, коли ви <a href=\"https://course.raku.org/uk/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">оголошуєте новий оператор<\/a>, як побачите згодом.<\/span><\/p>"]]},"bg":{"t":"Видове оператори в Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали много оператори — <code>+<\/code>, <code>~<\/code>, <code>++<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"1\">В Raku операторите се класифицират по <em>позицията<\/em> им спрямо операндите.<\/span> <span class=\"sg\" data-s=\"2\">Познаването на категориите помага по-нататък, когато дефинирате собствени оператори.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксният оператор стои <em>преди<\/em> единичен операнд:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук <code>-<\/code> обръща знака на числото, а <code>?<\/code> превръща стойност в нейната булева стойност.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Инфиксният оператор стои <em>между<\/em> два операнда.<\/span> <span class=\"sg\" data-s=\"1\">Повечето познати аритметични и низови оператори са инфиксни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Инфиксният оператор не винаги е пунктуационен символ — може да бъде и дума.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>gcd<\/code>, който срещнахте при <a href=\"https://course.raku.org/bg/advanced/integers/\" target=\"_blank\" rel=\"noopener\">целите числа<\/a>, например, е инфиксен оператор, записан като име между двата си операнда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постфиксният оператор стои <em>след<\/em> единичен операнд:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> и <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Циркумфиксният оператор <em>обгражда<\/em> своя операнд.<\/span> <span class=\"sg\" data-s=\"1\">Квадратните скоби, с които се създава масив, са циркумфиксен оператор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постциркумфиксният оператор обгражда нещо, но следва терм.<\/span> <span class=\"sg\" data-s=\"1\">Индексирането е постциркумфиксен оператор — <code>[1]<\/code> след <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тези имена — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> и <code>postcircumfix<\/code> — са същите думи, които Raku използва, когато <a href=\"https://course.raku.org/bg/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">декларирате нов оператор<\/a>, както ще видите по-нататък.<\/span><\/p>"]]},"la":{"t":"Genera operatorum Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iam multos operatores adhibuisti — <code>+<\/code>, <code>~<\/code>, <code>++<\/code>, et cetera.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, operatores classificantur secundum <em>ubi<\/em> se ponunt relative ad operandos suos.<\/span> <span class=\"sg\" data-s=\"2\">Cognoscere categorias postea iuvat, cum operatores tuos proprios definies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operator praefixus <em>ante<\/em> unum operandum venit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>-<\/code> numerum negat et <code>?<\/code> valorem in Booleanum suum convertit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator infixus <em>inter<\/em> duos operandos sedet.<\/span> <span class=\"sg\" data-s=\"1\">Plerique noti operatores arithmetici et filorum sunt infixi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator infixus non semper symbolum interpunctionis est — verbum esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Operator <code>gcd<\/code> quem cum <a href=\"https://course.raku.org/la/advanced/integers/\" target=\"_blank\" rel=\"noopener\">integris<\/a> invenisti, exempli gratia, operator infixus est qui ut nomen inter duos operandos suos scribitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operator postfixus <em>post<\/em> unum operandum venit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> et <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator circumfixus operandum suum <em>circumdat<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Uncis quadratis qui ordinem construunt operator circumfixus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator postcircumfixus aliquid circumdat sed terminum sequitur.<\/span> <span class=\"sg\" data-s=\"1\">Subscriptio operator postcircumfixus est — <code>[1]<\/code> post <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec nomina — <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code>, et <code>postcircumfix<\/code> — eadem verba sunt quae Raku adhibet cum <a href=\"https://course.raku.org/la/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">novum operatorem declaras<\/a>, ut postea videbis.<\/span><\/p>"]]}}}</script>
