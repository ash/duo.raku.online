<script type="application/json" id="page-data">{"u":"advanced/signatures/exercises/slurpy-hash/solution","n":634,"k":"solution","pv":"advanced/signatures/exercises/slurpy-hash","nx":"advanced/signatures/quiz","tr":["advanced","advanced/signatures"],"L":{"en":{"t":"The solution of ’Slurpy named arguments‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub describe($name, *%opts) {\n    my $details = %opts.sort.map({ \"{.key}={.value}\" }).join(', ');\n    \"$name: $details\";\n}\n\nsay describe('Anna', colour =&gt; 'red', size =&gt; 5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/slurpy-hash.raku\" target=\"_blank\" rel=\"noopener\">slurpy-hash.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The fixed positional parameter <code>$name<\/code> is filled first, and the slurpy <code>*%opts<\/code> then gathers every remaining named argument into a hash.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> orders the pairs by key, so the output is deterministic — <code>colour<\/code> comes before <code>size<\/code>. The <code>.map<\/code> turns each pair into a <code>key=value<\/code> string with <code>.key<\/code> and <code>.value<\/code>, and <code>.join(', ')<\/code> glues them together.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The final string interpolates <code>$name<\/code> and the assembled <code>$details<\/code>, producing <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Slurpy benannte Argumente","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub describe($name, *%opts) {\n    my $details = %opts.sort.map({ \"{.key}={.value}\" }).join(', ');\n    \"$name: $details\";\n}\n\nsay describe('Anna', colour =&gt; 'red', size =&gt; 5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/slurpy-hash.raku\" target=\"_blank\" rel=\"noopener\">slurpy-hash.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der feste positionale Parameter <code>$name<\/code> wird zuerst gefüllt, und der Slurpy-Parameter <code>*%opts<\/code> sammelt dann jedes verbleibende benannte Argument in einem Hash.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> ordnet die Paare nach Schlüssel, sodass die Ausgabe deterministisch ist — <code>colour<\/code> kommt vor <code>size<\/code>. Das <code>.map<\/code> wandelt jedes Paar mit <code>.key<\/code> und <code>.value<\/code> in einen <code>key=value<\/code>-String um, und <code>.join(', ')<\/code> fügt sie zusammen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der abschließende String interpoliert <code>$name<\/code> und das zusammengesetzte <code>$details<\/code> und erzeugt <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Slurpy benoemde argumenten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.
