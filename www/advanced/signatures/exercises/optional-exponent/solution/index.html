<script type="application/json" id="page-data">{"u":"advanced/signatures/exercises/optional-exponent/solution","n":632,"k":"solution","pv":"advanced/signatures/exercises/optional-exponent","nx":"advanced/signatures/exercises/slurpy-hash","tr":["advanced","advanced/signatures"],"L":{"en":{"t":"The solution of ’An optional exponent‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>?<\/code> after <code>$exp<\/code> makes it optional, so <code>power<\/code> can be called with just the base.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">When <code>$exp<\/code> is omitted it is undefined, and <code>//<\/code> supplies the fallback <code>2<\/code>, so <code>power(5)<\/code> squares the base to <code>25<\/code>. Given an exponent, as in <code>power(5, 3)<\/code>, that value is used instead, giving <code>125<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein optionaler Exponent","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>?<\/code> nach <code>$exp<\/code> macht den Parameter optional, sodass <code>power<\/code> nur mit der Basis aufgerufen werden kann.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wenn <code>$exp<\/code> weggelassen wird, ist es undefiniert, und <code>//<\/code> liefert den Ersatzwert <code>2<\/code>, sodass <code>power(5)<\/code> die Basis quadriert und <code>25<\/code> ergibt. Mit einem Exponenten, wie bei <code>power(5, 3)<\/code>, wird dieser Wert stattdessen verwendet und ergibt <code>125<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een optionele exponent","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 De broncode is te vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het <code>?<\/code> achter <code>$exp<\/code> maakt de parameter optioneel, zodat <code>power<\/code> kan worden aangeroepen met alleen het grondtal.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wanneer <code>$exp<\/code> wordt weggelaten is hij ongedefinieerd, en <code>//<\/code> levert de terugvalwaarde <code>2<\/code>, zodat <code>power(5)<\/code> het grondtal kwadrateert tot <code>25<\/code>. Wanneer een exponent wordt meegegeven, zoals in <code>power(5, 3)<\/code>, wordt die waarde gebruikt, wat <code>125<\/code> oplevert.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un exponente opcional","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí está una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>?<\/code> después de <code>$exp<\/code> lo hace opcional, de modo que <code>power<\/code> puede llamarse solo con la base.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cuando se omite <code>$exp<\/code>, queda indefinido, y <code>//<\/code> proporciona el valor de respaldo <code>2<\/code>, por lo que <code>power(5)<\/code> eleva la base al cuadrado, dando <code>25<\/code>. Cuando se proporciona un exponente, como en <code>power(5, 3)<\/code>, se usa ese valor en su lugar, dando <code>125<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un esponente opzionale","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il <code>?<\/code> dopo <code>$exp<\/code> lo rende opzionale, quindi <code>power<\/code> può essere chiamata con la sola base.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quando <code>$exp<\/code> viene omesso è indefinito, e <code>//<\/code> fornisce il valore di riserva <code>2<\/code>, quindi <code>power(5)<\/code> eleva la base al quadrato ottenendo <code>25<\/code>. Se viene fornito un esponente, come in <code>power(5, 3)<\/code>, viene usato quel valore, dando <code>125<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Neobligāta pakāpe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Seit ir iespejams uzdevuma risinajums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Pirmkodu var atrast faila <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=  <code>power(5)<\/code> возводит основание в квадрат и даёт <code>25<\/code>. Если показатель степени передан, как в <code>power(5, 3)<\/code>, используется переданное значение, что даёт <code>125<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Необов'язковий показник степеня","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Знак <code>?<\/code> після <code>$exp<\/code> робить його необов'язковим, тож <code>power<\/code> можна викликати лише з основою.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Коли <code>$exp<\/code> пропущено, він невизначений, і <code>//<\/code> підставляє запасне <code>2<\/code>, тож <code>power(5)<\/code> підносить основу до квадрата, даючи <code>25<\/code>. Якщо показник задано, як у <code>power(5, 3)<\/code>, використовується саме це значення, даючи <code>125<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Незадължителна степен","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub power($base, $exp?) {\n    $base ** ($exp // 2)\n}\n\nsay power(5);\nsay power(5, 3);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/optional-exponent.raku\" target=\"_blank\" rel=\"noopener\">optional-exponent.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>25\n125<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>?<\/code> след <code>$exp<\/code> го прави незадължителен, така че <code>power<\/code> може да бъде извикана само с основата.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Когато <code>$exp<\/code> е пропуснат, той е недефиниран, и <code>//<\/code> задава резервната стойност <code>2<\/code>, така че <code>power(5)<\/code> повдига основата на квадрат до <code>25<\/code>. При подадена степен, както в <code>power(5, 3)<\/code>, се използва тази стойност, което дава <code>125<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
