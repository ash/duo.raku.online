<script type="application/json" id="page-data">{"u":"advanced/signatures","n":627,"k":"section","pv":"advanced/statement-prefixes/exercises/silence-warning/solution","nx":"advanced/signatures/exercises","tr":["advanced"],"L":{"en":{"t":"Signatures","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part you <a href=\"/essentials/functions/\">defined subroutines with positional and named parameters and gave them default values<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">The list of parameters is called the <em>signature<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">This section adds two more things a signature can do: mark a parameter as optional, and collect any number of extra arguments.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optional parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A parameter followed by a question mark is <em>optional<\/em>: the caller may leave it out.<\/span> <span class=\"sg\" data-s=\"1\">When it is left out, the parameter is undefined, so you can supply a fallback with the defined-or operator <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When <code>greet<\/code> is called with one argument, <code>$greeting<\/code> is undefined, so <code>//<\/code> falls back to <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A parameter marked with a <code>*<\/code> is <em>slurpy<\/em>: it gathers all the remaining arguments.<\/span> <span class=\"sg\" data-s=\"1\">A slurpy array, written <code>*@<\/code>, collects any number of positional arguments into an array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can combine ordinary parameters with a slurpy one.<\/span> <span class=\"sg\" data-s=\"1\">The fixed parameters are filled first, and whatever is left goes into the slurpy array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In the same way, a slurpy hash, written <code>*%<\/code>, collects any extra named arguments into a hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The two named arguments end up as keys of <code>%options<\/code>, so the program prints:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"de":{"t":"Signaturen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Im Abschnitt „Grundlagen\" haben Sie <a href=\"https://course.raku.org/de/essentials/functions/\" target=\"_blank\" rel=\"noopener\">Subroutinen mit positionalen und benannten Parametern definiert und ihnen Standardwerte gegeben<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Die Liste der Parameter wird als <em>Signatur<\/em> bezeichnet.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt fügt zwei weitere Möglichkeiten hinzu, die eine Signatur bieten kann: einen Parameter als optional markieren und eine beliebige Anzahl zusätzlicher Argumente sammeln.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optionale Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Parameter, dem ein Fragezeichen folgt, ist <em>optional<\/em>: Der Aufrufer kann ihn weglassen.<\/span> <span class=\"sg\" data-s=\"1\">Wenn er weggelassen wird, ist der Parameter undefiniert, sodass Sie mit dem Defined-or-Operator <code>//<\/code> einen Ersatzwert angeben können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn <code>greet<\/code> mit einem Argument aufgerufen wird, ist <code>$greeting<\/code> undefiniert, sodass <code>//<\/code> auf <code>'Hello'<\/code> zurückfällt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy-Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein mit <code>*<\/code> markierter Parameter ist <em>slurpy<\/em>: Er sammelt alle verbleibenden Argumente ein.<\/span> <span class=\"sg\" data-s=\"1\">Ein Slurpy-Array, geschrieben als <code>*@<\/code>, sammelt eine beliebige Anzahl positionaler Argumente in einem Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können gewöhnliche Parameter mit einem Slurpy-Parameter kombinieren.<\/span> <span class=\"sg\" data-s=\"1\">Die festen Parameter werden zuerst gefüllt, und was übrig bleibt, geht in das Slurpy-Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auf die gleiche Weise sammelt ein Slurpy-Hash, geschrieben als <code>*%<\/code>, alle zusätzlichen benannten Argumente in einem Hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die beiden benannten Argumente landen als Schlüssel in <code>%options<\/code>, sodass das Programm ausgibt:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"nl":{"t":"Signaturen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <a href=\"https://course.raku.org/nl/essentials/functions/\" target=\"_blank\" rel=\"noopener\">subroutines gedefinieerd met positionele en benoemde parameters en hun standaardwaarden ingesteld<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">De lijst van parameters wordt de <em>signatuur<\/em> genoemd.<\/span> <span class=\"sg\" data-s=\"2\">In dit onderdeel worden twee extra mogelijkheden van signaturen behandeld: een parameter als optioneel markeren, en een willekeurig aantal extra argumenten verzamelen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optionele parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een parameter gevolgd door een vraagteken is <em>optioneel<\/em>: de aanroeper mag hem weglaten.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer hij wordt weggelaten, is de parameter ongedefinieerd, dus kun je een terugvalwaarde opgeven met de defined-or-operator <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer <code>greet<\/code> met een argument wordt aangeroepen, is <code>$greeting<\/code> ongedefinieerd, dus valt <code>//<\/code> terug op <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een parameter gemarkeerd met een <code>*<\/code> is <em>slurpy<\/em>: hij verzamelt alle overige argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Een slurpy array, geschreven als <code>*@<\/code>, verzamelt een willekeurig aantal positionele argumenten in een array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt gewone parameters combineren met een slurpy parameter.<\/span> <span class=\"sg\" data-s=\"1\">De vaste parameters worden eerst ingevuld, en wat overblijft gaat naar de slurpy array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Op dezelfde manier verzamelt een slurpy hash, geschreven als <code>*%<\/code>, alle extra benoemde argumenten in een hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De twee benoemde argumenten komen terecht als sleutels van <code>%options<\/code>, dus het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"es":{"t":"Firmas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la parte de Fundamentos <a href=\"https://course.raku.org/es/essentials/functions/\" target=\"_blank\" rel=\"noopener\">definiste subrutinas con parámetros posicionales y nombrados y les diste valores predeterminados<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">La lista de parámetros se llama <em>firma<\/em> (signature).<\/span> <span class=\"sg\" data-s=\"2\">Esta sección agrega dos cosas más que una firma puede hacer: marcar un parámetro como opcional y recolectar cualquier número de argumentos adicionales.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros opcionales<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un parámetro seguido de un signo de interrogación es <em>opcional<\/em>: quien llama a la función puede omitirlo.<\/span> <span class=\"sg\" data-s=\"1\">Cuando se omite, el parámetro queda indefinido, por lo que puedes proporcionar un valor de respaldo con el operador defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando se llama a <code>greet<\/code> con un solo argumento, <code>$greeting<\/code> queda indefinido, por lo que <code>//<\/code> recurre al valor <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros slurpy<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un parámetro marcado con <code>*<\/code> es <em>slurpy<\/em>: reúne todos los argumentos restantes.<\/span> <span class=\"sg\" data-s=\"1\">Un array slurpy, escrito <code>*@<\/code>, recolecta cualquier número de argumentos posicionales en un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes combinar parámetros ordinarios con uno slurpy.<\/span> <span class=\"sg\" data-s=\"1\">Los parámetros fijos se llenan primero, y lo que sobra va al array slurpy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De la misma manera, un hash slurpy, escrito <code>*%<\/code>, recolecta cualquier argumento nombrado adicional en un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los dos argumentos nombrados terminan como claves de <code>%options<\/code>, por lo que el programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"it":{"t":"Firme","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials hai <a href=\"https://course.raku.org/it/essentials/functions/\" target=\"_blank\" rel=\"noopener\">definito subroutine con parametri posizionali e nominati e hai assegnato loro valori predefiniti<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">La lista dei parametri si chiama <em>signature<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione aggiunge altre due cose che una signature può fare: contrassegnare un parametro come opzionale e raccogliere un numero qualsiasi di argomenti aggiuntivi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri opzionali<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un parametro seguito da un punto interrogativo è <em>opzionale<\/em>: il chiamante può ometterlo.<\/span> <span class=\"sg\" data-s=\"1\">Quando viene omesso, il parametro è indefinito, quindi puoi fornire un valore di riserva con l'operatore defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando <code>greet<\/code> viene chiamata con un solo argomento, <code>$greeting<\/code> è indefinito, quindi <code>//<\/code> ricade su <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri slurpy<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un parametro contrassegnato con <code>*<\/code> è <em>slurpy<\/em>: raccoglie tutti gli argomenti rimanenti.<\/span> <span class=\"sg\" data-s=\"1\">Un array slurpy, scritto <code>*@<\/code>, raccoglie qualsiasi numero di argomenti posizionali in un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi combinare parametri ordinari con uno slurpy.<\/span> <span class=\"sg\" data-s=\"1\">I parametri fissi vengono riempiti per primi e tutto ciò che rimane va nell'array slurpy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Allo stesso modo, un hash slurpy, scritto <code>*%<\/code>, raccoglie qualsiasi argomento nominato aggiuntivo in un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I due argomenti nominati finiscono come chiavi di <code>%options<\/code>, quindi il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"lv":{"t":"Paraksti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pamatu dalas sadala par <a href=\"https://course.raku.org/lv/essentials/functions/\" target=\"_blank\" rel=\"noopener\">apaksprogrammu definicijam ar pozicionaliem un nosauktajiem parametriem un noklusejuma vertibam<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Parametru sarakstu sauc par <em>signaturu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Saja sadala ir aplukotas vel divas lietas, ko signatura var darit: atzime parametru ka neobligatu un savac jebkuru papildu argumentu skaitu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neobligatie parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametrs, kam seko jautajuma zime, ir <em>neobligats<\/em>: izsaucejs var to izlaist.<\/span> <span class=\"sg\" data-s=\"1\">Kad tas ir izlaists, parametrs ir nedefinets, tapec var nodrosinat rezerves vertibu ar definets-vai operatoru <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad <code>greet<\/code> tiek izsaukts ar vienu argumentu, <code>$greeting<\/code> ir nedefinets, tapec <code>//<\/code> izmanto rezerves vertibu <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzsucosie parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametrs, kas atzimets ar <code>*<\/code>, ir <em>uzsucoss<\/em> (slurpy): tas savac visus atlikusos argumentus.<\/span> <span class=\"sg\" data-s=\"1\">Uzsucoss masivs, kas rakstits ka <code>*@<\/code>, savac jebkuru skaitu pozicionalo argumentu masiva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parastos parametrus var kombinat ar uzsucoso parametru.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms tiek aizpilditi fiksatie parametri, un viss, kas paliek parri, nonak uzsucosaja masiva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tada pasa veida uzsucoss hess, kas rakstits ka <code>*%<\/code>, savac visus papildu nosauktos argumentus hesa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abi nosauktie argumenti nonaks ka <code>%options<\/code> atslegas, tapec programma izvada:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"ru":{"t":"Сигнатуры","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В разделе \"Основы\" вы <a href=\"https://course.raku.org/ru/essentials/functions/\" target=\"_blank\" rel=\"noopener\">определяли подпрограммы с позиционными и именованными параметрами и задавали им значения по умолчанию<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Список параметров называется <em>сигнатурой<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе рассматриваются ещё две возможности сигнатур: пометить параметр как необязательный и собрать любое количество дополнительных аргументов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Необязательные параметры<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметр, за которым стоит знак вопроса, является <em>необязательным<\/em>: вызывающая сторона может его опустить.<\/span> <span class=\"sg\" data-s=\"1\">Когда он опущен, параметр не определён, поэтому можно задать запасное значение с помощью оператора defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда <code>greet<\/code> вызывается с одним аргументом, <code>$greeting<\/code> не определён, поэтому <code>//<\/code> подставляет запасное значение <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Поглощающие параметры<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметр, помеченный символом <code>*<\/code>, является <em>поглощающим<\/em> (slurpy): он собирает все оставшиеся аргументы.<\/span> <span class=\"sg\" data-s=\"1\">Поглощающий массив, записываемый как <code>*@<\/code>, собирает любое количество позиционных аргументов в массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обычные параметры можно комбинировать с поглощающим.<\/span> <span class=\"sg\" data-s=\"1\">Сначала заполняются фиксированные параметры, а всё остальное попадает в поглощающий массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аналогично, поглощающий хеш, записываемый как <code>*%<\/code>, собирает все дополнительные именованные аргументы в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два именованных аргумента попадают в ключи <code>%options<\/code>, поэтому программа выводит:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"uk":{"t":"Сигнатури","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви <a href=\"https://course.raku.org/uk/essentials/functions/\" target=\"_blank\" rel=\"noopener\">визначали підпрограми з позиційними та іменованими параметрами й давали їм типові значення<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Список параметрів називають <em>сигнатурою<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ додає ще дві речі, які сигнатура вміє: позначати параметр необов'язковим і збирати будь-яку кількість зайвих аргументів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Необов'язкові параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметр, за яким стоїть знак питання, є <em>необов'язковим<\/em>: той, хто викликає, може його пропустити.<\/span> <span class=\"sg\" data-s=\"1\">Коли його пропущено, параметр невизначений, тож запасне значення можна підставити оператором «визначене або» <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли <code>greet<\/code> викликано з одним аргументом, <code>$greeting<\/code> невизначений, тож <code>//<\/code> вдається до <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Всеїдні параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметр, позначений <code>*<\/code>, є <em>всеїдним<\/em>: він збирає всі решту аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Всеїдний масив, який записують як <code>*@<\/code>, збирає будь-яку кількість позиційних аргументів у масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Звичайні параметри можна поєднувати із всеїдним.<\/span> <span class=\"sg\" data-s=\"1\">Спершу заповнюються сталі параметри, а все, що лишилося, потрапляє у всеїдний масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так само всеїдний хеш, який записують як <code>*%<\/code>, збирає всі зайві іменовані аргументи в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два іменовані аргументи стають ключами <code>%options<\/code>, тож програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"bg":{"t":"Сигнатури","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" вие <a href=\"https://course.raku.org/bg/essentials/functions/\" target=\"_blank\" rel=\"noopener\">дефинирахте подпрограми с позиционни и именувани параметри и им задавахте стойности по подразбиране<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Списъкът от параметри се нарича <em>сигнатура<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел добавя две нови неща, които една сигнатура може да прави: да маркира параметър като незадължителен и да събира произволен брой допълнителни аргументи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Незадължителни параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметър, следван от въпросителен знак, е <em>незадължителен<\/em>: извикващият може да го пропусне.<\/span> <span class=\"sg\" data-s=\"1\">Когато е пропуснат, параметърът е недефиниран, така че можете да зададете резервна стойност с оператора defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато <code>greet<\/code> е извикана с един аргумент, <code>$greeting<\/code> е недефинирана, така че <code>//<\/code> използва резервната стойност <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметър, маркиран с <code>*<\/code>, е <em>slurpy<\/em>: той събира всички останали аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Slurpy масив, записан като <code>*@<\/code>, събира произволен брой позиционни аргументи в масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да комбинирате обикновени параметри със slurpy.<\/span> <span class=\"sg\" data-s=\"1\">Фиксираните параметри се попълват първи, а каквото остане, отива в slurpy масива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">По същия начин slurpy хеш, записан като <code>*%<\/code>, събира всички допълнителни именувани аргументи в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двата именувани аргумента се оказват ключове на <code>%options<\/code>, така че програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]}}}</script>
