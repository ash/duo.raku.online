<script type="application/json" id="page-data">{"u":"advanced/more-on-main","n":663,"k":"section","pv":"advanced/multiple-dispatch/quiz","nx":"advanced/more-on-main/exercises","tr":["advanced"],"L":{"en":{"t":"More on MAIN subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part you used <code>MAIN<\/code> <a href=\"/essentials/the-main-function/reading-command-line-arguments/\">to receive command-line arguments<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku does more for you around <code>MAIN<\/code> than just passing the values in.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The usage message<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If the arguments on the command line do not match the signature of <code>MAIN<\/code>, Raku does not run the body.<\/span> <span class=\"sg\" data-s=\"1\">Instead, it prints an automatically generated <em>usage message<\/em> that describes how the program should be called.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Take this program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Called correctly, it greets the person:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Called with no argument, the signature does not match, so Raku prints the usage instead of the greeting:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The message is built from the names of the parameters, so giving them meaningful names makes the help text helpful for free.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Named arguments<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters of <code>MAIN<\/code> may be named as well as positional.<\/span> <span class=\"sg\" data-s=\"1\">A named parameter becomes a <code>--option=value<\/code> switch on the command line, and a default value makes it optional:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"de":{"t":"Mehr zu MAIN-Unterprogrammen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im Essentials-Teil haben Sie <code>MAIN<\/code> verwendet, <a href=\"https://course.raku.org/de/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">um Kommandozeilenargumente zu empfangen<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku bietet Ihnen rund um <code>MAIN<\/code> mehr als nur die Weitergabe der Werte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Die Verwendungsmeldung<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn die Argumente auf der Kommandozeile nicht zur Signatur von <code>MAIN<\/code> passen, führt Raku den Körper nicht aus.<\/span> <span class=\"sg\" data-s=\"1\">Stattdessen gibt es eine automatisch generierte <em>Verwendungsmeldung<\/em> aus, die beschreibt, wie das Programm aufgerufen werden sollte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nehmen Sie dieses Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Korrekt aufgerufen, begruesst es die Person:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne Argument aufgerufen, passt die Signatur nicht, und Raku gibt die Verwendungsmeldung anstelle der Begruessung aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Meldung wird aus den Parameternamen erstellt.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie ihnen aussagekraeftige Namen geben, wird der Hilfetext automatisch nützlich.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benannte Argumente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameter von <code>MAIN<\/code> können sowohl benannt als auch positional sein.<\/span> <span class=\"sg\" data-s=\"1\">Ein benannter Parameter wird zu einem <code>--option=wert<\/code>-Schalter auf der Kommandozeile, und ein Standardwert macht ihn optional:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"nl":{"t":"Meer over MAIN-subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <code>MAIN<\/code> gebruikt <a href=\"https://course.raku.org/nl/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">om commandoregelargumenten te ontvangen<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku doet meer voor je rond <code>MAIN<\/code> dan alleen de waarden doorgeven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het gebruiksbericht<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als de argumenten op de commandoregel niet overeenkomen met de signatuur van <code>MAIN<\/code>, voert Raku de body niet uit.<\/span> <span class=\"sg\" data-s=\"1\">In plaats daarvan drukt het een automatisch gegenereerd <em>gebruiksbericht<\/em> af dat beschrijft hoe het programma moet worden aangeroepen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Neem dit programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Correct aangeroepen begroet het de persoon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aangeroepen zonder argument komt de signatuur niet overeen, dus drukt Raku het gebruiksbericht af in plaats van de begroeting:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het bericht wordt opgebouwd uit de namen van de parameters, dus als je ze betekenisvolle namen geeft, wordt de helptekst vanzelf nuttig.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benoemde argumenten<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters van <code>MAIN<\/code> kunnen zowel benoemd als positioneel zijn.<\/span> <span class=\"sg\" data-s=\"1\">Een benoemde parameter wordt een <code>--optie=waarde<\/code>-schakelaar op de commandoregel, en een standaardwaarde maakt deze optioneel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"es":{"t":"Más sobre subrutinas MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales usaste <code>MAIN<\/code> <a href=\"https://course.raku.org/es/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">para recibir argumentos de la línea de comandos<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku hace más por ti con <code>MAIN<\/code> que simplemente pasar los valores.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El mensaje de uso<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si los argumentos en la línea de comandos no coinciden con la firma de <code>MAIN<\/code>, Raku no ejecuta el cuerpo.<\/span> <span class=\"sg\" data-s=\"1\">En su lugar, imprime un <em>mensaje de uso<\/em> generado automáticamente que describe cómo debe llamarse el programa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Toma este programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Llamado correctamente, saluda a la persona:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Llamado sin argumentos, la firma no coincide, así que Raku imprime el uso en lugar del saludo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El mensaje se construye a partir de los nombres de los parámetros, por lo que darles nombres significativos hace que el texto de ayuda sea útil de forma gratuita.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argumentos con nombre<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los parámetros de <code>MAIN<\/code> pueden ser con nombre además de posicionales.<\/span> <span class=\"sg\" data-s=\"1\">Un parámetro con nombre se convierte en una opción <code>--option=value<\/code> en la línea de comandos, y un valor predeterminado lo hace opcional:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"it":{"t":"Approfondimento sulle subroutine MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essenziali hai usato <code>MAIN<\/code> <a href=\"https://course.raku.org/it/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">per ricevere gli argomenti da riga di comando<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku fa molto di piu per te riguardo a <code>MAIN<\/code> oltre al semplice passaggio dei valori.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il messaggio di utilizzo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se gli argomenti sulla riga di comando non corrispondono alla firma di <code>MAIN<\/code>, Raku non esegue il corpo della funzione.<\/span> <span class=\"sg\" data-s=\"1\">Invece, stampa un <em>messaggio di utilizzo<\/em> generato automaticamente che descrive come il programma dovrebbe essere invocato.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prendi questo programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Invocato correttamente, saluta la persona:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Invocato senza argomenti, la firma non corrisponde, quindi Raku stampa il messaggio di utilizzo al posto del saluto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il messaggio viene costruito a partire dai nomi dei parametri, quindi dare loro nomi significativi rende il testo di aiuto utile senza alcuno sforzo aggiuntivo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argomenti con nome<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I parametri di <code>MAIN<\/code> possono essere sia con nome che posizionali.<\/span> <span class=\"sg\" data-s=\"1\">Un parametro con nome diventa un'opzione <code>--opzione=valore<\/code> sulla riga di comando, e un valore predefinito lo rende facoltativo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"lv":{"t":"Vairāk par MAIN apakšprogrammām","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs izmantojāt <code>MAIN<\/code>, <a href=\"https://course.raku.org/lv/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">lai saņemtu komandrindas argumentus<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ap <code>MAIN<\/code> dara jūsu labā vairāk nekā tikai nodod vērtības iekšā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lietošanas paziņojums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja komandrindas argumenti neatbilst <code>MAIN<\/code> parakstam, Raku ķermeni neizpilda.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā tas izdrukā automātiski ģenerētu <em>lietošanas paziņojumu<\/em>, kas apraksta, kā programma jāizsauc.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ņemiet šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izsaukta pareizi, tā sasveicinās:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izsaukta bez argumenta, tā parakstam neatbilst, tāpēc Raku sveiciena vietā izdrukā lietošanas paziņojumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Paziņojums tiek uzbūvēts no parametru nosaukumiem, tāpēc jēdzīgi nosaukumi padara palīdzības tekstu noderīgu bez papildu pūlēm.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nosaukti argumenti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> parametri var būt gan nosaukti, gan pozicionāli.<\/span> <span class=\"sg\" data-s=\"1\">Nosaukts parametrs komandrindā kļūst par slēdzi <code>--option=value<\/code>, un noklusējuma vērtība to padara neobligātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"ru":{"t":"Подробнее о MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В разделе «Основы» вы использовали <code>MAIN<\/code> для <a href=\"https://course.raku.org/ru/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">получения аргументов командной строки<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku делает с <code>MAIN<\/code> гораздо больше, чем просто передаёт значения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сообщение об использовании<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если аргументы командной строки не соответствуют сигнатуре <code>MAIN<\/code>, Raku не выполняет тело подпрограммы.<\/span> <span class=\"sg\" data-s=\"1\">Вместо этого он выводит автоматически сгенерированное <em>сообщение об использовании<\/em> (usage message), описывающее, как следует вызывать программу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Возьмём такую программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При правильном вызове она приветствует пользователя:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При вызове без аргумента сигнатура не совпадает, поэтому Raku выводит сообщение об использовании вместо приветствия:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сообщение строится на основе имён параметров, поэтому, давая им осмысленные имена, вы бесплатно получаете полезный текст справки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именованные аргументы<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметры <code>MAIN<\/code> могут быть как позиционными, так и именованными.<\/span> <span class=\"sg\" data-s=\"1\">Именованный параметр становится на командной строке ключом вида <code>--option=value<\/code>, а значение по умолчанию делает его необязательным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"uk":{"t":"Докладніше про підпрограми MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви користувалися <code>MAIN<\/code>, <a href=\"https://course.raku.org/uk/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">щоб отримувати аргументи командного рядка<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku робить навколо <code>MAIN<\/code> більше, ніж просто передає значення всередину.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повідомлення про використання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо аргументи в командному рядку не відповідають сигнатурі <code>MAIN<\/code>, Raku не виконує тіла.<\/span> <span class=\"sg\" data-s=\"1\">Натомість він виводить автоматично згенероване <em>повідомлення про використання<\/em>, яке описує, як слід викликати програму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Візьмімо таку програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Викликана правильно, вона вітає людину:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Викликана без аргументу, вона не відповідає сигнатурі, тож Raku виводить довідку замість привітання:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повідомлення будується з імен параметрів, тож осмислені імена роблять текст довідки корисним самі собою.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Іменовані аргументи<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметри <code>MAIN<\/code> можуть бути не лише позиційними, а й іменованими.<\/span> <span class=\"sg\" data-s=\"1\">Іменований параметр стає перемикачем <code>--option=value<\/code> у командному рядку, а типове значення робить його необов'язковим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"bg":{"t":"Повече за MAIN подпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" използвахте <code>MAIN<\/code>, за да <a href=\"https://course.raku.org/bg/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">получавате аргументи от командния ред<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku прави още неща за вас около <code>MAIN<\/code> освен просто да предава стойностите.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Съобщение за употреба<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако аргументите от командния ред не съответстват на сигнатурата на <code>MAIN<\/code>, Raku не изпълнява тялото.<\/span> <span class=\"sg\" data-s=\"1\">Вместо това отпечатва автоматично генерирано <em>съобщение за употреба<\/em>, което описва как програмата трябва да бъде извикана.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вземете тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикана правилно, тя поздравява човека:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикана без аргумент, сигнатурата не съответства и Raku отпечатва съобщението за употреба вместо поздрава:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съобщението се изгражда от имената на параметрите, така че даването на смислени имена прави текста за помощ полезен безплатно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именувани аргументи<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметрите на <code>MAIN<\/code> могат да бъдат именувани, а не само позиционни.<\/span> <span class=\"sg\" data-s=\"1\">Именуван параметър се превръща в превключвател <code>--option=value<\/code> на командния ред, а стойността по подразбиране го прави незадължителен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"eo":{"t":"Pli pri MAIN-subrutino","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencaĵoj vi uzis <code>MAIN<\/code> <a href=\"https://course.raku.org/eo/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">por ricevi komandliniajn argumentojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku faras pli por vi ĉirkaŭ <code>MAIN<\/code> ol nur transdoni la valorojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La uzad-mesaĝo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la argumentoj en la komandlinio ne kongruas kun la signaturo de <code>MAIN<\/code>, Raku ne plenumas la korpon.<\/span> <span class=\"sg\" data-s=\"1\">Anstataŭe, ĝi presas aŭtomate generitan <em>uzad-mesaĝon<\/em>, kiu priskribas kiel la programo devus esti vokita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prenu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vokite ĝuste, ĝi salutas la personon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vokite sen argumento, la signaturo ne kongruas, do Raku presas la uzadon anstataŭ la saluton:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La mesaĝo estas konstruita el la nomoj de la parametroj, do doni al ili signifoplenajn nomojn faras la helptekston utila senpage.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nomitaj argumentoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametroj de <code>MAIN<\/code> povas esti nomitaj same kiel poziciaj.<\/span> <span class=\"sg\" data-s=\"1\">Nomita parametro fariĝas <code>--option=value<\/code> ŝaltilo en la komandlinio, kaj defaŭlta valoro faras ĝin nedeviga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"la":{"t":"Plus de MAIN subprogrammatibus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <code>MAIN<\/code> <a href=\"https://course.raku.org/la/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">ad argumenta lineae mandati accipienda<\/a> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Raku plura tibi circa <code>MAIN<\/code> praestat quam solam valorum traditionem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nuntius de usu<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si argumenta in linea mandati cum signatura <code>MAIN<\/code> non congruunt, Raku corpus non exsequitur.<\/span> <span class=\"sg\" data-s=\"1\">Pro eo, <em>nuntium de usu<\/em> automatice generatum imprimit, qui describit quomodo programma vocari debeat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma sume:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Recte vocatum, personam salutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine argumento vocatum, signatura non congruit, itaque Raku nuntium de usu pro salutatione imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nuntius ex nominibus parametrorum construitur, itaque nomina significantia eis dando textum auxilii gratis utilem reddis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argumenta nominata<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri <code>MAIN<\/code> tam nominati quam positionarii esse possunt.<\/span> <span class=\"sg\" data-s=\"1\">Parametrus nominatus fit optio <code>--option=value<\/code> in linea mandati, et valor praefinitus eum optionalem reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]}}}</script>
