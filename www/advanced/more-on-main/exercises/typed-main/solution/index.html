<script type="application/json" id="page-data">{"u":"advanced/more-on-main/exercises/typed-main/solution","n":668,"k":"solution","pv":"advanced/more-on-main/exercises/typed-main","nx":"advanced/more-on-main/exercises/two-arguments","tr":["advanced","advanced/more-on-main"],"L":{"en":{"t":"The solution of ’A typed MAIN‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Int $n) {\n    say $n * 2;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/more-on-main/typed-main.raku\" target=\"_blank\" rel=\"noopener\">typed-main.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku typed-main.raku 5\n10\n\n$ raku typed-main.raku abc\nUsage:\n  typed-main.raku &lt;n&gt;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>Int<\/code> constraint means the command-line word must look like an integer. Given <code>5<\/code>, it binds to <code>$n<\/code> and the body prints <code>10<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Given <code>abc<\/code>, the value cannot become an <code>Int<\/code>, so the signature does not match. Raku does not run the body — it prints the generated usage message instead, giving you argument validation without any manual checks.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein typisiertes MAIN","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Int $n) {\n    say $n * 2;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/more-on-main/typed-main.raku\" target=\"_blank\" rel=\"noopener\">typed-main.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku typed-main.raku 5\n10\n\n$ raku typed-main.raku abc\nUsage:\n  typed-main.raku &lt;n&gt;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die <code>Int<\/code>-Beschraenkung bedeutet, dass das Kommandozeilenwort wie eine Ganzzahl aussehen muss. Bei <code>5<\/code> wird es an <code>$n<\/code> gebunden, und der Körper gibt <code>10<\/code> aus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Bei <code>abc<\/code> kann der Wert nicht zu einem <code>Int<\/code> werden, sodass die Signatur nicht passt. Raku führt den Körper nicht aus — stattdessen gibt es die generierte Verwendungsmeldung aus, was Ihnen die Argumentvalidierung ohne manuelle Prüfungen ermöglicht.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een getypte MAIN","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Int $n) {\n    say $n * 2;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/more-on-main/typed-main.raku\" target=\"_blank\" rel=\"noopener\">typed-main.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku typed-main.raku 5\n10\n\n$ raku typed-main.raku abc\nUsage:\n  typed-main.raku &lt;n&gt;<\
