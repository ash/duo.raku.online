<script type="application/json" id="page-data">{"u":"advanced/dd/functions","n":344,"k":"topic","pv":"advanced/dd/variables/quiz","nx":"advanced/dd/exercises","tr":["advanced","advanced/dd"],"L":{"en":{"t":"Dumping function signatures","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A bare <code>dd<\/code> — called with no arguments inside a subroutine — prints the signature of that subroutine: its name and the list of parameters, if it has any.<\/span> <span class=\"sg\" data-s=\"1\">Examine the following example with two subroutines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints the signatures rather than any values:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is especially useful with multi-functions, where it tells you which candidate was actually called:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The output names the matching variant each time:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"de":{"t":"Funktionssignaturen dumpen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein nacktes <code>dd<\/code> — ohne Argumente innerhalb einer Subroutine aufgerufen — gibt die Signatur dieser Subroutine aus: ihren Namen und die Liste der Parameter, falls vorhanden.<\/span> <span class=\"sg\" data-s=\"1\">Betrachte das folgende Beispiel mit zwei Subroutinen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt die Signaturen statt irgendwelcher Werte aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das ist besonders nützlich bei Multi-Funktionen, wo es dir verrät, welcher Kandidat tatsächlich aufgerufen wurde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe benennt jedes Mal die passende Variante:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"nl":{"t":"Functiesignaturen dumpen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een kale <code>dd<\/code> — aangeroepen zonder argumenten binnen een subroutine — toont de signatuur van die subroutine: de naam en de lijst van parameters, als die er zijn.<\/span> <span class=\"sg\" data-s=\"1\">Bekijk het volgende voorbeeld met twee subroutines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma toont de signaturen in plaats van waarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is vooral handig bij multi-functies, waar het je vertelt welke kandidaat daadwerkelijk werd aangeroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De uitvoer noemt elke keer de overeenkomende variant:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"es":{"t":"Volcado de firmas de funciones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>dd<\/code> sin argumentos — llamado dentro de una subrutina — imprime la firma de esa subrutina: su nombre y la lista de parámetros, si los tiene.<\/span> <span class=\"sg\" data-s=\"1\">Examina el siguiente ejemplo con dos subrutinas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime las firmas en lugar de valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto es especialmente útil con multi-funciones, donde te indica qué candidato fue realmente llamado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La salida nombra la variante correspondiente en cada caso:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"it":{"t":"Dump delle firme di funzione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>dd<\/code> senza argomenti — chiamato senza argomenti all'interno di una subroutine — stampa la firma di quella subroutine: il suo nome e la lista dei parametri, se ne ha.<\/span> <span class=\"sg\" data-s=\"1\">Esamina il seguente esempio con due subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa le firme anziché dei valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo è particolarmente utile con le multi-funzioni, dove indica quale candidato è stato effettivamente chiamato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'output indica la variante corrispondente ogni volta:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"lv":{"t":"Funkciju parakstu izgūšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kails <code>dd<\/code> — izsaukts bez argumentiem apakšprogrammas iekšienē — izdrukā šīs apakšprogrammas parakstu: tās nosaukumu un parametru sarakstu, ja tādi ir.<\/span> <span class=\"sg\" data-s=\"1\">Aplūkojiet šo piemēru ar divām apakšprogrammām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma jebkādu vērtību vietā izdrukā parakstus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas ir īpaši noderīgi ar multifunkcijām, kur tas pasaka, kurš kandidāts patiešām tika izsaukts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izvade katrreiz nosauc atbilstošo variantu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"ru":{"t":"Сигнатура функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вызов <code>dd<\/code> без аргументов внутри подпрограммы печатает сигнатуру этой подпрограммы: её имя и список параметров, если они есть.<\/span> <span class=\"sg\" data-s=\"1\">Рассмотрим следующий пример с двумя подпрограммами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает сигнатуры, а не какие-либо значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это особенно полезно с мультифункциями, где <code>dd<\/code> показывает, какой именно кандидат был вызван:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вывод указывает подходящий вариант каждый раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"uk":{"t":"Вивід сигнатур функцій","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Виклик <code>dd<\/code> без аргументів усередині підпрограми друкує сигнатуру цієї підпрограми: її ім'я та список параметрів, якщо вони є. Розгляньте наступний приклад з двома підпрограмами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма друкує сигнатури, а не будь-які значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це особливо корисно з мультифункціями, де це показує, який кандидат був насправді викликаний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вивід називає відповідний варіант кожного разу:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"bg":{"t":"Извеждане на сигнатури на функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Извикване на <code>dd<\/code> без аргументи вътре в подпрограма отпечатва сигнатурата на тази подпрограма: нейното име и списъка с параметри, ако има такива.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте следния пример с две подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва сигнатурите, а не стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е особено полезно при мулти-функции, където показва кой кандидат е бил реално извикан:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изходът посочва съответстващия вариант всеки път:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"eo":{"t":"Dumpado de funkciaj subskriboj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nuda <code>dd<\/code> — vokita sen argumentoj ene de subrutino — presas la signaturon de tiu subrutino: ĝian nomon kaj la liston de parametroj, se ĝi havas.<\/span> <span class=\"sg\" data-s=\"1\">Ekzamenu la sekvan ekzemplon kun du subrutinoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas la signaturojn anstataŭ iujn ajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas speciale utila kun plur-funkcioj, kie ĝi diras al vi, kiu kandidato estis efektive vokita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La eligo nomas la kongruan varianton ĉiufoje:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"la":{"t":"Signaturas functionum dumping","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>dd<\/code> nudum — sine argumentis intra subroutinam vocatum — signaturam illius subroutinae imprimit: nomen eius et indicem parametrorum, si quos habet.<\/span> <span class=\"sg\" data-s=\"1\">Inspice exemplum sequens cum duabus subroutinis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma signaturas potius quam valores imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc praecipue utile est cum multi-functionibus, ubi indicat quae candidata revera vocata sit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Output variantem congruentem quaque vice nominat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]}}}</script>
