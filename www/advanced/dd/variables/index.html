<script type="application/json" id="page-data">{"u":"advanced/dd/variables","n":342,"k":"topic","pv":"advanced/dd","nx":"advanced/dd/variables/quiz","tr":["advanced","advanced/dd"],"L":{"en":{"t":"Dumping variables","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Call <code>dd<\/code> to see what a variable holds, much as you would do with <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Together with the value, <code>dd<\/code> also shows the name of the variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If the variable has a declared type, the type appears too.<\/span> <span class=\"sg\" data-s=\"1\">Compare the output of the following program with the previous one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is the main difference from <code>say<\/code>: a single <code>dd<\/code> called on a scalar tells you the name, and, when known, the type of the data — so you can drop several <code>dd<\/code> calls into a program and still recognise which output belongs to which variable.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also dump more complex data structures, such as arrays or hashes.<\/span> <span class=\"sg\" data-s=\"1\">Here, <code>dd<\/code> prints a code-like representation of the value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notice that the nested array stays clearly visible (no variable name printed though).<\/span> <span class=\"sg\" data-s=\"1\">The same works for hashes, whose keys <code>dd<\/code> prints in sorted order:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"de":{"t":"Variablen dumpen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Rufe <code>dd<\/code> auf, um zu sehen, was eine Variable enthält, ähnlich wie du es mit <code>say<\/code> tun würdest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zusammen mit dem Wert zeigt <code>dd<\/code> auch den Namen der Variable an:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn die Variable einen deklarierten Typ hat, erscheint auch der Typ.<\/span> <span class=\"sg\" data-s=\"1\">Vergleiche die Ausgabe des folgenden Programms mit der vorherigen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das ist der Hauptunterschied zu <code>say<\/code>: Ein einzelnes <code>dd<\/code>, das auf einen Skalar aufgerufen wird, zeigt dir den Namen und, wenn bekannt, den Typ der Daten — sodass du mehrere <code>dd<\/code>-Aufrufe in ein Programm einfügen und trotzdem erkennen kannst, welche Ausgabe zu welcher Variable gehört.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst auch komplexere Datenstrukturen ausgeben, wie Arrays oder Hashes.<\/span> <span class=\"sg\" data-s=\"1\">Hier gibt <code>dd<\/code> eine codeähnliche Darstellung des Wertes aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass das verschachtelte Array deutlich sichtbar bleibt (der Variablenname wird allerdings nicht ausgegeben).<\/span> <span class=\"sg\" data-s=\"1\">Das Gleiche funktioniert für Hashes, deren Schlüssel <code>dd<\/code> in sortierter Reihenfolge ausgibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"nl":{"t":"Variabelen dumpen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Roep <code>dd<\/code> aan om te zien wat een variabele bevat, net zoals je zou doen met <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Samen met de waarde toont <code>dd<\/code> ook de naam van de variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als de variabele een gedeclareerd type heeft, verschijnt het type ook.<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk de uitvoer van het volgende programma met het vorige:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is het belangrijkste verschil met <code>say<\/code>: een enkele <code>dd<\/code>-aanroep op een scalar vertelt je de naam en, indien bekend, het type van de gegevens — zodat je meerdere <code>dd<\/code>-aanroepen in een programma kunt plaatsen en toch kunt herkennen welke uitvoer bij welke variabele hoort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook complexere datastructuren dumpen, zoals arrays of hashes.<\/span> <span class=\"sg\" data-s=\"1\">Hier toont <code>dd<\/code> een codeachtige weergave van de waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de geneste array duidelijk zichtbaar blijft (er wordt echter geen variabelenaam getoond).<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde geldt voor hashes, waarvan <code>dd<\/code> de sleutels in gesorteerde volgorde toont:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"es":{"t":"Volcado de variables","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Llama a <code>dd<\/code> para ver lo que contiene una variable, tal como lo harías con <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Junto con el valor, <code>dd<\/code> también muestra el nombre de la variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si la variable tiene un tipo declarado, el tipo también aparece.<\/span> <span class=\"sg\" data-s=\"1\">Compara la salida del siguiente programa con la anterior:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta es la diferencia principal con <code>say<\/code>: una sola llamada a <code>dd<\/code> sobre un escalar te dice el nombre y, cuando se conoce, el tipo de los datos — así puedes colocar varias llamadas a <code>dd<\/code> en un programa y aún reconocer qué salida pertenece a qué variable.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes volcar estructuras de datos más complejas, como arreglos o hashes.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, <code>dd<\/code> imprime una representación similar a código del valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Observa que el arreglo anidado permanece claramente visible (aunque no se imprime el nombre de la variable).<\/span> <span class=\"sg\" data-s=\"1\">Lo mismo funciona para hashes, cuyas claves <code>dd<\/code> imprime en orden alfabético:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"it":{"t":"Dump delle variabili","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Chiama <code>dd<\/code> per vedere cosa contiene una variabile, come faresti con <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Insieme al valore, <code>dd<\/code> mostra anche il nome della variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la variabile ha un tipo dichiarato, appare anche il tipo.<\/span> <span class=\"sg\" data-s=\"1\">Confronta l'output del seguente programma con quello precedente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa è la differenza principale rispetto a <code>say<\/code>: una singola chiamata a <code>dd<\/code> su uno scalare ti dice il nome e, quando noto, il tipo del dato — così puoi inserire diverse chiamate <code>dd<\/code> in un programma e riconoscere comunque quale output appartiene a quale variabile.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche fare il dump di strutture dati più complesse, come array o hash.<\/span> <span class=\"sg\" data-s=\"1\">Qui, <code>dd<\/code> stampa una rappresentazione simile a codice del valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che l'array annidato resta chiaramente visibile (anche se il nome della variabile non viene stampato).<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso vale per gli hash, le cui chiavi <code>dd<\/code> stampa in ordine alfabetico:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"lv":{"t":"Mainīgo izgūšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Izsauciet <code>dd<\/code>, lai redzētu, kas ir mainīgajā, gluži tāpat kā to darītu ar <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Līdz ar vērtību <code>dd<\/code> parāda arī mainīgā nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja mainīgajam ir deklarēts tips, parādās arī tips.<\/span> <span class=\"sg\" data-s=\"1\">Salīdziniet šīs programmas izvadi ar iepriekšējo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī ir galvenā atšķirība no <code>say<\/code>: viens <code>dd<\/code>, izsaukts skalāram, pasaka nosaukumu un — kad zināms — datu tipu, tā ka varat programmā iemest vairākus <code>dd<\/code> izsaukumus un joprojām atpazīt, kura izvade pieder kuram mainīgajam.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Var izmest arī sarežģītākas datu struktūras, piemēram, masīvus vai jaukteklus.<\/span> <span class=\"sg\" data-s=\"1\">Šeit <code>dd<\/code> izdrukā kodam līdzīgu vērtības atveidojumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka ligzdotais masīvs paliek skaidri saredzams (gan bez izdrukāta mainīgā nosaukuma).<\/span> <span class=\"sg\" data-s=\"1\">Tas pats darbojas ar jaukterņiem, kuru atslēgas <code>dd<\/code> izdrukā sakārtotā secībā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"ru":{"t":"Вывод переменных","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вызовите <code>dd<\/code>, чтобы увидеть, что содержит переменная, так же как вы бы сделали это с помощью <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместе со значением <code>dd<\/code> также показывает имя переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если у переменной объявлен тип, тип тоже появляется.<\/span> <span class=\"sg\" data-s=\"1\">Сравните вывод следующей программы с предыдущей:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом главное отличие от <code>say<\/code>: один вызов <code>dd<\/code> для скаляра показывает имя и, когда он известен, тип данных — так что вы можете расставить несколько вызовов <code>dd<\/code> в программе и всё равно понять, какой вывод относится к какой переменной.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы также можете выводить дамп более сложных структур данных, таких как массивы или хэши.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае <code>dd<\/code> печатает кодоподобное представление значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что вложенный массив остаётся чётко видимым (имя переменной при этом не печатается).<\/span> <span class=\"sg\" data-s=\"1\">То же работает для хэшей, ключи которых <code>dd<\/code> печатает в отсортированном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"uk":{"t":"Вивід змінних","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Викличте <code>dd<\/code>, щоб побачити, що містить змінна, так само як ви це зробили б за допомогою <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разом зі значенням <code>dd<\/code> також показує ім'я змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо змінна має оголошений тип, тип також з'являється.<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте вивід наступної програми з попередньою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це головна відмінність від <code>say<\/code>: один виклик <code>dd<\/code> для скаляра показує вам ім'я та, якщо відомо, тип даних — тому ви можете розмістити кілька викликів <code>dd<\/code> у програмі й однаково розпізнати, який вивід належить якій змінній.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви також можете дампити більш складні структури даних, такі як масиви або хеші.<\/span> <span class=\"sg\" data-s=\"1\">Тут <code>dd<\/code> друкує подібне до коду представлення значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що вкладений масив залишається чітко видимим (хоча ім'я змінної не друкується).<\/span> <span class=\"sg\" data-s=\"1\">Те саме працює для хешів, ключі яких <code>dd<\/code> друкує у відсортованому порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"bg":{"t":"Извеждане на променливи","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Извикайте <code>dd<\/code>, за да видите какво съдържа една променлива, по подобие на <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre cl oj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Voku <code>dd<\/code> por vidi kion variablo enhavas, simile kiel vi farus per <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kune kun la valoro, <code>dd<\/code> ankaŭ montras la nomon de la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la variablo havas deklaritan tipon, la tipo ankaŭ aperas.<\/span> <span class=\"sg\" data-s=\"1\">Komparu la eligon de la sekva programo kun la antaŭa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la ĉefa diferenco de <code>say<\/code>: ununura <code>dd<\/code> vokita sur skalaro diras al vi la nomon, kaj, kiam konata, la tipon de la datumoj — do vi povas meti plurajn <code>dd<\/code>-vokojn en programon kaj ankoraŭ rekoni, kiu eligo apartenas al kiu variablo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas ankaŭ elmontri pli kompleksajn datumstrukturojn, kiel tabelojn aŭ hakojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie <code>dd<\/code> presas kodosimilan reprezenton de la valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke la nestita tabelo restas klare videbla (tamen sen variablonomo).<\/span> <span class=\"sg\" data-s=\"1\">Same funkcias por hakoj, kies ŝlosilojn <code>dd<\/code> presas en ordigita ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"la":{"t":"Variabiles dumping","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Voca <code>dd<\/code> ut videas quid variabilis contineat, similiter ac cum <code>say<\/code> faceres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una cum valore, <code>dd<\/code> etiam nomen variabilis ostendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si variabilis typum declaratum habet, typus quoque apparet.<\/span> <span class=\"sg\" data-s=\"1\">Compara output programmatis sequentis cum praecedenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec est differentia principalis a <code>say<\/code>: unum <code>dd<\/code> in scalari vocatum nomen, et, cum notum est, typum datorum tibi indicat — ut plures vocationes <code>dd<\/code> in programma inserere possis et tamen agnoscas quod output ad quam variabilem pertineat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Potes etiam structuras datorum complexiores exscribere, ut ordines vel hashes.<\/span> <span class=\"sg\" data-s=\"1\">Hic <code>dd<\/code> repraesentationem codici similem valoris imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod ordo insertus clare visibilis manet (nomen variabilis tamen non imprimitur).<\/span> <span class=\"sg\" data-s=\"1\">Idem operatur pro hashes, quorum claves <code>dd<\/code> ordine alphabetico imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]}}}</script>
