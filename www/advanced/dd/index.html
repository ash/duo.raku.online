<script type="application/json" id="page-data">{"u":"advanced/dd","n":341,"k":"section","pv":"advanced/representations/choosing","nx":"advanced/dd/variables","tr":["advanced"],"L":{"en":{"t":"Debugging Raku programs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">There are different ways to debug a program, from a simple printing instruction such as <code>say<\/code> to more elaborate tracing tools.<\/span> <span class=\"sg\" data-s=\"1\">In this section, we will look at the handy <code>dd<\/code> routine.<\/span> <span class=\"sg\" data-s=\"2\">It is built into the Rakudo compiler, although it is not a part of the Raku language standard itself.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The name <code>dd<\/code> stands for <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Unlike <code>say<\/code> or <code>put<\/code>, which are meant for the normal output of the program, <code>dd<\/code> prints a developer-friendly representation of a value — the same code-like form produced by the <a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> method from the previous section.<\/span> <span class=\"sg\" data-s=\"2\">It writes to the standard error stream, so its output does not mix with the data that your program prints for the user.<\/span><\/p>"]]},"de":{"t":"Debugging mit <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt verschiedene Wege, ein Programm zu debuggen, von einer einfachen Druckanweisung wie <code>say<\/code> bis hin zu ausgefeilteren Tracing-Werkzeugen.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Abschnitt schauen wir uns die praktische <code>dd<\/code>-Routine an.<\/span> <span class=\"sg\" data-s=\"2\">Sie ist in den Rakudo-Compiler eingebaut, gehört aber nicht zum Raku-Sprachstandard selbst.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Name <code>dd<\/code> steht für <em>Data Dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Anders als <code>say<\/code> oder <code>put<\/code>, die für die normale Ausgabe des Programms gedacht sind, gibt <code>dd<\/code> eine entwicklerfreundliche Darstellung eines Wertes aus — dieselbe codeähnliche Form, die von der <a href=\"https://course.raku.org/de/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code>-Methode<\/a> aus dem vorherigen Abschnitt erzeugt wird.<\/span> <span class=\"sg\" data-s=\"2\">Die Ausgabe erfolgt auf den Standardfehlerstream, sodass sie sich nicht mit den Daten vermischt, die dein Programm für den Benutzer ausgibt.<\/span><\/p>"]]},"nl":{"t":"Debuggen met <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Er zijn verschillende manieren om een programma te debuggen, van een eenvoudige printinstructie zoals <code>say<\/code> tot meer uitgebreide traceerhulpmiddelen.<\/span> <span class=\"sg\" data-s=\"1\">In dit onderdeel bekijken we de handige <code>dd<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"2\">Deze is ingebouwd in de Rakudo-compiler, hoewel het geen onderdeel is van de Raku-taalstandaard zelf.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De naam <code>dd<\/code> staat voor <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Anders dan <code>say<\/code> of <code>put<\/code>, die bedoeld zijn voor de normale uitvoer van het programma, toont <code>dd<\/code> een ontwikkelaarsvriendelijke weergave van een waarde — dezelfde codeachtige vorm die wordt geproduceerd door de <a href=\"https://course.raku.org/nl/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>-methode uit het vorige onderdeel.<\/span> <span class=\"sg\" data-s=\"2\">Het schrijft naar de standaardfoutstroom, zodat de uitvoer niet vermengd raakt met de gegevens die je programma voor de gebruiker afdrukt.<\/span><\/p>"]]},"es":{"t":"Depuración con <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay diferentes formas de depurar un programa, desde una simple instrucción de impresión como <code>say<\/code> hasta herramientas de rastreo más elaboradas.<\/span> <span class=\"sg\" data-s=\"1\">En esta sección, veremos la práctica rutina <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Está integrada en el compilador Rakudo, aunque no es parte del estándar del lenguaje Raku en sí.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El nombre <code>dd<\/code> significa <em>data dumper<\/em> (volcador de datos).<\/span> <span class=\"sg\" data-s=\"1\">A diferencia de <code>say<\/code> o <code>put<\/code>, que están destinados a la salida normal del programa, <code>dd<\/code> imprime una representación orientada al desarrollador de un valor — la misma forma similar a código producida por el método <a href=\"https://course.raku.org/es/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> de la sección anterior.<\/span> <span class=\"sg\" data-s=\"2\">Escribe en el flujo de error estándar, de modo que su salida no se mezcla con los datos que tu programa imprime para el usuario.<\/span><\/p>"]]},"it":{"t":"Debugging con <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Esistono diversi modi per eseguire il debug di un programma, da una semplice istruzione di stampa come <code>say<\/code> a strumenti di tracciamento più elaborati.<\/span> <span class=\"sg\" data-s=\"1\">In questa sezione, esamineremo la comoda routine <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">È integrata nel compilatore Rakudo, anche se non fa parte dello standard del linguaggio Raku stesso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il nome <code>dd<\/code> sta per <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">A differenza di <code>say<\/code> o <code>put<\/code>, che sono destinati all'output normale del programma, <code>dd<\/code> stampa una rappresentazione del valore adatta allo sviluppatore — la stessa forma simile a codice prodotta dal metodo <a href=\"https://course.raku.org/it/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> della sezione precedente.<\/span> <span class=\"sg\" data-s=\"2\">Scrive sul flusso di errore standard, quindi il suo output non si mescola con i dati che il programma stampa per l'utente.<\/span><\/p>"]]},"lv":{"t":"Atkļūdošana ar <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Programmu atkļūdot var dažādi — no vienkāršas drukāšanas instrukcijas, piemēram, <code>say<\/code>, līdz izsmalcinātākiem izsekošanas rīkiem.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā aplūkosim ērto rutīnu <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir iebūvēta Rakudo kompilatorā, lai gan pati par sevi nav Raku valodas standarta daļa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nosaukums <code>dd<\/code> cēlies no <em>data dumper<\/em> (datu izmetējs).<\/span> <span class=\"sg\" data-s=\"1\">Atšķirībā no <code>say<\/code> vai <code>put<\/code>, kas paredzēti programmas parastajai izvadei, <code>dd<\/code> izdrukā izstrādātājam draudzīgu vērtības atveidojumu — to pašu kodam līdzīgo formu, ko iepriekšējā sadaļā deva metode <a href=\"https://course.raku.org/lv/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tā raksta standarta kļūdu plūsmā, tāpēc tās izvade nesajaucas ar datiem, ko programma izdrukā lietotājam.<\/span><\/p>"]]},"ru":{"t":"Отладка с помощью <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Существуют разные способы отладки программы: от простой инструкции печати, такой как <code>say<\/code>, до более сложных инструментов трассировки.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе мы рассмотрим удобную процедуру <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Она встроена в компилятор Rakudo, хотя и не является частью стандарта языка Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Название <code>dd<\/code> расшифровывается как <em>data dumper<\/em> (дампер данных).<\/span> <span class=\"sg\" data-s=\"1\">В отличие от <code>say<\/code> или <code>put<\/code>, которые предназначены для обычного вывода программы, <code>dd<\/code> печатает удобное для разработчика представление значения — ту же кодоподобную форму, которую создаёт метод <a href=\"https://course.raku.org/ru/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> из предыдущего раздела.<\/span> <span class=\"sg\" data-s=\"2\">Она выводит данные в поток стандартной ошибки, поэтому её вывод не смешивается с данными, которые ваша программа печатает для пользователя.<\/span><\/p>"]]},"uk":{"t":"Налагодження з <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Існують різні способи налагодження програми: від простої інструкції друку, такої як <code>say<\/code>, до більш складних інструментів трасування.<\/span> <span class=\"sg\" data-s=\"1\">У цьому розділі ми розглянемо зручну процедуру <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вона вбудована в компілятор Rakudo, хоча і не є частиною стандарту мови Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Назва <code>dd<\/code> означає <em>data dumper<\/em> (дамп даних).<\/span> <span class=\"sg\" data-s=\"1\">На відміну від <code>say<\/code> або <code>put<\/code>, які призначені для звичайного виводу програми, <code>dd<\/code> друкує зручне для розробника представлення значення — ту саму форму, подібну до коду, яку створює метод <a href=\"https://course.raku.org/uk/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> з попереднього розділу.<\/span> <span class=\"sg\" data-s=\"2\">Вона пише у стандартний потік помилок, тому її вивід не змішується з даними, які ваша програма друкує для користувача.<\/span><\/p>"]]},"bg":{"t":"Отстраняване на грешки с <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Има различни начини за дебъгване на програма, от прост оператор за отпечатване като <code>say<\/code> до по-сложни инструменти за проследяване.<\/span> <span class=\"sg\" data-s=\"1\">В тази секция ще разгледаме удобната процедура <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тя е вградена в компилатора Rakudo, въпреки че не е част от стандарта на езика Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Името <code>dd<\/code> означава <em>data dumper<\/em> (инструмент за извеждане на данни).<\/span> <span class=\"sg\" data-s=\"1\">За разлика от <code>say<\/code> или <code>put<\/code>, които са предназначени за нормалния изход на програмата, <code>dd<\/code> отпечатва представяне на стойност, удобно за разработчици — същата кодоподобна форма, произведена от метода <a href=\"https://course.raku.org/bg/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> от предишната секция.<\/span> <span class=\"sg\" data-s=\"2\">Тя записва в стандартния поток за грешки, така че изходът й не се смесва с данните, които програмата ви отпечатва за потребителя.<\/span><\/p>"]]},"eo":{"t":"Senararigado kun <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ekzistas diversaj manieroj sencimigi programon, de simpla preskomando kiel <code>say<\/code> ĝis pli kompleksaj spuriloj.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu sekcio, ni rigardos la utilan rutinon <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas enkonstruita en la Rakudo-kompililo, kvankam ĝi ne estas parto de la normo de la lingvo Raku mem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La nomo <code>dd<\/code> signifas <em>data dumper<\/em> (datumelmontrilon).<\/span> <span class=\"sg\" data-s=\"1\">Male al <code>say<\/code> aŭ <code>put<\/code>, kiuj estas destinitaj por la normala eligo de la programo, <code>dd<\/code> presas programist-amikan reprezenton de valoro — la saman kodosimilan formon produktitan de la metodo <a href=\"https://course.raku.org/eo/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> el la antaŭa sekcio.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi skribas al la norma erara fluo, do ĝia eligo ne miksiĝas kun la datumoj, kiujn via programo presas por la uzanto.<\/span><\/p>"]]},"la":{"t":"Debugging cum <code>dd<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Diversi modi sunt ad programma corrigendum, a simplici instructione imprimendi ut <code>say<\/code> ad instrumenta elaboratiora vestigiandi.<\/span> <span class=\"sg\" data-s=\"1\">In hac sectione, subroutinam commodam <code>dd<\/code> inspiciemus.<\/span> <span class=\"sg\" data-s=\"2\">Haec in compilatorem Rakudo incorporata est, quamvis non pars normae linguae Raku ipsius sit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomen <code>dd<\/code> significat <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dissimilis a <code>say<\/code> vel <code>put<\/code>, quae pro output normali programmatis destinantur, <code>dd<\/code> repraesentationem valoris amicam developori imprimit — eandem formam codici similem quam methodus <a href=\"https://course.raku.org/la/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> ex sectione praecedenti producit.<\/span> <span class=\"sg\" data-s=\"2\">In flumen erroris normalis scribit, ut eius output cum datis quae programma tuum pro usore imprimit non misceatur.<\/span><\/p>"]]}}}</script>
