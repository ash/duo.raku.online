<script type="application/json" id="page-data">{"u":"advanced/modules-basics/export-tags","n":697,"k":"topic","pv":"advanced/modules-basics/importing/quiz","nx":"advanced/modules-basics/export-tags/quiz","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"Export tags","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Marking a subroutine <code>is export<\/code> places it in a module’s <em>default<\/em> export group — the names a plain <code>use<\/code> brings in.<\/span> <span class=\"sg\" data-s=\"1\">By giving <code>is export<\/code> a <em>tag<\/em>, you can sort exports into named groups and let each program pick the set it wants.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A tag is written in parentheses after <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> has no tag, so it belongs to the default group; <code>goodbye<\/code> is tagged <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A plain <code>use<\/code> imports the default group only:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Naming a tag imports that group instead — and, perhaps surprisingly, <em>not<\/em> the default one as well:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Asking for <code>:partings<\/code> gives you exactly that group.<\/span> <span class=\"sg\" data-s=\"1\">To pull in everything a module exports, use the built-in <code>:ALL<\/code> tag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Two special tags are worth knowing.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> is supported by every module and imports all of its exports.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> is one you can place on a routine that should be imported no matter which tag the caller chooses.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each tag is really a package inside the module’s <code>EXPORT<\/code> package — <code>Greeting::EXPORT::partings<\/code>, for example — which is exactly what <a href=\"/advanced/module-introspection/\">module introspection<\/a> lists.<\/span> <span class=\"sg\" data-s=\"1\">Tags let a larger module keep its default surface small while still offering extra features on request.<\/span><\/p>"]]},"de":{"t":"Export-Tags","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine mit <code>is export<\/code> zu markieren, platziert sie in der <em>Standard<\/em>-Exportgruppe eines Moduls — die Namen, die ein einfaches <code>use<\/code> einbringt.<\/span> <span class=\"sg\" data-s=\"1\">Indem du <code>is export<\/code> ein <em>Tag<\/em> gibst, kannst du Exporte in benannte Gruppen sortieren und jedes Programm die gewünschte Menge auswählen lassen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Tag wird in Klammern nach <code>is export<\/code> geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> hat kein Tag, gehört also zur Standardgruppe; <code>goodbye<\/code> ist mit <code>:partings<\/code> getaggt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein einfaches <code>use<\/code> importiert nur die Standardgruppe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Angabe eines Tags importiert stattdessen diese Gruppe — und, vielleicht überraschend, <em>nicht<\/em> auch die Standardgruppe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du <code>:partings<\/code> anforderst, erhältst du genau diese Gruppe.<\/span> <span class=\"sg\" data-s=\"1\">Um alles zu importieren, was ein Modul exportiert, verwende das eingebaute Tag <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zwei besondere Tags sind wissenswert.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> wird von jedem Modul unterstützt und importiert alle seine Exporte.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> kannst du auf eine Routine setzen, die immer importiert werden soll, egal welches Tag der Aufrufer wählt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Tag ist eigentlich ein Paket innerhalb des <code>EXPORT<\/code>-Pakets des Moduls — zum Beispiel <code>Greeting::EXPORT::partings<\/code> — was genau das ist, was die <a href=\"https://course.raku.org/de/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Modul-Introspektion<\/a> auflistet.<\/span> <span class=\"sg\" data-s=\"1\">Tags ermöglichen es einem größeren Modul, seine Standardoberfläche klein zu halten und trotzdem zusätzliche Funktionen auf Anfrage anzubieten.<\/span><\/p>"]]},"nl":{"t":"Export-tags","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het markeren van een subroutine met <code>is export<\/code> plaatst deze in de <em>standaard<\/em> exportgroep van een module — de namen die een gewone <code>use<\/code> binnenhaalt.<\/span> <span class=\"sg\" data-s=\"1\">Door <code>is export<\/code> een <em>tag<\/em> mee te geven, kun je exports in benoemde groepen sorteren en elk programma de gewenste set laten kiezen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een tag wordt tussen haakjes geschreven na <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> heeft geen tag, dus het hoort bij de standaardgroep; <code>goodbye<\/code> is getagd met <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een gewone <code>use<\/code> importeert alleen de standaardgroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is beschikbaar; goodbye niet<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het noemen van een tag importeert die groep in plaats daarvan — en, misschien verrassend, <em>niet<\/em> ook de standaardgroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is beschikbaar; hello niet<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vragen om <code>:partings<\/code> geeft je precies die groep.<\/span> <span class=\"sg\" data-s=\"1\">Om alles te importeren wat een module exporteert, gebruik je de ingebouwde <code>:ALL<\/code>-tag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # zowel hello als goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Twee speciale tags zijn het vermelden waard.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> wordt door elke module ondersteund en importeert al diens exports.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> is een tag die je op een routine kunt plaatsen die altijd geïmporteerd moet worden, ongeacht welke tag de aanroeper kiest.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke tag is in feite een pakket binnen het <code>EXPORT<\/code>-pakket van de module — bijvoorbeeld <code>Greeting::EXPORT::partings<\/code> — wat precies is wat <a href=\"https://course.raku.org/nl/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">module-introspectie<\/a> toont.<\/span> <span class=\"sg\" data-s=\"1\">Tags laten een grotere module zijn standaardoppervlak klein houden terwijl het toch extra functies op verzoek aanbiedt.<\/span><\/p>"]]},"es":{"t":"Etiquetas de exportación","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Marcar una subrutina con <code>is export<\/code> la coloca en el grupo de exportación <em>predeterminado<\/em> del módulo — los nombres que un simple <code>use<\/code> incorpora.<\/span> <span class=\"sg\" data-s=\"1\">Al darle a <code>is export<\/code> una <em>etiqueta<\/em>, puedes organizar las exportaciones en grupos con nombre y dejar que cada programa elija el conjunto que desea.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una etiqueta se escribe entre paréntesis después de <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> no tiene etiqueta, por lo que pertenece al grupo predeterminado; <code>goodbye<\/code> está etiquetada con <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un simple <code>use<\/code> importa solo el grupo predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nombrar una etiqueta importa ese grupo en su lugar — y, quizás sorprendentemente, <em>no<\/em> el predeterminado también:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pedir <code>:partings<\/code> te da exactamente ese grupo.<\/span> <span class=\"sg\" data-s=\"1\">Para incorporar todo lo que un módulo exporta, usa la etiqueta incorporada <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vale la pena conocer dos etiquetas especiales.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> es soportada por todos los módulos e importa todas sus exportaciones.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> es una que puedes colocar en una rutina que debería importarse sin importar qué etiqueta elija el llamador.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada etiqueta es en realidad un paquete dentro del paquete <code>EXPORT<\/code> del módulo — <code>Greeting::EXPORT::partings<\/code>, por ejemplo — que es exactamente lo que lista la <a href=\"https://course.raku.org/es/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspección de módulos<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Las etiquetas permiten que un módulo grande mantenga su superficie predeterminada pequeña mientras sigue ofreciendo características adicionales bajo demanda.<\/span><\/p>"]]},"it":{"t":"Tag di esportazione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Contrassegnare una subroutine con <code>is export<\/code> la inserisce nel gruppo di esportazione <em>predefinito<\/em> di un modulo — i nomi che un semplice <code>use<\/code> importa.<\/span> <span class=\"sg\" data-s=\"1\">Assegnando un <em>tag<\/em> a <code>is export<\/code>, puoi organizzare le esportazioni in gruppi denominati e lasciare che ogni programma scelga il set desiderato.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un tag si scrive tra parentesi dopo <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> non ha tag, quindi appartiene al gruppo predefinito; <code>goodbye<\/code> e taggato <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un semplice <code>use<\/code> importa solo il gruppo predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Specificando un tag si importa quel gruppo invece — e, forse sorprendentemente, <em>non<\/em> anche quello predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Richiedere <code>:partings<\/code> da esattamente quel gruppo.<\/span> <span class=\"sg\" data-s=\"1\">Per importare tutto cio che un modulo esporta, usa il tag integrato <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Due tag speciali meritano di essere conosciuti.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> e supportato da ogni modulo e importa tutte le sue esportazioni.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> e un tag che puoi applicare a una routine che deve essere importata indipendentemente dal tag scelto dal chiamante.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni tag e in realta un pacchetto all'interno del pacchetto <code>EXPORT<\/code> del modulo — <code>Greeting::EXPORT::partings<\/code>, per esempio — che e esattamente cio che l'<a href=\"https://course.raku.org/it/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspezione dei moduli<\/a> elenca.<\/span> <span class=\"sg\" data-s=\"1\">I tag permettono a un modulo piu grande di mantenere ridotta la superficie predefinita, offrendo al contempo funzionalita aggiuntive su richiesta.<\/span><\/p>"]]},"lv":{"t":"Eksporta tagi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Atzīmējot apakšprogrammu ar <code>is export<\/code>, tā tiek ielikta moduļa <em>noklusētajā<\/em> eksporta grupā — nosaukumos, ko ienes vienkāršs <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dodot <code>is export<\/code> <em>birku<\/em>, eksportus var sašķirot nosauktās grupās un ļaut katrai programmai izvēlēties vēlamo kopu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Birku raksta iekavās aiz <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> nav birkas, tāpēc tā pieder noklusētajai grupai; <code>goodbye<\/code> ir apzīmēta ar <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršs <code>use<\/code> importē tikai noklusēto grupu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nosaucot birku, tiek importēta tā grupa — un, iespējams, pārsteidzoši, <em>ne arī<\/em> noklusētā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prasot <code>:partings<\/code>, iegūstat tieši šo grupu.<\/span> <span class=\"sg\" data-s=\"1\">Lai ievilktu visu, ko modulis eksportē, izmantojiet iebūvēto birku <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Divas īpašas birkas ir vērts zināt.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> atbalsta katrs modulis, un tā importē visus tā eksportus.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> ir tāda, ko varat uzlikt rutīnai, kurai jātiek importētai neatkarīgi no tā, kuru birku izsaucējs izvēlas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katra birka patiesībā ir pakotne moduļa pakotnē <code>EXPORT<\/code> — piemēram, <code>Greeting::EXPORT::partings<\/code> —, un tieši to uzskaita <a href=\"https://course.raku.org/lv/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">moduļu introspekcija<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Birkas ļauj lielākam modulim noturēt savu noklusēto virsmu nelielu, joprojām piedāvājot papildu iespējas pēc pieprasījuma.<\/span><\/p>"]]},"ru":{"t":"Теги экспорта","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пометка подпрограммы <code>is export<\/code> помещает её в группу экспорта модуля <em>по умолчанию<\/em> — это имена, которые подключает простой <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Добавив к <code>is export<\/code> <em>тег<\/em>, вы можете распределить экспорты по именованным группам и позволить каждой программе выбирать нужный набор.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тег записывается в скобках после <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У <code>hello<\/code> нет тега, поэтому она принадлежит группе по умолчанию; <code>goodbye<\/code> помечена тегом <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Простой <code>use<\/code> импортирует только группу по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Указание тега импортирует эту группу вместо группы по умолчанию — и, возможно неожиданно, <em>не<\/em> включает группу по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запрашивая <code>:partings<\/code>, вы получаете именно эту группу.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы подключить всё, что модуль экспортирует, используйте встроенный тег <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стоит знать два специальных тега.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> поддерживается каждым модулем и импортирует все его экспорты.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> можно поставить на подпрограмму, которая должна импортироваться независимо от того, какой тег выберет вызывающая сторона.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый тег — это на самом деле пакет внутри пакета <code>EXPORT<\/code> модуля, например <code>Greeting::EXPORT::partings<\/code>, — именно это показывает <a href=\"https://course.raku.org/ru/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">интроспекция модулей<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Теги позволяют большому модулю сохранять небольшую поверхность по умолчанию, при этом предлагая дополнительные возможности по запросу.<\/span><\/p>"]]},"uk":{"t":"Мітки експорту","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Позначення підпрограми як <code>is export<\/code> кладе її до <em>типової<\/em> групи експорту модуля — тих імен, які приносить звичайний <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Надавши <code>is export<\/code> <em>мітку<\/em>, ви можете розсортувати експорти по іменованих групах і дозволити кожній програмі обрати потрібний їй набір.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Мітку записують у дужках після <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> не має мітки, тож належить до типової групи; <code>goodbye<\/code> позначено міткою <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайний <code>use<\/code> імпортує лише типову групу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello доступна; goodbye ні<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Називання мітки імпортує натомість ту групу — і, можливо, несподівано, <em>не<\/em> типову на додачу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye доступна; hello ні<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запит <code>:partings<\/code> дає вам саме цю групу.<\/span> <span class=\"sg\" data-s=\"1\">Щоб підтягнути все, що експортує модуль, скористайтеся вбудованою міткою <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # і hello, і goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дві особливі мітки варто знати.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> підтримується кожним модулем і імпортує всі його експорти.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> — та, яку можна поставити на підпрограму, що має імпортуватися незалежно від того, яку мітку обрав викликач.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна мітка насправді є пакунком усередині пакунка <code>EXPORT<\/code> модуля — наприклад, <code>Greeting::EXPORT::partings<\/code>, — і саме це перелічує <a href=\"https://course.raku.org/uk/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">інтроспекція модулів<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Мітки дозволяють більшому модулю тримати свою типову поверхню невеликою, водночас пропонуючи додаткові можливості на запит.<\/span><\/p>"]]},"bg":{"t":"Тагове за експортиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Маркирането на подпрограма с <code>is export<\/code> я поставя в <em>групата по подразбиране<\/em> за експортиране на модула — имената, които обикновен <code>use<\/code> внася.<\/span> <span class=\"sg\" data-s=\"1\">Чрез добавяне на <em>таг<\/em> към <code>is export<\/code>, можете да разпределите експортите в именувани групи и да позволите на всяка програма да избере набора, който иска.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тагът се записва в скоби след <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> няма таг, така че принадлежи към групата по подразбиране; <code>goodbye<\/code> е маркиран с <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обикновен <code>use<\/code> импортира само групата по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Посочването на таг импортира тази група вместо това — и, може би изненадващо, <em>не<\/em> включва групата по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Заявяването на <code>:partings<\/code> ви дава точно тази група.<\/span> <span class=\"sg\" data-s=\"1\">За да получите всичко, което модулът експортира, използвайте вградения таг <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Два специални тага си заслужават да се знаят.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> се поддържа от всеки модул и импортира всички негови експорти.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> е таг, който можете да поставите на рутина, която трябва да се импортира независимо кой таг избере извикващият.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки таг всъщност е пакет вътре в пакета <code>EXPORT<\/code> на модула — <code>Greeting::EXPORT::partings<\/code>, например — което е точно каквото <a href=\"https://course.raku.org/bg/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">интроспекцията на модулите<\/a> показва.<\/span> <span class=\"sg\" data-s=\"1\">Таговете позволяват на по-голям модул да поддържа малка повърхност по подразбиране, като същевременно предлага допълнителни функции при поискване.<\/span><\/p>"]]},"eo":{"t":"Eksportaj etikedoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Markado de subprogramo per <code>is export<\/code> metas ĝin en la <em>defaŭltan<\/em> eksportgrupon de modulo — la nomojn, kiujn simpla <code>use<\/code> alportas.<\/span> <span class=\"sg\" data-s=\"1\">Donante al <code>is export<\/code> <em>etikedon<\/em>, vi povas ordigi eksportojn en nomitajn grupojn kaj lasi ĉiun programon elekti la aron, kiun ĝi volas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Etikedo estas skribita en krampoj post <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> ne havas etikedon, do ĝi apartenas al la defaŭlta grupo; <code>goodbye<\/code> estas etikedita per <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simpla <code>use<\/code> importas nur la defaŭltan grupon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello estas disponebla; goodbye ne estas<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nomante etikedon importas tiun grupon anstataŭe — kaj, eble surprize, <em>ne<\/em> la defaŭltan kune:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye estas disponebla; hello ne estas<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Petante <code>:partings<\/code> donas al vi ĝuste tiun grupon.<\/span> <span class=\"sg\" data-s=\"1\">Por enporti ĉion, kion modulo eksportas, uzu la enkonstruitan etikedon <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # ambaŭ hello kaj goodbye<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du specialaj etikedoj indas scii.<\/span> <span class=\"sg\" data-s=\"1\"><code>:ALL<\/code> estas subtenata de ĉiu modulo kaj importas ĉiujn ĝiajn eksportojn.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> estas tia, kiun vi povas meti sur rutinon, kiu estu importita sendepende de tio, kiun etikedon la vokanto elektas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu etikedo estas fakte pako ene de la <code>EXPORT<\/code>-pako de la modulo — <code>Greeting::EXPORT::partings<\/code>, ekzemple — kio estas precize tio, kion <a href=\"https://course.raku.org/eo/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">modula introspekto<\/a> listigas.<\/span> <span class=\"sg\" data-s=\"1\">Etikedoj permesas al pli granda modulo teni sian defaŭltan surfacon malgranda, samtempe daŭre ofertante pliajn funkciojn laŭpete.<\/span><\/p>"]]}}}</script>
