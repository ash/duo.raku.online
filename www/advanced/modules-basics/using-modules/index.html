<script type="application/json" id="page-data">{"u":"advanced/modules-basics/using-modules","n":693,"k":"topic","pv":"advanced/modules-basics/creating-modules/quiz","nx":"advanced/modules-basics/using-modules/quiz","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"Using modules","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To use a module, load it with the <code>use<\/code> statement.<\/span> <span class=\"sg\" data-s=\"1\">After that, the names the module exports are available as if you had written them yourself.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Given the <code>Greeting.rakumod<\/code> file from the previous topic, a program uses it like this:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because <code>hello<\/code> was marked <code>is export<\/code>, the <code>use<\/code> statement makes it available, and the program calls it directly:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For Raku to find the module, it has to be on the module search path.<\/span> <span class=\"sg\" data-s=\"1\">When the module file sits in the same directory as your program, you tell Raku to look there with the <code>-I.<\/code> option (the dot means “the current directory”):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Installed modules (covered later in <a href=\"/advanced/installing-modules/\">Installing modules from the web<\/a>) are found automatically, so the <code>-I<\/code> option is only needed for modules that live next to your own program.<\/span><\/p>"]]},"de":{"t":"Module verwenden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um ein Modul zu verwenden, lade es mit der <code>use<\/code>-Anweisung.<\/span> <span class=\"sg\" data-s=\"1\">Danach sind die Namen, die das Modul exportiert, verfügbar, als hättest du sie selbst geschrieben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Angenommen, die Datei <code>Greeting.rakumod<\/code> aus dem vorherigen Thema liegt vor, dann verwendet ein Programm sie so:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da <code>hello<\/code> mit <code>is export<\/code> markiert wurde, macht die <code>use<\/code>-Anweisung sie verfügbar, und das Programm ruft sie direkt auf:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Damit Raku das Modul findet, muss es sich im Modul-Suchpfad befinden.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Moduldatei im selben Verzeichnis wie dein Programm liegt, sagst du Raku mit der Option <code>-I.<\/code> (der Punkt bedeutet „das aktuelle Verzeichnis\"), dort zu suchen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Installierte Module (später behandelt unter <a href=\"https://course.raku.org/de/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Module aus dem Web installieren<\/a>) werden automatisch gefunden, sodass die Option <code>-I<\/code> nur für Module benötigt wird, die neben deinem eigenen Programm liegen.<\/span><\/p>"]]},"nl":{"t":"Modules gebruiken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een module te gebruiken, laad je deze met het <code>use<\/code>-statement.<\/span> <span class=\"sg\" data-s=\"1\">Daarna zijn de namen die de module exporteert beschikbaar alsof je ze zelf had geschreven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gegeven het bestand <code>Greeting.rakumod<\/code> uit het vorige onderwerp, gebruikt een programma het als volgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>hello<\/code> gemarkeerd was met <code>is export<\/code>, maakt het <code>use<\/code>-statement het beschikbaar, en het programma roept het direct aan:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om de module te vinden, moet deze op het modulezoekpad staan.<\/span> <span class=\"sg\" data-s=\"1\">Wanneer het modulebestand in dezelfde map staat als je programma, vertel je Raku om daar te zoeken met de <code>-I.<\/code>-optie (de punt betekent \"de huidige map\"):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Geïnstalleerde modules (later behandeld in <a href=\"https://course.raku.org/nl/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Modules van het web installeren<\/a>) worden automatisch gevonden, dus de <code>-I<\/code>-optie is alleen nodig voor modules die naast je eigen programma staan.<\/span><\/p>"]]},"es":{"t":"Usar módulos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para usar un módulo, cárgalo con la instrucción <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después de eso, los nombres que el módulo exporta están disponibles como si los hubieras escrito tú mismo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dado el archivo <code>Greeting.rakumod<\/code> del tema anterior, un programa lo usa así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Debido a que <code>hello<\/code> fue marcada con <code>is export<\/code>, la instrucción <code>use<\/code> la pone a disposición, y el programa la llama directamente:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para que Raku encuentre el módulo, este debe estar en la ruta de búsqueda de módulos.<\/span> <span class=\"sg\" data-s=\"1\">Cuando el archivo del módulo está en el mismo directorio que tu programa, le dices a Raku que busque ahí con la opción <code>-I.<\/code> (el punto significa \"el directorio actual\"):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los módulos instalados (cubiertos más adelante en <a href=\"https://course.raku.org/es/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Instalar módulos desde la web<\/a>) se encuentran automáticamente, por lo que la opción <code>-I<\/code> solo es necesaria para módulos que están junto a tu propio programa.<\/span><\/p>"]]},"it":{"t":"Usare moduli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per usare un modulo, caricalo con l'istruzione <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dopo di che, i nomi che il modulo esporta sono disponibili come se li avessi scritti tu stesso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dato il file <code>Greeting.rakumod<\/code> dell'argomento precedente, un programma lo usa cosi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiche <code>hello<\/code> e stato contrassegnato con <code>is export<\/code>, l'istruzione <code>use<\/code> lo rende disponibile e il programma lo chiama direttamente:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Affinche Raku trovi il modulo, questo deve trovarsi nel percorso di ricerca dei moduli.<\/span> <span class=\"sg\" data-s=\"1\">Quando il file del modulo si trova nella stessa directory del tuo programma, puoi dire a Raku di cercare li con l'opzione <code>-I.<\/code> (il punto significa \"la directory corrente\"):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I moduli installati (trattati piu avanti in <a href=\"https://course.raku.org/it/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Installare moduli dal web<\/a>) vengono trovati automaticamente, quindi l'opzione <code>-I<\/code> e necessaria solo per i moduli che si trovano accanto al tuo programma.<\/span><\/p>"]]},"lv":{"t":"Moduļu izmantošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai izmantotu moduli, ielādējiet to ar teikumu <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam nosaukumi, ko modulis eksportē, ir pieejami tā, it kā jūs pats tos būtu uzrakstījis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ņemot failu <code>Greeting.rakumod<\/code> no iepriekšējā temata, programma to izmanto šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>hello<\/code> bija atzīmēta ar <code>is export<\/code>, teikums <code>use<\/code> to padara pieejamu, un programma to izsauc tieši:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai Raku moduli atrastu, tam jābūt uz moduļu meklēšanas ceļa.<\/span> <span class=\"sg\" data-s=\"1\">Kad moduļa fails atrodas tajā pašā direktorijā, kur jūsu programma, jūs Raku liekat meklēt tur ar opciju <code>-I.<\/code> (punkts nozīmē «pašreizējā direktorija»):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Instalētie moduļi (aplūkoti vēlāk sadaļā <a href=\"https://course.raku.org/lv/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Moduļu instalēšana no tīmekļa<\/a>) tiek atrasti automātiski, tāpēc opcija <code>-I<\/code> vajadzīga tikai moduļiem, kas dzīvo blakus jūsu paša programmai.<\/span><\/p>"]]},"ru":{"t":"Использование модулей","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы использовать модуль, загрузите его с помощью инструкции <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После этого имена, которые модуль экспортирует, доступны так, как будто вы написали их сами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Имея файл <code>Greeting.rakumod<\/code> из предыдущей темы, программа использует его следующим образом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>hello<\/code> была помечена <code>is export<\/code>, инструкция <code>use<\/code> делает её доступной, и программа вызывает её напрямую:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы Raku нашёл модуль, тот должен находиться в пути поиска модулей.<\/span> <span class=\"sg\" data-s=\"1\">Когда файл модуля лежит в том же каталоге, что и ваша программа, укажите Raku искать там с помощью опции <code>-I.<\/code> (точка означает «текущий каталог»):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Установленные модули (о них позже в разделе <a href=\"https://course.raku.org/ru/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Установка модулей из сети<\/a>) находятся автоматически, поэтому опция <code>-I<\/code> нужна только для модулей, которые лежат рядом с вашей программой.<\/span><\/p>"]]},"uk":{"t":"Використання модулів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб скористатися модулем, завантажте його оператором <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після цього імена, які модуль експортує, доступні так, ніби ви написали їх самі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Маючи файл <code>Greeting.rakumod<\/code> із попередньої теми, програма використовує його так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>hello<\/code> було позначено <code>is export<\/code>, оператор <code>use<\/code> робить її доступною, і програма викликає її напряму:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб Raku знайшов модуль, той має бути на шляху пошуку модулів.<\/span> <span class=\"sg\" data-s=\"1\">Коли файл модуля лежить у тому самому каталозі, що й ваша програма, ви кажете Raku шукати там за допомогою опції <code>-I.<\/code> (крапка означає «поточний каталог»):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Встановлені модулі (про них далі в темі <a href=\"https://course.raku.org/uk/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Встановлення модулів із мережі<\/a>) знаходяться автоматично, тож опція <code>-I<\/code> потрібна лише для модулів, які живуть поруч із вашою власною програмою.<\/span><\/p>"]]},"bg":{"t":"Използване на модули","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да използвате модул, заредете го с оператора <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това имената, които модулът експортира, са достъпни, сякаш сте ги написали сами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С файла <code>Greeting.rakumod<\/code> от предишната тема, програмата го използва по следния начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като <code>hello<\/code> беше маркирана с <code>is export<\/code>, операторът <code>use<\/code> я прави достъпна и програмата я извиква директно:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да може Raku да намери модула, той трябва да бъде в пътя за търсене на модули.<\/span> <span class=\"sg\" data-s=\"1\">Когато файлът на модула се намира в същата директория като вашата програма, казвате на Raku да търси там с опцията <code>-I.<\/code> (точката означава „текущата директория\"):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Инсталираните модули (разгледани по-късно в <a href=\"https://course.raku.org/bg/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Инсталиране на модули от мрежата<\/a>) се намират автоматично, така че опцията <code>-I<\/code> е необходима само за модули, които се намират до вашата собствена програма.<\/span><\/p>"]]},"eo":{"t":"Uzi modulojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por uzi modulon, ŝargu ĝin per la deklaro <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, la nomoj, kiujn la modulo eksportas, estas disponeblaj kvazaŭ vi mem skribis ilin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Donita la dosiero <code>Greeting.rakumod<\/code> el la antaŭa temo, programo uzas ĝin jene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar <code>hello<\/code> estis markita per <code>is export<\/code>, la deklaro <code>use<\/code> faras ĝin disponebla, kaj la programo vokas ĝin rekte:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por ke Raku trovu la modulon, ĝi devas esti sur la modula serĉvojo.<\/span> <span class=\"sg\" data-s=\"1\">Kiam la moduldosiero troviĝas en la sama dosierujo kiel via programo, vi diras al Raku serĉi tie per la opcio <code>-I.<\/code> (la punkto signifas \"la aktuala dosierujo\"):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Instalitaj moduloj (kovritaj poste en <a href=\"https://course.raku.org/eo/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Instalado de moduloj el la reto<\/a>) estas trovitaj aŭtomate, do la opcio <code>-I<\/code> estas bezonata nur por moduloj, kiuj loĝas apud via propra programo.<\/span><\/p>"]]},"la":{"t":"Modulos utendo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut modulo utaris, illum per enuntiatum <code>use<\/code> onera.<\/span> <span class=\"sg\" data-s=\"1\">Postea nomina quae modulus exportat praesto sunt ac si ea ipse scripsisses.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dato archivo <code>Greeting.rakumod<\/code> ex argumento superiore, programma eo sic utitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia <code>hello<\/code> <code>is export<\/code> notatum est, enuntiatum <code>use<\/code> illud praesto facit, et programma illud directe vocat:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut Raku modulum inveniat, ille in semita quaesitionis modulorum esse debet.<\/span> <span class=\"sg\" data-s=\"1\">Cum archivum moduli in eadem directoria ac programma tuum sedet, Raku illic quaerere iubes per optionem <code>-I.<\/code> (punctum «directoriam currentem» significat):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Moduli installati (postea in <a href=\"https://course.raku.org/la/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Modulis ex rete installandis<\/a> tractati) sponte inveniuntur, itaque optio <code>-I<\/code> solis modulis opus est qui iuxta programma tuum habitant.<\/span><\/p>"]]}}}</script>
