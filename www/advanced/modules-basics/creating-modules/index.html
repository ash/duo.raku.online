<script type="application/json" id="page-data">{"u":"advanced/modules-basics/creating-modules","n":691,"k":"topic","pv":"advanced/modules-basics","nx":"advanced/modules-basics/creating-modules/quiz","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"Creating modules","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">As programs grow, it helps to split them into reusable pieces.<\/span> <span class=\"sg\" data-s=\"1\">A <em>module<\/em> is a unit of code, kept in its own file, that other programs can load and use.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A module file has the extension <code>.rakumod<\/code> and begins by naming the module with <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Subroutines you write inside are private by default; to make one available to code that uses the module, mark it with the <code>is export<\/code> trait.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a module stored in a file called <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>hello<\/code> subroutine carries <code>is export<\/code>, so it will be visible to any program that uses the module.<\/span> <span class=\"sg\" data-s=\"1\">A subroutine without <code>is export<\/code> would stay private to the module.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A module can also share data through <code>our<\/code> variables, which become reachable through the module’s name.<\/span> <span class=\"sg\" data-s=\"1\">Adding a version number to <code>Greeting<\/code> is as simple as one more line in the file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With that line in <code>Greeting.rakumod<\/code>, the value is available as <code>$Greeting::version<\/code> wherever the module is loaded.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The next topics show <a href=\"/advanced/modules-basics/using-modules/\">how a program loads such a module<\/a> and what exactly it gets from it.<\/span><\/p>"]]},"de":{"t":"Module erstellen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Programme wachsen, ist es hilfreich, sie in wiederverwendbare Teile aufzuteilen.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Modul<\/em> ist eine Code-Einheit, die in einer eigenen Datei gespeichert ist und von anderen Programmen geladen und verwendet werden kann.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Moduldatei hat die Erweiterung <code>.rakumod<\/code> und beginnt mit der Benennung des Moduls durch <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Subroutinen, die du darin schreibst, sind standardmäßig privat; um eine für Code verfügbar zu machen, der das Modul verwendet, markiere sie mit dem Trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Modul, das in einer Datei namens <code>Greeting.rakumod<\/code> gespeichert ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine <code>hello<\/code> trägt <code>is export<\/code>, sodass sie für jedes Programm sichtbar ist, das das Modul verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Eine Subroutine ohne <code>is export<\/code> würde privat im Modul bleiben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Modul kann auch Daten über <code>our<\/code>-Variablen teilen, die über den Namen des Moduls erreichbar werden.<\/span> <span class=\"sg\" data-s=\"1\">Eine Versionsnummer zu <code>Greeting<\/code> hinzuzufügen ist so einfach wie eine weitere Zeile in der Datei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit dieser Zeile in <code>Greeting.rakumod<\/code> ist der Wert überall dort als <code>$Greeting::version<\/code> verfügbar, wo das Modul geladen wird.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, <a href=\"https://course.raku.org/de/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">wie ein Programm ein solches Modul lädt<\/a> und was es genau davon erhält.<\/span><\/p>"]]},"nl":{"t":"Modules aanmaken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naarmate programma's groeien, helpt het om ze op te splitsen in herbruikbare onderdelen.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>module<\/em> is een eenheid van code, bewaard in een eigen bestand, die andere programma's kunnen laden en gebruiken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een modulebestand heeft de extensie <code>.rakumod<\/code> en begint met het benoemen van de module met <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Subroutines die je erin schrijft zijn standaard privé; om er een beschikbaar te maken voor code die de module gebruikt, markeer je deze met de <code>is export<\/code>-eigenschap.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een module opgeslagen in een bestand genaamd <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De subroutine <code>hello<\/code> heeft <code>is export<\/code>, dus deze zal zichtbaar zijn voor elk programma dat de module gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Een subroutine zonder <code>is export<\/code> zou privé blijven voor de module.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een module kan ook gegevens delen via <code>our<\/code>-variabelen, die bereikbaar worden via de naam van de module.<\/span> <span class=\"sg\" data-s=\"1\">Een versienummer toevoegen aan <code>Greeting<\/code> is zo eenvoudig als één extra regel in het bestand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met die regel in <code>Greeting.rakumod<\/code> is de waarde beschikbaar als <code>$Greeting::version<\/code> overal waar de module is geladen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien <a href=\"https://course.raku.org/nl/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">hoe een programma zo'n module laadt<\/a> en wat het er precies van krijgt.<\/span><\/p>"]]},"es":{"t":"Crear módulos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A medida que los programas crecen, es útil dividirlos en piezas reutilizables.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>módulo<\/em> es una unidad de código, guardada en su propio archivo, que otros programas pueden cargar y usar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un archivo de módulo tiene la extensión <code>.rakumod<\/code> y comienza nombrando el módulo con <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Las subrutinas que escribas dentro son privadas por defecto; para hacer que una esté disponible para el código que usa el módulo, márcala con el trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay un módulo almacenado en un archivo llamado <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subrutina <code>hello<\/code> lleva <code>is export<\/code>, por lo que será visible para cualquier programa que use el módulo.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina sin <code>is export<\/code> permanecería privada dentro del módulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un módulo también puede compartir datos a través de variables <code>our<\/code>, que se vuelven accesibles a través del nombre del módulo.<\/span> <span class=\"sg\" data-s=\"1\">Agregar un número de versión a <code>Greeting<\/code> es tan simple como una línea más en el archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con esa línea en <code>Greeting.rakumod<\/code>, el valor está disponible como <code>$Greeting::version<\/code> en cualquier lugar donde se cargue el módulo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran <a href=\"https://course.raku.org/es/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">cómo un programa carga dicho módulo<\/a> y qué obtiene exactamente de él.<\/span><\/p>"]]},"it":{"t":"Creare moduli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Man mano che i programmi crescono, e utile suddividerli in parti riutilizzabili.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>modulo<\/em> e un'unita di codice, conservata in un proprio file, che altri programmi possono caricare e utilizzare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un file di modulo ha l'estensione <code>.rakumod<\/code> e inizia nominando il modulo con <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Le subroutine che scrivi al suo interno sono private per impostazione predefinita; per renderne una disponibile al codice che usa il modulo, contrassegnala con il tratto <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modulo salvato in un file chiamato <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subroutine <code>hello<\/code> porta <code>is export<\/code>, quindi sara visibile a qualsiasi programma che usi il modulo.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine senza <code>is export<\/code> rimarrebbe privata del modulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un modulo puo anche condividere dati tramite variabili <code>our<\/code>, che diventano raggiungibili attraverso il nome del modulo.<\/span> <span class=\"sg\" data-s=\"1\">Aggiungere un numero di versione a <code>Greeting<\/code> e semplice come una riga in piu nel file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con quella riga in <code>Greeting.rakumod<\/code>, il valore e disponibile come <code>$Greeting::version<\/code> ovunque il modulo sia caricato.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano <a href=\"https://course.raku.org/it/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">come un programma carica un tale modulo<\/a> e cosa esattamente ottiene da esso.<\/span><\/p>"]]},"lv":{"t":"Moduļu izveide","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmām augot, noder tās sadalīt atkārtoti izmantojamos gabalos. <em>Modulis<\/em> ir koda vienība, kas glabājas savā failā un ko citas programmas var ielādēt un izmantot.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduļa failam ir paplašinājums <code>.rakumod<\/code>, un tas sākas ar moduļa nosaukšanu ar <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogrammas, ko rakstāt iekšpusē, pēc noklusējuma ir privātas; lai kādu no tām padarītu pieejamu kodam, kas moduli izmanto, atzīmējiet to ar iezīmi <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, modulis, kas glabājas failā ar nosaukumu <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma <code>hello<\/code> nes <code>is export<\/code>, tāpēc tā būs redzama ikvienai programmai, kas moduli izmanto.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogramma bez <code>is export<\/code> paliktu modulim privāta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modulis var koplietot arī datus caur <code>our<\/code> mainīgajiem, kas kļūst sasniedzami caur moduļa nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Versijas numura pievienošana <code>Greeting<\/code> ir tikpat vienkārša kā vēl viena rinda failā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar šo rindu failā <code>Greeting.rakumod<\/code> vērtība ir pieejama kā <code>$Greeting::version<\/code> visur, kur modulis ielādēts.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, <a href=\"https://course.raku.org/lv/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">kā programma šādu moduli ielādē<\/a> un ko tieši tā no tā iegūst.<\/span><\/p>"]]},"ru":{"t":"Создание модулей","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">По мере роста программ удобно разделять их на повторно используемые части. <em>Модуль<\/em> — это единица кода, хранящаяся в отдельном файле, которую другие программы могут загружать и использовать.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Файл модуля имеет расширение <code>.rakumod<\/code> и начинается с объявления имени модуля с помощью <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограммы, написанные внутри, по умолчанию являются приватными; чтобы сделать одну из них доступной для кода, использующего модуль, пометьте её трейтом <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот модуль, сохранённый в файле <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>hello<\/code> помечена <code>is export<\/code>, поэтому она будет видна любой программе, использующей этот модуль.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограмма без <code>is export<\/code> останется приватной для модуля.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модуль также может делиться данными через переменные <code>our<\/code>, которые доступны через имя модуля.<\/span> <span class=\"sg\" data-s=\"1\">Добавить номер версии в <code>Greeting<\/code> — это просто ещё одна строка в файле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С этой строкой в <code>Greeting.rakumod<\/code> значение доступно как <code>$Greeting::version<\/code> везде, где модуль загружен.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, <a href=\"https://course.raku.org/ru/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">как программа загружает такой модуль<\/a> и что именно она из него получает.<\/span><\/p>"]]},"uk":{"t":"Створення модулів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли програми ростуть, стає в пригоді розбиття їх на придатні до повторного використання частини. <em>Модуль<\/em> — це одиниця коду, що зберігається у власному файлі й яку інші програми можуть завантажити та використати.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Файл модуля має розширення <code>.rakumod<\/code> і починається з називання модуля через <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Написані всередині підпрограми за замовчуванням приватні; щоб зробити одну з них доступною коду, який використовує модуль, позначте її трейтом <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось модуль, збережений у файлі під назвою <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>hello<\/code> несе <code>is export<\/code>, тож вона буде видимою будь-якій програмі, яка використовує цей модуль.<\/span> <span class=\"sg\" data-s=\"1\">Підпрограма без <code>is export<\/code> лишилася б приватною для модуля.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модуль може також ділитися даними через змінні <code>our<\/code>, до яких можна дістатися через ім'я модуля.<\/span> <span class=\"sg\" data-s=\"1\">Додати до <code>Greeting<\/code> номер версії — це лише один додатковий рядок у файлі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З цим рядком у <code>Greeting.rakumod<\/code> значення доступне як <code>$Greeting::version<\/code> усюди, де модуль завантажено.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, <a href=\"https://course.raku.org/uk/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">як програма завантажує такий модуль<\/a> і що саме вона від нього отримує.<\/span><\/p>"]]},"bg":{"t":"Създаване на модули","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">С нарастването на програмите е полезно да ги разделяте на части за повторна употреба. <em>Модулът<\/em> е единица код, съхранена в собствен файл, която други програми могат да заредят и използват.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Файлът на модула има разширение <code>.rakumod<\/code> и започва с именуване на модула чрез <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограмите, които пишете вътре, са частни по подразбиране; за да направите някоя достъпна за кода, който използва модула, я маркирайте с характеристиката <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето модул, съхранен във файл на име <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата <code>hello<\/code> носи <code>is export<\/code>, така че ще бъде видима за всяка програма, която използва модула.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограма без <code>is export<\/code> ще остане частна за модула.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модулът може също да споделя данни чрез <code>our<\/code> променливи, които стават достъпни чрез името на модула.<\/span> <span class=\"sg\" data-s=\"1\">Добавянето на номер на версия към <code>Greeting<\/code> е толкова просто, колкото един допълнителен ред във файла:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С този ред в <code>Greeting.rakumod<\/code>, стойността е достъпна като <code>$Greeting::version<\/code> навсякъде, където модулът е зареден.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват <a href=\"https://course.raku.org/bg/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">как програмата зарежда такъв модул<\/a> и какво точно получава от него.<\/span><\/p>"]]},"eo":{"t":"Krei modulojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dum programoj kreskas, helpas dividi ilin en reuzeblajn pecojn. <em>Modulo<\/em> estas unuo de kodo, konservata en sia propra dosiero, kiun aliaj programoj povas ŝargi kaj uzi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduldosiero havas la finaĵon <code>.rakumod<\/code> kaj komenciĝas per nomado de la modulo per <code>unit module<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Subprogramoj, kiujn vi skribas interne, estas privataj defaŭlte; por fari unu disponebla al kodo, kiu uzas la modulon, marku ĝin per la trajto <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen modulo konservita en dosiero nomata <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subprogramo <code>hello<\/code> portas <code>is export<\/code>, do ĝi estos videbla por ajna programo, kiu uzas la modulon.<\/span> <span class=\"sg\" data-s=\"1\">Subprogramo sen <code>is export<\/code> restus privata en la modulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modulo povas ankaŭ kunhavi datumojn per <code>our<\/code>-variabloj, kiuj fariĝas atingeblaj per la nomo de la modulo.<\/span> <span class=\"sg\" data-s=\"1\">Aldono de versio-numero al <code>Greeting<\/code> estas tiel simpla kiel unu plian linion en la dosiero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun tiu linio en <code>Greeting.rakumod<\/code>, la valoro estas disponebla kiel <code>$Greeting::version<\/code> ĉie, kie la modulo estas ŝargita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras <a href=\"https://course.raku.org/eo/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">kiel programo ŝargas tian modulon<\/a> kaj kion precize ĝi ricevas de ĝi.<\/span><\/p>"]]},"la":{"t":"Modulos creare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum programmata crescunt, iuvat ea in partes reusabiles dividere. <em>Modulus<\/em> est unitas codicis, in proprio archivo servata, quam alia programmata onerare et adhibere possunt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Archivum moduli extensionem <code>.rakumod<\/code> habet et incipit modulum per <code>unit module<\/code> nominans.<\/span> <span class=\"sg\" data-s=\"1\">Subprogrammata quae intus scribis ex more privata sunt; ut unum codici qui modulo utitur praesto sit, illud proprietate <code>is export<\/code> nota.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce modulus in archivo <code>Greeting.rakumod<\/code> servatus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <code>hello<\/code> <code>is export<\/code> fert, itaque cuilibet programmati quod modulo utitur conspicuum erit.<\/span> <span class=\"sg\" data-s=\"1\">Subprogramma sine <code>is export<\/code> modulo privatum maneret.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modulus etiam data per variabiles <code>our<\/code> communicare potest, quae per nomen moduli attingi possunt.<\/span> <span class=\"sg\" data-s=\"1\">Numerum versionis ad <code>Greeting<\/code> addere tam facile est quam unam lineam in archivo apponere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hac linea in <code>Greeting.rakumod<\/code> posita, valor ut <code>$Greeting::version<\/code> praesto est ubicumque modulus oneratur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia ostendunt <a href=\"https://course.raku.org/la/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">quomodo programma talem modulum oneret<\/a> et quid exacte ex eo accipiat.<\/span><\/p>"]]}}}</script>
