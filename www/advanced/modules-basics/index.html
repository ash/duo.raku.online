<script type="application/json" id="page-data">{"u":"advanced/modules-basics","n":690,"k":"section","pv":"advanced/anonymous-subroutines/quiz","nx":"advanced/modules-basics/creating-modules","tr":["advanced"],"L":{"en":{"t":"Modules basics","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>module<\/em> is a file of reusable code — subroutines, variables, and more — that other programs can load and share.<\/span> <span class=\"sg\" data-s=\"1\">This section covers the essentials in three steps: how to <strong>write<\/strong> a module and mark what it makes available, how a program <strong>loads<\/strong> one with <code>use<\/code>, and how <strong>importing<\/strong> brings a module’s names into your scope.<\/span><\/p>"]]},"de":{"t":"Modul-Grundlagen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Modul<\/em> ist eine Datei mit wiederverwendbarem Code — Subroutinen, Variablen und mehr — die andere Programme laden und gemeinsam nutzen können.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt die Grundlagen in drei Schritten: wie du ein Modul <strong>schreibst<\/strong> und festlegst, was es bereitstellt, wie ein Programm es mit <code>use<\/code> <strong>lädt<\/strong>, und wie durch <strong>Importieren<\/strong> die Namen eines Moduls in deinen Gültigkeitsbereich gelangen.<\/span><\/p>"]]},"nl":{"t":"Basisbeginselen van modules","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>module<\/em> is een bestand met herbruikbare code — subroutines, variabelen en meer — dat andere programma's kunnen laden en delen.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte behandelt de basis in drie stappen: hoe je een module <strong>schrijft<\/strong> en aangeeft wat deze beschikbaar maakt, hoe een programma er een <strong>laadt<\/strong> met <code>use<\/code>, en hoe <strong>importeren<\/strong> de namen van een module in je bereik brengt.<\/span><\/p>"]]},"es":{"t":"Fundamentos de módulos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>módulo<\/em> es un archivo de código reutilizable — subrutinas, variables y más — que otros programas pueden cargar y compartir.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección cubre los aspectos esenciales en tres pasos: cómo <strong>escribir<\/strong> un módulo y marcar lo que pone a disposición, cómo un programa <strong>lo carga<\/strong> con <code>use<\/code>, y cómo la <strong>importación<\/strong> trae los nombres de un módulo a tu ámbito.<\/span><\/p>"]]},"it":{"t":"Basi dei moduli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>modulo<\/em> e un file di codice riutilizzabile — subroutine, variabili e altro — che altri programmi possono caricare e condividere.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione copre gli aspetti essenziali in tre passaggi: come <strong>scrivere<\/strong> un modulo e indicare cio che rende disponibile, come un programma ne <strong>carica<\/strong> uno con <code>use<\/code>, e come l'<strong>importazione<\/strong> porta i nomi di un modulo nel tuo scope.<\/span><\/p>"]]},"lv":{"t":"Moduļu pamati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Modulis<\/em> ir atkārtoti izmantojama koda fails — apakšprogrammas, mainīgie un vairāk —, ko citas programmas var ielādēt un koplietot.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aptver pamatus trīs soļos: kā moduli <strong>uzrakstīt<\/strong> un atzīmēt to, ko tas dara pieejamu, kā programma to <strong>ielādē<\/strong> ar <code>use<\/code> un kā <strong>importēšana<\/strong> ienes moduļa nosaukumus jūsu redzamības apgabalā.<\/span><\/p>"]]},"ru":{"t":"Основы модулей","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Модуль<\/em> — это файл с повторно используемым кодом: подпрограммами, переменными и прочим, который другие программы могут загружать и использовать.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассматриваются основы в три шага: как <strong>написать<\/strong> модуль и указать, что он предоставляет, как программа <strong>загружает<\/strong> его с помощью <code>use<\/code> и как <strong>импорт<\/strong> вносит имена модуля в вашу область видимости.<\/span><\/p>"]]},"uk":{"t":"Основи модулів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Модуль<\/em> — це файл придатного до повторного використання коду (підпрограм, змінних та іншого), який інші програми можуть завантажити й спільно використовувати.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ охоплює найголовніше в три кроки: як <strong>написати<\/strong> модуль і позначити те, що він надає, як програма <strong>завантажує<\/strong> його через <code>use<\/code> і як <strong>імпортування<\/strong> вводить імена модуля до вашої області видимості.<\/span><\/p>"]]},"bg":{"t":"Основи на модулите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Модулът<\/em> е файл с код за повторна употреба — подпрограми, променливи и други — който други програми могат да заредят и споделят.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел покрива основите в три стъпки: как да <strong>напишете<\/strong> модул и да отбележите какво прави достъпно, как програмата <strong>зарежда<\/strong> модул с <code>use<\/code> и как <strong>импортирането<\/strong> внася имената на модула във вашия обхват.<\/span><\/p>"]]},"eo":{"t":"Bazaj konoj pri moduloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Modulo<\/em> estas dosiero de reuzebla kodo — subprogramoj, variabloj kaj pli — kiun aliaj programoj povas ŝargi kaj kunhavi.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio kovras la esencaĵojn en tri paŝoj: kiel <strong>skribi<\/strong> modulon kaj marki tion, kion ĝi disponebligas, kiel programo <strong>ŝargas<\/strong> ĝin per <code>use<\/code>, kaj kiel <strong>importado<\/strong> alportas la nomojn de modulo en vian amplekson.<\/span><\/p>"]]}}}</script>
