<script type="application/json" id="page-data">{"u":"advanced/modules-basics/exercises/require-at-runtime","n":712,"k":"exercise","pv":"advanced/modules-basics/exercises/read-the-constant/solution","nx":"advanced/modules-basics/exercises/require-at-runtime/solution","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"Exercise ’Load at run time‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You are given a module <code>Greeting.rakumod<\/code> that exports a subroutine <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Load this module with <code>require<\/code> instead of <code>use<\/code>, so it is brought in at <strong>run time<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Because <code>require<\/code> does not import names automatically, list the symbol you want with <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Then call <code>hello('Sam')<\/code> and print the result.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To show off what run-time loading buys you, put the <code>require<\/code> inside a <code>sub MAIN<\/code> with a <code>--quiet<\/code> flag, so that the module is loaded <em>only<\/em> when a greeting is actually wanted.<\/span> <span class=\"sg\" data-s=\"1\">With <code>--quiet<\/code>, the program prints <code>Silence.<\/code> and never touches the module at all.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run with the module on the search path, the program prints:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Zur Laufzeit laden","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dir liegt ein Modul <code>Greeting.rakumod<\/code> vor, das eine Subroutine <code>hello<\/code> exportiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lade dieses Modul mit <code>require<\/code> statt <code>use<\/code>, damit es zur <strong>Laufzeit<\/strong> eingebunden wird.<\/span> <span class=\"sg\" data-s=\"1\">Da <code>require<\/code> keine Namen automatisch importiert, liste das gewünschte Symbol mit <code>require Greeting &lt;&amp;hello&gt;;<\/code> auf.<\/span> <span class=\"sg\" data-s=\"2\">Rufe dann <code>hello('Sam')<\/code> auf und gib das Ergebnis aus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um zu zeigen, was das Laden zur Laufzeit bringt, setze das <code>require<\/code> in ein <code>sub MAIN<\/code> mit einem <code>--quiet<\/code>-Flag, sodass das Modul <em>nur<\/em> geladen wird, wenn tatsächlich eine Begrüßung gewünscht ist.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>--quiet<\/code> gibt das Programm <code>Silence.<\/code> aus und greift überhaupt nicht auf das Modul zu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit dem Modul im Suchpfad ausgeführt, gibt das Programm aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ es/require-at-runtime/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Cargar en tiempo de ejecución","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se te proporciona un módulo <code>Greeting.rakumod<\/code> que exporta una subrutina <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Carga este módulo con <code>require<\/code> en lugar de <code>use<\/code>, para que se incorpore en <strong>tiempo de ejecución<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Dado que <code>require<\/code> no importa nombres automáticamente, indica el símbolo que deseas con <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Luego llama a <code>hello('Sam')<\/code> e imprime el resultado.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para demostrar lo que te ofrece la carga en tiempo de ejecución, coloca el <code>require<\/code> dentro de un <code>sub MAIN<\/code> con una bandera <code>--quiet<\/code>, de modo que el módulo se cargue <em>solo<\/em> cuando realmente se desee un saludo.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>--quiet<\/code>, el programa imprime <code>Silence.<\/code> y no toca el módulo en absoluto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Al ejecutar con el módulo en la ruta de búsqueda, el programa imprime:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Caricare a runtime","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ti viene dato un modulo <code>Greeting.rakumod<\/code> che esporta una subroutine <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Carica questo modulo con <code>require<\/code> invece di <code>use<\/code>, in modo che venga caricato a <strong>tempo di esecuzione<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Poiche <code>require<\/code> non importa i nomi automaticamente, elenca il simbolo desiderato con <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi chiama <code>hello('Sam')<\/code> e stampa il risultato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per mostrare cosa offre il caricamento a tempo di esecuzione, metti il <code>require<\/code> dentro una <code>sub MAIN<\/code> con un flag <code>--quiet<\/code>, cosi che il modulo venga caricato <em>solo<\/em> quando un saluto e effettivamente desiderato.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>--quiet<\/code>, il programma stampa <code>Silence.<\/code> e non tocca affatto il modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eseguendo con il modulo nel percorso di ricerca, il programma stampa:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Ielādēt izpildes laikā","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jums ir dots modulis <code>Greeting.rakumod<\/code>, kas eksportē apakšprogrammu <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ielādējiet šo moduli ar <code>require<\/code>, nevis ar <code>use<\/code>, lai tas tiktu ienests <strong>izpildes laikā<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā <code>require<\/code> nosaukumus automātiski neimportē, uzskaitiet vēlamo simbolu ar <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam izsauciet <code>hello('Sam')<\/code> un izdrukājiet rezultātu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai parādītu, ko izpildes laika ielāde dod, ielieciet <code>require<\/code> iekšpus <code>sub MAIN<\/code> ar karodziņu <code>--quiet<\/code>, lai modulis tiktu ielādēts <em>tikai<\/em> tad, kad sveiciens patiešām vajadzīgs.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>--quiet<\/code> programma izdrukā <code>Silence.<\/code> un moduli neaizskar nemaz.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaista ar moduli uz meklēšanas ceļa, programma izdrukā:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Загрузка во время выполнения","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вам дан модуль <code>Greeting.rakumod<\/code>, который экспортирует подпрограмму <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Загрузите этот модуль с помощью <code>require<\/code>, а не <code>use<\/code>, чтобы он подключался <strong>во время выполнения<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку <code>require<\/code> не импортирует имена автоматически, перечислите нужный символ так: <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затем вызовите <code>hello('Sam')<\/code> и напечатайте результат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы показать, что даёт загрузка во время выполнения, поместите <code>require<\/code> внутрь <code>sub MAIN<\/code> с флагом <code>--quiet<\/code> — так модуль будет загружаться <em>только<\/em> тогда, когда приветствие действительно нужно.<\/span> <span class=\"sg\" data-s=\"1\">С <code>--quiet<\/code> программа печатает <code>Silence.<\/code> и вообще не обращается к модулю.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запущенная с модулем в пути поиска, программа печатает:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Завантаження під час виконання»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вам дано модуль <code>Greeting.rakumod<\/code>, який експортує підпрограму <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Завантажте цей модуль через <code>require<\/code> замість <code>use<\/code>, щоб його було внесено під <strong>час виконання<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки <code>require<\/code> не імпортує імен автоматично, перелічіть потрібний символ через <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потім викличте <code>hello('Sam')<\/code> і виведіть результат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб показати, що дає завантаження під час виконання, покладіть <code>require<\/code> усередину <code>sub MAIN<\/code> із прапорцем <code>--quiet<\/code>, щоб модуль завантажувався <em>лише<\/em> тоді, коли привітання справді потрібне.<\/span> <span class=\"sg\" data-s=\"1\">З <code>--quiet<\/code> програма виводить <code>Silence.<\/code> і взагалі не торкається модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запущена з модулем на шляху пошуку, програма виводить:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Заредете по време на изпълнение","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Даден ви е модул <code>Greeting.rakumod<\/code>, който експортира подпрограма <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Заредете този модул с <code>require<\/code> вместо <code>use<\/code>, така че да бъде внесен по <strong>време на изпълнение<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Тъй като <code>require<\/code> не импортира имена автоматично, посочете символа, който искате, с <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След това извикайте <code>hello('Sam')<\/code> и отпечатайте резултата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да покажете какво ви дава зареждането по време на изпълнение, поставете <code>require<\/code> вътре в <code>sub MAIN<\/code> с флаг <code>--quiet<\/code>, така че модулът да се зарежда <em>само<\/em> когато поздрав наистина е необходим.<\/span> <span class=\"sg\" data-s=\"1\">С <code>--quiet<\/code> програмата отпечатва <code>Silence.<\/code> и изобщо не докосва модула.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При стартиране с модула в пътя за търсене, програмата отпечатва:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
