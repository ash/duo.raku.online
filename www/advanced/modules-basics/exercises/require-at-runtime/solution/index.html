<script type="application/json" id="page-data">{"u":"advanced/modules-basics/exercises/require-at-runtime/solution","n":713,"k":"solution","pv":"advanced/modules-basics/exercises/require-at-runtime","nx":"advanced/module-introspection","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"The solution of ’Load at run time‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find both source files in the <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a> directory.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> loads the module at run time rather than at compile time. On its own it imports nothing, which is why a bare <code>hello<\/code> would be unknown.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>&lt;&amp;hello&gt;<\/code> list tells <code>require<\/code> to import that one symbol, so after the statement <code>hello('Sam')<\/code> can be called directly, giving <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is what <code>require<\/code> is <em>for<\/em>: because it runs at run time, it can sit inside an <code>if<\/code>. When <code>--quiet<\/code> is given, that branch is skipped and the module is never loaded — something a compile-time <code>use<\/code> could not avoid.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Zur Laufzeit laden","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest die Quelldateien im Verzeichnis <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> lädt das Modul zur Laufzeit statt zur Kompilierzeit. Allein importiert es nichts, weshalb ein einfaches <code>hello<\/code> unbekannt wäre.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Liste <code>&lt;&amp;hello&gt;<\/code> weist <code>require<\/code> an, dieses eine Symbol zu importieren, sodass nach der Anweisung <code>hello('Sam')<\/code> direkt aufgerufen werden kann und <code>Hello, Sam!<\/code> ergibt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Genau dafür ist <code>require<\/code> da: Da es zur Laufzeit ausgeführt wird, kann es innerhalb eines <code>if<\/code> stehen. Wenn <code>--quiet<\/code> angegeben wird, wird dieser Zweig übersprungen und das Modul nie geladen — etwas, das ein <code>use<\/code> zur Kompilierzeit nicht vermeiden könnte.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Laden tijdens runtime","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt beide bronbestanden vinden in de map <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> laadt de module tijdens de uitvoering in plaats van tijdens het compileren. Op zichzelf importeert het niets, waardoor een kale <code>hello<\/code> onbekend zou zijn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>&lt;&amp;hello&gt;<\/code>-lijst vertelt <code>require<\/code> om dat ene symbool te importeren, zodat na het statement <code>hello('Sam')<\/code> direct aangeroepen kan worden, wat <code>Hello, Sam!<\/code> oplevert.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit is waarvoor <code>require<\/code> <em>bedoeld<\/em> is: omdat het tijdens de uitvoering draait, kan het binnen een <code>if<\/code> staan. Wanneer <code>--quiet<\/code> meegegeven wordt, wordt die tak overgeslagen en wordt de module nooit geladen — iets wat een <code>use<\/code> tijdens het compileren niet kan vermijden.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Cargar en tiempo de ejecución","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar ambos archivos fuente en el directorio <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> carga el módulo en tiempo de ejecución en lugar de en tiempo de compilación. Por sí solo no importa nada, por lo que un simple <code>hello<\/code> sería desconocido.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La lista <code>&lt;&amp;hello&gt;<\/code> le indica a <code>require<\/code> que importe ese símbolo, por lo que después de la instrucción se puede llamar directamente a <code>hello('Sam')<\/code>, dando como resultado <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Para esto es <code>require<\/code>: dado que se ejecuta en tiempo de ejecución, puede estar dentro de un <code>if<\/code>. Cuando se proporciona <code>--quiet<\/code>, esa rama se omite y el módulo nunca se carga — algo que un <code>use<\/code> en tiempo de compilación no podría evitar.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Caricare a runtime","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare entrambi i file sorgente nella directory <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> carica il modulo a tempo di esecuzione anziche al momento della compilazione. Da solo non importa nulla, motivo per cui un semplice <code>hello<\/code> non sarebbe riconosciuto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La lista <code>&lt;&amp;hello&gt;<\/code> dice a <code>require<\/code> di importare quel singolo simbolo, cosi dopo l'istruzione <code>hello('Sam')<\/code> puo essere chiamato direttamente, producendo <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questo e lo scopo di <code>require<\/code>: poiche viene eseguito a tempo di esecuzione, puo trovarsi dentro un <code>if<\/code>. Quando viene passato <code>--quiet<\/code>, quel ramo viene saltato e il modulo non viene mai caricato — cosa che un <code>use<\/code> al momento della compilazione non potrebbe evitare.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Ielādēt izpildes laikā","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Abus pirmkoda failus atrodiet direktorijā <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> ielādē moduli izpildes, nevis kompilēšanas laikā. Pats par sevi tas neko neimportē, un tieši tāpēc kails <code>hello<\/code> būtu nezināms.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Saraksts <code>&lt;&amp;hello&gt;<\/code> liek <code>require<\/code> importēt šo vienu simbolu, tāpēc pēc šī teikuma <code>hello('Sam')<\/code> var izsaukt tieši, dodot <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tieši <em>tam<\/em> <code>require<\/code> ir domāts: tā kā tas izpildās izpildes laikā, tas var atrasties <code>if<\/code> iekšienē. Kad dots <code>--quiet<\/code>, šis zars tiek izlaists un modulis nekad netiek ielādēts — kaut kas tāds, no kā kompilēšanas laika <code>use<\/code> izvairīties nespētu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Загрузка во время выполнения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один из возможных вариантов решения задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Оба исходных файла можно найти в каталоге <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">
