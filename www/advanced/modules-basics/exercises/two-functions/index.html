<script type="application/json" id="page-data">{"u":"advanced/modules-basics/exercises/two-functions","n":704,"k":"exercise","pv":"advanced/modules-basics/exercises/shout-module/solution","nx":"advanced/modules-basics/exercises/two-functions/solution","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"Exercise ’Two functions in one module‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Create a module named <code>Calc<\/code>, in a file <code>Calc.rakumod<\/code>, that exports two subroutines: <code>add<\/code> and <code>mul<\/code>, which return the sum and the product of their two arguments.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Then write a separate program that uses the module to print <code>add(3, 4)<\/code> and <code>mul(3, 4)<\/code>, each on its own line.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run with the module on the search path, the program prints:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Zwei Funktionen in einem Modul","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Erstelle ein Modul namens <code>Calc<\/code> in einer Datei <code>Calc.rakumod<\/code>, das zwei Subroutinen exportiert: <code>add<\/code> und <code>mul<\/code>, die die Summe bzw. das Produkt ihrer beiden Argumente zurückgeben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schreibe dann ein separates Programm, das das Modul verwendet, um <code>add(3, 4)<\/code> und <code>mul(3, 4)<\/code> jeweils in einer eigenen Zeile auszugeben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit dem Modul im Suchpfad ausgeführt, gibt das Programm aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Twee functies in één module","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Maak een module genaamd <code>Calc<\/code>, in een bestand <code>Calc.rakumod<\/code>, die twee subroutines exporteert: <code>add<\/code> en <code>mul<\/code>, die de som en het product van hun twee argumenten teruggeven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schrijf vervolgens een apart programma dat de module gebruikt om <code>add(3, 4)<\/code> en <code>mul(3, 4)<\/code> af te drukken, elk op een eigen regel.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Uitgevoerd met de module op het zoekpad, drukt het programma af:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Dos funciones en un módulo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Crea un módulo llamado <code>Calc<\/code>, en un archivo <code>Calc.rakumod<\/code>, que exporte dos subrutinas: <code>add<\/code> y <code>mul<\/code>, que devuelvan la suma y el producto de sus dos argumentos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Luego escribe un programa separado que use el módulo para imprimir <code>add(3, 4)<\/code> y <code>mul(3, 4)<\/code>, cada uno en su propia línea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Al ejecutar con el módulo en la ruta de búsqueda, el programa imprime:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Due funzioni in un modulo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Crea un modulo chiamato <code>Calc<\/code>, in un file <code>Calc.rakumod<\/code>, che esporti due subroutine: <code>add<\/code> e <code>mul<\/code>, che restituiscono la somma e il prodotto dei loro due argomenti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poi scrivi un programma separato che usa il modulo per stampare <code>add(3, 4)<\/code> e <code>mul(3, 4)<\/code>, ciascuno sulla propria riga.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eseguendo con il modulo nel percorso di ricerca, il programma stampa:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Divas funkcijas vienā modulī","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izveidojiet moduli ar nosaukumu <code>Calc<\/code> failā <code>Calc.rakumod<\/code>, kas eksportē divas apakšprogrammas: <code>add<\/code> un <code>mul<\/code>, kuras atgriež savu divu argumentu summu un reizinājumu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc tam uzrakstiet atsevišķu programmu, kas ar moduļa palīdzību izdrukā <code>add(3, 4)<\/code> un <code>mul(3, 4)<\/code>, katru savā rindā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaista ar moduli uz meklēšanas ceļa, programma izdrukā:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Две функции в одном модуле","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Создайте модуль с именем <code>Calc<\/code> в файле <code>Calc.rakumod<\/code>, который экспортирует две подпрограммы: <code>add<\/code> и <code>mul<\/code>, возвращающие сумму и произведение своих двух аргументов.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Затем напишите отдельную программу, которая использует этот модуль и печатает <code>add(3, 4)<\/code> и <code>mul(3, 4)<\/code>, каждое на своей строке.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запущенная с модулем в пути поиска, программа печатает:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. calc.raku\n7\n12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Посмотреть решение<\/a><\/span><\/p>" \"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/two-functions/solution/\">Вижте решението<\/a><\/span><\/p>"]]}}}</script>
