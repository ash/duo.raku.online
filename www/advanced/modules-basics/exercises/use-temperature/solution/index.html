IN($celsius)<\/code> argumentum lineae imperandi accipit, itaque temperatura convertenda tunc eligitur cum programma curritur, non in codice fixa. Sine argumento cursum, Raku nuntium usus sponte imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Modulus attingi debet, quapropter programma cum <code>-I.<\/code> curritur ut Raku <code>Temperature.rakumod<\/code> in directoria currenti quaerat. Conversio <code>100<\/code> °C dat <code>212<\/code> °F.<\/span><\/li><\/ol>"]]}}}</script>
