<script type="application/json" id="page-data">{"u":"advanced/modules-basics/importing","n":695,"k":"topic","pv":"advanced/modules-basics/using-modules/quiz","nx":"advanced/modules-basics/importing/quiz","tr":["advanced","advanced/modules-basics"],"L":{"en":{"t":"Importing","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">There is more than one way to bring a module into a program.<\/span> <span class=\"sg\" data-s=\"1\">The three statements <code>use<\/code>, <code>need<\/code>, and <code>require<\/code> differ in <em>when<\/em> the module is loaded and in <em>what<\/em> it makes available.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You have already met <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It loads the module at compile time and imports its exported names, so they can be called directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> also loads the module at compile time, but it does <em>not<\/em> import the exported names.<\/span> <span class=\"sg\" data-s=\"1\">You still reach the module’s <code>our<\/code> variables through the module’s name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">After <code>need Greeting<\/code>, a bare <code>hello(...)<\/code> would not be recognised, because nothing was imported — only the qualified names, such as <code>$Greeting::version<\/code>, are available.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> loads the module at <em>run time<\/em> rather than at compile time.<\/span> <span class=\"sg\" data-s=\"1\">This is useful when you do not know until the program runs whether a module will be needed, for example when its name is decided by user input.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because the loading happens at run time, nothing is imported automatically.<\/span> <span class=\"sg\" data-s=\"1\">Listing the symbols you want in angle brackets after the name pulls them in, so they can be called directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For everyday use, <code>use<\/code> is what you want; <code>need<\/code> and <code>require<\/code> are there for the less common cases.<\/span><\/p>"]]},"de":{"t":"Importieren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt mehr als einen Weg, ein Modul in ein Programm einzubinden.<\/span> <span class=\"sg\" data-s=\"1\">Die drei Anweisungen <code>use<\/code>, <code>need<\/code> und <code>require<\/code> unterscheiden sich darin, <em>wann<\/em> das Modul geladen wird und <em>was<\/em> es verfügbar macht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du hast <code>use<\/code> bereits kennengelernt.<\/span> <span class=\"sg\" data-s=\"1\">Es lädt das Modul zur Kompilierzeit und importiert seine exportierten Namen, sodass sie direkt aufgerufen werden können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> lädt das Modul ebenfalls zur Kompilierzeit, importiert aber <em>nicht<\/em> die exportierten Namen.<\/span> <span class=\"sg\" data-s=\"1\">Du erreichst die <code>our<\/code>-Variablen des Moduls weiterhin über den Modulnamen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nach <code>need Greeting<\/code> würde ein einfaches <code>hello(...)<\/code> nicht erkannt werden, da nichts importiert wurde — nur die qualifizierten Namen wie <code>$Greeting::version<\/code> sind verfügbar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> lädt das Modul zur <em>Laufzeit<\/em> statt zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"1\">Das ist nützlich, wenn du erst während der Programmausführung weißt, ob ein Modul benötigt wird, zum Beispiel wenn sein Name durch Benutzereingabe bestimmt wird.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da das Laden zur Laufzeit geschieht, wird nichts automatisch importiert.<\/span> <span class=\"sg\" data-s=\"1\">Wenn du die gewünschten Symbole in spitzen Klammern nach dem Namen auflistest, werden sie eingebunden, sodass sie direkt aufgerufen werden können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für den alltäglichen Gebrauch ist <code>use<\/code> die richtige Wahl; <code>need<\/code> und <code>require<\/code> sind für die weniger häufigen Fälle da.<\/span><\/p>"]]},"nl":{"t":"Importeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Er is meer dan één manier om een module in een programma te laden.<\/span> <span class=\"sg\" data-s=\"1\">De drie statements <code>use<\/code>, <code>need<\/code> en <code>require<\/code> verschillen in <em>wanneer<\/em> de module wordt geladen en in <em>wat<\/em> deze beschikbaar maakt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt <code>use<\/code> al ontmoet.<\/span> <span class=\"sg\" data-s=\"1\">Het laadt de module tijdens het compileren en importeert de geëxporteerde namen, zodat ze direct aangeroepen kunnen worden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> laadt de module ook tijdens het compileren, maar het importeert de geëxporteerde namen <em>niet<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Je bereikt de <code>our<\/code>-variabelen van de module nog steeds via de naam van de module:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Na <code>need Greeting<\/code> zou een kale <code>hello(...)<\/code> niet herkend worden, omdat er niets is geïmporteerd — alleen de gekwalificeerde namen, zoals <code>$Greeting::version<\/code>, zijn beschikbaar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> laadt de module tijdens de <em>uitvoering<\/em> in plaats van tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"1\">Dit is handig wanneer je pas tijdens het draaien van het programma weet of een module nodig is, bijvoorbeeld wanneer de naam wordt bepaald door gebruikersinvoer.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat het laden plaatsvindt tijdens de uitvoering, wordt er niets automatisch geïmporteerd.<\/span> <span class=\"sg\" data-s=\"1\">Door de gewenste symbolen tussen punthaken na de naam op te sommen, worden ze binnengehaald, zodat ze direct aangeroepen kunnen worden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor dagelijks gebruik is <code>use<\/code> wat je wilt; <code>need<\/code> en <code>require<\/code> zijn er voor de minder gangbare gevallen.<\/span><\/p>"]]},"es":{"t":"Importar","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay más de una forma de incorporar un módulo a un programa.<\/span> <span class=\"sg\" data-s=\"1\">Las tres instrucciones <code>use<\/code>, <code>need<\/code> y <code>require<\/code> difieren en <em>cuándo<\/em> se carga el módulo y en <em>qué<\/em> pone a disposición.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya conoces <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Carga el módulo en tiempo de compilación e importa sus nombres exportados, para que puedan llamarse directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> también carga el módulo en tiempo de compilación, pero <em>no<\/em> importa los nombres exportados.<\/span> <span class=\"sg\" data-s=\"1\">Aun así, puedes acceder a las variables <code>our<\/code> del módulo a través del nombre del módulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Después de <code>need Greeting<\/code>, un simple <code>hello(...)<\/code> no sería reconocido, porque no se importó nada — solo los nombres calificados, como <code>$Greeting::version<\/code>, están disponibles.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> carga el módulo en <em>tiempo de ejecución<\/em> en lugar de en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil cuando no sabes hasta que el programa se ejecuta si un módulo será necesario, por ejemplo cuando su nombre lo decide la entrada del usuario.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dado que la carga ocurre en tiempo de ejecución, nada se importa automáticamente.<\/span> <span class=\"sg\" data-s=\"1\">Listar los símbolos que deseas entre corchetes angulares después del nombre los incorpora, para que puedan llamarse directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para el uso cotidiano, <code>use<\/code> es lo que necesitas; <code>need<\/code> y <code>require<\/code> están ahí para los casos menos comunes.<\/span><\/p>"]]},"it":{"t":"Importazione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Esiste piu di un modo per portare un modulo in un programma.<\/span> <span class=\"sg\" data-s=\"1\">Le tre istruzioni <code>use<\/code>, <code>need<\/code> e <code>require<\/code> differiscono per <em>quando<\/em> il modulo viene caricato e per <em>cosa<\/em> rende disponibile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai gia incontrato <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Carica il modulo al momento della compilazione e importa i suoi nomi esportati, cosi possono essere chiamati direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> carica anch'esso il modulo al momento della compilazione, ma <em>non<\/em> importa i nomi esportati.<\/span> <span class=\"sg\" data-s=\"1\">Si raggiungono comunque le variabili <code>our<\/code> del modulo attraverso il nome del modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo <code>need Greeting<\/code>, un semplice <code>hello(...)<\/code> non verrebbe riconosciuto, perche nulla e stato importato — sono disponibili solo i nomi qualificati, come <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> carica il modulo a <em>tempo di esecuzione<\/em> anziche al momento della compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Questo e utile quando non si sa fino all'esecuzione del programma se un modulo sara necessario, per esempio quando il suo nome viene deciso dall'input dell'utente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiche il caricamento avviene a tempo di esecuzione, nulla viene importato automaticamente.<\/span> <span class=\"sg\" data-s=\"1\">Elencando i simboli desiderati tra parentesi angolari dopo il nome, li si importa e possono essere chiamati direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per l'uso quotidiano, <code>use<\/code> e quello che serve; <code>need<\/code> e <code>require<\/code> sono li per i casi meno comuni.<\/span><\/p>"]]},"lv":{"t":"Importēšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir vairāk nekā viens veids, kā ienest moduli programmā.<\/span> <span class=\"sg\" data-s=\"1\">Trīs teikumi <code>use<\/code>, <code>need<\/code> un <code>require<\/code> atšķiras ar to, <em>kad<\/em> modulis tiek ielādēts un <em>ko<\/em> tas padara pieejamu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar <code>use<\/code> jau esat iepazinušies.<\/span> <span class=\"sg\" data-s=\"1\">Tas ielādē moduli kompilēšanas laikā un importē tā eksportētos nosaukumus, tāpēc tos var izsaukt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Arī <code>need<\/code> ielādē moduli kompilēšanas laikā, taču tas <em>neimportē<\/em> eksportētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"1\">Moduļa <code>our<\/code> mainīgos joprojām sasniedzat caur moduļa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc <code>need Greeting<\/code> kails <code>hello(...)<\/code> netiktu atpazīts, jo nekas netika importēts — pieejami ir tikai kvalificētie nosaukumi, piemēram, <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> ielādē moduli <em>izpildes laikā<\/em>, nevis kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Tas noder, kad līdz pat programmas izpildei nezināt, vai modulis būs vajadzīgs, — piemēram, kad tā nosaukumu nosaka lietotāja ievade.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā ielāde notiek izpildes laikā, nekas netiek importēts automātiski.<\/span> <span class=\"sg\" data-s=\"1\">Uzskaitot vēlamos simbolus leņķa iekavās aiz nosaukuma, tie tiek ievilkti, un tos var izsaukt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ikdienas lietošanai vajadzīgs <code>use<\/code>; <code>need<\/code> un <code>require<\/code> ir retāku gadījumu vajadzībām.<\/span><\/p>"]]},"ru":{"t":"Импорт","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Существует несколько способов подключить модуль к программе.<\/span> <span class=\"sg\" data-s=\"1\">Три инструкции — <code>use<\/code>, <code>need<\/code> и <code>require<\/code> — различаются тем, <em>когда<\/em> модуль загружается и <em>что<\/em> он делает доступным.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже знакомы с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Эта инструкция загружает модуль на этапе компиляции и импортирует его экспортированные имена, чтобы их можно было вызывать напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> тоже загружает модуль на этапе компиляции, но <em>не<\/em> импортирует экспортированные имена.<\/span> <span class=\"sg\" data-s=\"1\">Тем не менее, переменные модуля, объявленные с <code>our<\/code>, доступны через имя модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После <code>need Greeting<\/code> простой вызов <code>hello(...)<\/code> не будет распознан, потому что ничего не было импортировано — доступны только квалифицированные имена, такие как <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> загружает модуль <em>во время выполнения<\/em>, а не на этапе компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Это полезно, когда до запуска программы неизвестно, понадобится ли модуль, — например, когда его имя определяется вводом пользователя.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку загрузка происходит во время выполнения, ничего не импортируется автоматически.<\/span> <span class=\"sg\" data-s=\"1\">Перечисление нужных символов в угловых скобках после имени подключает их, чтобы их можно было вызывать напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для повседневного использования <code>use<\/code> — это то, что вам нужно; <code>need<\/code> и <code>require<\/code> существуют для менее распространённых случаев.<\/span><\/p>"]]},"uk":{"t":"Імпортування","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Існує не один спосіб внести модуль до програми.<\/span> <span class=\"sg\" data-s=\"1\">Три оператори — <code>use<\/code>, <code>need<\/code> та <code>require<\/code> — різняться тим, <em>коли<\/em> модуль завантажується і <em>що<\/em> він робить доступним.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>use<\/code> ви вже зустрічалися.<\/span> <span class=\"sg\" data-s=\"1\">Він завантажує модуль під час компіляції й імпортує його експортовані імена, тож їх можна викликати напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> теж завантажує модуль під час компіляції, але <em>не<\/em> імпортує експортованих імен.<\/span> <span class=\"sg\" data-s=\"1\">До змінних <code>our<\/code> модуля ви й далі дістаєтеся через ім'я модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після <code>need Greeting<\/code> голий <code>hello(...)<\/code> не був би розпізнаний, бо нічого не імпортовано — доступні лише кваліфіковані імена, як-от <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> завантажує модуль під <em>час виконання<\/em>, а не під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Це корисно, коли ви до самого запуску програми не знаєте, чи знадобиться модуль, — наприклад, коли його ім'я визначає користувацький ввід.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки завантаження відбувається під час виконання, нічого не імпортується автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Перелік потрібних символів у кутових дужках після імені підтягує їх, тож їх можна викликати напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для щоденного вжитку вам потрібен <code>use<\/code>; <code>need<\/code> і <code>require<\/code> існують для рідкісніших випадків.<\/span><\/p>"]]},"bg":{"t":"Импортиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Има повече от един начин за внасяне на модул в програма.<\/span> <span class=\"sg\" data-s=\"1\">Трите оператора <code>use<\/code>, <code>need<\/code> и <code>require<\/code> се различават по <em>кога<\/em> модулът се зарежда и <em>какво<\/em> прави достъпно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече сте се запознали с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той зарежда модула по време на компилация и импортира експортираните му имена, така че те могат да бъдат извикани директно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> също зарежда модула по време на компилация, но <em>не<\/em> импортира експортираните имена.<\/span> <span class=\"sg\" data-s=\"1\">Все пак достигате до <code>our<\/code> променливите на модула чрез името на модула:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След <code>need Greeting<\/code>, самостоятелно <code>hello(...)<\/code> не би било разпознато, тъй като нищо не е било импортирано — достъпни са само квалифицираните имена, като <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> зарежда модула по <em>време на изпълнение<\/em>, а не по време на компилация.<\/span> <span class=\"sg\" data-s=\"1\">Това е полезно, когато не знаете до изпълнението на програмата дали модулът ще бъде необходим, например когато името му се определя от въведеното от потребителя.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тъй като зареждането се случва по време на изпълнение, нищо не се импортира автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Изброявайки символите, които искате, в ъглови скоби след името, ги внасяте, така че могат да бъдат извикани директно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За ежедневна употреба <code>use<\/code> е това, което ви трябва; <code>need<\/code> и <code>require<\/code> са за по-редки случаи.<\/span><\/p>"]]},"eo":{"t":"Importado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas pli ol unu maniero alporti modulon en programon.<\/span> <span class=\"sg\" data-s=\"1\">La tri deklaroj <code>use<\/code>, <code>need<\/code> kaj <code>require<\/code> diferencas laŭ tio, <em>kiam<\/em> la modulo estas ŝargata kaj <em>kion<\/em> ĝi disponebligos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi jam renkontis <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ŝargas la modulon je kompiltempo kaj importas ĝiajn eksportitajn nomojn, do ili estas vokitaj rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> ankaŭ ŝargas la modulon je kompiltempo, sed ĝi <em>ne<\/em> importas la eksportitajn nomojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankoraŭ atingas la <code>our<\/code>-variablojn de la modulo per la nomo de la modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post <code>need Greeting<\/code>, nuda <code>hello(...)<\/code> ne estus rekonata, ĉar nenio estis importita — nur la kvalifikitaj nomoj, kiel <code>$Greeting::version<\/code>, estas disponeblaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> ŝargas la modulon je <em>rultempo<\/em> anstataŭ je kompiltempo.<\/span> <span class=\"sg\" data-s=\"1\">Tio utilas, kiam vi ne scias ĝis la rulado de la programo, ĉu modulo estos bezonata, ekzemple kiam ĝia nomo estas decidata per uzanta enigo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉar la ŝargado okazas je rultempo, nenio estas importita aŭtomate.<\/span> <span class=\"sg\" data-s=\"1\">Listigi la simbolojn, kiujn vi volas, en angulaj krampoj post la nomo alportas ilin, do ili povas esti vokitaj rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ĉiutaga uzo, <code>use<\/code> estas tio, kion vi volas; <code>need<\/code> kaj <code>require<\/code> estas tie por la malpli oftaj kazoj.<\/span><\/p>"]]}}}</script>
