<script type="application/json" id="page-data">{"u":"advanced/distributing/meta6","n":734,"k":"topic","pv":"advanced/distributing","nx":"advanced/distributing/meta6/quiz","tr":["advanced","advanced/distributing"],"L":{"en":{"t":"The META6 file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A distribution is described by a single file in its top directory, <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is plain JSON that tells the tools the distribution’s name, version, what it provides, and what it depends on:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The two keys that matter most are <code>provides<\/code>, which maps each module name to the file that implements it, and <code>depends<\/code>, which lists other distributions this one needs.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The file sits at the root of a standard directory layout:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The module code lives under <code>lib/<\/code>, with the directory path matching the <code>::<\/code> parts of the name (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Tests live under <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">With this structure and a correct <code>META6.json<\/code>, the tools can build, test, and install the distribution.<\/span><\/p>"]]},"de":{"t":"Die META6-Datei","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Distribution wird durch eine einzelne Datei in ihrem obersten Verzeichnis beschrieben: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es handelt sich um einfaches JSON, das den Werkzeugen den Namen der Distribution, die Version, was sie bereitstellt und wovon sie abhängt, mitteilt:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die zwei wichtigsten Schlüssel sind <code>provides<\/code>, das jeden Modulnamen auf die Datei abbildet, die ihn implementiert, und <code>depends<\/code>, das andere Distributionen auflistet, die diese benötigt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Datei befindet sich im Stammverzeichnis eines standardmäßigen Verzeichnislayouts:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Modulcode liegt unter <code>lib/<\/code>, wobei der Verzeichnispfad den <code>::<\/code> Teilen des Namens entspricht (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Tests liegen unter <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mit dieser Struktur und einer korrekten <code>META6.json<\/code> können die Werkzeuge die Distribution bauen, testen und installieren.<\/span><\/p>"]]},"nl":{"t":"Het META6-bestand","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een distributie wordt beschreven door een enkel bestand in de hoofdmap, <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het is gewone JSON die de gereedschappen de naam, versie, wat het aanbiedt en waar het van afhangt vertelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De twee belangrijkste sleutels zijn <code>provides<\/code>, die elke modulenaam koppelt aan het bestand dat het implementeert, en <code>depends<\/code>, die andere distributies opsomt die deze nodig heeft.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het bestand staat in de hoofdmap van een standaard mapstructuur:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De modulecode staat onder <code>lib/<\/code>, waarbij het mappad overeenkomt met de <code>::<\/code>-delen van de naam (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Tests staan onder <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Met deze structuur en een correct <code>META6.json<\/code> kunnen de gereedschappen de distributie bouwen, testen en installeren.<\/span><\/p>"]]},"es":{"t":"El archivo META6","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una distribución se describe mediante un único archivo en su directorio raíz, <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es JSON simple que indica a las herramientas el nombre de la distribución, la versión, lo que proporciona y de qué depende:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las dos claves más importantes son <code>provides<\/code>, que mapea cada nombre de módulo al archivo que lo implementa, y <code>depends<\/code>, que lista las otras distribuciones que este necesita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El archivo se ubica en la raíz de una estructura de directorios estándar:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El código del módulo reside en <code>lib/<\/code>, con la ruta de directorios coincidiendo con las partes <code>::<\/code> del nombre (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Las pruebas se ubican en <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con esta estructura y un <code>META6.json<\/code> correcto, las herramientas pueden construir, probar e instalar la distribución.<\/span><\/p>"]]},"it":{"t":"Il file META6","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una distribuzione è descritta da un singolo file nella sua directory principale, <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si tratta di un file JSON che indica agli strumenti il nome della distribuzione, la versione, cosa fornisce e da cosa dipende:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le due chiavi più importanti sono <code>provides<\/code>, che associa ogni nome di modulo al file che lo implementa, e <code>depends<\/code>, che elenca le altre distribuzioni di cui questa ha bisogno.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il file si trova alla radice di una struttura di directory standard:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il codice del modulo si trova sotto <code>lib/<\/code>, con il percorso delle directory che corrisponde alle parti separate da <code>::<\/code> nel nome (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">I test si trovano sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con questa struttura e un <code>META6.json<\/code> corretto, gli strumenti possono compilare, testare e installare la distribuzione.<\/span><\/p>"]]},"lv":{"t":"META6 fails","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Distribūciju apraksta viens fails tās augšējā direktorijā — <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir vienkāršs JSON, kas rīkiem pasaka distribūcijas nosaukumu, versiju, ko tā nodrošina un no kā tā ir atkarīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Divas svarīgākās atslēgas ir <code>provides<\/code>, kas attēlo katru moduļa nosaukumu uz failu, kurš to realizē, un <code>depends<\/code>, kas uzskaita citas distribūcijas, kuras šai ir vajadzīgas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fails atrodas standarta direktoriju izkārtojuma saknē:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduļa kods dzīvo zem <code>lib/<\/code>, un direktoriju ceļš atbilst nosaukuma <code>::<\/code> daļām (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Testi dzīvo zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ar šādu struktūru un pareizu <code>META6.json<\/code> rīki var distribūciju būvēt, testēt un instalēt.<\/span><\/p>"]]},"ru":{"t":"Файл META6","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив описывается одним файлом в его корневой директории — <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это обычный JSON, который сообщает инструментам имя дистрибутива, версию, что он предоставляет и от чего зависит:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два наиболее важных ключа — <code>provides<\/code>, который сопоставляет имя каждого модуля с файлом, в котором он реализован, и <code>depends<\/code>, который перечисляет другие дистрибутивы, от которых зависит данный.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Файл располагается в корне стандартной структуры каталогов:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Код модуля находится в <code>lib/<\/code>, причём путь каталогов соответствует частям имени, разделённым <code>::<\/code> (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Тесты находятся в <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">При такой структуре и правильном <code>META6.json<\/code> инструменты могут собрать, протестировать и установить дистрибутив.<\/span><\/p>"]]},"uk":{"t":"Файл META6","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив описується єдиним файлом у його верхньому каталозі — <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це звичайний JSON, який повідомляє інструментам назву дистрибутива, версію, те, що він надає, і те, від чого залежить:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два найважливіші ключі — це <code>provides<\/code>, який зіставляє ім'я кожного модуля з файлом, що його втілює, та <code>depends<\/code>, який перелічує інші дистрибутиви, потрібні цьому.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Файл лежить у корені стандартної структури каталогів:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Код модуля живе під <code>lib/<\/code>, і шлях каталогів відповідає частинам імені, розділеним <code>::<\/code> (<code>Maths::Simple<\/code> → <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Тести живуть під <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За такої структури й правильного <code>META6.json<\/code> інструменти можуть збирати, тестувати й встановлювати дистрибутив.<\/span><\/p>"]]},"bg":{"t":"Файлът META6","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Една дистрибуция се описва от единствен файл в нейната главна директория — <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е обикновен JSON, който казва на инструментите името на дистрибуцията, версията, какво предоставя и от какво зависи:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двата ключа, които са най-важни, са <code>provides<\/code>, който свързва всяко име на модул с файла, който го имплементира, и <code>depends<\/code>, който изброява другите дистрибуции, от които тази зависи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Файлът се намира в корена на стандартното оформление на директориите:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кодът на модула се намира под <code>lib/<\/code>, като пътят на директорията съответства на частите на името, разделени с <code>::<\/code> (<code>Maths::Simple<\/code> -&gt; <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Тестовете се намират под <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С тази структура и коректен <code>META6.json<\/code>, инструментите могат да компилират, тестват и инсталират дистрибуцията.<\/span><\/p>"]]},"la":{"t":"Fasciculus META6","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Distributio uno archivo in summo directorio suo describitur, <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Est JSON simplex quod instrumentis nomen distributionis, versionem, quid praebeat, et a quibus pendeat indicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duae claves maximi momenti sunt <code>provides<\/code>, quae unumquodque nomen moduli ad archivum quod eum efficit refert, et <code>depends<\/code>, quae alias distributiones quas haec requirit enumerat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Archivum in radice dispositionis directorii normalis sedet:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Codex moduli sub <code>lib/<\/code> habitat, via directorii partes <code>::<\/code> nominis sequente (<code>Maths::Simple<\/code> -&gt; <code>lib/Maths/Simple.rakumod<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Probationes sub <code>t/<\/code> habitant.<\/span> <span class=\"sg\" data-s=\"2\">Hac structura et <code>META6.json<\/code> recto, instrumenta distributionem aedificare, probare, et installare possunt.<\/span><\/p>"]]}}}</script>
