<script type="application/json" id="page-data">{"u":"advanced/distributing/meta6/quiz","n":735,"k":"quiz","pv":"advanced/distributing/meta6","nx":"advanced/distributing/zef-ecosystem","tr":["advanced","advanced/distributing","advanced/distributing/meta6"],"L":{"en":{"t":"Quiz — Distributions","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Which file describes a Raku distribution — its name, version, and what it provides?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A distribution is described by <code>META6.json<\/code>, a JSON file at its top directory.<\/span> <span class=\"sg\" data-s=\"1\">Its <code>provides<\/code> key maps each module name to its source file, and <code>depends<\/code> lists the other distributions it needs.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Distributionen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welche Datei beschreibt eine Raku-Distribution — ihren Namen, ihre Version und was sie bereitstellt?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Distribution wird durch <code>META6.json<\/code> beschrieben, eine JSON-Datei in ihrem obersten Verzeichnis.<\/span> <span class=\"sg\" data-s=\"1\">Ihr <code>provides<\/code>-Schlüssel bildet jeden Modulnamen auf seine Quelldatei ab, und <code>depends<\/code> listet die anderen Distributionen auf, die sie benötigt.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Distributies","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welk bestand beschrijft een Raku-distributie — de naam, versie en wat het aanbiedt?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een distributie wordt beschreven door <code>META6.json<\/code>, een JSON-bestand in de hoofdmap.<\/span> <span class=\"sg\" data-s=\"1\">De <code>provides<\/code>-sleutel koppelt elke modulenaam aan het bronbestand, en <code>depends<\/code> somt de andere distributies op die het nodig heeft.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Distribuciones","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué archivo describe una distribución de Raku — su nombre, versión y lo que proporciona?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una distribución se describe mediante <code>META6.json<\/code>, un archivo JSON en su directorio raíz.<\/span> <span class=\"sg\" data-s=\"1\">Su clave <code>provides<\/code> mapea cada nombre de módulo a su archivo fuente, y <code>depends<\/code> lista las otras distribuciones que necesita.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Distribuzioni","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quale file descrive una distribuzione Raku — il suo nome, la versione e cosa fornisce?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una distribuzione è descritta da <code>META6.json<\/code>, un file JSON nella sua directory principale.<\/span> <span class=\"sg\" data-s=\"1\">La sua chiave <code>provides<\/code> associa ogni nome di modulo al rispettivo file sorgente, e <code>depends<\/code> elenca le altre distribuzioni di cui ha bisogno.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Distribūcijas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kurš fails apraksta Raku distribūciju — tās nosaukumu, versiju un to, ko tā nodrošina?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Distribūciju apraksta <code>META6.json<\/code> — JSON fails tās augšējā direktorijā.<\/span> <span class=\"sg\" data-s=\"1\">Tā atslēga <code>provides<\/code> attēlo katru moduļa nosaukumu uz tā pirmkoda failu, un <code>depends<\/code> uzskaita citas distribūcijas, kas tai vajadzīgas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Дистрибутивы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какой файл описывает дистрибутив Raku — его имя, версию и то, что он предоставляет?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив описывается файлом <code>META6.json<\/code> — JSON-файлом в его корневой директории.<\/span> <span class=\"sg\" data-s=\"1\">Ключ <code>provides<\/code> сопоставляет имя каждого модуля с его исходным файлом, а <code>depends<\/code> перечисляет другие дистрибутивы, от которых он зависит.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Дистрибутиви","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Який файл описує дистрибутив Raku — його назву, версію й те, що він надає?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив описується файлом <code>META6.json<\/code> — файлом JSON у його верхньому каталозі.<\/span> <span class=\"sg\" data-s=\"1\">Його ключ <code>provides<\/code> зіставляє ім'я кожного модуля з файлом вихідного коду, а <code>depends<\/code> перелічує інші дистрибутиви, які йому потрібні.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Дистрибуции","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Кой файл описва дистрибуция на Raku — нейното име, версия и какво предоставя?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дистрибуцията се описва от <code>META6.json<\/code> — JSON файл в нейната главна директория.<\/span> <span class=\"sg\" data-s=\"1\">Ключът <code>provides<\/code> свързва всяко име на модул с неговия изходен файл, а <code>depends<\/code> изброява другите дистрибуции, от които тя зависи.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Distribuoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiu dosiero priskribas Raku-distribuon — ĝian nomon, version kaj tion, kion ĝi provizas?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Distribuo estas priskribata de <code>META6.json<\/code>, JSON-dosiero en ĝia supra dosierujo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia ŝlosilo <code>provides<\/code> mapas ĉiun modulan nomon al ĝia fontdosiero, kaj <code>depends<\/code> listigas la aliajn distribuojn, kiujn ĝi bezonas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Distributiones","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quod archivum distributionem Raku describit — nomen eius, versionem, et quid praebeat?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Distributio per <code>META6.json<\/code> describitur, archivum JSON in summo directorio eius.<\/span> <span class=\"sg\" data-s=\"1\">Clavis <code>provides<\/code> unumquodque nomen moduli ad archivum fontis eius refert, et <code>depends<\/code> alias distributiones quas requirit enumerat.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
