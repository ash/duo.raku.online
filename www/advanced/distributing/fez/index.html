<script type="application/json" id="page-data">{"u":"advanced/distributing/fez","n":737,"k":"topic","pv":"advanced/distributing/zef-ecosystem","nx":"advanced/distributing/exercises","tr":["advanced","advanced/distributing"],"L":{"en":{"t":"Publishing with fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The previous topic introduced <code>fez<\/code> as a way to upload a distribution to the Raku ecosystem.<\/span> <span class=\"sg\" data-s=\"1\">You do not have to use <code>fez<\/code> — it is not the only way to publish — but it is the most common choice, and it does more than upload: it can also set a new distribution up for you and manage your author account.<\/span> <span class=\"sg\" data-s=\"2\">Install it with <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Starting a distribution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rather than assembling a <code>META6.json<\/code> and the <code>lib/<\/code> and <code>t/<\/code> directories by hand, you can let <code>fez<\/code> scaffold them:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> initialises a new distribution to build on — a project directory with a ready-made <code>META6.json<\/code> and the standard layout already in place — so you can go straight to writing code under <code>lib/<\/code> and tests under <code>t/<\/code> instead of preparing the metadata file yourself.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registering and logging in<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Publishing needs an ecosystem account.<\/span> <span class=\"sg\" data-s=\"1\">You create one once with <code>fez register<\/code> (it asks for a username, email, and password) and sign in with <code>fez login<\/code>, which stores your key so that later commands are authenticated:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Your username matters: a distribution’s <code>META6.json<\/code> must carry an <code>auth<\/code> field set to <code>zef:&lt;username&gt;<\/code>, which is how the ecosystem knows the upload is really yours.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uploading<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With the account in place and the distribution ready, <code>fez upload<\/code> packages the current directory and submits it:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">After that, anyone can install it by name with <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Each version may be uploaded only once, so remember to raise the <code>version<\/code> in <code>META6.json<\/code> before publishing an update.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Other handy commands<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A few more <code>fez<\/code> commands you will reach for:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — check a distribution for likely problems before uploading;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — show the distributions you have already published;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — rebuild <code>META6.json<\/code> from the files currently on disk.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">All of these need <code>fez<\/code> installed and network access, and everything past <code>init<\/code> needs an ecosystem account.<\/span><\/blockquote>"]]},"de":{"t":"Veröffentlichen mit fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Im vorherigen Thema wurde <code>fez<\/code> als Möglichkeit vorgestellt, eine Distribution in das Raku-Ökosystem hochzuladen.<\/span> <span class=\"sg\" data-s=\"1\">Du musst <code>fez<\/code> nicht verwenden — es ist nicht die einzige Möglichkeit zu veröffentlichen — aber es ist die häufigste Wahl, und es kann mehr als nur hochladen: es kann auch eine neue Distribution für dich einrichten und dein Autoren-Konto verwalten.<\/span> <span class=\"sg\" data-s=\"2\">Installiere es mit <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eine Distribution starten<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anstatt eine <code>META6.json<\/code> und die Verzeichnisse <code>lib/<\/code> und <code>t/<\/code> von Hand zusammenzustellen, kannst du <code>fez<\/code> das Grundgerüst erstellen lassen:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> initialisiert eine neue Distribution zum Aufbauen — ein Projektverzeichnis mit einer fertigen <code>META6.json<\/code> und dem Standardlayout bereits vorhanden — sodass du direkt mit dem Schreiben von Code unter <code>lib/<\/code> und Tests unter <code>t/<\/code> beginnen kannst, anstatt die Metadaten-Datei selbst vorzubereiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registrieren und Anmelden<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zum Veröffentlichen wird ein Ökosystem-Konto benötigt.<\/span> <span class=\"sg\" data-s=\"1\">Du erstellst eines einmalig mit <code>fez register<\/code> (es fragt nach Benutzername, E-Mail und Passwort) und meldest dich mit <code>fez login<\/code> an, das deinen Schlüssel speichert, damit spätere Befehle authentifiziert sind:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dein Benutzername ist wichtig: Die <code>META6.json<\/code> einer Distribution muss ein <code>auth<\/code>-Feld enthalten, das auf <code>zef:&lt;benutzername&gt;<\/code> gesetzt ist — so weiß das Ökosystem, dass der Upload wirklich von dir stammt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hochladen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn das Konto eingerichtet und die Distribution fertig ist, verpackt <code>fez upload<\/code> das aktuelle Verzeichnis und reicht es ein:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Danach kann sie jeder mit <code>zef install My::Greeting<\/code> über den Namen installieren.<\/span> <span class=\"sg\" data-s=\"1\">Jede Version kann nur einmal hochgeladen werden, also denke daran, die <code>version<\/code> in <code>META6.json<\/code> zu erhöhen, bevor du ein Update veröffentlichst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Weitere nützliche Befehle<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein paar weitere <code>fez<\/code>-Befehle, die du brauchen wirst:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — überprüfe eine Distribution auf wahrscheinliche Probleme vor dem Hochladen;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — zeige die Distributionen an, die du bereits veröffentlicht hast;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — erstelle <code>META6.json<\/code> aus den aktuell vorhandenen Dateien neu.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">All diese Befehle erfordern eine installierte Version von <code>fez<\/code> und Netzwerkzugang, und alles nach <code>init<\/code> erfordert ein Ökosystem-Konto.<\/span><\/blockquote>"]]},"nl":{"t":"Publiceren met fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het vorige onderwerp introduceerde <code>fez<\/code> als een manier om een distributie naar het Raku-ecosysteem te uploaden.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft <code>fez<\/code> niet te gebruiken — het is niet de enige manier om te publiceren — maar het is de meest gebruikelijke keuze, en het doet meer dan uploaden: het kan ook een nieuwe distributie voor je opzetten en je auteursaccount beheren.<\/span> <span class=\"sg\" data-s=\"2\">Installeer het met <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een distributie starten<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In plaats van zelf een <code>META6.json<\/code> en de <code>lib/<\/code>- en <code>t/<\/code>-mappen samen te stellen, kun je <code>fez<\/code> de structuur laten aanmaken:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> initialiseert een nieuwe distributie om op voort te bouwen — een projectmap met een kant-en-klaar <code>META6.json<\/code> en de standaardindeling al op zijn plaats — zodat je direct code kunt schrijven onder <code>lib/<\/code> en tests onder <code>t/<\/code> in plaats van het metadatabestand zelf voor te bereiden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registreren en inloggen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Publiceren vereist een ecosysteemaccount.<\/span> <span class=\"sg\" data-s=\"1\">Je maakt er eenmalig een aan met <code>fez register<\/code> (het vraagt om een gebruikersnaam, e-mailadres en wachtwoord) en logt in met <code>fez login<\/code>, dat je sleutel opslaat zodat latere commando's geauthenticeerd zijn:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je gebruikersnaam is belangrijk: het <code>META6.json<\/code> van een distributie moet een <code>auth<\/code>-veld bevatten ingesteld op <code>zef:&lt;gebruikersnaam&gt;<\/code>, waarmee het ecosysteem weet dat de upload echt van jou is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uploaden<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met het account op zijn plaats en de distributie gereed, verpakt <code>fez upload<\/code> de huidige map en dient deze in:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Daarna kan iedereen het installeren met <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Elke versie mag maar eenmaal worden geüpload, dus vergeet niet de <code>version<\/code> in <code>META6.json<\/code> te verhogen voordat je een update publiceert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere handige commando's<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een paar andere <code>fez<\/code>-commando's die je zult gebruiken:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — controleer een distributie op waarschijnlijke problemen voordat je uploadt;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — toon de distributies die je al hebt gepubliceerd;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — bouw <code>META6.json<\/code> opnieuw op vanuit de bestanden die momenteel op schijf staan.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Al deze commando's vereisen dat <code>fez<\/code> is geïnstalleerd en netwerktoegang, en alles na <code>init<\/code> vereist een ecosysteemaccount.<\/span><\/blockquote>"]]},"es":{"t":"Publicar con fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El tema anterior presentó <code>fez<\/code> como una forma de subir una distribución al ecosistema de Raku.<\/span> <span class=\"sg\" data-s=\"1\">No es obligatorio usar <code>fez<\/code> — no es la única forma de publicar — pero es la opción más común, y hace más que subir: también puede configurar una nueva distribución y gestionar tu cuenta de autor.<\/span> <span class=\"sg\" data-s=\"2\">Instálalo con <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Iniciar una distribución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En lugar de ensamblar un <code>META6.json<\/code> y los directorios <code>lib/<\/code> y <code>t/<\/code> a mano, puedes dejar que <code>fez<\/code> los genere automáticamente:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> inicializa una nueva distribución sobre la cual construir — un directorio de proyecto con un <code>META6.json<\/code> ya preparado y la estructura estándar ya en su lugar — para que puedas ir directamente a escribir código en <code>lib/<\/code> y pruebas en <code>t/<\/code> en lugar de preparar el archivo de metadatos tú mismo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registro e inicio de sesión<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para publicar se necesita una cuenta en el ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">La creas una vez con <code>fez register<\/code> (te pide un nombre de usuario, correo electrónico y contraseña) e inicias sesión con <code>fez login<\/code>, que almacena tu clave para que los comandos posteriores estén autenticados:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tu nombre de usuario es importante: el <code>META6.json<\/code> de una distribución debe llevar un campo <code>auth<\/code> establecido como <code>zef:&lt;username&gt;<\/code>, que es como el ecosistema sabe que la subida es realmente tuya.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subida<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con la cuenta en su lugar y la distribución lista, <code>fez upload<\/code> empaqueta el directorio actual y lo envía:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Después de eso, cualquiera puede instalarlo por nombre con <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cada versión solo puede subirse una vez, así que recuerda incrementar la <code>version<\/code> en <code>META6.json<\/code> antes de publicar una actualización.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otros comandos útiles<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos comandos más de <code>fez<\/code> que te serán útiles:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — verificar una distribución en busca de posibles problemas antes de subirla;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — mostrar las distribuciones que ya has publicado;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — reconstruir <code>META6.json<\/code> a partir de los archivos actualmente en disco.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Todos estos necesitan <code>fez<\/code> instalado y acceso a la red, y todo después de <code>init<\/code> necesita una cuenta en el ecosistema.<\/span><\/blockquote>"]]},"it":{"t":"Pubblicare con fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'argomento precedente ha introdotto <code>fez<\/code> come mezzo per caricare una distribuzione nell'ecosistema Raku.<\/span> <span class=\"sg\" data-s=\"1\">Non sei obbligato a usare <code>fez<\/code> — non è l'unico modo per pubblicare — ma è la scelta più comune, e fa molto di più che caricare: può anche configurare una nuova distribuzione e gestire il tuo account autore.<\/span> <span class=\"sg\" data-s=\"2\">Installalo con <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare una distribuzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Invece di assemblare manualmente un <code>META6.json<\/code> e le directory <code>lib/<\/code> e <code>t/<\/code>, puoi lasciare che <code>fez<\/code> li generi automaticamente:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> inizializza una nuova distribuzione su cui lavorare — una directory di progetto con un <code>META6.json<\/code> già pronto e la struttura standard già predisposta — così puoi passare direttamente a scrivere codice sotto <code>lib/<\/code> e test sotto <code>t/<\/code> invece di preparare il file dei metadati a mano.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registrazione e accesso<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per pubblicare è necessario un account nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Lo crei una sola volta con <code>fez register<\/code> (che chiede nome utente, email e password) e accedi con <code>fez login<\/code>, che memorizza la tua chiave in modo che i comandi successivi siano autenticati:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il tuo nome utente è importante: il <code>META6.json<\/code> di una distribuzione deve contenere un campo <code>auth<\/code> impostato su <code>zef:&lt;nomeutente&gt;<\/code>, che è il modo in cui l'ecosistema sa che il caricamento è davvero tuo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caricamento<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con l'account attivo e la distribuzione pronta, <code>fez upload<\/code> confeziona la directory corrente e la invia:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dopodiché, chiunque può installarla per nome con <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni versione può essere caricata una sola volta, quindi ricordati di incrementare la <code>version<\/code> nel <code>META6.json<\/code> prima di pubblicare un aggiornamento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri comandi utili<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni altri comandi <code>fez<\/code> che ti torneranno utili:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — controlla una distribuzione per eventuali problemi prima del caricamento;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — mostra le distribuzioni che hai già pubblicato;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — ricostruisce il <code>META6.json<\/code> a partire dai file attualmente presenti su disco.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Tutti questi comandi richiedono <code>fez<\/code> installato e l'accesso alla rete, e tutto ciò che va oltre <code>init<\/code> richiede un account nell'ecosistema.<\/span><\/blockquote>"]]},"lv":{"t":"Publicēšana ar fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējais temats iepazīstināja ar <code>fez<\/code> kā veidu, kā augšupielādēt distribūciju Raku ekosistēmā.<\/span> <span class=\"sg\" data-s=\"1\"><code>fez<\/code> lietot nav obligāti — tas nav vienīgais veids, kā publicēt —, taču tā ir visizplatītākā izvēle, un tas dara vairāk nekā tikai augšupielādē: tas var arī sagatavot jaunu distribūciju un pārvaldīt jūsu autora kontu.<\/span> <span class=\"sg\" data-s=\"2\">Instalējiet to ar <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Distribūcijas uzsākšana<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā vietā, lai <code>META6.json<\/code> un direktorijas <code>lib/<\/code> un <code>t/<\/code> liktu kopā ar roku, varat ļaut <code>fez<\/code> tos uzģenerēt:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> inicializē jaunu distribūciju, uz kuras būvēt — projekta direktoriju ar gatavu <code>META6.json<\/code> un jau ieliktu standarta izkārtojumu —, tā ka varat uzreiz ķerties pie koda rakstīšanas zem <code>lib/<\/code> un testiem zem <code>t/<\/code>, nevis pats gatavot metadatu failu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reģistrēšanās un pieteikšanās<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Publicēšanai nepieciešams ekosistēmas konts.<\/span> <span class=\"sg\" data-s=\"1\">To izveidojat vienreiz ar <code>fez register<\/code> (tas prasa lietotājvārdu, e-pastu un paroli) un piesakāties ar <code>fez login<\/code>, kas saglabā jūsu atslēgu, lai vēlākās komandas būtu autentificētas:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūsu lietotājvārdam ir nozīme: distribūcijas <code>META6.json<\/code> jānes lauks <code>auth<\/code> ar vērtību <code>zef:&lt;lietotājvārds&gt;<\/code>, un tieši tā ekosistēma zina, ka augšupielāde tiešām ir jūsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Augšupielāde<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad konts ir izveidots un distribūcija gatava, <code>fez upload<\/code> iepako pašreizējo direktoriju un iesniedz to:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc tam ikviens to var instalēt pēc nosaukuma ar <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katru versiju drīkst augšupielādēt tikai vienreiz, tāpēc pirms atjauninājuma publicēšanas neaizmirstiet paaugstināt <code>version<\/code> failā <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citas noderīgas komandas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl dažas <code>fez<\/code> komandas, pie kurām ķersieties:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — pirms augšupielādes pārbaudīt distribūciju uz iespējamām problēmām;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — parādīt jau publicētās distribūcijas;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — pārbūvēt <code>META6.json<\/code> no failiem, kas pašlaik ir uz diska.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Visām šīm vajadzīgs instalēts <code>fez<\/code> un tīkla piekļuve, bet visam, kas seko pēc <code>init<\/code>, — ekosistēmas konts.<\/span><\/blockquote>"]]},"ru":{"t":"Публикация с помощью fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В предыдущей теме <code>fez<\/code> был представлен как способ загрузки дистрибутива в экосистему Raku.<\/span> <span class=\"sg\" data-s=\"1\">Использовать <code>fez<\/code> не обязательно — это не единственный способ публикации, — но это самый распространённый выбор, и он умеет больше, чем просто загружать: он также может создать каркас нового дистрибутива и управлять вашей учётной записью автора.<\/span> <span class=\"sg\" data-s=\"2\">Установите его с помощью <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Создание дистрибутива<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместо того чтобы вручную собирать <code>META6.json<\/code> и каталоги <code>lib/<\/code> и <code>t/<\/code>, можно позволить <code>fez<\/code> создать их автоматически:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> инициализирует новый дистрибутив для разработки — директорию проекта с готовым <code>META6.json<\/code> и стандартной структурой, — чтобы вы могли сразу приступить к написанию кода в <code>lib/<\/code> и тестов в <code>t/<\/code>, вместо того чтобы самостоятельно готовить файл метаданных.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Регистрация и вход<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для публикации необходима учётная запись в экосистеме.<\/span> <span class=\"sg\" data-s=\"1\">Создать её можно один раз командой <code>fez register<\/code> (она запросит имя пользователя, email и пароль), а войти — командой <code>fez login<\/code>, которая сохраняет ваш ключ, чтобы последующие команды были авторизованы:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ваше имя пользователя имеет значение: в файле <code>META6.json<\/code> дистрибутива должно быть поле <code>auth<\/code> со значением <code>zef:&lt;username&gt;<\/code> — так экосистема определяет, что загрузка действительно ваша.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Загрузка<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда учётная запись настроена и дистрибутив готов, <code>fez upload<\/code> упаковывает текущую директорию и отправляет её:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">После этого любой может установить его по имени с помощью <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каждую версию можно загрузить только один раз, поэтому не забудьте увеличить <code>version<\/code> в <code>META6.json<\/code> перед публикацией обновления.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие полезные команды<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Несколько дополнительных команд <code>fez<\/code>, которые могут пригодиться:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — проверить дистрибутив на возможные проблемы перед загрузкой;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показать дистрибутивы, которые вы уже опубликовали;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — пересобрать <code>META6.json<\/code> по файлам, находящимся на диске.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Все эти команды требуют установленного <code>fez<\/code> и доступа к сети, а все, кроме <code>init<\/code>, требуют учётной записи в экосистеме.<\/span><\/blockquote>"]]},"uk":{"t":"Публікація за допомогою fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Попередня тема представила <code>fez<\/code> як спосіб завантажити дистрибутив до екосистеми Raku.<\/span> <span class=\"sg\" data-s=\"1\">Користуватися <code>fez<\/code> не обов'язково — це не єдиний спосіб публікації, — але це найпоширеніший вибір, і він робить більше, ніж завантаження: він також може підготувати новий дистрибутив за вас і керувати вашим авторським обліковим записом.<\/span> <span class=\"sg\" data-s=\"2\">Встановіть його через <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Започаткування дистрибутива<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Замість збирати <code>META6.json<\/code> та каталоги <code>lib/<\/code> і <code>t/<\/code> вручну, ви можете доручити <code>fez<\/code> спорудити їх:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> започатковує новий дистрибутив, на якому можна будувати далі, — каталог проєкту з готовим <code>META6.json<\/code> і вже розставленою стандартною структурою, — тож ви можете одразу переходити до написання коду під <code>lib/<\/code> і тестів під <code>t/<\/code>, а не готувати файл метаданих самотужки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Реєстрація та вхід<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для публікації потрібен обліковий запис в екосистемі.<\/span> <span class=\"sg\" data-s=\"1\">Ви створюєте його одноразово через <code>fez register<\/code> (він запитає ім'я користувача, електронну пошту та пароль) і входите через <code>fez login<\/code>, який зберігає ваш ключ, щоб подальші команди були автентифіковані:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ваше ім'я користувача має значення: <code>META6.json<\/code> дистрибутива мусить нести поле <code>auth<\/code> зі значенням <code>zef:&lt;username&gt;<\/code>, — саме так екосистема дізнається, що завантаження справді ваше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завантаження<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли обліковий запис на місці, а дистрибутив готовий, <code>fez upload<\/code> пакує поточний каталог і подає його:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Після цього будь-хто може встановити його за іменем через <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кожну версію можна завантажити лише раз, тож не забувайте піднімати <code>version<\/code> у <code>META6.json<\/code> перед публікацією оновлення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші зручні команди<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще кілька команд <code>fez<\/code>, до яких ви звертатиметеся:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — перевірити дистрибутив на ймовірні негаразди перед завантаженням;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показати дистрибутиви, які ви вже опублікували;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — перебудувати <code>META6.json<\/code> за файлами, які зараз лежать на диску.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Усім їм потрібен встановлений <code>fez<\/code> і доступ до мережі, а всьому, що після <code>init<\/code>, — обліковий запис в екосистемі.<\/span><\/blockquote>"]]},"bg":{"t":"Публикуване с fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Предишната тема представи <code>fez<\/code> като начин за качване на дистрибуция в екосистемата на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не е задължително да използвате <code>fez<\/code> — това не е единственият начин за публикуване — но е най-разпространеният избор, а освен качване може и да подготви нова дистрибуция за вас и да управлява вашия авторски акаунт.<\/span> <span class=\"sg\" data-s=\"2\">Инсталирайте го с <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стартиране на дистрибуция<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместо да подготвяте <code>META6.json<\/code> и директориите <code>lib/<\/code> и <code>t/<\/code> на ръка, можете да оставите <code>fez<\/code> да ги създаде:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> инициализира нова дистрибуция, върху която да надграждате — проектна директория с готов <code>META6.json<\/code> и стандартното оформление вече на място — така можете направо да започнете да пишете код под <code>lib/<\/code> и тестове под <code>t/<\/code>, вместо да подготвяте метаданните сами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Регистрация и влизане<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Публикуването изисква акаунт в екосистемата.<\/span> <span class=\"sg\" data-s=\"1\">Създавате го еднократно с <code>fez register<\/code> (пита за потребителско име, имейл и парола) и влизате с <code>fez login<\/code>, който съхранява вашия ключ, така че следващите команди да бъдат удостоверени:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Потребителското ви име е важно: <code>META6.json<\/code> на дистрибуцията трябва да съдържа поле <code>auth<\/code>, зададено като <code>zef:&lt;username&gt;<\/code>, което е начинът, по който екосистемата знае, че качването наистина е ваше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Качване<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С готов акаунт и подготвена дистрибуция, <code>fez upload<\/code> пакетира текущата директория и я изпраща:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След това всеки може да я инсталира по име с <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка версия може да бъде качена само веднъж, затова не забравяйте да увеличите <code>version<\/code> в <code>META6.json<\/code> преди публикуване на актуализация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други полезни команди<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Още няколко команди на <code>fez<\/code>, за които ще посегнете:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — проверява дистрибуцията за вероятни проблеми преди качване;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показва дистрибуциите, които вече сте публикували;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — преизгражда <code>META6.json<\/code> от файловете, които в момента са на диска.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Всички те изискват инсталиран <code>fez<\/code> и достъп до мрежата, а всичко след <code>init<\/code> изисква акаунт в екосистемата.<\/span><\/blockquote>"]]},"la":{"t":"Publicare cum fez","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Thema praecedens <code>fez<\/code> introduxit ut modum distributionis in systema Raku imponendi.<\/span> <span class=\"sg\" data-s=\"1\">Non necesse est <code>fez<\/code> uti — non est solus modus publicandi — sed est electio frequentissima, et plus quam imponere facit: etiam novam distributionem pro te parare et rationem auctoris administrare potest.<\/span> <span class=\"sg\" data-s=\"2\">Installa eum per <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nova distributio inchoanda<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potius quam <code>META6.json<\/code> et directoria <code>lib/<\/code> et <code>t/<\/code> manu componere, <code>fez<\/code> ea pro te struere potes:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> novam distributionem initiat ad aedificandum — directorium proiecti cum <code>META6.json<\/code> parato et dispositione normali iam in loco — ut statim codicem sub <code>lib/<\/code> et probationes sub <code>t/<\/code> scribere possis, potius quam archivum metadatorum ipse praeparare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Inscriptio et aditus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Publicatio rationem in systemate requirit.<\/span> <span class=\"sg\" data-s=\"1\">Eam semel per <code>fez register<\/code> creas (nomen usoris, inscriptionem electronicam, et tesseram rogat) et per <code>fez login<\/code> intras, quod clavem tuam servat ut mandata sequentia authenticata sint:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nomen usoris tui refert: archivum <code>META6.json<\/code> distributionis campum <code>auth<\/code> ad <code>zef:&lt;username&gt;<\/code> positum ferre debet, quo modo systema scit impositionem vere tuam esse.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Impositio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ratione parata et distributione prompte, <code>fez upload<\/code> directorium praesens componit et submittit:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post hoc, quisque eam nomine per <code>zef install My::Greeting<\/code> installare potest.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque versio semel tantum imponi potest, itaque memento <code>version<\/code> in <code>META6.json<\/code> augere antequam renovationem publices.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alia mandata utilia<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aliquot alia mandata <code>fez<\/code> quae adhibebis:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — distributionem pro verisimilibus problematibus ante impositionem inspice;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — distributiones quas iam publicavisti ostende;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — <code>META6.json<\/code> ex archivis in disco nunc praesentibus reconstitue.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Omnia haec <code>fez<\/code> installatum et accessum ad retia requirunt, et omnia post <code>init<\/code> rationem in systemate requirunt.<\/span><\/blockquote>"]]}}}</script>
