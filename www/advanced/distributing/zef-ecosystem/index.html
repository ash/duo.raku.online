<script type="application/json" id="page-data">{"u":"advanced/distributing/zef-ecosystem","n":736,"k":"topic","pv":"advanced/distributing/meta6/quiz","nx":"advanced/distributing/fez","tr":["advanced","advanced/distributing"],"L":{"en":{"t":"zef and the ecosystem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> is Raku’s module installer.<\/span> <span class=\"sg\" data-s=\"1\">You have already used it to install modules by name; it also works on a local distribution directory.<\/span> <span class=\"sg\" data-s=\"2\">From inside a distribution you can test and install it directly:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> runs the files under <code>t/<\/code>, and <code>zef install .<\/code> installs the distribution into your Raku so that other programs can <code>use<\/code> it.<\/span> <span class=\"sg\" data-s=\"1\">Installing by name — <code>zef install Cro<\/code> — does the same thing after first downloading the distribution from the ecosystem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To <strong>publish<\/strong> your own distribution so that others can install it by name, you upload it to the ecosystem.<\/span> <span class=\"sg\" data-s=\"1\">The common tool for this is <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This packages the current distribution and submits it to the Raku ecosystem, after which <code>zef install Maths::Simple<\/code> will work for anyone.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">These commands need <code>zef<\/code>/<code>fez<\/code> installed and network access, and uploading needs an ecosystem account.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So the lifecycle of a shared module is: lay it out with a <code>META6.json<\/code>, test it with <code>zef test<\/code>, and publish it with <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">From then on it is just another name that anyone can <code>zef install<\/code>.<\/span><\/p>"]]},"de":{"t":"zef und das Ökosystem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> ist Rakus Modul-Installer.<\/span> <span class=\"sg\" data-s=\"1\">Du hast es bereits verwendet, um Module über den Namen zu installieren; es funktioniert auch mit einem lokalen Distributionsverzeichnis.<\/span> <span class=\"sg\" data-s=\"2\">Innerhalb einer Distribution kannst du sie direkt testen und installieren:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> führt die Dateien unter <code>t/<\/code> aus, und <code>zef install .<\/code> installiert die Distribution in dein Raku, sodass andere Programme sie mit <code>use<\/code> einbinden können.<\/span> <span class=\"sg\" data-s=\"1\">Die Installation über den Namen — <code>zef install Cro<\/code> — macht dasselbe, nachdem die Distribution zuerst aus dem Ökosystem heruntergeladen wurde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um deine eigene Distribution zu <strong>veröffentlichen<\/strong>, damit andere sie über den Namen installieren können, lädst du sie in das Ökosystem hoch.<\/span> <span class=\"sg\" data-s=\"1\">Das übliche Werkzeug dafür ist <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Damit wird die aktuelle Distribution verpackt und an das Raku-Ökosystem übermittelt, wonach <code>zef install Maths::Simple<\/code> für jeden funktioniert.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Diese Befehle erfordern eine installierte Version von <code>zef<\/code>/<code>fez<\/code> und Netzwerkzugang, und das Hochladen erfordert ein Ökosystem-Konto.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Lebenszyklus eines geteilten Moduls ist also: es mit einer <code>META6.json<\/code> einrichten, mit <code>zef test<\/code> testen und mit <code>fez upload<\/code> veröffentlichen.<\/span> <span class=\"sg\" data-s=\"1\">Ab dann ist es einfach ein weiterer Name, den jeder mit <code>zef install<\/code> installieren kann.<\/span><\/p>"]]},"nl":{"t":"zef en het ecosysteem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> is de module-installeerder van Raku.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt het al gebruikt om modules op naam te installeren; het werkt ook op een lokale distributiemap.<\/span> <span class=\"sg\" data-s=\"2\">Vanuit een distributie kun je direct testen en installeren:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> voert de bestanden onder <code>t/<\/code> uit, en <code>zef install .<\/code> installeert de distributie in je Raku zodat andere programma's het kunnen <code>use<\/code>n.<\/span> <span class=\"sg\" data-s=\"1\">Installeren op naam — <code>zef install Cro<\/code> — doet hetzelfde nadat eerst de distributie uit het ecosysteem is gedownload.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om je eigen distributie te <strong>publiceren<\/strong> zodat anderen het op naam kunnen installeren, upload je het naar het ecosysteem.<\/span> <span class=\"sg\" data-s=\"1\">Het gebruikelijke gereedschap hiervoor is <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit verpakt de huidige distributie en dient het in bij het Raku-ecosysteem, waarna <code>zef install Maths::Simple<\/code> voor iedereen werkt.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Deze commando's vereisen dat <code>zef<\/code>/<code>fez<\/code> is geïnstalleerd en netwerktoegang, en uploaden vereist een ecosysteemaccount.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De levenscyclus van een gedeelde module is dus: maak de structuur aan met een <code>META6.json<\/code>, test met <code>zef test<\/code>, en publiceer met <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vanaf dat moment is het gewoon een naam die iedereen kan <code>zef install<\/code>en.<\/span><\/p>"]]},"es":{"t":"zef y el ecosistema","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> es el instalador de módulos de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ya lo has usado para instalar módulos por nombre; también funciona con un directorio de distribución local.<\/span> <span class=\"sg\" data-s=\"2\">Desde dentro de una distribución puedes probarla e instalarla directamente:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> ejecuta los archivos en <code>t/<\/code>, y <code>zef install .<\/code> instala la distribución en tu Raku para que otros programas puedan usar <code>use<\/code> con ella.<\/span> <span class=\"sg\" data-s=\"1\">Instalar por nombre — <code>zef install Cro<\/code> — hace lo mismo después de descargar primero la distribución del ecosistema.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para <strong>publicar<\/strong> tu propia distribución y que otros puedan instalarla por nombre, la subes al ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">La herramienta común para esto es <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto empaqueta la distribución actual y la envía al ecosistema de Raku, después de lo cual <code>zef install Maths::Simple<\/code> funcionará para cualquiera.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Estos comandos necesitan <code>zef<\/code>/<code>fez<\/code> instalado y acceso a la red, y la subida necesita una cuenta en el ecosistema.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que el ciclo de vida de un módulo compartido es: organizarlo con un <code>META6.json<\/code>, probarlo con <code>zef test<\/code> y publicarlo con <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A partir de entonces, es simplemente otro nombre que cualquiera puede instalar con <code>zef install<\/code>.<\/span><\/p>"]]},"it":{"t":"zef e l'ecosistema","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> è l'installer di moduli di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Lo hai già usato per installare moduli per nome; funziona anche su una directory di distribuzione locale.<\/span> <span class=\"sg\" data-s=\"2\">Dall'interno di una distribuzione puoi testarla e installarla direttamente:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> esegue i file sotto <code>t/<\/code>, e <code>zef install .<\/code> installa la distribuzione nel tuo Raku in modo che altri programmi possano usarla con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Installare per nome — <code>zef install Cro<\/code> — fa la stessa cosa, ma prima scarica la distribuzione dall'ecosistema.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per <strong>pubblicare<\/strong> la tua distribuzione in modo che altri possano installarla per nome, la carichi nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Lo strumento più comune per farlo è <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo confeziona la distribuzione corrente e la invia all'ecosistema Raku, dopodiché <code>zef install Maths::Simple<\/code> funzionerà per chiunque.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Questi comandi richiedono <code>zef<\/code>/<code>fez<\/code> installati e l'accesso alla rete, e il caricamento richiede un account nell'ecosistema.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi il ciclo di vita di un modulo condiviso è: organizzarlo con un <code>META6.json<\/code>, testarlo con <code>zef test<\/code> e pubblicarlo con <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da quel momento in poi è semplicemente un altro nome che chiunque può installare con <code>zef install<\/code>.<\/span><\/p>"]]},"lv":{"t":"zef un ekosistēma","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> ir Raku moduļu instalētājs.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to jau esat izmantojuši, lai instalētu moduļus pēc nosaukuma; tas darbojas arī ar vietēju distribūcijas direktoriju.<\/span> <span class=\"sg\" data-s=\"2\">No distribūcijas iekšpuses to var tieši notestēt un instalēt:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> izpilda failus zem <code>t/<\/code>, un <code>zef install .<\/code> instalē distribūciju jūsu Raku vidē, lai citas programmas to varētu <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Instalēšana pēc nosaukuma — <code>zef install Cro<\/code> — dara to pašu, vispirms lejupielādējot distribūciju no ekosistēmas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai savu distribūciju <strong>publicētu<\/strong> un citi to varētu instalēt pēc nosaukuma, tā jāaugšupielādē ekosistēmā.<\/span> <span class=\"sg\" data-s=\"1\">Izplatītais rīks šim nolūkam ir <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas iepako pašreizējo distribūciju un iesniedz to Raku ekosistēmā, pēc kā <code>zef install Maths::Simple<\/code> darbosies ikvienam.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Šīm komandām nepieciešams instalēts <code>zef<\/code>/<code>fez<\/code> un tīkla piekļuve, bet augšupielādei — ekosistēmas konts.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad koplietota moduļa dzīves cikls ir šāds: izkārtojiet to ar <code>META6.json<\/code>, notestējiet ar <code>zef test<\/code> un publicējiet ar <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">No tā brīža tas ir tikai vēl viens nosaukums, ko ikviens var <code>zef install<\/code>.<\/span><\/p>"]]},"ru":{"t":"zef и экосистема","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> — это установщик модулей Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже использовали его для установки модулей по имени; он также работает с локальной директорией дистрибутива.<\/span> <span class=\"sg\" data-s=\"2\">Из директории дистрибутива можно запустить тестирование и установку напрямую:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> запускает файлы из <code>t/<\/code>, а <code>zef install .<\/code> устанавливает дистрибутив в вашу среду Raku, чтобы другие программы могли его подключать через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Установка по имени — <code>zef install Cro<\/code> — делает то же самое, предварительно скачав дистрибутив из экосистемы.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы <strong>опубликовать<\/strong> свой дистрибутив, чтобы другие могли установить его по имени, нужно загрузить его в экосистему.<\/span> <span class=\"sg\" data-s=\"1\">Обычно для этого используется <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта команда упаковывает текущий дистрибутив и отправляет его в экосистему Raku, после чего <code>zef install Maths::Simple<\/code> заработает для всех.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Эти команды требуют установленных <code>zef<\/code>/<code>fez<\/code> и доступа к сети, а для загрузки необходима учётная запись в экосистеме.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таким образом, жизненный цикл общедоступного модуля таков: подготовить его с файлом <code>META6.json<\/code>, протестировать с помощью <code>zef test<\/code> и опубликовать через <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После этого он становится просто ещё одним именем, которое может установить любой через <code>zef install<\/code>.<\/span><\/p>"]]},"uk":{"t":"zef та екосистема","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> — це встановлювач модулів Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже користувалися ним, щоб встановлювати модулі за іменем; він працює і з локальним каталогом дистрибутива.<\/span> <span class=\"sg\" data-s=\"2\">Зсередини дистрибутива його можна протестувати й встановити напряму:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> виконує файли з каталогу <code>t/<\/code>, а <code>zef install .<\/code> встановлює дистрибутив у ваш Raku, щоб інші програми могли зробити <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Встановлення за іменем — <code>zef install Cro<\/code> — робить те саме, спершу завантаживши дистрибутив з екосистеми.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб <strong>опублікувати<\/strong> власний дистрибутив і дати іншим змогу встановити його за іменем, ви завантажуєте його в екосистему.<\/span> <span class=\"sg\" data-s=\"1\">Звичним інструментом для цього є <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це пакує поточний дистрибутив і подає його до екосистеми Raku, після чого <code>zef install Maths::Simple<\/code> спрацює для будь-кого.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цим командам потрібні встановлені <code>zef<\/code>/<code>fez<\/code> і доступ до мережі, а завантаженню — обліковий запис в екосистемі.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, життєвий цикл спільного модуля такий: розкласти його з <code>META6.json<\/code>, протестувати через <code>zef test<\/code> і опублікувати через <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Відтоді це просто ще одне ім'я, яке будь-хто може <code>zef install<\/code>.<\/span><\/p>"]]},"bg":{"t":"zef и екосистемата","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> е инсталаторът на модули за Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вече сте го използвали, за да инсталирате модули по име; той работи и с локална директория на дистрибуция.<\/span> <span class=\"sg\" data-s=\"2\">От вътрешността на дистрибуция можете да я тествате и инсталирате директно:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> изпълнява файловете под <code>t/<\/code>, а <code>zef install .<\/code> инсталира дистрибуцията във вашия Raku, така че други програми да могат да я използват с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Инсталирането по име — <code>zef install Cro<\/code> — прави същото, но първо изтегля дистрибуцията от екосистемата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да <strong>публикувате<\/strong> вашата собствена дистрибуция, така че други да могат да я инсталират по име, я качвате в екосистемата.<\/span> <span class=\"sg\" data-s=\"1\">Обичайният инструмент за това е <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това пакетира текущата дистрибуция и я изпраща в екосистемата на Raku, след което <code>zef install Maths::Simple<\/code> ще работи за всеки.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тези команди изискват инсталирани <code>zef<\/code>/<code>fez<\/code> и достъп до мрежата, а качването изисква акаунт в екосистемата.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така жизненият цикъл на споделен модул е: оформете го с <code>META6.json<\/code>, тествайте го с <code>zef test<\/code> и публикувайте го с <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оттам нататък той е просто още едно име, което всеки може да инсталира с <code>zef install<\/code>.<\/span><\/p>"]]},"la":{"t":"zef et oecosystema","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> est installator modulorum Raku.<\/span> <span class=\"sg\" data-s=\"1\">Iam eo usus es ad modulos nomine installandos; etiam in directorio distributionis locali operatur.<\/span> <span class=\"sg\" data-s=\"2\">Ex interiore distributione eam directe probare et installare potes:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> archiva sub <code>t/<\/code> exsequitur, et <code>zef install .<\/code> distributionem in Raku tuum installat ut alia programmata eam per <code>use<\/code> adhibere possint.<\/span> <span class=\"sg\" data-s=\"1\">Nomine installare — <code>zef install Cro<\/code> — idem facit postquam distributionem ex systemate prius deponit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad distributionem tuam <strong>publicandam<\/strong> ut alii eam nomine installare possint, eam in systema imponis.<\/span> <span class=\"sg\" data-s=\"1\">Instrumentum commune ad hoc est <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc distributionem praesentem componit et in systema Raku submittit, post quod <code>zef install Maths::Simple<\/code> cuilibet operabitur.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Haec mandata <code>zef<\/code>/<code>fez<\/code> installata et accessum ad retia requirunt, et impositio rationem in systemate requirit.<\/span><\/blockquote>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque cursus vitae moduli communicati est: eum cum <code>META6.json<\/code> dispone, per <code>zef test<\/code> proba, et per <code>fez upload<\/code> publica.<\/span> <span class=\"sg\" data-s=\"1\">Ab eo tempore tantum aliud nomen est quod quisque per <code>zef install<\/code> installare potest.<\/span><\/p>"]]}}}</script>
