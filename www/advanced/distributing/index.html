<script type="application/json" id="page-data">{"u":"advanced/distributing","n":733,"k":"section","pv":"advanced/packages/exercises/nested-name/solution","nx":"advanced/distributing/meta6","tr":["advanced"],"L":{"en":{"t":"Distributing modules","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Once a module is useful beyond your own computer, you can package it as a <em>distribution<\/em> and share it through Raku’s module ecosystem, so that anyone can install it with <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This section describes the two pieces that make that possible: the <code>META6.json<\/code> file that describes a distribution, and the tools — <code>zef<\/code> and <code>fez<\/code> — that install and publish it.<\/span> <span class=\"sg\" data-s=\"1\">These steps involve the ecosystem and the network rather than the language itself, so the examples here describe files and commands rather than producing program output.<\/span><\/p>"]]},"de":{"t":"Module verteilen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sobald ein Modul über deinen eigenen Computer hinaus nützlich ist, kannst du es als <em>Distribution<\/em> verpacken und über das Raku-Modul-Ökosystem teilen, damit jeder es mit <code>zef<\/code> installieren kann.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt beschreibt die zwei Teile, die das möglich machen: die Datei <code>META6.json<\/code>, die eine Distribution beschreibt, und die Werkzeuge — <code>zef<\/code> und <code>fez<\/code> — die sie installieren und veröffentlichen.<\/span> <span class=\"sg\" data-s=\"1\">Diese Schritte betreffen das Ökosystem und das Netzwerk und nicht die Sprache selbst, daher beschreiben die Beispiele hier Dateien und Befehle, anstatt Programmausgaben zu erzeugen.<\/span><\/p>"]]},"nl":{"t":"Modules distribueren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zodra een module nuttig is buiten je eigen computer, kun je het verpakken als een <em>distributie<\/em> en delen via het Raku-module-ecosysteem, zodat iedereen het kan installeren met <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel beschrijft de twee stukken die dat mogelijk maken: het <code>META6.json<\/code>-bestand dat een distributie beschrijft, en de gereedschappen — <code>zef<\/code> en <code>fez<\/code> — die het installeren en publiceren.<\/span> <span class=\"sg\" data-s=\"1\">Deze stappen hebben te maken met het ecosysteem en het netwerk in plaats van met de taal zelf, dus de voorbeelden hier beschrijven bestanden en commando's in plaats van programma-uitvoer te produceren.<\/span><\/p>"]]},"es":{"t":"Distribución de módulos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Una vez que un módulo es útil más allá de tu propio ordenador, puedes empaquetarlo como una <em>distribución<\/em> y compartirlo a través del ecosistema de módulos de Raku, para que cualquiera pueda instalarlo con <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta sección describe las dos piezas que hacen esto posible: el archivo <code>META6.json<\/code> que describe una distribución, y las herramientas — <code>zef<\/code> y <code>fez<\/code> — que la instalan y publican.<\/span> <span class=\"sg\" data-s=\"1\">Estos pasos involucran el ecosistema y la red en lugar del lenguaje en sí, por lo que los ejemplos aquí describen archivos y comandos en lugar de producir salida de programa.<\/span><\/p>"]]},"it":{"t":"Distribuzione di moduli","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Una volta che un modulo è utile al di fuori del tuo computer, puoi confezionarlo come <em>distribuzione<\/em> e condividerlo attraverso l'ecosistema dei moduli Raku, in modo che chiunque possa installarlo con <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sezione descrive i due elementi che rendono ciò possibile: il file <code>META6.json<\/code> che descrive una distribuzione, e gli strumenti — <code>zef<\/code> e <code>fez<\/code> — che permettono di installarla e pubblicarla.<\/span> <span class=\"sg\" data-s=\"1\">Questi passaggi coinvolgono l'ecosistema e la rete piuttosto che il linguaggio stesso, quindi gli esempi qui descrivono file e comandi anziché produrre output di programma.<\/span><\/p>"]]},"lv":{"t":"Moduļu izplatīšana 🆕","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad modulis kļūst noderīgs ne tikai jūsu datorā, to var iepakot kā <em>distribūciju<\/em> un dalīties ar to Raku moduļu ekosistēmā, lai ikviens varētu to instalēt ar <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa apraksta divas daļas, kas to padara iespējamu: failu <code>META6.json<\/code>, kas raksturo distribūciju, un rīkus <code>zef<\/code> un <code>fez<\/code>, kas to instalē un publicē.<\/span> <span class=\"sg\" data-s=\"1\">Šie soļi skar ekosistēmu un tīklu, nevis pašu valodu, tāpēc šejienes piemēri apraksta failus un komandas, nevis rada programmas izvadi.<\/span><\/p>"]]},"ru":{"t":"Распространение модулей","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда модуль становится полезным не только на вашем компьютере, его можно упаковать в виде <em>дистрибутива<\/em> и опубликовать через экосистему модулей Raku, чтобы любой мог установить его с помощью <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом разделе описываются два компонента, которые делают это возможным: файл <code>META6.json<\/code>, описывающий дистрибутив, и инструменты — <code>zef<\/code> и <code>fez<\/code> — для установки и публикации.<\/span> <span class=\"sg\" data-s=\"1\">Эти шаги связаны с экосистемой и сетью, а не с самим языком, поэтому примеры здесь описывают файлы и команды, а не выводят результат программ.<\/span><\/p>"]]},"uk":{"t":"Розповсюдження модулів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щойно модуль стає корисним за межами вашого власного комп'ютера, ви можете спакувати його як <em>дистрибутив<\/em> і поділитися ним через екосистему модулів Raku, щоб будь-хто міг встановити його через <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей розділ описує дві складові, які це уможливлюють: файл <code>META6.json<\/code>, що описує дистрибутив, та інструменти <code>zef<\/code> і <code>fez<\/code>, які його встановлюють і публікують.<\/span> <span class=\"sg\" data-s=\"1\">Ці кроки стосуються екосистеми та мережі, а не самої мови, тож приклади тут описують файли й команди, а не дають вивід програми.<\/span><\/p>"]]},"bg":{"t":"Разпространение на модули 🆕","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато един модул е полезен извън вашия собствен компютър, можете да го пакетирате като <em>дистрибуция<\/em> и да го споделите чрез екосистемата за модули на Raku, така че всеки да може да го инсталира с <code>zef<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този раздел описва двете части, които правят това възможно: файлът <code>META6.json<\/code>, който описва дистрибуцията, и инструментите — <code>zef<\/code> и <code>fez<\/code> — които я инсталират и публикуват.<\/span> <span class=\"sg\" data-s=\"1\">Тези стъпки включват екосистемата и мрежата, а не самия език, така че примерите тук описват файлове и команди, вместо да произвеждат изход от програма.<\/span><\/p>"]]},"la":{"t":"Modulos distribuere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum modulus ultra computatrum tuum utilis est, eum ut <em>distributionem<\/em> componere potes et per systema modulorum Raku communicare, ut quisque eum per <code>zef<\/code> installare possit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec sectio duas partes describit quae hoc possibile faciunt: archivum <code>META6.json<\/code> quod distributionem describit, et instrumenta — <code>zef<\/code> et <code>fez<\/code> — quae eam installant et publicant.<\/span> <span class=\"sg\" data-s=\"1\">Hi gradus systema et retia potius quam linguam ipsam attingunt, itaque exempla hic archiva et mandata describunt potius quam exitum programmatis producunt.<\/span><\/p>"]]}}}</script>
