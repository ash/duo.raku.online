<script type="application/json" id="page-data">{"u":"advanced/given-when/matching","n":596,"k":"topic","pv":"advanced/given-when","nx":"advanced/given-when/matching/quiz","tr":["advanced","advanced/given-when"],"L":{"en":{"t":"Matching ranges, types, and conditions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>when<\/code> block does not only compare for equality.<\/span> <span class=\"sg\" data-s=\"1\">It performs a <em>smart match<\/em> between the topic and the value you give it, so you can match against ranges, types, and conditions, not just single values.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ranges<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A range matches when the topic falls inside it.<\/span> <span class=\"sg\" data-s=\"1\">This makes <code>given<\/code>/<code>when<\/code> a natural fit for grouping numbers into bands:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $score = 75;\n\ngiven $score {\n    when 90..100 { say 'A' }\n    when 80..89  { say 'B' }\n    when 70..79  { say 'C' }\n    default      { say 'F' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The value <code>75<\/code> falls into the range <code>70..79<\/code>, so the program prints:<\/span><\/p>"],["code",0,"<pre><code>C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Types<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A type matches when the topic is of that type.<\/span> <span class=\"sg\" data-s=\"1\">This lets you branch on what kind of value you have:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 'Raku';\n\ngiven $value {\n    when Int { say 'an integer' }\n    when Str { say 'a string' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Since <code>$value<\/code> holds a string, the program prints:<\/span><\/p>"],["code",0,"<pre><code>a string<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conditions<\/span><\/h3>"],["p",2,"<p><span }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí el primer <code>when<\/code> coincide, y el programa imprime:<\/span><\/p>"],["code",0,"<pre><code>negative<\/code><\/pre>"]]},"it":{"t":"Matching di intervalli, tipi e condizioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>when<\/code> non confronta solo per uguaglianza.<\/span> <span class=\"sg\" data-s=\"1\">Esegue uno <em>smart match<\/em> tra il topic e il valore fornito, quindi è possibile confrontare intervalli, tipi e condizioni, non solo singoli valori.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Intervalli<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un intervallo corrisponde quando il topic rientra al suo interno.<\/span> <span class=\"sg\" data-s=\"1\">Questo rende <code>given<\/code>/<code>when<\/code> una scelta naturale per raggruppare numeri in fasce:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $score = 75;\n\ngiven $score {\n    when 90..100 { say 'A' }\n    when 80..89  { say 'B' }\n    when 70..79  { say 'C' }\n    default      { say 'F' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il valore <code>75<\/code> rientra nell'intervallo <code>70..79<\/code>, quindi il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Tipi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un tipo corrisponde quando il topic è di quel tipo.<\/span> <span class=\"sg\" data-s=\"1\">Questo permette di ramificare in base al tipo di valore che si ha:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 'Raku';\n\ngiven $value {\n    when Int { say 'an integer' }\n    when Str { say 'a string' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>$value<\/code> contiene una stringa, il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>a string<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Condizioni<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È possibile anche usare un confronto direttamente.<\/span> <span class=\"sg\" data-s=\"1\">All'interno del <code>when<\/code>, il topic è disponibile come <code>$_<\/code>, quindi una condizione come <code>$_ &lt; 0<\/code> corrisponde quando è vera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -7;\n\ngiven $n {\n    when $_ &lt; 0 { say 'negative' }\n    when 0      { say 'zero' }\n    default     { say 'positive' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui il primo <code>when<\/code> corrisponde, e il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>negative<\/code><\/pre>"]]},"lv":{"t":"Diapazonu, tipu un nosacījumu salīdzināšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>when<\/code> bloks ne tikai salīdzina vienlīdzību.<\/span> <span class=\"sg\" data-s=\"1\">Tas veic <em>gudro salīdzināšanu<\/em> (smart match) starp tēmu un norādīto vērtību, tāpēc jūs varat salīdzināt ar diapazoniem, tipiem un nosacījumiem, ne tikai ar atsevišķām vērtībām.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Diapazoni<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diapazons atbilst, ja tēma ietilpst tajā.<\/span> <span class=\"sg\" data-s=\"1\">Tas padara <code>given<\/code>/<code>when<\/code> par dabisku risinājumu skaitļu grupēšanai joslās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $score = 75;\n\ngiven $score {\n    when 90..100 { say 'A' }\n    when 80..89  { say 'B' }\n    when 70..79  { say 'C' }\n    default      { say 'F' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vērtība <code>75<\/code> ietilpst diapazonā <code>70..79<\/code>, tāpēc programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Tipi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tips atbilst, ja tēma ir šī tipa.<\/span> <span class=\"sg\" data-s=\"1  80..89  { say 'B' }\n    when 70..79  { say 'C' }\n    default      { say 'F' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значение <code>75<\/code> попадает в диапазон <code>70..79<\/code>, поэтому программа печатает:<\/span><\/p>"],["code",0,"<pre><code>C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Типы<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип совпадает, когда топик принадлежит этому типу.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет ветвиться в зависимости от того, какой вид значения у вас есть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 'Raku';\n\ngiven $value {\n    when Int { say 'an integer' }\n    when Str { say 'a string' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>$value<\/code> содержит строку, программа печатает:<\/span><\/p>"],["code",0,"<pre><code>a string<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Условия<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно также использовать сравнение напрямую.<\/span> <span class=\"sg\" data-s=\"1\">Внутри <code>when<\/code> топик доступен как <code>$_<\/code>, поэтому условие вроде <code>$_ &lt; 0<\/code> совпадает, когда оно истинно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -7;\n\ngiven $n {\n    when $_ &lt; 0 { say 'negative' }\n    when 0      { say 'zero' }\n    default     { say 'positive' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь первый <code>when<\/code> совпадает, и программа печатает:<\/span><\/p>"],["code",0,"<pre><code>negative<\/code><\/pre>"]]},"uk":{"t":"Зіставлення з діапазонами, типами та умовами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>when<\/code> не лише порівнює на рівність.<\/span> <span class=\"sg\" data-s=\"1\">Він виконує <em>розумне зіставлення<\/em> між топіком і значенням, яке ви йому дали, тож зіставлятися можна з діапазонами, типами й умовами, а не тільки  = 'Raku';\n\ngiven $value {\n    when Int { say 'an integer' }\n    when Str { say 'a string' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar <code>$value<\/code> enhavas ĉenon, la programo presas:<\/span><\/p>"],["code",0,"<pre><code>a string<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kondiĉoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas uzi komparon rekte.<\/span> <span class=\"sg\" data-s=\"1\">Ene de la <code>when<\/code> la temo disponeblas kiel <code>$_<\/code>, do kondiĉo kiel <code>$_ &lt; 0<\/code> kongruas, kiam ĝi estas vera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -7;\n\ngiven $n {\n    when $_ &lt; 0 { say 'negative' }\n    when 0      { say 'zero' }\n    default     { say 'positive' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie la unua <code>when<\/code> kongruas, kaj la programo presas:<\/span><\/p>"],["code",0,"<pre><code>negative<\/code><\/pre>"]]},"la":{"t":"Concordatio intervallarum, typorum, et condicionum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Copia <code>when<\/code> non solum aequalitatem comparat. <em>Congruationem intelligentem<\/em> inter topicum et valorem quem das facit, ita ut intervallis, typis, et condicionibus congruere possis, non solum singulis valoribus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Intervalla<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intervallum congruit cum topicum intra eum cadit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc <code>given<\/code>/<code>when<\/code> aptum naturaliter facit ad numeros in fasciculos dividendos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $score = 75;\n\ngiven $score {\n    when 90..100 { say 'A' }\n    when 80..89  { say 'B' }\n    when 70..79  { say 'C' }\n    default      { say 'F' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valor <code>75<\/code> in intervallum <code>70..79<\/code> cadit,
