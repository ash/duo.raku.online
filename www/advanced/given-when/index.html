<script type="application/json" id="page-data">{"u":"advanced/given-when","n":595,"k":"section","pv":"advanced/block-phasers/quiz","nx":"advanced/given-when/matching","tr":["advanced"],"L":{"en":{"t":"<code>given<\/code> and <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When a program needs to choose between several alternatives, a chain of <code>if<\/code> and <code>elsif<\/code> checks can become long and repetitive.<\/span> <span class=\"sg\" data-s=\"1\">In that situation, the <code>given<\/code>/<code>when<\/code> construct is often clearer.<\/span> <span class=\"sg\" data-s=\"2\">It is similar to the <code>switch<\/code> statement found in other languages.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>given<\/code> block takes a value and makes it the <em>topic<\/em> — the special variable <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Each <code>when<\/code> block is then compared against that topic, and the first one that matches runs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unlike a <code>switch<\/code> in some other languages, there is no fall-through: as soon as a <code>when<\/code> matches, its block runs and the <code>given<\/code> block is finished.<\/span> <span class=\"sg\" data-s=\"1\">The remaining <code>when<\/code> blocks are not tested.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>default<\/code> block<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>default<\/code> block runs when none of the <code>when<\/code> blocks matched.<\/span> <span class=\"sg\" data-s=\"1\">It plays the same role as the <code>else<\/code> branch of an <code>if<\/code> statement:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Because <code>$n<\/code> is neither <code>1<\/code> nor <code>2<\/code>, the program prints:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"de":{"t":"<code>given<\/code> und <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn ein Programm zwischen mehreren Alternativen wählen muss, kann eine Kette von <code>if<\/code>- und <code>elsif<\/code>-Prüfungen lang und repetitiv werden.<\/span> <span class=\"sg\" data-s=\"1\">In dieser Situation ist das <code>given<\/code>/<code>when<\/code>-Konstrukt oft übersichtlicher.<\/span> <span class=\"sg\" data-s=\"2\">Es ähnelt der <code>switch<\/code>-Anweisung aus anderen Sprachen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>given<\/code>-Block nimmt einen Wert entgegen und macht ihn zum <em>Thema<\/em> — der speziellen Variable <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jeder <code>when<\/code>-Block wird dann mit diesem Thema verglichen, und der erste passende wird ausgeführt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Anders als bei <code>switch<\/code> in manchen anderen Sprachen gibt es kein Fall-Through: Sobald ein <code>when<\/code> passt, wird sein Block ausgeführt und der <code>given<\/code>-Block ist beendet.<\/span> <span class=\"sg\" data-s=\"1\">Die verbleibenden <code>when<\/code>-Blöcke werden nicht mehr geprüft.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der <code>default<\/code>-Block<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>default<\/code>-Block wird ausgeführt, wenn keiner der <code>when<\/code>-Blöcke gepasst hat.<\/span> <span class=\"sg\" data-s=\"1\">Er spielt dieselbe Rolle wie der <code>else<\/code>-Zweig einer <code>if<\/code>-Anweisung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da <code>$n<\/code> weder <code>1<\/code> noch <code>2<\/code> ist, gibt das Programm aus:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"nl":{"t":"<code>given<\/code> en <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wanneer een programma moet kiezen uit meerdere alternatieven, kan een keten van <code>if<\/code>- en <code>elsif<\/code>-controles lang en repetitief worden.<\/span> <span class=\"sg\" data-s=\"1\">In die situatie is de <code>given<\/code>/<code>when<\/code>-constructie vaak duidelijker.<\/span> <span class=\"sg\" data-s=\"2\">Het lijkt op het <code>switch<\/code>-statement dat in andere talen voorkomt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>given<\/code>-blok neemt een waarde en maakt deze het <em>topic<\/em> — de speciale variabele <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Elk <code>when<\/code>-blok wordt vervolgens vergeleken met dat topic, en het eerste dat overeenkomt wordt uitgevoerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In tegenstelling tot een <code>switch<\/code> in sommige andere talen, is er geen doorval (fall-through): zodra een <code>when<\/code> overeenkomt, wordt het blok uitgevoerd en is het <code>given<\/code>-blok afgelopen.<\/span> <span class=\"sg\" data-s=\"1\">De overige <code>when<\/code>-blokken worden niet getest.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het <code>default<\/code>-blok<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>default<\/code>-blok wordt uitgevoerd wanneer geen van de <code>when<\/code>-blokken overeenkomt.<\/span> <span class=\"sg\" data-s=\"1\">Het speelt dezelfde rol als de <code>else<\/code>-tak van een <code>if<\/code>-statement:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>$n<\/code> noch <code>1<\/code> noch <code>2<\/code> is, drukt het programma af:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"es":{"t":"<code>given<\/code> y <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando un programa necesita elegir entre varias alternativas, una cadena de comprobaciones <code>if<\/code> y <code>elsif<\/code> puede volverse larga y repetitiva.<\/span> <span class=\"sg\" data-s=\"1\">En esa situación, la construcción <code>given<\/code>/<code>when<\/code> suele ser más clara.<\/span> <span class=\"sg\" data-s=\"2\">Es similar a la sentencia <code>switch<\/code> que se encuentra en otros lenguajes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>given<\/code> toma un valor y lo convierte en el <em>topico<\/em> — la variable especial <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cada bloque <code>when<\/code> se compara entonces con ese topico, y el primero que coincida se ejecuta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A diferencia de un <code>switch<\/code> en algunos otros lenguajes, no hay fall-through: en cuanto un <code>when<\/code> coincide, su bloque se ejecuta y el bloque <code>given<\/code> termina.<\/span> <span class=\"sg\" data-s=\"1\">Los bloques <code>when<\/code> restantes no se evaluan.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>default<\/code> se ejecuta cuando ninguno de los bloques <code>when<\/code> ha coincidido.<\/span> <span class=\"sg\" data-s=\"1\">Cumple el mismo papel que la rama <code>else<\/code> de una sentencia <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como <code>$n<\/code> no es ni <code>1<\/code> ni <code>2<\/code>, el programa imprime:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"it":{"t":"<code>given<\/code> e <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando un programma deve scegliere tra diverse alternative, una catena di controlli <code>if<\/code> e <code>elsif<\/code> può diventare lunga e ripetitiva.<\/span> <span class=\"sg\" data-s=\"1\">In questa situazione, il costrutto <code>given<\/code>/<code>when<\/code> è spesso più chiaro.<\/span> <span class=\"sg\" data-s=\"2\">È simile all'istruzione <code>switch<\/code> presente in altri linguaggi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>given<\/code> prende un valore e lo rende il <em>topic<\/em> — la variabile speciale <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni blocco <code>when<\/code> viene poi confrontato con quel topic, e il primo che corrisponde viene eseguito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A differenza dello <code>switch<\/code> in alcuni altri linguaggi, non c'è fall-through: non appena un <code>when<\/code> corrisponde, il suo blocco viene eseguito e il blocco <code>given<\/code> è terminato.<\/span> <span class=\"sg\" data-s=\"1\">I blocchi <code>when<\/code> rimanenti non vengono testati.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>default<\/code> viene eseguito quando nessuno dei blocchi <code>when<\/code> ha trovato corrispondenza.<\/span> <span class=\"sg\" data-s=\"1\">Svolge lo stesso ruolo del ramo <code>else<\/code> di un'istruzione <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>$n<\/code> non è né <code>1<\/code> né <code>2<\/code>, il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"lv":{"t":"<code>given<\/code> un <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad programmai jāizvēlas starp vairākām alternatīvām, <code>if<\/code> un <code>elsif<\/code> pārbaužu ķēde var kļūt gara un atkārtojoša.<\/span> <span class=\"sg\" data-s=\"1\">Šādā situācijā <code>given<\/code>/<code>when<\/code> konstrukcija bieži vien ir skaidrāka.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir līdzīga <code>switch<\/code> priekšrakstam, kas sastopams citās programmēšanas valodās.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>given<\/code> bloks pieņem vērtību un padara to par <em>tēmu<\/em> — īpašo mainīgo <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katrs <code>when<\/code> bloks tiek salīdzināts ar šo tēmu, un pirmais, kas atbilst, tiek izpildīts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atšķirībā no <code>switch<\/code> dažās citās valodās, šeit nav \"caurkritšanas\" (fall-through): tiklīdz kāds <code>when<\/code> atbilst, tā bloks tiek izpildīts un <code>given<\/code> bloks ir pabeigts.<\/span> <span class=\"sg\" data-s=\"1\">Pārējie <code>when<\/code> bloki netiek pārbaudīti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code> bloks<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>default<\/code> bloks tiek izpildīts, ja neviens no <code>when<\/code> blokiem neatbilda.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir tāda pati loma kā <code>else<\/code> atzaram <code>if<\/code> priekšrakstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>$n<\/code> nav ne <code>1<\/code>, ne <code>2<\/code>, programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"ru":{"t":"<code>given<\/code> и <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда программа должна выбрать один из нескольких вариантов, цепочка проверок <code>if<\/code> и <code>elsif<\/code> может стать длинной и однообразной.<\/span> <span class=\"sg\" data-s=\"1\">В такой ситуации конструкция <code>given<\/code>/<code>when<\/code> часто оказывается нагляднее.<\/span> <span class=\"sg\" data-s=\"2\">Она похожа на оператор <code>switch<\/code> из других языков.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>given<\/code> принимает значение и делает его <em>топиком<\/em> — специальной переменной <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каждый блок <code>when<\/code> затем сравнивается с этим топиком, и первый совпавший выполняется:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В отличие от <code>switch<\/code> в некоторых других языках, здесь нет «проваливания» (fall-through): как только <code>when<\/code> совпадает, его блок выполняется, и блок <code>given<\/code> завершается.<\/span> <span class=\"sg\" data-s=\"1\">Остальные блоки <code>when<\/code> не проверяются.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> выполняется, когда ни один блок <code>when<\/code> не совпал.<\/span> <span class=\"sg\" data-s=\"1\">Он играет ту же роль, что ветка <code>else<\/code> в операторе <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>$n<\/code> не равно ни <code>1<\/code>, ни <code>2<\/code>, программа печатает:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"uk":{"t":"<code>given<\/code> та <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли програмі треба обрати між кількома варіантами, ланцюжок перевірок <code>if<\/code> та <code>elsif<\/code> може стати довгим і одноманітним.<\/span> <span class=\"sg\" data-s=\"1\">У такій ситуації конструкція <code>given<\/code>/<code>when<\/code> часто зрозуміліша.<\/span> <span class=\"sg\" data-s=\"2\">Вона схожа на оператор <code>switch<\/code>, що є в інших мовах.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>given<\/code> бере значення й робить його <em>топіком<\/em> — спеціальною змінною <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Далі кожен блок <code>when<\/code> порівнюється з цим топіком, і виконується перший, що збігся:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На відміну від <code>switch<\/code> у деяких інших мовах, тут немає провалювання: щойно якийсь <code>when<\/code> збігся, виконується його блок, і блок <code>given<\/code> завершується.<\/span> <span class=\"sg\" data-s=\"1\">Решта блоків <code>when<\/code> не перевіряється.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> виконується, коли не збігся жоден із блоків <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він відіграє ту саму роль, що й гілка <code>else<\/code> в операторі <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>$n<\/code> не дорівнює ані <code>1<\/code>, ані <code>2<\/code>, програма виводить:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"bg":{"t":"<code>given<\/code> и <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато програмата трябва да избира между няколко алтернативи, верига от <code>if<\/code> и <code>elsif<\/code> проверки може да стане дълга и повтаряща се.<\/span> <span class=\"sg\" data-s=\"1\">В такива случаи конструкцията <code>given<\/code>/<code>when<\/code> често е по-ясна.<\/span> <span class=\"sg\" data-s=\"2\">Тя е подобна на оператора <code>switch<\/code>, който се среща в други езици.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>given<\/code> приема стойност и я прави <em>тема<\/em> — специалната променлива <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всеки блок <code>when<\/code> след това се сравнява с тази тема и първият, който съвпадне, се изпълнява:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За разлика от <code>switch<\/code> в някои други езици, тук няма преминаване надолу (fall-through): щом даден <code>when<\/code> съвпадне, неговият блок се изпълнява и блокът <code>given<\/code> приключва.<\/span> <span class=\"sg\" data-s=\"1\">Останалите <code>when<\/code> блокове не се проверяват.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> се изпълнява, когато нито един от блоковете <code>when<\/code> не е съвпаднал.<\/span> <span class=\"sg\" data-s=\"1\">Той играе същата роля като клона <code>else<\/code> на оператора <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като <code>$n<\/code> не е нито <code>1<\/code>, нито <code>2<\/code>, програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"la":{"t":"<code>given<\/code> et <code>when<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum programma debet eligere inter plures optiones, catena <code>if<\/code> et <code>elsif<\/code> verificationum potest longa et repetitiva fieri.<\/span> <span class=\"sg\" data-s=\"1\">In tali casu, constructio <code>given<\/code>/<code>when<\/code> saepe clarior est.<\/span> <span class=\"sg\" data-s=\"2\">Similis est sententiae <code>switch<\/code> quae in aliis linguis invenitur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Copia <code>given<\/code> valorem accipit et eum <em>topicum<\/em> facit — specialem variabilem <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque copia <code>when<\/code> deinde cum illo topico comparatur, et prima quae congruit currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dissimiliter a <code>switch<\/code> in quibusdam aliis linguis, nullus est casus transitus: simulac <code>when<\/code> congruit, eius copia currit et copia <code>given<\/code> finita est.<\/span> <span class=\"sg\" data-s=\"1\">Reliquae copiae <code>when<\/code> non probantur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code> currit cum nulla ex copiis <code>when<\/code> congruebat.<\/span> <span class=\"sg\" data-s=\"1\">Eundem munus agit ac ramus <code>else<\/code> sententiae <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia <code>$n<\/code> neque <code>1<\/code> neque <code>2<\/code> est, programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]}}}</script>
