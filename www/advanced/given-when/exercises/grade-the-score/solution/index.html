<script type="application/json" id="page-data">{"u":"advanced/given-when/exercises/grade-the-score/solution","n":600,"k":"solution","pv":"advanced/given-when/exercises/grade-the-score","nx":"advanced/given-when/exercises/sign-of-a-number","tr":["advanced","advanced/given-when"],"L":{"en":{"t":"The solution of ’Life stage from age‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This solution mixes two kinds of <code>when<\/code>. The first is a <em>condition<\/em>, <code>$_ &lt; 0<\/code> (where <code>$_<\/code> is the topic set by <code>given<\/code>), which weeds out invalid ages; the rest are <em>ranges<\/em> that group the valid ages into stages.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Order matters. The negative-age guard comes first, so it runs before any range is tried. The value <code>30<\/code> falls into <code>20..64<\/code>, so the program prints <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>default<\/code> block covers every age of 65 and above, which is not captured by any of the listed ranges.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You could turn this around and let <code>default<\/code> catch the <em>invalid<\/em> input instead.<\/span> <span class=\"sg\" data-s=\"1\">List every recognised stage — including <code>senior<\/code> as the condition <code>$_ &gt;= 65<\/code> — and treat anything left over (such as a negative age) as invalid:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here <code>default<\/code> is a genuine “none of the above” branch.<\/span> <span class=\"sg\" data-s=\"1\">Which version reads better is a matter of taste: put the guard first when the invalid case is the exception, or make it the fallback when the valid stages are all clearly enumerated.<\/span><\/p>"]]},"de":{"t":"Solution: Lebensphase nach Alter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Diese Lösung mischt zwei Arten von <code>when<\/code>. Das erste ist eine <em>Bedingung<\/em>, <code>$_ &lt; 0<\/code> (wobei <code>$_<\/code> das durch <code>given<\/code> gesetzte Thema ist), die ungültige Alter aussortiert; die übrigen sind <em>Bereiche<\/em>, die die gültigen Alter in Lebensphasen einteilen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Reihenfolge ist wichtig. Die Prüfung auf negatives Alter steht zuerst, damit sie vor jeder Bereichsprüfung ausgeführt wird. Der Wert <code>30<\/code> liegt im Bereich <code>20..64<\/code>, daher gibt das Programm <code>adult<\/code> aus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>default<\/code>-Block deckt jedes Alter ab 65 ab, das von keinem der aufgelisteten Bereiche erfasst wird.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du könntest das auch umdrehen und <code>default<\/code> den <em>ungültigen<\/em> Input abfangen lassen.<\/span> <span class=\"sg\" data-s=\"1\">Liste jede anerkannte Lebensphase auf — einschließlich <code>senior<\/code> als Bedingung <code>$_ &gt;= 65<\/code> — und behandle alles Übrige (wie ein negatives Alter) als ungültig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>default<\/code> ein echtes \"Nichts davon zutreffend\"-Zweig.<\/span> <span class=\"sg\" data-s=\"1\">Welche Version besser lesbar ist, ist Geschmackssache: Stelle die Prüfung voran, wenn der ungültige Fall die Ausnahme ist, oder mache ihn zum Fallback, wenn die gültigen Phasen alle klar aufgelistet sind.<\/span><\/p>"]]},"nl":{"t":"Solution: Levensfase op basis van leeftijd","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Deze oplossing combineert twee soorten <code>when<\/code>. De eerste is een <em>voorwaarde<\/em>, <code>$_ &lt; 0<\/code> (waarbij <code>$_<\/code> het topic is dat door <code>given<\/code> is ingesteld), die ongeldige leeftijden uitfiltert; de rest zijn <em>bereiken<\/em> die de geldige leeftijden in fasen groeperen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Volgorde is belangrijk. De controle op negatieve leeftijd komt eerst, zodat deze wordt uitgevoerd voordat een bereik wordt getest. De waarde <code>30<\/code> valt in <code>20..64<\/code>, dus het programma drukt <code>adult<\/code> af.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het <code>default<\/code>-blok dekt elke leeftijd van 65 en ouder, die niet door een van de genoemde bereiken wordt opgevangen.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je zou dit ook kunnen omdraaien en <code>default<\/code> de <em>ongeldige<\/em> invoer laten opvangen.<\/span> <span class=\"sg\" data-s=\"1\">Noem elke erkende fase — inclusief <code>senior<\/code> als de voorwaarde <code>$_ &gt;= 65<\/code> — en behandel al het overige (zoals een negatieve leeftijd) als ongeldig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>default<\/code> een echte \"geen van bovenstaande\"-tak.<\/span> <span class=\"sg\" data-s=\"1\">Welke versie beter leesbaar is, is een kwestie van smaak: zet de controle vooraan wanneer het ongeldige geval de uitzondering is, of maak het de terugvaloptie wanneer de geldige fasen allemaal duidelijk zijn opgesomd.<\/span><\/p>"]]},"es":{"t":"Solution: Etapa de vida según la edad","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esta solución mezcla dos tipos de <code>when<\/code>. El primero es una <em>condición<\/em>, <code>$_ &lt; 0<\/code> (donde <code>$_<\/code> es el topico establecido por <code>given<\/code>), que descarta las edades invalidas; el resto son <em>rangos<\/em> que agrupan las edades válidas en etapas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El orden importa. La comprobación de edad negativa va primero, así que se ejecuta antes de que se pruebe cualquier rango. El valor <code>30<\/code> cae en <code>20..64<\/code>, por lo que el programa imprime <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code> cubre toda edad de 65 en adelante, que no esta capturada por ninguno de los rangos listados.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Podrías darle la vuelta y dejar que <code>default<\/code> capture la entrada <em>invalida<\/em> en su lugar.<\/span> <span class=\"sg\" data-s=\"1\">Lista cada etapa reconocida — incluyendo <code>senior<\/code> como la condición <code>$_ &gt;= 65<\/code> — y trata cualquier sobrante (como una edad negativa) como inválido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>default<\/code> es una rama genuina de \"ninguno de los anteriores\".<\/span> <span class=\"sg\" data-s=\"1\">Cual versión se lee mejor es cuestión de gusto: pon la comprobación primero cuando el caso inválido es la excepción, o hazlo el respaldo cuando las etapas válidas están todas claramente enumeradas.<\/span><\/p>"]]},"it":{"t":"Solution: Fase della vita dall'età","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questa soluzione mescola due tipi di <code>when<\/code>. Il primo è una <em>condizione<\/em>, <code>$_ &lt; 0<\/code> (dove <code>$_<\/code> è il topic impostato da <code>given<\/code>), che scarta le età non valide; i restanti sono <em>intervalli<\/em> che raggruppano le età valide nelle fasi della vita.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'ordine è importante. Il controllo per l'età negativa viene per primo, quindi viene eseguito prima di provare qualsiasi intervallo. Il valore <code>30<\/code> rientra in <code>20..64<\/code>, quindi il programma stampa <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code> copre tutte le età da 65 in su, che non sono catturate da nessuno degli intervalli elencati.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si potrebbe invertire l'approccio e lasciare che <code>default<\/code> catturi l'input <em>non valido<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Si elencano tutte le fasi riconosciute — incluso <code>senior<\/code> come condizione <code>$_ &gt;= 65<\/code> — e si tratta tutto il resto (come un'età negativa) come non valido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>default<\/code> è un vero e proprio ramo \"nessuna delle precedenti\".<\/span> <span class=\"sg\" data-s=\"1\">Quale versione sia più leggibile è una questione di gusto: mettere il controllo per primo quando il caso non valido è l'eccezione, oppure renderlo il fallback quando le fasi valide sono tutte chiaramente enumerate.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Dzīves posms pēc vecuma","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējamais uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šis risinājums apvieno divus <code>when<\/code> veidus. Pirmais ir <em>nosacījums<\/em>, <code>$_ &lt; 0<\/code> (kur <code>$_<\/code> ir tēma, ko nosaka <code>given<\/code>), kas izfiltrē nederīgos vecumus; pārējie ir <em>diapazoni<\/em>, kas grupē derīgos vecumus pa posmiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Secība ir svarīga. Negatīvā vecuma aizsargs ir pirmais, tāpēc tas tiek izpildīts pirms jebkura diapazona pārbaudes. Vērtība <code>30<\/code> ietilpst <code>20..64<\/code>, tāpēc programma izdrukā <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>default<\/code> bloks aptver visus vecumus no 65 un vairāk, kurus neaptver neviens no norādītajiem diapazoniem.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat to apgriezt otrādi un ļaut <code>default<\/code> uztvert <em>nederīgo<\/em> ievadi.<\/span> <span class=\"sg\" data-s=\"1\">Uzskaitiet visus atpazītos posmus — ieskaitot <code>senior<\/code> kā nosacījumu <code>$_ &gt;= 65<\/code> — un uzskatiet visu atlikušo (piemēram, negatīvu vecumu) par nederīgu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>default<\/code> ir patiess \"nekas no iepriekšminētā\" atzars.<\/span> <span class=\"sg\" data-s=\"1\">Kura versija ir lasāmāka, ir gaumes jautājums: novietojiet aizsargu pirmajā vietā, ja nederīgais gadījums ir izņēmums, vai padariet to par rezerves variantu, ja derīgie posmi ir skaidri uzskaitīti.<\/span><\/p>"]]},"ru":{"t":"Решение: Жизненный этап по возрасту","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Это решение сочетает два вида <code>when<\/code>. Первый — это <em>условие<\/em>, <code>$_ &lt; 0<\/code> (где <code>$_<\/code> — топик, установленный <code>given<\/code>), которое отсеивает недопустимый возраст; остальные — <em>диапазоны<\/em>, которые группируют допустимые значения по этапам.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок важен. Проверка отрицательного возраста идёт первой, поэтому она выполняется до проверки любого диапазона. Значение <code>30<\/code> попадает в <code>20..64<\/code>, поэтому программа печатает <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> покрывает все возрасты от 65 и выше, которые не попали ни в один из перечисленных диапазонов.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно сделать и наоборот — пусть <code>default<\/code> ловит <em>недопустимый<\/em> ввод.<\/span> <span class=\"sg\" data-s=\"1\">Перечислите все известные этапы — включая <code>senior<\/code> как условие <code>$_ &gt;= 65<\/code> — и пусть всё остальное (например, отрицательный возраст) считается невалидным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>default<\/code> — настоящая ветка «ничего из вышеперечисленного».<\/span> <span class=\"sg\" data-s=\"1\">Какой вариант читается лучше — дело вкуса: поставьте проверку первой, когда недопустимый случай является исключением, или сделайте её запасным вариантом, когда все допустимые этапы чётко перечислены.<\/span><\/p>"]]},"uk":{"t":"Розв'язання: Життєвий етап за віком","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це розв'язання поєднує два різновиди <code>when<\/code>. Перший — це <em>умова<\/em>, <code>$_ &lt; 0<\/code> (де <code>$_<\/code> є топіком, встановленим <code>given<\/code>), яка відсіює недійсний вік; решта — <em>діапазони<\/em>, що групують дійсний вік за етапами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок має значення. Перевірка на від'ємний вік іде першою, тож вона виконується до того, як буде випробувано будь-який діапазон. Значення <code>30<\/code> потрапляє в <code>20..64<\/code>, тож програма виводить <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> охоплює будь-який вік від 65 і вище, який не захоплено жодним із перелічених діапазонів.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можна перевернути це й дозволити <code>default<\/code> ловити натомість <em>недійсний<\/em> ввід.<\/span> <span class=\"sg\" data-s=\"1\">Перелічіть кожен розпізнаваний етап — включно з <code>senior<\/code> як умовою <code>$_ &gt;= 65<\/code> — і вважайте все, що лишилося (як-от від'ємний вік), недійсним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>default<\/code> є справжньою гілкою «жодне з переліченого».<\/span> <span class=\"sg\" data-s=\"1\">Який варіант читається краще — справа смаку: ставте перевірку першою, коли недійсний випадок є винятком, або зробіть її запасним варіантом, коли всі дійсні етапи чітко перелічено.<\/span><\/p>"]]},"bg":{"t":"Solution: Етап от живота по възраст","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това решение смесва два вида <code>when<\/code>. Първият е <em>условие<\/em>, <code>$_ &lt; 0<\/code> (където <code>$_<\/code> е темата, зададена от <code>given<\/code>), което отсява невалидните възрасти; останалите са <em>диапазони<\/em>, които групират валидните възрасти в етапи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът има значение. Проверката за отрицателна възраст е на първо място, за да се изпълни преди каквато и да е проверка за диапазон. Стойността <code>30<\/code> попада в <code>20..64<\/code>, така че програмата отпечатва <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> покрива всяка възраст от 65 и нагоре, която не е обхваната от нито един от изброените диапазони.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да обърнете логиката и да оставите <code>default<\/code> да улавя <em>невалидния<\/em> вход.<\/span> <span class=\"sg\" data-s=\"1\">Изброете всеки разпознат етап — включително <code>senior<\/code> като условие <code>$_ &gt;= 65<\/code> — и третирате всичко останало (като отрицателна възраст) за невалидно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>default<\/code> е истински клон „нищо от горното\".<\/span> <span class=\"sg\" data-s=\"1\">Кой вариант се чете по-добре е въпрос на вкус: поставете проверката първа, когато невалидният случай е изключение, или я направете резервен вариант, когато валидните етапи са ясно изброени.<\/span><\/p>"]]},"eo":{"t":"Solvo: Vivperiodo laŭ aĝo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tiu solvo miksas du specojn de <code>when<\/code>. La unua estas <em>kondiĉo<\/em>, <code>$_ &lt; 0<\/code> (kie <code>$_<\/code> estas la temo starigita de <code>given<\/code>), kiu forigas nevalidajn aĝojn; la ceteraj estas <em>intervaloj<\/em>, kiuj grupigas la validajn aĝojn en periodojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ordo gravas. La gardo kontraŭ negativa aĝo venas unue, do ĝi ruliĝas antaŭ ol iu intervalo estas provata. La valoro <code>30<\/code> falas en <code>20..64<\/code>, do la programo presas <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La bloko <code>default<\/code> kovras ĉiun aĝon de 65 kaj pli, kiu ne estas kaptita de iu el la listigitaj intervaloj.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povus inversigi tion kaj lasi <code>default<\/code> kapti la <em>nevalidan<\/em> enigon anstataŭe.<\/span> <span class=\"sg\" data-s=\"1\">Listigu ĉiun rekonatan periodon — inkluzive de <code>senior<\/code> kiel la kondiĉon <code>$_ &gt;= 65<\/code> — kaj traktu ĉion restantan (ekzemple negativan aĝon) kiel nevalidan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>default<\/code> estas vera branĉo «neniu el la supraj».<\/span> <span class=\"sg\" data-s=\"1\">Kiu versio legiĝas pli bone estas afero de gusto: metu la gardon unue, kiam la nevalida kazo estas la escepto, aŭ faru ĝin la retiriĝo, kiam la validaj periodoj estas ĉiuj klare enumeritaj.<\/span><\/p>"]]},"la":{"t":"Solutio: Stadium vitae ex aetate","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haec solutio duo genera <code>when<\/code> miscet. Primum est <em>condicio<\/em>, <code>$_ &lt; 0<\/code> (ubi <code>$_<\/code> est topicum a <code>given<\/code> positum), quae aetates invalidas eliminat; reliquae sunt <em>intervalla<\/em> quae aetates validas in stadia dividunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo refert. Custos aetatis negativae primus venit, ergo currit antequam ullum intervallum probatur. Valor <code>30<\/code> in <code>20..64<\/code> cadit, ergo programma imprimit <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code> omnem aetatem 65 et supra tegit, quae a nullo intervallorum enumeratorum capitur.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc invertere possis et <code>default<\/code> ad captandum inputum <em>invalidum<\/em> uti.<\/span> <span class=\"sg\" data-s=\"1\">Enumera omne stadium agnitum — includens <code>senior<\/code> ut condicionem <code>$_ &gt;= 65<\/code> — et tracta quidquid relictum est (sicut aetatem negativam) ut invalidum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <code>default<\/code> vere est ramus \"nihil ex supra dictis\".<\/span> <span class=\"sg\" data-s=\"1\">Quae versio melius legitur, res gustus est: pone custodem primum cum casus invalidus exceptio est, vel fac eum subsidium cum stadia valida omnia clare enumerata sunt.<\/span><\/p>"]]}}}</script>
