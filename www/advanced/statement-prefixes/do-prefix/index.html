<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/do-prefix","n":615,"k":"topic","pv":"advanced/statement-prefixes","nx":"advanced/statement-prefixes/do-prefix/quiz","tr":["advanced","advanced/statement-prefixes"],"L":{"en":{"t":"do and the value of a block","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A block on its own is a statement, not an expression, so you cannot normally assign it to a variable.<\/span> <span class=\"sg\" data-s=\"1\">The <code>do<\/code> prefix turns a block into an expression whose value is the value of its <strong>last<\/strong> statement:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inside the block you can declare variables, run several statements, and compute a result; <code>do<\/code> hands back whatever the block evaluates to.<\/span> <span class=\"sg\" data-s=\"1\">This is handy when producing a value needs more than a single expression.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> also works in front of the control-flow statements, letting them return a value too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here <code>do given<\/code> turns the whole <code>given<\/code>/<code>when<\/code> into an expression that yields <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The same works with <code>do if<\/code> and <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In short, <code>do<\/code> is how you use a block, or a control structure, in a place that expects a value.<\/span><\/p>"]]},"de":{"t":"do und der Wert eines Blocks","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Block allein ist eine Anweisung, kein Ausdruck, daher kannst du ihn normalerweise nicht einer Variablen zuweisen.<\/span> <span class=\"sg\" data-s=\"1\">Das <code>do<\/code>-Präfix verwandelt einen Block in einen Ausdruck, dessen Wert der Wert der <strong>letzten<\/strong> Anweisung ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Innerhalb des Blocks kannst du Variablen deklarieren, mehrere Anweisungen ausführen und ein Ergebnis berechnen; <code>do<\/code> gibt zurück, was auch immer der Block ergibt.<\/span> <span class=\"sg\" data-s=\"1\">Das ist praktisch, wenn die Erzeugung eines Werts mehr als einen einzigen Ausdruck erfordert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> funktioniert auch vor Kontrollfluss-Anweisungen und lässt diese ebenfalls einen Wert zurückgeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier verwandelt <code>do given<\/code> das gesamte <code>given<\/code>/<code>when<\/code> in einen Ausdruck, der <code>positive<\/code> liefert.<\/span> <span class=\"sg\" data-s=\"1\">Das funktioniert genauso mit <code>do if<\/code> und <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kurz gesagt: <code>do<\/code> ist die Methode, einen Block oder eine Kontrollstruktur an einer Stelle zu verwenden, die einen Wert erwartet.<\/span><\/p>"]]},"nl":{"t":"do en de waarde van een blok","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een blok op zichzelf is een statement, geen expressie, dus je kunt het normaal gesproken niet aan een variabele toewijzen.<\/span> <span class=\"sg\" data-s=\"1\">Het prefix <code>do<\/code> maakt van een blok een expressie waarvan de waarde de waarde van het <strong>laatste<\/strong> statement is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binnen het blok kun je variabelen declareren, meerdere statements uitvoeren en een resultaat berekenen; <code>do<\/code> geeft terug wat het blok oplevert.<\/span> <span class=\"sg\" data-s=\"1\">Dit is handig wanneer het produceren van een waarde meer vereist dan een enkele expressie.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> werkt ook voor control-flow-statements, waardoor ook die een waarde kunnen teruggeven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier maakt <code>do given<\/code> van het hele <code>given<\/code>/<code>when<\/code>-construct een expressie die <code>positive<\/code> oplevert.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde werkt met <code>do if<\/code> en <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kortom, <code>do<\/code> is de manier om een blok of een besturingsstructuur te gebruiken op een plek waar een waarde verwacht wordt.<\/span><\/p>"]]},"es":{"t":"do y el valor de un bloque","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un bloque por sí solo es una sentencia, no una expresión, por lo que normalmente no puedes asignarlo a una variable.<\/span> <span class=\"sg\" data-s=\"1\">El prefijo <code>do<\/code> convierte un bloque en una expresión cuyo valor es el valor de su <strong>última<\/strong> sentencia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro del bloque puedes declarar variables, ejecutar varias sentencias y calcular un resultado; <code>do<\/code> devuelve lo que el bloque evalúe.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil cuando producir un valor necesita más de una sola expresión.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> también funciona delante de las sentencias de flujo de control, permitiéndoles devolver un valor también:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>do given<\/code> convierte todo el <code>given<\/code>/<code>when<\/code> en una expresión que produce <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo mismo funciona con <code>do if<\/code> y <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En resumen, <code>do<\/code> es la forma de usar un bloque, o una estructura de control, en un lugar que espera un valor.<\/span><\/p>"]]},"it":{"t":"do e il valore di un blocco","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco da solo è un'istruzione, non un'espressione, quindi normalmente non è possibile assegnarlo a una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Il prefisso <code>do<\/code> trasforma un blocco in un'espressione il cui valore è il valore della sua <strong>ultima<\/strong> istruzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">All'interno del blocco potete dichiarare variabili, eseguire diverse istruzioni e calcolare un risultato; <code>do<\/code> restituisce qualunque cosa il blocco produca.<\/span> <span class=\"sg\" data-s=\"1\">Questo è utile quando per produrre un valore servono più espressioni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> funziona anche davanti alle istruzioni di controllo del flusso, permettendo anche a queste di restituire un valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui <code>do given<\/code> trasforma l'intero <code>given<\/code>/<code>when<\/code> in un'espressione che produce <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso funziona con <code>do if<\/code> e <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In breve, <code>do<\/code> è il modo per usare un blocco, o una struttura di controllo, in un punto dove è richiesto un valore.<\/span><\/p>"]]},"lv":{"t":"do un bloka vērtība","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloks pats par sevi ir teikums, nevis izteiksme, tāpēc parasti to nevar piešķirt mainīgajam.<\/span> <span class=\"sg\" data-s=\"1\">Prefikss <code>do<\/code> pārvērš bloku par izteiksmi, kuras vērtība ir tā <strong>pēdējā<\/strong> teikuma vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloka iekšienē varat deklarēt mainīgos, izpildīt vairākus teikumus un aprēķināt rezultātu; <code>do<\/code> atdod to, uz ko bloks izrēķinās.<\/span> <span class=\"sg\" data-s=\"1\">Tas noder, kad vērtības radīšanai vajag vairāk nekā vienu izteiksmi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> darbojas arī vadības plūsmas teikumu priekšā, ļaujot arī tiem atgriezt vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>do given<\/code> pārvērš visu <code>given<\/code>/<code>when<\/code> par izteiksmi, kas dod <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats darbojas ar <code>do if<\/code> un <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Īsi sakot, <code>do<\/code> ir veids, kā izmantot bloku vai vadības struktūru vietā, kur gaidīta vērtība.<\/span><\/p>"]]},"ru":{"t":"do и значение блока","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок сам по себе является оператором, а не выражением, поэтому его нельзя просто присвоить переменной.<\/span> <span class=\"sg\" data-s=\"1\">Префикс <code>do<\/code> превращает блок в выражение, значением которого является значение <strong>последнего<\/strong> оператора блока:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутри блока можно объявлять переменные, выполнять несколько операторов и вычислять результат; <code>do<\/code> возвращает то, во что блок вычисляется.<\/span> <span class=\"sg\" data-s=\"1\">Это удобно, когда для получения значения нужно больше, чем одно выражение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> также работает перед управляющими конструкциями, позволяя и им возвращать значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>do given<\/code> превращает всю конструкцию <code>given<\/code>/<code>when<\/code> в выражение, которое возвращает <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То же самое работает с <code>do if<\/code> и <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Одним словом, <code>do<\/code> — это способ использовать блок или управляющую конструкцию там, где ожидается значение.<\/span><\/p>"]]},"uk":{"t":"do та значення блоку","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок сам по собі є оператором, а не виразом, тож зазвичай його не можна присвоїти змінній.<\/span> <span class=\"sg\" data-s=\"1\">Префікс <code>do<\/code> перетворює блок на вираз, значенням якого є значення його <strong>останнього<\/strong> оператора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усередині блоку ви можете оголошувати змінні, виконувати кілька операторів і обчислювати результат; <code>do<\/code> повертає те, у що блок обчислюється.<\/span> <span class=\"sg\" data-s=\"1\">Це стає в пригоді, коли для отримання значення потрібен не один вираз.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> працює і перед операторами керування потоком виконання, дозволяючи їм теж повертати значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>do given<\/code> перетворює весь <code>given<\/code>/<code>when<\/code> на вираз, що дає <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так само працюють <code>do if<\/code> та <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коротко кажучи, <code>do<\/code> — це спосіб використати блок або керівну конструкцію там, де очікується значення.<\/span><\/p>"]]},"bg":{"t":"do и стойността на блок","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Самостоятелният блок е оператор, а не израз, така че не можете просто да го присвоите на променлива.<\/span> <span class=\"sg\" data-s=\"1\">Префиксът <code>do<\/code> превръща блок в израз, чиято стойност е стойността на <strong>последния<\/strong> му оператор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътре в блока можете да декларирате променливи, да изпълнявате няколко оператора и да изчислявате резултат; <code>do<\/code> връща каквото блокът даде като стойност.<\/span> <span class=\"sg\" data-s=\"1\">Това е удобно, когато за получаването на стойност е нужно повече от един израз.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> работи и пред оператори за управление на потока, като им позволява също да връщат стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>do given<\/code> превръща цялата конструкция <code>given<\/code>/<code>when<\/code> в израз, който дава <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Същото работи с <code>do if<\/code> и <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Накратко, <code>do<\/code> е начинът да използвате блок или управляваща конструкция на място, което очаква стойност.<\/span><\/p>"]]},"eo":{"t":"do kaj la valoro de bloko","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloko sole estas deklaro, ne esprimo, do vi normale ne povas atribui ĝin al variablo.<\/span> <span class=\"sg\" data-s=\"1\">La prefikso <code>do<\/code> transformas blokon en esprimon, kies valoro estas la valoro de ĝia <strong>lasta<\/strong> deklaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ene de la bloko vi povas deklari variablojn, plenumi plurajn deklarojn kaj komputi rezulton; <code>do<\/code> redonas tion, kion la bloko taksas.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas oportuna kiam por produkti valoron necesas pli ol unu sola esprimo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> ankaŭ funkcias antaŭ kontrolfluaj deklaroj, ebligante al ili ankaŭ redoni valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>do given<\/code> transformas la tutan <code>given<\/code>/<code>when<\/code> en esprimon kiu donas <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Same funkcias <code>do if<\/code> kaj <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Resume, <code>do<\/code> estas la maniero uzi blokon, aŭ kontrolstrukturon, en loko kiu atendas valoron.<\/span><\/p>"]]},"la":{"t":"do et valor bloci","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Copia per se sententia est, non expressio, ergo eam normaliter variabili assignare non potes.<\/span> <span class=\"sg\" data-s=\"1\">Praefixum <code>do<\/code> copiam in expressionem convertit cuius valor est valor <strong>ultimae<\/strong> sententiae eius:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intra copiam variabiles declarare potes, plures sententias currere, et resultatum computare; <code>do<\/code> reddit quidquid copia evaluat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc commodum est cum valor producendus plus quam singulam expressionem requirit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> etiam ante sententias fluxus controllandi operatur, sinens eas quoque valorem reddere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic <code>do given<\/code> totum <code>given<\/code>/<code>when<\/code> in expressionem convertit quae <code>positive<\/code> producit.<\/span> <span class=\"sg\" data-s=\"1\">Idem operatur cum <code>do if<\/code> et <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Breviter, <code>do<\/code> est quomodo copiam, vel structuram controllandi, in loco qui valorem expectat uteris.<\/span><\/p>"]]}}}</script>
