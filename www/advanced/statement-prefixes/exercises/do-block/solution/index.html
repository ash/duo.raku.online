<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/exercises/do-block/solution","n":622,"k":"solution","pv":"advanced/statement-prefixes/exercises/do-block","nx":"advanced/statement-prefixes/exercises/force-eager","tr":["advanced","advanced/statement-prefixes"],"L":{"en":{"t":"The solution of ’The value of a do block‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A bare <code>if<\/code> is a statement and has no usable value. The <code>do<\/code> prefix turns the whole <code>if<\/code>/<code>else<\/code> into an expression.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Since <code>7 &gt; 5<\/code> is true, the expression yields <code>'big'<\/code>, which is assigned to <code>$label<\/code>. The same trick works with <code>do given<\/code> and <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>{ }<\/code> braces are not optional. Raku's <code>if<\/code> always takes a block, so you cannot shorten the branches to <code>if 7 &gt; 5 'big' else 'small'<\/code> — that fails to compile with <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Der Wert eines do-Blocks","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein einfaches <code>if<\/code> ist eine Anweisung und hat keinen verwendbaren Wert. Das <code>do<\/code>-Präfix verwandelt das gesamte <code>if<\/code>/<code>else<\/code> in einen Ausdruck.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Da <code>7 &gt; 5<\/code> wahr ist, ergibt der Ausdruck <code>'big'<\/code>, was <code>$label<\/code> zugewiesen wird. Der gleiche Trick funktioniert mit <code>do given<\/code> und <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die <code>{ }<\/code>-Klammern sind nicht optional. Rakus <code>if<\/code> erwartet immer einen Block, daher kannst du die Zweige nicht zu <code>if 7 &gt; 5 'big' else 'small'<\/code> verkürzen — das lässt sich nicht kompilieren und gibt den Fehler <em>Missing block<\/em> aus.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: De waarde van een do-blok","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de>7 &gt; 5<\/code> è vero, l'espressione produce <code>'big'<\/code>, che viene assegnato a <code>$label<\/code>. Lo stesso trucco funziona con <code>do given<\/code> e <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Le parentesi graffe <code>{ }<\/code> non sono opzionali. L'<code>if<\/code> di Raku richiede sempre un blocco, quindi non potete abbreviare i rami in <code>if 7 &gt; 5 'big' else 'small'<\/code> — questo non compila e dà l'errore <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: do bloka vērtība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kails <code>if<\/code> ir teikums, un tam nav izmantojamas vērtības. Prefikss <code>do<\/code> pārvērš visu <code>if<\/code>/<code>else<\/code> par izteiksmi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tā kā <code>7 &gt; 5<\/code> ir patiess, izteiksme dod <code>'big'<\/code>, kas tiek piešķirts <code>$label<\/code>. Tas pats paņēmiens darbojas ar <code>do given<\/code> un <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Figūriekavas <code>{ }<\/code> nav neobligātas. Raku <code>if<\/code> vienmēr ņem bloku, tāpēc zarus nevar saīsināt līdz <code>if 7 &g ><li><span class=\"sg\" data-s=\"0\">Ĉar <code>7 &gt; 5<\/code> estas vera, la esprimo donas <code>'big'<\/code>, kio estas atribuita al <code>$label<\/code>. La sama truko funkcias kun <code>do given<\/code> kaj <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>{ }<\/code> krampoj ne estas nedevigaj. La <code>if<\/code> de Raku ĉiam prenas blokon, do vi ne povas mallongigi la branĉojn al <code>if 7 &gt; 5 'big' else 'small'<\/code> -- tio malsukcesas kompili kun <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Valor bloci do","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nudum <code>if<\/code> sententia est et valorem utilem non habet. Praefixum <code>do<\/code> totum <code>if<\/code>/<code>else<\/code> in expressionem convertit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quoniam <code>7 &gt; 5<\/code> verum est, expressio <code>'big'<\/code> producit, quod ad <code>$label<\/code> assignatur. Idem artificium cum <code>do given<\/code> et <code>do for<\/code> operatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Copiae <code>{ }<\/code> non sunt optionales. <code>if<\/code> in Raku semper copiam accipit, ergo ramos in <code>if 7 &gt; 5 'big' else 'small'<\/code> breviare non potes — hoc compilari deficit cum errore <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]}}}</script>
