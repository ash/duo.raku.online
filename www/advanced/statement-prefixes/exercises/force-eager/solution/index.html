<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/exercises/force-eager/solution","n":624,"k":"solution","pv":"advanced/statement-prefixes/exercises/force-eager","nx":"advanced/statement-prefixes/exercises/silence-warning","tr":["advanced","advanced/statement-prefixes"],"L":{"en":{"t":"The solution of ’Force eager evaluation‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A range up to <code>Inf<\/code> cannot be computed all at once, so it is lazy: <code>.is-lazy<\/code> reports <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>eager<\/code> prefix forces a list to be produced immediately, so the result is no longer lazy — <code>.is-lazy<\/code> reports <code>False<\/code>. This is the direct counterpart of marking a list <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Do not apply <code>eager<\/code> to an unbounded range: <code>eager 1 .. Inf<\/code> tries to compute every element at once, so the program simply hangs, consuming more and more memory until it is killed. <code>eager<\/code> is only safe on lists you know are finite.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The reverse also works: <code>lazy 1..3<\/code> marks even a short, finite range as lazy, so <code>.is-lazy<\/code> reports <code>True<\/code>. The prefix sets the laziness flag regardless of how small the list is — it does not have to be infinite to be lazy.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Sofortige Auswertung erzwingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein Bereich bis <code>Inf<\/code> kann nicht auf einmal berechnet werden, daher ist er lazy: <code>.is-lazy<\/code> gibt <code>True<\/code> zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>eager<\/code>-Präfix erzwingt die sofortige Erzeugung einer Liste, sodass das Ergebnis nicht mehr lazy ist — <code>.is-lazy<\/code> gibt <code>False<\/code> zurück. Dies ist das direkte Gegenstück zur Markierung einer Liste als <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wende <code>eager<\/code> nicht auf einen unbegrenzten Bereich an: <code>eager 1 .. Inf<\/code> versucht, jedes Element auf einmal zu berechnen, sodass das Programm einfach hängt und immer mehr Speicher verbraucht, bis es beendet wird. <code>eager<\/code> ist nur bei Listen sicher, von denen du weißt, dass sie endlich sind.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Gegenteil funktioniert ebenfalls: <code>lazy 1..3<\/code> markiert sogar einen kurzen, endlichen Bereich als lazy, sodass <code>.is-lazy<\/code> <code>True<\/code> zurückgibt. Das Präfix setzt das Laziness-Flag unabhängig davon, wie klein die Liste ist — sie muss nicht unendlich sein, um lazy zu sein.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Gretige evaluatie afdwingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een range tot <code>Inf<\/code> kan niet in een keer worden berekend, dus deze is lazy: <code>.is-lazy<\/code> geeft <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het prefix <code>eager<\/code> dwingt een lijst af om onmiddellijk te worden geproduceerd, dus het resultaat is niet langer lazy — <code>.is-lazy<\/code> geeft <code>False<\/code>. Dit is het directe tegenovergestelde van het markeren van een lijst als <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pas <code>eager<\/code> niet toe op een onbegrensde range: <code>eager 1 .. Inf<\/code> probeert elk element in een keer te berekenen, waardoor het programma simpelweg vastloopt en steeds meer geheugen verbruikt totdat het wordt afgebroken. <code>eager<\/code> is alleen veilig op lijsten waarvan je weet dat ze eindig zijn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het omgekeerde werkt ook: <code>lazy 1..3<\/code> markeert zelfs een korte, eindige range als lazy, dus <code>.is-lazy<\/code> geeft <code>True<\/code>. Het prefix stelt de laziness-vlag in ongeacht hoe klein de lijst is — deze hoeft niet oneindig te zijn om lazy te zijn.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Forzar evaluación ansiosa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un rango hasta <code>Inf<\/code> no puede calcularse todo de una vez, así que es perezoso: <code>.is-lazy<\/code> reporta <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El prefijo <code>eager<\/code> fuerza a que una lista se produzca inmediatamente, por lo que el resultado ya no es perezoso: <code>.is-lazy<\/code> reporta <code>False<\/code>. Este es el equivalente directo de marcar una lista como <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">No apliques <code>eager<\/code> a un rango sin límite: <code>eager 1 .. Inf<\/code> intenta calcular todos los elementos de una vez, así que el programa simplemente se cuelga, consumiendo cada vez más memoria hasta que es terminado. <code>eager<\/code> solo es seguro en listas que sabes que son finitas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Lo inverso también funciona: <code>lazy 1..3<\/code> marca incluso un rango corto y finito como perezoso, así que <code>.is-lazy<\/code> reporta <code>True<\/code>. El prefijo establece la bandera de pereza sin importar cuán pequeña sea la lista: no tiene que ser infinita para ser perezosa.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Forzare la valutazione eager","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione al compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Il codice sorgente è disponibile nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un intervallo fino a <code>Inf<\/code> non può essere calcolato tutto in una volta, quindi è lazy: <code>.is-lazy<\/code> restituisce <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il prefisso <code>eager<\/code> forza una lista a essere prodotta immediatamente, quindi il risultato non è più lazy — <code>.is-lazy<\/code> restituisce <code>False<\/code>. Questo è il corrispettivo diretto di contrassegnare una lista come <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Non applicate <code>eager<\/code> a un intervallo illimitato: <code>eager 1 .. Inf<\/code> cerca di calcolare ogni elemento in una volta sola, quindi il programma semplicemente si blocca, consumando sempre più memoria fino a essere terminato. <code>eager<\/code> è sicuro solo su liste che sapete essere finite.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anche l'inverso funziona: <code>lazy 1..3<\/code> contrassegna anche un intervallo corto e finito come lazy, quindi <code>.is-lazy<\/code> restituisce <code>True<\/code>. Il prefisso imposta il flag di pigrizia indipendentemente da quanto piccola sia la lista — non deve essere infinita per essere lazy.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Piespiest tūlītēju izvērtēšanu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Diapazonu līdz <code>Inf<\/code> nevar aprēķināt visu uzreiz, tāpēc tas ir slinks: <code>.is-lazy<\/code> ziņo <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Prefikss <code>eager<\/code> liek sarakstu izveidot nekavējoties, tāpēc rezultāts vairs nav slinks — <code>.is-lazy<\/code> ziņo <code>False<\/code>. Šis ir tiešs pretstats saraksta atzīmēšanai ar <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nepielietojiet <code>eager<\/code> neierobežotam diapazonam: <code>eager 1 .. Inf<\/code> mēģina aprēķināt katru elementu uzreiz, tāpēc programma vienkārši iekaras, patērējot arvien vairāk atmiņas, līdz tā tiek nogalināta. <code>eager<\/code> ir droši lietot tikai sarakstiem, par kuriem zināt, ka tie ir galīgi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Darbojas arī otrādi: <code>lazy 1..3<\/code> atzīmē kā slinku pat īsu, galīgu diapazonu, tāpēc <code>.is-lazy<\/code> ziņo <code>True<\/code>. Prefikss uzstāda slinkuma karodziņu neatkarīgi no tā, cik mazs saraksts ir — tam nav jābūt bezgalīgam, lai būtu slinks.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Принудительное немедленное вычисление","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Диапазон до <code>Inf<\/code> не может быть вычислен целиком, поэтому он ленивый: <code>.is-lazy<\/code> возвращает <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префикс <code>eager<\/code> заставляет список быть вычисленным немедленно, поэтому результат больше не является ленивым — <code>.is-lazy<\/code> возвращает <code>False<\/code>. Это прямая противоположность пометки списка как <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не применяйте <code>eager<\/code> к неограниченному диапазону: <code>eager 1 .. Inf<\/code> пытается вычислить каждый элемент сразу, и программа просто зависает, потребляя всё больше памяти, пока не будет завершена. <code>eager<\/code> безопасен только для списков, которые заведомо конечны.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратное тоже работает: <code>lazy 1..3<\/code> помечает даже короткий конечный диапазон как ленивый, поэтому <code>.is-lazy<\/code> возвращает <code>True<\/code>. Префикс устанавливает флаг ленивости независимо от размера списка — он не обязан быть бесконечным, чтобы быть ленивым.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Змусьте до жадібного обчислення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Діапазон до <code>Inf<\/code> неможливо обчислити весь одразу, тож він лінивий: <code>.is-lazy<\/code> повідомляє <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префікс <code>eager<\/code> змушує список бути виробленим негайно, тож результат уже не лінивий — <code>.is-lazy<\/code> повідомляє <code>False<\/code>. Це прямий відповідник позначення списку як <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не застосовуйте <code>eager<\/code> до необмеженого діапазону: <code>eager 1 .. Inf<\/code> намагається обчислити кожен елемент одразу, тож програма просто зависає, споживаючи дедалі більше пам'яті, доки її не вб'ють. <code>eager<\/code> безпечний лише для списків, про які ви точно знаєте, що вони скінченні.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зворотне теж працює: <code>lazy 1..3<\/code> позначає лінивим навіть короткий скінченний діапазон, тож <code>.is-lazy<\/code> повідомляє <code>True<\/code>. Префікс встановлює прапорець лінивості незалежно від того, наскільки малий список, — щоб бути лінивим, йому не обов'язково бути нескінченним.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Принудете нетърпеливо изчисление","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Диапазон до <code>Inf<\/code> не може да бъде изчислен наведнъж, затова е мързелив: <code>.is-lazy<\/code> връща <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префиксът <code>eager<\/code> принуждава списъка да бъде произведен веднага, така че резултатът вече не е мързелив — <code>.is-lazy<\/code> връща <code>False<\/code>. Това е прекият аналог на маркирането на списък с <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не прилагайте <code>eager<\/code> към неограничен диапазон: <code>eager 1 .. Inf<\/code> се опитва да изчисли всеки елемент наведнъж, така че програмата просто увисва, консумирайки все повече памет, докато не бъде убита. <code>eager<\/code> е безопасен само за списъци, за които знаете, че са крайни.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратното също работи: <code>lazy 1..3<\/code> маркира дори кратък, краен диапазон като мързелив, така че <code>.is-lazy<\/code> връща <code>True<\/code>. Префиксът задава флага за мързеливост независимо от това колко малък е списъкът — не е нужно да е безкраен, за да бъде мързелив.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Devigi fervoron","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Intervalo ĝis <code>Inf<\/code> ne povas esti komputata tutan samtempe, do ĝi estas maldiligenta: <code>.is-lazy<\/code> raportas <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La prefikso <code>eager<\/code> devigas liston esti produktita tuj, do la rezulto ne plu estas maldiligenta -- <code>.is-lazy<\/code> raportas <code>False<\/code>. Ĉi tio estas la rekta kontraŭaĵo de markado de listo kiel <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ne apliku <code>eager<\/code> al nelimigita intervalo: <code>eager 1 .. Inf<\/code> provas komputi ĉiun elementon samtempe, do la programo simple blokiĝas, konsumante pli kaj pli da memoro ĝis ĝi estas mortigita. <code>eager<\/code> estas sekura nur por listoj, pri kiuj vi scias, ke ili estas finitaj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ankaŭ la inverso funkcias: <code>lazy 1..3<\/code> markas eĉ mallongan, finitan intervalon kiel maldiligenta, do <code>.is-lazy<\/code> raportas <code>True<\/code>. La prefikso starigas la maldiligento-flagon sendepende de la grandeco de la listo -- ĝi ne devas esti senfina por esti maldiligenta.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Alacrem aestimationem cogere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Intervallum usque ad <code>Inf<\/code> simul totum computari non potest, ergo pigrum est: <code>.is-lazy<\/code> refert <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Praefixum <code>eager<\/code> indicem cogit statim produci, ergo resultatum non iam pigrum est — <code>.is-lazy<\/code> refert <code>False<\/code>. Hoc est directum contrarium indicis ut <code>lazy<\/code> signati.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Noli <code>eager<\/code> ad intervallum illimitatum applicare: <code>eager 1 .. Inf<\/code> conatur omne elementum simul computare, ergo programma simpliciter pendet, plus plusque memoriae consumens donec interficitur. <code>eager<\/code> tantum pro indicibus quos finitos esse scis tutum est.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Inversum quoque operatur: <code>lazy 1..3<\/code> etiam breve, finitum intervallum ut pigrum signat, ergo <code>.is-lazy<\/code> refert <code>True<\/code>. Praefixum signum pigritiae ponit cuiuscumque magnitudinis index sit — non debet infinitus esse ut piger sit.<\/span><\/li><\/ol>"]]}}}</script>
