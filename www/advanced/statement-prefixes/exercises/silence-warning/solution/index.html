> ongedefinieerd is, zodat <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> <code>Hello, friend!<\/code> print zonder enige waarschuwing.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Silenciar una advertencia","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Interpolar el <code>$name<\/code> indefinido en la cadena normalmente dispara una advertencia de \"uso de valor no inicializado\". Envolver la expresión en <code>quietly<\/code> la suprime, así que solo se imprime el saludo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Al igual que <code>do<\/code>, <code>quietly<\/code> devuelve el valor de su bloque, por lo que la cadena ensamblada (con el nombre faltante dejando un espacio vacío) se almacena en <code>$greeting<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> solo oculta la advertencia; el valor sigue siendo indefinido. Si en cambio quieres <em>lidiar<\/em> con el valor faltante, proporciona un valor predeterminado con el operador definido-o <code>//<\/code>: <code>$name // 'friend'<\/code> produce <code>'friend'<\/code> cuando <code>$name<\/code> es indefinido, así que <code>\"Hello, \" \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Интерполирането на неопределената <code>$name<\/code> в низа нормално предизвиква предупреждение „use of uninitialized value\". Обвиването на израза в <code>quietly<\/code> го потиска, така че се отпечатва само поздравът.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Подобно на <code>do<\/code>, <code>quietly<\/code> връща стойността на своя блок, така че съставеният низ (с липсващото име, оставящо празно място) се записва в <code>$greeting<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> само скрива предупреждението — стойността все още е неопределена. Ако вместо това искате да <em>се справите<\/em> с липсващата стойност, задайте стойност по подразбиране с оператора за определеност <code>//<\/code>: <code>$name // 'friend'<\/code> дава <code>'friend'<\/code>, когато <code>$name<\/code> е неопределена, така че <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> отпечатва <code>Hello, friend!<\/code> без никакво предупреждение.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Silentigi averton","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Interpoli la nedefinitan <code>$name<\/code> en la ĉenon normale kaŭzas averton pri \"uzo de neinicialigita valoro\". Envolvi la esprimon en <code>quietly<\/code> kaŝas ĝin, do nur la salutfrazo estas presata.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Same kiel <code>do<\/code>, <code>quietly<\/code> redonas la valoron de sia bloko, do la kunmetita ĉeno (kun la mankanta nomo lasanta malplenan interspacon) estas konservita en <code>$greeting<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> nur kaŝas la averton -- la valoro ankoraŭ estas nedefinita. Se vi anstataŭe volas <em>trakti<\/em> la mankantan valoron, provizu defaŭlton per la difinita-aŭ operatoro <code>//<\/code>: <code>$name // 'friend'<\/code> donas <code>'friend'<\/code> kiam <code>$name<\/code> estas nedefinita, do <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> presas <code>Hello, friend!<\/code> tute sen averto.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Admonitionem silere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indefinitum <code>$name<\/code> in chordam interpolari normaliter admonitionem \"use of uninitialized value\" excitat. Expressionem in <code>quietly<\/code> involvere eam supprimit, ergo tantum salutatio imprimitur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sicut <code>do<\/code>, <code>quietly<\/code> valorem copiae suae reddit, ergo chorda composita (cum nomine absente lacunam vacuam relinquente) in <code>$greeting<\/code> reponitur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> tantum admonitionem celat — valor adhuc indefinitus est. Si potius vis valorem absentem <em>tractare<\/em>, defectum cum operatore definito-vel <code>//<\/code> praebe: <code>$name // 'friend'<\/code> producit <code>'friend'<\/code> cum <code>$name<\/code> indefinitus est, ergo <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> imprimit <code>Hello, friend!<\/code> sine ulla admonitione.<\/span><\/li><\/ol>"]]}}}</script>
