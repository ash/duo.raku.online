<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/lazy-eager","n":617,"k":"topic","pv":"advanced/statement-prefixes/do-prefix/quiz","nx":"advanced/statement-prefixes/sink-quietly","tr":["advanced","advanced/statement-prefixes"],"L":{"en":{"t":"Laziness and eagerness","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Some lists in Raku are computed only as their elements are needed — they are <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>lazy<\/code> and <code>eager<\/code> prefixes let you control this explicitly.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>eager<\/code> prefix forces a list to be produced <strong>all at once<\/strong>, immediately:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without <code>eager<\/code> the <code>map<\/code> would still produce the values, but <code>eager<\/code> guarantees they are all computed there and then rather than on demand.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>lazy<\/code> prefix does the opposite: it marks a list as lazy, so its elements are produced only when pulled.<\/span> <span class=\"sg\" data-s=\"1\">This is what lets a list be conceptually infinite:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>.is-lazy<\/code> method confirms the list will not try to compute all of its (endless) elements up front.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This particular example is exactly a case where Raku would assume laziness anyway: an unbounded range like <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> is already lazy, so <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> prints <\/code>True<code> without the prefix.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Writing <code>lazy<\/code> here changes nothing — it only makes the intent explicit.<\/span> <span class=\"sg\" data-s=\"4\">The prefix earns its keep when you want to make lazy a list that would otherwise be computed eagerly.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Most of the time Raku chooses sensibly on its own — ranges and sequences are lazy, ordinary array assignment is eager.<\/span> <span class=\"sg\" data-s=\"1\">Reach for these prefixes when you need to override that choice: <code>eager<\/code> to force an expensive computation to happen now, <code>lazy<\/code> to defer one that might be large or unbounded.<\/span><\/p>"]]},"de":{"t":"Laziness und Eagerness","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Einige Listen in Raku werden erst berechnet, wenn ihre Elemente benötigt werden — sie sind <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Die Präfixe <code>lazy<\/code> und <code>eager<\/code> ermöglichen es dir, dies explizit zu steuern.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>eager<\/code>-Präfix erzwingt, dass eine Liste <strong>auf einmal<\/strong> und sofort erzeugt wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne <code>eager<\/code> würde das <code>map<\/code> die Werte trotzdem erzeugen, aber <code>eager<\/code> garantiert, dass alle sofort berechnet werden und nicht erst bei Bedarf.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>lazy<\/code>-Präfix bewirkt das Gegenteil: Es markiert eine Liste als lazy, sodass ihre Elemente erst erzeugt werden, wenn sie abgerufen werden.<\/span> <span class=\"sg\" data-s=\"1\">Dadurch kann eine Liste konzeptionell unendlich sein:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.is-lazy<\/code> bestätigt, dass die Liste nicht versuchen wird, alle ihre (endlosen) Elemente im Voraus zu berechnen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dieses spezielle Beispiel ist genau ein Fall, in dem Raku ohnehin Laziness annehmen würde: Ein unbegrenzter Bereich wie <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> ist bereits lazy, daher gibt <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> auch ohne das Präfix <\/code>True<code> aus.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Das Schreiben von <code>lazy<\/code> ändert hier nichts — es macht die Absicht nur explizit.<\/span> <span class=\"sg\" data-s=\"4\">Das Präfix ist dann nützlich, wenn du eine Liste lazy machen möchtest, die sonst eager berechnet würde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In den meisten Fällen wählt Raku von sich aus vernünftig — Bereiche und Sequenzen sind lazy, gewöhnliche Array-Zuweisungen sind eager.<\/span> <span class=\"sg\" data-s=\"1\">Greife auf diese Präfixe zurück, wenn du diese Wahl überschreiben musst: <code>eager<\/code>, um eine aufwendige Berechnung sofort zu erzwingen, <code>lazy<\/code>, um eine aufzuschieben, die groß oder unbegrenzt sein könnte.<\/span><\/p>"]]},"nl":{"t":"Luiheid en gretigheid","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommige lijsten in Raku worden pas berekend wanneer hun elementen nodig zijn — ze zijn <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Met de prefixen <code>lazy<\/code> en <code>eager<\/code> kun je dit expliciet sturen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>eager<\/code> dwingt een lijst af om <strong>in een keer<\/strong>, onmiddellijk te worden geproduceerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder <code>eager<\/code> zou de <code>map<\/code> de waarden nog steeds produceren, maar <code>eager<\/code> garandeert dat ze allemaal ter plekke worden berekend in plaats van op aanvraag.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>lazy<\/code> doet het tegenovergestelde: het markeert een lijst als lazy, zodat de elementen pas worden geproduceerd wanneer ze worden opgevraagd.<\/span> <span class=\"sg\" data-s=\"1\">Dit maakt het mogelijk dat een lijst conceptueel oneindig is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>.is-lazy<\/code> bevestigt dat de lijst niet zal proberen al haar (eindeloze) elementen vooraf te berekenen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit specifieke voorbeeld is precies een geval waarin Raku sowieso luiheid zou aannemen: een onbegrensde range zoals <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> is al lazy, dus <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> print <\/code>True<code> zonder het prefix.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Het schrijven van <code>lazy<\/code> hier verandert niets — het maakt alleen de bedoeling expliciet.<\/span> <span class=\"sg\" data-s=\"4\">Het prefix komt tot zijn recht wanneer je een lijst lazy wilt maken die anders gretig zou worden berekend.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Meestal kiest Raku zelf verstandig — ranges en reeksen zijn lazy, gewone array-toewijzing is eager.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik deze prefixen wanneer je die keuze wilt overschrijven: <code>eager<\/code> om een dure berekening nu te forceren, <code>lazy<\/code> om er een uit te stellen die groot of onbegrensd zou kunnen zijn.<\/span><\/p>"]]},"es":{"t":"Pereza y ansiedad","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Algunas listas en Raku se calculan solo cuando sus elementos son necesarios: son <em>perezosas<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"1\">Los prefijos <code>lazy<\/code> y <code>eager<\/code> te permiten controlar esto explícitamente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>eager<\/code> fuerza a que una lista se produzca <strong>toda de una vez<\/strong>, inmediatamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin <code>eager<\/code>, el <code>map<\/code> aún produciría los valores, pero <code>eager<\/code> garantiza que todos se calculen en ese momento y no bajo demanda.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>lazy<\/code> hace lo contrario: marca una lista como perezosa, de modo que sus elementos se producen solo cuando se solicitan.<\/span> <span class=\"sg\" data-s=\"1\">Esto es lo que permite que una lista sea conceptualmente infinita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>.is-lazy<\/code> confirma que la lista no intentará calcular todos sus (interminables) elementos de antemano.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Este ejemplo en particular es exactamente un caso en el que Raku asumiría pereza de todos modos: un rango sin límite como <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> ya es perezoso, así que <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> imprime <\/code>True<code> sin el prefijo.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Escribir <code>lazy<\/code> aquí no cambia nada, solo hace la intención explícita.<\/span> <span class=\"sg\" data-s=\"4\">El prefijo justifica su existencia cuando quieres hacer perezosa una lista que de otro modo se calcularía de forma ansiosa (eager).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La mayor parte del tiempo Raku elige sensatamente por sí solo: los rangos y secuencias son perezosos, la asignación ordinaria a un array es ansiosa.<\/span> <span class=\"sg\" data-s=\"1\">Recurre a estos prefijos cuando necesites anular esa elección: <code>eager<\/code> para forzar que un cálculo costoso ocurra ahora, <code>lazy<\/code> para diferir uno que podría ser grande o sin límite.<\/span><\/p>"]]},"it":{"t":"Laziness e eagerness","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Alcune liste in Raku vengono calcolate solo quando i loro elementi sono necessari — sono <em>lazy<\/em> (pigre).<\/span> <span class=\"sg\" data-s=\"1\">I prefissi <code>lazy<\/code> e <code>eager<\/code> permettono di controllare questo comportamento in modo esplicito.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>eager<\/code> forza una lista a essere prodotta <strong>tutta in una volta<\/strong>, immediatamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza <code>eager<\/code> il <code>map<\/code> produrrebbe comunque i valori, ma <code>eager<\/code> garantisce che vengano tutti calcolati subito, anziché su richiesta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>lazy<\/code> fa l'opposto: contrassegna una lista come lazy, in modo che i suoi elementi vengano prodotti solo quando richiesti.<\/span> <span class=\"sg\" data-s=\"1\">Questo è ciò che permette a una lista di essere concettualmente infinita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.is-lazy<\/code> conferma che la lista non cercherà di calcolare tutti i suoi (infiniti) elementi in anticipo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo esempio particolare è esattamente un caso in cui Raku assumerebbe comunque la pigrizia: un intervallo illimitato come <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> è già lazy, quindi <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> stampa <\/code>True<code> anche senza il prefisso.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Scrivere <code>lazy<\/code> qui non cambia nulla — rende solo esplicita l'intenzione.<\/span> <span class=\"sg\" data-s=\"4\">Il prefisso diventa utile quando volete rendere lazy una lista che altrimenti verrebbe calcolata immediatamente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella maggior parte dei casi Raku sceglie in modo sensato da solo — gli intervalli e le sequenze sono lazy, l'assegnazione ordinaria a un array è eager.<\/span> <span class=\"sg\" data-s=\"1\">Usate questi prefissi quando avete bisogno di sovrascrivere quella scelta: <code>eager<\/code> per forzare un calcolo costoso ad avvenire subito, <code>lazy<\/code> per rinviarne uno che potrebbe essere grande o illimitato.<\/span><\/p>"]]},"lv":{"t":"Slinkums un dedzīgums","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Daži saraksti Raku tiek aprēķināti tikai tad, kad to elementi vajadzīgi, — tie ir <em>slinki<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Prefiksi <code>lazy<\/code> un <code>eager<\/code> ļauj to vadīt tieši.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>eager<\/code> liek sarakstu izveidot <strong>visu uzreiz<\/strong>, nekavējoties:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Arī bez <code>eager<\/code> <code>map<\/code> vērtības radītu, taču <code>eager<\/code> garantē, ka tās visas tiek aprēķinātas turpat uz vietas, nevis pēc pieprasījuma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>lazy<\/code> dara pretējo: tas atzīmē sarakstu kā slinku, tāpēc tā elementi tiek radīti tikai tad, kad tos izvelk.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tas ļauj sarakstam būt konceptuāli bezgalīgam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.is-lazy<\/code> apstiprina, ka saraksts nemēģinās visus savus (bezgalīgos) elementus aprēķināt jau iepriekš.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tieši šis piemērs ir gadījums, kad Raku slinkumu pieņemtu jebkurā gadījumā: neierobežots diapazons, piemēram, <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code>, jau ir slinks, tāpēc <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> izdrukā <\/code>True<code> arī bez prefiksa.<\/code><\/span> <span class=\"sg\" data-s=\"3\"><code>lazy<\/code> rakstīšana šeit neko nemaina — tā tikai padara nodomu skaidru.<\/span> <span class=\"sg\" data-s=\"4\">Prefikss atmaksājas, kad vēlaties padarīt slinku sarakstu, kas citādi tiktu aprēķināts dedzīgi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lielākoties Raku izvēlas saprātīgi pats — diapazoni un virknes ir slinkas, parasta masīva piešķiršana ir dedzīga.<\/span> <span class=\"sg\" data-s=\"1\">Ķerieties pie šiem prefiksiem, kad šo izvēli vajag pārrakstīt: <code>eager<\/code>, lai liktu dārgam aprēķinam notikt tagad, <code>lazy<\/code>, lai atliktu tādu, kas varētu būt liels vai neierobežots.<\/span><\/p>"]]},"ru":{"t":"Ленивость и немедленность","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Некоторые списки в Raku вычисляются только тогда, когда их элементы действительно нужны — они <em>ленивые<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Префиксы <code>lazy<\/code> и <code>eager<\/code> позволяют управлять этим явно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>eager<\/code> заставляет список быть вычисленным <strong>целиком<\/strong>, немедленно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>eager<\/code> <code>map<\/code> всё равно выдаст значения, но <code>eager<\/code> гарантирует, что все они будут вычислены прямо здесь и сейчас, а не по запросу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>lazy<\/code> делает противоположное: он помечает список как ленивый, и его элементы создаются только при обращении к ним.<\/span> <span class=\"sg\" data-s=\"1\">Именно это позволяет списку быть концептуально бесконечным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.is-lazy<\/code> подтверждает, что список не будет пытаться вычислить все свои (бесконечные) элементы заранее.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Этот конкретный пример как раз тот случай, когда Raku и так предполагает ленивость: неограниченный диапазон вроде <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> уже является ленивым, поэтому <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> напечатает <\/code>True<code> и без префикса.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Использование <code>lazy<\/code> здесь ничего не меняет — оно лишь делает намерение явным.<\/span> <span class=\"sg\" data-s=\"4\">Префикс по-настоящему полезен, когда нужно сделать ленивым список, который иначе был бы вычислен нетерпеливо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В большинстве случаев Raku сам делает разумный выбор — диапазоны и последовательности ленивые, обычное присваивание массиву нетерпеливое.<\/span> <span class=\"sg\" data-s=\"1\">Используйте эти префиксы, когда нужно переопределить этот выбор: <code>eager<\/code>, чтобы форсировать затратное вычисление прямо сейчас, <code>lazy<\/code>, чтобы отложить вычисление, которое может быть большим или неограниченным.<\/span><\/p>"]]},"uk":{"t":"Лінивість та жадібність","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі списки в Raku обчислюються лише в міру потреби в їхніх елементах — вони <em>ліниві<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Префікси <code>lazy<\/code> та <code>eager<\/code> дозволяють керувати цим явно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>eager<\/code> змушує список бути виробленим <strong>весь одразу<\/strong>, негайно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>eager<\/code> <code>map<\/code> усе одно виробив би значення, але <code>eager<\/code> гарантує, що всі вони обчислюються саме тут і зараз, а не на вимогу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>lazy<\/code> робить протилежне: він позначає список як лінивий, тож його елементи виробляються, лише коли їх витягують.<\/span> <span class=\"sg\" data-s=\"1\">Саме це дозволяє списку бути умоглядно нескінченним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.is-lazy<\/code> підтверджує, що список не намагатиметься обчислити всі свої (нескінченні) елементи наперед.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Саме цей приклад є випадком, коли Raku припустив би лінивість і так: необмежений діапазон на кшталт <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> уже лінивий, тож <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> виводить <\/code>True<code> і без префікса.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Написання <code>lazy<\/code> тут нічого не змінює — воно лише робить намір явним.<\/span> <span class=\"sg\" data-s=\"4\">Префікс виправдовує себе, коли ви хочете зробити лінивим список, який інакше обчислився б жадібно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здебільшого Raku робить розумний вибір самотужки: діапазони й послідовності ліниві, а звичайне присвоєння масиву жадібне.<\/span> <span class=\"sg\" data-s=\"1\">Звертайтеся до цих префіксів, коли потрібно цей вибір перекрити: <code>eager<\/code> — щоб змусити дороге обчислення статися зараз, <code>lazy<\/code> — щоб відкласти те, що може виявитися великим або необмеженим.<\/span><\/p>"]]},"bg":{"t":"Мързеливост и нетърпеливост","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои списъци в Raku се изчисляват само когато техните елементи са необходими — те са <em>мързеливи<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"1\">Префиксите <code>lazy<\/code> и <code>eager<\/code> ви позволяват да контролирате това изрично.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>eager<\/code> принуждава списъка да бъде произведен <strong>наведнъж<\/strong>, веднага:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>eager<\/code> операцията <code>map<\/code> все пак ще произведе стойностите, но <code>eager<\/code> гарантира, че всички са изчислени веднага, а не при поискване.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>lazy<\/code> прави обратното: маркира списък като мързелив, така че елементите му се произвеждат само когато бъдат поискани.<\/span> <span class=\"sg\" data-s=\"1\">Това позволява списъкът да бъде концептуално безкраен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.is-lazy<\/code> потвърждава, че списъкът няма да се опита да изчисли всички свои (безкрайни) елементи предварително.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Този конкретен пример е точно случай, в който Raku така или иначе би приел мързеливост: неограничен диапазон като <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> вече е мързелив, така че <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> отпечатва <\/code>True<code> и без префикс.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Писането на <code>lazy<\/code> тук не променя нищо — само прави намерението изрично.<\/span> <span class=\"sg\" data-s=\"4\">Префиксът наистина е полезен, когато искате да направите мързелив списък, който иначе би бил изчислен нетърпеливо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В повечето случаи Raku сам избира разумно — диапазоните и последователностите са мързеливи, а обичайното присвояване на масив е нетърпеливо.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте тези префикси, когато трябва да промените този избор: <code>eager<\/code> за принудително изпълнение на скъпо изчисление веднага, <code>lazy<\/code> за отлагане на изчисление, което може да бъде голямо или безкрайно.<\/span><\/p>"]]},"eo":{"t":"Maldiligento kaj fervoro","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Iuj listoj en Raku estas komputataj nur kiam iliaj elementoj estas bezonataj -- ili estas <em>maldiligentaj<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"1\">La prefiksoj <code>lazy<\/code> kaj <code>eager<\/code> ebligas al vi kontroli tion eksplicite.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>eager<\/code> devigas liston esti produktita <strong>tutan samtempe<\/strong>, tuj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sen <code>eager<\/code> la <code>map<\/code> ankoraŭ produktus la valorojn, sed <code>eager<\/code> garantias, ke ili ĉiuj estas komputataj tie kaj tiam anstataŭ laŭbezone.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>lazy<\/code> faras la malon: ĝi markas liston kiel maldiligenta, tiel ke ĝiaj elementoj estas produktataj nur kiam tirataj.<\/span> <span class=\"sg\" data-s=\"1\">Tio ebligas al listo esti koncepte senfina:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.is-lazy<\/code> konfirmas, ke la listo ne provos komputi ĉiujn siajn (senfinajn) elementojn anticipe.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu konkreta ekzemplo estas ĝuste kazo kie Raku supozus maldiligenton ĉiuokaze: nelimigita intervalo kiel <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> jam estas maldiligenta, do <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> presas <\/code>True<code> sen la prefikso.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Skribi <code>lazy<\/code> ĉi tie ŝanĝas nenion -- ĝi nur eksplicitigas la intencon.<\/span> <span class=\"sg\" data-s=\"4\">La prefikso pravigas sian ekziston kiam vi volas maldiligentigi liston, kiu alie estus komputata avide.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plej ofte Raku elektas saĝe memstare -- intervaloj kaj sekvencoj estas maldiligentaj, ordinara atribuado al tabelo estas avida.<\/span> <span class=\"sg\" data-s=\"1\">Uzu ĉi tiujn prefiksojn kiam vi bezonas superregi tiun elekton: <code>eager<\/code> por devigi multekostan komputadon okazi nun, <code>lazy<\/code> por prokrasti komputadon kiu povus esti granda aŭ senlima.<\/span><\/p>"]]},"la":{"t":"Pigritia et alacri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliqui indices in Raku tantum secundum necessitatem computantur — <em>pigri<\/em> sunt.<\/span> <span class=\"sg\" data-s=\"1\">Praefixa <code>lazy<\/code> et <code>eager<\/code> tibi permittunt hoc explicite controllare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>eager<\/code> indicem cogit <strong>totum simul<\/strong> produci, statim:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine <code>eager<\/code> <code>map<\/code> adhuc valores produceret, sed <code>eager<\/code> certos efficit quod omnes ibi et tunc computantur potius quam secundum necessitatem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>lazy<\/code> contrarium facit: indicem ut pigrum signat, ita ut eius elementa tantum cum petuntur producuntur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est quod sinit indicem conceptualiter infinitum esse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.is-lazy<\/code> confirmat indicem non conaturum omnia sua (infinita) elementa ante computare.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc exemplum particulare est exacte casus ubi Raku pigritiam iam assumeret: intervallum illimitatum sicut <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> iam pigrum est, ergo <\/code>say (1 ..<\/span> <span class=\"sg\" data-s=\"2\">Inf).is-lazy<code> imprimit <\/code>True<code> sine praefixo.<\/code><\/span> <span class=\"sg\" data-s=\"3\"><code>lazy<\/code> hic scribere nihil mutat — tantum intentionem explicitam facit.<\/span> <span class=\"sg\" data-s=\"4\">Praefixum suum meritum obtinet cum indicem qui aliter impigre computaretur pigrum facere vis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plerumque Raku prudenter per se eligit — intervalla et sequentiae pigra sunt, ordinaria assignatio indicis impigra est.<\/span> <span class=\"sg\" data-s=\"1\">Ad haec praefixa recurre cum hanc electionem superscribere debes: <code>eager<\/code> ad computationem onerosam nunc fieri cogendam, <code>lazy<\/code> ad differendum quae magna vel illimitata esse posset.<\/span><\/p>"]]}}}</script>
