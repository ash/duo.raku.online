<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/sink-quietly","n":618,"k":"topic","pv":"advanced/statement-prefixes/lazy-eager","nx":"advanced/statement-prefixes/sink-quietly/quiz","tr":["advanced","advanced/statement-prefixes"],"L":{"en":{"t":"sink and quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Two more prefixes deal with running code for its effects rather than its value.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>sink<\/code> prefix evaluates something in <em>sink context<\/em> — purely for its side effects, discarding the result.<\/span> <span class=\"sg\" data-s=\"1\">It is useful with a lazy operation that you want to force to run:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>map<\/code> here is run only for the printing it does; <code>sink<\/code> makes sure it actually executes and throws the resulting list away.<\/span> <span class=\"sg\" data-s=\"1\">Without forcing it, a lazy <code>map<\/code> whose result is never used might not run at all.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>quietly<\/code> prefix runs a block with its <strong>warnings suppressed<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Code that would normally print a warning to the error stream stays silent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adding <code>1<\/code> to an undefined <code>$value<\/code> normally warns about using an uninitialized value, but inside <code>quietly<\/code> that warning is hidden.<\/span> <span class=\"sg\" data-s=\"1\">Use it when you knowingly do something that warns and do not want the noise — but sparingly, since warnings usually point at a real mistake.<\/span><\/p>"]]},"de":{"t":"sink und quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zwei weitere Präfixe befassen sich damit, Code wegen seiner Effekte statt wegen seines Werts auszuführen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>sink<\/code>-Präfix wertet etwas im <em>Sink-Kontext<\/em> aus — rein für seine Seiteneffekte, wobei das Ergebnis verworfen wird.<\/span> <span class=\"sg\" data-s=\"1\">Es ist nützlich bei einer lazy Operation, deren Ausführung du erzwingen möchtest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>map<\/code> wird hier nur wegen der Ausgabe ausgeführt, die es erzeugt; <code>sink<\/code> stellt sicher, dass es tatsächlich ausgeführt wird, und verwirft die resultierende Liste.<\/span> <span class=\"sg\" data-s=\"1\">Ohne die Erzwingung könnte ein lazy <code>map<\/code>, dessen Ergebnis nie verwendet wird, möglicherweise gar nicht ausgeführt werden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>quietly<\/code>-Präfix führt einen Block aus und <strong>unterdrückt dabei Warnungen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Code, der normalerweise eine Warnung an den Fehlerstrom ausgeben würde, bleibt still:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, ohne \"uninitialized value\"-Warnung\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Addieren von <code>1<\/code> zu einem undefinierten <code>$value<\/code> würde normalerweise vor der Verwendung eines uninitialisierten Werts warnen, aber innerhalb von <code>quietly<\/code> wird diese Warnung unterdrückt.<\/span> <span class=\"sg\" data-s=\"1\">Verwende es, wenn du bewusst etwas tust, das Warnungen auslöst, und den Lärm nicht möchtest — aber sparsam, denn Warnungen weisen normalerweise auf einen echten Fehler hin.<\/span><\/p>"]]},"nl":{"t":"sink en quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Twee andere prefixen zijn bedoeld voor het uitvoeren van code omwille van de effecten in plaats van de waarde.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>sink<\/code> evalueert iets in <em>sink context<\/em> — puur voor de neveneffecten, waarbij het resultaat wordt weggegooid.<\/span> <span class=\"sg\" data-s=\"1\">Het is nuttig bij een luie operatie die je wilt dwingen om uit te voeren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>map<\/code> hier wordt alleen uitgevoerd vanwege het printen dat het doet; <code>sink<\/code> zorgt ervoor dat het daadwerkelijk wordt uitgevoerd en gooit de resulterende lijst weg.<\/span> <span class=\"sg\" data-s=\"1\">Zonder het te forceren zou een luie <code>map<\/code> waarvan het resultaat nooit wordt gebruikt, mogelijk helemaal niet draaien.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>quietly<\/code> voert een blok uit met <strong>onderdrukte waarschuwingen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Code die normaal een waarschuwing naar de foutuitvoer zou sturen, blijft stil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het optellen van <code>1<\/code> bij een ongedefinieerde <code>$value<\/code> geeft normaal een waarschuwing over het gebruik van een niet-geinitialiseerde waarde, maar binnen <code>quietly<\/code> wordt die waarschuwing verborgen.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik het wanneer je bewust iets doet dat waarschuwt en je het lawaai niet wilt — maar spaarzaam, want waarschuwingen wijzen meestal op een echte fout.<\/span><\/p>"]]},"es":{"t":"sink y quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dos prefijos más se ocupan de ejecutar código por sus efectos en lugar de por su valor.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>sink<\/code> evalúa algo en <em>contexto sink<\/em> (de hundimiento), puramente por sus efectos secundarios, descartando el resultado.<\/span> <span class=\"sg\" data-s=\"1\">Es útil con una operación perezosa que quieres forzar a ejecutarse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>map<\/code> aquí se ejecuta solo por la impresión que realiza; <code>sink<\/code> se asegura de que realmente se ejecute y descarta la lista resultante.<\/span> <span class=\"sg\" data-s=\"1\">Sin forzarlo, un <code>map<\/code> perezoso cuyo resultado nunca se usa podría no ejecutarse en absoluto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>quietly<\/code> ejecuta un bloque con sus <strong>advertencias suprimidas<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">El código que normalmente imprimiría una advertencia en el flujo de error permanece en silencio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sumar <code>1<\/code> a un <code>$value<\/code> indefinido normalmente advierte sobre el uso de un valor no inicializado, pero dentro de <code>quietly<\/code> esa advertencia se oculta.<\/span> <span class=\"sg\" data-s=\"1\">Úsalo cuando a propósito hagas algo que genera advertencias y no quieras el ruido, pero con moderación, ya que las advertencias generalmente señalan un error real.<\/span><\/p>"]]},"it":{"t":"sink e quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Altri due prefissi riguardano l'esecuzione di codice per i suoi effetti piuttosto che per il suo valore.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>sink<\/code> valuta qualcosa in <em>contesto sink<\/em> — esclusivamente per i suoi effetti collaterali, scartando il risultato.<\/span> <span class=\"sg\" data-s=\"1\">È utile con un'operazione lazy che volete forzare ad eseguire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>map<\/code> qui viene eseguito solo per la stampa che produce; <code>sink<\/code> si assicura che venga effettivamente eseguito e scarta la lista risultante.<\/span> <span class=\"sg\" data-s=\"1\">Senza forzarlo, un <code>map<\/code> lazy il cui risultato non viene mai usato potrebbe non essere eseguito affatto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>quietly<\/code> esegue un blocco con i suoi <strong>avvisi soppressi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Il codice che normalmente stamperebbe un avviso sul flusso di errore rimane silenzioso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommare <code>1<\/code> a un <code>$value<\/code> non definito normalmente genera un avviso sull'uso di un valore non inizializzato, ma all'interno di <code>quietly<\/code> quell'avviso viene nascosto.<\/span> <span class=\"sg\" data-s=\"1\">Usatelo quando fate consapevolmente qualcosa che genera avvisi e non volete il disturbo — ma con parsimonia, poiché gli avvisi di solito indicano un errore reale.<\/span><\/p>"]]},"lv":{"t":"sink un quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl divi prefiksi attiecas uz koda izpildi tā efektu, nevis vērtības dēļ.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>sink<\/code> izrēķina kaut ko <em>iesūkšanas kontekstā<\/em> — vienīgi blakusefektu dēļ, rezultātu izmetot.<\/span> <span class=\"sg\" data-s=\"1\">Tas noder ar slinku darbību, kuru vēlaties piespiest izpildīties:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> šeit tiek izpildīts tikai tās drukāšanas dēļ, ko tas veic; <code>sink<\/code> gādā, ka tas patiešām izpildās, un iegūto sarakstu izmet.<\/span> <span class=\"sg\" data-s=\"1\">Ja to nepiespiestu, slinks <code>map<\/code>, kura rezultāts nekad netiek izmantots, varētu vispār neizpildīties.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>quietly<\/code> izpilda bloku ar <strong>apslāpētiem brīdinājumiem<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Kods, kas parasti izdrukātu brīdinājumu kļūdu plūsmā, paliek kluss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pieskaitot <code>1<\/code> nedefinētam <code>$value<\/code>, parasti tiek brīdināts par neinicializētas vērtības lietošanu, taču <code>quietly<\/code> iekšienē šis brīdinājums tiek paslēpts.<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet to, kad apzināti darāt kaut ko tādu, kas brīdina, un troksni nevēlaties, — taču taupīgi, jo brīdinājumi parasti norāda uz īstu kļūdu.<\/span><\/p>"]]},"ru":{"t":"sink и quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ещё два префикса предназначены для выполнения кода ради его эффектов, а не значения.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>sink<\/code> вычисляет выражение в <em>контексте sink<\/em> — исключительно ради побочных эффектов, отбрасывая результат.<\/span> <span class=\"sg\" data-s=\"1\">Он полезен с ленивой операцией, которую нужно принудительно выполнить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>map<\/code> выполняется только ради вывода на печать; <code>sink<\/code> гарантирует, что он действительно выполнится, а результирующий список будет отброшен.<\/span> <span class=\"sg\" data-s=\"1\">Без принудительного выполнения ленивый <code>map<\/code>, результат которого никогда не используется, может вообще не запуститься.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>quietly<\/code> выполняет блок с <strong>подавленными предупреждениями<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Код, который обычно выводит предупреждение в поток ошибок, остаётся беззвучным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, без предупреждения \"uninitialized value\"\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сложение <code>1<\/code> с неопределённым <code>$value<\/code> обычно вызывает предупреждение об использовании неинициализированного значения, но внутри <code>quietly<\/code> это предупреждение скрыто.<\/span> <span class=\"sg\" data-s=\"1\">Используйте его, когда вы намеренно делаете что-то, что вызывает предупреждение, и не хотите лишнего шума — но делайте это осторожно, поскольку предупреждения обычно указывают на настоящую ошибку.<\/span><\/p>"]]},"uk":{"t":"sink та quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще два префікси мають справу з виконанням коду заради його ефектів, а не значення.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>sink<\/code> обчислює щось у <em>контексті стоку<\/em> — суто заради побічних ефектів, відкидаючи результат.<\/span> <span class=\"sg\" data-s=\"1\">Він корисний із лінивою операцією, яку ви хочете змусити виконатися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> тут виконується лише заради того друку, який він робить; <code>sink<\/code> подбає, щоб він справді виконався, і викине отриманий список.<\/span> <span class=\"sg\" data-s=\"1\">Без такого примусу лінивий <code>map<\/code>, результат якого ніде не використано, міг би й не виконатися взагалі.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>quietly<\/code> виконує блок із <strong>приглушеними попередженнями<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Код, який зазвичай вивів би попередження в потік помилок, залишається мовчазним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, без попередження \"uninitialized value\"\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Додавання <code>1<\/code> до невизначеного <code>$value<\/code> зазвичай попереджає про використання неініціалізованого значення, але всередині <code>quietly<\/code> це попередження приховано.<\/span> <span class=\"sg\" data-s=\"1\">Використовуйте його, коли свідомо робите щось, що попереджає, і не хочете зайвого шуму, — але ощадливо, бо попередження зазвичай вказують на справжню помилку.<\/span><\/p>"]]},"bg":{"t":"sink и quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Още два префикса са свързани с изпълнението на код заради ефектите му, а не заради стойността му.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>sink<\/code> изчислява нещо в <em>sink контекст<\/em> — чисто заради страничните му ефекти, като изхвърля резултата.<\/span> <span class=\"sg\" data-s=\"1\">Полезен е при мързелива операция, която искате да принудите да се изпълни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Операцията <code>map<\/code> тук се изпълнява само заради отпечатването, което прави; <code>sink<\/code> гарантира, че наистина се изпълнява, и изхвърля получения списък.<\/span> <span class=\"sg\" data-s=\"1\">Без принуждаване мързеливо <code>map<\/code>, чийто резултат не се използва, може изобщо да не се изпълни.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>quietly<\/code> изпълнява блок с <strong>потиснати предупреждения<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Код, който нормално би отпечатал предупреждение в потока за грешки, остава тих:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Събирането на <code>1<\/code> с неопределена <code>$value<\/code> нормално предупреждава за използване на неинициализирана стойност, но вътре в <code>quietly<\/code> това предупреждение е скрито.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте го, когато съзнателно правите нещо, което предупреждава, и не искате шума — но пестеливо, тъй като предупрежденията обикновено сочат към истинска грешка.<\/span><\/p>"]]},"eo":{"t":"sink kaj quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Du pliaj prefiksoj traktas plenumado de kodo pro ĝiaj efektoj anstataŭ ĝia valoro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>sink<\/code> taksas ion en <em>sink-kunteksto<\/em> — pure pro ĝiaj flankefektoj, forĵetante la rezulton.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas utila kun maldiligenta operacio, kiun vi volas devigi plenumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>map<\/code> ĉi tie estas plenumata nur pro la presado, kiun ĝi faras; <code>sink<\/code> certigas, ke ĝi efektive plenumiĝas kaj forĵetas la rezultan liston.<\/span> <span class=\"sg\" data-s=\"1\">Sen devigo, maldiligenta <code>map<\/code>, kies rezulto neniam estas uzata, eble tute ne plenumiĝus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>quietly<\/code> plenumas blokon kun siaj <strong>avertoj kaŝitaj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Kodo, kiu normale presus averton al la erara fluo, restas silenta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aldoni <code>1<\/code> al nedefinita <code>$value<\/code> normale avertas pri uzo de neinicialigita valoro, sed ene de <code>quietly<\/code> tiu averto estas kaŝita.<\/span> <span class=\"sg\" data-s=\"1\">Uzu ĝin kiam vi konscie faras ion, kio avertas, kaj ne volas la bruon — sed ŝpareme, ĉar avertoj kutime montras veran eraron.<\/span><\/p>"]]},"la":{"t":"sink et quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Duo plura praefixa codicem propter effectus eius, non propter valorem, currunt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>sink<\/code> aliquid in <em>contextu sink<\/em> evaluat — pure propter effectus laterales, resultatum abiciens.<\/span> <span class=\"sg\" data-s=\"1\">Utile est cum operatione pigra quam currere vis cogere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> hic tantum propter impressionem quam facit curritur; <code>sink<\/code> certos efficit quod revera exsequitur et indicem resultantem abicit.<\/span> <span class=\"sg\" data-s=\"1\">Sine coactione, <code>map<\/code> pigra cuius resultatum numquam adhibetur fortasse omnino non currat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>quietly<\/code> copiam cum <strong>admonitionibus suppressis<\/strong> currit.<\/span> <span class=\"sg\" data-s=\"1\">Codex qui normaliter admonitionem ad fluxum errorum imprimeret silens manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>1<\/code> ad indefinitum <code>$value<\/code> addere normaliter de usu valoris non initializati admonet, sed intra <code>quietly<\/code> illa admonitio celatur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc utere cum scienter aliquid quod admonet facis et strepitum non vis — sed parce, quoniam admonitiones plerumque ad verum errorem indicant.<\/span><\/p>"]]}}}</script>
