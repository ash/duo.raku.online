<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes","n":614,"k":"section","pv":"advanced/gather-take/quiz","nx":"advanced/statement-prefixes/do-prefix","tr":["advanced"],"L":{"en":{"t":"Statement prefixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <em>statement prefix<\/em> is a keyword placed in front of a statement or block to change how it is run.<\/span> <span class=\"sg\" data-s=\"1\">You have already met one — <code>gather<\/code>, which collects everything a block hands to <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This section introduces a few more general-purpose prefixes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With prefixes you can turn a block into an expression that yields a value (<code>do<\/code>), control whether a list is computed immediately or on demand (<code>eager<\/code> and <code>lazy<\/code>), and run code purely for its side effects or with its warnings silenced (<code>sink<\/code> and <code>quietly<\/code>).<\/span><\/p>"]]},"de":{"t":"Anweisungspräfixe","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Statement-Prefix<\/em> ist ein Schlüsselwort, das vor eine Anweisung oder einen Block gesetzt wird, um deren Ausführung zu verändern.<\/span> <span class=\"sg\" data-s=\"1\">Du hast bereits eines kennengelernt — <code>gather<\/code>, das alles sammelt, was ein Block an <code>take<\/code> übergibt.<\/span> <span class=\"sg\" data-s=\"2\">In diesem Abschnitt werden einige weitere allgemeine Präfixe vorgestellt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit Präfixen kannst du einen Block in einen Ausdruck verwandeln, der einen Wert liefert (<code>do<\/code>), steuern, ob eine Liste sofort oder bei Bedarf berechnet wird (<code>eager<\/code> und <code>lazy<\/code>), und Code rein wegen seiner Seiteneffekte ausführen oder dessen Warnungen unterdrücken (<code>sink<\/code> und <code>quietly<\/code>).<\/span><\/p>"]]},"nl":{"t":"Statement-prefixen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>statement prefix<\/em> is een sleutelwoord dat voor een statement of blok wordt geplaatst om de manier waarop het wordt uitgevoerd te veranderen.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt er al een gezien — <code>gather<\/code>, dat alles verzamelt wat een blok aan <code>take<\/code> doorgeeft.<\/span> <span class=\"sg\" data-s=\"2\">In dit gedeelte worden nog een paar veelzijdige prefixen behandeld.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met prefixen kun je een blok omzetten in een expressie die een waarde oplevert (<code>do<\/code>), bepalen of een lijst onmiddellijk of op aanvraag wordt berekend (<code>eager<\/code> en <code>lazy<\/code>), en code uitvoeren puur omwille van de neveneffecten of met onderdrukte waarschuwingen (<code>sink<\/code> en <code>quietly<\/code>).<\/span><\/p>"]]},"es":{"t":"Prefijos de sentencia","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>prefijo de sentencia<\/em> es una palabra clave colocada delante de una sentencia o bloque para cambiar la forma en que se ejecuta.<\/span> <span class=\"sg\" data-s=\"1\">Ya has conocido uno: <code>gather<\/code>, que recopila todo lo que un bloque le entrega a <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección presenta algunos prefijos de propósito general más.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con los prefijos puedes convertir un bloque en una expresión que produce un valor (<code>do<\/code>), controlar si una lista se calcula inmediatamente o bajo demanda (<code>eager<\/code> y <code>lazy<\/code>), y ejecutar código puramente por sus efectos secundarios o con sus advertencias silenciadas (<code>sink<\/code> y <code>quietly<\/code>).<\/span><\/p>"]]},"it":{"t":"Prefissi di istruzione","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>prefisso di istruzione<\/em> è una parola chiave posta davanti a un'istruzione o a un blocco per modificare il modo in cui viene eseguito.<\/span> <span class=\"sg\" data-s=\"1\">Ne avete già incontrato uno — <code>gather<\/code>, che raccoglie tutto ciò che un blocco passa a <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione presenta alcuni altri prefissi di uso generale.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con i prefissi potete trasformare un blocco in un'espressione che produce un valore (<code>do<\/code>), controllare se una lista viene calcolata immediatamente o su richiesta (<code>eager<\/code> e <code>lazy<\/code>), ed eseguire codice esclusivamente per i suoi effetti collaterali o con i suoi avvisi soppressi (<code>sink<\/code> e <code>quietly<\/code>).<\/span><\/p>"]]},"lv":{"t":"Priekšrakstu prefiksi 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Teikuma prefikss<\/em> ir atslēgvārds, kas novietots teikuma vai bloka priekšā, lai mainītu to, kā tas tiek izpildīts.<\/span> <span class=\"sg\" data-s=\"1\">Ar vienu tādu jau esat iepazinušies — <code>gather<\/code>, kas savāc visu, ko bloks nodod <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa iepazīstina ar vēl dažiem vispārīgas nozīmes prefiksiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar prefiksiem varat pārvērst bloku par izteiksmi, kas dod vērtību (<code>do<\/code>), vadīt to, vai saraksts tiek aprēķināts uzreiz vai pēc pieprasījuma (<code>eager<\/code> un <code>lazy<\/code>), un izpildīt kodu tikai tā blakusefektu dēļ vai ar apslāpētiem brīdinājumiem (<code>sink<\/code> un <code>quietly<\/code>).<\/span><\/p>"]]},"ru":{"t":"Префиксы инструкций","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Префикс оператора<\/em> — это ключевое слово, которое ставится перед оператором или блоком и меняет способ его выполнения.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже познакомились с одним из них — <code>gather<\/code>, который собирает всё, что блок передаёт через <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе рассматриваются ещё несколько префиксов общего назначения.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С помощью префиксов можно превратить блок в выражение, возвращающее значение (<code>do<\/code>), управлять тем, вычисляется ли список сразу или по запросу (<code>eager<\/code> и <code>lazy<\/code>), а также выполнять код исключительно ради побочных эффектов или с подавлением предупреждений (<code>sink<\/code> и <code>quietly<\/code>).<\/span><\/p>"]]},"uk":{"t":"Префікси операторів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Префікс оператора<\/em> — це ключове слово, поставлене перед оператором або блоком, щоб змінити те, як він виконується.<\/span> <span class=\"sg\" data-s=\"1\">З одним ви вже стикалися — це <code>gather<\/code>, який збирає все, що блок передає до <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ знайомить із кількома іншими префіксами загального призначення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За допомогою префіксів ви можете перетворити блок на вираз, що дає значення (<code>do<\/code>), керувати тим, чи обчислюється список одразу, чи на вимогу (<code>eager<\/code> та <code>lazy<\/code>), а також виконувати код суто заради побічних ефектів або з приглушеними попередженнями (<code>sink<\/code> та <code>quietly<\/code>).<\/span><\/p>"]]},"bg":{"t":"Префикси на инструкции 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Префиксът на оператор<\/em> е ключова дума, поставена пред оператор или блок, за да промени начина, по който се изпълнява.<\/span> <span class=\"sg\" data-s=\"1\">Вече сте срещнали един такъв — <code>gather<\/code>, който събира всичко, което блокът предава на <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В тази секция са представени още няколко префикса с общо предназначение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С префиксите можете да превърнете блок в израз, който дава стойност (<code>do<\/code>), да контролирате дали списък се изчислява веднага или при поискване (<code>eager<\/code> и <code>lazy<\/code>) и да изпълнявате код само заради страничните му ефекти или с потиснати предупреждения (<code>sink<\/code> и <code>quietly<\/code>).<\/span><\/p>"]]},"eo":{"t":"Deklaraj prefiksoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Deklara prefikso<\/em> estas ŝlosilvorto metita antaŭ deklaro aŭ bloko por ŝanĝi kiel ĝi estas plenumata.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam renkontis unu -- <code>gather<\/code>, kiu kolektas ĉion, kion bloko transdonas al <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio prezentas kelkajn pliajn ĝeneraluzajn prefiksojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per prefiksoj vi povas transformi blokon en esprimon kiu donas valoron (<code>do<\/code>), kontroli ĉu listo estas komputata tuj aŭ laŭbezone (<code>eager<\/code> kaj <code>lazy<\/code>), kaj plenumi kodon nur pro ĝiaj flankefektoj aŭ kun silentigitaj avertoj (<code>sink<\/code> kaj <code>quietly<\/code>).<\/span><\/p>"]]},"la":{"t":"Praefixae sententiae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Praefixum sententiae<\/em> est verbum clavium ante sententiam vel copiam positum ad mutandum quomodo curritur.<\/span> <span class=\"sg\" data-s=\"1\">Iam unum cognovisti — <code>gather<\/code>, quod omne colligit quod copia ad <code>take<\/code> tradit.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio aliquot plura praefixa generalia introducit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum praefixis copiam in expressionem quae valorem producit convertere potes (<code>do<\/code>), controllare num index statim an secundum necessitatem computetur (<code>eager<\/code> et <code>lazy<\/code>), et codicem pure propter effectus laterales vel cum admonitionibus suppressis currere (<code>sink<\/code> et <code>quietly<\/code>).<\/span><\/p>"]]}}}</script>
