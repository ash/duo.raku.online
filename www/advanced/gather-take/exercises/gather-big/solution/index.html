<script type="application/json" id="page-data">{"u":"advanced/gather-take/exercises/gather-big/solution","n":612,"k":"solution","pv":"advanced/gather-take/exercises/gather-big","nx":"advanced/gather-take/quiz","tr":["advanced","advanced/gather-take"],"L":{"en":{"t":"The solution of ’Gather until full‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The loop is given a range of a hundred numbers, far more than it will use. That is fine because the loop stops itself: as soon as <code>$sum<\/code> passes <code>10<\/code>, <code>last<\/code> breaks out and the remaining numbers are never visited.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The order inside the block matters. We add to <code>$sum<\/code> first and check the limit before taking, so the number that tips the total over <code>10<\/code> (here, <code>5<\/code>) is not collected. The running total reaches exactly <code>10<\/code> after <code>4<\/code>, so the gathered list is <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This early exit with <code>for<\/code> is what <code>gather<\/code>/<code>take<\/code> can do and <code>grep<\/code> cannot: <code>grep<\/code> always scans the whole list, while here we choose when to stop.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Sammeln bis voll","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Schleife bekommt einen Bereich von hundert Zahlen, weit mehr als sie verwenden wird. Das ist kein Problem, weil die Schleife sich selbst stoppt: Sobald <code>$sum<\/code> den Wert <code>10<\/code> überschreitet, bricht <code>last<\/code> ab und die verbleibenden Zahlen werden nie besucht.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Reihenfolge innerhalb des Blocks ist wichtig. Wir addieren zuerst zu <code>$sum<\/code> und prüfen das Limit, bevor wir nehmen, sodass die Zahl, die die Summe über <code>10<\/code> kippt (hier <code>5<\/code>), nicht gesammelt wird. Die laufende Summe erreicht genau <code>10<\/code> nach <code>4<\/code>, sodass die gesammelte Liste <code>1, 2, 3, 4<\/code> ist.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dieses vorzeitige Beenden mit <code>for<\/code> ist das, was <code>gather<\/code>/<code>take<\/code> kann und <code>grep<\/code> nicht: <code>grep<\/code> durchsucht immer die gesamte Liste, während wir hier selbst entscheiden, wann wir aufhören.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Verzamelen tot vol","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De lus krijgt een bereik van honderd getallen, veel meer dan hij zal gebruiken. Dat is geen probleem, want de lus stopt zichzelf: zodra <code>$sum<\/code> boven <code>10<\/code> komt, breekt <code>last<\/code> de lus af en worden de overige getallen nooit bezocht.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De volgorde binnen het blok is belangrijk. We tellen eerst op bij <code>$sum<\/code> en controleren de limiet voordat we nemen, dus het getal dat het totaal boven <code>10<\/code> brengt (hier <code>5<\/code>) wordt niet verzameld. Het lopend totaal bereikt precies <code>10<\/code> na <code>4<\/code>, dus de verzamelde lijst is <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit vroegtijdig stoppen met <code>for<\/code> is wat <code>gather<\/code>/<code>take<\/code> kan en <code>grep<\/code> niet: <code>grep<\/code> doorloopt altijd de hele lijst, terwijl we hier kiezen wanneer we stoppen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Recolectar hasta llenar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Al bucle se le da un rango de cien números, muchos más de los que usará. Eso está bien porque el bucle se detiene solo: tan pronto como <code>$sum<\/code> supera <code>10<\/code>, <code>last<\/code> sale y los números restantes nunca se visitan.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El orden dentro del bloque importa. Primero sumamos a <code>$sum<\/code> y verificamos el limite antes de tomar, así que el numero que hace que el total supere <code>10<\/code> (aquí, <code>5<\/code>) no se recopila. El total acumulado llega exactamente a <code>10<\/code> después de <code>4<\/code>, así que la lista recopilada es <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esta salida anticipada con <code>for<\/code> es lo que <code>gather<\/code>/<code>take<\/code> puede hacer y <code>grep<\/code> no: <code>grep<\/code> siempre recorre toda la lista, mientras que aquí elegimos cuando detenernos.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Raccogliere fino al pieno","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione al compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Al ciclo viene dato un intervallo di cento numeri, molti piu di quanti ne utilizzera. Non e un problema perche il ciclo si interrompe da solo: non appena <code>$sum<\/code> supera <code>10<\/code>, <code>last<\/code> esce e i numeri restanti non vengono mai visitati.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'ordine all'interno del blocco e importante. Prima si aggiunge a <code>$sum<\/code> e si controlla il limite prima di prendere, cosi il numero che fa superare il totale di <code>10<\/code> (qui, <code>5<\/code>) non viene raccolto. Il totale progressivo raggiunge esattamente <code>10<\/code> dopo <code>4<\/code>, quindi la lista raccolta e <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questa uscita anticipata con <code>for<\/code> e cio che <code>gather<\/code>/<code>take<\/code> puo fare e <code>grep<\/code> no: <code>grep<\/code> scorre sempre l'intera lista, mentre qui si sceglie quando fermarsi.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Vākt līdz pilnam","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ciklam dots simts skaitļu diapazons — daudz vairāk, nekā tas izmantos. Tas ir labi, jo cikls sevi aptur pats: tiklīdz <code>$sum<\/code> pārsniedz <code>10<\/code>, <code>last<\/code> izrauj ārā, un atlikušie skaitļi netiek pat apmeklēti.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Bloka iekšienē secībai ir nozīme. Vispirms pieskaitām <code>$sum<\/code> un pārbaudām robežu pirms ņemšanas, tāpēc skaitlis, kas summu pārsviež pāri <code>10<\/code> (šeit <code>5<\/code>), netiek savākts. Uzkrātā summa sasniedz tieši <code>10<\/code> pēc <code>4<\/code>, tāpēc savāktais saraksts ir <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šī priekšlaicīgā iziešana ar <code>for<\/code> ir tas, ko <code>gather<\/code>/<code>take<\/code> var un <code>grep<\/code> nevar: <code>grep<\/code> vienmēr pārskata visu sarakstu, bet šeit mēs izvēlamies, kad apstāties.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Собирать до заполнения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Циклу задан диапазон из ста чисел — гораздо больше, чем он использует. Это нормально, потому что цикл останавливается сам: как только <code>$sum<\/code> превышает <code>10<\/code>, <code>last<\/code> прерывает выполнение, и остальные числа не обрабатываются.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок внутри блока важен. Сначала мы прибавляем к <code>$sum<\/code> и проверяем предел перед тем, как взять значение, поэтому число, которое превышает <code>10<\/code> (здесь <code>5<\/code>), не попадает в список. Накопленная сумма достигает ровно <code>10<\/code> после <code>4<\/code>, поэтому собранный список — <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Этот досрочный выход с <code>for<\/code> — это то, что может сделать <code>gather<\/code>/<code>take<\/code> и не может <code>grep<\/code>: <code>grep<\/code> всегда проходит весь список, а здесь мы сами решаем, когда остановиться.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Збирайте, поки не заповниться","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Циклу дано діапазон зі ста чисел — набагато більше, ніж він використає. Це нормально, бо цикл зупиняє себе сам: щойно <code>$sum<\/code> переходить <code>10<\/code>, <code>last<\/code> виривається назовні, і решта чисел так і не відвідується.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок усередині блоку має значення. Ми спершу додаємо до <code>$sum<\/code> і перевіряємо межу, а вже потім беремо, тож число, яке перехиляє суму за <code>10<\/code> (тут <code>5<\/code>), не збирається. Накопичена сума досягає рівно <code>10<\/code> після <code>4<\/code>, тож зібраний список — це <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цей достроковий вихід із <code>for<\/code> — те, що вміє <code>gather<\/code>/<code>take<\/code> і не вміє <code>grep<\/code>: <code>grep<\/code> завжди переглядає весь список, а тут ми самі обираємо, коли зупинитися.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Gather до запълване","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">На цикъла е зададен диапазон от сто числа, далеч повече, отколкото ще използва. Това е нормално, защото цикълът сам се спира: веднага щом <code>$sum<\/code> надвиши <code>10<\/code>, <code>last<\/code> прекъсва изпълнението и останалите числа не се посещават.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът вътре в блока е от значение. Първо добавяме към <code>$sum<\/code> и проверяваме лимита преди да вземем, така че числото, което прехвърля сумата над <code>10<\/code> (тук <code>5<\/code>), не се събира. Текущата сума достига точно <code>10<\/code> след <code>4<\/code>, така че събраният списък е <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това ранно излизане с <code>for<\/code> е нещо, което <code>gather<\/code>/<code>take<\/code> може да направи, а <code>grep<\/code> не може: <code>grep<\/code> винаги сканира целия списък, докато тук ние избираме кога да спрем.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Colligere usque ad plenum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ansae series centum numerorum datur, multo plus quam utetur. Bene est quia ansa se ipsam sistit: simulac <code>$sum<\/code> superat <code>10<\/code>, <code>last<\/code> interrumpit et reliqui numeri numquam visitantur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo intra copiam refert. Primum ad <code>$sum<\/code> addimus et limitem ante capturam verificamus, ergo numerus qui totalem supra <code>10<\/code> pellat (hic, <code>5<\/code>) non colligitur. Summa currens exacte <code>10<\/code> post <code>4<\/code> attingit, ergo index collectus est <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic exitus maturus cum <code>for<\/code> est quod <code>gather<\/code>/<code>take<\/code> facere potest et <code>grep<\/code> non potest: <code>grep<\/code> semper totum indicem perscrutatur, dum hic eligimus quando sistere.<\/span><\/li><\/ol>"]]}}}</script>
