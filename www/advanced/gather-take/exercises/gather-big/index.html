<script type="application/json" id="page-data">{"u":"advanced/gather-take/exercises/gather-big","n":611,"k":"exercise","pv":"advanced/gather-take/exercises/squares/solution","nx":"advanced/gather-take/exercises/gather-big/solution","tr":["advanced","advanced/gather-take"],"L":{"en":{"t":"Exercise ’Gather until full‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Loop over a generous range of numbers, <code>1<\/code> to <code>100<\/code>, and keep taking them — but stop as soon as their running total would exceed <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Print the list of numbers you collected.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is something <code>grep<\/code> cannot do, because you need to stop the loop partway through.<\/span> <span class=\"sg\" data-s=\"1\">With <code>gather<\/code> and <code>take<\/code> you can: use <code>last<\/code> to break out of the loop the moment the limit is reached, no matter how many numbers are left.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Sammeln bis voll","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Durchlaufe einen großzügigen Zahlenbereich von <code>1<\/code> bis <code>100<\/code> und nimm die Zahlen auf — aber höre auf, sobald ihre laufende Summe <code>10<\/code> überschreiten würde.<\/span> <span class=\"sg\" data-s=\"1\">Gib die Liste der gesammelten Zahlen aus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist etwas, was <code>grep<\/code> nicht kann, weil du die Schleife mittendrin abbrechen musst.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>gather<\/code> und <code>take<\/code> geht das: Verwende <code>last<\/code>, um die Schleife in dem Moment zu verlassen, in dem das Limit erreicht ist, egal wie viele Zahlen noch übrig sind.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Verzamelen tot vol","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Doorloop een ruim bereik van getallen, <code>1<\/code> tot <code>100<\/code>, en blijf ze nemen — maar stop zodra hun lopend totaal <code>10<\/code> zou overschrijden.<\/span> <span class=\"sg\" data-s=\"1\">Druk de lijst van verzamelde getallen af.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is iets wat <code>grep<\/code> niet kan, omdat je de lus halverwege moet stoppen.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>gather<\/code> en <code>take<\/code> kan dat wel: gebruik <code>last<\/code> om uit de lus te breken op het moment dat de limiet bereikt is, ongeacht hoeveel getallen er nog over zijn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Recolectar hasta llenar","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recorre un rango generoso de números, del <code>1<\/code> al <code>100<\/code>, y sigue tomandolos, pero detente tan pronto como su total acumulado supere <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Imprime la lista de números que recopilaste.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es algo que <code>grep<\/code> no puede hacer, porque necesitas detener el bucle a mitad de camino.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>gather<\/code> y <code>take<\/code> puedes: usa <code>last<\/code> para salir del bucle en el momento en que se alcanza el limite, sin importar cuántos números queden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Ve la solución<\/a><\/span><\/p>"]]},"it":{"t":"Raccogliere fino al pieno","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itera su un ampio intervallo di numeri, da <code>1<\/code> a <code>100<\/code>, e continua a prenderli — ma fermati non appena il loro totale progressivo supererebbe <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Stampa la lista dei numeri raccolti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo e qualcosa che <code>grep<\/code> non puo fare, perche e necessario interrompere il ciclo a meta.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>gather<\/code> e <code>take<\/code> si puo: usa <code>last<\/code> per uscire dal ciclo nel momento in cui il limite viene raggiunto, indipendentemente da quanti numeri restano.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Vākt līdz pilnam","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Palaidiet ciklu pāri dāsnam skaitļu diapazonam no <code>1<\/code> līdz <code>100<\/code> un ņemiet tos, taču apstājieties, tiklīdz to uzkrātā summa pārsniegtu <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Izdrukājiet savākto skaitļu sarakstu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir kaut kas tāds, ko <code>grep<\/code> nespēj, jo ciklu vajag apturēt pusceļā.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>gather<\/code> un <code>take<\/code> to var: izmantojiet <code>last<\/code>, lai izrautos no cikla brīdī, kad robeža sasniegta, lai cik skaitļu vēl būtu palikuši.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Собирать до заполнения","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переберите в цикле большой диапазон чисел от <code>1<\/code> до <code>100<\/code> и берите их, но остановитесь, как только их общая сумма превысит <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Напечатайте список собранных чисел.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это то, чего не может сделать <code>grep<\/code>, потому что нужно остановить цикл на полпути.<\/span> <span class=\"sg\" data-s=\"1\">С <code>gather<\/code> и <code>take<\/code> это возможно: используйте <code>last<\/code>, чтобы выйти из цикла в тот момент, когда предел достигнут, независимо от того, сколько чисел осталось.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Смотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Збирайте, поки не заповниться»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пройдіть циклом щедрий діапазон чисел, від <code>1<\/code> до <code>100<\/code>, і беріть їх — але зупиніться, щойно їхня накопичена сума перевищить <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Виведіть список зібраних чисел.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цього <code>grep<\/code> зробити не може, бо потрібно зупинити цикл на півдорозі.<\/span> <span class=\"sg\" data-s=\"1\">З <code>gather<\/code> і <code>take<\/code> це можливо: скористайтеся <code>last<\/code>, щоб вийти з циклу тієї ж миті, коли досягнуто межі, скільки б чисел не залишалося.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Gather до запълване","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обходете щедър диапазон от числа, <code>1<\/code> до <code>100<\/code>, и продължавайте да ги вземате — но спрете веднага щом текущата им сума надвиши <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Отпечатайте списъка от събраните числа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е нещо, което <code>grep<\/code> не може да направи, защото трябва да спрете цикъла по средата.<\/span> <span class=\"sg\" data-s=\"1\">С <code>gather<\/code> и <code>take<\/code> можете: използвайте <code>last<\/code>, за да прекъснете цикъла в момента, в който лимитът е достигнат, без значение колко числа остават.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"la":{"t":"Colligere usque ad plenum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per generosam seriem numerorum, <code>1<\/code> ad <code>100<\/code>, itera et eos capere perge — sed desiste simulac eorum summa currens <code>10<\/code> excederet.<\/span> <span class=\"sg\" data-s=\"1\">Imprime indicem numerorum quos collegisti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc est aliquid quod <code>grep<\/code> facere non potest, quia ansam mediam interrumpere debes.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>gather<\/code> et <code>take<\/code> potes: utere <code>last<\/code> ad ansam interrumpendam in momento quo limes attingitur, quotcumque numeri relicti sint.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/gather-take/exercises/gather-big/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
