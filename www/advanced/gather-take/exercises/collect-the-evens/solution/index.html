<script type="application/json" id="page-data">{"u":"advanced/gather-take/exercises/collect-the-evens/solution","n":608,"k":"solution","pv":"advanced/gather-take/exercises/collect-the-evens","nx":"advanced/gather-take/exercises/squares","tr":["advanced","advanced/gather-take"],"L":{"en":{"t":"The solution of ’Repeat each number‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nothing forces a single <code>take<\/code> per iteration. Here the inner <code>take $n for 1..$n<\/code> runs <code>take<\/code> a different number of times on each pass, which is exactly the flexibility that makes <code>gather<\/code>/<code>take<\/code> more powerful than a plain <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The outer loop uses a named variable <code>-&gt; $n<\/code> on purpose. If we wrote the inner loop with <code>$_<\/code>, the inner <code>for<\/code> would rebind <code>$_<\/code> to its own counter, and we would take the counter instead of the current number.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simply collects every value that was taken, in order, so <code>@result<\/code> ends up holding <code>1<\/code>, then two <code>2<\/code>s, then three <code>3<\/code>s, then four <code>4<\/code>s.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Jede Zahl wiederholen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nichts erzwingt ein einzelnes <code>take<\/code> pro Durchlauf. Hier führt das innere <code>take $n for 1..$n<\/code> bei jedem Durchgang eine unterschiedliche Anzahl von <code>take<\/code>-Aufrufen aus, was genau die Flexibilität ist, die <code>gather<\/code>/<code>take<\/code> mächtiger macht als ein einfaches <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die äußere Schleife verwendet absichtlich eine benannte Variable <code>-&gt; $n<\/code>. Wenn wir die innere Schleife mit <code>$_<\/code> schreiben würden, würde das innere <code>for<\/code> die Variable <code>$_<\/code> an seinen eigenen Zähler binden, und wir würden den Zähler statt der aktuellen Zahl nehmen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> sammelt einfach jeden Wert, der genommen wurde, in der Reihenfolge, sodass <code>@result<\/code> am Ende <code>1<\/code>, dann zwei <code>2<\/code>en, dann drei <code>3<\/code>en, dann vier <code>4<\/code>en enthält.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Elk getal herhalen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Niets dwingt een enkele <code>take<\/code> per iteratie af. Hier voert de binnenste <code>take $n for 1..$n<\/code> <code>take<\/code> een verschillend aantal keren uit bij elke doorgang, wat precies de flexibiliteit is die <code>gather<\/code>/<code>take<\/code> krachtiger maakt dan een gewone <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De buitenste lus gebruikt met opzet een benoemde variabele <code>-&gt; $n<\/code>. Als we de binnenste lus met <code>$_<\/code> zouden schrijven, zou de binnenste <code>for<\/code> <code>$_<\/code> opnieuw binden aan zijn eigen teller, en zouden we de teller nemen in plaats van het huidige getal.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> verzamelt eenvoudigweg elke waarde die genomen is, in volgorde, dus <code>@result<\/code> bevat uiteindelijk <code>1<\/code>, dan twee <code>2<\/code>'s, dan drie <code>3<\/code>'s, dan vier <code>4<\/code>'s.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Repetir cada número","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nada obliga a un único <code>take<\/code> por iteración. Aquí el <code>take $n for 1..$n<\/code> interno ejecuta <code>take<\/code> un numero diferente de veces en cada pasada, que es exactamente la flexibilidad que hace a <code>gather<\/code>/<code>take<\/code> más poderoso que un simple <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bucle externo usa una variable con nombre <code>-&gt; $n<\/code> a propósito. Si escribieramos el bucle interno con <code>$_<\/code>, el <code>for<\/code> interno reasignaría <code>$_<\/code> a su propio contador, y tomariamos el contador en lugar del numero actual.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simplemente recopila cada valor que fue tomado, en orden, así que <code>@result<\/code> termina conteniendo <code>1<\/code>, luego dos <code>2<\/code>, luego tres <code>3<\/code>, y luego cuatro <code>4<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Ripetere ogni numero","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione al compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nulla obbliga a un singolo <code>take<\/code> per iterazione. Qui il <code>take $n for 1..$n<\/code> interno esegue <code>take<\/code> un numero diverso di volte ad ogni passaggio, ed e esattamente la flessibilita che rende <code>gather<\/code>/<code>take<\/code> piu potente di un semplice <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il ciclo esterno usa una variabile con nome <code>-&gt; $n<\/code> di proposito. Se scrivessimo il ciclo interno con <code>$_<\/code>, il <code>for<\/code> interno riassegnerebbe <code>$_<\/code> al proprio contatore, e prenderemmo il contatore invece del numero corrente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> raccoglie semplicemente ogni valore che e stato preso, in ordine, quindi <code>@result<\/code> finisce per contenere <code>1<\/code>, poi due <code>2<\/code>, poi tre <code>3<\/code>, poi quattro <code>4<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Atkārtot katru skaitli","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nekas neliek katrā iterācijā izsaukt <code>take<\/code> tieši vienu reizi. Šeit iekšējais <code>take $n for 1..$n<\/code> izsauc <code>take<\/code> dažādu reižu skaitu katrā piegājienā, un tieši šī elastība padara <code>gather<\/code>/<code>take<\/code> jaudīgāku par vienkāršu <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ārējais cikls ar nolūku izmanto nosauktu mainīgo <code>-&gt; $n<\/code>. Ja iekšējo ciklu rakstītu ar <code>$_<\/code>, iekšējais <code>for<\/code> piesaistītu <code>$_<\/code> savam skaitītājam, un mēs ņemtu skaitītāju, nevis pašreizējo skaitli.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> vienkārši savāc katru paņemto vērtību secībā, tāpēc <code>@result<\/code> beigās satur <code>1<\/code>, tad divus <code>2<\/code>, tad trīs <code>3<\/code>, tad četrus <code>4<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Повторение каждого числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ничто не ограничивает количество вызовов <code>take<\/code> за одну итерацию. Здесь внутренний <code>take $n for 1..$n<\/code> выполняет <code>take<\/code> разное количество раз на каждом проходе — именно эта гибкость делает <code>gather<\/code>/<code>take<\/code> мощнее обычного <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внешний цикл использует именованную переменную <code>-&gt; $n<\/code> намеренно. Если бы мы написали внутренний цикл с <code>$_<\/code>, внутренний <code>for<\/code> переназначил бы <code>$_<\/code> на свой собственный счётчик, и мы брали бы счётчик вместо текущего числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто собирает все взятые значения по порядку, поэтому <code>@result<\/code> содержит <code>1<\/code>, затем два <code>2<\/code>, затем три <code>3<\/code>, затем четыре <code>4<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Повторіть кожне число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ніщо не змушує робити рівно один <code>take<\/code> на ітерацію. Тут внутрішній <code>take $n for 1..$n<\/code> виконує <code>take<\/code> різну кількість разів на кожному проході — саме та гнучкість, яка робить <code>gather<\/code>/<code>take<\/code> потужнішим за звичайний <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зовнішній цикл навмисно використовує іменовану змінну <code>-&gt; $n<\/code>. Якби ми записали внутрішній цикл через <code>$_<\/code>, внутрішній <code>for<\/code> перепризначив би <code>$_<\/code> на власний лічильник, і ми брали б лічильник замість поточного числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто збирає по порядку кожне взяте значення, тож у <code>@result<\/code> опиняються <code>1<\/code>, потім дві <code>2<\/code>, потім три <code>3<\/code>, потім чотири <code>4<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Повторете всяко число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"s quoque transitu currit, quod est exacte flexibilitas quae <code>gather<\/code>/<code>take<\/code> potentiorem quam simplicem <code>map<\/code> facit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ansa exterior variabilem nominatam <code>-&gt; $n<\/code> de industria utitur. Si ansam interiorem cum <code>$_<\/code> scripsissemus, interior <code>for<\/code> <code>$_<\/code> ad suum numeratorem religaret, et numeratorem loco numeri currentis caperemus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simpliciter omnem valorem captum ordine colligit, ergo <code>@result<\/code> finaliter <code>1<\/code>, deinde duo <code>2<\/code>, deinde tres <code>3<\/code>, deinde quattuor <code>4<\/code> continet.<\/span><\/li><\/ol>"]]}}}</script>
