<script type="application/json" id="page-data">{"u":"advanced/gather-take","n":605,"k":"section","pv":"advanced/given-when/exercises/match-by-type/solution","nx":"advanced/gather-take/exercises","tr":["advanced"],"L":{"en":{"t":"<code>gather<\/code> and <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>gather<\/code> and <code>take<\/code> pair is a flexible way to build a list.<\/span> <span class=\"sg\" data-s=\"1\">You wrap some code in a <code>gather<\/code> block, and every time that code calls <code>take<\/code>, the value is added to the list that <code>gather<\/code> produces.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The three <code>take<\/code> calls contribute three values, and <code>gather<\/code> collects them into the list stored in <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The real strength of this pair shows when the <code>take<\/code> calls are spread through ordinary control flow, such as a loop with a condition.<\/span> <span class=\"sg\" data-s=\"1\">The list then contains only the values you chose to take:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here the loop runs over the numbers from 1 to 10, but only the even ones are taken, so <code>@evens<\/code> ends up holding <code>2, 4, 6, 8, 10<\/code>. (The <code>%%<\/code> operator tests whether a number divides evenly.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This separation is what makes <code>gather<\/code>/<code>take<\/code> so handy: the surrounding code decides <em>when<\/em> to produce a value, and <code>gather<\/code> quietly gathers whatever is taken.<\/span><\/p>"]]},"de":{"t":"<code>gather<\/code> und <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Paar <code>gather<\/code> und <code>take<\/code> ist eine flexible Möglichkeit, eine Liste aufzubauen.<\/span> <span class=\"sg\" data-s=\"1\">Du umschließt Code mit einem <code>gather<\/code>-Block, und jedes Mal, wenn dieser Code <code>take<\/code> aufruft, wird der Wert zur Liste hinzugefügt, die <code>gather<\/code> erzeugt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die drei <code>take<\/code>-Aufrufe liefern drei Werte, und <code>gather<\/code> sammelt sie in der Liste, die in <code>@result<\/code> gespeichert wird.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die eigentliche Stärke dieses Paares zeigt sich, wenn die <code>take<\/code>-Aufrufe über gewöhnlichen Kontrollfluss verteilt sind, wie zum Beispiel eine Schleife mit einer Bedingung.<\/span> <span class=\"sg\" data-s=\"1\">Die Liste enthält dann nur die Werte, die du bewusst genommen hast:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier läuft die Schleife über die Zahlen von 1 bis 10, aber nur die geraden werden genommen, sodass <code>@evens<\/code> am Ende <code>2, 4, 6, 8, 10<\/code> enthält. (Der Operator <code>%%<\/code> prüft, ob eine Zahl ganzzahlig teilbar ist.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diese Trennung macht <code>gather<\/code>/<code>take<\/code> so praktisch: Der umgebende Code entscheidet, <em>wann<\/em> ein Wert erzeugt wird, und <code>gather<\/code> sammelt stillschweigend alles, was genommen wurde.<\/span><\/p>"]]},"nl":{"t":"<code>gather<\/code> en <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>gather<\/code>- en <code>take<\/code>-paar is een flexibele manier om een lijst op te bouwen.<\/span> <span class=\"sg\" data-s=\"1\">Je omsluit wat code in een <code>gather<\/code>-blok, en elke keer dat die code <code>take<\/code> aanroept, wordt de waarde toegevoegd aan de lijst die <code>gather<\/code> oplevert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De drie <code>take<\/code>-aanroepen leveren drie waarden op, en <code>gather<\/code> verzamelt ze in de lijst die in <code>@result<\/code> wordt opgeslagen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De echte kracht van dit paar komt naar voren wanneer de <code>take<\/code>-aanroepen verspreid zijn door gewone besturingslogica, zoals een lus met een voorwaarde.<\/span> <span class=\"sg\" data-s=\"1\">De lijst bevat dan alleen de waarden die je hebt gekozen om te nemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier doorloopt de lus de getallen van 1 tot 10, maar alleen de even getallen worden genomen, dus <code>@evens<\/code> bevat uiteindelijk <code>2, 4, 6, 8, 10<\/code>. (De <code>%%<\/code>-operator test of een getal deelbaar is zonder rest.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze scheiding is wat <code>gather<\/code>/<code>take<\/code> zo handig maakt: de omringende code bepaalt <em>wanneer<\/em> een waarde geproduceerd wordt, en <code>gather<\/code> verzamelt stilletjes alles wat genomen wordt.<\/span><\/p>"]]},"es":{"t":"<code>gather<\/code> y <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El par <code>gather<\/code> y <code>take<\/code> es una forma flexible de construir una lista.<\/span> <span class=\"sg\" data-s=\"1\">Envuelves algo de código en un bloque <code>gather<\/code>, y cada vez que ese código llama a <code>take<\/code>, el valor se agrega a la lista que <code>gather<\/code> produce.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las tres llamadas a <code>take<\/code> aportan tres valores, y <code>gather<\/code> los recopila en la lista almacenada en <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La verdadera fortaleza de este par se muestra cuando las llamadas a <code>take<\/code> se distribuyen a través del flujo de control ordinario, como un bucle con una condición.<\/span> <span class=\"sg\" data-s=\"1\">La lista entonces contiene solo los valores que elegiste tomar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí el bucle recorre los números del 1 al 10, pero solo se toman los pares, así que <code>@evens<\/code> termina conteniendo <code>2, 4, 6, 8, 10<\/code>. (El operador <code>%%<\/code> verifica si un numero es divisible de manera exacta.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta separación es lo que hace a <code>gather<\/code>/<code>take<\/code> tan práctico: el código circundante decide <em>cuando<\/em> producir un valor, y <code>gather<\/code> silenciosamente recopila todo lo que se haya tomado.<\/span><\/p>"]]},"it":{"t":"<code>gather<\/code> e <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La coppia <code>gather<\/code> e <code>take<\/code> e un modo flessibile per costruire una lista.<\/span> <span class=\"sg\" data-s=\"1\">Si racchiude del codice in un blocco <code>gather<\/code>, e ogni volta che quel codice chiama <code>take<\/code>, il valore viene aggiunto alla lista che <code>gather<\/code> produce.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le tre chiamate a <code>take<\/code> contribuiscono tre valori, e <code>gather<\/code> li raccoglie nella lista memorizzata in <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La vera forza di questa coppia si manifesta quando le chiamate a <code>take<\/code> sono distribuite nel normale flusso di controllo, come un ciclo con una condizione.<\/span> <span class=\"sg\" data-s=\"1\">La lista contiene allora solo i valori che si e scelto di prendere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui il ciclo itera sui numeri da 1 a 10, ma solo quelli pari vengono presi, quindi <code>@evens<\/code> finisce per contenere <code>2, 4, 6, 8, 10<\/code>. (L'operatore <code>%%<\/code> verifica se un numero e divisibile in modo esatto.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa separazione e cio che rende <code>gather<\/code>/<code>take<\/code> cosi utile: il codice circostante decide <em>quando<\/em> produrre un valore, e <code>gather<\/code> raccoglie silenziosamente tutto cio che viene preso.<\/span><\/p>"]]},"lv":{"t":"<code>gather<\/code> un <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pāris <code>gather<\/code> un <code>take<\/code> ir elastīgs veids, kā uzbūvēt sarakstu.<\/span> <span class=\"sg\" data-s=\"1\">Kādu kodu ietinat blokā <code>gather<\/code>, un ikreiz, kad šis kods izsauc <code>take<\/code>, vērtība tiek pievienota sarakstam, ko <code>gather<\/code> izveido.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Trīs <code>take<\/code> izsaukumi dod trīs vērtības, un <code>gather<\/code> tās savāc sarakstā, kas saglabāts <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī pāra īstais spēks parādās, kad <code>take<\/code> izsaukumi ir izkaisīti pa parastu vadības plūsmu, piemēram, ciklu ar nosacījumu.<\/span> <span class=\"sg\" data-s=\"1\">Sarakstā tad ir tikai tās vērtības, ko izvēlējāties paņemt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit cikls iet pāri skaitļiem no 1 līdz 10, taču tiek paņemti tikai pāra skaitļi, tāpēc <code>@evens<\/code> beigās satur <code>2, 4, 6, 8, 10<\/code>. (Operators <code>%%<\/code> pārbauda, vai skaitlis dalās bez atlikuma.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tieši šī nošķiršana padara <code>gather<\/code>/<code>take<\/code> tik ērtu: apkārtējais kods izlemj, <em>kad<\/em> radīt vērtību, un <code>gather<\/code> klusi savāc visu, kas paņemts.<\/span><\/p>"]]},"ru":{"t":"<code>gather<\/code> и <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пара <code>gather<\/code> и <code>take<\/code> — это гибкий способ построения списка.<\/span> <span class=\"sg\" data-s=\"1\">Вы оборачиваете некоторый код в блок <code>gather<\/code>, и каждый раз, когда этот код вызывает <code>take<\/code>, значение добавляется в список, который создаёт <code>gather<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три вызова <code>take<\/code> дают три значения, и <code>gather<\/code> собирает их в список, сохранённый в <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Настоящая сила этой пары проявляется, когда вызовы <code>take<\/code> распределены по обычному потоку управления, например в цикле с условием.<\/span> <span class=\"sg\" data-s=\"1\">Тогда список содержит только те значения, которые вы решили взять:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь цикл проходит по числам от 1 до 10, но берутся только чётные, поэтому <code>@evens<\/code> содержит <code>2, 4, 6, 8, 10<\/code>. (Оператор <code>%%<\/code> проверяет, делится ли число нацело.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это разделение и делает <code>gather<\/code>/<code>take<\/code> таким удобным: окружающий код решает, <em>когда<\/em> создать значение, а <code>gather<\/code> тихо собирает всё, что было взято.<\/span><\/p>"]]},"uk":{"t":"<code>gather<\/code> та <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пара <code>gather<\/code> і <code>take<\/code> — це гнучкий спосіб побудувати список.<\/span> <span class=\"sg\" data-s=\"1\">Ви загортаєте якийсь код у блок <code>gather<\/code>, і щоразу, коли цей код викликає <code>take<\/code>, значення додається до списку, який видає <code>gather<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три виклики <code>take<\/code> дають три значення, а <code>gather<\/code> збирає їх у список, збережений у <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Справжня сила цієї пари виявляється, коли виклики <code>take<\/code> розкидані по звичайному потоку виконання — наприклад, по циклу з умовою.<\/span> <span class=\"sg\" data-s=\"1\">Тоді список містить лише ті значення, які ви вирішили взяти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут цикл проходить числа від 1 до 10, але береться лише парні, тож у <code>@evens<\/code> опиняються <code>2, 4, 6, 8, 10<\/code>. (Оператор <code>%%<\/code> перевіряє, чи ділиться число націло.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Саме це розділення робить <code>gather<\/code>/<code>take<\/code> таким зручним: код навколо вирішує, <em>коли<\/em> видати значення, а <code>gather<\/code> тихо збирає все, що взяли.<\/span><\/p>"]]},"bg":{"t":"<code>gather<\/code> и <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Двойката <code>gather<\/code> и <code>take<\/code> е гъвкав начин за изграждане на списък.<\/span> <span class=\"sg\" data-s=\"1\">Обвивате код в блок <code>gather<\/code> и всеки път, когато този код извика <code>take<\/code>, стойността се добавя към списъка, който <code>gather<\/code> произвежда.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Трите извиквания на <code>take<\/code> допринасят три стойности, а <code>gather<\/code> ги събира в списъка, съхранен в <code>@result<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Истинската сила на тази двойка се проявява, когато извикванията на <code>take<\/code> са разпръснати из обикновен поток на управление, например цикъл с условие.<\/span> <span class=\"sg\" data-s=\"1\">Списъкът тогава съдържа само стойностите, които сте избрали да вземете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук цикълът обхожда числата от 1 до 10, но само четните се вземат, така че <code>@evens<\/code> накрая съдържа <code>2, 4, 6, 8, 10<\/code>. (Операторът <code>%%<\/code> проверява дали числото се дели без остатък.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това разделение е причината <code>gather<\/code>/<code>take<\/code> да е толкова удобно: заобикалящият код решава <em>кога<\/em> да произведе стойност, а <code>gather<\/code> тихо събира всичко, което е взето.<\/span><\/p>"]]},"la":{"t":"<code>gather<\/code> et <code>take<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Par <code>gather<\/code> et <code>take<\/code> est flexibilis modus ad indicem construendum.<\/span> <span class=\"sg\" data-s=\"1\">Codicem in copia <code>gather<\/code> involvis, et quotiens ille codex <code>take<\/code> vocat, valor ad indicem quem <code>gather<\/code> producit additur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tres vocationes <code>take<\/code> tres valores conferunt, et <code>gather<\/code> eos in indicem in <code>@result<\/code> repositum colligit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vera vis huius paris apparet cum vocationes <code>take<\/code> per ordinarium fluxum controllandi dispersae sunt, sicut ansa cum condicione.<\/span> <span class=\"sg\" data-s=\"1\">Tunc index tantum valores quos elegisti capere continet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic ansa per numeros ab 1 ad 10 currit, sed tantum pares capiuntur, ergo <code>@evens<\/code> finaliter <code>2, 4, 6, 8, 10<\/code> continet. (Operator <code>%%<\/code> probat num numerus aequaliter dividatur.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec separatio est quod <code>gather<\/code>/<code>take<\/code> tam commodum facit: codex circumdans decernit <em>quando<\/em> valorem producere, et <code>gather<\/code> quiete colligit quidquid captum est.<\/span><\/p>"]]}}}</script>
