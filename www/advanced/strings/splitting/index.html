<script type="application/json" id="page-data">{"u":"advanced/strings/splitting","n":455,"k":"topic","pv":"advanced/strings/searching/quiz","nx":"advanced/strings/exercises","tr":["advanced","advanced/strings"],"L":{"en":{"t":"Splitting and joining","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Strings can be broken into parts and put back together in several ways.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>words<\/code> method splits a string into a list of its whitespace-separated words:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>split<\/code> method breaks a string at a separator that you choose:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An important special case is splitting on the <strong>empty string<\/strong> <code>''<\/code>: it breaks a string into its individual characters, but it also slips an empty string in at the very start and the very end, so the result has two elements more than you might expect:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To split into characters, the <code>comb<\/code> method, called without arguments, does it directly — with no stray empties to clean up:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To go the other way, the <code>join<\/code> method glues a list of values into a single string, placing a separator between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Two more methods work on parts of a string.<\/span> <span class=\"sg\" data-s=\"1\">The <code>substr<\/code> method extracts a piece, given a starting position and, optionally, a length:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And <code>trim<\/code> removes whitespace from both ends of a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"de":{"t":"Aufteilen und Verbinden","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Strings können auf verschiedene Weisen in Teile zerlegt und wieder zusammengesetzt werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>words<\/code> teilt einen String in eine Liste seiner durch Leerzeichen getrennten Wörter auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>split<\/code> teilt einen String an einem Trennzeichen deiner Wahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein wichtiger Sonderfall ist das Aufteilen am <strong>leeren String<\/strong> <code>''<\/code>: Dabei wird ein String in seine einzelnen Zeichen zerlegt, aber es wird auch am Anfang und am Ende jeweils ein leerer String eingefügt, sodass das Ergebnis zwei Elemente mehr hat, als man erwarten würde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um einen String in Zeichen aufzuteilen, t een string in zijn losse tekens, maar schuift er ook helemaal vooraan en helemaal achteraan een lege string tussen, zodat het resultaat twee elementen meer heeft dan je misschien verwacht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — de drie letters, plus aan elk uiteinde een lege string\nsay 'abc'.split('', :skip-empty); # (a b c) — het bijwoord :skip-empty laat de lege weg<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om in tekens te splitsen doet de methode <code>comb<\/code>, aangeroepen zonder argumenten, dat rechtstreeks — zonder losse lege strings die je moet opruimen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De andere kant op plakt de methode <code>join<\/code> een lijst van waarden aaneen tot één string, met een scheidingsteken ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Twee andere methoden werken op delen van een string.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>substr<\/code> haalt er een stuk uit, gegeven een beginpositie en eventueel een lengte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>trim<\/code> verwijdert witruimte aan beide uiteinden van een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"es":{"t":"Dividir y unir","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Las cadenas se pueden dividir en partes y volver a unir de varias maneras.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>words<\/code> divide una cadena en una lista de palabras separadas por espacios en blanco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>split<\/code> divide una cadena en el separador que elijas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un caso especial importante es dividir por la <strong>cadena vacía<\/strong> <code>''<\/code>: separa una cadena en sus caracteres individuales, pero también añade una cadena vacía al principio y al final, por lo que el resultado tiene dos elementos más de los que podrías esperar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para dividir en caracteres, el método <code>comb<\/code>, llamado sin argumentos, lo hace directamente — sin cadenas vacías extra que limpiar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para hacer lo contrario, el método <code>join<\/code> une una lista de valores en una sola cadena, colocando un separador entre ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dos métodos más trabajan con partes de una cadena.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>substr<\/code> extrae un fragmento, dado una posición inicial y, opcionalmente, una longitud:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y <code>trim<\/code> elimina los espacios en blanco de ambos extremos de una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"it":{"t":"Dividere e unire","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Le stringhe possono essere suddivise in parti e rimesse insieme in diversi modi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>words<\/code> divide una stringa in una lista di parole separate da spazi bianchi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>split<\/code> spezza una stringa in corrispondenza di un separatore a scelta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un caso speciale importante e la divisione sulla <strong>stringa vuota<\/strong> <code>''<\/code>: spezza una stringa nei suoi singoli caratteri, ma inserisce anche una stringa vuota all'inizio e alla fine, quindi il risultato ha due elementi in piu di quanto ci si potrebbe aspettare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per dividere in caratteri, il metodo <code>comb<\/code>, chiamato senza argomenti, lo fa direttamente — senza stringhe vuote da ripulire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per fare il contrario, il metodo <code>join<\/code> unisce una lista di valori in un'unica stringa, inserendo un separatore tra di essi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri due metodi operano su parti di una stringa.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>substr<\/code> estrae una porzione, data una posizione iniziale e, opzionalmente, una lunghezza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E <code>trim<\/code> rimuove gli spazi bianchi da entrambe le estremita di una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"lv":{"t":"Sadalīšana un apvienošana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Virknes var sadalīt daļās un salikt atpakaļ kopā vairākos veidos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>words<\/code> sadala virkni vārdu sarakstā, atdalot pēc atstarpēm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>split<\/code> sadala virkni pie jūsu izvēlēta atdalītāja:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Svarīgs īpašs gadījums ir sadalīšana pie <strong>tukšās virknes<\/strong> <code>''<\/code>: tā sadala virkni atsevišķās rakstzīmēs, bet arī ievieto tukšu virkni pašā sākumā un beigās, tāpēc rezultātam ir par diviem elementiem vairāk, nekā varētu gaidīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — trīs burti, plus tukša virkne katrā galā\nsay 'abc'.split('', :skip-empty); # (a b c) — adverbs :skip-empty izlaiž tukšos<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai sadalītu rakstzīmēs, metode <code>comb<\/code>, izsaukta bez argumentiem, dara to tieši — bez liekām tukšām virknēm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai dotos pretējā virzienā, metode <code>join<\/code> salīmē vērtību sarakstu vienā virknē, ievietojot atdalītāju starp tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vēl divas metodes strādā ar virknes daļām.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>substr<\/code> izgriež gabalu, norādot sākuma pozīciju un, pēc izvēles, garumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>trim<\/code> noņem atstarpes no abiem virknes galiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"ru":{"t":"Разделение и объединение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Строки можно разбивать на части и соединять обратно несколькими способами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>words<\/code> разбивает строку на список слов, разделённых пробелами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>split<\/code> разбивает строку по выбранному вами разделителю:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Важный частный случай — разбиение по <strong>пустой строке<\/strong> <code>''<\/code>: оно разбивает строку на отдельные символы, но при этом добавляет пустую строку в самое начало и в самый конец, так что результат содержит на два элемента больше, чем вы могли бы ожидать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для разбиения на символы метод <code>comb<\/code>, вызванный без аргументов, делает это напрямую — без лишних пустых строк, которые нужно убирать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для обратного действия метод <code>join<\/code> склеивает список значений в одну строку, помещая разделитель между ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ещё два метода работают с частями строки.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>substr<\/code> извлекает фрагмент, принимая начальную позицию и, опционально, длину:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>trim<\/code> удаляет пробельные символы с обоих концов строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"uk":{"t":"Розбиття та з'єднання","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Рядки можна розбивати на частини й складати назад кількома способами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>words<\/code> розбиває рядок на список слів, розділених пробільними символами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>split<\/code> розбиває рядок за обраним вами роздільником:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Важливий окремий випадок — розбиття за <strong>порожнім р >say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>trim<\/code> forigas blankspacon de ambaŭ finoj de ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]},"la":{"t":"Dividendo et coniungendo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Chordae pluribus modis in partes frangi et retro coniungi possunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>words<\/code> chordam in indicem verborum spatio separatorum dividit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>split<\/code> chordam ad separatorem quem eligis frangit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Casus specialis notandus est divisio per <strong>chordam vacuam<\/strong> <code>''<\/code>: chordam in singulos characteres frangit, sed etiam chordam vacuam ad ipsum initium et ipsum finem inserit, itaque eventus duo elementa plus habet quam expectares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut in characteres dividas, methodus <code>comb<\/code>, sine argumentis vocata, hoc directe facit — sine vacuis residuis purgandis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut contrario modo procedas, methodus <code>join<\/code> indicem valorum in unam chordam conglutinat, separatorem inter eos ponens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Duae aliae methodi in partibus chordae operantur.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>substr<\/code> partem extrahit, data positione initiali et, optionaliter, longitudine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et <code>trim<\/code> spatia alba ab utrisque finibus chordae removet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]}}}</script>
