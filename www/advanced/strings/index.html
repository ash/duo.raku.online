//course.raku.org/ru/regexes/\" target=\"_blank\" rel=\"noopener\">регулярных выражений<\/a> — это отдельная большая тема, которая рассматривается в своей собственной части позже.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три метода изменяют регистр букв в строке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>flip<\/code> переворачивает символы строки в обратном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А оператор <code>x<\/code> повторяет строку заданное количество раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следующих темах показано, как искать внутри строк, а также как разделять их на части и соединять обратно.<\/span><\/p>"]]},"uk":{"t":"Рядки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви дізналися, <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">як будувати рядки<\/a> — конкатенація, інтерполяція та довжина рядка.<\/span> <span class=\"sg\" data-s=\"1\">Рядки також мають багатий набір методів.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ збирає найкорисніші з них. (Пошук за <a href=\"https://course.raku.org/uk/regexes/\" target=\"_blank\" rel=\"noopener\">регулярними виразами<\/a> — окрема, більша тема, розглянута далі у власній частині.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три методи змінюють регістр літер рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — верхній регістр\nsay 'RAKU'.lc; # raku  — нижній регістр\nsay 'raku'.tc; # Raku  — заголовний регістр (перша літера велика)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>flip<\/code> обертає символи рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А оператор <code>x<\/code> повторює рядок задану кількість разів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як шукати всередині рядків і як розбивати їх на частини та склеювати назад.<\/span><\/p>"]]},"bg":{"t":"Низове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" научихте <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">как да създавате низове<\/a> — конкатенация, интерполация и дължина на низ.<\/span> <span class=\"sg\" data-s=\"1\">Низовете също разполагат с богат набор от методи.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел събира най-полезните от тях. (Търсенето с <a href=\"https://course.raku.org/bg/regexes/\" target=\"_blank\" rel=\"noopener\">регулярни изрази<\/a> е отделна, по-голяма тема, разгледана в своя собствена част по-нататък.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три метода променят регистъра на буквите в низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>flip<\/code> обръща символите на низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А операторът <code>x<\/code> повтаря низ определен брой пъти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да търсите вътре в низове и как да ги разделяте на части и да ги съединявате обратно.<\/span><\/p>"]]},"la":{"t":"Catenae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium didicisti <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">quomodo chordas construas<\/a> — concatenationem, interpolationem, et longitudinem chordae.<\/span> <span class=\"sg\" data-s=\"1\">Chordae etiam divitem seriem methodorum portant.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio utilissimas colligit. (Quaerere cum <a href=\"/regexes/\">expressionibus regularibus<\/a> thema separatum et maius est, quod in sua parte postea tractatur.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tres methodi casum litterarum chordae mutant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>flip<\/code> characteres chordae invertit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et operator <code>x<\/code> chordam datum numerum vicium repetit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sequentia themata ostendunt quomodo intra chordas quaeras et quomodo eas in partes dividas et retro coniungas.<\/span><\/p>"]]}}}</script>
