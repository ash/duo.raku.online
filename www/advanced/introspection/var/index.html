<script type="application/json" id="page-data">{"u":"advanced/introspection/var","n":420,"k":"topic","pv":"advanced/introspection/what/quiz","nx":"advanced/introspection/who-how","tr":["advanced","advanced/introspection"],"L":{"en":{"t":"Using <code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> is a pseudo-method that returns the underlying container object.<\/span> <span class=\"sg\" data-s=\"1\">For a scalar variable, the <code>.VAR<\/code> call returns the <code>Scalar<\/code> container behind it.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Once you have the container, you can ask for the name of its class with <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> on the variable returns the type of the <em>value<\/em> (<code>Int<\/code> or <code>Str<\/code>), while <code>.VAR.^name<\/code> returns the type of the <em>container<\/em>, which is <code>Scalar<\/code> in both cases.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>default<\/code> method returns the default value of the container — what you get when the container holds nothing of its own.<\/span> <span class=\"sg\" data-s=\"1\">With the <code>is default<\/code> trait you set it explicitly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Without an explicit default, the default value is the container’s type.<\/span> <span class=\"sg\" data-s=\"1\">For an untyped container that is <code>Any<\/code>, regardless of what value it currently holds:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For a typed container it is the constraint type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>name<\/code> method returns the name of the container, including the sigil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Take care not to mix up <code>^name<\/code> (the type) and <code>name<\/code> (the variable’s own name).<\/span><\/p>"]]},"de":{"t":"<code>VAR<\/code> verwenden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> ist eine Pseudo-Methode, die das zugrunde liegende Container-Objekt zurückgibt.<\/span> <span class=\"sg\" data-s=\"1\">Bei einer skalaren Variable gibt der <code>.VAR<\/code>-Aufruf den dahinterliegenden <code>Scalar<\/code>-Container zurück.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sobald du den Container hast, kannst du mit <code>.^name<\/code> den Namen seiner Klasse abfragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> auf der Variable gibt den Typ des <em>Wertes<\/em> zurück (<code>Int<\/code> oder <code>Str<\/code>), während <code>.VAR.^name<\/code> den Typ des <em>Containers<\/em> zurückgibt, der in beiden Fällen <code>Scalar<\/code> ist.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die <code>default<\/code>-Methode gibt den Standardwert des Containers zurück — das, was du bekommst, wenn der Container nichts Eigenes enthält.<\/span> <span class=\"sg\" data-s=\"1\">Mit dem <code>is default<\/code>-Trait setzt du ihn explizit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne einen expliziten Standardwert ist der Standardwert der Typ des Containers.<\/span> <span class=\"sg\" data-s=\"1\">Bei einem nicht typisierten Container ist das <code>Any<\/code>, unabhängig davon, welcher Wert gerade gespeichert ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einem typisierten Container ist es der Constraint-Typ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <code>name<\/code>-Methode gibt den Namen des Containers zurück, einschließlich des Sigils:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Achte darauf, <code>^name<\/code> (den Typ) und <code>name<\/code> (den eigenen Namen der Variable) nicht zu verwechseln.<\/span><\/p>"]]},"nl":{"t":"<code>VAR<\/code> gebruiken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> is een pseudo-methode die het onderliggende containerobject teruggeeft.<\/span> <span class=\"sg\" data-s=\"1\">Voor een scalar variabele geeft de <code>.VAR<\/code>-aanroep de <code>Scalar<\/code>-container erachter terug.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zodra je de container hebt, kun je de naam van zijn klasse opvragen met <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> op de variabele geeft het type van de <em>waarde<\/em> terug (<code>Int<\/code> of <code>Str<\/code>), terwijl <code>.VAR.^name<\/code> het type van de <em>container<\/em> teruggeeft, dat in beide gevallen <code>Scalar<\/code> is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>default<\/code>-methode geeft de standaardwaarde van de container terug — wat je krijgt wanneer de container niets van zichzelf bevat.<\/span> <span class=\"sg\" data-s=\"1\">Met de <code>is default<\/code>-trait stel je dit expliciet in:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder een expliciete standaardwaarde is de standaardwaarde het type van de container.<\/span> <span class=\"sg\" data-s=\"1\">Voor een container zonder typebeperking is dat <code>Any<\/code>, ongeacht welke waarde hij momenteel bevat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een container met typebeperking is het het beperkingstype:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>name<\/code>-methode geeft de naam van de container terug, inclusief de sigil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pas op dat je <code>^name<\/code> (het type) en <code>name<\/code> (de eigen naam van de variabele) niet verwart.<\/span><\/p>"]]},"es":{"t":"Usando <code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> es un pseudo-método que devuelve el objeto contenedor subyacente.<\/span> <span class=\"sg\" data-s=\"1\">Para una variable escalar, la llamada <code>.VAR<\/code> devuelve el contenedor <code>Scalar<\/code> que hay detrás de ella.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una vez que tienes el contenedor, puedes preguntar por el nombre de su clase con <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> sobre la variable devuelve el tipo del <em>valor<\/em> (<code>Int<\/code> o <code>Str<\/code>), mientras que <code>.VAR.^name<\/code> devuelve el tipo del <em>contenedor<\/em>, que es <code>Scalar<\/code> en ambos casos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>default<\/code> devuelve el valor por defecto del contenedor, es decir, lo que obtienes cuando el contenedor no tiene nada propio.<\/span> <span class=\"sg\" data-s=\"1\">Con el trait <code>is default<\/code> lo estableces explícitamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin un valor por defecto explícito, el valor por defecto es el tipo del contenedor.<\/span> <span class=\"sg\" data-s=\"1\">Para un contenedor sin tipo, ese es <code>Any<\/code>, independientemente del valor que contenga actualmente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un contenedor con tipo, es el tipo de la restricción:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>name<\/code> devuelve el nombre del contenedor, incluyendo el sigil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ten cuidado de no confundir <code>^name<\/code> (el tipo) con <code>name<\/code> (el nombre propio de la variable).<\/span><\/p>"]]},"it":{"t":"Usare <code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> e uno pseudo-metodo che restituisce l'oggetto contenitore sottostante.<\/span> <span class=\"sg\" data-s=\"1\">Per una variabile scalare, la chiamata <code>.VAR<\/code> restituisce il contenitore <code>Scalar<\/code> che si trova dietro di essa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una volta ottenuto il contenitore, puoi chiedere il nome della sua classe con <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> sulla variabile restituisce il tipo del <em>valore<\/em> (<code>Int<\/code> o <code>Str<\/code>), mentre <code>.VAR.^name<\/code> restituisce il tipo del <em>contenitore<\/em>, che e <code>Scalar<\/code> in entrambi i casi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>default<\/code> restituisce il valore predefinito del contenitore, cioe quello che si ottiene quando il contenitore non contiene nulla di proprio.<\/span> <span class=\"sg\" data-s=\"1\">Con il trait <code>is default<\/code> lo si imposta esplicitamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza un valore predefinito esplicito, il valore predefinito e il tipo del contenitore.<\/span> <span class=\"sg\" data-s=\"1\">Per un contenitore non tipizzato e <code>Any<\/code>, indipendentemente dal valore che contiene attualmente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un contenitore tipizzato e il tipo del vincolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>name<\/code> restituisce il nome del contenitore, incluso il sigillo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fai attenzione a non confondere <code>^name<\/code> (il tipo) e <code>name<\/code> (il nome della variabile).<\/span><\/p>"]]},"lv":{"t":"<code>VAR<\/code> izmantošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> ir pseidometode, kas atgriež pamatā esošo konteinera objektu.<\/span> <span class=\"sg\" data-s=\"1\">Skalāram mainīgajam <code>.VAR<\/code> izsaukums atgriež <code>Scalar<\/code> konteineru, kas atrodas aiz tā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jums ir konteineris, varat noskaidrot tā klases nosaukumu ar <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> uz mainīgā atgriež <em>vērtības<\/em> tipu (<code>Int<\/code> vai <code>Str<\/code>), savukārt <code>.VAR.^name<\/code> atgriež <em>konteinera<\/em> tipu, kas abos gadījumos ir <code>Scalar<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode <code>default<\/code> atgriež konteinera noklusējuma vērtību — to, ko saņemat, kad konteineris pats neko nesatur.<\/span> <span class=\"sg\" data-s=\"1\">Ar iezīmi <code>is default<\/code> to var iestatīt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez norādīta noklusējuma noklusējuma vērtība ir konteinera tips.<\/span> <span class=\"sg\" data-s=\"1\">Netipizētam konteineram tā ir <code>Any<\/code>, neatkarīgi no tā, kāda vērtība tajā pašlaik glabājas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"]
