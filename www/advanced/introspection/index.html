<script type="application/json" id="page-data">{"u":"advanced/introspection","n":417,"k":"section","pv":"advanced/special-variables/exercises/topic-variable/solution","nx":"advanced/introspection/what","tr":["advanced"],"L":{"en":{"t":"Introspecting containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Introspection<\/em> means asking a value or a container about itself — its type, its underlying container, and the machinery behind it.<\/span> <span class=\"sg\" data-s=\"1\">You have already used one introspection tool, <code>.^name<\/code>, to print the type of a value.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku offers a small family of such tools, written in capital letters: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code>, and <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">They are sometimes called <em>pseudo-methods<\/em>, because the compiler gives them a special meaning rather than treating them as ordinary methods.<\/span> <span class=\"sg\" data-s=\"2\">This section looks at each of them.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">As a reminder, here is <code>.^name<\/code> reporting how the type of an untyped container changes as you store different values in it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The container starts as <code>Any<\/code> and then reports the type of whatever value it currently holds.<\/span><\/p>"]]},"de":{"t":"Introspektion von Containern","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Introspektion<\/em> bedeutet, einen Wert oder einen Container über sich selbst zu befragen — seinen Typ, seinen zugrunde liegenden Container und die Mechanismen dahinter.<\/span> <span class=\"sg\" data-s=\"1\">Du hast bereits ein Introspektionswerkzeug verwendet, <code>.^name<\/code>, um den Typ eines Wertes auszugeben.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku bietet eine kleine Familie solcher Werkzeuge, die in Großbuchstaben geschrieben werden: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> und <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie werden manchmal <em>Pseudo-Methoden<\/em> genannt, weil der Compiler ihnen eine besondere Bedeutung gibt, anstatt sie als gewöhnliche Methoden zu behandeln.<\/span> <span class=\"sg\" data-s=\"2\">In diesem Abschnitt schauen wir uns jede davon an.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zur Erinnerung: Hier zeigt <code>.^name<\/code>, wie sich der Typ eines nicht typisierten Containers ändert, wenn du verschiedene Werte darin speicherst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Container beginnt als <code>Any<\/code> und gibt dann den Typ des jeweils gespeicherten Wertes zurück.<\/span><\/p>"]]},"nl":{"t":"Containers introspecteren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Introspectie<\/em> betekent dat je een waarde of een container vraagt over zichzelf — zijn type, zijn onderliggende container en het mechanisme erachter.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt al één introspectietool gebruikt, <code>.^name<\/code>, om het type van een waarde af te drukken.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku biedt een kleine familie van zulke tools, geschreven in hoofdletters: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> en <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze worden soms <em>pseudo-methodes<\/em> genoemd, omdat de compiler ze een speciale betekenis geeft in plaats van ze als gewone methodes te behandelen.<\/span> <span class=\"sg\" data-s=\"2\">Dit gedeelte bekijkt ze allemaal.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ter herinnering: hier rapporteert <code>.^name<\/code> hoe het type van een container zonder typebeperking verandert als je er verschillende waarden in opslaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De container begint als <code>Any<\/code> en rapporteert vervolgens het type van de waarde die hij op dat moment bevat.<\/span><\/p>"]]},"es":{"t":"Introspección de contenedores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La <em>introspección<\/em> consiste en preguntarle a un valor o a un contenedor sobre sí mismo: su tipo, su contenedor subyacente y el mecanismo que hay detrás.<\/span> <span class=\"sg\" data-s=\"1\">Ya has utilizado una herramienta de introspección, <code>.^name<\/code>, para imprimir el tipo de un valor.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ofrece una pequeña familia de estas herramientas, escritas en letras mayúsculas: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> y <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A veces se les llama <em>pseudo-métodos<\/em>, porque el compilador les da un significado especial en lugar de tratarlos como métodos ordinarios.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección examina cada uno de ellos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como recordatorio, aquí tienes <code>.^name<\/code> mostrando cómo cambia el tipo de un contenedor sin tipo a medida que almacenas diferentes valores en él:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El contenedor comienza como <code>Any<\/code> y luego reporta el tipo del valor que contiene en ese momento.<\/span><\/p>"]]},"it":{"t":"Introspezione dei contenitori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'<em>introspezione<\/em> consiste nel chiedere a un valore o a un contenitore informazioni su se stesso: il suo tipo, il contenitore sottostante e il meccanismo che lo supporta.<\/span> <span class=\"sg\" data-s=\"1\">Hai gia utilizzato uno strumento di introspezione, <code>.^name<\/code>, per stampare il tipo di un valore.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku offre una piccola famiglia di tali strumenti, scritti in lettere maiuscole: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> e <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vengono talvolta chiamati <em>pseudo-metodi<\/em>, perche il compilatore attribuisce loro un significato speciale invece di trattarli come metodi ordinari.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione esamina ciascuno di essi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come promemoria, ecco <code>.^name<\/code> che mostra come il tipo di un contenitore non tipizzato cambia quando vi si memorizzano valori diversi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il contenitore inizia come <code>Any<\/code> e poi riporta il tipo del valore che contiene in quel momento.<\/span><\/p>"]]},"lv":{"t":"Konteineru introspekcija","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Introspekcija<\/em> nozīmē jautāt vērtībai vai konteineram par sevi — par tā tipu, pamatā esošo konteineru un mehānismu aiz tā.<\/span> <span class=\"sg\" data-s=\"1\">Jūs jau esat izmantojuši vienu introspekcijas rīku, <code>.^name<\/code>, lai izdrukātu vērtības tipu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku piedāvā nelielu šādu rīku saimi, kas rakstīti ar lielajiem burtiem: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> un <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tos dažreiz sauc par <em>pseidometodēm<\/em>, jo kompilators tiem piešķir īpašu nozīmi, nevis apstrādā tos kā parastas metodes.<\/span> <span class=\"sg\" data-s=\"2\">Šajā sadaļā aplūkosim katru no tiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atgādinājumam — šeit <code>.^name<\/code> parāda, kā netipizēta konteinera tips mainās, kad tajā saglabājat dažādas vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konteineris sākas kā <code>Any<\/code> un pēc tam norāda tā tipa nosaukumu, kāda vērtība tajā pašlaik glabājas.<\/span><\/p>"]]},"ru":{"t":"Интроспекция с помощью МОП","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Интроспекция<\/em> — это когда у значения или контейнера запрашивается информация о нём самом: его тип, его контейнер и внутреннее устройство.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже использовали один инструмент интроспекции — <code>.^name<\/code> — для вывода типа значения.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku предлагает небольшое семейство таких инструментов, записываемых заглавными буквами: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> и <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Их иногда называют <em>псевдо-методами<\/em>, потому что компилятор придаёт им особое значение, а не обрабатывает как обычные методы.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе рассматривается каждый из них.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для напоминания, вот <code>.^name<\/code>, показывающий, как тип нетипизированного контейнера меняется при сохранении различных значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Контейнер начинает как <code>Any<\/code>, а затем показывает тип хранимого в данный момент значения.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція контейнерів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Інтроспекція<\/em> означає розпитування значення чи контейнера про нього самого — про його тип, про контейнер, що лежить в основі, та про механізми за ним.<\/span> <span class=\"sg\" data-s=\"1\">Одним інструментом інтроспекції, <code>.^name<\/code>, ви вже користувалися, щоб виводити тип значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku пропонує невелику родину таких інструментів, записаних великими літерами: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> та <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Їх іноді називають <em>псевдометодами<\/em>, бо компілятор надає їм особливого значення, а не розглядає як звичайні методи.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ розглядає кожен із них.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для нагадування, ось як <code>.^name<\/code> повідомляє, як змінюється тип нетипізованого контейнера, коли ви зберігаєте в ньому різні значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Контейнер починає з <code>Any<\/code>, а потім повідомляє тип того значення, яке зараз містить.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Интроспекция<\/em> означава да попитате стойност или контейнер за самия него — неговия тип, основния му контейнер и механизмите зад него.<\/span> <span class=\"sg\" data-s=\"1\">Вече сте използвали един инструмент за интроспекция — <code>.^name<\/code>, за да отпечатате типа на стойност.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku предлага малко семейство от такива инструменти, написани с главни букви: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> и <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те понякога се наричат <em>псевдо-методи<\/em>, защото компилаторът им придава специално значение, вместо да ги третира като обикновени методи.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел разглежда всеки от тях.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Като напомняне, ето как <code>.^name<\/code> докладва как типът на нетипизиран контейнер се променя, когато съхранявате различни стойности в него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Контейнерът започва като <code>Any<\/code> и след това докладва типа на стойността, която в момента съдържа.<\/span><\/p>"]]},"eo":{"t":"Introspekto de ujoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Introspekto<\/em> signifas demandi valoron au ujon pri si mem -- pri sia tipo, sia subesta ujo, kaj la mekanismo malantau ghi.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam uzis unu introspektan ilon, <code>.^name<\/code>, por presi la tipon de valoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ofertas malgrandan familion de tiaj iloj, skribitaj per majusklaj literoj: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code>, kaj <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas foje nomataj <em>pseudo-metodoj<\/em>, char la kompililo donas al ili specialan signifon anstatau trakti ilin kiel ordinarajn metodojn.<\/span> <span class=\"sg\" data-s=\"2\">Chi tiu sekcio rigardas chiun el ili.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiel rememorigilo, jen <code>.^name<\/code> raportanta kiel la tipo de netipigita ujo shangighas kiam vi konservas malsamajn valorojn en ghi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La ujo komencas kiel <code>Any<\/code> kaj poste raportas la tipon de kiu ajn valoro ghi aktuale enhavas.<\/span><\/p>"]]},"la":{"t":"Introspectio receptaculorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Introspectio<\/em> significat valorem vel receptaculum de se ipso interrogare — de typo suo, de receptaculo subiacente, et de mechanismo post id.<\/span> <span class=\"sg\" data-s=\"1\">Iam uno instrumento introspectionis usus es, <code>.^name<\/code>, ad typum valoris imprimendum.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku parvam familiam talium instrumentorum offert, litteris maiusculis scriptorum: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code>, et <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Interdum <em>pseudo-methodi<\/em> vocantur, quia compilator eis significationem specialem dat potius quam eas ut methodos ordinarias tractet.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio unumquodque eorum inspicit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut recordatio, hic est <code>.^name<\/code> referens quomodo typus receptaculi sine typo definito mutatur dum diversos valores in eo condis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Receptaculum incipit ut <code>Any<\/code> et deinde typum cuiuscumque valoris quem nunc continet refert.<\/span><\/p>"]]}}}</script>
