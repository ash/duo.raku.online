<script type="application/json" id="page-data">{"u":"advanced/introspection/what","n":418,"k":"topic","pv":"advanced/introspection","nx":"advanced/introspection/what/quiz","tr":["advanced","advanced/introspection"],"L":{"en":{"t":"Using <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> is a pseudo-method that gives access to the type of a value.<\/span> <span class=\"sg\" data-s=\"1\">You can use it in much the same way as <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The two print the type with a minor difference in decoration: <code>.^name<\/code> gives the bare name, while <code>WHAT<\/code> shows the type object, written in parentheses:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For a variable without a type constraint, the type starts as <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">As soon as you assign a value, both <code>^name<\/code> and <code>WHAT<\/code> follow the type of the stored value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With a type constraint, the type is known immediately, even before anything is assigned:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparing type objects<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because <code>WHAT<\/code> returns the type object itself, you can compare two of them with the <em>value identity<\/em> operator <code>===<\/code>, which asks whether both sides are the very same value.<\/span> <span class=\"sg\" data-s=\"1\">There is only ever one type object per type, so this is a clean way to test whether two values share a type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unlike <code>==<\/code>, which compares numbers, <code>===<\/code> compares identity, so it works for type objects (and other values) directly.<\/span><\/p>"]]},"de":{"t":"<code>WHAT<\/code> verwenden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> ist eine Pseudo-Methode, die Zugriff auf den Typ eines Wertes gibt.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst sie auf ähnliche Weise wie <code>.^name<\/code> verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide geben den Typ aus, mit einem kleinen Unterschied in der Darstellung: <code>.^name<\/code> liefert den reinen Namen, während <code>WHAT<\/code> das Typ-Objekt anzeigt, das in Klammern geschrieben wird:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bei einer Variable ohne Typ-Constraint beginnt der Typ als <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sobald du einen Wert zuweist, folgen sowohl <code>^name<\/code> als auch <code>WHAT<\/code> dem Typ des gespeicherten Wertes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit einem Typ-Constraint ist der Typ sofort bekannt, noch bevor etwas zugewiesen wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Typ-Objekte vergleichen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da <code>WHAT<\/code> das Typ-Objekt selbst zurückgibt, kannst du zwei davon mit dem <em>Wertidentitäts<\/em>-Operator <code>===<\/code> vergleichen, der prüft, ob beide Seiten exakt derselbe Wert sind.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt immer nur ein Typ-Objekt pro Typ, daher ist dies eine saubere Methode, um zu testen, ob zwei Werte denselben Typ haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Im Gegensatz zu <code>==<\/code>, das Zahlen vergleicht, vergleicht <code>===<\/code> die Identität, sodass es direkt mit Typ-Objekten (und anderen Werten) funktioniert.<\/span><\/p>"]]},"nl":{"t":"<code>WHAT<\/code> gebruiken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> is een pseudo-methode die toegang geeft tot het type van een waarde.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het op vrijwel dezelfde manier gebruiken als <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De twee drukken het type af met een klein verschil in weergave: <code>.^name<\/code> geeft de kale naam, terwijl <code>WHAT<\/code> het type object toont, geschreven tussen haakjes:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voor een variabele zonder typebeperking begint het type als <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zodra je een waarde toewijst, volgen zowel <code>^name<\/code> als <code>WHAT<\/code> het type van de opgeslagen waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met een typebeperking is het type direct bekend, zelfs voordat er iets is toegewezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Type objects vergelijken<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>WHAT<\/code> het type object zelf teruggeeft, kun je er twee vergelijken met de <em>waarde-identiteit<\/em>-operator <code>===<\/code>, die vraagt of beide kanten exact dezelfde waarde zijn.<\/span> <span class=\"sg\" data-s=\"1\">Er is altijd maar één type object per type, dus dit is een nette manier om te testen of twee waarden hetzelfde type delen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anders dan <code>==<\/code>, dat getallen vergelijkt, vergelijkt <code>===<\/code> identiteit, dus het werkt direct voor type objects (en andere waarden).<\/span><\/p>"]]},"es":{"t":"Usando <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> es un pseudo-método que da acceso al tipo de un valor.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usarlo de manera similar a <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambos imprimen el tipo con una pequeña diferencia en la presentación: <code>.^name<\/code> da el nombre sin adornos, mientras que <code>WHAT<\/code> muestra el objeto de tipo, escrito entre paréntesis:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para una variable sin restricción de tipo, el tipo comienza como <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tan pronto como asignas un valor, tanto <code>^name<\/code> como <code>WHAT<\/code> siguen el tipo del valor almacenado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con una restricción de tipo, el tipo se conoce inmediatamente, incluso antes de que se asigne algo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparando objetos de tipo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dado que <code>WHAT<\/code> devuelve el objeto de tipo en sí, puedes comparar dos de ellos con el operador de <em>identidad de valor<\/em> <code>===<\/code>, que pregunta si ambos lados son exactamente el mismo valor.<\/span> <span class=\"sg\" data-s=\"1\">Solo existe un objeto de tipo por cada tipo, así que esta es una forma limpia de comprobar si dos valores comparten un tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A diferencia de <code>==<\/code>, que compara números, <code>===<\/code> compara identidad, por lo que funciona directamente con objetos de tipo (y otros valores).<\/span><\/p>"]]},"it":{"t":"Usare <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> e uno pseudo-metodo che fornisce accesso al tipo di un valore.<\/span> <span class=\"sg\" data-s=\"1\">Puoi usarlo in modo molto simile a <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entrambi stampano il tipo con una piccola differenza nella presentazione: <code>.^name<\/code> restituisce il nome semplice, mentre <code>WHAT<\/code> mostra l'oggetto tipo, scritto tra parentesi:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per una variabile senza vincolo di tipo, il tipo inizia come <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non appena si assegna un valore, sia <code>^name<\/code> che <code>WHAT<\/code> seguono il tipo del valore memorizzato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con un vincolo di tipo, il tipo e noto immediatamente, anche prima di qualsiasi assegnazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Confrontare oggetti tipo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiche <code>WHAT<\/code> restituisce l'oggetto tipo stesso, e possibile confrontarne due con l'operatore di <em>identita di valore<\/em> <code>===<\/code>, che verifica se entrambi i lati sono esattamente lo stesso valore.<\/span> <span class=\"sg\" data-s=\"1\">Esiste un solo oggetto tipo per ogni tipo, quindi questo e un modo pulito per verificare se due valori condividono lo stesso tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A differenza di <code>==<\/code>, che confronta numeri, <code>===<\/code> confronta l'identita, quindi funziona direttamente con gli oggetti tipo (e altri valori).<\/span><\/p>"]]},"lv":{"t":"<code>WHAT<\/code> izmantošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> ir pseidometode, kas nodrošina piekļuvi vērtības tipam.<\/span> <span class=\"sg\" data-s=\"1\">To var izmantot līdzīgi kā <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abi izdrukā tipu ar nelielu atšķirību noformējumā: <code>.^name<\/code> dod tīru nosaukumu, savukārt <code>WHAT<\/code> parāda tipa objektu, ierakstītu iekavās:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgajam bez tipa ierobežojuma tips sākas kā <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz piešķirat vērtību, gan <code>^name<\/code>, gan <code>WHAT<\/code> seko saglabātās vērtības tipam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar tipa ierobežojumu tips ir zināms uzreiz, pat pirms kaut kas ir piešķirts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Tipa objektu salīdzināšana<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>WHAT<\/code> atgriež pašu tipa objektu, divus no tiem var salīdzināt ar <em>vērtības identitātes<\/em> operatoru <code>===<\/code>, kas pārbauda, vai abas puses ir viena un tā pati vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Katram tipam pastāv tikai viens tipa objekts, tāpēc šis ir tīrs veids, kā pārbaudīt, vai divām vērtībām ir vienāds tips:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — abi ir Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atšķirībā no <code>==<\/code>, kas salīdzina skaitļus, <code>===<\/code> salīdzina identitāti, tāpēc tas darbojas tieši ar tipa objektiem (un citām vērtībām).<\/span><\/p>"]]},"ru":{"t":"<code>WHAT<\/code> и <code>^name<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> — это псевдо-метод, который даёт доступ к типу значения.<\/span> <span class=\"sg\" data-s=\"1\">Его можно использовать так же, как <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оба выводят тип с небольшим отличием в оформлении: <code>.^name<\/code> даёт голое имя, а <code>WHAT<\/code> показывает объект типа, заключённый в скобки:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для переменной без ограничения типа тип начинается как <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Как только вы присвоите значение, и <code>^name<\/code>, и <code>WHAT<\/code> следуют за типом хранимого значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При наличии ограничения типа тип известен сразу, ещё до присвоения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сравнение объектов типов<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поскольку <code>WHAT<\/code> возвращает сам объект типа, два таких объекта можно сравнить оператором <em>тождества значений<\/em> <code>===<\/code>, который проверяет, являются ли обе стороны одним и тем же значением.<\/span> <span class=\"sg\" data-s=\"1\">Для каждого типа существует ровно один объект типа, поэтому это удобный способ проверить, имеют ли два значения одинаковый тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В отличие от <code>==<\/code>, который сравнивает числа, <code>===<\/code> сравнивает тождественность, поэтому он работает с объектами типов (и другими значениями) напрямую.<\/span><\/p>"]]},"uk":{"t":"Використання <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> — це псевдометод, що дає доступ до типу значення.<\/span> <span class=\"sg\" data-s=\"1\">Використовувати його можна майже так само, як <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва виводять тип із невеликою різницею в оформленні: <code>.^name<\/code> дає голе ім'я, а <code>WHAT<\/code> показує об'єкт типу, записаний у дужках:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для змінної без обмеження типу тип починається з <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щойно ви присвоюєте значення, і <code>^name<\/code>, і <code>WHAT<\/code> слідують за типом збереженого значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З обмеженням типу тип відомий одразу, ще до того, як щось присвоєно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Порівняння об'єктів типу<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>WHAT<\/code> повертає сам об'єкт типу, два таких об'єкти можна порівняти оператором <em>тотожності значень<\/em> <code>===<\/code>, який запитує, чи є обидві сторони тим самим значенням.<\/span> <span class=\"sg\" data-s=\"1\">Для кожного типу існує лише один об'єкт типу, тож це чистий спосіб перевірити, чи мають два значення спільний тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — обидва Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На відміну від <code>==<\/code>, який порівнює числа, <code>===<\/code> порівнює тотожність, тож він працює безпосередньо з об'єктами типу (та іншими значеннями).<\/span><\/p>"]]},"bg":{"t":"Използване на <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> е псевдо-метод, който дава достъп до типа на стойност.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го използвате по подобен начин като <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двете отпечатват типа с малка разлика в оформлението: <code>.^name<\/code> дава голото име, докато <code>WHAT<\/code> показва типовия обект, написан в скоби:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За променлива без ограничение на типа, типът започва като <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Веднага след като присвоите стойност, и <code>^name<\/code>, и <code>WHAT<\/code> следват типа на съхранената стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С ограничение на типа, типът е известен веднага, дори преди да е присвоено нещо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сравняване на типови обекти<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тъй като <code>WHAT<\/code> връща самия типов обект, можете да сравните два от тях с оператора за <em>идентичност на стойности<\/em> <code>===<\/code>, който пита дали двете страни са абсолютно една и съща стойност.<\/span> <span class=\"sg\" data-s=\"1\">Има само един типов обект за всеки тип, така че това е чист начин да проверите дали две стойности споделят тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За разлика от <code>==<\/code>, който сравнява числа, <code>===<\/code> сравнява идентичност, така че работи директно с типови обекти (и други стойности).<\/span><\/p>"]]},"eo":{"t":"Uzante <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> estas pseudo-metodo kiu donas aliron al la tipo de valoro.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ghin tre simile al <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambau presas la tipon kun malgranda diferenco en prezento: <code>.^name<\/code> donas la nudan nomon, dum <code>WHAT<\/code> montras la tip-objekton, skribitan en krampoj:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por variablo sen tiplimigo, la tipo komencas kiel <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tuj kiam vi atribuas valoron, ambau <code>^name<\/code> kaj <code>WHAT<\/code> sekvas la tipon de la konservita valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun tiplimigo, la tipo estas konata tuj, ech antau ol io ajn estas atribuita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komparado de tip-objektoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Char <code>WHAT<\/code> redonas la tip-objekton mem, vi povas kompari du el ili per la operatoro de <em>valor-identeco<\/em> <code>===<\/code>, kiu demandas chu ambau flankoj estas ghuste la sama valoro.<\/span> <span class=\"sg\" data-s=\"1\">Ekzistas chiam nur unu tip-objekto por chiu tipo, do tio estas pura maniero testi chu du valoroj havas la saman tipon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Male al <code>==<\/code>, kiu komparas nombrojn, <code>===<\/code> komparas identecon, do ghi funkcias por tip-objektoj (kaj aliaj valoroj) rekte.<\/span><\/p>"]]},"la":{"t":"Utendo <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> est pseudo-methodus quae accessum ad typum valoris praebet.<\/span> <span class=\"sg\" data-s=\"1\">Eam eodem modo quo <code>.^name<\/code> uti potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duo typum imprimunt cum minore differentia in forma: <code>.^name<\/code> nomen nudum dat, dum <code>WHAT<\/code> objectum typi ostendit, in parenthesibus scriptum:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro variabili sine restrictione typi, typus incipit ut <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Statim ac valorem assignas, tam <code>^name<\/code> quam <code>WHAT<\/code> typum valoris conditi sequuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum restrictione typi, typus statim notus est, etiam antequam quidquam assignatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparatio objectorum typi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quia <code>WHAT<\/code> ipsum objectum typi reddit, duo eorum cum operatore <em>identitatis valoris<\/em> <code>===<\/code> comparare potes, qui interrogat an ambo latera idem valor sint.<\/span> <span class=\"sg\" data-s=\"1\">Unum tantum objectum typi per typum exsistit, ergo hic est modus purus ad probandum an duo valores typum communicent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dissimilis <code>==<\/code>, qui numeros comparat, <code>===<\/code> identitatem comparat, ergo directe pro objectis typi (et aliis valoribus) operatur.<\/span><\/p>"]]}}}</script>
