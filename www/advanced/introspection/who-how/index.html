<script type="application/json" id="page-data">{"u":"advanced/introspection/who-how","n":421,"k":"topic","pv":"advanced/introspection/var","nx":"advanced/introspection/exercises","tr":["advanced","advanced/introspection"],"L":{"en":{"t":"<code>WHO<\/code> and <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Two more introspection tools complete the set: <code>HOW<\/code> and <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Every value in Raku is backed by a <em>metaobject<\/em> — an object that knows how the value’s type works.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (short for <em>Higher Order Workings<\/em>) returns that metaobject:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You have been using the metaobject all along, perhaps without noticing.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.^<\/code> in <code>.^name<\/code> is a method call routed through <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">These two lines are equivalent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So <code>$x.^name<\/code> is just a shorter way of writing <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Notice that the object is passed in again as an argument: the metaobject is <em>shared<\/em> by every value of the type, so a meta-method is told which object it is being asked about.<\/span> <span class=\"sg\" data-s=\"2\">The <code>.^<\/code> form does this for you automatically. (For <code>name<\/code> the argument happens to be ignored, but passing it is the correct, general form — some meta-methods do use it.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same applies to other meta-methods you may meet, such as <code>.^methods<\/code>, which lists the methods a value responds to.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> returns the <em>package<\/em> that a name belongs to — the table of symbols defined in that namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>Stash<\/code> (a symbol-table hash) becomes useful when you work with modules, where it lets you look up the names a module defines.<\/span> <span class=\"sg\" data-s=\"1\">We will return to it in <a href=\"/advanced/module-introspection/\">the section about modules<\/a>; for now, it is enough to know that <code>WHO<\/code> exists and what it represents.<\/span><\/p>"]]},"de":{"t":"<code>WHO<\/code> und <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zwei weitere Introspektionswerkzeuge vervollständigen die Reihe: <code>HOW<\/code> und <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jeder Wert in Raku wird von einem <em>Metaobjekt<\/em> gestützt — einem Objekt, das weiß, wie der Typ des Wertes funktioniert.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (kurz für <em>Higher Order Workings<\/em>) gibt dieses Metaobjekt zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du hast das Metaobjekt die ganze Zeit verwendet, vielleicht ohne es zu bemerken.<\/span> <span class=\"sg\" data-s=\"1\">Das <code>.^<\/code> in <code>.^name<\/code> ist ein Methodenaufruf, der über <code>HOW<\/code> geleitet wird.<\/span> <span class=\"sg\" data-s=\"2\">Diese beiden Zeilen sind gleichwertig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$x.^name<\/code> ist also nur eine kürzere Schreibweise für <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beachte, dass das Objekt erneut als Argument übergeben wird: Das Metaobjekt wird von jedem Wert des Typs <em>gemeinsam genutzt<\/em>, daher wird einer Meta-Methode mitgeteilt, nach welchem Objekt gefragt wird.<\/span> <span class=\"sg\" data-s=\"2\">Die <code>.^<\/code>-Form erledigt das automatisch für dich. (Bei <code>name<\/code> wird das Argument zufällig ignoriert, aber es zu übergeben ist die korrekte, allgemeine Form — einige Meta-Methoden verwenden es tatsächlich.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dasselbe gilt für andere Meta-Methoden, die dir begegnen können, wie <code>.^methods<\/code>, die die Methoden auflistet, auf die ein Wert reagiert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> gibt das <em>Paket<\/em> zurück, zu dem ein Name gehört — die Symboltabelle, die in diesem Namensraum definiert ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Stash<\/code> (ein Symboltabellen-Hash) wird nützlich, wenn du mit Modulen arbeitest, da er dir ermöglicht, die Namen nachzuschlagen, die ein Modul definiert.<\/span> <span class=\"sg\" data-s=\"1\">Wir kommen darauf im <a href=\"https://course.raku.org/de/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Modul-Introspektion<\/a> zurück; für den Moment reicht es zu wissen, dass <code>WHO<\/code> existiert und was es darstellt.<\/span><\/p>"]]},"nl":{"t":"<code>WHO<\/code> en <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Twee extra introspectietools maken de set compleet: <code>HOW<\/code> en <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke waarde in Raku wordt ondersteund door een <em>metaobject<\/em> — een object dat weet hoe het type van de waarde werkt.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (afkorting van <em>Higher Order Workings<\/em>) geeft dat metaobject terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je hebt het metaobject al die tijd gebruikt, misschien zonder het te merken.<\/span> <span class=\"sg\" data-s=\"1\">De <code>.^<\/code> in <code>.^name<\/code> is een methode-aanroep die via <code>HOW<\/code> wordt gerouteerd.<\/span> <span class=\"sg\" data-s=\"2\">Deze twee regels zijn equivalent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dus <code>$x.^name<\/code> is gewoon een kortere manier om <code>$x.HOW.name($x)<\/code> te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Merk op dat het object opnieuw als argument wordt meegegeven: het metaobject wordt <em>gedeeld<\/em> door elke waarde van het type, dus een meta-methode krijgt te horen over welk object het gaat.<\/span> <span class=\"sg\" data-s=\"2\">De <code>.^<\/code>-vorm doet dit automatisch voor je. (Voor <code>name<\/code> wordt het argument toevallig genegeerd, maar het meegeven ervan is de correcte, algemene vorm — sommige meta-methodes gebruiken het wel.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde geldt voor andere meta-methodes die je kunt tegenkomen, zoals <code>.^methods<\/code>, die de methodes opsomt waarop een waarde reageert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> geeft het <em>package<\/em> terug waartoe een naam behoort — de tabel met symbolen die in die namespace zijn gedefinieerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>Stash<\/code> (een symbooltabel-hash) wordt nuttig wanneer je met modules werkt, waar het je de namen laat opzoeken die een module definieert.<\/span> <span class=\"sg\" data-s=\"1\">We komen er op terug in <a href=\"https://course.raku.org/nl/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">het gedeelte over modules<\/a>; voor nu is het voldoende om te weten dat <code>WHO<\/code> bestaat en wat het vertegenwoordigt.<\/span><\/p>"]]},"es":{"t":"<code>WHO<\/code> y <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dos herramientas de introspección más completan el conjunto: <code>HOW<\/code> y <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada valor en Raku está respaldado por un <em>metaobjeto<\/em>, un objeto que sabe cómo funciona el tipo del valor.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (abreviatura de <em>Higher Order Workings<\/em>) devuelve ese metaobjeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Has estado usando el metaobjeto todo el tiempo, quizás sin darte cuenta.<\/span> <span class=\"sg\" data-s=\"1\">El <code>.^<\/code> en <code>.^name<\/code> es una llamada a método que se enruta a través de <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Estas dos líneas son equivalentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Así que <code>$x.^name<\/code> es simplemente una forma más corta de escribir <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Observa que el objeto se pasa de nuevo como argumento: el metaobjeto es <em>compartido<\/em> por cada valor del tipo, así que a un meta-método se le indica sobre qué objeto se le está preguntando.<\/span> <span class=\"sg\" data-s=\"2\">La forma <code>.^<\/code> hace esto automáticamente. (Para <code>name<\/code>, el argumento se ignora, pero pasarlo es la forma correcta y general; algunos meta-métodos sí lo utilizan.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo mismo aplica a otros meta-métodos que puedas encontrar, como <code>.^methods<\/code>, que lista los métodos a los que un valor responde.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> devuelve el <em>paquete<\/em> al que pertenece un nombre, es decir, la tabla de símbolos definidos en ese espacio de nombres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>Stash<\/code> (un hash de tabla de símbolos) se vuelve útil cuando trabajas con módulos, donde te permite buscar los nombres que un módulo define.<\/span> <span class=\"sg\" data-s=\"1\">Volveremos a esto en <a href=\"https://course.raku.org/es/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">la sección sobre módulos<\/a>; por ahora, es suficiente saber que <code>WHO<\/code> existe y qué representa.<\/span><\/p>"]]},"it":{"t":"<code>WHO<\/code> e <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Altri due strumenti di introspezione completano l'insieme: <code>HOW<\/code> e <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni valore in Raku e supportato da un <em>metaoggetto<\/em>, un oggetto che sa come funziona il tipo del valore.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (abbreviazione di <em>Higher Order Workings<\/em>) restituisce quel metaoggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hai utilizzato il metaoggetto sin dall'inizio, forse senza rendertene conto.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>.^<\/code> in <code>.^name<\/code> e una chiamata di metodo instradata attraverso <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Queste due righe sono equivalenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>$x.^name<\/code> e semplicemente un modo piu breve di scrivere <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che l'oggetto viene passato nuovamente come argomento: il metaoggetto e <em>condiviso<\/em> da ogni valore del tipo, quindi a un meta-metodo viene indicato su quale oggetto viene interrogato.<\/span> <span class=\"sg\" data-s=\"2\">La forma <code>.^<\/code> lo fa automaticamente. (Per <code>name<\/code> l'argomento viene ignorato, ma passarlo e la forma corretta e generale: alcuni meta-metodi lo utilizzano effettivamente.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo stesso vale per altri meta-metodi che potresti incontrare, come <code>.^methods<\/code>, che elenca i metodi a cui un valore risponde.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> restituisce il <em>package<\/em> a cui un nome appartiene, ovvero la tabella dei simboli definiti in quel namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uno <code>Stash<\/code> (un hash della tabella dei simboli) diventa utile quando si lavora con i moduli, dove permette di cercare i nomi definiti da un modulo.<\/span> <span class=\"sg\" data-s=\"1\">Torneremo su questo argomento nella <a href=\"https://course.raku.org/it/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sezione sui moduli<\/a>; per ora e sufficiente sapere che <code>WHO<\/code> esiste e cosa rappresenta.<\/span><\/p>"]]},"lv":{"t":"<code>WHO<\/code> un <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl divi introspekcijas rīki papildina kopu: <code>HOW<\/code> un <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrai vērtībai Raku ir <em>metaobjekts<\/em> — objekts, kas zina, kā šīs vērtības tips darbojas.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (saīsinājums no <em>Higher Order Workings<\/em>) atgriež šo metaobjektu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs esat izmantojuši metaobjektu visu laiku, iespējams, to nepamanot.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> izsaukumā <code>.^name<\/code> ir metodes izsaukums, kas tiek maršrutēts caur <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šīs divas rindas ir ekvivalentas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>$x.^name<\/code> ir tikai īsāks veids, kā uzrakstīt <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka objekts tiek padots vēlreiz kā arguments: metaobjekts ir <em>kopīgs<\/em> visām tipa vērtībām, tāpēc metametodei tiek norādīts, par kuru objektu tā tiek jautāta.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^<\/code> forma to dara automātiski. (Metodes <code>name<\/code> gadījumā arguments tiek ignorēts, bet tā padošana ir pareizā, vispārīgā forma — dažas metametodes to izmanto.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas pats attiecas uz citām metametodēm, kuras jūs varat sastapt, piemēram, <code>.^methods<\/code>, kas uzskaita metodes, uz kurām vērtība reaģē.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> atgriež <em>pakotni<\/em>, kurai nosaukums pieder — simbolu tabulu, kas definēta šajā vārdtelpā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> (simbolu tabulas heš) kļūst noderīgs, kad strādājat ar moduļiem, kur tas ļauj atrast moduļa definētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"1\">Mēs pie tā atgriezīsimies <a href=\"https://course.raku.org/lv/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sadaļā par moduļiem<\/a>; pagaidām pietiek zināt, ka <code>WHO<\/code> pastāv un ko tas apzīmē.<\/span><\/p>"]]},"ru":{"t":"<code>WHO<\/code> и <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Два дополнительных инструмента интроспекции завершают набор: <code>HOW<\/code> и <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждое значение в Raku поддерживается <em>метаобъектом<\/em> — объектом, который знает, как работает тип данного значения.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (сокращение от <em>Higher Order Workings<\/em>) возвращает этот метаобъект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы пользовались метаобъектом всё это время, возможно, не замечая.<\/span> <span class=\"sg\" data-s=\"1\">Точка <code>.^<\/code> в <code>.^name<\/code> — это вызов метода, направленный через <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эти две строки эквивалентны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Таким образом, <code>$x.^name<\/code> — это просто более короткая запись <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что объект передаётся повторно в качестве аргумента: метаобъект <em>общий<\/em> для всех значений данного типа, поэтому мета-методу сообщается, о каком объекте идёт запрос.<\/span> <span class=\"sg\" data-s=\"2\">Форма <code>.^<\/code> делает это автоматически. (Для <code>name<\/code> аргумент игнорируется, но его передача — это правильная, общая форма — некоторые мета-методы используют его.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">То же самое относится к другим мета-методам, которые вам могут встретиться, таким как <code>.^methods<\/code>, который перечисляет методы, на которые отвечает значение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> возвращает <em>пакет<\/em>, к которому принадлежит имя — таблицу символов, определённых в данном пространстве имён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> (хеш таблицы символов) становится полезным при работе с модулями, где он позволяет искать имена, определённые модулем.<\/span> <span class=\"sg\" data-s=\"1\">Мы вернёмся к нему в <a href=\"https://course.raku.org/ru/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">разделе об интроспекции модулей<\/a>; пока достаточно знать, что <code>WHO<\/code> существует и что он представляет.<\/span><\/p>"]]},"uk":{"t":"<code>WHO<\/code> та <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще два інструменти інтроспекції довершують набір: <code>HOW<\/code> і <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За кожним значенням у Raku стоїть <em>метаоб'єкт<\/em> — об'єкт, який знає, як влаштований тип цього значення.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (скорочення від <em>Higher Order Workings<\/em>) повертає цей метаоб'єкт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви користувалися метаоб'єктом увесь цей час, можливо, того не помічаючи.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> у <code>.^name<\/code> — це виклик методу, спрямований через <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ці два рядки рівносильні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тобто <code>$x.^name<\/code> — це просто коротший спосіб записати <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що об'єкт передається ще й аргументом: метаоб'єкт є <em>спільним<\/em> для всіх значень цього типу, тож метаметоду повідомляють, про який саме об'єкт його питають.<\/span> <span class=\"sg\" data-s=\"2\">Форма <code>.^<\/code> робить це за вас автоматично. (Для <code>name<\/code> цей аргумент випадково ігнорується, але передавати його — правильна, загальна форма: деякі метаметоди його таки використовують.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Те саме стосується й інших метаметодів, які вам можуть трапитися, — наприклад, <code>.^methods<\/code>, що перелічує методи, на які значення відгукується.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> повертає <em>пакунок<\/em>, якому належить ім'я, — таблицю символів, визначених у цьому просторі імен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> (хеш таблиці символів) стає в пригоді під час роботи з модулями, де дозволяє шукати імена, які визначає модуль.<\/span> <span class=\"sg\" data-s=\"1\">Ми повернемося до нього в <a href=\"https://course.raku.org/uk/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">розділі про модулі<\/a>; наразі досить знати, що <code>WHO<\/code> існує і що він означає.<\/span><\/p>"]]},"bg":{"t":"<code>WHO<\/code> и <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Още два инструмента за интроспекция допълват набора: <code>HOW<\/code> и <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка стойност в Raku е подкрепена от <em>метаобект<\/em> — обект, който знае как работи типът на стойността.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (съкратено от <em>Higher Order Workings<\/em>) връща този метаобект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вие сте използвали метаобекта през цялото време, може би без да забелязвате.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> в <code>.^name<\/code> е извикване на метод, маршрутизирано чрез <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тези два реда са еквивалентни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Така че <code>$x.^name<\/code> е просто по-кратък начин за записване на <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че обектът се предава отново като аргумент: метаобектът е <em>споделен<\/em> от всяка стойност на типа, така че мета-методът е информиран за кой обект е попитан.<\/span> <span class=\"sg\" data-s=\"2\">Формата <code>.^<\/code> прави това автоматично вместо вас. (За <code>name<\/code> аргументът се оказва игнориран, но предаването му е правилната, обща форма — някои мета-методи го използват.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същото се отнася и за други мета-методи, които може да срещнете, като например <code>.^methods<\/code>, който изброява методите, на които стойността отговаря.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> връща <em>пакета<\/em>, към който принадлежи дадено име — таблицата на символите, дефинирани в това пространство от имена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> (хеш с таблица на символите) става полезен, когато работите с модули, където ви позволява да потърсите имената, които модулът дефинира.<\/span> <span class=\"sg\" data-s=\"1\">Ще се върнем към него в <a href=\"https://course.raku.org/bg/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">раздела за модулите<\/a>; засега е достатъчно да знаете, че <code>WHO<\/code> съществува и какво представлява.<\/span><\/p>"]]},"eo":{"t":"<code>WHO<\/code> kaj <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Du pliaj introspektaj iloj kompletigas la aron: <code>HOW<\/code> kaj <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Chiu valoro en Raku estas subtenata de <em>metaobjekto<\/em> -- objekto kiu scias kiel funkcias la tipo de la valoro.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (mallongigo de <em>Higher Order Workings<\/em>) redonas tiun metaobjekton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi uzis la metaobjekton la tutan tempon, eble sen rimarki.<\/span> <span class=\"sg\" data-s=\"1\">La <code>.^<\/code> en <code>.^name<\/code> estas metod-alvoko direktita tra <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiuj chi du linioj estas ekvivalentaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Do <code>$x.^name<\/code> estas nur pli mallonga maniero skribi <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku ke la objekto estas denove transdonita kiel argumento: la metaobjekto estas <em>komuna<\/em> por chiu valoro de la tipo, do meta-metodo ricevas informon pri kiu objekto ghi estas demandata.<\/span> <span class=\"sg\" data-s=\"2\">La formo <code>.^<\/code> faras tion por vi automate. (Por <code>name<\/code> la argumento hazarde estas ignorita, sed transdoni ghin estas la korekta, generala formo -- kelkaj meta-metodoj ja uzas ghin.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La samo validas por aliaj meta-metodoj kiujn vi eble renkontos, ekzemple <code>.^methods<\/code>, kiu listigas la metodojn al kiuj valoro respondas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> redonas la <em>pakon<\/em> al kiu nomo apartenas -- la tabelon de simboloj difinitaj en tiu nomspaco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> (simbol-tabela hakilo) farighas utila kiam vi laboras kun moduloj, kie ghi ebligas al vi sercxi la nomojn kiujn modulo difinas.<\/span> <span class=\"sg\" data-s=\"1\">Ni revenos al ghi en <a href=\"https://course.raku.org/eo/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">la sekcio pri modula introspekto<\/a>; nuntempe sufichas scii ke <code>WHO<\/code> ekzistas kaj kion ghi reprezentas.<\/span><\/p>"]]},"la":{"t":"<code>WHO<\/code> et <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Duo plura instrumenta introspectionis seriem complent: <code>HOW<\/code> et <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnis valor in Raku <em>metaobiecto<\/em> sustinetur — obiecto quod scit quomodo typus valoris operatur.<\/span> <span class=\"sg\" data-s=\"1\"><code>HOW<\/code> (abbreviatio pro <em>Higher Order Workings<\/em>) illud metaobiectum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metaobiecto iam per totum tempus usus es, fortasse sine animadversione.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> in <code>.^name<\/code> est vocatio methodi per <code>HOW<\/code> directa.<\/span> <span class=\"sg\" data-s=\"2\">Hae duae lineae aequivalentes sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ergo <code>$x.^name<\/code> est tantum brevior modus scribendi <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota obiectum iterum ut argumentum transmitti: metaobiectum ab omni valore typi <em>communicatur<\/em>, ergo meta-methodo dicitur de quo obiecto interrogetur.<\/span> <span class=\"sg\" data-s=\"2\">Forma <code>.^<\/code> hoc automatice pro te facit. (Pro <code>name<\/code> argumentum casu ignoratur, sed transmittere eum est forma correcta et generalis — aliquae meta-methodi eo utuntur.)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Idem ad alias meta-methodos quas invenire potes applicatur, sicut <code>.^methods<\/code>, quae methodos quibus valor respondet enumerat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> <em>fasciculum<\/em> reddit cui nomen pertinet — tabulam symbolorum in illo spatio nominum definitorum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> (tabula symbolorum in forma hash) utilis fit cum modulis operaris, ubi nomina quae modulus definit inspicere sinit.<\/span> <span class=\"sg\" data-s=\"1\">Ad eam in <a href=\"https://course.raku.org/la/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sectione de introspectione modulorum<\/a> redibimus; nunc satis est scire <code>WHO<\/code> exsistere et quid repraesentet.<\/span><\/p>"]]}}}</script>
