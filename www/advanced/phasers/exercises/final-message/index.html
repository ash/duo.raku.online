<script type="application/json" id="page-data">{"u":"advanced/phasers/exercises/final-message","n":579,"k":"exercise","pv":"advanced/phasers/exercises","nx":"advanced/phasers/exercises/final-message/solution","tr":["advanced","advanced/phasers"],"L":{"en":{"t":"Exercise ’Final message‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An <code>END<\/code> phaser runs after the main code, so it sees the <em>final<\/em> state of your variables — which makes it ideal for a summary.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Declare a counter <code>$count<\/code> set to <code>0<\/code>, and write an <code>END<\/code> phaser (place it before the main code) that prints <code>processed $count items<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then, in the main body, increment the counter three times with a loop.<\/span> <span class=\"sg\" data-s=\"2\">The summary should report the final count, not the value at the moment the phaser was written.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Abschlussnachricht","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>END<\/code>-Phaser wird nach dem Hauptcode ausgeführt und sieht daher den <em>endgültigen<\/em> Zustand deiner Variablen — was ihn ideal für eine Zusammenfassung macht.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deklariere einen Zähler <code>$count<\/code> mit dem Wert <code>0<\/code> und schreibe einen <code>END<\/code>-Phaser (platziere ihn vor dem Hauptcode), der <code>processed $count items<\/code> ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">Erhöhe dann im Hauptteil den Zähler dreimal mit einer Schleife.<\/span> <span class=\"sg\" data-s=\"2\">Die Zusammenfassung sollte den endgültigen Wert anzeigen, nicht den Wert zum Zeitpunkt, als der Phaser geschrieben wurde.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Laatste bericht","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>END<\/code>-phaser wordt uitgevoerd na de hoofdcode, dus hij ziet de <em>uiteindelijke<\/em> toestand van je variabelen — waardoor hij ideaal is voor een samenvatting.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Declareer een teller <code>$count<\/code> met waarde <code>0<\/code>, en schrijf een <code>END<\/code>-phaser (plaats deze vóór de hoofdcode) die <code>processed $count items<\/code> afdrukt.<\/span> <span class=\"sg\" data-s=\"1\">Verhoog vervolgens in de hoofdcode de teller drie keer met een lus.<\/span> <span class=\"sg\" data-s=\"2\">De samenvatting moet het eindresultaat weergeven, niet de waarde op het moment dat de phaser werd geschreven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Bek \" data-s=\"2\">Il riepilogo dovrebbe riportare il conteggio finale, non il valore al momento in cui il phaser e stato scritto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Noslēdzošais ziņojums","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> fāzeris izpildās pēc galvenā koda, tāpēc tas redz jūsu mainīgo <em>galīgo<\/em> stāvokli — kas padara to ideālu kopsavilkumam.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deklarējiet skaitītāju <code>$count<\/code>, kas iestatīts uz <code>0<\/code>, un uzrakstiet <code>END<\/code> fāzeri (novietojiet to pirms galvenā koda), kas izdrukā <code>processed $count items<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam galvenajā daļā palieliniet skaitītāju trīs reizes ar ciklu.<\/span> <span class=\"sg\" data-s=\"2\">Kopsavilkumā jāparādās gala skaitlim, nevis vērtībai brīdī, kad fāzeris tika uzrakstīts.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Финальное сообщение","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фейзер <code>END<\/code> выполняется после основного кода, поэтому он видит <em>финальное<\/em> состояние ваших переменных — что делает его идеальным для вывода итоговой информации.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Объявите счётчик <code>$count<\/code> со значением <code>0<\/code> и напишите фейзер <code>END<\/code> (поместите его перед основным кодом), который выводит <code>processed $count items<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затем в основном теле программы увеличьте счётчик три раза с помощью цикла.<\/span> <span class=\"sg\" data-s=\"2\">Итоговое сообщение должно показать финальное значение счётчика, а не значение на момент записи фейзера.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Прощальне повідомлення»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>END<\/code> виконується після основного коду, тож він бачить <em>остаточний<\/em> стан ваших змінних, — що робить його ідеальним для підсумку.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оголосіть лічильник <code>$count<\/code> зі значенням <code>0<\/code> і напишіть фазер <code>END<\/code> (поставте його перед основним кодом), який виводить <code>processed $count items<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім в основному тілі збільште лічильник тричі за допомогою циклу.<\/span> <span class=\"sg\" data-s=\"2\">Підсумок має повідомити остаточне число, а не значення на мить написання фазера.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Финално съобщение","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Phaser <code>END<\/code> се изпълнява след основния код, така че вижда <em>крайното<\/em> състояние на вашите променливи — което го прави идеален за обобщение.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Декларирайте брояч <code>$count<\/code>, зададен на <code>0<\/code>, и напишете phaser <code>END<\/code> (поставете го преди основния код), който отпечатва <code>processed $count items<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това, в основното тяло, увеличете брояча три пъти с цикъл.<\/span> <span class=\"sg\" data-s=\"2\">Обобщението трябва да покаже крайния брой, а не стойността в момента, в който phaser-ът е бил написан.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/final-message/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Fina mesaĝo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code>-phaser ruliĝas post la ĉefa kodo, do ĝi vidas la <em>finan<\/em> staton de viaj variabloj — tio faras ĝin ideala por resumo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deklaru nombrilon <code>$count<\/code> kun valoro <code>0<\/code>, kaj skribu <code>END<\/code>-phaser-on (metu ĝin
