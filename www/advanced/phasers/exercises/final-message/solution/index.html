<script type="application/json" id="page-data">{"u":"advanced/phasers/exercises/final-message/solution","n":580,"k":"solution","pv":"advanced/phasers/exercises/final-message","nx":"advanced/phasers/exercises/begin-first","tr":["advanced","advanced/phasers"],"L":{"en":{"t":"The solution of ’Final message‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>END<\/code> phaser is written before the loop, but it runs last — after the main code has finished. By then <code>$count<\/code> has been incremented three times.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Because the phaser closes over <code>$count<\/code>, it reads the variable’s <em>final<\/em> value, not the <code>0<\/code> it held when the phaser appeared in the source. This is the usual reason to put a summary in <code>END<\/code>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Abschlussnachricht","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"s  uitgevoerd — nadat de hoofdcode is afgelopen. Op dat moment is <code>$count<\/code> drie keer verhoogd.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omdat de phaser een closure vormt over <code>$count<\/code>, leest hij de <em>uiteindelijke<\/em> waarde van de variabele, niet de <code>0<\/code> die deze had toen de phaser in de broncode verscheen. Dit is de gebruikelijke reden om een samenvatting in <code>END<\/code> te plaatsen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Mensaje final","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El phaser <code>END<\/code> está escrito antes del bucle, pero se ejecuta al final — después de que el código principal ha terminado. Para entonces, <code>$count<\/code> ha sido incrementado tres veces.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Debido a que el phaser cierra sobre <code>$count<\/code>, lee el valor <em>final<\/em> de la variable, no el <code>0<\/code> que tenía cuando el phaser apareció en el código fuente. Esta es la razón habitual para poner un resumen en <code>END<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Messaggio finale","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il phaser <code>END<\/code> e scritto prima del ciclo, ma viene eseguito per ultimo — dopo che il codice principale e terminato. A quel punto <code>$count<\/code> e stato incrementato tre volte.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Poiche il phaser chiude sopra <code>$count<\/code>, legge il valore <em>finale<\/em> della variabile, non lo <code>0<\/code> che conteneva quando il phaser appariva nel codice sorgente. Questo e il motivo abituale per inserire un riepilogo in <code>END<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Noslēdzošais ziņojums","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Šīs programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>END<\/code> fāzeris ir uzrakstīts pirms cikla, bet tas izpildās pēdējais — pēc tam, kad galvenais kods ir pabeigts. Līdz tam <code>$count<\/code> ir palielināts trīs reizes.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tā kā fāzeris aptver <code>$count<\/code>, tas nolasa mainīgā <em>galīgo<\/em> vērtību, nevis <code>0<\/code>, kas tam bija brīdī, kad fāzeris parādījās pirmkodā. Tas ir parastais iemesls, kāpēc kopsavilkumu ievieto <code>END<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Финальное сообщение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Найдите программу в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фейзер <code>END<\/code> записан перед циклом, но выполняется последним — после завершения основного кода. К этому моменту <code>$count<\/code> уже был увеличен три раза.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поскольку фейзер замыкается на <code>$count<\/code>, он читает <em>финальное<\/em> значение переменной, а не <code>0<\/code>, которое она содержала в момент появления фейзера в исходном коде. Именно поэтому итоговую информацию обычно помещают в <code>END<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Прощальне повідомлення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>END<\/code> записано перед циклом, але виконується він останнім — після того, як основний код завершився. На той час <code>$count<\/code> уже збільшено тричі.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оскільки фазер замикається на <code>$count<\/code>, він читає <em>остаточне<\/em> значення змінної, а не той <code>0<\/code>, який вона мала, коли фазер з'явився у вихідному коді. Це і є звичайна причина класти підсумок у <code>END<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Финално съобщение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Phaser <code>END<\/code> е написан преди цикъла, но се изпълнява последен — след като основният код е завършил. До този момент <code>$count<\/code> е бил увеличен три пъти.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тъй като phaser-ът затваря над <code>$count<\/code>, той чете <em>крайната<\/em> стойност на променливата, а не <code>0<\/code>, която е имала, когато phaser-ът се е появил в изходния код. Това е обичайната причина да се поставя обобщение в <code>END<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Fina mesaĝo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>END<\/code>-phaser estas skribita antaŭ la buklo, sed ĝi ruliĝas laste — post kiam la ĉefa kodo finiĝis. Ĝis tiam <code>$count<\/code> estis pligrandigita trifoje.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉar la phaser fermas super <code>$count<\/code>, ĝi legas la <em>finan<\/em> valoron de la variablo, ne la <code>0<\/code>, kiun ĝi havis kiam la phaser aperis en la fontkodo. Tio estas la kutima kialo meti resumon en <code>END<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Nuntius finalis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est possibilis solutio ad munus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $count = 0;\n\nEND say \"processed $count items\";\n\n$count++ for 1..3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/final-message.raku\" target=\"_blank\" rel=\"noopener\">final-message.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed 3 items<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Phaser <code>END<\/code> scriptus est ante ansam, sed ultimus currit — postquam codex principalis finitus est. Tunc <code>$count<\/code> ter incrementatus est.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quia phaser super <code>$count<\/code> clauditur, valorem <em>finalem<\/em> variabilis legit, non <code>0<\/code> quem tenebat cum phaser in fonte apparuit. Haec est ratio usitata cur summarium in <code>END<\/code> ponitur.<\/span><\/li><\/ol>"]]}}}</script>
