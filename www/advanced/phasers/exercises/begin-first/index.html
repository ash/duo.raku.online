<script type="application/json" id="page-data">{"u":"advanced/phasers/exercises/begin-first","n":581,"k":"exercise","pv":"advanced/phasers/exercises/final-message/solution","nx":"advanced/phasers/exercises/begin-first/solution","tr":["advanced","advanced/phasers"],"L":{"en":{"t":"Exercise ’Begin first‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>BEGIN<\/code> phaser is more than a block that runs early — it is also an <em>expression<\/em> whose value is computed once, at compile time, and then frozen into the program.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Use <code>BEGIN { 2 + 3 }<\/code> to initialise a variable <code>$compiled<\/code>, and print it.<\/span> <span class=\"sg\" data-s=\"1\">The <code>2 + 3<\/code> is evaluated while the program is still compiling, but the stored value is perfectly usable at run time.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/begin-first/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Begin zuerst","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>BEGIN<\/code>-Phaser ist mehr als nur ein Block, der früh ausgeführt wird — er ist auch ein <em>Ausdruck<\/em>, dessen Wert einmal zur Kompilierzeit berechnet und dann im Programm eingefroren wird.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verwende <code>BEGIN { 2 + 3 }<\/code>, um eine Variable <code>$compiled<\/code> zu initialisieren, und gib sie aus.<\/span> <span class=\"sg\" data-s=\"1\">Die Berechnung <code>2 + 3<\/code> wird ausgewertet, während das Programm noch kompiliert wird, aber der gespeicherte Wert ist zur Laufzeit problemlos verwendbar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/begin-first/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Begin eerst","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>BEGIN<\/code>-phaser is meer dan een blok dat vroeg wordt uitgevoerd — het is ook een <em>expressie<\/em> waarvan de waarde eenmaal wordt berekend, tijdens de compilatie, en vervolgens in het programma wordt vastgelegd.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>BEGIN { 2 + 3 }<\/code> om een variabele <code>$compiled<\/code> te initialiseren en druk deze af.<\/span> <span class=\"sg\" data-s=\"1\">De <code>2 + 3<\/code> wordt geëvalueerd terwijl het programma nog wordt gecompileerd, maar de opgeslagen waarde is perfect bruikbaar tijdens de uitvoering.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/begin-first/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Begin primero","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un phaser <code>BEGIN<\/code> es más que un bloque que se ejecuta temprano — también es una <em>expresión<\/em> cuyo valor se calcula una vez, en tiempo de compilación, y luego queda congelado en el
