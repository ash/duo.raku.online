<script type="application/json" id="page-data">{"u":"advanced/phasers/exercises/end-order/solution","n":584,"k":"solution","pv":"advanced/phasers/exercises/end-order","nx":"advanced/phasers/quiz","tr":["advanced","advanced/phasers"],"L":{"en":{"t":"The solution of ’The order of ENDs‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>END say 'first END';\nEND say 'second END';\n\nsay 'body';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/end-order.raku\" target=\"_blank\" rel=\"noopener\">end-order.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both <code>END<\/code> phasers run after the main code, so <code>body<\/code> is printed first.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Multiple <code>END<\/code> phasers run last-in, first-out: the <code>second END<\/code>, declared later, runs before the <code>first END<\/code>. This mirrors how clean-up usually has to undo the most recent setup first.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Die Reihenfolge der ENDs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>END say 'first END';\nEND say 'second END';\n\nsay 'body';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phaser econd END<\/code>, die later is gedeclareerd, wordt uitgevoerd vóór de <code>first END<\/code>. Dit weerspiegelt hoe opruimen meestal de meest recente opstelling als eerste ongedaan moet maken.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: El orden de los END","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución a la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>END say 'first END';\nEND say 'second END';\n\nsay 'body';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/end-order.raku\" target=\"_blank\" rel=\"noopener\">end-order.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambos phasers <code>END<\/code> se ejecutan después del código principal, por lo que <code>body<\/code> se imprime primero.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Múltiples phasers <code>END<\/code> se ejecutan en orden último en entrar, primero en salir: el <code>second END<\/code>, declarado después, se ejecuta antes que el <code>first END<\/code>. Esto refleja cómo la limpieza generalmente tiene que deshacer primero la configuración más reciente.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: L'ordine degli END","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>END say 'first END';\nEND say 'second END';\n\nsay 'body';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://gi er.raku\" target=\"_blank\" rel=\"noopener\">end-order.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидва фазери <code>END<\/code> виконуються після основного коду, тож <code>body<\/code> виводиться першим.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кілька фазерів <code>END<\/code> виконуються за принципом «останнім прийшов — першим вийшов»: <code>second END<\/code>, оголошений пізніше, виконується перед <code>first END<\/code>. Це віддзеркалює те, як прибирання зазвичай мусить скасовувати найсвіжіші приготування першими.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Редът на END","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>END say 'first END';\nEND say 'second END';\n\nsay 'body';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/phasers/end-order.raku\" target=\"_blank\" rel=\"noopener\">end-order.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата phasera <code>END<\/code> се изпълняват след основния код, така че <code>body<\/code> се отпечатва първо.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Множество phasers <code>END<\/code> се изпълняват по принципа последен влязъл, пръв излязъл: <code>second END<\/code>, деклариран по-късно, се изпълнява преди <cod
