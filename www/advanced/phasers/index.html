<script type="application/json" id="page-data">{"u":"advanced/phasers","n":577,"k":"section","pv":"advanced/traits-pragmas/exercises/no-strict/solution","nx":"advanced/phasers/exercises","tr":["advanced"],"L":{"en":{"t":"Phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A <em>phaser<\/em> is a special block that runs automatically at a particular moment in the life of a program, rather than where it appears in the source code.<\/span> <span class=\"sg\" data-s=\"1\">You do not call a phaser; you only say <em>when<\/em> its code should run, by naming the block.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The most common phasers mark stages of the program as a whole:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> runs as early as possible, while the program is still being compiled;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> runs once at the start of the run, before the main code;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> runs once at the very end, after the main code has finished.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The following program places these phasers among ordinary statements.<\/span> <span class=\"sg\" data-s=\"1\">Notice that the output does not follow the order of the lines in the file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> runs first, during compilation.<\/span> <span class=\"sg\" data-s=\"1\">Then, at run time, <code>INIT<\/code> runs before the main body.<\/span> <span class=\"sg\" data-s=\"2\">The main body prints next, and <code>END<\/code> runs last, no matter where it was written.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A common use of <code>END<\/code> is to print a summary or clean something up just before the program exits, while <code>BEGIN<\/code> is handy for work that must happen before anything else.<\/span><\/p>"]]},"de":{"t":"Phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Phaser<\/em> ist ein spezieller Block, der automatisch zu einem bestimmten Zeitpunkt im Lebenszyklus eines Programms ausgeführt wird, anstatt dort, wo er im Quellcode steht.<\/span> <span class=\"sg\" data-s=\"1\">Du rufst einen Phaser nicht auf; du sagst nur, <em>wann<\/em> sein Code ausgeführt werden soll, indem du den Block benennst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die gebräuchlichsten Phaser markieren Phasen des Programms als Ganzes:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> wird so früh wie möglich ausgeführt, während das Programm noch kompiliert wird;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> wird einmal zu Beginn der Ausführung ausgeführt, vor dem Hauptcode;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> wird einmal ganz am Ende ausgeführt, nachdem der Hauptcode abgeschlossen ist.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das folgende Programm platziert diese Phaser zwischen gewöhnlichen Anweisungen.<\/span> <span class=\"sg\" data-s=\"1\">Beachte, dass die Ausgabe nicht der Reihenfolge der Zeilen in der Datei folgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> wird zuerst ausgeführt, während der Kompilierung.<\/span> <span class=\"sg\" data-s=\"1\">Dann wird zur Laufzeit <code>INIT<\/code> vor dem Hauptteil ausgeführt.<\/span> <span class=\"sg\" data-s=\"2\">Der Hauptteil wird als Nächstes ausgegeben, und <code>END<\/code> wird zuletzt ausgeführt, egal wo es geschrieben wurde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine häufige Verwendung von <code>END<\/code> ist es, eine Zusammenfassung auszugeben oder etwas aufzuräumen, kurz bevor das Programm beendet wird, während <code>BEGIN<\/code> praktisch für Arbeit ist, die vor allem anderen passieren muss.<\/span><\/p>"]]},"nl":{"t":"Phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <em>phaser<\/em> is een speciaal blok dat automatisch wordt uitgevoerd op een bepaald moment in de levenscyclus van een programma, in plaats van op de plek waar het in de broncode staat.<\/span> <span class=\"sg\" data-s=\"1\">Je roept een phaser niet aan; je geeft alleen aan <em>wanneer<\/em> de code moet worden uitgevoerd, door het blok een naam te geven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De meest gebruikte phasers markeren fasen van het programma als geheel:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> wordt zo vroeg mogelijk uitgevoerd, terwijl het programma nog wordt gecompileerd;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> wordt eenmaal uitgevoerd bij het begin van de uitvoering, vóór de hoofdcode;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> wordt eenmaal uitgevoerd aan het einde, nadat de hoofdcode is afgelopen.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het volgende programma plaatst deze phasers tussen gewone instructies.<\/span> <span class=\"sg\" data-s=\"1\">Merk op dat de uitvoer niet de volgorde van de regels in het bestand volgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> wordt als eerste uitgevoerd, tijdens de compilatie.<\/span> <span class=\"sg\" data-s=\"1\">Vervolgens wordt tijdens de uitvoering <code>INIT<\/code> uitgevoerd vóór de hoofdcode.<\/span> <span class=\"sg\" data-s=\"2\">De hoofdcode wordt daarna afgedrukt, en <code>END<\/code> wordt als laatste uitgevoerd, ongeacht waar het geschreven stond.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een veelvoorkomend gebruik van <code>END<\/code> is het afdrukken van een samenvatting of het opruimen van iets vlak voordat het programma eindigt, terwijl <code>BEGIN<\/code> handig is voor werk dat moet gebeuren voordat iets anders plaatsvindt.<\/span><\/p>"]]},"es":{"t":"Phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>phaser<\/em> es un bloque especial que se ejecuta automáticamente en un momento particular de la vida de un programa, en lugar de donde aparece en el código fuente.<\/span> <span class=\"sg\" data-s=\"1\">No llamas a un phaser; solo indicas <em>cuándo<\/em> debe ejecutarse su código, nombrando el bloque.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los phasers más comunes marcan etapas del programa en su conjunto:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> se ejecuta lo antes posible, mientras el programa aún se está compilando;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> se ejecuta una vez al inicio de la ejecución, antes del código principal;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> se ejecuta una vez al final, después de que el código principal ha terminado.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El siguiente programa coloca estos phasers entre instrucciones ordinarias.<\/span> <span class=\"sg\" data-s=\"1\">Observa que la salida no sigue el orden de las líneas en el archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> se ejecuta primero, durante la compilación.<\/span> <span class=\"sg\" data-s=\"1\">Luego, en tiempo de ejecución, <code>INIT<\/code> se ejecuta antes del cuerpo principal.<\/span> <span class=\"sg\" data-s=\"2\">El cuerpo principal se imprime a continuación, y <code>END<\/code> se ejecuta al final, sin importar dónde fue escrito.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un uso común de <code>END<\/code> es imprimir un resumen o limpiar algo justo antes de que el programa termine, mientras que <code>BEGIN<\/code> es útil para trabajo que debe ocurrir antes que cualquier otra cosa.<\/span><\/p>"]]},"it":{"t":"Phaser","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <em>phaser<\/em> e un blocco speciale che viene eseguito automaticamente in un momento particolare della vita di un programma, piuttosto che dove appare nel codice sorgente.<\/span> <span class=\"sg\" data-s=\"1\">Non si chiama un phaser; si dice soltanto <em>quando<\/em> il suo codice deve essere eseguito, denominando il blocco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I phaser piu comuni contrassegnano le fasi del programma nel suo complesso:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> viene eseguito il prima possibile, mentre il programma e ancora in fase di compilazione;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> viene eseguito una volta all'inizio dell'esecuzione, prima del codice principale;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> viene eseguito una volta alla fine, dopo che il codice principale e terminato.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il seguente programma posiziona questi phaser tra istruzioni ordinarie.<\/span> <span class=\"sg\" data-s=\"1\">Nota che l'output non segue l'ordine delle righe nel file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> viene eseguito per primo, durante la compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Poi, a tempo di esecuzione, <code>INIT<\/code> viene eseguito prima del corpo principale.<\/span> <span class=\"sg\" data-s=\"2\">Il corpo principale viene stampato dopo, e <code>END<\/code> viene eseguito per ultimo, indipendentemente da dove e stato scritto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un uso comune di <code>END<\/code> e stampare un riepilogo o ripulire qualcosa appena prima che il programma termini, mentre <code>BEGIN<\/code> e utile per operazioni che devono avvenire prima di qualsiasi altra cosa.<\/span><\/p>"]]},"lv":{"t":"Fāzeri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Fāzeris<\/em> (phaser) ir īpašs bloks, kas izpildās automātiski noteiktā programmas dzīves brīdī, nevis tur, kur tas parādās pirmkodā.<\/span> <span class=\"sg\" data-s=\"1\">Jūs neizsaucat fāzeri; jūs tikai norādāt, <em>kad<\/em> tā kodam jāizpildās, nosaucot bloku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visbiežāk lietotie fāzeri atzīmē programmas posmus kopumā:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> izpildās pēc iespējas agrāk, kamēr programma vēl tiek kompilēta;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> izpildās vienu reizi izpildes sākumā, pirms galvenā koda;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> izpildās vienu reizi pašās beigās, pēc tam, kad galvenais kods ir pabeigts.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī programma izvieto šos fāzerus starp parastajiem izteikumiem.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka izvade neseko rindu secībai failā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> izpildās pirmais, kompilācijas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam izpildes laikā <code>INIT<\/code> izpildās pirms galvenā koda.<\/span> <span class=\"sg\" data-s=\"2\">Galvenais kods izdrukājas nākamais, un <code>END<\/code> izpildās pēdējais neatkarīgi no tā, kur tas tika uzrakstīts.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bieži <code>END<\/code> lieto, lai izdrukātu kopsavilkumu vai iztīrītu kaut ko pirms programmas iziešanas, savukārt <code>BEGIN<\/code> ir noderīgs darbam, kam jānotiek pirms visa pārējā.<\/span><\/p>"]]},"ru":{"t":"Фазеры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Фейзер<\/em> (phaser) — это специальный блок, который выполняется автоматически в определённый момент жизни программы, а не там, где он записан в исходном коде.<\/span> <span class=\"sg\" data-s=\"1\">Вы не вызываете фейзер; вы лишь указываете, <em>когда<\/em> его код должен выполниться, именуя блок.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наиболее распространённые фейзеры отмечают этапы жизни программы в целом:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> выполняется как можно раньше, пока программа ещё компилируется;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> выполняется один раз в начале выполнения, перед основным кодом;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> выполняется один раз в самом конце, после завершения основного кода.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующая программа размещает эти фейзеры среди обычных инструкций.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что вывод не следует порядку строк в файле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> выполняется первым, на этапе компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Затем, во время выполнения, <code>INIT<\/code> запускается перед основным телом программы.<\/span> <span class=\"sg\" data-s=\"2\">Основное тело выводит свой текст следующим, а <code>END<\/code> выполняется последним, независимо от того, где он был записан.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типичное использование <code>END<\/code> — вывод итоговой информации или очистка ресурсов перед завершением программы, а <code>BEGIN<\/code> удобен для работы, которая должна произойти раньше всего остального.<\/span><\/p>"]]},"uk":{"t":"Фазери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Фазер<\/em> — це особливий блок, який виконується автоматично в певну мить життя програми, а не там, де він з'являється у вихідному коді.<\/span> <span class=\"sg\" data-s=\"1\">Фазер не викликають; ви лише кажете, <em>коли<\/em> його код має виконатися, назвавши блок.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпоширеніші фазери позначають етапи програми в цілому:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> виконується якомога раніше, поки програма ще компілюється;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> виконується один раз на початку запуску, перед основним кодом;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> виконується один раз у самому кінці, після завершення основного коду.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наведена програма розставляє ці фазери серед звичайних операторів.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що вивід не відповідає порядку рядків у файлі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> виконується першим, під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Далі, під час виконання, <code>INIT<\/code> спрацьовує перед основним тілом.<\/span> <span class=\"sg\" data-s=\"2\">Потім друкує основне тіло, а <code>END<\/code> виконується останнім, хоч би де його було записано.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Поширене застосування <code>END<\/code> — вивести підсумок або щось прибрати перед самим виходом із програми, тоді як <code>BEGIN<\/code> стає в пригоді для роботи, яка має відбутися раніше за все інше.<\/span><\/p>"]]},"bg":{"t":"Фейзъри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> е специален блок, който се изпълнява автоматично в определен момент от живота на програмата, а не там, където се появява в изходния код.<\/span> <span class=\"sg\" data-s=\"1\">Вие не извиквате phaser; само казвате <em>кога<\/em> кодът му трябва да се изпълни, като именувате блока.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-често използваните phasers отбелязват етапи от програмата като цяло:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> се изпълнява възможно най-рано, докато програмата все още се компилира;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> се изпълнява веднъж в началото на изпълнението, преди основния код;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> се изпълнява веднъж в самия край, след като основният код е завършил.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващата програма поставя тези phasers сред обикновени инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че изходът не следва реда на редовете във файла:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> се изпълнява първи, по време на компилацията.<\/span> <span class=\"sg\" data-s=\"1\">След това, по време на изпълнение, <code>INIT<\/code> се изпълнява преди основното тяло.<\/span> <span class=\"sg\" data-s=\"2\">Основното тяло се отпечатва следващо, а <code>END<\/code> се изпълнява последен, независимо къде е бил написан.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Често <code>END<\/code> се използва за отпечатване на обобщение или почистване на нещо точно преди програмата да завърши, а <code>BEGIN<\/code> е удобен за работа, която трябва да се случи преди всичко друго.<\/span><\/p>"]]},"eo":{"t":"Faziloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> estas speciala bloko, kiu ruliĝas aŭtomate en aparta momento de la vivo de programo, anstataŭ tie, kie ĝi aperas en la fontkodo.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne vokas phaser-on; vi nur diras <em>kiam<\/em> ĝia kodo ruliĝu, nomante la blokon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La plej oftaj phasers markas stadiojn de la programo entute:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> ruliĝas kiel eble plej frue, dum la programo ankoraŭ estas kompilata;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> ruliĝas unufoje ĉe la komenco de la rulado, antaŭ la ĉefa kodo;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> ruliĝas unufoje ĉe la plej fino, post kiam la ĉefa kodo finiĝis.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekva programo metas ĉi tiujn phaser-ojn inter ordinarajn deklarojn.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, ke la eligo ne sekvas la ordon de la linioj en la dosiero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> ruliĝas unue, dum la kompilado.<\/span> <span class=\"sg\" data-s=\"1\">Poste, dum rultempo, <code>INIT<\/code> ruliĝas antaŭ la ĉefa korpo.<\/span> <span class=\"sg\" data-s=\"2\">La ĉefa korpo presatas sekve, kaj <code>END<\/code> ruliĝas laste, sendepende de kie ĝi estis skribita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ofta uzo de <code>END<\/code> estas presi resumon aŭ purigi ion ĵus antaŭ ol la programo finiĝas, dum <code>BEGIN<\/code> estas oportuna por laboro, kiu devas okazi antaŭ ĉio alia.<\/span><\/p>"]]},"la":{"t":"Phaseres","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> est specialis copia quae automatice currit in momento particulari in vita programmatis, non ubi apparet in codice fonte.<\/span> <span class=\"sg\" data-s=\"1\">Phaserem non vocas; tantum dicis <em>quando<\/em> eius codex currere debet, nominando copiam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Phaseres frequentissimi stadia programmatis totius signant:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> currit quam primum, dum programma adhuc compilatur;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> semel currit in principio exsecutionis, ante codicem principalem;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> semel currit in fine, postquam codex principalis finitus est.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma sequens hos phaseres inter sententias ordinarias ponit.<\/span> <span class=\"sg\" data-s=\"1\">Nota quod output non sequitur ordinem linearum in archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> primus currit, dum compilatio fit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde, tempore exsecutionis, <code>INIT<\/code> currit ante corpus principale.<\/span> <span class=\"sg\" data-s=\"2\">Corpus principale deinde imprimit, et <code>END<\/code> currit ultimus, ubicumque scriptus sit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usus communis <code>END<\/code> est summarium imprimere vel aliquid purgare ante exitum programmatis, dum <code>BEGIN<\/code> utilis est pro opere quod ante omnia fieri debet.<\/span><\/p>"]]}}}</script>
