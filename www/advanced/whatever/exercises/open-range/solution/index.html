<script type="application/json" id="page-data">{"u":"advanced/whatever/exercises/open-range/solution","n":643,"k":"solution","pv":"advanced/whatever/exercises/open-range","nx":"advanced/whatever/quiz","tr":["advanced","advanced/whatever"],"L":{"en":{"t":"The solution of ’An open-ended range‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a possible solution to the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... *).head(4);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/whatever/open-range.raku\" target=\"_blank\" rel=\"noopener\">open-range.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The seeds <code>2, 4<\/code> set an arithmetic step of two, and the bare <code>*<\/code> as the endpoint means the sequence never ends.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(4)<\/code> pulls just the first four values, <code>2, 4, 6, 8<\/code>. The sequence is lazy, so the unbounded tail is never computed — the bare star here means “whatever, with no upper limit”.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein offener Bereich","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung der Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... *).head(4);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode findest du in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/whatever/open-range.raku\" target=\"_blank\" rel=\"noopener\" sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">I valori iniziali <code>2, 4<\/code> impostano un passo aritmetico di due, e la stella <code>*<\/code> come punto finale significa che la sequenza non termina mai.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(4)<\/code> estrae solo i primi quattro valori, <code>2, 4, 6, 8<\/code>. La sequenza e lazy, quindi la coda illimitata non viene mai calcolata — la stella qui significa \"qualsiasi cosa, senza limite superiore\".<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Atvērts diapazons","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums uzdevumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... *).head(4);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/whatever/open-range.raku\" target=\"_blank\" rel=\"noopener\">open-range.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sākumvērtības <code>2, 4<\/code> nosaka aritmētisko soli divi, un kailā <code>*<\/code> kā beigu punkts nozīmē, ka virkne nekad nebeidzas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(4)<\/code> izvelk tikai pirmās četras vērtības — <code>2, 4, 6, 8<\/code>. Virkne ir slinka, tāpēc bezgalīgā aste nekad netiek aprēķināta; kailā zvaigznīte šeit nozīmē «cik nu ir, bez augšējās robežas».<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Открытый диапазон","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно из возможных решений задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... *).head(4);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/whatever/open-range.raku\" target=\"_blank\" rel=\"noopener\">open-range.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Начальные значения <code>2, 4<\/code> задают арифметический шаг, равный двум, а голая <code>*<\/code> в качестве конечной точки означает, что последовательность никогда не заканчивается.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(4)<\/code> извлекает только первые четыре значения: <code>2, 4, 6, 8<\/code>. Последовательность ленива, поэтому неограниченный хвост никогда не вычисляется — голая звёздочка здесь означает «что угодно, без верхнего предела».<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Відкритий діапазон","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих варіантів розв'язання задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (2, 4 ... *).head(4);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/whatever/open-range.raku\" target=\"_blank\" rel=\"noopener\">open-range.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Затравки <code>2, 4<\/code> задають арифметичний крок у два, а гола <code>*<\/code> як кінець оз kodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/whatever/open-range.raku\" target=\"_blank\" rel=\"noopener\">open-range.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La semoj <code>2, 4<\/code> starigas aritmetikan paŝon de du, kaj la nuda <code>*<\/code> kiel la finpunkto signifas ke la sekvenco neniam finiĝas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>head(4)<\/code> prenas nur la unuajn kvar valorojn, <code>2, 4, 6, 8<\/code>. La sekvenco estas maldiligenta, do la senlima vosto neniam estas kalkulita — la nuda stelo ĉi tie signifas \"kion ajn, sen supra limo\".<\/span><\/li><\/ol>"]]}}}</script>
