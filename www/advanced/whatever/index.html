<script type="application/json" id="page-data">{"u":"advanced/whatever","n":636,"k":"section","pv":"advanced/signatures/quiz","nx":"advanced/whatever/exercises","tr":["advanced"],"L":{"en":{"t":"The Whatever star","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You may have seen the <code>*<\/code> used in expressions like <code>* * 2<\/code> or <code>* %% 2<\/code> when calling <code>map<\/code> and <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">That <code>*<\/code> is the <em>Whatever star<\/em>, and the expression around it builds a small one-argument function on the fly.<\/span> <span class=\"sg\" data-s=\"2\">This section explains what it really is, how it relates to a block, and where the bare star means simply “whatever you want”.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">A star makes a function<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When <code>*<\/code> appears in an expression, Raku turns the whole expression into a function — a <code>WhateverCode<\/code> — in which the star stands for the argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> is a function that multiplies its one argument by two.<\/span> <span class=\"sg\" data-s=\"1\">This is why <code>(1..5).map(* * 2)<\/code> works: <code>map<\/code> is handed exactly such a one-argument function.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever versus a block<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A Whatever expression is a shorter way of writing a function you could also write as a block.<\/span> <span class=\"sg\" data-s=\"1\">These three are equivalent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The Whatever form names no parameter; the block form uses the topic variable <code>$_<\/code>; the pointy form names <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">That last one, <code>-&gt; $x { ... }<\/code>, is a small function in its own right — you will meet it properly in <a href=\"/advanced/anonymous-subroutines/\">Anonymous subroutines<\/a>; here it is enough to read it as a third way to spell the same one-argument function.<\/span> <span class=\"sg\" data-s=\"2\">For a simple expression the star is the most compact, which is why it is so common with <code>map<\/code>, <code>grep<\/code>, and <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Reach for a <strong>block<\/strong> when the logic needs more than one expression, or when a clearer named parameter helps.<\/span> <span class=\"sg\" data-s=\"1\">Reach for the <strong>star<\/strong> when a short expression says it all.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one star<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each <code>*<\/code> in the expression is a separate argument, in order.<\/span> <span class=\"sg\" data-s=\"1\">So two stars make a <strong>two<\/strong>-argument function:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here <code>* + *<\/code> is a two-argument function that adds its arguments — for example a running total and the next element.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The bare Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On its own, <code>*<\/code> means “whatever” — as much as there is, or no limit.<\/span> <span class=\"sg\" data-s=\"1\">Two everyday uses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is the array length, so *-1 is the last index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is an open-ended range<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> the star stands for the number of elements, and in <code>1..*<\/code> it stands for “no upper bound”.<\/span> <span class=\"sg\" data-s=\"1\">Whether it builds a function or means “whatever you want”, the star is one of Raku’s most useful pieces of shorthand.<\/span><\/p>"]]},"de":{"t":"Der Whatever-Stern","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Du hast vielleicht schon das <code>*<\/code> in Ausdrücken wie <code>* * 2<\/code> oder <code>* %% 2<\/code> gesehen, wenn du <code>map<\/code> und <code>grep<\/code> aufrufst.<\/span> <span class=\"sg\" data-s=\"1\">Dieses <code>*<\/code> ist der <em>Whatever-Stern<\/em>, und der Ausdruck drumherum baut im Handumdrehen eine kleine Funktion mit einem Argument.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt erklärt, was er wirklich ist, wie er sich zu einem Block verhält und wo der bloße Stern einfach „was auch immer du willst\" bedeutet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ein Stern erzeugt eine Funktion<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn <code>*<\/code> in einem Ausdruck vorkommt, verwandelt Raku den gesamten Ausdruck in eine Funktion — einen <code>WhateverCode<\/code> —, wobei der Stern für das Argument steht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> ist eine Funktion, die ihr einziges Argument mit zwei multipliziert.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb funktioniert <code>(1..5).map(* * 2)<\/code>: <code>map<\/code> erhält genau eine solche Funktion mit einem Argument.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever versus Block<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Whatever-Ausdruck ist eine kürzere Schreibweise für eine Funktion, die du auch als Block schreiben könntest.<\/span> <span class=\"sg\" data-s=\"1\">Diese drei sind gleichwertig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Whatever-Form benennt keinen Parameter; die Block-Form verwendet die Topic-Variable <code>$_<\/code>; die Pfeil-Form benennt <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Diese letzte, <code>-&gt; $x { ... }<\/code>, ist selbst eine kleine Funktion — du wirst sie in <a href=\"https://course.raku.org/de/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonyme Subroutinen<\/a> richtig kennenlernen; hier genügt es, sie als dritte Möglichkeit zu lesen, dieselbe Funktion mit einem Argument zu formulieren.<\/span> <span class=\"sg\" data-s=\"2\">Für einen einfachen Ausdruck ist der Stern die kompakteste Variante, weshalb er bei <code>map<\/code>, <code>grep<\/code> und <code>sort<\/code> so häufig vorkommt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Greife zum <strong>Block<\/strong>, wenn die Logik mehr als einen Ausdruck braucht oder ein benannter Parameter die Sache klarer macht.<\/span> <span class=\"sg\" data-s=\"1\">Greife zum <strong>Stern<\/strong>, wenn ein kurzer Ausdruck alles sagt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als ein Stern<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes <code>*<\/code> im Ausdruck ist ein eigenes Argument, der Reihe nach.<\/span> <span class=\"sg\" data-s=\"1\">Zwei Sterne ergeben also eine Funktion mit <strong>zwei<\/strong> Argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>* + *<\/code> eine Funktion mit zwei Argumenten, die ihre Argumente addiert — zum Beispiel eine laufende Summe und das nächste Element.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der bloße Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alleinstehend bedeutet <code>*<\/code> „was auch immer\" — so viel wie vorhanden, oder ohne Begrenzung.<\/span> <span class=\"sg\" data-s=\"1\">Zwei alltägliche Verwendungen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * ist die Array-Länge, also ist *-1 der letzte Index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* ist ein offener Bereich<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> steht der Stern für die Anzahl der Elemente, und in <code>1..*<\/code> steht er für „keine Obergrenze\".<\/span> <span class=\"sg\" data-s=\"1\">Ob er eine Funktion erzeugt oder „was auch immer du willst\" bedeutet — der Stern ist eine der nützlichsten Kurzschreibweisen in Raku.<\/span><\/p>"]]},"nl":{"t":"De Whatever-ster","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je hebt de <code>*<\/code> misschien al zien opduiken in uitdrukkingen als <code>* * 2<\/code> of <code>* %% 2<\/code> bij het aanroepen van <code>map<\/code> en <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die <code>*<\/code> is de <em>Whatever-ster<\/em>, en de uitdrukking eromheen bouwt ter plekke een kleine functie met één argument.<\/span> <span class=\"sg\" data-s=\"2\">Deze sectie legt uit wat het werkelijk is, hoe het zich verhoudt tot een blok, en waar de kale ster gewoon \"wat je maar wilt\" betekent.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een ster maakt een functie<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer <code>*<\/code> in een uitdrukking voorkomt, maakt Raku van de hele uitdrukking een functie — een <code>WhateverCode<\/code> — waarin de ster voor het argument staat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> is een functie die haar ene argument met twee vermenigvuldigt.<\/span> <span class=\"sg\" data-s=\"1\">Daarom werkt <code>(1..5).map(* * 2)<\/code>: <code>map<\/code> krijgt precies zo'n functie met één argument aangereikt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever tegenover een blok<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een Whatever-uitdrukking is een kortere manier om een functie te schrijven die je ook als blok zou kunnen schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Deze drie zijn gelijkwaardig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De Whatever-vorm noemt geen parameter; de blokvorm gebruikt de onderwerpsvariabele <code>$_<\/code>; de pijlvorm noemt <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die laatste, <code>-&gt; $x { ... }<\/code>, is op zichzelf een kleine functie — je maakt er echt kennis mee in <a href=\"https://course.raku.org/nl/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonieme subroutines<\/a>; hier volstaat het om hem te lezen als een derde manier om dezelfde functie met één argument te schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Voor een eenvoudige uitdrukking is de ster het compactst, en daarom is hij zo gebruikelijk bij <code>map<\/code>, <code>grep<\/code> en <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Grijp naar een <strong>blok<\/strong> wanneer de logica meer dan één uitdrukking nodig heeft, of wanneer een duidelijker benoemde parameter helpt.<\/span> <span class=\"sg\" data-s=\"1\">Grijp naar de <strong>ster<\/strong> wanneer een korte uitdrukking alles zegt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één ster<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke <code>*<\/code> in de uitdrukking is een apart argument, op volgorde.<\/span> <span class=\"sg\" data-s=\"1\">Twee sterren maken dus een functie met <strong>twee<\/strong> argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>* + *<\/code> een functie met twee argumenten die ze optelt — bijvoorbeeld een lopend totaal en het volgende element.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De kale Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Op zichzelf betekent <code>*<\/code> \"wat dan ook\" — zoveel als er is, of geen grens.<\/span> <span class=\"sg\" data-s=\"1\">Twee alledaagse toepassingen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is de lengte van de array, dus *-1 is de laatste index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is een open bereik<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> staat de ster voor het aantal elementen, en in <code>1..*<\/code> staat hij voor \"geen bovengrens\".<\/span> <span class=\"sg\" data-s=\"1\">Of hij nu een functie bouwt of \"wat je maar wilt\" betekent, de ster is een van Raku's nuttigste stukjes afkorting.<\/span><\/p>"]]},"es":{"t":"La estrella Whatever","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Es posible que hayas visto el <code>*<\/code> usado en expresiones como <code>* * 2<\/code> o <code>* %% 2<\/code> al llamar a <code>map<\/code> y <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ese <code>*<\/code> es la <em>estrella Whatever<\/em>, y la expresión que lo rodea construye una pequeña función de un argumento sobre la marcha.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección explica que es realmente, como se relaciona con un bloque y donde la estrella sola significa simplemente \"lo que quieras\".<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Una estrella crea una función<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando <code>*<\/code> aparece en una expresión, Raku convierte toda la expresión en una función — un <code>WhateverCode<\/code> — en la que la estrella representa el argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> es una función que multiplica su único argumento por dos.<\/span> <span class=\"sg\" data-s=\"1\">Por eso <code>(1..5).map(* * 2)<\/code> funciona: a <code>map<\/code> se le pasa exactamente esa función de un argumento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever versus un bloque<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una expresión Whatever es una forma más corta de escribir una función que también podrías escribir como un bloque.<\/span> <span class=\"sg\" data-s=\"1\">Estas tres son equivalentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma Whatever no nombra ningún parámetro; la forma de bloque usa la variable topica <code>$_<\/code>; la forma puntiaguda nombra <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esa última, <code>-&gt; $x { ... }<\/code>, es una pequeña función por derecho propio — la conocerás apropiadamente en <a href=\"https://course.raku.org/es/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subrutinas anonimas<\/a>; aquí basta con leerla como una tercera forma de escribir la misma función de un argumento.<\/span> <span class=\"sg\" data-s=\"2\">Para una expresión simple, la estrella es la más compacta, por eso es tan común con <code>map<\/code>, <code>grep<\/code> y <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa un <strong>bloque<\/strong> cuando la lógica necesite más de una expresión, o cuando un parámetro con nombre claro ayude.<\/span> <span class=\"sg\" data-s=\"1\">Usa la <strong>estrella<\/strong> cuando una expresión corta lo diga todo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de una estrella<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada <code>*<\/code> en la expresión es un argumento separado, en orden.<\/span> <span class=\"sg\" data-s=\"1\">Así que dos estrellas crean una función de <strong>dos<\/strong> argumentos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>* + *<\/code> es una función de dos argumentos que suma sus argumentos — por ejemplo un total acumulado y el siguiente elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La estrella Whatever sola<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por si sola, <code>*<\/code> significa \"lo que sea\" — tanto como haya, o sin limite.<\/span> <span class=\"sg\" data-s=\"1\">Dos usos cotidianos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * es la longitud del arreglo, asi que *-1 es el ultimo indice\n\nsay (1..*).head(3); # (1 2 3)  — 1..* es un rango abierto<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <code>@a[*-1]<\/code> la estrella representa el numero de elementos, y en <code>1..*<\/code> representa \"sin limite superior\".<\/span> <span class=\"sg\" data-s=\"1\">Ya sea que construya una función o signifique \"lo que quieras\", la estrella es una de las abreviaturas más útiles de Raku.<\/span><\/p>"]]},"it":{"t":"La stella Whatever","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Potresti aver visto <code>*<\/code> usato in espressioni come <code>* * 2<\/code> o <code>* %% 2<\/code> quando si chiamano <code>map<\/code> e <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quel <code>*<\/code> e la <em>Whatever star<\/em> (stella Whatever), e l'espressione che la circonda costruisce al volo una piccola funzione a un argomento.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione spiega cosa sia realmente, come si relaziona a un blocco e dove la stella da sola significa semplicemente \"qualsiasi cosa tu voglia\".<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Una stella crea una funzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando <code>*<\/code> appare in un'espressione, Raku trasforma l'intera espressione in una funzione — un <code>WhateverCode<\/code> — in cui la stella rappresenta l'argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> e una funzione che moltiplica il suo unico argomento per due.<\/span> <span class=\"sg\" data-s=\"1\">Ecco perche <code>(1..5).map(* * 2)<\/code> funziona: a <code>map<\/code> viene passata esattamente una funzione a un argomento di questo tipo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever rispetto a un blocco<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un'espressione Whatever e un modo piu breve di scrivere una funzione che potresti anche scrivere come blocco.<\/span> <span class=\"sg\" data-s=\"1\">Queste tre forme sono equivalenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma Whatever non nomina alcun parametro; la forma a blocco usa la variabile topic <code>$_<\/code>; la forma pointy nomina <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quest'ultima, <code>-&gt; $x { ... }<\/code>, e una piccola funzione a se stante — la incontrerai in modo approfondito in <a href=\"https://course.raku.org/it/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subroutine anonime<\/a>; qui e sufficiente leggerla come un terzo modo di scrivere la stessa funzione a un argomento.<\/span> <span class=\"sg\" data-s=\"2\">Per un'espressione semplice, la stella e la forma piu compatta, ed e per questo che e cosi comune con <code>map<\/code>, <code>grep<\/code> e <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa un <strong>blocco<\/strong> quando la logica richiede piu di un'espressione, o quando un parametro con nome esplicito aiuta la chiarezza.<\/span> <span class=\"sg\" data-s=\"1\">Usa la <strong>stella<\/strong> quando una breve espressione dice tutto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piu di una stella<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>*<\/code> nell'espressione e un argomento separato, in ordine.<\/span> <span class=\"sg\" data-s=\"1\">Quindi due stelle creano una funzione a <strong>due<\/strong> argomenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui <code>* + *<\/code> e una funzione a due argomenti che somma i suoi argomenti — ad esempio un totale parziale e l'elemento successivo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La stella Whatever da sola<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da sola, <code>*<\/code> significa \"qualsiasi cosa\" — tutto quello che c'e, o nessun limite.<\/span> <span class=\"sg\" data-s=\"1\">Due usi comuni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * è la lunghezza dell'array, quindi *-1 è l'ultimo indice\n\nsay (1..*).head(3); # (1 2 3)  — 1..* è un intervallo aperto<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> la stella rappresenta il numero di elementi, e in <code>1..*<\/code> rappresenta \"nessun limite superiore\".<\/span> <span class=\"sg\" data-s=\"1\">Che costruisca una funzione o significhi \"qualsiasi cosa tu voglia\", la stella e una delle abbreviazioni piu utili di Raku.<\/span><\/p>"]]},"lv":{"t":"Whatever zvaigzne 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs, iespējams, esat redzējuši <code>*<\/code>, kas lietots izteiksmēs, piemēram, <code>* * 2<\/code> vai <code>* %% 2<\/code>, izsaucot <code>map<\/code> un <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šī <code>*<\/code> ir <em>Whatever zvaigznīte<\/em>, un izteiksme ap to uz vietas uzbūvē mazu viena argumenta funkciju.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa paskaidro, kas tā īsti ir, kā tā saistās ar bloku un kur kailā zvaigznīte nozīmē vienkārši «cik nu vēlaties».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Zvaigznīte veido funkciju<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad izteiksmē parādās <code>*<\/code>, Raku pārvērš visu izteiksmi par funkciju — <code>WhateverCode<\/code> —, kurā zvaigznīte apzīmē argumentu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> ir funkcija, kas savu vienīgo argumentu reizina ar diviem.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tāpēc darbojas <code>(1..5).map(* * 2)<\/code>: <code>map<\/code> saņem tieši tādu viena argumenta funkciju.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever pret bloku<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Whatever izteiksme ir īsāks veids, kā uzrakstīt funkciju, ko varētu uzrakstīt arī kā bloku.<\/span> <span class=\"sg\" data-s=\"1\">Šie trīs ir līdzvērtīgi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever forma nenosauc nevienu parametru; bloka forma izmanto tēmas mainīgo <code>$_<\/code>; bultiņas forma nosauc <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēdējā, <code>-&gt; $x { ... }<\/code>, pati par sevi ir maza funkcija — ar to pienācīgi iepazīsieties sadaļā <a href=\"https://course.raku.org/lv/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonīmas apakšprogrammas<\/a>; šeit pietiek to lasīt kā trešo veidu, kā pierakstīt to pašu viena argumenta funkciju.<\/span> <span class=\"sg\" data-s=\"2\">Vienkāršai izteiksmei zvaigznīte ir viskompaktākā, un tieši tāpēc tā ir tik izplatīta ar <code>map<\/code>, <code>grep<\/code> un <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ķerieties pie <strong>bloka<\/strong>, kad loģikai vajag vairāk nekā vienu izteiksmi vai kad skaidrāks nosaukts parametrs palīdz.<\/span> <span class=\"sg\" data-s=\"1\">Ķerieties pie <strong>zvaigznītes<\/strong>, kad īsa izteiksme pasaka visu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viena zvaigznīte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katra <code>*<\/code> izteiksmē ir atsevišķs arguments, secībā.<\/span> <span class=\"sg\" data-s=\"1\">Tātad divas zvaigznītes veido <strong>divu<\/strong> argumentu funkciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>* + *<\/code> ir divu argumentu funkcija, kas saskaita savus argumentus — piemēram, uzkrāto summu un nākamo elementu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kailā Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pati par sevi <code>*<\/code> nozīmē «cik nu ir» — cik vien ir vai bez ierobežojuma.<\/span> <span class=\"sg\" data-s=\"1\">Divi ikdienišķi lietojumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is the array length, so *-1 is the last index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is an open-ended range<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izteiksmē <code>@a[*-1]<\/code> zvaigznīte apzīmē elementu skaitu, bet <code>1..*<\/code> tā nozīmē «bez augšējās robežas».<\/span> <span class=\"sg\" data-s=\"1\">Vai tā būvē funkciju, vai nozīmē «cik nu vēlaties», zvaigznīte ir viens no noderīgākajiem Raku saīsinājumiem.<\/span><\/p>"]]},"ru":{"t":"Звёздочка Whatever","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы, возможно, уже встречали <code>*<\/code> в выражениях вроде <code>* * 2<\/code> или <code>* %% 2<\/code> при вызове <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Эта <code>*<\/code> — так называемая <em>звёздочка Whatever<\/em>, и выражение вокруг неё на лету создаёт небольшую функцию с одним аргументом.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе объясняется, что она на самом деле собой представляет, как соотносится с блоком и где голая звёздочка означает просто «что угодно».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звёздочка создаёт функцию<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда <code>*<\/code> появляется в выражении, Raku превращает всё выражение в функцию — <code>WhateverCode<\/code>, — в которой звёздочка обозначает аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> — это функция, которая умножает свой единственный аргумент на два.<\/span> <span class=\"sg\" data-s=\"1\">Именно поэтому работает <code>(1..5).map(* * 2)<\/code>: <code>map<\/code> получает именно такую функцию с одним аргументом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever и блок<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Выражение с Whatever — это краткая запись функции, которую можно также записать в виде блока.<\/span> <span class=\"sg\" data-s=\"1\">Следующие три записи эквивалентны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В форме с Whatever параметр не указывается; в форме блока используется топик-переменная <code>$_<\/code>; в стрелочной форме явно задаётся <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Последний вариант, <code>-&gt; $x { ... }<\/code>, — это самостоятельная маленькая функция, с которой вы подробнее познакомитесь в разделе <a href=\"https://course.raku.org/ru/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонимные подпрограммы<\/a>; здесь достаточно воспринимать его как третий способ записать ту же функцию с одним аргументом.<\/span> <span class=\"sg\" data-s=\"2\">Для простого выражения звёздочка — самая компактная форма, поэтому она так часто используется с <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Используйте <strong>блок<\/strong>, когда логика требует нескольких выражений или когда именованный параметр делает код понятнее.<\/span> <span class=\"sg\" data-s=\"1\">Используйте <strong>звёздочку<\/strong>, когда короткое выражение говорит само за себя.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Несколько звёздочек<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая <code>*<\/code> в выражении — это отдельный аргумент, по порядку.<\/span> <span class=\"sg\" data-s=\"1\">Таким образом, две звёздочки создают функцию с <strong>двумя<\/strong> аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>* + *<\/code> — это функция с двумя аргументами, которая складывает их — например, промежуточную сумму и следующий элемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Голая звёздочка Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сама по себе <code>*<\/code> означает «что угодно» — сколько есть или без ограничения.<\/span> <span class=\"sg\" data-s=\"1\">Два повседневных примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * — это длина массива, поэтому *-1 — последний индекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* — это диапазон без верхней границы<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <code>@a[*-1]<\/code> звёздочка обозначает количество элементов, а в <code>1..*<\/code> — «без верхней границы».<\/span> <span class=\"sg\" data-s=\"1\">Создаёт ли она функцию или означает «что угодно» — звёздочка остаётся одним из самых полезных сокращений в Raku.<\/span><\/p>"]]},"uk":{"t":"Зірочка Whatever","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можливо, ви вже бачили <code>*<\/code> у виразах на кшталт <code>* * 2<\/code> або <code>* %% 2<\/code> під час виклику <code>map<\/code> і <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ця <code>*<\/code> — <em>зірочка Whatever<\/em>, і вираз навколо неї на льоту будує невеличку функцію з одним аргументом.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ пояснює, чим вона є насправді, як співвідноситься з блоком і де сама по собі зірочка означає просто «як завгодно».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зірочка створює функцію<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли <code>*<\/code> з'являється у виразі, Raku перетворює весь вираз на функцію — <code>WhateverCode<\/code>, — у якій зірочка позначає аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> — це функція, яка множить свій єдиний аргумент на два.<\/span> <span class=\"sg\" data-s=\"1\">Саме тому працює <code>(1..5).map(* * 2)<\/code>: до <code>map<\/code> потрапляє точно така функція з одним аргументом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever проти блоку<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вираз із Whatever — це коротший спосіб записати функцію, яку можна було б записати й блоком.<\/span> <span class=\"sg\" data-s=\"1\">Ці три записи рівносильні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Форма з Whatever не називає параметра; форма з блоком використовує топічну змінну <code>$_<\/code>; стрілкова форма називає його <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Остання, <code>-&gt; $x { ... }<\/code>, сама по собі є невеликою функцією — ви познайомитеся з нею як слід у розділі <a href=\"https://course.raku.org/uk/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонімні підпрограми<\/a>; тут досить читати її як третій спосіб записати ту саму функцію з одним аргументом.<\/span> <span class=\"sg\" data-s=\"2\">Для простого виразу зірочка найкомпактніша, — тому вона така поширена з <code>map<\/code>, <code>grep<\/code> і <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Беріть <strong>блок<\/strong>, коли логіка потребує більш ніж одного виразу або коли зрозуміліший іменований параметр стає в пригоді.<\/span> <span class=\"sg\" data-s=\"1\">Беріть <strong>зірочку<\/strong>, коли короткий вираз каже все.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше ніж одна зірочка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна <code>*<\/code> у виразі — це окремий аргумент, по порядку.<\/span> <span class=\"sg\" data-s=\"1\">Тож дві зірочки створюють функцію з <strong>двома<\/strong> аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут <code>* + *<\/code> — це функція двох аргументів, яка їх додає: наприклад, накопичену суму й наступний елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гола Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сама по собі <code>*<\/code> означає «як завгодно» — скільки є або без обмежень.<\/span> <span class=\"sg\" data-s=\"1\">Два повсякденні застосування:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * це довжина масиву, тож *-1 це останній індекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* це відкритий діапазон<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <code>@a[*-1]<\/code> зірочка позначає кількість елементів, а в <code>1..*<\/code> — «без верхньої межі».<\/span> <span class=\"sg\" data-s=\"1\">Чи будує вона функцію, чи означає «як завгодно», зірочка є одним із найкорисніших скорочень Raku.<\/span><\/p>"]]},"bg":{"t":"Звездата Whatever 🆕","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Може би сте виждали <code>*<\/code> в изрази като <code>* * 2<\/code> или <code>* %% 2<\/code> при извикване на <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тази <code>*<\/code> е <em>Whatever звездата<\/em>, а изразът около нея създава малка функция с един аргумент в движение.<\/span> <span class=\"sg\" data-s=\"2\">Тази секция обяснява какво всъщност представлява, как се отнася към блок и къде голата звезда означава просто \"каквото искате\".<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звездата създава функция<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато <code>*<\/code> се появи в израз, Raku превръща целия израз във функция — <code>WhateverCode<\/code> — в която звездата замества аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> е функция, която умножава единствения си аргумент по две.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>(1..5).map(* * 2)<\/code> работи: на <code>map<\/code> се подава точно такава функция с един аргумент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever срещу блок<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Whatever изразът е по-кратък начин за записване на функция, която бихте могли да запишете и като блок.<\/span> <span class=\"sg\" data-s=\"1\">Следните три са еквивалентни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever формата не назовава параметър; блоковата форма използва тематичната променлива <code>$_<\/code>; pointy формата назовава <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Последната, <code>-&gt; $x { ... }<\/code>, е малка самостоятелна функция — ще се запознаете с нея подробно в <a href=\"https://course.raku.org/bg/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонимни подпрограми<\/a>; тук е достатъчно да я четете като трети начин за записване на същата функция с един аргумент.<\/span> <span class=\"sg\" data-s=\"2\">За прост израз звездата е най-компактна, поради което е толкова често срещана с <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвайте <strong>блок<\/strong>, когато логиката изисква повече от един израз или когато по-ясен именуван параметър помага.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте <strong>звездата<\/strong>, когато кратък израз казва всичко.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от една звезда<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка <code>*<\/code> в израза е отделен аргумент, по ред.<\/span> <span class=\"sg\" data-s=\"1\">Така две звезди правят функция с <strong>два<\/strong> аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук <code>* + *<\/code> е функция с два аргумента, която събира аргументите си — например текуща сума и следващ елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Голата Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сама по себе си, <code>*<\/code> означава \"каквото и да е\" — колкото има, или без ограничение.<\/span> <span class=\"sg\" data-s=\"1\">Две ежедневни употреби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * е дължината на масива, така че *-1 е последният индекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* е отворен диапазон<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <code>@a[*-1]<\/code> звездата замества броя на елементите, а в <code>1..*<\/code> означава \"без горна граница\".<\/span> <span class=\"sg\" data-s=\"1\">Независимо дали създава функция или означава \"каквото искате\", звездата е едно от най-полезните съкращения в Raku.<\/span><\/p>"]]},"eo":{"t":"La Whatever-stelo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi eble vidis la <code>*<\/code> uzatan en esprimoj kiel <code>* * 2<\/code> aŭ <code>* %% 2<\/code> dum vokado de <code>map<\/code> kaj <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiu <code>*<\/code> estas la <em>Whatever-stelo<\/em>, kaj la esprimo ĉirkaŭ ĝi konstruas etan unu-argumentan funkcion senvole.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio klarigas kio ĝi vere estas, kiel ĝi rilatas al bloko, kaj kie la nuda stelo simple signifas \"kion ajn vi volas\".<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stelo kreas funkcion<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam <code>*<\/code> aperas en esprimo, Raku transformas la tutan esprimon en funkcion — <code>WhateverCode<\/code> — en kiu la stelo reprezentas la argumenton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> estas funkcio kiu multiplikas sian unu argumenton per du.<\/span> <span class=\"sg\" data-s=\"1\">Tial <code>(1..5).map(* * 2)<\/code> funkcias: <code>map<\/code> ricevas ĝuste tian unu-argumentan funkcion.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever kontraŭ bloko<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Whatever-esprimo estas pli mallonga maniero skribi funkcion, kiun vi ankaŭ povus skribi kiel blokon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj tri estas ekvivalentaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La Whatever-formo ne nomas parametron; la blok-formo uzas la teman variablon <code>$_<\/code>; la pintforma nomas <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiu lasta, <code>-&gt; $x { ... }<\/code>, estas memstara malgranda funkcio — vi renkontos ĝin ĝuste en <a href=\"https://course.raku.org/eo/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonimaj funkcioj<\/a>; ĉi tie sufiĉas legi ĝin kiel trian manieron skribi la saman unu-argumentan funkcion.<\/span> <span class=\"sg\" data-s=\"2\">Por simpla esprimo la stelo estas la plej kompakta, tial ĝi estas tiel ofta kun <code>map<\/code>, <code>grep<\/code>, kaj <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzu <strong>blokon<\/strong> kiam la logiko bezonas pli ol unu esprimon, aŭ kiam pli klara nomita parametro helpas.<\/span> <span class=\"sg\" data-s=\"1\">Uzu la <strong>stelon<\/strong> kiam mallonga esprimo diras ĉion.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu stelo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>*<\/code> en la esprimo estas aparta argumento, laŭ ordo.<\/span> <span class=\"sg\" data-s=\"1\">Do du steloj kreas <strong>du<\/strong>-argumentan funkcion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>* + *<\/code> estas du-argumenta funkcio kiu aldonas siajn argumentojn — ekzemple kuranta sumo kaj la sekva elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La nuda Whatever<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sole, <code>*<\/code> signifas \"kion ajn\" — tiom kiom ekzistas, aŭ sen limo.<\/span> <span class=\"sg\" data-s=\"1\">Du ĉiutagaj uzoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * estas la tabellongo, do *-1 estas la lasta indekso\n\nsay (1..*).head(3); # (1 2 3)  — 1..* estas senfinpunkta amplekso<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <code>@a[*-1]<\/code> la stelo reprezentas la nombron de elementoj, kaj en <code>1..*<\/code> ĝi signifas \"sen supra limo\".<\/span> <span class=\"sg\" data-s=\"1\">Ĉu ĝi konstruas funkcion aŭ signifas \"kion ajn vi volas\", la stelo estas unu el la plej utilaj mallongigoj de Raku.<\/span><\/p>"]]}}}</script>
