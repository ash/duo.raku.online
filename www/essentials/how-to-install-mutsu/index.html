<script type="application/json" id="page-data">{"u":"essentials/how-to-install-mutsu","n":9,"k":"section","pv":"essentials/the-mutsu-interpreter","nx":"essentials/editors-and-ides","tr":["essentials"],"L":{"en":{"t":"How to install mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu publishes ready-made builds for macOS and Linux, for both Intel/AMD and ARM processors, on the releases page of its GitHub repository, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Each build contains two executables: <code>mutsu<\/code> itself and <code>mzef<\/code>, its package manager.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">With mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The simplest way to install a release is <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, a tool that installs and updates developer tools.<\/span> <span class=\"sg\" data-s=\"1\">One command downloads the build for your machine and puts both <code>mutsu<\/code> and <code>mzef<\/code> on your <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">With Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On any system that runs Docker, Windows included, you can use mutsu without installing it.<\/span> <span class=\"sg\" data-s=\"1\">This starts the interactive REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And this runs a program from the current directory:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Building from source<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu is written in Rust, so you can also build it yourself with Cargo from the source code in its repository; the repository explains the details.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Version numbers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Check which version you have with the <code>--version<\/code> option:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">That is the release of mutsu itself.<\/span> <span class=\"sg\" data-s=\"1\">As with the other compilers, the version of the Raku language is something you can ask the language:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compare this with how <a href=\"/essentials/how-to-install-rakudo/\">Rakudo<\/a> and <a href=\"/essentials/how-to-install-rakupp/\">Raku++<\/a> report themselves.<\/span><\/p>"]]},"de":{"t":"Wie man mutsu installiert","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu veröffentlicht fertige Builds für macOS und Linux, jeweils für Intel/AMD- und ARM-Prozessoren, auf der Releases-Seite seines GitHub-Repositorys <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Build enthält zwei ausführbare Dateien: <code>mutsu<\/code> selbst und <code>mzef<\/code>, seinen Paketmanager.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mit mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Am einfachsten installieren Sie eine Veröffentlichung mit <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, einem Werkzeug, das Entwicklerwerkzeuge installiert und aktualisiert.<\/span> <span class=\"sg\" data-s=\"1\">Ein einziger Befehl lädt den passenden Build für Ihren Rechner herunter und nimmt sowohl <code>mutsu<\/code> als auch <code>mzef<\/code> in Ihren <code>PATH<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mit Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Auf jedem System, auf dem Docker läuft, Windows eingeschlossen, können Sie mutsu verwenden, ohne ihn zu installieren.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Befehl startet die interaktive REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und dieser führt ein Programm aus dem aktuellen Verzeichnis aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aus dem Quellcode bauen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu ist in Rust geschrieben, daher können Sie ihn auch selbst mit Cargo aus dem Quellcode in seinem Repository bauen; die Einzelheiten erklärt das Repository.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versionsnummern<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Welche Version Sie haben, sehen Sie mit der Option <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist die Veröffentlichung von mutsu selbst.<\/span> <span class=\"sg\" data-s=\"1\">Wie bei den anderen Compilern können Sie die Version der Sprache Raku bei der Sprache selbst erfragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergleichen Sie das damit, wie sich <a href=\"https://course.raku.org/de/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> und <a href=\"https://course.raku.org/de/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> melden.<\/span><\/p>"]]},"nl":{"t":"mutsu installeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu publiceert kant-en-klare builds voor macOS en Linux, zowel voor Intel/AMD- als voor ARM-processors, op de releasespagina van zijn GitHub-repository, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Elke build bevat twee uitvoerbare bestanden: <code>mutsu<\/code> zelf en <code>mzef<\/code>, zijn pakketbeheerder.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Met mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste manier om een uitgave te installeren is <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, een hulpmiddel dat ontwikkelaarstools installeert en bijwerkt.<\/span> <span class=\"sg\" data-s=\"1\">Eén opdracht downloadt de build voor jouw machine en zet zowel <code>mutsu<\/code> als <code>mzef<\/code> in je <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Met Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Op elk systeem waarop Docker draait, Windows inbegrepen, kun je mutsu gebruiken zonder hem te installeren.<\/span> <span class=\"sg\" data-s=\"1\">Dit start de interactieve REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En dit voert een programma uit de huidige map uit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bouwen vanaf de broncode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu is in Rust geschreven, dus je kunt hem ook zelf met Cargo bouwen vanaf de broncode in zijn repository; de repository legt de details uit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt met de optie <code>--version<\/code> controleren welke versie je hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dat is de uitgave van mutsu zelf.<\/span> <span class=\"sg\" data-s=\"1\">Net als bij de andere compilers kun je de versie van de taal Raku aan de taal zelf vragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergelijk dit met hoe <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> en <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> zichzelf melden.<\/span><\/p>"]]},"es":{"t":"Cómo instalar mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu publica versiones ya compiladas para macOS y Linux, tanto para procesadores Intel/AMD como ARM, en la página de versiones de su repositorio de GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Cada una contiene dos ejecutables: el propio <code>mutsu<\/code> y <code>mzef<\/code>, su gestor de paquetes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Con mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma más sencilla de instalar una versión es <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, una herramienta que instala y actualiza herramientas de desarrollo.<\/span> <span class=\"sg\" data-s=\"1\">Un solo comando descarga la versión adecuada para tu máquina y pone tanto <code>mutsu<\/code> como <code>mzef<\/code> en tu <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Con Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En cualquier sistema que ejecute Docker, Windows incluido, puedes usar mutsu sin instalarlo.<\/span> <span class=\"sg\" data-s=\"1\">Esto inicia el REPL interactivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y esto ejecuta un programa del directorio actual:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Compilar a partir del código fuente<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu está escrito en Rust, así que también puedes compilarlo tú mismo con Cargo a partir del código fuente de su repositorio; el repositorio explica los detalles.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Comprueba qué versión tienes con la opción <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esa es la versión del propio mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Como con los otros compiladores, la versión del lenguaje Raku es algo que puedes preguntarle al propio lenguaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compáralo con cómo se presentan <a href=\"https://course.raku.org/es/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> y <a href=\"https://course.raku.org/es/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"it":{"t":"Come installare mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu pubblica build già pronte per macOS e Linux, sia per processori Intel/AMD sia per processori ARM, nella pagina delle release del suo repository GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni build contiene due eseguibili: <code>mutsu<\/code> stesso e <code>mzef<\/code>, il suo gestore di pacchetti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Con mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il modo più semplice per installare una release è <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, uno strumento che installa e aggiorna gli strumenti per sviluppatori.<\/span> <span class=\"sg\" data-s=\"1\">Un solo comando scarica la build per la tua macchina e mette sia <code>mutsu<\/code> sia <code>mzef<\/code> nel tuo <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Con Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Su qualsiasi sistema su cui gira Docker, Windows compreso, puoi usare mutsu senza installarlo.<\/span> <span class=\"sg\" data-s=\"1\">Questo comando avvia il REPL interattivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E questo esegue un programma dalla directory corrente:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Compilazione dal codice sorgente<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu è scritto in Rust, quindi puoi anche compilarlo tu stesso con Cargo a partire dal codice sorgente nel suo repository; il repository spiega i dettagli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi controllare quale versione hai con l'opzione <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa è la release di mutsu stesso.<\/span> <span class=\"sg\" data-s=\"1\">Come per gli altri compilatori, la versione del linguaggio Raku è qualcosa che puoi chiedere al linguaggio:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Confronta queste informazioni con il modo in cui si presentano <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> e <a href=\"https://course.raku.org/it/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu publicē gatavus būvējumus macOS un Linux sistēmām — gan Intel/AMD, gan ARM procesoriem — sava GitHub repozitorija <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a> izlaidumu lappusē.<\/span> <span class=\"sg\" data-s=\"1\">Katrā būvējumā ir divi izpildāmie faili: pats <code>mutsu<\/code> un <code>mzef<\/code>, tā pakotņu pārvaldnieks.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ar mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākais veids, kā instalēt izlaidumu, ir <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a> — rīks, kas instalē un atjaunina izstrādātāju rīkus.<\/span> <span class=\"sg\" data-s=\"1\">Viena komanda lejupielādē jūsu datoram atbilstošo būvējumu un padara gan <code>mutsu<\/code>, gan <code>mzef<\/code> pieejamus caur jūsu <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ar Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jebkurā sistēmā, kurā darbojas Docker, arī Windows, mutsu var lietot, to neinstalējot.<\/span> <span class=\"sg\" data-s=\"1\">Šī komanda palaiž interaktīvo REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bet šī izpilda programmu no pašreizējā direktorija:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Būvēšana no pirmkoda<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu ir uzrakstīts Rust valodā, tāpēc to var arī uzbūvēt pašam ar Cargo no pirmkoda, kas atrodas tā repozitorijā; sīkāk tas ir paskaidrots repozitorijā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kāda versija jums ir, var pārbaudīt ar opciju <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir paša mutsu izlaidums.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā ar pārējiem kompilatoriem, Raku valodas versiju varat pajautāt pašai valodai:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar to, kā sevi piesaka <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> un <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"ru":{"t":"Как установить mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Готовые сборки mutsu для macOS и Linux — как для процессоров Intel/AMD, так и для ARM — публикуются на странице релизов его репозитория на GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Каждая сборка содержит два исполняемых файла: сам <code>mutsu<\/code> и <code>mzef<\/code>, его менеджер пакетов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С помощью mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Проще всего установить выпуск с помощью <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a> — программы, которая устанавливает и обновляет инструменты разработчика.<\/span> <span class=\"sg\" data-s=\"1\">Одна команда скачивает сборку для вашего компьютера и добавляет в ваш <code>PATH<\/code> и <code>mutsu<\/code>, и <code>mzef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С помощью Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В любой системе, где работает Docker, включая Windows, mutsu можно использовать, не устанавливая его.<\/span> <span class=\"sg\" data-s=\"1\">Эта команда запускает интерактивную оболочку REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А эта запускает программу из текущего каталога:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сборка из исходного кода<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu написан на Rust, поэтому его можно собрать и самостоятельно с помощью Cargo из исходного кода в его репозитории; подробности описаны в самом репозитории.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Узнать, какая у вас версия, можно с помощью опции <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это выпуск самого mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Как и в случае с другими компиляторами, версию языка Raku можно узнать у самого языка:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравните это с тем, как представляются <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> и <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"uk":{"t":"Як встановити mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Готові збірки mutsu для macOS і Linux — як для процесорів Intel/AMD, так і для ARM — публікуються на сторінці випусків його репозиторію на GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Кожна збірка містить два виконувані файли: сам <code>mutsu<\/code> і <code>mzef<\/code>, його менеджер пакетів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За допомогою mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Найпростіше встановити випуск за допомогою <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a> — програми, яка встановлює й оновлює інструменти розробника.<\/span> <span class=\"sg\" data-s=\"1\">Одна команда завантажує збірку для вашого комп'ютера та додає до вашого <code>PATH<\/code> і <code>mutsu<\/code>, і <code>mzef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За допомогою Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У будь-якій системі, де працює Docker, зокрема й у Windows, mutsu можна використовувати, не встановлюючи його.<\/span> <span class=\"sg\" data-s=\"1\">Ця команда запускає інтерактивну оболонку REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А ця запускає програму з поточного каталогу:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Збирання з вихідного коду<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu написано мовою Rust, тож ви можете зібрати його й самостійно за допомогою Cargo з вихідного коду в його репозиторії; подробиці пояснено в самому репозиторії.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дізнатися, яка версія у вас, можна за допомогою опції <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це випуск самого mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Як і з іншими компіляторами, версію мови Raku можна запитати в самої мови:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порівняйте це з тим, як представляють себе <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> і <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu публикува готови компилации за macOS и Linux, както за процесори Intel/AMD, така и за ARM, на страницата с издания на хранилището си в GitHub — <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка компилация съдържа два изпълними файла: самия <code>mutsu<\/code> и <code>mzef<\/code>, неговия мениджър на пакети.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Най-лесният начин да инсталирате издание е <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a> — програма, която инсталира и обновява инструменти за разработчици.<\/span> <span class=\"sg\" data-s=\"1\">Една команда изтегля компилацията за вашата машина и поставя във вашия <code>PATH<\/code> както <code>mutsu<\/code>, така и <code>mzef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На всяка система, на която работи Docker, включително Windows, можете да използвате mutsu, без да го инсталирате.<\/span> <span class=\"sg\" data-s=\"1\">Това стартира интерактивната обвивка REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А това изпълнява програма от текущата директория:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изграждане от изходния код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu е написан на Rust, така че можете и сами да го изградите с Cargo от изходния код в хранилището му; хранилището обяснява подробностите.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Проверете коя версия имате с опцията <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е изданието на самия mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Както и при другите компилатори, за версията на езика Raku можете да попитате самия език:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравнете това с начина, по който се представят <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> и <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"eo":{"t":"Kiel instali mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu publikigas pretajn binaraĵojn por macOS kaj Linukso, por procesoroj kaj Intel/AMD kaj ARM, en la eldona paĝo de sia deponejo en GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu el ili enhavas du ruleblajn dosierojn: <code>mutsu<\/code> mem kaj <code>mzef<\/code>, ĝian pakaĵadministrilon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Per mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La plej simpla maniero instali eldonon estas <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, ilo, kiu instalas kaj ĝisdatigas programistajn ilojn.<\/span> <span class=\"sg\" data-s=\"1\">Unu sola komando elŝutas la binaraĵon por via maŝino kaj metas kaj <code>mutsu<\/code> kaj <code>mzef<\/code> en vian <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Per Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sur ĉiu sistemo, kiu rulas Docker, inkluzive de Vindozo, vi povas uzi mutsu sen instali ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio lanĉas la interagan ŝelon REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj ĉi tio rulas programon el la nuna dosierujo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konstrui el la fontkodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu estas skribita en Rust, do vi ankaŭ povas mem konstrui ĝin per Cargo el la fontkodo en ĝia deponejo; la deponejo klarigas la detalojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiaj numeroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kontrolu, kiun version vi havas, per la opcio <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio estas la eldono de mutsu mem.<\/span> <span class=\"sg\" data-s=\"1\">Same kiel ĉe la aliaj kompililoj, la versio de la lingvo Raku estas io, pri kio vi povas demandi la lingvon mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Komparu tion kun tio, kiel <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> raportas sin.<\/span><\/p>"]]},"la":{"t":"Quomodo mutsu installare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu versiones paratas pro macOS et Linux, tam pro processoriis Intel/AMD quam pro ARM, in pagina emissionum repositorii sui GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>, publicat.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque versio duo programmata exsecutabilia continet: ipsum <code>mutsu<\/code> et <code>mzef<\/code>, instrumentum eius moderandi modulos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cum mise<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Via simplicissima emissionem installandi est <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>, instrumentum quod instrumenta programmandi installat et renovat.<\/span> <span class=\"sg\" data-s=\"1\">Unum imperatum versionem machinae tuae aptam deprimit atque <code>mutsu<\/code> et <code>mzef<\/code> ambo in <code>PATH<\/code> tuum ponit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cum Docker<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In quovis systemate in quo Docker currit, Windows non excepto, mutsu uti potes eo non installato.<\/span> <span class=\"sg\" data-s=\"1\">Hoc corticem REPL interactivum incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et hoc programma ex directoria currenti exsequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ex codice fonte aedificare<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu in Rust scriptus est, itaque eum etiam ipse cum Cargo ex codice fonte in repositorio eius aedificare potes; repositorium singula explicat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quam versionem habeas per optionem <code>--version<\/code> inspice:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec est emissio ipsius mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Ut apud alios compilatores, versio linguae Raku res est quam ab ipsa lingua quaerere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc confer cum modo quo <a href=\"https://course.raku.org/la/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> et <a href=\"https://course.raku.org/la/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> se ipsos nuntiant.<\/span><\/p>"]]}}}</script>
