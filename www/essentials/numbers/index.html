<script type="application/json" id="page-data">{"u":"essentials/numbers","n":73,"k":"section","pv":"essentials/strings/quiz","nx":"essentials/numbers/integers","tr":["essentials"],"L":{"en":{"t":"Numbers in Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Let us talk about numbers.<\/span> <span class=\"sg\" data-s=\"1\">We already used them a bit in the previous sections and exercises, but there’s still something to talk about.<\/span> <span class=\"sg\" data-s=\"2\">Of course, some aspects of using numbers in Raku are trivial and you don’t need any explanations or instructions.<\/span> <span class=\"sg\" data-s=\"3\">So, let us focus on what makes numbers special in Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Explore the following topics to get the idea of the most important differences in how Raku treats numbers compared to other languages.<\/span><\/p>"]]},"de":{"t":"Zahlen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie uns über Zahlen sprechen.<\/span> <span class=\"sg\" data-s=\"1\">Wir haben sie bereits in den vorherigen Abschnitten und Übungen ein wenig verwendet, aber es gibt noch einiges zu besprechen.<\/span> <span class=\"sg\" data-s=\"2\">Natürlich sind einige Aspekte der Verwendung von Zahlen in Raku trivial und bedürfen keiner Erklärungen oder Anweisungen.<\/span> <span class=\"sg\" data-s=\"3\">Lassen Sie uns also auf das konzentrieren, was Zahlen in Raku besonders macht.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Erkunden Sie die folgenden Themen, um eine Vorstellung von den wichtigsten Unterschieden zu bekommen, wie Raku Zahlen im Vergleich zu anderen Sprachen behandelt.<\/span><\/p>"]]},"nl":{"t":"Getallen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Laten we het hebben over getallen.<\/span> <span class=\"sg\" data-s=\"1\">We hebben ze al een beetje gebruikt in de vorige secties en oefeningen, maar er is nog steeds iets om over te praten.<\/span> <span class=\"sg\" data-s=\"2\">Natuurlijk zijn sommige aspecten van het gebruik van getallen in Raku triviaal en heb je geen uitleg of instructies nodig.<\/span> <span class=\"sg\" data-s=\"3\">Dus laten we ons richten op wat getallen speciaal maakt in Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verken de volgende onderwerpen om een idee te krijgen van de belangrijkste verschillen in hoe Raku getallen behandelt in vergelijking met andere talen.<\/span><\/p>"]]},"es":{"t":"Números","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hablemos de números.<\/span> <span class=\"sg\" data-s=\"1\">Ya los hemos usado un poco en las secciones y ejercicios anteriores, pero aún hay algo de qué hablar.<\/span> <span class=\"sg\" data-s=\"2\">Por supuesto, algunos aspectos del uso de números en Raku son triviales y no necesitas ninguna explicación o instrucción.<\/span> <span class=\"sg\" data-s=\"3\">Así que, enfoquémonos en lo que hace que los números sean especiales en Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Explora los siguientes temas para obtener una idea de las diferencias más importantes en cómo Raku trata los números en comparación con otros lenguajes.<\/span><\/p>"]]},"it":{"t":"Numeri","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Parliamo di numeri.<\/span> <span class=\"sg\" data-s=\"1\">Li abbiamo già usati un po' nelle sezioni ed esercizi precedenti, ma c'è ancora qualcosa di cui parlare.<\/span> <span class=\"sg\" data-s=\"2\">Ovviamente, alcuni aspetti dell'uso dei numeri in Raku sono banali e non necessitano di spiegazioni o istruzioni.<\/span> <span class=\"sg\" data-s=\"3\">Quindi, concentriamoci su ciò che rende i numeri speciali in Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esplora i seguenti argomenti per avere un'idea delle differenze più importanti su come Raku tratta i numeri rispetto ad altri linguaggi.<\/span><\/p>"]]},"lv":{"t":"Skaitļi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Parunāsim par skaitļiem.<\/span> <span class=\"sg\" data-s=\"1\">Mēs jau nedaudz tos izmantojām iepriekšējās sadaļās un uzdevumos, bet vēl ir par ko runāt.<\/span> <span class=\"sg\" data-s=\"2\">Protams, daži skaitļu izmantošanas aspekti Raku valodā ir triviāli un jums nav nepieciešami nekādi paskaidrojumi vai instrukcijas.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc pievērsīsimies tam, kas padara skaitļus īpašus Raku valodā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izpētiet šīs tēmas, lai iegūtu priekšstatu par svarīgākajām atšķirībām, kā Raku apstrādā skaitļus salīdzinājumā ar citām valodām.<\/span><\/p>"]]},"ru":{"t":"Числа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Давайте поговорим о числах.<\/span> <span class=\"sg\" data-s=\"1\">Мы уже немного использовали их в предыдущих главах и упражнениях, но есть еще пара тем, о которых стоит поговорить.<\/span> <span class=\"sg\" data-s=\"2\">Разумеется, что некоторые аспекты использования чисел в Raku тривиальны и не требуют каких-либо объяснений или указаний.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому давайте сконцентрируемся на том, что делает числа в Raku особенными.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ознакомьтесь со следующими темами, чтобы приобрести понимание того, как Raku отличается от других языков в использовании чисел.<\/span><\/p>"]]},"uk":{"t":"Числа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Давайте поговоримо про числа.<\/span> <span class=\"sg\" data-s=\"1\">Ми вже трохи використовували їх у попередніх розділах та вправах, але ще є про що поговорити.<\/span> <span class=\"sg\" data-s=\"2\">Звичайно, деякі аспекти використання чисел у Raku є тривіальними і не потребують жодних пояснень чи інструкцій.<\/span> <span class=\"sg\" data-s=\"3\">Тож, давайте зосередимося на тому, що робить числа особливими в Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Досліджуйте наступні теми, щоб отримати уявлення про найважливіші відмінності в тому, як Raku обробляє числа порівняно з іншими мовами.<\/span><\/p>"]]},"bg":{"t":"Числа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Нека поговорим за числата.<\/span> <span class=\"sg\" data-s=\"1\">Вече ги използвахме малко в предишните секции и упражнения, но все още има неща, за които да говорим.<\/span> <span class=\"sg\" data-s=\"2\">Разбира се, някои аспекти на използването на числа в Raku са тривиални и не се нуждаете от никакви обяснения или инструкции.<\/span> <span class=\"sg\" data-s=\"3\">Така че, нека се фокусираме върху това, което прави числата специални в Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте следните теми, за да получите представа за най-важните разлики в начина, по който Raku третира числата в сравнение с други езици.<\/span><\/p>"]]},"eo":{"t":"Nombroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ni parolu pri nombroj.<\/span> <span class=\"sg\" data-s=\"1\">Ni jam iomete uzis ilin en la antaŭaj sekcioj kaj ekzercoj, sed ankoraŭ estas io por paroli.<\/span> <span class=\"sg\" data-s=\"2\">Kompreneble, iuj aspektoj de uzado de nombroj en Raku estas trivialaj kaj vi ne bezonas iujn ajn klarigojn aŭ instrukciojn.<\/span> <span class=\"sg\" data-s=\"3\">Do, ni fokusiĝu pri tio, kio faras nombrojn specialaj en Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esploru la jenajn temojn por akiri ideon pri la plej gravaj diferencoj en kiel Raku traktas nombrojn kompare kun aliaj lingvoj.<\/span><\/p>"]]},"la":{"t":"Numeri","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De numeris loquamur.<\/span> <span class=\"sg\" data-s=\"1\">Iam eos paulum in sectionibus et exercitationibus praecedentibus usi sumus, sed adhuc aliquid est de quo dicendum.<\/span> <span class=\"sg\" data-s=\"2\">Scilicet, quaedam aspecta usus numerorum in Raku triviales sunt et nullas explicationes vel instructiones requirunt.<\/span> <span class=\"sg\" data-s=\"3\">Ergo, de eo quod numeros in Raku speciales facit disseramus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Explora sequentes themata ut ideam habeas de maximis differentiis in modo quo Raku numeros tractat comparatum ad alias linguas.<\/span><\/p>"]]}}}</script>
