допълнително бюро.<\/span><\/p>"]]},"eo":{"t":"Solvo: Klasaj skribotabloj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La solvo al la problemo estas montrita sube.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $students = 23;\n\nmy $desks = $students div 2 + $students % 2;\n\nsay \"$desks desks must be bought.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la plenan kodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/numbers/class-desks.raku\" target=\"_blank\" rel=\"noopener\">class-desks.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon almenaŭ dufoje provante ambaŭ neparan kaj paran nombron de studentoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, por la eniraj nombroj <code>23<\/code> kaj <code>24<\/code>, la programo presas la saman rezulton:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/numbers/class-desks.raku\n12 desks must be bought.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ne sufiĉas nur dividi la nombron de studentoj per du.<\/span> <span class=\"sg\" data-s=\"1\">Gravas trakti ambaŭ neparajn kaj parajn nombrojn.<\/span> <span class=\"sg\" data-s=\"2\">Unu el la eblaj solvoj por rondigi la nombron supren: <code>$students div 2 + $students % 2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kiam la nombro de studentoj estas para, la dua komponento estas nulo, kaj la rezulto estas egala al duono de la nombro de studentoj.<\/span> <span class=\"sg\" data-s=\"4\">Sed kiam la nombro de studentoj estas nepara, la unua komponento estas ankoraŭ entjera nombro pro <code>div<\/code> anstataŭ <code>/<\/code>, kaj la dua termino de la esprimo aldonas ekstran skribotablon.<\/span><\/p>"]]},"la":{"t":"Solutio: Classis scrinia","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Solutio ad problema infra ostenditur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $students = 23;\n\nmy $desks = $students div 2 + $students % 2;\n\nsay \"$desks desks must be bought.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem plenum invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/numbers/class-desks.raku\" target=\"_blank\" rel=\"noopener\">class-desks.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma bis saltem currere tenta cum numero discipulorum pari et impari.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, pro numeris input <code>23<\/code> et <code>24<\/code>, programma eundem eventum imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/numbers/class-desks.raku\n12 desks must be bought.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Non satis est solum numerum discipulorum per duo dividere.<\/span> <span class=\"sg\" data-s=\"1\">Interest tractare numeros pares et impares.<\/span> <span class=\"sg\" data-s=\"2\">Una ex solutionibus possibilibus ad numerum rotundum: <code>$students div 2 + $students % 2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Cum numerus discipulorum par est, secunda pars nulla est, et eventus aequalis est dimidio numeri discipulorum.<\/span> <span class=\"sg\" data-s=\"4\">Sed cum numerus discipulorum impar est, prima pars adhuc numerus integer est propter <code>div<\/code> pro <code>/<\/code>, et secunda pars expressionis addit extra mensam.<\/span><\/p>"]]}}}</script>
