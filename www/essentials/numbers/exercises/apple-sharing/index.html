g\" data-s=\"0\">Kiom da pomoj ĉiu persono ricevas?<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Kiom da pomoj restas en la korbo?<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La eniraj nombroj <em>N<\/em> kaj <em>K<\/em> devus esti fiksitaj kaj asignitaj al la variabloj, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $N = 3;\nmy $K = 11;\n\n# Via kodo ĉi tie . . .<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konsideru la pomojn atomaj, do vi ne povas tranĉi ilin en pecojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun la nombroj donitaj supre, ni atendas ke la programo printu la jenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku apple-sharing.raku\nĈiu persono ricevas 3 pomo(j)n.\nEstas 2 pomo(j)n restantaj.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi-momente, ignoru meti la substantivojn en la ĝustan formon kaj ne konsideru eble malagrablan eliron kiam la restanta nombro estas nulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/numbers/exercises/apple-sharing/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Pomum communicatio","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>N<\/em> homines aequaliter distribuunt <em>K<\/em> poma inter se.<\/span> <span class=\"sg\" data-s=\"1\">Programa crea quod ad haec quaestiones respondet:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Quot poma singulus homo accipit?<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Quot poma in corbe remanent?<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Numeri input <em>N<\/em> et <em>K<\/em> debent esse praedefiniti et variabilibus assignati, exempli gratia:<\/span><\/p>"],["code",0,"
