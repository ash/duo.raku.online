[["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Datentyp <code>Int<\/code> repräsentiert ganze Zahlen.<\/span> <span class=\"sg\" data-s=\"1\">Zahlen können positiv und negativ sein, und du kannst ein explizites <code>+<\/code>-Zeichen verwenden, wenn du möchtest.<\/span> <span class=\"sg\" data-s=\"2\">Hier sind ein paar offensichtliche Beispiele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja, eine nackte <code>0<\/code> wird standardmäßig als ganze Zahl betrachtet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Gruppen von Ziffern<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine nette Funktion, die es dir ermöglicht, große Zahlen mit visuellen Hilfsmitteln zu schreiben, die die Ziffern in Tausendergruppen aufteilen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Obwohl du eine Zahl wie <code>34_56<\/code> konstruieren kannst, solltest du dies besser vermeiden, da dies andere Personen, die deinen Code lesen, verwirren könnte.<\/span> <span class=\"sg\" data-s=\"1\">Aber du kannst keine zwei aufeinanderfolgenden Unterstriche haben, und du kannst die Zahl weder mit einem Unterstrich beginnen noch beenden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beliebig lange ganze Zahlen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku kann Zahlen, die über die 32- oder 64-Bit-Grenzen hinausgehen, perfekt handhaben.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel ist das folgende Programm ein akzeptables Programm, das zwei große ganze Zahlen multipliziert und das korrekte Ergebnis ausgibt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"nl":{"t":"Gehele getallen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het <code>Int<\/code> ge ><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ciparu grupas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku ir jauka funkcija, kas ļauj rakstīt lielus skaitļus ar vizuāliem palīglīdzekļiem, kas sadala ciparus tūkstošu grupās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai gan varat izveidot tādu skaitli kā <code>34_56<\/code>, labāk no tā izvairīties, jo tas var sajaukt citus cilvēkus, kas lasa jūsu kodu.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs nevarat izmantot divas blakus esošas pasvītras, tāpat jūs nevarat sākt vai beigt skaitli ar to.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Patvaļīgi gari veseli skaitļi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku lieliski apstrādā skaitļus, kas pārsniedz 32 vai 64 bitu robežas.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šāda programma ir pieņemama programma, kas reizinās divus lielus veselos skaitļus un izdrukās pareizu rezultātu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"ru":{"t":"Целые числа","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип данных <code>Int<\/code> представляет целые числа.<\/span> <span class=\"sg\" data-s=\"1\">Они могут быть положительными и отрицательными, вы даже можете явно использовать знак <code>+<\/code>, если хотите.<\/span> <span class=\"sg\" data-s=\"2\">Вот несколько очевидных примеров:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Да, простой <code>0<\/code> считается целым числом по умолчанию.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Группы цифр<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В Raku есть удобный синтаксис для написания больших чисел с визуальными разделителями, которые разделяют числа на тысячи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И хотя вы можете писать числа как <code>34_56<\/code>, лучше этого избегать, чтобы не оставлять других людей в замешательстве, когда они будут читать ваш код.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стоит учитывать, что в числах не может быть два смежных нижних подчеркивания, а также число не может начинаться или заканчиваться на нижнее подчеркивание.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сколь угодно длинные числа<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku нет проблем при работе с числами, которые требуют больше, чем 32 или 64 бита.<\/span> <span class=\"sg\" data-s=\"1\">Например, следующая программа совершенно приемлема, она перемножает два больших целых числа и выводит верный результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"uk":{"t":"Цілі числа","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип даних <code>Int<\/code> представляє цілі числа.<\/span> <span class=\"sg\" data-s=\"1\">Числа можуть бути додатними і від'ємними, і ви можете використовувати явний знак <code>+<\/code>, якщо хочете.<\/span> <span class=\"sg\" data-s=\"2\">Ось кілька очевидних прикладів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так, звичайний <code>0<\/code> за замовчуванням вважається цілим числом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Групи цифр<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku має цікаву функцію, яка дозволяє писати великі числа з деякими візуальними допоміжними засобами, що розділяють цифри на групи тисяч:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хоча ви можете створити число, таке як <code>34_56<\/code>, краще уникати цього, оскільки це може збити з пантелику інших людей, які читають ваш код.<\/span> <span class=\"sg\" data-s=\"1\">Але ви не можете мати два суміжні підкреслення, а також не можете починати або закінчувати число з підкресленням.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довільно довгі цілі числа<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku прекрасно обробляє числа, що виходять за межі 32- або 64-бітних обмежень.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, наступна програма є прийнятною програмою, яка множить два великі цілі числа і виводить правильний результат.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"bg":{"t":"Цели числа","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Типът данни <code>Int<\/code> представлява цели числа.<\/span> <span class=\"sg\" data-s=\"1\">Числата могат да бъдат положителни и отрицателни, и можете да използвате явен знак <code>+<\/code>, ако желаете.<\/span> <span class=\"sg\" data-s=\"2\">Ето няколко очевидни примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Да, едно просто <code>0<\/code> по подразбиране се счита за цяло число.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Групи от цифри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku има интересна функция, която ви позволява да изписвате големи числа с визуални помощници, които разделят цифрите на групи от хиляди:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Въпреки че можете да създадете число като <code>34_56<\/code>, по-добре е да го избягвате, тъй като това може да обърка други хора, които четат вашия код.<\/span> <span class=\"sg\" data-s=\"1\">Но не можете да имате две съседни долни черти, нито можете да започнете или завършите числото с тях.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Произволно дълги цели числа<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku перфектно обработва числата, които надхвърлят границите на 32- или 64-битови числа.<\/span> <span class=\"sg\" data-s=\"1\">Например, следната програма е приемлива програма, която умножава две големи цели числа и отпечатва правилния резултат.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"eo":{"t":"Entjeraj nombroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La datentipo <code>Int<\/code> reprezentas entjerajn nombrojn.<\/span> <span class=\"sg\" data-s=\"1\">Nombroj povas esti pozitivaj kaj negativaj, kaj vi povas uzi eksplicitan <code>+<\/code> signon se vi volas.<\/span> <span class=\"sg\" data-s=\"2\">Jen kelkaj evidentaj ekzemploj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jes, nura <code>0<\/code> estas konsiderata entjero defaŭlte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Grupoj de ciferoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku havas ĉarman trajton kiu permesas al vi literumi grandajn nombrojn kun kelkaj vidaj helpiloj kiuj dividas la ciferojn en grupojn de miloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kvankam vi povas konstrui numeron kiel <code>34_56<\/code>, vi prefere evitu ĝin ĉar tio povas konfuzi aliajn homojn legantajn vian kodon.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ne povas havi du apudajn substrekojn, nek vi povas komenci aŭ fini la numeron per ĝi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Arbitre longaj entjeroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku perfekte traktas la nombrojn preter la limoj de 32 aŭ 64 bitoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la sekva programo estas akceptebla programo kiu multobligas du grandajn entjerajn nombrojn kaj presas la ĝustan rezulton.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"la":{"t":"Numeri integri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Typus datorum <code>Int<\/code> numeros integros repraesentat.<\/span> <span class=\"sg\" data-s=\"1\">Numeri possunt esse positi et negativi, et potes uti signo explicito <code>+<\/code> si vis.<\/span> <span class=\"sg\" data-s=\"2\">Hic sunt pauca exempla manifesta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ita, nudus <code>0<\/code> per defaltam integer consideratur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Greges digitorum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku habet venustum munus quod permittit te numeros magnos scribere cum aliquibus adiutoribus visualibus qui digitos in greges milium dividunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etsi potes construere numerum sicut <code>34_56<\/code>, melius est hoc vitare ut alios legentes codicem tuum non confundas.<\/span> <span class=\"sg\" data-s=\"1\">Sed non potes habere duos underscores adiacentis, nec potes numerum cum eo incipere nec finire.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri integri arbitrarii longitudinis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku perfecte tractat numeros ultra limites 32- vel 64-bitarum.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, sequens programma est programma acceptabile quod multiplicat duos magnos numeros integros et rectum eventum imprimit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]}}}</script>
