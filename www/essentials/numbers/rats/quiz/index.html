t is-right\"><span class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">This is a division of two <code>Rat<\/code> numbers, but the result is also a <code>Rat<\/code> number.<\/span><\/span><\/li><\/ul>"]]},"de":{"t":"Quiz: Rationale Zahlen in Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wählen Sie die Zahlen aus, die in Raku <code>Rat<\/code> sind.<\/span><\/p>"],["raw",0,"<!--0 | ↉ | Dies ist eine `Int` Zahl, und ihr Wert ist `0`.-->"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">3/64<span class=\"quiz-note\">Dies ist eine <code>Rat<\/code> Zahl, keine Division von zwei ganzen Zahlen.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">⅞<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">2.718281828459045<span class=\"quiz-note\">Das ist ein Näherungswert der Eulerschen Konstante, aber dies ist immer noch eine <code>Rat<\/code>, da sie nicht unendlich lang ist.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">10_230/50_245<span class=\"quiz-note\">Sie können hier auch den <code>_<\/code> Trennzeichen verwenden.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">10.345_678<span class=\"quiz-note\">Und hier.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">10.345,678<span class=\"quiz-note\">Ein Komma hier ist weder ein Dezimalkomma noch ein Trennzeichen.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">&lt;33/44&gt;<span class=\"quiz-note\">Eine andere Form, rationale Zahlen in Raku zu schreiben.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">&lt;33 44&gt;<span class=\"quiz-note\">Dies ist eine Liste von Zeichenketten (wir werden es später im Kurs sehen).<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">&apos;&lt;33 44&gt;&apos;<span class=\"quiz-note\">Dies is  data-s=\"8\">&apos;&lt;33 44&gt;&apos;<span class=\"quiz-note\">Esto es una cadena.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">Esta es una división de dos números <code>Rat<\/code>, pero el resultado también es un número <code>Rat<\/code>.<\/span><\/span><\/li><\/ul>"]]},"it":{"t":"Quiz: Numeri razionali in Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Seleziona i numeri che sono <code>Rat<\/code> in Raku.<\/span><\/p>"],["raw",0,"<!--0 | ↉ | Questo è un numero `Int`, e il suo valore è `0`.-->"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">3/64<span class=\"quiz-note\">Questo è un numero <code>Rat<\/code>, non una divisione di due interi.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">⅞<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">2.718281828459045<span class=\"quiz-note\">Questo è un valore approssimativo della costante di Eulero, ma è comunque un <code>Rat<\/code>, poiché non è infinitamente lungo.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">10_230/50_245<span class=\"quiz-note\">Puoi usare anche qui il separatore <code>_<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">10.345_678<span class=\"quiz-note\">E anche qui.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">10.345,678<span class=\"quiz-note\">Una virgola qui non è né una virgola decimale né un separatore.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">&lt;33/44&gt;<span class=\"quiz-note\">Un'altra forma di scrivere numeri razionali in Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">&lt;33 44&gt;<span class=\"quiz-note\">Questa è una lista di stringhe (la vedremo più avanti nel corso).<\/span><\/span><\/li><li class=\"quiz-opt\ class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">Это деление двух чисел <code>Rat<\/code>, но результат тоже число типа <code>Rat<\/code>.<\/span><\/span><\/li><\/ul>"]]},"uk":{"t":"Тест: Раціональні числа в Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Оберіть числа, які в Raku є <code>Rat<\/code>.<\/span><\/p>"],["raw",0,"<!--0 | ↉ | Це число типу `Int`, і його значення — `0`.-->"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">3/64<span class=\"quiz-note\">Це число типу <code>Rat<\/code>, а не ділення двох цілих.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">⅞<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">2.718281828459045<span class=\"quiz-note\">Це наближене значення сталої Ейлера, але воно все одно <code>Rat<\/code>, бо не є нескінченно довгим.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">10_230/50_245<span class=\"quiz-note\">Тут теж можна використовувати роздільник <code>_<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">10.345_678<span class=\"quiz-note\">І тут.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">10.345,678<span class=\"quiz-note\">Кома тут не є ані десятковою комою, ані роздільником.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">&lt;33/44&gt;<span class=\"quiz-note\">Ще одна форма запису раціональних чисел у Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">&lt;33 44&gt;<span class=\"quiz-note\">Це список рядків (ми побачимо його далі в курсі).<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">&apos;&lt;33 44&gt;&apos;<span class=\"quiz-note\">Це рядок.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">Це ділення двох чисел <code>Rat<\/code>, але результат теж є числом <code>Rat<\/code>.<\/span><\/span><\/li><\/ul>"]]},"bg":{"t":"Тест: Рационални числа в Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Изберете числата, които са <code>Rat<\/code> в Raku.<\/span><\/p>"],["raw",0,"<!--0 | ↉ | Това е `Int` число, и неговата стойност е `0`.-->"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">3/64<span class=\"quiz-note\">Това е <code>Rat<\/code> число, а не деление на две цели числа.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">⅞<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">2.718281828459045<span class=\"quiz-note\">Това е приблизителна стойност на константата на Ойлер, но все пак е <code>Rat<\/code>, тъй като не е безкрайно дълго.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">10_230/50_245<span class=\"quiz-note\">Можете да използвате <code>_<\/code> като разделител и тук.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">10.345_678<span class=\"quiz-note\">И тук.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">10.345,678<span class=\"quiz-note\">Запетаята тук не е нито десетична запетая, нито разделител.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">&lt;33/44&gt;<span class=\"quiz-note\">Друг начин за записване на рационални числа в Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">&lt;33 44&gt;<span class=\"quiz-note\">Това е списък от низове (ще го разгледаме по-нататък в курса).<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">&apos;&lt;33 44&gt;&apos;<span class=\"quiz-note\">Това е низ.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">Това е деление на две <code>Rat<\/code> числа, но резултатът също е <code>Rat<\/code> число.<\/span><\/span><\/li><\/ul>"]]},"eo":{"t":"Kvizo: Raciaj nombroj en Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Elektu la nombrojn kiuj estas <code>Rat<\/code> en Raku.<\/span><\/p>"],["raw",0,"<!--0 | ↉ | Ĉi tio estas `Int` nombro, kaj ĝia valoro estas `0`.-->"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">3/64<span class=\"quiz-note\">Ĉi tio estas <code>Rat<\/code> nombro, ne divido de du entjeroj.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">⅞<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">2.718281828459045<span class=\"quiz-note\">Tio estas proksimuma valoro de la konstanto de Eŭlero, sed ĉi tio estas ankoraŭ <code>Rat<\/code>, ĉar ĝi ne estas senfine longa.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">10_230/50_245<span class=\"quiz-note\">Vi povas uzi la <code>_<\/code> apartigilon ankaŭ ĉi tie.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">10.345_678<span class=\"quiz-note\">Kaj ĉi tie.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">10.345,678<span class=\"quiz-note\">Komo ĉi tie ne estas nek dekoma komo nek apartigilo.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">&lt;33/44&gt;<span class=\"quiz-note\">Alia formo de skribado de raciaj nombroj en Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">&lt;33 44&gt;<span class=\"quiz-note\">Ĉi tio estas listo de ŝnuroj (ni vidos ĝin pli poste en la kurso).<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">&apos;&lt;33 44&gt;&apos;<span class=\"quiz-note\">Ĉi tio estas ŝnuro.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">Ĉi tio estas divido de du <code>Rat<\/code> nombroj, sed la rezulto ankaŭ estas <code>Rat<\/code> nombro.<\/span><\/span><\/li><\/ul>"]]},"la":{"t":"Quiz: Numeri rationales in Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Selige numeri qui sunt <code>Rat<\/code> in Raku.<\/span><\/p>"],["raw",0,"<!--0 | ↉ | Hoc est numerus `Int`, et eius valor est `0`.-->"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">3/64<span class=\"quiz-note\">Hoc est numerus <code>Rat<\/code>, non divisio duorum integrorum.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">⅞<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">2.718281828459045<span class=\"quiz-note\">Hoc est valor approximatus constantis Euleri, sed hoc est <code>Rat<\/code> adhuc, quia non est infinite longus.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">10_230/50_245<span class=\"quiz-note\">Potes uti <code>_<\/code> separator hic quoque.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">10.345_678<span class=\"quiz-note\">Et hic.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">10.345,678<span class=\"quiz-note\">Comma hic non est comma decimale nec separator.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">&lt;33/44&gt;<span class=\"quiz-note\">Alia forma scribendi numeros rationales in Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">&lt;33 44&gt;<span class=\"quiz-note\">Hoc est index chordarum (videbimus id postea in cursu).<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">&apos;&lt;33 44&gt;&apos;<span class=\"quiz-note\">Hoc est chorda.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">⅞/⅚<span class=\"quiz-note\">Hoc est divisio duorum numerorum <code>Rat<\/code>, sed eventus est etiam numerus <code>Rat<\/code>.<\/span><\/span><\/li><\/ul>"]]}}}</script>
