<script type="application/json" id="page-data">{"u":"essentials/numbers/rats","n":77,"k":"topic","pv":"essentials/numbers/integers/quiz2","nx":"essentials/numbers/rats/quiz","tr":["essentials","essentials/numbers"],"L":{"en":{"t":"Rational numbers in Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Rational numbers are a unique feature of Raku.<\/span> <span class=\"sg\" data-s=\"1\">The <code>Rat<\/code> data type represents such numbers.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Internally, rational numbers are fractions with two integer parts: numerator and denominator.<\/span> <span class=\"sg\" data-s=\"1\">So, you can easily present numbers such as 1/3 without losing precision.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">There are a few ways to write down a <code>Rat<\/code> number in a program in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notice that the slash here is a part of the notation.<\/span> <span class=\"sg\" data-s=\"1\">It is not a division operator, so <code>1/2<\/code> does not mean that you divide 1 by 2.<\/span> <span class=\"sg\" data-s=\"2\">In printing, though, rationals are shown as decimal numbers or integers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The part of the line after the <code>#<\/code> symbol is a comment and is ignored by the compiler.<\/span> <span class=\"sg\" data-s=\"1\">Such comments will be used in the course to show the output of the program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimal form<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">It is important to realise that when you write the number in a decimal form, e.g., <code>0.5<\/code>, Raku creates a <code>Rat<\/code> number at that point.<\/span> <span class=\"sg\" data-s=\"1\">It is not an integer, but it is neither a floating-point number (<code>float<\/code> or <code>double<\/code> in other languages).<\/span> <span class=\"sg\" data-s=\"2\">It is still a rational number!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Consider the following example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If a programming language uses floating-point arithmetics for these calculations, the result will not be equal to 0.<\/span> <span class=\"sg\" data-s=\"1\">The website <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> gives an exhaustive list of examples where floating-point arithmetics does not give an expected result.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">But Raku prints an exact <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This happens because it treats the numbers <code>0.1<\/code>, <code>0.2<\/code>, and <code>0.3<\/code> as rational numbers and keeps them as <code>1/10<\/code>, <code>2/10<\/code>, and <code>3/10<\/code> internally.<\/span> <span class=\"sg\" data-s=\"2\">Run it from the command line to confirm it:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode forms<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is also possible to use Unicode characters that represent the fractions, such as <code>½<\/code> or <code>¼<\/code> or <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probably, it’s not always easy to type it with the keyboard, but these fractions are exactly the same values as their ASCII versions spelt as a fraction or as a decimal number:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With some fractions, such as <code>1/3<\/code>, you have fewer options, <code>⅓<\/code> or <code>&lt;1/3&gt;<\/code>, as the decimal form would require an infinite number of digits.<\/span><\/p>"]]},"de":{"t":"Rationale Zahlen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Rationale Zahlen sind ein einzigartiges Merkmal von Raku.<\/span> <span class=\"sg\" data-s=\"1\">Der <code>Rat<\/code>-Datentyp repräsentiert solche Zahlen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intern sind rationale Zahlen Brüche mit zwei ganzzahligen Teilen: Zähler und Nenner.<\/span> <span class=\"sg\" data-s=\"1\">So können Sie Zahlen wie 1/3 problemlos darstellen, ohne an Präzision zu verlieren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es gibt einige Möglichkeiten, eine <code>Rat<\/code>-Zahl in einem Raku-Programm zu schreiben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass der Schrägstrich hier Teil der Notation ist.<\/span> <span class=\"sg\" data-s=\"1\">Es ist kein Divisionsoperator, daher bedeutet <code>1/2<\/code> nicht, dass Sie 1 durch 2 teilen.<\/span> <span class=\"sg\" data-s=\"2\">Beim Ausdrucken werden rationale Zahlen jedoch als Dezimalzahlen oder ganze Zahlen angezeigt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Teil der Zeile nach dem <code>#<\/code>-Symbol ist ein Kommentar und wird vom Compiler ignoriert.<\/span> <span class=\"sg\" data-s=\"1\">Solche Kommentare werden im Kurs verwendet, um die Ausgabe des Programms zu zeigen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dezimalform<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es ist wichtig zu verstehen, dass, wenn Sie die Zahl in Dezimalform schreiben, z.B. <code>0.5<\/code>, Raku an diesem Punkt eine <code>Rat<\/code>-Zahl erstellt.<\/span> <span class=\"sg\" data-s=\"1\">Es ist keine ganze Zahl, aber es ist auch keine Gleitkommazahl (<code>float<\/code> oder <code>double<\/code> in anderen Sprachen).<\/span> <span class=\"sg\" data-s=\"2\">Es ist immer noch eine rationale Zahl!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Betrachten Sie das folgende Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Programmiersprache Gleitkommaarithmetik für diese Berechnungen verwendet, wird das Ergebnis nicht gleich 0 sein.<\/span> <span class=\"sg\" data-s=\"1\">Die Website <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> gibt eine umfassende Liste von Beispielen, bei denen die Gleitkommaarithmetik kein erwartetes Ergebnis liefert.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aber Raku gibt genau <code>0<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Dies geschieht, weil es die Zahlen <code>0.1<\/code>, <code>0.2<\/code> und <code>0.3<\/code> als rationale Zahlen behandelt und sie intern als <code>1/10<\/code>, <code>2/10<\/code> und <code>3/10<\/code> speichert.<\/span> <span class=\"sg\" data-s=\"2\">Führen Sie es von der Kommandozeile aus, um es zu bestätigen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-Formen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist auch möglich, Unicode-Zeichen zu verwenden, die die Brüche darstellen, wie <code>½<\/code> oder <code>¼<\/code> oder <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Wahrscheinlich ist es nicht immer einfach, diese mit der Tastatur einzugeben, aber diese Brüche sind genau die gleichen Werte wie ihre ASCII-Versionen, die als Bruch oder als Dezimalzahl geschrieben sind:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einigen Brüchen, wie <code>1/3<\/code>, haben Sie weniger Optionen, <code>⅓<\/code> oder <code>&lt;1/3&gt;<\/code>, da die Dezimalform eine unendliche Anzahl von Ziffern erfordern würde.<\/span><\/p>"]]},"nl":{"t":"Rationale getallen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Rationale getallen zijn een uniek kenmerk van Raku.<\/span> <span class=\"sg\" data-s=\"1\">Het <code>Rat<\/code> gegevenstype vertegenwoordigt zulke getallen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intern vertegenwoordigen rationale getallen breuken met twee gehele delen: teller en noemer.<\/span> <span class=\"sg\" data-s=\"1\">Dus, je kunt gemakkelijk getallen zoals 1/3 presenteren zonder precisie te verliezen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Er zijn een paar manieren om een <code>Rat<\/code> getal in een programma in Raku op te schrijven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de schuine streep hier een deel van de notatie is.<\/span> <span class=\"sg\" data-s=\"1\">Het is geen delingsoperator, dus <code>1/2<\/code> betekent niet dat je 1 deelt door 2.<\/span> <span class=\"sg\" data-s=\"2\">Bij het afdrukken worden rationalen echter weergegeven als decimale getallen of gehele getallen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het deel van de regel na het <code>#<\/code> symbool is een commentaar en wordt genegeerd door de compiler.<\/span> <span class=\"sg\" data-s=\"1\">Zulke commentaren zullen in de cursus worden gebruikt om de uitvoer van het programma te laten zien.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimale vorm<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het is belangrijk om te beseffen dat wanneer je het getal in decimale vorm schrijft, bijvoorbeeld <code>0.5<\/code>, Raku op dat moment een <code>Rat<\/code> getal creëert.<\/span> <span class=\"sg\" data-s=\"1\">Het is geen geheel getal, maar het is ook geen drijvendekommagetal (<code>float<\/code> of <code>double<\/code> in andere talen).<\/span> <span class=\"sg\" data-s=\"2\">Het is nog steeds een rationaal getal!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beschouw het volgende voorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als een programmeertaal drijvendekommarekenkunde gebruikt voor deze berekeningen, zal het resultaat niet gelijk zijn aan 0.<\/span> <span class=\"sg\" data-s=\"1\">De website <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> geeft een uitgebreide lijst van voorbeelden waar drijvendekommarekenkunde geen verwacht resultaat geeft.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Maar Raku drukt exact <code>0<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">Dit gebeurt omdat het de getallen <code>0.1<\/code>, <code>0.2<\/code> en <code>0.3<\/code> behandelt als rationale getallen en ze intern bewaart als <code>1/10<\/code>, <code>2/10<\/code> en <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Voer het uit vanaf de opdrachtregel om het te bevestigen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode vormen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is ook mogelijk om Unicode-tekens te gebruiken die de breuken vertegenwoordigen, zoals <code>½<\/code> of <code>¼<\/code> of <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Waarschijnlijk is het niet altijd gemakkelijk om dit met het toetsenbord te typen, maar deze breuken zijn precies dezelfde waarden als hun ASCII-versies gespeld als een breuk of als een decimaal getal:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bij sommige breuken, zoals <code>1/3<\/code>, heb je minder opties, <code>⅓<\/code> of <code>&lt;1/3&gt;<\/code>, omdat de decimale vorm een oneindig aantal cijfers zou vereisen.<\/span><\/p>"]]},"es":{"t":"Números racionales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los números racionales son una característica única de Raku.<\/span> <span class=\"sg\" data-s=\"1\">El tipo de dato <code>Rat<\/code> representa tales números.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Internamente, los números racionales son fracciones con dos partes enteras: numerador y denominador.<\/span> <span class=\"sg\" data-s=\"1\">Así, puedes presentar fácilmente números como 1/3 sin perder precisión.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hay algunas formas de escribir un número <code>Rat<\/code> en un programa en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Observa que la barra aquí es parte de la notación.<\/span> <span class=\"sg\" data-s=\"1\">No es un operador de división, por lo que <code>1/2<\/code> no significa que divides 1 entre 2.<\/span> <span class=\"sg\" data-s=\"2\">Sin embargo, al imprimir, los racionales se muestran como números decimales o enteros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La parte de la línea después del símbolo <code>#<\/code> es un comentario y es ignorada por el compilador.<\/span> <span class=\"sg\" data-s=\"1\">Tales comentarios se usarán en el curso para mostrar la salida del programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimal<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es importante darse cuenta de que cuando escribes el número en forma decimal, por ejemplo, <code>0.5<\/code>, Raku crea un número <code>Rat<\/code> en ese punto.<\/span> <span class=\"sg\" data-s=\"1\">No es un entero, pero tampoco es un número de punto flotante (<code>float<\/code> o <code>double<\/code> en otros lenguajes).<\/span> <span class=\"sg\" data-s=\"2\">¡Sigue siendo un número racional!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Considera el siguiente ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si un lenguaje de programación usa aritmética de punto flotante para estos cálculos, el resultado no será igual a 0.<\/span> <span class=\"sg\" data-s=\"1\">El sitio web <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> ofrece una lista exhaustiva de ejemplos donde la aritmética de punto flotante no da un resultado esperado.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pero Raku imprime exactamente <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto ocurre porque trata los números <code>0.1<\/code>, <code>0.2<\/code> y <code>0.3<\/code> como números racionales y los mantiene como <code>1/10<\/code>, <code>2/10<\/code> y <code>3/10<\/code> internamente.<\/span> <span class=\"sg\" data-s=\"2\">Ejecútalo desde la línea de comandos para confirmarlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Formas Unicode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También es posible usar caracteres Unicode que representan las fracciones, como <code>½<\/code> o <code>¼<\/code> o <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probablemente, no siempre es fácil escribirlo con el teclado, pero estas fracciones son exactamente los mismos valores que sus versiones ASCII escritas como fracción o como número decimal:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con algunas fracciones, como <code>1/3<\/code>, tienes menos opciones, <code>⅓<\/code> o <code>&lt;1/3&gt;<\/code>, ya que la forma decimal requeriría un número infinito de dígitos.<\/span><\/p>"]]},"it":{"t":"Numeri razionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I numeri razionali sono una caratteristica unica di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Il tipo di dato <code>Rat<\/code> rappresenta tali numeri.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Internamente, i numeri razionali sono frazioni con due parti intere: numeratore e denominatore.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, puoi facilmente presentare numeri come 1/3 senza perdere precisione.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ci sono alcuni modi per scrivere un numero <code>Rat<\/code> in un programma in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota che la barra qui è parte della notazione.<\/span> <span class=\"sg\" data-s=\"1\">Non è un operatore di divisione, quindi <code>1/2<\/code> non significa che dividi 1 per 2.<\/span> <span class=\"sg\" data-s=\"2\">Tuttavia, nella stampa, i razionali sono mostrati come numeri decimali o interi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La parte della linea dopo il simbolo <code>#<\/code> è un commento ed è ignorata dal compilatore.<\/span> <span class=\"sg\" data-s=\"1\">Tali commenti saranno usati nel corso per mostrare l'output del programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimale<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">È importante rendersi conto che quando scrivi il numero in forma decimale, ad esempio, <code>0.5<\/code>, Raku crea un numero <code>Rat<\/code> in quel momento.<\/span> <span class=\"sg\" data-s=\"1\">Non è un intero, ma non è nemmeno un numero a virgola mobile (<code>float<\/code> o <code>double<\/code> in altre lingue).<\/span> <span class=\"sg\" data-s=\"2\">È ancora un numero razionale!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Considera il seguente esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se un linguaggio di programmazione utilizza l'aritmetica a virgola mobile per questi calcoli, il risultato non sarà uguale a 0.<\/span> <span class=\"sg\" data-s=\"1\">Il sito web <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> fornisce un elenco esaustivo di esempi in cui l'aritmetica a virgola mobile non dà un risultato atteso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ma Raku stampa un esatto <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo accade perché tratta i numeri <code>0.1<\/code>, <code>0.2<\/code> e <code>0.3<\/code> come numeri razionali e li mantiene come <code>1/10<\/code>, <code>2/10<\/code> e <code>3/10<\/code> internamente.<\/span> <span class=\"sg\" data-s=\"2\">Eseguilo dalla riga di comando per confermarlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forme Unicode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È anche possibile utilizzare caratteri Unicode che rappresentano le frazioni, come <code>½<\/code> o <code>¼<\/code> o <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probabilmente, non è sempre facile digitarli con la tastiera, ma queste frazioni sono esattamente gli stessi valori delle loro versioni ASCII scritte come frazione o come numero decimale:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con alcune frazioni, come <code>1/3<\/code>, hai meno opzioni, <code>⅓<\/code> o <code>&lt;1/3&gt;<\/code>, poiché la forma decimale richiederebbe un numero infinito di cifre.<\/span><\/p>"]]},"lv":{"t":"Racionālie skaitļi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Racionālie skaitļi ir unikāla Raku iezīme.<\/span> <span class=\"sg\" data-s=\"1\"><code>Rat<\/code> datu tips pārstāv šādus skaitļus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iekšēji racionālie skaitļi ir daļskaitļi ar divām veselu skaitļu daļām: skaitītāju un saucēju.<\/span> <span class=\"sg\" data-s=\"1\">Tādējādi jūs varat viegli attēlot skaitļus, piemēram, 1/3, nezaudējot precizitāti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir daži veidi, kā programmā Raku pierakstīt <code>Rat<\/code> skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka slīpsvītra šeit ir pieraksta daļa.<\/span> <span class=\"sg\" data-s=\"1\">Tā nav dalīšanas operators, tāpēc <code>1/2<\/code> nenozīmē, ka jūs dalāt 1 ar 2.<\/span> <span class=\"sg\" data-s=\"2\">Tomēr izdrukā racionālie skaitļi tiek parādīti kā decimāldaļskaitļi vai veseli skaitļi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rindiņas daļa pēc <code>#<\/code> simbola ir komentārs un to kompilators ignorē.<\/span> <span class=\"sg\" data-s=\"1\">Šādi komentāri tiks izmantoti kursā, lai parādītu programmas izvadi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimāldaļas forma<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir svarīgi saprast, ka, kad jūs rakstāt skaitli decimāldaļas formā, piemēram, <code>0.5<\/code>, Raku tajā brīdī izveido <code>Rat<\/code> skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Tas nav vesels skaitlis, bet tas nav arī peldošā punkta skaitlis (<code>float<\/code> vai <code>double<\/code> citās valodās).<\/span> <span class=\"sg\" data-s=\"2\">Tas joprojām ir racionāls skaitlis!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apsveriet šādu piemēru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja programmēšanas valoda izmanto peldošā punkta aritmētiku šiem aprēķiniem, rezultāts nebūs vienāds ar 0.<\/span> <span class=\"sg\" data-s=\"1\">Vietne <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> sniedz izsmeļošu piemēru sarakstu, kur peldošā punkta aritmētika nedod gaidīto rezultātu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bet Raku izdrukā precīzu <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas notiek tāpēc, ka tas uztver skaitļus <code>0.1<\/code>, <code>0.2<\/code> un <code>0.3<\/code> kā racionālus skaitļus un iekšēji tos saglabā kā <code>1/10<\/code>, <code>2/10<\/code> un <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Palaidiet to no komandrindas, lai to apstiprinātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikoda formas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams izmantot arī Unikoda rakstzīmes, kas pārstāv daļskaitļus, piemēram, <code>½<\/code> vai <code>¼<\/code> vai <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Iespējams, ka ne vienmēr ir viegli to ievadīt ar tastatūru, bet šie daļskaitļi ir tieši tādas pašas vērtības kā to ASCII versijas, kas rakstītas kā daļskaitlis vai kā decimāldaļskaitlis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar dažiem daļskaitļiem, piemēram, <code>1/3<\/code>, jums ir mazāk iespēju, <code>⅓<\/code> vai <code>&lt;1/3&gt;<\/code>, jo decimāldaļas formai būtu nepieciešams bezgalīgs ciparu skaits.<\/span><\/p>"]]},"ru":{"t":"Рациональные числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рациональные числа — это уникальная особенность Raku.<\/span> <span class=\"sg\" data-s=\"1\">Такие числа представлены типом данных <code>Rat<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутри Raku рациональные числа являются дробями с двумя целыми частями: числитель и знаменатель.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете с легкость представить такие числа, как 1/3, без потери точности.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Есть несколько способов записи числа <code>Rat<\/code> в программе Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Отметим, что косая черта здесь является частью нотации.<\/span> <span class=\"sg\" data-s=\"1\">Это не оператор деления, поэтому <code>1/2<\/code> не означает деление 1 на 2.<\/span> <span class=\"sg\" data-s=\"2\">Хотя при печати рациональные числа показаны как десятичные числа или целые:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Часть строки после знака <code>#<\/code> является комментарием, который игнорируется компилятором.<\/span> <span class=\"sg\" data-s=\"1\">Такие комментарии будут использованы в этом курсе, чтобы показать вывод программы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десятичная форма<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важно понимать, что когда вы записываете число в десятичной форме, например <code>0.5<\/code>, Raku создает число типа <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это не целое число, но и не число с плавающей точкой (<code>float<\/code> или <code>double<\/code> в других языках).<\/span> <span class=\"sg\" data-s=\"2\">Это все еще рациональное число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте посмотрим на следующий пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если язык программирования использует арифметику с плавающей точкой для таких вычислений, результат не будет равен 0.<\/span> <span class=\"sg\" data-s=\"1\">На сайте <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> приведен исчерпывающий список примеров, когда арифметика с плавающей точкой не дает ожидаемый результат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Но Raku выведет ровно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так получается, потому что числа <code>0.1<\/code>, <code>0.2<\/code> и <code>0.3<\/code> являются рациональными числами, и Raku хранит их внутри как <code>1/10<\/code>, <code>2/10<\/code> и <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Запустите следующее из командной строки, чтобы удостовериться в этом:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В качестве дробей также возможно использовать символы Юникода, такие как <code>½<\/code>, <code>¼<\/code> или <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наверное, такие дроби не всегда легко набрать с клавиатуры, но они полностью соответствуют своим ASCII альтернативам, записанным как дробь или как десятичное число:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С некоторыми дробями, как например <code>1/3<\/code>, у вас меньше опций, только <code>⅓<\/code> или <code>&lt;1/3&gt;<\/code>, так как десятичная форма бы требовала бесконечное количество цифр.<\/span><\/p>"]]},"uk":{"t":"Раціональні числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Раціональні числа є унікальною особливістю Raku.<\/span> <span class=\"sg\" data-s=\"1\">Тип даних <code>Rat<\/code> представляє такі числа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутрішньо раціональні числа є дробами з двома цілими частинами: чисельником і знаменником.<\/span> <span class=\"sg\" data-s=\"1\">Таким чином, ви можете легко представити числа, такі як 1/3, без втрати точності.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Існує кілька способів записати число типу <code>Rat<\/code> у програмі на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що слеш тут є частиною нотації.<\/span> <span class=\"sg\" data-s=\"1\">Це не оператор ділення, тому <code>1/2<\/code> не означає, що ви ділите 1 на 2.<\/span> <span class=\"sg\" data-s=\"2\">Однак при виведенні раціональні числа показуються як десяткові числа або цілі числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Частина рядка після символу <code>#<\/code> є коментарем і ігнорується компілятором.<\/span> <span class=\"sg\" data-s=\"1\">Такі коментарі будуть використовуватися в курсі для показу виводу програми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десяткова форма<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важливо розуміти, що коли ви записуєте число в десятковій формі, наприклад, <code>0.5<\/code>, Raku створює число типу <code>Rat<\/code> в цей момент.<\/span> <span class=\"sg\" data-s=\"1\">Це не ціле число, але це також не число з плаваючою комою (<code>float<\/code> або <code>double<\/code> в інших мовах).<\/span> <span class=\"sg\" data-s=\"2\">Це все ще раціональне число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Розглянемо наступний приклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо мова програмування використовує арифметику з плаваючою комою для цих обчислень, результат не буде дорівнювати 0.<\/span> <span class=\"sg\" data-s=\"1\">Вебсайт <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> надає вичерпний список прикладів, де арифметика з плаваючою комою не дає очікуваного результату.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Але Raku виводить точний <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це відбувається тому, що він трактує числа <code>0.1<\/code>, <code>0.2<\/code> і <code>0.3<\/code> як раціональні числа і зберігає їх як <code>1/10<\/code>, <code>2/10<\/code> і <code>3/10<\/code> внутрішньо.<\/span> <span class=\"sg\" data-s=\"2\">Запустіть це з командного рядка, щоб підтвердити:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікодні форми<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Також можливо використовувати юнікодні символи, які представляють дроби, такі як <code>½<\/code> або <code>¼<\/code> або <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можливо, не завжди легко набрати їх на клавіатурі, але ці дроби є точно такими ж значеннями, як їх ASCII версії, записані у вигляді дробу або десяткового числа:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З деякими дробами, такими як <code>1/3<\/code>, у вас менше варіантів, <code>⅓<\/code> або <code>&lt;1/3&gt;<\/code>, оскільки десяткова форма вимагала б нескінченної кількості цифр.<\/span><\/p>"]]},"bg":{"t":"Рационални числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рационалните числа са уникална характеристика на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Типът данни <code>Rat<\/code> представлява такива числа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътрешно, рационалните числа са дроби с две цели части: числител и знаменател.<\/span> <span class=\"sg\" data-s=\"1\">Така че, можете лесно да представите числа като 1/3 без загуба на точност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Има няколко начина да запишете <code>Rat<\/code> число в програма на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че наклонената черта тук е част от нотацията.<\/span> <span class=\"sg\" data-s=\"1\">Тя не е оператор за деление, така че <code>1/2<\/code> не означава, че делите 1 на 2.<\/span> <span class=\"sg\" data-s=\"2\">При печат обаче, рационалните числа се показват като десетични числа или цели числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Частта от реда след символа <code>#<\/code> е коментар и се игнорира от компилатора.<\/span> <span class=\"sg\" data-s=\"1\">Такива коментари ще се използват в курса, за да покажат изхода на програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десетична форма<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важно е да осъзнаете, че когато записвате числото в десетична форма, например <code>0.5<\/code>, Raku създава <code>Rat<\/code> число в този момент.<\/span> <span class=\"sg\" data-s=\"1\">То не е цяло число, но също така не е и число с плаваща запетая (<code>float<\/code> или <code>double<\/code> в други езици).<\/span> <span class=\"sg\" data-s=\"2\">То все още е рационално число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте следния пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако програмен език използва аритметика с плаваща запетая за тези изчисления, резултатът няма да бъде равен на 0.<\/span> <span class=\"sg\" data-s=\"1\">Уебсайтът <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> дава изчерпателен списък с примери, където аритметиката с плаваща запетая не дава очаквания резултат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Но Raku отпечатва точно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това се случва, защото третира числата <code>0.1<\/code>, <code>0.2<\/code> и <code>0.3<\/code> като рационални числа и ги съхранява като <code>1/10<\/code>, <code>2/10<\/code> и <code>3/10<\/code> вътрешно.<\/span> <span class=\"sg\" data-s=\"2\">Стартирайте го от командния ред, за да го потвърдите:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode форми<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Възможно е също така да използвате Unicode символи, които представляват дробите, като <code>½<\/code> или <code>¼<\/code> или <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вероятно не винаги е лесно да ги въведете с клавиатурата, но тези дроби са точно същите стойности като техните ASCII версии, изписани като дроб или като десетично число:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С някои дроби, като <code>1/3<\/code>, имате по-малко опции, <code>⅓<\/code> или <code>&lt;1/3&gt;<\/code>, тъй като десетичната форма би изисквала безкраен брой цифри.<\/span><\/p>"]]},"eo":{"t":"Raciaj nombroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raciaj nombroj estas unika trajto de Raku.<\/span> <span class=\"sg\" data-s=\"1\">La datumtipo <code>Rat<\/code> reprezentas tiajn nombrojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interne, raciaj nombroj estas frakcioj kun du entjeraj partoj: numeratoro kaj denominatoro.<\/span> <span class=\"sg\" data-s=\"1\">Do, vi povas facile prezenti nombrojn kiel 1/3 sen perdi precizecon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estas kelkaj manieroj por skribi <code>Rat<\/code> nombron en programo en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la streketo ĉi tie estas parto de la notacio.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne estas dividoperanto, do <code>1/2<\/code> ne signifas, ke vi dividas 1 per 2.<\/span> <span class=\"sg\" data-s=\"2\">Tamen, en presado, raciaj nombroj estas montrataj kiel decimalaj nombroj aŭ entjeroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La parto de la linio post la simbolo <code>#<\/code> estas komento kaj estas ignorata de la kompililo.<\/span> <span class=\"sg\" data-s=\"1\">Tiaj komentoj estos uzataj en la kurso por montri la eliron de la programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimala formo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas grave kompreni, ke kiam vi skribas la nombron en decimala formo, ekzemple, <code>0.5<\/code>, Raku kreas <code>Rat<\/code> nombron en tiu momento.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne estas entjero, sed ĝi ankaŭ ne estas glitkompunkto (<code>float<\/code> aŭ <code>double<\/code> en aliaj lingvoj).<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas ankoraŭ racia nombro!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konsideru la sekvan ekzemplon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se programlingvo uzas glitkompunkta aritmetiko por ĉi tiuj kalkuloj, la rezulto ne estos egala al 0.<\/span> <span class=\"sg\" data-s=\"1\">La retejo <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> donas elĉerpan liston de ekzemploj kie glitkompunkta aritmetiko ne donas atenditan rezulton.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sed Raku presas ekzaktan <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio okazas ĉar ĝi traktas la nombrojn <code>0.1<\/code>, <code>0.2<\/code>, kaj <code>0.3<\/code> kiel raciajn nombrojn kaj konservas ilin kiel <code>1/10<\/code>, <code>2/10<\/code>, kaj <code>3/10<\/code> interne.<\/span> <span class=\"sg\" data-s=\"2\">Rulu ĝin de la komandlinio por konfirmi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj formoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eblas ankaŭ uzi Unikodajn karakterojn kiuj reprezentas la frakciojn, kiel <code>½<\/code> aŭ <code>¼<\/code> aŭ <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probable, ne ĉiam estas facile tajpi ilin per la klavaro, sed ĉi tiuj frakcioj estas ekzakte la samaj valoroj kiel iliaj ASKII-versioj literumitaj kiel frakcio aŭ kiel decimala nombro:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun kelkaj frakcioj, kiel <code>1/3<\/code>, vi havas malpli da opcioj, <code>⅓<\/code> aŭ <code>&lt;1/3&gt;<\/code>, ĉar la decimala formo postulus senfinan nombron da ciferoj.<\/span><\/p>"]]},"la":{"t":"Numeri rationales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeri rationales sunt proprietas singularis Raku.<\/span> <span class=\"sg\" data-s=\"1\">Typus datae <code>Rat<\/code> tales numeros repraesentat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interno, numeri rationales sunt fractiones cum duabus partibus integris: numerator et denominator.<\/span> <span class=\"sg\" data-s=\"1\">Ita, facile potes numeros ut 1/3 sine precisione amittere praesentare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sunt aliquot modi ad scribendum numerum <code>Rat<\/code> in programmate in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod virgula hic est pars notationis.<\/span> <span class=\"sg\" data-s=\"1\">Non est operator divisionis, ita <code>1/2<\/code> non significat quod divides 1 per 2.<\/span> <span class=\"sg\" data-s=\"2\">In imprimendo, tamen, rationales monstrantur ut numeri decimales vel integri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pars lineae post symbolum <code>#<\/code> est commentarium et a compilatore ignoratur.<\/span> <span class=\"sg\" data-s=\"1\">Talia commentaria in cursu adhibebuntur ad ostendendum exitum programmatis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimale<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gravis est intellegere quod cum scribis numerum in forma decimali, e.g., <code>0.5<\/code>, Raku creat numerum <code>Rat<\/code> eo momento.<\/span> <span class=\"sg\" data-s=\"1\">Non est integer, sed nec est numerus puncti fluitantis (<code>float<\/code> vel <code>double<\/code> in aliis linguis).<\/span> <span class=\"sg\" data-s=\"2\">Est adhuc numerus rationalis!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Considera sequentem exemplum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si lingua programmandi utitur arithmeticis puncti fluitantis pro his calculationibus, eventus non erit aequalis 0.<\/span> <span class=\"sg\" data-s=\"1\">Situs interretialis <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> dat exhaustivam enumerationem exemplorum ubi arithmetica puncti fluitantis non dat eventum expectatum.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sed Raku imprimit exactum <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit quia tractat numeros <code>0.1<\/code>, <code>0.2<\/code>, et <code>0.3<\/code> ut numeros rationales et eos servat ut <code>1/10<\/code>, <code>2/10<\/code>, et <code>3/10<\/code> interno.<\/span> <span class=\"sg\" data-s=\"2\">Exsequere ex linea mandatorum ut id confirmes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma Unicode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam possibile est uti characteribus Unicode qui fractiones repraesentant, ut <code>½<\/code> vel <code>¼<\/code> vel <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Forsitan, non semper facile est eos typis exprimere cum claviatura, sed hae fractiones sunt prorsus eadem valores ac versiones ASCII scriptas ut fractio vel ut numerus decimale:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum aliquibus fractionibus, ut <code>1/3<\/code>, pauciores optiones habes, <code>⅓<\/code> vel <code>&lt;1/3&gt;<\/code>, quia forma decimale infinitum numerum digitorum requireret.<\/span><\/p>"]]}}}</script>
