h3><span class=\"sg\" data-s=\"0\">Aritmética<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operador<\/strong> | <strong>Operación<\/strong> <code>+<\/code> | Adición <code>-<\/code> | Sustracción <code>*<\/code> | Multiplicación <code>/<\/code> | División<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como Raku <a href=\"https://course.raku.org/es/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">soporta Unicode<\/a> muy bien, algunos de estos operadores tienen equivalentes no ASCII:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Multiplicación <code>÷<\/code> | División<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para cambiar el orden de ejecución, usa paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Módulo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El operador de módulo es <code>%<\/code> como en muchos otros lenguajes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Módulo<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Devuelve el resto de la división entera de dos números, así que <code>10 % 3<\/code> es <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ten en cuenta que <code>-10 % 3<\/code> es <code>2<\/code> ya que el resultado de la operación se define como la diferencia entre el primer número y la división redondeada hacia abajo multiplicada por el segundo número.<\/span> <span class=\"sg\" data-s=\"2\">Así, <code>$a % $b<\/code> es equivalente a <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Divisibilidad<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku añade un operador útil para probar si un número es divisible por otro número.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Divisibilidad<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este es un operador infijo que necesita dos operandos: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si el primer operando es divisible por el segundo operando, el resultado es un Booleano <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De lo contrario, <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operaciones enteras<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay operaciones especiales que devuelven resultados enteros.<\/span> <span class=\"sg\" data-s=\"1\">Sus operadores son palabras en lugar de símbolos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | División entera <code>mod<\/code> | Módulo entero<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El operador <code>div<\/code> redondea hacia abajo el resultado, así que <code>10 div 3<\/code> es <code>3<\/code>, y <code>-10 div 3<\/code> es <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tanto <code>div<\/code> como <code>mod<\/code> esperan operandos enteros.<\/span> <span class=\"sg\" data-s=\"1\">Así que, el siguiente programa no funcionará si descomentas las líneas marcadas como <code>Error<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Potencia<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay dos formas de obtener el resultado de <em>x<\/em> elevado a la <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Primero, puedes usar el operador <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Segundo, puedes usar dígitos en superíndice, por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es posible poner más de un dígito en superíndice para obtener el valor de una potencia mayor que 9.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La potencia negativa tampoco es un problema:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa que el resultado de las dos últimas expresiones es un número <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operaciones con asignación<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Todas las operaciones soportan la sintaxis abreviada cuando necesitas actualizar la variable.<\/span> <span class=\"sg\" data-s=\"1\">Vamos a demostrarlo con el ejemplo de <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma completa<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">es equivalente a:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"it":{"t":"Operazioni con i numeri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Non c'è dubbio che tu già conosca alcune delle operazioni che puoi fare con i numeri in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Solo per menzionare che il simbolo dell'<em>operazione<\/em> è chiamato <em>operatore<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Gli oggetti su cui eseguiamo operazioni sono chiamati <em>operandi<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aritmetica<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operatore<\/strong> | <strong>Operazione<\/strong> <code>+<\/code> | Addizione <code>-<\/code> | Sottrazione <code>*<\/code> | Moltiplicazione <code>/<\/code> | Divisione<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Poiché Raku <a href=\"https://course.raku.org/it/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">supporta Unicode<\/a> molto bene, alcuni di questi operatori hanno equivalenti non ASCII:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Moltiplicazione <code>÷<\/code> | Divisione<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per cambiare l'ordine di esecuzione, usa le parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modulo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'operatore modulo è <code>%<\/code> come in molti altri linguaggi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Modulo<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Restituisce il resto della divisione intera di due numeri, quindi <code>10 % 3<\/code> è <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che <code>-10 % 3<\/code> è <code>2<\/code> poiché il risultato dell'operazione è definito come la differenza tra il primo numero e la divisione arrotondata per difetto moltiplicata per il secondo numero.<\/span> <span class=\"sg\" data-s=\"2\">Quindi, <code>$a % $b<\/code> è equivalente a <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Divisibilità<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku aggiunge un operatore utile per testare se un numero è divisibile per un altro numero.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Divisibilità<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo è un operatore infisso che necessita di due operandi: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se il primo operando è divisibile per il secondo operando, il risultato è un Booleano <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Altrimenti, <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operazioni intere<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono operazioni speciali che restituiscono risultati interi.<\/span> <span class=\"sg\" data-s=\"1\">I loro operatori sono parole invece di simboli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Divisione intera <code>mod<\/code> | Modulo intero<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'operatore <code>div<\/code> arrotonda per difetto il risultato, quindi <code>10 div 3<\/code> è <code>3<\/code>, e <code>-10 div 3<\/code> è <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sia <code>div<\/code> che <code>mod<\/code> si aspettano operandi interi.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, il seguente programma non funzionerà se decommenti le righe contrassegnate come <code>Error<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Potenza<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono due modi per ottenere il risultato di <em>x<\/em> alla potenza di <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Prima, puoi usare l'operatore <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Secondo, puoi usare le cifre in apice, per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È possibile mettere più di una cifra in apice per ottenere il valore di una potenza maggiore di 9.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anche la potenza negativa non è un problema:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che il risultato delle ultime due espressioni è un numero <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operazioni con assegnazione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutte le operazioni supportano la sintassi abbreviata quando è necessario aggiornare la variabile.<\/span> <span class=\"sg\" data-s=\"1\">Dimostriamolo con l'esempio di <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma completa<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">è equivalente a:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"lv":{"t":"Operācijas ar skaitļiem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nav šaubu, ka jūs jau zināt dažas operācijas, ko varat veikt ar Raku skaitļiem.<\/span> <span class=\"sg\" data-s=\"1\">Tikai jāpiemin, ka <em>operācijas<\/em> simbols tiek saukts par <em>operatoru<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Objekti, uz kuriem mēs veicam operācijas, tiek saukti par <em>operandiem<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aritmētika<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operators<\/strong> | <strong>Operācija<\/strong> <code>+<\/code> | Saskaitīšana <code>-<\/code> | Atņemšana <code>*<\/code> | Reizināšana <code>/<\/code> | Dalīšana<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā Raku <a href=\"https://course.raku.org/lv/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">ļoti labi atbalsta Unicode<\/a>, dažiem no šiem operatoriem ir ne-ASCII ekvivalenti:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Reizināšana <code>÷<\/code> | Dalīšana<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai mainītu izpildes secību, izmantojiet iekavas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modulis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Moduļa operators ir <code>%<\/code>, kā daudzās citās valodās.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Modulis<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas atgriež divu skaitļu veselo dalījumu atlikumu, tāpēc <code>10 % 3<\/code> ir <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā, ka <code>-10 % 3<\/code> ir <code>2<\/code>, jo operācijas rezultāts tiek definēts kā starpība starp pirmo skaitli un noapaļoto dalījumu, kas reizināts ar otro skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Tātad, <code>$a % $b<\/code> ir ekvivalents <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dalāmība<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku pievieno noderīgu operatoru, lai pārbaudītu, vai skaitlis ir dalāms ar citu skaitli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Dalāmība<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas ir infiksu operators, kam nepieciešami divi operandi: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja pirmais operands ir dalāms ar otro operandu, rezultāts ir Būla <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pretējā gadījumā <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Veselo skaitļu operācijas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir īpašas operācijas, kas atgriež veselu skaitļu rezultātus.<\/span> <span class=\"sg\" data-s=\"1\">To operatori ir vārdi, nevis simboli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Veselo skaitļu dalīšana <code>mod<\/code> | Veselo skaitļu modulis<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> operators noapaļo rezultātu uz leju, tāpēc <code>10 div 3<\/code> ir <code>3<\/code>, un <code>-10 div 3<\/code> ir <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gan <code>div<\/code>, gan <code>mod<\/code> pieprasa veselu skaitļu operandus.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc šāda programma nedarbosies, ja jūs atkomentēsiet rindas, kas atzīmētas kā <code>Kļūda<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Kļūda\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Kļūda<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pakāpe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir divi veidi, kā iegūt <em>x<\/em> pakāpē <em>y<\/em> rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Pirmkārt, jūs varat izmantot <code>**<\/code> operatoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otrkārt, jūs varat izmantot augšraksta ciparus, piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams izmantot vairāk nekā vienu augšraksta ciparu, lai iegūtu vērtību, kas ir lielāka par 9.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Negatīva pakāpe arī nav problēma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka pēdējo divu izteiksmju rezultāts ir <code>Rat<\/code> skaitlis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operācijas ar piešķiršanu<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visas operācijas atbalsta saīsināto sintaksi, kad nepieciešams atjaunināt mainīgo.<\/span> <span class=\"sg\" data-s=\"1\">Demonstrēsim to ar <code>+<\/code> piemēru.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pilnā forma<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">ir ekvivalenta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"ru":{"t":"Операции с числами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Безусловно вы уже знакомы с некоторыми операциями, которые можно совершать с числами в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Отметим, что символ <em>операции<\/em> называется <em>оператором<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Объекты, над которыми совершается операция, называются <em>операндами<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Арифметика<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Оператор<\/strong> | <strong>Операция<\/strong> <code>+<\/code> | Сложение <code>-<\/code> | Вычитание <code>*<\/code> | Умножение <code>/<\/code> | Деление<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так как Raku очень хорошо <a href=\"https://course.raku.org/ru/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">поддерживает Юникод<\/a>, некоторые операторы имеют эквивалент в Юникоде:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Умножение <code>÷<\/code> | Деление<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Используйте скобки, чтобы изменить порядок выполнения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Остаток от деления<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор остатка от деления — это <code>%<\/code>, как и во многих других языках.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Остаток от деления<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Он возвращает остаток от целочисленного деления двух чисел, например <code>10 % 3<\/code> равно <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Отметим, что <code>-10 % 3<\/code> равно <code>2<\/code> так как результат операции определен как разница между первым числом и округленным вниз частным, умноженным на второе число.<\/span> <span class=\"sg\" data-s=\"2\">Другими словами, <code>$a % $b<\/code> эквивалентно <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Делимость<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku добавляет полезный оператор, чтобы проверить, если число делится на другое число.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Делимость<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это инфиксный оператор, которому требуется два операнда: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если первый операнд кратен второму операнду, то результат будет булевым значением <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Иначе — <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Целочисленные операции<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть несколько специальных операций, которые возвращают целые числа.<\/span> <span class=\"sg\" data-s=\"1\">Их операторы являются словами, а не символами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Целочисленное деление <code>mod<\/code> | Целочисленный остаток от деления<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>div<\/code> округляет результат к низу, поэтому <code>10 div 3<\/code> равно <code>3<\/code> и <code>-10 div 3<\/code> равно <code>-4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Степень<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть два варианта возведения <em>x<\/em> в степень <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">В первом варианте используется оператор <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Во втором используется верхний индекс, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В верхний регистр возможно поместить больше одной цифры, чтобы получить степень больше девяти.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Также не составляет проблем и отрицательная степень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отметим, что результат последний двух выражений является числом типа <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Операции с присвоением<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Все операции поддерживают сокращенный синтаксис для обновления переменной.<\/span> <span class=\"sg\" data-s=\"1\">Давайте продемонстрируем это на примере <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Полная форма<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">эквивалентна<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"uk":{"t":"Операції з числами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Без сумніву, ви вже знаєте деякі операції, які можна виконувати з числами в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Варто зазначити, що символ <em>операції<\/em> називається <em>оператором<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Об'єкти, над якими ми виконуємо операції, називаються <em>операндами<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Арифметика<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Оператор<\/strong> | <strong>Операція<\/strong> <code>+<\/code> | Додавання <code>-<\/code> | Віднімання <code>*<\/code> | Множення <code>/<\/code> | Ділення<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки Raku <a href=\"https://course.raku.org/uk/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">добре підтримує Unicode<\/a>, деякі з цих операторів мають не-ASCII еквіваленти:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Множення <code>÷<\/code> | Ділення<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб змінити порядок виконання, використовуйте дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модуль<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор модуля — це <code>%<\/code>, як і в багатьох інших мовах.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Модуль<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Він повертає залишок від ділення двох чисел, тому <code>10 % 3<\/code> дорівнює <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зауважте, що <code>-10 % 3<\/code> дорівнює <code>2<\/code>, оскільки результат операції визначається як різниця між першим числом і округленим вниз результатом ділення, помноженим на друге число.<\/span> <span class=\"sg\" data-s=\"2\">Тому <code>$a % $b<\/code> еквівалентно <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Кратність<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku додає корисний оператор для перевірки, чи число ділиться на інше число.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Кратність<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це інфіксний оператор, який потребує два операнди: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо перший операнд ділиться на другий операнд, результатом буде логічне значення <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В іншому випадку — <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цілі операції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Є спеціальні операції, які повертають цілі результати.<\/span> <span class=\"sg\" data-s=\"1\">Їхні оператори є словами замість символів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Ціле ділення <code>mod<\/code> | Цілий модуль<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>div<\/code> округлює результат вниз, тому <code>10 div 3<\/code> дорівнює <code>3<\/code>, а <code>-10 div 3<\/code> дорівнює <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">І <code>div<\/code>, і <code>mod<\/code> очікують цілі операнди.<\/span> <span class=\"sg\" data-s=\"1\">Тому наступна програма не працюватиме, якщо розкоментувати рядки, позначені як <code>Error<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Степінь<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Є два способи отримати результат <em>x<\/em> в степені <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">По-перше, ви можете використовувати оператор <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">По-друге, ви code>.<\/span> <span class=\"sg\" data-s=\"2\">В противен случай, <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Целочислени операции<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има специални операции, които връщат целочислени резултати.<\/span> <span class=\"sg\" data-s=\"1\">Техните оператори са думи вместо символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Целочислено деление <code>mod<\/code> | Целочислено модуло<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>div<\/code> закръгля резултата надолу, така че <code>10 div 3<\/code> е <code>3<\/code>, а <code>-10 div 3<\/code> е <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двата оператора <code>div<\/code> и <code>mod<\/code> очакват целочислени операнди.<\/span> <span class=\"sg\" data-s=\"1\">Така че, следната програма няма да работи, ако разкоментирате редовете, маркирани като <code>Error<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Степенуване<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има два начина за получаване на резултата от <em>x<\/em> на степен <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Първо, можете да използвате оператора <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второ, можете да използвате надписани цифри, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Възможно е да поставите повече от една надписана цифра, за да получите стойност на степен по-голяма от 9.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отрицателната степен също не е проблем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че резултатът от последните две изрази е число от тип <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Операции с присвояване<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всички операции поддържат съкратен синтаксис, когато трябва да актуализирате променливата.<\/span> <span class=\"sg\" data-s=\"1\">Нека го демонстрираме с примера на <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пълната форма<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">е еквивалентна на:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"eo":{"t":"Operacioj kun nombroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sendube vi jam konas kelkajn el la operacioj, kiujn vi povas fari kun Raku-nombroj.<\/span> <span class=\"sg\" data-s=\"1\">Nur por mencii, ke la simbolo de la <em>operacio<\/em> estas nomata <em>operaciilo<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La objektoj, sur kiuj ni faras operaciojn, estas nomataj <em>operandaj<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aritmetiko<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operaciilo<\/strong> | <strong>Operacio<\/strong> <code>+<\/code> | Adicio <code>-<\/code> | Subtraho <code>*<\/code> | Multipliko <code>/<\/code> | Divido<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar Raku <a href=\"https://course.raku.org/eo/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">subtenas Unikodon<\/a> tre bone, kelkaj el ĉi tiuj operaciiloj havas ne-ASCII-ekvivalentojn:<\/span><\/p>"],["p",1,"<p><span cl
