<script type="application/json" id="page-data">{"u":"essentials/strings/string-length","n":61,"k":"topic","pv":"essentials/strings/escaping-special-characters/quiz","nx":"essentials/strings/string-length/quiz","tr":["essentials","essentials/strings"],"L":{"en":{"t":"String length in Raku","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">The Unicode nature of the strings makes some trivial things a bit more difficult.<\/span> <span class=\"sg\" data-s=\"1\">Or, at least, you need to think of it as a less straightforward topic.<\/span> <span class=\"sg\" data-s=\"2\">Take, for example, the length of a string.<\/span> <span class=\"sg\" data-s=\"3\">Is it the number of characters, or is it the number of bytes?<\/span> <span class=\"sg\" data-s=\"4\">Or what if the same character is decomposed differently in different strings, is it still one character?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Length in characters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To get the length of the string in characters, use the <code>chars<\/code> <em>method<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">While we’ll talk about methods later, we already should be able to use them.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, you can call methods on almost every object, including strings and scalar variables.<\/span> <span class=\"sg\" data-s=\"2\">To call a method, use a dot.<\/span> <span class=\"sg\" data-s=\"3\">So, here we see the method called on a variable that keeps a string: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There are four characters in this Chinese greeting 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">And <code>$str.chars<\/code> returns exactly <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Length in bytes<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" da my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieses Mal gibt das Programm <code>12<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, dass wir hier zwei verkettete Methodenaufrufe in der zweiten Zeile haben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Länge in Codepunkten<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nur der Vollständigkeit halber, hier ist eine weitere nützliche Methode, die sich auch auf die Länge von Zeichenketten bezieht: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt die Anzahl der Codepunkte in der Zeichenkette zurück, nachdem sie normalisiert wurde.<\/span> <span class=\"sg\" data-s=\"2\">In vielen Fällen geben <code>codes<\/code> und <code>chars<\/code> dasselbe zurück.<\/span> <span class=\"sg\" data-s=\"3\">In einigen seltenen Fällen, wenn Sie beispielsweise ein 'unmögliches' Zeichen erstellt haben, für das es keinen einzelnen Codepunkt im gesamten Unicode-Raum gibt, geben die Methoden unterschiedliche Ergebnisse zurück.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieses Zeichen, <code>x̨<\/code>, hat keinen eigenen Codepunkt und kann nur aus den beiden Teilen konstruiert werden: dem Kleinbuchstaben <code>x<\/code> und dem kombinierenden Zeichen <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt also immer noch ein Zeichen, aber zwei Codepunkte.<\/span> <span class=\"sg\" data-s=\"2\">Das Programm gibt also aus:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"nl":{"t":"String lengte","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">De Unicode-natuur van de strings maakt sommige triviale dingen een beetje moeilijker.<\/span> <span class=\"sg\" data-s=\"1\">Of, tenminste, je moet het beschouwen als een minder rechtlijnig onderwerp.<\/span> <span class=\"sg\" data-s=\"2\">Neem bijvoorbeeld de lengte van een string.<\/span> <span class=\"sg\" data-s=\"3\">Is het het aantal karakters, of is het het aantal bytes?<\/span> <span class=\"sg\" data-s=\"4\">Of wat als hetzelfde karakter anders is ontleed in verschillende strings, is het dan nog steeds één karakter?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lengte in karakters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om de lengte van de string in karakters te krijgen, gebruik je de <code>chars<\/code> <em>methode<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoewel we later over methoden zullen praten, moeten we ze nu al kunnen gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">In Raku kun je methoden aanroepen op bijna elk object, inclusief strings en scalair variabelen.<\/span> <span class=\"sg\" data-s=\"2\">Om een methode aan te roepen, gebruik je een punt.<\/span> <span class=\"sg\" data-s=\"3\">Dus hier zien we de methode aangeroepen op een variabele die een string bevat: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er zijn vier karakters in deze Chinese groet 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">En <code>$str.chars<\/code> retourneert precies <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lengte in bytes<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ter referentie, dit is hoe je de lengte van de string in bytes krijgt.<\/span> <span class=\"sg\" data-s=\"1\">In dit geval is het belangrijk om te weten welke codering wordt gebruikt om de string te bewaren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze keer print het programma <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Let op dat we hier twee gekop <code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Anche se parleremo dei metodi più avanti, dovremmo già essere in grado di usarli.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, puoi chiamare metodi su quasi ogni oggetto, comprese le stringhe e le variabili scalari.<\/span> <span class=\"sg\" data-s=\"2\">Per chiamare un metodo, usa un punto.<\/span> <span class=\"sg\" data-s=\"3\">Quindi, qui vediamo il metodo chiamato su una variabile che contiene una stringa: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono quattro caratteri in questo saluto cinese 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">E <code>$str.chars<\/code> restituisce esattamente <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in byte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Solo per riferimento, ecco come ottenere la lunghezza della stringa in byte.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, è importante sapere quale codifica viene utilizzata per mantenere la stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa volta, il programma stampa <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che abbiamo due chiamate di metodo concatenate nella seconda riga qui.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in punti di codice<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Solo per completezza, ecco un altro metodo utile che si riferisce anche alla lunghezza delle stringhe: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce il numero di punti di codice nella stringa dopo che è stata normalizzata.<\/span> <span class=\"sg\" data-s=\"2\">In molti casi, <code>codes<\/code> e <code>chars<\/code> restituiscono lo stesso valore.<\/span> <span class=\"sg\" data-s=\"3\">Tuttavia, in alcuni casi rari, quando, per esempio, hai costruito 'un carattere impossibile', per il quale non esiste un singolo punto di codice in tutto lo spazio Unicode, i metodi danno risultati diversi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo carattere, <code>x̨<\/code>, non ha un punto di codice dedicato e può essere costruito solo dalle due parti: la lettera minuscola <code>x<\/code> e il carattere combinante <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, c'è ancora un carattere ma due punti di codice.<\/span> <span class=\"sg\" data-s=\"2\">Quindi, il programma stampa:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"lv":{"t":"Virknes garums","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Virkņu Unicode daba padara dažas triviālas lietas nedaudz sarežģītākas.<\/span> <span class=\"sg\" data-s=\"1\">Vai, vismaz, jums jādomā par to kā par mazāk vienkāršu tēmu.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, ņemiet virknes garumu.<\/span> <span class=\"sg\" data-s=\"3\">Vai tas ir rakstzīmju skaits, vai tas ir baitu skaits?<\/span> <span class=\"sg\" data-s=\"4\">Vai arī, ja tā pati rakstzīme ir sadalīta dažādi dažādās virknēs, vai tā joprojām ir viena rakstzīme?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums rakstzīmēs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu virknes garumu rakstzīmēs, izmantojiet <code>chars<\/code> <em>metodi<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lai gan mēs runāsim par metodēm vēlāk, mums jau vajadzētu būt spējīgiem tās izmantot.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā jūs varat izsaukt metodes gandrīz uz katra objekta, ieskaitot virknes un skalārus mainīgos.<\/span> <span class=\"sg\" data-s=\"2\">Lai izsauktu metodi, izmantojiet punktu.<\/span> <span class=\"sg\" data-s=\"3\">Tātad, šeit mēs redzam metodi, kas tiek izsaukta uz mainīgā, kas satur virkni: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šajā ķīniešu sveicienā 你好世界 ir četras rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>$str.chars<\/code> atgriež tieši <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums baitos<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tikai atsauces nolūkos, šeit ir veids, kā iegūt virknes garumu baitos.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā ir svarīgi zināt, kura kodēšana tiek izmantota, lai saglabātu virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šoreiz programma izdrukā <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā, ka otrajā rindā mums ir divi saistīti metožu izsaukumi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums koda punktos<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pilnības labad, šeit ir vēl viena noderīga metode, kas arī attiecas uz virknes garumiem: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež koda punktu skaitu virknē pēc tās normalizēšanas.<\/span> <span class=\"sg\" data-s=\"2\">Daudzos gadījumos <code>codes<\/code> un <code>chars<\/code> atgriež to pašu.<\/span> <span class=\"sg\" data-s=\"3\">Tomēr dažos retos gadījumos, piemēram, kad esat izveidojis 'neiespējamu' rakstzīmi, kurai nav viena koda punkta visā Unicode telpā, metodes dod atšķirīgus rezultātus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šai rakstzīmei, <code>x̨<\/code>, nav īpaša koda punkta un to var konstruēt tikai no divām daļām: mazā burta <code>x<\/code> un kombinējošās rakstzīmes <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tātad, joprojām ir viena rakstzīme, bet divi koda punkti.<\/span> <span class=\"sg\" data-s=\"2\">Tātad, programma izdrukā:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"ru":{"t":"Длина строки","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Природа Юникода в строках делает кое-какие тривиальные вещи несколько более сложными.<\/span> <span class=\"sg\" data-s=\"1\">По крайней мере, вам следует думать об этом, как о чем-то не самом простом.<\/span> <span class=\"sg\" data-s=\"2\">Возьмем, для примера, длину строки.<\/span> <span class=\"sg\" data-s=\"3\">Это количество букв, или количество байтов?<\/span> <span class=\"sg\" data-s=\"4\">Или что если один и тот же символ можно разложить по-разному в разных строках, это все еще один символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в символах<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить длину строки в символах, используйте <em>метод<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И хотя мы поговорим о методах позже, вы уже должны уметь их использовать.<\/span> <span class=\"sg\" data-s=\"1\">В Raku вы можете вызвать метод почти для любого объекта, включая строки и скалярные переменные.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы вызвать метод, используйте точку.<\/span> <span class=\"sg\" data-s=\"3\">Здесь мы видим метод, вызванный для переменной, в которой хранится строка: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом китайском приветствии четыре символа 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$str.chars<\/code> вернет ровно <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в байтах<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Только для ссылки, вот как можно получить длину строки в байтах.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае важно знать, какая кодировка была использована для хранения строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этот раз программа напишет <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Отметим, что на второй строке мы вызываем два метода в цепочке друг за другом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в кодовых позициях<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И для полноты картины, вот еще один полезный метод, который тоже относится к длине строки: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он возвращает количество кодовых позиций в строке после ее нормализации.<\/span> <span class=\"sg\" data-s=\"2\">В большинстве случаев методы <code>codes<\/code> и <code>chars<\/code> вернут одно и то же значение.<\/span> <span class=\"sg\" data-s=\"3\">Но в некоторых редких случаях, когда, например, вы склеили \"несуществующий\" символ, для которого нет ни одной кодовой позиции во всем пространстве Юникода, методы вернут разные значения.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Буква <code>x̨<\/code> не имеет отдельной кодовой позиции и может быть только составлена из частей: строчная буква <code>x<\/code> и комбинирующий символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому здесь все еще один символ, но две кодовые позиции.<\/span> <span class=\"sg\" data-s=\"2\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>1\n2<\/code><\/pre>"]]},"uk":{"t":"Довжина рядка","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Юнікодна природа рядків робить деякі тривіальні речі трохи складнішими.<\/span> <span class=\"sg\" data-s=\"1\">Або, принаймні, потрібно думати про це як про менш прямолінійну тему.<\/span> <span class=\"sg\" data-s=\"2\">Візьмемо, наприклад, довжину рядка.<\/span> <span class=\"sg\" data-s=\"3\">Це кількість символів, чи кількість байтів?<\/span> <span class=\"sg\" data-s=\"4\">Або що, якщо той самий символ розкладений по-різному в різних рядках, чи все ще це один і той самий символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в символах<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати довжину рядка в символах, використовуйте <em>метод<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Хоча ми поговоримо про методи пізніше, ми вже повинні вміти їх використовувати.<\/span> <span class=\"sg\" data-s=\"1\">У Raku ви можете викликати методи майже на кожному об'єкті, включаючи рядки та скалярні змінні.<\/span> <span class=\"sg\" data-s=\"2\">Щоб викликати метод, використовуйте крапку.<\/span> <span class=\"sg\" data-s=\"3\">Отже, тут ми бачимо метод, викликаний на змінній, яка містить рядок: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У цьому китайському привітанні 你好世界 є чотири символи.<\/span> <span class=\"sg\" data-s=\"1\">І <code>$str.chars<\/code> повертає саме <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в байтах<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для довідки, ось як отримати довжину рядка в байтах.<\/span> <span class=\"sg\" data-s=\"1\">У цьому випадку важливо знати, яке кодування використовується для зберігання рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цього разу програма виводить <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що у другому рядку ми маємо два виклики методів, з'єднані разом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в кодових точках<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для повноти картини, ось ще один корисний метод, який також стосується довжини рядків: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертає кількість кодових точок у рядку після його нормалізації.<\/span> <span class=\"sg\" data-s=\"2\">У багатьох випадках <code>codes<\/code> і <code>chars<\/code> повертають одне й те саме.<\/span> <span class=\"sg\" data-s=\"3\">Проте в деяких рідкісних випадках, коли, наприклад, ви створили 'неможливий' символ, для якого немає єдиної кодової точки у всьому просторі Юнікоду, методи дають різні результати.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей символ, <code>x̨<\/code>, не має окремої кодової точки і може бути сконструйований лише з двох частин: маленької літери <code>x<\/code> і комбінованого символу <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Отже, це все ще один символ, але дві кодові точки.<\/span> <span class=\"sg\" data-s=\"2\">Тому програма виводить:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"bg":{"t":"Дължина на стринг","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Юникод природата на низовете прави някои тривиални неща малко по-трудни.<\/span> <span class=\"sg\" data-s=\"1\">Или, поне, трябва да ги разглеждате като по-малко директни теми.<\/span> <span class=\"sg\" data-s=\"2\">Вземете, например, дължината на низ.<\/span> <span class=\"sg\" data-s=\"3\">Дали е броят на символите, или е броят на байтовете?<\/span> <span class=\"sg\" data-s=\"4\">Или какво, ако един и същ символ е разложен по различен начин в различни низове, все още ли е един символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в символи<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да получите дължината на низа в символи, използвайте <em>метода<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Докато ще говорим за методи по-късно, вече трябва да можем да ги използваме.<\/span> <span class=\"sg\" data-s=\"1\">В Raku, можете да извиквате методи на почти всеки обект, включително низове и скаларни променливи.<\/span> <span class=\"sg\" data-s=\"2\">За да извикате метод, използвайте точка.<\/span> <span class=\"sg\" data-s=\"3\">Така че, тук виждаме метода, извикан на променлива, която съдържа низ: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има четири символа в това китайско приветствие 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$str.chars<\/code> връща точно <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в байтове<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Само за справка, ето как получавате дължината на низа в байтове.<\/span> <span class=\"sg\" data-s=\"1\">В този случай е важно да знаете коя кодировка се използва за съхранение на низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този път програмата отпечатва <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че имаме две свързани извиквания на методи във втория ред тук.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в кодови точки<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Само за пълнота, ето още един полезен метод, който също се отнася до дължината на низовете: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той връща броя на кодовите точки в низа след нормализацията му.<\/span> <span class=\"sg\" data-s=\"2\">В много случаи, <code>codes<\/code> и <code>chars<\/code> връщат едно и също.<\/span> <span class=\"sg\" data-s=\"3\">Все пак, в някои редки случаи, когато, например, сте създали 'невъзможен' символ, за който няма единна кодова точка в цялото Юникод пространство, методите дават различни резултати.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този символ, <code>x̨<\/code>, няма посветена кодова точка и може да бъде конструиран само от две части: малката буква <code>x<\/code> и комбиниращия символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Така че, все още има един символ, но две кодови точки.<\/span> <span class=\"sg\" data-s=\"2\">Така че, програмата отпечатва:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"eo":{"t":"Ĉena longo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La Unikoda naturo de la ŝnuroj faras kelkajn trivialajn aferojn iom pli malfacilaj.<\/span> <span class=\"sg\" data-s=\"1\">Aŭ, almenaŭ, vi devas pensi pri ĝi kiel pri malpli rekta temo.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, prenu la longecon de ŝnuro.<\/span> <span class=\"sg\" data-s=\"3\">Ĉu ĝi estas la nombro de karakteroj, aŭ ĉu ĝi estas la nombro de bajtoj?<\/span> <span class=\"sg\" data-s=\"4\">Aŭ kio se la sama karaktero estas malkomponita malsame en malsamaj ŝnuroj, ĉu ĝi ankoraŭ estas unu karaktero?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en karakteroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por akiri la longecon de la ŝnuro en karakteroj, uzu la metodon <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dum ni parolos pri metodoj poste, ni jam devus povi uzi ilin.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, vi povas voki metodojn sur preskaŭ ĉiu objekto, inkluzive de ŝnuroj kaj skalaj variabloj.<\/span> <span class=\"sg\" data-s=\"2\">Por voki metodon, uzu punkton.<\/span> <span class=\"sg\" data-s=\"3\">Do, ĉi tie ni vidas la metodon vokitan sur variablo, kiu konservas ŝnuron: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas kvar karakteroj en ĉi tiu ĉina saluto 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">Kaj <code>$str.chars<\/code> redonas ĝuste <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en bajtoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nur por referenco, jen kiel vi akiras la longecon de la ŝnuro en bajtoj.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, gravas scii kiu kodado estas uzata por konservi la ŝnuron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje, la programo presas <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, ke ni havas du ĉenitajn metodvokojn en la dua linio ĉi tie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en kodpunktoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nur por kompletiĝo, jen alia utila metodo, kiu ankaŭ rilatas al ŝnurlongecoj: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas la nombron de kodpunktoj en la ŝnuro post kiam ĝi estas normaligita.<\/span> <span class=\"sg\" data-s=\"2\">En multaj kazoj, <code>codes<\/code> kaj <code>chars<\/code> redonas la saman.<\/span> <span class=\"sg\" data-s=\"3\">Tamen, en iuj maloftaj kazoj, kiam, ekzemple, vi konstruis 'neeblan' karakteron, por kiu ne ekzistas unuopa kodpunkto en la tuta Unikoda spaco, la metodoj donas malsamajn rezultojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu karaktero, <code>x̨<\/code>, ne havas dediĉitan kodpunkton kaj povas esti konstruita nur el la du partoj: la minuskla litero <code>x<\/code> kaj la kombina karaktero <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do, ankoraŭ estas unu karaktero sed du kodpunktoj.<\/span> <span class=\"sg\" data-s=\"2\">Do, la programo presas:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"la":{"t":"Catena longitudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Natura Unicode filarum facit quaedam levia paulo difficiliora.<\/span> <span class=\"sg\" data-s=\"1\">Vel, saltem, debes cogitare de ea tamquam de re minus directa.<\/span> <span class=\"sg\" data-s=\"2\">Accipe, exempli gratia, longitudinem filae.<\/span> <span class=\"sg\" data-s=\"3\">Estne numerus characterum, an est numerus byteorum?<\/span> <span class=\"sg\" data-s=\"4\">Vel quid si idem character diversimode in diversis filis decompositus est, estne adhuc unus character?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in characteribus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut longitudines filae in characteribus obtineas, utere <em>methodo<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dum de methodis postea loquemur, iam eas uti debemus.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, potes methodos in fere omni obiecto vocare, inclusis filis et variabilibus scalaribus.<\/span> <span class=\"sg\" data-s=\"2\">Ut methodum vocares, utere puncto.<\/span> <span class=\"sg\" data-s=\"3\">Ita, hic videmus methodum vocatam in variabili quae filam continet: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quattuor characteres sunt in hoc salutatione Sinensi 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">Et <code>$str.chars<\/code> exacte <code>4<\/code> reddit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in byteis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad referentiam, hoc modo longitudines filae in byteis obtines.<\/span> <span class=\"sg\" data-s=\"1\">Hoc casu, interest scire quae codificatio ad filam tenendam adhibetur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore, programma <code>12<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Nota quod duas methodi vocationes concatenatas in secunda linea hic habemus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in punctis codicis<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ad plenitudinem, hic est alia utilis methodus quae etiam ad longitudines filarum pertinet: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Reddit numerum punctorum codicis in fila postquam normalizata est.<\/span> <span class=\"sg\" data-s=\"2\">In multis casibus, <code>codes<\/code> et <code>chars<\/code> idem reddunt.<\/span> <span class=\"sg\" data-s=\"3\">Tamen, in quibusdam raris casibus, cum, exempli gratia, 'impossibilem' characterem aedificas, cuius nullus singularis punctus codicis in toto spatio Unicode est, methodi diversos eventus dant.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic character, <code>x̨<\/code>, nullum punctum codicis dedicatum habet et solum ex duabus partibus construi potest: littera minuscula <code>x<\/code> et character combinans <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ita, adhuc unus character est sed duo puncta codicis.<\/span> <span class=\"sg\" data-s=\"2\">Ita, programma imprimit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]}}}</script>
