-s=\"1\">Dies ist eine vollkommen akzeptable Art, Variablen in Raku zu benennen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie sich nicht von den zwei aufeinanderfolgenden Dollarzeichen verwirren.<\/span> <span class=\"sg\" data-s=\"1\">Raku liest sie separat.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel im Teilstring <code>\\$$price<\/code> wird das erste Dollarzeichen maskiert und stellt somit sich selbst dar, während das zweite Teil des Variablennamens <code>$price<\/code> ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alle Zeichenketten sind in doppelte Anführungszeichen gesetzt, um die Interpolation der Variablen und Sonderzeichen zu ermöglichen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie uns zu dieser Aufgabe zurückkehren, nachdem wir uns mit Arrays und Hashes vertraut gemacht haben.<\/span><\/p>"]]},"nl":{"t":"Solution: Aankoop tabel","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $stoel-prijs = 20.57;\nmy $stoelen = 4;\nmy $stoelen-totaal = $stoel-prijs * $stoelen;\n\nmy $tafel-prijs = 50.18;\nmy $tafels = 1;\nmy $tafels-totaal = $tafel-prijs * $tafels;\n\nsay \"Item\\tPrijs\\tN\\tTotaal\";\nsay \"Stoelen\\t\\$$stoel-prijs\\t$stoelen\\t\\$$stoelen-totaal\";\nsay \"Tafels\\t\\$$tafel-prijs\\t$tafels\\t\\$$tafels-totaal\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Alle getallen zijn hardcoded en opgeslagen in een aantal variabelen.<\/span> <span class=\"sg\" data-s=\"1\">We gebruiken ook de vermenigvuldigingsoperator <code>*<\/code> om het resultaat te berekenen.<\/span> <span class=\"sg\" data-s=\"2\">We zullen meer leren over operators in de volgende secties van deze cursus, maar op dit moment zou de constructie zoals <code>$stoel-prijs * $stoelen<\/code> geen vragen moeten oproepen.<\/span><\/p>"],["p",3,"<p><sp ";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tutti i numeri sono hardcoded e salvati in un numero di variabili.<\/span> <span class=\"sg\" data-s=\"1\">Usiamo anche l'operatore di moltiplicazione <code>*<\/code> per calcolare il risultato.<\/span> <span class=\"sg\" data-s=\"2\">Impareremo di più sugli operatori nelle prossime sezioni di questo corso, ma a questo punto, la costruzione come <code>$chair-price * $chairs<\/code> non dovrebbe essere qualcosa che causa domande.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Le tre righe che generano l'output stampano le tre righe della tabella, incluso il suo header.<\/span> <span class=\"sg\" data-s=\"1\">Nota come le colonne sono separate dai caratteri di tabulazione <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nelle righe dei dati, vediamo anche un carattere dollaro escapato: <code>\\$<\/code> così come diverse variabili che vogliamo interpolare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esegui il programma e vedi come stampa la tabella:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai notato i trattini nei nomi delle variabili come <code>$chair-price<\/code> o <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Questo è un modo perfettamente accettabile di nominare variabili in Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non essere confuso dai due simboli del dollaro adiacenti.<\/span> <span class=\"sg\" data-s=\"1\">Raku li legge separatamente.<\/span> <span class=\"sg\" data-s=\"2\">Ad esempio, nella sottostringa <code>\\$$price<\/code>, il primo simbolo del dollaro è escapato e quindi rappresenta se stesso, mentre il secondo fa parte del nome della variabile <code>$price<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tutte le stringhe sono quotate tra doppi apici per permettere l'interpolazione delle variabili e dei caratteri speciali.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Torniamo a questo compito di nuovo dopo che ci siamo familiarizzati con array e hash.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Pirkumu tabula","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir iespējams risinājums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Visi skaitļi ir cieti kodēti un saglabāti vairākos mainīgajos.<\/span> <span class=\"sg\" data-s=\"1\">Mēs arī izmantojam reizināšanas operatoru <code>*<\/code>, lai aprēķinātu rezultātu.<\/span> <span class=\"sg\" data-s=\"2\">Mēs uzzināsim vairāk par operatoriem nākamajās šī kursa sadaļās, bet šajā brīdī konstrukcijai, piemēram, <code>$chair-price * $chairs<\/code>, nevajadzētu radīt jautājumus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Trīs rindas, kas ģenerē izvadi, izdrukā tabulas trīs rindas, ieskaitot tās galveni.<\/span> <span class=\"sg\" data-s=\"1\">Pamaniet, kā kolonnas ir atdalītas ar tabulācijas rakstzīmēm <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Datu rindās mēs arī redzam aizbēgtu dolāra rakstzīmi: <code>\\$<\/code>, kā arī dažādus mainīgos, kurus vēlamies interpolēt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu un redziet, kā tā izdrukā tabulu:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai pamanījāt domuzīmes mainīgo nosaukumos, piemēram, <code>$chair-price<\/code> vai <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Tas ir pilnīgi pieņemams veids, kā nosaukt mainīgos Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nesajaucieties ar diviem blakus esošiem dolāra simboliem.<\/span> <span class=\"sg\" data-s=\"1\">Raku tos lasa atsevišķi.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, apakšvirknē <code>\\$$price<\/code> pirmais dolāra simbols ir aizbēgts un tādējādi pārstāv pats sevi, kamēr otrais ir daļa no mainīgā nosaukuma <code>$price<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visas virknes ir citētas dubultajās pēdiņās, lai ļautu interpolēt mainīgos un speciālās rakstzīmes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atgriezīsimies pie šī uzdevuma vēlreiz pēc tam, kad būsim iepazinušies ar masīviem un hešiem.<\/span><\/p>"]]},"ru":{"t":"Решение: Таблица покупок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот возможное решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Все числа заданы вручную и сохранены в переменных.<\/span> <span class=\"sg\" data-s=\"1\">Мы также используем оператор умножения <code>*<\/code>, чтобы посчитать результат.<\/span> <span class=\"sg\" data-s=\"2\">Мы узнаем больше об операторах в следующих главах этого курса, но на данный момент конструкция <code>$chair-price * $chairs<\/code> не должна быть чем-то, что вызывает вопросы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Три строки, которые производят вывод, печатают три ряда таблицы, включая заголовки.<\/span> <span class=\"sg\" data-s=\"1\">Колонки отделены друг от друга символом таб <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В рядах с данными мы также видим экранированный символ доллара <code>\\$<\/code>, как и другие переменные, которые мы хотим интерполировать.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вы можете найти исходный код в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите программу, и она выведет таблицу:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы заметили дефисы в именах переменных, таких как <code>$chair-price<\/code> или <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Это вполне приемлемый способ именования переменных в Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не позвольте себя смутить двумя последовательными знаками доллара.<\/span> <span class=\"sg\" data-s=\"1\">Raku читает их по-отдельности.<\/span> <span class=\"sg\" data-s=\"2\">Например, в подстроке <code>\\$$price<\/code> первый знак доллара экранирован и поэтому представляет сам себя, тогда как второй является частью переменной <code>$price<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Все строки заключены в двойные кавычки, чтобы позволить интерполяцию переменных и специальных символов.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте еще раз вернемся к этому заданию, когда мы познакомимся с массивами и словарями.<\/span><\/p>"]]},"uk":{"t":"Solution: Таблиця покупок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось можливе рішення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Усі числа жорстко закодовані та збережені в кількох змінних.<\/span> <span class=\"sg\" data-s=\"1\">Ми також використовуємо оператор множення <code>*<\/code> для обчислення результату.<\/span> <span class=\"sg\" data-s=\"2\">Ми дізнаємося більше про оператори в наступних розділах цього курсу, але на даний момент конструкція, така як <code>$chair-price * $chairs<\/code>, не повинна викликати питань.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Три рядки, що генерують вихідні дані, друкують три рядки таблиці, включаючи її заголовок.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, як стовпці розділені символами табуляції <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У рядках даних ми також бачимо екранований символ долара: <code>\\$<\/code>, а також різні змінні, які ми хочемо інтерполювати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідні дані<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму та подивіться, як вона друкує таблицю:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чи помітили ви дефіси в назвах змінних, таких як <code>$chair-price<\/code> або <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Це цілком прийнятний спосіб називання змінних у Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не плутайте два суміжні символи долара.<\/span> <span class=\"sg\" data-s=\"1\">Raku читає їх окремо.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, у підрядку <code>\\$$price<\/code>, перший знак долара екранований і, таким чином, представляє себе, тоді як другий є частиною імені змінної <code>$price<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усі рядки взяті в подвійні лапки, щоб дозволити інтерполяцію змінних і спеціальних символів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повернемося до цього завдання знову після того, як ознайомимося з масивами та хешами.<\/span><\/p>"]]},"bg":{"t":"Solution: Таблица за покупки","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всички числа са твърдо кодирани и запазени в няколко променливи.<\/span> <span class=\"sg\" data-s=\"1\">Също така използваме оператора за умножение <code>*<\/code>, за да изчислим резултата.<\/span> <span class=\"sg\" data-s=\"2\">Ще научим повече за операторите в следващите секции на този курс, но на този етап конструкцията като <code>$chair-price * $chairs<\/code> не би трябвало да предизвиква въпроси.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трите реда, които генерират изхода, отпечатват трите реда на таблицата, включително заглавието ѝ. Забележете как колоните са разделени с табулационни символи <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В редовете с данни също виждаме избягал знак за долар: <code>\\$<\/code>, както и различни променливи, които искаме да интерполираме.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата и вижте как отпечатва таблицата:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забелязахте ли тиретата в имената на променливите като <code>$chair-price<\/code> или <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Това е напълно приемлив начин за именуване на променливи в Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не се бъркайте от двата съседни символа за долар.<\/span> <span class=\"sg\" data-s=\"1\">Raku ги чете поотделно.<\/span> <span class=\"sg\" data-s=\"2\">Например, в подниз <code>\\$$price<\/code>, първият символ за долар е избягал и следователно представлява самия себе си, докато вторият е част от името на променливата <code>$price<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всички низове са оградени в двойни кавички, за да позволят интерполация на променливите и специалните символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека се върнем към тази задача отново, след като се запознаем с масиви и хешове.<\/span><\/p>"]]},"eo":{"t":"Solution: Aĉettabelo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj nombroj estas malmole koditaj kaj konservitaj en kelkaj variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Ni ankaŭ uzas la multiplikan operatoron <code>*<\/code> por kalkuli la rezulton.<\/span> <span class=\"sg\" data-s=\"2\">Ni lernos pli pri operatoroj en la sekvaj sekcioj de ĉi tiu kurso, sed nuntempe, la konstruo kiel <code>$chair-price * $chairs<\/code> ne devus esti io, kio kaŭzas demandojn.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La tri linioj generantaj la eliron presas la tri liniojn de la tabelo, inkluzive de ĝia kaplinio.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku kiel la kolumnoj estas apartigitaj per la tabokarakteroj <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En la datlinioj, ni ankaŭ vidas eskapitan dolarkarakteron: <code>\\$<\/code> same kiel malsamajn variablojn, kiujn ni volas interpoligi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kaj vidu kiel ĝi presas la tabelon:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi rimarkis la streketo en la nomoj de la variabloj kiel <code>$chair-price<\/code> aŭ <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas perfekte akceptebla maniero nomi variablojn en Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ne konfuziĝu pro la du apudaj dolarsignoj.<\/span> <span class=\"sg\" data-s=\"1\">Raku legas ilin aparte.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, en la subĉeno <code>\\$$price<\/code>, la unua dolarsigno estas eskapita kaj tiel reprezentas sin mem, dum la dua estas parto de la variablonomo <code>$price<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj ŝnuroj estas cititaj en duoblaj citiloj por permesi interpoligon de la variabloj kaj la specialaj karakteroj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni revenu al ĉi tiu tasko denove post kiam ni konatiĝos kun tabeloj kaj haketoj.<\/span><\/p>"]]},"la":{"t":"Solution: Tabula emptio","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio possibilis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sella-pretium = 20.57;\nmy $sellae = 4;\nmy $sellae-totalis = $sella-pretium * $sellae;\n\nmy $mensa-pretium = 50.18;\nmy $mensae = 1;\nmy $mensae-totalis = $mensa-pretium * $mensae;\n\ndic \"Item\\tPretium\\tN\\tTotalis\";\ndic \"Sellae\\t\\$$sella-pretium\\t$sellae\\t\\$$sellae-totalis\";\ndic \"Mensae\\t\\$$mensa-pretium\\t$mensae\\t\\$$mensae-totalis\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omnes numeri sunt duriter codificati et servati in variis variabilibus.<\/span> <span class=\"sg\" data-s=\"1\">Nos quoque utimur operatore multiplicationis <code>*<\/code> ad computandum eventum.<\/span> <span class=\"sg\" data-s=\"2\">Plura de operatoribus in proximis sectionibus huius cursus discemus, sed hoc tempore, constructio talis ut <code>$sella-pretium * $sellae<\/code> non debet esse aliquid quod quaestiones causat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tres lineae generantes output imprimunt tres lineas tabulae, includens eius caput.<\/span> <span class=\"sg\" data-s=\"1\">Animadverte quomodo columnae separantur per characteres tabulationis <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In datis lineis, etiam videmus characterem dollariorum effugientem: <code>\\$<\/code> necnon varias variabiles quas interpolare volumus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programmatum et vide quomodo tabulam imprimit:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Pretium   N      Totalis\nSellae  $20.57    4      $82.28\nMensae  $50.18    1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Animadvertistine hyphena in nominibus variabilium ut <code>$sella-pretium<\/code> vel <code>$mensae-totalis<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Hoc est modus perfecte acceptabilis nominandi variabiles in Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ne confundaris a duobus signis dollariorum adiacentibus.<\/span> <span class=\"sg\" data-s=\"1\">Raku ea separatim legit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, in substringa <code>\\$$pretium<\/code>, primum signum dollariorum effugit et sic se ipsum repraesentat, dum secundum est pars nominis variabilis <code>$pretium<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omnes chordae sunt in duplicibus quotationibus ad permittendum interpolationem variabilium et characterum specialium.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Revertamur ad hoc munus iterum postquam noti sumus cum arrayis et hashis.<\/span><\/p>"]]}}}</script>
