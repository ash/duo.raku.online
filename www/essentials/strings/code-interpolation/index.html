<script type="application/json" id="page-data">{"u":"essentials/strings/code-interpolation","n":58,"k":"topic","pv":"essentials/strings/variable-interpolation/quiz","nx":"essentials/strings/escaping-special-characters","tr":["essentials","essentials/strings"],"L":{"en":{"t":"Code interpolation in Raku strings","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The next level of interpolation is code interpolation.<\/span> <span class=\"sg\" data-s=\"1\">It allows you to have simple (and complex too!) code directly inside a double-quoted string.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The interpolated code is placed between curly braces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variables again<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">One of the applications of this method is to help to disambiguate situations when a variable must be followed by a text that can be wrongly understood as the continuation of the variable’s name.<\/span> <span class=\"sg\" data-s=\"1\">To prevent that, use curly braces to enclose the variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without curly braces, Raku would try to interpolate a non-existent variable <code>$whats<\/code>.<\/span><\/p>"]]},"de":{"t":"Code-Interpolation","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das nächste Level der Interpolation ist die Code-Interpolation.<\/span> <span class=\"sg\" data-s=\"1\">Sie ermöglicht es, einfachen (und auch komplexen!)<\/span> <span class=\"sg\" data-s=\"2\">Code direkt innerhalb eines doppelt-anfangs- und endenden Strings zu haben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der interpolierte Code wird zwischen geschweiften Klammern platziert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nochmals Variablen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine der Anwendungen dieser Methode besteht darin, Situationen zu entschärfen, in denen eine Variable von einem Text gefolgt werden muss, der fälschlicherweise als Fortsetzung des Variablennamens verstanden werden könnte.<\/span> <span class=\"sg\" data-s=\"1\">Um dies zu verhindern, verwenden Sie geschweifte Klammern, um die Variable einzuschließen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne geschweifte Klammern würde Raku versuchen, eine nicht existierende Variable <code>$whats<\/code> zu interpolieren.<\/span><\/p>"]]},"nl":{"t":"Code interpolatie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het volgende niveau van interpolatie is code interpolatie.<\/span> <span class=\"sg\" data-s=\"1\">Hiermee kunt u eenvoudige (en ook complexe!) code direct in een dubbel-quoted string plaatsen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De geïnterpoleerde code wordt tussen accolades geplaatst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"De som van $a en $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nDe som van 10 en 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opnieuw variabelen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een van de toepassingen van deze methode is om te helpen situaties te ontwarren waarin een variabele gevolgd moet worden door een tekst die ten onrechte kan worden begrepen als de voortzetting van de naam van de variabele.<\/span> <span class=\"sg\" data-s=\"1\">Om dit te voorkomen, gebruikt u accolades om de variabele in te sluiten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hoeveel = 5;\nmy $wat = 'pak';\nsay \"Er zijn $hoeveel {$wat}ken.\"; # Er zijn 5 pakken.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder accolades zou Raku proberen een niet-bestaande variabele <code>$watken<\/code> te interpoleren.<\/span><\/p>"]]},"es":{"t":"Interpolación de código","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El siguiente nivel de interpolación es la interpolación de código.<\/span> <span class=\"sg\" data-s=\"1\">Te permite tener código simple (¡y complejo también!) directamente dentro de una cadena entre comillas dobles.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El código interpolado se coloca entre llaves:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La suma de $a y $b es {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa suma de 10 y 20 es 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variables de nuevo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una de las aplicaciones de este método es ayudar a desambiguar situaciones cuando una variable debe ser seguida por un texto que puede ser malinterpretado como la continuación del nombre de la variable.<\/span> <span class=\"sg\" data-s=\"1\">Para evitar eso, usa llaves para encerrar la variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'traje';\nsay \"Hay $how-many {$what}s.\"; # Hay 5 trajes.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin las llaves, Raku intentaría interpolar una variable inexistente <code>$whats<\/code>.<\/span><\/p>"]]},"it":{"t":"Interpolazione del codice","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il livello successivo di interpolazione è l'interpolazione di codice.<\/span> <span class=\"sg\" data-s=\"1\">Ti permette di inserire codice semplice (e anche complesso!) direttamente all'interno di una stringa tra doppi apici.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il codice interpolato è inserito tra parentesi graffe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La somma di $a e $b è {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa somma di 10 e 20 è 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ancora variabili<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una delle applicazioni di questo metodo è aiutare a disambiguare situazioni in cui una variabile deve essere seguita da un testo che potrebbe essere erroneamente interpretato come la continuazione del nome della variabile.<\/span> <span class=\"sg\" data-s=\"1\">Per evitare ciò, usa le parentesi graffe per racchiudere la variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Ci sono $how-many {$what}s.\"; # Ci sono 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza parentesi graffe, Raku cercherebbe di interpolare una variabile inesistente <code>$whats<\/code>.<\/span><\/p>"]]},"lv":{"t":"Koda interpolācija","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamais interpolācijas līmenis ir koda interpolācija.<\/span> <span class=\"sg\" data-s=\"1\">Tā ļauj ievietot vienkāršu (un arī sarežģītu!) kodu tieši dubultpēdiņu virknes iekšpusē.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Interpolētais kods tiek ievietots starp cirtainajām iekavām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Summa no $a un $b ir {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nSumma no 10 un 20 ir 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vēlreiz par mainīgajiem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Viena no šīs metodes pielietojumiem ir palīdzēt novērst neskaidrības situācijās, kad mainīgajam jāseko tekstam, kuru var kļūdaini saprast kā mainīgā nosaukuma turpinājumu.<\/span> <span class=\"sg\" data-s=\"1\">Lai to novērstu, izmantojiet cirtainās iekavas, lai iekļautu mainīgo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Tur ir $how-many {$what}s.\"; # Tur ir 5 uzvalki.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez cirtainajām iekavām Raku mēģinātu interpolēt neeksistējošu mainīgo <code>$whats<\/code>.<\/span><\/p>"]]},"ru":{"t":"Интерполяция кода","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующий уровень интерполяции — это интерполяция кода.<\/span> <span class=\"sg\" data-s=\"1\">Она позволяет вам вставлять простые (и даже сложные!) кусочки кода прямо в строку с двойными кавычками.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Код для интерполяции помещается в фигурные скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">И снова переменные<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Один из способов применения — это помочь устранить неоднозначность в ситуациях, когда прямо за переменной должен идти текст, который может быть неправильно понят, как продолжение имени переменной.<\/span> <span class=\"sg\" data-s=\"1\">Заключите переменную в фигурные скобки, чтобы этого избежать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В отсутствие фигурных скобок Raku бы попытался подставить несуществующую переменную <code>$whats<\/code>.<\/span><\/p>"]]},"uk":{"t":"Інтерполяція коду","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступний рівень інтерполяції — це інтерполяція коду.<\/span> <span class=\"sg\" data-s=\"1\">Вона дозволяє включати простий (і складний теж!) код безпосередньо всередині рядка з подвійними лапками.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Інтерпольований код розміщується між фігурними дужками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виведе:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Знову про змінні<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Одним із застосувань цього методу є допомога в розрізненні ситуацій, коли змінна повинна слідувати за текстом, який може бути неправильно зрозумілий як продовження імені змінної.<\/span> <span class=\"sg\" data-s=\"1\">Щоб запобігти цьому, використовуйте фігурні дужки для обмеження змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без фігурних дужок Raku спробував би інтерполювати неіснуючу змінну <code>$whats<\/code>.<\/span><\/p>"]]},"bg":{"t":"Кодова интерполация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващото ниво на интерполация е интерполацията на код.<\/span> <span class=\"sg\" data-s=\"1\">Тя ви позволява да имате прост (и сложен също!) код директно вътре в низ, ограден с двойни кавички.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Интерполираният код се поставя между къдрави скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Сумата на $a и $b е {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nСумата на 10 и 20 е 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отново променливи<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Едно от приложенията на този метод е да помогне за разясняване на ситуации, когато променлива трябва да бъде последвана от текст, който може да бъде неправилно разбран като продължение на името на променливата.<\/span> <span class=\"sg\" data-s=\"1\">За да предотвратите това, използвайте къдрави скоби, за да оградите променливата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Има $how-many {$what}s.\"; # Има 5 костюма.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без къдрави скоби, Raku би се опитал да интерполира несъществуваща променлива <code>$whats<\/code>.<\/span><\/p>"]]},"eo":{"t":"Koda interpolado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekva nivelo de interpolado estas koda interpolado.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi permesas al vi havi simplan (kaj kompleksan ankaŭ!) kodon rekte ene de duoble-citita ŝnuro.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La interpolita kodo estas metita inter krampoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La sumo de $a kaj $b estas {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa sumo de 10 kaj 20 estas 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabloj denove<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unu el la aplikoj de ĉi tiu metodo estas helpi malambiguigi situaciojn kiam variablo devas esti sekvita de teksto kiu povas esti malĝuste komprenita kiel la daŭrigo de la nomo de la variablo.<\/span> <span class=\"sg\" data-s=\"1\">Por eviti tion, uzu krampojn por enfermi la variablon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Estas $how-many {$what}s.\"; # Estas 5 vestoj.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sen krampoj, Raku provus interpoladi neekzistantan variablon <code>$whats<\/code>.<\/span><\/p>"]]},"la":{"t":"Codice interpolatio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Proximum interpolationis gradum est interpolationis codicis.<\/span> <span class=\"sg\" data-s=\"1\">Permittit te habere simplicem (et etiam complexum!) codicem directe intra stringam duplici-quotatione.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Interpolatus codex inter uncis curvis ponitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Summa $a et $b est {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nSumma 10 et 20 est 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabiles iterum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una ex applicationibus huius methodi est adiuvare ad disambiguandum situationes ubi variabilis sequenda est a textu qui perperam intellegi potest tamquam continuatio nominis variabilis.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc praecavendum, utere uncis curvis ad variabilem includendam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Sunt $how-many {$what}s.\"; # Sunt 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine uncis curvis, Raku conaretur interpolare variabilem non-existentem <code>$whats<\/code>.<\/span><\/p>"]]}}}</script>
