de><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questa variante stampa esattamente la stessa stringa, ma l'interpolazione sembra più naturale e facile da leggere.<\/span> <span class=\"sg\" data-s=\"1\">Nota che il carattere <code>$<\/code> non è stato né interpolato né eseguito l'escape in una stringa tra apici singoli: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questa è la principale differenza.<\/span> <span class=\"sg\" data-s=\"3\">I caratteri speciali tra apici singoli appaiono così come sono.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni altri caratteri speciali che hanno un significato speciale nelle stringhe tra doppi apici:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Segno di dollaro <code>\\n<\/code> | Nuova riga <code>\\r<\/code> | Ritorno a capo <code>\\t<\/code> | Tabulazione orizzontale <code>\\\"<\/code> | Doppio apice <code>\\\\<\/code> | Barra rovesciata<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il modo in cui citi la stringa definisce come Raku tratta i caratteri speciali.<\/span> <span class=\"sg\" data-s=\"1\">Considera questi due esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se esegui questo programma, vedrai che la prima stringa appare così com'è su una singola riga.<\/span> <span class=\"sg\" data-s=\"1\">La seconda stringa è stata divisa in due parti:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tra doppi apici, una sequenza speciale <code>\\n<\/code> è stata elaborata come un carattere di nuova riga, mentre in una stringa tra apici singoli era una normale sequenza di due caratteri: <code>\\<\/code> e <code>n<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">C'è un'eccezione interessante per <code>'<\/code> e <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tra apici singoli, puoi eseguire l'escape di un apice singolo prefissandolo con un altro <code>\\<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anche una barra rovesciata deve essere eseguita l'escape se segue un apice singolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"lv":{"t":"Speciālo rakstzīmju izbēgšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Iedomājieties, ka vēlaties izdrukāt cenu zīmi, un jūs saglabājat gan produkta nosaukumu, gan tā cenu skalārajos mainīgajos?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kā izdrukāt zīmi, ja cena ir domāta dolāros?<\/span> <span class=\"sg\" data-s=\"1\">Paredzētā izvade ir: <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dolāra zīme dubultajās pēdiņās ir mainīgā interpolācijas indikators.<\/span> <span class=\"sg\" data-s=\"3\">Lai izdrukātu pašu <code>$<\/code> rakstzīmi, jums tā jāizvairās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, jūs varat izmantot virknes savienošanu un izvairīties no <code>$<\/code> izvairīšanās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šis variants izdrukā tieši tādu pašu virkni, bet interpolācija izskatās dabiskāk un ir vieglāk lasāma.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā, ka <code>$<\/code> rakstzīme netika interpolēta vai izvairīta vienkāršajās pēdiņās: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir galvenā atšķirība.<\/span> <span class=\"sg\" data-s=\"3\">Speciālās rakstzīmes vienkāršajās pēdiņās parādās tādas, kādas tās ir.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vēl dažas speciālās rakstzīmes, kurām dubultajās pēdiņās ir īpaša nozīme:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Dolāra zīme <code>\\n<\/code> | Jauna rinda <code>\\r<\/code> | Karietes atgriešana <code>\\t<\/code> | Horizontāla tabulācija <code>\\\"<\/code> | Dubultā pēdiņa <code>\\\\<\/code> | Atpakaļslīpsvītra<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas, kā jūs citējat virkni, nosaka, kā Raku apstrādā speciālās rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Apsveriet šos divus piemērus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jūs palaidīsiet šo programmu, jūs redzēsiet, ka pirmā virkne parādās tāda, kāda tā ir vienā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Otrā virkne tika sadalīta divās daļās:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dubultajās pēdiņās speciālā secība <code>\\n<\/code> tika apstrādāta kā jaunas rindas rakstzīme, savukārt virknei vienkāršajās pēdiņās tā bija parasta divu rakstzīmju secība: <code>\\<\/code> un <code>n<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir interesants izņēmums priekš <code>'<\/code> un <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršajās pēdiņās jūs varat izvairīties no vienkāršās pēdiņas, pievienojot tai priekšā vēl vienu <code>\\<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Arī atpakaļslīpsvītra ir jāizvairās, ja tai seko vienkāršā pēdiņa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"ru":{"t":"Экранирование специальных символов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Представьте, что вы хотите напечатать ценник, и вы храните имя и цену продукта в скалярных переменных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Как напечатать ценник, если цена должна быть в долларах?<\/span> <span class=\"sg\" data-s=\"1\">Ожидаемый вывод <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Знак доллара в двойных кавычках — это индикатор переменной, которую нужно интерполировать.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы вывести сам символ <code>$<\/code>, его нужно экранировать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно же, вы можете использовать конкатенацию строк и избежать экранирования <code>$<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Этот подход выведет ту же самую строку, но интерполяция выглядит более естественной и ее проще прочитать.<\/span> <span class=\"sg\" data-s=\"1\">Отметим, что символ <code>$<\/code> не был ни интерполирован, ни экранирован в строке с одинарными кавычками: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это и есть основная разница.<\/span> <span class=\"sg\" data-s=\"3\">Специальные символы в одинарных кавычках пишутся без изменений.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот еще несколько специальных символов, у которых есть особенное значение в строке с двойными кавычками.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Знак доллара <code>\\n<\/code> | Новая строка <code>\\r<\/code> | Возврат каретки <code>\\t<\/code> | Горизонтальный таб <code>\\\"<\/code> | Двойная кавычка <code>\\\\<\/code> | Обратный слэш<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Выбранные кавычки диктуют, как Raku видит специальные символы.<\/span> <span class=\"sg\" data-s=\"1\">Рассмотрим эти два примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы запустите эту программу, вы увидите, что первая строчка выводится как есть, на одной строке.<\/span> <span class=\"sg\" data-s=\"1\">Вторая же строчка была разбита на две части:<\/span><\/p>"],["code",0,"<pre><code>One\\nTwo\nThree\nFour<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В двойных кавычках специальная последовательность <code>\\n<\/code> была интерпретирована как символ новой строки, тогда как в одинарных кавычках это была обычная последовательность двух символов: <code>\\<\/code> и <code>n<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть интересное исключение для <code>'<\/code> и <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В одинарных кавычках вы можете экранировать другую одинарную кавычку, поставив перед ней <code>\\<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратный слэш тоже должен быть экранирован, если сразу за ним следует одинарная кавычка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"uk":{"t":"Екранування спеціальних символів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Уявіть, що ви хочете надрукувати цінник і зберігаєте як назву продукту, так і його ціну в скалярних змінних?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Як надрукувати цінник, якщо ціна має бути в доларах?<\/span> <span class=\"sg\" data-s=\"1\">Очікуваний результат: <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Знак долара в рядках з подвійними лапками є індикатором змінної для інтерполяції.<\/span> <span class=\"sg\" data-s=\"3\">Щоб надрукувати сам символ <code>$<\/code>, потрібно його екранувати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, ви можете використовувати конкатенацію рядків і уникнути екранування <code>$<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Цей варіант друкує точно такий же рядок, але інтерполяція виглядає більш природною і легшою для читання.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що символ <code>$<\/code> не був інтерпольований або екранований у рядку з одинарними лапками: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це головна відмінність.<\/span> <span class=\"sg\" data-s=\"3\">Спеціальні символи в одинарних лапках з'являються як є.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось ще кілька спеціальних символів, які мають особливе значення в рядках з подвійними лапками:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Знак долара <code>\\n<\/code> | Новий рядок <code>\\r<\/code> | Повернення каретки <code>\\t<\/code> | Горизонтальна табуляція <code>\\\"<\/code> | Подвійна лапка <code>\\\\<\/code> | Зворотна коса риска<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спосіб, яким ви цитуєте рядок, визначає, як Raku обробляє спеціальні символи.<\/span> <span class=\"sg\" data-s=\"1\">Розгляньте ці два приклади:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви запустите цю програму, ви побачите, що перший рядок з'являється як є на одному рядку.<\/span> < да използвате конкатенация на низове и да избегнете избягването на <code>$<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Този вариант отпечатва точно същия низ, но интерполацията изглежда по-естествена и по-лесна за четене.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че символът <code>$<\/code> не беше интерполиран, нито избягнат в низ с единични кавички: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е основната разлика.<\/span> <span class=\"sg\" data-s=\"3\">Специалните символи в единични кавички се появяват както са.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето още няколко специални символа, които имат специално значение в низове с двойни кавички:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Знак за долар <code>\\n<\/code> | Нов ред <code>\\r<\/code> | Връщане на каретката <code>\\t<\/code> | Хоризонтален табулатор <code>\\\"<\/code> | Двойни кавички <code>\\\\<\/code> | Обратна наклонена черта<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Начинът, по който цитирате низа, определя как Raku третира специалните символи.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте тези два примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако изпълните тази програма, ще видите, че първият низ се появява както е на един ред.<\/span> <span class=\"sg\" data-s=\"1\">Вторият низ беше разделен на две части:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В двойни кавички, специалната последователност <code>\\n<\/code> беше обработена като символ за нов ред, докато в низ с единични кавички тя беше обикновена последователност от два символа: <code>\\<\/code> и <code
