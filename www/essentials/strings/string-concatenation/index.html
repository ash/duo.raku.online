<script type="application/json" id="page-data">{"u":"essentials/strings/string-concatenation","n":52,"k":"topic","pv":"essentials/strings","nx":"essentials/strings/string-concatenation/quiz1","tr":["essentials","essentials/strings"],"L":{"en":{"t":"String concatenation in Raku","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">If you have two strings, you can join them together and get a new longer string.<\/span> <span class=\"sg\" data-s=\"1\">This action is called string concatenation.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, you concatenate strings using—guess what?—the concatenation operator.<\/span> <span class=\"sg\" data-s=\"3\">This operator is a tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">To concatenate two strings, put <code>~<\/code> between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If our strings are kept in variables, we can ’concatenate variables‘, well, actually, concatenate the strings that those variables keep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Or you can create a new variable using the concatenated value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenation with assignment<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you need to update the variable and append the new string to it, use the following form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Instead of \n$str = $str ~ $another-str;\n\n# use:\n$str ~= $another-str;<\/code><\/pre>"]]},"de":{"t":"Zeichenkettenverkettung","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie zwei Zeichenketten haben, können Sie sie zusammenfügen und eine neue, längere Zeichenkette erhalten.<\/span> <span class=\"sg\" data-s=\"1\">Diese Aktion wird als Zeichenkettenverkettung bezeichnet.<\/span> <span class=\"sg\" data-s=\"2\">In Raku verketten Sie Zeichenketten mit—raten Sie mal?—dem Verkettungsoperator.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Operator ist eine Tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Um zwei Zeichenketten zu verketten, setzen Sie <code>~<\/code> zwischen sie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn unsere Zeichenketten in Variablen gespeichert sind, können wir 'Variablen verketten', nun ja, eigentlich die Zeichenketten verketten, die diese Variablen enthalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oder Sie können eine neue Variable mit dem verketteten Wert erstellen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Verkettung mit Zuweisung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie die Variable aktualisieren und die neue Zeichenkette anhängen müssen, verwenden Sie die folgende Form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Anstatt von \n$str = $str ~ $another-str;\n\n# verwenden Sie:\n$str ~= $another-str;<\/code><\/pre>"]]},"nl":{"t":"String concatenatie","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Als je twee strings hebt, kun je ze samenvoegen en een nieuwe, langere string krijgen.<\/span> <span class=\"sg\" data-s=\"1\">Deze actie wordt stringconcatenatie genoemd.<\/span> <span class=\"sg\" data-s=\"2\">In Raku concateneer je strings met—gok eens?—de concatenatie-operator.<\/span> <span class=\"sg\" data-s=\"3\">Deze operator is een tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Om twee strings te concateneren, plaats je <code>~<\/code> ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als onze strings in variabelen worden bewaard, kunnen we 'variabelen concateneren', nou ja, eigenlijk de strings concateneren die die variabelen bevatten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of je kunt een nieuwe variabele maken met de geconcateneerde waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenatie met toewijzing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer je de variabele moet bijwerken en de nieuwe string eraan moet toevoegen, gebruik je de volgende vorm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># In plaats van \n$str = $str ~ $another-str;\n\n# gebruik:\n$str ~= $another-str;<\/code><\/pre>"]]},"es":{"t":"Concatenación de cadenas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Si tienes dos cadenas, puedes unirlas y obtener una nueva cadena más larga.<\/span> <span class=\"sg\" data-s=\"1\">Esta acción se llama concatenación de cadenas.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, concatenas cadenas usando—¿adivina qué?—el operador de concatenación.<\/span> <span class=\"sg\" data-s=\"3\">Este operador es una tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Para concatenar dos cadenas, coloca <code>~<\/code> entre ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si nuestras cadenas están guardadas en variables, podemos 'concatenar variables', bueno, en realidad, concatenar las cadenas que esas variables contienen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">O puedes crear una nueva variable usando el valor concatenado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenación con asignación<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando necesitas actualizar la variable y agregarle la nueva cadena, usa la siguiente forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># En lugar de \n$str = $str ~ $another-str;\n\n# usa:\n$str ~= $another-str;<\/code><\/pre>"]]},"it":{"t":"Concatenazione di stringhe","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Se hai due stringhe, puoi unirle insieme e ottenere una nuova stringa più lunga.<\/span> <span class=\"sg\" data-s=\"1\">Questa azione si chiama concatenazione di stringhe.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, concatenare le stringhe si fa usando—indovina un po'?—l'operatore di concatenazione.<\/span> <span class=\"sg\" data-s=\"3\">Questo operatore è una tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Per concatenare due stringhe, metti <code>~<\/code> tra di esse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se le nostre stringhe sono conservate in variabili, possiamo 'concatenare variabili', beh, in realtà, concatenare le stringhe che quelle variabili contengono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oppure puoi creare una nuova variabile usando il valore concatenato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenazione con assegnazione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando hai bisogno di aggiornare la variabile e aggiungere una nuova stringa ad essa, usa la seguente forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Invece di \n$str = $str ~ $another-str;\n\n# usa:\n$str ~= $another-str;<\/code><\/pre>"]]},"lv":{"t":"Virkņu savienošana","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ja jums ir divas rindas, jūs varat tās savienot kopā un iegūt jaunu, garāku rindu.<\/span> <span class=\"sg\" data-s=\"1\">Šo darbību sauc par rindu savienošanu.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā jūs savienojat rindas, izmantojot—uzminiet, ko?—savienošanas operatoru.<\/span> <span class=\"sg\" data-s=\"3\">Šis operators ir tildes zīme: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Lai savienotu divas rindas, ievietojiet <code>~<\/code> starp tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja mūsu rindas tiek glabātas mainīgajos, mēs varam 'savienot mainīgos', nu, patiesībā, savienot rindas, kuras šie mainīgie glabā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vai arī jūs varat izveidot jaunu mainīgo, izmantojot savienoto vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Savienošana ar piešķiršanu<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jums ir nepieciešams atjaunināt mainīgo un pievienot tam jaunu rindu, izmantojiet šādu formu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Tā vietā, lai izmantotu\n$str = $str ~ $another-str;\n\n# izmantojiet:\n$str ~= $another-str;<\/code><\/pre>"]]},"ru":{"t":"Конкатенация строк","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Если у вас есть две строки, вы можете получить более длинную строку, соединив их вместе.<\/span> <span class=\"sg\" data-s=\"1\">Такое действие называется строковой конкатенацией.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы соединить строки в Raku, мы используем угадайте что? — оператор конкатенации.<\/span> <span class=\"sg\" data-s=\"3\">Этот оператор — тильда <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы соединить две строки, поставьте между ними <code>~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если наши строки хранятся в переменных, мы можем \"конкатенировать переменные\", но, на самом деле, конкатенировать строки, хранящиеся в этих переменных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или вы можете создать новую переменную, используя конкатенированное значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенация с присвоением<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда вам нужно обновить переменную и добавить к ней строку, используйте следующую форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Instead of \n$str = $str ~ $another-str;\n\n# use:\n$str ~= $another-str;<\/code><\/pre>"]]},"uk":{"t":"Конкатенація рядків","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Якщо у вас є два рядки, ви можете з'єднати їх разом і отримати новий довший рядок.<\/span> <span class=\"sg\" data-s=\"1\">Ця дія називається конкатенацією рядків.<\/span> <span class=\"sg\" data-s=\"2\">У Raku ви конкатенуєте рядки, використовуючи—вгадайте що?—оператор конкатенації.<\/span> <span class=\"sg\" data-s=\"3\">Цей оператор є тильдою: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Щоб конкатенувати два рядки, поставте <code>~<\/code> між ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо наші рядки зберігаються у змінних, ми можемо 'конкатенувати змінні', ну, насправді, конкатенувати рядки, які зберігаються у цих змінних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Або ви можете створити нову змінну, використовуючи конкатеноване значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенація з присвоєнням<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли вам потрібно оновити змінну і додати до неї новий рядок, використовуйте наступну форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Замість \n$str = $str ~ $another-str;\n\n# використовуйте:\n$str ~= $another-str;<\/code><\/pre>"]]},"bg":{"t":"Конкатенация на стрингове","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ако имате два низа, можете да ги съедините и да получите нов, по-дълъг низ.<\/span> <span class=\"sg\" data-s=\"1\">Това действие се нарича конкатенация на низове.<\/span> <span class=\"sg\" data-s=\"2\">В Raku, съединявате низове, използвайки—познайте какво?—оператор за конкатенация.<\/span> <span class=\"sg\" data-s=\"3\">Този оператор е тилда: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">За да съедините два низа, поставете <code>~<\/code> между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако нашите низове са съхранени в променливи, можем да 'конкатенираме променливи', всъщност, да конкатенираме низовете, които тези променливи съдържат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или можете да създадете нова променлива, използвайки конкатенираната стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенация с присвояване<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато трябва да актуализирате променливата и да добавите новия низ към нея, използвайте следната форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Вместо \n$str = $str ~ $another-str;\n\n# използвайте:\n$str ~= $another-str;<\/code><\/pre>"]]},"eo":{"t":"Stringa concatenado","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Se vi havas du ĉenojn, vi povas kunigi ilin kaj akiri novan pli longan ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Tiu ago nomiĝas ĉenkonkatenado.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, vi kunigas ĉenojn uzante—domaĝe—konkatenigan operatoron.<\/span> <span class=\"sg\" data-s=\"3\">Tiu operaciilo estas tildo: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Por kunigi du ĉenojn, metu <code>~<\/code> inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se niaj ĉenoj estas konservitaj en variabloj, ni povas 'konkatenigi variablojn', nu, fakte, kunigi la ĉenojn, kiujn tiuj variabloj konservas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aŭ vi povas krei novan variablon uzante la kunigitan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konkatenado kun asigno<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi bezonas ĝisdatigi la variablon kaj aldoni la novan ĉenon al ĝi, uzu la sekvan formon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Anstataŭ \n$str = $str ~ $another-str;\n\n# uzu:\n$str ~= $another-str;<\/code><\/pre>"]]},"la":{"t":"Catena concatenatio","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Si duas habes chordas, eas coniungere potes et novam longiorem chordam obtinere.<\/span> <span class=\"sg\" data-s=\"1\">Haec actio concatenatio chordarum appellatur.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, chordas concatenas utens—quid putas?—concatenationis operatore.<\/span> <span class=\"sg\" data-s=\"3\">Hic operator est tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ad duas chordas concatenandas, pone <code>~<\/code> inter eas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si nostrae chordae in variabilibus continentur, possumus 'variabiles concatenare', bene, re vera, concatenare chordas quas illae variabiles continent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meum $greeting = 'Hello, ';\nmeum $who = 'World!';\n\ndic $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vel potes creare novam variabilem utens valore concatenato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meum $greeting = 'Hello, ';\nmeum $who = 'World!';\nmeum $message = $greeting ~ $who;\n\ndic $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenatio cum assignatione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum variabilem renovare debes et novam chordam ei adiungere, utere hac forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Pro\n$str = $str ~ $another-str;\n\n# utere:\n$str ~= $another-str;<\/code><\/pre>"]]}}}</script>
