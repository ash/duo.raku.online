<script type="application/json" id="page-data">{"u":"essentials/strings/variable-interpolation","n":56,"k":"topic","pv":"essentials/strings/string-concatenation/quiz3","nx":"essentials/strings/variable-interpolation/quiz","tr":["essentials","essentials/strings"],"L":{"en":{"t":"Variable interpolation in Raku strings","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Have you already noticed in the previous sections that sometimes the strings were quoted in single, but sometimes in double quotes?<\/span> <span class=\"sg\" data-s=\"1\">The difference is crucial.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of course, you can use double quotes if you want to put a single quote inside the string with minimum effort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">By the way, it is still better to use a proper apostrophe instead of a single quote as <a href=\"/essentials/on-unicode/\">Raku is good at Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">But the real power of double quotes is their ability to <em>interpolate<\/em> variables and—as we’ll see soon—to execute code!<\/span> <span class=\"sg\" data-s=\"1\">Examine the following program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">As you might expect, the program prints <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The name of the <code>$name<\/code> variable (together with its sigil <code>$<\/code>) was replaced by the value of the variable.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable was interpolated with the value that the variable kept at the moment of interpolation, so if you change the content of <code>$name<\/code> and interpolate it again, the new value will be substituted.<\/span> <span class=\"sg\" data-s=\"1\">Let’s test it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same string generates different messages this time:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"de":{"t":"Variableninterpolation","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Haben Sie in den vorherigen Abschnitten bereits bemerkt, dass die Strings manchmal in einfachen, aber manchmal in doppelten Anführungszeichen gesetzt waren?<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied ist entscheidend.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natürlich können Sie doppelte Anführungszeichen verwenden, wenn Sie mit minimalem Aufwand ein einfaches Anführungszeichen in den String einfügen möchten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Übrigens ist es immer noch besser, ein richtiges Apostroph anstelle eines einfachen Anführungszeichens zu verwenden, da <a href=\"/essentials/on-unicode/\">Raku gut mit Unicode umgehen kann<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aber die wahre Stärke der doppelten Anführungszeichen liegt in ihrer Fähigkeit, Variablen zu <em>interpolieren<\/em> und—wie wir bald sehen werden—Code auszuführen!<\/span> <span class=\"sg\" data-s=\"1\">Betrachten Sie das folgende Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hallo, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie Sie vielleicht erwarten, druckt das Programm <code>Hallo, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Name der Variablen <code>$name<\/code> (zusammen mit ihrem Sigil <code>$<\/code>) wurde durch den Wert der Variablen ersetzt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Variable wurde mit dem Wert interpoliert, den die Variable zum Zeitpunkt der Interpolation hatte.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie also den Inhalt von <code>$name<\/code> ändern und ihn erneut interpolieren, wird der neue Wert ersetzt.<\/span> <span class=\"sg\" data-s=\"2\">Testen wir es:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hallo, $name!\";\n\n$name = 'Anna';\nsay \"Hallo, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diesmal erzeugt derselbe String unterschiedliche Nachrichten:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hallo, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hallo, Anna!<\/span><\/p>"]]},"nl":{"t":"Variabele interpolatie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Heb je in de vorige secties al opgemerkt dat de strings soms tussen enkele aanhalingstekens stonden en soms tussen dubbele aanhalingstekens?<\/span> <span class=\"sg\" data-s=\"1\">Het verschil is cruciaal.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natuurlijk kun je dubbele aanhalingstekens gebruiken als je met minimale inspanning een enkele aanhalingsteken in de string wilt plaatsen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Overigens is het nog steeds beter om een juiste apostrof te gebruiken in plaats van een enkele aanhalingsteken, aangezien <a href=\"/essentials/on-unicode/\">Raku goed is met Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar de echte kracht van dubbele aanhalingstekens is hun vermogen om variabelen te <em>interpoleren<\/em> en—zoals we snel zullen zien—code uit te voeren!<\/span> <span class=\"sg\" data-s=\"1\">Bekijk het volgende programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hallo, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zoals je zou verwachten, print het programma <code>Hallo, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De naam van de <code>$name<\/code> variabele (samen met zijn sigil <code>$<\/code>) werd vervangen door de waarde van de variabele.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele werd geïnterpoleerd met de waarde die de variabele op het moment van interpolatie had, dus als je de inhoud van <code>$name<\/code> verandert en het opnieuw interpoleert, wordt de nieuwe waarde vervangen.<\/span> <span class=\"sg\" data-s=\"1\">Laten we het testen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hallo, $name!\";\n\n$name = 'Anna';\nsay \"Hallo, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dezelfde string genereert deze keer verschillende berichten:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hallo, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hallo, Anna!<\/span><\/p>"]]},"es":{"t":"Interpolación de variables","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Ya has notado en las secciones anteriores que a veces las cadenas estaban entrecomilladas con comillas simples, pero otras veces con comillas dobles?<\/span> <span class=\"sg\" data-s=\"1\">La diferencia es crucial.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por supuesto, puedes usar comillas dobles si deseas poner una comilla simple dentro de la cadena con el mínimo esfuerzo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por cierto, es aún mejor usar un apóstrofe adecuado en lugar de una comilla simple ya que <a href=\"/essentials/on-unicode/\">Raku es bueno con Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero el verdadero poder de las comillas dobles es su capacidad para <em>interpolar<\/em> variables y—como veremos pronto—¡ejecutar código!<\/span> <span class=\"sg\" data-s=\"1\">Examina el siguiente programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como podrías esperar, el programa imprime <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El nombre de la variable <code>$name<\/code> (junto con su sigil <code>$<\/code>) fue reemplazado por el valor de la variable.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable fue interpolada con el valor que la variable tenía en el momento de la interpolación, por lo que si cambias el contenido de <code>$name<\/code> y lo interpolas nuevamente, se sustituirá el nuevo valor.<\/span> <span class=\"sg\" data-s=\"1\">Vamos a probarlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La misma cadena genera diferentes mensajes esta vez:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"it":{"t":"Interpolazione delle variabili","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai già notato nelle sezioni precedenti che a volte le stringhe erano racchiuse tra virgolette singole, ma a volte tra virgolette doppie?<\/span> <span class=\"sg\" data-s=\"1\">La differenza è cruciale.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, puoi usare le virgolette doppie se vuoi inserire una singola virgoletta all'interno della stringa con il minimo sforzo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A proposito, è comunque meglio usare un apostrofo corretto invece di una singola virgoletta poiché <a href=\"/essentials/on-unicode/\">Raku è bravo con Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma il vero potere delle virgolette doppie è la loro capacità di <em>interpolare<\/em> variabili e—come vedremo presto—di eseguire codice!<\/span> <span class=\"sg\" data-s=\"1\">Esamina il seguente programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come ci si potrebbe aspettare, il programma stampa <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il nome della variabile <code>$name<\/code> (insieme al suo sigillo <code>$<\/code>) è stato sostituito dal valore della variabile.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile è stata interpolata con il valore che la variabile aveva al momento dell'interpolazione, quindi se cambi il contenuto di <code>$name<\/code> e lo interpoli di nuovo, il nuovo valore verrà sostituito.<\/span> <span class=\"sg\" data-s=\"1\">Facciamo una prova:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La stessa stringa genera messaggi diversi questa volta:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"lv":{"t":"Mainīgo interpolācija","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai jūs jau pamanījāt iepriekšējās sadaļās, ka dažreiz virknes tika citētas ar vienkāršiem, bet dažreiz ar dubultiem pēdiņām?<\/span> <span class=\"sg\" data-s=\"1\">Atšķirība ir būtiska.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, jūs varat izmantot dubultās pēdiņas, ja vēlaties ievietot vienkāršu pēdiņu virknes iekšpusē ar minimālu piepūli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Starp citu, joprojām ir labāk izmantot pareizu apostrofu, nevis vienkāršu pēdiņu, jo <a href=\"/essentials/on-unicode/\">Raku ir labs ar Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet īstā dubulto pēdiņu spēks ir to spēja <em>interpolēt<\/em> mainīgos un—kā mēs drīz redzēsim—izpildīt kodu!<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet sekojošo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kā jūs varētu gaidīt, programma izdrukā <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgā <code>$name<\/code> nosaukums (kopā ar tā sigilu <code>$<\/code>) tika aizstāts ar mainīgā vērtību.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgais tika interpolēts ar vērtību, kuru mainīgais saturēja interpolācijas brīdī, tāpēc, ja jūs maināt <code>$name<\/code> saturu un interpolējat to vēlreiz, tiks aizstāta jaunā vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Pārbaudīsim to:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šoreiz tā pati virkne ģenerē dažādus ziņojumus:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"ru":{"t":"Интерполяция переменных","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже заметили, что в прошлых главах строки иногда окружены одинарными, а иногда двойными кавычками?<\/span> <span class=\"sg\" data-s=\"1\">Разница очень важна.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно, вы можете использовать двойные кавычки, если вы хотите поставить одинарную кавычку в строку с наименьшим количеством усилий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кстати, использовать настоящий апостроф заместо одинарной кавычки будет гораздо лучше, так как <a href=\"/essentials/on-unicode/\">Raku имеет хорошую поддержку Юникода<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но настоящая сила двойных кавычек заключается в умении интерполировать переменные и, как мы далее увидим, выполнять код!<\/span> <span class=\"sg\" data-s=\"1\">Изучите следующую программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как вы могли ожидать, программа выведет <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Имя переменной <code>$name<\/code> (вместе с сигилом <code>$<\/code>) было заменено значением переменной.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменная была интерполирована со значением, хранившимся в переменной на момент интерполяции, поэтому если вы измените содержимое <code>$name<\/code> и интерполируете его снова, будет подставлено новое значение.<\/span> <span class=\"sg\" data-s=\"1\">Давайте попробуем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Одна и та же строка производит разные сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>Hello, Karl!\nHello, Anna!<\/code><\/pre>"]]},"uk":{"t":"Інтерполяція змінних","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чи помітили ви вже в попередніх розділах, що іноді рядки були взяті в одинарні, а іноді в подвійні лапки?<\/span> <span class=\"sg\" data-s=\"1\">Різниця є суттєвою.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, ви можете використовувати подвійні лапки, якщо хочете вставити одинарну лапку всередину рядка з мінімальними зусиллями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">До речі, все ж краще використовувати правильний апостроф замість одинарної лапки, оскільки <a href=\"/essentials/on-unicode/\">Raku добре працює з Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але справжня сила подвійних лапок полягає в їх здатності <em>інтерполювати<\/em> змінні і—як ми скоро побачимо—виконувати код!<\/span> <span class=\"sg\" data-s=\"1\">Розглянемо наступну програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як ви могли очікувати, програма виводить <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ім'я змінної <code>$name<\/code> (разом з її сигілом <code>$<\/code>) було замінено на значення змінної.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінна була інтерпольована зі значенням, яке змінна мала на момент інтерполяції, тому якщо ви зміните вміст <code>$name<\/code> і знову інтерполюєте його, буде підставлено нове значення.<\/span> <span class=\"sg\" data-s=\"1\">Давайте перевіримо це:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Той самий рядок генерує різні повідомлення цього разу:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"bg":{"t":"Променлива интерполация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Забелязахте ли вече в предишните раздели, че понякога низовете бяха оградени в единични, а понякога в двойни кавички?<\/span> <span class=\"sg\" data-s=\"1\">Разликата е съществена.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, можете да използвате двойни кавички, ако искате да поставите единична кавичка вътре в низа с минимални усилия:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Между другото, все пак е по-добре да използвате правилния апостроф вместо единична кавичка, тъй като <a href=\"/essentials/on-unicode/\">Raku е добър с Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но истинската сила на двойните кавички е тяхната способност да <em>интерполират<\/em> променливи и—както ще видим скоро—да изпълняват код!<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте следната програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както може да очаквате, програмата отпечатва <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Името на променливата <code>$name<\/code> (заедно с нейния символ <code>$<\/code>) беше заменено със стойността на променливата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата беше интерполирана със стойността, която променливата съдържаше в момента на интерполация, така че ако промените съдържанието на <code>$name<\/code> и я интерполирате отново, новата стойност ще бъде заместена.<\/span> <span class=\"sg\" data-s=\"1\">Нека го тестваме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същият низ генерира различни съобщения този път:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"eo":{"t":"Variabla interpolado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi jam rimarkis en la antaŭaj sekcioj, ke kelkfoje la ŝnuroj estis cititaj en unuopaj, sed kelkfoje en duoblaj citiloj?<\/span> <span class=\"sg\" data-s=\"1\">La diferenco estas esenca.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, vi povas uzi duoblajn citilojn se vi volas meti unuopan citilon ene de la ŝnuro kun minimuma peno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cetere, estas ankoraŭ pli bone uzi ĝustan apostrofon anstataŭ unuopan citilon ĉar <a href=\"/essentials/on-unicode/\">Raku estas bona pri Unikodo<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed la vera potenco de duoblaj citiloj estas ilia kapablo <em>interpoli<\/em> variablojn kaj—kiel ni baldaŭ vidos—ekzekuti kodon!<\/span> <span class=\"sg\" data-s=\"1\">Ekzamenigu la sekvan programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel vi eble atendis, la programo presas <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La nomo de la variablo <code>$name<\/code> (kune kun ĝia sigelo <code>$<\/code>) estis anstataŭigita per la valoro de la variablo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variablo estis interpolita kun la valoro, kiun la variablo havis en la momento de interpolado, do se vi ŝanĝas la enhavon de <code>$name<\/code> kaj interpolas ĝin denove, la nova valoro estos anstataŭigita.<\/span> <span class=\"sg\" data-s=\"1\">Ni testu ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sama ŝnuro generas malsamajn mesaĝojn ĉi-foje:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"la":{"t":"Variabile interpolatio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Iamne animadvertisti in sectionibus praecedentibus quod interdum stringae in singulis, interdum in duplicibus quotationibus citatae sunt?<\/span> <span class=\"sg\" data-s=\"1\">Differentia est crucialis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scilicet, duplices quotationes uti potes si vis singulam quotationem intra stringam ponere cum minimo labore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ceterum, melius est uti apostropho proprio loco singulae quotationis quia <a href=\"/essentials/on-unicode/\">Raku bonum est in Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed vera potentia duplicium quotationum est eorum facultas <em>interpolandi<\/em> variabiles et—ut mox videbimus—codicem exsequendi!<\/span> <span class=\"sg\" data-s=\"1\">Examina sequens programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $nomen = 'Karl';\nsay \"Salve, $nomen!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut exspectare potes, programma imprimit <code>Salve, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nomen variabilis <code>$nomen<\/code> (una cum suo sigillo <code>$<\/code>) substitutum est valore variabilis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis interpolata est cum valore quem variabilis tenebat momento interpolationis, ita si contentum <code>$nomen<\/code> mutas et iterum interpolas, novus valor substituetur.<\/span> <span class=\"sg\" data-s=\"1\">Experiamur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $nomen = 'Karl';\nsay \"Salve, $nomen!\";\n\n$nomen = 'Anna';\nsay \"Salve, $nomen!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eadem stringa hoc tempore diversas nuntios generat:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salve, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Salve, Anna!<\/span><\/p>"]]}}}</script>
