ings, where the value of <code>$x<\/code> is interpolated exactly one time.<\/span><\/p>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">&quot;The temperature is $x degrees&quot;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">&apos;Air pressure is $x mmHg&apos;<span class=\"quiz-note\">Nulla interpolatio in singulis quotationibus.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">&apos;The value of \\\\$x is $x&apos;<span class=\"quiz-note\">Nulla interpolatio et nulla evasio. Imprimit <code>The value of \\$x is $x<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">&quot;The value of \\\\$x is $x&quot;<span class=\"quiz-note\">Tota locutio dat, exempli gratia, <code>The value of $x is 42<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">&quot;The value of $x is $x&quot;<span class=\"quiz-note\"><code>$x<\/code> bis interpolatur hic.<\/span><\/span><\/li><\/ul>"]]}}}</script>
