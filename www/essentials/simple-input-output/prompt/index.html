 con <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">L'opposto di <code>say<\/code> è <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Attende quando l'utente inserisce qualcosa e preme Invio.<\/span> <span class=\"sg\" data-s=\"2\">Poi, invia l'input al programma come una stringa.<\/span> <span class=\"sg\" data-s=\"3\">Puoi prendere il risultato di <code>prompt<\/code> e passarlo a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">In questo caso, ripeti ciò che l'utente digita.<\/span> <span class=\"sg\" data-s=\"5\">Creiamo un programma del genere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se esegui questo programma, potresti essere confuso poiché il programma entra in uno stato in cui attende solo un input.<\/span> <span class=\"sg\" data-s=\"1\">Per rendere il programma più user-friendly, è bene stampare il messaggio di prompt.<\/span> <span class=\"sg\" data-s=\"2\">Non è necessario aggiungere un <code>say<\/code> separato, perché puoi passare il messaggio a <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Quale lingua hai intenzione di imparare? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prima di concludere questa sezione, combiniamo tutti i pezzi e creiamo un programma che chiede i desideri dell'utente e poi stampa una frase usando il testo che l'utente ha inserito.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hai intenzione di imparare ', prompt 'Quale lingua hai intenzione di imparare? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se hai inserito <code>Raku<\/code>, otterrai la seguente frase stampata:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai intenzione di imparare Raku<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ok, ora possiamo parlare con il programma, e possiamo fare in modo che il programma parli con noi!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che poiché <code>say<\/code> deve conoscere le stringhe prima di stamparle, Raku eseguirà prima <code>prompt<\/code>, in modo che il dialogo avvenga nell'ordine corretto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nQuale lingua hai intenzione di imparare? Raku\nHai intenzione di imparare Raku<\/code><\/pre>"]]},"lv":{"t":"Ievade ar <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Pretstats <code>say<\/code> ir <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas gaida, kad lietotājs kaut ko ievada un nospiež Enter.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam tas nosūta ievadi programmai kā virkni.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat ņemt <code>prompt<\/code> rezultātu un nodot to <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Šajā gadījumā jūs atkārtojat to, ko lietotājs ievada.<\/span> <span class=\"sg\" data-s=\"5\">Izveidosim šādu programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja jūs palaidīsiet šo programmu, jūs varat būt apjucis, jo programma nonāk stāvoklī, kurā tā tikai gaida jebkādu ievadi.<\/span> <span class=\"sg\" data-s=\"1\">Lai padarītu programmu lietotājam draudzīgāku, ir labi izdrukāt uzvednes ziņojumu.<\/span> <span class=\"sg\" data-s=\"2\">Jums nav nepieciešams pievienot atsevišķu <code>say<\/code>, jo jūs varat nodot ziņojumu <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Kādu valodu jūs plānojat mācīties? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pirms noslēgt šo sadaļu, apvienosim visas daļas un izveidosim programmu, kas jautā par lietotāja vēlmēm un pēc tam izdrukā frāzi, izmantojot tekstu, ko lietotājs ievadījis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Jūs plānojat mācīties ', prompt 'Kādu valodu jūs plānojat mācīties? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jūs ievadījāt <code>Raku<\/code>, jūs saņemsiet šādu frāzi:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs plānojat mācīties Raku<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Labi, mēs tagad varam sarunāties ar programmu, un mēs varam likt programmai sarunāties ar mums!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka tā kā <code>say<\/code> ir jāzina virknes pirms to izdrukāšanas, Raku vispirms izpildīs <code>prompt<\/code>, tāpēc dialogs notiek pareizā secībā:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nKādu valodu jūs plānojat mācīties? Raku\nJūs plānojat mācīties Raku<\/code><\/pre>"]]},"ru":{"t":"Ввод с использованием <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Противоположным для <code>say<\/code> является <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он ждет, пока пользователь что-нибудь введет и нажмет Enter.<\/span> <span class=\"sg\" data-s=\"2\">После этого он пошлет этот ввод в программу в виде строки.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете взять результат <code>prompt<\/code> и отправить его в <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">В этом случае вы выводите обратно то, что пользователь печатает.<\/span> <span class=\"sg\" data-s=\"5\">Давайте создадим такую программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если вы запустите эту программу, вы можете быть в замешательстве, так как программа перейдет в состояние, в котором она ожидает ввода.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы сделать программу более дружелюбной, хорошим способом будет напечатать сообщение.<\/span> <span class=\"sg\" data-s=\"2\">Вам не нужно добавлять отдельный вызов <code>say<\/code>, потому что вы можете отправить это сообщение в <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'What language are you going to learn? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">До того, как мы закончим эту главу, давайте попробуем собрать все части воедино и сотворить программу, которая спрашивает о пожеланиях пользователя и после этого напечатает фразу, используя текст, введенный пользователем.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'You are going to learn ', prompt 'What language are you going to learn? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы ввели <code>Raku<\/code>, вы увидите следующую фразу:<\/span><\/p>"],["code",0,"<pre><code>You are going to learn Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отлично, теперь мы можем говорить с программой, и мы можем заставить программу говорить с нами!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что так как функции <code>say<\/code> требуется знать строку перед тем, как ее напечатать, Raku в первую очередь выполнит <code>prompt<\/code>, поэтому следующий диалог будет идти в правильном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nWhat language are you going to learn? Raku\nYou are going to learn Raku<\/code><\/pre>"]]},"uk":{"t":"Ввід з <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Протилежністю до <code>say<\/code> є <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він чекає, коли користувач введе щось і натисне Enter.<\/span> <span class=\"sg\" data-s=\"2\">Потім він передає введені дані програмі у вигляді рядка.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете взяти результат <code>prompt<\/code> і передати його до <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">У цьому випадку ви відтворюєте те, що ввів користувач.<\/span> <span class=\"sg\" data-s=\"5\">Давайте створимо таку програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо ви запустите цю програму, ви можете бути здивовані, оскільки програма перейде в стан очікування будь-якого введення.<\/span> <span class=\"sg\" data-s=\"1\">Щоб зробити програму більш дружньою до користувача, добре надрукувати повідомлення підказки.<\/span> <span class=\"sg\" data-s=\"2\">Вам не потрібно додавати окремий <code>say<\/code>, тому що ви можете передати повідомлення до <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Яку мову ви збираєтеся вивчати? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перш ніж завершити цей розділ, давайте об'єднаємо всі частини і створимо програму, яка запитує про бажання користувача, а потім друкує фразу, використовуючи текст, введений користувачем.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Ви збираєтеся вивчати ', prompt 'Яку мову ви збираєтеся вивчати? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви ввели <code>Raku<\/code>, ви отримаєте наступну фразу:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви збираєтеся вивчати Raku<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Добре, тепер ми можемо спілкуватися з програмою, і ми можемо зробити так, щоб програма спілкувалася з нами!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що оскільки <code>say<\/code> потрібно знати рядки перед їх друком, Raku спочатку виконає <code>prompt<\/code>, тому діалог відбувається в правильному порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nЯку мову ви збираєтеся вивчати? Raku\nВи збираєтеся вивчати Raku<\/code><\/pre>"]]},"bg":{"t":"Въвеждане с <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Обратното на <code>say<\/code> е <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То изчаква, докато потребителят въведе нещо и натисне Enter.<\/span> <span class=\"sg\" data-s=\"2\">След това изпраща входа към програмата като низ.<\/span> <span class=\"sg\" data-s=\"3\">Можете да вземете резултата от <code>prompt<\/code> и да го предадете на <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">В този случай, вие повтаряте това, което потребителят е написал.<\/span> <span class=\"sg\" data-s=\"5\">Нека създадем такава програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако изпълните тази програма, може да се объркате, тъй като програмата влиза в състояние, в което само изчаква някакъв вход.<\/span> <span class=\"sg\" data-s=\"1\">За да направите програмата по-удобна за потребителя, е добре да отпечатате съобщението за подкана.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно да добавяте отделно <code>say<\/code>, защото можете да предадете съобщението на <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Какъв език ще учите? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Преди да завършим този раздел, нека комбинираме всички части и създадем програма, която пита за желанията на потребителя и след това отпечатва фраза, използвайки текста, който потребителят е въвел.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Ще учите ', prompt 'Какъв език ще учите? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако въведете <code>Raku<\/code>, ще получите следната фраза:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще учите Raku<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Добре, сега можем да говорим с програмата и можем да накараме програмата да говори с нас!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че тъй като <code>say<\/code> трябва да знае низовете преди да ги отпечата, Raku първо ще изпълни <code>prompt<\/code>, така че диалогът да върви в правилния ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nКакъв език ще учите? Raku\nЩе учите Raku<\/code><\/pre>"]]},"eo":{"t":"Enigo per <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La malo de <code>say<\/code> estas <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi atendas kiam la uzanto enigas ion kaj premas Enter.<\/span> <span class=\"sg\" data-s=\"2\">Poste, ĝi sendas la enigon al la programo kiel ĉenon.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas preni la rezulton de <code>prompt<\/code> kaj transdoni ĝin al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">En tiu kazo, vi eĥas tion, kion la uzanto tajpas.<\/span> <span class=\"sg\" data-s=\"5\">Ni kreu tian programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se vi rulas ĉi tiun programon, vi eble konfuziĝos ĉar la programo eniras staton, en kiu ĝi nur atendas iun ajn enigon.<\/span> <span class=\"sg\" data-s=\"1\">Por fari la programon pli uzant-amika, estas bone presi la promptan mesaĝon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne bezonas aldoni apartan <code>say<\/code>, ĉar vi povas transdoni la mesaĝon al <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Kiun lingvon vi intencas lerni? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol fini ĉi tiun sekcion, ni kombinu ĉiujn partojn kaj kreu programon, kiu demandas pri la deziroj de la uzanto kaj poste presas frazon uzante la tekston, kiun la uzanto enigis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Vi intencas lerni ', prompt 'Kiun lingvon vi intencas lerni? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi enigis <code>Raku<\/code>, vi ricevas la jenan frazon presitan:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi intencas lerni Raku<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bone, ni nun povas paroli al la programo, kaj ni povas fari la programon paroli al ni!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu ke ĉar <code>say<\/code> bezonas koni la ĉenojn antaŭ ol presi ilin, Raku unue ekzekutos <code>prompt<\/code>, do la dialogo iras en la ĝusta ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nKiun lingvon vi intencas lerni? Raku\nVi intencas lerni Raku<\/code><\/pre>"]]},"la":{"t":"Initus cum <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Contrarium verbi <code>say<\/code> est <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exspectat cum usor aliquid inserit et premit Enter.<\/span> <span class=\"sg\" data-s=\"2\">Deinde, mittit input ad programmatum ut stringam.<\/span> <span class=\"sg\" data-s=\"3\">Potes capere resultatum <code>prompt<\/code> et tradere ad <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">In hoc casu, resonas quod usor typat.<\/span> <span class=\"sg\" data-s=\"5\">Creemus tale programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si hoc programma curris, confundi potes cum programma in statum intrat, in quo solum exspectat aliquod input.<\/span> <span class=\"sg\" data-s=\"1\">Ut programma magis usori-amica fiat, bonum est nuntium rogationis imprimere.<\/span> <span class=\"sg\" data-s=\"2\">Non opus est addere separatam <code>say<\/code>, quia potes tradere nuntium ad <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Quam linguam discere vis? '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Antequam hanc sectionem concludamus, omnes partes componamus et creamus programma quod rogat de votis usoris et deinde imprimit locutionem utens textu quem usor inseruit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Discere vis ', prompt 'Quam linguam discere vis? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si inseruisti <code>Raku<\/code>, sequens locutio imprimitur:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Discere vis Raku<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bene, nunc possumus loqui cum programmate, et programma potest loqui nobiscum!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod cum <code>say<\/code> scire debet stringas antequam eas imprimat, Raku primum exsequetur <code>prompt<\/code>, ut colloquium in ordine correcto procedat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nQuam linguam discere vis? Raku\nDiscere vis Raku<\/code><\/pre>"]]}}}</script>
