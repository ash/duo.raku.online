class=\"sg\" data-s=\"1\">Und Sie sollten in der Lage sein, dieses Problem jetzt zu lösen, zum Beispiel so:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nach dem Drucken aller Argumente fügt die <code>say<\/code>-Routine ein Zeilenumbruchzeichen zur Ausgabe hinzu.<\/span><\/p>"]]},"nl":{"t":"Uitvoer met <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>say<\/code> functie (of een subroutine, of simpelweg routine) print de waarden naar de standaard uitvoerstream, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Als je het programma vanuit een terminal uitvoert, verschijnt de uitvoer daar.<\/span> <span class=\"sg\" data-s=\"2\">Als je online diensten gebruikt, wordt de uitvoer naar een speciaal gebied van de webpagina gestuurd.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld van het gebruik van <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze regel kan ofwel een deel van een groter programma zijn of het hele programma zelf.<\/span> <span class=\"sg\" data-s=\"1\">Het print duidelijk <code>42<\/code> naar de uitvoer.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we nu met strings werken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, we hebben <code>Hello, World!<\/code> op het scherm.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>say<\/code> routine kan meer dan één argument accepteren, dus we kunnen meer waarden in één keer printen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Let er wel op dat de delen van deze uitvoer worden samengevoegd tot een enkele string: <code>42Hello, World!<\/code>, dus het is beter om een spatie tussen hen toe te voegen.<\/span> <span class=\"sg\" data-s=\"1\">En je zou dit probleem nu moeten kunnen oplossen, bijvoorbeeld, zo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Na het printen van alle argumenten, voegt de <code>say<\/code> routine een nieuwe regelkarakter toe aan de uitvoer.<\/span><\/p>"]]},"es":{"t":"Salida con <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La función <code>say<\/code> (o una subrutina, o simplemente rutina) imprime los valores en el flujo de salida estándar, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si estás ejecutando el programa desde una terminal, la salida aparecerá allí.<\/span> <span class=\"sg\" data-s=\"2\">Si estás utilizando servicios en línea, la salida se envía a un área dedicada de la página web.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay un ejemplo de uso de <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta línea puede ser parte de un programa más grande o ser el programa completo en sí.<\/span> <span class=\"sg\" data-s=\"1\">Obviamente, imprime <code>42<\/code> en la salida.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Trabajemos ahora con cadenas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, obtuvimos <code>Hello, World!<\/code> en la pantalla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>say<\/code> puede aceptar más de un argumento, por lo que podemos imprimir más valores de una vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Solo nota que las partes de esta salida se concatenan en una sola cadena: <code>42Hello, World!<\/code>, por lo que es mejor agregar un espacio entre ellas.<\/span> <span class=\"sg\" data-s=\"1\">Y deberías poder resolver este problema ahora, por ejemplo, así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Después de imprimir todos los argumentos, la rutina <code>say<\/code> agrega un carácter de nueva línea a la salida.<\/span><\/p>"]]},"it":{"t":"Output con <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>say<\/code> (o una subroutine, o semplicemente routine) stampa i valori sul flusso di output standard, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se stai eseguendo il programma da un terminale, l'output appare lì.<\/span> <span class=\"sg\" data-s=\"2\">Se stai utilizzando servizi online, l'output viene inviato a un'area dedicata della pagina web.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio di utilizzo di <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa linea può essere parte di un programma più grande o essere l'intero programma stesso.<\/span> <span class=\"sg\" data-s=\"1\">Ovviamente stampa <code>42<\/code> sull'output.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lavoriamo ora con le stringhe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, abbiamo ottenuto <code>Hello, World!<\/code> sullo schermo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>say<\/code> può accettare più di un argomento, quindi possiamo stampare più valori in una volta sola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota solo che le parti di questo output sono concatenate in una singola stringa: <code>42Hello, World!<\/code>, quindi è meglio aggiungere uno spazio tra di esse.<\/span> <span class=\"sg\" data-s=\"1\">E dovresti essere in grado di risolvere questo problema ormai, ad esempio, in questo modo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo aver stampato tutti gli argomenti, la routine <code>say<\/code> aggiunge un carattere di nuova linea all'output.<\/span><\/p>"]]},"lv":{"t":"Izvade ar <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>say<\/code> (vai apakšprogramma, vai vienkārši programma) izdrukā vērtības uz standarta izvades straumi, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs palaidat programmu no termināļa, izvade parādās tur.<\/span> <span class=\"sg\" data-s=\"2\">Ja izmantojat tiešsaistes pakalpojumus, izvade tiek nosūtīta uz īpašu tīmekļa lapas apgabalu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir piemērs, kā izmantot <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī rinda var būt daļa no lielākas programmas vai būt visa programma pati par sevi.<\/span> <span class=\"sg\" data-s=\"1\">Tā acīmredzami izdrukā <code>42<\/code> uz izvades.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad strādāsim ar virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, mēs redzam <code>Hello, World!<\/code> uz ekrāna.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>say<\/code> var pieņemt vairāk nekā vienu argumentu, tāpēc mēs varam izdrukāt vairākas vērtības vienā reizē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienkārši ņemiet vērā, ka šīs izvades daļas tiek apvienotas vienā virknē: <code>42Hello, World!<\/code>, tāpēc labāk ir pievienot atstarpi starp tām.<\/span> <span class=\"sg\" data-s=\"1\">Un jums vajadzētu būt iespējai atrisināt šo problēmu, piemēram, šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc visu argumentu izdrukāšanas funkcija <code>say<\/code> pievieno jaunas rindas rakstzīmi izvadei.<\/span><\/p>"]]},"ru":{"t":"Вывод с использованием <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Функция <code>say<\/code> (или подпрограмма, или просто программа) печатает значения в стандартный поток вывода — <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если вы запускаете программу из терминала, там же будет и вывод.<\/span> <span class=\"sg\" data-s=\"2\">Если вы используете онлайн сервисы, вывод будет в обозначенной для этого части страницы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример использования <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта строка может быть как частью большей программы, так и полностью являться программой.<\/span> <span class=\"sg\" data-s=\"1\">Очевидно, она напечатает <code>42<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь давайте попробуем поработать со строками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, мы получили <code>Hello, World!<\/code> на нашем экране.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>say<\/code> может принимать больше, чем один аргумент, мы можем вывести больше значений за один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отметьте, что части этого вывода соединены в одну строку: <code>42Hello, World!<\/code>, поэтому лучше между ними добавить пробелы.<\/span> <span class=\"sg\" data-s=\"1\">И на данный момент вы уже должны быть способы решить эту проблему, например, таким образом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После вывода всех аргументов подпрограмма <code>say<\/code> добавит символ новой строки в конец вывода.<\/span><\/p>"]]},"uk":{"t":"Вивід з <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Функція <code>say<\/code> (або підпрограма, або просто рутина) виводить значення на стандартний потік виводу, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви запускаєте програму з терміналу, вивід з'являється там.<\/span> <span class=\"sg\" data-s=\"2\">Якщо ви використовуєте онлайн-сервіси, вивід надсилається в спеціальну область веб-сторінки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад використання <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей рядок може бути частиною більшої програми або бути всією програмою сам по собі.<\/span> <span class=\"sg\" data-s=\"1\">Очевидно, що він виводить <code>42<\/code> на екран.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Працюємо зі рядками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, ми отримали <code>Hello, World!<\/code> на екрані.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рутина <code>say<\/code> може приймати більше одного аргументу, тому ми можемо виводити більше значень за один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що частини цього виводу об'єднуються в один рядок: <code>42Hello, World!<\/code>, тому краще додати пробіл між ними.<\/span> <span class=\"sg\" data-s=\"1\">І ви вже повинні вміти вирішити цю проблему, наприклад, ось так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після виведення всіх аргументів, рутина <code>say<\/code> додає символ нового рядка до виводу.<\/span><\/p>"]]},"bg":{"t":"Извеждане с <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>say<\/code> (или подпрограма, или просто рутина) отпечатва стойностите на стандартния изходен поток, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако изпълнявате програмата от терминал, изходът се появява там.<\/span> <span class=\"sg\" data-s=\"2\">Ако използвате онлайн услуги, изходът се изпраща в специална област на уеб страницата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример за използване на <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този ред може да бъде част от по-голяма програма или да бъде цялата програма сама по себе си.<\/span> <span class=\"sg\" data-s=\"1\">Очевидно е, че отпечатва <code>42<\/code> на изхода.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека сега работим със стрингове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, получихме <code>Hello, World!<\/code> на екрана.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рутината <code>say<\/code> може да приеме повече от един аргумент, така че можем да отпечатаме повече стойности наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Просто отбележете, че частите от този изход се конкатенират в един стринг: <code>42Hello, World!<\/code>, така че е по-добре да добавите интервал между тях.<\/span> <span class=\"sg\" data-s=\"1\">И трябва да можете да решите този проблем вече, например, по този начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След отпечатването на всички аргументи, рутината <code>say<\/code> добавя нов ред към изхода.<\/span><\/p>"]]},"eo":{"t":"Eligo per <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>say<\/code> (aŭ subrutino, aŭ simple rutino) presas la valorojn al la norma eliga fluo, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se vi rulas la programon el terminalo, la eligo aperas tie.<\/span> <span class=\"sg\" data-s=\"2\">Se vi uzas retajn servojn, la eligo estas sendita al dediĉita areo de la retpaĝo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo de uzado de <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu linio povas esti parto de pli granda programo aŭ esti la tuta programo mem.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi evidente presas <code>42<\/code> al la eligo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni laboru kun ŝnuroj nun:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voilà, ni ricevis <code>Hello, World!<\/code> sur la ekrano.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>say<\/code> povas akcepti pli ol unu argumenton, do ni povas presi pli da valoroj en unu fojo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nur notu, ke la partoj de ĉi tiu eligo estas kunigitaj al unu sola ŝnuro: <code>42Hello, World!<\/code>, do estas pli bone aldoni spacon inter ili.<\/span> <span class=\"sg\" data-s=\"1\">Kaj vi devus povi solvi ĉi tiun problemon nun, ekzemple, tiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post presado de ĉiuj argumentoj, la rutino <code>say<\/code> aldonas novlinian signon al la eligo.<\/span><\/p>"]]},"la":{"t":"Output cum <code>say<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Functio <code>say<\/code> (vel subrutina, vel simpliciter rutina) valores ad fluxum output standardum, <code>STDOUT<\/code>, imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Si programma e terminali curris, output ibi apparet.<\/span> <span class=\"sg\" data-s=\"2\">Si officia online uteris, output ad aream dedicatam paginae interretialis mittitur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum utendi <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec linea potest esse pars maioris programmatis vel totum programma ipsum.<\/span> <span class=\"sg\" data-s=\"1\">Manifestum est quod <code>42<\/code> ad output imprimit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc cum stringis laboramus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Salve, Munde!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce, habemus <code>Salve, Munde!<\/code> in scrinio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutina <code>say<\/code> plus quam unum argumentum accipere potest, ita plures valores simul imprimere possumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Salve, Munde!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota tantum quod partes huius outputis ad unam stringam concatenantur: <code>42Salve, Munde!<\/code>, ita melius est spatium inter eos addere.<\/span> <span class=\"sg\" data-s=\"1\">Et hanc quaestionem solvere iam potes, exempli gratia, hoc modo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Salve, Munde!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Postquam omnia argumenta imprimit, rutina <code>say<\/code> characterem novae lineae ad output addit.<\/span><\/p>"]]}}}</script>
