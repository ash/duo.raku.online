<script type="application/json" id="page-data">{"u":"essentials/simple-input-output","n":21,"k":"section","pv":"essentials/running-programs/exercises/hello-me/solution","nx":"essentials/simple-input-output/say","tr":["essentials"],"L":{"en":{"t":"Simple input and output in Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">This course will move through the Raku language from the very basics to more and more advanced topics.<\/span> <span class=\"sg\" data-s=\"1\">But even the simplest programs require some input and output.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Before we learn what is what in Raku, let us introduce a couple of basic elements that print and read data.<\/span> <span class=\"sg\" data-s=\"1\">We will explore the built-in functions later in the course, but here are the two most important of them at this point.<\/span><\/p>"]]},"de":{"t":"Einfache Eingabe und Ausgabe","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Kurs wird die Raku-Sprache von den Grundlagen bis hin zu immer fortgeschritteneren Themen behandeln.<\/span> <span class=\"sg\" data-s=\"1\">Aber selbst die einfachsten Programme erfordern einige Eingaben und Ausgaben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bevor wir lernen, was was in Raku ist, lassen Sie uns ein paar grundlegende Elemente vorstellen, die Daten drucken und lesen.<\/span> <span class=\"sg\" data-s=\"1\">Wir werden die eingebauten Funktionen später im Kurs erkunden, aber hier sind die beiden wichtigsten von ihnen zu diesem Zeitpunkt.<\/span><\/p>"]]},"nl":{"t":"Eenvoudige invoer en uitvoer","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze cursus zal de Raku-taal behandelen van de basis tot steeds meer geavanceerde onderwerpen.<\/span> <span class=\"sg\" data-s=\"1\">Maar zelfs de eenvoudigste programma's vereisen enige invoer en uitvoer.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voordat we leren wat wat is in Raku, laten we een paar basiselementen introduceren
