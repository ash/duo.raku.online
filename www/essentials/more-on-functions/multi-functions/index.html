<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/multi-functions","n":302,"k":"topic","pv":"essentials/more-on-functions/return-type/quiz","nx":"essentials/more-on-functions/multi-functions/quiz1","tr":["essentials","essentials/more-on-functions"],"L":{"en":{"t":"Multi-functions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku implements <em>multiple dispatch<\/em> based on function signature.<\/span> <span class=\"sg\" data-s=\"1\">It allows creating functions that share the name but have different types of input data.<\/span> <span class=\"sg\" data-s=\"2\">Use the <code>multi<\/code> declarator for each of the variants of the function.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(It is fine to omit <code>sub<\/code> after <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you have the two variants of the same function, the compiler performs multiple dispatch depending on which arguments it sees in the function call.<\/span> <span class=\"sg\" data-s=\"1\">Compare the following two calls:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The first call triggers the function with integer parameters, while the second call runs the second variant of the function that expects two strings.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literal parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An interesting case for multi-functions is to have variants that have literal values as parameters.<\/span> <span class=\"sg\" data-s=\"1\">Consider the following two variants:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'This is the answer'}\nmulti sub f($x) {say \"$x is not the answer\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The first variant is only run when you call the function with the exact value of 42.<\/span> <span class=\"sg\" data-s=\"1\">In other cases, the second variant is used.<\/span> <span class=\"sg\" data-s=\"2\">The order in which these functions are defined does not matter.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 is not the answer\nf(42); # This is the answer<\/code><\/pre>"]]},"de":{"t":"Multi-Funktionen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku implementiert <em>Multiple Dispatch<\/em> basierend auf der Funktionssignatur.<\/span> <span class=\"sg\" data-s=\"1\">Es erlaubt das Erstellen von Funktionen, die denselben Namen teilen, aber unterschiedliche Typen von Eingabedaten haben.<\/span> <span class=\"sg\" data-s=\"2\">Verwenden Sie den <code>multi<\/code> Deklarator für jede der Varianten der Funktion.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Es ist in Ordnung, <code>sub<\/code> nach <code>multi<\/code> wegzulassen.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie zwei Varianten derselben Funktion haben, führt der Compiler Multiple Dispatch durch, je nachdem, welche Argumente er im Funktionsaufruf sieht.<\/span> <span class=\"sg\" data-s=\"1\">Vergleichen Sie die folgenden zwei Aufrufe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der erste Aufruf löst die Funktion mit ganzzahligen Parametern aus, während der zweite Aufruf die zweite Variante der Funktion ausführt, die zwei Zeichenketten erwartet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literale Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein interessanter Fall für Multi-Funktionen ist es, Varianten zu haben, die literale Werte als Parameter haben.<\/span> <span class=\"sg\" data-s=\"1\">Betrachten Sie die folgenden zwei Varianten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Das ist die Antwort'}\nmulti sub f($x) {say \"$x ist nicht die Antwort\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die erste Variante wird nur ausgeführt, wenn Sie die Funktion mit dem genauen Wert 42 aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">In anderen Fällen wird die zweite Variante verwendet.<\/span> <span class=\"sg\" data-s=\"2\">Die Reihenfolge, in der diese Funktionen definiert sind, spielt keine Rolle.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 ist nicht die Antwort\nf(42); # Das ist die Antwort<\/code><\/pre>"]]},"nl":{"t":"Multi-functies","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku implementeert <em>meervoudige dispatch<\/em> op basis van functiesignatuur.<\/span> <span class=\"sg\" data-s=\"1\">Het stelt je in staat om functies te creëren die dezelfde naam delen maar verschillende soorten invoergegevens hebben.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik de <code>multi<\/code> declarator voor elk van de varianten van de functie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Het is prima om <code>sub<\/code> weg te laten na <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je twee varianten van dezelfde functie hebt, voert de compiler meervoudige dispatch uit afhankelijk van welke argumenten hij ziet in de functieaanroep.<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk de volgende twee aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De eerste aanroep activeert de functie met integer parameters, terwijl de tweede aanroep de tweede variant van de functie uitvoert die twee strings verwacht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Letterlijke parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een interessant geval voor multi-functies is om varianten te hebben die letterlijke waarden als parameters hebben.<\/span> <span class=\"sg\" data-s=\"1\">Overweeg de volgende twee varianten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Dit is het antwoord'}\nmulti sub f($x) {say \"$x is niet het antwoord\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De eerste variant wordt alleen uitgevoerd wanneer je de functie aanroept met de exacte waarde van 42.<\/span> <span class=\"sg\" data-s=\"1\">In andere gevallen wordt de tweede variant gebruikt.<\/span> <span class=\"sg\" data-s=\"2\">De volgorde waarin deze functies zijn gedefinieerd maakt niet uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 is niet het antwoord\nf(42); # Dit is het antwoord<\/code><\/pre>"]]},"es":{"t":"Multi-funciones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku implementa <em>despacho múltiple<\/em> basado en la firma de la función.<\/span> <span class=\"sg\" data-s=\"1\">Permite crear funciones que comparten el nombre pero tienen diferentes tipos de datos de entrada.<\/span> <span class=\"sg\" data-s=\"2\">Usa el declarador <code>multi<\/code> para cada una de las variantes de la función.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Está bien omitir <code>sub<\/code> después de <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si tienes dos variantes de la misma función, el compilador realiza un despacho múltiple dependiendo de los argumentos que vea en la llamada a la función.<\/span> <span class=\"sg\" data-s=\"1\">Compara las siguientes dos llamadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La primera llamada activa la función con parámetros enteros, mientras que la segunda llamada ejecuta la segunda variante de la función que espera dos cadenas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros literales<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un caso interesante para las multi-funciones es tener variantes que tienen valores literales como parámetros.<\/span> <span class=\"sg\" data-s=\"1\">Considera las siguientes dos variantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Esta es la respuesta'}\nmulti sub f($x) {say \"$x no es la respuesta\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La primera variante solo se ejecuta cuando llamas a la función con el valor exacto de 42.<\/span> <span class=\"sg\" data-s=\"1\">En otros casos, se usa la segunda variante.<\/span> <span class=\"sg\" data-s=\"2\">El orden en el que se definen estas funciones no importa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 no es la respuesta\nf(42); # Esta es la respuesta<\/code><\/pre>"]]},"it":{"t":"Multi-funzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku implementa <em>multiple dispatch<\/em> basato sulla firma della funzione.<\/span> <span class=\"sg\" data-s=\"1\">Permette di creare funzioni che condividono lo stesso nome ma hanno tipi di dati di input differenti.<\/span> <span class=\"sg\" data-s=\"2\">Usa il dichiaratore <code>multi<\/code> per ciascuna delle varianti della funzione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(È possibile omettere <code>sub<\/code> dopo <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se hai due varianti della stessa funzione, il compilatore esegue il multiple dispatch a seconda degli argomenti che vede nella chiamata della funzione.<\/span> <span class=\"sg\" data-s=\"1\">Confronta le seguenti due chiamate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La prima chiamata attiva la funzione con parametri interi, mentre la seconda chiamata esegue la seconda variante della funzione che si aspetta due stringhe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri letterali<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un caso interessante per le multi-funzioni è avere varianti che hanno valori letterali come parametri.<\/span> <span class=\"sg\" data-s=\"1\">Considera le seguenti due varianti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Questa è la risposta'}\nmulti sub f($x) {say \"$x non è la risposta\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La prima variante viene eseguita solo quando chiami la funzione con il valore esatto di 42.<\/span> <span class=\"sg\" data-s=\"1\">Negli altri casi, viene utilizzata la seconda variante.<\/span> <span class=\"sg\" data-s=\"2\">L'ordine in cui queste funzioni sono definite non importa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 non è la risposta\nf(42); # Questa è la risposta<\/code><\/pre>"]]},"lv":{"t":"Daudzfunkcijas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ievieš <em>vairākkārtēju izsaukumu<\/em> balstoties uz funkcijas parakstu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj izveidot funkcijas, kurām ir vienāds nosaukums, bet dažādi ievaddatu tipi.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet <code>multi<\/code> deklaratoru katrai funkcijas variācijai.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Ir pieļaujams izlaist <code>sub<\/code> pēc <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jums ir divas vienas un tās pašas funkcijas variācijas, kompilators veic vairākkārtēju izsaukumu atkarībā no tā, kādus argumentus tas redz funkcijas izsaukumā.<\/span> <span class=\"sg\" data-s=\"1\">Salīdziniet šādus divus izsaukumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pirmais izsaukums aktivizē funkciju ar veselu skaitļu parametriem, kamēr otrais izsaukums palaidīs otro funkcijas variāciju, kas sagaida divas virknes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literālie parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interesants gadījums daudzfunkcijām ir tāds, ka tām ir variācijas, kurām ir literālas vērtības kā parametri.<\/span> <span class=\"sg\" data-s=\"1\">Apsveriet šādas divas variācijas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Šī ir atbilde'}\nmulti sub f($x) {say \"$x nav atbilde\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmā variācija tiek palaista tikai tad, kad jūs izsaucat funkciju ar tieši 42 vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Citos gadījumos tiek izmantota otrā variācija.<\/span> <span class=\"sg\" data-s=\"2\">Kārtība, kādā šīs funkcijas ir definētas, nav svarīga.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 nav atbilde\nf(42); # Šī ir atbilde<\/code><\/pre>"]]},"ru":{"t":"Мульти-функции","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku реализует <em>множественную диспетчеризацию<\/em> на основе сигнатуры функции.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет создавать функции, которые имеют одно и то же имя, но принимают разные типы входных данных.<\/span> <span class=\"sg\" data-s=\"2\">Используйте декларатив <code>multi<\/code> для каждой из вариантов функции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Можно опустить <code>sub<\/code> после <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если у вас есть два варианта одной и той же функции, компилятор выполняет множественную диспетчеризацию в зависимости от того, какие аргументы он видит в вызове функции.<\/span> <span class=\"sg\" data-s=\"1\">Сравните следующие два вызова:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Первый вызов запускает функцию с целочисленными параметрами, в то время как второй вызов запускает второй вариант функции, который ожидает две строки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Литеральные параметры<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интересный случай для многофункций — это наличие вариантов, которые имеют литеральные значения в качестве параметров.<\/span> <span class=\"sg\" data-s=\"1\">Рассмотрим следующие два варианта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Это ответ'}\nmulti sub f($x) {say \"$x не является ответом\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Первый вариант выполняется только тогда, когда вы вызываете функцию с точным значением 42.<\/span> <span class=\"sg\" data-s=\"1\">В других случаях используется второй вариант.<\/span> <span class=\"sg\" data-s=\"2\">Порядок, в котором эти функции определены, не имеет значения.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не является ответом\nf(42); # Это ответ<\/code><\/pre>"]]},"uk":{"t":"Мульти-функції","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku реалізує <em>множинну диспетчеризацію<\/em> на основі сигнатури функції.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє створювати функції, які мають однакову назву, але різні типи вхідних даних.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте декларацію <code>multi<\/code> для кожного з варіантів функції.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Можна опустити <code>sub<\/code> після <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо у вас є два варіанти однієї і тієї ж функції, компілятор здійснює множинну диспетчеризацію в залежності від того, які аргументи він бачить у виклику функції.<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте наступні два виклики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перший виклик запускає функцію з цілими параметрами, тоді як другий виклик запускає другий варіант функції, яка очікує два рядки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Літеральні параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цікавим випадком для багатофункцій є наявність варіантів, які мають літеральні значення як параметри.<\/span> <span class=\"sg\" data-s=\"1\">Розгляньте наступні два варіанти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Це відповідь'}\nmulti sub f($x) {say \"$x не є відповіддю\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перший варіант запускається тільки тоді, коли ви викликаєте функцію з точним значенням 42.<\/span> <span class=\"sg\" data-s=\"1\">В інших випадках використовується другий варіант.<\/span> <span class=\"sg\" data-s=\"2\">Порядок, у якому ці функції визначені, не має значення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не є відповіддю\nf(42); # Це відповідь<\/code><\/pre>"]]},"bg":{"t":"Мулти-функции","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku реализира <em>многократно разпределение<\/em> въз основа на подписа на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Това позволява създаването на функции, които споделят името, но имат различни типове входни данни.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте деклараторът <code>multi<\/code> за всяка от вариантите на функцията.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Не е проблем да пропуснете <code>sub<\/code> след <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако имате два варианта на една и съща функция, компилаторът извършва многократно разпределение в зависимост от това какви аргументи вижда в извикването на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Сравнете следните две извиквания:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Първото извикване задейства функцията с параметри от тип integer, докато второто извикване изпълнява втория вариант на функцията, който очаква два стринга.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Литерални параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интересен случай за многофункции е да имате варианти, които имат литерални стойности като параметри.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте следните два варианта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Това е отговорът'}\nmulti sub f($x) {say \"$x не е отговорът\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Първият вариант се изпълнява само когато извикате функцията с точната стойност 42.<\/span> <span class=\"sg\" data-s=\"1\">В други случаи се използва вторият вариант.<\/span> <span class=\"sg\" data-s=\"2\">Редът, в който тези функции са дефинирани, няма значение.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не е отговорът\nf(42); # Това е отговорът<\/code><\/pre>"]]},"eo":{"t":"Multi-funkcioj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku efektivigas <em>multoblan sendon<\/em> bazitan sur funkcia subskribo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi permesas krei funkciojn kiuj dividas la nomon sed havas malsamajn tipojn de eniraj datumoj.<\/span> <span class=\"sg\" data-s=\"2\">Uzu la <code>multi<\/code> deklarilon por ĉiu el la variantoj de la funkcio.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Estas bone preterlasi <code>sub<\/code> post <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi havas la du variantojn de la sama funkcio, la kompililo plenumas multoblan sendon depende de kiuj argumentoj estas viditaj en la funkcia voko.<\/span> <span class=\"sg\" data-s=\"1\">Komparu la jenajn du vokojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La unua voko ekigas la funkcion kun entjeraj parametroj, dum la dua voko funkciigas la duan varianton de la funkcio kiu atendas du ĉenojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literalaj parametroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interesa kazo por multi-funkcioj estas havi variantojn kiuj havas literalajn valorojn kiel parametroj.<\/span> <span class=\"sg\" data-s=\"1\">Konsideru la jenajn du variantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Ĉi tio estas la respondo'}\nmulti sub f($x) {say \"$x ne estas la respondo\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La unua varianto estas nur funkciigita kiam vi vokas la funkcion kun la ĝusta valoro de 42.<\/span> <span class=\"sg\" data-s=\"1\">En aliaj kazoj, la dua varianto estas uzata.<\/span> <span class=\"sg\" data-s=\"2\">La ordo en kiu ĉi tiuj funkcioj estas difinitaj ne gravas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 ne estas la respondo\nf(42); # Ĉi tio estas la respondo<\/code><\/pre>"]]},"la":{"t":"Multi-functiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku implementat <em>multiplicem distributionem<\/em> secundum functionis signaturam.<\/span> <span class=\"sg\" data-s=\"1\">Permittit creare functiones quae nomen communicant sed diversos generum inputorum habent.<\/span> <span class=\"sg\" data-s=\"2\">Utere <code>multi<\/code> declaratore pro singulis variantibus functionis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Bene est omittere <code>sub<\/code> post <code>multi<\/code>.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si duas variantes eiusdem functionis habes, compilator multiplicem distributionem facit secundum argumenta quae in vocatione functionis videt.<\/span> <span class=\"sg\" data-s=\"1\">Compara sequentes duas vocationes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prima vocatio functionem cum parametris integris excitat, dum secunda vocatio alteram variantem functionis quae duos chordas exspectat currit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literales parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Casu interessante pro multi-functionibus est habere variantes quae valores literales ut parametros habent.<\/span> <span class=\"sg\" data-s=\"1\">Considera sequentes duas variantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Hoc est responsum'}\nmulti sub f($x) {say \"$x non est responsum\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima varians solum curritur cum functionem cum exacto valore 42 vocas.<\/span> <span class=\"sg\" data-s=\"1\">In aliis casibus, secunda varians adhibetur.<\/span> <span class=\"sg\" data-s=\"2\">Ordo in quo hae functiones definiuntur non refert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 non est responsum\nf(42); # Hoc est responsum<\/code><\/pre>"]]}}}</script>
