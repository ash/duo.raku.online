<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/exercises/factorial-with-multi-functions/solution","n":308,"k":"solution","pv":"essentials/more-on-functions/exercises/factorial-with-multi-functions","nx":"essentials/built-in-functions-for-printing","tr":["essentials","essentials/more-on-functions"],"L":{"en":{"t":"Solution: Factorial with multi-functions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">This exercise is about factorials again.<\/span> <span class=\"sg\" data-s=\"1\">Indeed, the task allows us to illustrate more features of Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When computing a factorial by starting from the given number and going downwards, you need to stop when the number gets to 1.<\/span> <span class=\"sg\" data-s=\"1\">With multi-functions, you can achieve that by extracting the case with <code>$n == 1<\/code> to a separate multi-function.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the solution:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Find the program in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comment<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Note that the input argument is explicitly converted to an integer: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is to prevent an infinite loop when the input number is <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In this case, the type of parameter passed to the <code>factorial<\/code> function is <a href=\"/essentials/typed-variables/allomorphs/\"><code>IntStr<\/code><\/a>, and the first multi-variant cannot catch the call.<\/span> <span class=\"sg\" data-s=\"3\">In contrast, when <code>factorial(2 - 1)<\/code> is called recursively, the argument of the function is an integer, which makes it possible to call the first variant.<\/span><\/p>"]]},"de":{"t":"Solution: Fakultät mit Multi-Funktionen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Übung behandelt erneut Fakultäten.<\/span> <span class=\"sg\" data-s=\"1\">Tatsächlich ermöglicht uns die Aufgabe, weitere Funktionen von Raku zu veranschaulichen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn man eine Fakultät berechnet, indem man von der gegebenen Zahl ausgeht und abwärts zählt, muss man aufhören, wenn die Zahl 1 erreicht.<\/span> <span class=\"sg\" data-s=\"1\">Mit Multi-Funktionen kann man dies erreichen, indem man den Fall mit <code>$n == 1<\/code> in eine separate Multi-Funktion auslagert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist die Lösung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Finde das Programm in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentar<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass das Eingabeargument explizit in einen Integer umgewandelt wird: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dies soll eine Endlosschleife verhindern, wenn die Eingabezahl <code>1<\/code> ist.<\/span> <span class=\"sg\" data-s=\"2\">In diesem Fall ist der Typ des an die <code>factorial<\/code>-Funktion übergebenen Parameters <a href=\"https://course.raku.org/de/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, und die erste Multi-Variante kann den Aufruf nicht abfangen.<\/span> <span class=\"sg\" data-s=\"3\">Im Gegensatz dazu, wenn <code>factorial(2 - 1)<\/code> rekursiv aufgerufen wird, ist das Argument der Funktion ein Integer, was es ermöglicht, die erste Variante aufzurufen.<\/span><\/p>"]]},"nl":{"t":"Solution: Faculteit met multi-functies","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze oefening gaat weer over faculteiten.<\/span> <span class=\"sg\" data-s=\"1\">Inderdaad, de taak stelt ons in staat om meer functies van Raku te illustreren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bij het berekenen van een faculteit door te beginnen vanaf het gegeven getal en naar beneden te gaan, moet je stoppen wanneer het getal 1 wordt.<\/span> <span class=\"sg\" data-s=\"1\">Met multi-functies kun je dat bereiken door het geval met <code>$n == 1<\/code> naar een aparte multi-functie te extraheren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is de oplossing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vind het programma in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerking<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Merk op dat het invoerargument expliciet wordt omgezet naar een integer: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is om een oneindige lus te voorkomen wanneer het invoernummer <code>1<\/code> is.<\/span> <span class=\"sg\" data-s=\"2\">In dit geval is het type parameter dat aan de <code>factorial<\/code> functie wordt doorgegeven een <a href=\"https://course.raku.org/nl/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, en de eerste multi-variant kan de oproep niet opvangen.<\/span> <span class=\"sg\" data-s=\"3\">Daarentegen, wanneer <code>factorial(2 - 1)<\/code> recursief wordt aangeroepen, is het argument van de functie een integer, wat het mogelijk maakt om de eerste variant aan te roepen.<\/span><\/p>"]]},"es":{"t":"Solution: Factorial con multi-funciones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Este ejercicio trata nuevamente sobre factoriales.<\/span> <span class=\"sg\" data-s=\"1\">De hecho, la tarea nos permite ilustrar más características de Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al calcular un factorial comenzando desde el número dado y descendiendo, necesitas detenerte cuando el número llega a 1.<\/span> <span class=\"sg\" data-s=\"1\">Con multi-funciones, puedes lograr eso extrayendo el caso con <code>$n == 1<\/code> a una multi-función separada.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí está la solución:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentario<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ten en cuenta que el argumento de entrada se convierte explícitamente a un entero: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es para prevenir un bucle infinito cuando el número de entrada es <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En este caso, el tipo de parámetro pasado a la función <code>factorial<\/code> es <a href=\"https://course.raku.org/es/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, y la primera variante múltiple no puede capturar la llamada.<\/span> <span class=\"sg\" data-s=\"3\">En contraste, cuando <code>factorial(2 - 1)<\/code> se llama recursivamente, el argumento de la función es un entero, lo que hace posible llamar a la primera variante.<\/span><\/p>"]]},"it":{"t":"Solution: Fattoriale con multi-funzioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo esercizio riguarda ancora i fattoriali.<\/span> <span class=\"sg\" data-s=\"1\">Infatti, il compito ci permette di illustrare più caratteristiche di Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando si calcola un fattoriale partendo dal numero dato e andando verso il basso, è necessario fermarsi quando il numero arriva a 1.<\/span> <span class=\"sg\" data-s=\"1\">Con le multi-funzioni, puoi ottenere ciò estraendo il caso con <code>$n == 1<\/code> in una multi-funzione separata.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco la soluzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commento<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota che l'argomento di input è esplicitamente convertito in un intero: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo per prevenire un loop infinito quando il numero di input è <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In questo caso, il tipo di parametro passato alla funzione <code>factorial<\/code> è <a href=\"https://course.raku.org/it/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, e la prima variante multi non può catturare la chiamata.<\/span> <span class=\"sg\" data-s=\"3\">Al contrario, quando <code>factorial(2 - 1)<\/code> è chiamato ricorsivamente, l'argomento della funzione è un intero, il che rende possibile chiamare la prima variante.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Faktoriāls ar daudzfunkcijām","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis uzdevums atkal ir par faktoriāliem.<\/span> <span class=\"sg\" data-s=\"1\">Patiesībā, uzdevums ļauj mums ilustrēt vairāk Raku valodas iespēju.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aprēķinot faktoriālu, sākot no dotā skaitļa un ejot uz leju, jums ir jāpārtrauc, kad skaitlis sasniedz 1.<\/span> <span class=\"sg\" data-s=\"1\">Ar vairāku funkciju palīdzību jūs varat to panākt, izdalot gadījumu ar <code>$n == 1<\/code> atsevišķā vairāku funkcijā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir risinājums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentārs<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka ievades arguments tiek skaidri konvertēts uz veselu skaitli: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir, lai novērstu bezgalīgu ciklu, kad ievades skaitlis ir <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šajā gadījumā parametra tips, kas tiek nodots <code>factorial<\/code> funkcijai, ir <a href=\"https://course.raku.org/lv/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, un pirmā vairāku varianta nevar uztvert izsaukumu.<\/span> <span class=\"sg\" data-s=\"3\">Savukārt, kad <code>factorial(2 - 1)<\/code> tiek izsaukts rekursīvi, funkcijas arguments ir vesels skaitlis, kas ļauj izsaukt pirmo variantu.<\/span><\/p>"]]},"ru":{"t":"Решение: Факториал с мульти-функциями","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Это упражнение снова касается факториалов.<\/span> <span class=\"sg\" data-s=\"1\">Действительно, задача позволяет нам проиллюстрировать больше возможностей Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При вычислении факториала, начиная с заданного числа и идя вниз, нужно остановиться, когда число станет 1.<\/span> <span class=\"sg\" data-s=\"1\">С помощью multi-функций вы можете достичь этого, выделив случай с <code>$n == 1<\/code> в отдельную multi-функцию.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Найдите программу в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарий<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что входной аргумент явно преобразуется в целое число: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это необходимо для предотвращения бесконечного цикла, когда входное число равно <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В этом случае тип параметра, передаваемого функции <code>factorial<\/code>, является <a href=\"https://course.raku.org/ru/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, и первый multi-вариант не может поймать вызов.<\/span> <span class=\"sg\" data-s=\"3\">Напротив, когда <code>factorial(2 - 1)<\/code> вызывается рекурсивно, аргумент функции является целым числом, что позволяет вызвать первый вариант.<\/span><\/p>"]]},"uk":{"t":"Solution: Факторіал з мульти-функціями","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця вправа знову про факторіали.<\/span> <span class=\"sg\" data-s=\"1\">Дійсно, завдання дозволяє нам проілюструвати більше можливостей Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При обчисленні факторіала, починаючи з заданого числа і рухаючись вниз, потрібно зупинитися, коли число стане 1.<\/span> <span class=\"sg\" data-s=\"1\">За допомогою multi-функцій ви можете досягти цього, виділивши випадок з <code>$n == 1<\/code> в окрему multi-функцію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось розв'язок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що вхідний аргумент явно перетворюється на ціле число: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це для запобігання нескінченному циклу, коли вхідне число дорівнює <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У цьому випадку тип параметра, переданого до функції <code>factorial<\/code>, є <a href=\"https://course.raku.org/uk/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, і перший multi-варіант не може перехопити виклик.<\/span> <span class=\"sg\" data-s=\"3\">На відміну від цього, коли <code>factorial(2 - 1)<\/code> викликається рекурсивно, аргумент функції є цілим числом, що дозволяє викликати перший варіант.<\/span><\/p>"]]},"bg":{"t":"Solution: Факториел с мулти-функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Това упражнение е отново за факториали.<\/span> <span class=\"sg\" data-s=\"1\">Всъщност, задачата ни позволява да илюстрираме повече възможности на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато изчислявате факториал, започвайки от даденото число и намалявайки надолу, трябва да спрете, когато числото стане 1.<\/span> <span class=\"sg\" data-s=\"1\">С мулти-функции можете да постигнете това, като извлечете случая с <code>$n == 1<\/code> в отделна мулти-функция.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето решението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Забележете, че входният аргумент е изрично конвертиран в цяло число: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е за да се предотврати безкраен цикъл, когато входното число е <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В този случай, типът на параметъра, предаден на функцията <code>factorial<\/code>, е <a href=\"https://course.raku.org/bg/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, и първият мулти-вариант не може да улови извикването.<\/span> <span class=\"sg\" data-s=\"3\">За разлика от това, когато <code>factorial(2 - 1)<\/code> се извиква рекурсивно, аргументът на функцията е цяло число, което прави възможно извикването на първия вариант.<\/span><\/p>"]]},"eo":{"t":"Solution: Faktorialo kun multi-funkcioj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzerco temas denove pri faktorioj.<\/span> <span class=\"sg\" data-s=\"1\">Efektive, la tasko permesas al ni ilustri pli da trajtoj de Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam oni kalkulas faktorion komencante de la donita nombro kaj irante malsupren, vi devas halti kiam la nombro atingas 1.<\/span> <span class=\"sg\" data-s=\"1\">Kun multi-funkcioj, vi povas atingi tion per ekstraktado de la kazo kun <code>$n == 1<\/code> al aparta multi-funkcio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komento<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la eniga argumento estas eksplicite konvertita al entjero: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas por eviti senfinan buklon kiam la eniga nombro estas <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En ĉi tiu kazo, la tipo de parametro pasita al la funkcio <code>factorial<\/code> estas <a href=\"https://course.raku.org/eo/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, kaj la unua multi-variaĵo ne povas kapti la vokon.<\/span> <span class=\"sg\" data-s=\"3\">Kontraste, kiam <code>factorial(2 - 1)<\/code> estas vokita rekursive, la argumento de la funkcio estas entjero, kio ebligas voki la unuan variaĵon.<\/span><\/p>"]]},"la":{"t":"Solution: Factorial cum multi-functiones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc exercitium de factorialibus iterum est.<\/span> <span class=\"sg\" data-s=\"1\">Re vera, munus nobis permittit ut plures proprietates Raku illustrentur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum factorialem computas incipiendo a dato numero et descendendo, necesse est desinere cum numerus fit 1.<\/span> <span class=\"sg\" data-s=\"1\">Cum multi-functionibus, hoc assequi potes extrahendo casum cum <code>$n == 1<\/code> ad separatam multi-functionem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenias programmatum in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota quod argumentum input explicit convertitur ad integrum: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est ne infinitum loop fiat cum numerus input est <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In hoc casu, typus parametri ad functionem <code>factorial<\/code> transmissus est <a href=\"https://course.raku.org/la/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>, et prima multi-variant non potest vocationem capere.<\/span> <span class=\"sg\" data-s=\"3\">Contra, cum <code>factorial(2 - 1)<\/code> recursive vocatur, argumentum functionis est integer, quod facit ut prima variant vocari possit.<\/span><\/p>"]]}}}</script>
