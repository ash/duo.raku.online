<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/typed-parameters","n":298,"k":"topic","pv":"essentials/more-on-functions/mind-the-space","nx":"essentials/more-on-functions/typed-parameters/quiz","tr":["essentials","essentials/more-on-functions"],"L":{"en":{"t":"Typed parameters of functions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Function parameters in Raku can be made type restricted.<\/span> <span class=\"sg\" data-s=\"1\">This is very similar to <a href=\"/essentials/typed-variables/type-constraints/\">typed variables<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The function now demands its arguments to be integer numbers.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An attempt to pass a parameter of any other type than <code>Int<\/code> is a compile-time error.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice that Raku won’t automatically convert types even if it is possible in other cases.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK and is 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## How to tell if it’s a compile-time error If the error message starts with <code>===SORRY!=== Error while compiling<\/code>, it means that the error happened at compile time. %%/tipblock<\/span><\/p>"]]},"de":{"t":"Typisierte Parameter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Funktionsparameter in Raku können typbeschränkt gemacht werden.<\/span> <span class=\"sg\" data-s=\"1\">Dies ist sehr ähnlich zu <a href=\"https://course.raku.org/de/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">typisierten Variablen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Funktion verlangt nun, dass ihre Argumente ganze Zahlen sind.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Fehler<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Versuch, einen Parameter eines anderen Typs als <code>Int<\/code> zu übergeben, führt zu einem Kompilierungsfehler.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Fehler beim Kompilieren von t.raku\nDas Aufrufen von add(Num, Num) wird niemals mit der deklarierten Signatur (Int $x, Int $y) funktionieren\nin t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Raku Typen nicht automatisch konvertiert, selbst wenn dies in anderen Fällen möglich ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Fehler\nsay '3' + '4'; # OK und ergibt 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Wie man erkennt, ob es ein Kompilierungsfehler ist Wenn die Fehlermeldung mit <code>===SORRY!=== Fehler beim Kompilieren<\/code> beginnt, bedeutet dies, dass der Fehler zur Kompilierzeit aufgetreten ist. %%/tipblock<\/span><\/p>"]]},"nl":{"t":"Getypte parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Functieparameters in Raku kunnen typebeperkingen hebben.<\/span> <span class=\"sg\" data-s=\"1\">Dit is zeer vergelijkbaar met <a href=\"https://course.raku.org/nl/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">getypte variabelen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De functie vereist nu dat de argumenten gehele getallen zijn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Fout<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een poging om een parameter van een ander type dan <code>Int<\/code> door te geven, resulteert in een compile-tijd fout.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat Raku niet automatisch types converteert, zelfs niet als dit in andere gevallen mogelijk is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Fout\nsay '3' + '4'; # OK en is 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Hoe te herkennen of het een compile-tijd fout is Als het foutbericht begint met <code>===SORRY!=== Error while compiling<\/code>, betekent dit dat de fout op compile-tijd is opgetreden. %%/tipblock<\/span><\/p>"]]},"es":{"t":"Parámetros tipados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los parámetros de función en Raku pueden tener restricciones de tipo.<\/span> <span class=\"sg\" data-s=\"1\">Esto es muy similar a las <a href=\"https://course.raku.org/es/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variables tipadas<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La función ahora exige que sus argumentos sean números enteros.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un intento de pasar un parámetro de cualquier otro tipo que no sea <code>Int<\/code> resulta en un error de compilación.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nótese que Raku no convertirá automáticamente los tipos, incluso si es posible en otros casos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK y es 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Cómo saber si es un error de compilación Si el mensaje de error comienza con <code>===SORRY!=== Error while compiling<\/code>, significa que el error ocurrió en tiempo de compilación. %%/tipblock<\/span><\/p>"]]},"it":{"t":"Parametri tipizzati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I parametri delle funzioni in Raku possono essere limitati dal tipo.<\/span> <span class=\"sg\" data-s=\"1\">Questo è molto simile alle <a href=\"https://course.raku.org/it/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variabili tipizzate<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La funzione ora richiede che i suoi argomenti siano numeri interi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Errore<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un tentativo di passare un parametro di qualsiasi altro tipo diverso da <code>Int<\/code> genera un errore di compilazione.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che Raku non convertirà automaticamente i tipi anche se è possibile in altri casi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Errore\nsay '3' + '4'; # OK ed è 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Come capire se è un errore di compilazione Se il messaggio di errore inizia con <code>===SORRY!=== Error while compiling<\/code>, significa che l'errore è avvenuto durante la compilazione. %%/tipblock<\/span><\/p>"]]},"lv":{"t":"Tipizētie parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku valodā funkciju parametri var būt ar tipa ierobežojumu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir ļoti līdzīgi kā <a href=\"https://course.raku.org/lv/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">tipizētie mainīgie<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funkcija tagad pieprasa, lai tās argumenti būtu veseli skaitļi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Kļūda<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mēģinājums nodot jebkura cita tipa parametru, izņemot <code>Int<\/code>, ir kļūda kompilācijas laikā.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Kļūda kompilējot t.raku\nIzsaukums add(Num, Num) nekad nedarbosies ar deklarēto parakstu (Int $x, Int $y)\nt.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka Raku automātiski nekonvertēs tipus, pat ja tas ir iespējams citos gadījumos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Kļūda\nsay '3' + '4'; # OK un ir 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Kā noteikt, vai tā ir kļūda kompilācijas laikā Ja kļūdas ziņojums sākas ar <code>===SORRY!=== Kļūda kompilējot<\/code>, tas nozīmē, ka kļūda notika kompilācijas laikā. %%/tipblock<\/span><\/p>"]]},"ru":{"t":"Типизированные параметры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметры функций в Raku могут быть ограничены типом.<\/span> <span class=\"sg\" data-s=\"1\">Это очень похоже на <a href=\"https://course.raku.org/ru/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типизированные переменные<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь функция требует, чтобы её аргументы были целыми числами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Ошибка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Попытка передать параметр любого другого типа, кроме <code>Int<\/code>, приведет к ошибке времени компиляции.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что Raku не будет автоматически преобразовывать типы, даже если это возможно в других случаях.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Ошибка\nsay '3' + '4'; # OK и результат 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Как определить, что это ошибка времени компиляции Если сообщение об ошибке начинается с <code>===SORRY!=== Error while compiling<\/code>, это означает, что ошибка произошла во время компиляции. %%/tipblock<\/span><\/p>"]]},"uk":{"t":"Типізовані параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметри функцій у Raku можуть бути обмежені типами.<\/span> <span class=\"sg\" data-s=\"1\">Це дуже схоже на <a href=\"https://course.raku.org/uk/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типізовані змінні<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер функція вимагає, щоб її аргументи були цілими числами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Помилка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Спроба передати параметр будь-якого іншого типу, ніж <code>Int<\/code>, призведе до помилки під час компіляції.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що Raku не буде автоматично конвертувати типи, навіть якщо це можливо в інших випадках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Помилка\nsay '3' + '4'; # OK і результат 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Як визначити, що це помилка під час компіляції Якщо повідомлення про помилку починається з <code>===SORRY!=== Error while compiling<\/code>, це означає, що помилка сталася під час компіляції. %%/tipblock<\/span><\/p>"]]},"bg":{"t":"Типизирани параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Функционалните параметри в Raku могат да бъдат ограничени по тип.<\/span> <span class=\"sg\" data-s=\"1\">Това е много подобно на <a href=\"https://course.raku.org/bg/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типизираните променливи<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Функцията сега изисква нейните аргументи да бъдат цели числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Грешка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опитът да се предаде параметър от какъвто и да е друг тип, различен от <code>Int<\/code>, е грешка по време на компилация.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че Raku няма автоматично да конвертира типовете, дори ако това е възможно в други случаи.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Грешка\nsay '3' + '4'; # ОК и е 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Как да разберем дали е грешка по време на компилация Ако съобщението за грешка започва с <code>===SORRY!=== Error while compiling<\/code>, това означава, че грешката е възникнала по време на компилация. %%/tipblock<\/span><\/p>"]]},"eo":{"t":"Tipitaj parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametroj de funkcioj en Raku povas esti tajpe restriktitaj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas tre simila al <a href=\"https://course.raku.org/eo/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">tajpitaj variabloj<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La funkcio nun postulas, ke ĝiaj argumentoj estu entjeraj nombroj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Eraro<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Provo pasi parametron de iu ajn alia tipo ol <code>Int<\/code> estas kompila-tempa eraro.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke Raku ne aŭtomate konvertos tipojn eĉ se tio estas ebla en aliaj kazoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Eraro\nsay '3' + '4'; # BONE kaj estas 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Kiel diri ĉu ĝi estas kompila-tempa eraro Se la erarmesaĝo komenciĝas per <code>===SORRY!=== Error while compiling<\/code>, tio signifas, ke la eraro okazis dum kompila tempo. %%/tipblock<\/span><\/p>"]]},"la":{"t":"Typis parametra","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Functiones parametri in Raku possunt typi restricti fieri.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est valde simile <a href=\"https://course.raku.org/la/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variabilibus typatis<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Functio nunc argumenta sua numerorum integri postulant.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Conatus transmittendi parameter cuiuslibet alterius generis quam <code>Int<\/code> est error temporis compilationis.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod Raku non convertet genera automatice etiam si possibile est in aliis casibus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK et est 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Quomodo dicere si error est temporis compilationis Si nuntius erroris incipit cum <code>===SORRY!=== Error while compiling<\/code>, significat errorem accidisse in tempore compilationis. %%/tipblock<\/span><\/p>"]]}}}</script>
