<script type="application/json" id="page-data">{"u":"essentials/more-on-functions","n":296,"k":"section","pv":"essentials/functions/quiz","nx":"essentials/more-on-functions/mind-the-space","tr":["essentials"],"L":{"en":{"t":"More on functions","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">This is the second part of our talk about functions in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In this section, we will learn a number of their exciting features.<\/span> <span class=\"sg\" data-s=\"2\">Later in the course, there will be more material about functions.<\/span> <span class=\"sg\" data-s=\"3\">But for now, examine the following subjects.<\/span><\/p>"]]},"de":{"t":"Mehr über Funktionen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Dies ist der zweite Teil unseres Gesprächs über Funktionen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Abschnitt werden wir eine Reihe ihrer aufregenden Eigenschaften kennenlernen.<\/span> <span class=\"sg\" data-s=\"2\">Später im Kurs wird es mehr Material über Funktionen geben.<\/span> <span class=\"sg\" data-s=\"3\">Aber für jetzt, betrachten Sie die folgenden Themen.<\/span><\/p>"]]},"nl":{"t":"Meer over functies","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit is het tweede deel van ons gesprek over functies in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In deze sectie zullen we een aantal van hun spannende kenmerken leren.<\/span> <span class=\"sg\" data-s=\"2\">Later in de cursus zal er meer materiaal over functies zijn.<\/span> <span class=\"sg\" data-s=\"3\">Maar bekijk voor nu de volgende onderwerpen.<\/span><\/p>"]]},"es":{"t":"Más sobre funciones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta es la segunda parte de nuestra charla sobre funciones en Raku.<\/span> <span class=\"sg\" data-s=\"1\">En esta sección, aprenderemos una serie de características interesantes de las mismas.<\/span> <span class=\"sg\" data-s=\"2\">Más adelante en el curso, habrá más material sobre funciones.<\/span> <span class=\"sg\" data-s=\"3\">Pero por ahora, examina los siguientes temas.<\/span><\/p>"]]},"it":{"t":"Più sulle funzioni","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Questa è la seconda parte della nostra discussione sulle funzioni in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In questa sezione, impareremo alcune delle loro caratteristiche entusiasmanti.<\/span> <span class=\"sg\" data-s=\"2\">Più avanti nel corso, ci saranno ulteriori materiali sulle funzioni.<\/span> <span class=\"sg\" data-s=\"3\">Ma per ora, esaminiamo i seguenti argomenti.<\/span><\/p>"]]},"lv":{"t":"Vairāk par funkcijām","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Šī ir mūsu sarunas par funkcijām Raku otrā daļa.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā mēs iepazīsimies ar vairākiem to aizraujošiem elementiem.<\/span> <span class=\"sg\" data-s=\"2\">Vēlāk kursā būs vairāk materiālu par funkcijām.<\/span> <span class=\"sg\" data-s=\"3\">Bet pagaidām aplūkosim šādus tematus.<\/span><\/p>"]]},"ru":{"t":"Больше о функциях","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Это вторая часть нашего разговора о функциях в Raku.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе мы узнаем о ряде их захватывающих особенностей.<\/span> <span class=\"sg\" data-s=\"2\">Позже в курсе будет больше материала о функциях.<\/span> <span class=\"sg\" data-s=\"3\">Но пока рассмотрим следующие темы.<\/span><\/p>"]]},"uk":{"t":"Більше про функції","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Це друга частина нашої розмови про функції в Raku.<\/span> <span class=\"sg\" data-s=\"1\">У цьому розділі ми дізнаємося про низку їх захоплюючих особливостей.<\/span> <span class=\"sg\" data-s=\"2\">Пізніше в курсі буде більше матеріалу про функції.<\/span> <span class=\"sg\" data-s=\"3\">Але зараз розглянемо наступні теми.<\/span><\/p>"]]},"bg":{"t":"Повече за функциите","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Това е втората част от нашата лекция за функциите в Raku.<\/span> <span class=\"sg\" data-s=\"1\">В този раздел ще научим редица от техните вълнуващи характеристики.<\/span> <span class=\"sg\" data-s=\"2\">По-късно в курса ще има още материали за функциите.<\/span> <span class=\"sg\" data-s=\"3\">Но засега разгледайте следните теми.<\/span><\/p>"]]},"eo":{"t":"Pli pri funkcioj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la dua parto de nia parolado pri funkcioj en Raku.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu sekcio, ni lernos kelkajn el iliaj ekscitaj trajtoj.<\/span> <span class=\"sg\" data-s=\"2\">Poste en la kurso, estos pli da materialo pri funkcioj.<\/span> <span class=\"sg\" data-s=\"3\">Sed por nun, ekzamenante la sekvajn temojn.<\/span><\/p>"]]},"la":{"t":"Plus de functionibus","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec est pars secunda sermonis nostri de functionibus in Raku.<\/span> <span class=\"sg\" data-s=\"1\">In hac sectione, plures earum notas excitantes discebimus.<\/span> <span class=\"sg\" data-s=\"2\">Postea in cursu, plura de functionibus erunt.<\/span> <span class=\"sg\" data-s=\"3\">Sed nunc, haec argumenta inspice.<\/span><\/p>"]]}}}</script>
