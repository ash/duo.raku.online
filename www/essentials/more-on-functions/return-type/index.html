<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/return-type","n":300,"k":"topic","pv":"essentials/more-on-functions/typed-parameters/quiz","nx":"essentials/more-on-functions/return-type/quiz","tr":["essentials","essentials/more-on-functions"],"L":{"en":{"t":"Return type of functions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The result of the function can also be explicitly made typed.<\/span> <span class=\"sg\" data-s=\"1\">There are a few ways to express that in code.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Choose one that you like the most.<\/span> <span class=\"sg\" data-s=\"1\">Notice that in the fourth example, the return type is written inside of the parentheses with function parameters.<\/span><\/p>"]]},"de":{"t":"Rückgabetyp","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis der Funktion kann auch explizit typisiert werden.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt einige Möglichkeiten, dies im Code auszudrücken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wählen Sie eine, die Ihnen am besten gefällt.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, dass im vierten Beispiel der Rückgabetyp innerhalb der Klammern mit den Funktionsparametern geschrieben wird.<\/span><\/p>"]]},"nl":{"t":"Return type","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het resultaat van de functie kan ook expliciet getypt worden.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn een paar manieren om dat in code uit te drukken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kies degene die je het meest bevalt.<\/span> <span class=\"sg\" data-s=\"1\">Let op dat in het vierde voorbeeld het retourtype binnen de haakjes met functieparameters wordt geschreven.<\/span><\/p>"]]},"es":{"t":"Tipo de retorno","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El resultado de la función también puede ser explícitamente tipado.<\/span> <span class=\"sg\" data-s=\"1\">Hay algunas maneras de expresar eso en el código.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elige la que más te guste.<\/span> <span class=\"sg\" data-s=\"1\">Observa que en el cuarto ejemplo, el tipo de retorno se escribe dentro de los paréntesis con los parámetros de la función.<\/span><\/p>"]]},"it":{"t":"Tipo di ritorno","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il risultato della funzione può anche essere esplicitamente tipizzato.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono diversi modi per esprimere questo nel codice.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scegli quello che ti piace di più.<\/span> <span class=\"sg\" data-s=\"1\">Nota che nel quarto esempio, il tipo di ritorno è scritto all'interno delle parentesi con i parametri della funzione.<\/span><\/p>"]]},"lv":{"t":"Atgriešanas tips","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcijas rezultātu var arī skaidri norādīt ar tipu.<\/span> <span class=\"sg\" data-s=\"1\">Ir dažādi veidi, kā to izteikt kodā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izvēlieties to, kas jums patīk visvairāk.<\/span> <span class=\"sg\" data-s=\"1\">Pamaniet, ka ceturtajā piemērā atgriešanas tips ir rakstīts iekavās ar funkcijas parametriem.<\/span><\/p>"]]},"ru":{"t":"Тип возвращаемого значения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Результат функции также может быть явно типизирован.<\/span> <span class=\"sg\" data-s=\"1\">Существует несколько способов выразить это в коде.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Выберите тот, который вам больше нравится.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что в четвертом примере тип возвращаемого значения написан внутри скобок с параметрами функции.<\/span><\/p>"]]},"uk":{"t":"Тип повернення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Результат функції також може бути явно типізованим.<\/span> <span class=\"sg\" data-s=\"1\">Існує кілька способів виразити це в коді.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Виберіть той, який вам найбільше подобається.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що в четвертому прикладі тип повернення написаний всередині дужок з параметрами функції.<\/span><\/p>"]]},"bg":{"t":"Тип на връщане","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Резултатът от функцията също може да бъде изрично типизиран.<\/span> <span class=\"sg\" data-s=\"1\">Има няколко начина да се изрази това в кода.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изберете този, който ви харесва най-много.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че в четвъртия пример, типът на връщане е написан вътре в скобите с параметрите на функцията.<\/span><\/p>"]]},"eo":{"t":"Redontipo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La rezulto de la funkcio ankaŭ povas esti eksplicite tipigita.<\/span> <span class=\"sg\" data-s=\"1\">Estas kelkaj manieroj por esprimi tion en kodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elektu unu kiu plaĉas al vi plej multe.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku ke en la kvara ekzemplo, la revena tipo estas skribita ene de la krampoj kun funkciaj parametroj.<\/span><\/p>"]]},"la":{"t":"Redonare typus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eventus functionis etiam explicite typus fieri potest.<\/span> <span class=\"sg\" data-s=\"1\">Sunt pauci modi ad id exprimendum in codice.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elige unum quod maxime placet.<\/span> <span class=\"sg\" data-s=\"1\">Animadverte quod in quarto exemplo, reditus typus intra parentheses cum parametris functionis scriptus est.<\/span><\/p>"]]}}}</script>
