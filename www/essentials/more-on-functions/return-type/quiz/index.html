=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">my $a = add(4, 6);<span class=\"quiz-note\">Die Zuweisung zu einer untypisierten Variablen funktioniert.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">my Rat $b = add(5, 6);<span class=\"quiz-note\">Ein <code>Int<\/code>-Wert kann nicht einer <code>Rat<\/code>-typisierten Variablen zugewiesen werden.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my Int $c = add(7, 8);<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">my Num $d = add(9, 10);<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">my Str $e = add(9, 10).Str;<span class=\"quiz-note\">Explizite Typkonvertierung hilft.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">my Str $f = add(9, 10);<\/span><\/li><\/ul>"]]},"nl":{"t":"Quiz — Return type","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Er is een functie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Controleer welke van de volgende toewijzingen zullen werken.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">my $a = add(4, 6);<span class=\"quiz-note\">Toewijzen aan een ongetypeerde variabele werkt.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">my Rat $b = add(5, 6);<span class=\"quiz-note\">Een <code>Int<\/code> waarde kan niet worden toegewezen aan een <code>Rat<\/code> getypeerde variabele.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my Int $c = add(7, 8);<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">my Num $d = add(9, 10);<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">my Str $e = add(9, 10).Str;<span class=\"quiz-note\">Expliciete typeconversie helpt.<\/sp
