<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/mind-the-space","n":297,"k":"topic","pv":"essentials/more-on-functions","nx":"essentials/more-on-functions/typed-parameters","tr":["essentials","essentials/more-on-functions"],"L":{"en":{"t":"Mind the space","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Using functions in Raku is mostly intuitive and causes no problems, but you must be warned about the following aspect.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do not add a space between the name of the function and the parentheses with its arguments.<\/span> <span class=\"sg\" data-s=\"1\">But use a space after <code>for<\/code> and <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Long story<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Let us take a simple function:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">First of all, note the absence of spaces between the name of the function and the opening parentheses that keeps the parameters.<\/span> <span class=\"sg\" data-s=\"1\">Some coding styles in other languages may require a space there.<\/span> <span class=\"sg\" data-s=\"2\">Raku is fine with that, but this is not a practice to follow:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On the calling side, the absence of space is important.<\/span> <span class=\"sg\" data-s=\"1\">If you call the function and omit the parentheses, then the space after the name of the function is unavoidable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">But if you add parentheses, you cannot have a space before them.<\/span> <span class=\"sg\" data-s=\"1\">This is a correct call:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And this call is wrong:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Such code causes an exception:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku sees the call with a space <code>f (5, 6)<\/code> as an attempt to pass a single argument <code>(5, 6)<\/code> to the function.<\/span> <span class=\"sg\" data-s=\"1\">You can easily check the type of this argument if you rewrite the function to accept only one argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So, calling <code>f (5, 6)<\/code> means that we are passing a <a href=\"/essentials/positionals/lists/\">list<\/a> to the function.<\/span> <span class=\"sg\" data-s=\"1\">The list as a single entity.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">When space is needed<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In some cases, the space character is needed.<\/span> <span class=\"sg\" data-s=\"1\">That happens when you use parentheses with one of the keywords, such as <code>if<\/code> or <code>for<\/code> or <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The following code is wrong:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The error message explains what’s wrong:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With the case of <code>if<\/code>, parentheses are not required at all, so the problem has no chance to appear if you do not use them.<\/span> <span class=\"sg\" data-s=\"1\">But in some cases, as, for example, with <code>loop<\/code>, you need to have them, and the space becomes mandatory:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In this code, the same thing happens: <code>loop(...)<\/code> is understood by the compiler as a function call.<\/span> <span class=\"sg\" data-s=\"1\">Add a space to resolve the issue.<\/span> <span class=\"sg\" data-s=\"2\">Or better rewrite the fragment using <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusion<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The bottom line: to avoid such issues, do not add a space between the name of the function and the parentheses with the arguments of the function and try to avoid parentheses if that’s possible with other language constructions such as control flow.<\/span><\/p>"]]},"de":{"t":"Achte auf den Abstand","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Verwendung von Funktionen in Raku ist meist intuitiv und verursacht keine Probleme, aber Sie müssen auf den folgenden Aspekt achten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fügen Sie keinen Abstand zwischen dem Namen der Funktion und den Klammern mit ihren Argumenten hinzu.<\/span> <span class=\"sg\" data-s=\"1\">Verwenden Sie jedoch einen Abstand nach <code>for<\/code> und <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lange Geschichte<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nehmen wir eine einfache Funktion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie zunächst das Fehlen von Leerzeichen zwischen dem Namen der Funktion und den öffnenden Klammern, die die Parameter enthalten.<\/span> <span class=\"sg\" data-s=\"1\">Einige Codierungsstile in anderen Sprachen erfordern dort möglicherweise ein Leerzeichen.<\/span> <span class=\"sg\" data-s=\"2\">Raku ist damit einverstanden, aber dies ist keine Praxis, der man folgen sollte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Auf der Aufrufseite ist das Fehlen von Leerzeichen wichtig.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie die Funktion aufrufen und die Klammern weglassen, ist das Leerzeichen nach dem Namen der Funktion unvermeidlich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aber wenn Sie Klammern hinzufügen, dürfen Sie kein Leerzeichen davor haben.<\/span> <span class=\"sg\" data-s=\"1\">Dies ist ein korrekter Aufruf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und dieser Aufruf ist falsch:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Solcher Code verursacht eine Ausnahme:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zu wenige Positionsparameter übergeben; erwartet wurden 2 Argumente, aber es wurde 1 übergeben       sub f bei t.raku Zeile 1       in Block &lt;unit&gt; bei t.raku Zeile 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku sieht den Aufruf mit einem Leerzeichen <code>f (5, 6)<\/code> als Versuch, ein einzelnes Argument <code>(5, 6)<\/code> an die Funktion zu übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Sie können den Typ dieses Arguments leicht überprüfen, wenn Sie die Funktion so umschreiben, dass sie nur ein Argument akzeptiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Aufrufen von <code>f (5, 6)<\/code> bedeutet also, dass wir eine <a href=\"https://course.raku.org/de/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">Liste<\/a> an die Funktion übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Die Liste als eine einzelne Entität.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wann ein Leerzeichen benötigt wird<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In einigen Fällen ist das Leerzeichen erforderlich.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert, wenn Sie Klammern mit einem der Schlüsselwörter wie <code>if<\/code> oder <code>for<\/code> oder <code>loop<\/code> verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Der folgende Code ist falsch:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Fehlermeldung erklärt, was falsch ist:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     Das Wort 'if' wird als Funktionsaufruf 'if()' interpretiert.<\/span> <span class=\"sg\" data-s=\"1\">Bitte verwenden Sie     Leerzeichen anstelle von Klammern.     bei /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unerwarteter Block in Infix-Position (zwei Terme hintereinander)     bei /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" d  + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Let allereerst op de afwezigheid van spaties tussen de naam van de functie en de openingshaakjes die de parameters bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Sommige codestijlen in andere talen kunnen daar een spatie vereisen.<\/span> <span class=\"sg\" data-s=\"2\">Raku vindt dat prima, maar dit is geen praktijk om te volgen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aan de aanroepzijde is de afwezigheid van spatie belangrijk.<\/span> <span class=\"sg\" data-s=\"1\">Als je de functie aanroept en de haakjes weglaat, dan is de spatie na de naam van de functie onvermijdelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar als je haakjes toevoegt, kun je geen spatie ervoor hebben.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een correcte aanroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En deze aanroep is fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dergelijke code veroorzaakt een uitzondering:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ziet de aanroep met een spatie <code>f (5, 6)<\/code> als een poging om een enkel argument <code>(5, 6)<\/code> aan de functie door te geven.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het type van dit argument gemakkelijk controleren als je de functie herschrijft om slechts één argument te accepteren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dus, het aanroepen van <code>f (5, 6)<\/code> betekent dat we een <a href=\"https://course.raku.org/nl/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lijst<\/a> aan de functie doorgeven.<\/span> <span class=\"sg\" data-s=\"1\">De lijst als een enkele entiteit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wanneer spatie nodig is<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In sommige gevallen is het spatiekarakter nodig.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt wanneer je haakjes gebruikt met een van de sleutelwoorden, zoals <code>if<\/code> of <code>for<\/code> of <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De volgende code is fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het foutbericht legt uit wat er mis is:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In het geval van <code>if<\/code> zijn haakjes helemaal niet nodig, dus het probleem heeft geen kans om te verschijnen als je ze niet gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Maar in sommige gevallen, zoals bijvoorbeeld met <code>loop<\/code>, moet je ze hebben, en wordt de spatie verplicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In deze code gebeurt hetzelfde: <code>loop(...)<\/code> wordt door de compiler begrepen als een functieaanroep.<\/span> <span class=\"sg\" data-s=\"1\">Voeg een spatie toe om het probleem op te lossen.<\/span> <span class=\"sg\" data-s=\"2\">Of herschrijf het fragment beter met <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusie<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kortom: om dergelijke problemen te vermijden, voeg geen spatie toe tussen de naam van de functie en de haakjes met de argumenten van de functie en probeer haakjes te vermijden als dat mogelijk is met andere taalconstructies zoals controleflow.<\/span><\/p>"]]},"es":{"t":"Atención al espacio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Usar funciones en Raku es mayormente intuitivo y no causa problemas, pero debes estar advertido sobre el siguiente aspecto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No agregues un espacio entre el nombre de la función y los paréntesis con sus argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Pero usa un espacio después de <code>for<\/code> y <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Historia larga<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tomemos una función simple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Primero, nota la ausencia de espacios entre el nombre de la función y el paréntesis de apertura que contiene los parámetros.<\/span> <span class=\"sg\" data-s=\"1\">Algunos estilos de codificación en otros lenguajes pueden requerir un espacio allí.<\/span> <span class=\"sg\" data-s=\"2\">Raku está bien con eso, pero no es una práctica a seguir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En el lado de la llamada, la ausencia de espacio es importante.<\/span> <span class=\"sg\" data-s=\"1\">Si llamas a la función y omites los paréntesis, entonces el espacio después del nombre de la función es inevitable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero si agregas paréntesis, no puedes tener un espacio antes de ellos.<\/span> <span class=\"sg\" data-s=\"1\">Esta es una llamada correcta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y esta llamada es incorrecta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dicho código causa una excepción:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ve la llamada con un espacio <code>f (5, 6)<\/code> como un intento de pasar un solo argumento <code>(5, 6)<\/code> a la función.<\/span> <span class=\"sg\" data-s=\"1\">Puedes comprobar fácilmente el tipo de este argumento si reescribes la función para aceptar solo un argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entonces, llamar a <code>f (5, 6)<\/code> significa que estamos pasando una <a href=\"https://course.raku.org/es/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lista<\/a> a la función.<\/span> <span class=\"sg\" data-s=\"1\">La lista como una entidad única.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cuando se necesita espacio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En algunos casos, el carácter de espacio es necesario.<\/span> <span class=\"sg\" data-s=\"1\">Eso sucede cuando usas paréntesis con una de las palabras clave, como <code>if<\/code> o <code>for<\/code> o <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente código es incorrecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El mensaje de error explica qué está mal:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En el caso de <code>if<\/code>, los paréntesis no son necesarios en absoluto, por lo que el problema no tiene posibilidades de aparecer si no los usas.<\/span> <span class=\"sg\" data-s=\"1\">Pero en algunos casos, como, por ejemplo, con <code>loop<\/code>, necesitas tenerlos, y el espacio se vuelve obligatorio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En este código, sucede lo mismo: <code>loop(...)<\/code> es entendido por el compilador como una llamada a función.<\/span> <span class=\"sg\" data-s=\"1\">Agrega un espacio para resolver el problema.<\/span> <span class=\"sg\" data-s=\"2\">O mejor reescribe el fragmento usando <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusión<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En resumen: para evitar tales problemas, no agregues un espacio entre el nombre de la función y los paréntesis con los argumentos de la función y trata de evitar paréntesis si es posible con otras construcciones del lenguaje como el control de flujo.<\/span><\/p>"]]},"it":{"t":"Attenzione agli spazi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Usare le funzioni in Raku è per lo più intuitivo e non causa problemi, ma devi essere avvertito riguardo al seguente aspetto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non aggiungere uno spazio tra il nome della funzione e le parentesi con i suoi argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Ma usa uno spazio dopo <code>for<\/code> e <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Storia lunga<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prendiamo una semplice funzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima di tutto, nota l'assenza di spazi tra il nome della funzione e la parentesi aperta che contiene i parametri.<\/span> <span class=\"sg\" data-s=\"1\">Alcuni stili di codifica in altre lingue possono richiedere uno spazio lì.<\/span> <span class=\"sg\" data-s=\"2\">Raku va bene con questo, ma non è una pratica da seguire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dal lato della chiamata, l'assenza di spazio è importante.<\/span> <span class=\"sg\" data-s=\"1\">Se chiami la funzione e ometti le parentesi, allora lo spazio dopo il nome della funzione è inevitabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma se aggiungi le parentesi, non puoi avere uno spazio prima di esse.<\/span> <span class=\"sg\" data-s=\"1\">Questa è una chiamata corretta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E questa chiamata è sbagliata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tale codice causa un'eccezione:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku vede la chiamata con uno spazio <code>f (5, 6)<\/code> come un tentativo di passare un singolo argomento <code>(5, 6)<\/code> alla funzione.<\/span> <span class=\"sg\" data-s=\"1\">Puoi facilmente controllare il tipo di questo argomento se riscrivi la funzione per accettare solo un argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi, chiamare <code>f (5, 6)<\/code> significa che stiamo passando una <a href=\"https://course.raku.org/it/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lista<\/a> alla funzione.<\/span> <span class=\"sg\" data-s=\"1\">La lista come entità singola.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando è necessario lo spazio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In alcuni casi, il carattere spazio è necessario.<\/span> <span class=\"sg\" data-s=\"1\">Questo accade quando usi le parentesi con una delle parole chiave, come <code>if<\/code> o <code>for<\/code> o <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il seguente codice è sbagliato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il messaggio di errore spiega cosa c'è di sbagliato:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> /code> un <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garā versija<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatīsim vienkāršu funkciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmkārt, ņemiet vērā, ka nav atstarpes starp funkcijas nosaukumu un atverošajām iekavām, kas satur parametrus.<\/span> <span class=\"sg\" data-s=\"1\">Dažos citos programmēšanas valodās kodēšanas stili var prasīt atstarpi tur.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā tas ir pieņemami, bet tā nav prakse, kuru vajadzētu ievērot:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izsaukuma pusē atstarpes neesamība ir svarīga.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs izsaucat funkciju un izlaidat iekavas, tad atstarpe pēc funkcijas nosaukuma ir neizbēgama:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet, ja jūs pievienojat iekavas, jūs nevarat ievietot atstarpi pirms tām.<\/span> <span class=\"sg\" data-s=\"1\">Šis ir pareizs izsaukums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un šis izsaukums ir nepareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šāds kods izraisa izņēmumu:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku redz izsaukumu ar atstarpi <code>f (5, 6)<\/code> kā mēģinājumu nodot vienu argumentu <code>(5, 6)<\/code> funkcijai.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat viegli pārbaudīt šī argumenta tipu, ja pārrakstīsiet funkciju, lai tā pieņemtu tikai vienu argumentu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad, izsaucot <code>f (5, 6)<\/code>, mēs nododam funkcijai <a href=\"https://course.raku.org/lv/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">sarakstu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sarakstu kā vienu vienību.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kad atstarpe ir nepieciešama<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažos gadījumos atstarpes rakstzīme ir nepieciešama.<\/span> <span class=\"sg\" data-s=\"1\">Tas notiek, kad jūs izmantojat iekavas ar vienu no atslēgvārdiem, piemēram, <code>if<\/code> vai <code>for<\/code> vai <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šāds kods ir nepareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kļūdas ziņojums izskaidro, kas ir nepareizi:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gadījumā ar <code>if<\/code>, iekavas nav nepieciešamas vispār, tāpēc problēma nevar rasties, ja jūs tās neizmantojat.<\/span> <span class=\"sg\" data-s=\"1\">Bet dažos gadījumos, piemēram, ar <code>loop<\/code>, jums tās ir nepieciešamas, un atstarpe kļūst obligāta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā kodā notiek tas pats: <code>loop(...)<\/code> tiek saprasts kā funkcijas izsaukums.<\/span> <span class=\"sg\" data-s=\"1\">Pievienojiet atstarpi, lai atrisinātu problēmu.<\/span> <span class=\"sg\" data-s=\"2\">Vai labāk pārrakstiet fragmentu, izmantojot <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Secinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Galvenais: lai izvairītos no šādām problēmām, nepievienojiet atstarpi starp funkcijas nosaukumu un iekavām ar funkcijas argumentiem un mēģiniet izvairīties no iekavām, ja tas ir iespējams ar citiem valodas konstrukcijām, piemēram, vadības plūsmu.<\/span><\/p>"]]},"ru":{"t":"Внимание к пробелам","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Использование функций в Raku в основном интуитивно и не вызывает проблем, но вам следует обратить внимание на следующий аспект.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не добавляйте пробел между именем функции и скобками с её аргументами.<\/span> <span class=\"sg\" data-s=\"1\">Но используйте пробел после <code>for<\/code> и <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длинная история<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Возьмем простую функцию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прежде всего, обратите внимание на отсутствие пробелов между именем функции и открывающей скобкой, содержащей параметры.<\/span> <span class=\"sg\" data-s=\"1\">Некоторые стили кодирования в других языках могут требовать пробел в этом месте.<\/span> <span class=\"sg\" data-s=\"2\">Raku это допускает, но это не практика, которую следует соблюдать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Со стороны вызова отсутствие пробела важно.<\/span> <span class=\"sg\" data-s=\"1\">Если вы вызываете функцию и опускаете скобки, то пробел после имени функции неизбежен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но если вы добавляете скобки, перед ними не должно быть пробела.<\/span> <span class=\"sg\" data-s=\"1\">Это правильный вызов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А этот вызов неправильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такой код вызывает исключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku воспринимает вызов с пробелом <code>f (5, 6)<\/code> как попытку передать один аргумент <code>(5, 6)<\/code> функции.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете легко проверить тип этого аргумента, если перепишите функцию так, чтобы она принимала только один аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таким образом, вызов <code>f (5, 6)<\/code> означает, что мы передаем <a href=\"https://course.raku.org/ru/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">список<\/a> функции.<\/span> <span class=\"sg\" data-s=\"1\">Список как единое целое.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Когда пробел необходим<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В некоторых случаях пробел необходим.<\/span> <span class=\"sg\" data-s=\"1\">Это происходит, когда вы используете скобки с одним из ключевых слов, таких как <code>if<\/code> или <code>for<\/code> или <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следующий код неверен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сообщение об ошибке объясняет, что не так:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В случае с <code>if<\/code> скобки вообще не требуются, поэтому проблема не возникнет, если вы их не используете.<\/span> <span class=\"sg\" data-s=\"1\">Но в некоторых случаях, например, с <code>loop<\/code>, их необходимо использовать, и пробел становится обязательным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом коде происходит то же самое: <code>loop(...)<\/code> воспринимается компилятором как вызов функции.<\/span> <span class=\"sg\" data-s=\"1\">Добавьте пробел, чтобы решить проблему.<\/span> <span class=\"sg\" data-s=\"2\">Или лучше перепишите фрагмент, используя <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заключение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Итог: чтобы избежать таких проблем, не добавляйте пробел между именем функции и скобками с аргументами функции и старайтесь избегать скобок, если это возможно, с другими конструкциями языка, такими как управляющие конструкции.<\/span><\/p>"]]},"uk":{"t":"Зверніть увагу на пробіли","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Використання функцій у Raku здебільшого інтуїтивне і не викликає проблем, але ви повинні бути попереджені про наступний аспект.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коротко<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не додавайте пробіл між назвою функції та дужками з її аргументами.<\/span> <span class=\"sg\" data-s=\"1\">Але використовуйте пробіл після <code>for<\/code> та <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Детально<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Візьмемо просту функцію:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перш за все, зверніть увагу на відсутність пробілів між назвою функції та відкриваючими дужками, які містять параметри.<\/span> <span class=\"sg\" data-s=\"1\">Деякі стилі кодування в інших мовах можуть вимагати пробіл там.<\/span> <span class=\"sg\" data-s=\"2\">Raku це допускає, але це не практика, яку слід дотримуватися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На стороні виклику відсутність пробілу є важливою.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви викликаєте функцію і опускаєте дужки, то пробіл після назви функції є неминучим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але якщо ви додаєте дужки, то не можна мати пробіл перед ними.<\/span> <span class=\"sg\" data-s=\"1\">Це правильний виклик:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А цей виклик неправильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такий код викликає виняток:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku бачить виклик з пробілом <code>f (5, 6)<\/code> як спробу передати один аргумент <code>(5, 6)<\/code> до функції.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете легко перевірити тип цього аргументу, якщо перепишете функцію так, щоб вона приймала лише один аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, виклик <code>f (5, 6)<\/code> означає, що ми передаємо <a href=\"https://course.raku.org/uk/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">список<\/a> до функції.<\/span> <span class=\"sg\" data-s=\"1\">Список як єдину сутність.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коли потрібен пробіл<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У деяких випадках пробіл необхідний.<\/span> <span class=\"sg\" data-s=\"1\">Це відбувається, коли ви використовуєте дужки з одним із ключових слів, таких як <code>if<\/code> або <code>for<\/code> або <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Наступний код неправильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повідомлення про помилку пояснює, що не так:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У випадку з <code>if<\/code>, дужки взагалі не потрібні, тому проблема не виникає, якщо ви їх не використовуєте.<\/span> <span class=\"sg\" data-s=\"1\">Але в деяких випадках, як, наприклад, з <code>loop<\/code>, вам потрібно мати їх, і пробіл стає обов'язковим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому коді відбувається те ж саме: <code>loop(...)<\/code> розуміється компілятором як виклик функції.<\/span> <span class=\"sg\" data-s=\"1\">Додайте пробіл, щоб вирішити проблему.<\/span> <span class=\"sg\" data-s=\"2\">Або краще перепишіть фрагмент, використовуючи <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Висновок<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Основна ідея: щоб уникнути таких проблем, не додавайте пробіл між назвою функції та дужками з аргументами функції і намагайтеся уникати дужок, якщо це можливо з іншими конструкціями мови, такими як керування потоком.<\/span><\/p>"]]},"bg":{"t":"Внимание към пространството","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Използването на функции в Raku е предимно интуитивно и не създава проблеми, но трябва да бъдете предупредени за следния аспект.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не добавяйте интервал между името на функцията и скобите с нейните аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Но използвайте интервал след <code>for<\/code> и <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дълга история<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека вземем една проста функция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Първо, обърнете внимание на отсъствието на интервали между името на функцията и отварящите скоби, които съдържат параметрите.<\/span> <span class=\"sg\" data-s=\"1\">Някои стилове на кодиране в други езици може да изискват интервал там.<\/span> <span class=\"sg\" data-s=\"2\">Raku е добре с това, но това не е практика, която да следвате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">От страната на извикването, отсъствието на интервал е важно.<\/span> <span class=\"sg\" data-s=\"1\">Ако извикате функцията и пропуснете скобите, тогава интервалът след името на функцията е неизбежен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но ако добавите скоби, не можете да имате интервал преди тях.<\/span> <span class=\"sg\" data-s=\"1\">Това е правилното извикване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А това извикване е грешно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такъв код предизвиква изключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku вижда извикването с интервал <code>f (5, 6)<\/code> като опит да се предаде един аргумент <code>(5, 6)<\/code> на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Можете лесно да проверите типа на този аргумент, ако пренапишете функцията да приема само един аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така че, извикването <code>f (5, 6)<\/code> означава, че предаваме <a href=\"https://course.raku.org/bg/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">списък<\/a> на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Списък като единична същност.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Кога е нужен интервал<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В някои случаи, интервалът е необходим.<\/span> <span class=\"sg\" data-s=\"1\">Това се случва, когато използвате скоби с една от ключовите думи, като <code>if<\/code> или <code>for<\/code> или <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следният код е грешен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съобщението за грешка обяснява какво не е наред:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В случая с <code>if<\/code>, скобите изобщо не са необходими, така че проблемът няма шанс да се появи, ако не ги използвате.<\/span> <span class=\"sg\" data-s=\"1\">Но в някои случаи, като например с <code>loop<\/code>, трябва да ги имате, и интервалът става задължителен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В този код се случва същото: <code>loop(...)<\/code> се разбира от компилатора като извикване на функция.<\/span> <span class=\"sg\" data-s=\"1\">Добавете интервал, за да разрешите проблема.<\/span> <span class=\"sg\" data-s=\"2\">Или по-добре пренапишете фрагмента, използвайки <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заключение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В крайна сметка: за да избегнете такива проблеми, не добавяйте интервал между името на функцията и скобите с аргументите на функцията и се опитайте да избягвате скобите, ако това е възможно с други конструкции на езика като контролен поток.<\/span><\/p>"]]},"eo":{"t":"Atentu la spacon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Uzi funkciojn en Raku estas plejparte intuicia kaj ne kaŭzas problemojn, sed vi devas esti avertita pri la sekva aspekto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne aldonu spacon inter la nomo de la funkcio kaj la parentezoj kun ĝiaj argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Sed uzu spacon post <code>for<\/code> kaj <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longa rakonto<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prenu simplan funkcion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unue, rimarku la mankon de spacoj inter la nomo de la funkcio kaj la malfermaj parentezoj kiuj enhavas la parametrojn.<\/span> <span class=\"sg\" data-s=\"1\">Iuj kodstiloj en aliaj lingvoj povas postuli spacon tie.<\/span> <span class=\"sg\" data-s=\"2\">Raku estas bone kun tio, sed ĉi tio ne estas praktiko por sekvi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sur la voka flanko, la manko de spaco estas grava.<\/span> <span class=\"sg\" data-s=\"1\">Se vi vokas la funkcion kaj preterlasas la parentezojn, tiam la spaco post la nomo de la funkcio estas neevitebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed se vi aldonas parentezojn, vi ne povas havi spacon antaŭ ili.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas ĝusta voko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj ĉi tiu voko estas malĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tia kodo kaŭzas escepton:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tro malmultaj poziciaj pasis; atendis 2 argumentojn sed ricevis 1       sub f ĉe t.raku linio 1       en bloko &lt;unit&gt; ĉe t.raku linio 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku vidas la vokon kun spaco <code>f (5, 6)<\/code> kiel provon pasi unuopan argumenton <code>(5, 6)<\/code> al la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas facile kontroli la tipon de ĉi tiu argumento se vi reskribas la funkcion por akcepti nur unu argumenton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do, voki <code>f (5, 6)<\/code> signifas ke ni pasas <a href=\"https://course.raku.org/eo/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">liston<\/a> al la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La listo kiel ununura ento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kiam spaco estas bezonata<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En iuj kazoj, la spacokaraktero estas bezonata.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas kiam vi uzas parentezojn kun unu el la ŝlosilvortoj, kiel <code>if<\/code> aŭ <code>for<\/code> aŭ <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La sekva kodo estas malĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La erarmesaĝo klarigas kio estas malĝusta:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===PARDONU!===     La vorto 'if' estas interpretita kiel 'if()' funkciovoko.<\/span> <span class=\"sg\" data-s=\"1\">Bonvolu uzi     blankspacon anstataŭ parentezoj.     ĉe /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Neatendita bloko en infiksa pozicio (du terminoj en vico)     ĉe /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun la kazo de <code>if<\/code>, parentezoj tute ne estas postulataj, do la problemo ne havas ŝancon aperi se vi ne uzas ilin.<\/span> <span class=\"sg\" data-s=\"1\">Sed en iuj kazoj, kiel ekzemple kun <code>loop<\/code>, vi bezonas ilin, kaj la spaco fariĝas deviga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu kodo, la sama afero okazas: <code>loop(...)<\/code> estas komprenata de la kompililo kiel funkciovoko.<\/span> <span class=\"sg\" data-s=\"1\">Aldonu spacon por solvi la problemon.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ pli bone reskribu la fragmenton uzante <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konkludo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La esenco: por eviti tiajn problemojn, ne aldonu spacon inter la nomo de la funkcio kaj la parentezoj kun la argumentoj de la funkcio kaj provu eviti parentezojn se tio eblas kun aliaj lingvokonstruoj kiel kontrolfluo.<\/span><\/p>"]]},"la":{"t":"Cave spatium","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Usus functionum in Raku plerumque intuitivus est et nullas difficultates affert, sed de sequenti aspectu monendus es.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noli addere spatium inter nomen functionis et parenthesin cum argumentis eius.<\/span> <span class=\"sg\" data-s=\"1\">Sed utere spatio post <code>for<\/code> et <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longa fabula<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simplicem functionem accipiamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Primum omnium, nota absentiam spatii inter nomen functionis et parenthesin apertam quae parametros continet.<\/span> <span class=\"sg\" data-s=\"1\">Aliquae styli codicis in aliis linguis spatium ibi requirere possunt.<\/span> <span class=\"sg\" data-s=\"2\">Raku hoc admittit, sed non est praxis sequenda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In parte vocandi, absentia spatii est momenti.<\/span> <span class=\"sg\" data-s=\"1\">Si functionem vocas et parenthesin omittis, tunc spatium post nomen functionis inevitabile est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed si parenthesin addis, non potes habere spatium ante eas.<\/span> <span class=\"sg\" data-s=\"1\">Haec est vocatio correcta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et haec vocatio est falsa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Talis codex exceptionem causat:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku videt vocationem cum spatio <code>f (5, 6)<\/code> ut conatum tradendi unum argumentum <code>(5, 6)<\/code> functioni.<\/span> <span class=\"sg\" data-s=\"1\">Facile potes typum huius argumenti explorare si functionem rescribas ut solum unum argumentum accipiat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque, vocatio <code>f (5, 6)<\/code> significat nos tradere <a href=\"https://course.raku.org/la/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">indicem<\/a> functioni.<\/span> <span class=\"sg\" data-s=\"1\">Index ut una entitas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando spatium necessarium est<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In aliquibus casibus, character spatii necessarius est.<\/span> <span class=\"sg\" data-s=\"1\">Id fit cum uteris parenthesin cum uno ex verbis clavibus, ut <code>if<\/code> vel <code>for<\/code> vel <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sequens codex est falsus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nuntius erroris explicat quid sit falsum:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In casu <code>if<\/code>, parenthesin omnino non requiruntur, ita problema nullas occasiones habet apparendi si non uteris eis.<\/span> <span class=\"sg\" data-s=\"1\">Sed in aliquibus casibus, ut, exempli gratia, cum <code>loop<\/code>, necesse est eas habere, et spatium fit mandatorius:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In hoc codice, idem fit: <code>loop(...)<\/code> a compilatore intellegitur ut vocatio functionis.<\/span> <span class=\"sg\" data-s=\"1\">Addere spatium ad solvendum problema.<\/span> <span class=\"sg\" data-s=\"2\">Vel melius rescribe fragmentum utendo <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Conclusio: ut tales quaestiones evites, noli addere spatium inter nomen functionis et parenthesin cum argumentis functionis et conare evitare parenthesin si possibile est cum aliis structuris linguae ut fluxus imperii.<\/span><\/p>"]]}}}</script>
