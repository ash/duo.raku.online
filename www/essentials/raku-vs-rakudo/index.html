<script type="application/json" id="page-data">{"u":"essentials/raku-vs-rakudo","n":3,"k":"section","pv":"essentials/what-is-raku","nx":"essentials/the-rakudo-compiler","tr":["essentials"],"L":{"en":{"t":"Raku vs. Rakudo and Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is the name of the programming language, while a <strong>compiler<\/strong> is the program that reads your code and runs it.<\/span> <span class=\"sg\" data-s=\"1\">Raku is not tied to a single compiler: this course uses <strong>Rakudo<\/strong>, the established and most complete one, and there is also a newer compiler called <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The design of Raku does not dictate which compiler to use.<\/span> <span class=\"sg\" data-s=\"1\">The design documents come with a set of test cases called Roast; anyone can write a compiler, and if it passes those tests, it is a Raku compiler.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">For a long time Rakudo was the only mature implementation, but that is no longer the case.<\/span> <span class=\"sg\" data-s=\"1\">In July 2026 a second compiler appeared — <strong>Raku++<\/strong> (its executable is called <code>rakupp<\/code>), written in C++.<\/span> <span class=\"sg\" data-s=\"2\">It is young and does not yet cover the whole language, but it already passes a large part of the Roast suite and starts up remarkably fast.<\/span> <span class=\"sg\" data-s=\"3\">This course uses Rakudo for its examples, yet what you are learning is the Raku language itself, and much of it runs unchanged on Raku++ too.<\/span> <span class=\"sg\" data-s=\"4\">The following pages look at each compiler — Rakudo and Raku++ — in turn, and how to install them.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">External links<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ on GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"de":{"t":"Raku, Rakudo und Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ist der Name der Programmiersprache, während ein <strong>Compiler<\/strong> das Programm ist, das Ihren Code liest und ausführt.<\/span> <span class=\"sg\" data-s=\"1\">Raku ist nicht an einen einzigen Compiler gebunden: Dieser Kurs verwendet <strong>Rakudo<\/strong>, den etablierten und vollständigsten, und daneben gibt es einen neueren Compiler namens <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als ein Compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Entwurf von Raku schreibt nicht vor, welchen Compiler man verwenden soll.<\/span> <span class=\"sg\" data-s=\"1\">Zu den Entwurfsdokumenten gehört eine Sammlung von Testfällen namens Roast; jeder kann einen Compiler schreiben, und wenn er diese Tests besteht, ist er ein Raku-Compiler.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lange Zeit war Rakudo die einzige ausgereifte Implementierung, doch das ist nicht mehr so.<\/span> <span class=\"sg\" data-s=\"1\">Im Juli 2026 erschien ein zweiter Compiler — <strong>Raku++<\/strong> (sein ausführbares Programm heißt <code>rakupp<\/code>), geschrieben in C++.<\/span> <span class=\"sg\" data-s=\"2\">Er ist jung und deckt die Sprache noch nicht vollständig ab, besteht aber bereits einen großen Teil der Roast-Sammlung und startet bemerkenswert schnell.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Kurs verwendet Rakudo für seine Beispiele, doch was Sie lernen, ist die Sprache Raku selbst, und vieles davon läuft unverändert auch auf Raku++.<\/span> <span class=\"sg\" data-s=\"4\">Die folgenden Seiten betrachten die beiden Compiler — Rakudo und Raku++ — nacheinander und zeigen, wie man sie installiert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe Links<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ auf GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"Raku, Rakudo en Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is de naam van de programmeertaal, terwijl een <strong>compiler<\/strong> het programma is dat je code leest en uitvoert.<\/span> <span class=\"sg\" data-s=\"1\">Raku is niet aan één compiler gebonden: deze cursus gebruikt <strong>Rakudo<\/strong>, de gevestigde en meest volledige, en daarnaast bestaat er een nieuwere compiler die <strong>Raku++<\/strong> heet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het ontwerp van Raku schrijft niet voor welke compiler je moet gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Bij de ontwerpdocumenten hoort een verzameling testgevallen genaamd Roast; iedereen mag een compiler schrijven, en slaagt die voor die tests, dan is het een Raku-compiler.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lange tijd was Rakudo de enige volwassen implementatie, maar dat is niet langer zo.<\/span> <span class=\"sg\" data-s=\"1\">In juli 2026 verscheen een tweede compiler — <strong>Raku++<\/strong> (het uitvoerbare bestand heet <code>rakupp<\/code>), geschreven in C++.<\/span> <span class=\"sg\" data-s=\"2\">Hij is jong en dekt de taal nog niet helemaal, maar slaagt al voor een groot deel van de Roast-suite en start opmerkelijk snel.<\/span> <span class=\"sg\" data-s=\"3\">Deze cursus gebruikt Rakudo voor de voorbeelden, maar wat je leert is de taal Raku zelf, en veel daarvan draait ongewijzigd ook op Raku++.<\/span> <span class=\"sg\" data-s=\"4\">De volgende pagina's bekijken beide compilers — Rakudo en Raku++ — om de beurt, en hoe je ze installeert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe links<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ op GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"Raku, Rakudo y Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> es el nombre del lenguaje de programación, mientras que un <strong>compilador<\/strong> es el programa que lee su código y lo ejecuta.<\/span> <span class=\"sg\" data-s=\"1\">Raku no está atado a un único compilador: este curso usa <strong>Rakudo<\/strong>, el consolidado y más completo, y además existe un compilador más reciente llamado <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de un compilador<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El diseño de Raku no impone qué compilador usar.<\/span> <span class=\"sg\" data-s=\"1\">Los documentos de diseño vienen con un conjunto de casos de prueba llamado Roast; cualquiera puede escribir un compilador y, si pasa esas pruebas, es un compilador de Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Durante mucho tiempo Rakudo fue la única implementación madura, pero eso ya no es así.<\/span> <span class=\"sg\" data-s=\"1\">En julio de 2026 apareció un segundo compilador — <strong>Raku++<\/strong> (su ejecutable se llama <code>rakupp<\/code>), escrito en C++.<\/span> <span class=\"sg\" data-s=\"2\">Es joven y todavía no cubre todo el lenguaje, pero ya pasa buena parte de la suite Roast y arranca notablemente rápido.<\/span> <span class=\"sg\" data-s=\"3\">Este curso usa Rakudo para sus ejemplos, pero lo que usted está aprendiendo es el lenguaje Raku en sí, y mucho de ello se ejecuta sin cambios también en Raku++.<\/span> <span class=\"sg\" data-s=\"4\">Las páginas siguientes examinan cada compilador — Rakudo y Raku++ — por turno, y cómo instalarlos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enlaces externos<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Raku, Rakudo e Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> è il nome del linguaggio di programmazione, mentre un <strong>compilatore<\/strong> è il programma che legge il vostro codice e lo esegue.<\/span> <span class=\"sg\" data-s=\"1\">Raku non è legato a un solo compilatore: questo corso usa <strong>Rakudo<\/strong>, il più consolidato e completo, e ne esiste anche uno più recente chiamato <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di un compilatore<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La progettazione di Raku non impone quale compilatore usare.<\/span> <span class=\"sg\" data-s=\"1\">Ai documenti di progetto è allegata una serie di casi di test chiamata Roast; chiunque può scrivere un compilatore e, se supera quei test, è un compilatore Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per molto tempo Rakudo è stato l'unica implementazione matura, ma non è più così.<\/span> <span class=\"sg\" data-s=\"1\">Nel luglio 2026 è comparso un secondo compilatore — <strong>Raku++<\/strong> (il suo eseguibile si chiama <code>rakupp<\/code>), scritto in C++.<\/span> <span class=\"sg\" data-s=\"2\">È giovane e non copre ancora l'intero linguaggio, ma supera già gran parte della suite Roast e si avvia straordinariamente in fretta.<\/span> <span class=\"sg\" data-s=\"3\">Questo corso usa Rakudo per i suoi esempi, ma ciò che state imparando è il linguaggio Raku stesso, e buona parte di esso gira immutata anche su Raku++.<\/span> <span class=\"sg\" data-s=\"4\">Le pagine seguenti esaminano i due compilatori — Rakudo e Raku++ — uno alla volta, e come installarli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Collegamenti esterni<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Raku, Rakudo un Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ir programmēšanas valodas nosaukums, savukārt <strong>kompilators<\/strong> ir programma, kas nolasa jūsu kodu un izpilda to.<\/span> <span class=\"sg\" data-s=\"1\">Raku nav piesaistīts vienam kompilatoram: šajā kursā tiek lietots <strong>Rakudo<\/strong>, nostiprinājies un vispilnīgākais no tiem, un bez tā ir arī jaunāks kompilators <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viens kompilators<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku uzbūve nenosaka, kurš kompilators jālieto.<\/span> <span class=\"sg\" data-s=\"1\">Uzbūves dokumentiem līdzi nāk testu kopa Roast; kompilatoru var uzrakstīt jebkurš, un, ja tas iztur šos testus, tas ir Raku kompilators.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ilgu laiku Rakudo bija vienīgā nobriedusi īstenošana, taču tā vairs nav.<\/span> <span class=\"sg\" data-s=\"1\">2026. gada jūlijā parādījās otrs kompilators — <strong>Raku++<\/strong> (tā izpildāmais fails saucas <code>rakupp<\/code>), rakstīts C++ valodā.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir jauns un vēl neaptver visu valodu, bet jau iztur lielu daļu Roast kopas un startē pārsteidzoši ātri.<\/span> <span class=\"sg\" data-s=\"3\">Šis kurss piemēros lieto Rakudo, tomēr jūs apgūstat pašu Raku valodu, un liela daļa no tā bez izmaiņām darbojas arī uz Raku++.<\/span> <span class=\"sg\" data-s=\"4\">Nākamajās lappusēs pēc kārtas aplūkosim abus kompilatorus — Rakudo un Raku++ — un to, kā tos uzstādīt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Raku, Rakudo и Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — это название языка программирования, а <strong>компилятор<\/strong> — это программа, которая читает ваш код и выполняет его.<\/span> <span class=\"sg\" data-s=\"1\">Raku не привязан к одному компилятору: в этом курсе используется <strong>Rakudo<\/strong>, устоявшийся и наиболее полный из них, а кроме него существует и более новый компилятор <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компиляторов может быть несколько<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не предписывает, каким компилятором пользоваться.<\/span> <span class=\"sg\" data-s=\"1\">К дизайн-документам прилагается набор тестов под названием Roast; написать компилятор может кто угодно, и если он проходит эти тесты, то это компилятор Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Долгое время Rakudo был единственной зрелой реализацией, но теперь это уже не так.<\/span> <span class=\"sg\" data-s=\"1\">В июле 2026 года появился второй компилятор — <strong>Raku++<\/strong> (его исполняемый файл называется <code>rakupp<\/code>), написанный на C++.<\/span> <span class=\"sg\" data-s=\"2\">Он молод и пока охватывает не весь язык, но уже проходит значительную часть набора Roast и запускается на удивление быстро.<\/span> <span class=\"sg\" data-s=\"3\">Примеры в этом курсе рассчитаны на Rakudo, однако вы изучаете сам язык Raku, и многое из этого без изменений работает и на Raku++.<\/span> <span class=\"sg\" data-s=\"4\">На следующих страницах мы по очереди рассмотрим каждый компилятор — Rakudo и Raku++ — и то, как их установить.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Raku, Rakudo та Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — це назва мови програмування, а <strong>компілятор<\/strong> — це програма, яка читає ваш код і виконує його.<\/span> <span class=\"sg\" data-s=\"1\">Raku не прив'язаний до одного компілятора: у цьому курсі використовується <strong>Rakudo<\/strong>, усталений і найповніший з них, а крім нього існує й новіший компілятор <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компіляторів може бути кілька<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не диктує, яким компілятором користуватися.<\/span> <span class=\"sg\" data-s=\"1\">До дизайн-документів додається набір тестів під назвою Roast; написати компілятор може будь-хто, і якщо він проходить ці тести, то це компілятор Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Довгий час Rakudo був єдиною зрілою реалізацією, але тепер це вже не так.<\/span> <span class=\"sg\" data-s=\"1\">У липні 2026 року з'явився другий компілятор — <strong>Raku++<\/strong> (його виконуваний файл називається <code>rakupp<\/code>), написаний на C++.<\/span> <span class=\"sg\" data-s=\"2\">Він молодий і поки що охоплює не всю мову, але вже проходить значну частину набору Roast і запускається напрочуд швидко.<\/span> <span class=\"sg\" data-s=\"3\">Приклади в цьому курсі розраховані на Rakudo, проте ви вивчаєте саму мову Raku, і багато що з цього без змін працює і на Raku++.<\/span> <span class=\"sg\" data-s=\"4\">Наступні сторінки по черзі розглядають кожен компілятор — Rakudo і Raku++ — та те, як їх встановити.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Raku, Rakudo и Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> е името на езика за програмиране, а <strong>компилатор<\/strong> е програмата, която чете вашия код и го изпълнява.<\/span> <span class=\"sg\" data-s=\"1\">Raku не е обвързан с един-единствен компилатор: този курс използва <strong>Rakudo<\/strong>, утвърденият и най-пълен от тях, а освен него съществува и по-нов компилатор, наречен <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от един компилатор<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайнът на Raku не предписва кой компилатор да се използва.<\/span> <span class=\"sg\" data-s=\"1\">Към документите за дизайна върви набор от тестове, наречен Roast; всеки може да напише компилатор и ако той минава тези тестове, това е компилатор на Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Дълго време Rakudo беше единствената зряла реализация, но вече не е така.<\/span> <span class=\"sg\" data-s=\"1\">През юли 2026 г. се появи втори компилатор — <strong>Raku++<\/strong> (изпълнимият му файл се казва <code>rakupp<\/code>), написан на C++.<\/span> <span class=\"sg\" data-s=\"2\">Той е млад и още не покрива целия език, но вече минава голяма част от набора Roast и стартира забележително бързо.<\/span> <span class=\"sg\" data-s=\"3\">Този курс използва Rakudo за примерите си, но това, което учите, е самият език Raku, и голяма част от него работи без промени и на Raku++.<\/span> <span class=\"sg\" data-s=\"4\">Следващите страници разглеждат поред всеки компилатор — Rakudo и Raku++ — и как да ги инсталирате.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Raku, Rakudo kaj Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> estas la nomo de la programlingvo, dum <strong>kompililo<\/strong> estas la programo, kiu legas vian kodon kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Raku ne estas ligita al unu sola kompililo: ĉi tiu kurso uzas <strong>Rakudo<\/strong>, la establitan kaj plej kompletan, kaj krome ekzistas pli nova kompililo nomata <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu kompililo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dezajno de Raku ne preskribas, kiun kompililon uzi.<\/span> <span class=\"sg\" data-s=\"1\">Al la dezajnaj dokumentoj apartenas aro da testoj nomata Roast; iu ajn povas verki kompililon, kaj se ĝi trapasas tiujn testojn, ĝi estas kompililo de Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Longan tempon Rakudo estis la sola matura realigo, sed tio ne plu validas.<\/span> <span class=\"sg\" data-s=\"1\">En julio 2026 aperis dua kompililo — <strong>Raku++<\/strong> (ĝia rulebla dosiero nomiĝas <code>rakupp<\/code>), verkita en C++.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas juna kaj ankoraŭ ne kovras la tutan lingvon, sed ĝi jam trapasas grandan parton de la testaro Roast kaj ekfunkcias rimarkinde rapide.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu kurso uzas Rakudo por siaj ekzemploj, tamen tio, kion vi lernas, estas la lingvo Raku mem, kaj multo el ĝi rulas senŝanĝe ankaŭ sur Raku++.<\/span> <span class=\"sg\" data-s=\"4\">La sekvaj paĝoj rigardas laŭvice ĉiun kompililon — Rakudo kaj Raku++ — kaj kiel instali ilin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ ĉe GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Raku, Rakudo et Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> nomen linguae programmandi est, <strong>compilator<\/strong> autem programma quod codicem tuum legit eumque exsequitur.<\/span> <span class=\"sg\" data-s=\"1\">Raku uni compilatori non alligatur: hic cursus <strong>Rakudo<\/strong> adhibet, firmatum atque plenissimum, et praeterea compilator recentior est cui nomen <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam unus compilator<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ratio linguae Raku non praescribit quo compilatore utendum sit.<\/span> <span class=\"sg\" data-s=\"1\">Documentis rationis adiungitur series probationum cui nomen Roast; compilatorem scribere cuivis licet, et si eas probationes transit, compilator Raku est.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Diu Rakudo sola implementatio matura fuit, sed id iam non ita est.<\/span> <span class=\"sg\" data-s=\"1\">Mense Iulio anni 2026 alter compilator apparuit — <strong>Raku++<\/strong> (cuius programma exsecutabile <code>rakupp<\/code> nominatur), in C++ scriptus.<\/span> <span class=\"sg\" data-s=\"2\">Iuvenis est nec totam linguam adhuc comprehendit, sed magnam iam partem seriei Roast transit atque mirabiliter celeriter incipit.<\/span> <span class=\"sg\" data-s=\"3\">Hic cursus in exemplis Rakudo adhibet; quod tamen discis ipsa lingua Raku est, cuius pleraque immutata etiam in Raku++ currunt.<\/span> <span class=\"sg\" data-s=\"4\">Paginae sequentes utrumque compilatorem — Rakudo et Raku++ — vicissim spectant, et quomodo eos installes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ in GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]}}}</script>
