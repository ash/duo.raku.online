<script type="application/json" id="page-data">{"u":"essentials/raku-vs-rakudo","n":3,"k":"section","pv":"essentials/what-is-raku","nx":"essentials/the-rakudo-compiler","tr":["essentials"],"L":{"en":{"t":"Raku vs. Rakudo, Raku++ and mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is the name of the programming language, while a <strong>compiler<\/strong> is the program that reads your code and runs it.<\/span> <span class=\"sg\" data-s=\"1\">Raku is not tied to a single compiler: this course uses <strong>Rakudo<\/strong>, the established one, and there are newer ones too — <strong>Raku++<\/strong> and <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The design of Raku does not dictate which compiler to use.<\/span> <span class=\"sg\" data-s=\"1\">The design documents come with a set of test cases called Roast; anyone can write a compiler, and if it passes those tests, it is a Raku compiler.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">For a long time Rakudo was the only mature implementation, but that is no longer the case.<\/span> <span class=\"sg\" data-s=\"1\">In July 2026 a second compiler appeared — <strong>Raku++<\/strong> (its executable is called <code>rakupp<\/code>), written in C++.<\/span> <span class=\"sg\" data-s=\"2\">Its version 5.4.1 passes the whole Roast suite, and it starts up remarkably fast.<\/span> <span class=\"sg\" data-s=\"3\">This course uses Rakudo for its examples, yet what you are learning is the Raku language itself, and almost all of it runs unchanged on Raku++ too.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There is a third implementation as well: <strong>mutsu<\/strong>, an interpreter written in Rust by Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">It compiles Raku to bytecode for a virtual machine of its own, and it also runs inside a web browser through WebAssembly — its website has a Raku tutorial and a playground built on it. mutsu is under active development and, in its author’s words, not yet suitable for production use, though it already passes nearly all of the Roast test files.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following pages look at each of the three in turn — Rakudo, Raku++ and mutsu — and how to install them.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">External links<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ on GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"de":{"t":"Raku, Rakudo, Raku++ und mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ist der Name der Programmiersprache, während ein <strong>Compiler<\/strong> das Programm ist, das Ihren Code liest und ausführt.<\/span> <span class=\"sg\" data-s=\"1\">Raku ist nicht an einen einzigen Compiler gebunden: Dieser Kurs verwendet <strong>Rakudo<\/strong>, den etablierten, und daneben gibt es auch neuere — <strong>Raku++<\/strong> und <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als ein Compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Entwurf von Raku schreibt nicht vor, welchen Compiler man verwenden soll.<\/span> <span class=\"sg\" data-s=\"1\">Zu den Entwurfsdokumenten gehört eine Sammlung von Testfällen namens Roast; jeder kann einen Compiler schreiben, und wenn er diese Tests besteht, ist er ein Raku-Compiler.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lange Zeit war Rakudo die einzige ausgereifte Implementierung, doch das ist nicht mehr so.<\/span> <span class=\"sg\" data-s=\"1\">Im Juli 2026 erschien ein zweiter Compiler — <strong>Raku++<\/strong> (sein ausführbares Programm heißt <code>rakupp<\/code>), geschrieben in C++.<\/span> <span class=\"sg\" data-s=\"2\">Seine Version 5.4.1 besteht die gesamte Roast-Sammlung, und er startet bemerkenswert schnell.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Kurs verwendet Rakudo für seine Beispiele, doch was Sie lernen, ist die Sprache Raku selbst, und fast alles davon läuft unverändert auch auf Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt außerdem eine dritte Implementierung: <strong>mutsu<\/strong>, einen in Rust geschriebenen Interpreter von Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Er übersetzt Raku in Bytecode für eine eigene virtuelle Maschine und läuft dank WebAssembly auch im Webbrowser — seine Website bietet ein Raku-Tutorial und einen Spielplatz, die darauf aufbauen. mutsu wird aktiv entwickelt und ist nach den Worten seines Autors noch nicht für den Produktiveinsatz geeignet, besteht aber bereits fast alle Roast-Testdateien.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Seiten betrachten alle drei nacheinander — Rakudo, Raku++ und mutsu — und zeigen, wie man sie installiert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe Links<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ auf GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"Raku, Rakudo, Raku++ en mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is de naam van de programmeertaal, terwijl een <strong>compiler<\/strong> het programma is dat je code leest en uitvoert.<\/span> <span class=\"sg\" data-s=\"1\">Raku is niet aan één compiler gebonden: deze cursus gebruikt <strong>Rakudo<\/strong>, de gevestigde, en daarnaast bestaan er ook nieuwere — <strong>Raku++<\/strong> en <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het ontwerp van Raku schrijft niet voor welke compiler je moet gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Bij de ontwerpdocumenten hoort een verzameling testgevallen genaamd Roast; iedereen mag een compiler schrijven, en slaagt die voor die tests, dan is het een Raku-compiler.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lange tijd was Rakudo de enige volwassen implementatie, maar dat is niet langer zo.<\/span> <span class=\"sg\" data-s=\"1\">In juli 2026 verscheen een tweede compiler — <strong>Raku++<\/strong> (het uitvoerbare bestand heet <code>rakupp<\/code>), geschreven in C++.<\/span> <span class=\"sg\" data-s=\"2\">Met versie 5.4.1 slaagt hij voor de volledige Roast-suite, en hij start opmerkelijk snel.<\/span> <span class=\"sg\" data-s=\"3\">Deze cursus gebruikt Rakudo voor de voorbeelden, maar wat je leert is de taal Raku zelf, en bijna alles daarvan draait ongewijzigd ook op Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er is ook nog een derde implementatie: <strong>mutsu<\/strong>, een interpreter in Rust, geschreven door Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Hij compileert Raku naar bytecode voor een eigen virtuele machine en draait via WebAssembly ook in een webbrowser — de website van mutsu heeft een Raku-tutorial en een speeltuin die daarop gebouwd zijn. mutsu wordt actief ontwikkeld en is volgens de auteur zelf nog niet geschikt voor productiegebruik, al slaagt hij nu al voor bijna alle testbestanden van Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende pagina's bekijken alle drie om de beurt — Rakudo, Raku++ en mutsu — en hoe je ze installeert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe links<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ op GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"Raku, Rakudo, Raku++ y mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> es el nombre del lenguaje de programación, mientras que un <strong>compilador<\/strong> es el programa que lee su código y lo ejecuta.<\/span> <span class=\"sg\" data-s=\"1\">Raku no está atado a un único compilador: este curso usa <strong>Rakudo<\/strong>, el consolidado, y también existen otros más recientes — <strong>Raku++<\/strong> y <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de un compilador<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El diseño de Raku no impone qué compilador usar.<\/span> <span class=\"sg\" data-s=\"1\">Los documentos de diseño vienen con un conjunto de casos de prueba llamado Roast; cualquiera puede escribir un compilador y, si pasa esas pruebas, es un compilador de Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Durante mucho tiempo Rakudo fue la única implementación madura, pero eso ya no es así.<\/span> <span class=\"sg\" data-s=\"1\">En julio de 2026 apareció un segundo compilador — <strong>Raku++<\/strong> (su ejecutable se llama <code>rakupp<\/code>), escrito en C++.<\/span> <span class=\"sg\" data-s=\"2\">Su versión 5.4.1 pasa la suite Roast completa, y arranca notablemente rápido.<\/span> <span class=\"sg\" data-s=\"3\">Este curso usa Rakudo para sus ejemplos, pero lo que usted está aprendiendo es el lenguaje Raku en sí, y casi todo ello se ejecuta sin cambios también en Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Existe además una tercera implementación: <strong>mutsu<\/strong>, un intérprete escrito en Rust por Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Compila Raku a bytecode para una máquina virtual propia, y también funciona dentro de un navegador web mediante WebAssembly — su sitio web ofrece un tutorial de Raku y un campo de pruebas construidos sobre él. mutsu está en pleno desarrollo y, en palabras de su autor, todavía no es apto para su uso en producción, aunque ya pasa casi todos los archivos de pruebas de Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las páginas siguientes examinan por turno cada uno de los tres — Rakudo, Raku++ y mutsu — y cómo instalarlos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enlaces externos<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Raku, Rakudo, Raku++ e mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> è il nome del linguaggio di programmazione, mentre un <strong>compilatore<\/strong> è il programma che legge il vostro codice e lo esegue.<\/span> <span class=\"sg\" data-s=\"1\">Raku non è legato a un solo compilatore: questo corso usa <strong>Rakudo<\/strong>, quello consolidato, e ne esistono anche di più recenti — <strong>Raku++<\/strong> e <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di un compilatore<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La progettazione di Raku non impone quale compilatore usare.<\/span> <span class=\"sg\" data-s=\"1\">Ai documenti di progetto è allegata una serie di casi di test chiamata Roast; chiunque può scrivere un compilatore e, se supera quei test, è un compilatore Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per molto tempo Rakudo è stato l'unica implementazione matura, ma non è più così.<\/span> <span class=\"sg\" data-s=\"1\">Nel luglio 2026 è comparso un secondo compilatore — <strong>Raku++<\/strong> (il suo eseguibile si chiama <code>rakupp<\/code>), scritto in C++.<\/span> <span class=\"sg\" data-s=\"2\">Con la versione 5.4.1 supera l'intera suite Roast, e si avvia straordinariamente in fretta.<\/span> <span class=\"sg\" data-s=\"3\">Questo corso usa Rakudo per i suoi esempi, ma ciò che state imparando è il linguaggio Raku stesso, e quasi tutto gira immutato anche su Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esiste anche una terza implementazione: <strong>mutsu<\/strong>, un interprete scritto in Rust da Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Compila Raku in bytecode per una propria macchina virtuale, e grazie a WebAssembly gira anche all'interno di un browser web — il suo sito offre un tutorial di Raku e un campo da gioco basati su di esso. mutsu è in fase di sviluppo attivo e, secondo le parole del suo autore, non è ancora adatto all'uso in produzione, anche se supera già quasi tutti i file di test di Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le pagine seguenti esaminano tutti e tre — Rakudo, Raku++ e mutsu — uno alla volta, e come installarli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Collegamenti esterni<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Raku, Rakudo, Raku++ un mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ir programmēšanas valodas nosaukums, savukārt <strong>kompilators<\/strong> ir programma, kas nolasa jūsu kodu un izpilda to.<\/span> <span class=\"sg\" data-s=\"1\">Raku nav piesaistīts vienam kompilatoram: šajā kursā tiek lietots <strong>Rakudo<\/strong>, nostiprinājies kompilators, un bez tā ir arī jaunāki — <strong>Raku++<\/strong> un <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viens kompilators<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku uzbūve nenosaka, kurš kompilators jālieto.<\/span> <span class=\"sg\" data-s=\"1\">Uzbūves dokumentiem līdzi nāk testu kopa Roast; kompilatoru var uzrakstīt jebkurš, un, ja tas iztur šos testus, tas ir Raku kompilators.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ilgu laiku Rakudo bija vienīgā nobriedusi īstenošana, taču tā vairs nav.<\/span> <span class=\"sg\" data-s=\"1\">2026. gada jūlijā parādījās otrs kompilators — <strong>Raku++<\/strong> (tā izpildāmais fails saucas <code>rakupp<\/code>), rakstīts C++ valodā.<\/span> <span class=\"sg\" data-s=\"2\">Tā versija 5.4.1 iztur visu Roast kopu, un tas startē pārsteidzoši ātri.<\/span> <span class=\"sg\" data-s=\"3\">Šis kurss piemēros lieto Rakudo, tomēr jūs apgūstat pašu Raku valodu, un gandrīz viss no tā bez izmaiņām darbojas arī uz Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir arī trešā īstenošana: <strong>mutsu<\/strong>, interpretators, ko Rust valodā uzrakstījis Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Tas kompilē Raku baitkodā savai virtuālajai mašīnai un ar WebAssembly palīdzību darbojas arī tīmekļa pārlūkprogrammā — projekta vietnē ir Raku pamācība un spēļu laukums, kas balstīti uz to. mutsu tiek aktīvi izstrādāts un, pēc paša autora vārdiem, vēl nav piemērots lietošanai produkcijas vidē, taču jau iztur gandrīz visus Roast testu failus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamajās lappusēs pēc kārtas aplūkosim visus trīs — Rakudo, Raku++ un mutsu — un to, kā tos uzstādīt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Raku, Rakudo, Raku++ и mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — это название языка программирования, а <strong>компилятор<\/strong> — это программа, которая читает ваш код и выполняет его.<\/span> <span class=\"sg\" data-s=\"1\">Raku не привязан к одному компилятору: в этом курсе используется <strong>Rakudo<\/strong>, устоявшийся компилятор, а кроме него существуют и более новые — <strong>Raku++<\/strong> и <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компиляторов может быть несколько<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не предписывает, каким компилятором пользоваться.<\/span> <span class=\"sg\" data-s=\"1\">К дизайн-документам прилагается набор тестов под названием Roast; написать компилятор может кто угодно, и если он проходит эти тесты, то это компилятор Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Долгое время Rakudo был единственной зрелой реализацией, но теперь это уже не так.<\/span> <span class=\"sg\" data-s=\"1\">В июле 2026 года появился второй компилятор — <strong>Raku++<\/strong> (его исполняемый файл называется <code>rakupp<\/code>), написанный на C++.<\/span> <span class=\"sg\" data-s=\"2\">Его версия 5.4.1 проходит весь набор Roast, а запускается он на удивление быстро.<\/span> <span class=\"sg\" data-s=\"3\">Примеры в этом курсе рассчитаны на Rakudo, однако вы изучаете сам язык Raku, и почти всё из этого без изменений работает и на Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть и третья реализация — <strong>mutsu<\/strong>, интерпретатор на Rust, который написал Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Этот интерпретатор компилирует Raku в байт-код для собственной виртуальной машины, а ещё работает прямо в веб-браузере благодаря WebAssembly — на его сайте есть учебник по Raku и песочница, построенные на нём. mutsu активно развивается и, по словам автора, пока не готов к промышленному использованию, хотя уже проходит почти все тестовые файлы Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На следующих страницах мы по очереди рассмотрим все три реализации — Rakudo, Raku++ и mutsu — и то, как их установить.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Raku, Rakudo, Raku++ та mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — це назва мови програмування, а <strong>компілятор<\/strong> — це програма, яка читає ваш код і виконує його.<\/span> <span class=\"sg\" data-s=\"1\">Raku не прив'язаний до одного компілятора: у цьому курсі використовується <strong>Rakudo<\/strong>, усталений компілятор, а крім нього існують і новіші — <strong>Raku++<\/strong> та <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компіляторів може бути кілька<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не диктує, яким компілятором користуватися.<\/span> <span class=\"sg\" data-s=\"1\">До дизайн-документів додається набір тестів під назвою Roast; написати компілятор може будь-хто, і якщо він проходить ці тести, то це компілятор Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Довгий час Rakudo був єдиною зрілою реалізацією, але тепер це вже не так.<\/span> <span class=\"sg\" data-s=\"1\">У липні 2026 року з'явився другий компілятор — <strong>Raku++<\/strong> (його виконуваний файл називається <code>rakupp<\/code>), написаний на C++.<\/span> <span class=\"sg\" data-s=\"2\">Його версія 5.4.1 проходить увесь набір Roast, а запускається він напрочуд швидко.<\/span> <span class=\"sg\" data-s=\"3\">Приклади в цьому курсі розраховані на Rakudo, проте ви вивчаєте саму мову Raku, і майже все з цього без змін працює і на Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Існує й третя реалізація — <strong>mutsu<\/strong>, інтерпретатор, написаний мовою Rust, автор якого — Токухіро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Цей інтерпретатор компілює Raku в байткод для власної віртуальної машини, а ще працює просто у веб-браузері завдяки WebAssembly — на його сайті є підручник з Raku і майданчик, побудовані на ньому. mutsu активно розробляється і, за словами автора, поки що не готовий до промислового використання, хоча вже проходить майже всі тестові файли Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні сторінки по черзі розглядають усі три реалізації — Rakudo, Raku++ і mutsu — та те, як їх встановити.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Raku, Rakudo, Raku++ и mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> е името на езика за програмиране, а <strong>компилатор<\/strong> е програмата, която чете вашия код и го изпълнява.<\/span> <span class=\"sg\" data-s=\"1\">Raku не е обвързан с един-единствен компилатор: този курс използва <strong>Rakudo<\/strong>, утвърдения компилатор, а освен него съществуват и по-нови — <strong>Raku++<\/strong> и <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от един компилатор<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайнът на Raku не предписва кой компилатор да се използва.<\/span> <span class=\"sg\" data-s=\"1\">Към документите за дизайна върви набор от тестове, наречен Roast; всеки може да напише компилатор и ако той минава тези тестове, това е компилатор на Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дълго време Rakudo беше единствената зряла реализация, но вече не е така.<\/span> <span class=\"sg\" data-s=\"1\">През юли 2026 г. се появи втори компилатор — <strong>Raku++<\/strong> (изпълнимият му файл се казва <code>rakupp<\/code>), написан на C++.<\/span> <span class=\"sg\" data-s=\"2\">Версията му 5.4.1 минава целия набор Roast, а самият той стартира забележително бързо.<\/span> <span class=\"sg\" data-s=\"3\">Този курс използва Rakudo за примерите си, но това, което учите, е самият език Raku, и почти всичко от него работи без промени и на Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има и трета реализация — <strong>mutsu<\/strong>, интерпретатор, написан на Rust от Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Този интерпретатор компилира Raku до байткод за собствена виртуална машина, а освен това работи и в уеб браузър чрез WebAssembly — на сайта му има ръководство по Raku и площадка, изградени върху него. mutsu се разработва активно и по думите на автора си още не е готов за употреба в продукционна среда, но вече минава почти всички тестови файлове на Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите страници разглеждат поред и трите реализации — Rakudo, Raku++ и mutsu — и как да ги инсталирате.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Raku, Rakudo, Raku++ kaj mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> estas la nomo de la programlingvo, dum <strong>kompililo<\/strong> estas la programo, kiu legas vian kodon kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Raku ne estas ligita al unu sola kompililo: ĉi tiu kurso uzas <strong>Rakudo<\/strong>, la establitan, kaj ekzistas ankaŭ pli novaj — <strong>Raku++<\/strong> kaj <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu kompililo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dezajno de Raku ne preskribas, kiun kompililon uzi.<\/span> <span class=\"sg\" data-s=\"1\">Al la dezajnaj dokumentoj apartenas aro da testoj nomata Roast; iu ajn povas verki kompililon, kaj se ĝi trapasas tiujn testojn, ĝi estas kompililo de Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Longan tempon Rakudo estis la sola matura realigo, sed tio ne plu validas.<\/span> <span class=\"sg\" data-s=\"1\">En julio 2026 aperis dua kompililo — <strong>Raku++<\/strong> (ĝia rulebla dosiero nomiĝas <code>rakupp<\/code>), verkita en C++.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia versio 5.4.1 trapasas la tutan testaron Roast, kaj ĝi ekfunkcias rimarkinde rapide.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu kurso uzas Rakudo por siaj ekzemploj, tamen tio, kion vi lernas, estas la lingvo Raku mem, kaj preskaŭ ĉio el ĝi rulas senŝanĝe ankaŭ sur Raku++.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ tria realigo: <strong>mutsu<\/strong>, interpretilo verkita en Rust de Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kompilas Raku al bajtkodo por sia propra virtuala maŝino, kaj ĝi rulas ankaŭ ene de retumilo per WebAssembly — ĝia retejo havas lernilon pri Raku kaj provejon konstruitajn sur ĝi. mutsu estas aktive disvolvata kaj, laŭ la vortoj de sia aŭtoro, ankoraŭ ne taŭgas por produktada uzo, tamen ĝi jam trapasas preskaŭ ĉiujn testodosierojn de Roast.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj paĝoj rigardas laŭvice ĉiun el la tri — Rakudo, Raku++ kaj mutsu — kaj kiel instali ilin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ ĉe GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Raku, Rakudo, Raku++ et mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> nomen linguae programmandi est, <strong>compilator<\/strong> autem programma quod codicem tuum legit eumque exsequitur.<\/span> <span class=\"sg\" data-s=\"1\">Raku uni compilatori non alligatur: hic cursus <strong>Rakudo<\/strong> adhibet, firmatum, sed sunt etiam recentiores — <strong>Raku++<\/strong> et <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam unus compilator<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ratio linguae Raku non praescribit quo compilatore utendum sit.<\/span> <span class=\"sg\" data-s=\"1\">Documentis rationis adiungitur series probationum cui nomen Roast; compilatorem scribere cuivis licet, et si eas probationes transit, compilator Raku est.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Diu Rakudo sola implementatio matura fuit, sed id iam non ita est.<\/span> <span class=\"sg\" data-s=\"1\">Mense Iulio anni 2026 alter compilator apparuit — <strong>Raku++<\/strong> (cuius programma exsecutabile <code>rakupp<\/code> nominatur), in C++ scriptus.<\/span> <span class=\"sg\" data-s=\"2\">Versio eius 5.4.1 totam seriem Roast transit, et ipse mirabiliter celeriter incipit.<\/span> <span class=\"sg\" data-s=\"3\">Hic cursus in exemplis Rakudo adhibet; quod tamen discis ipsa lingua Raku est, cuius paene omnia immutata etiam in Raku++ currunt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Est etiam tertia implementatio: <strong>mutsu<\/strong>, interpres in Rust a Tokuhiro Matsuno scriptus.<\/span> <span class=\"sg\" data-s=\"1\">Raku in bytecode pro machina virtuali propria compilat, atque etiam intra navigatrum interretiale per WebAssembly currit — situs eius interretialis institutionem Raku et palaestram super eum aedificatas praebet. mutsu adhuc strenue evolvitur et, auctoris sui verbis, nondum ad usum in productione aptus est, quamquam iam paene omnia archiva probationum Roast transit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Paginae sequentes singulos e tribus — Rakudo, Raku++ et mutsu — vicissim spectant, et quomodo eos installes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ in GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]}}}</script>
