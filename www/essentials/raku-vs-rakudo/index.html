<script type="application/json" id="page-data">{"u":"essentials/raku-vs-rakudo","n":3,"k":"section","pv":"essentials/what-is-raku","nx":"essentials/the-rakudo-compiler","tr":["essentials"],"L":{"en":{"t":"Raku vs. Rakudo and Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is the name of the programming language, while a <strong>compiler<\/strong> is the program that reads your code and runs it.<\/span> <span class=\"sg\" data-s=\"1\">Raku is not tied to a single compiler: this course uses <strong>Rakudo<\/strong>, the established and most complete one, and there is also a newer compiler called <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one compiler<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The design of Raku does not dictate which compiler to use.<\/span> <span class=\"sg\" data-s=\"1\">The design documents come with a set of test cases called Roast; anyone can write a compiler, and if it passes those tests, it is a Raku compiler.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">For a long time Rakudo was the only mature implementation, but that is no longer the case.<\/span> <span class=\"sg\" data-s=\"1\">In July 2026 a second compiler appeared — <strong>Raku++<\/strong> (its executable is called <code>rakupp<\/code>), written in C++.<\/span> <span class=\"sg\" data-s=\"2\">It is young and does not yet cover the whole language, but it already passes a large part of the Roast suite and starts up remarkably fast.<\/span> <span class=\"sg\" data-s=\"3\">This course uses Rakudo for its examples, yet what you are learning is the Raku language itself, and much of it runs unchanged on Raku++ too.<\/span> <span class=\"sg\" data-s=\"4\">The following pages look at each compiler — Rakudo and Raku++ — in turn, and how to install them.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">External links<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ on GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"de":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ist der Name der Programmiersprache, während <strong>Rakudo<\/strong> der Name des Compilers ist.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo ist der Compiler, den wir in diesem Kurs verwenden werden.<\/span> <span class=\"sg\" data-s=\"1\">Er verwendet eine virtuelle Maschine namens MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Diese wird automatisch mit installiert, wenn man Rakudo installiert.<\/span> <span class=\"sg\" data-s=\"3\">Es ist auch möglich, Rakudo auf anderen virtuellen Maschinen aufzubauen, aber in diesem Kurs werden wir nicht auf diese Unterschiede eingehen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere Compiler<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Design von Raku schreibt nicht vor, welchen Compiler man verwenden soll.<\/span> <span class=\"sg\" data-s=\"1\">Die Designdokumente enthalten eine Reihe von Testfällen namens Roast.<\/span> <span class=\"sg\" data-s=\"2\">Man kann seinen eigenen Compiler implementieren, und wenn er die Tests besteht, kann man ihn einen Raku-Compiler nennen.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo ist derzeit das fortschrittlichste und produktionsreifste Werkzeug.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe Links<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is de naam van de programmeertaal, terwijl <strong>Rakudo<\/strong> de naam van de compiler is.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo is de compiler die we in deze cursus gaan gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Het maakt gebruik van een virtuele machine genaamd MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Je krijgt deze automatisch bij het installeren van Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Het is ook mogelijk om Rakudo op andere virtuele machines te bouwen, maar in deze cursus zullen we niet ingaan op deze verschillen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere compilers<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het ontwerp van Raku schrijft niet voor welke compiler je moet gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">De ontwerpdocumenten bevatten een set testgevallen genaamd Roast.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt je eigen compiler implementeren, en als deze de tests doorstaat, mag je het een Raku-compiler noemen.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo is momenteel het meest geavanceerde en productieklare hulpmiddel.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe links<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> es el nombre del lenguaje de programación, mientras que <strong>Rakudo<\/strong> es el nombre del compilador.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo es el compilador que vamos a usar en este curso.<\/span> <span class=\"sg\" data-s=\"1\">Utiliza una máquina virtual llamada MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">La obtienes automáticamente al instalar Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">También es posible construir Rakudo sobre otras máquinas virtuales, pero en este curso no profundizaremos en estas diferencias.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otros compiladores<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El diseño de Raku no dicta qué compilador usar.<\/span> <span class=\"sg\" data-s=\"1\">Los documentos de diseño vienen con un conjunto de casos de prueba llamados Roast.<\/span> <span class=\"sg\" data-s=\"2\">Puedes implementar tu propio compilador, y si pasa las pruebas, puedes llamarlo un compilador de Raku.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo es actualmente la herramienta más avanzada y lista para producción.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enlaces externos<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> è il nome del linguaggio di programmazione, mentre <strong>Rakudo<\/strong> è il nome del compilatore.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo è il compilatore che useremo in questo corso.<\/span> <span class=\"sg\" data-s=\"1\">Utilizza una macchina virtuale chiamata MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">La ottieni automaticamente quando installi Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">È anche possibile costruire Rakudo su altre macchine virtuali, ma in questo corso non approfondiremo queste differenze.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri compilatori<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il design di Raku non impone quale compilatore utilizzare.<\/span> <span class=\"sg\" data-s=\"1\">I documenti di design includono una serie di casi di test chiamati Roast.<\/span> <span class=\"sg\" data-s=\"2\">Puoi implementare il tuo compilatore e, se supera i test, puoi chiamarlo un compilatore Raku.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo è attualmente lo strumento più avanzato e pronto per la produzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Link esterni<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ir programmēšanas valodas nosaukums, savukārt <strong>Rakudo<\/strong> ir kompilatora nosaukums.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo ir kompilators, kuru mēs izmantosim šajā kursā.<\/span> <span class=\"sg\" data-s=\"1\">Tas izmanto virtuālo mašīnu, ko sauc par MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to saņemat automātiski, instalējot Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Ir iespējams arī veidot Rakudo uz citām virtuālajām mašīnām, bet šajā kursā mēs neiedziļināsimies šajās atšķirībās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi kompilatori<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku dizains nenosaka, kuru kompilatoru izmantot.<\/span> <span class=\"sg\" data-s=\"1\">Dizaina dokumenti nāk ar testu kopu, ko sauc par Roast.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat izveidot savu kompilatoru, un, ja tas iztur testus, jūs varat to saukt par Raku kompilatoru.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo pašlaik ir visattīstītākais un ražošanai gatavais rīks.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Raku, Rakudo и Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — это название языка программирования, а <strong>компилятор<\/strong> — это программа, которая читает ваш код и выполняет его.<\/span> <span class=\"sg\" data-s=\"1\">Raku не привязан к одному компилятору: в этом курсе используется <strong>Rakudo<\/strong>, устоявшийся и наиболее полный из них, а кроме него существует и более новый компилятор <strong>Raku++<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компиляторов может быть несколько<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не предписывает, каким компилятором пользоваться.<\/span> <span class=\"sg\" data-s=\"1\">К дизайн-документам прилагается набор тестов под названием Roast; написать компилятор может кто угодно, и если он проходит эти тесты, то это компилятор Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Долгое время Rakudo был единственной зрелой реализацией, но теперь это уже не так.<\/span> <span class=\"sg\" data-s=\"1\">В июле 2026 года появился второй компилятор — <strong>Raku++<\/strong> (его исполняемый файл называется <code>rakupp<\/code>), написанный на C++.<\/span> <span class=\"sg\" data-s=\"2\">Он молод и пока охватывает не весь язык, но уже проходит значительную часть набора Roast и запускается на удивление быстро.<\/span> <span class=\"sg\" data-s=\"3\">Примеры в этом курсе рассчитаны на Rakudo, однако вы изучаете сам язык Raku, и многое из этого без изменений работает и на Raku++.<\/span> <span class=\"sg\" data-s=\"4\">На следующих страницах мы по очереди рассмотрим каждый компилятор — Rakudo и Raku++ — и то, как их установить.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["list",5,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Raku, Rakudo та Raku++","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — це назва мови програмування, тоді як <strong>Rakudo<\/strong> — це назва компілятора.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo — це компілятор, який ми будемо використовувати в цьому курсі.<\/span> <span class=\"sg\" data-s=\"1\">Він використовує віртуальну машину під назвою MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Ви отримаєте її автоматично при встановленні Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Також можливо побудувати Rakudo на інших віртуальних машинах, але в цьому курсі ми не будемо заглиблюватися в ці відмінності.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші компілятори<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не диктує, який компілятор використовувати.<\/span> <span class=\"sg\" data-s=\"1\">Дизайнерські документи містять набір тестових випадків під назвою Roast.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете реалізувати свій власний компілятор, і якщо він проходить тести, ви можете назвати його компілятором Raku.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo наразі є найрозвиненішим і готовим до використання інструментом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Raku срещу Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> е името на програмния език, докато <strong>Rakudo<\/strong> е името на компилатора.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo е компилаторът, който ще използваме в този курс.<\/span> <span class=\"sg\" data-s=\"1\">Той използва виртуална машина, наречена MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Получавате я автоматично при инсталиране на Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Възможно е също така да се изгради Rakudo върху други виртуални машини, но в този курс няма да се задълбочаваме в тези разлики.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други компилатори<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дизайнът на Raku не диктува кой компилатор да се използва.<\/span> <span class=\"sg\" data-s=\"1\">Дизайнерските документи идват с набор от тестови случаи, наречени Roast.<\/span> <span class=\"sg\" data-s=\"2\">Можете да имплементирате свой собствен компилатор и ако той премине тестовете, можете да го наречете Raku компилатор.<\/span> <span class=\"sg\" data-s=\"3\">В момента Rakudo е най-напредналият и готов за производство инструмент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> estas la nomo de la programlingvo, dum <strong>Rakudo<\/strong> estas la nomo de la kompililo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo estas la kompililo, kiun ni uzos en ĉi tiu kurso.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi uzas virtualan maŝinon nomatan MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Vi ricevas ĝin aŭtomate kiam vi instalas Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Eblas ankaŭ konstrui Rakudo sur aliaj virtualaj maŝinoj, sed en ĉi tiu kurso, ni ne enprofundiĝos en ĉi tiujn diferencojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj kompililoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La dezajno de Raku ne diktas kiun kompililon uzi.<\/span> <span class=\"sg\" data-s=\"1\">La dezajndokumentoj venas kun aro de testkazoj nomataj Roast.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas efektivigi vian propran kompililon, kaj se ĝi pasas la testojn, vi povas nomi ĝin Raku-kompililo.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo estas nuntempe la plej progresinta kaj produktad-preta ilo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Raku vs. Rakudo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> est nomen linguae programmandi, dum <strong>Rakudo<\/strong> est nomen compilatoris.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo est compilator quem in hoc cursu usuri sumus.<\/span> <span class=\"sg\" data-s=\"1\">Utiur machina virtuali nomine MoarVM.<\/span> <span class=\"sg\" data-s=\"2\">Hoc automatice accipis cum Rakudo installas.<\/span> <span class=\"sg\" data-s=\"3\">Etiam possibile est Rakudo super alias machinas virtuales aedificare, sed in hoc cursu has differentias non explorabimus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alii compilatores<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Consilium Raku non dictat quem compilatorem uti debeas.<\/span> <span class=\"sg\" data-s=\"1\">Documenta consilii cum serie casuum testium nomine Roast veniunt.<\/span> <span class=\"sg\" data-s=\"2\">Potes tuum compilatorem efficere, et si probationes superat, eum compilatorem Raku vocare potes.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo nunc est instrumentum maxime provectum et ad productionem paratum.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]}}}</script>
