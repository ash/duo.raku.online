<script type="application/json" id="page-data">{"u":"essentials/the-mutsu-interpreter","n":8,"k":"section","pv":"essentials/how-to-install-rakupp","nx":"essentials/how-to-install-mutsu","tr":["essentials"],"lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The mutsu interpreter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> is a third implementation of Raku, written in <strong>Rust<\/strong> by Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Like Rakudo, it compiles your program to bytecode and runs it on a virtual machine — but the virtual machine is its own, built into the <code>mutsu<\/code> executable, rather than MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu implements Raku 6.d and is under active development.<\/span> <span class=\"sg\" data-s=\"1\">Its author says plainly that it is not yet suitable for production use, but it already passes nearly all of the Roast test files, so almost all of the programs in this course run on it unchanged.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One gap matters while you are learning: some compile-time checks are still missing.<\/span> <span class=\"sg\" data-s=\"1\">Most visibly, as of version 0.24.0, mutsu does not report a variable you forgot to declare before the program runs, the way Rakudo and Raku++ do.<\/span> <span class=\"sg\" data-s=\"2\">When the course shows such an error message, try that example with one of the other two compilers.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in the browser<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu can also be compiled to WebAssembly, so it runs inside a web page.<\/span> <span class=\"sg\" data-s=\"1\">Its website, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, uses this for an introduction to Raku in English and Japanese, a hands-on tutorial, and a playground where you can run Raku without installing anything — everything on those pages is running mutsu itself.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modules<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu comes with its own copy of the zef package manager, called <code>mzef<\/code>, so Raku modules can be installed for it in the usual way, with <code>mzef install<\/code> followed by the module’s name.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Source code<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu is open source.<\/span> <span class=\"sg\" data-s=\"1\">You can find it, together with release builds and build instructions, at <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"de":{"t":"Der mutsu-Interpreter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> ist eine dritte Implementierung von Raku, von Tokuhiro Matsuno in <strong>Rust<\/strong> geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Wie Rakudo übersetzt er Ihr Programm in Bytecode und führt es auf einer virtuellen Maschine aus — doch das ist nicht MoarVM, sondern seine eigene virtuelle Maschine, die in die ausführbare Datei <code>mutsu<\/code> eingebaut ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu implementiert Raku 6.d und wird aktiv weiterentwickelt.<\/span> <span class=\"sg\" data-s=\"1\">Sein Autor sagt offen, dass mutsu noch nicht für den Produktiveinsatz geeignet ist, doch schon jetzt besteht er fast alle Roast-Testdateien, sodass fast alle Programme dieses Kurses unverändert darauf laufen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Lücke spielt beim Lernen eine Rolle: Einige Prüfungen zur Kompilierzeit fehlen noch.<\/span> <span class=\"sg\" data-s=\"1\">Am auffälligsten ist, dass mutsu mit Stand Version 0.24.0 eine Variable, die Sie zu deklarieren vergessen haben, nicht schon vor dem Start des Programms meldet, wie es Rakudo und Raku++ tun.<\/span> <span class=\"sg\" data-s=\"2\">Wenn der Kurs eine solche Fehlermeldung zeigt, probieren Sie das Beispiel mit einem der beiden anderen Compiler aus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku im Browser<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu lässt sich auch nach WebAssembly übersetzen und läuft so innerhalb einer Webseite.<\/span> <span class=\"sg\" data-s=\"1\">Seine Website, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, nutzt das für eine Einführung in Raku auf Englisch und Japanisch, ein Tutorial zum Mitmachen und einen Spielplatz, auf dem Sie Raku ausführen können, ohne etwas zu installieren — auf all diesen Seiten läuft mutsu selbst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Module<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu bringt eine eigene Kopie des Paketmanagers zef mit, die <code>mzef<\/code> heißt, sodass sich Raku-Module dafür auf die übliche Weise installieren lassen: mit <code>mzef install<\/code>, gefolgt vom Namen des Moduls.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellcode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu ist quelloffen.<\/span> <span class=\"sg\" data-s=\"1\">Sie finden ihn samt Release-Builds und Bauanleitung unter <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"nl":{"t":"De mutsu-interpreter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> is een derde implementatie van Raku, in <strong>Rust<\/strong> geschreven door Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Net als Rakudo compileert hij je programma naar bytecode en voert hij het uit op een virtuele machine — maar dat is niet MoarVM: het is een eigen virtuele machine, ingebouwd in het uitvoerbare bestand <code>mutsu<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu implementeert Raku 6.d en wordt actief ontwikkeld.<\/span> <span class=\"sg\" data-s=\"1\">De auteur zegt ronduit dat mutsu nog niet geschikt is voor productiegebruik, maar hij slaagt nu al voor bijna alle testbestanden van Roast, zodat bijna alle programma's in deze cursus er ongewijzigd op draaien.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén tekortkoming doet ertoe zolang je aan het leren bent: sommige controles tijdens het compileren ontbreken nog.<\/span> <span class=\"sg\" data-s=\"1\">Het meest in het oog springt dat mutsu in versie 0.24.0 een variabele die je vergeten bent te declareren niet al vóór het starten van het programma meldt, zoals Rakudo en Raku++ dat wel doen.<\/span> <span class=\"sg\" data-s=\"2\">Laat de cursus zo'n foutmelding zien, probeer dat voorbeeld dan met een van de twee andere compilers.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in de browser<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu kan ook naar WebAssembly worden gecompileerd, zodat hij binnen een webpagina draait.<\/span> <span class=\"sg\" data-s=\"1\">Zijn website, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, gebruikt dit voor een inleiding tot Raku in het Engels en het Japans, een praktische tutorial en een speeltuin waar je Raku kunt uitvoeren zonder iets te installeren — op al die pagina's draait mutsu zelf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modules<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu heeft een eigen kopie van de pakketbeheerder zef, <code>mzef<\/code> genaamd, zodat je er Raku-modules op de gebruikelijke manier voor kunt installeren: met <code>mzef install<\/code>, gevolgd door de naam van de module.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Broncode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu is open source.<\/span> <span class=\"sg\" data-s=\"1\">Je vindt hem, samen met kant-en-klare builds van de uitgaven en bouwinstructies, op <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"es":{"t":"El intérprete mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> es una tercera implementación de Raku, escrita en <strong>Rust<\/strong> por Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Igual que Rakudo, compila tu programa a bytecode y lo ejecuta en una máquina virtual — pero esa máquina virtual es propia, integrada en el ejecutable <code>mutsu<\/code>, en lugar de MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu implementa Raku 6.d y está en pleno desarrollo.<\/span> <span class=\"sg\" data-s=\"1\">Su autor dice claramente que todavía no es apto para su uso en producción, pero ya pasa casi todos los archivos de pruebas de Roast, así que casi todos los programas de este curso se ejecutan en él sin cambios.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay una carencia que importa mientras aprendes: todavía faltan algunas comprobaciones en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">Lo más visible es que, en la versión 0.24.0, mutsu no informa antes de ejecutar el programa de una variable que olvidaste declarar, como sí hacen Rakudo y Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Cuando el curso muestre un mensaje de error así, prueba ese ejemplo con uno de los otros dos compiladores.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku en el navegador<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu también puede compilarse a WebAssembly, de modo que funciona dentro de una página web.<\/span> <span class=\"sg\" data-s=\"1\">Su sitio web, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, lo aprovecha para ofrecer una introducción a Raku en inglés y en japonés, un tutorial práctico y un campo de pruebas donde puedes ejecutar Raku sin instalar nada — todo lo que hay en esas páginas lo ejecuta el propio mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Módulos<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu trae su propia copia del gestor de paquetes zef, llamada <code>mzef<\/code>, así que se le pueden instalar módulos de Raku de la manera habitual, con <code>mzef install<\/code> seguido del nombre del módulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu es de código abierto.<\/span> <span class=\"sg\" data-s=\"1\">Puedes encontrarlo, junto con los binarios de las versiones y las instrucciones de compilación, en <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"it":{"t":"L'interprete mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> è una terza implementazione di Raku, scritta in <strong>Rust<\/strong> da Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Come Rakudo, compila il tuo programma in bytecode e lo esegue su una macchina virtuale — ma non si tratta di MoarVM: la macchina virtuale è la sua, integrata nell'eseguibile <code>mutsu<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu implementa Raku 6.d ed è in fase di sviluppo attivo.<\/span> <span class=\"sg\" data-s=\"1\">Il suo autore dice chiaramente che non è ancora adatto all'uso in produzione, ma supera già quasi tutti i file di test di Roast, quindi quasi tutti i programmi di questo corso girano su di esso senza modifiche.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">C'è una lacuna che conta mentre stai imparando: mancano ancora alcuni controlli in fase di compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Il caso più evidente: nella versione 0.24.0, mutsu non segnala prima dell'esecuzione del programma una variabile che hai dimenticato di dichiarare, come invece fanno Rakudo e Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Quando il corso mostra un messaggio di errore di questo tipo, prova quell'esempio con uno degli altri due compilatori.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku nel browser<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu può anche essere compilato in WebAssembly, così da girare all'interno di una pagina web.<\/span> <span class=\"sg\" data-s=\"1\">Il suo sito, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, lo sfrutta per un'introduzione a Raku in inglese e in giapponese, un tutorial pratico e un campo da gioco dove puoi eseguire Raku senza installare nulla — in tutte quelle pagine gira mutsu stesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduli<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu ha una propria copia del gestore di pacchetti zef, chiamata <code>mzef<\/code>, quindi puoi installare i moduli Raku per esso nel modo consueto, con <code>mzef install<\/code> seguito dal nome del modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu è open source.<\/span> <span class=\"sg\" data-s=\"1\">Puoi trovarlo, insieme alle build delle release e alle istruzioni di compilazione, su <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"lv":{"t":"Interpretators mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> ir trešā Raku īstenošana, ko <strong>Rust<\/strong> valodā uzrakstījis Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā Rakudo, tas kompilē jūsu programmu baitkodā un izpilda to uz virtuālās mašīnas — taču tā nav MoarVM, bet paša mutsu virtuālā mašīna, kas iebūvēta izpildāmajā failā <code>mutsu<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu implementē Raku 6.d un tiek aktīvi izstrādāts.<\/span> <span class=\"sg\" data-s=\"1\">Tā autors atklāti saka, ka mutsu vēl nav piemērots lietošanai produkcijas vidē, taču tas jau iztur gandrīz visus Roast testu failus, tāpēc gandrīz visas šī kursa programmas uz tā darbojas bez izmaiņām.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mācoties nozīme ir vienam trūkumam: dažu kompilēšanas laika pārbaužu vēl nav.<\/span> <span class=\"sg\" data-s=\"1\">Visredzamākais piemērs: versijā 0.24.0 mutsu neziņo par mainīgo, ko aizmirsāt deklarēt, jau pirms programmas palaišanas, kā to dara Rakudo un Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Kad kurss rāda šādu kļūdas paziņojumu, izmēģiniet attiecīgo piemēru ar kādu no abiem pārējiem kompilatoriem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku pārlūkprogrammā<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu var arī kompilēt uz WebAssembly, tāpēc tas darbojas arī tīmekļa lappusē.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietne <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a> to izmanto Raku ievadam angļu un japāņu valodā, praktiskai pamācībai un spēļu laukumam, kurā varat palaist Raku bez jebkādas instalēšanas — visu šajās lappusēs darbina pats mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduļi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu nāk ar savu zef pakotņu pārvaldnieka kopiju, ko sauc <code>mzef<\/code>, tāpēc Raku moduļus tam var instalēt ierastajā veidā — ar <code>mzef install<\/code>, kam seko moduļa nosaukums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">To kopā ar izlaidumu būvējumiem un būvēšanas norādēm var atrast vietnē <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"ru":{"t":"Интерпретатор mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> — это третья реализация Raku, написанная Токухиро Мацуно на языке <strong>Rust<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Как и Rakudo, он компилирует вашу программу в байт-код и выполняет её на виртуальной машине, — но виртуальная машина у него собственная, встроенная в исполняемый файл <code>mutsu<\/code>, а не MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu реализует Raku 6.d и активно развивается.<\/span> <span class=\"sg\" data-s=\"1\">Его автор прямо говорит, что mutsu пока не готов к промышленному использованию, но он уже проходит почти все тестовые файлы Roast, так что почти все программы из этого курса работают на нём без изменений.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Во время обучения важен один пробел: некоторых проверок на этапе компиляции пока нет.<\/span> <span class=\"sg\" data-s=\"1\">Заметнее всего то, что в версии 0.24.0 mutsu не сообщает о переменной, которую вы забыли объявить, ещё до запуска программы, как это делают Rakudo и Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Когда в курсе показано такое сообщение об ошибке, попробуйте этот пример с одним из двух других компиляторов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku в браузере<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu можно скомпилировать и в WebAssembly, так что он работает прямо на веб-странице.<\/span> <span class=\"sg\" data-s=\"1\">Его сайт, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, использует это для введения в Raku на английском и японском языках, практического учебника и песочницы, где можно запускать Raku, ничего не устанавливая, — всё на этих страницах работает на самом mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модули<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместе с mutsu поставляется собственная копия менеджера пакетов zef под названием <code>mzef<\/code>, так что модули Raku можно устанавливать для него обычным способом — командой <code>mzef install<\/code>, за которой следует название модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Найти его вместе с готовыми сборками и инструкциями по сборке можно на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"uk":{"t":"Інтерпретатор mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> — це третя реалізація Raku, яку написав мовою <strong>Rust<\/strong> Токухіро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Як і Rakudo, він компілює вашу програму в байткод і виконує її на віртуальній машині, — але віртуальна машина в нього власна, вбудована у виконуваний файл <code>mutsu<\/code>, а не MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu реалізує Raku 6.d і активно розробляється.<\/span> <span class=\"sg\" data-s=\"1\">Його автор прямо каже, що mutsu поки що не готовий до промислового використання, але він уже проходить майже всі тестові файли Roast, тож майже всі програми з цього курсу працюють на ньому без змін.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Під час навчання важлива одна прогалина: деяких перевірок на етапі компіляції ще немає.<\/span> <span class=\"sg\" data-s=\"1\">Найпомітніше те, що у версії 0.24.0 mutsu не повідомляє про змінну, яку ви забули оголосити, ще до запуску програми, як це роблять Rakudo і Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Коли курс показує таке повідомлення про помилку, спробуйте цей приклад з одним із двох інших компіляторів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku у браузері<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu можна також скомпілювати у WebAssembly, тож він працює просто на веб-сторінці.<\/span> <span class=\"sg\" data-s=\"1\">Його сайт, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, використовує це для вступу до Raku англійською та японською мовами, практичного підручника й майданчика, де можна запускати Raku, нічого не встановлюючи, — усе на цих сторінках працює на самому mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модулі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu постачається з власною копією менеджера пакетів zef під назвою <code>mzef<\/code>, тож модулі Raku можна встановлювати для нього звичайним способом — командою <code>mzef install<\/code>, після якої йде назва модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Знайти його разом із готовими збірками випусків та інструкціями зі збирання можна на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"bg":{"t":"Интерпретаторът mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> е трета реализация на Raku, написана на <strong>Rust<\/strong> от Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Подобно на Rakudo, той компилира програмата ви до байткод и я изпълнява върху виртуална машина — но тази виртуална машина е негова собствена, вградена в изпълнимия файл <code>mutsu<\/code>, а не MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu реализира Raku 6.d и се разработва активно.<\/span> <span class=\"sg\" data-s=\"1\">Авторът му казва направо, че той още не е готов за употреба в продукционна среда, но вече минава почти всички тестови файлове на Roast, така че почти всички програми от този курс работят на него без промени.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Докато учите, един пропуск има значение: някои проверки по време на компилация все още липсват.<\/span> <span class=\"sg\" data-s=\"1\">Най-забележимото е, че към версия 0.24.0 mutsu не съобщава за променлива, която сте забравили да декларирате, още преди програмата да се изпълни, както правят Rakudo и Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Когато курсът показва такова съобщение за грешка, изпробвайте този пример с някой от другите два компилатора.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku в браузъра<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu може да бъде компилиран и до WebAssembly, така че работи вътре в уеб страница.<\/span> <span class=\"sg\" data-s=\"1\">Сайтът му, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, използва това за въведение в Raku на английски и японски, практическо ръководство и площадка, където можете да изпълнявате Raku, без да инсталирате нищо — всичко на тези страници се изпълнява от самия mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модули<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu идва със собствено копие на мениджъра на пакети zef, наречено <code>mzef<\/code>, така че модулите на Raku могат да се инсталират за него по обичайния начин — с <code>mzef install<\/code>, последвано от името на модула.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Ще го намерите заедно с готовите компилации на изданията и указанията за изграждане на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"eo":{"t":"La interpretilo mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> estas tria realigo de Raku, verkita en <strong>Rust<\/strong> de Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Same kiel Rakudo, ĝi kompilas vian programon al bajtkodo kaj rulas ĝin sur virtuala maŝino — sed la virtuala maŝino estas ĝia propra, enkonstruita en la ruleblan dosieron <code>mutsu<\/code>, anstataŭ MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu realigas Raku 6.d kaj estas aktive disvolvata.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia aŭtoro diras rekte, ke ĝi ankoraŭ ne taŭgas por produktada uzo, tamen ĝi jam trapasas preskaŭ ĉiujn testodosierojn de Roast, do preskaŭ ĉiuj programoj de ĉi tiu kurso rulas sur ĝi senŝanĝe.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu breĉo gravas dum vi lernas: kelkaj kompiltempaj kontroloj ankoraŭ mankas.<\/span> <span class=\"sg\" data-s=\"1\">Plej videble, ĉe versio 0.24.0 mutsu ne raportas variablon, kiun vi forgesis deklari, antaŭ ol la programo ruliĝas, kiel faras Rakudo kaj Raku++.<\/span> <span class=\"sg\" data-s=\"2\">Kiam la kurso montras tian erarmesaĝon, provu tiun ekzemplon per unu el la aliaj du kompililoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku en la retumilo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu povas ankaŭ esti kompilita al WebAssembly, do ĝi rulas ene de retpaĝo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia retejo, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, uzas tion por enkonduko al Raku en la angla kaj la japana, por praktika lernilo, kaj por provejo, kie vi povas ruli Raku sen instali ion ajn — ĉio en tiuj paĝoj rulas per mutsu mem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduloj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu venas kun sia propra kopio de la pakaĵadministrilo zef, nomata <code>mzef<\/code>, do oni povas instali Raku-modulojn por ĝi laŭ la kutima maniero, per <code>mzef install<\/code> sekvata de la nomo de la modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin, kune kun eldonaj binaraĵoj kaj konstruinstrukcioj, ĉe <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]},"la":{"t":"Interpres mutsu","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> est tertia implementatio Raku, in <strong>Rust<\/strong> a Tokuhiro Matsuno scripta.<\/span> <span class=\"sg\" data-s=\"1\">Sicut Rakudo, programma tuum in bytecode compilat et in machina virtuali exsequitur — sed machina virtualis eius propria est, in programmate exsecutabili <code>mutsu<\/code> inclusa, non MoarVM.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu Raku 6.d implet et adhuc strenue evolvitur.<\/span> <span class=\"sg\" data-s=\"1\">Auctor eius aperte dicit eum nondum ad usum in productione aptum esse, sed iam paene omnia archiva probationum Roast transit, itaque paene omnia programmata huius cursus immutata in eo currunt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unus defectus, dum discis, momenti est: quaedam examinationes tempore compilationis adhuc desunt.<\/span> <span class=\"sg\" data-s=\"1\">Maxime conspicue, in versione 0.24.0 mutsu variabilem quam declarare oblitus es non nuntiat antequam programma currit, sicut Rakudo et Raku++ faciunt.<\/span> <span class=\"sg\" data-s=\"2\">Cum cursus talem nuntium erroris ostendit, illud exemplum cum uno ex aliis duobus compilatoribus experire.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in navigatro interretiali<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu etiam in WebAssembly compilari potest, ita ut intra paginam interretialem currat.<\/span> <span class=\"sg\" data-s=\"1\">Situs eius interretialis, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, hoc adhibet ad introductionem in Raku Anglice et Iaponice scriptam, ad institutionem practicam, et ad palaestram ubi Raku exsequi potes nihil installans — omnia in illis paginis ipso mutsu currunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduli<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">mutsu propriam copiam instrumenti moderandi modulos zef secum affert, nomine <code>mzef<\/code>, ita ut moduli Raku ei more solito installari possint, per <code>mzef install<\/code> cum nomine moduli subsequente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">mutsu fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Eum, una cum binariis emissis et praeceptis aedificandi, invenies apud <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span><\/p>"]]}}}</script>
