<script type="application/json" id="page-data">{"u":"essentials/scalar-variables/identifiers","n":40,"k":"topic","pv":"essentials/scalar-variables/defined-or-operator","nx":"essentials/scalar-variables/identifiers/quiz","tr":["essentials","essentials/scalar-variables"],"L":{"en":{"t":"Variable names","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Before we move further, let us spend some time on an interesting topic of the allowed names of variables.<\/span> <span class=\"sg\" data-s=\"1\">So far we’ve seen simple names such as <code>$name<\/code> or <code>$age<\/code>, which fully consisted of lowercase letters of the English alphabet.<\/span> <span class=\"sg\" data-s=\"2\">But there are more possibilities.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Case sensitivity<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Names of the variables (or <em>identifiers<\/em>) are case sensitive.<\/span> <span class=\"sg\" data-s=\"1\">That means that all of the below names refer to different scalar containers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It is up to you to stick to a naming scheme, but you can probably reserve the all-capital names for constants.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Other characters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Among the ASCII characters, you can use digits, underscore character <code>_<\/code>, a hyphen <code>-<\/code>, and single quote (that stands for apostrophe) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Note that the first character of the identifier must be either a letter or an underscore.<\/span> <span class=\"sg\" data-s=\"2\">Both <code>-<\/code> and <code>'<\/code> must be followed by an alphabetic character.<\/span> <span class=\"sg\" data-s=\"3\">Here are a few more valid identifiers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Again, it is up to you to choose the names, but it is probably not a good practice to deliberately choose names that look cryptic.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode characters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The definition of letters and digits is actually extended to include all those characters that are considered letters and decimal digits according to their Unicode properties.<\/span> <span class=\"sg\" data-s=\"1\">For example, the next variables are valid in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # where ۲ is a digit<\/code><\/pre>"]]},"de":{"t":"Namen der Variablen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bevor wir weitergehen, lassen Sie uns etwas Zeit auf ein interessantes Thema der erlaubten Namen von Variablen verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Bisher haben wir einfache Namen wie <code>$name<\/code> oder <code>$age<\/code> gesehen, die vollständig aus Kleinbuchstaben des englischen Alphabets bestanden.<\/span> <span class=\"sg\" data-s=\"2\">Aber es gibt noch mehr Möglichkeiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Groß- und Kleinschreibung<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Namen der Variablen (oder <em>Bezeichner<\/em>) sind groß- und kleinschreibungssensitiv.<\/span> <span class=\"sg\" data-s=\"1\">Das bedeutet, dass alle unten stehenden Namen auf unterschiedliche skalare Container verweisen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es liegt an Ihnen, sich an ein Namensschema zu halten, aber Sie können wahrscheinlich die vollständig großgeschriebenen Namen für Konstanten reservieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere Zeichen<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unter den ASCII-Zeichen können Sie Ziffern, das Unterstrich-Zeichen <code>_<\/code>, einen Bindestrich <code>-<\/code> und das einfache Anführungszeichen (das für Apostroph steht) <code>'<\/code> verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, dass das erste Zeichen des Bezeichners entweder ein Buchstabe oder ein Unterstrich sein muss.<\/span> <span class=\"sg\" data-s=\"2\">Sowohl <code>-<\/code> als auch <code>'<\/code> müssen von einem alphabetischen Zeichen gefolgt werden.<\/span> <span class=\"sg\" data-s=\"3\">Hier sind ein paar weitere gültige Bezeichner:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auch hier liegt es an Ihnen, die Namen zu wählen, aber es ist wahrscheinlich keine gute Praxis, absichtlich Namen zu wählen, die kryptisch aussehen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-Zeichen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Definition von Buchstaben und Ziffern wird tatsächlich erweitert, um all jene Zeichen einzuschließen, die gemäß ihren Unicode-Eigenschaften als Buchstaben und Dezimalziffern gelten.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel sind die nächsten Variablen in Raku gültig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # wobei ۲ eine Ziffer ist<\/code><\/pre>"]]},"nl":{"t":"Namen van de variabelen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Voordat we verder gaan, laten we wat tijd besteden aan een interessant onderwerp: de toegestane namen van variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Tot nu toe hebben we eenvoudige namen gezien zoals <code>$name<\/code> of <code>$age<\/code>, die volledig bestonden uit kleine letters van het Engelse alfabet.<\/span> <span class=\"sg\" data-s=\"2\">Maar er zijn meer mogelijkheden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hoofdlettergevoeligheid<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Namen van de variabelen (of <em>identifiers<\/em>) zijn hoofdlettergevoelig.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat al de onderstaande namen verwijzen naar verschillende scalair containers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is aan jou om je aan een naamgevingsschema te houden, maar je kunt waarschijnlijk de volledig hoofdletter namen reserveren voor constanten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere tekens<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Onder de ASCII-tekens kun je cijfers, het onderstrepingsteken <code>_<\/code>, een koppelteken <code>-<\/code>, en een enkele aanhalingsteken (dat staat voor apostrof) <code>'<\/code> gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Let op dat het eerste teken van de identifier een letter of een onderstrepingsteken moet zijn.<\/span> <span class=\"sg\" data-s=\"2\">Zowel <code>-<\/code> als <code>'<\/code> moeten gevolgd worden door een alfabetisch teken.<\/span> <span class=\"sg\" data-s=\"3\">Hier zijn nog een paar geldige identifiers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nogmaals, het is aan jou om de namen te kiezen, maar het is waarschijnlijk geen goede praktijk om opzettelijk namen te kiezen die cryptisch lijken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode tekens<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De definitie van letters en cijfers is eigenlijk uitgebreid om al die tekens te omvatten die worden beschouwd als letters en decimale cijfers volgens hun Unicode-eigenschappen.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, de volgende variabelen zijn geldig in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # waarbij ۲ een cijfer is<\/code><\/pre>"]]},"es":{"t":"Nombres de las variables","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Antes de avanzar más, dediquemos un tiempo a un tema interesante sobre los nombres permitidos de las variables.<\/span> <span class=\"sg\" data-s=\"1\">Hasta ahora hemos visto nombres simples como <code>$name<\/code> o <code>$age<\/code>, que consistían completamente en letras minúsculas del alfabeto inglés.<\/span> <span class=\"sg\" data-s=\"2\">Pero hay más posibilidades.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sensibilidad a mayúsculas y minúsculas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los nombres de las variables (o <em>identificadores<\/em>) distinguen entre mayúsculas y minúsculas.<\/span> <span class=\"sg\" data-s=\"1\">Eso significa que todos los nombres a continuación se refieren a diferentes contenedores escalares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Depende de ti seguir un esquema de nombres, pero probablemente puedes reservar los nombres en mayúsculas para constantes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otros caracteres<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Entre los caracteres ASCII, puedes usar dígitos, el carácter de subrayado <code>_<\/code>, un guion <code>-<\/code> y comilla simple (que representa un apóstrofe) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ten en cuenta que el primer carácter del identificador debe ser una letra o un guion bajo.<\/span> <span class=\"sg\" data-s=\"2\">Tanto <code>-<\/code> como <code>'<\/code> deben ser seguidos por un carácter alfabético.<\/span> <span class=\"sg\" data-s=\"3\">Aquí hay algunos identificadores válidos más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nuevamente, depende de ti elegir los nombres, pero probablemente no sea una buena práctica elegir deliberadamente nombres que parezcan crípticos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caracteres Unicode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La definición de letras y dígitos se extiende en realidad para incluir todos aquellos caracteres que se consideran letras y dígitos decimales según sus propiedades Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, las siguientes variables son válidas en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # donde ۲ es un dígito<\/code><\/pre>"]]},"it":{"t":"Nomi delle variabili","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima di procedere oltre, dedichiamo un po' di tempo a un argomento interessante riguardante i nomi consentiti delle variabili.<\/span> <span class=\"sg\" data-s=\"1\">Finora abbiamo visto nomi semplici come <code>$name<\/code> o <code>$age<\/code>, che consistevano interamente di lettere minuscole dell'alfabeto inglese.<\/span> <span class=\"sg\" data-s=\"2\">Ma ci sono più possibilità.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sensibilità alle maiuscole<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I nomi delle variabili (o <em>identificatori<\/em>) sono sensibili alle maiuscole.<\/span> <span class=\"sg\" data-s=\"1\">Ciò significa che tutti i nomi seguenti si riferiscono a contenitori scalari diversi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sta a te aderire a uno schema di denominazione, ma probabilmente puoi riservare i nomi tutti in maiuscolo per le costanti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri caratteri<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tra i caratteri ASCII, puoi usare cifre, il carattere di sottolineatura <code>_<\/code>, un trattino <code>-<\/code> e l'apostrofo <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che il primo carattere dell'identificatore deve essere una lettera o una sottolineatura.<\/span> <span class=\"sg\" data-s=\"2\">Sia <code>-<\/code> che <code>'<\/code> devono essere seguiti da un carattere alfabetico.<\/span> <span class=\"sg\" data-s=\"3\">Ecco alcuni altri identificatori validi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ancora una volta, sta a te scegliere i nomi, ma probabilmente non è una buona pratica scegliere deliberatamente nomi che sembrano criptici.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caratteri Unicode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La definizione di lettere e cifre è effettivamente estesa per includere tutti quei caratteri che sono considerati lettere e cifre decimali secondo le loro proprietà Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, le seguenti variabili sono valide in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # dove ۲ è una cifra<\/code><\/pre>"]]},"lv":{"t":"Mainīgo nosaukumi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirms turpinām tālāk, pavadīsim nedaudz laika interesantajā tēmā par atļautajiem mainīgo nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Līdz šim mēs esam redzējuši vienkāršus nosaukumus, piemēram, <code>$name<\/code> vai <code>$age<\/code>, kas pilnībā sastāvēja no mazajiem burtiem angļu alfabētā.<\/span> <span class=\"sg\" data-s=\"2\">Bet ir arī citas iespējas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lielo un mazo burtu atšķirība<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgo (vai <em>identifikatoru<\/em>) nosaukumi ir reģistrjutīgi.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka visi zemāk minētie nosaukumi attiecas uz dažādiem skalāriem konteineriem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas ir atkarīgs no jums, kādu nosaukumu shēmu izmantot, bet jūs varat rezervēt visus lielos burtus konstantiem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi rakstzīmes<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Starp ASCII rakstzīmēm varat izmantot ciparus, apakšsvītru <code>_<\/code>, defisi <code>-<\/code> un vienpēdiņu (kas apzīmē apostrofu) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā, ka pirmajai identifikatora rakstzīmei jābūt vai nu burtam, vai apakšsvītrai.<\/span> <span class=\"sg\" data-s=\"2\">Gan <code>-<\/code>, gan <code>'<\/code> jāseko alfabētiskai rakstzīmei.<\/span> <span class=\"sg\" data-s=\"3\">Šeit ir daži citi derīgi identifikatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atkal, tas ir atkarīgs no jums, kādus nosaukumus izvēlēties, bet, iespējams, nav laba prakse apzināti izvēlēties nosaukumus, kas izskatās kriptiski.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode rakstzīmes<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Burtu un ciparu definīcija faktiski tiek paplašināta, lai iekļautu visas tās rakstzīmes, kas tiek uzskatītas par burtiem un decimālajiem cipariem saskaņā ar to Unicode īpašībām.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šie mainīgie ir derīgi Raku valodā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # kur ۲ ir cipars<\/code><\/pre>"]]},"ru":{"t":"Имена переменных","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Прежде чем мы двинемся дальше, давайте остановимся на интересной теме наименования переменных.<\/span> <span class=\"sg\" data-s=\"1\">Пока что мы использовали простые имена вроде <code>$name<\/code> или <code>$age<\/code>, которые полностью состоят из строчных букв английского алфавита.<\/span> <span class=\"sg\" data-s=\"2\">Но существует гораздо больше вариантов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Чувствительность к регистру<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Имена переменных (или <em>идентификаторов<\/em>) чувствительны к регистру.<\/span> <span class=\"sg\" data-s=\"1\">Это означает, что все имена ниже ссылаются на разные скалярные контейнеры:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Только вам решать, каким стилем пользоваться, но скорее всего вы можете оставить имена со всеми заглавными буквами для констант.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие символы<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Среди символов ASCII вы можете использовать цифры, нижнее подчеркивание <code>_<\/code>, дефис <code>-<\/code> и одиночную кавычку (которая означает апостроф) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Первым символом идентификатора обязательно должна быть буква или нижнее подчеркивание.<\/span> <span class=\"sg\" data-s=\"2\">За обеими символами <code>-<\/code> и <code>'<\/code> должна идти буква.<\/span> <span class=\"sg\" data-s=\"3\">Вот еще несколько правильных идентификаторов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опять же, только вам решать, какие имена выбирать переменным, но скорее всего выбирать трудночитаемые имена не самая лучшая практика.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На самом деле определение буквы и цифры включает в себя все символы, которые считаются буквами и десятичными цифрами согласно их свойствам Юникода.<\/span> <span class=\"sg\" data-s=\"1\">Например, в Raku возможны следующие переменные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # где ۲ это число<\/code><\/pre>"]]},"uk":{"t":"Імена змінних","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Перш ніж ми підемо далі, давайте витратимо трохи часу на цікаву тему дозволених імен змінних.<\/span> <span class=\"sg\" data-s=\"1\">Досі ми бачили прості імена, такі як <code>$name<\/code> або <code>$age<\/code>, які повністю складалися з малих літер англійського алфавіту.<\/span> <span class=\"sg\" data-s=\"2\">Але є й інші можливості.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Чутливість до регістру<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Імена змінних (або <em>ідентифікатори<\/em>) чутливі до регістру.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що всі наведені нижче імена відносяться до різних скалярних контейнерів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вам вирішувати, дотримуватись певної схеми іменування, але ви, ймовірно, можете зарезервувати імена з усіх великих літер для констант.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші символи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Серед символів ASCII ви можете використовувати цифри, символ підкреслення <code>_<\/code>, дефіс <code>-<\/code> та одинарну лапку (яка означає апостроф) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що перший символ ідентифікатора повинен бути або літерою, або підкресленням.<\/span> <span class=\"sg\" data-s=\"2\">І <code>-<\/code>, і <code>'<\/code> повинні слідувати за алфавітним символом.<\/span> <span class=\"sg\" data-s=\"3\">Ось ще кілька допустимих ідентифікаторів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Знову ж таки, вам вирішувати, які імена обирати, але, ймовірно, не є гарною практикою навмисно обирати імена, які виглядають криптичними.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікодні символи<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Визначення літер і цифр насправді розширено, щоб включати всі ті символи, які вважаються літерами та десятковими цифрами відповідно до їхніх властивостей Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, наступні змінні є допустимими в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # де ۲ є цифрою<\/code><\/pre>"]]},"bg":{"t":"Имена на променливите","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Преди да продължим напред, нека отделим малко време на интересната тема за позволените имена на променливи.<\/span> <span class=\"sg\" data-s=\"1\">Досега видяхме прости имена като <code>$name<\/code> или <code>$age<\/code>, които изцяло се състояха от малки букви на английската азбука.<\/span> <span class=\"sg\" data-s=\"2\">Но има и повече възможности.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Чувствителност към големи и малки букви<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Имената на променливите (или <em>идентификаторите<\/em>) са чувствителни към големи и малки букви.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че всички долупосочени имена се отнасят до различни скаларни контейнери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">От вас зависи да се придържате към схема за именуване, но вероятно можете да запазите имената с всички главни букви за константи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други символи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Сред ASCII символите можете да използвате цифри, символа за долна черта <code>_<\/code>, тире <code>-<\/code> и единична кавичка (която означава апостроф) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Имайте предвид, че първият символ на идентификатора трябва да бъде или буква, или долна черта.<\/span> <span class=\"sg\" data-s=\"2\">И <code>-<\/code>, и <code>'<\/code> трябва да бъдат последвани от азбучен символ.<\/span> <span class=\"sg\" data-s=\"3\">Ето няколко валидни идентификатора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отново, от вас зависи да изберете имената, но вероятно не е добра практика умишлено да избирате имена, които изглеждат криптично.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode символи<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дефиницията на букви и цифри всъщност е разширена, за да включва всички онези символи, които се считат за букви и десетични цифри според техните Unicode свойства.<\/span> <span class=\"sg\" data-s=\"1\">Например, следните променливи са валидни в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # където ۲ е цифра<\/code><\/pre>"]]},"eo":{"t":"Nomoj de la variabloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni plu moviĝas, ni pasigu iom da tempo pri interesa temo de la permesitaj nomoj de variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝis nun ni vidis simplajn nomojn kiel <code>$name<\/code> aŭ <code>$age<\/code>, kiuj plene konsistis el minuskloj de la angla alfabeto.<\/span> <span class=\"sg\" data-s=\"2\">Sed estas pli da eblecoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sentemo al majuskloj kaj minuskloj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomoj de la variabloj (aŭ <em>identigiloj<\/em>) estas sentemaj al majuskloj kaj minuskloj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke ĉiuj subaj nomoj rilatas al malsamaj skalaj ujoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estas via decido sekvi nomigan skemon, sed vi probable povas rezervi la tut-majusklojn por konstantaj valoroj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj signoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Inter la ASCII-signoj, vi povas uzi ciferojn, substrekan signon <code>_<\/code>, strekon <code>-<\/code>, kaj unuopan citilon (kiu signifas apostrofon) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Notu, ke la unua signo de la identigilo devas esti aŭ litero aŭ substreko.<\/span> <span class=\"sg\" data-s=\"2\">Ambaŭ <code>-<\/code> kaj <code>'<\/code> devas esti sekvataj de alfabeta signo.<\/span> <span class=\"sg\" data-s=\"3\">Jen kelkaj pliaj validaj identigiloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Denove, estas via decido elekti la nomojn, sed probable ne estas bona praktiko intence elekti nomojn, kiuj aspektas kriptaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj signoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La difino de literoj kaj ciferoj estas fakte pligrandigita por inkluzivi ĉiujn tiujn signojn, kiuj estas konsiderataj literoj kaj decimalaj ciferoj laŭ iliaj Unikodaj ecoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la sekvaj variabloj estas validaj en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # kie ۲ estas cifero<\/code><\/pre>"]]},"la":{"t":"Nomina variabilium","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Antequam ulterius progrediamur, tempus aliquod consumamus in argumento iucundo de nominibus variabilium permissis.<\/span> <span class=\"sg\" data-s=\"1\">Hactenus vidimus nomina simplicia ut <code>$name<\/code> vel <code>$age<\/code>, quae omnino ex litteris minusculis alphabeti Anglici constabant.<\/span> <span class=\"sg\" data-s=\"2\">Sed plures sunt possibilitates.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sensibilitas litterarum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomina variabilium (vel <em>identificatorum<\/em>) sunt sensitiva ad litteras.<\/span> <span class=\"sg\" data-s=\"1\">Id significat omnia nomina infra posita ad diversos continentes scalarios referre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tuae discretioni relinquitur adhaerere schemae nominum, sed probabiliter potes nomina omnia capitalia reservare pro constantibus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliae litterae<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Inter litteras ASCII, uti potes digitis, charactere underscore <code>_<\/code>, hyphen <code>-<\/code>, et singulo apice (qui pro apostropho stat) <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota primum characterem identificatoris debere esse aut litteram aut underscore.<\/span> <span class=\"sg\" data-s=\"2\">Utrumque <code>-<\/code> et <code>'<\/code> sequi debent characterem alphabeticum.<\/span> <span class=\"sg\" data-s=\"3\">Hic sunt aliquot plura identificatoria valida:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iterum, tuae discretioni relinquitur nomina eligere, sed probabiliter non est bona praxis nomina consulto eligere quae cryptica videntur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Characteres Unicode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Definitio litterarum et digitorum revera extenditur ad includendos omnes illos characteres qui litterae et digiti decimales secundum proprietates Unicode considerantur.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, sequentes variabiles in Raku validae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # ubi ۲ est digitus<\/code><\/pre>"]]}}}</script>
