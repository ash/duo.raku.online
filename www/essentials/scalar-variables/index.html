<script type="application/json" id="page-data">{"u":"essentials/scalar-variables","n":29,"k":"section","pv":"essentials/comments/embedded","nx":"essentials/scalar-variables/declaring-a-variable","tr":["essentials"],"L":{"en":{"t":"Scalar variables","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">So far, the programs we saw had hardcoded text strings.<\/span> <span class=\"sg\" data-s=\"1\">Let us introduce a bit of freedom and let the program use variables.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">There are a few types of variables in Raku.<\/span> <span class=\"sg\" data-s=\"1\">A variable is a container that can keep some data in it.<\/span> <span class=\"sg\" data-s=\"2\">We’ll start with the simplest containers that can keep only a single value.<\/span> <span class=\"sg\" data-s=\"3\">Such containers are called <em>scalars<\/em> or scalar variables.<\/span> <span class=\"sg\" data-s=\"4\">A variable has a name prefixed with a special indicator that tells about the container's nature.<\/span> <span class=\"sg\" data-s=\"5\">That indicator is a character called <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">For scalar containers, such a sigil is a dollar character <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are a couple of examples of scalar variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"de":{"t":"Skalare Variablen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bisher hatten die Programme, die wir gesehen haben, fest codierte Textzeichenfolgen.<\/span> <span class=\"sg\" data-s=\"1\">Lassen Sie uns ein wenig Freiheit einführen und das Programm Variablen verwenden lassen.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Es gibt einige Arten von Variablen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variable ist ein Behälter, der einige Daten speichern kann.<\/span> <span class=\"sg\" data-s=\"2\">Wir beginnen mit den einfachsten Behältern, die nur einen einzigen Wert speichern können.<\/span> <span class=\"sg\" data-s=\"3\">Solche Behälter werden <em>Skalare<\/em> oder skalare Variablen genannt.<\/span> <span class=\"sg\" data-s=\"4\">Eine Variable hat einen Namen, der mit einem speziellen Indikator versehen ist, der die Natur des Behälters angibt.<\/span> <span class=\"sg\" data-s=\"5\">Dieser Indikator ist ein Zeichen, das <em>Sigil<\/em> genannt wird.<\/span> <span class=\"sg\" data-s=\"6\">Für skalare Behälter ist ein solches Sigil ein Dollarzeichen <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind ein paar Beispiele für skalare Variablen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"nl":{"t":"Scalare variabelen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe hadden de programma's die we zagen hardgecodeerde tekststrings.<\/span> <span class=\"sg\" data-s=\"1\">Laten we een beetje vrijheid introduceren en het programma variabelen laten gebruiken.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Er zijn een paar soorten variabelen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele is een container die wat gegevens kan bevatten.<\/span> <span class=\"sg\" data-s=\"2\">We beginnen met de eenvoudigste containers die slechts één enkele waarde kunnen bevatten.<\/span> <span class=\"sg\" data-s=\"3\">Dergelijke containers worden <em>scalars<\/em> of scalaire variabelen genoemd.<\/span> <span class=\"sg\" data-s=\"4\">Een variabele heeft een naam die is voorafgegaan door een speciale indicator die iets vertelt over de aard van de container.<\/span> <span class=\"sg\" data-s=\"5\">Die indicator is een teken dat <em>sigil<\/em> wordt genoemd.<\/span> <span class=\"sg\" data-s=\"6\">Voor scalaire containers is zo'n sigil een dollarteken <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar voorbeelden van scalaire variabelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"es":{"t":"Variables escalares","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, los programas que hemos visto tenían cadenas de texto codificadas.<\/span> <span class=\"sg\" data-s=\"1\">Vamos a introducir un poco de libertad y permitir que el programa use variables.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hay algunos tipos de variables en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Una variable es un contenedor que puede almacenar algunos datos.<\/span> <span class=\"sg\" data-s=\"2\">Comenzaremos con los contenedores más simples que solo pueden mantener un único valor.<\/span> <span class=\"sg\" data-s=\"3\">Tales contenedores se llaman <em>escalars<\/em> o variables escalares.<\/span> <span class=\"sg\" data-s=\"4\">Una variable tiene un nombre precedido por un indicador especial que informa sobre la naturaleza del contenedor.<\/span> <span class=\"sg\" data-s=\"5\">Ese indicador es un carácter llamado <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Para los contenedores escalares, dicho sigil es un carácter de dólar <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay un par de ejemplos de variables escalares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"it":{"t":"Variabili scalari","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora, i programmi che abbiamo visto avevano stringhe di testo hardcoded.<\/span> <span class=\"sg\" data-s=\"1\">Introduciamo un po' di libertà e permettiamo al programma di usare variabili.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ci sono diversi tipi di variabili in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile è un contenitore che può contenere dei dati.<\/span> <span class=\"sg\" data-s=\"2\">Inizieremo con i contenitori più semplici che possono contenere solo un singolo valore.<\/span> <span class=\"sg\" data-s=\"3\">Tali contenitori sono chiamati <em>scalari<\/em> o variabili scalari.<\/span> <span class=\"sg\" data-s=\"4\">Una variabile ha un nome prefissato con un indicatore speciale che indica la natura del contenitore.<\/span> <span class=\"sg\" data-s=\"5\">Tale indicatore è un carattere chiamato <em>sigillo<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Per i contenitori scalari, tale sigillo è un carattere dollaro <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un paio di esempi di variabili scalari:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"lv":{"t":"Skalarie mainīgie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Līdz šim, programmās, kuras mēs apskatījām, bija iekodētas teksta virknes.<\/span> <span class=\"sg\" data-s=\"1\">Ieviesīsim nedaudz brīvības un ļausim programmai izmantot mainīgos.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ir dažādi mainīgo tipi.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais ir konteiners, kas var glabāt datus.<\/span> <span class=\"sg\" data-s=\"2\">Sāksim ar vienkāršākajiem konteineriem, kas var glabāt tikai vienu vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Šādus konteinerus sauc par <em>skalāriem<\/em> vai skalārajiem mainīgajiem.<\/span> <span class=\"sg\" data-s=\"4\">Mainīgajam ir nosaukums, kas sākas ar speciālu indikatoru, kas norāda uz konteinera dabu.<\/span> <span class=\"sg\" data-s=\"5\">Šis indikators ir rakstzīme, ko sauc par <em>sigilu<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Skalārajiem konteineriem šāds sigils ir dolāra rakstzīme <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir pāris piemēri ar skalārajiem mainīgajiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"ru":{"t":"Скалярные переменные","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пока что во всех программах мы видели только встроенные текстовые строки.<\/span> <span class=\"sg\" data-s=\"1\">Давайте ощутим немного больше свободы, используя в программе переменные.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В Raku есть несколько типов переменных.<\/span> <span class=\"sg\" data-s=\"1\">Переменная — это контейнер, который может хранить в себе данные.<\/span> <span class=\"sg\" data-s=\"2\">Мы начнем с самых простых контейнеров, которые могут хранить в себе только одно значение.<\/span> <span class=\"sg\" data-s=\"3\">Такие контейнеры называются <em>скалярами<\/em> или скалярными контейнерами.<\/span> <span class=\"sg\" data-s=\"4\">Переменная имеет имя, в начале которого стоит особый индикатор, который говорит о сути контейнера.<\/span> <span class=\"sg\" data-s=\"5\">Этот индикатор — это символ, который называется <em>сигил<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Для скалярных контейнеров сигилом является знак доллара <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пара примеров скалярных переменных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"uk":{"t":"Скалярні змінні","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Досі програми, які ми бачили, мали жорстко закодовані текстові рядки.<\/span> <span class=\"sg\" data-s=\"1\">Давайте введемо трохи свободи і дозволимо програмі використовувати змінні.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Існує кілька типів змінних у Raku.<\/span> <span class=\"sg\" data-s=\"1\">Змінна — це контейнер, який може зберігати деякі дані.<\/span> <span class=\"sg\" data-s=\"2\">Почнемо з найпростіших контейнерів, які можуть зберігати лише одне значення.<\/span> <span class=\"sg\" data-s=\"3\">Такі контейнери називаються <em>скалярами<\/em> або скалярними змінними.<\/span> <span class=\"sg\" data-s=\"4\">Змінна має ім'я з префіксом спеціального індикатора, який вказує на природу контейнера.<\/span> <span class=\"sg\" data-s=\"5\">Цей індикатор — символ, який називається <em>сигіл<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Для скалярних контейнерів таким сигілом є символ долара <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось кілька прикладів скалярних змінних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"bg":{"t":"Скаларни променливи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Досега, програмите, които видяхме, имаха твърдо кодирани текстови низове.<\/span> <span class=\"sg\" data-s=\"1\">Нека въведем малко свобода и позволим на програмата да използва променливи.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Има няколко типа променливи в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Променливата е контейнер, който може да съхранява някакви данни.<\/span> <span class=\"sg\" data-s=\"2\">Ще започнем с най-простите контейнери, които могат да съхраняват само една стойност.<\/span> <span class=\"sg\" data-s=\"3\">Такива контейнери се наричат <em>скалари<\/em> или скаларни променливи.<\/span> <span class=\"sg\" data-s=\"4\">Променливата има име, предшествано от специален индикатор, който показва природата на контейнера.<\/span> <span class=\"sg\" data-s=\"5\">Този индикатор е символ, наречен <em>сигил<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">За скаларните контейнери, такъв сигил е символът долар <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето няколко примера за скаларни променливи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"eo":{"t":"Skalaraj variabloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, la programoj, kiujn ni vidis, havis enmetitajn tekstajn ĉenojn.<\/span> <span class=\"sg\" data-s=\"1\">Ni enkonduku iom da libereco kaj lasu la programon uzi variablojn.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Estas kelkaj specoj de variabloj en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Variablo estas ujo, kiu povas teni iujn datumojn en ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ni komencos kun la plej simplaj ujoj, kiuj povas teni nur unu solan valoron.<\/span> <span class=\"sg\" data-s=\"3\">Tiaj ujoj estas nomataj <em>skalaroj<\/em> aŭ skalaraj variabloj.<\/span> <span class=\"sg\" data-s=\"4\">Variablo havas nomon prefiksitan per speciala indikilo, kiu diras pri la naturo de la ujo.<\/span> <span class=\"sg\" data-s=\"5\">Tiu indikilo estas signo nomata <em>sigelo<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Por skalaraj ujoj, tia sigelo estas dolara signo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj ekzemploj de skalaraj variabloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"la":{"t":"Scalari variabiles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hactenus, programmata quae vidimus textus chordas duriter codificatas habebant.<\/span> <span class=\"sg\" data-s=\"1\">Introducamus paulum libertatis et sinamus programma variabiles uti.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Pauci sunt genera variabilium in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis est continens quod aliquam datam in se tenere potest.<\/span> <span class=\"sg\" data-s=\"2\">Incipiemus cum simplicissimis continentibus quae solum unam valorem tenere possunt.<\/span> <span class=\"sg\" data-s=\"3\">Talia continentia <em>scalars<\/em> vel variabiles scalaris vocantur.<\/span> <span class=\"sg\" data-s=\"4\">Variabilis nomen habet cum praefixo indicatore speciali qui de natura continentis narrat.<\/span> <span class=\"sg\" data-s=\"5\">Ille indicator est character qui <em>sigil<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"6\">Pro scalaribus continentibus, talis sigil est character dollari <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt duo exempla variabilium scalaris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]}}}</script>
