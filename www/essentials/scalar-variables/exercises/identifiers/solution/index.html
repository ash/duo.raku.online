ентификаторы.<\/span> <span class=\"sg\" data-s=\"1\">Несколько возможных решений показаны ниже.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Все идентификаторы правильные, но лучше не использовать имена с апострофами, если у вас нет веских на то причин.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вы можете найти исходный код в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа не производит никакого вывода, но у вас не должно возникнуть никаких ошибок, когда Rakudo компилирует и запускает программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте перечислим проблемы именами в задаче:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Пробелы не допустимы: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Переменной необходим сигил: <code>Name<\/code> (в Raku возможны названия переменных без сигила, но их все еще нельзя объявить как <code>my Name<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Апостроф (на самом деле одинарная кавычка) не может быть в начале имени: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Цифра тоже не может быть в начале: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Два дефиса не могут следовать друг за другом: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Solution: Виправлення ідентифікаторів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Існує більше одного способу зробити ідентифікатори правильними.<\/span> <span class=\"sg\" data-s=\"1\">Деякі можливі варіанти показані тут:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усі ідентифікатори є дійсними, але, ймовірно, краще уникати імен з апострофами, якщо у вас <code>$немає<\/code> вагомих причин їх використовувати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма не генерує жодного виводу, але ви не повинні отримувати жодних помилок, коли Rakudo компілює та запускає її:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте перелічимо проблеми з оригінальними іменами:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Пробіли не дозволені: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Змінна потребує сигіла: <code>Name<\/code> (у Raku можливо мати змінні без сигіла, але їх все одно не можна оголошувати як <code>my Name<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Апостроф (насправді одинарна лапка) не може починати ім'я: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Цифра також не може починати ім'я: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Два дефіси не можуть стояти разом: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Поправете идентификаторите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Има повече от един начин да направите идентификаторите правилни.<\/span> <span class=\"sg\" data-s=\"1\">Някои възможни опции са показани тук:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Втора улица, 12';\nmy $from-to = 'Лондон до Париж';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всички идентификатори са валидни, но вероятно е по-добре да избягвате имена с апострофи, ако нямате силни причини да ги използвате.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма не генерира никакъв изход, но не трябва да получавате никакви грешки, когато Rakudo я компилира и изпълни:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека изброим проблемите с оригиналните имена:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Интервалите не са позволени: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Променливата се нуждае от сигил: <code>Name<\/code> (възможно е да има променливи без сигил в Raku, но те все пак не могат да бъдат декларирани като <code>my Name<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Апостроф (всъщност единична кавичка) не може да започва име: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Цифра също не може да започва име: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Две тирета не могат да стоят заедно: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solution: Korekti la identigilojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas pli ol unu maniero fari la identigilojn ĝustaj.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj eblaj opcioj estas montritaj ĉi tie:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj identigiloj estas validaj, sed verŝajne estas pli bone eviti nomojn kun apostrofoj se vi <code>$don't<\/code> havas fortajn kialojn por uzi ilin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo ne generas ajnan eligon, sed vi ne devus ricevi erarojn kiam Rakudo kompilas kaj rulas ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni listigu la problemojn kun la originalaj nomoj:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Spacoj ne estas permesitaj: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Variablo bezonas sigilon: <code>Name<\/code> (estas eble havi variablojn sen sigilo en Raku, sed ili ankoraŭ ne povas esti deklaritaj kiel <code>my Name<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Apostrofo (fakte unuopa citilo) ne povas komenci nomon: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Cifero ankaŭ ne povas komenci nomon: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Du streketo ne povas sidi kune: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solution: Corrigere identifiers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Plures modi sunt ad identificatores corrigendos.<\/span> <span class=\"sg\" data-s=\"1\">Hic nonnullae optiones possibiles monstrantur:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omnes identificatores sunt validi, sed fortasse melius est vitare nomina cum apostrophis si <code>$non<\/code> habes validas rationes ad eos utendos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma nullum output generat, sed non debes errores accipere cum Rakudo illud compilat et exsequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Enumeremus problemata cum nominibus originalibus:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Spatia non permittuntur: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Variabilis sigillum requirit: <code>Name<\/code> (possibile est habere variabiles sine sigillo in Raku, sed tamen non possunt declarari ut <code>my Name<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Apostrophus (revera singula comma) non potest nomen incipere: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Digitus non potest nomen incipere: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Duo hyphena non possunt simul sedere: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
