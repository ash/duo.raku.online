\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La línea anterior es en realidad equivalente a una asignación inútil <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes verlo fácilmente si modificas los valores en el lado derecho, por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime aún más advertencias, pero también puedes ver que solo <code>$b<\/code> cambió su valor:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"it":{"t":"Solution: Scambiare valori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In questo programma, utilizziamo gli elementi della sintassi di Raku dalla sezione sulle <a href=\"https://course.raku.org/it/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">variabili scalari<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esegui il programma e conferma che stampa i valori in ordine diverso.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutti i passaggi di questo programma (creazione di una variabile e assegnazione dei valori, scambio degli stessi e stampa) utilizzano entrambe le variabili nella stessa costruzione.<\/span> <span class=\"sg\" data-s=\"1\">La cosa più interessante qui è il modo in cui le variabili scambiano i loro valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che hai bisogno delle parentesi sul lato sinistro, ma puoi anche aggiungerle sul lato destro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa succede se ometti le parentesi?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In questo caso, ricevi un avviso che <code>$a<\/code> sul lato destro non viene utilizzato:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La riga sopra è in realtà equivalente a un'assegnazione inutile <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi facilmente vederlo se modifichi i valori sul lato destro, per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa ancora più avvisi, ma puoi anche vedere che solo <code>$b<\/code> ha cambiato il suo valore:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"lv":{"t":"Risinājums: Vērtību apmaiņa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šajā programmā mēs izmantojam Raku sintakses elementus no sadaļas par <a href=\"https://course.raku.org/lv/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalārajiem mainīgajiem<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu un pārliecinieties, ka tā izdrukā vērtības citā secībā.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visi šīs programmas soļi (mainīgā izveide un vērtību piešķiršana, to apmaiņa un izdrukāšana) izmanto abus mainīgos vienā konstrukcijā.<\/span> <span class=\"sg\" data-s=\"1\">Visinteresantākais šeit ir veids, kā mainīgie apmaina savas vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka jums ir nepieciešamas iekavas kreisajā pusē, bet jūs varat tās pievienot arī labajā pusē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kas notiek, ja izlaidīsiet iekavas?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šajā gadījumā jūs saņemsiet brīdinājumu, ka <code>$a<\/code> labajā pusē netiek izmantots:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nBRĪDINĀJUMI par /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nBezjēdzīga $a izmantošana sink kontekstā (2. rinda, 2. rinda)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējā rinda faktiski ir ekvivalenta bezjēdzīgai piešķiršanai <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To var viegli redzēt, ja modificējat vērtības labajā pusē, piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā vēl vairāk brīdinājumu, bet jūs varat arī redzēt, ka tikai <code>$b<\/code> mainīja savu vērtību:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nBRĪDINĀJUMI par /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nBezjēdzīga \"*\" izmantošana izteiksmē \"3 * $a\" sink kontekstā (2. rinda)\nBezjēdzīga $a izmantošana sink kontekstā (2. rinda)\n10, 40<\/code><\/pre>"]]},"ru":{"t":"Решение: Замена значений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В этой программы мы используем элементы синтаксиса Raku из прошлой главы о <a href=\"https://course.raku.org/ru/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярных переменных<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вы можете найти исходный код в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите программу, чтобы убедиться, что она печатает значения в правильном порядке.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Все шаги этой программы (создание переменных и присвоение им значений, их замена, вывод) используют обе переменные в одной инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Самое интересное, это когда переменные обмениваются значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Скобки обязательны с левой стороны, но вы также можете их добавить с правой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Что случится, если мы уберем скобки?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом случае вы получите предупреждение, что <code>$a<\/code> с правой стороны не используется:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На самом деле строка выше эквивалентна бесполезному присваиванию <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это легко увидеть, если вы измените значение с правой стороны, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа напишет еще больше предупреждений, но вы также увидите, что только <code>$b<\/code> изменило свое значение:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"uk":{"t":"Розв'язання: Обмін значеннями","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">У цій програмі ми використовуємо елементи синтаксису Raku з розділу про <a href=\"https://course.raku.org/uk/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярні змінні<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму й переконайтеся, що вона виводить значення в іншому порядку.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усі кроки цієї програми (створення змінної та присвоєння значень, обмін ними й виведення) використовують обидві змінні в одній конструкції.<\/span> <span class=\"sg\" data-s=\"1\">Найцікавіше тут — те, як змінні обмінюються значеннями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що дужки потрібні ліворуч, але їх можна додати й праворуч:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що станеться, якщо дужки опустити?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У цьому разі ви отримаєте попередження, що <code>$a<\/code> праворуч не використовується:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наведений рядок насправді рівносильний беззмістовному присвоєнню <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це легко побачити, якщо змінити значення праворуч, наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить ще більше попереджень, але ви також бачите, що змінилося значення лише <code>$b<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"bg":{"t":"Solution: Размяна на стойности","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В тази програма използваме елементи от синтаксиса на Raku от секцията за <a href=\"https://course.raku.org/bg/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скаларни променливи<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата и потвърдете, че тя отпечатва стойностите в различен ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всички стъпки на тази програма (създаване на променлива и присвояване на стойности, размяна на стойностите и отпечатване) използват и двете променливи в една и съща конструкция.<\/span> <span class=\"sg\" data-s=\"1\">Най-интересното тук е начинът, по който променливите разменят своите стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че трябва да използвате скоби от лявата страна, но можете да ги добавите и от дясната страна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво се случва, ако пропуснете скобите?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В този случай ще получите предупреждение, че <code>$a<\/code> от дясната страна не се използва:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Горният ред всъщност е еквивалентен на безполезно присвояване <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Лесно можете да го видите, ако промените стойностите от дясната страна, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва още повече предупреждения, но също така можете да видите, че само <code>$b<\/code> е променил своята стойност:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"eo":{"t":"Solution: Interŝanĝi valorojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu programo, ni uzas la elementojn de Raku-sintakso el la sekcio pri <a href=\"https://course.raku.org/eo/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalaj variabloj<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontokodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kaj konfirmu ke ĝi presas la valorojn en malsama ordo.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj paŝoj de ĉi tiu programo (kreado de variablo kaj asignado de la valoroj, interŝanĝo de ili, kaj presado) uzas ambaŭ variablojn en la sama konstruo.<\/span> <span class=\"sg\" data-s=\"1\">La plej interesa ĉi tie estas la maniero kiel la variabloj interŝanĝas siajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu ke vi bezonas krampojn ĉe la maldekstra flanko, sed vi ankaŭ povas aldoni ilin ĉe la dekstra flanko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kio okazas se vi preterlasas krampojn?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu kazo, vi ricevas averton ke <code>$a<\/code> ĉe la dekstra flanko ne estas uzata:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nAVERTOJ por /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nSenzaŭza uzo de $a en sink-kunteksto (linioj 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La supra linio estas fakte ekvivalenta al senutila asigno <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas facile vidi ĝin se vi modifas la valorojn ĉe la dekstra flanko, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas eĉ pli da avertoj, sed vi ankaŭ povas vidi ke nur <code>$b<\/code> ŝanĝis sian valoron:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nAVERTOJ por /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nSenzaŭza uzo de \"*\" en esprimo \"3 * $a\" en sink-kunteksto (linio 2)\nSenzaŭza uzo de $a en sink-kunteksto (linio 2)\n10, 40<\/code><\/pre>"]]},"la":{"t":"Solution: Commutatio valorum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In hoc programmate, elementa syntaxis Raku ex sectione de <a href=\"https://course.raku.org/la/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">variabilibus scalaribus<\/a> utimur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis invenire potes in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Effectus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma currite et confirmate valores in ordine diverso imprimi.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnes gradus huius programmatis (creatio variabilis et assignatio valorum, permutatio eorum, et impressio) utuntur utraque variabili in eadem constructione.<\/span> <span class=\"sg\" data-s=\"1\">Maxime interesting hic est modus quo variabiles valores suos permutant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod parenthesibus in latere sinistro opus est, sed etiam eas in latere dextro addere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid accidit si parenthesibus omittas?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In hoc casu, monitionem accipis quod <code>$a<\/code> in latere dextro non adhibetur:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nMONITIONES pro /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nInutilis usus $a in contextu sink (lineae 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Linea supra re vera aequipollet inutili assignationi <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Facile videre potes si valores in latere dextro modifies, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma plures monitiones imprimit, sed etiam videre potes solum <code>$b<\/code> valorem suum mutasse:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nMONITIONES pro /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nInutilis usus \"*\" in expressione \"3 * $a\" in contextu sink (linea 2)\nInutilis usus $a in contextu sink (linea 2)\n10, 40<\/code><\/pre>"]]}}}</script>
