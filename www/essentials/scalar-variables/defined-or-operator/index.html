<script type="application/json" id="page-data">{"u":"essentials/scalar-variables/defined-or-operator","n":39,"k":"topic","pv":"essentials/scalar-variables/declaration-with-initialization/quiz2","nx":"essentials/scalar-variables/identifiers","tr":["essentials","essentials/scalar-variables"],"L":{"en":{"t":"The defined-or operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Use the so-called <em>defined-or<\/em> operator <code>//<\/code> to get a fallback value if a variable is not yet set.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The value of <code>$a<\/code> is set in the first line, so in the expression <code>$a // 'gamma'<\/code>, the current value of <code>$a<\/code> is used.<\/span> <span class=\"sg\" data-s=\"1\">In contrast, the <code>$b<\/code> variable was not initialised, so <code>$b // 'delta'<\/code> returns the right-hand-side operand, and the program prints <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The combination of <code>//<\/code> and <code>=<\/code> gives the <code>//=<\/code> operator that assigns a value if the variable is not defined.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"de":{"t":"Der defined-or-Operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Verwenden Sie den sogenannten <em>defined-or<\/em> Operator <code>//<\/code>, um einen Fallback-Wert zu erhalten, falls eine Variable noch nicht gesetzt ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Wert von <code>$a<\/code> wird in der ersten Zeile gesetzt, daher wird im Ausdruck <code>$a // 'gamma'<\/code> der aktuelle Wert von <code>$a<\/code> verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Im Gegensatz dazu wurde die Variable <code>$b<\/code> nicht initialisiert, daher gibt <code>$b // 'delta'<\/code> den rechten Operanden zurück und das Programm gibt <code>delta<\/code> aus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Kombination von <code>//<\/code> und <code>=<\/code> ergibt den <code>//=<\/code> Operator, der einen Wert zuweist, wenn die Variable nicht definiert ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"nl":{"t":"De defined-or-operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Gebruik de zogenaamde <em>defined-or<\/em> operator <code>//<\/code> om een terugvalwaarde te krijgen als een variabele nog niet is ingesteld.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma print:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De waarde van <code>$a<\/code> is ingesteld in de eerste regel, dus in de expressie <code>$a // 'gamma'<\/code> wordt de huidige waarde van <code>$a<\/code> gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Daarentegen was de variabele <code>$b<\/code> niet geïnitialiseerd, dus <code>$b // 'delta'<\/code> retourneert de operand aan de rechterkant, en het programma print <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De combinatie van <code>//<\/code> en <code>=<\/code> geeft de <code>//=<\/code> operator die een waarde toekent als de variabele niet gedefinieerd is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"es":{"t":"El operador defined-or","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Usa el llamado operador <em>definido-o<\/em> <code>//<\/code> para obtener un valor alternativo si una variable aún no está establecida.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El valor de <code>$a<\/code> se establece en la primera línea, por lo que en la expresión <code>$a // 'gamma'<\/code>, se usa el valor actual de <code>$a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En contraste, la variable <code>$b<\/code> no fue inicializada, por lo que <code>$b // 'delta'<\/code> devuelve el operando del lado derecho, y el programa imprime <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La combinación de <code>//<\/code> y <code>=<\/code> da el operador <code>//=<\/code> que asigna un valor si la variable no está definida.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"it":{"t":"Operatore defined-or","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Usa il cosiddetto operatore <em>defined-or<\/em> <code>//<\/code> per ottenere un valore di fallback se una variabile non è ancora impostata.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il valore di <code>$a<\/code> è impostato nella prima riga, quindi nell'espressione <code>$a // 'gamma'<\/code>, viene utilizzato il valore corrente di <code>$a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Al contrario, la variabile <code>$b<\/code> non è stata inizializzata, quindi <code>$b // 'delta'<\/code> restituisce l'operando a destra, e il programma stampa <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La combinazione di <code>//<\/code> e <code>=<\/code> dà l'operatore <code>//=<\/code> che assegna un valore se la variabile non è definita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"lv":{"t":"Definē-vai operators","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet tā saukto <em>definētais-vai<\/em> operatoru <code>//<\/code>, lai iegūtu rezerves vērtību, ja mainīgais vēl nav iestatīts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgā <code>$a<\/code> vērtība ir iestatīta pirmajā rindā, tāpēc izteiksmē <code>$a // 'gamma'<\/code> tiek izmantota pašreizējā <code>$a<\/code> vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Savukārt mainīgais <code>$b<\/code> netika inicializēts, tāpēc <code>$b // 'delta'<\/code> atgriež labo pusi, un programma izdrukā <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kombinācija <code>//<\/code> un <code>=<\/code> veido operatoru <code>//=<\/code>, kas piešķir vērtību, ja mainīgais nav definēts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"ru":{"t":"Оператор присвоено-или","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Используйте так называемый <em>присвоено-или<\/em> оператор <code>//<\/code>, чтобы получить запасное значение, если оно еще не было присвоено.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа выведет:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значение <code>$a<\/code> присвоено на первой строке, поэтому в выражении <code>$a // 'gamma'<\/code> используется текущее значение <code>$a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В случае же с <code>$b<\/code>, переменная еще не была инициализирована, поэтому <code>$b // 'delta'<\/code> возвращает операнд с правой стороны, и программа выводит <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Комбинация <code>//<\/code> и <code>=<\/code> дает в результате оператор <code>//=<\/code>, который присваивает значение переменной, если оно отсутствует.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"uk":{"t":"Оператор defined-or","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Використовуйте так званий оператор <em>defined-or<\/em> <code>//<\/code>, щоб отримати резервне значення, якщо змінна ще не встановлена.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значення <code>$a<\/code> встановлено в першому рядку, тому в виразі <code>$a // 'gamma'<\/code> використовується поточне значення <code>$a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">На противагу цьому, змінна <code>$b<\/code> не була ініціалізована, тому <code>$b // 'delta'<\/code> повертає правий операнд, і програма виводить <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Комбінація <code>//<\/code> та <code>=<\/code> дає оператор <code>//=<\/code>, який присвоює значення, якщо змінна не визначена.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"bg":{"t":"Операторът \"defined-or\"","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Използвайте така наречения оператор <em>defined-or<\/em> <code>//<\/code>, за да получите резервна стойност, ако променливата все още не е зададена.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойността на <code>$a<\/code> е зададена в първия ред, така че в израза <code>$a // 'gamma'<\/code> се използва текущата стойност на <code>$a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За разлика от това, променливата <code>$b<\/code> не е инициализирана, така че <code>$b // 'delta'<\/code> връща операнда от дясната страна и програмата отпечатва <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Комбинацията от <code>//<\/code> и <code>=<\/code> дава оператора <code>//=<\/code>, който присвоява стойност, ако променливата не е дефинирана.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"eo":{"t":"La difinita-aŭ operatoro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Uzu la tiel nomatan <em>difinita-aŭ<\/em> operatoron <code>//<\/code> por akiri anstataŭan valoron se variablo ankoraŭ ne estas agordita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La valoro de <code>$a<\/code> estas agordita en la unua linio, do en la esprimo <code>$a // 'gamma'<\/code>, la nuna valoro de <code>$a<\/code> estas uzata.<\/span> <span class=\"sg\" data-s=\"1\">Kontraste, la variablo <code>$b<\/code> ne estis inicializita, do <code>$b // 'delta'<\/code> redonas la dekstran operandon, kaj la programo presas <code>delta<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kombinaĵo de <code>//<\/code> kaj <code>=<\/code> donas la operatoron <code>//=<\/code> kiu asignas valoron se la variablo ne estas difinita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]},"la":{"t":"Definita-vel operator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Utere sic dicto <em>definitus-vel<\/em> operatore <code>//<\/code> ut valorem subsidiarium accipias si variabilis nondum statuta est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 'alpha';\nsay $a // 'gamma';\n\nmy $b;\nsay $b // 'delta';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>alpha\ndelta<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor <code>$a<\/code> statuitur in prima linea, ita in expressione <code>$a // 'gamma'<\/code>, valor praesens <code>$a<\/code> adhibetur.<\/span> <span class=\"sg\" data-s=\"1\">E contra, variabilis <code>$b<\/code> non initiata est, ergo <code>$b // 'delta'<\/code> operandum dextrum latus reddit, et programma <code>delta<\/code> imprimit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">//=<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Combinatio <code>//<\/code> et <code>=<\/code> dat operatorem <code>//=<\/code> qui valorem assignat si variabilis non definitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x;\n$x //= 42;\nsay $x; # 42<\/code><\/pre>"]]}}}</script>
