<script type="application/json" id="page-data">{"u":"essentials/scalar-variables/declaring-a-variable","n":30,"k":"topic","pv":"essentials/scalar-variables","nx":"essentials/scalar-variables/declaring-a-variable/quiz1","tr":["essentials","essentials/scalar-variables"],"L":{"en":{"t":"Scalar variables","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Variables must be announced before you use them.<\/span> <span class=\"sg\" data-s=\"1\">Raku has special <em>declarators<\/em> for this.<\/span> <span class=\"sg\" data-s=\"2\">To declare a variable, use <code>my<\/code> as shown below:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Having said that, you introduced a new variable, which keeps no payload so far.<\/span> <span class=\"sg\" data-s=\"1\">But it is already known to the compiler to identify it when it sees the same name later in the program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can declare two or more variables using the same <code>my<\/code> declarator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"de":{"t":"Deklarieren einer Variablen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Variablen müssen deklariert werden, bevor Sie sie verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat spezielle <em>Deklaratoren<\/em> dafür.<\/span> <span class=\"sg\" data-s=\"2\">Um eine Variable zu deklarieren, verwenden Sie <code>my<\/code> wie unten gezeigt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Damit haben Sie eine neue Variable eingeführt, die bisher keine Nutzlast enthält.<\/span> <span class=\"sg\" data-s=\"1\">Aber sie ist dem Compiler bereits bekannt, um sie zu identifizieren, wenn er denselben Namen später im Programm sieht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als eine Variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können zwei oder mehr Variablen mit demselben <code>my<\/code> Deklarator deklarieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"nl":{"t":"Declareren van een variabele","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Variabelen moeten worden aangekondigd voordat je ze gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft hiervoor speciale <em>declarators<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Om een variabele te declareren, gebruik <code>my<\/code> zoals hieronder getoond:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dat gezegd hebbende, heb je een nieuwe variabele geïntroduceerd, die tot nu toe geen inhoud heeft.<\/span> <span class=\"sg\" data-s=\"1\">Maar het is al bekend bij de compiler om het te identificeren wanneer het dezelfde naam later in het programma ziet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één variabele<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt twee of meer variabelen declareren met dezelfde <code>my<\/code> declarator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"es":{"t":"Declaración de una variable","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Las variables deben ser anunciadas antes de usarlas.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene <em>declaradores<\/em> especiales para esto.<\/span> <span class=\"sg\" data-s=\"2\">Para declarar una variable, usa <code>my<\/code> como se muestra a continuación:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dicho esto, has introducido una nueva variable, que aún no tiene ningún contenido.<\/span> <span class=\"sg\" data-s=\"1\">Pero ya es conocida por el compilador para identificarla cuando vea el mismo nombre más adelante en el programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de una variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes declarar dos o más variables usando el mismo declarador <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"it":{"t":"Dichiarazione di una variabile","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Le variabili devono essere dichiarate prima di essere utilizzate.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha dei <em>dichiaratori<\/em> speciali per questo.<\/span> <span class=\"sg\" data-s=\"2\">Per dichiarare una variabile, usa <code>my<\/code> come mostrato di seguito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Detto ciò, hai introdotto una nuova variabile, che finora non contiene alcun valore.<\/span> <span class=\"sg\" data-s=\"1\">Ma è già conosciuta dal compilatore, che la identificherà quando vedrà lo stesso nome più avanti nel programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di una variabile<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi dichiarare due o più variabili usando lo stesso dichiaratore <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"lv":{"t":"Mainīgā deklarēšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Mainīgie ir jādeklarē pirms to lietošanas.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā tam ir īpaši <em>deklaratori<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Lai deklarētu mainīgo, izmantojiet <code>my<\/code>, kā parādīts zemāk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Līdz ar to jūs esat ieviesis jaunu mainīgo, kuram pagaidām nav nekādas vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Bet tas jau ir zināms kompilatoram, lai to identificētu, kad tas redz to pašu nosaukumu vēlāk programmā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viens mainīgais<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat deklarēt divus vai vairākus mainīgos, izmantojot to pašu <code>my<\/code> deklaratoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"ru":{"t":"Объявление переменной","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Переменные должны быть объявлены перед использованием.<\/span> <span class=\"sg\" data-s=\"1\">У Raku для этого есть специальные <em>объявители<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Используйте <code>my<\/code> для объявление переменной, как показано ниже:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этим вы ввели новую переменную, которая пока в себе еще ничего не содержит.<\/span> <span class=\"sg\" data-s=\"1\">Но она уже известна компилятору, и он сможет ее найти, когда в следующий раз увидит ее в программе.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Больше, чем одна переменная<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы можете объявить две или больше переменные, используя тот же объявитель <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"uk":{"t":"Оголошення змінної","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Змінні повинні бути оголошені перед їх використанням.<\/span> <span class=\"sg\" data-s=\"1\">У Raku для цього є спеціальні <em>декларатори<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб оголосити змінну, використовуйте <code>my<\/code>, як показано нижче:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Таким чином, ви ввели нову змінну, яка поки що не містить жодних даних.<\/span> <span class=\"sg\" data-s=\"1\">Але вона вже відома компілятору, щоб розпізнати її, коли він побачить те саме ім'я пізніше в програмі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше ніж одна змінна<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви можете оголосити дві або більше змінних, використовуючи той самий декларатор <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"bg":{"t":"Деклариране на променлива","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Променливите трябва да бъдат обявени преди да ги използвате.<\/span> <span class=\"sg\" data-s=\"1\">Raku има специални <em>декларатори<\/em> за това.<\/span> <span class=\"sg\" data-s=\"2\">За да декларирате променлива, използвайте <code>my<\/code> както е показано по-долу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След като направите това, сте въвели нова променлива, която все още не съдържа никаква стойност.<\/span> <span class=\"sg\" data-s=\"1\">Но тя вече е известна на компилатора, за да я разпознае, когато види същото име по-късно в програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от една променлива<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да декларирате две или повече променливи, използвайки същия декларатор <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"eo":{"t":"Deklarado de variablo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Variabloj devas esti anoncitaj antaŭ ol vi uzas ilin.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas specialajn <em>deklarilojn<\/em> por tio.<\/span> <span class=\"sg\" data-s=\"2\">Por deklari variablon, uzu <code>my<\/code> kiel montrite sube:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dirite, vi enkondukis novan variablon, kiu ankoraŭ ne enhavas iun ajn ŝarĝon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi jam estas konata al la kompililo por identigi ĝin kiam ĝi vidas la saman nomon poste en la programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu variablo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas deklari du aŭ pli da variabloj uzante la saman <code>my<\/code> deklarilon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"la":{"t":"Declarando variabilem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Variabiles annuntiandae sunt antequam eas utaris.<\/span> <span class=\"sg\" data-s=\"1\">Raku habet <em>declaratores<\/em> speciales ad hoc.<\/span> <span class=\"sg\" data-s=\"2\">Ad variabilem declarandam, utere <code>my<\/code> ut infra monstratur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc dicto, novam variabilem introduxisti, quae nullum onus adhuc servat.<\/span> <span class=\"sg\" data-s=\"1\">Sed iam nota est compilatori ut eam agnoscat cum idem nomen postea in programmate videt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam una variabilis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potes duas vel plures variabiles declarare eodem declaratore <code>my<\/code> utens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]}}}</script>
