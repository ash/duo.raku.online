<script type="application/json" id="page-data">{"u":"essentials/how-to-install-rakupp","n":7,"k":"section","pv":"essentials/the-rakupp-compiler","nx":"essentials/editors-and-ides","tr":["essentials"],"L":{"en":{"t":"How to install Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ is distributed through its GitHub repository, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Installing it gives you a single executable called <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Binaries<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ready-made binaries of the current release are available for Windows, macOS, and Linux.<\/span> <span class=\"sg\" data-s=\"1\">Download the one for your operating system from the repository’s releases page — there is nothing else to set up, as Raku++ has no separate virtual machine to install.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Building from source<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Because Raku++ is written in C++, you can also build it yourself from the source code in the repository.<\/span> <span class=\"sg\" data-s=\"1\">The repository explains which tools you need and how to compile it.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Version numbers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can check which version you have with the <code>--version<\/code> option:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The line tells you the release of Raku++ itself (<code>0.5.1<\/code>) and which version of the Raku language it targets (<code>6.d<\/code>, with some <code>6.e<\/code> features).<\/span> <span class=\"sg\" data-s=\"1\">Compare this with the Rakudo version banner on the <a href=\"/essentials/how-to-install-rakudo/\">Rakudo installation page<\/a> to see how the two compilers report themselves.<\/span><\/p>"]]},"de":{"t":"Wie man Raku++ installiert","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ wird über sein GitHub-Repository <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a> verbreitet.<\/span> <span class=\"sg\" data-s=\"1\">Die Installation liefert Ihnen eine einzige ausführbare Datei namens <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Binärdateien<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fertige Binärdateien der aktuellen Veröffentlichung gibt es für Windows, macOS und Linux.<\/span> <span class=\"sg\" data-s=\"1\">Laden Sie die passende für Ihr Betriebssystem von der Releases-Seite des Repositorys herunter — mehr ist nicht einzurichten, denn Raku++ hat keine gesonderte virtuelle Maschine zu installieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aus dem Quellcode bauen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da Raku++ in C++ geschrieben ist, können Sie ihn auch selbst aus dem Quellcode im Repository bauen.<\/span> <span class=\"sg\" data-s=\"1\">Das Repository erklärt, welche Werkzeuge Sie brauchen und wie Sie ihn übersetzen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versionsnummern<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Welche Version Sie haben, sehen Sie mit der Option <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Zeile nennt die Veröffentlichung von Raku++ selbst (<code>0.5.1<\/code>) und die Version der Sprache Raku, auf die er zielt (<code>6.d<\/code>, mit einigen Möglichkeiten aus <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Vergleichen Sie das mit dem Versionsbanner von Rakudo auf der <a href=\"https://course.raku.org/de/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Seite zur Rakudo-Installation<\/a>, um zu sehen, wie sich die beiden Compiler jeweils melden.<\/span><\/p>"]]},"nl":{"t":"Raku++ installeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ wordt verspreid via zijn GitHub-repository, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Bij installatie krijg je één uitvoerbaar bestand met de naam <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Binaire bestanden<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kant-en-klare binaire bestanden van de huidige uitgave zijn beschikbaar voor Windows, macOS en Linux.<\/span> <span class=\"sg\" data-s=\"1\">Download het bestand voor jouw besturingssysteem van de releasespagina van de repository — er is verder niets in te stellen, omdat Raku++ geen aparte virtuele machine heeft die geïnstalleerd moet worden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bouwen vanaf de broncode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat Raku++ in C++ geschreven is, kun je het ook zelf bouwen vanaf de broncode in de repository.<\/span> <span class=\"sg\" data-s=\"1\">De repository legt uit welke hulpmiddelen je nodig hebt en hoe je het compileert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt met de optie <code>--version<\/code> controleren welke versie je hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De regel vertelt je welke uitgave van Raku++ zelf je hebt (<code>0.5.1<\/code>) en op welke versie van de taal Raku die mikt (<code>6.d<\/code>, met enkele mogelijkheden uit <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk dit met de versieregel van Rakudo op de <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">installatiepagina van Rakudo<\/a> om te zien hoe de twee compilers zichzelf melden.<\/span><\/p>"]]},"es":{"t":"Cómo instalar Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ se distribuye a través de su repositorio de GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Instalarlo te da un único ejecutable llamado <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Binarios<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para la versión actual hay binarios ya preparados para Windows, macOS y Linux.<\/span> <span class=\"sg\" data-s=\"1\">Descarga el de tu sistema operativo desde la página de versiones del repositorio: no hay nada más que configurar, porque Raku++ no tiene ninguna máquina virtual aparte que instalar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Compilar desde el código fuente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como Raku++ está escrito en C++, también puedes compilarlo tú mismo a partir del código fuente del repositorio.<\/span> <span class=\"sg\" data-s=\"1\">El repositorio explica qué herramientas hacen falta y cómo compilarlo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes comprobar qué versión tienes con la opción <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La línea te dice la versión de Raku++ (<code>0.5.1<\/code>) y qué versión del lenguaje Raku toma como objetivo (<code>6.d<\/code>, con algunas funcionalidades de <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Compárala con el mensaje de versión de Rakudo en la <a href=\"https://course.raku.org/es/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">página de instalación de Rakudo<\/a> para ver cómo se presenta cada compilador.<\/span><\/p>"]]},"it":{"t":"Come installare Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ viene distribuito attraverso il suo repository GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Installarlo ti dà un unico eseguibile chiamato <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Binari<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per la release attuale sono disponibili binari già pronti per Windows, macOS e Linux.<\/span> <span class=\"sg\" data-s=\"1\">Scarica quello per il tuo sistema operativo dalla pagina delle release del repository — non c'è altro da configurare, perché Raku++ non ha una macchina virtuale separata da installare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Compilazione dai sorgenti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché Raku++ è scritto in C++, puoi anche compilarlo tu stesso a partire dal codice sorgente nel repository.<\/span> <span class=\"sg\" data-s=\"1\">Il repository spiega quali strumenti servono e come compilarlo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi controllare quale versione hai con l'opzione <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La riga ti dice la release di Raku++ stesso (<code>0.5.1<\/code>) e quale versione del linguaggio Raku prende di mira (<code>6.d<\/code>, con alcune funzionalità di <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Confrontala con l'intestazione di versione di Rakudo nella <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">pagina di installazione di Rakudo<\/a> per vedere come i due compilatori si presentano.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ tiek izplatīts caur savu GitHub repozitoriju <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Instalējot to, jūs iegūstat vienu izpildāmo failu ar nosaukumu <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Binārie faili<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gatavi pašreizējā izlaiduma binārie faili ir pieejami Windows, macOS un Linux videi.<\/span> <span class=\"sg\" data-s=\"1\">Lejupielādējiet savai operētājsistēmai atbilstošo no repozitorija izlaidumu lappuses — nekas cits nav jāiestata, jo Raku++ nav atsevišķas virtuālās mašīnas, ko instalēt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Būvēšana no pirmkoda<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā Raku++ ir uzrakstīts C++ valodā, to var arī uzbūvēt pašam no repozitorijā esošā pirmkoda.<\/span> <span class=\"sg\" data-s=\"1\">Repozitorijā ir paskaidrots, kādi rīki nepieciešami un kā to kompilēt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kāda versija jums ir, var pārbaudīt ar opciju <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rinda pasaka, kurš ir paša Raku++ izlaidums (<code>0.5.1<\/code>) un uz kuru Raku valodas versiju tas tēmē (<code>6.d<\/code> ar dažām <code>6.e<\/code> iespējām).<\/span> <span class=\"sg\" data-s=\"1\">Salīdziniet to ar Rakudo versijas paziņojumu <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo instalēšanas lappusē<\/a>, lai redzētu, kā abi kompilatori sevi pieteic.<\/span><\/p>"]]},"ru":{"t":"Как установить Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ распространяется через свой репозиторий на GitHub — <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">После установки у вас появится единственный исполняемый файл под названием <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Готовые сборки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Готовые сборки текущего выпуска доступны для Windows, macOS и Linux.<\/span> <span class=\"sg\" data-s=\"1\">Скачайте ту, что подходит вашей операционной системе, со страницы релизов репозитория — больше настраивать нечего, поскольку у Raku++ нет отдельной виртуальной машины, которую надо было бы устанавливать.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сборка из исходного кода<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так как Raku++ написан на C++, вы можете собрать его и самостоятельно из исходного кода в репозитории.<\/span> <span class=\"sg\" data-s=\"1\">В репозитории описано, какие инструменты для этого нужны и как выполнить сборку.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Узнать, какая у вас версия, можно с помощью опции <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта строка сообщает и выпуск самого Raku++ (<code>0.5.1<\/code>), и версию языка Raku, на которую он ориентируется (<code>6.d<\/code>, с некоторыми возможностями <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Сравните её с приветственной строкой версии Rakudo на странице <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">установки Rakudo<\/a>, чтобы увидеть, как каждый из компиляторов представляется.<\/span><\/p>"]]},"uk":{"t":"Як встановити Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ розповсюджується через свій репозиторій на GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Після встановлення ви отримуєте єдиний виконуваний файл під назвою <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Бінарні файли<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Готові бінарні файли поточного випуску доступні для Windows, macOS і Linux.<\/span> <span class=\"sg\" data-s=\"1\">Завантажте той, що відповідає вашій операційній системі, зі сторінки випусків репозиторію — більше нічого налаштовувати не потрібно, бо в Raku++ немає окремої віртуальної машини, яку треба встановлювати.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Збирання з вихідного коду<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки Raku++ написано мовою C++, ви можете зібрати його й самостійно з вихідного коду в репозиторії.<\/span> <span class=\"sg\" data-s=\"1\">Репозиторій пояснює, які інструменти для цього потрібні та як його скомпілювати.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дізнатися, яка версія у вас, можна за допомогою опції <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей рядок повідомляє випуск самого Raku++ (<code>0.5.1<\/code>) і те, на яку версію мови Raku він орієнтується (<code>6.d<\/code> з деякими можливостями <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте це з банером версії Rakudo на <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">сторінці встановлення Rakudo<\/a>, щоб побачити, як два компілятори представляють себе.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ се разпространява чрез хранилището си в GitHub — <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Инсталирането му ви дава един-единствен изпълним файл на име <code>rakupp<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Двоични файлове<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Готови двоични файлове на текущото издание са налични за Windows, macOS и Linux.<\/span> <span class=\"sg\" data-s=\"1\">Изтеглете този за вашата операционна система от страницата с издания на хранилището — няма какво друго да настройвате, защото Raku++ няма отделна виртуална машина за инсталиране.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изграждане от изходен код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понеже Raku++ е написан на C++, можете и сами да го изградите от изходния код в хранилището.<\/span> <span class=\"sg\" data-s=\"1\">Хранилището обяснява какви инструменти са ви нужни и как се компилира.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да проверите коя версия имате с опцията <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ (rakupp) 0.5.1 — a Raku interpreter and compiler in C++ (implements Raku 6.d, with 6.e features)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Редът ви казва изданието на самия Raku++ (<code>0.5.1<\/code>) и коя версия на езика Raku е целта му (<code>6.d<\/code>, с някои възможности от <code>6.e<\/code>).<\/span> <span class=\"sg\" data-s=\"1\">Сравнете това с надписа за версията на Rakudo на <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">страницата за инсталиране на Rakudo<\/a>, за да видите как се представят двата компилатора.<\/span><\/p>"]]}}}</script>
