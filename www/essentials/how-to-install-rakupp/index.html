<script type="application/json" id="page-data">{"u":"essentials/how-to-install-rakupp","n":7,"k":"section","pv":"essentials/the-rakupp-compiler","nx":"essentials/the-mutsu-interpreter","tr":["essentials"],"lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"How to install Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ is distributed through its website, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, and its GitHub repository, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Installing it gives you a single executable called <code>rakupp<\/code> — there is nothing else to set up, as Raku++ has no separate virtual machine to install.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The installer<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">On macOS, Linux, and the BSDs, one command downloads the build for your machine, checks it, and puts <code>rakupp<\/code> on your <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It does not need administrator rights:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">On Windows, run this in a PowerShell window instead, or download the setup wizard, <code>rakupp-setup-windows-x64.exe<\/code>, from the repository’s releases page:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The installer asks whether you also want Raku++ under the name <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Open a new terminal afterwards, so that the new <code>PATH<\/code> takes effect.<\/span> <span class=\"sg\" data-s=\"2\">Later, <code>rakupp upgrade<\/code> replaces it with the newest release.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Other ways to install<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">On macOS with Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">With Docker, without installing anything: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> starts the interactive REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Ready-made archives for each platform are on the repository’s releases page.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Because Raku++ is written in C++, you can also build it yourself from the source code; the repository explains which tools you need.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Version numbers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can check which version you have with the <code>--version<\/code> option:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The line tells you the release of Raku++ itself (<code>5.4.1<\/code>), the date it was built, and the platform the binary is for.<\/span> <span class=\"sg\" data-s=\"1\">The version of the Raku language is a separate thing, and you can ask the language itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compare this with the Rakudo version banner on the <a href=\"/essentials/how-to-install-rakudo/\">Rakudo installation page<\/a> to see how the two compilers report themselves.<\/span><\/p>"]]},"de":{"t":"Wie man Raku++ installiert","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ wird über seine Website <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> und sein GitHub-Repository <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a> verbreitet.<\/span> <span class=\"sg\" data-s=\"1\">Die Installation liefert Ihnen eine einzige ausführbare Datei namens <code>rakupp<\/code> — mehr ist nicht einzurichten, denn Raku++ hat keine gesonderte virtuelle Maschine zu installieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das Installationsprogramm<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unter macOS, Linux und den BSD-Systemen lädt ein einziger Befehl den passenden Build für Ihren Rechner herunter, prüft ihn und nimmt <code>rakupp<\/code> in Ihren <code>PATH<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Administratorrechte sind dafür nicht nötig:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unter Windows führen Sie stattdessen Folgendes in einem PowerShell-Fenster aus, oder Sie laden den Installationsassistenten <code>rakupp-setup-windows-x64.exe<\/code> von der Releases-Seite des Repositorys herunter:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Installationsprogramm fragt, ob Sie Raku++ zusätzlich unter dem Namen <code>raku<\/code> haben möchten.<\/span> <span class=\"sg\" data-s=\"1\">Öffnen Sie danach ein neues Terminal, damit der neue <code>PATH<\/code> wirksam wird.<\/span> <span class=\"sg\" data-s=\"2\">Später ersetzt <code>rakupp upgrade<\/code> die installierte Version durch die neueste Veröffentlichung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere Installationswege<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Unter macOS mit Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Mit Docker, ganz ohne Installation: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> startet die interaktive REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Fertige Archive für jede Plattform gibt es auf der Releases-Seite des Repositorys.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Da Raku++ in C++ geschrieben ist, können Sie ihn auch selbst aus dem Quellcode bauen; das Repository erklärt, welche Werkzeuge Sie brauchen.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versionsnummern<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Welche Version Sie haben, sehen Sie mit der Option <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Zeile nennt die Veröffentlichung von Raku++ selbst (<code>5.4.1<\/code>), das Datum, an dem die Binärdatei gebaut wurde, und die Plattform, für die sie bestimmt ist.<\/span> <span class=\"sg\" data-s=\"1\">Die Version der Sprache Raku ist eine andere Sache, und Sie können die Sprache selbst danach fragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergleichen Sie das mit dem Versionsbanner von Rakudo auf der <a href=\"https://course.raku.org/de/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Seite zur Rakudo-Installation<\/a>, um zu sehen, wie sich die beiden Compiler jeweils melden.<\/span><\/p>"]]},"nl":{"t":"Raku++ installeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ wordt verspreid via zijn website, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, en zijn GitHub-repository, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Bij installatie krijg je één uitvoerbaar bestand met de naam <code>rakupp<\/code> — er is verder niets in te stellen, omdat Raku++ geen aparte virtuele machine heeft die geïnstalleerd moet worden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het installatieprogramma<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Op macOS, Linux en de BSD's downloadt één opdracht de build voor jouw machine, controleert die en zet <code>rakupp<\/code> in je <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt daar geen beheerdersrechten voor nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Op Windows voer je in plaats daarvan dit uit in een PowerShell-venster, of je downloadt de installatiewizard, <code>rakupp-setup-windows-x64.exe<\/code>, van de releasespagina van de repository:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het installatieprogramma vraagt of je Raku++ ook onder de naam <code>raku<\/code> wilt hebben.<\/span> <span class=\"sg\" data-s=\"1\">Open daarna een nieuwe terminal, zodat het nieuwe <code>PATH<\/code> van kracht wordt.<\/span> <span class=\"sg\" data-s=\"2\">Later vervangt <code>rakupp upgrade<\/code> het door de nieuwste uitgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere manieren om te installeren<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Op macOS met Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Met Docker, zonder iets te installeren: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> start de interactieve REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Kant-en-klare archieven voor elk platform staan op de releasespagina van de repository.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Omdat Raku++ in C++ geschreven is, kun je het ook zelf bouwen vanaf de broncode; de repository legt uit welke hulpmiddelen je nodig hebt.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt met de optie <code>--version<\/code> controleren welke versie je hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De regel vertelt je welke uitgave van Raku++ zelf je hebt (<code>5.4.1<\/code>), op welke datum die gebouwd is en voor welk platform het binaire bestand bedoeld is.<\/span> <span class=\"sg\" data-s=\"1\">De versie van de taal Raku is iets anders, en die kun je aan de taal zelf vragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergelijk dit met de versieregel van Rakudo op de <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">installatiepagina van Rakudo<\/a> om te zien hoe de twee compilers zichzelf melden.<\/span><\/p>"]]},"es":{"t":"Cómo instalar Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ se distribuye a través de su sitio web, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, y de su repositorio de GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Instalarlo te da un único ejecutable llamado <code>rakupp<\/code>: no hay nada más que configurar, porque Raku++ no tiene ninguna máquina virtual aparte que instalar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El instalador<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En macOS, Linux y los sistemas BSD, un solo comando descarga la versión adecuada para tu máquina, la verifica y pone <code>rakupp<\/code> en tu <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">No necesita permisos de administrador:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En Windows, ejecuta en cambio lo siguiente en una ventana de PowerShell, o descarga el asistente de instalación, <code>rakupp-setup-windows-x64.exe<\/code>, desde la página de versiones del repositorio:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El instalador te pregunta si quieres tener Raku++ también con el nombre <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después abre una terminal nueva para que el nuevo <code>PATH<\/code> surta efecto.<\/span> <span class=\"sg\" data-s=\"2\">Más adelante, <code>rakupp upgrade<\/code> lo sustituye por la versión más reciente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otras formas de instalarlo<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">En macOS con Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Con Docker, sin instalar nada: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> inicia el REPL interactivo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">En la página de versiones del repositorio hay archivos comprimidos ya preparados para cada plataforma.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Como Raku++ está escrito en C++, también puedes compilarlo tú mismo a partir del código fuente; el repositorio explica qué herramientas hacen falta.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes comprobar qué versión tienes con la opción <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La línea te dice la versión de Raku++ (<code>5.4.1<\/code>), la fecha en que se compiló y la plataforma para la que es el binario.<\/span> <span class=\"sg\" data-s=\"1\">La versión del lenguaje Raku es otra cosa, y puedes preguntársela al propio lenguaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compáralo con el mensaje de versión de Rakudo en la <a href=\"https://course.raku.org/es/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">página de instalación de Rakudo<\/a> para ver cómo se presenta cada compilador.<\/span><\/p>"]]},"it":{"t":"Come installare Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ viene distribuito attraverso il suo sito web, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, e il suo repository GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Installarlo ti dà un unico eseguibile chiamato <code>rakupp<\/code> — non c'è altro da configurare, perché Raku++ non ha una macchina virtuale separata da installare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il programma di installazione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Su macOS, Linux e i sistemi BSD, un solo comando scarica la build per la tua macchina, la verifica e mette <code>rakupp<\/code> nel tuo <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non servono i diritti di amministratore:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Su Windows, esegui invece questo comando in una finestra di PowerShell, oppure scarica la procedura guidata di installazione, <code>rakupp-setup-windows-x64.exe<\/code>, dalla pagina delle release del repository:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il programma di installazione chiede se vuoi avere Raku++ anche con il nome <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Al termine, apri un nuovo terminale, in modo che il nuovo <code>PATH<\/code> abbia effetto.<\/span> <span class=\"sg\" data-s=\"2\">In seguito, <code>rakupp upgrade<\/code> lo sostituisce con la release più recente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri modi per installarlo<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Su macOS con Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Con Docker, senza installare nulla: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> avvia il REPL interattivo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Archivi già pronti per ogni piattaforma si trovano nella pagina delle release del repository.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poiché Raku++ è scritto in C++, puoi anche compilarlo tu stesso a partire dal codice sorgente; il repository spiega quali strumenti servono.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi controllare quale versione hai con l'opzione <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La riga ti dice la release di Raku++ stesso (<code>5.4.1<\/code>), la data in cui è stato compilato e la piattaforma a cui è destinato il binario.<\/span> <span class=\"sg\" data-s=\"1\">La versione del linguaggio Raku è un'altra cosa, e puoi chiederla al linguaggio stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Confronta queste informazioni con l'intestazione di versione di Rakudo nella <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">pagina di installazione di Rakudo<\/a> per vedere come i due compilatori si presentano.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ tiek izplatīts caur savu tīmekļa vietni <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> un savu GitHub repozitoriju <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Instalējot to, jūs iegūstat vienu izpildāmo failu ar nosaukumu <code>rakupp<\/code> — nekas cits nav jāiestata, jo Raku++ nav atsevišķas virtuālās mašīnas, ko instalēt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzstādītājs<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">macOS, Linux un BSD sistēmās viena komanda lejupielādē jūsu datoram atbilstošo būvējumu, pārbauda to un padara <code>rakupp<\/code> pieejamu caur jūsu <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Administratora tiesības tam nav vajadzīgas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Windows sistēmā tā vietā izpildiet šo PowerShell logā vai lejupielādējiet instalēšanas vedni <code>rakupp-setup-windows-x64.exe<\/code> no repozitorija izlaidumu lappuses:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzstādītājs pajautā, vai vēlaties Raku++ arī ar nosaukumu <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam atveriet jaunu termināli, lai jaunais <code>PATH<\/code> stātos spēkā.<\/span> <span class=\"sg\" data-s=\"2\">Vēlāk <code>rakupp upgrade<\/code> to aizstāj ar jaunāko izlaidumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi instalēšanas veidi<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">macOS sistēmā ar Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Ar Docker, neko neinstalējot: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> palaiž interaktīvo REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Gatavi arhīvi katrai platformai ir atrodami repozitorija izlaidumu lappusē.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Tā kā Raku++ ir uzrakstīts C++ valodā, to var arī uzbūvēt pašam no pirmkoda; repozitorijā ir paskaidrots, kādi rīki nepieciešami.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kāda versija jums ir, var pārbaudīt ar opciju <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rinda pasaka, kurš ir paša Raku++ izlaidums (<code>5.4.1<\/code>), kurā datumā tas uzbūvēts un kurai platformai binārais fails paredzēts.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodas versija ir cita lieta, un to varat pajautāt pašai valodai:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar Rakudo versijas paziņojumu <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo instalēšanas lappusē<\/a>, lai redzētu, kā abi kompilatori sevi pieteic.<\/span><\/p>"]]},"ru":{"t":"Как установить Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ распространяется через свой сайт <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> и свой репозиторий на GitHub — <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">После установки у вас появится единственный исполняемый файл под названием <code>rakupp<\/code> — больше настраивать нечего, поскольку у Raku++ нет отдельной виртуальной машины, которую надо было бы устанавливать.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Установщик<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В macOS, Linux и системах BSD одна команда скачивает сборку для вашего компьютера, проверяет её и добавляет <code>rakupp<\/code> в ваш <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Права администратора для этого не нужны:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В Windows вместо этого выполните следующую команду в окне PowerShell или скачайте мастер установки <code>rakupp-setup-windows-x64.exe<\/code> со страницы релизов репозитория:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Установщик спросит, хотите ли вы, чтобы Raku++ был доступен ещё и под именем <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После установки откройте новое окно терминала, чтобы новый <code>PATH<\/code> вступил в силу.<\/span> <span class=\"sg\" data-s=\"2\">Позже команда <code>rakupp upgrade<\/code> обновит его до самого свежего выпуска.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие способы установки<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">В macOS через Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Через Docker, ничего не устанавливая: команда <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> запускает интерактивную оболочку REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Готовые архивы для каждой платформы лежат на странице релизов репозитория.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Так как Raku++ написан на C++, вы можете собрать его и самостоятельно из исходного кода; в репозитории описано, какие инструменты для этого нужны.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Узнать, какая у вас версия, можно с помощью опции <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта строка сообщает выпуск самого Raku++ (<code>5.4.1<\/code>), дату его сборки и платформу, для которой собран исполняемый файл.<\/span> <span class=\"sg\" data-s=\"1\">Версия языка Raku — это отдельная вещь, и её можно узнать у самого языка:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравните это с приветственной строкой версии Rakudo на странице <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">установки Rakudo<\/a>, чтобы увидеть, как каждый из компиляторов представляется.<\/span><\/p>"]]},"uk":{"t":"Як встановити Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ розповсюджується через свій сайт, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, і свій репозиторій на GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Після встановлення ви отримуєте єдиний виконуваний файл під назвою <code>rakupp<\/code> — більше нічого налаштовувати не потрібно, бо в Raku++ немає окремої віртуальної машини, яку треба встановлювати.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Встановлювач<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У macOS, Linux і системах BSD одна команда завантажує збірку для вашого комп'ютера, перевіряє її та додає <code>rakupp<\/code> до вашого <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Права адміністратора для цього не потрібні:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У Windows натомість виконайте цю команду у вікні PowerShell або завантажте майстер встановлення <code>rakupp-setup-windows-x64.exe<\/code> зі сторінки випусків репозиторію:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Встановлювач запитає, чи хочете ви, щоб Raku++ був доступний ще й під назвою <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після цього відкрийте новий термінал, щоб новий <code>PATH<\/code> набув чинності.<\/span> <span class=\"sg\" data-s=\"2\">Згодом команда <code>rakupp upgrade<\/code> оновить його до найсвіжішого випуску.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші способи встановлення<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">У macOS за допомогою Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Через Docker, нічого не встановлюючи: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> запускає інтерактивну оболонку REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Готові архіви для кожної платформи є на сторінці випусків репозиторію.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Оскільки Raku++ написано мовою C++, ви можете зібрати його й самостійно з вихідного коду; репозиторій пояснює, які інструменти для цього потрібні.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дізнатися, яка версія у вас, можна за допомогою опції <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей рядок повідомляє випуск самого Raku++ (<code>5.4.1<\/code>), дату його збирання та платформу, для якої призначено виконуваний файл.<\/span> <span class=\"sg\" data-s=\"1\">Версія мови Raku — окрема річ, і про неї можна запитати саму мову:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порівняйте це з банером версії Rakudo на <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">сторінці встановлення Rakudo<\/a>, щоб побачити, як два компілятори представляють себе.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ се разпространява чрез сайта си, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, и хранилището си в GitHub — <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Инсталирането му ви дава един-единствен изпълним файл на име <code>rakupp<\/code> — няма какво друго да настройвате, защото Raku++ няма отделна виртуална машина за инсталиране.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Инсталаторът<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В macOS, Linux и BSD системите една команда изтегля компилацията за вашата машина, проверява я и поставя <code>rakupp<\/code> във вашия <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Не са нужни администраторски права:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В Windows вместо това изпълнете следното в прозорец на PowerShell или изтеглете съветника за инсталиране <code>rakupp-setup-windows-x64.exe<\/code> от страницата с издания на хранилището:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Инсталаторът ще ви попита дали искате Raku++ да е достъпен и под името <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това отворете нов терминал, за да влезе в сила новият <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По-късно <code>rakupp upgrade<\/code> ще го замени с най-новото издание.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други начини за инсталиране<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">В macOS с Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">С Docker, без да инсталирате нищо: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> стартира интерактивната обвивка REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Готови архиви за всяка платформа има на страницата с издания на хранилището.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Понеже Raku++ е написан на C++, можете и сами да го изградите от изходния код; хранилището обяснява какви инструменти са ви нужни.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да проверите коя версия имате с опцията <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Редът ви казва изданието на самия Raku++ (<code>5.4.1<\/code>), датата, на която е изграден, и платформата, за която е предназначен двоичният файл.<\/span> <span class=\"sg\" data-s=\"1\">Версията на езика Raku е отделно нещо и можете да попитате самия език:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравнете това с надписа за версията на Rakudo на <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">страницата за инсталиране на Rakudo<\/a>, за да видите как се представят двата компилатора.<\/span><\/p>"]]},"eo":{"t":"Kiel instali Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ estas distribuata per sia retejo, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, kaj per sia deponejo en GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Instali ĝin donas al vi unu solan rulebladosieron nomatan <code>rakupp<\/code> — estas nenio alia por agordi, ĉar Raku++ havas neniun apartan virtualan maŝinon por instali.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La instalilo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sur macOS, Linukso kaj la BSD-sistemoj unu sola komando elŝutas la binaraĵon por via maŝino, kontrolas ĝin kaj metas <code>rakupp<\/code> en vian <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne bezonas administrantajn rajtojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sur Vindozo, rulu anstataŭe ĉi tion en fenestro de PowerShell, aŭ elŝutu la instalan asistanton, <code>rakupp-setup-windows-x64.exe<\/code>, el la eldona paĝo de la deponejo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La instalilo demandas, ĉu vi volas havi Raku++ ankaŭ sub la nomo <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste malfermu novan terminalon, por ke la nova <code>PATH<\/code> ekvalidu.<\/span> <span class=\"sg\" data-s=\"2\">Pli malfrue <code>rakupp upgrade<\/code> anstataŭigas ĝin per la plej nova eldono.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj manieroj instali<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Sur macOS per Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Per Docker, sen instali ion ajn: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> lanĉas la interagan ŝelon REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Pretaj arkivoj por ĉiu platformo troviĝas en la eldona paĝo de la deponejo.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Ĉar Raku++ estas skribita en C++, vi ankaŭ povas konstrui ĝin mem el la fontkodo; la deponejo klarigas, kiujn ilojn vi bezonas.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiaj numeroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas kontroli, kiun version vi havas, per la opcio <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La linio diras al vi la eldonon de Raku++ mem (<code>5.4.1<\/code>), la daton, kiam ĝi estis konstruita, kaj la platformon, por kiu la binaraĵo estas destinita.<\/span> <span class=\"sg\" data-s=\"1\">La versio de la lingvo Raku estas aparta afero, kaj vi povas demandi pri ĝi la lingvon mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Komparu tion kun la versia mesaĝo de Rakudo en la <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">paĝo pri instalado de Rakudo<\/a> por vidi, kiel la du kompililoj raportas sin.<\/span><\/p>"]]},"la":{"t":"Quomodo Raku++ installare 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ per suum situm interretialem, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, et per suum repositorium GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>, distribuitur.<\/span> <span class=\"sg\" data-s=\"1\">Illud installans unum programma exsecutabile accipis, nomine <code>rakupp<\/code> — nihil aliud parandum est, quia Raku++ nullam machinam virtualem separatam habet quae installanda sit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma installationis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In macOS, Linux et systematibus BSD unum imperatum versionem machinae tuae aptam deprimit, examinat, et <code>rakupp<\/code> in <code>PATH<\/code> tuum ponit.<\/span> <span class=\"sg\" data-s=\"1\">Iura administratoris non requirit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In Windows hoc potius in fenestra PowerShell exsequere, vel ducem installationis, <code>rakupp-setup-windows-x64.exe<\/code>, ex pagina emissionum repositorii deprime:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma installationis rogat num Raku++ etiam sub nomine <code>raku<\/code> habere velis.<\/span> <span class=\"sg\" data-s=\"1\">Deinde terminalem novum aperi, ut novum <code>PATH<\/code> vim habeat.<\/span> <span class=\"sg\" data-s=\"2\">Postea <code>rakupp upgrade<\/code> emissionem novissimam in eius locum ponit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alii modi installandi<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">In macOS cum Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Cum Docker, nihil installans: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> corticem REPL interactivum incipit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Archiva compressa parata pro singulis systematibus in pagina emissionum repositorii inveniuntur.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Quia Raku++ in C++ scriptum est, illud etiam ipse ex codice fonte aedificare potes; repositorium explicat quibus instrumentis egeas.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quam versionem habeas per optionem <code>--version<\/code> inspicere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Linea tibi indicat emissionem ipsius Raku++ (<code>5.4.1<\/code>), diem quo aedificatum est, et systema cui binarium destinatur.<\/span> <span class=\"sg\" data-s=\"1\">Versio linguae Raku res separata est, quam ab ipsa lingua quaerere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc cum vexillo versionis Rakudo in <a href=\"https://course.raku.org/la/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">pagina installationis Rakudo<\/a> confer, ut videas quomodo duo compilatores se ipsos nuntient.<\/span><\/p>"]]}}}</script>
