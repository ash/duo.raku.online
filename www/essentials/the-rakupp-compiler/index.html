<script type="application/json" id="page-data">{"u":"essentials/the-rakupp-compiler","n":6,"k":"section","pv":"essentials/how-to-install-rakudo","nx":"essentials/how-to-install-rakupp","tr":["essentials"],"lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Raku++ compiler","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — its executable is called <code>rakupp<\/code> — is a second Raku compiler, first released in July 2026.<\/span> <span class=\"sg\" data-s=\"1\">Where Rakudo runs on the MoarVM virtual machine, Raku++ is written in <strong>C++<\/strong> and needs no virtual machine of its own.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">It is both an <strong>interpreter<\/strong> and a <strong>compiler<\/strong>: it can run a program directly, or translate it into native code for extra speed.<\/span> <span class=\"sg\" data-s=\"1\">Because there is no heavy runtime to start up, <code>rakupp<\/code> launches in just a few milliseconds, which makes it pleasant for short scripts and everyday command-line work.<\/span> <span class=\"sg\" data-s=\"2\">Its author describes it as the fastest Raku compiler.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ implements Raku 6.d by default, and 6.e when a program asks for it with <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Version 5.4.1, released in October 2026, passes all 1,425 test files of the Roast suite — the official set of Raku tests.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ also runs in a web browser: compiled to WebAssembly, it powers the playground at <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, where you can try Raku without installing anything.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Interpreter and compiler modes<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run a program straight away, just as you would with Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Or ask Raku++ to turn a program into a standalone native executable, which runs even faster:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For everyday learning the plain interpreter mode is all you need; the compiling modes are there when you want the extra speed.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Source code<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ is open source.<\/span> <span class=\"sg\" data-s=\"1\">You can find it, together with release binaries and build instructions, at <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"de":{"t":"Der Raku++-Compiler","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — seine ausführbare Datei heißt <code>rakupp<\/code> — ist ein zweiter Raku-Compiler, erstmals veröffentlicht im Juli 2026.<\/span> <span class=\"sg\" data-s=\"1\">Während Rakudo auf der virtuellen Maschine MoarVM läuft, ist Raku++ in <strong>C++<\/strong> geschrieben und braucht keine eigene virtuelle Maschine.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er ist zugleich <strong>Interpreter<\/strong> und <strong>Compiler<\/strong>: Er kann ein Programm direkt ausführen oder es für zusätzliche Geschwindigkeit in nativen Code übersetzen.<\/span> <span class=\"sg\" data-s=\"1\">Da keine schwergewichtige Laufzeitumgebung hochgefahren werden muss, startet <code>rakupp<\/code> in wenigen Millisekunden, was ihn für kurze Skripte und die alltägliche Arbeit auf der Befehlszeile angenehm macht.<\/span> <span class=\"sg\" data-s=\"2\">Sein Autor beschreibt ihn als den schnellsten Raku-Compiler.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ implementiert standardmäßig Raku 6.d und, wenn ein Programm dies mit <code>use v6.e.PREVIEW<\/code> verlangt, auch 6.e.<\/span> <span class=\"sg\" data-s=\"1\">Version 5.4.1, veröffentlicht im Oktober 2026, besteht alle 1.425 Testdateien der Roast-Testsuite — der offiziellen Sammlung von Raku-Tests.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ läuft auch im Webbrowser: Nach WebAssembly übersetzt, steckt er hinter dem Spielplatz auf <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, wo Sie Raku ausprobieren können, ohne etwas zu installieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Interpreter- und Compiler-Modus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Führen Sie ein Programm direkt aus, genau wie mit Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oder lassen Sie Raku++ aus einem Programm eine eigenständige native ausführbare Datei machen, die noch schneller läuft:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zum alltäglichen Lernen genügt der einfache Interpreter-Modus völlig; die übersetzenden Modi sind da, wenn Sie zusätzliche Geschwindigkeit wollen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellcode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ ist quelloffen.<\/span> <span class=\"sg\" data-s=\"1\">Sie finden ihn samt Release-Binärdateien und Bauanleitung unter <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"nl":{"t":"De Raku++-compiler","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — het uitvoerbare bestand heet <code>rakupp<\/code> — is een tweede Raku-compiler, voor het eerst uitgebracht in juli 2026.<\/span> <span class=\"sg\" data-s=\"1\">Waar Rakudo op de virtuele machine MoarVM draait, is Raku++ in <strong>C++<\/strong> geschreven en heeft het geen eigen virtuele machine nodig.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het is zowel een <strong>interpreter<\/strong> als een <strong>compiler<\/strong>: het kan een programma direct uitvoeren of het vertalen naar machinecode voor extra snelheid.<\/span> <span class=\"sg\" data-s=\"1\">Omdat er geen zware runtime opgestart hoeft te worden, start <code>rakupp<\/code> in slechts een paar milliseconden, wat prettig is voor korte scripts en dagelijks werk op de opdrachtregel.<\/span> <span class=\"sg\" data-s=\"2\">De auteur beschrijft het als de snelste Raku-compiler.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ implementeert standaard Raku 6.d, en 6.e wanneer een programma daarom vraagt met <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Versie 5.4.1, uitgebracht in oktober 2026, doorstaat alle 1.425 testbestanden van de testsuite Roast — de officiële verzameling Raku-tests.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ draait ook in een webbrowser: gecompileerd naar WebAssembly vormt het de motor van de speeltuin op <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, waar je Raku kunt uitproberen zonder iets te installeren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Interpreter- en compilermodus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voer een programma meteen uit, net zoals je met Rakudo zou doen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of vraag Raku++ om een programma om te zetten in een zelfstandig uitvoerbaar bestand, dat nog sneller draait:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor dagelijks leren is de gewone interpretermodus alles wat je nodig hebt; de compilerende modi staan klaar wanneer je die extra snelheid wilt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Broncode<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ is open source.<\/span> <span class=\"sg\" data-s=\"1\">Je vindt het, samen met de binaire bestanden van de uitgaven en bouwinstructies, op <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"es":{"t":"El compilador Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — cuyo ejecutable se llama <code>rakupp<\/code> — es un segundo compilador de Raku, publicado por primera vez en julio de 2026.<\/span> <span class=\"sg\" data-s=\"1\">Mientras que Rakudo se ejecuta sobre la máquina virtual MoarVM, Raku++ está escrito en <strong>C++<\/strong> y no necesita ninguna máquina virtual propia.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es a la vez un <strong>intérprete<\/strong> y un <strong>compilador<\/strong>: puede ejecutar un programa directamente o traducirlo a código nativo para ganar velocidad.<\/span> <span class=\"sg\" data-s=\"1\">Como no hay ningún runtime pesado que arrancar, <code>rakupp<\/code> se pone en marcha en unos pocos milisegundos, lo que lo hace agradable para guiones cortos y para el trabajo diario en la línea de comandos.<\/span> <span class=\"sg\" data-s=\"2\">Su autor lo describe como el compilador de Raku más rápido.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ implementa Raku 6.d por omisión, y 6.e cuando un programa lo pide con <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La versión 5.4.1, publicada en octubre de 2026, pasa todos los archivos de pruebas de la suite Roast, 1425 en total — el conjunto oficial de pruebas de Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ también funciona en un navegador web: compilado a WebAssembly, es el motor del campo de pruebas de <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, donde puedes probar Raku sin instalar nada.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modos de intérprete y de compilador<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ejecuta un programa directamente, igual que harías con Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">O pídele a Raku++ que convierta un programa en un ejecutable nativo autónomo, que corre aún más rápido:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para aprender a diario basta con el modo intérprete; los modos de compilación están ahí para cuando quieras la velocidad extra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ es de código abierto.<\/span> <span class=\"sg\" data-s=\"1\">Puedes encontrarlo, junto con los binarios de las versiones y las instrucciones de compilación, en <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"it":{"t":"Il compilatore Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — il cui eseguibile si chiama <code>rakupp<\/code> — è un secondo compilatore Raku, uscito per la prima volta nel luglio 2026.<\/span> <span class=\"sg\" data-s=\"1\">Mentre Rakudo gira sulla macchina virtuale MoarVM, Raku++ è scritto in <strong>C++<\/strong> e non ha bisogno di alcuna macchina virtuale.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">È al tempo stesso un <strong>interprete<\/strong> e un <strong>compilatore<\/strong>: può eseguire un programma direttamente oppure tradurlo in codice nativo per guadagnare velocità.<\/span> <span class=\"sg\" data-s=\"1\">Poiché non c'è alcun runtime pesante da avviare, <code>rakupp<\/code> parte in pochi millisecondi, il che lo rende piacevole per gli script brevi e per il lavoro quotidiano dalla riga di comando.<\/span> <span class=\"sg\" data-s=\"2\">Il suo autore lo descrive come il compilatore Raku più veloce.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ implementa Raku 6.d per impostazione predefinita, e 6.e quando un programma lo richiede con <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La versione 5.4.1, uscita nell'ottobre 2026, supera tutti i 1.425 file di test della suite Roast — l'insieme ufficiale dei test di Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ gira anche in un browser web: compilato in WebAssembly, è il motore del campo da gioco su <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, dove puoi provare Raku senza installare nulla.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modalità interprete e compilatore<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esegui un programma direttamente, proprio come faresti con Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oppure chiedi a Raku++ di trasformare un programma in un eseguibile nativo autonomo, che gira ancora più in fretta:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per imparare tutti i giorni la semplice modalità interprete è tutto ciò che serve; le modalità di compilazione sono lì per quando vuoi la velocità in più.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ è open source.<\/span> <span class=\"sg\" data-s=\"1\">Puoi trovarlo, insieme ai binari delle release e alle istruzioni di compilazione, su <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"lv":{"t":"Kompilators Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — tā izpildāmais fails saucas <code>rakupp<\/code> — ir otrs Raku kompilators, kas pirmoreiz izlaists 2026. gada jūlijā.<\/span> <span class=\"sg\" data-s=\"1\">Kamēr Rakudo darbojas uz MoarVM virtuālās mašīnas, Raku++ ir uzrakstīts <strong>C++<\/strong> valodā, un tam nav vajadzīga sava virtuālā mašīna.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas ir gan <strong>interpretators<\/strong>, gan <strong>kompilators<\/strong>: tas var izpildīt programmu tieši vai pārtulkot to mašīnkodā, lai iegūtu papildu ātrumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā nav smagas izpildlaika vides, ko palaist, <code>rakupp<\/code> startē dažu milisekunžu laikā, kas to padara patīkamu īsiem skriptiem un ikdienas darbam komandrindā.<\/span> <span class=\"sg\" data-s=\"2\">Tā autors to raksturo kā ātrāko Raku kompilatoru.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ pēc noklusējuma implementē Raku 6.d, bet 6.e — tad, ja programma to pieprasa ar <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Versija 5.4.1, kas izlaista 2026. gada oktobrī, iztur visus 1425 testu failus no Roast testu kopas — oficiālā Raku testu komplekta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ darbojas arī tīmekļa pārlūkprogrammā: kompilēts uz WebAssembly, tas darbina spēļu laukumu vietnē <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, kur varat izmēģināt Raku, neko neinstalējot.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Interpretatora un kompilatora režīmi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu uzreiz, tāpat kā to darītu ar Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vai arī lieciet Raku++ pārvērst programmu par patstāvīgu mašīnkoda izpildāmo failu, kas darbojas vēl ātrāk:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ikdienas mācībām pietiek ar parasto interpretatora režīmu; kompilēšanas režīmi ir tur, kad vēlaties papildu ātrumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">To kopā ar izlaidumu binārajiem failiem un būvēšanas norādēm var atrast vietnē <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"ru":{"t":"Компилятор Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — его исполняемый файл называется <code>rakupp<\/code> — это второй компилятор Raku, впервые выпущенный в июле 2026 года.<\/span> <span class=\"sg\" data-s=\"1\">Если Rakudo работает на виртуальной машине MoarVM, то Raku++ написан на <strong>C++<\/strong> и не нуждается в собственной виртуальной машине.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Он одновременно и <strong>интерпретатор<\/strong>, и <strong>компилятор<\/strong>: он может выполнить программу напрямую или перевести её в машинный код ради дополнительной скорости.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку никакой тяжёлой среды выполнения запускать не нужно, <code>rakupp<\/code> стартует за считаные миллисекунды, что делает его приятным для коротких скриптов и повседневной работы в командной строке.<\/span> <span class=\"sg\" data-s=\"2\">Его автор называет Raku++ самым быстрым компилятором Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ по умолчанию реализует Raku 6.d, а 6.e — если программа запрашивает его строкой <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Версия 5.4.1, выпущенная в октябре 2026 года, проходит все 1425 тестовых файлов набора Roast — официального набора тестов Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ работает и в веб-браузере: скомпилированный в WebAssembly, он лежит в основе песочницы на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, где можно попробовать Raku, ничего не устанавливая.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режимы интерпретатора и компилятора<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустить программу сразу, так же как и с Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или попросить Raku++ превратить программу в самостоятельный исполняемый файл, который работает ещё быстрее:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для повседневного обучения вполне достаточно обычного режима интерпретатора; режимы компиляции нужны тогда, когда вам понадобится дополнительная скорость.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Найти его вместе с готовыми сборками и инструкциями по сборке можно на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"uk":{"t":"Компілятор Raku++","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — його виконуваний файл називається <code>rakupp<\/code> — це другий компілятор Raku, перший випуск якого відбувся в липні 2026 року.<\/span> <span class=\"sg\" data-s=\"1\">Якщо Rakudo працює на віртуальній машині MoarVM, то Raku++ написано мовою <strong>C++<\/strong>, і власна віртуальна машина йому не потрібна.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Він є водночас <strong>інтерпретатором<\/strong> і <strong>компілятором<\/strong>: може виконати програму напряму або перекласти її в машинний код задля додаткової швидкості.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки жодного важкого середовища виконання запускати не треба, <code>rakupp<\/code> стартує за лічені мілісекунди, що робить його приємним для коротких скриптів і щоденної роботи в командному рядку.<\/span> <span class=\"sg\" data-s=\"2\">Автор описує його як найшвидший компілятор Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ за замовчуванням реалізує Raku 6.d, а 6.e — коли програма просить про це рядком <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Версія 5.4.1, випущена в жовтні 2026 року, проходить усі 1425 тестових файлів набору Roast — офіційного набору тестів Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ також працює у веб-браузері: скомпільований у WebAssembly, він лежить в основі майданчика на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, де можна спробувати Raku, нічого не встановлюючи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режими інтерпретатора й компілятора<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Виконайте програму одразу, так само як зробили б це з Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Або попросіть Raku++ перетворити програму на самодостатній машинний виконуваний файл, який працює ще швидше:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для щоденного навчання вам вистачить звичайного режиму інтерпретатора; режими компіляції існують на той випадок, коли потрібна додаткова швидкість.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Знайти його разом із бінарними випусками та інструкціями зі збирання можна на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"bg":{"t":"Компилаторът Raku++","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — изпълнимият му файл се казва <code>rakupp<\/code> — е втори компилатор на Raku, издаден за първи път през юли 2026 г. Там, където Rakudo работи върху виртуалната машина MoarVM, Raku++ е написан на <strong>C++<\/strong> и няма нужда от собствена виртуална машина.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Той е едновременно <strong>интерпретатор<\/strong> и <strong>компилатор<\/strong>: може да изпълни програма направо или да я преведе до машинен код за допълнителна скорост.<\/span> <span class=\"sg\" data-s=\"1\">Понеже няма тежка среда за изпълнение, която да се стартира, <code>rakupp<\/code> тръгва само за няколко милисекунди, което го прави приятен за кратки скриптове и за ежедневна работа в командния ред.<\/span> <span class=\"sg\" data-s=\"2\">Авторът му го описва като най-бързия компилатор на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ реализира Raku 6.d по подразбиране и 6.e, когато програмата го поиска с <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Версия 5.4.1, издадена през октомври 2026 г., преминава всички 1425 тестови файла от набора Roast — официалния набор от тестове на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ работи и в уеб браузър: компилиран до WebAssembly, той задвижва площадката на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, където можете да изпробвате Raku, без да инсталирате нищо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режими на интерпретатор и компилатор<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изпълнете програма веднага, точно както бихте направили с Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или помолете Raku++ да превърне програмата в самостоятелен машинен изпълним файл, който работи още по-бързо:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За ежедневно учене обикновеният режим на интерпретатор е всичко, което ви трябва; компилиращите режими са налице, когато искате допълнителната скорост.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Ще го намерите заедно с двоичните файлове на изданията и указанията за изграждане на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"eo":{"t":"La kompililo Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — ĝia rulebla dosiero nomiĝas <code>rakupp<\/code> — estas dua kompililo de Raku, unue eldonita en julio 2026.<\/span> <span class=\"sg\" data-s=\"1\">Dum Rakudo rulas sur la virtuala maŝino MoarVM, Raku++ estas skribita en <strong>C++<\/strong> kaj bezonas neniun propran virtualan maŝinon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝi estas kaj <strong>interpretilo<\/strong> kaj <strong>kompililo<\/strong>: ĝi povas ruli programon rekte, aŭ traduki ĝin al maŝina kodo por plia rapideco.<\/span> <span class=\"sg\" data-s=\"1\">Ĉar ne estas peza rultempo por startigi, <code>rakupp<\/code> ekfunkcias en nur kelkaj milisekundoj, kio faras ĝin agrabla por mallongaj skriptoj kaj ĉiutaga laboro en la komandlinio.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia aŭtoro priskribas ĝin kiel la plej rapidan kompililon de Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ realigas Raku 6.d defaŭlte, kaj 6.e kiam programo petas tion per <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Versio 5.4.1, eldonita en oktobro 2026, trapasas ĉiujn 1425 testodosierojn de la testaro Roast — la oficiala aro de testoj de Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ rulas ankaŭ en retumilo: kompilita al WebAssembly, ĝi funkciigas la provejon ĉe <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>, kie vi povas provi Raku sen instali ion ajn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reĝimoj de interpretilo kaj kompililo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu programon tuj, same kiel vi farus per Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aŭ petu al Raku++ transformi programon en memstaran maŝinkodan rulebladosieron, kiu rulas eĉ pli rapide:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ĉiutaga lernado la simpla interpretila reĝimo estas ĉio, kion vi bezonas; la kompilaj reĝimoj estas tie, kiam vi volas la plian rapidecon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin, kune kun eldonaj binaraĵoj kaj konstruinstrukcioj, ĉe <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]},"la":{"t":"Compilator Raku++ 🆕","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — cuius programma exsecutabile <code>rakupp<\/code> nominatur — est alter compilator Raku, primum mense Iulio anni 2026 emissus.<\/span> <span class=\"sg\" data-s=\"1\">Ubi Rakudo in machina virtuali MoarVM currit, Raku++ in <strong>C++<\/strong> scriptum est et nulla machina virtuali propria eget.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Est simul <strong>interpres<\/strong> et <strong>compilator<\/strong>: programma directe exsequi potest, vel illud in codicem nativum transferre ad maiorem celeritatem.<\/span> <span class=\"sg\" data-s=\"1\">Quia nullum grave systema exsecutionis incipiendum est, <code>rakupp<\/code> intra pauca millisecunda incipit, quod eum ad brevia scripta et cotidianum laborem in linea imperandi iucundum reddit.<\/span> <span class=\"sg\" data-s=\"2\">Auctor eum compilatorem Raku celerrimum esse describit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ ex more Raku 6.d implet, 6.e autem cum programma id per <code>use v6.e.PREVIEW<\/code> petit.<\/span> <span class=\"sg\" data-s=\"1\">Versio 5.4.1, mense Octobri anni 2026 emissa, omnia 1425 archiva probationum seriei Roast transit — officialis series probationum Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku++ etiam in navigatro interretiali currit: in WebAssembly compilatum, palaestram apud <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> movet, ubi Raku experiri potes nihil installans.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modi interpretis et compilatoris<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma statim exsequere, sicut cum Rakudo faceres:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vel pete ut Raku++ programma in exsecutabile nativum et solitarium vertat, quod etiam celerius currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad cotidianum discendum modus interpretis simplex omnino sufficit; modi compilandi adsunt cum maiorem celeritatem desideras.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku++ fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Illud, una cum binariis emissis et praeceptis aedificandi, invenies apud <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span><\/p>"]]}}}</script>
