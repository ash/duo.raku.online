<script type="application/json" id="page-data">{"u":"essentials/the-rakudo-compiler","n":4,"k":"section","pv":"essentials/raku-vs-rakudo","nx":"essentials/how-to-install-rakudo","tr":["essentials"],"L":{"en":{"t":"The Rakudo compiler","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> is the reference implementation of Raku and the compiler this course uses.<\/span> <span class=\"sg\" data-s=\"1\">It is the most complete and battle-tested way to run Raku today, so when people say “the Raku compiler” they usually mean Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo is itself written largely in Raku, together with a smaller bootstrapping language called NQP (“Not Quite Perl”).<\/span> <span class=\"sg\" data-s=\"1\">It compiles your program to bytecode and runs it on a virtual machine called <strong>MoarVM<\/strong>, which you get automatically when you install Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Because Rakudo aims to cover the whole language, it is the safest choice when you need every corner of Raku to work.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo implements Raku 6.d and is released often, so fixes and new features reach you quickly.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The virtual machine<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">By default Rakudo runs on MoarVM, a virtual machine built specifically for Raku.<\/span> <span class=\"sg\" data-s=\"1\">The design does not tie Rakudo to one machine — it can also be built on top of other virtual machines — but MoarVM is the standard, well-supported target, and this course assumes it.<\/span> <span class=\"sg\" data-s=\"2\">This is the main difference from <a href=\"/essentials/the-rakupp-compiler/\">Raku++<\/a>, which is written in C++ and needs no virtual machine of its own.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Source code and links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo is open source and developed in the open:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo on GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"de":{"t":"Der Rakudo-Compiler","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> ist die Referenzimplementierung von Raku und der Compiler, den dieser Kurs verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Er ist heute die vollständigste und am gründlichsten erprobte Art, Raku auszuführen; wenn also von „dem Raku-Compiler“ die Rede ist, ist meist Rakudo gemeint.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo selbst ist größtenteils in Raku geschrieben, zusammen mit einer kleineren Bootstrap-Sprache namens NQP („Not Quite Perl“).<\/span> <span class=\"sg\" data-s=\"1\">Er übersetzt Ihr Programm in Bytecode und führt es auf einer virtuellen Maschine namens <strong>MoarVM<\/strong> aus, die Sie bei der Installation von Rakudo automatisch mitbekommen.<\/span> <span class=\"sg\" data-s=\"2\">Da Rakudo die gesamte Sprache abdecken will, ist er die sicherste Wahl, wenn Sie jeden Winkel von Raku brauchen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo implementiert Raku 6.d und erscheint in kurzen Abständen, sodass Korrekturen und neue Möglichkeiten Sie schnell erreichen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Die virtuelle Maschine<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig läuft Rakudo auf MoarVM, einer eigens für Raku gebauten virtuellen Maschine.<\/span> <span class=\"sg\" data-s=\"1\">Der Entwurf bindet Rakudo nicht an eine einzige Maschine — er lässt sich auch auf anderen virtuellen Maschinen aufsetzen —, doch MoarVM ist das übliche, gut unterstützte Ziel, und dieser Kurs setzt es voraus.<\/span> <span class=\"sg\" data-s=\"2\">Das ist der wesentliche Unterschied zu <a href=\"https://course.raku.org/de/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, das in C++ geschrieben ist und keine eigene virtuelle Maschine braucht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellcode und Links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo ist quelloffen und wird öffentlich entwickelt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo auf GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"De Rakudo-compiler","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> is de referentie-implementatie van Raku en de compiler die deze cursus gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Het is vandaag de meest complete en best beproefde manier om Raku uit te voeren, dus als mensen het over \"de Raku-compiler\" hebben, bedoelen ze meestal Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo is zelf grotendeels in Raku geschreven, samen met een kleinere opstarttaal die NQP heet (\"Not Quite Perl\").<\/span> <span class=\"sg\" data-s=\"1\">Het compileert je programma naar bytecode en voert dat uit op een virtuele machine die <strong>MoarVM<\/strong> heet, die je automatisch krijgt wanneer je Rakudo installeert.<\/span> <span class=\"sg\" data-s=\"2\">Omdat Rakudo de hele taal wil dekken, is het de veiligste keuze wanneer je elk hoekje van Raku nodig hebt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo implementeert Raku 6.d en wordt vaak uitgebracht, zodat verbeteringen en nieuwe mogelijkheden je snel bereiken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De virtuele machine<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Standaard draait Rakudo op MoarVM, een virtuele machine die speciaal voor Raku gebouwd is.<\/span> <span class=\"sg\" data-s=\"1\">Het ontwerp bindt Rakudo niet aan één machine — het kan ook op andere virtuele machines gebouwd worden — maar MoarVM is het standaard en goed ondersteunde doel, en deze cursus gaat daarvan uit.<\/span> <span class=\"sg\" data-s=\"2\">Dat is het belangrijkste verschil met <a href=\"https://course.raku.org/nl/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, dat in C++ geschreven is en geen eigen virtuele machine nodig heeft.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Broncode en links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo is open source en wordt in de openbaarheid ontwikkeld:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo op GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"El compilador Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> es la implementación de referencia de Raku y el compilador que usa este curso.<\/span> <span class=\"sg\" data-s=\"1\">Hoy es la forma más completa y más probada de ejecutar Raku, así que cuando alguien dice «el compilador de Raku» normalmente se refiere a Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo está escrito en buena parte en el propio Raku, junto con un lenguaje de arranque más pequeño llamado NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"1\">Compila tu programa a bytecode y lo ejecuta en una máquina virtual llamada <strong>MoarVM<\/strong>, que obtienes automáticamente al instalar Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Como Rakudo aspira a cubrir el lenguaje entero, es la opción más segura cuando necesitas que funcione hasta el último rincón de Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo implementa Raku 6.d y se publica con frecuencia, así que las correcciones y las novedades te llegan pronto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La máquina virtual<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por omisión Rakudo se ejecuta sobre MoarVM, una máquina virtual creada específicamente para Raku.<\/span> <span class=\"sg\" data-s=\"1\">El diseño no ata Rakudo a una sola máquina — también puede construirse sobre otras máquinas virtuales — pero MoarVM es el destino estándar y bien soportado, y es el que este curso da por sentado.<\/span> <span class=\"sg\" data-s=\"2\">Ahí está la diferencia principal con <a href=\"https://course.raku.org/es/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, que está escrito en C++ y no necesita ninguna máquina virtual propia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente y enlaces<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo es de código abierto y se desarrolla a la vista de todos:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Il compilatore Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> è l'implementazione di riferimento di Raku ed è il compilatore usato in questo corso.<\/span> <span class=\"sg\" data-s=\"1\">Oggi è il modo più completo e più collaudato di eseguire Raku, quindi quando si dice «il compilatore Raku» di solito si intende Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo è a sua volta scritto in gran parte in Raku, insieme a un linguaggio di bootstrap più piccolo chiamato NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"1\">Compila il tuo programma in bytecode e lo esegue su una macchina virtuale chiamata <strong>MoarVM<\/strong>, che ottieni automaticamente installando Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Poiché Rakudo punta a coprire l'intero linguaggio, è la scelta più sicura quando hai bisogno che ogni angolo di Raku funzioni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo implementa Raku 6.d e viene rilasciato spesso, quindi correzioni e nuove funzionalità ti raggiungono in fretta.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La macchina virtuale<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita Rakudo gira su MoarVM, una macchina virtuale costruita appositamente per Raku.<\/span> <span class=\"sg\" data-s=\"1\">Il progetto non lega Rakudo a una sola macchina — può anche essere costruito sopra altre macchine virtuali — ma MoarVM è il bersaglio standard e ben supportato, ed è quello che questo corso presuppone.<\/span> <span class=\"sg\" data-s=\"2\">È qui la differenza principale rispetto a <a href=\"https://course.raku.org/it/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, che è scritto in C++ e non ha bisogno di alcuna macchina virtuale.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente e collegamenti<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo è open source e viene sviluppato allo scoperto:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Kompilators Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> ir Raku atsauces implementācija un kompilators, ko izmanto šis kurss.<\/span> <span class=\"sg\" data-s=\"1\">Šodien tas ir vispilnīgākais un praksē visvairāk pārbaudītais veids, kā palaist Raku, tāpēc, kad runā par «Raku kompilatoru», parasti domāts tieši Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo pats lielākoties ir uzrakstīts Raku valodā kopā ar nelielu sāknēšanas valodu NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"1\">Tas kompilē jūsu programmu baitkodā un izpilda to virtuālajā mašīnā <strong>MoarVM<\/strong>, ko iegūstat automātiski, instalējot Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Tā kā Rakudo tiecas aptvert visu valodu, tā ir drošākā izvēle, kad nepieciešams, lai darbotos ikviens Raku nostūris.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo implementē Raku 6.d un tiek izlaists bieži, tāpēc labojumi un jaunas iespējas jūs sasniedz ātri.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Virtuālā mašīna<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma Rakudo darbojas uz MoarVM — virtuālās mašīnas, kas veidota tieši Raku vajadzībām.<\/span> <span class=\"sg\" data-s=\"1\">Uzbūve nepiesaista Rakudo vienai mašīnai — to var būvēt arī uz citu virtuālo mašīnu pamata —, taču MoarVM ir standarta un labi atbalstītais mērķis, un šis kurss to pieņem par pamatu.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir galvenā atšķirība no <a href=\"https://course.raku.org/lv/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, kas ir uzrakstīts C++ valodā un kam sava virtuālā mašīna nav vajadzīga.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods un saites<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo ir atvērtā koda projekts, un tā izstrāde notiek atklāti:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Компилятор Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> — это эталонная реализация Raku и тот компилятор, который используется в этом курсе.<\/span> <span class=\"sg\" data-s=\"1\">На сегодня это самый полный и проверенный временем способ запускать программы на Raku, поэтому, когда говорят «компилятор Raku», обычно имеют в виду именно Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сам Rakudo написан большей частью на Raku вместе с небольшим вспомогательным языком NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"1\">Он компилирует вашу программу в байт-код и выполняет её на виртуальной машине <strong>MoarVM<\/strong>, которая устанавливается автоматически вместе с Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Поскольку Rakudo стремится покрыть весь язык, это самый надёжный выбор, когда вам нужно, чтобы работал любой уголок Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo реализует Raku 6.d и выпускается часто, так что исправления и новые возможности доходят до вас быстро.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виртуальная машина<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">По умолчанию Rakudo работает на MoarVM — виртуальной машине, созданной специально для Raku.<\/span> <span class=\"sg\" data-s=\"1\">Его устройство не привязывает Rakudo к одной машине: он может быть собран и поверх других виртуальных машин, — но MoarVM остаётся стандартной и хорошо поддерживаемой платформой, и этот курс исходит именно из неё.<\/span> <span class=\"sg\" data-s=\"2\">В этом главное отличие от <a href=\"https://course.raku.org/ru/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, который написан на C++ и не нуждается в собственной виртуальной машине.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код и ссылки<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo — открытое программное обеспечение, и его разработка ведётся открыто:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Компілятор Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> — це еталонна реалізація Raku й той компілятор, який використовує цей курс.<\/span> <span class=\"sg\" data-s=\"1\">Сьогодні це найповніший і найкраще випробуваний спосіб виконувати Raku, тож коли кажуть «компілятор Raku», зазвичай мають на увазі саме Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сам Rakudo написано здебільшого мовою Raku разом із меншою мовою початкового завантаження під назвою NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"1\">Він компілює вашу програму в байткод і виконує її на віртуальній машині <strong>MoarVM<\/strong>, яку ви отримуєте автоматично разом із встановленням Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Оскільки Rakudo прагне охопити всю мову, це найбезпечніший вибір, коли вам потрібно, щоб працював кожен закуток Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo реалізує Raku 6.d і виходить часто, тож виправлення та нові можливості потрапляють до вас швидко.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Віртуальна машина<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням Rakudo працює на MoarVM — віртуальній машині, створеній спеціально для Raku.<\/span> <span class=\"sg\" data-s=\"1\">Задум не прив'язує Rakudo до однієї машини: його можна зібрати й поверх інших віртуальних машин, — але MoarVM є стандартною, добре підтримуваною ціллю, і цей курс виходить саме з неї.<\/span> <span class=\"sg\" data-s=\"2\">Це головна відмінність від <a href=\"https://course.raku.org/uk/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, який написано мовою C++ і якому власна віртуальна машина не потрібна.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код і посилання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo має відкритий код і розробляється відкрито:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Компилаторът Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> е еталонната реализация на Raku и компилаторът, който се използва в този курс.<\/span> <span class=\"sg\" data-s=\"1\">Днес това е най-пълният и най-изпитаният начин да изпълнявате Raku, така че когато хората кажат „компилаторът на Raku“, обикновено имат предвид именно Rakudo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Самият Rakudo е написан до голяма степен на Raku, заедно с един по-малък език за първоначално зареждане на име NQP („Not Quite Perl“).<\/span> <span class=\"sg\" data-s=\"1\">Той компилира програмата ви до байткод и я изпълнява във виртуална машина на име <strong>MoarVM<\/strong>, която получавате автоматично, когато инсталирате Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Понеже Rakudo се стреми да покрие целия език, той е най-сигурният избор, когато ви трябва да работи всяко кътче на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo реализира Raku 6.d и се издава често, така че поправките и новите възможности стигат до вас бързо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виртуалната машина<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">По подразбиране Rakudo работи върху MoarVM — виртуална машина, изградена специално за Raku.<\/span> <span class=\"sg\" data-s=\"1\">Устройството му не го привързва към една-единствена машина: той може да бъде изграден и върху други виртуални машини, но MoarVM е стандартната и добре поддържана цел, а този курс приема нея.<\/span> <span class=\"sg\" data-s=\"2\">Това е основната разлика с <a href=\"https://course.raku.org/bg/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, който е написан на C++ и няма нужда от собствена виртуална машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код и връзки<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo е с отворен код и се разработва открито:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]}}}</script>
