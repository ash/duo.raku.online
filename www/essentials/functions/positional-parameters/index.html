<script type="application/json" id="page-data">{"u":"essentials/functions/positional-parameters","n":274,"k":"topic","pv":"essentials/functions/return-result/quiz","nx":"essentials/functions/positional-parameters/quiz","tr":["essentials","essentials/functions"],"L":{"en":{"t":"Positional parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The order of function parameters is important.<\/span> <span class=\"sg\" data-s=\"1\">For example, create a function that computes the difference between two numbers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It is obvious that the result of calling <code>diff(10, 20)<\/code> differs from <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters that are listed as a comma-separated list like in the function above are called <em>positional<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Their meaning depends on the order in which the arguments are passed to the function when it is called.<\/span><\/p>"]]},"de":{"t":"Positionsparameter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Reihenfolge der Funktionsparameter ist wichtig.<\/span> <span class=\"sg\" data-s=\"1\">Erstellen Sie zum Beispiel eine Funktion, die die Differenz zwischen zwei Zahlen berechnet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es ist offensichtlich, dass sich das Ergebnis des Aufrufs von <code>diff(10, 20)<\/code> von <code>diff(20, 10)<\/code> unterscheidet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameter, die wie in der obigen Funktion als kommagetrennte Liste aufgeführt sind, werden <em>positionsabhängig<\/em> genannt.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Bedeutung hängt von der Reihenfolge ab, in der die Argumente an die Funktion übergeben werden, wenn sie aufgerufen wird.<\/span><\/p>"]]},"nl":{"t":"Positionele parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgorde van functieparameters is belangrijk.<\/span> <span class=\"sg\" data-s=\"1\">Maak bijvoorbeeld een functie die het verschil tussen twee getallen berekent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is duidelijk dat het resultaat van het aanroepen van <code>diff(10, 20)<\/code> verschilt van <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters die als een door komma's gescheiden lijst worden vermeld zoals in de bovenstaande functie, worden <em>positioneel<\/em> genoemd.<\/span> <span class=\"sg\" data-s=\"1\">Hun betekenis hangt af van de volgorde waarin de argumenten aan de functie worden doorgegeven wanneer deze wordt aangeroepen.<\/span><\/p>"]]},"es":{"t":"Parámetros posicionales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El orden de los parámetros de una función es importante.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, crea una función que calcule la diferencia entre dos números:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es obvio que el resultado de llamar a <code>diff(10, 20)<\/code> difiere de <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los parámetros que se enumeran como una lista separada por comas, como en la función anterior, se llaman <em>posicionales<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Su significado depende del orden en que los argumentos se pasan a la función cuando se llama.<\/span><\/p>"]]},"it":{"t":"Parametri posizionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'ordine dei parametri di una funzione è importante.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, crea una funzione che calcola la differenza tra due numeri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">È ovvio che il risultato della chiamata <code>diff(10, 20)<\/code> differisce da <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I parametri elencati come una lista separata da virgole, come nella funzione sopra, sono chiamati <em>posizionali<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il loro significato dipende dall'ordine in cui gli argomenti vengono passati alla funzione quando viene chiamata.<\/span><\/p>"]]},"lv":{"t":"Pozicionālie parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkciju parametru secība ir svarīga.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, izveidojiet funkciju, kas aprēķina starpību starp diviem skaitļiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir acīmredzams, ka izsaukuma <code>diff(10, 20)<\/code> rezultāts atšķiras no <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri, kas ir uzskaitīti kā komatiem atdalīts saraksts, kā tas ir iepriekš minētajā funkcijā, tiek saukti par <em>pozicionāliem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">To nozīme ir atkarīga no kārtības, kādā argumenti tiek nodoti funkcijai, kad tā tiek izsaukta.<\/span><\/p>"]]},"ru":{"t":"Позиционные параметры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Порядок параметров функции имеет значение.<\/span> <span class=\"sg\" data-s=\"1\">Например, создадим функцию, которая вычисляет разницу между двумя числами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Очевидно, что результат вызова <code>diff(10, 20)<\/code> отличается от <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметры, которые перечислены через запятую, как в функции выше, называются <em>позиционными<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Их значение зависит от порядка, в котором аргументы передаются функции при её вызове.<\/span><\/p>"]]},"uk":{"t":"Позиційні параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Порядок параметрів функції є важливим.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, створимо функцію, яка обчислює різницю між двома числами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Очевидно, що результат виклику <code>diff(10, 20)<\/code> відрізняється від <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметри, які перераховані через кому, як у наведеній вище функції, називаються <em>позиційними<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Їхнє значення залежить від порядку, в якому аргументи передаються до функції під час її виклику.<\/span><\/p>"]]},"bg":{"t":"Позиционни параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Редът на параметрите на функцията е важен.<\/span> <span class=\"sg\" data-s=\"1\">Например, създайте функция, която изчислява разликата между две числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Очевидно е, че резултатът от извикването на <code>diff(10, 20)<\/code> се различава от <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Параметрите, които са изброени като списък, разделен със запетаи, както във функцията по-горе, се наричат <em>позиционни<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Тяхното значение зависи от реда, в който аргументите се подават на функцията при нейното извикване.<\/span><\/p>"]]},"eo":{"t":"Poziciaj parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La ordo de funkciaj parametroj estas grava.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, kreu funkcion kiu kalkulas la diferencon inter du nombroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estas evidente, ke la rezulto de voko <code>diff(10, 20)<\/code> malsamas de <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametroj, kiuj estas listigitaj kiel kom-separata listo kiel en la supra funkcio, estas nomataj <em>poziciaj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ilia signifo dependas de la ordo en kiu la argumentoj estas pasitaj al la funkcio kiam ĝi estas vokita.<\/span><\/p>"]]},"la":{"t":"Positional parametra","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordo parametrorum functionis est maximus.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, crea functionem quae differentiam inter duo numeros computat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Manifestum est quod eventus vocandi <code>diff(10, 20)<\/code> differt ab <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri qui ut comma-separata lista enumerantur sicut in functione supra vocantur <em>positionales<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Eorum significatio pendet ex ordine quo argumenta ad functionem vocandam traduntur.<\/span><\/p>"]]}}}</script>
