<script type="application/json" id="page-data">{"u":"essentials/functions/function-parameters","n":269,"k":"topic","pv":"essentials/functions/identifiers/quiz","nx":"essentials/functions/function-parameters/quiz1","tr":["essentials","essentials/functions"],"L":{"en":{"t":"Function parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">It’s time to pass some data to a function.<\/span> <span class=\"sg\" data-s=\"1\">It can take parameters listed in parentheses immediately after the name of the function.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can now use the function and pass different arguments to it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The two calls of the same function will now produce different results:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Alla!\nHello, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parameter or argument<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">These terms are often used interchangeably.<\/span> <span class=\"sg\" data-s=\"1\">They both refer to ‘the same thing’, but look at it from different perspectives.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">A parameter is what the function expects.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">An argument is what you pass to it.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In the above example, <code>$name<\/code> is the function’s parameter, while <code>'Alla'<\/code> and <code>'Karl'<\/code> are its arguments.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A function can take more than a single parameter.<\/span> <span class=\"sg\" data-s=\"1\">In this case, list all of them comma-separated:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is a valid case when the function takes no parameters at all.<\/span> <span class=\"sg\" data-s=\"1\">In this case, you can either add an empty pair of parentheses or omit them completely, as we did at <a href=\"/essentials/functions/\">the beginning of this section<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Signature<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The list of parameters of a function is called a <em>signature<\/em>.<\/span><\/p>"]]},"de":{"t":"Funktionsparameter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist an der Zeit, einige Daten an eine Funktion zu übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Sie kann Parameter aufnehmen, die in Klammern unmittelbar nach dem Namen der Funktion aufgelistet sind.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hallo, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du kannst nun die Funktion verwenden und ihr verschiedene Argumente übergeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die beiden Aufrufe derselben Funktion werden nun unterschiedliche Ergebnisse liefern:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHallo, Alla!\nHallo, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parameter oder Argument<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Begriffe werden oft austauschbar verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Sie beziehen sich beide auf „dasselbe“, betrachten es jedoch aus unterschiedlichen Perspektiven.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Ein Parameter ist das, was die Funktion erwartet.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Ein Argument ist das, was du ihr übergibst.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Im obigen Beispiel ist <code>$name<\/code> der Parameter der Funktion, während <code>'Alla'<\/code> und <code>'Karl'<\/code> ihre Argumente sind.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehrere Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Funktion kann mehr als einen einzelnen Parameter aufnehmen.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall liste alle Parameter durch Kommas getrennt auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Keine Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist ein gültiger Fall, wenn die Funktion überhaupt keine Parameter aufnimmt.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall kannst du entweder ein leeres Paar Klammern hinzufügen oder sie ganz weglassen, wie wir es am <a href=\"/essentials/functions/\">Anfang dieses Abschnitts<\/a> getan haben.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hallo, Welt!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Signatur<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Liste der Parameter einer Funktion wird als <em>Signatur<\/em> bezeichnet.<\/span><\/p>"]]},"nl":{"t":"Functieparameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is tijd om wat gegevens door te geven aan een functie.<\/span> <span class=\"sg\" data-s=\"1\">Deze kan parameters aannemen die tussen haakjes direct na de naam van de functie worden vermeld.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hallo, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt nu de functie gebruiken en er verschillende argumenten aan doorgeven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De twee aanroepen van dezelfde functie zullen nu verschillende resultaten opleveren:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHallo, Alla!\nHallo, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parameter of argument<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze termen worden vaak door elkaar gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Ze verwijzen beide naar 'hetzelfde ding', maar bekijken het vanuit verschillende perspectieven.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Een parameter is wat de functie verwacht.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Een argument is wat je eraan doorgeeft.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In het bovenstaande voorbeeld is <code>$name<\/code> de parameter van de functie, terwijl <code>'Alla'<\/code> en <code>'Karl'<\/code> de argumenten zijn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een functie kan meer dan één parameter aannemen.<\/span> <span class=\"sg\" data-s=\"1\">In dit geval, som je ze allemaal op, gescheiden door komma's:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Geen parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is een geldig geval wanneer de functie helemaal geen parameters aanneemt.<\/span> <span class=\"sg\" data-s=\"1\">In dit geval kun je ofwel een leeg paar haakjes toevoegen of ze helemaal weglaten, zoals we aan <a href=\"/essentials/functions/\">het begin van deze sectie<\/a> deden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hallo, Wereld!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Handtekening<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De lijst van parameters van een functie wordt een <em>handtekening<\/em> genoemd.<\/span><\/p>"]]},"es":{"t":"Parámetros de funciones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Es hora de pasar algunos datos a una función.<\/span> <span class=\"sg\" data-s=\"1\">Puede tomar parámetros listados entre paréntesis inmediatamente después del nombre de la función.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"¡Hola, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora puedes usar la función y pasarle diferentes argumentos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las dos llamadas a la misma función ahora producirán resultados diferentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n¡Hola, Alla!\n¡Hola, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetro o argumento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estos términos a menudo se usan indistintamente.<\/span> <span class=\"sg\" data-s=\"1\">Ambos se refieren a 'lo mismo', pero lo miran desde diferentes perspectivas.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Un parámetro es lo que la función espera.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Un argumento es lo que le pasas.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En el ejemplo anterior, <code>$name<\/code> es el parámetro de la función, mientras que <code>'Alla'<\/code> y <code>'Karl'<\/code> son sus argumentos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más parámetros<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una función puede tomar más de un solo parámetro.<\/span> <span class=\"sg\" data-s=\"1\">En este caso, enumera todos ellos separados por comas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sin parámetros<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es un caso válido cuando la función no toma ningún parámetro.<\/span> <span class=\"sg\" data-s=\"1\">En este caso, puedes agregar un par de paréntesis vacío o omitirlos por completo, como hicimos al <a href=\"/essentials/functions/\">principio de esta sección<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say '¡Hola, Mundo!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Firma<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La lista de parámetros de una función se llama <em>firma<\/em>.<\/span><\/p>"]]},"it":{"t":"Parametri delle funzioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">È il momento di passare alcuni dati a una funzione.<\/span> <span class=\"sg\" data-s=\"1\">Essa può prendere parametri elencati tra parentesi immediatamente dopo il nome della funzione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora puoi usare la funzione e passare diversi argomenti ad essa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le due chiamate della stessa funzione produrranno ora risultati diversi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Alla!\nHello, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametro o argomento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questi termini sono spesso usati in modo intercambiabile.<\/span> <span class=\"sg\" data-s=\"1\">Si riferiscono entrambi alla 'stessa cosa', ma la guardano da prospettive diverse.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Un parametro è ciò che la funzione si aspetta.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Un argomento è ciò che passi alla funzione.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nell'esempio sopra, <code>$name<\/code> è il parametro della funzione, mentre <code>'Alla'<\/code> e <code>'Karl'<\/code> sono i suoi argomenti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una funzione può prendere più di un singolo parametro.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, elencali tutti separati da virgole:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nessun parametro<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È un caso valido quando la funzione non prende alcun parametro.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, puoi aggiungere una coppia di parentesi vuote o ometterle completamente, come abbiamo fatto all'inizio di questa sezione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Firma<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'elenco dei parametri di una funzione è chiamato <em>firma<\/em>.<\/span><\/p>"]]},"lv":{"t":"Funkciju parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir pienācis laiks nodot datus funkcijai.<\/span> <span class=\"sg\" data-s=\"1\">Tā var pieņemt parametrus, kas uzskaitīti iekavās uzreiz pēc funkcijas nosaukuma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Sveiki, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad jūs varat izmantot funkciju un nodot tai dažādus argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karlis');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Divi vienas un tās pašas funkcijas izsaukumi tagad radīs dažādus rezultātus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nSveiki, Alla!\nSveiki, Karlis!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametrs vai arguments<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šie termini bieži tiek lietoti savstarpēji aizvietojami.<\/span> <span class=\"sg\" data-s=\"1\">Tie abi attiecas uz 'to pašu lietu', bet raugās uz to no dažādām perspektīvām.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Parametrs ir tas, ko funkcija sagaida.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Arguments ir tas, ko jūs tai nododat.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējā piemērā <code>$name<\/code> ir funkcijas parametrs, savukārt <code>'Alla'<\/code> un <code>'Karlis'<\/code> ir tās argumenti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk parametru<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcija var pieņemt vairāk nekā vienu parametru.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā uzskaitiet tos visus, atdalot ar komatiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bez parametriem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir derīgs gadījums, kad funkcija nepieņem nekādus parametrus.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā jūs varat vai nu pievienot tukšu iekavu pāri, vai arī pilnībā tās izlaist, kā mēs darījām <a href=\"/essentials/functions/\">šīs sadaļas sākumā<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Sveiki, Pasaule!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Paraksts<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funkcijas parametru sarakstu sauc par <em>parakstu<\/em>.<\/span><\/p>"]]},"ru":{"t":"Параметры функций","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пора передать данные в функцию.<\/span> <span class=\"sg\" data-s=\"1\">Она может принимать параметры, перечисленные в скобках сразу после имени функции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь вы можете использовать функцию и передавать ей разные аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Алла');\ngreet('Карл');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два вызова одной и той же функции теперь дадут разные результаты:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Алла!\nHello, Карл!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Параметр или аргумент<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти термины часто используются взаимозаменяемо.<\/span> <span class=\"sg\" data-s=\"1\">Они оба относятся к «одному и тому же», но рассматриваются с разных точек зрения.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Параметр — это то, что ожидает функция.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Аргумент — это то, что вы передаете функции.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В приведенном выше примере <code>$name<\/code> является параметром функции, а <code>'Алла'<\/code> и <code>'Карл'<\/code> — ее аргументами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Больше параметров<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функция может принимать более одного параметра.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае перечислите их все через запятую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Без параметров<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это допустимый случай, когда функция вообще не принимает параметры.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае вы можете либо добавить пустые скобки, либо полностью их опустить, как мы сделали в <a href=\"/essentials/functions/\">начале этого раздела<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигнатура<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Список параметров функции называется <em>сигнатурой<\/em>.<\/span><\/p>"]]},"uk":{"t":"Параметри функцій","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Час передати деякі дані до функції.<\/span> <span class=\"sg\" data-s=\"1\">Вона може приймати параметри, які вказуються в дужках одразу після назви функції.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер ви можете використовувати функцію і передавати їй різні аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Алла');\ngreet('Карл');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два виклики тієї ж функції тепер дадуть різні результати:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Алла!\nHello, Карл!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Параметр чи аргумент<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ці терміни часто використовуються взаємозамінно.<\/span> <span class=\"sg\" data-s=\"1\">Вони обидва стосуються «одного й того ж», але розглядають це з різних точок зору.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Параметр — це те, що очікує функція.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Аргумент — це те, що ви передаєте їй.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У наведеному вище прикладі, <code>$name<\/code> є параметром функції, тоді як <code>'Алла'<\/code> і <code>'Карл'<\/code> є її аргументами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше параметрів<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функція може приймати більше ніж один параметр.<\/span> <span class=\"sg\" data-s=\"1\">У цьому випадку, перелічіть всі з них через кому:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Без параметрів<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це допустимий випадок, коли функція не приймає жодних параметрів.<\/span> <span class=\"sg\" data-s=\"1\">У цьому випадку ви можете або додати порожню пару дужок, або зовсім їх опустити, як ми зробили на <a href=\"/essentials/functions/\">початку цього розділу<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Підпис<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Список параметрів функції називається <em>підписом<\/em>.<\/span><\/p>"]]},"bg":{"t":"Параметри на функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Време е да предадем някакви данни на функция.<\/span> <span class=\"sg\" data-s=\"1\">Тя може да приема параметри, изброени в скоби веднага след името на функцията.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Здравей, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега можете да използвате функцията и да предавате различни аргументи към нея:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Алла');\ngreet('Карл');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двете извиквания на същата функция сега ще произведат различни резултати:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nЗдравей, Алла!\nЗдравей, Карл!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Параметър или аргумент<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тези термини често се използват взаимозаменяемо.<\/span> <span class=\"sg\" data-s=\"1\">Те се отнасят до ‘едно и също нещо’, но го разглеждат от различни перспективи.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Параметър е това, което функцията очаква.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Аргумент е това, което предавате на нея.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В горния пример, <code>$name<\/code> е параметърът на функцията, докато <code>'Алла'<\/code> и <code>'Карл'<\/code> са нейните аргументи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията може да приема повече от един параметър.<\/span> <span class=\"sg\" data-s=\"1\">В този случай, изброете всички тях, разделени със запетаи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Без параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е валиден случай, когато функцията не приема никакви параметри.<\/span> <span class=\"sg\" data-s=\"1\">В този случай, можете или да добавите празни скоби, или да ги пропуснете напълно, както направихме в <a href=\"/essentials/functions/\">началото на тази секция<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Здравей, свят!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Подпис<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Списъкът с параметри на функцията се нарича <em>подпис<\/em>.<\/span><\/p>"]]},"eo":{"t":"Funkciaj parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas tempo transdoni iom da datumoj al funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas preni parametrojn listigitajn en krampoj tuj post la nomo de la funkcio.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Saluton, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi nun povas uzi la funkcion kaj transdoni malsamajn argumentojn al ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La du vokoj de la sama funkcio nun produktos malsamajn rezultojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nSaluton, Alla!\nSaluton, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametro aŭ argumento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj terminoj ofte estas uzataj interŝanĝeble.<\/span> <span class=\"sg\" data-s=\"1\">Ili ambaŭ rilatas al 'la sama afero', sed rigardas ĝin el malsamaj perspektivoj.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Parametro estas tio, kion la funkcio atendas.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Argumento estas tio, kion vi transdonas al ĝi.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la supra ekzemplo, <code>$name<\/code> estas la parametro de la funkcio, dum <code>'Alla'<\/code> kaj <code>'Karl'<\/code> estas ĝiaj argumentoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli da parametroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcio povas preni pli ol unu solan parametron.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, listigu ĉiujn ilin kom-separitaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sen parametroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas valida kazo kiam la funkcio tute ne prenas parametrojn.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, vi povas aŭ aldoni malplenan paron de krampoj aŭ tute preterlasi ilin, kiel ni faris ĉe <a href=\"/essentials/functions/\">la komenco de ĉi tiu sekcio<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Saluton, Mondo!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subskribo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La listo de parametroj de funkcio nomiĝas <em>subskribo<\/em>.<\/span><\/p>"]]},"la":{"t":"Parametra functionum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tempus est ut aliqua data ad functionem transmittamus.<\/span> <span class=\"sg\" data-s=\"1\">Potest parametra accipere quae in parenthesibus statim post nomen functionis enumerantur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc functionem uti potes et diversos argumentos ei transmittas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duae invocationes eiusdem functionis nunc diversos eventus efficient:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Alla!\nHello, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametrum vel argumentum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hi termini saepe permutabiliter adhibentur.<\/span> <span class=\"sg\" data-s=\"1\">Utrumque ad 'idem rem' referunt, sed ex diversis prospectibus spectant.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Parametrum est quod functio expectat.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Argumentum est quod ei transmittis.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In exemplo supra, <code>$name<\/code> est parametrum functionis, dum <code>'Alla'<\/code> et <code>'Karl'<\/code> sunt eius argumenta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plura parametra<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Functio plus quam unum parametrum accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">In hoc casu, omnia enumerantur separata commatibus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nulla parametra<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Validum est casus cum functio nullos omnino parametra accipit.<\/span> <span class=\"sg\" data-s=\"1\">In hoc casu, vel paria parenthesium vacua addere potes vel omnino omittere, sicut fecimus in <a href=\"/essentials/functions/\">initio huius sectionis<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Signatura<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Index parametrorum functionis vocatur <em>signatura<\/em>.<\/span><\/p>"]]}}}</script>
