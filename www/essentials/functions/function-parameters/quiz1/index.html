<script type="application/json" id="page-data">{"u":"essentials/functions/function-parameters/quiz1","n":270,"k":"quiz","pv":"essentials/functions/function-parameters","nx":"essentials/functions/function-parameters/quiz2","tr":["essentials","essentials/functions","essentials/functions/function-parameters"],"L":{"en":{"t":"Quiz — Function parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Choose those options where the function signature is correct.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">No parameters is a valid situation.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Parentheses are not required here.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">But they are required if there are parameters.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Parameters are a comma-separated list.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">It is up to you to put or omit space between parameters.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Parameters can have any names in any order.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Non-existing syntax.<\/span><\/span><\/li><\/ul>"]]},"de":{"t":"Funktionsparameter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Wählen Sie die Optionen aus, bei denen die Funktionssignatur korrekt ist.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Keine Parameter sind eine gültige Situation.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Klammern sind hier nicht erforderlich.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Aber sie sind erforderlich, wenn es Parameter gibt.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Parameter sind eine durch Kommas getrennte Liste.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Es liegt an Ihnen, ob Sie Leerzeichen zwischen den Parametern setzen oder nicht.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Parameter können beliebige Namen in beliebiger Reihenfolge haben.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Nicht existierende Syntax.<\/span><\/span><\/li><\/ul>"]]},"nl":{"t":"Functieparameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kies die opties waar de functiedeclaratie correct is.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Geen parameters is een geldige situatie.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Haakjes zijn hier niet vereist.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Maar ze zijn vereist als er parameters zijn.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Parameters zijn een door komma's gescheiden lijst.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Het is aan jou om wel of geen spatie tussen parameters te zetten.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Parameters kunnen willekeurige namen in willekeurige volgorde hebben.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Niet-bestaande syntax.<\/span><\/span><\/li><\/ul>"]]},"es":{"t":"Parámetros de funciones","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Elige aquellas opciones donde la firma de la función es correcta.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">No tener parámetros es una situación válida.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Los paréntesis no son necesarios aquí.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Pero son necesarios si hay parámetros.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Los parámetros son una lista separada por comas.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Depende de ti poner o omitir espacio entre los parámetros.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Los parámetros pueden tener cualquier nombre en cualquier orden.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Sintaxis inexistente.<\/span><\/span><\/li><\/ul>"]]},"it":{"t":"Parametri delle funzioni","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Scegli le opzioni in cui la firma della funzione è corretta.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Nessun parametro è una situazione valida.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Le parentesi non sono richieste qui.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Ma sono richieste se ci sono parametri.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">I parametri sono una lista separata da virgole.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Sta a te decidere se mettere o meno lo spazio tra i parametri.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">I parametri possono avere qualsiasi nome in qualsiasi ordine.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Sintassi inesistente.<\/span><\/span><\/li><\/ul>"]]},"lv":{"t":"Funkciju parametri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Izvēlieties tās opcijas, kur funkcijas paraksts ir pareizs.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Parametru neesamība ir derīga situācija.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Šeit iekavas nav nepieciešamas.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Bet tās ir nepieciešamas, ja ir parametri.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Parametri ir ar komatu atdalīts saraksts.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Jūsu ziņā ir likt vai izlaist atstarpi starp parametriem.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Parametriem var būt jebkādi nosaukumi jebkurā secībā.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Nepastāvoša sintakse.<\/span><\/span><\/li><\/ul>"]]},"ru":{"t":"Параметры функций","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Выберите те варианты, где сигнатура функции правильная.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Отсутствие параметров — это допустимая ситуация.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Скобки здесь не обязательны.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Но они обязательны, если есть параметры.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Параметры должны быть разделены запятыми.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Вы можете ставить или не ставить пробел между параметрами.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Параметры могут иметь любые имена в любом порядке.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Несуществующий синтаксис.<\/span><\/span><\/li><\/ul>"]]},"uk":{"t":"Параметри функцій","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Виберіть ті варіанти, де підпис функції є правильним.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Відсутність параметрів є допустимою ситуацією.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Дужки тут не обов'язкові.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Але вони обов'язкові, якщо є параметри.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Параметри є списком, розділеним комами.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Ви можете ставити або не ставити пробіл між параметрами.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Параметри можуть мати будь-які імена в будь-якому порядку.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Неіснуючий синтаксис.<\/span><\/span><\/li><\/ul>"]]},"bg":{"t":"Параметри на функции","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Изберете тези опции, където подписът на функцията е правилен.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Няма параметри е валидна ситуация.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Скобите не са необходими тук.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Но те са необходими, ако има параметри.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Параметрите са списък, разделен със запетаи.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Вие решавате дали да поставите или пропуснете интервал между параметрите.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Параметрите могат да имат всякакви имена в произволен ред.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Несъществуващ синтаксис.<\/span><\/span><\/li><\/ul>"]]},"eo":{"t":"Funkciaj parametroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Elektu tiujn opciojn kie la funkcia subskribo estas ĝusta.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Neniuj parametroj estas valida situacio.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Parentezoj ne estas bezonataj ĉi tie.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Sed ili estas bezonataj se estas parametroj.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Parametroj estas komo-separita listo.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Estas via decido meti aŭ preterlasi spacon inter parametroj.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Parametroj povas havi ajnajn nomojn en ajna ordo.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Neekzistanta sintakso.<\/span><\/span><\/li><\/ul>"]]},"la":{"t":"Parametra functionum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Elige aquellas opciones donde la firma de la función es correcta.<\/span><\/p>"],["quiz",9,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">sub f($x) {. . .}<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">sub f() {. . .}<span class=\"quiz-note\">Nulla parametra valida est.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">sub f {. . .}<span class=\"quiz-note\">Parentheses hic non requiruntur.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">sub f $x {. . .}<span class=\"quiz-note\">Sed requiruntur si sunt parametra.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\">sub f($x, $y) {. . .}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">sub f($x $y) {. . .}<span class=\"quiz-note\">Parametra sunt comma-separata.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"6\">sub f($x,$y) {. . .}<span class=\"quiz-note\">Ad te pertinet spatium inter parametra ponere vel omittere.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">sub f($y, $x) {. . .}<span class=\"quiz-note\">Parametra possunt habere nomina quaelibet in ordine quolibet.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"8\">sub f ($x), ($y) {. . .}<span class=\"quiz-note\">Syntaxin non-existentem.<\/span><\/span><\/li><\/ul>"]]}}}</script>
