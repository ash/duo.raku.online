<script type="application/json" id="page-data">{"u":"essentials/functions/identifiers","n":267,"k":"topic","pv":"essentials/functions","nx":"essentials/functions/identifiers/quiz","tr":["essentials","essentials/functions"],"L":{"en":{"t":"Function names","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The name of a function is an identifier that follows the same rules as <a href=\"/essentials/scalar-variables/identifiers/\">variable names<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">It must start with a letter or underscore and can be followed by any letters, digits, underscore character, single quote (apostrophe), and hyphens.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apostrophes and hyphens must be followed by alphabetic characters.<\/span> <span class=\"sg\" data-s=\"1\">While apostrophes are not widely used in identifiers, hyphens are used quite extensively as they add an additional level of expressivity.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Below is a short list of examples of valid function names.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"de":{"t":"Funktionsnamen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Name einer Funktion ist ein Bezeichner, der denselben Regeln wie <a href=\"https://course.raku.org/de/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">Variablennamen<\/a> folgt.<\/span> <span class=\"sg\" data-s=\"1\">Er muss mit einem Buchstaben oder Unterstrich beginnen und kann von beliebigen Buchstaben, Ziffern, Unterstrichen, einfachen Anführungszeichen (Apostroph) und Bindestrichen gefolgt werden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apostrophe und Bindestriche müssen von alphabetischen Zeichen gefolgt werden.<\/span> <span class=\"sg\" data-s=\"1\">Während Apostrophe in Bezeichnern nicht weit verbreitet sind, werden Bindestriche häufig verwendet, da sie ein zusätzliches Maß an Ausdruckskraft bieten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nachfolgend ist eine kurze Liste von Beispielen für gültige Funktionsnamen aufgeführt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"nl":{"t":"Functienamen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De naam van een functie is een identificator die dezelfde regels volgt als <a href=\"https://course.raku.org/nl/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">variabelenamen<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Het moet beginnen met een letter of underscore en kan gevolgd worden door letters, cijfers, het underscore-teken, enkele aanhalingstekens (apostrof) en koppeltekens.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apostrofs en koppeltekens moeten gevolgd worden door alfabetische tekens.<\/span> <span class=\"sg\" data-s=\"1\">Hoewel apostrofs niet veel worden gebruikt in identificatoren, worden koppeltekens vrij uitgebreid gebruikt omdat ze een extra niveau van expressiviteit toevoegen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hieronder staat een korte lijst van voorbeelden van geldige functienamen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"es":{"t":"Nombres de funciones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El nombre de una función es un identificador que sigue las mismas reglas que los <a href=\"https://course.raku.org/es/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nombres de variables<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Debe comenzar con una letra o guion bajo y puede ser seguido por cualquier letra, dígito, carácter de guion bajo, comilla simple (apóstrofe) y guiones.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los apóstrofes y guiones deben ser seguidos por caracteres alfabéticos.<\/span> <span class=\"sg\" data-s=\"1\">Aunque los apóstrofes no se usan ampliamente en identificadores, los guiones se usan bastante extensivamente ya que añaden un nivel adicional de expresividad.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A continuación, se muestra una lista corta de ejemplos de nombres de funciones válidos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"it":{"t":"Nomi delle funzioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il nome di una funzione è un identificatore che segue le stesse regole dei <a href=\"https://course.raku.org/it/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomi delle variabili<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Deve iniziare con una lettera o un trattino basso e può essere seguito da qualsiasi lettera, cifra, carattere di trattino basso, apostrofo e trattini.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli apostrofi e i trattini devono essere seguiti da caratteri alfabetici.<\/span> <span class=\"sg\" data-s=\"1\">Sebbene gli apostrofi non siano ampiamente utilizzati negli identificatori, i trattini sono utilizzati in modo estensivo poiché aggiungono un ulteriore livello di espressività.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Di seguito è riportato un breve elenco di esempi di nomi di funzioni validi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"lv":{"t":"Funkciju nosaukumi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcijas nosaukums ir identifikators, kas ievēro tos pašus noteikumus kā <a href=\"https://course.raku.org/lv/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">mainīgo nosaukumi<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tam jāsākas ar burtu vai pasvītrojuma zīmi un tam var sekot jebkuri burti, cipari, pasvītrojuma zīme, vienpēdiņa (apostrofs) un domuzīmes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apostrofiem un domuzīmēm jāseko alfabētiskiem rakstzīmēm.<\/span> <span class=\"sg\" data-s=\"1\">Lai gan apostrofi identifikatoros netiek plaši izmantoti, domuzīmes tiek izmantotas diezgan plaši, jo tās piešķir papildu izteiksmīguma līmeni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zemāk ir īss saraksts ar derīgiem funkciju nosaukumu piemēriem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"ru":{"t":"Имена функций","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имя функции является идентификатором, который следует тем же правилам, что и <a href=\"https://course.raku.org/ru/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">имена переменных<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Оно должно начинаться с буквы или символа подчеркивания и может содержать любые буквы, цифры, символ подчеркивания, одиночную кавычку (апостроф) и дефисы.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Апострофы и дефисы должны следовать за буквенными символами.<\/span> <span class=\"sg\" data-s=\"1\">Хотя апострофы не широко используются в идентификаторах, дефисы используются довольно часто, так как они добавляют дополнительный уровень выразительности.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ниже приведен короткий список примеров допустимых имен функций.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"uk":{"t":"Імена функцій","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ім'я функції є ідентифікатором, який дотримується тих самих правил, що й <a href=\"https://course.raku.org/uk/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">імена змінних<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Воно повинно починатися з літери або підкреслення і може містити будь-які літери, цифри, символ підкреслення, апостроф і дефіси.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Апострофи та дефіси повинні слідувати за алфавітними символами.<\/span> <span class=\"sg\" data-s=\"1\">Хоча апострофи не широко використовуються в ідентифікаторах, дефіси використовуються досить часто, оскільки вони додають додатковий рівень виразності.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нижче наведено короткий список прикладів дійсних імен функцій.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"bg":{"t":"Имена на функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Името на една функция е идентификатор, който следва същите правила като <a href=\"https://course.raku.org/bg/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">имената на променливи<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">То трябва да започва с буква или долна черта и може да бъде последвано от всякакви букви, цифри, долна черта, апостроф и тирета.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Апострофите и тиретата трябва да бъдат последвани от буквени символи.<\/span> <span class=\"sg\" data-s=\"1\">Докато апострофите не са широко използвани в идентификаторите, тиретата се използват доста често, тъй като добавят допълнително ниво на изразителност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">По-долу е кратък списък с примери за валидни имена на функции.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"eo":{"t":"Funkciaj nomoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La nomo de funkcio estas identigilo kiu sekvas la samajn regulojn kiel <a href=\"https://course.raku.org/eo/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">variablaj nomoj<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi devas komenci per litero aŭ substreko kaj povas esti sekvita de ajnaj literoj, ciferoj, substreka signo, ununura citilo (apostrofo), kaj streketo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apostrofoj kaj streketo devas esti sekvataj de alfabetaj signoj.<\/span> <span class=\"sg\" data-s=\"1\">Dum apostrofoj ne estas vaste uzataj en identigiloj, streketo estas uzata sufiĉe amplekse ĉar ĝi aldonas plian nivelon de esprimeblo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sube estas mallonga listo de ekzemploj de validaj funkciaj nomoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salutu<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salutu-ilin<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluton-mondo<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NombroDeElementoj<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">estas-valida<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">esti_aŭ_ne_esti<\/span><\/p>"]]},"la":{"t":"Nomina functionum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomen functionis est identificator qui eadem praecepta sequitur ac <a href=\"https://course.raku.org/la/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomina variabilium<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Incipere debet cum littera vel underscore et sequi potest quaelibet litterae, digiti, underscore character, singulae litterae (apostrophus), et hyphenae.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apostrophi et hyphenae sequi debent characteres alphabeticos.<\/span> <span class=\"sg\" data-s=\"1\">Dum apostrophi non late in identificatoribus adhibentur, hyphenae late adhibentur quia addunt gradum expressivitatis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Infra est brevis index exemplorum validorum nominum functionum.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluta<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluta-illos<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salve-mundum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumerusRerum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">est-validus<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">esse-vel-non_esse<\/span><\/p>"]]}}}</script>
