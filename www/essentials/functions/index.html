<script type="application/json" id="page-data">{"u":"essentials/functions","n":266,"k":"section","pv":"essentials/associatives/exercises/travel-distance/solution","nx":"essentials/functions/identifiers","tr":["essentials"],"L":{"en":{"t":"Creating and calling functions in Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You’ve reached the last section of the first part of the course.<\/span> <span class=\"sg\" data-s=\"1\">By completing it, you will have all the knowledge needed to create virtually <em>any<\/em> program in Raku.<\/span> <span class=\"sg\" data-s=\"2\">The subject of this section is <em>functions<\/em>, or <em>subroutines<\/em>, or even simply <em>routines<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A function is a reusable part of code with its own name.<\/span> <span class=\"sg\" data-s=\"1\">You can <em>call<\/em> functions from different places in the program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creating a function<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To create a function, use the keyword <code>sub<\/code> followed by the name of the function.<\/span> <span class=\"sg\" data-s=\"1\">The body of the function is enclosed in a pair of curly brackets.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Using a function<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To use the function, just put its name at the place where you need to call it.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, a function’s definition can be located before or after the place where the function is used.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints both messages:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now, let us look at other details of creating and using functions.<\/span><\/p>"]]},"de":{"t":"Erstellen und Aufrufen von Funktionen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie haben den letzten Abschnitt des ersten Teils des Kurses erreicht.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie diesen abschließen, werden Sie über das gesamte Wissen verfügen, das erforderlich ist, um praktisch <em>jedes<\/em> Programm in Raku zu erstellen.<\/span> <span class=\"sg\" data-s=\"2\">Das Thema dieses Abschnitts sind <em>Funktionen<\/em>, oder <em>Subroutinen<\/em>, oder einfach <em>Routinen<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Funktion ist ein wiederverwendbarer Teil des Codes mit eigenem Namen.<\/span> <span class=\"sg\" data-s=\"1\">Sie können Funktionen von verschiedenen Stellen im Programm <em>aufrufen<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Erstellen einer Funktion<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um eine Funktion zu erstellen, verwenden Sie das Schlüsselwort <code>sub<\/code> gefolgt vom Namen der Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Der Körper der Funktion ist in ein Paar geschweifte Klammern eingeschlossen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hallo, Welt!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Verwenden einer Funktion<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um die Funktion zu verwenden, setzen Sie einfach ihren Namen an die Stelle, an der Sie sie aufrufen müssen.<\/span> <span class=\"sg\" data-s=\"1\">In Raku kann die Definition einer Funktion vor oder nach der Stelle stehen, an der die Funktion verwendet wird.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Dies ist, was das erste Programm normalerweise ausgibt:';\ngreet;    \n\nsub greet {\n    say 'Hallo, Welt!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt beide Nachrichten aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDies ist, was das erste Programm normalerweise ausgibt:\nHallo, Welt!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun lassen Sie uns andere Details zum Erstellen und Verwenden von Funktionen betrachten.<\/span><\/p>"]]},"nl":{"t":"Functies maken en aanroepen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je hebt het laatste gedeelte van het eerste deel van de cursus bereikt.<\/span> <span class=\"sg\" data-s=\"1\">Door dit te voltooien, heb je alle kennis die nodig is om vrijwel <em>elk<\/em> programma in Raku te maken.<\/span> <span class=\"sg\" data-s=\"2\">Het onderwerp van dit gedeelte is <em>functies<\/em>, of <em>subroutines<\/em>, of zelfs gewoon <em>routines<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een functie is een herbruikbaar deel van de code met een eigen naam.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt functies <em>aanroepen<\/em> vanuit verschillende plaatsen in het programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een functie maken<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een functie te maken, gebruik je het sleutelwoord <code>sub<\/code> gevolgd door de naam van de functie.<\/span> <span class=\"sg\" data-s=\"1\">Het lichaam van de functie is ingesloten in een paar accolades.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een functie gebruiken<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om de functie te gebruiken, zet je gewoon de naam ervan op de plaats waar je deze wilt aanroepen.<\/span> <span class=\"sg\" data-s=\"1\">In Raku kan de definitie van een functie zich vóór of na de plaats bevinden waar de functie wordt gebruikt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Dit is wat het eerste programma meestal afdrukt:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt beide berichten af:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDit is wat het eerste programma meestal afdrukt:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we nu naar andere details van het maken en gebruiken van functies kijken.<\/span><\/p>"]]},"es":{"t":"Crear y llamar funciones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Has llegado a la última sección de la primera parte del curso.<\/span> <span class=\"sg\" data-s=\"1\">Al completarla, tendrás todo el conocimiento necesario para crear <em>cualquier<\/em> programa en Raku.<\/span> <span class=\"sg\" data-s=\"2\">El tema de esta sección son las <em>funciones<\/em>, o <em>subrutinas<\/em>, o incluso simplemente <em>rutinas<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una función es una parte reutilizable del código con su propio nombre.<\/span> <span class=\"sg\" data-s=\"1\">Puedes <em>llamar<\/em> a funciones desde diferentes lugares del programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creación de una función<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para crear una función, usa la palabra clave <code>sub<\/code> seguida del nombre de la función.<\/span> <span class=\"sg\" data-s=\"1\">El cuerpo de la función se encierra en un par de llaves.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say '¡Hola, Mundo!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uso de una función<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para usar la función, simplemente coloca su nombre en el lugar donde necesitas llamarla.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, la definición de una función puede estar ubicada antes o después del lugar donde se usa la función.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Esto es lo que normalmente imprime el primer programa:';\ngreet;    \n\nsub greet {\n    say '¡Hola, Mundo!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime ambos mensajes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEsto es lo que normalmente imprime el primer programa:\n¡Hola, Mundo!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora, veamos otros detalles de la creación y uso de funciones.<\/span><\/p>"]]},"it":{"t":"Creazione e chiamata di funzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hai raggiunto l'ultima sezione della prima parte del corso.<\/span> <span class=\"sg\" data-s=\"1\">Completandola, avrai tutte le conoscenze necessarie per creare praticamente <em>qualsiasi<\/em> programma in Raku.<\/span> <span class=\"sg\" data-s=\"2\">Il soggetto di questa sezione sono le <em>funzioni<\/em>, o <em>subroutine<\/em>, o anche semplicemente <em>routine<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una funzione è una parte riutilizzabile del codice con un proprio nome.<\/span> <span class=\"sg\" data-s=\"1\">Puoi <em>chiamare<\/em> le funzioni da diversi punti del programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare una funzione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per creare una funzione, usa la parola chiave <code>sub<\/code> seguita dal nome della funzione.<\/span> <span class=\"sg\" data-s=\"1\">Il corpo della funzione è racchiuso in una coppia di parentesi graffe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Usare una funzione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per usare la funzione, basta mettere il suo nome nel punto in cui hai bisogno di chiamarla.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, la definizione di una funzione può essere posizionata prima o dopo il punto in cui la funzione viene utilizzata.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Questo è ciò che di solito stampa il primo programma:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa entrambi i messaggi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nQuesto è ciò che di solito stampa il primo programma:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora, diamo un'occhiata ad altri dettagli sulla creazione e l'uso delle funzioni.<\/span><\/p>"]]},"lv":{"t":"Funkciju izveide un izsaukšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs esat sasniedzis pirmās kursa daļas pēdējo sadaļu.<\/span> <span class=\"sg\" data-s=\"1\">Pabeidzot to, jums būs visas nepieciešamās zināšanas, lai izveidotu praktiski <em>jebkuru<\/em> programmu Raku.<\/span> <span class=\"sg\" data-s=\"2\">Šīs sadaļas tēma ir <em>funkcijas<\/em>, vai <em>apakšprogrammas<\/em>, vai pat vienkārši <em>rutīnas<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcija ir atkārtoti izmantojama koda daļa ar savu nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat <em>izsaukt<\/em> funkcijas no dažādām vietām programmā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Funkcijas izveide<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai izveidotu funkciju, izmantojiet atslēgvārdu <code>sub<\/code>, kam seko funkcijas nosaukums.<\/span> <span class=\"sg\" data-s=\"1\">Funkcijas ķermenis ir iekļauts pāra figūriekavās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Funkcijas izmantošana<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai izmantotu funkciju, vienkārši ievietojiet tās nosaukumu vietā, kur jums nepieciešams to izsaukt.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā funkcijas definīcija var atrasties pirms vai pēc vietas, kur funkcija tiek izmantota.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Šis ir tas, ko parasti izdrukā pirmā programma:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā abas ziņas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nŠis ir tas, ko parasti izdrukā pirmā programma:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad aplūkosim citus funkciju izveides un izmantošanas aspektus.<\/span><\/p>"]]},"ru":{"t":"Создание и вызов функций","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы достигли последнего раздела первой части курса.<\/span> <span class=\"sg\" data-s=\"1\">Завершив его, вы получите все необходимые знания для создания практически <em>любой<\/em> программы на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Темой этого раздела являются <em>функции<\/em>, или <em>подпрограммы<\/em>, или даже просто <em>рутины<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функция — это многократно используемая часть кода с собственным именем.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете <em>вызывать<\/em> функции из разных мест программы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Создание функции<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать функцию, используйте ключевое слово <code>sub<\/code>, за которым следует имя функции.<\/span> <span class=\"sg\" data-s=\"1\">Тело функции заключено в пару фигурных скобок.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Использование функции<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы использовать функцию, просто укажите её имя в том месте, где вы хотите её вызвать.<\/span> <span class=\"sg\" data-s=\"1\">В Raku определение функции может находиться как до, так и после места её вызова.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит оба сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь давайте рассмотрим другие детали создания и использования функций.<\/span><\/p>"]]},"uk":{"t":"Створення та виклик функцій","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви досягли останнього розділу першої частини курсу.<\/span> <span class=\"sg\" data-s=\"1\">Завершивши його, ви матимете всі знання, необхідні для створення практично <em>будь-якої<\/em> програми на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Темою цього розділу є <em>функції<\/em>, або <em>підпрограми<\/em>, або навіть просто <em>рутини<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функція — це багаторазова частина коду зі своїм власним ім'ям.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете <em>викликати<\/em> функції з різних місць у програмі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Створення функції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб створити функцію, використовуйте ключове слово <code>sub<\/code>, після якого йде ім'я функції.<\/span> <span class=\"sg\" data-s=\"1\">Тіло функції укладено в пару фігурних дужок.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Використання функції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб використати функцію, просто вкажіть її ім'я в тому місці, де потрібно її викликати.<\/span> <span class=\"sg\" data-s=\"1\">У Raku визначення функції може бути розташоване як перед, так і після місця, де функція використовується.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виведе обидва повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер давайте розглянемо інші деталі створення та використання функцій.<\/span><\/p>"]]},"bg":{"t":"Създаване и извикване на функции","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вие достигнахте последната секция на първата част от курса.<\/span> <span class=\"sg\" data-s=\"1\">С нейното завършване ще имате всички необходими знания, за да създадете практически <em>всяка<\/em> програма в Raku.<\/span> <span class=\"sg\" data-s=\"2\">Темата на тази секция е <em>функции<\/em>, или <em>подпрограми<\/em>, или дори просто <em>рутини<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията е многократно използваема част от кода със собствено име.<\/span> <span class=\"sg\" data-s=\"1\">Можете да <em>извиквате<\/em> функции от различни места в програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Създаване на функция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да създадете функция, използвайте ключовата дума <code>sub<\/code>, последвана от името на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Тялото на функцията е оградено в чифт къдрави скоби.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Използване на функция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да използвате функцията, просто поставете нейното име на мястото, където трябва да я извикате.<\/span> <span class=\"sg\" data-s=\"1\">В Raku, дефиницията на функцията може да бъде разположена преди или след мястото, където се използва функцията.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Това е, което първата програма обикновено отпечатва:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва и двете съобщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТова е, което първата програма обикновено отпечатва:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега, нека разгледаме други детайли за създаването и използването на функции.<\/span><\/p>"]]},"eo":{"t":"Kreado kaj vokado de funkcioj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi atingis la lastan sekcion de la unua parto de la kurso.<\/span> <span class=\"sg\" data-s=\"1\">Kompletigante ĝin, vi havos ĉiujn sciojn necesajn por krei preskaŭ <em>ĉiun<\/em> programon en Raku.<\/span> <span class=\"sg\" data-s=\"2\">La temo de ĉi tiu sekcio estas <em>funkcioj<\/em>, aŭ <em>subrutinaj<\/em>, aŭ eĉ simple <em>rutinaj<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcio estas reuzebla parto de kodo kun sia propra nomo.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas <em>voki<\/em> funkciojn el diversaj lokoj en la programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kreado de funkcio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por krei funkcion, uzu la ŝlosilvorton <code>sub<\/code> sekvatan de la nomo de la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La korpo de la funkcio estas enfermita en paro de kurbaj krampoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluton {\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzado de funkcio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por uzi la funkcion, simple metu ĝian nomon ĉe la loko kie vi bezonas voki ĝin.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, difino de funkcio povas esti lokita antaŭ aŭ post la loko kie la funkcio estas uzata.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Jen kion la unua programo kutime presas:';\nsaluton;    \n\nsub saluton {\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas ambaŭ mesaĝojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nJen kion la unua programo kutime presas:\nSaluton, Mondo!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun, ni rigardu aliajn detalojn pri kreado kaj uzado de funkcioj.<\/span><\/p>"]]},"la":{"t":"Creando et vocando functiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ad ultimam sectionem primae partis cursus pervenisti.<\/span> <span class=\"sg\" data-s=\"1\">Eam perficientes, omnem scientiam necessariam habebitis ad creandum fere <em>quemlibet<\/em> programmatum in Raku.<\/span> <span class=\"sg\" data-s=\"2\">Argumentum huius sectionis est <em>functiones<\/em>, vel <em>subroutinae<\/em>, vel etiam simpliciter <em>routinae<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Functio est pars codicis reutilizabilis cum proprio nomine.<\/span> <span class=\"sg\" data-s=\"1\">Potes <em>vocare<\/em> functiones ex diversis locis in programmate.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare functionem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad functionem creandam, utere verbo <code>sub<\/code> sequente nomine functionis.<\/span> <span class=\"sg\" data-s=\"1\">Corpus functionis includitur in paribus uncis curvis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta {\n    say 'Salve, Mundi!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Utendo functione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad functionem utendam, pone nomen eius loco ubi eam vocare debes.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, definitio functionis potest collocari ante vel post locum ubi functio adhibetur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hoc est quod primum programma plerumque imprimit:';\nsaluta;    \n\nsub saluta {\n    say 'Salve, Mundi!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma utrumque nuntium imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHoc est quod primum programma plerumque imprimit:\nSalve, Mundi!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc, alia singularia de creandis et utendis functionibus spectemus.<\/span><\/p>"]]}}}</script>
