<script type="application/json" id="page-data">{"u":"essentials/functions/return-result","n":272,"k":"topic","pv":"essentials/functions/function-parameters/quiz2","nx":"essentials/functions/return-result/quiz","tr":["essentials","essentials/functions"],"L":{"en":{"t":"Returning the result","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Functions often not only do something but also return a result.<\/span> <span class=\"sg\" data-s=\"1\">For example, in functional programming, functions should not produce any side effects such as printing to console.<\/span> <span class=\"sg\" data-s=\"2\">Nevertheless, Raku does not limit you from doing so.<\/span> <span class=\"sg\" data-s=\"3\">Let’s see how to return a value from a function and how to get it in the calling code.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, the function called <code>add<\/code> takes two numbers and returns their sum.<\/span> <span class=\"sg\" data-s=\"1\">An explicit <code>return<\/code> is used.<\/span> <span class=\"sg\" data-s=\"2\">On the calling side, the value the function returns can be used as any other value.<\/span> <span class=\"sg\" data-s=\"3\">In the above program, it is assigned to a variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The last evaluated value<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, an explicit <code>return<\/code> is not required if the result that you want to return from a function is the last computed value in its body.<\/span> <span class=\"sg\" data-s=\"1\">Our <code>add<\/code> function can be simplified:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">As you may have noticed, there is no semicolon at the end of the line as it is not required when the line ends the current code block.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Such trivial and small functions are often formatted in a single line for a more compact code:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No return data<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you need to return from a function before the end of its body, and the function does not return any result, use a bare <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"de":{"t":"Das Ergebnis zurückgeben","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Funktionen führen oft nicht nur etwas aus, sondern geben auch ein Ergebnis zurück.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel sollten in der funktionalen Programmierung Funktionen keine Nebeneffekte wie das Drucken auf die Konsole erzeugen.<\/span> <span class=\"sg\" data-s=\"2\">Nichtsdestotrotz hindert dich Raku nicht daran, dies zu tun.<\/span> <span class=\"sg\" data-s=\"3\">Schauen wir uns an, wie man einen Wert aus einer Funktion zurückgibt und wie man ihn im aufrufenden Code erhält.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier nimmt die Funktion namens <code>add<\/code> zwei Zahlen und gibt deren Summe zurück.<\/span> <span class=\"sg\" data-s=\"1\">Es wird ein explizites <code>return<\/code> verwendet.<\/span> <span class=\"sg\" data-s=\"2\">Auf der aufrufenden Seite kann der Wert, den die Funktion zurückgibt, wie jeder andere Wert verwendet werden.<\/span> <span class=\"sg\" data-s=\"3\">Im obigen Programm wird er einer Variablen zugewiesen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der zuletzt ausgewertete Wert<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku ist ein explizites <code>return<\/code> nicht erforderlich, wenn das Ergebnis, das du aus einer Funktion zurückgeben möchtest, der zuletzt berechnete Wert in ihrem Körper ist.<\/span> <span class=\"sg\" data-s=\"1\">Unsere <code>add<\/code>-Funktion kann vereinfacht werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wie du vielleicht bemerkt hast, gibt es am Ende der Zeile kein Semikolon, da es nicht erforderlich ist, wenn die Zeile den aktuellen Codeblock beendet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Solche trivialen und kleinen Funktionen werden oft in einer einzigen Zeile formatiert, um einen kompakteren Code zu erhalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Keine Rückgabedaten<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du vor dem Ende des Funktionskörpers aus einer Funktion zurückkehren musst und die Funktion kein Ergebnis zurückgibt, verwende ein nacktes <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"nl":{"t":"Het resultaat teruggeven","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Functies doen vaak niet alleen iets, maar retourneren ook een resultaat.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, in functionele programmering zouden functies geen bijwerkingen moeten hebben, zoals printen naar de console.<\/span> <span class=\"sg\" data-s=\"2\">Desalniettemin beperkt Raku je niet om dit te doen.<\/span> <span class=\"sg\" data-s=\"3\">Laten we eens kijken hoe we een waarde uit een functie kunnen retourneren en hoe we deze kunnen verkrijgen in de aanroepende code.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier neemt de functie genaamd <code>add<\/code> twee getallen en retourneert hun som.<\/span> <span class=\"sg\" data-s=\"1\">Een expliciete <code>return<\/code> wordt gebruikt.<\/span> <span class=\"sg\" data-s=\"2\">Aan de aanroepende kant kan de waarde die de functie retourneert worden gebruikt als elke andere waarde.<\/span> <span class=\"sg\" data-s=\"3\">In het bovenstaande programma wordt deze toegewezen aan een variabele.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De laatst geëvalueerde waarde<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku is een expliciete <code>return<\/code> niet vereist als het resultaat dat je wilt retourneren uit een functie de laatst berekende waarde in het lichaam is.<\/span> <span class=\"sg\" data-s=\"1\">Onze <code>add<\/code> functie kan worden vereenvoudigd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zoals je misschien hebt opgemerkt, is er geen puntkomma aan het einde van de regel omdat dit niet nodig is wanneer de regel het huidige codeblok beëindigt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dergelijke triviale en kleine functies worden vaak in één regel geformatteerd voor een compacter code:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Geen retourgegevens<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je moet terugkeren uit een functie voordat het einde van het lichaam is bereikt, en de functie geen resultaat retourneert, gebruik dan een kale <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is boven de limiet\";\n}<\/code><\/pre>"]]},"es":{"t":"Devolver el resultado","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Las funciones a menudo no solo hacen algo, sino que también devuelven un resultado.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, en la programación funcional, las funciones no deben producir efectos secundarios como imprimir en la consola.<\/span> <span class=\"sg\" data-s=\"2\">Sin embargo, Raku no te limita de hacerlo.<\/span> <span class=\"sg\" data-s=\"3\">Veamos cómo devolver un valor de una función y cómo obtenerlo en el código que llama.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, la función llamada <code>add<\/code> toma dos números y devuelve su suma.<\/span> <span class=\"sg\" data-s=\"1\">Se usa un <code>return<\/code> explícito.<\/span> <span class=\"sg\" data-s=\"2\">En el lado de la llamada, el valor que la función devuelve se puede usar como cualquier otro valor.<\/span> <span class=\"sg\" data-s=\"3\">En el programa anterior, se asigna a una variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El último valor evaluado<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, un <code>return<\/code> explícito no es necesario si el resultado que deseas devolver de una función es el último valor calculado en su cuerpo.<\/span> <span class=\"sg\" data-s=\"1\">Nuestra función <code>add<\/code> se puede simplificar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como habrás notado, no hay punto y coma al final de la línea ya que no es necesario cuando la línea termina el bloque de código actual.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funciones tan triviales y pequeñas a menudo se formatean en una sola línea para un código más compacto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sin datos de retorno<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si necesitas devolver desde una función antes del final de su cuerpo, y la función no devuelve ningún resultado, usa un <code>return<\/code> vacío.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x está por encima del límite\";\n}<\/code><\/pre>"]]},"it":{"t":"Restituzione del risultato","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Le funzioni spesso non solo fanno qualcosa, ma restituiscono anche un risultato.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, nella programmazione funzionale, le funzioni non dovrebbero produrre effetti collaterali come la stampa sulla console.<\/span> <span class=\"sg\" data-s=\"2\">Tuttavia, Raku non ti limita dal farlo.<\/span> <span class=\"sg\" data-s=\"3\">Vediamo come restituire un valore da una funzione e come ottenerlo nel codice chiamante.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui, la funzione chiamata <code>add<\/code> prende due numeri e restituisce la loro somma.<\/span> <span class=\"sg\" data-s=\"1\">Viene utilizzato un <code>return<\/code> esplicito.<\/span> <span class=\"sg\" data-s=\"2\">Dal lato chiamante, il valore che la funzione restituisce può essere utilizzato come qualsiasi altro valore.<\/span> <span class=\"sg\" data-s=\"3\">Nel programma sopra, viene assegnato a una variabile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">L'ultimo valore valutato<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, un <code>return<\/code> esplicito non è necessario se il risultato che vuoi restituire da una funzione è l'ultimo valore calcolato nel suo corpo.<\/span> <span class=\"sg\" data-s=\"1\">La nostra funzione <code>add<\/code> può essere semplificata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come avrai notato, non c'è un punto e virgola alla fine della riga poiché non è richiesto quando la riga termina il blocco di codice corrente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funzioni così banali e piccole sono spesso formattate in una singola riga per un codice più compatto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nessun dato di ritorno<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se hai bisogno di uscire da una funzione prima della fine del suo corpo, e la funzione non restituisce alcun risultato, usa un <code>return<\/code> senza argomenti.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"lv":{"t":"Rezultāta atgriešana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Funkcijas bieži vien ne tikai veic kādu darbību, bet arī atgriež rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, funkcionālajā programmēšanā funkcijām nevajadzētu radīt nekādas blakusparādības, piemēram, drukāt uz konsoles.<\/span> <span class=\"sg\" data-s=\"2\">Tomēr Raku neierobežo jūs to darīt.<\/span> <span class=\"sg\" data-s=\"3\">Apskatīsim, kā atgriezt vērtību no funkcijas un kā to iegūt izsaukuma kodā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit funkcija ar nosaukumu <code>add<\/code> pieņem divus skaitļus un atgriež to summu.<\/span> <span class=\"sg\" data-s=\"1\">Tiek izmantots skaidrs <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Izsaukuma pusē funkcijas atgriezto vērtību var izmantot kā jebkuru citu vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Iepriekš minētajā programmā tā tiek piešķirta mainīgajam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pēdējā novērtētā vērtība<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku valodā skaidrs <code>return<\/code> nav nepieciešams, ja rezultāts, kuru vēlaties atgriezt no funkcijas, ir pēdējā aprēķinātā vērtība tās ķermenī.<\/span> <span class=\"sg\" data-s=\"1\">Mūsu <code>add<\/code> funkciju var vienkāršot:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kā jūs varbūt pamanījāt, rindas beigās nav semikola, jo tas nav nepieciešams, ja rinda beidzas ar pašreizējo koda bloku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šādas triviālas un mazas funkcijas bieži tiek formatētas vienā rindā, lai kods būtu kompaktāks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nav atgriežamo datu<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jums ir nepieciešams atgriezties no funkcijas pirms tās ķermeņa beigām un funkcija neatgriež nekādu rezultātu, izmantojiet tukšu <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x ir virs limita\";\n}<\/code><\/pre>"]]},"ru":{"t":"Возврат результата","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Функции часто не только что-то делают, но и возвращают результат.<\/span> <span class=\"sg\" data-s=\"1\">Например, в функциональном программировании функции не должны производить побочных эффектов, таких как вывод на консоль.<\/span> <span class=\"sg\" data-s=\"2\">Тем не менее, Raku не ограничивает вас в этом.<\/span> <span class=\"sg\" data-s=\"3\">Давайте посмотрим, как вернуть значение из функции и как получить его в вызывающем коде.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь функция, называемая <code>add<\/code>, принимает два числа и возвращает их сумму.<\/span> <span class=\"sg\" data-s=\"1\">Используется явный <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На стороне вызова значение, которое возвращает функция, может использоваться как любое другое значение.<\/span> <span class=\"sg\" data-s=\"3\">В приведенной выше программе оно присваивается переменной.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Последнее вычисленное значение<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku явный <code>return<\/code> не требуется, если результат, который вы хотите вернуть из функции, является последним вычисленным значением в её теле.<\/span> <span class=\"sg\" data-s=\"1\">Наша функция <code>add<\/code> может быть упрощена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как вы могли заметить, в конце строки нет точки с запятой, так как она не требуется, когда строка заканчивает текущий блок кода.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такие тривиальные и небольшие функции часто форматируются в одну строку для более компактного кода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отсутствие возвращаемых данных<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вам нужно выйти из функции до конца её тела, и функция не возвращает никакого результата, используйте пустой <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"uk":{"t":"Повернення результату","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Функції часто не тільки виконують певні дії, але й повертають результат.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, у функціональному програмуванні функції не повинні створювати побічні ефекти, такі як виведення на консоль.<\/span> <span class=\"sg\" data-s=\"2\">Проте, Raku не обмежує вас у цьому.<\/span> <span class=\"sg\" data-s=\"3\">Давайте подивимося, як повернути значення з функції та як отримати його в коді, що викликає функцію.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут функція під назвою <code>add<\/code> приймає два числа і повертає їх суму.<\/span> <span class=\"sg\" data-s=\"1\">Використовується явне <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На стороні виклику значення, яке повертає функція, може використовуватися як будь-яке інше значення.<\/span> <span class=\"sg\" data-s=\"3\">У наведеній вище програмі воно присвоюється змінній.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Останнє обчислене значення<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku явне <code>return<\/code> не є обов'язковим, якщо результат, який ви хочете повернути з функції, є останнім обчисленим значенням у її тілі.<\/span> <span class=\"sg\" data-s=\"1\">Наша функція <code>add<\/code> може бути спрощена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як ви могли помітити, в кінці рядка немає крапки з комою, оскільки вона не потрібна, коли рядок завершує поточний блок коду.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такі тривіальні та невеликі функції часто форматуються в один рядок для більш компактного коду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Відсутність даних для повернення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо вам потрібно повернутися з функції до завершення її тіла, і функція не повертає жодного результату, використовуйте порожнє <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x перевищує ліміт\";\n}<\/code><\/pre>"]]},"bg":{"t":"Връщане на резултат","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Функциите често не само правят нещо, но и връщат резултат.<\/span> <span class=\"sg\" data-s=\"1\">Например, във функционалното програмиране, функциите не трябва да произвеждат никакви странични ефекти като печатане на конзолата.<\/span> <span class=\"sg\" data-s=\"2\">Въпреки това, Raku не ви ограничава да го правите.<\/span> <span class=\"sg\" data-s=\"3\">Нека видим как да върнем стойност от функция и как да я получим в извикващия код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук, функцията наречена <code>add<\/code> приема две числа и връща тяхната сума.<\/span> <span class=\"sg\" data-s=\"1\">Използва се явен <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">От страната на извикването, стойността, която функцията връща, може да се използва като всяка друга стойност.<\/span> <span class=\"sg\" data-s=\"3\">В горната програма, тя се присвоява на променлива.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Последната оценена стойност<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku, явен <code>return<\/code> не е необходим, ако резултатът, който искате да върнете от функцията, е последната изчислена стойност в нейното тяло.<\/span> <span class=\"sg\" data-s=\"1\">Нашата функция <code>add<\/code> може да бъде опростена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както може би сте забелязали, няма точка и запетая в края на реда, тъй като не е необходима, когато редът завършва текущия блок код.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такива тривиални и малки функции често се форматират в един ред за по-компактен код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Няма данни за връщане<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако трябва да върнете от функцията преди края на нейното тяло и функцията не връща никакъв резултат, използвайте празен <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x е над лимита\";\n}<\/code><\/pre>"]]},"eo":{"t":"Redonante la rezulton","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Funkcioj ofte ne nur faras ion, sed ankaŭ redonas rezulton.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, en funkcia programado, funkcioj ne devus produkti ajnajn flankajn efikojn kiel ekzemple presi al konzolo.<\/span> <span class=\"sg\" data-s=\"2\">Tamen, Raku ne limigas vin fari tion.<\/span> <span class=\"sg\" data-s=\"3\">Ni vidu kiel redoni valoron el funkcio kaj kiel ricevi ĝin en la vokanta kodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la funkcio nomata <code>add<\/code> prenas du nombrojn kaj redonas ilian sumon.<\/span> <span class=\"sg\" data-s=\"1\">Estas uzata eksplicita <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En la vokanta flanko, la valoro kiun la funkcio redonas povas esti uzata kiel ajna alia valoro.<\/span> <span class=\"sg\" data-s=\"3\">En la supra programo, ĝi estas asignita al variablo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La laste taksita valoro<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, eksplicita <code>return<\/code> ne estas postulata se la rezulto kiun vi volas redoni el funkcio estas la laste komputita valoro en ĝia korpo.<\/span> <span class=\"sg\" data-s=\"1\">Nia funkcio <code>add<\/code> povas esti simpligita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiel vi eble rimarkis, ne estas punkto-komo ĉe la fino de la linio ĉar ĝi ne estas postulata kiam la linio finas la aktualan kodoblokon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tiaj trivialaj kaj malgrandaj funkcioj ofte estas formatitaj en unu linio por pli kompakta kodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neniu redona datumoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi bezonas redoni el funkcio antaŭ la fino de ĝia korpo, kaj la funkcio ne redonas ajnan rezulton, uzu nudan <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x estas super la limo\";\n}<\/code><\/pre>"]]},"la":{"t":"Redonando resultatum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Functiones saepe non solum aliquid faciunt sed etiam eventum reddunt.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, in programmate functionali, functiones non debent ullos effectus laterales producere sicut imprimere ad consolam.<\/span> <span class=\"sg\" data-s=\"2\">Nihilominus, Raku te non impedit ne id facias.<\/span> <span class=\"sg\" data-s=\"3\">Videamus quomodo valorem ex functione reddere et quomodo eum in codice vocante accipere possimus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic, functio quae <code>add<\/code> appellatur duos numeros accipit et eorum summam reddit.<\/span> <span class=\"sg\" data-s=\"1\">Explicita <code>return<\/code> adhibetur.<\/span> <span class=\"sg\" data-s=\"2\">In parte vocante, valor quem functio reddit uti potest sicut quivis alius valor.<\/span> <span class=\"sg\" data-s=\"3\">In programmate supra, variabili assignatur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ultimus valor aestimatus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, explicita <code>return<\/code> non requiritur si eventus quem vis ex functione reddere est ultimus valor computatus in corpore eius.<\/span> <span class=\"sg\" data-s=\"1\">Nostra functio <code>add<\/code> simplicior fieri potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut fortasse animadvertisti, non est punctum-commatum in fine lineae quia non requiritur cum linea finem currentis codicis clausulae terminat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tales triviales et parvae functiones saepe in una linea formantur ad codicem compendiariorem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nullus reditus data<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si opus est ex functione redire ante finem corporis eius, et functio nullum eventum reddit, utere nuda <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return si $x &lt;= 10;\n    dic \"$x est supra limitem\";\n}<\/code><\/pre>"]]}}}</script>
