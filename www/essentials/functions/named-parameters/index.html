<script type="application/json" id="page-data">{"u":"essentials/functions/named-parameters","n":276,"k":"topic","pv":"essentials/functions/positional-parameters/quiz","nx":"essentials/functions/named-parameters/quiz1","tr":["essentials","essentials/functions"],"L":{"en":{"t":"Named parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In contrast to <a href=\"/essentials/functions/positional-parameters/\">positional parameters<\/a>, <em>named<\/em> parameters are referred to by their names.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following function takes two parameters called <code>$from<\/code> and <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now, to call the function, you need to name the arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is an error to pass the arguments as if they were positional.<\/span> <span class=\"sg\" data-s=\"1\">For example, a call <code>distance(30, 10)<\/code> generates an error:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too many positionals passed; expected 0 arguments but got 2         in sub distance at t.raku line 1         in block &lt;unit&gt; at t.raku line 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The good part is that named arguments can be listed in any order.<\/span> <span class=\"sg\" data-s=\"1\">The following two calls are totally equivalent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Passing variables<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When the value that you want to pass to a function is kept in a variable, whose name coincides with the name of the parameter, you can enjoy a special syntax that reduces typing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is similar to a wordy call:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Again, the order is not strict here:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the name of the variable differs from the name of the parameter, use one of the ways to pass a pair:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# or:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"de":{"t":"Benannte Parameter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Im Gegensatz zu <a href=\"/essentials/functions/positional-parameters/\">positionsbasierten Parametern<\/a> werden <em>benannte<\/em> Parameter durch ihre Namen referenziert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die folgende Funktion nimmt zwei Parameter namens <code>$from<\/code> und <code>$to<\/code> entgegen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um die Funktion aufzurufen, müssen Sie die Argumente benennen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist ein Fehler, die Argumente so zu übergeben, als wären sie positionsbasiert.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel erzeugt ein Aufruf <code>distance(30, 10)<\/code> einen Fehler:<\/span><\/p>"],["p",1,"<p><span cl ons/positional-parameters/\">positionele parameters<\/a>, worden <em>benoemde<\/em> parameters aangeduid met hun namen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende functie neemt twee parameters genaamd <code>$from<\/code> en <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om de functie aan te roepen, moet je de argumenten benoemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is een fout om de argumenten door te geven alsof ze positioneel zijn.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, een oproep <code>distance(30, 10)<\/code> genereert een fout:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too many positionals passed; expected 0 arguments but got 2         in sub distance at t.raku line 1         in block &lt;unit&gt; at t.raku line 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het goede nieuws is dat benoemde argumenten in willekeurige volgorde kunnen worden vermeld.<\/span> <span class=\"sg\" data-s=\"1\">De volgende twee oproepen zijn volledig equivalent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabelen doorgeven<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wanneer de waarde die je aan een functie wilt doorgeven in een variabele wordt bewaard, waarvan de naam overeenkomt met de naam van de parameter, kun je genieten van een speciale syntaxis die het typen vermindert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is vergelijkba  en cualquier orden.<\/span> <span class=\"sg\" data-s=\"1\">Las siguientes dos llamadas son totalmente equivalentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pasando variables<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando el valor que quieres pasar a una función se guarda en una variable, cuyo nombre coincide con el nombre del parámetro, puedes disfrutar de una sintaxis especial que reduce la escritura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto es similar a una llamada más verbosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nuevamente, el orden no es estricto aquí:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si el nombre de la variable difiere del nombre del parámetro, usa una de las formas de pasar un par:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# o:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"it":{"t":"Parametri nominati","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In contrasto con i <a href=\"/essentials/functions/positional-parameters/\">parametri posizionali<\/a>, i parametri <em>nominati<\/em> sono riferiti dai loro nomi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La seguente funzione prende due parametri chiamati <code>$from<\/code> e <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><s differisce dal nome del parametro, usa uno dei modi per passare una coppia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# oppure:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"lv":{"t":"Nosauktie parametri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Atšķirībā no <a href=\"/essentials/functions/positional-parameters/\">pozicionālajiem parametriem<\/a>, <em>nosauktie<\/em> parametri tiek norādīti pēc to nosaukumiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī funkcija pieņem divus parametrus, kas saucas <code>$from<\/code> un <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad, lai izsauktu funkciju, jums ir jānorāda argumentu nosaukumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir kļūda nodot argumentus tā, it kā tie būtu pozicionāli.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, izsaukums <code>distance(30, 10)<\/code> radīs kļūdu:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pārāk daudz pozicionālo argumentu; tika gaidīti 0 argumenti, bet tika saņemti 2         sub distance pie t.raku 1. rindas         blokā &lt;unit&gt; pie t.raku 2. rindas<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Labā ziņa ir tā, ka nosauktos argumentus var uzskaitīt jebkurā secībā.<\/span> <span class=\"sg\" data-s=\"1\">Šie divi izsaukumi ir pilnīgi ekvivalenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mainīgo nodošana<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad vērtība, kuru vēlaties nodot funkcijai, ir saglabāta mainīgajā, kura nosaukums sakrīt ar parametra nosaukumu, jūs varat izmantot īpašu sintaksi, kas samazina rakstīšanu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas ir līdzīgi kā izsaukums ar vairāk vārdiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atkal, secība šeit nav stingra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja mainīgā nosaukums atšķiras no parametra nosaukuma, izmantojiet vienu no veidiem, kā nodot pāri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# vai:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"ru":{"t":"Именованные параметры","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В отличие от <a href=\"/essentials/functions/positional-parameters/\">позиционных параметров<\/a>, <em>именованные<\/em> параметры указываются по их именам.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующая функция принимает два параметра, называемых <code>$from<\/code> и <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь, чтобы вызвать функцию, нужно указать имена аргументов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ошибка возникает, если передать аргументы, как будто они позиционные.<\/span> <span class=\"sg\" data-s=\"1\">Например, вызов <code>distance(30, 10)<\/code> приведет к ошибке:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Слишком много позиционных аргументов; ожидалось 0 аргументов, но получено 2         в подпрограмме distance на строке 1 в t.raku         в блоке &lt;unit&gt; на строке 2 в t.raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хорошая новость в том, что именованные аргументы можно перечислять в любом порядке.<\/span> <span class=\"sg\" data-s=\"1\">Следующие два вызова абсолютно эквивалентны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача переменных<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда значение, которое вы хотите передать функции, хранится в переменной, имя которой совпадает с именем параметра, вы можете использовать специальный синтаксис, который уменьшает количество вводимых символов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это похоже на более многословный вызов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Снова, порядок здесь не важен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если имя переменной отличается от имени параметра, используйте один из способов передачи пары:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# или:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"uk":{"t":"Іменовані параметри","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">На відміну від <a href=\"/essentials/functions/positional-parameters/\">позиційних параметрів<\/a>, <em>іменовані<\/em> параметри посилаються за їхніми іменами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступна функція приймає два параметри, які називаються <code>$from<\/code> і <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер, щоб викликати функцію, потрібно назвати аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Помилкою буде передавати аргументи так, ніби вони позиційні.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, виклик <code>distance(30, 10)<\/code> створює помилку:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Занадто багато позиційних аргументів; очікувалося 0 аргументів, але отримано 2         в підпрограмі distance на рядку 1 у файлі t.raku         в блоці &lt;unit&gt; на рядку 2 у файлі t.raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хороша новина в тому, що іменовані аргументи можуть бути перераховані в будь-якому порядку.<\/span> <span class=\"sg\" data-s=\"1\">Наступні два виклики є абсолютно еквівалентними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача змінних<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли значення, яке ви хочете передати функції, зберігається у змінній, ім'я якої збігається з ім'ям параметра, ви можете скористатися спеціальним синтаксисом, який зменшує кількість набору тексту:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це схоже на більш розлогий виклик:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Знову ж таки, порядок тут не є строгим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ім'я змінної відрізняється від імені параметра, використовуйте один із способів передати пару:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# або:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"bg":{"t":"Именувани параметри","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За разлика от <a href=\"/essentials/functions/positional-parameters/\">позиционните параметри<\/a>, <em>именуваните<\/em> параметри се отнасят по техните имена.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следната функция приема два параметъра, наречени <code>$from<\/code> и <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега, за да извикате функцията, трябва да именувате аргументите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Грешка е да предадете аргументите, сякаш са позиционни.<\/span> <span class=\"sg\" data-s=\"1\">Например, извикването <code>distance(30, 10)<\/code> генерира грешка:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прекалено много позиционни аргументи; очаквани 0 аргумента, но получени 2         в sub distance на ред 1 в t.raku         в блок &lt;unit&gt; на ред 2 в t.raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добрата част е, че именуваните аргументи могат да бъдат изброени в произволен ред.<\/span> <span class=\"sg\" data-s=\"1\">Следните две извиквания са напълно еквивалентни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Предаване на променливи<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато стойността, която искате да предадете на функция, се съхранява в променлива, чието име съвпада с името на параметъра, можете да използвате специален синтаксис, който намалява писането:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е подобно на по-дълго извикване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отново, редът тук не е строг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако името на променливата се различава от името на параметъра, използвайте един от начините за предаване на двойка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# или:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"eo":{"t":"Nomitaj parametroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kontraste al <a href=\"/essentials/functions/positional-parameters/\">poziciaj parametroj<\/a>, <em>nomitaj<\/em> parametroj estas referencitaj per iliaj nomoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekva funkcio prenas du parametrojn nomitajn <code>$from<\/code> kaj <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun, por voki la funkcion, vi devas nomi la argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas eraro pasi la argumentojn kvazaŭ ili estus poziciaj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, voko <code>distance(30, 10)<\/code> generas eraron:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tro multaj poziciaj pasis; atendis 0 argumentojn sed ricevis 2         en sub distance ĉe t.raku linio 1         en bloko &lt;unit&gt; ĉe t.raku linio 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La bona parto estas, ke nomitaj argumentoj povas esti listigitaj en ajna ordo.<\/span> <span class=\"sg\" data-s=\"1\">La sekvaj du vokoj estas tute ekvivalentaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pasante variablojn<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam la valoro, kiun vi volas pasi al funkcio, estas konservita en variablo, kies nomo koincidas kun la nomo de la parametro, vi povas ĝui specialan sintakson, kiu reduktas tajpadon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas simila al vorteca voko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Denove, la ordo ne estas strikta ĉi tie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la nomo de la variablo diferencas de la nomo de la parametro, uzu unu el la manieroj pasi paron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# aŭ:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"la":{"t":"Nominate parametra","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Contrarium ad <a href=\"/essentials/functions/positional-parameters/\">parametros posicionales<\/a>, <em>nominati<\/em> parametri nominibus suis referuntur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sequens functio duos parametros vocatos <code>$from<\/code> et <code>$to<\/code> accipit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc, ut functionem vocare, debes argumenta nominare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Error est argumenta quasi posicionalia transmittere.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, vocatio <code>distance(30, 10)<\/code> errorem generat:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Troppi positionale transmissi; expectati 0 argumenti sed accepti 2         in sub distance ad t.raku linea 1         in block &lt;unit&gt; ad t.raku linea 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bona pars est quod argumenta nominata in quolibet ordine enumerari possunt.<\/span> <span class=\"sg\" data-s=\"1\">Sequentes duae vocationes omnino aequivalentes sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabiles transmittentes<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum valor quem vis transmittere ad functionem in variabili servatur, cuius nomen cum nomine parametri coincidit, frui potes speciali syntaxi quae scribendi laborem minuit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc simile est vocatio verbosae:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iterum, ordo hic non est strictus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si nomen variabilis differt a nomine parametri, utere uno modorum ad par transmittendum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# vel:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]}}}</script>
