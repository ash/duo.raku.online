<script type="application/json" id="page-data">{"u":"essentials/functions/named-parameters/quiz2","n":278,"k":"quiz","pv":"essentials/functions/named-parameters/quiz1","nx":"essentials/functions/default-values","tr":["essentials","essentials/functions","essentials/functions/named-parameters"],"L":{"en":{"t":"Quiz — Variables as named parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the same function as in the previous quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You also have three variables in the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mark all the valid ways to call the function and pass two of the three variables to it.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positional arguments are passed here instead of the named ones.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Not a valid Raku syntax.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">No named parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">No named parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Same as above.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Also fine, while a bit redundant.<\/span><\/span><\/li><\/ul>"]]},"de":{"t":"Quiz 2 — Variablen als benannte Parameter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist die gleiche Funktion wie im vorherigen Quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du hast auch drei Variablen im Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Markiere alle gültigen Wege, die Funktion aufzurufen und zwei der drei Variablen zu übergeben.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positionsargumente werden hier anstelle der benannten übergeben.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Keine gültige Raku-Syntax.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Kein benannter Parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Kein benannter Parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Dasselbe wie oben.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Auch in Ordnung, wenn auch etwas redundant.<\/span><\/span><\/li><\/ul>"]]},"nl":{"t":"Quiz 2 — Variabelen als benoemde parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is dezelfde functie als in de vorige quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je hebt ook drie variabelen in het programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Markeer alle geldige manieren om de functie aan te roepen en twee van de drie variabelen door te geven.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positionele argumenten worden hier doorgegeven in plaats van de benoemde.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Geen geldige Raku-syntaxis.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Geen benoemde parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Geen benoemde parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Zelfde als hierboven.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Ook goed, hoewel een beetje overbodig.<\/span><\/span><\/li><\/ul>"]]},"es":{"t":"Quiz 2 — Variables como parámetros nombrados","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí está la misma función que en el cuestionario anterior:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También tienes tres variables en el programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Marca todas las formas válidas de llamar a la función y pasarle dos de las tres variables.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Aquí se pasan argumentos posicionales en lugar de los nombrados.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Sintaxis no válida en Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">No hay un parámetro nombrado <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">No hay un parámetro nombrado <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Igual que el anterior.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">También está bien, aunque un poco redundante.<\/span><\/span><\/li><\/ul>"]]},"it":{"t":"Quiz 2 — Variabili come parametri nominati","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco la stessa funzione del quiz precedente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai anche tre variabili nel programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Segna tutti i modi validi per chiamare la funzione e passare due delle tre variabili ad essa.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Qui vengono passati argomenti posizionali invece di quelli nominati.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Sintassi Raku non valida.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Nessun parametro nominato <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Nessun parametro nominato <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Uguale a sopra.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Anche questo va bene, sebbene un po' ridondante.<\/span><\/span><\/li><\/ul>"]]},"lv":{"t":"Tests 2 — Mainīgie kā nosauktie parametri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir tā pati funkcija kā iepriekšējā viktorīnā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmā ir arī trīs mainīgie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atzīmējiet visus derīgos veidus, kā izsaukt funkciju un nodot tai divus no trim mainīgajiem.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Šeit tiek nodoti pozicionālie argumenti, nevis nosauktie.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Nav derīga Raku sintakse.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Nav nosauktā parametra <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Nav nosauktā parametra <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">
