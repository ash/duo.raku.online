<script type="application/json" id="page-data">{"u":"essentials/functions/default-values","n":279,"k":"topic","pv":"essentials/functions/named-parameters/quiz2","nx":"essentials/functions/default-values/quiz1","tr":["essentials","essentials/functions"],"L":{"en":{"t":"Default values","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Both positional and named parameters can have default values.<\/span> <span class=\"sg\" data-s=\"1\">If the function has a default value for the given parameter, that parameter may be skipped when calling the function.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positional parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An example of a default value for a function with positional parameters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The first call uses the name passed as the only argument and thus prints <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The second call uses the default value and prints <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If a function has more than one parameter, then the default values can only be used at the end of the list of them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correct\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # WRONG<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Named parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same syntax is used for setting default values for named parameters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The order of the named parameters does not matter, so any of them can have default values, even the first in the list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"de":{"t":"Standardwerte","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sowohl Positions- als auch benannte Parameter können Standardwerte haben.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Funktion einen Standardwert für den angegebenen Parameter hat, kann dieser Parameter beim Aufruf der Funktion weggelassen werden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positionsparameter<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Beispiel für einen Standardwert für eine Funktion mit Positionsparametern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der erste Aufruf verwendet den als einziges Argument übergebenen Namen und druckt daher <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der zweite Aufruf verwendet den Standardwert und druckt <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Funktion mehr als einen Parameter hat, können die Standardwerte nur am Ende der Liste verwendet werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # korrekt\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FALSCH<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benannte Parameter<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die gleiche Syntax wird verwendet, um Standardwerte für benannte Parameter festzulegen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Reihenfolge der benannten Parameter spielt keine Rolle, sodass jeder von ihnen Standardwerte haben kann, sogar der erste in der Liste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"nl":{"t":"Standaardwaarden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zowel positionele als benoemde parameters kunnen standaardwaarden hebben.<\/span> <span class=\"sg\" data-s=\"1\">Als de functie een standaardwaarde heeft voor de gegeven parameter, kan die parameter worden overgeslagen bij het aanroepen van de functie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positionele parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een voorbeeld van een standaardwaarde voor een functie met positionele parameters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De eerste aanroep gebruikt de naam die als enig argument is doorgegeven en drukt dus <code>Hello, Merinda!<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">De tweede aanroep gebruikt de standaardwaarde en drukt <code>Hello, World!<\/code> af.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als een functie meer dan één parameter heeft, kunnen de standaardwaarden alleen aan het einde van de lijst worden gebruikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correct\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FOUT<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benoemde parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dezelfde syntaxis wordt gebruikt voor het instellen van standaardwaarden voor benoemde parameters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgorde van de benoemde parameters maakt niet uit, dus elk van hen kan standaardwaarden hebben, zelfs de eerste in de lijst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"es":{"t":"Valores predeterminados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tanto los parámetros posicionales como los nombrados pueden tener valores predeterminados.<\/span> <span class=\"sg\" data-s=\"1\">Si la función tiene un valor predeterminado para el parámetro dado, ese parámetro puede omitirse al llamar a la función.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros posicionales<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un ejemplo de un valor predeterminado para una función con parámetros posicionales:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La primera llamada usa el nombre pasado como el único argumento y, por lo tanto, imprime <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La segunda llamada usa el valor predeterminado e imprime <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si una función tiene más de un parámetro, entonces los valores predeterminados solo se pueden usar al final de la lista de ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correcto\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # INCORRECTO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros nombrados<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se usa la misma sintaxis para establecer valores predeterminados para parámetros nombrados:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El orden de los parámetros nombrados no importa, por lo que cualquiera de ellos puede tener valores predeterminados, incluso el primero en la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"it":{"t":"Valori predefiniti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sia i parametri posizionali che quelli nominati possono avere valori predefiniti.<\/span> <span class=\"sg\" data-s=\"1\">Se la funzione ha un valore predefinito per il parametro dato, quel parametro può essere omesso quando si chiama la funzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri posizionali<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un esempio di valore predefinito per una funzione con parametri posizionali:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prima chiamata utilizza il nome passato come unico argomento e quindi stampa <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La seconda chiamata utilizza il valore predefinito e stampa <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se una funzione ha più di un parametro, i valori predefiniti possono essere utilizzati solo alla fine dell'elenco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # corretto\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # SBAGLIATO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri nominati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La stessa sintassi viene utilizzata per impostare valori predefiniti per i parametri nominati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'ordine dei parametri nominati non importa, quindi ognuno di essi può avere valori predefiniti, anche il primo nell'elenco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"lv":{"t":"Noklusējuma vērtības","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gan pozicionālajiem, gan nosauktajiem parametriem var būt noklusējuma vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Ja funkcijai ir noklusējuma vērtība dotajam parametram, šo parametru var izlaist, izsaucot funkciju.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pozicionālie parametri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemērs funkcijai ar pozicionālajiem parametriem un noklusējuma vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pirmajā izsaukumā tiek izmantots vārds, kas nodots kā vienīgais arguments, un tādējādi tiek izdrukāts <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Otrajā izsaukumā tiek izmantota noklusējuma vērtība un tiek izdrukāts <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja funkcijai ir vairāk nekā viens parametrs, tad noklusējuma vērtības var izmantot tikai saraksta beigās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # pareizi\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # NEPAREIZI<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nosauktie parametri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā pati sintakse tiek izmantota noklusējuma vērtību iestatīšanai nosauktajiem parametriem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nosaukto parametru secība nav svarīga, tāpēc jebkuram no tiem var būt noklusējuma vērtības, pat pirmajam sarakstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"ru":{"t":"Значения по умолчанию","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">И позиционные, и именованные параметры могут иметь значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">Если функция имеет значение по умолчанию для данного параметра, этот параметр может быть пропущен при вызове функции.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиционные параметры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пример значения по умолчанию для функции с позиционными параметрами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Первый вызов использует имя, переданное в качестве единственного аргумента, и, таким образом, выводит <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Второй вызов использует значение по умолчанию и выводит <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если функция имеет более одного параметра, то значения по умолчанию могут использоваться только в конце их списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правильно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # НЕПРАВИЛЬНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именованные параметры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Та же синтаксическая конструкция используется для установки значений по умолчанию для именованных параметров:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порядок именованных параметров не имеет значения, поэтому любой из них может иметь значения по умолчанию, даже первый в списке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"uk":{"t":"Значення за замовчуванням","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">І позиційні, і іменовані параметри можуть мати значення за замовчуванням.<\/span> <span class=\"sg\" data-s=\"1\">Якщо функція має значення за замовчуванням для заданого параметра, цей параметр можна пропустити при виклику функції.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиційні параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Приклад значення за замовчуванням для функції з позиційними параметрами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перший виклик використовує ім'я, передане як єдиний аргумент, і тому виводить <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Другий виклик використовує значення за замовчуванням і виводить <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо функція має більше одного параметра, то значення за замовчуванням можуть використовуватися лише в кінці списку параметрів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правильно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # НЕПРАВИЛЬНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Іменовані параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такий самий синтаксис використовується для встановлення значень за замовчуванням для іменованих параметрів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порядок іменованих параметрів не має значення, тому будь-який з них може мати значення за замовчуванням, навіть перший у списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"bg":{"t":"Стойности по подразбиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">И двата вида параметри, позиционни и именувани, могат да имат стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\">Ако функцията има стойност по подразбиране за даден параметър, този параметър може да бъде пропуснат при извикване на функцията.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиционни параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пример за стойност по подразбиране за функция с позиционни параметри:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Първото извикване използва името, предадено като единствен аргумент, и следователно отпечатва <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Второто извикване използва стойността по подразбиране и отпечатва <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако функцията има повече от един параметър, тогава стойностите по подразбиране могат да се използват само в края на списъка с тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правилно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # ГРЕШНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именувани параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същият синтаксис се използва за задаване на стойности по подразбиране за именувани параметри:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Редът на именуваните параметри няма значение, така че всеки от тях може да има стойности по подразбиране, дори първият в списъка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"eo":{"t":"Defaŭltaj valoroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ poziciaj kaj nomitaj parametroj povas havi defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Se la funkcio havas defaŭltan valoron por la donita parametro, tiu parametro povas esti preterlasita kiam oni vokas la funkcion.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Poziciaj parametroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzemplo de defaŭlta valoro por funkcio kun poziciaj parametroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La unua voko uzas la nomon pasitan kiel la sola argumento kaj tiel presas <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La dua voko uzas la defaŭltan valoron kaj presas <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se funkcio havas pli ol unu parametrojn, tiam la defaŭltaj valoroj povas esti uzataj nur ĉe la fino de la listo de ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # ĝuste\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # MALĜUSTE<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nomitaj parametroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sama sintakso estas uzata por agordi defaŭltajn valorojn por nomitaj parametroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La ordo de la nomitaj parametroj ne gravas, do iu ajn el ili povas havi defaŭltajn valorojn, eĉ la unua en la listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"la":{"t":"Defaulte valores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tam parametri positionis quam nominati valores praedefiniti habere possunt.<\/span> <span class=\"sg\" data-s=\"1\">Si functio valorem praedefinitum pro parametro dato habet, ille parameter omitti potest cum functionem vocas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri positionis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exemplum valoris praedefiniti pro functione cum parametris positionis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta($nomen = 'Mundus') {\n    say \"Salve, $nomen!\";\n}\n\nsaluta('Merinda');\nsaluta();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prima vocatio nomen datum ut solum argumentum utitur et sic imprimit <code>Salve, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Secunda vocatio valorem praedefinitum utitur et imprimit <code>Salve, Mundus!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si functio plus quam unum parametron habet, tunc valores praedefiniti tantum in fine eorum indicis adhiberi possunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # rectum\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FALSUM<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri nominati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eadem syntaxi adhibetur ad valores praedefinitos pro parametris nominatis statuendos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta(:$nomen = 'Mundus') {\n    say \"Salve, $nomen!\";\n}\n\nsaluta(nomen =&gt; 'Merinda'); # Salve, Merinda!\nsaluta(); # Salve, Mundus!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ordo parametron nominatorum non refert, ita quilibet eorum valores praedefinitos habere potest, etiam primus in indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta(:$salutatio = 'Salve', :$nomen) {\n    say \"$salutatio, $nomen!\";\n}\n\nsaluta(nomen =&gt; 'Alla'); # Salve, Alla!<\/code><\/pre>"]]}}}</script>
