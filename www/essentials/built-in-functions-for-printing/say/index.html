<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing/say","n":310,"k":"topic","pv":"essentials/built-in-functions-for-printing","nx":"essentials/built-in-functions-for-printing/print","tr":["essentials","essentials/built-in-functions-for-printing"],"L":{"en":{"t":"The say routine","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>say<\/code> built-in routine does the following actions:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Calls the <code>gist<\/code> method on its arguments.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Adds a newline character.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converts the result to UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sends it to the <code>STDOUT<\/code> stream.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">From the user perspective, <code>say<\/code> simply prints the contents of a variable to the terminal and adds the newline.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The first step requires some explanations.<\/span> <span class=\"sg\" data-s=\"1\">The <code>gist<\/code> method is a method that is defined for every built-in data type, such as integers or strings.<\/span> <span class=\"sg\" data-s=\"2\">For such simple types, the return result is a human-readable value that represents the item.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For more complex data, such as arrays or hashes, the <code>gist<\/code> method adds some formatting.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>say<\/code> routine can be called as both a function and a method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can pass more than one argument to <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The output pieces are joined with no spaces between them.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"de":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Die eingebaute Routine <code>say<\/code> führt die folgenden Aktionen aus:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Ruft die Methode <code>gist<\/code> auf ihren Argumenten auf.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Fügt ein Zeilenumbruchzeichen hinzu.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertiert das Ergebnis in UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendet es an den <code>STDOUT<\/code>-Stream.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aus der Sicht des Benutzers druckt <code>say<\/code> einfach den Inhalt einer Variablen auf das Terminal und fügt den Zeilenumbruch hinzu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der erste Schritt erfordert einige Erklärungen.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>gist<\/code> ist eine Methode, die für jeden eingebauten Datentyp definiert ist, wie z.B. Ganzzahlen oder Zeichenketten.<\/span> <span class=\"sg\" data-s=\"2\">Für solche einfachen Typen ist das Rückgabeergebnis ein menschenlesbarer Wert, der das Element darstellt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für komplexere Daten, wie Arrays oder Hashes, fügt die Methode <code>gist<\/code> etwas Formatierung hinzu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <code>say<\/code>-Routine kann sowohl als Funktion als auch als Methode aufgerufen werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Man kann mehr als ein Argument an <code>say<\/code> übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Die Ausgabeteile werden ohne Leerzeichen dazwischen verbunden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"nl":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De ingebouwde routine <code>say<\/code> voert de volgende acties uit:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Roept de <code>gist<\/code> methode aan op zijn argumenten.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Voegt een nieuwe regel teken toe.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converteert het resultaat naar UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Stuurt het naar de <code>STDOUT<\/code> stream.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vanuit het perspectief van de gebruiker, drukt <code>say<\/code> simpelweg de inhoud van een variabele af naar de terminal en voegt een nieuwe regel toe.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De eerste stap vereist enige uitleg.<\/span> <span class=\"sg\" data-s=\"1\">De <code>gist<\/code> methode is een methode die is gedefinieerd voor elk ingebouwd gegevenstype, zoals gehele getallen of strings.<\/span> <span class=\"sg\" data-s=\"2\">Voor zulke eenvoudige types is het retourresultaat een menselijk leesbare waarde die het item vertegenwoordigt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor complexere gegevens, zoals arrays of hashes, voegt de <code>gist<\/code> methode enige opmaak toe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>say<\/code> routine kan zowel als functie of als methode worden aangeroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt meer dan één argument doorgeven aan <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De uitvoerstukken worden zonder spaties ertussen samengevoegd.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"es":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina incorporada <code>say<\/code> realiza las siguientes acciones:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Llama al método <code>gist<\/code> en sus argumentos.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Añade un carácter de nueva línea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convierte el resultado a UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Lo envía al flujo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Desde la perspectiva del usuario, <code>say<\/code> simplemente imprime el contenido de una variable en la terminal y añade la nueva línea.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El primer paso requiere algunas explicaciones.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>gist<\/code> es un método que está definido para cada tipo de dato incorporado, como enteros o cadenas.<\/span> <span class=\"sg\" data-s=\"2\">Para estos tipos simples, el resultado devuelto es un valor legible por humanos que representa el elemento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para datos más complejos, como arreglos o hashes, el método <code>gist<\/code> añade algo de formato.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>say<\/code> puede ser llamada tanto como una función o un método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes pasar más de un argumento a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Las piezas de salida se unen sin espacios entre ellas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"it":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine incorporata <code>say<\/code> esegue le seguenti azioni:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Chiama il metodo <code>gist<\/code> sui suoi argomenti.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aggiunge un carattere di nuova linea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converte il risultato in UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Lo invia al flusso <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dal punto di vista dell'utente, <code>say<\/code> semplicemente stampa il contenuto di una variabile sul terminale e aggiunge la nuova linea.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il primo passo richiede alcune spiegazioni.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>gist<\/code> è un metodo definito per ogni tipo di dato incorporato, come interi o stringhe.<\/span> <span class=\"sg\" data-s=\"2\">Per tali tipi semplici, il risultato restituito è un valore leggibile che rappresenta l'elemento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per dati più complessi, come array o hash, il metodo <code>gist<\/code> aggiunge una certa formattazione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>say<\/code> può essere chiamata sia come funzione che come metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi passare più di un argomento a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">I pezzi di output sono uniti senza spazi tra di loro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"lv":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Iebūvētā <code>say<\/code> rutīna veic šādas darbības:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Izsauc <code>gist<\/code> metodi uz tās argumentiem.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Pievieno jaunas rindas rakstzīmi.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Pārvērš rezultātu uz UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nosūta to uz <code>STDOUT<\/code> plūsmu.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">No lietotāja perspektīvas, <code>say<\/code> vienkārši izdrukā mainīgā saturu terminālā un pievieno jaunu rindu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmais solis prasa dažus paskaidrojumus.<\/span> <span class=\"sg\" data-s=\"1\"><code>gist<\/code> metode ir metode, kas ir definēta katram iebūvētajam datu tipam, piemēram, veseliem skaitļiem vai virkām.<\/span> <span class=\"sg\" data-s=\"2\">Šādiem vienkāršiem tipiem atgrieztā vērtība ir cilvēkam lasāma vērtība, kas pārstāv objektu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sarežģītākiem datiem, piemēram, masīviem vai vārdnīcām, <code>gist<\/code> metode pievieno kādu formatējumu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Say<\/code> rutīnu var izsaukt gan kā funkciju, gan kā metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat nodot vairāk nekā vienu argumentu <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Izejas daļas tiek savienotas bez atstarpēm starp tām.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"ru":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Встроенная операция <code>say<\/code> выполняет следующие действия:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Вызывает метод <code>gist<\/code> для своих аргументов.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавляет символ новой строки.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Преобразует результат в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Отправляет его в поток <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С точки зрения пользователя, <code>say<\/code> просто выводит содержимое переменной в терминал и добавляет новую строку.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Первый шаг требует некоторых объяснений.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>gist<\/code> — это метод, который определен для каждого встроенного типа данных, такого как целые числа или строки.<\/span> <span class=\"sg\" data-s=\"2\">Для таких простых типов возвращаемый результат является удобочитаемым значением, представляющим элемент.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для более сложных данных, таких как массивы или хэши, метод <code>gist<\/code> добавляет некоторое форматирование.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операция <code>say<\/code> может быть вызвана как функция или как метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете передать более одного аргумента в <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Части вывода соединяются без пробелов между ними.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"uk":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вбудована рутинна функція <code>say<\/code> виконує наступні дії:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Викликає метод <code>gist<\/code> на своїх аргументах.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Додає символ нового рядка.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Перетворює результат у UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Відправляє його до потоку <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З точки зору користувача, <code>say<\/code> просто виводить вміст змінної на термінал і додає новий рядок.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перший крок потребує деяких пояснень.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>gist<\/code> визначений для кожного вбудованого типу даних, такого як цілі числа або рядки.<\/span> <span class=\"sg\" data-s=\"2\">Для таких простих типів результатом є значення, яке легко читається людиною і представляє елемент.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для складніших даних, таких як масиви або хеші, метод <code>gist<\/code> додає певне форматування.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рутинну функцію <code>say<\/code> можна викликати як функцію або як метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете передати більше одного аргументу до <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Частини виводу з'єднуються без пробілів між ними.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"bg":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вградената рутина <code>say<\/code> изпълнява следните действия:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Извиква метода <code>gist<\/code> върху своите аргументи.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавя нов ред.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Преобразува резултата в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Изпраща го към потока <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">От гледна точка на потребителя, <code>say<\/code> просто отпечатва съдържанието на променлива в терминала и добавя нов ред.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Първата стъпка изисква някои обяснения.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>gist<\/code> е метод, който е дефиниран за всеки вграден тип данни, като цели числа или низове.<\/span> <span class=\"sg\" data-s=\"2\">За такива прости типове, резултатът е стойност, която е четима за хората и представлява елемента.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За по-сложни данни, като масиви или хешове, методът <code>gist<\/code> добавя малко форматиране.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рутината <code>say<\/code> може да бъде извикана както като функция, така и като метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да предадете повече от един аргумент на <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Изходните части се съединяват без интервали между тях.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"eo":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La enkonstruita rutino <code>say<\/code> faras la jenajn agojn:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vokas la metodon <code>gist<\/code> sur siaj argumentoj.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aldonas novlinian karakteron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertas la rezulton al UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendas ĝin al la fluo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El la perspektivo de la uzanto, <code>say<\/code> simple presas la enhavon de variablo al la terminalo kaj aldonas la novlinion.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La unua paŝo postulas iom da klarigo.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>gist<\/code> estas metodo kiu estas difinita por ĉiu enkonstruita datentipo, kiel ekzemple entjeroj aŭ ĉenoj.<\/span> <span class=\"sg\" data-s=\"2\">Por tiaj simplaj tipoj, la revena rezulto estas homlegebla valoro kiu reprezentas la objekton.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por pli kompleksaj datumoj, kiel ekzemple vektoroj aŭ asociaj tabeloj, la metodo <code>gist<\/code> aldonas iom da formatado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>say<\/code> povas esti vokita kiel funkcio aŭ metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas pasi pli ol unu argumenton al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La eliraj partoj estas kunigitaj sen spacoj inter ili.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"la":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Consuetudo <code>say<\/code> in-aedificata haec facit:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vocavit methodum <code>gist<\/code> in argumentis suis.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Addit novam lineam characterem.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convertit eventum ad UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Mittit ad <code>STDOUT<\/code> rivum.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ex prospectu usoris, <code>say<\/code> simpliciter imprimit contenta variabilis ad terminalem et addit novam lineam.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Primus gradus aliquas explicationes requirit.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>gist<\/code> est methodus quae definitur pro omni in-aedificato genere datae, ut integri vel chordae.<\/span> <span class=\"sg\" data-s=\"2\">Pro talibus generibus simplicibus, eventus reditus est valor humaniter legibilis qui item repraesentat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro data complexiora, ut ordines vel tabulae, methodus <code>gist<\/code> addit aliquam formam.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Consuetudo <code>say<\/code> potest vocari tam ut functio quam ut methodus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Potes plus quam unum argumentum praebere ad <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eventus partes iunguntur sine spatiis inter eas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]}}}</script>
