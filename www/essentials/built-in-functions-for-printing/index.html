<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing","n":309,"k":"section","pv":"essentials/more-on-functions/exercises/factorial-with-multi-functions/solution","nx":"essentials/built-in-functions-for-printing/say","tr":["essentials"],"L":{"en":{"t":"Built-in functions for printing","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">To print data to the console (or, more strictly speaking, to the <code>STDOUT<\/code> stream), we used the built-in routine <code>say<\/code> a lot.<\/span> <span class=\"sg\" data-s=\"1\">There are a few more functions that print.<\/span> <span class=\"sg\" data-s=\"2\">We’ve briefly seen most of them in the <a href=\"/essentials/hello-world/\">examples of ‘Hello, World!’<\/a> already.<\/span> <span class=\"sg\" data-s=\"3\">In this section, more details are given.<\/span><\/p>"]]},"de":{"t":"Eingebaute Funktionen zum Drucken","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Um Daten auf die Konsole (oder, genauer gesagt, auf den <code>STDOUT<\/code>-Stream) zu drucken, haben wir oft die eingebaute Routine <code>say<\/code> verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt noch ein paar weitere Funktionen, die drucken.<\/span> <span class=\"sg\" data-s=\"2\">Die meisten von ihnen haben wir bereits kurz in den <a href=\"https://course.raku.org/de/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">Beispielen von ‚Hallo, Welt!‘<\/a> gesehen.<\/span> <span class=\"sg\" data-s=\"3\">In diesem Abschnitt werden mehr Details gegeben.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde functies voor het afdrukken","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Om gegevens naar de console te printen (of, strikter gezegd, naar de <code>STDOUT<\/code>-stroom), hebben we vaak de ingebouwde routine <code>say<\/code> gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn nog een paar andere functies die afdrukken.<\/span> <span class=\"sg\" data-s=\"2\">We hebben de meeste hiervan al kort gezien in de <a href=\"https://course.raku.org/nl/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">voorbeelden van ‘Hallo, Wereld!’<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">In deze sectie worden meer details gegeven.<\/span><\/p>"]]},"es":{"t":"Funciones integradas para imprimir","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Para imprimir datos en la consola (o, más estrictamente hablando, en el flujo <code>STDOUT<\/code>), usamos mucho la rutina incorporada <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hay algunas funciones más que imprimen.<\/span> <span class=\"sg\" data-s=\"2\">Ya hemos visto brevemente la mayoría de ellas en los <a href=\"https://course.raku.org/es/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">ejemplos de '¡Hola, Mundo!'<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">En esta sección, se dan más detalles.<\/span><\/p>"]]},"it":{"t":"Funzioni integrate per la stampa","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Per stampare dati sulla console (o, più precisamente, sul flusso <code>STDOUT<\/code>), abbiamo utilizzato molto la routine integrata <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono alcune altre funzioni che stampano.<\/span> <span class=\"sg\" data-s=\"2\">Abbiamo già visto brevemente la maggior parte di esse negli <a href=\"https://course.raku.org/it/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">esempi di 'Hello, World!'<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">In questa sezione, vengono forniti maggiori dettagli.<\/span><\/p>"]]},"lv":{"t":"Iebūvētās drukāšanas funkcijas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Lai izdrukātu datus konsolē (vai, precīzāk sakot, uz <code>STDOUT<\/code> plūsmas), mēs bieži izmantojām iebūvēto rutīnu <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ir vēl dažas funkcijas, kas drukā.<\/span> <span class=\"sg\" data-s=\"2\">Mēs īsumā redzējām lielāko daļu no tām <a href=\"https://course.raku.org/lv/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">piemēros ar ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Šajā sadaļā tiek sniegta sīkāka informācija.<\/span><\/p>"]]},"ru":{"t":"Встроенные функции для вывода","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Чтобы вывести данные на консоль (или, точнее говоря, в поток <code>STDOUT<\/code>), мы часто использовали встроенную процедуру <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Существует еще несколько функций, которые выполняют печать.<\/span> <span class=\"sg\" data-s=\"2\">Мы уже кратко рассмотрели большинство из них в <a href=\"https://course.raku.org/ru/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">примерах ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">В этом разделе приводятся более подробные сведения.<\/span><\/p>"]]},"uk":{"t":"Вбудовані функції для друку","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Щоб вивести дані на консоль (або, точніше кажучи, в потік <code>STDOUT<\/code>), ми часто використовували вбудовану процедуру <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Існує ще кілька функцій для друку.<\/span> <span class=\"sg\" data-s=\"2\">Ми коротко розглядали більшість з них у <a href=\"https://course.raku.org/uk/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">прикладах «Привіт, Світ!»<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">У цьому розділі наведено більше деталей.<\/span><\/p>"]]},"bg":{"t":"Вградени функции за принтиране","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">За да отпечатаме данни на конзолата (или, по-точно казано, на потока <code>STDOUT<\/code>), често използвахме вградената рутина <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Има още няколко функции, които отпечатват.<\/span> <span class=\"sg\" data-s=\"2\">Вече видяхме повечето от тях накратко в <a href=\"https://course.raku.org/bg/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">примерите за ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">В този раздел ще предоставим повече подробности.<\/span><\/p>"]]},"eo":{"t":"Enkonstruataj funkcioj por presado","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Por presi datumojn al la konzolo (aŭ, pli strikte dirite, al la <code>STDOUT<\/code> fluo), ni ofte uzis la enkonstruitan rutinon <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Estas kelkaj pli da funkcioj kiuj presas.<\/span> <span class=\"sg\" data-s=\"2\">Ni jam mallonge vidis plejparton de ili en la <a href=\"https://course.raku.org/eo/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">ekzemploj de ‘Saluton, Mondo!’<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">En ĉi tiu sekcio, pli da detaloj estas donitaj.<\/span><\/p>"]]},"la":{"t":"In aedificavit functiones ad print","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ad imprimendum data ad consolam (vel, strictius loquendo, ad <code>STDOUT<\/code> rivum), multum usi sumus munere aedificato <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sunt paucae plures functiones quae imprimunt.<\/span> <span class=\"sg\" data-s=\"2\">Breviter vidimus plerasque earum in <a href=\"https://course.raku.org/la/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">exemplis ‘Salve, Mundi!’<\/a> iam.<\/span> <span class=\"sg\" data-s=\"3\">In hac sectione, plura singula dantur.<\/span><\/p>"]]}}}</script>
