<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing/put","n":312,"k":"topic","pv":"essentials/built-in-functions-for-printing/print","nx":"essentials/built-in-functions-for-printing/note","tr":["essentials","essentials/built-in-functions-for-printing"],"L":{"en":{"t":"The put routine","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">By default, the <code>put<\/code> routine does the same job as <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> but adds a newline at the end:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Converts its arguments to a string by calling the <code>Str<\/code> method on them.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Adds a newline character.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Sends it to the <code>STDOUT<\/code> stream.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A few examples:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The outputs of the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## A newline of <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The actual characters that are added after the output are taken from the <code>nl-out<\/code> method of the output stream.<\/span> <span class=\"sg\" data-s=\"1\">Its default value is <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"de":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig führt die <code>put<\/code>-Routine dieselbe Aufgabe wie <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> aus, fügt jedoch am Ende eine neue Zeile hinzu:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Konvertiert ihre Argumente in einen String, indem sie die <code>Str<\/code>-Methode aufruft.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Fügt ein neues Zeilenzeichen hinzu.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Sendet es an den <code>STDOUT<\/code>-Stream.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige Beispiele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausgaben des Programms:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Eine neue Zeile von <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die tatsächlichen Zeichen, die nach der Ausgabe hinzugefügt werden, stammen aus der <code>nl-out<\/code>-Methode des Ausgabestreams.<\/span> <span class=\"sg\" data-s=\"1\">Der Standardwert ist <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"nl":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Standaard doet de <code>put<\/code> routine hetzelfde als <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> maar voegt een nieuwe regel toe aan het einde:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Converteert zijn argumenten naar een string door de <code>Str<\/code> methode op hen aan te roepen.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Voegt een newline karakter toe.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Stuurt het naar de <code>STDOUT<\/code> stream.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Enkele voorbeelden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De uitvoer van het programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Een nieuwe regel van <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De daadwerkelijke karakters die na de uitvoer worden toegevoegd, worden gehaald uit de <code>nl-out<\/code> methode van de uitvoer stream.<\/span> <span class=\"sg\" data-s=\"1\">De standaardwaarde is <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"es":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Por defecto, la rutina <code>put<\/code> realiza la misma función que <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> pero añade una nueva línea al final:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Convierte sus argumentos a una cadena llamando al método <code>Str<\/code> en ellos.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Añade un carácter de nueva línea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Lo envía al flujo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos ejemplos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las salidas del programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Una nueva línea de <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los caracteres reales que se añaden después de la salida se toman del método <code>nl-out<\/code> del flujo de salida.<\/span> <span class=\"sg\" data-s=\"1\">Su valor predeterminado es <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"it":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Per impostazione predefinita, la routine <code>put<\/code> svolge lo stesso lavoro di <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> ma aggiunge una nuova linea alla fine:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Converte i suoi argomenti in una stringa chiamando il metodo <code>Str<\/code> su di essi.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aggiunge un carattere di nuova linea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Lo invia al flusso <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcuni esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli output del programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Una nuova linea di <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I caratteri effettivi che vengono aggiunti dopo l'output sono presi dal metodo <code>nl-out<\/code> del flusso di output.<\/span> <span class=\"sg\" data-s=\"1\">Il suo valore predefinito è <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"lv":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma, <code>put<\/code> rutīna veic to pašu darbu kā <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a>, bet pievieno jaunu rindu beigās:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Pārvērš savus argumentus par virkni, izsaucot <code>Str<\/code> metodi uz tiem.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Pievieno jaunas rindas rakstzīmi.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Nosūta to uz <code>STDOUT<\/code> plūsmu.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži piemēri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmas izvadi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Jauna rinda <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Patiesās rakstzīmes, kas tiek pievienotas pēc izvades, tiek ņemtas no izvades plūsmas <code>nl-out<\/code> metodes.<\/span> <span class=\"sg\" data-s=\"1\">Tās noklusējuma vērtība ir <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"ru":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">По умолчанию процедура <code>put<\/code> выполняет ту же работу, что и <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a>, но добавляет символ новой строки в конце:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Преобразует свои аргументы в строку, вызывая метод <code>Str<\/code> на них.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавляет символ новой строки.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Отправляет это в поток <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Несколько примеров:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вывод программы:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Новая строка в <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Фактические символы, которые добавляются после вывода, берутся из метода <code>nl-out<\/code> выходного потока.<\/span> <span class=\"sg\" data-s=\"1\">Его значение по умолчанию — <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"uk":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням, процедура <code>put<\/code> виконує ту ж роботу, що й <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a>, але додає символ нового рядка в кінці:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Перетворює свої аргументи на рядок, викликаючи метод <code>Str<\/code> на них.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Додає символ нового рядка.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Відправляє його до потоку <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кілька прикладів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вивід програми:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Новий рядок у <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Фактичні символи, які додаються після виводу, беруться з методу <code>nl-out<\/code> вихідного потоку.<\/span> <span class=\"sg\" data-s=\"1\">Його значення за замовчуванням — <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"bg":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">По подразбиране рутината <code>put<\/code> върши същата работа като <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a>, но добавя нов ред накрая:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Преобразува аргументите си в низ, като извиква метода <code>Str<\/code> върху тях.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавя символ за нов ред.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Изпраща го към потока <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Няколко примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изходът на програмата:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Нов ред на <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Реалните символи, които се добавят след изхода, се вземат от метода <code>nl-out<\/code> на изходния поток.<\/span> <span class=\"sg\" data-s=\"1\">Неговата стойност по подразбиране е <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"eo":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, la rutino <code>put<\/code> faras la saman laboron kiel <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> sed aldonas novan linion ĉe la fino:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Konvertas siajn argumentojn al ĉeno per vokado de la metodo <code>Str<\/code> sur ili.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aldonas novan linio-karakteron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Sendas ĝin al la fluo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj ekzemploj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmy @array = 3, 4, 5;\nput @array;\n\nmy %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La eligoj de la programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Nova linio de <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La faktaj karakteroj, kiuj estas aldonitaj post la eligo, estas prenitaj de la metodo <code>nl-out<\/code> de la eliga fluo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia defaŭlta valoro estas <code>\\n<\/code>. %%/tipblock<\/span><\/p>"]]},"la":{"t":"<code>put<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Per defaltam, <code>put<\/code> munus idem officium facit ac <a href=\"/essentials/built-in-functions-for-printing/print/\"><code>print<\/code><\/a> sed addit novam lineam in fine:<\/span><\/p>"],["list",3,"<ol><li><span class=\"sg\" data-s=\"0\">Convertit argumenta sua ad stringam vocando methodum <code>Str<\/code> in eis.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Addit characterem novae lineae.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Mittit ad <code>STDOUT<\/code> rivum.<\/span><\/li><\/ol>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pauca exempla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42.put;\nput 'Alpha', 'Beta';\n\nmeus @array = 3, 4, 5;\nput @array;\n\nmeus %hash = a =&gt; 'b', c =&gt; 'd';\n%hash.put;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exitus programmatis:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\nAlphaBeta\n3 4 5\na\tb\nc\td<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Nova linea <code>put<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Veri characteres q
