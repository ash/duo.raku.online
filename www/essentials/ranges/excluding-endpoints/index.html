<script type="application/json" id="page-data">{"u":"essentials/ranges/excluding-endpoints","n":110,"k":"topic","pv":"essentials/ranges","nx":"essentials/ranges/excluding-endpoints/quiz","tr":["essentials","essentials/ranges"],"L":{"en":{"t":"Excluding the endpoints of a range","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">To exclude one of the edges or both of them, modify the range creation operator with the <code>^<\/code> character.<\/span> <span class=\"sg\" data-s=\"1\">There are three more operators that can be constructed in such a way.<\/span> <span class=\"sg\" data-s=\"2\">The comments list the numbers that the ranges generate.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In simple cases as shown above, you can omit the spaces around the range operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For a range that starts with 0, such as <code>0..^5<\/code>, there exists a shortcut syntax: <code>^5<\/code>.<\/span><\/p>"]]},"de":{"t":"Endpunkte ausschließen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Um einen der Ränder oder beide auszuschließen, modifizieren Sie den Bereichserstellungsoperator mit dem <code>^<\/code>-Zeichen.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt drei weitere Operatoren, die auf diese Weise konstruiert werden können.<\/span> <span class=\"sg\" data-s=\"2\">Die Kommentare listen die Zahlen auf, die die Bereiche erzeugen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In einfachen Fällen wie oben gezeigt, können Sie die Leerzeichen um den Bereichsoperator weglassen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für einen Bereich, der mit 0 beginnt, wie <code>0..^5<\/code>, gibt es eine Kurzschreibweise: <code>^5<\/code>.<\/span><\/p>"]]},"nl":{"t":"Uitsluiting van eindpunten","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een van de randen of beide uit te sluiten, wijzig je de bereikoperator met het <code>^<\/code>-teken.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn drie extra operators die op deze manier kunnen worden geconstrueerd.<\/span> <span class=\"sg\" data-s=\"2\">De opmerkingen geven de getallen weer die de bereiken genereren.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In eenvoudige gevallen zoals hierboven getoond, kun je de spaties rond de bereikoperator weglaten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een bereik dat begint met 0, zoals <code>0..^5<\/code>, bestaat er een verkorte syntaxis: <code>^5<\/code>.<\/span><\/p>"]]},"es":{"t":"Excluir extremos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Para excluir uno de los extremos o ambos, modifica el operador de creación de rango con el carácter <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hay tres operadores más que se pueden construir de esta manera.<\/span> <span class=\"sg\" data-s=\"2\">Los comentarios enumeran los números que generan los rangos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En casos simples como los mostrados arriba, puedes omitir los espacios alrededor del operador de rango:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un rango que comienza con 0, como <code>0..^5<\/code>, existe una sintaxis abreviada: <code>^5<\/code>.<\/span><\/p>"]]},"it":{"t":"Escludere gli endpoint","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per escludere uno dei bordi o entrambi, modifica l'operatore di creazione dell'intervallo con il carattere <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono altri tre operatori che possono essere costruiti in questo modo.<\/span> <span class=\"sg\" data-s=\"2\">I commenti elencano i numeri che gli intervalli generano.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In casi semplici come mostrato sopra, puoi omettere gli spazi intorno all'operatore di intervallo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un intervallo che inizia con 0, come <code>0..^5<\/code>, esiste una sintassi abbreviata: <code>^5<\/code>.<\/span><\/p>"]]},"lv":{"t":"Galapunktu izslēgšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai izslēgtu vienu no malām vai abas, modificējiet diapazona izveides operatoru ar <code>^<\/code> rakstzīmi.<\/span> <span class=\"sg\" data-s=\"1\">Ir vēl trīs operatori, kurus var izveidot šādā veidā.<\/span> <span class=\"sg\" data-s=\"2\">Komentāros ir uzskaitīti skaitļi, kurus diapazoni ģenerē.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršos gadījumos, kā parādīts iepriekš, varat izlaist atstarpes ap diapazona operatoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diapazonam, kas sākas ar 0, piemēram, <code>0..^5<\/code>, pastāv saīsināta sintakse: <code>^5<\/code>.<\/span><\/p>"]]},"ru":{"t":"Исключение концов интервала","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы исключить одну из границ или обе границы, используйте символ <code>^<\/code> вместе с оператором интервала.<\/span> <span class=\"sg\" data-s=\"1\">С помощью этого символа можно создать еще три оператора.<\/span> <span class=\"sg\" data-s=\"2\">В комментариях записан список значений, который производится каждым интервалом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В простых случаях, таких как выше, вы можете опустить использование пробелов вокруг оператора интервала:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для интервала, начинающегося с 0, такого как <code>0..^5<\/code>, есть сокращение: <code>^5<\/code>.<\/span><\/p>"]]},"uk":{"t":"Виключаючи кінцеві точки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб виключити один з країв або обидва, змініть оператор створення діапазону за допомогою символу <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Існує ще три оператори, які можна створити таким чином.<\/span> <span class=\"sg\" data-s=\"2\">Коментарі вказують числа, які генерують діапазони.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У простих випадках, як показано вище, можна опустити пробіли навколо оператора діапазону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для діапазону, який починається з 0, наприклад, <code>0..^5<\/code>, існує скорочений синтаксис: <code>^5<\/code>.<\/span><\/p>"]]},"bg":{"t":"Изключване на крайните точки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За да изключите един от краищата или и двата, модифицирайте оператора за създаване на диапазон с символа <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Има три други оператора, които могат да бъдат конструирани по този начин.<\/span> <span class=\"sg\" data-s=\"2\">Коментарите изброяват числата, които диапазоните генерират.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В прости случаи, както е показано по-горе, можете да пропуснете интервалите около оператора за диапазон:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За диапазон, който започва с 0, като <code>0..^5<\/code>, съществува съкратен синтаксис: <code>^5<\/code>.<\/span><\/p>"]]},"eo":{"t":"Ekskludante finojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por ekskludi unu el la randoj aŭ ambaŭ, modifu la intervalan krean operatoron per la <code>^<\/code> karaktero.<\/span> <span class=\"sg\" data-s=\"1\">Estas tri pliaj operatoroj, kiuj povas esti konstruitaj tiel.<\/span> <span class=\"sg\" data-s=\"2\">La komentoj listigas la nombrojn, kiujn la intervaloj generas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En simplaj kazoj kiel montrite supre, vi povas preterlasi la spacojn ĉirkaŭ la intervala operatoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por intervalo, kiu komenciĝas per 0, kiel <code>0..^5<\/code>, ekzistas mallongiga sintakso: <code>^5<\/code>.<\/span><\/p>"]]},"la":{"t":"Exclusis extremitatibus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut unum ex marginibus vel utrumque excludas, modifica operatorem creationis intervalli cum charactere <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tres alii operatorii sic construi possunt.<\/span> <span class=\"sg\" data-s=\"2\">Commentarii numeros enumerant quos intervalla generant.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In simplicibus casibus ut supra demonstratis, potes spatias circa operatorem intervalli omittere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro intervallo quod incipit cum 0, ut <code>0..^5<\/code>, syntaxin compendiariam habet: <code>^5<\/code>.<\/span><\/p>"]]}}}</script>
