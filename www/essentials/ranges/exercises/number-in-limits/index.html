<script type="application/json" id="page-data">{"u":"essentials/ranges/exercises/number-in-limits","n":115,"k":"exercise","pv":"essentials/ranges/exercises","nx":"essentials/ranges/exercises/number-in-limits/solution","tr":["essentials","essentials/ranges"],"L":{"en":{"t":"Exercise: If the number is within the limits","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Write a program that asks to enter three numbers: <code>$begin<\/code>, <code>$end<\/code>, and <code>$n<\/code> and prints <code>True<\/code> or <code>False<\/code> depending on whether <code>$n<\/code> is in the range <code>[$begin, $end)<\/code> (including <code>$begin<\/code> but excluding <code>$end<\/code>).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Please assume that the entered numbers satisfy the condition: <code>$begin &lt; $end + 1<\/code>, but do not add code to check it.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The possible output of the program for both cases is shown below:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku number-in-limits.raku\nFrom (including): 10\nTo (excluding): 20\nWhat is the number? 15\nTrue\n\n$ raku number-in-limits.raku\nFrom (including): 10\nTo (excluding): 20\nWhat is the number? 30\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/ranges/exercises/number-in-limits/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Wenn die Zahl innerhalb der Grenzen liegt","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie ein Programm, das dazu auffordert, drei Zahlen einzugeben: <code>$begin<\/code>, <code>$end<\/code> und <code>$n<\/code> und <code>True<\/code> oder <code>False<\/code> ausgibt, j
