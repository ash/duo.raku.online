азон, який створюється з чисел, введених користувачем.<\/span> <span class=\"sg\" data-s=\"1\">Потім перевірка smartmatch тестує, чи знаходиться третє число в межах діапазону.<\/span> <span class=\"sg\" data-s=\"2\">Результат тесту smartmatch є булевим значенням, тому ми можемо одразу його вивести.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось рішення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $begin = prompt 'Від (включно): ';\nmy $end = prompt 'До (виключно): ';\n\nmy $n = prompt 'Яке це число? ';\n\nsay $n ~~ $begin ..^ $end;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/ranges/number-in-limits.raku\" target=\"_blank\" rel=\"noopener\">number-in-limits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перевірте різні випадки, включаючи коли число збігається з кінцем діапазону.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/ranges/number-in-limits.raku\nВід (включно): 1\nДо (виключно): 2\nЯке це число? 1.5\nTrue\n\n$ raku exercises/ranges/number-in-limits.raku\nВід (включно): 100\nДо (виключно): 200\nЯке це число? 100\nTrue\n\n$ raku exercises/ranges/number-in-limits.raku\nВід (включно): -5\nДо (виключно): -2\nЯке це число? -2\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, як правий кінець діапазону виключається: <code>$begin ..^ $end<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Ако числото е в границите","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Програмата използва диапазон, който се създава от числата, въведени от потребителя.<\/span> <span class=\"sg\" data-s=\"1\">След това, проверката със smartmatch тества дали третото чи \"2\">La rezulto de la smartmatch-testo estas Boolea valoro, do ni povas tuj presi ĝin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $begin = prompt 'De (inkluzive): ';\nmy $end = prompt 'Ĝis (ekskluzive): ';\n\nmy $n = prompt 'Kio estas la nombro? ';\n\nsay $n ~~ $begin ..^ $end;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/ranges/number-in-limits.raku\" target=\"_blank\" rel=\"noopener\">number-in-limits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Testu malsamajn kazojn, inkluzive kiam la nombro koincidas kun la fino de la intervalo.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/ranges/number-in-limits.raku\nDe (inkluzive): 1\nĜis (ekskluzive): 2\nKio estas la nombro? 1.5\nVere\n\n$ raku exercises/ranges/number-in-limits.raku\nDe (inkluzive): 100\nĜis (ekskluzive): 200\nKio estas la nombro? 100\nVere\n\n$ raku exercises/ranges/number-in-limits.raku\nDe (inkluzive): -5\nĜis (ekskluzive): -2\nKio estas la nombro? -2\nFalse<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komento<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu kiel la dekstra fino de la intervalo estas ekskludita: <code>$begin ..^ $end<\/code>.<\/span><\/p>"]]},"la":{"t":"Solution: Si numerus intra limites est","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma utitur intervallo quod creatur ex numeris quos usor intrat.<\/span> <span class=\"sg\" data-s=\"1\">Deinde, probatio smartmatch examinat si tertius numerus intra fines intervalli est.<\/span> <span class=\"sg\" data-s=\"2\">Eventus probationis smartmatch est valor Booleanus, itaque statim imprimere possumus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $begin = prompt 'A (incluso): ';\nmy $end = prompt 'Ad (excluso): ';\n\nmy $n = prompt 'Quis est numerus? ';\n\nsay $n ~~ $begin ..^ $end;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni programma in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/ranges/number-in-limits.raku\" target=\"_blank\" rel=\"noopener\">number-in-limits.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Effectus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Proba varios casus, inclusis cum numerus coincidet cum fine intervalli.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/ranges/number-in-limits.raku\nA (incluso): 1\nAd (excluso): 2\nQuis est numerus? 1.5\nVerum\n\n$ raku exercises/ranges/number-in-limits.raku\nA (incluso): 100\nAd (excluso): 200\nQuis est numerus? 100\nVerum\n\n$ raku exercises/ranges/number-in-limits.raku\nA (incluso): -5\nAd (excluso): -2\nQuis est numerus? -2\nFalsum<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quomodo dextrum terminus intervalli excluditur: <code>$begin ..^ $end<\/code>.<\/span><\/p>"]]}}}</script>
