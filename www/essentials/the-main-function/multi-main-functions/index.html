p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo duobligas sian solan argumenton aŭ aldonas ĝin al la dua argumento se ĝi estas ĉeestanta:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"la":{"t":"Multiplicem <code>MAIN<\/code> functiones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sicut quaelibet alia functio in Raku, functio <code>MAIN<\/code> potest habere suas variantes <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc permittit programma ut singulariter respondeat ad diversum numerum vel diversos generum parametriorum input.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    dic 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    dic $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma duplicat suum unicum argumentum vel addit illud ad secundum argumentum si praesens est:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]}}}</script>
