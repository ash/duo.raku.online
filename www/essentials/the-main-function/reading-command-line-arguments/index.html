okaliseren, maar ook vanwege zijn argumenten, die de waarden krijgen die in de commandoregel worden doorgegeven.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee manieren om commandoregelargumenten te lezen.<\/span> <span class=\"sg\" data-s=\"1\">Een daarvan is via de <a href=\"https://course.raku.org/nl/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> array<\/a>, die we al hebben gebruikt.<\/span> <span class=\"sg\" data-s=\"2\">Laten we nu de tweede methode onderzoeken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beschouw een programma dat twee getallen optelt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt het programma op de volgende manier uitvoeren.<\/span> <span class=\"sg\" data-s=\"1\">Het programma drukt de som van zijn twee argumenten af:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als elke andere functie kan de <code>MAIN<\/code> functie standaardwaarden hebben voor sommige (of zelfs alle) van zijn argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als het tweede argument niet wordt opgegeven, wordt de standaardwaarde gebruikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"es":{"t":"Lectura de argumentos de línea de comandos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La función <code>MAIN<\/code> es útil no solo para localizar el inicio del programa explícitamente, sino también por sus argumentos, que obtienen los valores pasados en la línea de comandos.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay dos formas de leer los argumentos de la línea de comandos.<\/span> <span class=\"sg\" data-s=\"1\">Una de ellas es a través del <a href=\"https://course.raku.org/es/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\">arreglo <code>@*ARGS<\/code><\/a>, que ya hemos utilizado.<\/span> <span class=\"sg\" data-s=\"2\">Ahora examinemos el segundo método.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Considera un programa que suma dos números.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes ejecutar el programa de la siguiente manera.<\/span> <span class=\"sg\" data-s=\"1\">El programa imprime la suma de sus dos argumentos:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como cualquier otra función, la función <code>MAIN<\/code> puede tener valores predeterminados para algunos (o incluso todos) de sus argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si no se proporciona el segundo argumento, se utiliza el valor predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"it":{"t":"Lettura degli argomenti della riga di comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>MAIN<\/code> è utile non solo per individuare esplicitamente l'inizio del programma, ma anche per i suoi argomenti, che ricevono i valori passati nella riga di comando.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ci sono due modi per leggere gli argomenti della riga di comando.<\/span> <span class=\"sg\" data-s=\"1\">Uno di questi è tramite l'array <a href=\"https://course.raku.org/it/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code><\/a>, che abbiamo già utilizzato.<\/span> <span class=\"sg\" data-s=\"2\">Esaminiamo ora il secondo metodo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Consideriamo un programma che somma due numeri.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi eseguire il programma nel seguente modo.<\/span> <span class=\"sg\" data-s=\"1\">Il programma stampa la somma dei suoi due argomenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come qualsiasi altra funzione, la funzione <code>MAIN<\/code> può avere valori predefiniti per alcuni (o anche tutti) dei suoi argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se il secondo argomento non viene fornito, viene utilizzato il valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"lv":{"t":"Komandrindas argumentu lasīšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>MAIN<\/code> ir noderīga ne tikai tāpēc, ka tā skaidri norāda programmas sākumu, bet arī tās argumentu dēļ, kas saņem komandrindā nodotās vērtības.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir divi veidi, kā lasīt komandrindas argumentus.<\/span> <span class=\"sg\" data-s=\"1\">Viens no tiem ir caur <a href=\"https://course.raku.org/lv/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> masīvu<\/a>, kuru mēs jau izmantojām.<\/span> <span class=\"sg\" data-s=\"2\">Tagad aplūkosim otro metodi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apsveriet programmu, kas saskaita divus skaitļus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat palaist programmu šādā veidā.<\/span> <span class=\"sg\" data-s=\"1\">Programma izdrukā savu divu argumentu summu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā jebkurai citai funkcijai, <code>MAIN<\/code> funkcijai var būt noklusējuma vērtības dažiem (vai pat visiem) tās argumentiem.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja otrais arguments nav norādīts, tiek izmantota noklusējuma vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"ru":{"t":"Чтение аргументов командной строки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Функция <code>MAIN<\/code> полезна не только для явного указания начала программы, но и благодаря своим аргументам, которые получают значения, переданные в командной строке.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Существует два способа чтения аргументов командной строки.<\/span> <span class=\"sg\" data-s=\"1\">Один из них — через массив <a href=\"https://course.raku.org/ru/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code><\/a>, который мы уже использовали.<\/span> <span class=\"sg\" data-s=\"2\">Давайте теперь рассмотрим второй метод.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рассмотрим программу, которая складывает два числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете запустить программу следующим образом.<\/span> <span class=\"sg\" data-s=\"1\">Программа выведет сумму двух своих аргументов:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и любая другая функция, функция <code>MAIN<\/code> может иметь значения по умолчанию для некоторых (или даже всех) своих аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если второй аргумент не предоставлен, используется значение по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"uk":{"t":"Читання аргументів командного рядка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Функція <code>MAIN<\/code> корисна не тільки для того, щоб явно визначити початок програми, але й завдяки своїм аргументам, які отримують значення, передані в командному рядку.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Існує два способи читання аргументів командного рядка.<\/span> <span class=\"sg\" data-s=\"1\">Один із них — через <a href=\"https://course.raku.org/uk/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\">масив <code>@*ARGS<\/code><\/a>, який ми вже використовували.<\/span> <span class=\"sg\" data-s=\"2\">Давайте розглянемо другий метод.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Розглянемо програму, яка додає два числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете запустити програму наступним чином.<\/span> <span class=\"sg\" data-s=\"1\">Програма виведе суму своїх двох аргументів:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і будь-яка інша функція, функція <code>MAIN<\/code> може мати значення за замовчуванням для деяких (або навіть усіх) своїх аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо другий аргумент не надано, використовується значення за замовчуванням:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"bg":{"t":"Четене на аргументите на командния ред","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>MAIN<\/code> е полезна не само за да се определи началото на програмата изрично, но и заради нейните аргументи, които получават стойностите, предадени в командния ред.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има два начина за четене на аргументи от командния ред.<\/span> <span class=\"sg\" data-s=\"1\">Един от тях е чрез масива <a href=\"https://course.raku.org/bg/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code><\/a>, който вече използвахме.<\/span> <span class=\"sg\" data-s=\"2\">Нека сега разгледаме втория метод.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте програма, която събира две числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да стартирате програмата по следния начин.<\/span> <span class=\"sg\" data-s=\"1\">Програмата отпечатва сумата на двата си аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както всяка друга функция, функцията <code>MAIN<\/code> може да има стойности по подразбиране за някои (или дори за всички) от своите аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако вторият аргумент не е предоставен, се използва стойността по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"eo":{"t":"Legante komando-linio argumentojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>MAIN<\/code> estas utila ne nur por eksplicite trovi la komencon de la programo, sed ankaŭ pro siaj argumentoj, kiuj ricevas la valorojn pasitajn en la komando-linio.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas du manieroj legi komando-liniajn argumentojn.<\/span> <span class=\"sg\" data-s=\"1\">Unu el ili estas per la <a href=\"https://course.raku.org/eo/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> tabelo<\/a>, kiun ni jam uzis.<\/span> <span class=\"sg\" data-s=\"2\">Ni nun ekzamenos la duan metodon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konsideru programon, kiu adicias du nombrojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas ruli la programon en la sekva maniero.<\/span> <span class=\"sg\" data-s=\"1\">La programo presas la sumon de siaj du argumentoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel ĉiu alia funkcio, la funkcio <code>MAIN<\/code> povas havi defaŭltajn valorojn por kelkaj (aŭ eĉ ĉiuj) el siaj argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la dua argumento ne estas provizita, la defaŭlta valoro estas uzata:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$
