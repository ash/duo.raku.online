<script type="application/json" id="page-data">{"u":"essentials/the-main-function/using-unit-sub","n":325,"k":"topic","pv":"essentials/the-main-function/multi-main-functions/quiz","nx":"essentials/the-main-function/using-unit-sub/quiz","tr":["essentials","essentials/the-main-function"],"L":{"en":{"t":"Using unit sub","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>unit sub<\/code> construct is a handy way to make the rest of the file the body of the function!<\/span> <span class=\"sg\" data-s=\"1\">When used with <code>MAIN<\/code>, it allows getting rid of the curly braces that embrace virtually the whole file, as well as of unnecessary indentation.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The usage of <code>unit sub<\/code> is demonstrated in the following example of a program.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"The sum of $a and $b is $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>MAIN<\/code> function is the only function in this file.<\/span> <span class=\"sg\" data-s=\"1\">If this is the case for your program too, consider using <code>unit sub MAIN<\/code> as shown above.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Konstrukt <code>unit sub<\/code> ist eine praktische Möglichkeit, den Rest der Datei zum Körper der Funktion zu machen!<\/span> <span class=\"sg\" data-s=\"1\">Wenn es mit <code>MAIN<\/code> verwendet wird, ermöglicht es, die geschweiften Klammern, die praktisch die gesamte Datei umschließen, sowie unnötige Einrückungen loszuwerden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Verwendung von <code>unit sub<\/code> wird im folgenden Beispiel eines Programms demonstriert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Die Summe von $a und $b ist $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die <code>MAIN<\/code>-Funktion ist die einzige Funktion in dieser Datei.<\/span> <span class=\"sg\" data-s=\"1\">Wenn dies auch für Ihr Programm der Fall ist, sollten Sie die Verwendung von <code>unit sub MAIN<\/code> wie oben gezeigt in Betracht ziehen.<\/span><\/p>"]]},"nl":{"t":"Gebruik van <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>unit sub<\/code> constructie is een handige manier om de rest van het bestand het lichaam van de functie te maken!<\/span> <span class=\"sg\" data-s=\"1\">Wanneer gebruikt met <code>MAIN<\/code>, maakt het het mogelijk om af te komen van de accolades die vrijwel het hele bestand omarmen, evenals van onnodige inspringing.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het gebruik van <code>unit sub<\/code> wordt gedemonstreerd in het volgende voorbeeld van een programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"De som van $a en $b is $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>MAIN<\/code> functie is de enige functie in dit bestand.<\/span> <span class=\"sg\" data-s=\"1\">Als dit ook het geval is voor jouw programma, overweeg dan om <code>unit sub MAIN<\/code> te gebruiken zoals hierboven getoond.<\/span><\/p>"]]},"es":{"t":"Uso de <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">¡La construcción <code>unit sub<\/code> es una forma práctica de hacer que el resto del archivo sea el cuerpo de la función!<\/span> <span class=\"sg\" data-s=\"1\">Cuando se usa con <code>MAIN<\/code>, permite deshacerse de las llaves que abarcan prácticamente todo el archivo, así como de la indentación innecesaria.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El uso de <code>unit sub<\/code> se demuestra en el siguiente ejemplo de un programa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La suma de $a y $b es $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La función <code>MAIN<\/code> es la única función en este archivo.<\/span> <span class=\"sg\" data-s=\"1\">Si este es también el caso de tu programa, considera usar <code>unit sub MAIN<\/code> como se muestra arriba.<\/span><\/p>"]]},"it":{"t":"Uso di <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il costrutto <code>unit sub<\/code> è un modo pratico per rendere il resto del file il corpo della funzione!<\/span> <span class=\"sg\" data-s=\"1\">Quando viene usato con <code>MAIN<\/code>, permette di eliminare le parentesi graffe che abbracciano praticamente tutto il file, così come l'indentazione non necessaria.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'uso di <code>unit sub<\/code> è dimostrato nel seguente esempio di un programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La somma di $a e $b è $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>MAIN<\/code> è l'unica funzione in questo file.<\/span> <span class=\"sg\" data-s=\"1\">Se questo è anche il caso del tuo programma, considera di usare <code>unit sub MAIN<\/code> come mostrato sopra.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>unit sub<\/code> konstrukcija ir ērts veids, kā padarīt pārējo failu par funkcijas ķermeni!<\/span> <span class=\"sg\" data-s=\"1\">Lietojot kopā ar <code>MAIN<\/code>, tā ļauj atbrīvoties no figūriekavām, kas aptver gandrīz visu failu, kā arī no nevajadzīgas atkāpes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>unit sub<\/code> izmantošana ir parādīta šādā programmas piemērā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Summa no $a un $b ir $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> funkcija ir vienīgā funkcija šajā failā.<\/span> <span class=\"sg\" data-s=\"1\">Ja tas ir arī jūsu programmas gadījumā, apsveriet iespēju izmantot <code>unit sub MAIN<\/code>, kā parādīts iepriekš.<\/span><\/p>"]]},"ru":{"t":"Использование <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Конструкция <code>unit sub<\/code> — это удобный способ сделать остальную часть файла телом функции!<\/span> <span class=\"sg\" data-s=\"1\">При использовании с <code>MAIN<\/code>, она позволяет избавиться от фигурных скобок, охватывающих практически весь файл, а также от ненужных отступов.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Использование <code>unit sub<\/code> демонстрируется в следующем примере программы.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сумма $a и $b равна $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функция <code>MAIN<\/code> является единственной функцией в этом файле.<\/span> <span class=\"sg\" data-s=\"1\">Если это также относится к вашей программе, рассмотрите возможность использования <code>unit sub MAIN<\/code>, как показано выше.<\/span><\/p>"]]},"uk":{"t":"Використання <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Конструкція <code>unit sub<\/code> є зручним способом зробити решту файлу тілом функції!<\/span> <span class=\"sg\" data-s=\"1\">Коли використовується з <code>MAIN<\/code>, це дозволяє позбутися фігурних дужок, які охоплюють практично весь файл, а також непотрібних відступів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Використання <code>unit sub<\/code> демонструється в наступному прикладі програми.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сума $a та $b дорівнює $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функція <code>MAIN<\/code> є єдиною функцією в цьому файлі.<\/span> <span class=\"sg\" data-s=\"1\">Якщо це також стосується вашої програми, розгляньте можливість використання <code>unit sub MAIN<\/code>, як показано вище.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Конструктът <code>unit sub<\/code> е удобен начин да направите останалата част от файла тяло на функцията!<\/span> <span class=\"sg\" data-s=\"1\">Когато се използва с <code>MAIN<\/code>, той позволява да се отървете от къдравите скоби, които обхващат почти целия файл, както и от ненужното отстъпване.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Използването на <code>unit sub<\/code> е демонстрирано в следния пример на програма.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сумата на $a и $b е $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>MAIN<\/code> е единствената функция в този файл.<\/span> <span class=\"sg\" data-s=\"1\">Ако това е случаят и за вашата програма, обмислете използването на <code>unit sub MAIN<\/code>, както е показано по-горе.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>unit sub<\/code> konstruo estas oportuna maniero fari la reston de la dosiero la korpo de la funkcio!<\/span> <span class=\"sg\" data-s=\"1\">Kiam uzata kun <code>MAIN<\/code>, ĝi permesas forigi la krampojn kiuj ĉirkaŭas preskaŭ la tutan dosieron, same kiel nenecesan enmeton.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La uzo de <code>unit sub<\/code> estas montrita en la sekva ekzemplo de programo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La sumo de $a kaj $b estas $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>MAIN<\/code> funkcio estas la sola funkcio en ĉi tiu dosiero.<\/span> <span class=\"sg\" data-s=\"1\">Se ĉi tio estas la kazo por via programo ankaŭ, konsideru uzi <code>unit sub MAIN<\/code> kiel montrite supre.<\/span><\/p>"]]},"la":{"t":"Utendo <code>unit sub<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Constructum <code>unit sub<\/code> est utilis modus ut reliqua pars fasciculi corpus functionis fiat!<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>MAIN<\/code> adhibetur, sinit tollere curvatas clausuras quae fere totum fasciculum amplectuntur, necnon supervacaneam indentationem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usus <code>unit sub<\/code> demonstratur in sequenti exemplo programmatis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"The sum of $a and $b is $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Functio <code>MAIN<\/code> sola functio in hoc fasciculo est.<\/span> <span class=\"sg\" data-s=\"1\">Si hoc etiam in programmate tuo verum est, considera utendo <code>unit sub MAIN<\/code> sicut supra demonstratum est.<\/span><\/p>"]]}}}</script>
