 'rectangle';\n    say \"Периметр $shape равен $perimeter.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Найдите программу в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/the-main-function/perimeter.raku\" target=\"_blank\" rel=\"noopener\">perimeter.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Попробуйте разные входные значения, чтобы протестировать как квадраты, так и прямоугольники.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 1    \nПериметр квадрата равен 4.\n\n$ raku exercises/the-main-function/perimeter.raku 1 2\nПериметр прямоугольника равен 6.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что существует третий случай, который также следует протестировать.<\/span> <span class=\"sg\" data-s=\"1\">Если переданы два равных числа, программа должна понять, что это был квадрат:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 2 2\nПериметр квадрата равен 8.<\/code><\/pre>"]]},"uk":{"t":"Solution: Периметр прямокутника","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ця програма повинна мати можливість приймати один або два аргументи командного рядка.<\/span> <span class=\"sg\" data-s=\"1\">У цьому рішенні показано новий трюк.<\/span> <span class=\"sg\" data-s=\"2\">Значення за замовчуванням для другої змінної встановлюється на значення першої змінної: <code>sub MAIN($a, $b = $a)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Отже, замість створення двох мультифункцій, ми маємо загальну функцію, яка встановлює розмір другої сторони, якщо фігура є квадратом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось розв'язок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = $a) {\n    my $perimeter = 2 * ($a + $b);\n\n    my $shape = $a == $b ?? 'square' !! 'rectangle';\n    say \"The perimeter of a $shape is $perimeter.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/the-main-function/perimeter.raku\" target=\"_blank\" rel=\"noopener\">perimeter.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Спробуйте різні вхідні значення, щоб перевірити як квадрати, так і прямокутники.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 1    \nThe perimeter of a square is 4.\n\n$ raku exercises/the-main-function/perimeter.raku 1 2\nThe perimeter of a rectangle is 6.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що існує третій випадок, який також слід протестувати.<\/span> <span class=\"sg\" data-s=\"1\">Якщо передаються два однакові числа, програма повинна все одно розуміти, що це був квадрат:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 2 2\nThe perimeter of a square is 8.<\/code><\/pre>"]]},"bg":{"t":"Solution: Периметър на правоъгълник","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Тази програма трябва да може да приема или един, или два аргумента от командния ред.<\/span> <span class=\"sg\" data-s=\"1\">В решението тук е показан нов трик.<\/span> <span class=\"sg\" data-s=\"2\">Стойността по подразбиране на втората променлива е зададена на стойността на първата променлива: <code>sub MAIN($a, $b = $a)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Така, вместо да създаваме две мулти-функции, имаме обща функция, която задава размера на втората страна, ако фигурата е квадрат.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето решението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = $a) {\n    my $perimeter = 2 * ($a + $b);\n\n    my $shape = $a == $b ?? 'square' !! 'rectangle';\n    say \"The perimeter of a $shape is $perimeter.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/the-main-function/perimeter.raku\" target=\"_blank\" rel=\"noopener\">perimeter.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опитайте различни входни стойности, за да тествате както квадрати, така и правоъгълници.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 1    \nThe perimeter of a square is 4.\n\n$ raku exercises/the-main-function/perimeter.raku 1 2\nThe perimeter of a rectangle is 6.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че има и трети случай, който също трябва да бъде тестван.<\/span> <span class=\"sg\" data-s=\"1\">Ако се подадат две равни числа, програмата трябва все пак да разбере, че това е квадрат:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 2 2\nThe perimeter of a square is 8.<\/code><\/pre>"]]},"eo":{"t":"Solvo: Perimetro de rektangulo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo devas povi preni aŭ unu aŭ du komandliniajn argumentojn.<\/span> <span class=\"sg\" data-s=\"1\">Nova truko estas montrita en la solvo ĉi tie.<\/span> <span class=\"sg\" data-s=\"2\">La defaŭlta valoro de la dua variablo estas agordita al la valoro de la unua variablo: <code>sub MAIN($a, $b = $a)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do, anstataŭ krei du multfunkciojn, ni havas ĝeneralan funkcion kiu agordas la grandecon de la dua flanko se la figuro estas kvadrato.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = $a) {\n    my $perimetro = 2 * ($a + $b);\n\n    my $figuro = $a == $b ?? 'kvadrato' !! 'rektangulo';\n    say \"La perimetro de $figuro estas $perimetro.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/the-main-function/perimeter.raku\" target=\"_blank\" rel=\"noopener\">perimeter.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Provu malsamajn enirvalorojn por testi ambaŭ kvadratojn kaj rektangulojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 1    \nLa perimetro de kvadrato estas 4.\n\n$ raku exercises/the-main-function/perimeter.raku 1 2\nLa perimetro de rektangulo estas 6.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu ke ekzistas la tria kazo kiu ankaŭ devus esti testita.<\/span> <span class=\"sg\" data-s=\"1\">Se du egalaj nombroj estas pasitaj, la programo ankoraŭ devus kompreni ke ĉi tio estis kvadrato:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 2 2\nLa perimetro de kvadrato estas 8.<\/code><\/pre>"]]},"la":{"t":"Solutio: Perimetri rectanguli","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic programma potest accipere vel unum vel duo argumenta ex linea mandati.<\/span> <span class=\"sg\" data-s=\"1\">Novum artificium hic in solutione ostenditur.<\/span> <span class=\"sg\" data-s=\"2\">Valor praedefinitus secundi variabilis ponitur ad valorem primi variabilis: <code>sub MAIN($a, $b = $a)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ita, pro creandis duabus functionibus multiplicibus, habemus functionem generalem quae secundam lateris magnitudinem ponit si figura est quadratum.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = $a) {\n    my $perimeter = 2 * ($a + $b);\n\n    my $shape = $a == $b ?? 'quadratum' !! 'rectangulum';\n    say \"Perimeter $shape est $perimeter.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/the-main-function/perimeter.raku\" target=\"_blank\" rel=\"noopener\">perimeter.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tenta diversos valores inputorum ad probandum tam quadrata quam rectangula.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 1    \nPerimeter quadrati est 4.\n\n$ raku exercises/the-main-function/perimeter.raku 1 2\nPerimeter rectanguli est 6.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod est tertium casus qui etiam probandus est.<\/span> <span class=\"sg\" data-s=\"1\">Si duo aequalia numeri transeunt, programma adhuc intellegere debet quod hoc erat quadratum:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/the-main-function/perimeter.raku 2 2\nPerimeter quadrati est 8.<\/code><\/pre>"]]}}}</script>
