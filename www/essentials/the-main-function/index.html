<script type="application/json" id="page-data">{"u":"essentials/the-main-function","n":319,"k":"section","pv":"essentials/built-in-functions-for-printing/exercises/print-the-warning/solution","nx":"essentials/the-main-function/reading-command-line-arguments","tr":["essentials"],"L":{"en":{"t":"The MAIN function","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A Raku program does not need any boilerplate ritual, so you can immediately start writing useful instructions.<\/span> <span class=\"sg\" data-s=\"1\">This part of the program, which is located on the level above any <a href=\"/essentials/code-blocks/\">code block<\/a> (including <a href=\"/essentials/functions/\">functions<\/a>, for example), is called <em>mainline<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the program contains a function with the special name <code>MAIN<\/code>, Raku executes this function after it compiles everything and after the mainline code has been executed.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program first executes the top-level <code>say<\/code>s, and then calls <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of course, it is also possible to have a program with the <code>MAIN<\/code> function and no other mainline code.<\/span><\/p>"]]},"de":{"t":"Die <code>MAIN<\/code>-Funktion","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Raku-Programm benötigt keine Boilerplate-Rituale, sodass Sie sofort nützliche Anweisungen schreiben können.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Teil des Programms, der sich auf der Ebene über jedem <a href=\"https://course.raku.org/de/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">Codeblock<\/a> (einschließlich <a href=\"https://course.raku.org/de/essentials/functions/\" target=\"_blank\" rel=\"noopener\">Funktionen<\/a>, zum Beispiel) befindet, wird <em>mainline<\/em> genannt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn das Programm eine Funktion mit dem speziellen Namen <code>MAIN<\/code> enthält, führt Raku diese Funktion aus, nachdem es alles kompiliert und nachdem der mainline-Code ausgeführt wurde.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline-Code';\n\nsub MAIN {\n    say '3. MAIN aufgerufen';\n}\n\nsay '2. Auch mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm führt zuerst die <code>say<\/code>s auf der obersten Ebene aus und ruft dann <code>MAIN<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline-Code\n2. Auch mainline\n3. MAIN aufgerufen<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natürlich ist es auch möglich, ein Programm mit der <code>MAIN<\/code>-Funktion und keinem anderen mainline-Code zu haben.<\/span><\/p>"]]},"nl":{"t":"De <code>MAIN<\/code> functie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een Raku-programma heeft geen boilerplate-ritueel nodig, dus je kunt meteen beginnen met het schrijven van nuttige instructies.<\/span> <span class=\"sg\" data-s=\"1\">Dit deel van het programma, dat zich bevindt op het niveau boven elk <a href=\"https://course.raku.org/nl/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">codeblok<\/a> (inclusief <a href=\"https://course.raku.org/nl/essentials/functions/\" target=\"_blank\" rel=\"noopener\">functies<\/a>, bijvoorbeeld), wordt <em>mainline<\/em> genoemd.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als het programma een functie bevat met de speciale naam <code>MAIN<\/code>, voert Raku deze functie uit nadat het alles heeft gecompileerd en nadat de mainline-code is uitgevoerd.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma voert eerst de top-level <code>say<\/code>s uit en roept daarna <code>MAIN<\/code> aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natuurlijk is het ook mogelijk om een programma te hebben met de <code>MAIN<\/code> functie en geen andere mainline-code.<\/span><\/p>"]]},"es":{"t":"La función <code>MAIN<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un programa en Raku no necesita ningún ritual de código plantilla, por lo que puedes comenzar a escribir instrucciones útiles de inmediato.<\/span> <span class=\"sg\" data-s=\"1\">Esta parte del programa, que se encuentra en el nivel superior a cualquier <a href=\"https://course.raku.org/es/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">bloque de código<\/a> (incluyendo <a href=\"https://course.raku.org/es/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funciones<\/a>, por ejemplo), se llama <em>mainline<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si el programa contiene una función con el nombre especial <code>MAIN<\/code>, Raku ejecuta esta función después de compilar todo y después de que el código mainline haya sido ejecutado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Código mainline';\n\nsub MAIN {\n    say '3. MAIN llamado';\n}\n\nsay '2. También mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa primero ejecuta los <code>say<\/code> de nivel superior, y luego llama a <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Código mainline\n2. También mainline\n3. MAIN llamado<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por supuesto, también es posible tener un programa con la función <code>MAIN<\/code> y sin otro código mainline.<\/span><\/p>"]]},"it":{"t":"La funzione <code>MAIN<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un programma Raku non necessita di alcun rituale di boilerplate, quindi puoi iniziare immediatamente a scrivere istruzioni utili.<\/span> <span class=\"sg\" data-s=\"1\">Questa parte del programma, che si trova al livello superiore rispetto a qualsiasi <a href=\"https://course.raku.org/it/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">blocco di codice<\/a> (inclusi, ad esempio, le <a href=\"https://course.raku.org/it/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funzioni<\/a>), è chiamata <em>mainline<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se il programma contiene una funzione con il nome speciale <code>MAIN<\/code>, Raku esegue questa funzione dopo aver compilato tutto e dopo che il codice mainline è stato eseguito.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Codice mainline';\n\nsub MAIN {\n    say '3. MAIN chiamato';\n}\n\nsay '2. Anche mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma esegue prima i <code>say<\/code> di livello superiore, e poi chiama <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Codice mainline\n2. Anche mainline\n3. MAIN chiamato<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, è anche possibile avere un programma con la funzione <code>MAIN<\/code> e nessun altro codice mainline.<\/span><\/p>"]]},"lv":{"t":"<code>MAIN<\/code> funkcija","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku programmai nav nepieciešami nekādi sākotnējie rituāli, tāpēc jūs varat uzreiz sākt rakstīt noderīgas instrukcijas.<\/span> <span class=\"sg\" data-s=\"1\">Šī programmas daļa, kas atrodas līmenī virs jebkura <a href=\"https://course.raku.org/lv/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">koda bloka<\/a> (piemēram, <a href=\"https://course.raku.org/lv/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funkcijām<\/a>), tiek saukta par <em>galveno līniju<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja programmā ir funkcija ar īpašu nosaukumu <code>MAIN<\/code>, Raku izpilda šo funkciju pēc tam, kad viss ir kompilēts un pēc tam, kad galvenās līnijas kods ir izpildīts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Galvenās līnijas kods';\n\nsub MAIN {\n    say '3. MAIN izsaukts';\n}\n\nsay '2. Arī galvenā līnija';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma vispirms izpilda augstākā līmeņa <code>say<\/code> komandas un pēc tam izsauc <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Galvenās līnijas kods\n2. Arī galvenā līnija\n3. MAIN izsaukts<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, ir iespējams arī, ka programmā ir <code>MAIN<\/code> funkcija un nav cita galvenās līnijas koda.<\/span><\/p>"]]},"ru":{"t":"Функция <code>MAIN<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа на Raku не требует никакого шаблонного ритуала, поэтому вы можете сразу начинать писать полезные инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Эта часть программы, которая находится на уровне выше любого <a href=\"https://course.raku.org/ru/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">блока кода<\/a> (включая <a href=\"https://course.raku.org/ru/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функции<\/a>, например), называется <em>mainline<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если программа содержит функцию со специальным именем <code>MAIN<\/code>, Raku выполняет эту функцию после того, как скомпилирует всё и после выполнения кода mainline.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа сначала выполняет <code>say<\/code> на верхнем уровне, а затем вызывает <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно, также возможно иметь программу с функцией <code>MAIN<\/code> и без другого кода mainline.<\/span><\/p>"]]},"uk":{"t":"Функція <code>MAIN<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма на Raku не потребує жодних шаблонних ритуалів, тому ви можете одразу почати писати корисні інструкції.<\/span> <span class=\"sg\" data-s=\"1\">Ця частина програми, яка знаходиться на рівні вище будь-якого <a href=\"https://course.raku.org/uk/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">блоку коду<\/a> (включаючи <a href=\"https://course.raku.org/uk/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функції<\/a>, наприклад), називається <em>mainline<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо програма містить функцію зі спеціальною назвою <code>MAIN<\/code>, Raku виконує цю функцію після компіляції всього коду та після виконання коду mainline.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма спочатку виконує верхньорівневі <code>say<\/code>, а потім викликає <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, також можливо мати програму з функцією <code>MAIN<\/code> без іншого коду mainline.<\/span><\/p>"]]},"bg":{"t":"Функцията <code>MAIN<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Една програма на Raku не се нуждае от никакви шаблонни ритуали, така че можете веднага да започнете да пишете полезни инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Тази част от програмата, която се намира на ниво над всеки <a href=\"https://course.raku.org/bg/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">код блок<\/a> (включително <a href=\"https://course.raku.org/bg/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функции<\/a>, например), се нарича <em>основна линия<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако програмата съдържа функция със специалното име <code>MAIN<\/code>, Raku изпълнява тази функция след като компилира всичко и след като основният код е бил изпълнен.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Основен код';\n\nsub MAIN {\n    say '3. MAIN извикана';\n}\n\nsay '2. Също основен код';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма първо изпълнява <code>say<\/code> на най-високо ниво, и след това извиква <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Основен код\n2. Също основен код\n3. MAIN извикана<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, възможно е също така да има програма с функция <code>MAIN<\/code> и без друг основен код.<\/span><\/p>"]]},"eo":{"t":"La <code>MAIN<\/code> funkcio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku-programo ne bezonas iun ajn ŝablonan riton, do vi povas tuj komenci skribi utilajn instrukciojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu parto de la programo, kiu troviĝas sur la nivelo super ajna <a href=\"https://course.raku.org/eo/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">koda bloko<\/a> (inkluzive de <a href=\"https://course.raku.org/eo/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funkcioj<\/a>, ekzemple), nomiĝas <em>ĉeflinio<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la programo enhavas funkcion kun la speciala nomo <code>MAIN<\/code>, Raku ekzekutas ĉi tiun funkcion post kiam ĝi kompilas ĉion kaj post kiam la ĉeflinia kodo estis ekzekutita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Ĉeflinia kodo';\n\nsub MAIN {\n    say '3. MAIN vokita';\n}\n\nsay '2. Ankaŭ ĉeflinio';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo unue ekzekutas la supra-nivelajn <code>say<\/code>-ojn, kaj poste vokas <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Ĉeflinia kodo\n2. Ankaŭ ĉeflinio\n3. MAIN vokita<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, eblas ankaŭ havi programon kun la <code>MAIN<\/code> funkcio kaj neniu alia ĉeflinia kodo.<\/span><\/p>"]]},"la":{"t":"<code>MAIN<\/code> functio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma Raku nullum rituale boilerplate requirit, itaque statim utiles instructiones scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Haec pars programmatis, quae in gradu supra quemlibet <a href=\"https://course.raku.org/la/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">codicem clausum<\/a> (inclusis <a href=\"https://course.raku.org/la/essentials/functions/\" target=\"_blank\" rel=\"noopener\">functionibus<\/a>, exempli gratia), sita est, <em>mainline<\/em> appellatur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si programma functionem cum nomine speciali <code>MAIN<\/code> continet, Raku hanc functionem exsequitur postquam omnia compilavit et postquam codex mainline exsecutus est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic '1. Codex mainline';\n\nsub MAIN {\n    dic '3. MAIN vocata';\n}\n\ndic '2. Etiam mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma primum exsequitur <code>dic<\/code> summi gradus, et deinde <code>MAIN<\/code> vocat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Codex mainline\n2. Etiam mainline\n3. MAIN vocata<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Certe, etiam possibile est habere programma cum functione <code>MAIN<\/code> et nullo alio codice mainline.<\/span><\/p>"]]}}}</script>
