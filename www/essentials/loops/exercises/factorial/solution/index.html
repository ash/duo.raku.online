nk\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму кілька разів і спробуйте різні значення <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма використовує оператор <code>*=<\/code>, який є скороченням для множення з присвоєнням: <code>$x *= $y<\/code> еквівалентно <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви можете використовувати «повний» цикл замість постфіксної форми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше на цю тему<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми повернемося до цього завдання кілька разів.<\/span> <span class=\"sg\" data-s=\"1\">У цій частині курсу ми також вирішимо цю проблему рекурсивно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У другій частині курсу ми дізнаємося про так звані оператори редукції, які роблять розв'язання тривіальним.<\/span> <span class=\"sg\" data-s=\"1\">Також буде спосіб визначити користувацький оператор <code>!<\/code>, щоб можна було написати <code>$n!<\/code> для обчислення факторіалу.<\/span> <span class=\"sg\" data-s=\"2\">Нарешті, буде ще одна можливість побачити цікаве розв'язання, коли ми будемо говорити про клаузу <code>where<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Факториел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Факториел на <code>N<\/code> е произведение на целите числа от 1 до и включително <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Например, факториел на 4 е 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",
