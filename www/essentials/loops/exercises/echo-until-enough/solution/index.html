0\">Стартирайте програмата, въведете няколко различни думи и след това прекратете цикъла.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/echo-until-enough.raku\nВашата дума: това\nтова\nВашата дума: е\nе\nВашата дума: моята\nмоята\nВашата дума: дума\nдума\nВашата дума: достатъчно\nдостатъчно\nОК, готово.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че декларирате променливата <code>$word<\/code> <em>преди<\/em> цикъла, тъй като тестът <code>while<\/code> се намира извън обхвата на тялото на цикъла.<\/span> <span class=\"sg\" data-s=\"1\">Ако променливата е дефинирана вътре в цикъла, тя няма да бъде видима в теста.<\/span><\/p>"]]},"eo":{"t":"Solution: Eĥo ĝis sufiĉas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo bezonas buklon kiu haltas kiam la uzanto enigas antaŭdifinitan vorton.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas pluraj similaj manieroj por solvi la taskon kun <code>while<\/code>, <code>until<\/code>, aŭ <code>repeat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unu el ili estas montrita sube.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $vorto;\nrepeat {\n    $vorto = prompt 'Via vorto: ';\n    say $vorto;\n} while $vorto ne 'sufiĉe';\n\nsay 'OK, finita.';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/echo-until-enough.raku\" target=\"_blank\" rel=\"noopener\">echo-until-enough.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon, enigu kelkajn malsamajn vortojn, kaj poste fini la buklon.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/echo-until-enough.raku\nVia vorto: ĉi\nĉi\nVia vorto: estas\nestas\nVia vorto: mia\nmia\nVia vorto: vorto\nvorto\nVia vorto: sufiĉe\nsufiĉe\nOK, finita.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu ke vi deklaras la variablon <code>$vorto<\/code> <em>antaŭ<\/em> la buklo, ĉar la <code>while<\/code> testo estas lokita ekster la korpo de la buklo.<\/span> <span class=\"sg\" data-s=\"1\">Se la variablo estas difinita ene de la buklo, ĝi ne estos videbla en la testo.<\/span><\/p>"]]},"la":{"t":"Solution: Echo usque satis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic programma requirit ansam quae sistitur cum usor verbum praedefinitum inserit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sunt plures similes modi ad operandum cum <code>while<\/code>, <code>until<\/code>, vel <code>repeat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unus ex illis infra monstratur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $verbum;\nrepeat {\n    $verbum = prompt 'Tuum verbum: ';\n    dic $verbum;\n} while $verbum ne 'satis';\n\ndic 'OK, confectum.';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni programma in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/echo-until-enough.raku\" target=\"_blank\" rel=\"noopener\">echo-usque-satis.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programma, inserere pauca verba diversa, et deinde ansam terminare.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/echo-usque-satis.raku\nTuum verbum: hoc\nhoc\nTuum verbum: est\nest\nTuum verbum: meum\nmeum\nTuum verbum: verbum\nverbum\nTuum verbum: satis\nsatis\nOK, confectum.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod variabilem <code>$verbum<\/code> declaras <em>ante<\/em> ansam, quia probatio <code>while<\/code> extra ambitum corporis ansae sita est.<\/span> <span class=\"sg\" data-s=\"1\">Si variabilis intra ansam definita est, non erit visibilis in probatione.<\/span><\/p>"]]}}}</script>
