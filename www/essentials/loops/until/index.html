<script type="application/json" id="page-data">{"u":"essentials/loops/until","n":151,"k":"topic","pv":"essentials/loops/while/quiz","nx":"essentials/loops/until/quiz","tr":["essentials","essentials/loops"],"L":{"en":{"t":"until","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>until<\/code> construct is opposite to <code>while<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It executes the block of code until the condition becomes <code>True<\/code> (or, in other words, while it is <code>False<\/code>).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a modified <a href=\"/essentials/loops/while/\">program from the previous page<\/a> that uses <code>until<\/code> and a new condition:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nuntil $x &gt; 10 {\n    $x = prompt 'Enter a number, which is not bigger than 10: ';\n    say \"You entered $x.\";\n}\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run the program and check the output:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nEnter a number, which is not bigger than 10: 10\nYou entered 10.\nEnter a number, which is not bigger than 10: 4\nYou entered 4.\nEnter a number, which is not bigger than 10: 1\nYou entered 1.\nEnter a number, which is not bigger than 10: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>until<\/code> vs. <code>while<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compare the equivalent programs with <code>while<\/code> and <code>until<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>while $x &lt;= 10 { . . . }\n\nuntil $x &gt; 10 { . . . }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">As you see, the conditions are negated versions of each other.<\/span> <span class=\"sg\" data-s=\"1\">In this sense, <code>while<\/code> and <code>until<\/code> are in the same relations as <code>if<\/code> and <code>unless<\/code>.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>until<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>until<\/code>-Konstrukt ist das Gegenteil von <code>while<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es führt den Codeblock aus, bis die Bedingung <code>True<\/code> wird (oder, mit anderen Worten, solange sie <code>False<\/code> ist).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein modifiziertes <a href=\"/essentials/loops/while/\">Programm von der vorherigen Seite<\/a>, das <code>until<\/code> und eine neue Bedingung verwendet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nuntil $x &gt; 10 {\n    $x = prompt 'Geben Sie eine Zahl ein, die nicht größer als 10 ist: ';\n    say \"Sie haben $x eingegeben.\";\n}\nsay \"$x ist größer als 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Führen Sie das Programm aus und überprüfen Sie die Ausgabe:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 10\nSie haben 10 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 4\nSie haben 4 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 1\nSie haben 1 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 20\nSie haben 20 eingegeben.\n20 ist größer als 10.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>until<\/code> vs. <code>while<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vergleichen Sie die äquivalenten Programme mit <code>while<\/code> und <code>until<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>while $x &lt;= 10 { . . . }\n\nuntil $x &gt; 10 { . . . }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie Sie sehen, sind die Bedingungen negierte Versionen voneinander.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Sinne stehen <code>while<\/co >until<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il costrutto <code>until<\/code> è l'opposto di <code>while<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esegue il blocco di codice fino a quando la condizione diventa <code>True<\/code> (o, in altre parole, mentre è <code>False<\/code>).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un <a href=\"/essentials/loops/while/\">programma modificato dalla pagina precedente<\/a> che utilizza <code>until<\/code> e una nuova condizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nuntil $x &gt; 10 {\n    $x = prompt 'Inserisci un numero, che non sia maggiore di 10: ';\n    say \"Hai inserito $x.\";\n}\nsay \"$x è maggiore di 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esegui il programma e controlla l'output:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nInserisci un numero, che non sia maggiore di 10: 10\nHai inserito 10.\nInserisci un numero, che non sia maggiore di 10: 4\nHai inserito 4.\nInserisci un numero, che non sia maggiore di 10: 1\nHai inserito 1.\nInserisci un numero, che non sia maggiore di 10: 20\nHai inserito 20.\n20 è maggiore di 10.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>until<\/code> vs. <code>while<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Confronta i programmi equivalenti con <code>while<\/code> e <code>until<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>while $x &lt;= 10 { . . . }\n\nuntil $x &gt; 10 { . . . }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come vedi, le condizioni sono versioni negate l'una dell'altra.<\/span> <span class=\"sg\" data-s=\"1\">In questo senso, <code>while<\/code> e <code>until<\/code> sono nella stessa relazione di <code>if<\/code> e <code>unless<\/code>.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>until<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Konstrukts <code>u
