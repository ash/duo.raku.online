<script type="application/json" id="page-data">{"u":"essentials/loops/postfix-for","n":161,"k":"topic","pv":"essentials/loops/topic","nx":"essentials/loops/postfix-for/quiz","tr":["essentials","essentials/loops"],"L":{"en":{"t":"Postfix form of \"for\"","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">We have already seen other statement modifiers: <a href=\"/essentials/conditional-checks/modifiers/\"><code>if<\/code> and <code>else<\/code><\/a> and <a href=\"/essentials/loops/modifiers/\"><code>while<\/code> and <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">And that’s the reason for a small celebration as the design of Raku is very consistent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With a short loop body, the <code>for<\/code> loop can be written in a postfix form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">As you see, ranges are very natural when used with the postfix form of <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program is equivalent to a more traditional variant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Or, if the default loop variable is used, to:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, <code>.say<\/code> is the short form for <code>$_.say<\/code>.<\/span><\/p>"]]},"de":{"t":"Postfix-Form von <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wir haben bereits andere Anweisungsmodifikatoren gesehen: <a href=\"https://course.raku.org/de/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> und <code>else<\/code><\/a> und <a href=\"https://course.raku.org/de/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> und <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Und das ist ein Grund für eine kleine Feier, da das Design von Raku sehr konsistent ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mit einem kurzen Schleifenkörper kann die <code>for<\/code>-Schleife in einer Postfix-Form geschrieben werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wie Sie sehen, sind Bereiche sehr natürlich, wenn sie mit der Postfix-Form von <code>for<\/code> verwendet werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm ist gleichwertig zu einer traditionelleren Variante:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oder, wenn die Standard-Schleifenvariable verwendet wird, zu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>.say<\/code> die Kurzform für <code>$_.say<\/code>.<\/span><\/p>"]]},"nl":{"t":"Postfix vorm van <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">We hebben al andere statementmodificatoren gezien: <a href=\"https://course.raku.org/nl/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> en <code>else<\/code><\/a> en <a href=\"https://course.raku.org/nl/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> en <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">En dat is reden voor een kleine viering, aangezien het ontwerp van Raku zeer consistent is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met een korte lusinhoud kan de <code>for<\/code>-lus in een postfix-vorm worden geschreven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zoals je ziet, zijn reeksen heel natuurlijk wanneer ze worden gebruikt met de postfix-vorm van <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma is gelijk aan een meer traditionele variant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of, als de standaard lusvariabele wordt gebruikt, aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>.say<\/code> de korte vorm voor <code>$_.say<\/code>.<\/span><\/p>"]]},"es":{"t":"Forma posfija de <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya hemos visto otros modificadores de declaración: <a href=\"https://course.raku.org/es/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> y <code>else<\/code><\/a> y <a href=\"https://course.raku.org/es/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> y <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Y esa es la razón para una pequeña celebración, ya que el diseño de Raku es muy consistente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con un cuerpo de bucle corto, el bucle <code>for<\/code> se puede escribir en forma postfija:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como ves, los rangos son muy naturales cuando se usan con la forma postfija de <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa es equivalente a una variante más tradicional:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">O, si se usa la variable de bucle predeterminada, a:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>.say<\/code> es la forma corta de <code>$_.say<\/code>.<\/span><\/p>"]]},"it":{"t":"Forma postfissa di <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Abbiamo già visto altri modificatori di istruzioni: <a href=\"https://course.raku.org/it/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> e <code>else<\/code><\/a> e <a href=\"https://course.raku.org/it/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> e <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ed è per questo motivo che possiamo fare una piccola celebrazione, poiché il design di Raku è molto coerente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con un corpo di ciclo breve, il ciclo <code>for<\/code> può essere scritto in forma postfissa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come vedi, gli intervalli sono molto naturali quando usati con la forma postfissa di <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma è equivalente a una variante più tradizionale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oppure, se viene utilizzata la variabile di ciclo predefinita, a:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>.say<\/code> è la forma abbreviata di <code>$_.say<\/code>.<\/span><\/p>"]]},"lv":{"t":"Pēcpārbaudes forma <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Mēs jau esam redzējuši citus paziņojumu modifikatorus: <a href=\"https://course.raku.org/lv/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> un <code>else<\/code><\/a> un <a href=\"https://course.raku.org/lv/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> un <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Un tas ir iemesls nelielai svinēšanai, jo Raku dizains ir ļoti konsekvents.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar īsu cikla ķermeni, <code>for<\/code> ciklu var uzrakstīt postfix formā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kā redzat, diapazoni ir ļoti dabiski, ja tos izmanto ar <code>for<\/code> postfix formu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma ir ekvivalenta tradicionālākajam variantam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vai, ja tiek izmantots noklusējuma cikla mainīgais, tad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit, <code>.say<\/code> ir īsā forma <code>$_.say<\/code>.<\/span><\/p>"]]},"ru":{"t":"Постфиксная форма <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Мы уже видели другие модификаторы операторов: <a href=\"https://course.raku.org/ru/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> и <code>else<\/code><\/a> и <a href=\"https://course.raku.org/ru/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> и <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">И это повод для небольшой радости, так как дизайн Raku очень последователен.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С коротким телом цикла, цикл <code>for<\/code> может быть записан в постфиксной форме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как видите, диапазоны очень естественно используются с постфиксной формой <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа эквивалентна более традиционному варианту:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или, если используется переменная цикла по умолчанию, то:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>.say<\/code> является короткой формой для <code>$_.say<\/code>.<\/span><\/p>"]]},"uk":{"t":"Постфіксна форма <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми вже бачили інші модифікатори операторів: <a href=\"https://course.raku.org/uk/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> та <code>else<\/code><\/a> і <a href=\"https://course.raku.org/uk/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> та <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">І це привід для невеликого святкування, оскільки дизайн Raku дуже послідовний.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З коротким тілом циклу, цикл <code>for<\/code> можна записати в постфіксній формі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як бачите, діапазони дуже природні при використанні з постфіксною формою <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма еквівалентна більш традиційному варіанту:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Або, якщо використовується змінна циклу за замовчуванням, то:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут <code>.say<\/code> є короткою формою для <code>$_.say<\/code>.<\/span><\/p>"]]},"bg":{"t":"Постфиксна форма на <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече разгледахме други модификатори на изрази: <a href=\"https://course.raku.org/bg/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> и <code>else<\/code><\/a> и <a href=\"https://course.raku.org/bg/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> и <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">И това е повод за малко празнуване, тъй като дизайнът на Raku е много последователен.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">При кратко тяло на цикъла, цикълът <code>for<\/code> може да бъде написан в постфиксна форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както виждате, диапазоните са много естествени, когато се използват с постфиксната форма на <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма е еквивалентна на по-традиционния вариант:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или, ако се използва стандартната променлива на цикъла, на:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук, <code>.say<\/code> е кратката форма за <code>$_.say<\/code>.<\/span><\/p>"]]},"eo":{"t":"Postfixa formo de <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ni jam vidis aliajn deklarajn modifilojn: <a href=\"https://course.raku.org/eo/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>if<\/code> kaj <code>else<\/code><\/a> kaj <a href=\"https://course.raku.org/eo/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>while<\/code> kaj <code>until<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Kaj tio estas kialo por eta festo, ĉar la dezajno de Raku estas tre konsekvenca.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun mallonga korpo de buklo, la <code>for<\/code> buklo povas esti skribita en postfiksa formo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say for 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiel vi vidas, intervaloj estas tre naturaj kiam uzataj kun la postfiksa formo de <code>for<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo estas ekvivalenta al pli tradicia varianto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aŭ, se la defaŭlta bukla variablo estas uzata, al:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..7 {\n    .say;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>.say<\/code> estas la mallonga formo por <code>$_.say<\/code>.<\/span><\/p>"]]},"la":{"t":"Postfixa forma de <code>for<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Iam vidimus alios modificatores sententiae: <a href=\"https://course.raku.org/la/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>si<\/code> et <code>aliter<\/code><\/a> et <a href=\"https://course.raku.org/la/essentials/loops/modifiers/\" target=\"_blank\" rel=\"noopener\"><code>dum<\/code> et <code>donec<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Et hoc est causa parvae celebrationis, quia consilium Raku valde constans est.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum brevi corpore anuli, anulus <code>pro<\/code> in forma postfix scribi potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>.say pro 1..7;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut vides, intervalla sunt valde naturalia cum forma postfix \"pro\" utuntur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma aequivalet magis traditae varianti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>pro 1..7 -&gt; $n {\n    dic $n;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vel, si variabilis anuli defalta adhibetur, ad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>pro 1..7 {\n    .dic;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>.dic<\/code> est forma brevis pro <code>$_.dic<\/code>.<\/span><\/p>"]]}}}</script>
