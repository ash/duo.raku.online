<script type="application/json" id="page-data">{"u":"essentials/loops/while","n":149,"k":"topic","pv":"essentials/loops","nx":"essentials/loops/while/quiz","tr":["essentials","essentials/loops"],"L":{"en":{"t":"while","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>while<\/code> construct has a Boolean condition and a code block.<\/span> <span class=\"sg\" data-s=\"1\">Raku executes the code block repeatedly <em>while<\/em> the condition is <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Enter a number, which is not bigger than 10: ';\n    say \"You entered $x.\";\n}\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The program asks to enter a number, and if the number is not bigger than 10, the loop body repeats.<\/span> <span class=\"sg\" data-s=\"1\">As soon as the entered number breaks the condition <code>$x &lt;= 10<\/code>, the loop ends, and the next line of the program is executed.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number, which is not bigger than 10: 10\nYou entered 10.\nEnter a number, which is not bigger than 10: 4\nYou entered 4.\nEnter a number, which is not bigger than 10: 1\nYou entered 1.\nEnter a number, which is not bigger than 10: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"]]},"de":{"t":"Verwendung von <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die <code>while<\/code>-Konstruktion hat eine boolesche Bedingung und einen Codeblock.<\/span> <span class=\"sg\" data-s=\"1\">Raku führt den Codeblock wiederholt aus, <em>während<\/em> die Bedingung <code>True<\/code> ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Geben Sie eine Zahl ein, die nicht größer als 10 ist: ';\n    say \"Sie haben $x eingegeben.\";\n}\nsay \"$x ist größer als 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Programm fordert auf, eine Zahl einzugeben, und wenn die Zahl nicht größer als 10 ist, wiederholt sich der Schleifenkörper.<\/span> <span class=\"sg\" data-s=\"1\">Sobald die eingegebene Zahl die Bedingung <code>$x &lt;= 10<\/code> verletzt, endet die Schleife und die nächste Zeile des Programms wird ausgeführt.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 10\nSie haben 10 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 4\nSie haben 4 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 1\nSie haben 1 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 20\nSie haben 20 eingegeben.\n20 ist größer als 10.<\/code><\/pre>"]]},"nl":{"t":"Gebruik van <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>while<\/code> constructie heeft een Booleaanse voorwaarde en een codeblok.<\/span> <span class=\"sg\" data-s=\"1\">Raku voert het codeblok herhaaldelijk uit <em>terwijl<\/em> de voorwaarde <code>True<\/code> is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Voer een getal in dat niet groter is dan 10: ';\n    say \"Je hebt $x ingevoerd.\";\n}\nsay \"$x is groter dan 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het programma vraagt om een getal in te voeren, en als het getal niet groter is dan 10, herhaalt het lichaam van de lus.<\/span> <span class=\"sg\" data-s=\"1\">Zodra het ingevoerde getal de voorwaarde <code>$x &lt;= 10<\/code> doorbreekt, eindigt de lus en wordt de volgende regel van het programma uitgevoerd.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer een getal in dat niet groter is dan 10: 10\nJe hebt 10 ingevoerd.\nVoer een getal in dat niet groter is dan 10: 4\nJe hebt 4 ingevoerd.\nVoer een getal in dat niet groter is dan 10: 1\nJe hebt 1 ingevoerd.\nVoer een getal in dat niet groter is dan 10: 20\nJe hebt 20 ingevoerd.\n20 is groter dan 10.<\/code><\/pre>"]]},"es":{"t":"Uso de <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El constructo <code>while<\/code> tiene una condición booleana y un bloque de código.<\/span> <span class=\"sg\" data-s=\"1\">Raku ejecuta el bloque de código repetidamente <em>mientras<\/em> la condición sea <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Introduce un número, que no sea mayor que 10: ';\n    say \"Has introducido $x.\";\n}\nsay \"$x es mayor que 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El programa pide introducir un número, y si el número no es mayor que 10, el cuerpo del bucle se repite.<\/span> <span class=\"sg\" data-s=\"1\">Tan pronto como el número introducido rompe la condición <code>$x &lt;= 10<\/code>, el bucle termina y se ejecuta la siguiente línea del programa.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntroduce un número, que no sea mayor que 10: 10\nHas introducido 10.\nIntroduce un número, que no sea mayor que 10: 4\nHas introducido 4.\nIntroduce un número, que no sea mayor que 10: 1\nHas introducido 1.\nIntroduce un número, que no sea mayor que 10: 20\nHas introducido 20.\n20 es mayor que 10.<\/code><\/pre>"]]},"it":{"t":"Uso di <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il costrutto <code>while<\/code> ha una condizione booleana e un blocco di codice.<\/span> <span class=\"sg\" data-s=\"1\">Raku esegue il blocco di codice ripetutamente <em>mentre<\/em> la condizione è <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Inserisci un numero, che non sia maggiore di 10: ';\n    say \"Hai inserito $x.\";\n}\nsay \"$x è maggiore di 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il programma chiede di inserire un numero, e se il numero non è maggiore di 10, il corpo del ciclo si ripete.<\/span> <span class=\"sg\" data-s=\"1\">Non appena il numero inserito infrange la condizione <code>$x &lt;= 10<\/code>, il ciclo termina e viene eseguita la riga successiva del programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nInserisci un numero, che non sia maggiore di 10: 10\nHai inserito 10.\nInserisci un numero, che non sia maggiore di 10: 4\nHai inserito 4.\nInserisci un numero, che non sia maggiore di 10: 1\nHai inserito 1.\nInserisci un numero, che non sia maggiore di 10: 20\nHai inserito 20.\n20 è maggiore di 10.<\/code><\/pre>"]]},"lv":{"t":"Izmantojot <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>while<\/code> konstruktam ir Būla nosacījums un koda bloks.<\/span> <span class=\"sg\" data-s=\"1\">Raku atkārtoti izpilda koda bloku, <em>kamēr<\/em> nosacījums ir <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Ievadiet skaitli, kas nav lielāks par 10: ';\n    say \"Jūs ievadījāt $x.\";\n}\nsay \"$x ir lielāks par 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma prasa ievadīt skaitli, un, ja skaitlis nav lielāks par 10, cilpas ķermenis atkārtojas.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz ievadītais skaitlis pārkāpj nosacījumu <code>$x &lt;= 10<\/code>, cilpa beidzas un tiek izpildīta nākamā programmas rinda.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIevadiet skaitli, kas nav lielāks par 10: 10\nJūs ievadījāt 10.\nIevadiet skaitli, kas nav lielāks par 10: 4\nJūs ievadījāt 4.\nIevadiet skaitli, kas nav lielāks par 10: 1\nJūs ievadījāt 1.\nIevadiet skaitli, kas nav lielāks par 10: 20\nJūs ievadījāt 20.\n20 ir lielāks par 10.<\/code><\/pre>"]]},"ru":{"t":"Использование <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Конструкция <code>while<\/code> имеет логическое условие и блок кода.<\/span> <span class=\"sg\" data-s=\"1\">Raku выполняет блок кода повторно <em>пока<\/em> условие равно <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Введите число, которое не больше 10: ';\n    say \"Вы ввели $x.\";\n}\nsay \"$x больше 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа запрашивает ввод числа, и если число не больше 10, тело цикла повторяется.<\/span> <span class=\"sg\" data-s=\"1\">Как только введенное число нарушает условие <code>$x &lt;= 10<\/code>, цикл заканчивается, и выполняется следующая строка программы.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведите число, которое не больше 10: 10\nВы ввели 10.\nВведите число, которое не больше 10: 4\nВы ввели 4.\nВведите число, которое не больше 10: 1\nВы ввели 1.\nВведите число, которое не больше 10: 20\nВы ввели 20.\n20 больше 10.<\/code><\/pre>"]]},"uk":{"t":"Використання <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Конструкція <code>while<\/code> має булеву умову та блок коду.<\/span> <span class=\"sg\" data-s=\"1\">Raku виконує блок коду повторно <em>поки<\/em> умова є <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Enter a number, which is not bigger than 10: ';\n    say \"You entered $x.\";\n}\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма просить ввести число, і якщо число не більше 10, тіло циклу повторюється.<\/span> <span class=\"sg\" data-s=\"1\">Як тільки введене число порушує умову <code>$x &lt;= 10<\/code>, цикл закінчується, і виконується наступний рядок програми.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number, which is not bigger than 10: 10\nYou entered 10.\nEnter a number, which is not bigger than 10: 4\nYou entered 4.\nEnter a number, which is not bigger than 10: 1\nYou entered 1.\nEnter a number, which is not bigger than 10: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"]]},"bg":{"t":"Използване на <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Конструкцията <code>while<\/code> има булевo условие и блок от код.<\/span> <span class=\"sg\" data-s=\"1\">Raku изпълнява блока от код многократно <em>докато<\/em> условието е <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Въведете число, което не е по-голямо от 10: ';\n    say \"Въведохте $x.\";\n}\nsay \"$x е по-голямо от 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програмата иска да въведете число, и ако числото не е по-голямо от 10, тялото на цикъла се повтаря.<\/span> <span class=\"sg\" data-s=\"1\">Веднага щом въведеното число наруши условието <code>$x &lt;= 10<\/code>, цикълът приключва и се изпълнява следващият ред от програмата.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВъведете число, което не е по-голямо от 10: 10\nВъведохте 10.\nВъведете число, което не е по-голямо от 10: 4\nВъведохте 4.\nВъведете число, което не е по-голямо от 10: 1\nВъведохте 1.\nВъведете число, което не е по-голямо от 10: 20\nВъведохте 20.\n20 е по-голямо от 10.<\/code><\/pre>"]]},"eo":{"t":"Uzante <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>while<\/code> konstruaĵo havas Boole-an kondiĉon kaj kodoblokon.<\/span> <span class=\"sg\" data-s=\"1\">Raku ekzekutas la kodoblokon ripete <em>dum<\/em> la kondiĉo estas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Enigu numeron, kiu ne estas pli granda ol 10: ';\n    say \"Vi enigis $x.\";\n}\nsay \"$x estas pli granda ol 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La programo petas enigi numeron, kaj se la numero ne estas pli granda ol 10, la korpo de la buklo ripetiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Tuj kiam la enigita numero rompas la kondiĉon <code>$x &lt;= 10<\/code>, la buklo finiĝas, kaj la sekva linio de la programo estas ekzekutita.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnigu numeron, kiu ne estas pli granda ol 10: 10\nVi enigis 10.\nEnigu numeron, kiu ne estas pli granda ol 10: 4\nVi enigis 4.\nEnigu numeron, kiu ne estas pli granda ol 10: 1\nVi enigis 1.\nEnigu numeron, kiu ne estas pli granda ol 10: 20\nVi enigis 20.\n20 estas pli granda ol 10.<\/code><\/pre>"]]},"la":{"t":"Utendo <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Constructum <code>while<\/code> conditionem Booleanam et clausulam codicis habet.<\/span> <span class=\"sg\" data-s=\"1\">Raku clausulam codicis iterum atque iterum exsequitur <em>dum<\/em> condicio est <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Intra numerum, qui non maior est quam 10: ';\n    say \"Intrasti $x.\";\n}\nsay \"$x maior est quam 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma rogat ut numerum intres, et si numerus non maior est quam 10, corpus anuli iteratur.<\/span> <span class=\"sg\" data-s=\"1\">Simul ac numerus intratus conditionem <code>$x &lt;= 10<\/code> frangit, anulus desinit, et sequens linea programmatis exsequitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum, qui non maior est quam 10: 10\nIntrasti 10.\nIntra numerum, qui non maior est quam 10: 4\nIntrasti 4.\nIntra numerum, qui non maior est quam 10: 1\nIntrasti 1.\nIntra numerum, qui non maior est quam 10: 20\nIntrasti 20.\n20 maior est quam 10.<\/code><\/pre>"]]}}}</script>
