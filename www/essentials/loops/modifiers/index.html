e<\/code> permette all'istruzione <code>$x -= 3<\/code> di ripetersi finché la condizione <code>$x &gt; 2<\/code> rimane <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non appena diventa <code>False<\/code>, il ciclo si interrompe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che se la condizione è <code>False<\/code> inizialmente, l'istruzione non viene eseguita affatto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso programma può essere riscritto con <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per questo, la condizione deve essere invertita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"lv":{"t":"<code>while<\/code> un <code>until<\/code> kā izteiksmes modifikatori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Gan <code>while<\/code>, gan <code>until<\/code> var izmantot teikuma modifikatoru formā (<a href=\"https://course.raku.org/lv/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">līdzīgi<\/a> kā <code>if<\/code> un <code>unless<\/code>).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apsveriet piemēru, kas imitē dalīšanu ar atlikumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>-=<\/code> ir operators, kas apvieno gan atņemšanu, gan piešķiršanu.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā <code>$x -= 3<\/code> ir ekvivalents <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>while<\/code> modifikators ļauj teikumam <code>$x -= 3<\/code> atkārtoties, kamēr nosacījums <code>$x &gt; 2<\/code> paliek <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz tas kļūst <code>False<\/code>, cilpa apstājas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka, ja nosacī
