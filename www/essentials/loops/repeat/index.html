os a modificar el programa para usar <code>until<\/code> en su lugar.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ejecuta el programa para confirmar que funciona como se espera:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"it":{"t":"Uso di <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">I blocchi <code>while<\/code> e <code>until<\/code> potrebbero non essere mai eseguiti se la condizione è inizialmente <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Al contrario, il blocco <code>repeat<\/code> viene sempre eseguito almeno una volta.<\/span> <span class=\"sg\" data-s=\"2\">La condizione di stop viene verificata dopo il blocco di codice.<\/span> <span class=\"sg\" data-s=\"3\">Si utilizzano le stesse parole <code>while<\/code> o <code>until<\/code> per il test.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Considera questo programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$x<\/code> è inizialmente impostata a <code>100<\/code>, e la condizione <code>while<\/code> verifica se <code>$x<\/code> è minore o uguale a <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con il valore dato alla variabile, la condizione è già <code>False<\/code>, ma il blocco di codice viene comunque eseguito per primo.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou
