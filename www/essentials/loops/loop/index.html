<script type="application/json" id="page-data">{"u":"essentials/loops/loop","n":156,"k":"topic","pv":"essentials/loops/modifiers","nx":"essentials/loops/infinite-loops","tr":["essentials","essentials/loops"],"L":{"en":{"t":"loop","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> statement is a construct in Raku that has a lot of common with traditional loops in the C programming language and its relatives.<\/span> <span class=\"sg\" data-s=\"1\">It takes three statements: the initialiser, the test, and the statement to modify the loop variable.<\/span> <span class=\"sg\" data-s=\"2\">The body of the loop is repeatedly executed while the test remains <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, <code>++<\/code> is a postfix operator that increments its argument by 1.<\/span> <span class=\"sg\" data-s=\"1\">We will cover more operators in the second part of the course.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program executes the body of the loop five times.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Some, or even all, of the statements in <code>loop<\/code>’s header may be omitted.<\/span> <span class=\"sg\" data-s=\"1\">For instance, here is the same program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> loops are, probably, the least used loops in Raku.<\/span> <span class=\"sg\" data-s=\"1\">They can be found, for example, in an automated translator from C to Raku.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, though, there are handier loops such as <code>for<\/code>, which we are examining very soon.<\/span><\/p>"]]},"de":{"t":"Drei-Anweisungs-Schleife <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code>-Anweisung ist ein Konstrukt in Raku, das viel mit traditionellen Schleifen in der Programmiersprache C und ihren Verwandten gemeinsam hat.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt drei Anweisungen: den Initialisierer, den Test und die Anweisung zur Modifikation der Schleifenvariablen.<\/span> <span class=\"sg\" data-s=\"2\">Der Schleifenkörper wird wiederholt ausgeführt, solange der Test <code>True<\/code> bleibt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>++<\/code> ein Postfix-Operator, der sein Argument um 1 erhöht.<\/span> <span class=\"sg\" data-s=\"1\">Wir werden im zweiten Teil des Kurses mehr Operatoren behandeln.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm führt den Schleifenkörper fünfmal aus.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDer aktuelle Wert des Zählers ist 0.\nDer aktuelle Wert des Zählers ist 1.\nDer aktuelle Wert des Zählers ist 2.\nDer aktuelle Wert des Zählers ist 3.\nDer aktuelle Wert des Zählers ist 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Einige oder sogar alle Anweisungen im Kopf der <code>loop<\/code>-Schleife können weggelassen werden.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist zum Beispiel dasselbe Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code>-Schleifen sind wahrscheinlich die am wenigsten genutzten Schleifen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Sie können beispielsweise in einem automatisierten Übersetzer von C nach Raku gefunden werden.<\/span> <span class=\"sg\" data-s=\"2\">In Raku gibt es jedoch praktischere Schleifen wie <code>for<\/code>, die wir sehr bald untersuchen werden.<\/span><\/p>"]]},"nl":{"t":"Drie-zins <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code>-instructie is een constructie in Raku die veel gemeen heeft met traditionele lussen in de C-programmeertaal en zijn verwanten.<\/span> <span class=\"sg\" data-s=\"1\">Het neemt drie instructies: de initialisator, de test en de instructie om de lusvariabele te wijzigen.<\/span> <span class=\"sg\" data-s=\"2\">Het lichaam van de lus wordt herhaaldelijk uitgevoerd zolang de test <code>True<\/code> blijft.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"De huidige waarde van de teller is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>++<\/code> een postfix-operator die zijn argument met 1 verhoogt.<\/span> <span class=\"sg\" data-s=\"1\">We zullen meer operators behandelen in het tweede deel van de cursus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma voert het lichaam van de lus vijf keer uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDe huidige waarde van de teller is 0.\nDe huidige waarde van de teller is 1.\nDe huidige waarde van de teller is 2.\nDe huidige waarde van de teller is 3.\nDe huidige waarde van de teller is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommige, of zelfs alle, instructies in de kop van de <code>loop<\/code> kunnen worden weggelaten.<\/span> <span class=\"sg\" data-s=\"1\">Hier is bijvoorbeeld hetzelfde programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"De huidige waarde van de teller is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code>-lussen zijn waarschijnlijk de minst gebruikte lussen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ze kunnen bijvoorbeeld worden gevonden in een geautomatiseerde vertaler van C naar Raku.<\/span> <span class=\"sg\" data-s=\"2\">In Raku zijn er echter handigere lussen zoals <code>for<\/code>, die we zeer binnenkort zullen onderzoeken.<\/span><\/p>"]]},"es":{"t":"Bucle de tres sentencias <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La declaración <code>loop<\/code> es una construcción en Raku que tiene mucho en común con los bucles tradicionales en el lenguaje de programación C y sus derivados.<\/span> <span class=\"sg\" data-s=\"1\">Toma tres declaraciones: el inicializador, la prueba y la declaración para modificar la variable del bucle.<\/span> <span class=\"sg\" data-s=\"2\">El cuerpo del bucle se ejecuta repetidamente mientras la prueba permanezca <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"El valor actual del contador es $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>++<\/code> es un operador postfijo que incrementa su argumento en 1.<\/span> <span class=\"sg\" data-s=\"1\">Cubriremos más operadores en la segunda parte del curso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa ejecuta el cuerpo del bucle cinco veces.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEl valor actual del contador es 0.\nEl valor actual del contador es 1.\nEl valor actual del contador es 2.\nEl valor actual del contador es 3.\nEl valor actual del contador es 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Algunas, o incluso todas, las declaraciones en el encabezado de <code>loop<\/code> pueden ser omitidas.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, aquí está el mismo programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"El valor actual del contador es $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los bucles <code>loop<\/code> son, probablemente, los bucles menos utilizados en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Se pueden encontrar, por ejemplo, en un traductor automatizado de C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, sin embargo, hay bucles más útiles como <code>for<\/code>, que examinaremos muy pronto.<\/span><\/p>"]]},"it":{"t":"Ciclo <code>loop<\/code> a tre istruzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'istruzione <code>loop<\/code> è una costruzione in Raku che ha molto in comune con i cicli tradizionali nel linguaggio di programmazione C e i suoi parenti.<\/span> <span class=\"sg\" data-s=\"1\">Prende tre istruzioni: l'inizializzatore, il test e l'istruzione per modificare la variabile del ciclo.<\/span> <span class=\"sg\" data-s=\"2\">Il corpo del ciclo viene eseguito ripetutamente mentre il test rimane <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Il valore attuale del contatore è $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>++<\/code> è un operatore postfisso che incrementa il suo argomento di 1.<\/span> <span class=\"sg\" data-s=\"1\">Tratteremo più operatori nella seconda parte del corso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma esegue il corpo del ciclo cinque volte.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIl valore attuale del contatore è 0.\nIl valore attuale del contatore è 1.\nIl valore attuale del contatore è 2.\nIl valore attuale del contatore è 3.\nIl valore attuale del contatore è 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alcune, o anche tutte, le istruzioni nell'intestazione di <code>loop<\/code> possono essere omesse.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, ecco lo stesso programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Il valore attuale del contatore è $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I cicli <code>loop<\/code> sono, probabilmente, i cicli meno utilizzati in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Possono essere trovati, ad esempio, in un traduttore automatico da C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, però, ci sono cicli più comodi come <code>for<\/code>, che esamineremo molto presto.<\/span><\/p>"]]},"lv":{"t":"Trīs izteiksmju cikls","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> paziņojums ir konstrukcija Raku valodā, kas ir ļoti līdzīga tradicionālajiem cikliem C programmēšanas valodā un tās radiniekos.<\/span> <span class=\"sg\" data-s=\"1\">Tā pieņem trīs paziņojumus: inicializētāju, pārbaudi un paziņojumu, kas modificē cikla mainīgo.<\/span> <span class=\"sg\" data-s=\"2\">Cikla ķermenis tiek atkārtoti izpildīts, kamēr pārbaude paliek <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>++<\/code> ir postfix operators, kas palielina tā argumentu par 1.<\/span> <span class=\"sg\" data-s=\"1\">Mēs apskatīsim vairāk operatoru kursa otrajā daļā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izpilda cikla ķermeni piecas reizes.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Daži vai pat visi paziņojumi <code>loop<\/code> galvenē var tikt izlaisti.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šeit ir tā pati programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> cikli, iespējams, ir vismazāk izmantotie cikli Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tos var atrast, piemēram, automatizētā tulkotājā no C uz Raku.<\/span> <span class=\"sg\" data-s=\"2\">Tomēr Raku valodā ir ērtāki cikli, piemēram, <code>for<\/code>, kurus mēs drīzumā apskatīsim.<\/span><\/p>"]]},"ru":{"t":"<code>loop<\/code> с тремя инструкциями","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> в Raku имеет много общего с традиционными циклами в языке программирования C и его родственниках.<\/span> <span class=\"sg\" data-s=\"1\">Он принимает три выражения: инициализатор, проверку и выражение для изменения переменной цикла.<\/span> <span class=\"sg\" data-s=\"2\">Тело цикла выполняется многократно, пока проверка остается <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущее значение счетчика: $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>++<\/code> — это постфиксный оператор, который увеличивает свой аргумент на 1.<\/span> <span class=\"sg\" data-s=\"1\">Мы рассмотрим больше операторов во второй части курса.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выполняет тело цикла пять раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущее значение счетчика: 0.\nТекущее значение счетчика: 1.\nТекущее значение счетчика: 2.\nТекущее значение счетчика: 3.\nТекущее значение счетчика: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Некоторые или даже все выражения в заголовке <code>loop<\/code> могут быть опущены.<\/span> <span class=\"sg\" data-s=\"1\">Например, вот та же программа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущее значение счетчика: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Циклы <code>loop<\/code> являются, вероятно, наименее используемыми циклами в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Их можно найти, например, в автоматическом переводчике с C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Однако в Raku есть более удобные циклы, такие как <code>for<\/code>, которые мы рассмотрим очень скоро.<\/span><\/p>"]]},"uk":{"t":"Триопераційний цикл <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> в Raku має багато спільного з традиційними циклами в мовах програмування C та її родичів.<\/span> <span class=\"sg\" data-s=\"1\">Він приймає три вирази: ініціалізатор, тест та вираз для модифікації змінної циклу.<\/span> <span class=\"sg\" data-s=\"2\">Тіло циклу виконується повторно, поки тест залишається <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Поточне значення лічильника: $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут, <code>++<\/code> є постфіксним оператором, який збільшує свій аргумент на 1.<\/span> <span class=\"sg\" data-s=\"1\">Ми розглянемо більше операторів у другій частині курсу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виконує тіло циклу п'ять разів.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nПоточне значення лічильника: 0.\nПоточне значення лічильника: 1.\nПоточне значення лічильника: 2.\nПоточне значення лічильника: 3.\nПоточне значення лічильника: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі або навіть всі вирази в заголовку <code>loop<\/code> можуть бути пропущені.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, ось та сама програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Поточне значення лічильника: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цикли <code>loop<\/code>, ймовірно, найменш використовувані цикли в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Їх можна знайти, наприклад, в автоматизованому перекладачі з C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">У Raku, однак, є зручніші цикли, такі як <code>for<\/code>, які ми розглянемо дуже скоро.<\/span><\/p>"]]},"bg":{"t":"Тристатъментен цикъл <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> операторът е конструкция в Raku, която има много общо с традиционните цикли в програмния език C и неговите родственици.<\/span> <span class=\"sg\" data-s=\"1\">Той приема три израза: инициализатор, тест и израз за модифициране на променливата на цикъла.<\/span> <span class=\"sg\" data-s=\"2\">Тялото на цикъла се изпълнява многократно, докато тестът остава <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущата стойност на брояча е $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук, <code>++<\/code> е постфикс оператор, който увеличава аргумента си с 1.<\/span> <span class=\"sg\" data-s=\"1\">Ще разгледаме повече оператори във втората част на курса.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата изпълнява тялото на цикъла пет пъти.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущата стойност на брояча е 0.\nТекущата стойност на брояча е 1.\nТекущата стойност на брояча е 2.\nТекущата стойност на брояча е 3.\nТекущата стойност на брояча е 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои или дори всички изрази в заглавието на <code>loop<\/code> могат да бъдат пропуснати.<\/span> <span class=\"sg\" data-s=\"1\">Например, ето същата програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущата стойност на брояча е $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> циклите вероятно са най-малко използваните цикли в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Те могат да бъдат намерени, например, в автоматизиран преводач от C към Raku.<\/span> <span class=\"sg\" data-s=\"2\">В Raku обаче има по-удобни цикли като <code>for<\/code>, които ще разгледаме много скоро.<\/span><\/p>"]]},"eo":{"t":"Trideklaro <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>loop<\/code> deklaro estas konstruo en Raku kiu havas multon komunan kun tradiciaj bukloj en la C-programlingvo kaj ĝiaj parencoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas tri deklarojn: la inicialigilo, la testo, kaj la deklaro por modifi la buklan variablon.<\/span> <span class=\"sg\" data-s=\"2\">La korpo de la buklo estas ripete ekzekutita dum la testo restas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>++<\/code> estas postfiksa operatoro kiu pliigas sian argumenton je 1.<\/span> <span class=\"sg\" data-s=\"1\">Ni kovros pli da operatoroj en la dua parto de la kurso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo ekzekutas la korpon de la buklo kvin fojojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nLa nuna valoro de la kalkulilo estas 0.\nLa nuna valoro de la kalkulilo estas 1.\nLa nuna valoro de la kalkulilo estas 2.\nLa nuna valoro de la kalkulilo estas 3.\nLa nuna valoro de la kalkulilo estas 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iuj, aŭ eĉ ĉiuj, el la deklaroj en la kapo de <code>loop<\/code> povas esti preterlasitaj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, jen la sama programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>loop<\/code> bukloj estas, probable, la malplej uzataj bukloj en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ili povas esti trovitaj, ekzemple, en aŭtomata tradukilo de C al Raku.<\/span> <span class=\"sg\" data-s=\"2\">Tamen, en Raku, estas pli praktikaj bukloj kiel <code>for<\/code>, kiujn ni esploros tre baldaŭ.<\/span><\/p>"]]},"la":{"t":"Tribus partibus <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> enuntiatum est constructum in Raku quod multum commune habet cum traditionalibus loopis in C programmando lingua et eius cognatis.<\/span> <span class=\"sg\" data-s=\"1\">Accipit tres enuntiationes: initialiser, test, et enuntiatum ad variabilem loopis modificandam.<\/span> <span class=\"sg\" data-s=\"2\">Corpus loopis iterum atque iterum exequitur dum test manet <code>Verum<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>++<\/code> est operator postfixus qui argumentum suum per 1 auget.<\/span> <span class=\"sg\" data-s=\"1\">Plures operatores in secunda parte cursus tractabimus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma corpus loopis quinquies exequitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliquae, vel etiam omnes, enuntiationes in capite <code>loop<\/code> omitti possunt.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, hic est idem programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> loopi sunt, probabiliter, minime usitati loopi in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Inveniri possunt, exempli gratia, in automato interprete a C ad Raku.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, tamen, sunt commodiores loopi sicut <code>for<\/code>, quos mox examinabimus.<\/span><\/p>"]]}}}</script>
