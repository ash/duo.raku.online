s=\"0\">Цикълът <code>for<\/code> е мощен инструмент за итерация през множество елементи.<\/span> <span class=\"sg\" data-s=\"1\">Например, нека вземем един диапазон:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..5 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В тази програма, променливата <code>$n<\/code> приема следващата стойност от диапазона при всяка итерация.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че не е необходимо да декларирате променливата с <code>my<\/code> изрично.<\/span> <span class=\"sg\" data-s=\"2\">Блокът от код се повтаря толкова пъти, колкото е броят на елементите в източника на данни.<\/span> <span class=\"sg\" data-s=\"3\">Така програмата отпечатва числата ред по ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \n1\n2\n3\n4\n5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програмата итерира през всички стойности, които <a href=\"https://course.raku.org/bg/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">диапазонът<\/a> <code>1..5<\/code> генерира.<\/span> <span class=\"sg\" data-s=\"1\">Това са <code>1<\/code>, <code>2<\/code>, <code>3<\/code>, <code>4<\/code> и <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вземане на повече от една стойност<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интересна характеристика на Raku е, че можете да вземете повече от един елемент в една итерация.<\/span> <span class=\"sg\" data-s=\"1\">Следната програма отпечатва две числа в цикъл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..6 -&gt; $n, $m {\n    say \"$n and $m\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изходът на тази програма е следният:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1 and 2\n3 and 4\n5 and 6<\/code><\/pre>"]]},"eo":{"t":"<code>for<\/code> ripetoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>for<\/code> buklo estas potenca ilo por iteri super multoblaj elementoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, ni prenu intervalon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..5 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu programo, la variablo <code>$n<\/code> prenas la sekvan valoron el la intervalo en ĉiu iteracio.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, ke vi ne devas eksplicite deklari la variablon per <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La bloko de kodo ripetiĝas tiom da fojoj kiom estas elementoj en la datumfonto.<\/span> <span class=\"sg\" data-s=\"3\">Do, la programo presas la nombrojn linio post linio:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \n1\n2\n3\n4\n5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La programo iteras super ĉiuj valoroj, kiujn la <a href=\"https://course.raku.org/eo/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalo<\/a> <code>1..5<\/code> generas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj estas <code>1<\/code>, <code>2<\/code>, <code>3<\/code>, <code>4<\/code>, kaj <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Preni pli ol unu valoron<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interesa trajto de Raku estas, ke vi povas preni pli ol unu elementon en unu sola iteracio.<\/span> <span class=\"sg\" data-s=\"1\">La sekva programo presas du nombrojn en buklo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..6 -&gt; $n, $m {\n    say \"$n and $m\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La eligo de ĉi tiu programo estas la sekva:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1 and 2\n3 and 4\n5 and 6<\/code><\/pre>"]]},"la":{"t":"<code>for<\/code> ansae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>for<\/code> ansa potentissimum instrumentum es
