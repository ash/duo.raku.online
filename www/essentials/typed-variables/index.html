<script type="application/json" id="page-data">{"u":"essentials/typed-variables","n":192,"k":"section","pv":"essentials/coercion/quiz","nx":"essentials/typed-variables/type-constraints","tr":["essentials"],"L":{"en":{"t":"Typed variables","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, a scalar variable (or, a scalar container) can keep a single object of different types.<\/span> <span class=\"sg\" data-s=\"1\">For example, the same variable can first contain a number, and then a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is another example of mixing different data types in the same expression:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is, probably, not the best coding practice, but it is a perfectly valid Raku program.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nevertheless, Raku allows you to specify what a given variable may keep.<\/span> <span class=\"sg\" data-s=\"1\">There are more details in the below topics.<\/span><\/p>"]]},"de":{"t":"Typisierte Variablen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku kann eine skalare Variable (oder ein skalarer Container) ein einzelnes Objekt verschiedener Typen enthalten.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kann dieselbe Variable zuerst eine Zahl und dann einen String enthalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hallo';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein weiteres Beispiel für das Mischen verschiedener Datentypen im selben Ausdruck:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies ist wahrscheinlich nicht die beste Programmierpraxis, aber es ist ein vollkommen gültiges Raku-Programm.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nichtsdestotrotz erlaubt es Raku, anzugeben, was eine bestimmte Variable enthalten darf.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt mehr Details in den unten stehenden Themen.<\/span><\/p>"]]},"nl":{"t":"Getypte variabelen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku kan een scalair variabele (of een scalair container) een enkel object van verschillende typen bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, dezelfde variabele kan eerst een getal bevatten, en daarna een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hallo';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een ander voorbeeld van het mengen van verschillende datatypen in dezelfde expressie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is waarschijnlijk niet de beste programmeerpraktijk, maar het is een perfect geldig Raku-programma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Niettemin, Raku stelt je in staat om te specificeren wat een gegeven variabele mag bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn meer details in de onderstaande onderwerpen.<\/span><\/p>"]]},"es":{"t":"Variables tipadas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, una variable escalar (o, un contenedor escalar) puede contener un solo objeto de diferentes tipos.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, la misma variable puede contener primero un número y luego una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hola';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay otro ejemplo de mezcla de diferentes tipos de datos en la misma expresión:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto, probablemente, no sea la mejor práctica de codificación, pero es un programa Raku perfectamente válido.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No obstante, Raku te permite especificar qué puede contener una variable dada.<\/span> <span class=\"sg\" data-s=\"1\">Hay más detalles en los temas a continuación.<\/span><\/p>"]]},"it":{"t":"Variabili tipizzate","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, una variabile scalare (o, un contenitore scalare) può contenere un singolo oggetto di diversi tipi.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, la stessa variabile può prima contenere un numero e poi una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un altro esempio di mescolanza di diversi tipi di dati nella stessa espressione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo, probabilmente, non è la migliore pratica di codifica, ma è un programma Raku perfettamente valido.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tuttavia, Raku ti permette di specificare cosa può contenere una determinata variabile.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono più dettagli nei seguenti argomenti.<\/span><\/p>"]]},"lv":{"t":"Tipizētie mainīgie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku valodā skalārs mainīgais (vai skalāra konteiners) var saturēt vienu objektu no dažādiem tipiem.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tas pats mainīgais var vispirms saturēt skaitli un pēc tam virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vēl viens piemērs, kurā tiek sajaukti dažādi datu tipi vienā izteiksmē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas, iespējams, nav labākā kodēšanas prakse, bet tas ir pilnīgi derīgs Raku programmas kods.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tomēr Raku ļauj jums norādīt, ko konkrētais mainīgais var saturēt.<\/span> <span class=\"sg\" data-s=\"1\">Vairāk detaļu ir zemāk esošajās tēmās.<\/span><\/p>"]]},"ru":{"t":"Типизированные переменные","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku скалярная переменная (или скалярный контейнер) может содержать один объект разных типов.<\/span> <span class=\"sg\" data-s=\"1\">Например, одна и та же переменная может сначала содержать число, а затем строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот еще один пример смешивания разных типов данных в одном выражении:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это, вероятно, не лучшая практика программирования, но это совершенно допустимая программа на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тем не менее, Raku позволяет вам указать, что может содержать данная переменная.<\/span> <span class=\"sg\" data-s=\"1\">Более подробная информация представлена в следующих разделах.<\/span><\/p>"]]},"uk":{"t":"Типізовані змінні","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku скалярна змінна (або скалярний контейнер) може зберігати один об'єкт різних типів.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, та сама змінна може спочатку містити число, а потім рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось ще один приклад змішування різних типів даних в одному виразі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це, мабуть, не найкраща практика кодування, але це цілком допустима програма на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тим не менш, Raku дозволяє вам вказати, що може зберігати дана змінна.<\/span> <span class=\"sg\" data-s=\"1\">Більше деталей у темах нижче.<\/span><\/p>"]]},"bg":{"t":"Типизирани променливи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku, скаларна променлива (или скаларен контейнер) може да съдържа един обект от различни типове.<\/span> <span class=\"sg\" data-s=\"1\">Например, една и съща променлива може първо да съдържа число, а след това низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето още един пример за смесване на различни типове данни в едно и също изразяване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това, вероятно, не е най-добрата практика за програмиране, но е напълно валидна програма на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Въпреки това, Raku ви позволява да уточните какво може да съдържа дадена променлива.<\/span> <span class=\"sg\" data-s=\"1\">Повече подробности има в следващите теми.<\/span><\/p>"]]},"eo":{"t":"Tipitaj variabloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, skalaro variablo (aŭ, skalaro ujo) povas teni ununuran objekton de malsamaj tipoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la sama variablo povas unue enhavi numeron, kaj poste ŝnuron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen alia ekzemplo de miksado de malsamaj datumtipoj en la sama esprimo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio estas, probable, ne la plej bona kodpraktiko, sed ĝi estas tute valida Raku-programo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tamen, Raku permesas al vi specifii kion donita variablo povas teni.<\/span> <span class=\"sg\" data-s=\"1\">Estas pli da detaloj en la subaj temoj.<\/span><\/p>"]]},"la":{"t":"Typis variabiles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, variabile scalare (vel, continens scalare) potest unum obiectum diversorum generum continere.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, eadem variabile primo numerum continere potest, deinde stringam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Salve';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est alius exemplum miscendi diversa genera datae in eadem expressione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\ndic $a + $b; # 300<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc est, probabiliter, non optima praxis codicis, sed est perfecte valida programma Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tamen, Raku permittit te specificare quid data variabile continere possit.<\/span> <span class=\"sg\" data-s=\"1\">Plura sunt in argumentis infra.<\/span><\/p>"]]}}}</script>
