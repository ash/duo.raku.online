integer number, the program breaks at the moment we assign <code>$input<\/code> to <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notice that you get an error even if the input string can be cast to a number, but not an integer.<\/span> <span class=\"sg\" data-s=\"1\">As it is not possible to store a floating-point or a rational number in an integer container, Raku will emit an exception:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The second assignment, <code>$s = $input<\/code>, will never break as a string can take any input.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code of this program in the file <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"de":{"t":"Allomorphe","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Betrachten Sie das folgende Programm.<\/span> <span class=\"sg\" data-s=\"1\">Können Sie vor dem Ausführen sagen, welche Eingabewerte es brechen würden und in welcher Zeile?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier werden drei Skalare Variablen erstellt.<\/span> <span class=\"sg\" data-s=\"1\">Zwei davon, <code>$i<\/code> und <code>$s<\/code>, sind typisierte Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Das bedeutet, dass <code>$i<\/code> nur ganze Zahlen speichern kann und <code>$s<\/code> nur Zeichenketten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Rückgabetyp von <code>prompt<\/code> hängt von den eingegebenen Zeichen ab.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Eingabezeichenkette eine ganze Zahl darstellen kann, ist das Ergebnis vom Typ <code>IntStr<\/code>, der <em>sowohl<\/em> <code>Int<\/code> als auch <code>Str<\/code> ist und daher sowohl einer <code>Int<\/code>- als auch einer <code>Str<\/code>-Variable zugewiesen werden kann.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie also beispielsweise <code>1234<\/code> eingeben, bricht das Programm nicht ab.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>IntStr<\/code>-Typ ist ein Beispiel für den sogenannten <em>Allomorph<\/em> — ein Datentyp, der zwei andere Typen kombiniert.<\/span> <span class=\"sg\" data-s=\"1\">Hier sind einige weitere Beispiele.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie eine Zeichenkette eingeben, die keine ganze Zahl sein kann, bricht das Programm in dem Moment ab, in dem wir <code>$input<\/code> <code>$i<\/code> zuweisen:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Sie einen Fehler erhalten, selbst wenn die Eingabezeichenkette in eine Zahl umgewandelt werden kann, aber keine ganze Zahl ist.<\/span> <span class=\"sg\" data-s=\"1\">Da es nicht möglich ist, eine Gleitkommazahl oder eine rationale Zahl in einem Ganzzahl-Container zu speichern, wird Raku eine Ausnahme auslösen:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die zweite Zuweisung, <code>$s = $input<\/code>, wird niemals brechen, da eine Zeichenkette jede Eingabe annehmen kann.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Sie können den Quellcode dieses Programms in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a> finden.<\/span><\/p>"]]},"nl":{"t":"Allomorfen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Overweeg het volgende programma.<\/span> <span class=\"sg\" data-s=\"1\">Kun je, voordat je het uitvoert, aangeven welke invoerwaarden het zouden breken en op welke regel?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er worden hier drie scalairen variabelen aangemaakt.<\/span> <span class=\"sg\" data-s=\"1\">Twee daarvan, <code>$i<\/code> en <code>$s<\/code>, zijn getypeerde variabelen.<\/span> <span class=\"sg\" data-s=\"2\">Dat betekent dat <code>$i<\/code> alleen gehele getallen kan opslaan en <code>$s<\/code> alleen strings.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het retourtype van <code>prompt<\/code> hangt af van de tekens die we hebben getypt.<\/span> <span class=\"sg\" data-s=\"1\">Als de invoerstring een geheel getal kan vertegenwoordigen, zal het resultaat van het type <code>IntStr<\/code> zijn, wat <em>zowel<\/em> <code>Int<\/code> als <code>Str<\/code> is, en dus kan worden toegewezen aan zowel een <code>Int<\/code> als een <code>Str<\/code> variabele.<\/span> <span class=\"sg\" data-s=\"2\">Dus, als je bijvoorbeeld <code>1234<\/code> invoert, breekt het programma niet.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>IntStr<\/code> type is een voorbeeld van de zogenaamde <em>allomorf<\/em> — een gegevenstype dat twee andere typen combineert.<\/span> <span class=\"sg\" data-s=\"1\">Hier zijn nog een paar voorbeelden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je een string invoert die geen geheel getal kan zijn, breekt het programma op het moment dat we <code>$input<\/code> toewijzen aan <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat je een foutmelding krijgt, zelfs als de invoerstring naar een getal kan worden gecast, maar geen geheel getal is.<\/span> <span class=\"sg\" data-s=\"1\">Aangezien het niet mogelijk is om een drijvend-komma of een rationeel getal in een geheel getal container op te slaan, zal Raku een uitzondering genereren:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De tweede toewijzing, <code>$s = $input<\/code>, zal nooit breken omdat een string elke invoer kan accepteren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode van dit programma vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"es":{"t":"Alomorfos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Considera el siguiente programa.<\/span> <span class=\"sg\" data-s=\"1\">Antes de ejecutarlo, ¿puedes decir qué valores de entrada lo romperían y en qué línea?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí se crean tres variables escalares.<\/span> <span class=\"sg\" data-s=\"1\">Dos de ellas, <code>$i<\/code> y <code>$s<\/code>, son variables tipadas.<\/span> <span class=\"sg\" data-s=\"2\">Eso significa que <code>$i<\/code> solo puede almacenar enteros y <code>$s<\/code> solo puede almacenar cadenas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El tipo de retorno de <code>prompt<\/code> depende de los caracteres que escribimos.<\/span> <span class=\"sg\" data-s=\"1\">Si la cadena de entrada puede representar un número entero, el resultado será del tipo <code>IntStr<\/code>, que es <em>tanto<\/em> <code>Int<\/code> como <code>Str<\/code>, y por lo tanto, puede asignarse a una variable <code>Int<\/code> o <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que, si ingresas, por ejemplo, <code>1234<\/code>, el programa no se rompe.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El tipo <code>IntStr<\/code> es un ejemplo del llamado <em>alomorfo<\/em> — un tipo de dato que combina dos otros tipos.<\/span> <span class=\"sg\" data-s=\"1\">Aquí hay algunos ejemplos más.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si ingresas una cadena que no puede ser un número entero, el programa se rompe en el momento en que asignamos <code>$input<\/code> a <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota que obtienes un error incluso si la cadena de entrada puede convertirse a un número, pero no a un entero.<\/span> <span class=\"sg\" data-s=\"1\">Como no es posible almacenar un número de punto flotante o racional en un contenedor entero, Raku emitirá una excepción:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La segunda asignación, <code>$s = $input<\/code>, nunca se romperá ya que una cadena puede tomar cualquier entrada.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente de este programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"it":{"t":"Allomorfi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Considera il seguente programma.<\/span> <span class=\"sg\" data-s=\"1\">Prima di eseguirlo, puoi dire quali valori di input lo romperebbero e a quale riga?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui vengono create tre variabili scalari.<\/span> <span class=\"sg\" data-s=\"1\">Due di esse, <code>$i<\/code> e <code>$s<\/code>, sono variabili tipizzate.<\/span> <span class=\"sg\" data-s=\"2\">Ciò significa che <code>$i<\/code> può contenere solo interi e <code>$s<\/code> può contenere solo stringhe.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il tipo di ritorno di <code>prompt<\/code> dipende dai caratteri che abbiamo digitato.<\/span> <span class=\"sg\" data-s=\"1\">Se la stringa di input può rappresentare un numero intero, il risultato sarà del tipo <code>IntStr<\/code>, che è <em>sia<\/em> <code>Int<\/code> che <code>Str<\/code>, e quindi può essere assegnato sia a una variabile <code>Int<\/code> che a una variabile <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quindi, se inserisci, ad esempio, <code>1234<\/code>, il programma non si rompe.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il tipo <code>IntStr<\/code> è un esempio del cosiddetto <em>allomorfo<\/em> — un tipo di dato che combina due altri tipi.<\/span> <span class=\"sg\" data-s=\"1\">Ecco alcuni altri esempi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se inserisci una stringa che non può essere un numero intero, il programma si rompe nel momento in cui assegniamo <code>$input<\/code> a <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che ottieni un errore anche se la stringa di input può essere convertita in un numero, ma non in un intero.<\/span> <span class=\"sg\" data-s=\"1\">Poiché non è possibile memorizzare un numero in virgola mobile o un numero razionale in un contenitore intero, Raku emetterà un'eccezione:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il secondo assegnamento, <code>$s = $input<\/code>, non si romperà mai poiché una stringa può accettare qualsiasi input.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente di questo programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"lv":{"t":"Allomorfi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Apsveriet šādu programmu.<\/span> <span class=\"sg\" data-s=\"1\">Pirms to palaist, vai jūs varat pateikt, kuri ievades vērtības to salauzīs un kurā rindā?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit tiek izveidoti trīs skalārie mainīgie.<\/span> <span class=\"sg\" data-s=\"1\">Divi no tiem, <code>$i<\/code> un <code>$s<\/code>, ir tipizēti mainīgie.<\/span> <span class=\"sg\" data-s=\"2\">Tas nozīmē, ka <code>$i<\/code> var glabāt tikai veselus skaitļus un <code>$s<\/code> var glabāt tikai virknes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> atgriešanas tips ir atkarīgs no ievadītajiem rakstzīmēm.<\/span> <span class=\"sg\" data-s=\"1\">Ja ievades virkne var pārstāvēt veselu skaitli, rezultāts būs <code>IntStr<\/code> tips, kas ir <em>gan<\/em> <code>Int<\/code>, gan <code>Str<\/code>, un tādējādi to var piešķirt gan <code>Int<\/code>, gan <code>Str<\/code> mainīgajam.<\/span> <span class=\"sg\" data-s=\"2\">Tātad, ja ievadāt, piemēram, <code>1234<\/code>, programma nesalauzīsies.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>IntStr<\/code> tips ir tā saucamā <em>allomorfa<\/em> piemērs — datu tips, kas apvieno divus citus tipus.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir vēl daži piemēri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja ievadāt virkni, kas nevar būt vesels skaitlis, programma salūzīs brīdī, kad mēs piešķiram <code>$input<\/code> uz <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka jūs saņemat kļūdu pat tad, ja ievades virkne var tikt pārveidota par skaitli, bet ne par veselu skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā nav iespējams glabāt peldošā punkta vai racionālu skaitli vesela skaitļa konteinerā, Raku izmetīs izņēmumu:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otrā piešķiršana, <code>$s = $input<\/code>, nekad nesalauzīsies, jo virkne var pieņemt jebkuru ievadi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast šīs programmas avota kodu failā <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"ru":{"t":"Алломорфы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рассмотрим следующую программу.<\/span> <span class=\"sg\" data-s=\"1\">Можете ли вы сказать, какие входные значения её сломают и на какой строке, до того как запустите её?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь создаются три скалярные переменные.<\/span> <span class=\"sg\" data-s=\"1\">Две из них, <code>$i<\/code> и <code>$s<\/code>, являются типизированными переменными.<\/span> <span class=\"sg\" data-s=\"2\">Это означает, что <code>$i<\/code> может хранить только целые числа, а <code>$s<\/code> может хранить только строки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Возвращаемый тип <code>prompt<\/code> зависит от введённых символов.<\/span> <span class=\"sg\" data-s=\"1\">Если входная строка может представлять целое число, результат будет типа <code>IntStr<\/code>, который является <em>как<\/em> <code>Int<\/code>, так и <code>Str<\/code>, и, следовательно, может быть присвоен как переменной типа <code>Int<\/code>, так и переменной типа <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Таким образом, если вы введёте, например, <code>1234<\/code>, программа не сломается.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип <code>IntStr<\/code> является примером так называемого <em>алломорфа<\/em> — типа данных, который объединяет два других типа.<\/span> <span class=\"sg\" data-s=\"1\">Вот ещё несколько примеров.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы введёте строку, которая не может быть целым числом, программа сломается в момент присвоения <code>$input<\/code> переменной <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что вы получите ошибку, даже если входная строка может быть преобразована в число, но не в целое.<\/span> <span class=\"sg\" data-s=\"1\">Поскольку невозможно хранить число с плавающей запятой или рациональное число в контейнере для целых чисел, Raku выдаст исключение:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второе присвоение, <code>$s = $input<\/code>, никогда не сломается, так как строка может принять любой ввод.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код этой программы можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"uk":{"t":"Аломорфи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Розгляньте наступну програму.<\/span> <span class=\"sg\" data-s=\"1\">Перед її запуском, чи можете ви сказати, які вхідні значення зламають її і на якому рядку?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут створено три скалярні змінні.<\/span> <span class=\"sg\" data-s=\"1\">Дві з них, <code>$i<\/code> і <code>$s<\/code>, є типізованими змінними.<\/span> <span class=\"sg\" data-s=\"2\">Це означає, що <code>$i<\/code> може зберігати лише цілі числа, а <code>$s<\/code> може зберігати лише рядки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип повернення <code>prompt<\/code> залежить від введених символів.<\/span> <span class=\"sg\" data-s=\"1\">Якщо вхідний рядок може представляти ціле число, результат буде типу <code>IntStr<\/code>, який є <em>одночасно<\/em> <code>Int<\/code> і <code>Str<\/code>, і таким чином може бути присвоєний як змінній <code>Int<\/code>, так і змінній <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Отже, якщо ви введете, наприклад, <code>1234<\/code>, програма не зламається.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип <code>IntStr<\/code> є прикладом так званого <em>аломорфа<\/em> — типу даних, який поєднує два інші типи.<\/span> <span class=\"sg\" data-s=\"1\">Ось ще кілька прикладів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви введете рядок, який не може бути цілим числом, програма зламається в момент присвоєння <code>$input<\/code> до <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що ви отримаєте помилку навіть якщо вхідний рядок може бути перетворений на число, але не на ціле.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки неможливо зберегти число з плаваючою комою або раціональне число в контейнері для цілих чисел, Raku видасть виняток:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друге присвоєння, <code>$s = $input<\/code>, ніколи не зламається, оскільки рядок може прийняти будь-який вхід.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код цієї програми у файлі <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"bg":{"t":"Аломорфи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Разгледайте следната програма.<\/span> <span class=\"sg\" data-s=\"1\">Преди да я стартирате, можете ли да кажете кои входни стойности ще я счупят и на кой ред?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук са създадени три скаларни променливи.<\/span> <span class=\"sg\" data-s=\"1\">Две от тях, <code>$i<\/code> и <code>$s<\/code>, са типизирани променливи.<\/span> <span class=\"sg\" data-s=\"2\">Това означава, че <code>$i<\/code> може да съхранява само цели числа, а <code>$s<\/code> може да съхранява само низове.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типът на връщане на <code>prompt<\/code> зависи от въведените символи.<\/span> <span class=\"sg\" data-s=\"1\">Ако входният низ може да представлява цяло число, резултатът ще бъде от тип <code>IntStr<\/code>, който е <em>едновременно<\/em> <code>Int<\/code> и <code>Str<\/code>, и следователно може да бъде присвоен както на променлива от тип <code>Int<\/code>, така и на променлива от тип <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така че, ако въведете, например, <code>1234<\/code>, програмата няма да се счупи.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Типът <code>IntStr<\/code> е пример за така наречения <em>аломорф<\/em> — тип данни, който комбинира два други типа.<\/span> <span class=\"sg\" data-s=\"1\">Ето още няколко примера.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако въведете низ, който не може да бъде цяло число, програмата ще се счупи в момента, в който присвоим <code>$input<\/code> на <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че ще получите грешка дори ако входният низ може да бъде преобразуван в число, но не и в цяло число.<\/span> <span class=\"sg\" data-s=\"1\">Тъй като не е възможно да се съхрани число с плаваща запетая или рационално число в контейнер за цели числа, Raku ще издаде изключение:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второто присвояване, <code>$s = $input<\/code>, никога няма да се счупи, тъй като низът може да приеме всякакъв вход.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код на тази програма във файла <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"eo":{"t":"Alomorfoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Konsideru la sekvan programon.<\/span> <span class=\"sg\" data-s=\"1\">Antaŭ ol ruli ĝin, ĉu vi povas diri kiuj eniraj valoroj rompus ĝin kaj ĉe kiu linio?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas tri skalaj variabloj kreitaj ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Du el ili, <code>$i<\/code> kaj <code>$s<\/code>, estas tajpitaj variabloj.<\/span> <span class=\"sg\" data-s=\"2\">Tio signifas, ke <code>$i<\/code> povas nur stoki entjerojn kaj <code>$s<\/code> povas nur stoki kordojn.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La revena tipo de <code>prompt<\/code> dependas de la karakteroj, kiujn ni tajpis.<\/span> <span class=\"sg\" data-s=\"1\">Se la enira kordo povas reprezenti entjeran numeron, la rezulto estos de la tipo <code>IntStr<\/code>, kiu estas <em>ambaŭ<\/em> <code>Int<\/code> kaj <code>Str<\/code>, kaj tial povas esti asignita al aŭ <code>Int<\/code> aŭ <code>Str<\/code> variablo.<\/span> <span class=\"sg\" data-s=\"2\">Do, se vi eniras, ekzemple, <code>1234<\/code>, la programo ne rompiĝas.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La tipo <code>IntStr<\/code> estas ekzemplo de la tiel nomata <em>alomorfo<\/em> — datuma tipo, kiu kombinas du aliajn tipojn.<\/span> <span class=\"sg\" data-s=\"1\">Jen kelkaj pliaj ekzemploj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi eniras kordon, kiu ne povas esti entjera numero, la programo rompiĝas en la momento, kiam ni asignas <code>$input<\/code> al <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke vi ricevas eraron eĉ se la enira kordo povas esti gisita al numero, sed ne entjero.<\/span> <span class=\"sg\" data-s=\"1\">Ĉar ne eblas stoki flosantan punkton aŭ racian numeron en entjera ujo, Raku eligos escepton:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La dua asigno, <code>$s = $input<\/code>, neniam rompiĝos ĉar kordo povas preni ajnan eniron.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon de ĉi tiu programo en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"la":{"t":"Allomorphes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Considera sequens programma.<\/span> <span class=\"sg\" data-s=\"1\">Antequam id curras, potesne dicere quae valores inputorum id frangant et in qua linea?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tres variabiles scalare hic creantur.<\/span> <span class=\"sg\" data-s=\"1\">Duae earum, <code>$i<\/code> et <code>$s<\/code>, sunt variabiles typatae.<\/span> <span class=\"sg\" data-s=\"2\">Id significat <code>$i<\/code> solum numeros integros continere posse et <code>$s<\/code> solum chordas continere posse.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Typus reditus <code>prompt<\/code> dependet a characteribus quos typis dedimus.<\/span> <span class=\"sg\" data-s=\"1\">Si chorda inputi numerum integrum repraesentare potest, eventus erit typi <code>IntStr<\/code>, quod est <em>et<\/em> <code>Int<\/code> et <code>Str<\/code>, et sic assignari potest vel variabili <code>Int<\/code> vel <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ergo, si, exempli gratia, <code>1234<\/code> intras, programma non frangitur.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Typus <code>IntStr<\/code> est exemplum sic dicti <em>allomorphi<\/em> — typus datae qui duos alios typos coniungit.<\/span> <span class=\"sg\" data-s=\"1\">Hic sunt pauca alia exempla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si chordam intras quae numerus integer esse non potest, programma frangitur momento quo <code>$input<\/code> ad <code>$i<\/code> assignamus:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Animadverte quod errorem accipis etiam si chorda inputi ad numerum converti potest, sed non ad integrum.<\/span> <span class=\"sg\" data-s=\"1\">Cum non sit possibile numerum puncti-fluctuantis vel rationalem in continens integrum ponere, Raku exceptionem emittet:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Secunda assignatio, <code>$s = $input<\/code>, numquam frangetur quia chorda potest quemlibet inputum accipere.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis huius programmatis invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]}}}</script>
