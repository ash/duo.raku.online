<script type="application/json" id="page-data">{"u":"essentials/typed-variables/exercises/create-variables-of-all-known-types","n":200,"k":"exercise","pv":"essentials/typed-variables/exercises","nx":"essentials/typed-variables/exercises/create-variables-of-all-known-types/solution","tr":["essentials","essentials/typed-variables"],"L":{"en":{"t":"Create variables of all known types","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Task<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Write a program that creates a few scalar variables and initialises them with the values of the following types: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, and <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The program should print both the value and its type.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The actual output of the program may differ, but the idea is illustrated with the following test run:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Variablen aller bekannten Typen erstellen","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie ein Programm, das einige skalare Variablen erstellt und sie mit Werten der folgenden Typen initialisiert: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code> und <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm sollte sowohl den Wert als auch seinen Typ ausgeben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die tatsächliche Ausgabe des Programms kann variieren, aber die Idee wird mit folgendem Testlauf veranschaulicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Maak variabelen van alle bekende typen","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Taak<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Schrijf een programma dat een paar scalair variabelen maakt en deze initialiseert met waarden van de volgende types: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, en <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het programma moet zowel de waarde als het type afdrukken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De daadwerkelijke uitvoer van het programma kan verschillen, maar het idee wordt geïllustreerd met de volgende testrun:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Zie de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Crear variables de todos los tipos conocidos","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Tarea<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Escribe un programa que cree algunas variables escalares y las inicialice con los valores de los siguientes tipos: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, y <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El programa debe imprimir tanto el valor como su tipo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La salida real del programa puede diferir, pero la idea se ilustra con la siguiente ejecución de prueba:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Creare variabili di tutti i tipi conosciuti","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Compito<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scrivi un programma che crei alcune variabili scalari e le inizializzi con i valori dei seguenti tipi: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, e <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il programma dovrebbe stampare sia il valore che il suo tipo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'output effettivo del programma può variare, ma l'idea è illustrata con la seguente esecuzione di test:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Izveidot mainīgos no visiem zināmajiem tipiem","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet programmu, kas izveido dažus skalāros mainīgos un inicializē tos ar šādu tipu vērtībām: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code> un <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Programmai jāizdrukā gan vērtība, gan tās tips.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmas faktiskā izvade var atšķirties, bet ideja ir ilustrēta ar šādu testa palaidi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Создайте переменные всех возможных типов","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишите программу, которая создает несколько скалярных переменных и инициализирует их значениями следующих типов: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Программа должна выводить как значение, так и его тип.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фактический вывод программы может отличаться, но идея иллюстрируется следующим тестовым запуском:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">См. решение<\/a><\/span><\/p>"]]},"uk":{"t":"Створення змінних усіх відомих типів","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишіть програму, яка створює кілька скалярних змінних і ініціалізує їх значеннями наступних типів: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, та <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Програма повинна виводити як значення, так і його тип.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Фактичний вивід програми може відрізнятися, але ідея ілюструється наступним тестовим запуском:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Създаване на променливи от всички известни типове","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Напишете програма, която създава няколко скаларни променливи и ги инициализира със стойности от следните типове: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Програмата трябва да отпечатва както стойността, така и нейния тип.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Действителният изход на програмата може да се различава, но идеята е илюстрирана със следното тестово изпълнение:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Виж решението<\/a><\/span><\/p>"]]},"eo":{"t":"Krei variablojn de ĉiuj konataj tipoj","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Tasko<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Skribu programon kiu kreas kelkajn skalajn variablojn kaj inicializas ilin kun valoroj de la sekvaj tipoj: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, kaj <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La programo devus presi kaj la valoron kaj ĝian tipon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La fakta eligo de la programo povas malsami, sed la ideo estas ilustrita per la sekva test-ekzekuto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Creare variabiles omnium notorum generum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Munus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma scribe quod paucas variabiles scalaris creat et eas cum valoribus sequentium notarum initializat: <code>Int<\/code>, <code>Rat<\/code>, <code>Num<\/code>, <code>Bool<\/code>, et <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Programma tam valorem quam eius notam imprimere debet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Actualis output programmatis differre potest, sed idea illustratur cum sequenti test run:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku types.raku\n151 (Int)\n4.2 (Rat)\n1e10 (Num)\nTrue (Bool)\nxyz (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/typed-variables/exercises/create-variables-of-all-known-types/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
