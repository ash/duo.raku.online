<script type="application/json" id="page-data">{"u":"essentials/how-to-install-rakudo","n":5,"k":"section","pv":"essentials/the-rakudo-compiler","nx":"essentials/the-rakupp-compiler","tr":["essentials"],"L":{"en":{"t":"How to install Rakudo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">To execute a program in Raku, you need to have a compiler installed.<\/span> <span class=\"sg\" data-s=\"1\">This course uses Rakudo; the other compiler, <a href=\"/essentials/the-rakupp-compiler/\">Raku++<\/a>, is installed <a href=\"/essentials/how-to-install-rakupp/\">separately<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Visit <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">the website of Rakudo<\/a> to download the version suitable for your operating system.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sources<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can download an installer for your system at <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">There exist versions for all major operating systems: Windows, Mac OS, and Linux.<\/span> <span class=\"sg\" data-s=\"2\">There are also source codes that you can compile yourself.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker images<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo is also available as a docker image.<\/span> <span class=\"sg\" data-s=\"1\">You can use it for both running programs and for testing small scripts in a REPL shell.<\/span> <span class=\"sg\" data-s=\"2\">Find all the instructions at <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Version numbers<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The Rakudo version numbering system forms the version number as a two-part number: the year and the month of <span class=\"sg\" data-s=\"1\">Es gibt Versionen für alle gängigen Betriebssysteme: Windows, Mac OS und Linux.<\/span> <span class=\"sg\" data-s=\"2\">Ebenso gibt es die Quelltexte, die Sie selbst übersetzen können.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-Images<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo ist auch als Docker-Image verfügbar.<\/span> <span class=\"sg\" data-s=\"1\">Sie können es sowohl zum Ausführen von Programmen als auch zum Erproben kleiner Skripte in einer REPL-Shell nutzen.<\/span> <span class=\"sg\" data-s=\"2\">Alle Anweisungen finden Sie unter <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versionsnummern<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Versionsschema von Rakudo bildet die Versionsnummer aus zwei Teilen: dem Jahr und dem Monat des Veröffentlichungsdatums.<\/span> <span class=\"sg\" data-s=\"1\">So sehen Sie auf einen Blick, wie aktuell Ihr Compiler ist.<\/span> <span class=\"sg\" data-s=\"2\">Führen Sie die folgende Befehlszeile aus, um die Versionsnummer zu sehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier sehen Sie drei Versionsnummern.<\/span> <span class=\"sg\" data-s=\"1\">Die erste ist die Version von Rakudo selbst: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dann folgt die Version der Sprache Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die Aktualisierungen erhalten derzeit den nächsten Buchstaben als Nebenversion, also <code>v6.e<\/code> und so fort.<\/span> <span class=\"sg\" data-s=\"4\">Zuletzt sehen wir den Namen der virtuellen Maschine, die dieser Compiler verwendet: MoarVM in der Version <code>2026.06<\/code>.<\/span><\/p>"]]},"nl":{"t":"Hoe Rakudo te installeren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een programma in Raku uit te voeren moet je een compiler geïnstalleerd hebben.<\/span> <span class=\"sg\" data-s=\"1\">Deze cursus gebruikt Rakudo; de andere compiler, <a href=\"https://course.raku.org/nl/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, installeer je <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">apart<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ga naar <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">de website van Rakudo<\/a> om de versie te downloaden die bij jouw besturingssysteem past.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bronnen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een installatieprogramma voor jouw systeem vind je op <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Er bestaan versies voor alle grote besturingssystemen: Windows, Mac OS en Linux.<\/span> <span class=\"sg\" data-s=\"2\">Er is ook broncode die je zelf kunt compileren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-images<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo is ook beschikbaar als docker-image.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het zowel gebruiken om programma's uit te voeren als om kleine scripts te proberen in een REPL-shell.<\/span> <span class=\"sg\" data-s=\"2\">Alle instructies staan op <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het versienummeringssysteem van Rakudo bouwt het versienummer op uit twee delen: het jaar en de maand van de uitgavedatum.<\/span> <span class=\"sg\" data-s=\"1\">Zo zie je in één oogopslag hoe vers je compiler is.<\/span> <span class=\"sg\" data-s=\"2\">Voer de volgende opdrachtregel uit om het versienummer te zien:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je ziet hier drie versienummers.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste is de versie van Rakudo zelf: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dan volgt de versie van de taal Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De updates krijgen momenteel de volgende letter als kleine versie, bijvoorbeeld <code>v6.e<\/code>, enzovoort.<\/span> <span class=\"sg\" data-s=\"4\">Ten slotte zien we de naam van de virtuele machine die deze compiler gebruikt: MoarVM versie <code>2026.06<\/code>.<\/span><\/p>"]]},"es":{"t":"Cómo instalar Rakudo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Para ejecutar un programa en Raku necesita tener un compilador instalado.<\/span> <span class=\"sg\" data-s=\"1\">Este curso usa Rakudo; el otro compilador, <a href=\"https://course.raku.org/es/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, se instala <a href=\"https://course.raku.org/es/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">aparte<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Visite <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">el sitio web de Rakudo<\/a> para descargar la versión adecuada para su sistema operativo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fuentes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puede descargar un instalador para su sistema en <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Existen versiones para todos los sistemas operativos principales: Windows, Mac OS y Linux.<\/span> <span class=\"sg\" data-s=\"2\">También están los códigos fuente, que puede compilar usted mismo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Imágenes de Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo también está disponible como imagen de docker.<\/span> <span class=\"sg\" data-s=\"1\">Puede usarla tanto para ejecutar programas como para probar pequeños guiones en un intérprete REPL.<\/span> <span class=\"sg\" data-s=\"2\">Encontrará todas las instrucciones en <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El sistema de numeración de Rakudo forma el número de versión en dos partes: el año y el mes de la fecha de publicación.<\/span> <span class=\"sg\" data-s=\"1\">Así puede ver de un vistazo cuán reciente es su compilador.<\/span> <span class=\"sg\" data-s=\"2\">Ejecute la siguiente línea de órdenes para ver su número de versión:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí ve tres números de versión.<\/span> <span class=\"sg\" data-s=\"1\">El primero es la versión de Rakudo en sí: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Luego viene la versión del lenguaje Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Por ahora las actualizaciones recibirán la letra siguiente como parte menor de la versión, por ejemplo <code>v6.e<\/code>, etc. Por último vemos el nombre de la máquina virtual que usa este compilador: MoarVM versión <code>2026.06<\/code>.<\/span><\/p>"]]},"it":{"t":"Come installare Rakudo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per eseguire un programma in Raku dovete avere un compilatore installato.<\/span> <span class=\"sg\" data-s=\"1\">Questo corso usa Rakudo; l'altro compilatore, <a href=\"https://course.raku.org/it/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, si installa <a href=\"https://course.raku.org/it/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">a parte<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Visitate <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">il sito di Rakudo<\/a> per scaricare la versione adatta al vostro sistema operativo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sorgenti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Potete scaricare un programma di installazione per il vostro sistema da <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Esistono versioni per tutti i principali sistemi operativi: Windows, Mac OS e Linux.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono anche i codici sorgente, che potete compilare voi stessi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Immagini Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo è disponibile anche come immagine docker.<\/span> <span class=\"sg\" data-s=\"1\">Potete usarla sia per eseguire programmi sia per provare piccoli script in una shell REPL.<\/span> <span class=\"sg\" data-s=\"2\">Trovate tutte le istruzioni su <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il sistema di numerazione di Rakudo forma il numero di versione in due parti: l'anno e il mese della data di rilascio.<\/span> <span class=\"sg\" data-s=\"1\">Potete cos pan class=\"sg\" data-s=\"1\">Pastāv versijas visām lielākajām operētājsistēmām: Windows, Mac OS un Linux.<\/span> <span class=\"sg\" data-s=\"2\">Ir arī pirmkodi, kurus varat kompilēt pats.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker attēli<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo ir pieejams arī kā docker attēls.<\/span> <span class=\"sg\" data-s=\"1\">To varat lietot gan programmu izpildei, gan nelielu skriptu izmēģināšanai REPL čaulā.<\/span> <span class=\"sg\" data-s=\"2\">Visas norādes atradīsiet vietnē <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo versiju numerācijas sistēma veido versijas numuru no divām daļām: izlaiduma gada un mēneša.<\/span> <span class=\"sg\" data-s=\"1\">Tā uzreiz redzat, cik svaigs ir jūsu kompilators.<\/span> <span class=\"sg\" data-s=\"2\">Izpildiet šādu komandrindu, lai redzētu tā versijas numuru:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit redzami trīs versiju numuri.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais ir paša Rakudo versija: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad nāk Raku valodas versija: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Atjauninājumi pagaidām saņem nākamo burtu kā mazāko versijas daļu, piemēram, <code>v6.e<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"4\">Visbeidzot redzam virtuālās mašīnas nosaukumu, ko lieto šis kompilators: MoarVM versija <code>2026.06<\/code>.<\/span><\/p>"]]},"ru":{"t":"Как установить Rakudo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы выполнить программу на Raku, вам потреб ildo.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĝin kaj por ruli programojn kaj por elprovi malgrandajn skriptojn en ŝelo REPL.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiujn instrukciojn vi trovos ĉe <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versinumeroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sistemo de versinumerado de Rakudo formas la versinumeron el du partoj: la jaro kaj la monato de la eldondato.<\/span> <span class=\"sg\" data-s=\"1\">Tiel vi facile vidas, kiom freŝa estas via kompililo.<\/span> <span class=\"sg\" data-s=\"2\">Plenumu la jenan komandlinion por vidi ĝian versinumeron:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie vi vidas tri versinumerojn.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la versio de Rakudo mem: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste venas la versio de la lingvo Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La ĝisdatigoj nuntempe ricevas la sekvan literon kiel malĉefan parton de la versio, ekzemple <code>v6.e<\/code> kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"4\">Fine ni vidas la nomon de la virtuala maŝino uzata de ĉi tiu kompililo: MoarVM versio <code>2026.06<\/code>.<\/span><\/p>"]]},"la":{"t":"Quomodo Rakudo installare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut programma in Raku exsequaris, compilatorem installatum habere debes.<\/span> <span class=\"sg\" data-s=\"1\">Hic cursus Rakudo adhibet; alter compilator, <a href=\"https://course.raku.org/la/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>, <a href=\"https://course.raku.org/la/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">seorsum<\/a> installatur.<\/span> <span class=\"sg\" data-s=\"2\">Adi <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">sedem interretialem Rakudo<\/a> ut versionem systemati tuo aptam deprimas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma installationis systemati tuo aptum apud <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a> deprimere potes.<\/span> <span class=\"sg\" data-s=\"1\">Versiones sunt pro omnibus systematibus praecipuis: Windows, Mac OS, Linux.<\/span> <span class=\"sg\" data-s=\"2\">Sunt etiam codices fontales, quos ipse compilare potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Imagines Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo etiam ut imago docker praesto est.<\/span> <span class=\"sg\" data-s=\"1\">Ea uti potes et ad programmata exsequenda et ad brevia scripta in cortice REPL probanda.<\/span> <span class=\"sg\" data-s=\"2\">Omnia praecepta apud <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ratio numerorum Rakudo numerum versionis ex duabus partibus format: anno et mense diei emissionis.<\/span> <span class=\"sg\" data-s=\"1\">Ita statim vides quam recens sit compilator tuus.<\/span> <span class=\"sg\" data-s=\"2\">Hanc lineam imperandi exsequere ut numerum versionis videas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic tres numeros versionum vides.<\/span> <span class=\"sg\" data-s=\"1\">Primus est versio ipsius Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deinde sequitur versio linguae Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Renovationes in praesenti litteram sequentem ut minorem versionis partem accipiunt, ut <code>v6.e<\/code> et cetera.<\/span> <span class=\"sg\" data-s=\"4\">Denique nomen machinae virtualis videmus qua hic compilator utitur: MoarVM versio <code>2026.06<\/code>.<\/span><\/p>"]]}}}</script>
