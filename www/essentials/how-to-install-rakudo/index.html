<script type="application/json" id="page-data">{"u":"essentials/how-to-install-rakudo","n":5,"k":"section","pv":"essentials/the-rakudo-compiler","nx":"essentials/the-rakupp-compiler","tr":["essentials"],"L":{"en":{"t":"How to install Rakudo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">To execute a program in Raku, you need to have a compiler installed.<\/span> <span class=\"sg\" data-s=\"1\">This course uses Rakudo; the other compiler, <a href=\"/essentials/the-rakupp-compiler/\">Raku++<\/a>, is installed <a href=\"/essentials/how-to-install-rakupp/\">separately<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Visit <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">the website of Rakudo<\/a> to download the version suitable for your operating system.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sources<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can download an installer for your system at <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">There exist versions for all major operating systems: Windows, Mac OS, and Linux.<\/span> <span class=\"sg\" data-s=\"2\">There are also source codes that you can compile yourself.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker images<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo is also available as a docker image.<\/span> <span class=\"sg\" data-s=\"1\">You can use it for both running programs and for testing small scripts in a REPL shell.<\/span> <span class=\"sg\" data-s=\"2\">Find all the instructions at <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Version numbers<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The Rakudo version numbering system forms the version number as a two-part number: the year and the month of the release date.<\/span> <span class=\"sg\" data-s=\"1\">You can easily see how fresh your compiler is.<\/span> <span class=\"sg\" data-s=\"2\">Run the following command line to see its version number:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can see three version numbers here.<\/span> <span class=\"sg\" data-s=\"1\">The first one is the version of Rakudo itself: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Then comes the version of the Raku language: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The updates will currently get the next letter as a minor version part, e.g., <code>v6.e<\/code>, etc. Finally, we see the name of the virtual machine used in this compiler: MoarVM version <code>2026.06<\/code>.<\/span><\/p>"]]},"de":{"t":"Wie man Rakudo installiert","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um ein Programm in Raku auszuführen, müssen Sie einen Compiler installiert haben.<\/span> <span class=\"sg\" data-s=\"1\">Besuchen Sie <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">die Website von Rakudo<\/a>, um die Version herunterzuladen, die für Ihr Betriebssystem geeignet ist.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt zwei Hauptoptionen.<\/span> <span class=\"sg\" data-s=\"1\">Sie können den Compiler selbst installieren oder eine Rakudo Star Suite (auch als Rakudo * geschrieben) installieren.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star enthält einen Paketmanager und einige nützliche Module.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können einen Installer für Ihr System unter <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a> herunterladen.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt Versionen für alle gängigen Betriebssysteme: Windows, Mac OS und Linux.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt auch Quellcodes, die Sie selbst kompilieren können.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es ist auch möglich, das Bundle Rakudo Star zu installieren, indem Sie den Installer ausführen, den Sie unter <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a> erhalten.<\/span> <span class=\"sg\" data-s=\"1\">Überprüfen Sie die Versionsnummer, bevor Sie es installieren.<\/span> <span class=\"sg\" data-s=\"2\">Sie können auch die Seite namens ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’ besuchen, um weitere Optionen zu sehen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-Images<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star ist als Docker-Image verfügbar.<\/span> <span class=\"sg\" data-s=\"1\">Sie können es sowohl zum Ausführen von Programmen als auch zum Testen kleiner Skripte in einer REPL-Shell verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Finden Sie alle Anweisungen unter <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versionsnummern<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Versionsnummernsystem von Rakudo bildet die Versionsnummer als eine zweigeteilte Zahl: das Jahr und den Monat des Veröffentlichungsdatums.<\/span> <span class=\"sg\" data-s=\"1\">Sie können leicht erkennen, wie aktuell Ihr Compiler ist.<\/span> <span class=\"sg\" data-s=\"2\">Führen Sie die folgende Befehlszeile aus, um die Versionsnummer zu sehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier sehen Sie drei Versionsnummern.<\/span> <span class=\"sg\" data-s=\"1\">Die erste ist die Version von Rakudo selbst: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dann folgt die Version der Raku-Sprache: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die Updates erhalten derzeit den nächsten Buchstaben als Teil der Nebenversionsnummer, z.B. <code>v6.e<\/code> usw. Schließlich sehen wir den Namen der virtuellen Maschine, die in diesem Compiler verwendet wird: MoarVM Version <code>2020.10<\/code>.<\/span><\/p>"]]},"nl":{"t":"Hoe Rakudo te installeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een programma in Raku uit te voeren, moet je een compiler geïnstalleerd hebben.<\/span> <span class=\"sg\" data-s=\"1\">Bezoek <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">de website van Rakudo<\/a> om de versie te downloaden die geschikt is voor jouw besturingssysteem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee hoofdopties.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt de compiler zelf installeren of een Rakudo Star-suite installeren (ook gespeld als Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star bevat een pakketbeheerder en een paar nuttige modules.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bronnen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt een installer voor jouw systeem downloaden op <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Er bestaan versies voor alle grote besturingssystemen: Windows, Mac OS en Linux.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn ook broncodes die je zelf kunt compileren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het is ook mogelijk om de bundel, Rakudo Star, te installeren door de installer uit te voeren die je krijgt op <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Controleer het versienummer voordat je het installeert.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ook de pagina genaamd ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’ bekijken om meer opties te zien.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-afbeeldingen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star is beschikbaar als een docker-afbeelding.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het gebruiken voor zowel het uitvoeren van programma's als voor het testen van kleine scripts in een REPL-shell.<\/span> <span class=\"sg\" data-s=\"2\">Vind alle instructies op <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het versienummeringssysteem van Rakudo vormt het versienummer als een tweedelig nummer: het jaar en de maand van de releasedatum.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt gemakkelijk zien hoe recent jouw compiler is.<\/span> <span class=\"sg\" data-s=\"2\">Voer de volgende opdrachtregel uit om het versienummer te zien:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je ziet hier drie versienummers.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste is de versie van Rakudo zelf: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vervolgens komt de versie van de Raku-taal: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De updates krijgen momenteel de volgende letter als een klein versieonderdeel, bijvoorbeeld <code>v6.e<\/code>, enz.<\/span> <span class=\"sg\" data-s=\"4\">Ten slotte zien we de naam van de virtuele machine die in deze compiler wordt gebruikt: MoarVM versie <code>2020.10<\/code>.<\/span><\/p>"]]},"es":{"t":"Cómo instalar Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para ejecutar un programa en Raku, necesitas tener un compilador instalado.<\/span> <span class=\"sg\" data-s=\"1\">Visita <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">el sitio web de Rakudo<\/a> para descargar la versión adecuada para tu sistema operativo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay dos opciones principales.<\/span> <span class=\"sg\" data-s=\"1\">Puedes instalar el compilador en sí mismo o instalar un paquete Rakudo Star (también escrito como Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star incluye un gestor de paquetes y algunos módulos útiles.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fuentes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes descargar un instalador para tu sistema en <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Existen versiones para todos los principales sistemas operativos: Windows, Mac OS y Linux.<\/span> <span class=\"sg\" data-s=\"2\">También hay códigos fuente que puedes compilar tú mismo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También es posible instalar el paquete, Rakudo Star, ejecutando el instalador que obtienes en <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Verifica el número de versión antes de instalarlo.<\/span> <span class=\"sg\" data-s=\"2\">También puedes consultar la página llamada ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">Paquetes de Rakudo Star de terceros<\/a>’ para ver más opciones.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Imágenes de Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star está disponible como una imagen de Docker.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usarla tanto para ejecutar programas como para probar pequeños scripts en una shell REPL.<\/span> <span class=\"sg\" data-s=\"2\">Encuentra todas las instrucciones en <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El sistema de numeración de versiones de Rakudo forma el número de versión como un número de dos partes: el año y el mes de la fecha de lanzamiento.<\/span> <span class=\"sg\" data-s=\"1\">Puedes ver fácilmente cuán reciente es tu compilador.<\/span> <span class=\"sg\" data-s=\"2\">Ejecuta la siguiente línea de comandos para ver su número de versión:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí puedes ver tres números de versión.<\/span> <span class=\"sg\" data-s=\"1\">El primero es la versión de Rakudo en sí: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Luego viene la versión del lenguaje Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Las actualizaciones actualmente obtendrán la siguiente letra como parte de la versión menor, por ejemplo, <code>v6.e<\/code>, etc. Finalmente, vemos el nombre de la máquina virtual utilizada en este compilador: MoarVM versión <code>2020.10<\/code>.<\/span><\/p>"]]},"it":{"t":"Come installare Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per eseguire un programma in Raku, è necessario avere un compilatore installato.<\/span> <span class=\"sg\" data-s=\"1\">Visita <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">il sito web di Rakudo<\/a> per scaricare la versione adatta al tuo sistema operativo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ci sono due opzioni principali.<\/span> <span class=\"sg\" data-s=\"1\">Puoi installare il compilatore stesso o installare una suite Rakudo Star (anche scritta come Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star include un gestore di pacchetti e alcuni moduli utili.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sorgenti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi scaricare un programma di installazione per il tuo sistema su <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Esistono versioni per tutti i principali sistemi operativi: Windows, Mac OS e Linux.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono anche codici sorgente che puoi compilare tu stesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">È anche possibile installare il pacchetto, Rakudo Star, eseguendo il programma di installazione che ottieni su <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Controlla il numero di versione prima di installarlo.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche controllare la pagina chiamata ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">Pacchetti Rakudo Star di terze parti<\/a>’ per vedere altre opzioni.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Immagini Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star è disponibile come immagine docker.<\/span> <span class=\"sg\" data-s=\"1\">Puoi usarla sia per eseguire programmi che per testare piccoli script in una shell REPL.<\/span> <span class=\"sg\" data-s=\"2\">Trova tutte le istruzioni su <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il sistema di numerazione delle versioni di Rakudo forma il numero di versione come un numero a due parti: l'anno e il mese della data di rilascio.<\/span> <span class=\"sg\" data-s=\"1\">Puoi facilmente vedere quanto è recente il tuo compilatore.<\/span> <span class=\"sg\" data-s=\"2\">Esegui la seguente riga di comando per vedere il suo numero di versione:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui puoi vedere tre numeri di versione.<\/span> <span class=\"sg\" data-s=\"1\">Il primo è la versione di Rakudo stessa: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi viene la versione del linguaggio Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Gli aggiornamenti attualmente otterranno la lettera successiva come parte della versione minore, ad esempio, <code>v6.e<\/code>, ecc. Infine, vediamo il nome della macchina virtuale utilizzata in questo compilatore: MoarVM versione <code>2020.10<\/code>.<\/span><\/p>"]]},"lv":{"t":"Kā instalēt Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai izpildītu programmu Raku valodā, jums ir jābūt instalētam kompilatoram.<\/span> <span class=\"sg\" data-s=\"1\">Apmeklējiet <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">Rakudo mājaslapu<\/a>, lai lejupielādētu versiju, kas ir piemērota jūsu operētājsistēmai.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir divas galvenās iespējas.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat instalēt tikai kompilatoru vai instalēt Rakudo Star komplektu (arī rakstīts kā Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star ietver pakotņu pārvaldnieku un dažus noderīgus moduļus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Avoti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat lejupielādēt instalētāju jūsu sistēmai <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ir pieejamas versijas visām galvenajām operētājsistēmām: Windows, Mac OS un Linux.<\/span> <span class=\"sg\" data-s=\"2\">Ir pieejami arī pirmkodi, kurus varat kompilēt pats.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams arī instalēt komplektu, Rakudo Star, palaidot instalētāju, kuru iegūstat <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Pirms instalēšanas pārbaudiet versijas numuru.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat arī apskatīt lapu ar nosaukumu ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’, lai redzētu vairāk iespēju.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker attēli<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star ir pieejams kā docker attēls.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to izmantot gan programmu izpildei, gan mazu skriptu testēšanai REPL čaulā.<\/span> <span class=\"sg\" data-s=\"2\">Visas instrukcijas atradīsiet <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo versiju numurēšanas sistēma veido versijas numuru kā divdaļīgu numuru: gads un mēnesis izlaišanas datumā.<\/span> <span class=\"sg\" data-s=\"1\">Jūs viegli varat redzēt, cik svaigs ir jūsu kompilators.<\/span> <span class=\"sg\" data-s=\"2\">Izpildiet šādu komandrindu, lai redzētu tā versijas numuru:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit jūs varat redzēt trīs versiju numurus.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais ir pašas Rakudo versija: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad nāk Raku valodas versija: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Atjauninājumi pašlaik iegūs nākamo burtu kā mazāko versijas daļu, piemēram, <code>v6.e<\/code> utt.<\/span> <span class=\"sg\" data-s=\"4\">Visbeidzot, mēs redzam virtuālās mašīnas nosaukumu, kas tiek izmantota šajā kompilatorā: MoarVM versija <code>2020.10<\/code>.<\/span><\/p>"]]},"ru":{"t":"Как установить Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы выполнить программу Raku, вам потребуется установить компилятор.<\/span> <span class=\"sg\" data-s=\"1\">Пройдите на <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">сайт Rakudo<\/a>, чтобы скачать подходящую версию для вашей операционной системы.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У вас есть две основные опции: вы можете установить сам компилятор, либо установить дистрибутив Rakudo Star (также называется Rakudo *).<\/span> <span class=\"sg\" data-s=\"1\">Rakudo Star включает в себя менеджер пакетов и несколько полезных модулей.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Источники<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете скачать установщик для вашей системы на сайте <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Есть версии для всех основных операционных систем: Windows, MacOS, Linux, а также имеется исходный код, который вы можете скомпилировать самостоятельно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив Rakudo Star также можно установить, скачав установщик на сайте <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Проверьте версию перед установкой.<\/span> <span class=\"sg\" data-s=\"2\">Также можете ознакомиться со страницей \"<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>\", где вы сможете найти сторонние способы установки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker образы<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star также доступен в образе Docker.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете его использовать для запуска программ и тестирования небольших скриптов в REPL.<\/span> <span class=\"sg\" data-s=\"2\">Все инструкции можно найти на сайте <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Система номеров версий Rakudo придерживается схемы из двух частей: год и месяц релиза.<\/span> <span class=\"sg\" data-s=\"1\">Вы легко можете увидеть, насколько новый у вас компилятор.<\/span> <span class=\"sg\" data-s=\"2\">Запустите следующую команду, чтобы узнать вашу версию:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Выше вы видите три разных версии.<\/span> <span class=\"sg\" data-s=\"1\">Первая версия относится к самому Rakudo: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затем следует версия языка Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Обновления языка на текущий момент следуют алфавитной схеме, следующая минорная версия будет <code>v6.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">И третьей по счету версией является версия виртуальной машины MoarVM, используемая этим компилятором: <code>2020.10<\/code>.<\/span><\/p>"]]},"uk":{"t":"Як встановити Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб виконати програму на Raku, вам потрібно мати встановлений компілятор.<\/span> <span class=\"sg\" data-s=\"1\">Відвідайте <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">вебсайт Rakudo<\/a>, щоб завантажити версію, яка підходить для вашої операційної системи.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Є два основні варіанти.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете встановити сам компілятор або встановити пакет Rakudo Star (також пишеться як Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star включає менеджер пакетів і кілька корисних модулів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Джерела<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете завантажити інсталятор для вашої системи на <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Існують версії для всіх основних операційних систем: Windows, Mac OS і Linux.<\/span> <span class=\"sg\" data-s=\"2\">Також є вихідні коди, які ви можете скомпілювати самостійно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Також можна встановити пакет Rakudo Star, запустивши інсталятор, який ви отримаєте на <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Перевірте номер версії перед встановленням.<\/span> <span class=\"sg\" data-s=\"2\">Ви також можете переглянути сторінку під назвою ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’, щоб побачити більше варіантів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker образи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star доступний як Docker образ.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете використовувати його як для запуску програм, так і для тестування невеликих скриптів у REPL оболонці.<\/span> <span class=\"sg\" data-s=\"2\">Знайдіть усі інструкції на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Система нумерації версій Rakudo формує номер версії як двочастинний номер: рік і місяць дати випуску.<\/span> <span class=\"sg\" data-s=\"1\">Ви легко можете побачити, наскільки свіжий ваш компілятор.<\/span> <span class=\"sg\" data-s=\"2\">Виконайте наступну команду, щоб побачити його номер версії:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут ви можете побачити три номери версій.<\/span> <span class=\"sg\" data-s=\"1\">Перший - це версія самого Rakudo: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Далі йде версія мови Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оновлення наразі отримують наступну літеру як частину мінорної версії, наприклад, <code>v6.e<\/code> і т.д. Нарешті, ми бачимо назву віртуальної машини, яка використовується в цьому компіляторі: MoarVM версії <code>2020.10<\/code>.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да изпълните програма в Raku, трябва да имате инсталиран компилатор.<\/span> <span class=\"sg\" data-s=\"1\">Посетете <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">уебсайта на Rakudo<\/a>, за да изтеглите версията, подходяща за вашата операционна система.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има два основни варианта.<\/span> <span class=\"sg\" data-s=\"1\">Можете да инсталирате самия компилатор или да инсталирате Rakudo Star пакет (също изписван като Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star включва мениджър на пакети и няколко полезни модула.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Източници<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да изтеглите инсталатор за вашата система от <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Съществуват версии за всички основни операционни системи: Windows, Mac OS и Linux.<\/span> <span class=\"sg\" data-s=\"2\">Има и изходни кодове, които можете да компилирате сами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Също така е възможно да инсталирате пакета Rakudo Star, като стартирате инсталатора, който ще получите от <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Проверете номера на версията преди да го инсталирате.<\/span> <span class=\"sg\" data-s=\"2\">Можете също така да проверите страницата, наречена ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’, за да видите повече опции.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker изображения<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star е наличен като Docker изображение.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го използвате както за изпълнение на програми, така и за тестване на малки скриптове в REPL shell.<\/span> <span class=\"sg\" data-s=\"2\">Намерете всички инструкции на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версии<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Системата за номериране на версиите на Rakudo формира номера на версията като двукомпонентен номер: годината и месеца на датата на издаване.<\/span> <span class=\"sg\" data-s=\"1\">Лесно можете да видите колко е свеж вашият компилатор.<\/span> <span class=\"sg\" data-s=\"2\">Изпълнете следната командна линия, за да видите номера на версията:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук можете да видите три номера на версии.<\/span> <span class=\"sg\" data-s=\"1\">Първият е версията на самия Rakudo: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След това идва версията на езика Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Актуализациите в момента ще получат следващата буква като част от малката версия, например <code>v6.e<\/code> и т.н.<\/span> <span class=\"sg\" data-s=\"4\">Накрая виждаме името на виртуалната машина, използвана в този компилатор: MoarVM версия <code>2020.10<\/code>.<\/span><\/p>"]]},"eo":{"t":"Kiel instali Rakudo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por ekzekuti programon en Raku, vi devas havi kompililon instalitan.<\/span> <span class=\"sg\" data-s=\"1\">Vizitu <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">la retejon de Rakudo<\/a> por elŝuti la version taŭgan por via operaciumo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas du ĉefaj opcioj.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas instali la kompililon mem aŭ instali Rakudo Star suito (ankaŭ literumita kiel Rakudo *).<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star inkluzivas pakaĵadministrilon kaj kelkajn utilajn modulojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas elŝuti instalilon por via sistemo ĉe <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Estas versioj por ĉiuj ĉefaj operaciumoj: Vindozo, Mac OS, kaj Linukso.<\/span> <span class=\"sg\" data-s=\"2\">Estas ankaŭ fontkodoj, kiujn vi povas kompili mem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eblas ankaŭ instali la pakaĵon, Rakudo Star, per rulado de la instalilo, kiun vi ricevas ĉe <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Kontrolu la versian numeron antaŭ ol instali ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas kontroli la paĝon nomitan ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’ por vidi pli da opcioj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker bildoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star estas disponebla kiel docker bildo.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĝin por ambaŭ rulado de programoj kaj por testado de malgrandaj skriptoj en REPL ŝelo.<\/span> <span class=\"sg\" data-s=\"2\">Trovu ĉiujn instrukciojn ĉe <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiaj numeroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La Rakudo versia numeriga sistemo formas la versian numeron kiel du-partan numeron: la jaro kaj la monato de la eldondato.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas facile vidi kiel freŝa estas via kompililo.<\/span> <span class=\"sg\" data-s=\"2\">Rulu la jenan komandlinion por vidi ĝian versian numeron:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi povas vidi tri versiajn numerojn ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la versio de Rakudo mem: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste venas la versio de la Raku lingvo: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La ĝisdatigoj nuntempe ricevos la sekvan literon kiel minoran versian parton, ekz., <code>v6.e<\/code>, ktp.<\/span> <span class=\"sg\" data-s=\"4\">Fine, ni vidas la nomon de la virtuala maŝino uzata en ĉi tiu kompililo: MoarVM versio <code>2020.10<\/code>.<\/span><\/p>"]]},"la":{"t":"Quomodo Rakudo installare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad programmam in Raku exsequendum, necesse est compilatorem habere.<\/span> <span class=\"sg\" data-s=\"1\">Visita <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">situm Rakudo<\/a> ut versionem idoneam pro tuo systemate operante deponas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Duae sunt optiones principales.<\/span> <span class=\"sg\" data-s=\"1\">Potes compilatorem ipsum installare aut Rakudo Star suite (etiam scriptum Rakudo *) installare.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo Star includit procuratorem fasciculorum et pauca modula utilia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Potes installer pro tuo systemate apud <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a> deponere.<\/span> <span class=\"sg\" data-s=\"1\">Versiones pro omnibus maioribus systematibus operantibus existunt: Windows, Mac OS, et Linux.<\/span> <span class=\"sg\" data-s=\"2\">Sunt etiam codices fontes quos ipse compilare potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rakudo Star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Etiam possibile est fasciculum, Rakudo Star, installare, currendo installer quem apud <a href=\"https://rakudo.org/star\" target=\"_blank\" rel=\"noopener\">rakudo.org/star<\/a> accipis.<\/span> <span class=\"sg\" data-s=\"1\">Versionis numerum antequam id installes inspice.<\/span> <span class=\"sg\" data-s=\"2\">Potes etiam paginam appellatam ‘<a href=\"https://rakudo.org/star/third-party\" target=\"_blank\" rel=\"noopener\">3rd-Party Rakudo Star Bundle Packages<\/a>’ inspicere ut plures optiones videas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Imagines Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star ut imago docker praesto est.<\/span> <span class=\"sg\" data-s=\"1\">Uti potes ad programmata currenda et ad parvos scriptores in REPL testa probandos.<\/span> <span class=\"sg\" data-s=\"2\">Omnes instructiones apud <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Systema numerandi versionum Rakudo numerum versionis format ut numerus bipartitus: annus et mensis diei emissionis.<\/span> <span class=\"sg\" data-s=\"1\">Facile videre potes quam recens sit tuus compilator.<\/span> <span class=\"sg\" data-s=\"2\">Curras sequentem mandatum ut numerum versionis videas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tres numeros versionum hic videre potes.<\/span> <span class=\"sg\" data-s=\"1\">Primus est numerus versionis Rakudo ipsius: <code>v2020.10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deinde venit numerus versionis linguae Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Renovationes nunc litteram proximam ut partem minoris versionis accipient, e.g., <code>v6.e<\/code>, etc. Denique, nomen machinae virtualis in hoc compilatore usae videmus: MoarVM versio <code>2020.10<\/code>.<\/span><\/p>"]]}}}</script>
