 prefijo <code>+<\/code><\/a> requiere un valor numérico de su argumento, por lo que el resultado de <code>+@ciudades<\/code> es <code>3<\/code>.<\/span><\/p>"]]},"it":{"t":"Array","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Gli array sono tipi di dati aggregati che possono contenere più di un valore.<\/span> <span class=\"sg\" data-s=\"1\">Questo differenzia gli array dagli <a href=\"https://course.raku.org/it/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">elementi scalari<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Gli elementi di un array possono essere indicizzati (o <em>sottoscritti<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">In altre parole, i suoi elementi hanno una posizione (il che spiega il nome generale per questo tipo di dati: posizionali).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le variabili array utilizzano un altro tipo di sigillo: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Le regole per il nome della variabile sono le stesse <a href=\"https://course.raku.org/it/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">degli scalari<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora, l'array chiamato <code>@cities<\/code> è stato creato.<\/span> <span class=\"sg\" data-s=\"1\">Puoi riempirlo con alcuni valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Parigi', 'Roma', 'Berlino';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In alternativa, è possibile inizializzare i valori immediatamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Parigi', 'Roma', 'Berlino';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indicizzazione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per accedere a un singolo elemento di un array, usa una coppia di parentesi quadre che posizioni dopo il nome della variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che il sigillo rimane sempre lo stesso.<\/span> <span class=\"sg\" data-s=\"1\">Poiché gli elementi sono contati da zero, l'elemento <code>@cities[1]<\/code> è <code>'Roma'<\/code> nel nostro esempio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli array sono mutabili, quindi puoi facilmente modificare i loro elementi semplicemente assegnando loro un nuovo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Roma';\n@cities[1] = 'Parigi';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo questo, l'istruzione <code>say @cities[1]<\/code> stamperà il nuovo valore <code>'Parigi'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dimensione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per ottenere la lunghezza attuale di un array, o, in altre parole, il numero dei suoi elementi, usa il metodo <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se l'array appare in un contesto in cui il parametro previsto è un numero, il valore restituito è la dimensione dell'array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui, l'<a href=\"https://course.raku.org/it/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\">operatore prefisso <code>+<\/code><\/a> richiede un valore numerico dal suo argomento, quindi il risultato di <code>+@cities<\/code> è <code>3<\/code>.<\/span><\/p>"]]},"lv":{"t":"Masīvi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Masīvi ir agregātu datu tipi, kas var saturēt vairāk nekā vienu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tas atšķir masīvus no <a href=\"https://course.raku.org/lv/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalārajiem elementiem<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Masīva elementus var indeksēt (vai <em>apzīmēt ar apakšindeksiem<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Citiem vārdiem sakot, tā elementiem ir pozīcija (kas izskaidro vispārējo nosaukumu šāda veida datiem: pozicionālie dati).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīva mainīgajiem tiek izmantots cits sigils: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Noteikumi mainīgā nosaukumam ir tādi paši kā <a href=\"https://course.raku.org/lv/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">skalārajiem mainīgajiem<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Līdz šim ir izveidots masīvs ar nosaukumu <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to aizpildīt ar dažām vērtībām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Parīze', 'Roma', 'Berlīne';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alternatīvi, ir iespējams uzreiz inicializēt vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Parīze', 'Roma', 'Berlīne';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksēšana<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai piekļūtu vienam masīva elementam, izmantojiet pāri iekavu, kuras novietojat pēc mainīgā nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka sigils vienmēr paliek nemainīgs.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā elementi tiek skaitīti no nulles, elements <code>@cities[1]<\/code> mūsu piemērā ir <code>'Roma'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Masīvi ir maināmi, tāpēc jūs varat viegli modificēt to elementus, vienkārši piešķirot tiem jaunu vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Roma';\n@cities[1] = 'Parīze';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc tam izteiksme <code>say @cities[1]<\/code> izdrukās jauno vērtību <code>'Parīze'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izmērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu pašreizējo masīva garumu, vai, citiem vārdiem sakot, tā elementu skaitu, izmantojiet metodi <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja masīvs parādās kontekstā, kur gaidāms skaitlisks parametrs, atgrieztā vērtība ir masīva izmērs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit, <a href=\"https://course.raku.org/lv/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> prefiksa operators<\/a> pieprasa skaitlisku vērtību no tā argumenta, tāpēc <code>+@cities<\/code> rezultāts ir <code>3<\/code>.<\/span><\/p>"]]},"ru":{"t":"Массивы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Массивы — это агрегированные типы данных, которые могут содержать более одного значения.<\/span> <span class=\"sg\" data-s=\"1\">Это отличает массивы от <a href=\"https://course.raku.org/ru/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярных элементов<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Элементы массива могут быть индексированы (или <em>субскриптированы<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Другими словами, их элементы имеют позицию (что объясняет общее название для этого типа данных: позиционные).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Массивные переменные используют другой тип сигила: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правила для имени переменной такие же, как <a href=\"https://course.raku.org/ru/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">для скаляров<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До сих пор массив с именем <code>@cities<\/code> был создан.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете заполнить его некоторыми значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кроме того, можно сразу инициализировать значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексация<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить доступ к отдельному элементу массива, используйте пару скобок, которые вы размещаете после имени переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что сигил всегда остается тем же.<\/span> <span class=\"sg\" data-s=\"1\">Так как элементы считаются с нуля, элемент <code>@cities[1]<\/code> в нашем примере — это <code>'Rome'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Массивы изменяемы, поэтому вы можете легко изменить их элементы, просто присвоив им новое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После этого оператор <code>say @cities[1]<\/code> выведет новое значение <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Размер<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить текущую длину массива, или, другими словами, количество его элементов, используйте метод <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если массив появляется в контексте, где ожидается числовой параметр, возвращаемое значение — это размер массива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь, <a href=\"https://course.raku.org/ru/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> префиксный оператор<\/a> требует числовое значение от своего аргумента, поэтому результатом <code>+@cities<\/code> будет <code>3<\/code>.<\/span><\/p>"]]},"uk":{"t":"Масиви","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Масиви — це агрегатні типи даних, які можуть зберігати більше одного значення.<\/span> <span class=\"sg\" data-s=\"1\">Це відрізняє масиви від <a href=\"https://course.raku.org/uk/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярних елементів<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Елементи масиву можуть бути індексовані (або <em>підписані<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Іншими словами, їхні елементи мають позицію (що пояснює загальну назву для цього типу даних: позиційні).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивні змінні використовують інший вид сигіла: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правила для імені змінної такі ж, як <a href=\"https://course.raku.org/uk/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">для скалярів<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дотепер масив з назвою <code>@cities<\/code> був створений.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете заповнити його деякими значеннями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Альтернативно, можна ініціалізувати значення одразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Індексація<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати доступ до окремого елемента масиву, використовуйте пару дужок, які ви розміщуєте після імені змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що сигіл завжди залишається тим самим.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки елементи рахуються з нуля, елемент <code>@cities[1]<\/code> у нашому прикладі — це <code>'Rome'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Масиви є змінними, тому ви можете легко змінювати їхні елементи, просто присвоюючи їм нове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після цього оператор <code>say @cities[1]<\/code> виведе нове значення <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Розмір<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати поточну довжину масиву, або, іншими словами, кількість його елементів, використовуйте метод <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо масив з'являється в контексті, де очікується числовий параметр, повернуте значення — це розмір масиву:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут, <a href=\"https://course.raku.org/uk/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> префіксний оператор<\/a> вимагає числового значення від свого аргументу, тому результатом <code>+@cities<\/code> є <code>3<\/code>.<\/span><\/p>"]]},"bg":{"t":"Масиви","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Масивите са агрегатни типове данни, които могат да съдържат повече от една стойност.<\/span> <span class=\"sg\" data-s=\"1\">Това ги различава от <a href=\"https://course.raku.org/bg/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скаларните елементи<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Елементите на масива могат да бъдат индексирани (или <em>подписани<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">С други думи, техните елементи имат позиция (което обяснява общото име за този вид данни: позиционни).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивните променливи използват друг вид сигил: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правилата за името на променливата са същите като <a href=\"https://course.raku.org/bg/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">за скаларите<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Досега е създаден масив с име <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го запълните с някои стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Алтернативно, възможно е да инициализирате стойностите веднага:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да получите достъп до един елемент от масива, използвайте чифт скоби, които поставяте след името на променливата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че сигилът винаги остава същият.<\/span> <span class=\"sg\" data-s=\"1\">Тъй като елементите се броят от нула, елементът <code>@cities[1]<\/code> е <code>'Rome'<\/code> в нашия пример.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Масивите са променливи, така че можете лесно да модифицирате техните елементи, като просто им присвоите нова стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След това, изразът <code>say @cities[1]<\/code> ще отпечата новата стойност <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Размер<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да получите текущата дължина на масива, или, с други думи, броя на неговите елементи, използвайте метода <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако масивът се появи в контекст, където очакваният параметър е число, върнатата стойност е размерът на масива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук, <a href=\"https://course.raku.org/bg/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> префиксният оператор<\/a> изисква числова стойност от своя аргумент, така че резултатът от <code>+@cities<\/code> е <code>3<\/code>.<\/span><\/p>"]]},"eo":{"t":"Arrayoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Arrays estas agregitaj datumtipoj, kiuj povas enhavi pli ol unu valoron.<\/span> <span class=\"sg\" data-s=\"1\">Tio diferencigas arrays de <a href=\"https://course.raku.org/eo/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalaj elementoj<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Array-elementoj povas esti indeksitaj (aŭ <em>subskribitaj<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Alivorte, ĝiaj elementoj havas pozicion (kio klarigas la ĝeneralan nomon por ĉi tiu speco de datumoj: poziciaj).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Array-variabloj uzas alian specon de sigelo: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La reguloj por la variablonomo estas la samaj kiel <a href=\"https://course.raku.org/eo/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">por skaloj<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @urboj;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, la array nomata <code>@urboj<\/code> estis kreita.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas plenigi ĝin per kelkaj valoroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@urboj = 'Parizo', 'Romo', 'Berlino';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alternative, eblas tuj inicializi la valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @urboj = 'Parizo', 'Romo', 'Berlino';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksado<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por aliri unuopan elementon de array, uzu paron de krampoj, kiujn vi metas post la nomo de la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>diru @urboj[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la sigelo ĉiam restas la sama.<\/span> <span class=\"sg\" data-s=\"1\">Ĉar elementoj estas nombritaj ekde nulo, la elemento <code>@urboj[1]<\/code> estas <code>'Romo'<\/code> en nia ekzemplo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Arrays estas ŝanĝeblaj, do vi povas facile modifi iliajn elementojn simple asignante novan valoron al ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@urboj[0] = 'Romo';\n@urboj[1] = 'Parizo';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post tio, la deklaro <code>diru @urboj[1]<\/code> presos la novan valoron <code>'Parizo'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Grandeco<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por akiri la aktualan longecon de array, aŭ, alivorte, la nombron de ĝiaj elementoj, uzu la metodon <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>diru @urboj.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la array aperas en kunteksto, kie la atendata parametro estas nombro, la revena valoro estas la grandeco de la array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>diru +@urboj; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la <a href=\"https://course.raku.org/eo/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> prefiksa operaciilo<\/a> postulas numeran valoron de sia argumento, do la rezulto de <code>+@urboj<\/code> estas <code>3<\/code>.<\/span><\/p>"]]},"la":{"t":"Array","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Arrayes sunt aggregata genera datorum quae plus quam unam valorem continere possunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc arrays a <a href=\"https://course.raku.org/la/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">scalaribus elementis<\/a> distinguit.<\/span> <span class=\"sg\" data-s=\"2\">Elementa array possunt indicari (vel <em>subscripti<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Aliis verbis, elementa eius positionem habent (quod explicat nomen generale huius generis datorum: positionalia).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabiles array alium genus sigilli utuntur: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Regulae pro nomine variabili sunt eadem ac <a href=\"https://course.raku.org/la/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">pro scalaribus<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hactenus, array nomine <code>@cities<\/code> creatum est.<\/span> <span class=\"sg\" data-s=\"1\">Potes eam cum aliquibus valoribus implere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aliter, possibile est valores statim initializare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indexatio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad accessum singuli item array, utere paria bracketorum quae post nomen variabilis ponis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod sigillum semper idem manet.<\/span> <span class=\"sg\" data-s=\"1\">Cum elementa a zero numerentur, elementum <code>@cities[1]<\/code> est <code>'Rome'<\/code> in nostro exemplo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Arrayes sunt mutabiles, ita facile potes elementa eius mutare simpliciter assignando novum valorem eis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post hoc, sententia <code>say @cities[1]<\/code> novum valorem <code>'Paris'<\/code> imprimet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Magnitudo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad longitudinem currentem array obtinendam, vel, aliis verbis, numerum elementorum eius, utere methodo <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si array apparet in contextu, ubi parameter expectatus est numerus, valor reditus est magnitudo array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic, <a href=\"https://course.raku.org/la/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> praefixus operator<\/a> numericum valorem ex argumento suo requirit, ita resultat <code>+@cities<\/code> est <code>3<\/code>.<\/span><\/p>"]]}}}</script>
