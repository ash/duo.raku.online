<script type="application/json" id="page-data">{"u":"essentials/positionals/interpolating-arrays","n":215,"k":"topic","pv":"essentials/positionals/args-array/quiz","nx":"essentials/positionals/interpolating-arrays/quiz","tr":["essentials","essentials/positionals"],"L":{"en":{"t":"Interpolating arrays","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">To interpolate array elements in double-quoted strings, write them as you do in a program itself: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To interpolate the whole array, add a pair of empty brackets: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The following program illustrates this approach:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"First: @data[0], last: @data[1]\";\nsay \"All elements: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints the requested data:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nFirst: 10, last: 20\nAll elements: 10 20 30<\/code><\/pre>"]]},"de":{"t":"Interpolation von Arrays","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Um Array-Elemente in doppelt-quotierten Zeichenketten zu interpolieren, schreiben Sie es so, wie Sie es in einem Programm selbst tun würden: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Um das gesamte Array zu interpolieren, fügen Sie ein Paar leere Klammern hinzu: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das folgende Programm veranschaulicht diesen Ansatz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Erstes: @data[0], letztes: @data[1]\";\nsay \"Alle Elemente: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt die angeforderten Daten aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nErstes: 10, letztes: 20\nAlle Elemente: 10 20 30<\/code><\/pre>"]]},"nl":{"t":"Interpolatie van arrays","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Om array-elementen te interpoleren in dubbel-quote strings, schrijf je het zoals je dat in een programma zelf doet: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Om de hele array te interpoleren, voeg je een paar lege haakjes toe: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende programma illustreert deze aanpak:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Eerste: @data[0], laatste: @data[1]\";\nsay \"Alle elementen: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma print de gevraagde gegevens:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nEerste: 10, laatste: 20\nAlle elementen: 10 20 30<\/code><\/pre>"]]},"es":{"t":"Interpolar arrays","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Para interpolar elementos de un arreglo en cadenas de texto con comillas dobles, escríbelo como lo harías en el propio programa: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para interpolar todo el arreglo, añade un par de corchetes vacíos: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente programa ilustra este enfoque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Primero: @data[0], último: @data[1]\";\nsay \"Todos los elementos: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime los datos solicitados:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nPrimero: 10, último: 20\nTodos los elementos: 10 20 30<\/code><\/pre>"]]},"it":{"t":"Interpolazione degli array","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per interpolare gli elementi di un array nelle stringhe con doppi apici, scrivilo come faresti in un programma stesso: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per interpolare l'intero array, aggiungi un paio di parentesi vuote: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il seguente programma illustra questo approccio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"First: @data[0], last: @data[1]\";\nsay \"All elements: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa i dati richiesti:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nFirst: 10, last: 20\nAll elements: 10 20 30<\/code><\/pre>"]]},"lv":{"t":"Masīvu interpolācija","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai interpolētu masīva elementus dubultpēdiņu virknēs, rakstiet to tāpat kā programmā: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lai interpolētu visu masīvu, pievienojiet pāri tukšu iekavu: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šī programma ilustrē šo pieeju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Pirmais: @data[0], pēdējais: @data[1]\";\nsay \"Visi elementi: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā pieprasītos datus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nPirmais: 10, pēdējais: 20\nVisi elementi: 10 20 30<\/code><\/pre>"]]},"ru":{"t":"Интерполяция массивов","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы интерполировать элементы массива в строках с двойными кавычками, пишите это так же, как в самой программе: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы интерполировать весь массив, добавьте пару пустых скобок: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следующая программа иллюстрирует этот подход:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"First: @data[0], last: @data[1]\";\nsay \"All elements: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа выводит запрашиваемые данные:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nFirst: 10, last: 20\nAll elements: 10 20 30<\/code><\/pre>"]]},"uk":{"t":"Інтерполяція масивів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб інтерполювати елементи масиву в рядках з подвійними лапками, пишіть це так, як у самій програмі: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щоб інтерполювати весь масив, додайте пару порожніх дужок: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Наступна програма ілюструє цей підхід:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Перший: @data[0], останній: @data[1]\";\nsay \"Всі елементи: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить запитувані дані:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nПерший: 10, останній: 20\nВсі елементи: 10 20 30<\/code><\/pre>"]]},"bg":{"t":"Интерполация на масиви","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За да интерполирате елементи на масив в низове с двойни кавички, напишете го както бихте го направили в самата програма: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За да интерполирате целия масив, добавете чифт празни скоби: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следната програма илюстрира този подход:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Първи: @data[0], последен: @data[1]\";\nsay \"Всички елементи: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва заявените данни:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nПърви: 10, последен: 20\nВсички елементи: 10 20 30<\/code><\/pre>"]]},"eo":{"t":"Interpolante tabelojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por interpoligi elementojn de tabeloj en duoble-cititaj ŝnuroj, skribu ĝin kiel vi farus en programo mem: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por interpoligi la tutan tabelon, aldonu paron da malplenaj krampoj: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La sekva programo ilustras ĉi tiun aliron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"First: @data[0], last: @data[1]\";\nsay \"All elements: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas la petitan datumon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nFirst: 10, last: 20\nAll elements: 10 20 30<\/code><\/pre>"]]},"la":{"t":"Interpolando array","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ad interpolare elementa array in chordis duplicatis-quoted scribe sicut in ipso programmate: <code>@data[1]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ad interpolare totum array, adde paria vacua bracket: <code>@data[]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sequens programma hunc modum illustrat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\n\nsay \"Primus: @data[0], ultimus: @data[1]\";\nsay \"Omnes elementa: @data[]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma data postulata imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nPrimus: 10, ultimus: 20\nOmnes elementa: 10 20 30<\/code><\/pre>"]]}}}</script>
