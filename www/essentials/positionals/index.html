<script type="application/json" id="page-data">{"u":"essentials/positionals","n":208,"k":"section","pv":"essentials/typed-variables/exercises/input-number/solution","nx":"essentials/positionals/arrays","tr":["essentials"],"L":{"en":{"t":"Positional data types","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">It is time to talk about more complex data types.<\/span> <span class=\"sg\" data-s=\"1\">Positional data types in Raku are those that can be indexed (or <em>subscripted<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">We already met one of the representatives of this class of data type: <a href=\"/essentials/ranges/\">ranges<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In this section, we introduce two more positional data types: <code>Array<\/code> and <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">More in-depth information will follow up in the second part.<\/span> <span class=\"sg\" data-s=\"2\">We also take a second look at ranges in light of them being a positional data type.<\/span><\/p>"]]},"de":{"t":"Positionale Datentypen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Es ist an der Zeit, über komplexere Datentypen zu sprechen.<\/span> <span class=\"sg\" data-s=\"1\">Positionsdaten-Typen in Raku sind solche, die indiziert (oder <em>subskriptiert<\/em>) werden können.<\/span> <span class=\"sg\" data-s=\"2\">Wir haben bereits einen Vertreter dieser Klasse von Datentypen kennengelernt: <a href=\"https://course.raku.org/de/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">Ranges<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt stellen wir zwei weitere Positionsdaten-Typen vor: <code>Array<\/code> und <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ausführlichere Informationen folgen im zweiten Teil.<\/span> <span class=\"sg\" data-s=\"2\">Wir werfen auch einen zweiten Blick auf Ranges im Hinblick darauf, dass sie ein Positionsdaten-Typ sind.<\/span><\/p>"]]},"nl":{"t":"Positionele datentypen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het is tijd om te praten over complexere gegevenstypen.<\/span> <span class=\"sg\" data-s=\"1\">Positionele gegevenstypen in Raku zijn die welke geïndexeerd (of <em>gesubscript<\/em>) kunnen worden.<\/span> <span class=\"sg\" data-s=\"2\">We hebben al een van de vertegenwoordigers van deze klasse van gegevenstypen ontmoet: <a href=\"https://course.raku.org/nl/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">reeksen<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In deze sectie introduceren we twee andere positionele gegevenstypen: <code>Array<\/code> en <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Meer diepgaande informatie volgt in het tweede deel.<\/span> <span class=\"sg\" data-s=\"2\">We bekijken ook nogmaals reeksen in het licht van hun positie als positioneel gegevenstype.<\/span><\/p>"]]},"es":{"t":"Tipos de datos posicionales","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Es hora de hablar sobre tipos de datos más complejos.<\/span> <span class=\"sg\" data-s=\"1\">Los tipos de datos posicionales en Raku son aquellos que pueden ser indexados (o <em>subscriptados<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Ya conocimos a uno de los representantes de esta clase de tipo de datos: <a href=\"https://course.raku.org/es/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">rangos<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En esta sección, presentamos dos tipos de datos posicionales más: <code>Array<\/code> y <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Información más detallada seguirá en la segunda parte.<\/span> <span class=\"sg\" data-s=\"2\">También echamos un segundo vistazo a los rangos a la luz de ser un tipo de dato posicional.<\/span><\/p>"]]},"it":{"t":"Tipi di dati posizionali","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">È il momento di parlare di tipi di dati più complessi.<\/span> <span class=\"sg\" data-s=\"1\">I tipi di dati posizionali in Raku sono quelli che possono essere indicizzati (o <em>sottoscritti<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Abbiamo già incontrato uno dei rappresentanti di questa classe di tipi di dati: <a href=\"https://course.raku.org/it/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalli<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In questa sezione, introduciamo due ulteriori tipi di dati posizionali: <code>Array<\/code> e <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Informazioni più approfondite seguiranno nella seconda parte.<\/span> <span class=\"sg\" data-s=\"2\">Inoltre, daremo una seconda occhiata agli intervalli alla luce del fatto che sono un tipo di dato posizionale.<\/span><\/p>"]]},"lv":{"t":"Pozicionālie datu tipi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir pienācis laiks runāt par sarežģītākiem datu tipiem.<\/span> <span class=\"sg\" data-s=\"1\">Pozicionālie datu tipi Raku ir tie, kurus var indeksēt (vai <em>subscriptēt<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Mēs jau esam iepazinušies ar vienu no šīs datu tipu klases pārstāvjiem: <a href=\"https://course.raku.org/lv/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">diapazoni<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā mēs iepazīstinām ar vēl diviem pozicionālajiem datu tipiem: <code>Array<\/code> un <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Detalizētāka informācija sekos otrajā daļā.<\/span> <span class=\"sg\" data-s=\"2\">Mēs arī atkārtoti aplūkosim diapazonus, ņemot vērā to, ka tie ir pozicionālie datu tipi.<\/span><\/p>"]]},"ru":{"t":"Позиционные типы данных","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пришло время поговорить о более сложных типах данных.<\/span> <span class=\"sg\" data-s=\"1\">Позиционные типы данных в Raku — это те, которые могут быть индексированы (или <em>субскриптированы<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Мы уже встретили одного из представителей этого класса типов данных: <a href=\"https://course.raku.org/ru/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">диапазоны<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом разделе мы представим еще два позиционных типа данных: <code>Array<\/code> и <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Более подробная информация будет представлена во второй части.<\/span> <span class=\"sg\" data-s=\"2\">Мы также снова рассмотрим диапазоны с точки зрения их как позиционного типа данных.<\/span><\/p>"]]},"uk":{"t":"Позиційні типи даних","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Час поговорити про більш складні типи даних.<\/span> <span class=\"sg\" data-s=\"1\">Типи даних з позиційною індексацією в Raku — це ті, які можна індексувати (або <em>субскриптувати<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Ми вже зустрічали одного з представників цього класу типів даних: <a href=\"https://course.raku.org/uk/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">діапазони<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі ми представимо ще два типи даних з позиційною індексацією: <code>Array<\/code> і <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Більш детальна інформація буде надана у другій частині.<\/span> <span class=\"sg\" data-s=\"2\">Ми також ще раз розглянемо діапазони з точки зору їх як типу даних з позиційною індексацією.<\/span><\/p>"]]},"bg":{"t":"Позиционни типове данни","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Време е да говорим за по-сложни типове данни.<\/span> <span class=\"sg\" data-s=\"1\">Типовете данни с позиция в Raku са тези, които могат да бъдат индексирани (или <em>подписани<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Вече срещнахме един от представителите на този клас типове данни: <a href=\"https://course.raku.org/bg/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">интервали<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В този раздел ще представим още два типа данни с позиция: <code>Array<\/code> и <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">По-задълбочена информация ще последва във втората част.<\/span> <span class=\"sg\" data-s=\"2\">Също така ще разгледаме отново интервалите в светлината на това, че са тип данни с позиция.<\/span><\/p>"]]},"eo":{"t":"Poziciaj datentipoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas tempo paroli pri pli kompleksaj datumtipoj.<\/span> <span class=\"sg\" data-s=\"1\">Poziciaj datumtipoj en Raku estas tiuj, kiuj povas esti indeksitaj (aŭ <em>subskribitaj<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Ni jam renkontis unu el la reprezentantoj de ĉi tiu klaso de datumtipo: <a href=\"https://course.raku.org/eo/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervaloj<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu sekcio, ni enkondukas du pliajn poziciajn datumtipojn: <code>Array<\/code> kaj <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pli detala informo sekvos en la dua parto.<\/span> <span class=\"sg\" data-s=\"2\">Ni ankaŭ rigardas denove intervalojn konsiderante ilin kiel poziciajn datumtipojn.<\/span><\/p>"]]},"la":{"t":"Positionalia data genera","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tempus est loqui de typis datis magis complexis.<\/span> <span class=\"sg\" data-s=\"1\">Typi data positionis in Raku sunt illi qui indicari possunt (vel <em>subscripti<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Iam unum ex repraesentativis huius classis typi datae convenimus: <a href=\"https://course.raku.org/la/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalla<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In hac sectione, duos alios typos data positionis introducimus: <code>Array<\/code> et <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Magis informationes profundiores in secunda parte sequentur.<\/span> <span class=\"sg\" data-s=\"2\">Etiam iterum spectamus ad intervalla in luce eorum quod sunt typus data positionis.<\/span><\/p>"]]}}}</script>
