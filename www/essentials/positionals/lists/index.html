e>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така спроба викликає виняток:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Неможливо змінити незмінний список ((1 3 5 7 9))       в блоці &lt;unit&gt; на t.raku рядок 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Призначення списку масиву<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що відбувається, коли ви зберігаєте список у змінній з сигілом <code>@<\/code>?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У цьому випадку змінна <code>@data<\/code> містить масив, і ви можете змінювати його елементи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Змінна проти списку<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що той факт, що списки є незмінними, не означає, що ви не можете повторно використовувати змінну, яка їх зберігає.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"bg":{"t":"Списъци","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Списъците са подобни на масиви, но са неизменяеми.<\/span> <span class=\"sg\" data-s=\"1\">Не е възможно да се променя размерът или елементите на списък.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте скоби, за да създадете списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране на списъци<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да достъпите отделни елементи на списък, използвайте квадратни скоби с индекса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Въпреки това, не е възможно да зададете нова стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Не е ОК<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такъв опит предизвиква изключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Не може да се модифицира неизменяем списък ((1 3 5 7 9))       в блок &lt;unit&gt; на t.raku, ред 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Присвояване на списък на масив<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво се случва, когато запазите списък в променлива със сигил <code>@<\/code>?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В този случай, променливата <code>@data<\/code> съдържа масив и можете да модифицирате неговите елементи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Променлива срещу списък<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че фактът, че списъците са неизменяеми, не означава, че не можете да използвате повторно променливата, която го съдържа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"eo":{"t":"Listoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Listoj estas similaj al tabeloj sed estas nemodifikeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Ne eblas ŝanĝi la grandecon aŭ la elementojn de listo.<\/span> <span class=\"sg\" data-s=\"2\">Uzu krampojn por krei liston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subskribi listojn<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por aliri individuajn elementojn de listo, uzu kvadratajn krampojn kun la indekso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tamen, ne eblas agordi novan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Ne OK<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tia provo kaŭzas escepton:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ne eblas modifi nemodifikeblan Liston ((1 3 5 7 9))       en bloko &lt;unit&gt; ĉe t.raku linio 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asigni liston al tabelo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kio okazas kiam vi konservas liston en variablo kun la <code>@<\/code> sigelo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu kazo, la variablo <code>@data<\/code> enhavas tabelon, kaj vi povas modifi ĝiajn elementojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Variablo vs listo<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la fakto ke listoj estas nemodifikeblaj ne signifas ke vi ne povas reuzi la variablon kiu tenas ĝin.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"la":{"t":"Listae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Indices sunt similes arrayibus sed immutabiles sunt.<\/span> <span class=\"sg\" data-s=\"1\">Non est possibile mutare magnitudinem aut elementa indicis.<\/span> <span class=\"sg\" data-s=\"2\">Utere parenthesibus ad indicem creandum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subscriptio indicum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad elementa singularia indicis accedendum, utere bracketis quadratis cum indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tamen, non est possibile novum valorem ponere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Non OK<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Talis conatus exceptionem causat:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Non potest immutabilem Indicem ((1 3 5 7 9)) mutare       in block &lt;unit&gt; at t.raku linea 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Assignatio indicis ad array<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid accidit cum indicem in variabili cum sigillo <code>@<\/code> servas?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In hoc casu, variabilis <code>@data<\/code> continet array, et eius elementa mutare potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Variabilis vs index<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod indices immutabiles esse non significat te non posse variabilem, quae eum continet, iterum uti.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]}}}</script>
