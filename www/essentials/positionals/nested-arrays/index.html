<script type="application/json" id="page-data">{"u":"essentials/positionals/nested-arrays","n":211,"k":"topic","pv":"essentials/positionals/arrays/quiz","nx":"essentials/positionals/nested-arrays/quiz","tr":["essentials","essentials/positionals"],"L":{"en":{"t":"Nested arrays","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays can contain any other data, including other arrays.<\/span> <span class=\"sg\" data-s=\"1\">To delimit the borders of the nested arrays, use square brackets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is also possible to have one more pair of brackets for the top-level array.<\/span> <span class=\"sg\" data-s=\"1\">The next example shows the same data structure as before.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To access inner items, add as many indices as needed.<\/span> <span class=\"sg\" data-s=\"1\">A single pair of square brackets goes down one level deeper into the structure:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Prints 4\nsay @table[2][1]; # Prints 200 <\/code><\/pre>"]]},"de":{"t":"Verschachtelte Arrays","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays können beliebige andere Daten enthalten, einschließlich anderer Arrays.<\/span> <span class=\"sg\" data-s=\"1\">Um die Grenzen der verschachtelten Arrays zu kennzeichnen, verwenden Sie eckige Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist auch möglich, ein weiteres Paar Klammern für das oberste Array hinzuzufügen.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Beispiel zeigt dieselbe Datenstruktur wie zuvor.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um auf innere Elemente zuzugreifen, fügen Sie so viele Indizes hinzu, wie benötigt werden.<\/span> <span class=\"sg\" data-s=\"1\">Ein einzelnes Paar eckiger Klammern geht eine Ebene tiefer in die Struktur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Gibt 4 aus\nsay @table[2][1]; # Gibt 200 aus<\/code><\/pre>"]]},"nl":{"t":"Geneste arrays","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays kunnen elke andere data bevatten, inclusief andere arrays.<\/span> <span class=\"sg\" data-s=\"1\">Om de grenzen van de geneste arrays te markeren, gebruik vierkante haken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is ook mogelijk om nog een paar haken te hebben voor de array op het hoogste niveau.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende voorbeeld toont dezelfde datastructuur als hiervoor.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om toegang te krijgen tot interne items, voeg zoveel indices toe als nodig is.<\/span> <span class=\"sg\" data-s=\"1\">Een enkel paar vierkante haken gaat een niveau dieper in de structuur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Print 4\nsay @table[2][1]; # Print 200 <\/code><\/pre>"]]},"es":{"t":"Arrays anidados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los arreglos pueden contener cualquier otro dato, incluidos otros arreglos.<\/span> <span class=\"sg\" data-s=\"1\">Para delimitar los bordes de los arreglos anidados, usa corchetes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También es posible tener un par más de corchetes para el arreglo de nivel superior.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente ejemplo muestra la misma estructura de datos que antes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para acceder a los elementos internos, añade tantos índices como sea necesario.<\/span> <span class=\"sg\" data-s=\"1\">Un solo par de corchetes desciende un nivel más en la estructura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Imprime 4\nsay @table[2][1]; # Imprime 200 <\/code><\/pre>"]]},"it":{"t":"Array annidati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli array possono contenere qualsiasi altro dato, inclusi altri array.<\/span> <span class=\"sg\" data-s=\"1\">Per delimitare i confini degli array annidati, usa le parentesi quadre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È anche possibile avere un'altra coppia di parentesi quadre per l'array di livello superiore.<\/span> <span class=\"sg\" data-s=\"1\">Il prossimo esempio mostra la stessa struttura dati di prima.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per accedere agli elementi interni, aggiungi tutti gli indici necessari.<\/span> <span class=\"sg\" data-s=\"1\">Una singola coppia di parentesi quadre scende di un livello più in profondità nella struttura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Stampa 4\nsay @table[2][1]; # Stampa 200 <\/code><\/pre>"]]},"lv":{"t":"Ligzdoti masīvi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīvi var saturēt jebkurus citus datus, tostarp citus masīvus.<\/span> <span class=\"sg\" data-s=\"1\">Lai norobežotu ligzdošanas masīvu robežas, izmantojiet kvadrātiekavas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams arī izmantot vēl vienu kvadrātiekavu pāri augstākā līmeņa masīvam.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais piemērs parāda to pašu datu struktūru kā iepriekš.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai piekļūtu iekšējiem elementiem, pievienojiet tik daudz indeksu, cik nepieciešams.<\/span> <span class=\"sg\" data-s=\"1\">Viena kvadrātiekavu pāra izmantošana ļauj iet vienu līmeni dziļāk struktūrā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Izdrukā 4\nsay @table[2][1]; # Izdrukā 200 <\/code><\/pre>"]]},"ru":{"t":"Вложенные массивы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Массивы могут содержать любые другие данные, включая другие массивы.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы разграничить границы вложенных массивов, используйте квадратные скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Также возможно использовать еще одну пару скобок для массива верхнего уровня.<\/span> <span class=\"sg\" data-s=\"1\">Следующий пример показывает ту же структуру данных, что и раньше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить доступ к внутренним элементам, добавьте столько индексов, сколько нужно.<\/span> <span class=\"sg\" data-s=\"1\">Одна пара квадратных скобок опускается на один уровень глубже в структуру:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Выводит 4\nsay @table[2][1]; # Выводит 200 <\/code><\/pre>"]]},"uk":{"t":"Вкладені масиви","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Масиви можуть містити будь-які інші дані, включаючи інші масиви.<\/span> <span class=\"sg\" data-s=\"1\">Щоб розмежувати межі вкладених масивів, використовуйте квадратні дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Також можливо додати ще одну пару дужок для масиву верхнього рівня.<\/span> <span class=\"sg\" data-s=\"1\">Наступний приклад показує ту саму структуру даних, що й раніше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати доступ до внутрішніх елементів, додайте стільки індексів, скільки потрібно.<\/span> <span class=\"sg\" data-s=\"1\">Одна пара квадратних дужок спускається на один рівень глибше в структуру:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Виведе 4\nsay @table[2][1]; # Виведе 200 <\/code><\/pre>"]]},"bg":{"t":"Вложени масиви","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивите могат да съдържат всякакви други данни, включително и други масиви.<\/span> <span class=\"sg\" data-s=\"1\">За да разграничите границите на вложените масиви, използвайте квадратни скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Също така е възможно да има още една двойка скоби за масива на най-високо ниво.<\/span> <span class=\"sg\" data-s=\"1\">Следващият пример показва същата структура от данни, както преди.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да получите достъп до вътрешни елементи, добавете толкова индекси, колкото е необходимо.<\/span> <span class=\"sg\" data-s=\"1\">Една двойка квадратни скоби навлиза едно ниво по-дълбоко в структурата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Извежда 4\nsay @table[2][1]; # Извежда 200 <\/code><\/pre>"]]},"eo":{"t":"Nestitaj arrayoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tabeloj povas enhavi ajnajn aliajn datumojn, inkluzive de aliaj tabeloj.<\/span> <span class=\"sg\" data-s=\"1\">Por limigi la limojn de la enigitaj tabeloj, uzu kvadratajn krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eblas ankaŭ havi unu plian paron da krampoj por la supra-nivela tabelo.<\/span> <span class=\"sg\" data-s=\"1\">La sekva ekzemplo montras la saman datumstrukturon kiel antaŭe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por aliri internajn erojn, aldonu tiom da indeksoj kiom necesas.<\/span> <span class=\"sg\" data-s=\"1\">Unu paro da kvadrataj krampoj iras unu nivelon pli profunde en la strukturon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Presas 4\nsay @table[2][1]; # Presas 200 <\/code><\/pre>"]]},"la":{"t":"Nidificata array","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tabulae possunt continere quaelibet alia data, inclusis aliis tabulis.<\/span> <span class=\"sg\" data-s=\"1\">Ad delimitanda confinia tabularum nidificatarum, utere claudibus quadratis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam possibile est habere unam par claudium pro tabula summi gradus.<\/span> <span class=\"sg\" data-s=\"1\">Proximum exemplum eandem structuram datam ac prius ostendit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad accedendum ad res interiores, adde tot indices quot necessarii sunt.<\/span> <span class=\"sg\" data-s=\"1\">Unum par claudium quadratarum descendit unum gradum altius in structuram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Imprimit 4\nsay @table[2][1]; # Imprimit 200 <\/code><\/pre>"]]}}}</script>
