w red yellow green&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Протягом перших секунд, кількість секунд з початку можна безпосередньо використовувати як індекс у масиві.<\/span> <span class=\"sg\" data-s=\"1\">Коли вона перевищує 3, ви можете зациклити її на початок масиву за допомогою оператора модуло <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Довжина масиву дорівнює <code>@lights.elems<\/code>, але коли вона використовується як операнд <code>%<\/code>, немає потреби викликати метод <code>elems<\/code>, оскільки ім'я масиву буде перетворено на число, і це перетворення призначене для повернення кількості елементів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось рішення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @lights = &lt;yellow red yellow green&gt;;\n\nsay @lights[51 % @lights];\nsay @lights[102 % @lights];\nsay @lights[305 % @lights];<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/traffic-lights.raku\" target=\"_blank\" rel=\"noopener\">traffic-lights.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму.<\/span> <span class=\"sg\" data-s=\"1\">Додатково спробуйте інші значення в програмі.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/traffic-lights.raku\ngreen\nyellow\nred<\/code><\/pre>"]]},"bg":{"t":"Solution: Светофари","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Идеята на решението е да се „завърти индексирането“ на масива с четирите състояния на светофарите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @lights = &lt;yellow red yellow green&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">През първите секунди, броят на секу ">Kiam ĝi superas 3, vi povas cikligi ĝin al la komenco de la aro per la modulo operatoro <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La longo de la aro estas <code>@lights.elems<\/code>, sed kiam ĝi estas uzata kiel operando de <code>%<\/code>, ne estas bezono voki la metodon <code>elems<\/code>, ĉar la nomo de la aro estos konvertita al nombro, kaj tiu konvertiĝo estas desegnita por redoni la nombron de elementoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @lights = &lt;flava ruĝa flava verda&gt;;\n\nsay @lights[51 % @lights];\nsay @lights[102 % @lights];\nsay @lights[305 % @lights];<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/traffic-lights.raku\" target=\"_blank\" rel=\"noopener\">traffic-lights.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon.<\/span> <span class=\"sg\" data-s=\"1\">Krome, provu aliajn valorojn en la programo.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/traffic-lights.raku\nverda\nflava\nruĝa<\/code><\/pre>"]]},"la":{"t":"Solution: Luminum trafficum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Idea solutionis est 'iterare indicem' array cum quattuor statibus luminis traffici:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @lights = &lt;flavum rubrum flavum viride&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Durante primis secundis, numerus secundorum ab initio directe uti potest ut index in array.<\/span> <span class=\"sg\" data-s=\"1\">Cum excedit 3, potes iterare ad initium array cum operatore modulo <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L
