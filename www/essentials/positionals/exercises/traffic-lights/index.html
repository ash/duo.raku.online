 von vorne.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie ein Programm, das den Zustand der Ampeln in der 51&lt;sup&gt;sten&lt;/sup&gt;, 102&lt;sup&gt;ten&lt;/sup&gt; und 305&lt;sup&gt;ten&lt;/sup&gt; Sekunde ausgibt, wobei angenommen wird, dass die Farbe in der 1&lt;sup&gt;sten&lt;/sup&gt; Sekunde Rot ist.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm sollte drei Zahlen in separaten Zeilen ausgeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Verkeerslichten","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het verkeerslicht verandert elke seconde van kleur.<\/span> <span class=\"sg\" data-s=\"1\">Toen het voor het eerst werd ingeschakeld, begon het als geel.<\/span> <span class=\"sg\" data-s=\"2\">Vervolgens veranderde de kleur elke seconde in de volgorde geel — rood — geel — groen en de cyclus begint opnieuw.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schrijf een programma dat de toestand van de verkeerslichten afdrukt op de 51&lt;sup&gt;ste&lt;/sup&gt;, 102&lt;sup&gt;de&lt;/sup&gt; en 305&lt;sup&gt;ste&lt;/sup&gt; seconde, ervan uitgaande dat de kleur op de 1&lt;sup&gt;ste&lt;/sup&gt; seconde rood is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma moet drie getallen op afzonderlijke regels afdrukken:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Semáforos","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El semáforo cambia de color cada segundo.<\/span> <span class=\"sg\" data-s=\"1\">Cuando se encendió por primera vez, comenzó en amarillo.<\/span> <span class=\"sg\" data-s=\"2\">Luego, cada segundo el color cambió en el orden amarillo — rojo — amarillo — verde y el ciclo comienza de nuevo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Escribe un programa que imprima el estado de los semáforos en el 51&lt;sup&gt;er&lt;/sup&gt;, 102&lt;sup&gt;do&lt;/sup&gt; y 305&lt;sup&gt;to&lt;/sup&gt; segundo, asumiendo que el color en el 1&lt;sup&gt;er&lt;/sup&gt; segundo es rojo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa debe imprimir tres números en líneas separadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Semafori","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il semaforo cambia il suo colore ogni secondo.<\/span> <span class=\"sg\" data-s=\"1\">Quando è stato acceso per la prima volta, è partito come giallo.<\/span> <span class=\"sg\" data-s=\"2\">Poi, ogni secondo il colore è cambiato nell'ordine giallo — rosso — giallo — verde e il ciclo ricomincia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scrivi un programma che stampi lo stato del semaforo al 51&lt;sup&gt;esimo&lt;/sup&gt;, 102&lt;sup&gt;esimo&lt;/sup&gt; e 305&lt;sup&gt;esimo&lt;/sup&gt; secondo, assumendo che il colore al 1&lt;sup&gt;esimo&lt;/sup&gt; secondo sia rosso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma dovrebbe stampare tre numeri su linee separate:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Satiksmes luksofori","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problēma<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Luksofors maina savu krāsu katru sekundi.<\/span> <span class=\"sg\" data-s=\"1\">Kad tas tika ieslēgts pirmo reizi, tas sāka ar dzelteno krāsu.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam katru sekundi krāsa mainījās šādā secībā: dzeltena — sarkana — dzeltena — zaļa, un cikls sākas no jauna.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet programmu, kas izdrukā luksofora stāvokli 51&lt;sup&gt;ajā&lt;/sup&gt;, 102&lt;sup&gt;ajā&lt;/sup&gt; un 305&lt;sup&gt;ajā&lt;/sup&gt; sekundē, pieņemot, ka krāsa 1&lt;sup&gt;ajā&lt;/sup&gt; sekundē ir sarkana.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmai vajadzētu izdrukāt trīs skaitļus atsevišķās rindās:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Светофор","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Светофор меняет свой цвет каждую секунду.<\/span> <span class=\"sg\" data-s=\"1\">Когда он был впервые включен, он начал с желтого цвета.<\/span> <span class=\"sg\" data-s=\"2\">Затем каждую секунду цвет менялся в порядке желтый — красный — желтый — зеленый, и цикл начинается заново.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Напишите программу, которая выводит состояние светофора на 51&lt;sup&gt;ой&lt;/sup&gt;, 102&lt;sup&gt;ой&lt;/sup&gt; и 305&lt;sup&gt;ой&lt;/sup&gt; секунде, предполагая, что цвет на 1&lt;sup&gt;ой&lt;/sup&gt; секунде — красный.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа должна вывести три числа на отдельных строках:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">См. решение<\/a><\/span><\/p>"]]},"uk":{"t":"Світлофори","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Світлофор змінює свій колір щосекунди.<\/span> <span class=\"sg\" data-s=\"1\">Коли його вперше вмикають, він починає з жовтого.<\/span> <span class=\"sg\" data-s=\"2\">Далі щосекунди колір змінюється в порядку жовтий — червоний — жовтий — зелений, і цикл починається знову.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Напишіть програму, яка виводить стан світлофора на 51&lt;sup&gt;й&lt;/sup&gt;, 102&lt;sup&gt;й&lt;/sup&gt; та 305&lt;sup&gt;й&lt;/sup&gt; секунді, вважаючи, що колір на 1&lt;sup&gt;й&lt;/sup&gt; секунді — червоний.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Про ĝiĝis en la ordo flava — ruĝa — flava — verda kaj la ciklo rekomenciĝas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Skribu programon kiu presas la staton de la trafiklumoj en la 51&lt;sup&gt;a&lt;/sup&gt;, 102&lt;sup&gt;a&lt;/sup&gt; kaj 305&lt;sup&gt;a&lt;/sup&gt; sekundo, supozante ke la koloro en la 1&lt;sup&gt;a&lt;/sup&gt; sekundo estas ruĝa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo devus presi tri numerojn en apartaj linioj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Luminum trafficum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lux traffici colorem suum omni secundo mutat.<\/span> <span class=\"sg\" data-s=\"1\">Cum primum accensa est, incepit ut flava.<\/span> <span class=\"sg\" data-s=\"2\">Deinde, omni secundo color mutatus est in ordine flava — rubra — flava — viridis et cyclus iterum incipit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scribe programma quod statum luminis traffici in 51&lt;sup&gt;o&lt;/sup&gt;, 102&lt;sup&gt;o&lt;/sup&gt; et 305&lt;sup&gt;o&lt;/sup&gt; secundo imprimit, assumens colorem in 1&lt;sup&gt;o&lt;/sup&gt; secundo esse rubrum.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma debet tres numeros in lineis separatis imprimere:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku lumina-traffici.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\
