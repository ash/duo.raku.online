ty<\/code><\/pre>"]]},"la":{"t":"Solution: Litterare numerum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma infra habet array inbuilt cum nominibus numerorum a 0 ad 20 et nominibus decadarum: 20, 30, etc. In catena conditionalium inspectionum, numerus distribuitur ad unam ex regulis scribendi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = @*ARGS[0];\n\nmy @nomina = &lt;\n    zero unus duo tres quattuor quinque sex septem octo novem decem\n    undecim duodecim tredecim quattuordecim quindecim sedecim septendecim duodeviginti undeviginti viginti\n    triginta quadraginta quinquaginta sexaginta septuaginta octoginta nonaginta &gt;;\n\nif $n &lt; 20 {\n    dic @nomina[$n];\n}\nelsif $n % 10 { # Numeri duo-digiti non-rotundi, e.g., 34\n    dic @nomina[$n / 10 + 18] ~ '-' ~ @nomina[$n % 10];\n}\nelse { # Multipla 10, e.g., 50\n    dic @nomina[$n / 10 + 18];\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenies programmatum in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/spell-a-number.raku\" target=\"_blank\" rel=\"noopener\">spell-a-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programmatum aliquoties ut omnes tres ramos constructionis <code>si<\/code>—<code>sin<\/code>—<code>aliter<\/code> inspicias.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/spell-a-number.raku 5\nquinque\n\n$ raku exercises/positionals/spell-a-number.raku 12\nduodecim\n\n$ raku exercises/positionals/spell-a-number.raku 67\nsexaginta-septem\n\n$ raku exercises/positionals/spell-a-number.raku 80\noctoginta<\/code><\/pre>"]]}}}</script>
