["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следующей части курса мы вернемся к этой задаче, чтобы решить ее с использованием совершенно другого подхода.<\/span><\/p>"]]},"uk":{"t":"Solution: Непарні індекси","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб вирішити це завдання, ви можете використовувати конструкцію <code>loop<\/code> і збільшувати змінну циклу на 2 при кожній ітерації.<\/span> <span class=\"sg\" data-s=\"1\">Але ви також можете використовувати цикл <code>for<\/code> і сканувати числа від 1 до половини довжини масиву, а потім множити їх на два.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось рішення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 12, 1, 5, -9, 8, 36, 18, 21;\n\nsay @data[2 * $_ - 1] for 1 .. @data/2;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/odd-indices.raku\" target=\"_blank\" rel=\"noopener\">odd-indices.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Спочатку запустіть програму з оригінальними елементами даних.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/odd-indices.raku\n12\n5\n8\n18<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Потім додайте ще один елемент до даних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 12, 1, 5, -9, 8, 36, 18, 21, 22;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підтвердіть, що новий елемент з непарним індексом з'являється у виводі:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/odd-indices.raku\n12\n5\n8\n18\n22<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s= ">Коментари<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следващата част на курса ще се върнем към тази задача, за да я решим с напълно различен подход.<\/span><\/p>"]]},"eo":{"t":"Solution: Malparaj indeksoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por solvi ĉi tiun taskon, vi povas uzi la <code>loop<\/code> konstruon kaj pliigi la buklan variablon per 2 en ĉiu iteracio.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankaŭ povas uzi <code>for<\/code> buklon kaj skani la nombrojn de 1 ĝis la duono de la longo de la tabelo, kaj tiam multobligi ilin per du.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 12, 1, 5, -9, 8, 36, 18, 21;\n\nsay @data[2 * $_ - 1] for 1 .. @data/2;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/odd-indices.raku\" target=\"_blank\" rel=\"noopener\">odd-indices.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unue, rulu la programon kun la originalaj datumoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/odd-indices.raku\n12\n5\n8\n18<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tiam, aldonu unu plian elementon al la datumoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 12, 1, 5, -9, 8, 36, 18, 21, 22;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konfirmu ke la nova elemento kun nepara indekso aperas en la eligo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/odd-indices.raku\n12\n5\n8\n18\n22<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la sekva parto de la kurso, ni revenos al ĉi tiu tasko por solvi ĝin uzante tute malsaman aliron.<\/span><\/p>"]]},"la":{"t":"Solution: Indices impares","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad hanc quaestionem solvendam, potes uti constructo <code>loop<\/code> et incrementare variabilem loop per 2 in unaquaque iteratione.<\/span> <span class=\"sg\" data-s=\"1\">Sed etiam potes uti <code>for<\/code> loop et percurrere numeros a 1 ad dimidium longitudinis array, et deinde eos multiplicare per duo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 12, 1, 5, -9, 8, 36, 18, 21;\n\nsay @data[2 * $_ - 1] for 1 .. @data/2;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni programmatum in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/odd-indices.raku\" target=\"_blank\" rel=\"noopener\">odd-indices.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Primum, currite programmatum cum elementis originalibus datae.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/odd-indices.raku\n12\n5\n8\n18<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deinde, addite unum item plus ad data:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 12, 1, 5, -9, 8, 36, 18, 21, 22;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Confirmate novum elementum cum indice impari apparere in output:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/odd-indices.raku\n12\n5\n8\n18\n22<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In proxima parte cursus, ad hanc quaestionem redibimus ut eam solvemus alio modo omnino.<\/span><\/p>"]]}}}</script>
