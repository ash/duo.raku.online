 target=\"_blank\" rel=\"noopener\">Proyecto de Raku en docker en GitHub<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Utilizzo di Docker","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un'immagine docker di Rakudo Star può essere utilizzata sia per eseguire una shell REPL che per eseguire un programma da un file.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per avviare la shell, esegui il seguente comando.<\/span> <span class=\"sg\" data-s=\"1\">Scaricherà l'ultima immagine <code>rakudo-star<\/code> se necessario.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nPer eseguire un programma, utilizza il seguente comando:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aggiungi il flag <code>--rm<\/code> se desideri pulire il container e rimuovere il file system quando il container esce.<\/span> <span class=\"sg\" data-s=\"1\">Trova ulteriori istruzioni sulla pagina del progetto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Link esterni<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Immagine Docker<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Progetto Raku docker su GitHub<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Docker izmantošana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo Star docker attēlu var izmantot gan REPL čaulas palaišanai, gan programmas izpildei no faila.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai sāktu čaulu, palaidiet šādu komandu.<\/span> <span class=\"sg\" data-s=\"1\">Tā nepieciešamības gadījumā lejupielādēs jaunāko <code>rakudo-star<\/code> attēlu.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nLai palaistu programmu, izmantojiet šādu komandu:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pievienojiet <code>--rm<\/code> karogu, ja vēlaties iztīrīt konteineru un noņemt failu sistēmu, kad konteineris beidz darbu.<\/span> <span class=\"sg\" data-s=\"1\">Vairāk instrukciju atradīsiet projekta lapā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Docker attēls<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku docker projekts GitHub<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"С помощью Docker","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Образ Rakudo Star на Docker может быть использован как для запуска командной оболочки REPL, так и для выполнения программы из файла.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы запустить REPL, выполните следующую команду.<\/span> <span class=\"sg\" data-s=\"1\">Она подтянет самый последний образ <code>rakudo-star<\/code>, если потребуется.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы запустить программу, выполните следующую команду:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавьте флаг <code>--rm<\/code>, если вы хотите почистить контейнер и удалить файловую систему, когда контейнер закончит работу.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете найти больше информации на странице проекта.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Docker образ<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku Docker проект на GitHub<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Використання docker","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Образ Docker Rakudo Star можна використовувати як для запуску REPL оболонки, так і для виконання програми з файлу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб запустити оболонку, виконайте наступну команду.<\/span> <span class=\"sg\" data-s=\"1\">Вона завантажить останній образ <code>rakudo-star<\/code>, якщо це необхідно.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nЩоб виконати програму, використовуйте наступну команду:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Додайте прапорець <code>--rm<\/code>, якщо хочете очистити контейнер і видалити файлову систему після завершення роботи контейнера.<\/span> <span class=\"sg\" data-s=\"1\">Більше інструкцій можна знайти на сторінці проекту.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Образ Docker<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Проект Raku Docker на GitHub<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Използване на Docker","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Docker изображение на Rakudo Star може да се използва както за стартиране на REPL shell, така и за изпълнение на програма от файл.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да стартирате shell, изпълнете следната команда.<\/span> <span class=\"sg\" data-s=\"1\">Тя ще изтегли последното изображение <code>rakudo-star<\/code>, ако е необходимо.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nЗа да изпълните програма, използвайте следната команда:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавете флага <code>--rm<\/code>, ако искате да почистите контейнера и да премахнете файловата система, когато контейнерът излезе.<\/span> <span class=\"sg\" data-s=\"1\">Намерете повече инструкции на страницата на проекта.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Docker изображение<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku docker проект в GitHub<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Uzado de docker","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Docker-bildo de Rakudo Star povas esti uzata por ambaŭ funkciigi REPL-ŝelon kaj ekzekuti programon el dosiero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por starti la ŝelon, rulu la jenan komandon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi elŝutos la plej lastan bildon de <code>rakudo-star<\/code> se necese.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nPor funkciigi programon, uzu la jenan komandon:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aldonu la flagon <code>--rm<\/code> se vi volas purigi la ujon kaj forigi la dosiersistemon kiam la ujo eliras.<\/span> <span class=\"sg\" data-s=\"1\">Trovu pli da instrukcioj sur la projekto-paĝo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Docker-bildo<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku docker-projekto en GitHub<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Utendo docker","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Imago Rakudo Star docker adhiberi potest et ad currendum REPL concha et ad exsequendum programma ex archivo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad concham incipiendam, currite sequentem praeceptum.<\/span> <span class=\"sg\" data-s=\"1\">Hoc trahere novissimam imaginem <code>rakudo-star<\/code> si opus est.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nAd currendum programma, utere sequenti praecepto:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adde vexillum <code>--rm<\/code> si vis purgare continens et removere systema fasciculorum cum continens exit.<\/span> <span class=\"sg\" data-s=\"1\">Plura mandata in pagina propositi invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Imago Docker<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku docker projectus in GitHub<\/a><\/span><\/li><\/ul>"]]}}}</script>
