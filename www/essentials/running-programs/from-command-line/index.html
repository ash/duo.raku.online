<script type="application/json" id="page-data">{"u":"essentials/running-programs/from-command-line","n":13,"k":"topic","pv":"essentials/running-programs","nx":"essentials/running-programs/from-repl","tr":["essentials","essentials/running-programs"],"L":{"en":{"t":"Running from command line","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Save the text of the program in a text file, for example, <code>hello.raku<\/code> and pass the path to the file to the command-line tool <code>raku<\/code> (the dollar character indicates shell’s prompt):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the program does not contain errors, it will be immediately executed, and if it generates any output, you will see the result in the terminal:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When working with Unix-based systems, you can add a shebang and make the file executable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The next steps are the following:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"de":{"t":"Ausführen von der Befehlszeile","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Speichern Sie den Text des Programms in einer Textdatei, zum Beispiel <code>hello.raku<\/code>, und übergeben Sie den Pfad zur Datei an das Kommandozeilen-Tool <code>raku<\/code> (das Dollarzeichen zeigt die Eingabeaufforderung der Shell an):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn das Programm keine Fehler enthält, wird es sofort ausgeführt, und wenn es eine Ausgabe erzeugt, sehen Sie das Ergebnis im Terminal:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHallo, Welt!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie mit Unix-basierten Systemen arbeiten, können Sie eine Shebang-Zeile hinzufügen und die Datei ausführbar machen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hallo, Welt!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Schritte sind die folgenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHallo, Welt!<\/code><\/pre>"]]},"nl":{"t":"Uitvoeren vanaf de opdrachtregel","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sla de tekst van het programma op in een tekstbestand, bijvoorbeeld <code>hello.raku<\/code>, en geef het pad naar het bestand door aan het opdrachtregelprogramma <code>raku<\/code> (het dollarteken geeft de prompt van de shell aan):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als het programma geen fouten bevat, wordt het onmiddellijk uitgevoerd, en als het enige uitvoer genereert, zie je het resultaat in de terminal:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHallo, Wereld!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bij het werken met Unix-gebaseerde systemen kun je een shebang toevoegen en het bestand uitvoerbaar maken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hallo, Wereld!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De volgende stappen zijn als volgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHallo, Wereld!<\/code><\/pre>"]]},"es":{"t":"Ejecutar desde la línea de comandos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Guarda el texto del programa en un archivo de texto, por ejemplo, <code>hello.raku<\/code> y pasa la ruta del archivo a la herramienta de línea de comandos <code>raku<\/code> (el carácter de dólar indica el prompt del shell):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si el programa no contiene errores, se ejecutará inmediatamente, y si genera alguna salida, verás el resultado en la terminal:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando trabajes con sistemas basados en Unix, puedes agregar un shebang y hacer el archivo ejecutable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los siguientes pasos son los siguientes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"it":{"t":"Esecuzione dalla riga di comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Salva il testo del programma in un file di testo, ad esempio, <code>hello.raku<\/code> e passa il percorso del file allo strumento da riga di comando <code>raku<\/code> (il carattere del dollaro indica il prompt della shell):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se il programma non contiene errori, verrà eseguito immediatamente e, se genera qualche output, vedrai il risultato nel terminale:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando si lavora con sistemi basati su Unix, è possibile aggiungere uno shebang e rendere il file eseguibile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I passaggi successivi sono i seguenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"lv":{"t":"Palaišana no komandrindas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Saglabājiet programmas tekstu teksta failā, piemēram, <code>hello.raku<\/code>, un nododiet faila ceļu komandrindas rīkam <code>raku<\/code> (dolāra simbols norāda uz čaulas uzvedni):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja programmā nav kļūdu, tā tiks nekavējoties izpildīta, un, ja tā ģenerē jebkādu izvadi, jūs redzēsiet rezultātu terminālī:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Strādājot ar Unix bāzētām sistēmām, varat pievienot shebang un padarīt failu izpildāmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamie soļi ir šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"ru":{"t":"Запуск из командной строки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Сохраните текст программы в текстовом файле, например, <code>hello.raku<\/code>, и передайте путь к файлу программе командной строки <code>raku<\/code> (знак доллара означает начало командной строки):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если программа не содержит ошибок, она будет немедленно выполнена, и если она производит вывод, вы увидите результат в терминале:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Работая с Unix-подобными системами, вы можете добавить \"shebang\" и сделать файл исполняемым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующие шаги:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"uk":{"t":"Запуск з командного рядка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Збережіть текст програми у текстовому файлі, наприклад, <code>hello.raku<\/code> і передайте шлях до файлу інструменту командного рядка <code>raku<\/code> (знак долара вказує на запрошення оболонки):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо програма не містить помилок, вона буде негайно виконана, і якщо вона генерує будь-який вивід, ви побачите результат у терміналі:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Під час роботи з системами на базі Unix ви можете додати shebang і зробити файл виконуваним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступні кроки такі:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"bg":{"t":"Изпълнение от командния ред","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Запазете текста на програмата в текстов файл, например <code>hello.raku<\/code> и предайте пътя до файла на командния инструмент <code>raku<\/code> (знакът долар показва подканата на shell):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако програмата не съдържа грешки, тя ще бъде изпълнена незабавно и ако генерира някакъв изход, ще видите резултата в терминала:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nЗдравей, свят!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато работите с Unix-базирани системи, можете да добавите shebang и да направите файла изпълним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Здравей, свят!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващите стъпки са следните:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nЗдравей, свят!<\/code><\/pre>"]]},"eo":{"t":"Lanĉado de komanda linio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Konservu la tekston de la programo en tekstdosiero, ekzemple, <code>hello.raku<\/code> kaj pasigu la vojon al la dosiero al la komandlinia ilo <code>raku<\/code> (la dolara signo indikas la ŝelan prompton):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la programo ne enhavas erarojn, ĝi estos tuj ekzekutita, kaj se ĝi generas ajnan eliron, vi vidos la rezulton en la terminalo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi laboras kun Uniks-bazitaj sistemoj, vi povas aldoni shebang-on kaj fari la dosieron ekzekutebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekvaj paŝoj estas la jenaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]},"la":{"t":"Currendo ex linea mandati","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Serva textum programmatis in fasciculo textuali, exempli gratia, <code>hello.raku<\/code> et transi viam ad fasciculum instrumento lineae mandati <code>raku<\/code> (character dollari indicat promptum testae):<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si programma errores non continet, statim exsequetur, et si aliquem exitum generat, eventum in terminali videbis:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku \nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum in systematibus Unix-fundatis laboras, potes shebang addere et fasciculum exsecutabile facere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>#!/usr/bin/env raku\n\nsay 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Proximi gradus sunt sequentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ chmod a+x hello.raku\n$ ./hello.raku\nHello, World!<\/code><\/pre>"]]}}}</script>
