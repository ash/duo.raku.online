<script type="application/json" id="page-data">{"u":"essentials/running-programs/from-repl","n":14,"k":"topic","pv":"essentials/running-programs/from-command-line","nx":"essentials/running-programs/from-ide","tr":["essentials","essentials/running-programs"],"L":{"en":{"t":"Running from REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL stands for <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">It is a built-in shell mode where you can type instructions and get intermediate results on the screen, including the state of the variables and the output that your program generates.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To start Rakudo shell, simply type:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The output may depend on the currently installed version of the compiler.<\/span> <span class=\"sg\" data-s=\"1\">In the above output, the shell recommends installing some modules for better user experience, so you see the corresponding message.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">At the end, there’s a prompt character <code>&gt;<\/code> where you can type in your program or its parts.<\/span> <span class=\"sg\" data-s=\"1\">The shell will compile it line by line as soon as you press Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"de":{"t":"Ausführen von REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL steht für <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Es ist ein integrierter Shell-Modus, in dem Sie Anweisungen eingeben und Zwischenergebnisse auf dem Bildschirm erhalten können, einschließlich des Zustands der Variablen und der Ausgabe, die Ihr Programm erzeugt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um die Rakudo-Shell zu starten, geben Sie einfach ein:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe kann von der aktuell installierten Version des Compilers abhängen.<\/span> <span class=\"sg\" data-s=\"1\">In der obigen Ausgabe empfiehlt die Shell, einige Module für eine bessere Benutzererfahrung zu installieren, sodass Sie die entsprechende Nachricht sehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Am Ende gibt es ein Prompt-Zeichen <code>&gt;<\/code>, an dem Sie Ihr Programm oder Teile davon eingeben können.<\/span> <span class=\"sg\" data-s=\"1\">Die Shell wird es Zeile für Zeile kompilieren, sobald Sie die Eingabetaste drücken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"nl":{"t":"Uitvoeren vanaf REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL staat voor <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Het is een ingebouwde shell-modus waarin je instructies kunt typen en tussentijdse resultaten op het scherm kunt zien, inclusief de status van de variabelen en de uitvoer die je programma genereert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om de Rakudo-shell te starten, typ je eenvoudig:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De uitvoer kan afhangen van de momenteel geïnstalleerde versie van de compiler.<\/span> <span class=\"sg\" data-s=\"1\">In de bovenstaande uitvoer beveelt de shell aan om enkele modules te installeren voor een betere gebruikerservaring, dus zie je het bijbehorende bericht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aan het einde is er een promptkarakter <code>&gt;<\/code> waar je je programma of delen ervan kunt typen.<\/span> <span class=\"sg\" data-s=\"1\">De shell zal het regel voor regel compileren zodra je op Enter drukt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"es":{"t":"Ejecutar desde REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL significa <em>Read–eval–print loop<\/em> (bucle de leer-evaluar-imprimir).<\/span> <span class=\"sg\" data-s=\"1\">Es un modo de shell incorporado donde puedes escribir instrucciones y obtener resultados intermedios en la pantalla, incluyendo el estado de las variables y la salida que genera tu programa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para iniciar el shell de Rakudo, simplemente escribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La salida puede depender de la versión actualmente instalada del compilador.<\/span> <span class=\"sg\" data-s=\"1\">En la salida anterior, el shell recomienda instalar algunos módulos para una mejor experiencia de usuario, por lo que ves el mensaje correspondiente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al final, hay un carácter de prompt <code>&gt;<\/code> donde puedes escribir tu programa o sus partes.<\/span> <span class=\"sg\" data-s=\"1\">El shell lo compilará línea por línea tan pronto como presiones Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"it":{"t":"Esecuzione da REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL sta per <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È una modalità shell integrata dove puoi digitare istruzioni e ottenere risultati intermedi sullo schermo, inclusi lo stato delle variabili e l'output generato dal tuo programma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per avviare la shell di Rakudo, basta digitare:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'output può dipendere dalla versione del compilatore attualmente installata.<\/span> <span class=\"sg\" data-s=\"1\">Nell'output sopra, la shell consiglia di installare alcuni moduli per una migliore esperienza utente, quindi vedi il messaggio corrispondente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alla fine, c'è un carattere di prompt <code>&gt;<\/code> dove puoi digitare il tuo programma o le sue parti.<\/span> <span class=\"sg\" data-s=\"1\">La shell lo compilerà riga per riga non appena premi Invio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"lv":{"t":"Palaišana no REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL nozīmē <em>Read–eval–print loop<\/em> (lasīt-izpildīt-izdrukāt cilpa).<\/span> <span class=\"sg\" data-s=\"1\">Tā ir iebūvēta čaulas režīms, kurā varat ievadīt instrukcijas un uz ekrāna saņemt starprezultātus, tostarp mainīgo stāvokli un jūsu programmas ģenerēto izvadi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai sāktu Rakudo čaulu, vienkārši ievadiet:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izvade var atšķirties atkarībā no pašlaik instalētās kompilatora versijas.<\/span> <span class=\"sg\" data-s=\"1\">Iepriekš minētajā izvadē čaula iesaka instalēt dažus moduļus labākai lietotāja pieredzei, tāpēc jūs redzat atbilstošo ziņojumu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beigās ir uzvednes rakstzīme <code>&gt;<\/code>, kurā varat ievadīt savu programmu vai tās daļas.<\/span> <span class=\"sg\" data-s=\"1\">Čaula to kompilēs pa rindai, tiklīdz nospiedīsiet Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"ru":{"t":"Запуск из REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL означает <em>Read–eval–print loop<\/em> (прочитать-выполнить-вывести-повторить).<\/span> <span class=\"sg\" data-s=\"1\">Это встроенная командная оболочка, которая позволяет вам писать инструкции и выводить промежуточные результаты на экран, включая состояние переменных и вывод, генерируемый вашей программой.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы запустить командную оболочку Rakudo, просто напишите:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вывод может зависеть от установленной версии компилятора.<\/span> <span class=\"sg\" data-s=\"1\">В выводе выше REPL рекомендует установить некоторые модули для более удобной работы, поэтому вы видите соответствующее сообщение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В конце присутствует символ запроса <code>&gt;<\/code>, где вы можете вводить вашу программу или ее части.<\/span> <span class=\"sg\" data-s=\"1\">REPL скомпилирует все, строчка за строчкой, как только вы нажмете клавишу Enter.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; say 'Hello, World';\nHello, World\n&gt;<\/code><\/pre>"]]},"uk":{"t":"Запуск з REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL означає <em>Read–eval–print loop<\/em> (цикл читання-оцінки-друку).<\/span> <span class=\"sg\" data-s=\"1\">Це вбудований режим оболонки, де ви можете вводити інструкції та отримувати проміжний результат на екрані, включаючи стан змінних та вихідні дані, які генерує ваша програма.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб запустити оболонку Rakudo, просто введіть:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вихід може залежати від поточно встановленої версії компілятора.<\/span> <span class=\"sg\" data-s=\"1\">У наведеному вище виході оболонка рекомендує встановити деякі модулі для кращого користувацького досвіду, тому ви бачите відповідне повідомлення.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В кінці є символ запиту <code>&gt;<\/code>, де ви можете вводити свою програму або її частини.<\/span> <span class=\"sg\" data-s=\"1\">Оболонка буде компілювати її рядок за рядком, як тільки ви натиснете Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"bg":{"t":"Изпълнение от REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL означава <em>Read–eval–print loop<\/em> (Чети-изпълнявай-печатай цикъл).<\/span> <span class=\"sg\" data-s=\"1\">Това е вграден режим на обвивка, където можете да въвеждате инструкции и да получавате междинен резултат на екрана, включително състоянието на променливите и изхода, който вашата програма генерира.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да стартирате Rakudo обвивката, просто въведете:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изходът може да зависи от текущо инсталираната версия на компилатора.<\/span> <span class=\"sg\" data-s=\"1\">В горния изход обвивката препоръчва да инсталирате някои модули за по-добро потребителско изживяване, така че виждате съответното съобщение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В края има символ за подканяне <code>&gt;<\/code>, където можете да въведете вашата програма или нейните части.<\/span> <span class=\"sg\" data-s=\"1\">Обвивката ще я компилира ред по ред веднага щом натиснете Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"eo":{"t":"Lanĉado de REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL signifas <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas enkonstruita ŝelreĝimo, kie vi povas tajpi instrukciojn kaj ricevi interan rezulton sur la ekrano, inkluzive la staton de la variabloj kaj la eliron, kiun via programo generas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por starti Rakudo-ŝelon, simple tajpu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La eligo povas dependi de la nuntempe instalita versio de la kompililo.<\/span> <span class=\"sg\" data-s=\"1\">En la supra eligo, la ŝelo rekomendas instali kelkajn modulojn por pli bona uzanta sperto, do vi vidas la respondan mesaĝon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fine, estas streketo <code>&gt;<\/code> kie vi povas tajpi vian programon aŭ ĝiajn partojn.<\/span> <span class=\"sg\" data-s=\"1\">La ŝelo kompilos ĝin linion post linio tuj kiam vi premos Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"la":{"t":"Currendo ex REPL","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">REPL significat <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Est modus testudinis in aedificatus ubi potes instructiones scribere et eventum intermedium in screen videre, inclusa statu variabilium et output quod programma tuum generat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad initium Rakudo testudinis, simpliciter scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Output potest dependere a versione compilatoris quae nunc est installata.<\/span> <span class=\"sg\" data-s=\"1\">In output supra, testudo commendat ut aliquos modulos installes pro meliore usore experientia, ita vides nuntium correspondens.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In fine, est character promptus <code>&gt;<\/code> ubi potes scribere programma tuum vel partes eius.<\/span> <span class=\"sg\" data-s=\"1\">Testudo illud lineam per lineam compilabit simul ac premas Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; dic 'Salve, Munde';     Salve, Munde     &gt;<\/span><\/p>"]]}}}</script>
