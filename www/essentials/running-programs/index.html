<script type="application/json" id="page-data">{"u":"essentials/running-programs","n":12,"k":"section","pv":"essentials/on-unicode","nx":"essentials/running-programs/from-command-line","tr":["essentials"],"L":{"en":{"t":"Running programs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">one of the previous sections<\/a>, we created a simple program but did not run it yet.<\/span> <span class=\"sg\" data-s=\"1\">There are many ways of running the program: using an installed command-line tool, using a REPL shell, running a program directly from an <a href=\"/essentials/editors-and-ides/\">IDE<\/a> or using an online service such as <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, or using a docker container.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">There are five topics in this section.<\/span> <span class=\"sg\" data-s=\"1\">Browse all of them or examine only those that you find suitable for your needs.<\/span> <span class=\"sg\" data-s=\"2\">After the sections, there is an assignment.<\/span><\/p>"]]},"de":{"t":"Programme ausführen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">einem der vorherigen Abschnitte<\/a> haben wir ein einfaches Programm erstellt, es aber noch nicht ausgeführt.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt viele Möglichkeiten, das Programm auszuführen: mit einem installierten Befehlszeilentool, mit einer REPL-Shell, durch direktes Ausführen eines Programms aus einer <a href=\"/essentials/editors-and-ides/\">IDE<\/a> oder durch die Nutzung eines Online-Dienstes wie <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a> oder durch die Verwendung eines Docker-Containers.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt fünf Themen in diesem Abschnitt.<\/span> <span class=\"sg\" data-s=\"1\">Durchsuchen Sie alle oder untersuchen Sie nur diejenigen, die für Ihre Bedürfnisse geeignet sind.<\/span> <span class=\"sg\" data-s=\"2\">Nach den Abschnitten gibt es eine Aufgabe.<\/span><\/p>"]]},"nl":{"t":"Programma's uitvoeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">een van de vorige secties<\/a> hebben we een eenvoudig programma gemaakt, maar we hebben het nog niet uitgevoerd.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn veel manieren om het programma uit te voeren: met behulp van een geïnstalleerd opdrachtregelhulpmiddel, met behulp van een REPL-shell, het direct uitvoeren van een programma vanuit een <a href=\"/essentials/editors-and-ides/\">IDE<\/a> of met een online dienst zoals <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, of met behulp van een docker-container.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er zijn vijf onderwerpen in deze sectie.<\/span> <span class=\"sg\" data-s=\"1\">Blader door alle onderwerpen of bekijk alleen die welke je geschikt vindt voor jouw behoeften.<\/span> <span class=\"sg\" data-s=\"2\">Na de secties is er een opdracht.<\/span><\/p>"]]},"es":{"t":"Ejecución de programas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En <a href=\"/essentials/hello-world/\">una de las secciones anteriores<\/a>, creamos un programa simple pero aún no lo ejecutamos.<\/span> <span class=\"sg\" data-s=\"1\">Hay muchas formas de ejecutar el programa: usando una herramienta de línea de comandos instalada, usando un shell REPL, ejecutando un programa directamente desde un <a href=\"/essentials/editors-and-ides/\">IDE<\/a> o usando un servicio en línea como <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, o usando un contenedor de Docker.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay cinco temas en esta sección.<\/span> <span class=\"sg\" data-s=\"1\">Revisa todos ellos o examina solo aquellos que encuentres adecuados para tus necesidades.<\/span> <span class=\"sg\" data-s=\"2\">Después de las secciones, hay una tarea.<\/span><\/p>"]]},"it":{"t":"Esecuzione dei programmi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">una delle sezioni precedenti<\/a>, abbiamo creato un semplice programma ma non lo abbiamo ancora eseguito.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono molti modi per eseguire il programma: utilizzando uno strumento da riga di comando installato, utilizzando una shell REPL, eseguendo un programma direttamente da un <a href=\"/essentials/editors-and-ides/\">IDE<\/a> o utilizzando un servizio online come <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, o utilizzando un container docker.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ci sono cinque argomenti in questa sezione.<\/span> <span class=\"sg\" data-s=\"1\">Esplora tutti o esamina solo quelli che ritieni adatti alle tue esigenze.<\/span> <span class=\"sg\" data-s=\"2\">Dopo le sezioni, c'è un compito.<\/span><\/p>"]]},"lv":{"t":"Programmu palaišana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><a href=\"/essentials/hello-world/\">Vienā no iepriekšējām sadaļām<\/a> mēs izveidojām vienkāršu programmu, bet vēl to nebijām palaiduši.<\/span> <span class=\"sg\" data-s=\"1\">Ir daudz veidu, kā palaist programmu: izmantojot instalētu komandrindas rīku, izmantojot REPL čaulu, palaižot programmu tieši no <a href=\"/essentials/editors-and-ides/\">IDE<\/a> vai izmantojot tiešsaistes pakalpojumu, piemēram, <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, vai izmantojot Docker konteineru.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā ir pieci temati.<\/span> <span class=\"sg\" data-s=\"1\">Pārlūkojiet visus vai izpētiet tikai tos, kas jums šķiet piemēroti jūsu vajadzībām.<\/span> <span class=\"sg\" data-s=\"2\">Pēc sadaļām ir uzdevums.<\/span><\/p>"]]},"ru":{"t":"Запуск программ","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">одной из предыдущих глав<\/a> мы написали простую программу, но пока ее не запускали.<\/span> <span class=\"sg\" data-s=\"1\">Есть много способов запустить программу: с помощью установленной программы в командной строке, используя REPL, запустить программу напрямую из <a href=\"/essentials/editors-and-ides/\">IDE<\/a>, запустить ее в онлайн сервисе, таком как <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, или с помощью Docker контейнера.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этой теме есть пять глав.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете посмотреть их все или просмотреть только те, которые вам кажутся наиболее подходящими.<\/span> <span class=\"sg\" data-s=\"2\">После глав следует упражнение.<\/span><\/p>"]]},"uk":{"t":"Запуск програм","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">одному з попередніх розділів<\/a> ми створили просту програму, але ще не запускали її.<\/span> <span class=\"sg\" data-s=\"1\">Існує багато способів запуску програми: використовуючи встановлений інструмент командного рядка, використовуючи REPL оболонку, запускаючи програму безпосередньо з <a href=\"/essentials/editors-and-ides/\">IDE<\/a> або використовуючи онлайн-сервіс, такий як <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, або використовуючи docker-контейнер.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі є п'ять тем.<\/span> <span class=\"sg\" data-s=\"1\">Перегляньте всі або ознайомтеся лише з тими, які вам підходять.<\/span> <span class=\"sg\" data-s=\"2\">Після розділів є завдання.<\/span><\/p>"]]},"bg":{"t":"Изпълнение на програми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">една от предишните секции<\/a> създадохме проста програма, но все още не я стартирахме.<\/span> <span class=\"sg\" data-s=\"1\">Има много начини за стартиране на програмата: използване на инсталиран команден инструмент, използване на REPL shell, стартиране на програма директно от <a href=\"/essentials/editors-and-ides/\">IDE<\/a> или използване на онлайн услуга като <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, или използване на docker контейнер.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В тази секция има пет теми.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте всички тях или само тези, които смятате за подходящи за вашите нужди.<\/span> <span class=\"sg\" data-s=\"2\">След секциите има задача.<\/span><\/p>"]]},"eo":{"t":"Lanĉado de programoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En <a href=\"/essentials/hello-world/\">unu el la antaŭaj sekcioj<\/a>, ni kreis simplan programon sed ankoraŭ ne rulis ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Estas multaj manieroj por ruli la programon: uzante instalitan komandlinian ilon, uzante REPL-ŝelon, rulante programon rekte el <a href=\"/essentials/editors-and-ides/\">IDE<\/a> aŭ uzante interretan servon kiel <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, aŭ uzante docker-ujon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas kvin temoj en ĉi tiu sekcio.<\/span> <span class=\"sg\" data-s=\"1\">Foliumu ĉiujn aŭ ekzamenadu nur tiujn, kiujn vi trovas taŭgaj por viaj bezonoj.<\/span> <span class=\"sg\" data-s=\"2\">Post la sekcioj, estas tasko.<\/span><\/p>"]]},"la":{"t":"Currendo programmata","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">una ex sectionibus praecedentibus<\/a>, programma simplex creavimus sed nondum eum currimus.<\/span> <span class=\"sg\" data-s=\"1\">Multae sunt viae ad currendum programma: utens instrumento mandati-lineae installato, utens REPL concha, currens programma directe ex <a href=\"/essentials/editors-and-ides/\">IDE<\/a> vel utens servitio online sicut <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>, vel utens docker continens.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quinque sunt argumenta in hac sectione.<\/span> <span class=\"sg\" data-s=\"1\">Omnia perlustra aut tantum ea quae tibi apta videntur examina.<\/span> <span class=\"sg\" data-s=\"2\">Post sectiones, assignatio est.<\/span><\/p>"]]}}}</script>
