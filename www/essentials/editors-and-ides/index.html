<script type="application/json" id="page-data">{"u":"essentials/editors-and-ides","n":8,"k":"section","pv":"essentials/how-to-install-rakupp","nx":"essentials/conventional-file-extensions","tr":["essentials"],"L":{"en":{"t":"Editors and IDEs for Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The Raku programs are written as plain text and usually are kept in text files (the exception is the programs that you run online or in the command line or prepare to be executed via <code>EVAL<\/code> or some other rare cases).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">It is assumed that the program source is a UTF-8 text.<\/span> <span class=\"sg\" data-s=\"1\">You can thus use any text editor that does not save formatting instructions in the document.<\/span> <span class=\"sg\" data-s=\"2\">While you can use <code>vim<\/code>, or <code>nano<\/code>, or <code>emacs<\/code>, or <code>mcedit<\/code> and be happy with your choice, you may also want to try a couple of currently trending applications.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">External links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are the links to the popular IDEs.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — available for Windows, Mac OS, and Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — the Raku IDE built specifically for programming in Raku; available for Windows, Mac OS, and Linux.<\/span><\/li><\/ul>"]]},"de":{"t":"Editoren und IDEs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Raku-Programme werden als Klartext geschrieben und normalerweise in Textdateien gespeichert (Ausnahmen sind Programme, die Sie online oder in der Befehlszeile ausführen oder zur Ausführung über <code>EVAL<\/code> oder einige andere seltene Fälle vorbereiten).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es wird davon ausgegangen, dass der Programmquelltext UTF-8-Text ist.<\/span> <span class=\"sg\" data-s=\"1\">Sie können daher jeden Texteditor verwenden, der keine Formatierungsanweisungen im Dokument speichert.<\/span> <span class=\"sg\" data-s=\"2\">Während Sie <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> oder <code>mcedit<\/code> verwenden und mit Ihrer Wahl zufrieden sein können, möchten Sie vielleicht auch ein paar derzeit angesagte Anwendungen ausprobieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe Links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind die Links zu den beliebten IDEs.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — verfügbar für Windows, Mac OS und Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — die Raku-IDE, die speziell für die Programmierung in Raku entwickelt wurde; verfügbar für Windows, Mac OS und Linux.<\/span><\/li><\/ul>"]]},"nl":{"t":"Editors en IDE's","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De Raku-programma's worden geschreven als platte tekst en worden meestal opgeslagen in tekstbestanden (de uitzondering zijn de programma's die je online uitvoert of in de opdrachtregel of voorbereidt om uitgevoerd te worden via <code>EVAL<\/code> of enkele andere zeldzame gevallen).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er wordt aangenomen dat de broncode van het programma een UTF-8 tekst is.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dus elke teksteditor gebruiken die geen opmaak instructies opslaat in het document.<\/span> <span class=\"sg\" data-s=\"2\">Hoewel je <code>vim<\/code>, of <code>nano<\/code>, of <code>emacs<\/code>, of <code>mcedit<\/code> kunt gebruiken en tevreden kunt zijn met je keuze, wil je misschien ook een paar van de momenteel trending applicaties proberen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn de links naar de populaire IDE's.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — beschikbaar voor Windows, Mac OS en Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — de Raku IDE die specifiek is gebouwd voor programmeren in Raku; beschikbaar voor Windows, Mac OS en Linux.<\/span><\/li><\/ul>"]]},"es":{"t":"Editores e IDEs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Los programas en Raku se escriben como texto plano y generalmente se guardan en archivos de texto (la excepción son los programas que ejecutas en línea o en la línea de comandos o preparas para ser ejecutados a través de <code>EVAL<\/code> u otros casos raros).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se asume que el código fuente del programa es un texto UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Por lo tanto, puedes usar cualquier editor de texto que no guarde instrucciones de formato en el documento.<\/span> <span class=\"sg\" data-s=\"2\">Aunque puedes usar <code>vim<\/code>, o <code>nano<\/code>, o <code>emacs<\/code>, o <code>mcedit<\/code> y estar contento con tu elección, también puedes querer probar un par de aplicaciones que están en tendencia actualmente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enlaces externos<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí están los enlaces a los IDEs populares.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — disponible para Windows, Mac OS y Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — el IDE de Raku construido específicamente para programar en Raku; disponible para Windows, Mac OS y Linux.<\/span><\/li><\/ul>"]]},"it":{"t":"Editor e IDE","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">I programmi Raku sono scritti come testo semplice e di solito vengono conservati in file di testo (l'eccezione sono i programmi che esegui online o nella riga di comando o prepari per essere eseguiti tramite <code>EVAL<\/code> o altri casi rari).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si presume che il codice sorgente del programma sia un testo UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Puoi quindi utilizzare qualsiasi editor di testo che non salvi istruzioni di formattazione nel documento.<\/span> <span class=\"sg\" data-s=\"2\">Mentre puoi usare <code>vim<\/code>, o <code>nano<\/code>, o <code>emacs<\/code>, o <code>mcedit<\/code> e essere soddisfatto della tua scelta, potresti anche voler provare un paio di applicazioni attualmente di tendenza.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Link esterni<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco i link agli IDE popolari.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — disponibile per Windows, Mac OS e Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — l'IDE Raku costruito specificamente per programmare in Raku; disponibile per Windows, Mac OS e Linux.<\/span><\/li><\/ul>"]]},"lv":{"t":"Redaktori un IDE","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku programmas tiek rakstītas kā vienkāršs teksts un parasti tiek glabātas teksta failos (izņēmumi ir programmas, kuras jūs palaidat tiešsaistē vai komandrindā vai sagatavojat izpildei ar <code>EVAL<\/code> vai dažos citos retākos gadījumos).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tiek pieņemts, ka programmas avots ir UTF-8 teksts.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat izmantot jebkuru teksta redaktoru, kas nesaglabā formatēšanas instrukcijas dokumentā.<\/span> <span class=\"sg\" data-s=\"2\">Lai gan jūs varat izmantot <code>vim<\/code>, vai <code>nano<\/code>, vai <code>emacs<\/code>, vai <code>mcedit<\/code> un būt apmierināts ar savu izvēli, jūs varat arī vēlēties izmēģināt pāris pašreiz populāras lietotnes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir saites uz populāriem IDE.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — pieejams Windows, Mac OS un Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — Raku IDE, kas īpaši izveidots programmēšanai Raku valodā; pieejams Windows, Mac OS un Linux.<\/span><\/li><\/ul>"]]},"ru":{"t":"Текстовые редакторы и IDE","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Программы на Raku пишутся простым текстом и хранятся в текстовых файлах (за исключением запуска программ в онлайн сервисах или в командной строке или через <code>EVAL<\/code> или в других редких случаях).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Предполагается, что файлы используют кодировку UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете использовать любой текстовый редактор, который не сохраняет инструкции форматирования в документе.<\/span> <span class=\"sg\" data-s=\"2\">И хотя вы можете успешно использовать <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> или <code>mcedit<\/code>, вы также можете попробовать несколько популярных приложений.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ниже есть ссылки на популярные интегрированные среды разработки:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — доступен на Windows, Mac OS и Linux.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — интегрированная среда разработки специально для разработки на Raku, написанная на Raku; доступна на Windows, Mac OS и Linux.<\/span><\/li><\/ul>"]]},"uk":{"t":"Редактори та IDE","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Програми Raku пишуться як звичайний текст і зазвичай зберігаються у текстових файлах (виняток становлять програми, які ви запускаєте онлайн або в командному рядку, або готуєте для виконання через <code>EVAL<\/code> чи в інших рідкісних випадках).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Передбачається, що вихідний код програми є текстом у кодуванні UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Таким чином, ви можете використовувати будь-який текстовий редактор, який не зберігає інструкції форматування в документі.<\/span> <span class=\"sg\" data-s=\"2\">Хоча ви можете використовувати <code>vim<\/code>, або <code>nano<\/code>, або <code>emacs<\/code>, або <code>mcedit<\/code> і бути задоволеними своїм вибором, ви також можете спробувати кілька популярних на сьогодні додатків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось посилання на популярні IDE.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — доступний для Windows, Mac OS та Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE для Raku, створений спеціально для програмування на Raku; доступний для Windows, Mac OS та Linux.<\/span><\/li><\/ul>"]]},"bg":{"t":"Редактори и IDE","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмите на Raku се пишат като обикновен текст и обикновено се съхраняват в текстови файлове (изключение правят програмите, които се изпълняват онлайн или в командния ред или се подготвят за изпълнение чрез <code>EVAL<\/code> или някои други редки случаи).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Предполага се, че изходният код на програмата е текст в UTF-8 формат.<\/span> <span class=\"sg\" data-s=\"1\">Следователно, можете да използвате всеки текстов редактор, който не записва инструкции за форматиране в документа.<\/span> <span class=\"sg\" data-s=\"2\">Докато можете да използвате <code>vim<\/code>, или <code>nano<\/code>, или <code>emacs<\/code>, или <code>mcedit<\/code> и да бъдете доволни от избора си, може също така да искате да опитате няколко от текущо популярните приложения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето връзки към популярните IDE.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — наличен за Windows, Mac OS и Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE за Raku, създаден специално за програмиране на Raku; наличен за Windows, Mac OS и Linux.<\/span><\/li><\/ul>"]]},"eo":{"t":"Redaktiloj kaj IDEj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La Raku-programoj estas skribitaj kiel simpla teksto kaj kutime estas konservitaj en tekstaj dosieroj (la escepto estas la programoj, kiujn vi rulas rete aŭ en la komandlinio aŭ preparas por esti ekzekutitaj per <code>EVAL<\/code> aŭ kelkaj aliaj raraj kazoj).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Supozatas, ke la programfonto estas UTF-8-teksto.<\/span> <span class=\"sg\" data-s=\"1\">Vi do povas uzi ajnan tekstredaktilon, kiu ne konservas formatigajn instrukciojn en la dokumento.<\/span> <span class=\"sg\" data-s=\"2\">Dum vi povas uzi <code>vim<\/code>, aŭ <code>nano<\/code>, aŭ <code>emacs<\/code>, aŭ <code>mcedit<\/code> kaj esti feliĉa kun via elekto, vi ankaŭ eble volas provi kelkajn nuntempe modajn aplikaĵojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la ligiloj al la popularaj IDE-oj.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — disponebla por Vindozo, Mac OS, kaj Linukso<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — la Raku IDE konstruita specife por programado en Raku; disponebla por Vindozo, Mac OS, kaj Linukso.<\/span><\/li><\/ul>"]]},"la":{"t":"Editores et IDEs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmata Raku ut textus simplices scribuntur et plerumque in fasciculis textus servantur (exceptio sunt programmata quae online curris aut in linea mandati aut praeparas ut per <code>EVAL<\/code> aut aliquos alios casus rariores exsequantur).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Assumitur quod fons programmatis est textus UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Ergo uti potes quolibet editori textus qui instructiones formandas in documento non servat.<\/span> <span class=\"sg\" data-s=\"2\">Dum uti potes <code>vim<\/code>, aut <code>nano<\/code>, aut <code>emacs<\/code>, aut <code>mcedit<\/code> et cum tua electione felix esse, fortasse etiam vis experiri aliquas applicationes nunc populares.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt nexus ad IDEs populares.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — disponibile pro Fenestra, Mac OS, et Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — Raku IDE specialiter ad programmata in Raku scribenda; disponibile pro Fenestra, Mac OS, et Linux.<\/span><\/li><\/ul>"]]}}}</script>
