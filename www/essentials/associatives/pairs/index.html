<script type="application/json" id="page-data">{"u":"essentials/associatives/pairs","n":244,"k":"topic","pv":"essentials/associatives","nx":"essentials/associatives/pairs/quiz","tr":["essentials","essentials/associatives"],"L":{"en":{"t":"Pairs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A pair is a data structure that keeps a name and a value.<\/span> <span class=\"sg\" data-s=\"1\">They form a solid object which can be stored in a scalar variable.<\/span> <span class=\"sg\" data-s=\"2\">Here is an example of how you create a pair:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The type of the variable <code>$pair<\/code> is <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It is possible to access the name and the value separately by using the corresponding methods <code>key<\/code> and <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">An important feature of pairs is they are immutable objects.<\/span> <span class=\"sg\" data-s=\"1\">It means that you cannot assign a new value or give a new name to an existing pair.<\/span> <span class=\"sg\" data-s=\"2\">But you can assign a completely new pair to the same variable, of course:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subscripting<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">There is another method of reading the value of a pair.<\/span> <span class=\"sg\" data-s=\"1\">You can subscript it with the name of its key between angle brackets.<\/span> <span class=\"sg\" data-s=\"2\">This is how you do that:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notice that there is no need to quote the name of the key if it contains no spaces.<\/span> <span class=\"sg\" data-s=\"1\">If it does, things become a bit stricter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Do not miss the fact that curly braces are used this time.<\/span><\/p>"]]},"de":{"t":"Paare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Paar ist eine Datenstruktur, die einen Namen und einen Wert speichert.<\/span> <span class=\"sg\" data-s=\"1\">Sie bilden ein festes Objekt, das in einer skalaren Variablen gespeichert werden kann.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist ein Beispiel, wie man ein Paar erstellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Typ der Variablen <code>$pair<\/code> ist <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es ist möglich, den Namen und den Wert separat zuzugreifen, indem man die entsprechenden Methoden <code>key<\/code> und <code>value<\/code> verwendet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein wichtiges Merkmal von Paaren ist, dass sie unveränderliche Objekte sind.<\/span> <span class=\"sg\" data-s=\"1\">Das bedeutet, dass man einem bestehenden Paar keinen neuen Wert zuweisen oder einen neuen Namen geben kann.<\/span> <span class=\"sg\" data-s=\"2\">Aber man kann natürlich ein komplett neues Paar derselben Variablen zuweisen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indizierung<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt eine weitere Methode, den Wert eines Paares zu lesen.<\/span> <span class=\"sg\" data-s=\"1\">Man kann es mit dem Namen seines Schlüssels in spitzen Klammern indizieren.<\/span> <span class=\"sg\" data-s=\"2\">So macht man das:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass es nicht notwendig ist, den Namen des Schlüssels zu zitieren, wenn er keine Leerzeichen enthält.<\/span> <span class=\"sg\" data-s=\"1\">Wenn doch, werden die Dinge etwas strenger:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass diesmal geschweifte Klammern verwendet werden.<\/span><\/p>"]]},"nl":{"t":"Paren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een paar is een datastructuur die een naam en een waarde bewaart.<\/span> <span class=\"sg\" data-s=\"1\">Ze vormen een solide object dat in een scalair variabele kan worden opgeslagen.<\/span> <span class=\"sg\" data-s=\"2\">Hier is een voorbeeld van hoe je een paar maakt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het type van de variabele <code>$pair<\/code> is <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is mogelijk om de naam en de waarde afzonderlijk te benaderen door gebruik te maken van de corresponderende methoden <code>key<\/code> en <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een belangrijk kenmerk van paren is dat ze onveranderlijke objecten zijn.<\/span> <span class=\"sg\" data-s=\"1\">Dit betekent dat je geen nieuwe waarde kunt toewijzen of een nieuwe naam kunt geven aan een bestaand paar.<\/span> <span class=\"sg\" data-s=\"2\">Maar je kunt natuurlijk wel een volledig nieuw paar toewijzen aan dezelfde variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subscriptie<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er is een andere methode om de waarde van een paar te lezen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het subscripten met de naam van de sleutel tussen hoekige haken.<\/span> <span class=\"sg\" data-s=\"2\">Dit is hoe je dat doet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat het niet nodig is om de naam van de sleutel te citeren als deze geen spaties bevat.<\/span> <span class=\"sg\" data-s=\"1\">Als dat wel het geval is, worden de regels iets strikter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mis niet het feit dat deze keer accolades worden gebruikt.<\/span><\/p>"]]},"es":{"t":"Pares","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un par es una estructura de datos que mantiene un nombre y un valor.<\/span> <span class=\"sg\" data-s=\"1\">Forman un objeto sólido que puede almacenarse en una variable escalar.<\/span> <span class=\"sg\" data-s=\"2\">Aquí hay un ejemplo de cómo crear un par:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El tipo de la variable <code>$pair<\/code> es <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es posible acceder al nombre y al valor por separado utilizando los métodos correspondientes <code>key<\/code> y <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una característica importante de los pares es que son objetos inmutables.<\/span> <span class=\"sg\" data-s=\"1\">Esto significa que no puedes asignar un nuevo valor o dar un nuevo nombre a un par existente.<\/span> <span class=\"sg\" data-s=\"2\">Pero, por supuesto, puedes asignar un par completamente nuevo a la misma variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subíndices<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay otro método para leer el valor de un par.<\/span> <span class=\"sg\" data-s=\"1\">Puedes subíndicarlo con el nombre de su clave entre corchetes angulares.<\/span> <span class=\"sg\" data-s=\"2\">Así es como se hace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Observa que no es necesario entrecomillar el nombre de la clave si no contiene espacios.<\/span> <span class=\"sg\" data-s=\"1\">Si los contiene, las cosas se vuelven un poco más estrictas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">No te pierdas el hecho de que esta vez se utilizan llaves.<\/span><\/p>"]]},"it":{"t":"Coppie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una coppia è una struttura dati che mantiene un nome e un valore.<\/span> <span class=\"sg\" data-s=\"1\">Formano un oggetto solido che può essere memorizzato in una variabile scalare.<\/span> <span class=\"sg\" data-s=\"2\">Ecco un esempio di come creare una coppia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il tipo della variabile <code>$pair<\/code> è <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">È possibile accedere al nome e al valore separatamente utilizzando i metodi corrispondenti <code>key<\/code> e <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una caratteristica importante delle coppie è che sono oggetti immutabili.<\/span> <span class=\"sg\" data-s=\"1\">Ciò significa che non puoi assegnare un nuovo valore o dare un nuovo nome a una coppia esistente.<\/span> <span class=\"sg\" data-s=\"2\">Ma puoi assegnare una coppia completamente nuova alla stessa variabile, ovviamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sottoscrizione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">C'è un altro metodo per leggere il valore di una coppia.<\/span> <span class=\"sg\" data-s=\"1\">Puoi sottoscriverla con il nome della sua chiave tra parentesi angolari.<\/span> <span class=\"sg\" data-s=\"2\">Ecco come fare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che non è necessario citare il nome della chiave se non contiene spazi.<\/span> <span class=\"sg\" data-s=\"1\">Se lo fa, le cose diventano un po' più rigorose:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Non perdere di vista il fatto che questa volta vengono utilizzate le parentesi graffe.<\/span><\/p>"]]},"lv":{"t":"Pāri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pāris ir datu struktūra, kas saglabā vārdu un vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tie veido cietu objektu, kuru var glabāt skalārā mainīgajā.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir piemērs, kā izveidot pāri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīgā <code>$pair<\/code> tips ir <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams piekļūt vārdam un vērtībai atsevišķi, izmantojot atbilstošās metodes <code>key<\/code> un <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Svarīga pāru īpašība ir tā, ka tie ir nemainīgi objekti.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka nevar piešķirt jaunu vērtību vai dot jaunu vārdu esošam pārim.<\/span> <span class=\"sg\" data-s=\"2\">Bet, protams, var piešķirt pilnīgi jaunu pāri tam pašam mainīgajam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksēšana<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir vēl viena metode, kā nolasīt pāra vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Varat to indeksēt ar tā atslēgas nosaukumu leņķa iekavās.<\/span> <span class=\"sg\" data-s=\"2\">Lūk, kā to izdarīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka nav nepieciešams citēt atslēgas nosaukumu, ja tajā nav atstarpju.<\/span> <span class=\"sg\" data-s=\"1\">Ja tās ir, lietas kļūst nedaudz stingrākas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nepalaidiet garām faktu, ka šoreiz tiek izmantotas līkās iekavas.<\/span><\/p>"]]},"ru":{"t":"Пары","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара — это структура данных, которая содержит имя и значение.<\/span> <span class=\"sg\" data-s=\"1\">Они образуют целостный объект, который можно хранить в скалярной переменной.<\/span> <span class=\"sg\" data-s=\"2\">Вот пример того, как создать пару:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тип переменной <code>$pair<\/code> — <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можно получить доступ к имени и значению отдельно, используя соответствующие методы <code>key<\/code> и <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важной особенностью пар является то, что они являются неизменяемыми объектами.<\/span> <span class=\"sg\" data-s=\"1\">Это означает, что вы не можете присвоить новое значение или дать новое имя существующей паре.<\/span> <span class=\"sg\" data-s=\"2\">Но, конечно, вы можете присвоить совершенно новую пару той же переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексация<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Существует другой метод чтения значения пары.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете индексировать его с помощью имени ключа в угловых скобках.<\/span> <span class=\"sg\" data-s=\"2\">Вот как это делается:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что нет необходимости заключать имя ключа в кавычки, если оно не содержит пробелов.<\/span> <span class=\"sg\" data-s=\"1\">Если содержит, то правила становятся немного строже:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что в этом случае используются фигурные скобки.<\/span><\/p>"]]},"uk":{"t":"Пари","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара — це структура даних, яка зберігає ім'я та значення.<\/span> <span class=\"sg\" data-s=\"1\">Вони утворюють цілісний об'єкт, який можна зберігати в скалярній змінній.<\/span> <span class=\"sg\" data-s=\"2\">Ось приклад, як створити пару:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тип змінної <code>$pair<\/code> — <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можливо окремо отримати доступ до імені та значення, використовуючи відповідні методи <code>key<\/code> та <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важливою особливістю пар є те, що вони є незмінними об'єктами.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що ви не можете призначити нове значення або дати нове ім'я існуючій парі.<\/span> <span class=\"sg\" data-s=\"2\">Але ви, звичайно, можете призначити повністю нову пару тій самій змінній:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Індексування<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Існує ще один метод читання значення пари.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете індексувати її за допомогою імені її ключа в кутових дужках.<\/span> <span class=\"sg\" data-s=\"2\">Ось як це зробити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що немає потреби цитувати ім'я ключа, якщо воно не містить пробілів.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ж містить, правила стають трохи суворішими:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що цього разу використовуються фігурні дужки.<\/span><\/p>"]]},"bg":{"t":"Двойки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Двойката е структура от данни, която съхранява име и стойност.<\/span> <span class=\"sg\" data-s=\"1\">Те формират солиден обект, който може да бъде съхранен в скаларна променлива.<\/span> <span class=\"sg\" data-s=\"2\">Ето пример как се създава двойка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типът на променливата <code>$pair<\/code> е <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Възможно е да се достъпи името и стойността поотделно, като се използват съответните методи <code>key<\/code> и <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важна характеристика на двойките е, че те са неизменяеми обекти.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че не можете да присвоите нова стойност или да дадете ново име на съществуваща двойка.<\/span> <span class=\"sg\" data-s=\"2\">Но, разбира се, можете да присвоите напълно нова двойка на същата променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има и друг метод за четене на стойността на двойка.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я индексирате с името на нейния ключ между ъглови скоби.<\/span> <span class=\"sg\" data-s=\"2\">Ето как става това:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че няма нужда да цитирате името на ключа, ако то не съдържа интервали.<\/span> <span class=\"sg\" data-s=\"1\">Ако съдържа, нещата стават малко по-строги:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Не пропускайте факта, че този път се използват къдрави скоби.<\/span><\/p>"]]},"eo":{"t":"Paroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Paro estas datumstrukturo kiu konservas nomon kaj valoron.<\/span> <span class=\"sg\" data-s=\"1\">Ili formas solidan objekton kiu povas esti stokita en skalarvariablo.<\/span> <span class=\"sg\" data-s=\"2\">Jen ekzemplo de kiel vi kreas paron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La tipo de la variablo <code>$pair<\/code> estas <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eblas aliri la nomon kaj la valoron aparte uzante la respektivajn metodojn <code>key<\/code> kaj <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Grava trajto de paroj estas ke ili estas nemoveblaj objektoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas ke vi ne povas asigni novan valoron aŭ doni novan nomon al ekzistanta paro.<\/span> <span class=\"sg\" data-s=\"2\">Sed vi povas asigni tute novan paron al la sama variablo, kompreneble:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subskribo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas alia metodo por legi la valoron de paro.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas subskribi ĝin per la nomo de ĝia ŝlosilo inter angulaj krampoj.<\/span> <span class=\"sg\" data-s=\"2\">Jen kiel vi faras tion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rimarku ke ne necesas citi la nomon de la ŝlosilo se ĝi ne enhavas spacojn.<\/span> <span class=\"sg\" data-s=\"1\">Se ĝi enhavas, aferoj fariĝas iom pli striktaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ne preterlasu la fakton ke kurbaj krampoj estas uzataj ĉi-foje.<\/span><\/p>"]]},"la":{"t":"Paria","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Par est structura datae quae nomen et valorem continet.<\/span> <span class=\"sg\" data-s=\"1\">Formant solidum obiectum quod in variabili scalari condi potest.<\/span> <span class=\"sg\" data-s=\"2\">Hic est exemplum quomodo par creas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Typus variabilis <code>$pair<\/code> est <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Possibile est nomen et valorem seorsum accedere per methodos correspondentes <code>key<\/code> et <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Res magni momenti de paribus est quod sunt obiecta immutabilia.<\/span> <span class=\"sg\" data-s=\"1\">Significat te non posse novum valorem assignare vel novum nomen dare par existente.<\/span> <span class=\"sg\" data-s=\"2\">Sed potes omnino novum par eidem variabili assignare, scilicet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subscripting<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Est alia methodus legendi valorem paris.<\/span> <span class=\"sg\" data-s=\"1\">Potes illud subscriptum cum nomine clavis suae inter angulares brackets.<\/span> <span class=\"sg\" data-s=\"2\">Hoc modo id facis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod non opus est nominare clavem si nullos spatia continet.<\/span> <span class=\"sg\" data-s=\"1\">Si continet, res paulo strictiores fiunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ne omittas quod hoc tempore braces curvatae adhibentur.<\/span><\/p>"]]}}}</script>
