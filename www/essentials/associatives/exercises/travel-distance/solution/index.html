};\n    say \"$from — $to: $distance km\";\n    $total += $distance;\n}\n\nsay \"Total trip: $total km\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму з усією структурою даних у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/travel-distance.raku\" target=\"_blank\" rel=\"noopener\">travel-distance.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для даного маршруту вивід програми показано нижче.<\/span> <span class=\"sg\" data-s=\"1\">Спробуйте інші шляхи через міста, які ми маємо у хеші <code>%distance<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/travel-distance.raku\nBerlin — Prague: 354 km\nPrague — Vienna: 312 km\nVienna — Zurich: 784 km\nZurich — Paris: 557 km\nTotal trip: 2007 km<\/code><\/pre>"]]},"bg":{"t":"Solution: Разстояние на пътуване*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Хешът от хешове, който ще намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/travel-distance/distances.raku\" target=\"_blank\" rel=\"noopener\">distances.raku<\/a>, е малко излишна, но много удобна структура от данни, която можете да използвате, за да получите разстоянието между всяка двойка градове.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Останалата част от програмата е няколко вложени цикъла, които сканират всички сегменти на маршрута и добавят към общото разстояние.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето решението, където големият набор от данни е показан само частично.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %distance = \n    Amsterdam =&gt; {\n        Athens =&gt; 3082,\n        Berlin =&gt; 648,\n        # . . .\n    },\n    # . . .\n    Zurich =&gt; {\n        Amsterdam =&gt; 861,\n        Athens =&gt; 2449,\n        # . . .\n    };\n\nmy @itinerary = &lt; Berlin Prague Vienna Zurich Paris &gt;;\n\nmy $total = 0;\nfor 0 .. @itinerary.elems - 2 -&gt; $index {\n    my $from = @itinerary[$index];\n    my $to = @itinerary[$index + 1];\n\n    my $distance = %distance{$from}{$to};\n    say \"$from — $to: $distance km\";\n    $total += $distance;\n}\n\nsay \"Total trip: $total km\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата с цялата структура от данни във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/travel-distance.raku\" target=\"_blank\" rel=\"noopener\">travel-distance.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За дадения маршрут, резултатът от програмата е показан по-долу.<\/span> <span class=\"sg\" data-s=\"1\">Опитайте други пътища през градовете, които имаме в хеша <code>%distance<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/travel-distance.raku\nBerlin — Prague: 354 km\nPrague — Vienna: 312 km\nVienna — Zurich: 784 km\nZurich — Paris: 557 km\nTotal trip: 2007 km<\/code><\/pre>"]]},"eo":{"t":"Solution: Vojaĝa distanco","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La tabelo de tabeloj, kiun vi trovas en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/travel-distance/distances.raku\" target=\"_blank\" rel=\"noopener\">distances.raku<\/a>, estas iom redundanta sed tre utila datuma strukturo, kiun vi povas uzi por akiri la distancon inter ajna paro de urboj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La resto de la programo estas kelkaj nestitaj bukloj por skani ĉiujn segmentojn de la itinero kaj aldoni al la totaloj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"s amlibet par civitatum.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Reliquum programma est par annulorum nidificatorum ad perscrutandas omnes segmenta itineris et ad summandas ad totales.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio ubi magnus datae set tantum partialiter ostenditur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %distance = \n    Amstelodamum =&gt; {\n        Athenae =&gt; 3082,\n        Berolinum =&gt; 648,\n        # . . .\n    },\n    # . . .\n    Turicum =&gt; {\n        Amstelodamum =&gt; 861,\n        Athenae =&gt; 2449,\n        # . . .\n    };\n\nmy @iter = &lt; Berolinum Praga Vindobona Turicum Lutetia &gt;;\n\nmy $total = 0;\nfor 0 .. @iter.elems - 2 -&gt; $index {\n    my $a = @iter[$index];\n    my $ad = @iter[$index + 1];\n\n    my $distantia = %distance{$a}{$ad};\n    dic \"$a — $ad: $distantia km\";\n    $total += $distantia;\n}\n\ndic \"Totum iter: $total km\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenies programma cum tota structura datae in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/travel-distance.raku\" target=\"_blank\" rel=\"noopener\">travel-distance.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro dato itinere, output programmatis infra ostenditur.<\/span> <span class=\"sg\" data-s=\"1\">Conare alias vias per civitates quas habemus in hash <code>%distance<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/travel-distance.raku\nBerolinum — Praga: 354 km\nPraga — Vindobona: 312 km\nVindobona — Turicum: 784 km\nTuricum — Lutetia: 557 km\nTotum iter: 2007 km<\/code><\/pre>"]]}}}</script>
