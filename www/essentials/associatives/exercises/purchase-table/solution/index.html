/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На втором уровне запись может быть сохранена в структуре хэша с несколькими именованными полями: <code>name<\/code>, <code>price<\/code> и <code>quantity<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Остальная часть программы заключается в цикле по элементам, вычислении итогов и выводе строк таблицы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно из возможных решений этой задачи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @items = [\n    {\n        name =&gt; 'Chairs',\n        price =&gt; 20.57,\n        quantity =&gt; 4,\n    },\n    {\n        name =&gt; 'Tables',\n        price =&gt; 50.18,\n        quantity =&gt; 1,\n    }\n];\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nfor @items -&gt; $item {\n    my $total = $item&lt;price&gt; * $item&lt;quantity&gt;;\n    say \"$item&lt;name&gt;\\t\\$$item&lt;price&gt;\\t$item&lt;quantity&gt;\\t\\$$total\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Найдите программу в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/purchase-table.raku\nItem\tPrice\tN\tTotal\nChairs\t$20.57\t4\t$82.28\nTables\t$50.18\t1\t$50.18<\/code><\/pre>"]]},"uk":{"t":"Solution: Таблиця покупок","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Таблиця містить заголовок (який ви просто виводите за допомогою одного <code>say<\/code>) і кілька рядків зі схожою структурою: назва товару, ціна товару, кількість і загальна вартість цих товарів.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки ви хочете зберегти порядок рядків, масив є хорошим вибором для зберігання товарів.<\/span> <span class=\"sg\" data-s=\"1\">Отже, кожен рядок таблиці відповідає одному елементу масиву.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На другому рівні запис можна зберегти в структурі хешу з кількома іменованими полями: <code>name<\/code>, <code>price<\/code> і <code>quantity<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Решта програми полягає в тому, щоб пройтися по товарах, обчислити загальну вартість і вивести рядки таблиці.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне з можливих рішень цього завдання:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @items = [\n    {\n        name =&gt; 'Chairs',\n        price =&gt; 20.57,\n        quantity =&gt; 4,\n    },\n    {\n        name =&gt; 'Tables',\n        price =&gt; 50.18,\n        quantity =&gt; 1,\n    }\n];\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nfor @items -&gt; $item {\n    my $total = $item&lt;price&gt; * $item&lt;quantity&gt;;\n    say \"$item&lt;name&gt;\\t\\$$item&lt;price&gt;\\t$item&lt;quantity&gt;\\t\\$$total\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/purchase-table.raku\nItem\tPrice\tN\tTotal\nChairs\t$20.57\t4\t$82.28\nTables\t$50.18\t1\t$50.18<\/code><\/pre>"]]},"bg":{"t":"Solution: Таблица за покупки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Таблицата съдържа заглавие (което просто отпечатвате с един <code>say<\/code>) и редица редове със сходна структура: име на артикул, цена на артикул, количество и обща стойност на тези артикули.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тъй като искате да запазите реда на редовете, масив е добър избор за съхраняване на артикулите.<\/span> <span class=\"sg\" data-s=\"1\">Така че, всеки ред от таблицата съответства на един елемент от масива.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На второ ниво, запис може да бъде съхранен в хеш структура с няколко именувани полета: <code>name<\/code>, <code>price<\/code> и <code>quantity<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Останалата част от програмата е да обхождате артикулите, изчислявате общите стойности и отпечатвате редовете на таблицата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно от възможните решения на тази задача:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @items = [\n    {\n        name =&gt; 'Chairs',\n        price =&gt; 20.57,\n        quantity =&gt; 4,\n    },\n    {\n        name =&gt; 'Tables',\n        price =&gt; 50.18,\n        quantity =&gt; 1,\n    }\n];\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nfor @items -&gt; $item {\n    my $total = $item&lt;price&gt; * $item&lt;quantity&gt;;\n    say \"$item&lt;name&gt;\\t\\$$item&lt;price&gt;\\t$item&lt;quantity&gt;\\t\\$$total\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/purchase-table.raku\nItem\tPrice\tN\tTotal\nChairs\t$20.57\t4\t$82.28\nTables\t$50.18\t1\t$50.18<\/code><\/pre>"]]},"eo":{"t":"Solvo: Aĉettabelo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La tabelo enhavas kaplinion (kiun vi simple presas per unuopa <code>say<\/code>) kaj kelkajn vicojn kun simila strukturo: nomo de objekto, prezo de objekto, kvanto kaj la totala kosto de tiuj objektoj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉar vi volas konservi la ordon de vicoj, tabelo estas bona elekto por konservi la objektojn.<\/span> <span class=\"sg\" data-s=\"1\">Do, ĉiu linio de la tabelo respondas al unuopa elemento de tabelo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je la dua nivelo, rekordo povas esti konservita en hakstrukturo kun kelkaj nomitaj kampoj: <code>name<\/code>, <code>price<\/code>, kaj <code>quantity<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La resto de la programo estas ripeti super la objektoj, kalkuli la totalojn kaj presi la tabelvicojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu el la eblaj solvoj por ĉi tiu tasko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @items = [\n    {\n        name =&gt; 'Chairs',\n        price =&gt; 20.57,\n        quantity =&gt; 4,\n    },\n    {\n        name =&gt; 'Tables',\n        price =&gt; 50.18,\n        quantity =&gt; 1,\n    }\n];\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nfor @items -&gt; $item {\n    my $total = $item&lt;price&gt; * $item&lt;quantity&gt;;\n    say \"$item&lt;name&gt;\\t\\$$item&lt;price&gt;\\t$item&lt;quantity&gt;\\t\\$$total\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/purchase-table.raku\nItem\tPrice\tN\tTotal\nChairs\t$20.57\t4\t$82.28\nTables\t$50.18\t1\t$50.18<\/code><\/pre>"]]},"la":{"t":"Solutio: Tabula emptio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tabula continet caput (quod simpliciter imprimes cum uno <code>say<\/code>) et numerum ordinum cum structura simili: nomen item, pretium item, quantitas et summa costarum horum item.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum vis ordinem ordinum servare, array est bona electio ad servanda item.<\/span> <span class=\"sg\" data-s=\"1\">Ita, unaquaeque linea tabulae correspondet unico elemento array.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In secundo gradu, recordum servari potest in structura hash cum paucis campis nominatis: <code>name<\/code>, <code>price<\/code>, et <code>quantity<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Reliquum programmatis est iterare per item, calculare summas et imprimere ordines tabulae.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una ex solutionibus possibilibus huic muneri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @items = [\n    {\n        name =&gt; 'Sellae',\n        price =&gt; 20.57,\n        quantity =&gt; 4,\n    },\n    {\n        name =&gt; 'Tabulae',\n        price =&gt; 50.18,\n        quantity =&gt; 1,\n    }\n];\n\nsay \"Item\\tPretium\\tN\\tSumma\";\nfor @items -&gt; $item {\n    my $total = $item&lt;price&gt; * $item&lt;quantity&gt;;\n    say \"$item&lt;name&gt;\\t\\$$item&lt;price&gt;\\t$item&lt;quantity&gt;\\t\\$$total\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenies programma in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/purchase-table.raku\nItem\tPretium\tN\tSumma\nSellae\t$20.57\t4\t$82.28\nTabulae\t$50.18\t1\t$50.18<\
