 data-s=\"0\">Запустите программу и передайте ей несколько слов.<\/span> <span class=\"sg\" data-s=\"1\">Убедитесь, что хотя бы некоторые из слов можно найти в словаре.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">См. решение<\/a><\/span><\/p>"]]},"uk":{"t":"Замінити антонімами","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Створіть програму, яка замінює всі слова з командного рядка на їхні антоніми.<\/span> <span class=\"sg\" data-s=\"1\">Якщо слово відсутнє в словнику, не змінюйте його і виведіть як є.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Використовуйте жорстко закодований хеш для зберігання словника антонімів.<\/span> <span class=\"sg\" data-s=\"1\">Для вашої зручності, ось підготовлений список приблизно з 200 пар, який ви можете безпосередньо скопіювати та вставити у вашу програму: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Усі пари зберігаються в обох напрямках, наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зробіть програму якомога простішою та виводьте слова рядок за рядком.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\" \">Стартирайте програмата и подайте няколко думи към нея.<\/span> <span class=\"sg\" data-s=\"1\">Уверете се, че поне някои от думите могат да бъдат намерени в речника.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Anstataŭigi per antonimoj","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kreu programon kiu anstataŭigas ĉiujn vortojn el la komanda linio per iliaj antonimoj.<\/span> <span class=\"sg\" data-s=\"1\">Se la vorto mankas en la vortaro, ne modifu ĝin kaj presu kiel estas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzu malmolan koditan hash por konservi la vortaron de antonimoj.<\/span> <span class=\"sg\" data-s=\"1\">Por via komforto, jen estas preta listo de ĉirkaŭ 200 paroj kiujn vi povas rekte kopii kaj alglui en vian programon: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiuj paroj estas konservitaj en ambaŭ direktoj, ekz.:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Farigu la programon kiel eble plej simpla kaj presu la vortojn linio post linio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kaj pasigu kelkajn vortojn al ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Certigu ke almenaŭ kelkaj el la vortoj povas esti trovitaj en la vortaro.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Reponere cum antonyma","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Crea programma quod omnes verba ex linea mandati cum suis antonymis reponit.<\/span> <span class=\"sg\" data-s=\"1\">Si verbum in dictionario deest, non muta illud et sicuti est imprime.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Utere fixo codice hashi ad dictionarium antonymorum servandum.<\/span> <span class=\"sg\" data-s=\"1\">Ad tuam commoditatem, hic est paratus index circiter 200 parium quos directe in tuum programma potes effingere et inserere: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Omnes paria in utroque directione servantur, e.g.:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fac programma quam simplicissimum et imprime verba linea per lineam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Curre programma et transi pauca verba ad illud.<\/span> <span class=\"sg\" data-s=\"1\">Cura ut saltem aliqua verba in dictionario inveniri possint.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
