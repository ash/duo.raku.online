ictionary{$word} // $word;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/replace-with-antonyms.raku early morning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">Операторът <code>//<\/code> е <a href=\"https://course.raku.org/bg/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">операторът defined-or<\/a>, който връща първия дефиниран операнд.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">В хеша, всички ключове са думи (т.е. те изглеждат като идентификатори), така че не е необходимо да ги цитирате в хеша. По този начин е възможно да се създаде хеш, както е показано по-долу:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    above =&gt; 'below',\n    absent =&gt; 'present',\n    achieve =&gt; 'fail',\n    # . . .\n    wrong =&gt; 'right',\n    young =&gt; 'old'    \n;<\/code><\/pre>"]]},"eo":{"t":"Solution: Anstataŭigi per antonimoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por solvi la taskon, la enhavo de la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a> estas kopiita al la solva dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, buklo super la eniraj argumentoj provas trovi la vorton en la vortaro, kaj se ĝi povas, ĝi prenas la antonimon.<\/span> <span class=\"sg\" data-s=\"2\">Se ne ekzistas tia vorto en la vortaro, la originala vorto estas uzata.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La solvo estas prezentita sube.<\/span> <span class=\"sg\" data-s=\"1\">La vortaro estas montrita nur parte ĉi tie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    'achieve' =&gt; 'fail',\n    # . . .\n    'wrong' =&gt; 'right',\n    'young' =&gt; 'old'    \n;\n\nfor @*ARGS -&gt; $word {\n    say %dictionary{$word} // $word;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/replace-with-antonyms.raku early morning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>//<\/code> operatoro estas la <a href=\"https://course.raku.org/eo/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">difinita-aŭ operatoro<\/a>, kiu redonas la unuan difinitan operandon.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">En la hakilo, ĉiuj ŝlosiloj estas vortoj (t.e., ili aspektas kiel identigiloj), do vi ne bezonas citi ilin en la hakilo. Estas do eble krei hakilon, kiel montrite le\"><code>$ raku exercises/associatives/replace-with-antonyms.raku early morning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">Operator <code>//<\/code> est <a href=\"https://course.raku.org/la/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">operator definitus-vel<\/a>, qui primum operandum definitum reddit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">In hash, omnes claves sunt verba (i.e., videntur sicut identificatores), ita non opus est eas in hash citare. Ita fieri potest ut hash creetur, ut infra ostenditur:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    above =&gt; 'below',\n    absent =&gt; 'present',\n    achieve =&gt; 'fail',\n    # . . .\n    wrong =&gt; 'right',\n    young =&gt; 'old'    \n;<\/code><\/pre>"]]}}}</script>
