<script type="application/json" id="page-data">{"u":"essentials/associatives","n":243,"k":"section","pv":"essentials/positionals/exercises/spell-a-number/solution","nx":"essentials/associatives/pairs","tr":["essentials"],"L":{"en":{"t":"Associative data types","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Associative data types are aggregate data types that keep multiple elements and support access based on names.<\/span> <span class=\"sg\" data-s=\"1\">In this part of the course, we examine the basics of two such types in Raku: pairs and hashes.<\/span><\/p>"]]},"de":{"t":"Assoziative Datentypen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Assoziative Datentypen sind aggregierte Datentypen, die mehrere Elemente enthalten und den Zugriff basierend auf Namen unterstützen.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Teil des Kurses untersuchen wir die Grundlagen von zwei solchen Typen in Raku: Paare und Hashes.<\/span><\/p>"]]},"nl":{"t":"Associatieve datentypen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Associatieve gegevenstypen zijn samengestelde gegevenstypen die meerdere elementen bevatten en toegang op basis van namen ondersteunen.<\/span> <span class=\"sg\" data-s=\"1\">In dit deel van de cursus onderzoeken we de basisprincipes van twee van dergelijke typen in Raku: paren en hashes.<\/span><\/p>"]]},"es":{"t":"Tipos de datos asociativos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tipos de datos asociativos son tipos de datos agregados que mantienen múltiples elementos y permiten el acceso basado en nombres.<\/span> <span class=\"sg\" data-s=\"1\">En esta parte del curso, examinamos los conceptos básicos de dos de estos tipos en Raku: pares y hashes.<\/span><\/p>"]]},"it":{"t":"Tipi di dati associativi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I tipi di dati associativi sono tipi di dati aggregati che contengono più elementi e supportano l'accesso basato su nomi.<\/span> <span class=\"sg\" data-s=\"1\">In questa parte del corso, esaminiamo le basi di due di questi tipi in Raku: coppie e hash.<\/span><\/p>"]]},"lv":{"t":"Asociatīvie datu tipi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Asociatīvie datu tipi ir agregātu datu tipi, kas satur vairākus elementus un atbalsta piekļuvi, pamatojoties uz nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Šajā kursa daļā mēs izskatīsim divu šādu tipu pamatus Raku: pārus un hešus.<\/span><\/p>"]]},"ru":{"t":"Ассоциативные типы данных","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ассоциативные типы данных — это агрегированные типы данных, которые хранят несколько элементов и поддерживают доступ на основе имен.<\/span> <span class=\"sg\" data-s=\"1\">В этой части курса мы рассмотрим основы двух таких типов в Raku: пары и хэши.<\/span><\/p>"]]},"uk":{"t":"Асоціативні типи даних","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Асоціативні типи даних є агрегатними типами даних, які містять кілька елементів і підтримують доступ на основі імен.<\/span> <span class=\"sg\" data-s=\"1\">У цій частині курсу ми розглянемо основи двох таких типів у Raku: пари та хеші.<\/span><\/p>"]]},"bg":{"t":"Асоциативни типове данни","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Асоциативните типове данни са агрегатни типове данни, които съхраняват множество елементи и поддържат достъп на базата на имена.<\/span> <span class=\"sg\" data-s=\"1\">В тази част на курса ще разгледаме основите на два такива типа в Raku: двойки и хешове.<\/span><\/p>"]]},"eo":{"t":"Asociaj datentipoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Asociativaj datumtipoj estas agregataj datumtipoj kiuj konservas multajn elementojn kaj subtenas aliron bazitan sur nomoj.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu parto de la kurso, ni ekzamenas la bazojn de du tiaj tipoj en Raku: paroj kaj haketoj.<\/span><\/p>"]]},"la":{"t":"Associativa data genera","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Typi data associativi sunt typi data aggregati qui plures elementa continent et accessum secundum nomina sustinent.<\/span> <span class=\"sg\" data-s=\"1\">In hac parte cursus, fundamenta duorum talium typorum in Raku examinamus: paria et hashes.<\/span><\/p>"]]}}}</script>
