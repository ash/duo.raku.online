s a sus valores.<\/span> <span class=\"sg\" data-s=\"2\">Vamos a introducir el nuevo sigil que usan las variables hash: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora puedes usar el hash y asignarle algunos valores iniciales.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como con otros tipos de datos, ambas acciones se pueden hacer juntas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Accediendo a los elementos<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subscribir los elementos es similar a lo que hemos visto para <a href=\"/essentials/associatives/pairs/\">pares<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Usa un par de corchetes angulares o llaves con una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los hashes son mutables, por lo que puedes tanto cambiar los valores existentes como agregar nuevos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Claves y valores<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los dos métodos incorporados, <code>keys<\/code> y <code>values<\/code>, devuelven las listas de las claves y los valores de un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay un ejemplo de la salida de este programa:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota que los elementos del hash no están ordenados, pero el orden de las claves y los valores, devueltos por los métodos anteriores, es idéntico.<\/span><\/p>"]]},"it":{"t":"Hash","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>hash<\/em> è un altro esempio di tipi di dati associativi in Raku.<\/span> <span class=\"sg\" data-s=\"1\">È un tipo di dato aggregato che mappa i nomi dei suoi elementi ai loro valori.<\/span> <span class=\"sg\" data-s=\"2\">Introduciamo il nuovo sigillo che le variabili hash usano: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora puoi usare l'hash e assegnargli alcuni valori iniziali.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Come con altri tipi di dati, entrambe le azioni possono essere fatte insieme:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Accesso agli elementi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'indicizzazione degli elementi è simile a quanto visto per le <a href=\"/essentials/associatives/pairs/\">coppie<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Usa una coppia di parentesi angolari o parentesi graffe con una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli hash sono mutabili, quindi puoi sia cambiare i valori esistenti che aggiungere nuovi elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Chiavi e valori<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I due metodi incorporati, <code>keys<\/code> e <code>values<\/code>, restituiscono le liste delle chiavi e dei valori di un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio dell'output di questo programma:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che gli elementi dell'hash non sono ordinati, ma l'ordine delle chiavi e dei valori, restituito dai metodi sopra, è identico.<\/span><\/p>"]]},"lv":{"t":"Hashes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Jauktenis<\/em> ir vēl viens asociatīvo datu tipu piemērs Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir salikts datu tips, kas attēlo savu elementu nosaukumus uz to vērtībām.<\/span> <span class=\"sg\" data-s=\"2\">Iepazīsimies ar jauno sigilu, ko lieto jaukteņu mainīgie: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad jaukteni var izmantot un piešķirt tam kādas sākotnējās vērtības.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā citiem datu tipiem, abas darbības var izdarīt kopā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piekļuve elementiem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elementu indeksēšana ir līdzīga tai, ko redzējām <a href=\"/essentials/associatives/pairs/\">pāriem<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet leņķa iekavu vai figūriekavu pāri ar virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jaukteņi ir maināmi, tāpēc esošās vērtības var gan mainīt, gan pievienot jaunas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Atslēgas un vērtības<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Divas iebūvētās metodes <code>keys<\/code> un <code>values<\/code> atgriež jaukteņa atslēgu un vērtību sarakstus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, šīs programmas izvades piemērs:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka jaukteņa elementi nav sakārtoti, taču atslēgu un vērtību secība, ko atgriež minētās metodes, ir vienāda.<\/span><\/p>"]]},"ru":{"t":"Словари","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Хэш<\/em> — это еще один пример ассоциативных типов данных в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это агрегированный тип данных, который отображает имена своих элементов на их значения.<\/span> <span class=\"sg\" data-s=\"2\">Давайте введем новый сигил, который используют переменные хэша: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь вы можете использовать хэш и присвоить ему некоторые начальные значения.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как и с другими типами данных, оба действия можно выполнить вместе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Доступ к элементам<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Индексация элементов аналогична тому, что мы видели для <a href=\"/essentials/associatives/pairs/\">пар<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Используйте пару угловых скобок или фигурных скобок со строкой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хэши изменяемы, поэтому вы можете как изменять существующие значения, так и добавлять новые:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ключи и значения<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два встроенных метода, <code>keys<\/code> и <code>values<\/code>, возвращают списки ключей и значений хэша:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример вывода этой программы:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что элементы хэша не упорядочены, но порядок ключей и значений, возвращаемых вышеуказанными методами, идентичен.<\/span><\/p>"]]},"uk":{"t":"Хеші","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Хеш<\/em> є ще одним прикладом асоціативних типів даних у Raku.<\/span> <span class=\"sg\" data-s=\"1\">Це агрегований тип даних, який відображає імена своїх елементів на їх значення.<\/span> <span class=\"sg\" data-s=\"2\">Давайте введемо новий сигіл, який використовують змінні хешу: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер ви можете використовувати хеш і призначати йому деякі початкові значення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як і з іншими типами даних, обидві дії можуть бути виконані разом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Доступ до елементів<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Індексація елементів схожа на те, що ми бачили для <a href=\"/essentials/associatives/pairs/\">пар<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Використовуйте пару кутових або фігурних дужок зі строкою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хеші є змінними, тому ви можете як змінювати існуючі значення, так і додавати нові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ключі та значення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два вбудовані методи, <code>keys<\/code> та <code>values<\/code>, повертають списки ключів та значень хешу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад виводу цієї програми:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що елементи хешу не впорядковані, але порядок ключів і значень, повернутих вищезазначеними методами, є однаковим.<\/span><\/p>"]]},"bg":{"t":"Хешове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Хеш<\/em> е друг пример за асоциативни типове данни в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Това е агрегатен тип данни, който свързва имената на своите елементи със стойностите им.<\/span> <span class=\"sg\" data-s=\"2\">Нека въведем новия сигил, който хеш променливите използват: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега можете да използвате хеша и да му присвоите начални стойности.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както при другите типове данни, и двете действия могат да се извършат заедно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Достъп до елементите<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Достъпът до елементите е подобен на това, което видяхме при <a href=\"/essentials/associatives/pairs/\">двойките<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте чифт ъглови скоби или къдрави скоби с низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хешовете са променливи, така че можете както да променяте съществуващите стойности, така и да добавяте нови:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ключове и стойности<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двата вградени метода, <code>keys<\/code> и <code>values<\/code>, връщат списъците с ключовете и стойностите на хеша:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример за изхода на тази програма:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че елементите на хеша не са подредени, но редът на ключовете и стойностите, върнати от горните методи, е идентичен.<\/span><\/p>"]]},"eo":{"t":"Haxoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>hash<\/em> estas alia ekzemplo de asociativaj datumtipoj en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas agrega datumtipo kiu mapigas la nomojn de siaj eroj al iliaj valoroj.<\/span> <span class=\"sg\" data-s=\"2\">Ni enkonduku la novan siglon, kiun uzas hash-variabloj: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi nun povas uzi la hash kaj asigni kelkajn komencajn valorojn al ĝi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiel kun aliaj datumtipoj, ambaŭ agoj povas esti faritaj kune:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alirante la elementojn<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subskribi la elementojn estas simila al tio, kion ni vidis por <a href=\"/essentials/associatives/pairs/\">paroj<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Uzu paron da angulaj krampoj aŭ kurbaj krampoj kun ŝnuro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hashoj estas ŝanĝeblaj, do vi povas kaj ŝanĝi la ekzistantajn valorojn kaj aldoni novajn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ŝlosiloj kaj valoroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La du enkonstruaj metodoj, <code>keys<\/code> kaj <code>values<\/code>, redonas la listojn de la ŝlosiloj kaj la valoroj de hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo de la eligo de ĉi tiu programo:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke hash-elementoj ne estas ordigitaj, sed la ordo de la ŝlosiloj kaj valoroj, redonitaj de la supraj metodoj, estas identa.<\/span><\/p>"]]},"la":{"t":"Hashes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Hash<\/em> est aliud exemplum typorum datorum associativorum in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Est aggregatum typus datorum qui nomina elementorum suorum ad valores eorum mappat.<\/span> <span class=\"sg\" data-s=\"2\">Introducamus novum sigillum quod variabiles hash utuntur: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc uti potes hash et assignare aliquos valores initiales ei.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = Gallia =&gt; 'Lutetia', Italia =&gt; 'Roma';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut cum aliis typis datorum, utraque actio simul fieri potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = Gallia =&gt; 'Lutetia', Italia =&gt; 'Roma';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Elementa accedere<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subscripting elementorum simile est quod vidimus pro <a href=\"/essentials/associatives/pairs/\">paribus<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Utere par angulorum vel curvatorum uncis cum chorda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic %capitals&lt;Gallia&gt;;\ndic %capitals{'Italia'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hashes sunt mutabiles, ita potes et valores existentes mutare et novos addere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germania&gt; = 'Berolinum';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Claves et valores<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duae methodi inbuilt, <code>keys<\/code> et <code>values<\/code>, reddunt listas clavium et valorum hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic %capitals.keys;\ndic %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum output huius programmatis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germania Italia Gallia)     (Berolinum Roma Lutetia)<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod elementa hash non sunt ordinata, sed ordo clavium et valorum, redditus a methodis supra, est idem.<\/span><\/p>"]]}}}</script>
