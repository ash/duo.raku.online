<script type="application/json" id="page-data">{"u":"essentials/booleans/boolean-operations-other-types","n":99,"k":"topic","pv":"essentials/booleans/operations/quiz","nx":"essentials/booleans/boolean-operations-other-types/quiz","tr":["essentials","essentials/booleans"],"L":{"en":{"t":"Boolean operations with other types","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In the next section, we will talk about <a href=\"/essentials/coercion/\">converting data of different types<\/a> to each other.<\/span> <span class=\"sg\" data-s=\"1\">But before that, it is important to highlight the following feature of Raku.<\/span> <span class=\"sg\" data-s=\"2\">When you apply Boolean operations to strings or integers, the values are not converted to Booleans, and the result is not a Boolean value either.<\/span> <span class=\"sg\" data-s=\"3\">Consider the following examples:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Let us read the rules 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">from the documentation<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> returns the first argument that evaluates to False in Boolean context, otherwise returns the last argument.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> returns the first argument that evaluates to True in Boolean context, otherwise returns the last argument.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> returns the True argument if there is one (and only one). Returns the last argument if all arguments are False. Returns <code>Nil<\/code> when more than one argument is true.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice that we just met a ‘null’ value <code>Nil<\/code>.<\/span><\/p>"]]},"de":{"t":"Boolesche Operationen mit anderen Typen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Im nächsten Abschnitt werden wir darüber sprechen, wie man Daten verschiedener Typen ineinander umwandelt.<\/span> <span class=\"sg\" data-s=\"1\">Aber vorher ist es wichtig, das folgende Merkmal von Raku hervorzuheben.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie boolesche Operationen auf Zeichenketten oder Ganzzahlen anwenden, werden die Werte nicht in Boolesche umgewandelt, und das Ergebnis ist auch kein Boolescher Wert.<\/span> <span class=\"sg\" data-s=\"3\">Betrachten Sie die folgenden Beispiele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie uns die Regeln 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">aus der Dokumentation<\/a> lesen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> gibt das erste Argument zurück, das im Booleschen Kontext als Falsch bewertet wird, andernfalls das letzte Argument.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> gibt das erste Argument zurück, das im Booleschen Kontext als Wahr bewertet wird, andernfalls das letzte Argument.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> gibt das Wahre Argument zurück, wenn es eines (und nur eines) gibt. Gibt das letzte Argument zurück, wenn alle Argumente Falsch sind. Gibt <code>Nil<\/code> zurück, wenn mehr als ein Argument wahr ist.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass wir gerade einen 'Null'-Wert <code>Nil<\/code> kennengelernt haben.<\/span><\/p>"]]},"nl":{"t":"Boolean bewerkingen met andere typen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In de volgende sectie zullen we het hebben over het converteren van gegevens van verschillende typen naar elkaar.<\/span> <span class=\"sg\" data-s=\"1\">Maar daarvoor is het belangrijk om de volgende eigenschap van Raku te benadrukken.<\/span> <span class=\"sg\" data-s=\"2\">Wanneer je Booleaanse operaties toepast op strings of gehele getallen, worden de waarden niet omgezet naar Booleans, en het resultaat is ook geen Booleaanse waarde.<\/span> <span class=\"sg\" data-s=\"3\">Bekijk de volgende voorbeelden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we de regels lezen 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">uit de documentatie<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> retourneert het eerste argument dat in Booleaanse context als False wordt geëvalueerd, anders retourneert het het laatste argument.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> retourneert het eerste argument dat in Booleaanse context als True wordt geëvalueerd, anders retourneert het het laatste argument.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> retourneert het True-argument als er één (en slechts één) is. Retourneert het laatste argument als alle argumenten False zijn. Retourneert <code>Nil<\/code> wanneer meer dan één argument waar is.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat we zojuist een ‘null’-waarde <code>Nil<\/code> zijn tegengekomen.<\/span><\/p>"]]},"es":{"t":"Operaciones booleanas con otros tipos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la siguiente sección, hablaremos sobre la conversión de datos de diferentes tipos entre sí.<\/span> <span class=\"sg\" data-s=\"1\">Pero antes de eso, es importante resaltar la siguiente característica de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Cuando aplicas operaciones booleanas a cadenas o enteros, los valores no se convierten en booleanos, y el resultado tampoco es un valor booleano.<\/span> <span class=\"sg\" data-s=\"3\">Considera los siguientes ejemplos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Leamos las reglas 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">de la documentación<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> devuelve el primer argumento que evalúa como Falso en contexto booleano, de lo contrario devuelve el último argumento.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> devuelve el primer argumento que evalúa como Verdadero en contexto booleano, de lo contrario devuelve el último argumento.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> devuelve el argumento Verdadero si hay uno (y solo uno). Devuelve el último argumento si todos los argumentos son Falsos. Devuelve <code>Nil<\/code> cuando más de un argumento es verdadero.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa que acabamos de encontrarnos con un valor ‘nulo’ <code>Nil<\/code>.<\/span><\/p>"]]},"it":{"t":"Operazioni booleane con altri tipi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nella prossima sezione, parleremo della conversione dei dati di diversi tipi tra loro.<\/span> <span class=\"sg\" data-s=\"1\">Ma prima di ciò, è importante evidenziare la seguente caratteristica di Raku.<\/span> <span class=\"sg\" data-s=\"2\">Quando si applicano operazioni booleane a stringhe o interi, i valori non vengono convertiti in booleani, e il risultato non è nemmeno un valore booleano.<\/span> <span class=\"sg\" data-s=\"3\">Considera i seguenti esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Leggiamo le regole 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">dalla documentazione<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> restituisce il primo argomento che valuta a Falso nel contesto booleano, altrimenti restituisce l'ultimo argomento.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> restituisce il primo argomento che valuta a Vero nel contesto booleano, altrimenti restituisce l'ultimo argomento.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> restituisce l'argomento Vero se ce n'è uno (e solo uno). Restituisce l'ultimo argomento se tutti gli argomenti sono Falsi. Restituisce <code>Nil<\/code> quando più di un argomento è vero.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che abbiamo appena incontrato un valore 'null' <code>Nil<\/code>.<\/span><\/p>"]]},"lv":{"t":"Loģiskās operācijas ar citiem tipiem","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nākamajā sekcijā mēs runāsim par datu konvertēšanu no viena tipa uz citu.<\/span> <span class=\"sg\" data-s=\"1\">Bet pirms tam ir svarīgi izcelt šādu Raku īpatnību.<\/span> <span class=\"sg\" data-s=\"2\">Kad jūs pielietojat booleānas operācijas virknēm vai integeriem, vērtības netiek konvertētas uz booleāniem, un rezultāts arī nav booleāna vērtība.<\/span> <span class=\"sg\" data-s=\"3\">Apskatīsim šādus piemērus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izlasīsim noteikumus 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">no dokumentācijas<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> atgriež pirmo argumentu, kas booleāna kontekstā tiek novērtēts kā False, pretējā gadījumā atgriež pēdējo argumentu.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> atgriež pirmo argumentu, kas booleāna kontekstā tiek novērtēts kā True, pretējā gadījumā atgriež pēdējo argumentu.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> atgriež True argumentu, ja tāds ir (un tikai viens). Atgriež pēdējo argumentu, ja visi argumenti ir False. Atgriež <code>Nil<\/code>, ja vairāk nekā viens arguments ir True.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pievērsiet uzmanību, ka mēs tikko sastāpāmies ar ‘null’ vērtību <code>Nil<\/code>.<\/span><\/p>"]]},"ru":{"t":"Логические операции с другими типами","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В следующей главе мы поговорим о приведении значений одних типов к другим.<\/span> <span class=\"sg\" data-s=\"1\">Но сейчас очень важно отметить одну особенность Raku.<\/span> <span class=\"sg\" data-s=\"2\">Когда вы применяете логические операции к строкам и числам, значения не приводятся к булеву типу, и результат тоже не является булевым.<\/span> <span class=\"sg\" data-s=\"3\">Рассмотрим пример ниже:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте прочтем правила 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">из документации<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> возвращает первый ложный аргумент, иначе возвращает последний аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> возвращает первый истинный аргумент, иначе возвращает последний аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> возвращает истинный аргумент, если он один и только один. Возвращает последний аргумент, если все аргументы ложные. Возвращает <code>Nil<\/code>, если больше чем один аргумент истинный.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Истинный аргумент означает, что он имеет значение True в булевом контексте.<\/span> <span class=\"sg\" data-s=\"1\">Соответственно — ложный аргумент имеет значение False.<\/span> <span class=\"sg\" data-s=\"2\">Заметьте, что мы только что познакомились с \"нулевым\" значением <code>Nil<\/code>.<\/span><\/p>"]]},"uk":{"t":"Логічні операції з іншими типами","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У наступному розділі ми поговоримо про перетворення даних різних типів один в одного.<\/span> <span class=\"sg\" data-s=\"1\">Але перед цим важливо підкреслити наступну особливість Raku.<\/span> <span class=\"sg\" data-s=\"2\">Коли ви застосовуєте булеві операції до рядків або цілих чисел, значення не перетворюються на булеві, і результат також не є булевим значенням.<\/span> <span class=\"sg\" data-s=\"3\">Розглянемо наступні приклади:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте прочитаємо правила 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">з документації<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> повертає перший аргумент, який оцінюється як False у булевому контексті, інакше повертає останній аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> повертає перший аргумент, який оцінюється як True у булевому контексті, інакше повертає останній аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> повертає True аргумент, якщо є один (і тільки один). Повертає останній аргумент, якщо всі аргументи False. Повертає <code>Nil<\/code>, коли більше одного аргументу є true.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що ми щойно зустріли значення «null» <code>Nil<\/code>.<\/span><\/p>"]]},"bg":{"t":"Булеви операции с други типове","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В следващата секция ще говорим за преобразуване на данни от различни типове един в друг.<\/span> <span class=\"sg\" data-s=\"1\">Но преди това е важно да подчертаем следната особеност на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Когато прилагате булеви операции към низове или цели числа, стойностите не се преобразуват в булеви, и резултатът също не е булева стойност.<\/span> <span class=\"sg\" data-s=\"3\">Разгледайте следните примери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека прочетем правилата 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">от документацията<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> връща първия аргумент, който се оценява като False в булев контекст, в противен случай връща последния аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> връща първия аргумент, който се оценява като True в булев контекст, в противен случай връща последния аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> връща True аргумента, ако има такъв (и само един). Връща последния аргумент, ако всички аргументи са False. Връща <code>Nil<\/code>, когато повече от един аргумент е истинен.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че току-що срещнахме ‘null’ стойността <code>Nil<\/code>.<\/span><\/p>"]]},"eo":{"t":"Booleaj operacioj kun aliaj tipoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la sekva sekcio, ni parolos pri konvertado de datumoj de malsamaj tipoj unu al la alia.<\/span> <span class=\"sg\" data-s=\"1\">Sed antaŭ tio, estas grave reliefigi la sekvan trajton de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Kiam vi aplikas Booleajn operaciojn al ĉenoj aŭ entjeroj, la valoroj ne estas konvertitaj al Booleaj, kaj la rezulto ankaŭ ne estas Boolea valoro.<\/span> <span class=\"sg\" data-s=\"3\">Konsideru la jenajn ekzemplojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni legu la regulojn 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">el la dokumentaro<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> redonas la unuan argumenton, kiu taksiĝas kiel Falsa en Boolea kunteksto, alie redonas la lastan argumenton.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> redonas la unuan argumenton, kiu taksiĝas kiel Vera en Boolea kunteksto, alie redonas la lastan argumenton.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> redonas la Veran argumenton se estas unu (kaj nur unu). Redonas la lastan argumenton se ĉiuj argumentoj estas Falsaj. Redonas <code>Nil<\/code> kiam pli ol unu argumento estas vera.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke ni ĵus renkontis ‘nul’ valoron <code>Nil<\/code>.<\/span><\/p>"]]},"la":{"t":"Booleana operationes cum aliis typis","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In sectione proxima, de conversione datae diversorum generum inter se loquemur.<\/span> <span class=\"sg\" data-s=\"1\">Sed antequam id faciamus, haec proprietas Raku notanda est.<\/span> <span class=\"sg\" data-s=\"2\">Cum operationes Booleanas ad chordas vel integros applicas, valores non convertuntur ad Booleanos, et eventus non est valor Booleanus.<\/span> <span class=\"sg\" data-s=\"3\">Considera sequentia exempla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Legamus regulas 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">ex documentis<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> reddit primum argumentum quod in contextu Booleano Falsum aestimatur, alioquin reddit ultimum argumentum.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> reddit primum argumentum quod in contextu Booleano Verum aestimatur, alioquin reddit ultimum argumentum.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> reddit argumentum Verum si unum (et solum unum) est. Reddit ultimum argumentum si omnia argumenta Falsa sunt. Reddit <code>Nil<\/code> cum plus quam unum argumentum verum est.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota nos modo occurrisse valore ‘nullum’ <code>Nil<\/code>.<\/span><\/p>"]]}}}</script>
