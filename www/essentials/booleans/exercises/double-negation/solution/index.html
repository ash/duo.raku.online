\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Antequam programmatum currimus, cogitemus quid imprimet.<\/span> <span class=\"sg\" data-s=\"1\">Sunt duo operatoria negationis ante variabilem.<\/span> <span class=\"sg\" data-s=\"2\">Agunt ut duo operatoria negationis.<\/span> <span class=\"sg\" data-s=\"3\">In primo casu, valor vertitur a <code>Falsum<\/code> ad <code>Verum<\/code>, et deinde statim vertitur retro a <code>Verum<\/code> ad <code>Falsum<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">In secundo casu, algorithmus idem est: post duas negationes, obtinemus initialem valorem Booleanum.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma sequens output imprimit, quod confirmat considerationes supra:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/booleans/double-negation.raku\nFalsum\nVerum<\/code><\/pre>"]]}}}</script>
