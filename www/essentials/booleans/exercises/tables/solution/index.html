rue ^^ True е ', True ^^ True; \nsay 'True ^^ False е ', True ^^ False;\nsay 'False ^^ True е ', False ^^ True;\nsay 'False ^^ False е ', False ^^ False;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/booleans/tables.raku\" target=\"_blank\" rel=\"noopener\">tables.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата и тя ще отпечата следната таблица.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku tables.raku\nTrue &amp;&amp; True е True\nTrue &amp;&amp; False е False\nFalse &amp;&amp; True е False\nFalse &amp;&amp; False е False\nTrue || True е True\nTrue || False е True\nFalse || True е True\nFalse || False е False\nTrue ^^ True е Nil\nTrue ^^ False е True\nFalse ^^ True е True\nFalse ^^ False е False<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че поради по-високия приоритет на булевите операции, не е необходимо да ги поставяте в скоби.<\/span> <span class=\"sg\" data-s=\"1\">Това обаче не е така, ако използвате конкатенация на низове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'True &amp;&amp; True е ' ~ (True &amp;&amp; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Алтернативно, можете да използвате <a href=\"https://course.raku.org/bg/essentials/strings/code-interpolation/\" target=\"_blank\" rel=\"noopener\">интерполация на код<\/a>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Booleaj tabeloj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ebla programo kiu presas ĉiujn rezultojn de buleaj operacioj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 'True &amp;&amp; True estas ', True &amp;&amp; Tru orem praecedentiam operationum Booleanarum, non opus est eas in parenthesibus ponere.<\/span> <span class=\"sg\" data-s=\"1\">Hoc tamen non valet si concatenationem chordarum uteris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Verum &amp;&amp; Verum est ' ~ (True &amp;&amp; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vel, uti potes <a href=\"https://course.raku.org/la/essentials/strings/code-interpolation/\" target=\"_blank\" rel=\"noopener\">interpolatione codicis<\/a>.<\/span><\/p>"]]}}}</script>
