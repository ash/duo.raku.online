<script type="application/json" id="page-data">{"u":"essentials/booleans","n":96,"k":"section","pv":"essentials/numbers/exercises/sum1-100/solution","nx":"essentials/booleans/operations","tr":["essentials"],"L":{"en":{"t":"Boolean type in Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku offers a built-in type for Boolean values.<\/span> <span class=\"sg\" data-s=\"1\">It is called <code>Bool<\/code>, and it is actually defined as an enumeration with two values: <code>True<\/code> and <code>False<\/code>.<\/span><\/p>"]]},"de":{"t":"Boolescher Typ","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku bietet einen eingebauten Typ für Boolesche Werte.<\/span> <span class=\"sg\" data-s=\"1\">Er heißt <code>Bool<\/code> und ist tatsächlich als eine Enumeration mit zwei Werten definiert: <code>True<\/code> und <code>False<\/code>.<\/span><\/p>"]]},"nl":{"t":"Boolean type","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku biedt een ingebouwd type voor Booleaanse waarden.<\/span> <span class=\"sg\" data-s=\"1\">Het wordt <code>Bool<\/code> genoemd en het is eigenlijk gedefinieerd als een enumeratie met twee waarden: <code>True<\/code> en <code>False<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipo booleano","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ofrece un tipo incorporado para valores Booleanos.<\/span> <span class=\"sg\" data-s=\"1\">Se llama <code>Bool<\/code>, y en realidad está definido como una enumeración con dos valores: <code>True<\/code> y <code>False<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipo booleano","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku offre un tipo integrato per i valori Booleani.<\/span> <span class=\"sg\" data-s=\"1\">Si chiama <code>Bool<\/code> ed è effettivamente definito come un'enumerazione con due valori: <code>True<\/code> e <code>False<\/code>.<\/span><\/p>"]]},"lv":{"t":"Loģiskais tips","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku piedāvā iebūvētu tipu Būla vērtībām.<\/span> <span class=\"sg\" data-s=\"1\">
