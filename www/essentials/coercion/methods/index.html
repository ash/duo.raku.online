<script type="application/json" id="page-data">{"u":"essentials/coercion/methods","n":181,"k":"topic","pv":"essentials/coercion/what/quiz","nx":"essentials/coercion/new","tr":["essentials","essentials/coercion"],"L":{"en":{"t":"Converting types using type coercion methods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To convert, or to <em>coerce<\/em> a type, call a method with the data type’s name.<\/span> <span class=\"sg\" data-s=\"1\">For example, convert a string into an integer number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In many cases, you don’t need to convert values explicitly, as Raku does that job for you.<\/span> <span class=\"sg\" data-s=\"1\">The following code is working correctly and predictably:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The two variables, <code>$a<\/code> and <code>$b<\/code>, contain strings, but they are used in an arithmetical expression with <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">At this point, both strings are converted to integers, and thus <code>$c<\/code> also gets an integer.<\/span> <span class=\"sg\" data-s=\"2\">A variable containing an integer is interpolated in a string in the last line, where Raku does the necessary operations to present the number as a sequence of digit characters.<\/span><\/p>"]]},"de":{"t":"Typumwandlung mit Typumwandlungsmethoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um einen Typ zu konvertieren oder zu <em>erzwingen<\/em>, rufen Sie eine Methode mit dem Namen des Datentyps auf.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel, um einen String in eine ganze Zahl zu konvertieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In vielen Fällen müssen Sie Werte nicht explizit konvertieren, da Raku diese Aufgabe für Sie übernimmt.<\/span> <span class=\"sg\" data-s=\"1\">Der folgende Code funktioniert korrekt und vorhersehbar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Das Ergebnis ist $c.\"; # Das Ergebnis ist 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die beiden Variablen, <code>$a<\/code> und <code>$b<\/code>, enthalten Strings, aber sie werden in einem arithmetischen Ausdruck mit <code>+<\/code> verwendet.<\/span> <span class=\"sg\" data-s=\"1\">An diesem Punkt werden beide Strings in ganze Zahlen umgewandelt, und somit erhält <code>$c<\/code> auch eine ganze Zahl.<\/span> <span class=\"sg\" data-s=\"2\">Eine Variable, die eine ganze Zahl enthält, wird in der letzten Zeile in einen String interpoliert, wobei Raku die notwendigen Operationen durchführt, um die Zahl als eine Folge von Ziffernzeichen darzustellen.<\/span><\/p>"]]},"nl":{"t":"Typen converteren met type coercie methoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om een type te converteren, of te <em>forceren<\/em>, roep je een methode aan met de naam van het datatype.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, om een string om te zetten naar een integer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In veel gevallen hoef je waarden niet expliciet te converteren, omdat Raku dat werk voor je doet.<\/span> <span class=\"sg\" data-s=\"1\">De volgende code werkt correct en voorspelbaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De twee variabelen, <code>$a<\/code> en <code>$b<\/code>, bevatten strings, maar ze worden gebruikt in een rekenkundige expressie met <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Op dit punt worden beide strings omgezet naar integers, en dus krijgt <code>$c<\/code> ook een integer.<\/span> <span class=\"sg\" data-s=\"2\">Een variabele die een integer bevat, wordt geïnterpoleerd in een string in de laatste regel, waar Raku de nodige bewerkingen uitvoert om het getal als een reeks cijfertekens weer te geven.<\/span><\/p>"]]},"es":{"t":"Conversión de tipos usando métodos de coerción de tipos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para convertir, o <em>coaccionar<\/em> un tipo, llama a un método con el nombre del tipo de dato.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, convierte una cadena en un número entero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En muchos casos, no necesitas convertir valores explícitamente, ya que Raku hace ese trabajo por ti.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente código funciona correctamente y de manera predecible:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Las dos variables, <code>$a<\/code> y <code>$b<\/code>, contienen cadenas, pero se usan en una expresión aritmética con <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En este punto, ambas cadenas se convierten en enteros, y así <code>$c<\/code> también obtiene un entero.<\/span> <span class=\"sg\" data-s=\"2\">Una variable que contiene un entero se interpola en una cadena en la última línea, donde Raku realiza las operaciones necesarias para presentar el número como una secuencia de caracteres dígitos.<\/span><\/p>"]]},"it":{"t":"Conversione dei tipi usando i metodi di coercizione del tipo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per convertire, o <em>coercere<\/em> un tipo, chiama un metodo con il nome del tipo di dato.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, convertire una stringa in un numero intero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In molti casi, non è necessario convertire i valori esplicitamente, poiché Raku lo fa per te.<\/span> <span class=\"sg\" data-s=\"1\">Il seguente codice funziona correttamente e in modo prevedibile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Le due variabili, <code>$a<\/code> e <code>$b<\/code>, contengono stringhe, ma sono utilizzate in un'espressione aritmetica con <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A questo punto, entrambe le stringhe sono convertite in numeri interi, e quindi anche <code>$c<\/code> diventa un intero.<\/span> <span class=\"sg\" data-s=\"2\">Una variabile che contiene un intero viene interpolata in una stringa nell'ultima riga, dove Raku esegue le operazioni necessarie per presentare il numero come una sequenza di caratteri numerici.<\/span><\/p>"]]},"lv":{"t":"Tipu konvertēšana, izmantojot tipu piespiedu metodes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai konvertētu vai <em>piespiestu<\/em> tipu, izsauciet metodi ar datu tipa nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, konvertējiet virkni par veselu skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Daudzos gadījumos jums nav nepieciešams vērtības konvertēt tieši, jo Raku to dara jūsu vietā.<\/span> <span class=\"sg\" data-s=\"1\">Šis kods darbojas pareizi un paredzami:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Rezultāts ir $c.\"; # Rezultāts ir 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Divi mainīgie, <code>$a<\/code> un <code>$b<\/code>, satur virknes, bet tie tiek izmantoti aritmētiskā izteiksmē ar <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šajā brīdī abas virknes tiek konvertētas par veseliem skaitļiem, un tādējādi <code>$c<\/code> arī iegūst veselu skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Mainīgais, kas satur veselu skaitli, tiek interpolēts virknē pēdējā rindā, kur Raku veic nepieciešamās operācijas, lai attēlotu skaitli kā ciparu rakstzīmju secību.<\/span><\/p>"]]},"ru":{"t":"Приведение типов с помощью методов приведения типов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы преобразовать, или <em>привести<\/em> тип, вызовите метод с именем типа данных.<\/span> <span class=\"sg\" data-s=\"1\">Например, чтобы преобразовать строку в целое число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Во многих случаях вам не нужно явно преобразовывать значения, так как Raku делает это за вас.<\/span> <span class=\"sg\" data-s=\"1\">Следующий код работает корректно и предсказуемо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Две переменные, <code>$a<\/code> и <code>$b<\/code>, содержат строки, но они используются в арифметическом выражении с <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этот момент обе строки преобразуются в целые числа, и таким образом <code>$c<\/code> также становится целым числом.<\/span> <span class=\"sg\" data-s=\"2\">Переменная, содержащая целое число, интерполируется в строку в последней строке, где Raku выполняет необходимые операции, чтобы представить число как последовательность цифр.<\/span><\/p>"]]},"uk":{"t":"Перетворення типів за допомогою методів примусу типів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб перетворити або <em>примусово привести<\/em> тип, викличте метод з назвою типу даних.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, перетворіть рядок у ціле число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У багатьох випадках вам не потрібно явно перетворювати значення, оскільки Raku робить це за вас.<\/span> <span class=\"sg\" data-s=\"1\">Наступний код працює правильно і передбачувано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дві змінні, <code>$a<\/code> та <code>$b<\/code>, містять рядки, але вони використовуються в арифметичному виразі з <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У цей момент обидва рядки перетворюються на цілі числа, і таким чином <code>$c<\/code> також отримує ціле число.<\/span> <span class=\"sg\" data-s=\"2\">Змінна, що містить ціле число, інтерполюється в рядок в останньому рядку, де Raku виконує необхідні операції, щоб представити число як послідовність цифр.<\/span><\/p>"]]},"bg":{"t":"Преобразуване на типове с методи за преобразуване на типове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да преобразувате, или <em>принудително преобразувате<\/em> тип, извикайте метод с името на типа данни.<\/span> <span class=\"sg\" data-s=\"1\">Например, за да преобразувате низ в цяло число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В много случаи не е необходимо да преобразувате стойностите изрично, тъй като Raku върши тази работа вместо вас.<\/span> <span class=\"sg\" data-s=\"1\">Следният код работи правилно и предсказуемо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Резултатът е $c.\"; # Резултатът е 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двете променливи, <code>$a<\/code> и <code>$b<\/code>, съдържат низове, но се използват в аритметично изразяване с <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В този момент и двата низа се преобразуват в цели числа, и следователно <code>$c<\/code> също получава цяло число.<\/span> <span class=\"sg\" data-s=\"2\">Променлива, съдържаща цяло число, се интерполира в низ в последния ред, където Raku извършва необходимите операции, за да представи числото като поредица от цифрови символи.<\/span><\/p>"]]},"eo":{"t":"Konvertante tipojn uzante tipajn devigmetodojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por konverti, aŭ <em>devigi<\/em> tipon, voku metodon kun la nomo de la datumtipo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, konvertu ŝnuron en entjeran numeron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En multaj kazoj, vi ne bezonas konverti valorojn eksplicite, ĉar Raku faras tion por vi.<\/span> <span class=\"sg\" data-s=\"1\">La sekva kodo funkcias ĝuste kaj antaŭvideble:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"La rezulto estas $c.\"; # La rezulto estas 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La du variabloj, <code>$a<\/code> kaj <code>$b<\/code>, enhavas ŝnurojn, sed ili estas uzataj en aritmetika esprimo kun <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi-momente, ambaŭ ŝnuroj estas konvertitaj al entjeroj, kaj tiel <code>$c<\/code> ankaŭ ricevas entjeron.<\/span> <span class=\"sg\" data-s=\"2\">Variablo enhavanta entjeron estas interpolita en ŝnuron en la lasta linio, kie Raku faras la necesajn operaciojn por prezenti la numeron kiel sekvon de ciferoj-karakteroj.<\/span><\/p>"]]},"la":{"t":"Convertendo generibus utendo coercitionis methodis","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad convertendum, vel <em>coercendum<\/em> typum, voca methodum cum nomine generis datae.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, converte stringam in numerum integrum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In multis casibus, non opus est valores explicite convertere, quia Raku id pro te facit.<\/span> <span class=\"sg\" data-s=\"1\">Sequens codex recte et praedicte operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Duae variabiles, <code>$a<\/code> et <code>$b<\/code>, continent stringas, sed in expressione arithmetica cum <code>+<\/code> utuntur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc tempore, ambae stringae in integros convertuntur, et sic <code>$c<\/code> etiam integrum accipit.<\/span> <span class=\"sg\" data-s=\"2\">Variabilis continens integrum interpolatur in stringa in ultima linea, ubi Raku necessarias operationes facit ut numerum ut seriem characterum digitorum praebeat.<\/span><\/p>"]]}}}</script>
