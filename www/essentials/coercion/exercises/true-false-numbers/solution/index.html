<script type="application/json" id="page-data">{"u":"essentials/coercion/exercises/true-false-numbers/solution","n":186,"k":"solution","pv":"essentials/coercion/exercises/true-false-numbers","nx":"essentials/coercion/exercises/true-false-strings","tr":["essentials","essentials/coercion"],"L":{"en":{"t":"Solution of ‘True and False integers’","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The fastest way to explore the question is to throw a handful of candidate numbers at the <code>?<\/code> operator at once and look at the results side by side:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for -2, -0.5, -1/3, 0, 1/3, 0.5, 2 -&gt; $n {\n    say \"$n -&gt; {?$n}\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The output makes the pattern obvious — every value prints <code>True<\/code> except the one in the middle:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">-2 -&gt; True     -0.5 -&gt; True     -0.333333 -&gt; True     0 -&gt; False     0.333333 -&gt; True     0.5 -&gt; True     2 -&gt; True<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So the sign and the magnitude do not matter at all: only zero is falsy.<\/span> <span class=\"sg\" data-s=\"1\">The next question is whether that holds for every numeric type, because <code>0<\/code>, <code>0.0<\/code>, and <code>0e0<\/code> are an <code>Int<\/code>, a <code>Rat<\/code>, and a <code>Num<\/code> respectively:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of course, nothing changes if you try to negate the number first:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the full program with the above example in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"de":{"t":"Solution: Wahre und falsche Zahlen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Um eine Zahl in einen Booleschen Wert umzuwandeln, können Sie entweder den <code>?<\/code>-Präfixoperator oder eine Konstruktorform verwenden, oder die <code>Bool<\/code>-Methode aufrufen, oder die <code>so<\/code>-Routine entweder als Präfixoperator oder als Methode verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist ziemlich offensichtlich, dass Nicht-Null-Werte in <code>True<\/code> umgewandelt werden.<\/span> <span class=\"sg\" data-s=\"1\">Wir sind daher am meisten daran interessiert, uns die Optionen anzusehen, die zu <code>False<\/code> werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alle Nullen, ganzzahlig, Gleitkomma oder rational, werden zu <code>False<\/code> umgewandelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natürlich ändert sich nichts, wenn Sie versuchen, die Zahl zuerst zu negieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Sie können das vollständige Programm mit dem obigen Beispiel in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a> finden.<\/span><\/p>"]]},"nl":{"t":"Solution: True en False getallen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een getal naar een Booleaanse waarde om te zetten, kun je de <code>?<\/code> prefix-operator of een constructorvorm gebruiken, of de <code>Bool<\/code> methode aanroepen, of de <code>so<\/code> routine als een prefix-operator of een methode gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is vrij duidelijk dat niet-nul waarden worden omgezet naar <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">We zijn dus vooral geïnteresseerd in het bekijken van die opties die <code>False<\/code> worden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alle nullen, geheel getal, floating-point, of rationeel, worden omgezet naar <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natuurlijk verandert er niets als je eerst probeert het getal te negateren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt het volledige programma met het bovenstaande voorbeeld vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"es":{"t":"Solution: Números Verdaderos y Falsos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Para convertir un número a un valor Booleano, puedes usar el operador prefijo <code>?<\/code> o una forma de constructor, o llamar al método <code>Bool<\/code>, o la rutina <code>so<\/code> ya sea como un operador prefijo o como un método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es bastante obvio que los valores distintos de cero se convierten en <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por lo tanto, estamos más interesados en observar aquellas opciones que se convierten en <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Todos los ceros, ya sean enteros, de punto flotante o racionales, se convierten a <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por supuesto, nada cambia si intentas negar el número primero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el programa completo con el ejemplo anterior en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"it":{"t":"Solution: Numeri veri e falsi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Per convertire un numero in un valore Booleano, puoi usare l'operatore prefisso <code>?<\/code> o una forma di costruttore, oppure chiamare il metodo <code>Bool<\/code>, o la routine <code>so<\/code> sia come operatore prefisso che come metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È abbastanza ovvio che i valori diversi da zero vengono convertiti in <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Siamo quindi più interessati a esaminare quelle opzioni che diventano <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tutti gli zeri, interi, a virgola mobile o razionali, vengono convertiti in <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, nulla cambia se provi a negare il numero prima:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il programma completo con l'esempio sopra nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"lv":{"t":"Risinājums: True un False skaitļi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai pārvērstu skaitli par Būla vērtību, jūs varat izmantot vai nu <code>?<\/code> prefiksa operatoru vai konstruktora formu, vai izsaukt <code>Bool<\/code> metodi, vai <code>so<\/code> rutīnu kā prefiksa operatoru vai metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir diezgan acīmredzami, ka nenulles vērtības tiek pārvērstas par <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc mēs esam visvairāk ieinteresēti apskatīt tās opcijas, kas kļūst par <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visi nulles, veseli skaitļi, peldošā punkta skaitļi vai racionālie skaitļi, tiek pārvērsti par <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, nekas nemainās, ja jūs mēģināt vispirms noliegt skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pilnu programmu ar iepriekš minēto piemēru failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"ru":{"t":"Решение: Числа True и False","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы преобразовать число в логическое значение, вы можете использовать либо префиксный оператор <code>?<\/code>, либо форму конструктора, либо вызвать метод <code>Bool<\/code>, либо рутину <code>so<\/code> как префиксный оператор или метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Довольно очевидно, что ненулевые значения преобразуются в <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Таким образом, нас больше всего интересуют те варианты, которые становятся <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Все нули, целые, с плавающей запятой или рациональные, приводятся к <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно, ничего не изменится, если вы сначала попытаетесь отрицать число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Полную программу с приведенным выше примером вы можете найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"uk":{"t":"Solution: Істинні та хибні числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб перетворити число на логічне значення, ви можете використовувати або префіксний оператор <code>?<\/code>, або конструктор, або викликати метод <code>Bool<\/code>, або рутину <code>so<\/code> як префіксний оператор або метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цілком очевидно, що ненульові значення перетворюються на <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому нас найбільше цікавлять ті варіанти, які стають <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усі нулі, цілі, з плаваючою комою або раціональні, перетворюються на <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, нічого не змінюється, якщо ви спробуєте спочатку заперечити число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти повну програму з наведеним вище прикладом у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"bg":{"t":"Solution: Истински и фалшиви числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За да конвертирате число в булева стойност, можете да използвате или префиксния оператор <code>?<\/code>, или конструкторната форма, или да извикате метода <code>Bool<\/code>, или рутината <code>so<\/code> като префиксен оператор или метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Очевидно е, че не-нулевите стойности се конвертират в <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова най-много ни интересуват опциите, които стават <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всички нули, цели числа, числа с плаваща запетая или рационални числа, се преобразуват в <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, нищо не се променя, ако първо опитате да негатирате числото:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълната програма с горния пример във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"eo":{"t":"Solution: Veraj kaj falsaj nombroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Por konverti numeron al Boolea valoro, vi povas uzi aŭ la prefiksan operatoron <code>?<\/code> aŭ konstruan formon, aŭ voki la metodon <code>Bool<\/code>, aŭ la rutinon <code>so<\/code> kiel prefiksan operatoron aŭ metodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas sufiĉe evidente, ke ne-nulaj valoroj estas konvertitaj al <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ni do plej interesas rigardi tiujn opciojn, kiuj fariĝas <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj nuloj, entjeraj, komaj, aŭ raciaj, estas konvertitaj al <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, nenio ŝanĝiĝas se vi provas unue nei la numeron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la plenan programon kun la supra ekzemplo en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"la":{"t":"Solution: Veri et falsi numeri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut numerum ad valorem Booleanum convertas, potes uti vel operatore praefixo <code>?<\/code> vel forma constructoris, vel vocare methodum <code>Bool<\/code>, vel rutam <code>so<\/code> ut vel operator praefixus vel methodus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay ?$value;\nsay Bool($value);\nsay $value.Bool;\nsay so $value;\nsay $value.so;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manifestum est valores non-nullos converti ad <code>Verum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque maxime interest spectare ad eas optiones quae fiunt <code>Falsum<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omnes nullae, integer, punctum-fluctuans, vel rationalis, convertuntur ad <code>Falsum<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # Falsum\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # Falsum\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # Falsum<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Certe, nihil mutatur si numerum prius negare conaris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # Falsum<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Totum programma cum exemplo supra invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]}}}</script>
