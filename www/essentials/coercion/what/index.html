<script type="application/json" id="page-data">{"u":"essentials/coercion/what","n":179,"k":"topic","pv":"essentials/coercion","nx":"essentials/coercion/what/quiz","tr":["essentials","essentials/coercion"],"L":{"en":{"t":"Introspection with <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">It is possible to see the type of data in a variable by calling the <code>WHAT<\/code> method on it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The type is printed in parentheses, as shown in the comments.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>(Int)<\/code> or <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There is no problem calling a method on a literal itself.<\/span> <span class=\"sg\" data-s=\"1\">For example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice that in the case of <code>-1<\/code>, we put the number in parentheses, as <code>say -1.WHAT<\/code> would try to negate the result of <code>1.WHAT<\/code>, which leads to an exception.<\/span><\/p>"]]},"de":{"t":"Introspektion mit <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Es ist möglich, den Datentyp einer Variablen zu sehen, indem man die Methode <code>WHAT<\/code> aufruft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Typ wird in Klammern ausgegeben, wie in den Kommentaren gezeigt.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel <code>(Int)<\/code> oder <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt kein Problem, eine Methode direkt auf einem Literal aufzurufen.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass wir im Fall von <code>-1<\/code> die Zahl in Klammern setzen, da <code>say -1.WHAT<\/code> versuchen würde, das Ergebnis von <code>1.WHAT<\/code> zu negieren, was zu einer Ausnahme führt.<\/span><\/p>"]]},"nl":{"t":"Introspectie met <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is mogelijk om het type gegevens in een variabele te zien door de <code>WHAT<\/code>-methode erop aan te roepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het type wordt tussen haakjes afgedrukt, zoals weergegeven in de opmerkingen.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, <code>(Int)<\/code> of <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is geen probleem om een methode aan te roepen op een letterlijke waarde zelf.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat in het geval van <code>-1<\/code>, we het getal tussen haakjes plaatsen, omdat <code>say -1.WHAT<\/code> zou proberen het resultaat van <code>1.WHAT<\/code> te negateren, wat leidt tot een uitzondering.<\/span><\/p>"]]},"es":{"t":"Introspección con <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Es posible ver el tipo de dato en una variable llamando al método <code>WHAT<\/code> sobre ella:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El tipo se imprime entre paréntesis, como se muestra en los comentarios.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>(Int)<\/code> o <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No hay problema en llamar a un método sobre un literal en sí mismo.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota que en el caso de <code>-1<\/code>, ponemos el número entre paréntesis, ya que <code>say -1.WHAT<\/code> intentaría negar el resultado de <code>1.WHAT<\/code>, lo que lleva a una excepción.<\/span><\/p>"]]},"it":{"t":"Introspezione con <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">È possibile vedere il tipo di dati in una variabile chiamando il metodo <code>WHAT<\/code> su di essa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il tipo viene stampato tra parentesi, come mostrato nei commenti.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, <code>(Int)<\/code> o <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non c'è problema a chiamare un metodo su un letterale stesso.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che nel caso di <code>-1<\/code>, mettiamo il numero tra parentesi, poiché <code>say -1.WHAT<\/code> tenterebbe di negare il risultato di <code>1.WHAT<\/code>, il che porta a un'eccezione.<\/span><\/p>"]]},"lv":{"t":"Introspekcija ar <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams redzēt datu tipu mainīgajā, izsaucot <code>WHAT<\/code> metodi uz tā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tips tiek izdrukāts iekavās, kā parādīts komentāros.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, <code>(Int)<\/code> vai <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nav problēmu izsaukt metodi uz pašas literāles.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka gadījumā ar <code>-1<\/code>, mēs ievietojam skaitli iekavās, jo <code>say -1.WHAT<\/code> mēģinātu noliegt <code>1.WHAT<\/code> rezultātu, kas noved pie izņēmuma.<\/span><\/p>"]]},"ru":{"t":"Интроспекция с помощью <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Можно увидеть тип данных в переменной, вызвав метод <code>WHAT<\/code> на ней:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип выводится в скобках, как показано в комментариях.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>(Int)<\/code> или <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Нет проблем вызвать метод на самом литерале.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что в случае с <code>-1<\/code>, мы заключаем число в скобки, так как <code>say -1.WHAT<\/code> попыталось бы отрицать результат <code>1.WHAT<\/code>, что приведет к исключению.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція з <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Можна побачити тип даних у змінній, викликавши метод <code>WHAT<\/code> на ній:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип виводиться в дужках, як показано в коментарях.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>(Int)<\/code> або <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Немає проблем викликати метод на самому літералі.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що у випадку з <code>-1<\/code>, ми ставимо число в дужки, оскільки <code>say -1.WHAT<\/code> спробує заперечити результат <code>1.WHAT<\/code>, що призведе до винятку.<\/span><\/p>"]]},"bg":{"t":"Интроспекция с <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Възможно е да се види типът на данните в променлива, като се извика методът <code>WHAT<\/code> върху нея:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Типът се отпечатва в скоби, както е показано в коментарите.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>(Int)<\/code> или <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Няма проблем да се извика метод върху самия литерал.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че в случая с <code>-1<\/code>, поставяме числото в скоби, тъй като <code>say -1.WHAT<\/code> би опитало да негира резултата на <code>1.WHAT<\/code>, което води до изключение.<\/span><\/p>"]]},"eo":{"t":"Introspekto kun <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Eblas vidi la tipon de datumoj en variablo vokante la metodon <code>WHAT<\/code> sur ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La tipo estas presita en krampoj, kiel montrite en la komentoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, <code>(Int)<\/code> aŭ <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne estas problemo voki metodon sur literalo mem.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke en la kazo de <code>-1<\/code>, ni metas la numeron en krampoj, ĉar <code>say -1.WHAT<\/code> provus nei la rezulton de <code>1.WHAT<\/code>, kio kondukas al escepto.<\/span><\/p>"]]},"la":{"t":"Introspectio cum <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Possibile est videre genus datae in variabili vocando methodum <code>WHAT<\/code> in ea:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Genus in parenthesibus imprimitur, ut in commentariis monstratur.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, <code>(Int)<\/code> vel <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nullum est problema vocare methodum in litterali ipso.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod in casu <code>-1<\/code>, numerum in parenthesibus ponimus, quia <code>say -1.WHAT<\/code> conaretur negare eventum <code>1.WHAT<\/code>, quod ad exceptionem ducit.<\/span><\/p>"]]}}}</script>
