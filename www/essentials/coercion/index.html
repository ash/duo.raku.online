<script type="application/json" id="page-data">{"u":"essentials/coercion","n":178,"k":"section","pv":"essentials/loops/exercises/digital-stairs/solution","nx":"essentials/coercion/what","tr":["essentials"],"L":{"en":{"t":"Data type conversion","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">So far, we have seen a number of data types that Raku supports.<\/span> <span class=\"sg\" data-s=\"1\">Those were different kinds of <a href=\"/essentials/numbers/\">numbers<\/a> (integers, rational numbers, and floating-point numbers), <a href=\"/essentials/strings/\">strings<\/a>, and <a href=\"/essentials/booleans/\">Boolean<\/a> type.<\/span> <span class=\"sg\" data-s=\"2\">Each data type has its name in the Raku type system.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | String of characters <code>Int<\/code> | Integer number <code>Rat<\/code> | Rational number <code>Num<\/code> | Floating-point number <code>Bool<\/code> | Logical Boolean<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">There are more data types that Raku understands.<\/span> <span class=\"sg\" data-s=\"1\">We will see them in the further sections of this course.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exercises<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Please do not skip the exercises after this section as they reveal some additional information about the data types of Raku.<\/span><\/p>"]]},"de":{"t":"Datentyp-Konvertierung","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bisher haben wir eine Reihe von Datentypen gesehen, die Raku unterstützt.<\/span> <span class=\"sg\" data-s=\"1\">Das waren verschiedene Arten von <a href=\"https://course.raku.org/de/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">Zahlen<\/a> (Ganzzahlen, rationale Zahlen und Gleitkommazahlen), <a href=\"https://course.raku.org/de/essentials/strings/\" target=\"_blank\" rel=\"noopener\">Zeichenketten<\/a> und der <a href=\"https://course.raku.org/de/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Boolesche<\/a> Typ.<\/span> <span class=\"sg\" data-s=\"2\">Jeder Datentyp hat seinen Namen im Raku-Typsystem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Zeichenkette <code>Int<\/code> | Ganzzahl <code>Rat<\/code> | Rationale Zahl <code>Num<\/code> | Gleitkommazahl <code>Bool<\/code> | Logischer Boolean<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt noch mehr Datentypen, die Raku versteht.<\/span> <span class=\"sg\" data-s=\"1\">Wir werden sie in den weiteren Abschnitten dieses Kurses sehen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Übungen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bitte überspringen Sie die Übungen nach diesem Abschnitt nicht, da sie einige zusätzliche Informationen über die Datentypen von Raku offenbaren.<\/span><\/p>"]]},"nl":{"t":"Datentyp-conversie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe hebben we een aantal gegevenstypen gezien die Raku ondersteunt.<\/span> <span class=\"sg\" data-s=\"1\">Dat waren verschillende soorten <a href=\"https://course.raku.org/nl/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">getallen<\/a> (gehele getallen, rationale getallen en drijvende-kommagetallen), <a href=\"https://course.raku.org/nl/essentials/strings/\" target=\"_blank\" rel=\"noopener\">strings<\/a>, en <a href=\"https://course.raku.org/nl/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleaanse<\/a> typen.<\/span> <span class=\"sg\" data-s=\"2\">Elk gegevenstype heeft zijn naam in het Raku-type systeem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | String van karakters <code>Int<\/code> | Geheel getal <code>Rat<\/code> | Rationaal getal <code>Num<\/code> | Drijvend-kommagetal <code>Bool<\/code> | Logisch Booleaans<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er zijn meer gegevenstypen die Raku begrijpt.<\/span> <span class=\"sg\" data-s=\"1\">We zullen ze zien in de volgende secties van deze cursus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oefeningen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sla de oefeningen na deze sectie niet over, want ze onthullen wat extra informatie over de gegevenstypen van Raku.<\/span><\/p>"]]},"es":{"t":"Conversión de tipos de datos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, hemos visto una serie de tipos de datos que Raku soporta.<\/span> <span class=\"sg\" data-s=\"1\">Esos fueron diferentes tipos de <a href=\"https://course.raku.org/es/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">números<\/a> (enteros, números racionales y números de punto flotante), <a href=\"https://course.raku.org/es/essentials/strings/\" target=\"_blank\" rel=\"noopener\">cadenas<\/a> y el tipo <a href=\"https://course.raku.org/es/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleano<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Cada tipo de dato tiene su nombre en el sistema de tipos de Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Cadena de caracteres <code>Int<\/code> | Número entero <code>Rat<\/code> | Número racional <code>Num<\/code> | Número de punto flotante <code>Bool<\/code> | Booleano lógico<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay más tipos de datos que Raku entiende.<\/span> <span class=\"sg\" data-s=\"1\">Los veremos en las siguientes secciones de este curso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejercicios<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por favor, no omitas los ejercicios después de esta sección ya que revelan información adicional sobre los tipos de datos de Raku.<\/span><\/p>"]]},"it":{"t":"Conversione dei tipi di dati","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Finora, abbiamo visto un numero di tipi di dati che Raku supporta.<\/span> <span class=\"sg\" data-s=\"1\">Questi erano diversi tipi di <a href=\"https://course.raku.org/it/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">numeri<\/a> (interi, numeri razionali e numeri in virgola mobile), <a href=\"https://course.raku.org/it/essentials/strings/\" target=\"_blank\" rel=\"noopener\">stringhe<\/a> e tipo <a href=\"https://course.raku.org/it/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleano<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ogni tipo di dato ha il suo nome nel sistema di tipi di Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Stringa di caratteri <code>Int<\/code> | Numero intero <code>Rat<\/code> | Numero razionale <code>Num<\/code> | Numero in virgola mobile <code>Bool<\/code> | Booleano logico<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono più tipi di dati che Raku comprende.<\/span> <span class=\"sg\" data-s=\"1\">Li vedremo nelle sezioni successive di questo corso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esercizi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per favore, non saltare gli esercizi dopo questa sezione poiché rivelano alcune informazioni aggiuntive sui tipi di dati di Raku.<\/span><\/p>"]]},"lv":{"t":"Datu tipu konvertēšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Līdz šim mēs esam apskatījuši vairākus datu tipus, ko atbalsta Raku.<\/span> <span class=\"sg\" data-s=\"1\">Tie bija dažādi <a href=\"https://course.raku.org/lv/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">skaitļi<\/a> (veseli skaitļi, racionāli skaitļi un peldošā punkta skaitļi), <a href=\"https://course.raku.org/lv/essentials/strings/\" target=\"_blank\" rel=\"noopener\">virknes<\/a> un <a href=\"https://course.raku.org/lv/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">loģiskais<\/a> tips.<\/span> <span class=\"sg\" data-s=\"2\">Katram datu tipam Raku tipa sistēmā ir savs nosaukums.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Rakstzīmju virkne <code>Int<\/code> | Vesels skaitlis <code>Rat<\/code> | Racionāls skaitlis <code>Num<\/code> | Peldošā punkta skaitlis <code>Bool<\/code> | Loģiskais Būla tips<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir vēl vairāk datu tipu, kurus Raku saprot.<\/span> <span class=\"sg\" data-s=\"1\">Mēs tos apskatīsim turpmākajās šī kursa sadaļās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevumi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūdzu, nepalaidiet garām uzdevumus pēc šīs sadaļas, jo tie atklāj papildu informāciju par Raku datu tipiem.<\/span><\/p>"]]},"ru":{"t":"Приведение типов данных","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">До сих пор мы рассмотрели несколько типов данных, которые поддерживает Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это были различные виды <a href=\"https://course.raku.org/ru/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">чисел<\/a> (целые числа, рациональные числа и числа с плавающей запятой), <a href=\"https://course.raku.org/ru/essentials/strings/\" target=\"_blank\" rel=\"noopener\">строки<\/a> и <a href=\"https://course.raku.org/ru/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">логический<\/a> тип.<\/span> <span class=\"sg\" data-s=\"2\">Каждый тип данных имеет свое название в системе типов Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Строка символов <code>Int<\/code> | Целое число <code>Rat<\/code> | Рациональное число <code>Num<\/code> | Число с плавающей запятой <code>Bool<\/code> | Логический тип<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Существует больше типов данных, которые понимает Raku.<\/span> <span class=\"sg\" data-s=\"1\">Мы рассмотрим их в следующих разделах этого курса.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Упражнения<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пожалуйста, не пропускайте упражнения после этого раздела, так как они раскрывают дополнительную информацию о типах данных в Raku.<\/span><\/p>"]]},"uk":{"t":"Перетворення типів даних","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">До цього часу ми розглянули кілька типів даних, які підтримує Raku.<\/span> <span class=\"sg\" data-s=\"1\">Це були різні види <a href=\"https://course.raku.org/uk/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">чисел<\/a> (цілі числа, раціональні числа та числа з плаваючою комою), <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">рядки<\/a> та <a href=\"https://course.raku.org/uk/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">логічний<\/a> тип.<\/span> <span class=\"sg\" data-s=\"2\">Кожен тип даних має свою назву в системі типів Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Рядок символів <code>Int<\/code> | Ціле число <code>Rat<\/code> | Раціональне число <code>Num<\/code> | Число з плаваючою комою <code>Bool<\/code> | Логічний булевий тип<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Існує більше типів даних, які розуміє Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ми розглянемо їх у наступних розділах цього курсу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вправи<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Будь ласка, не пропускайте вправи після цього розділу, оскільки вони розкривають додаткову інформацію про типи даних у Raku.<\/span><\/p>"]]},"bg":{"t":"Преобразуване на типове данни","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досега видяхме редица типове данни, които Raku поддържа.<\/span> <span class=\"sg\" data-s=\"1\">Това бяха различни видове <a href=\"https://course.raku.org/bg/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">числа<\/a> (целочислени, рационални числа и числа с плаваща запетая), <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">низове<\/a> и <a href=\"https://course.raku.org/bg/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булеви<\/a> типове.<\/span> <span class=\"sg\" data-s=\"2\">Всеки тип данни има своето име в системата от типове на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Низ от символи <code>Int<\/code> | Цяло число <code>Rat<\/code> | Рационално число <code>Num<\/code> | Число с плаваща запетая <code>Bool<\/code> | Логически булев<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има още типове данни, които Raku разбира.<\/span> <span class=\"sg\" data-s=\"1\">Ще ги видим в следващите секции на този курс.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Упражнения<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Моля, не пропускайте упражненията след тази секция, тъй като те разкриват допълнителна информация за типовете данни на Raku.<\/span><\/p>"]]},"eo":{"t":"Datentipa konvertado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, ni vidis kelkajn datumtipojn, kiujn Raku subtenas.<\/span> <span class=\"sg\" data-s=\"1\">Tiuj estis diversaj specoj de <a href=\"https://course.raku.org/eo/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">nombroj<\/a> (entjeroj, raciaj nombroj, kaj glitkomaj nombroj), <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">ĉenoj<\/a>, kaj <a href=\"https://course.raku.org/eo/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Boolea<\/a> tipo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu datumtipo havas sian nomon en la Raku-tipsistemo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Ĉeno de karakteroj <code>Int<\/code> | Entjera nombro <code>Rat<\/code> | Racia nombro <code>Num<\/code> | Glitkoma nombro <code>Bool<\/code> | Logika Boolea<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas pli da datumtipoj, kiujn Raku komprenas.<\/span> <span class=\"sg\" data-s=\"1\">Ni vidos ilin en la sekvaj sekcioj de ĉi tiu kurso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzercoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bonvolu ne preterlasi la ekzercojn post ĉi tiu sekcio, ĉar ili malkaŝas kelkajn pliajn informojn pri la datumtipoj de Raku.<\/span><\/p>"]]},"la":{"t":"Data typus conversio","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hactenus, complura genera datorum quae Raku sustinet vidimus.<\/span> <span class=\"sg\" data-s=\"1\">Ea erant varii generis <a href=\"https://course.raku.org/la/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">numeri<\/a> (integri, numeri rationales, et numeri fluitantes), <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">chordae<\/a>, et <a href=\"https://course.raku.org/la/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleana<\/a> genera.<\/span> <span class=\"sg\" data-s=\"2\">Unumquodque genus datorum nomen suum in systemate generum Raku habet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Chorda characterum <code>Int<\/code> | Numerus integer <code>Rat<\/code> | Numerus rationalis <code>Num<\/code> | Numerus fluitans <code>Bool<\/code> | Booleana logica<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plura sunt genera datorum quae Raku intelligit.<\/span> <span class=\"sg\" data-s=\"1\">Ea in sectionibus sequentibus huius cursus videbimus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exercitia<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeso ne exercitia post hanc sectionem praetermittas, quia aliqua informationes additas de generibus datorum Raku revelant.<\/span><\/p>"]]}}}</script>
