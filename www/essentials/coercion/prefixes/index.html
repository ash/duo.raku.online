"0\">Considera exemplum creandi valorem Booleanum ex integro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic ?42; # Verum<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Converto ad stringam simile est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meus $n = -30;\nmeus $s = ~$n;\ndic $s.chars; # 3, ut \"-30\" habet 3 characteres<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod cum conversione numerica, genus valoris conversi differt secundum numerum in quaestione.<\/span> <span class=\"sg\" data-s=\"1\">Compara conversiones sequentes ex stringis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic (+'100').WHAT;   # (Int)\ndic (+'3.14').WHAT;  # (Rat)\ndic (+'27E-1').WHAT; # (Num)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad conversiones Booleanas, est alia ratio quae vocatur <code>so<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Potes uti ea ut operator praefixus vel ut methodus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meus $valor = 42;\ndic so $valor; # Verum\ndic $valor.so; # Verum<\/code><\/pre>"]]}}}</script>
