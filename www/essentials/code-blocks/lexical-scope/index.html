<script type="application/json" id="page-data">{"u":"essentials/code-blocks/lexical-scope","n":118,"k":"topic","pv":"essentials/code-blocks","nx":"essentials/code-blocks/lexical-scope/quiz","tr":["essentials","essentials/code-blocks"],"L":{"en":{"t":"Lexical scope","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A code block creates a so-called lexical scope.<\/span> <span class=\"sg\" data-s=\"1\">Variables declared in the current block are visible inside it, but not after the program exits the block.<\/span> <span class=\"sg\" data-s=\"2\">Consider an example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>$x<\/code> variable is created in the code block.<\/span> <span class=\"sg\" data-s=\"1\">The first call of <code>say $x<\/code> prints the value of the variable as it is visible within the block.<\/span> <span class=\"sg\" data-s=\"2\">The second <code>say $x<\/code> fails because the name <code>$x<\/code> does not exist outside of the block and is not known after it ended.<\/span> <span class=\"sg\" data-s=\"3\">The program does not compile and you get an error:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"de":{"t":"Lexikalischer Gültigkeitsbereich","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Codeblock erstellt einen sogenannten lexikalischen Geltungsbereich.<\/span> <span class=\"sg\" data-s=\"1\">Variablen, die im aktuellen Block deklariert werden, sind innerhalb dieses Blocks sichtbar, aber nicht mehr, nachdem das Programm den Block verlassen hat.<\/span> <span class=\"sg\" data-s=\"2\">Betrachten Sie ein Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$x<\/code> wird im Codeblock erstellt.<\/span> <span class=\"sg\" data-s=\"1\">Der erste Aufruf von <code>say $x<\/code> gibt den Wert der Variablen aus, da sie innerhalb des Blocks sichtbar ist.<\/span> <span class=\"sg\" data-s=\"2\">Der zweite <code>say $x<\/code> schlägt fehl, weil der Name <code>$x<\/code> außerhalb des Blocks nicht existiert und nach dessen Ende nicht bekannt ist.<\/span> <span class=\"sg\" data-s=\"3\">Das Programm kompiliert nicht und es wird ein Fehler angezeigt:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"nl":{"t":"Lexicaal bereik","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een codeblok creëert een zogenaamde lexicale scope.<\/span> <span class=\"sg\" data-s=\"1\">Variabelen die in het huidige blok worden gedeclareerd, zijn binnen dat blok zichtbaar, maar niet nadat het programma het blok verlaat.<\/span> <span class=\"sg\" data-s=\"2\">Overweeg een voorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$x<\/code> wordt in het codeblok gecreëerd.<\/span> <span class=\"sg\" data-s=\"1\">De eerste aanroep van <code>say $x<\/code> drukt de waarde van de variabele af omdat deze binnen het blok zichtbaar is.<\/span> <span class=\"sg\" data-s=\"2\">De tweede <code>say $x<\/code> faalt omdat de naam <code>$x<\/code> buiten het blok niet bestaat en niet bekend is nadat het blok is geëindigd.<\/span> <span class=\"sg\" data-s=\"3\">Het programma compileert niet en je krijgt een foutmelding:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"es":{"t":"Alcance léxico","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un bloque de código crea un llamado alcance léxico.<\/span> <span class=\"sg\" data-s=\"1\">Las variables declaradas en el bloque actual son visibles dentro de él, pero no después de que el programa salga del bloque.<\/span> <span class=\"sg\" data-s=\"2\">Considera un ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$x<\/code> se crea en el bloque de código.<\/span> <span class=\"sg\" data-s=\"1\">La primera llamada de <code>say $x<\/code> imprime el valor de la variable ya que es visible dentro del bloque.<\/span> <span class=\"sg\" data-s=\"2\">La segunda <code>say $x<\/code> falla porque el nombre <code>$x<\/code> no existe fuera del bloque y no es conocido después de que terminó.<\/span> <span class=\"sg\" data-s=\"3\">El programa no se compila y obtienes un error:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"it":{"t":"Ambito lessicale","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un blocco di codice crea il cosiddetto ambito lessicale.<\/span> <span class=\"sg\" data-s=\"1\">Le variabili dichiarate nel blocco corrente sono visibili al suo interno, ma non dopo che il programma esce dal blocco.<\/span> <span class=\"sg\" data-s=\"2\">Consideriamo un esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$x<\/code> viene creata nel blocco di codice.<\/span> <span class=\"sg\" data-s=\"1\">La prima chiamata di <code>say $x<\/code> stampa il valore della variabile ем блоке, видны только внутри него, и исчезают после того, как программа покидает этот блок.<\/span> <span class=\"sg\" data-s=\"2\">Рассмотрим пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$x<\/code> создается внутри блока кода.<\/span> <span class=\"sg\" data-s=\"1\">Первый вызов <code>say $x<\/code> печатает значение переменной, потому что она видна внутри блока.<\/span> <span class=\"sg\" data-s=\"2\">Второй вызов <code>say $x<\/code> вылетает с ошибкой, потому что имя <code>$x<\/code> отсутствует вне блока и неизвестно после его окончания.<\/span> <span class=\"sg\" data-s=\"3\">Программа отказывается компилироваться и выводит ошибку:<\/span><\/p>"],["code",0,"<pre><code>===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku\nVariable '$x' is not declared\nat /Users/ash/raku-course/t.raku:6\n------&gt; say ⏏$x;<\/code><\/pre>"]]},"uk":{"t":"Лексична область видимості","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блок коду створює так званий лексичний обсяг.<\/span> <span class=\"sg\" data-s=\"1\">Змінні, оголошені в поточному блоці, видимі всередині нього, але не після виходу програми з блоку.<\/span> <span class=\"sg\" data-s=\"2\">Розглянемо приклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$x<\/code> створюється в блоці коду.<\/span> <span class=\"sg\" data-s=\"1\">Перше викликання <code>say $x<\/code> виводить значення змінної, оскільки вона видима всередині блоку.<\/span> <span class=\"sg\" data-s=\"2\">Друге <code>say $x<\/code> не вдається, тому що ім'я <code>$x<\/code> не існує поза блоком і не відоме після його завершення.<\/span> <span class=\"sg\" data-s=\"3\">Програма не компілюється, і ви отримуєте помилку:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"bg":{"t":"Лексикален обхват","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блокът от код създава така наречения лексикален обхват.<\/span> <span class=\"sg\" data-s=\"1\">Променливите, декларирани в текущия блок, са видими вътре в него, но не и след като програмата излезе от блока.<\/span> <span class=\"sg\" data-s=\"2\">Разгледайте следния пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$x<\/code> е създадена в блока от код.<\/span> <span class=\"sg\" data-s=\"1\">Първото извикване на <code>say $x<\/code> отпечатва стойността на променливата, тъй като тя е видима в рамките на блока.<\/span> <span class=\"sg\" data-s=\"2\">Второто <code>say $x<\/code> не успява, защото името <code>$x<\/code> не съществува извън блока и не е известно след неговото приключване.<\/span> <span class=\"sg\" data-s=\"3\">Програмата не се компилира и получавате грешка:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"eo":{"t":"Leksika amplekso","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Koda bloko kreas tiel nomatan leksikan skopon.<\/span> <span class=\"sg\" data-s=\"1\">Variabloj deklaritaj en la nuna bloko estas videblaj interne, sed ne post kiam la programo eliras el la bloko.<\/span> <span class=\"sg\" data-s=\"2\">Konsideru ekzemplon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$x<\/code> estas kreita en la koda bloko.<\/span> <span class=\"sg\" data-s=\"1\">La unua voko de <code>say $x<\/code> presas la valoron de la variablo ĉar ĝi estas videbla ene de la bloko.<\/span> <span class=\"sg\" data-s=\"2\">La dua <code>say $x<\/code> malsukcesas ĉar la nomo <code>$x<\/code> ne ekzistas ekster la bloko kaj ne estas konata post kiam ĝi finiĝis.<\/span> <span class=\"sg\" data-s=\"3\">La programo ne kompilas kaj vi ricevas eraron:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"la":{"t":"Lexicalis ambitus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Clausula codicis creat quod vocatur ambitus lexicalis.<\/span> <span class=\"sg\" data-s=\"1\">Variabiles in clausula currenti declaratae intra eam visibiles sunt, sed non postquam programma clausulam exierit.<\/span> <span class=\"sg\" data-s=\"2\">Considera exemplum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$x<\/code> in clausula codicis creata est.<\/span> <span class=\"sg\" data-s=\"1\">Prima vocatio <code>say $x<\/code> valorem variabilis imprimit ut visibilis sit intra clausulam.<\/span> <span class=\"sg\" data-s=\"2\">Secunda <code>say $x<\/code> deficit quia nomen <code>$x<\/code> extra clausulam non existit et post finem eius non cognoscitur.<\/span> <span class=\"sg\" data-s=\"3\">Programma non compilatur et errorem accipis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variabilis '$x' non declarata est     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]}}}</script>
