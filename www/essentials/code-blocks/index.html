<script type="application/json" id="page-data">{"u":"essentials/code-blocks","n":117,"k":"section","pv":"essentials/ranges/exercises/number-in-limits/solution","nx":"essentials/code-blocks/lexical-scope","tr":["essentials"],"L":{"en":{"t":"Code blocks","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Code blocks are fragments of your program enclosed in a pair of curly braces: <code>{<\/code> and <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">They group a series of statements that work together as a kind of one big statement.<\/span> <span class=\"sg\" data-s=\"2\">We will see many use cases in the further sections.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The presence of a code block in this program does not add much sense, but code blocks are quite useful in other situations, which we’ll cover very soon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">But first, let us examine the concept of <em>scope<\/em>.<\/span><\/p>"]]},"de":{"t":"Codeblöcke","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Codeblöcke sind Fragmente Ihres Programms, die in ein Paar geschweifte Klammern <code>{<\/code> und <code>}<\/code> eingeschlossen sind.<\/span> <span class=\"sg\" data-s=\"1\">Sie gruppieren eine Reihe von Anweisungen, die zusammen als eine Art große Anweisung fungieren.<\/span> <span class=\"sg\" data-s=\"2\">Wir werden viele Anwendungsfälle in den weiteren Abschnitten sehen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hallo, Welt!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Vorhandensein eines Codeblocks in diesem Programm ergibt nicht viel Sinn, aber Codeblöcke sind in anderen Situationen sehr nützlich, die wir bald behandeln werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aber zuerst lassen Sie uns das Konzept des <em>Scopes<\/em> untersuchen.<\/span><\/p>"]]},"nl":{"t":"Code blokken","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Codeblokken zijn fragmenten van je programma ingesloten in een paar accolades: <code>{<\/code> en <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze groeperen een reeks uitspraken die samenwerken als een soort van één grote uitspraak.<\/span> <span class=\"sg\" data-s=\"2\">We zullen veel gebruikssituaties zien in de volgende secties.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hallo, Wereld!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De aanwezigheid van een codeblok in dit programma voegt niet veel betekenis toe, maar codeblokken zijn behoorlijk nuttig in andere situaties, die we zeer binnenkort zullen behandelen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Maar eerst, laten we het concept van <em>scope<\/em> onderzoeken.<\/span><\/p>"]]},"es":{"t":"Bloques de código","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los bloques de código son fragmentos de tu programa encerrados en un par de llaves: <code>{<\/code> y <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Agrupan una serie de declaraciones que funcionan juntas como una especie de gran declaración.<\/span> <span class=\"sg\" data-s=\"2\">Veremos muchos casos de uso en las siguientes secciones.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say '¡Hola, Mundo!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La presencia de un bloque de código en este programa no añade mucho sentido, pero los bloques de código son bastante útiles en otras situaciones, las cuales cubriremos muy pronto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pero primero, examinemos el concepto de <em>alcance<\/em>.<\/span><\/p>"]]},"it":{"t":"Blocchi di codice","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">I blocchi di codice sono frammenti del tuo programma racchiusi in una coppia di parentesi graffe: <code>{<\/code> e <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raggruppano una serie di istruzioni che lavorano insieme come una sorta di grande istruzione unica.<\/span> <span class=\"sg\" data-s=\"2\">Vedremo molti casi d'uso nelle sezioni successive.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La presenza di un blocco di codice in questo programma non aggiunge molto senso, ma i blocchi di codice sono piuttosto utili in altre situazioni, che tratteremo molto presto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ma prima, esaminiamo il concetto di <em>ambito<\/em>.<\/span><\/p>"]]},"lv":{"t":"Koda bloki","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Koda bloki ir jūsu programmas fragmenti, kas ir ietverti pāra cirtainajās iekavās: <code>{<\/code> un <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tie grupē virkni paziņojumu, kas darbojas kopā kā viena liela paziņojuma veids.<\/span> <span class=\"sg\" data-s=\"2\">Mēs redzēsim daudzus lietošanas gadījumus turpmākajās sadaļās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Koda bloka klātbūtne šajā programmā daudz jēgas nepievieno, bet koda bloki ir diezgan noderīgi citās situācijās, kuras mēs drīz apskatīsim.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bet vispirms aplūkosim <em>apjoma<\/em> jēdzienu.<\/span><\/p>"]]},"ru":{"t":"Блоки кода","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блоки кода — это фрагменты вашей программы, заключенные в пары фигурных скобок: <code>{<\/code> и <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Они группируют последовательность инструкций, которые вместе считаются как одна большая инструкция.<\/span> <span class=\"sg\" data-s=\"2\">Мы увидим много способов использования блоков кода в следующих главах.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наличие блока кода в этой программе не имеет большого смысла, но они очень полезны в других ситуациях, о которых мы скоро узнаем.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но для начала давайте рассмотрим понятие <em>область видимости<\/em>.<\/span><\/p>"]]},"uk":{"t":"Блоки коду","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блоки коду — це фрагменти вашої програми, обмежені парою фігурних дужок: <code>{<\/code> і <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони групують серію операторів, які працюють разом як один великий оператор.<\/span> <span class=\"sg\" data-s=\"2\">Ми побачимо багато випадків використання в наступних розділах.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наявність блоку коду в цій програмі не додає багато сенсу, але блоки коду досить корисні в інших ситуаціях, які ми розглянемо дуже скоро.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Але спочатку давайте розглянемо концепцію <em>області видимості<\/em>.<\/span><\/p>"]]},"bg":{"t":"Кодови блокове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кодовите блокове са фрагменти от вашата програма, оградени с чифт къдрави скоби: <code>{<\/code> и <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те групират серия от изрази, които работят заедно като един вид голям израз.<\/span> <span class=\"sg\" data-s=\"2\">Ще видим много случаи на употреба в следващите раздели.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Присъствието на кодов блок в тази програма не добавя много смисъл, но кодовите блокове са доста полезни в други ситуации, които ще разгледаме много скоро.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но първо, нека разгледаме концепцията за <em>обхват<\/em>.<\/span><\/p>"]]},"eo":{"t":"Kodoblokoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kodoblokoj estas fragmentoj de via programo enfermita en paro de kurbaj krampoj: <code>{<\/code> kaj <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili grupigas serion de deklaroj kiuj laboras kune kiel unu granda deklaro.<\/span> <span class=\"sg\" data-s=\"2\">Ni vidos multajn uzokazojn en la sekvaj sekcioj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La ĉeesto de kodobloko en ĉi tiu programo ne aldonas multan sencon, sed kodoblokoj estas tre utilaj en aliaj situacioj, kiujn ni kovros tre baldaŭ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed unue, ni ekzaminu la koncepton de <em>amplekso<\/em>.<\/span><\/p>"]]},"la":{"t":"Codicis sectiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Claustra codicis sunt fragmenta programmatis tui inclusa in par parvorum uncinarum: <code>{<\/code> et <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aggregant seriem enuntiationum quae simul operantur quasi una magna enuntiatio.<\/span> <span class=\"sg\" data-s=\"2\">Multas usus casus in sectionibus sequentibus videbimus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    dic 'Salve, Munde!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Praesentia claustri codicis in hoc programmate non multum sensus addit, sed claustra codicis in aliis situationibus valde utilia sunt, quas mox tractabimus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed primum, conceptum <em>ambitus<\/em> examinemus.<\/span><\/p>"]]}}}</script>
