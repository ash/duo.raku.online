<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/comparing-numbers","n":132,"k":"topic","pv":"essentials/conditional-checks/modifiers","nx":"essentials/conditional-checks/comparing-numbers/quiz","tr":["essentials","essentials/conditional-checks"],"L":{"en":{"t":"Comparing numbers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">To compare two numbers, use the following operators.<\/span> <span class=\"sg\" data-s=\"1\">All of them are quite obvious if you are familiar with other programming languages.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Equal <code>!=<\/code> | Not equal <code>&lt;<\/code> | Less than <code>&lt;=<\/code> | Less than or equal <code>&gt;<\/code> | Greater than <code>&gt;=<\/code> | Greater than or equal<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Approximately-equal<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In addition to standard operators, Raku adds the approximately-equal operator <code>=~=<\/code>, which compares the numbers approximately.<\/span> <span class=\"sg\" data-s=\"1\">Its result is <code>True<\/code> if the two numbers are relatively close to each other.<\/span> <span class=\"sg\" data-s=\"2\">The maximum relative difference must not exceed the built-in value <code>$*TOLERANCE<\/code>, which is equal to <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode versions<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Some of the above operators have their Unicode equivalents:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Examples<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Some examples with the operators that compare numbers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Note that the number <code>1.000000000000000000000001<\/code> is a <code>Rat<\/code> number, so you do not lose precision in an expression with a close number <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The last example with <code>2e17<\/code> operates with <code>Num<\/code> numbers, which have restricted precision.<\/span><\/p>"]]},"de":{"t":"Vergleichen von Zahlen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Um zwei Zahlen zu vergleichen, verwenden Sie die folgenden Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Alle sind ziemlich offensichtlich, wenn Sie mit anderen Programmiersprachen vertraut sind.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Gleich <code>!=<\/code> | Ungleich <code>&lt;<\/code> | Kleiner als <code>&lt;=<\/code> | Kleiner oder gleich <code>&gt;<\/code> | Größer als <code>&gt;=<\/code> | Größer oder gleich<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ungefähr gleich<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zusätzlich zu den Standardoperatoren fügt Raku den ungefähr-gleich-Operator <code>=~=<\/code> hinzu, der die Zahlen ungefähr vergleicht.<\/span> <span class=\"sg\" data-s=\"1\">Sein Ergebnis ist <code>True<\/code>, wenn die beiden Zahlen relativ nahe beieinander liegen.<\/span> <span class=\"sg\" data-s=\"2\">Der maximale relative Unterschied darf den eingebauten Wert <code>$*TOLERANCE<\/code>, der <code>1e-15<\/code> entspricht, nicht überschreiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-Versionen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige der oben genannten Operatoren haben ihre Unicode-Äquivalente:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code> <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiele<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige Beispiele mit den Operatoren, die Zahlen vergleichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass die Zahl <code>1.000000000000000000000001<\/code> eine <code>Rat<\/code>-Zahl ist, sodass Sie in einem Ausdruck mit einer nahen Zahl <code>1.000000000000000000000002<\/code> keine Genauigkeit verlieren.<\/span> <span class=\"sg\" data-s=\"1\">Das letzte Beispiel mit <code>2e17<\/code> arbeitet mit <code>Num<\/code>-Zahlen, die eine eingeschränkte Genauigkeit haben.<\/span><\/p>"]]},"nl":{"t":"Getallen vergelijken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om twee getallen te vergelijken, gebruik je de volgende operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn allemaal vrij duidelijk als je bekend bent met andere programmeertalen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Gelijk <code>!=<\/code> | Niet gelijk <code>&lt;<\/code> | Minder dan <code>&lt;=<\/code> | Minder dan of gelijk aan <code>&gt;<\/code> | Groter dan <code>&gt;=<\/code> | Groter dan of gelijk aan<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ongeveer-gelijk<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Naast standaardoperatoren voegt Raku de ongeveer-gelijk operator <code>=~=<\/code> toe, die de getallen ongeveer vergelijkt.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is <code>True<\/code> als de twee getallen relatief dicht bij elkaar liggen.<\/span> <span class=\"sg\" data-s=\"2\">Het maximale relatieve verschil mag de ingebouwde waarde <code>$*TOLERANCE<\/code>, die gelijk is aan <code>1e-15<\/code>, niet overschrijden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-versies<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sommige van de bovenstaande operatoren hebben hun Unicode-equivalenten:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeelden<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Enkele voorbeelden met de operatoren die getallen vergelijken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Merk op dat het getal <code>1.000000000000000000000001<\/code> een <code>Rat<\/code>-getal is, dus je verliest geen precisie in een uitdrukking met een nabijgelegen getal <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het laatste voorbeeld met <code>2e17<\/code> werkt met <code>Num<\/code>-getallen, die beperkte precisie hebben.<\/span><\/p>"]]},"es":{"t":"Comparación de números","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para comparar dos números, utiliza los siguientes operadores.<\/span> <span class=\"sg\" data-s=\"1\">Todos ellos son bastante obvios si estás familiarizado con otros lenguajes de programación.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Igual <code>!=<\/code> | No igual <code>&lt;<\/code> | Menor que <code>&lt;=<\/code> | Menor o igual que <code>&gt;<\/code> | Mayor que <code>&gt;=<\/code> | Mayor o igual que<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aproximadamente igual<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Además de los operadores estándar, Raku añade el operador de aproximadamente igual <code>=~=<\/code>, que compara los números de manera aproximada.<\/span> <span class=\"sg\" data-s=\"1\">Su resultado es <code>True<\/code> si los dos números están relativamente cerca uno del otro.<\/span> <span class=\"sg\" data-s=\"2\">La diferencia relativa máxima no debe exceder el valor incorporado <code>$*TOLERANCE<\/code>, que es igual a <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiones Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos de los operadores anteriores tienen sus equivalentes en Unicode:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplos<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos ejemplos con los operadores que comparan números:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ten en cuenta que el número <code>1.000000000000000000000001<\/code> es un número <code>Rat<\/code>, por lo que no pierdes precisión en una expresión con un número cercano <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El último ejemplo con <code>2e17<\/code> opera con números <code>Num<\/code>, que tienen precisión restringida.<\/span><\/p>"]]},"it":{"t":"Confronto dei numeri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per confrontare due numeri, utilizza i seguenti operatori.<\/span> <span class=\"sg\" data-s=\"1\">Tutti sono abbastanza ovvi se hai familiarità con altri linguaggi di programmazione.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Uguale <code>!=<\/code> | Diverso <code>&lt;<\/code> | Minore di <code>&lt;=<\/code> | Minore o uguale <code>&gt;<\/code> | Maggiore di <code>&gt;=<\/code> | Maggiore o uguale<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Approssimativamente uguale<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Oltre agli operatori standard, Raku aggiunge l'operatore approssimativamente uguale <code>=~=<\/code>, che confronta i numeri in modo approssimativo.<\/span> <span class=\"sg\" data-s=\"1\">Il suo risultato è <code>True<\/code> se i due numeri sono relativamente vicini tra loro.<\/span> <span class=\"sg\" data-s=\"2\">La differenza relativa massima non deve superare il valore integrato <code>$*TOLERANCE<\/code>, che è pari a <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versioni Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcuni degli operatori sopra menzionati hanno i loro equivalenti Unicode:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcuni esempi con gli operatori che confrontano i numeri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che il numero <code>1.000000000000000000000001<\/code> è un numero <code>Rat<\/code>, quindi non perdi precisione in un'espressione con un numero vicino <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'ultimo esempio con <code>2e17<\/code> opera con numeri <code>Num<\/code>, che hanno una precisione limitata.<\/span><\/p>"]]},"lv":{"t":"Skaitļu salīdzināšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai salīdzinātu divus skaitļus, izmantojiet šādus operatorus.<\/span> <span class=\"sg\" data-s=\"1\">Visi tie ir diezgan acīmredzami, ja esat pazīstams ar citām programmēšanas valodām.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Vienāds <code>!=<\/code> | Nav vienāds <code>&lt;<\/code> | Mazāks par <code>&lt;=<\/code> | Mazāks vai vienāds <code>&gt;<\/code> | Lielāks par <code>&gt;=<\/code> | Lielāks vai vienāds<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aptuveni vienāds<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Papildus standarta operatoriem, Raku pievieno aptuveni vienādo operatoru <code>=~=<\/code>, kas salīdzina skaitļus aptuveni.<\/span> <span class=\"sg\" data-s=\"1\">Tā rezultāts ir <code>True<\/code>, ja abi skaitļi ir relatīvi tuvu viens otram.<\/span> <span class=\"sg\" data-s=\"2\">Maksimālā relatīvā atšķirība nedrīkst pārsniegt iebūvēto vērtību <code>$*TOLERANCE<\/code>, kas ir vienāda ar <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode versijas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dažiem no iepriekš minētajiem operatoriem ir Unicode ekvivalenti:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemēri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži piemēri ar operatoriem, kas salīdzina skaitļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka skaitlis <code>1.000000000000000000000001<\/code> ir <code>Rat<\/code> skaitlis, tāpēc jūs nezaudējat precizitāti izteiksmē ar tuvu skaitli <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēdējais piemērs ar <code>2e17<\/code> darbojas ar <code>Num<\/code> skaitļiem, kuriem ir ierobežota precizitāte.<\/span><\/p>"]]},"ru":{"t":"Сравнение чисел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Используйте следующие операторы для сравнения двух чисел.<\/span> <span class=\"sg\" data-s=\"1\">Если вы знакомы с языками программирования, они все должны показаться знакомыми.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Равно <code>!=<\/code> | Не равно <code>&lt;<\/code> | Меньше <code>&lt;=<\/code> | Меньше или равно <code>&gt;<\/code> | Больше <code>&gt;=<\/code> | Больше или равно<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизительно равно<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В дополнение к стандартным операторам Raku добавляет оператор \"приблизительно равно\" <code>=~=<\/code>, который сравнивает числа приблизительно.<\/span> <span class=\"sg\" data-s=\"1\">Его результат <code>True<\/code>, если два числа относительно близки друг к другу.<\/span> <span class=\"sg\" data-s=\"2\">Максимальная относительная разница не должна превосходить встроенное значение <code>$*TOLERANCE<\/code>, которое равно <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Некоторые из операторов выше также имеют версию в Юникоде:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Примеры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Несколько примеров с операторами сравнения чисел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Примечательно, что число <code>1.000000000000000000000001<\/code> типа <code>Rat<\/code>, поэтому вы не теряете точность в выражении с близким числом <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Последний пример с <code>2e17<\/code> работает с числами типа <code>Num<\/code>, которые имеют ограниченную точность.<\/span><\/p>"]]},"uk":{"t":"Порівняння чисел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб порівняти два числа, використовуйте наступні оператори.<\/span> <span class=\"sg\" data-s=\"1\">Всі вони досить очевидні, якщо ви знайомі з іншими мовами програмування.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Рівне <code>!=<\/code> | Не рівне <code>&lt;<\/code> | Менше ніж <code>&lt;=<\/code> | Менше або рівне <code>&gt;<\/code> | Більше ніж <code>&gt;=<\/code> | Більше або рівне<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизно рівне<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На додаток до стандартних операторів, Raku додає оператор приблизно рівності <code>=~=<\/code>, який порівнює числа приблизно.<\/span> <span class=\"sg\" data-s=\"1\">Його результат є <code>True<\/code>, якщо два числа відносно близькі одне до одного.<\/span> <span class=\"sg\" data-s=\"2\">Максимальна відносна різниця не повинна перевищувати вбудоване значення <code>$*TOLERANCE<\/code>, яке дорівнює <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікод-версії<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Деякі з вищезазначених операторів мають свої Юнікод-еквіваленти:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклади<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Декілька прикладів з операторами, які порівнюють числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що число <code>1.000000000000000000000001<\/code> є числом типу <code>Rat<\/code>, тому ви не втрачаєте точність у виразі з близьким числом <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Останній приклад з <code>2e17<\/code> оперує числами типу <code>Num<\/code>, які мають обмежену точність.<\/span><\/p>"]]},"bg":{"t":"Сравняване на числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да сравните две числа, използвайте следните оператори.<\/span> <span class=\"sg\" data-s=\"1\">Всички те са доста очевидни, ако сте запознати с други програмни езици.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Равно <code>!=<\/code> | Не е равно <code>&lt;<\/code> | По-малко от <code>&lt;=<\/code> | По-малко или равно <code>&gt;<\/code> | По-голямо от <code>&gt;=<\/code> | По-голямо или равно<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизително равно<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В допълнение към стандартните оператори, Raku добавя оператора за приблизително равенство <code>=~=<\/code>, който сравнява числата приблизително.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът му е <code>True<\/code>, ако двете числа са относително близки едно до друго.<\/span> <span class=\"sg\" data-s=\"2\">Максималната относителна разлика не трябва да надвишава вградената стойност <code>$*TOLERANCE<\/code>, която е равна на <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode версии<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Някои от горните оператори имат своите Unicode еквиваленти:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Примери<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Някои примери с операторите, които сравняват числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че числото <code>1.000000000000000000000001<\/code> е <code>Rat<\/code> число, така че не губите прецизност в израз с близко число <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Последният пример с <code>2e17<\/code> работи с <code>Num<\/code> числа, които имат ограничена прецизност.<\/span><\/p>"]]},"eo":{"t":"Komparante nombrojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por kompari du nombrojn, uzu la jenajn operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiuj estas sufiĉe evidentaj se vi konas aliajn programlingvojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Egala <code>!=<\/code> | Ne egala <code>&lt;<\/code> | Malpli ol <code>&lt;=<\/code> | Malpli ol aŭ egala <code>&gt;<\/code> | Pli granda ol <code>&gt;=<\/code> | Pli granda ol aŭ egala<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Proksimume-egala<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aldone al la normaj operatoroj, Raku aldonas la proksimume-egalan operatoron <code>=~=<\/code>, kiu komparas la nombrojn proksimume.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia rezulto estas <code>True<\/code> se la du nombroj estas relative proksimaj unu al la alia.<\/span> <span class=\"sg\" data-s=\"2\">La maksimuma relativa diferenco ne devas superi la enkonstruan valoron <code>$*TOLERANCE<\/code>, kiu estas egala al <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj versioj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj el la supraj operatoroj havas siajn Unikodajn ekvivalentojn:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemploj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj ekzemploj kun la operatoroj kiuj komparas nombrojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu ke la nombro <code>1.000000000000000000000001<\/code> estas <code>Rat<\/code> nombro, do vi ne perdas precizecon en esprimo kun proksima nombro <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La lasta ekzemplo kun <code>2e17<\/code> operacias kun <code>Num<\/code> nombroj, kiuj havas limigitan precizecon.<\/span><\/p>"]]},"la":{"t":"Comparando numeri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad comparandum duos numeros, utere sequentibus operatoribus.<\/span> <span class=\"sg\" data-s=\"1\">Omnes sunt satis manifesti si alias linguas programmandi noveris.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Aequalis <code>!=<\/code> | Non aequalis <code>&lt;<\/code> | Minor quam <code>&lt;=<\/code> | Minor aut aequalis <code>&gt;<\/code> | Maior quam <code>&gt;=<\/code> | Maior aut aequalis<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fere-aequalis<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Praeter standardos operatores, Raku addit operatorem fere-aequalem <code>=~=<\/code>, qui numeros fere comparat.<\/span> <span class=\"sg\" data-s=\"1\">Eius eventus est <code>Verum<\/code> si duo numeri relative proximi sunt.<\/span> <span class=\"sg\" data-s=\"2\">Maxima differentia relativa non debet excedere valorem inbuilt <code>$*TOLERANCE<\/code>, qui est aequalis <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiones Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quidam ex supra operatoribus habent aequivalentes Unicode:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exempla<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaedam exempla cum operatoribus qui numeros comparant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic 10 == 10; # Verum\ndic 10 != 10; # Falsum\n\ndic 15 &lt; 10;  # Falsum\ndic 10 &lt;= 10; # Verum\ndic 16 &gt; 10;  # Verum\ndic 10 &gt;= 14; # Falsum\n\ndic 1.000000000000000000000001 =~= 1.000000000000000000000002; # Verum\ndic 2e17 + 1 =~= 2e17 + 100; # Verum<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota numerum <code>1.000000000000000000000001<\/code> esse numerum <code>Rat<\/code>, ita non amittis praecisionem in expressione cum numero proximo <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ultimum exemplum cum <code>2e17<\/code> operatur cum numeris <code>Num<\/code>, qui habent praecisionem restrictam.<\/span><\/p>"]]}}}</script>
