pty string, it is considered <code>True<\/code>. The password that the user enters is never checked in this case.<br/><br/>If you type <code>==<\/code>, then the program will break as it tries to convert the strings (the user password and the correct password) to numbers and fails.<\/div>"]]},"de":{"t":"Quiz 2 — die Bedingung in <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Korrigieren Sie das Programm und beantworten Sie die Frage.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Geben Sie Ihr Passwort ein: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Richtig';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Falsch';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Was macht dieses Programm mit dem <code>=<\/code> im Test?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ihre Antwort:&nbsp; (: Druckt immer „Richtig“, Druckt immer „Falsch“, Druckt „Richtig“ für richtige Passwörter und „Falsch“ für falsche, Druckt „Falsch“ für richtige Passwörter und „Richtig“ für falsche :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Das Programm druckt immer „Richtig“, weil <code>$password = '*&(#&$#Y'<\/code> eine Zuweisung ist, die den neuen Wert der <code>$password<\/code>-Variablen festlegt. Da der Wert weder null noch eine leere Zeichenkette ist, wird er als <code>True<\/code> betrachtet. Das vom Benutzer eingegebene Passwort wird in diesem Fall nie überprüft.<br/><br/>Wenn Sie <code>==<\/code> eingeben, wird das Programm fehlschlagen, da es versucht, die Zeichenketten (das Benutzerpasswort und das richtige Passwort) in Zahlen umzuwandeln und dabei scheitert.<\/div>"]]},"nl":{"t":"Quiz 2 — de voorwaarde in <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Corrigeer het programma en beantwoord de vraag.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Voer je wachtwoord in: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correct';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrect';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat doet dit programma met de <code>=<\/code> in de test?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Jouw antwoord:&nbsp; (: Print altijd ‘Correct’, Print altijd ‘Incorrect’, Print ‘Correct’ voor correcte wachtwoorden en ‘Incorrect’ voor onjuiste wachtwoorden, Print ‘Incorrect’ voor correcte wachtwoorden en ‘Correct’ voor onjuiste wachtwoorden :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Het programma print altijd ‘Correct’ omdat <code>$password = '*&(#&$#Y'<\/code> een toewijzing is die de nieuwe waarde van de <code>$password<\/code> variabele instelt. Aangezien de waarde noch nul noch een lege string is, wordt deze als <code>True<\/code> beschouwd. Het wachtwoord dat de gebruiker invoert, wordt in dit geval nooit gecontroleerd.<br/><br/>Als je <code>==<\/code> typt, zal het programma breken omdat het probeert de strings (het gebruikerswachtwoord en het correcte wachtwoord) naar nummers te converteren en faalt.<\/div>"]]},"es":{"t":"Quiz 2 — la condición en <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Corrige el programa y responde la pregunta.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Introduce tu contraseña: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correcto';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrecto';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con el <code>=<\/code> en la prueba, ¿qué hace este programa?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Tu respuesta:&nbsp; (: Siempre imprime ‘Correcto’, Siempre imprime ‘Incorrecto’, Imprime ‘Correcto’ para contraseñas correctas e ‘Incorrecto’ para incorrectas, Imprime ‘Incorrecto’ para contraseñas correctas y ‘Correcto’ para incorrectas :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">El programa siempre imprime ‘Correcto’ porque <code>$password = '*&(#&$#Y'<\/code> es una asignación que establece el nuevo valor de la variable <code>$password<\/code>. Como el valor no es ni cero ni una cadena vacía, se considera <code>True<\/code>. La contraseña que el usuario introduce nunca se verifica en este caso.<br/><br/>Si escribes <code>==<\/code>, entonces el programa fallará al intentar convertir las cadenas (la contraseña del usuario y la contraseña correcta) a números y fallará.<\/div>"]]},"it":{"t":"Quiz 2 — la condizione in <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Correggi il programma e rispondi alla domanda.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Inserisci la tua password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Corretto&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Errato&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con il <code>=<\/code> nel test, cosa fa questo programma?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">La tua risposta:&nbsp; (: Stampa sempre ‘Corretto’, Stampa sempre ‘Errato’, Stampa ‘Corretto’ per password corrette e ‘Errato’ per password errate, Stampa ‘Errato’ per password corrette e ‘Corretto’ per password errate :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Il programma stampa sempre ‘Corretto’ perché <code>$password = '*&(#&$#Y'<\/code> è un'assegnazione che imposta il nuovo valore della variabile <code>$password<\/code>. Poiché il valore non è né zero né una stringa vuota, è considerato <code>True<\/code>. La password inserita dall'utente non viene mai controllata in questo caso.<br/><br/>Se scrivi <code>==<\/code>, allora il programma si interromperà poiché tenta di convertire le stringhe (la password dell'utente e la password corretta) in numeri e fallisce.<\/div>"]]},"lv":{"t":"Tests 2 — nosacījums <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Izlabojiet programmu un atbildiet uz jautājumu.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Enter your password: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correct';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrect';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar <code>=<\/code> pārbaudē — ko šī programma dara?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Jūsu atbilde:&nbsp; (: Vienmēr izdrukā ‘Correct’, Vienmēr izdrukā ’Incorrect’, Izdrukā ’Correct’ pareizām parolēm un ‘Incorrect’ nepareizām, Izdrukā ’Incorrect’ pareizām parolēm un ’Correct’ nepareizām :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Programma vienmēr izdrukā ’Correct’, jo <code>$password = '*&(#&$#Y'<\/code> ir piešķīrums, kas mainīgajam <code>$password<\/code> uzstāda jaunu vērtību. Tā kā vērtība nav ne nulle, ne tukša virkne, tā tiek uzskatīta par <code>True<\/code>. Parole, ko ievada lietotājs, šajā gadījumā netiek pārbaudīta nemaz.<br/><br/>Ja ierakstīsiet <code>==<\/code>, programma salūzīs, jo mēģinās virknes (lietotāja paroli un pareizo paroli) pārvērst skaitļos un neizdosies.<\/div>"]]},"ru":{"t":"Тест 2: Условие в <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Исправьте программу и ответьте на вопросы.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Enter your password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Correct&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Incorrect&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Что программа делает со знаком <code>=<\/code> в тесте?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ваш ответ:&nbsp; (: Всегда выводит ‘Correct’, Всегда выводит ’Incorrect’, Выводит ’Correct’ для правильных паролей и ‘Incorrect’ для неправильных, Выводит ’Incorrect’ для правильных паролей ’Correct’ для неправильных :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Программа всегда выводит ’Correct’, потому что <code>$password = '*&(#&$#Y'<\/code> — это присвоение, устанавливающее новое значение в переменную <code>$password<\/code>. Так как значение не является нулем или пустой строкой, оно считается как <code>True<\/code>. Пароль, введенный пользователем, в этом случае никогда не проверяется.<br/><br/>Если вы напишите <code>==<\/code>, то программа не будет работать, так как она попытается привести строки (пароль пользователя и правильный пароль) к числам и потерпит неудачу.<\/div>"]]},"uk":{"t":"Тест 2 — умова в <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Виправте програму й дайте відповідь на запитання.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Enter your password: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correct';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrect';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що робить ця програма, якщо в перевірці стоїть <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ваша відповідь:&nbsp; (: Завжди виводить ‘Correct’, Завжди виводить ’Incorrect’, Виводить ’Correct’ для правильних паролів і ‘Incorrect’ для неправильних, Виводить ’Incorrect’ для правильних паролів і ’Correct’ для неправильних :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Програма завжди виводить ’Correct’, бо <code>$password = '*&(#&$#Y'<\/code> — це присвоєння, яке встановлює нове значення змінної <code>$password<\/code>. Оскільки це значення не є ані нулем, ані порожнім рядком, воно вважається <code>True<\/code>. Пароль, який вводить користувач, у цьому разі не перевіряється взагалі.<br/><br/>Якщо ж набрати <code>==<\/code>, програма зламається, бо намагатиметься перетворити рядки (пароль користувача та правильний пароль) на числа й зазнає невдачі.<\/div>"]]},"bg":{"t":"Тест 2 — условието в <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Коригирайте програмата и отговорете на въпроса.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Въведете вашата парола: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Вярно';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Невярно';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>=<\/code> в теста, какво прави тази програма?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Вашият отговор:&nbsp; (: Винаги отпечатва ‘Вярно’, Винаги отпечатва ‘Невярно’, Отпечатва ‘Вярно’ за правилни пароли и ‘Невярно’ за неправилни, Отпечатва ‘Невярно’ за правилни пароли и ‘Вярно’ за неправилни :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Програмата винаги отпечатва ‘Вярно’, защото <code>$password = '*&(#&$#Y'<\/code> е присвояване, което задава новата стойност на променливата <code>$password<\/code>. Тъй като стойността не е нула или празен низ, тя се счита за <code>True<\/code>. Паролата, която потребителят въвежда, никога не се проверява в този случай.<br/><br/>Ако въведете <code>==<\/code>, тогава програмата ще се провали, тъй като ще се опита да конвертира низовете (потребителската парола и правилната парола) в числа и ще се провали.<\/div>"]]},"eo":{"t":"Kvizo 2 — la kondiĉo en <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Korektu la programon kaj respondu la demandon.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Enigu vian pasvorton: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Ĝusta';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Malĝusta';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun la <code>=<\/code> en la testo, kion faras ĉi tiu programo?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Via respondo:&nbsp; (: Ĉiam presas 'Ĝusta', Ĉiam presas 'Malĝusta', Presas 'Ĝusta' por ĝustaj pasvortoj kaj 'Malĝusta' por malĝustaj, Presas 'Malĝusta' por ĝustaj pasvortoj kaj 'Ĝusta' por malĝustaj :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">La programo ĉiam presas 'Ĝusta' ĉar <code>$password = '*&(#&$#Y'<\/code> estas asigno kiu agordas la novan valoron de la variablo <code>$password<\/code>. Ĉar la valoro ne estas nulo nek malplena ŝnuro, ĝi estas konsiderata <code>Vera<\/code>. La pasvorto, kiun la uzanto enigas, neniam estas kontrolita en ĉi tiu kazo.<br/><br/>Se vi tajpas <code>==<\/code>, tiam la programo rompiĝos ĉar ĝi provas konverti la ŝnurojn (la uzanta pasvorto kaj la ĝusta pasvorto) al nombroj kaj malsukcesas.<\/div>"]]},"la":{"t":"Quiz 2 — condicio in <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Correct the program and answer the question.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Enter your password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Correct&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Incorrect&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With the <code>=<\/code> in the test, what does this program do?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Your answer:&nbsp; (: Always prints ‘Correct’, Always prints ’Incorrect’, Prints ’Correct’ for correct passwords and ‘Incorrect’ for incorrect ones, Prints ’Incorrect’ for correct passwords and ’Correct’ for incorrect ones :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">The program always prints ’Correct’ because <code>$password = '*&(#&$#Y'<\/code> is an assignment that sets the new value of the <code>$password<\/code> variable. As the value is neither zero nor an empty string, it is considered <code>True<\/code>. The password that the user enters is never checked in this case.<br/><br/>If you type <code>==<\/code>, then the program will break as it tries to convert the strings (the user password and the correct password) to numbers and fails.<\/div>"]]}}}</script>
