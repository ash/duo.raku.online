<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/ternary-operator","n":137,"k":"topic","pv":"essentials/conditional-checks/comparing-strings/quiz2","nx":"essentials/conditional-checks/ternary-operator/quiz","tr":["essentials","essentials/conditional-checks"],"L":{"en":{"t":"Ternary operator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The ternary operator in Raku is a two-part construction <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A Boolean test is followed by two expressions, one of which is executed depending on the result of the test.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With the current value of the <code>$shines<\/code> variable, this program prints <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">If you change it to <code>Moon<\/code>, the result will be <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is possible to chain ternary expressions.<\/span> <span class=\"sg\" data-s=\"1\">Just make sure it doesn’t get too complicated.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, depending on the value in <code>$hours<\/code>, a different part of day will be reported.<\/span><\/p>"]]},"de":{"t":"Ternärer Operator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Der ternäre Operator in Raku ist eine zweiteilige Konstruktion <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Boolescher Test wird von zwei Ausdrücken gefolgt, von denen einer je nach Ergebnis des Tests ausgeführt wird.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit dem aktuellen Wert der Variablen <code>$shines<\/code> gibt dieses Programm <code>day<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie es in <code>Moon<\/code> ändern, wird das Ergebnis <code>night<\/code> sein.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist möglich, ternäre Ausdrücke zu verketten.<\/span> <span class=\"sg\" data-s=\"1\">Stellen Sie nur sicher, dass es nicht zu kompliziert wird.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier wird je nach Wert in <code>$hours<\/code> eine andere Tageszeit gemeldet.<\/span><\/p>"]]},"nl":{"t":"Ternaire operator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De ternary operator in Raku is een tweedelige constructie <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Een Booleaanse test wordt gevolgd door twee expressies, waarvan er één wordt uitgevoerd afhankelijk van het resultaat van de test.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met de huidige waarde van de variabele <code>$shines<\/code>, print dit programma <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Als je het verandert in <code>Moon<\/code>, zal het resultaat <code>night<\/code> zijn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is mogelijk om ternary expressies te ketenen.<\/span> <span class=\"sg\" data-s=\"1\">Zorg er alleen voor dat het niet te ingewikkeld wordt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier, afhankelijk van de waarde in <code>$hours<\/code>, zal een ander deel van de dag worden gerapporteerd.<\/span><\/p>"]]},"es":{"t":"Operador ternario","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El operador ternario en Raku es una construcción de dos partes <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Una prueba booleana es seguida por dos expresiones, una de las cuales se ejecuta dependiendo del resultado de la prueba.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con el valor actual de la variable <code>$shines<\/code>, este programa imprime <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si lo cambias a <code>Moon<\/code>, el resultado será <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es posible encadenar expresiones ternarias.<\/span> <span class=\"sg\" data-s=\"1\">Solo asegúrate de que no se vuelva demasiado complicado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí, dependiendo del valor en <code>$hours<\/code>, se informará una parte diferente del día.<\/span><\/p>"]]},"it":{"t":"Operatore ternario","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'operatore ternario in Raku è una costruzione a due parti <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un test booleano è seguito da due espressioni, una delle quali viene eseguita a seconda del risultato del test.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con il valore attuale della variabile <code>$shines<\/code>, questo programma stampa <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se lo cambi in <code>Moon<\/code>, il risultato sarà <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">È possibile concatenare espressioni ternarie.<\/span> <span class=\"sg\" data-s=\"1\">Assicurati solo che non diventi troppo complicato.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui, a seconda del valore in <code>$hours<\/code>, verrà riportata una diversa parte della giornata.<\/span><\/p>"]]},"lv":{"t":"Trīsvērtīgais operators","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ternārais operators Raku valodā ir divdaļīga konstrukcija <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Boolea tests tiek izpildīts, kam seko divi izteicieni, no kuriem viens tiek izpildīts atkarībā no testa rezultāta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar pašreizējo <code>$shines<\/code> mainīgā vērtību šī programma izdrukā <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja to mainīsiet uz <code>Moon<\/code>, rezultāts būs <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir iespējams ķēdēt ternāros izteicienus.<\/span> <span class=\"sg\" data-s=\"1\">Tikai pārliecinieties, ka tas nekļūst pārāk sarežģīti.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit, atkarībā no <code>$hours<\/code> vērtības, tiks ziņots par dažādu dienas daļu.<\/span><\/p>"]]},"ru":{"t":"Тернарный оператор","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тернарный оператор в Raku состоит из конструкции с двумя частями: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За логической проверкой следуют два выражения, одно из которых выполняется в зависимости от результат проверки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С текущим значением переменной <code>$shines<\/code> программа выведет <code>days<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если вы поменяете значение на <code>Moon<\/code>, то результатом будет <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Также возможно составлять цепочки тернарных операторов.<\/span> <span class=\"sg\" data-s=\"1\">Но стоит обращать внимание, чтобы не сделать все это слишком сложным.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь в зависимости от значения <code>$hours<\/code> будет напечатана соответствующая часть дня.<\/span><\/p>"]]},"uk":{"t":"Тернарний оператор","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тернарний оператор у Raku є двочастинною конструкцією <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Логічний тест супроводжується двома виразами, один з яких виконується залежно від результату тесту.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З поточним значенням змінної <code>$shines<\/code>, ця програма виведе <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо змінити його на <code>Moon<\/code>, результат буде <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можливо ланцюжити тернарні вирази.<\/span> <span class=\"sg\" data-s=\"1\">Просто переконайтеся, що це не стає надто складним.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут, залежно від значення в <code>$hours<\/code>, буде повідомлено різну частину дня.<\/span><\/p>"]]},"bg":{"t":"Теренарен оператор","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тернарният оператор в Raku е двукомпонентна конструкция <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Булев тест е последван от две изрази, един от които се изпълнява в зависимост от резултата на теста.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С текущата стойност на променливата <code>$shines<\/code>, тази програма отпечатва <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако я промените на <code>Moon<\/code>, резултатът ще бъде <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Възможно е да се свързват тернарни изрази.<\/span> <span class=\"sg\" data-s=\"1\">Просто се уверете, че не става твърде сложно.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук, в зависимост от стойността в <code>$hours<\/code>, ще бъде отчетена различна част от деня.<\/span><\/p>"]]},"eo":{"t":"Ternara operatoro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La ternara operatoro en Raku estas du-partia konstruo <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Boolea testo estas sekvata de du esprimoj, el kiuj unu estas ekzekutata depende de la rezulto de la testo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun la nuna valoro de la variablo <code>$shines<\/code>, ĉi tiu programo presas <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se vi ŝanĝas ĝin al <code>Moon<\/code>, la rezulto estos <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eblas ĉeni ternarajn esprimojn.<\/span> <span class=\"sg\" data-s=\"1\">Nur certigu, ke ĝi ne fariĝu tro komplika.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, depende de la valoro en <code>$hours<\/code>, malsama parto de la tago estos raportata.<\/span><\/p>"]]},"la":{"t":"Ternarius operator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operator ternarius in Raku est constructio bipartita <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Test Booleanus sequitur duabus expressionibus, quarum una exsequitur secundum eventum testis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sol';\nmy $tempus-diei = $shines aequum est 'Sol' ?? 'dies' !! 'nox';\ndic $tempus-diei;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum valore currenti variabilis <code>$shines<\/code>, hic programma imprimit <code>dies<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si mutas ad <code>Luna<\/code>, eventus erit <code>nox<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Possibile est concatenare expressiones ternarias.<\/span> <span class=\"sg\" data-s=\"1\">Tantum cura ut non nimis complicatum fiat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $horae = 20;\nmy $tempus-diei =\n    $horae &lt;= 6 ?? 'Nox' !!\n    $horae &lt;= 12 ?? 'Mane' !! \n    $horae &lt;= 18 ?? 'Postmeridianum' !! 'Vespera';\ndic $tempus-diei;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic, secundum valorem in <code>$horae<\/code>, alia pars diei referetur.<\/span><\/p>"]]}}}</script>
