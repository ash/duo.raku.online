et niet nodig om een apart codeblok te maken.<\/span> <span class=\"sg\" data-s=\"2\">Plaats gewoon <code>if<\/code> of <code>unless<\/code> direct na de instructie.<\/span> <span class=\"sg\" data-s=\"3\">In Raku worden dergelijke constructies <em>statement modifiers<\/em> genoemd.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Good afternoon' if $hours &gt; 12;\n\nsay 'All systems work' unless $broken;<\/code><\/pre>"]]},"es":{"t":"<code>if<\/code> y <code>unless<\/code> como modificadores de sentencia","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ofrece una solución muy práctica cuando quieres ejecutar una declaración simple condicionalmente.<\/span> <span class=\"sg\" data-s=\"1\">En este caso, no es necesario crear un bloque de código separado.<\/span> <span class=\"sg\" data-s=\"2\">Simplemente coloca <code>if<\/code> o <code>unless<\/code> inmediatamente después de la declaración.<\/span> <span class=\"sg\" data-s=\"3\">En Raku, tales construcciones se llaman <em>modificadores de declaración<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Buenas tardes' if $hours &gt; 12;\n\nsay 'Todos los sistemas funcionan' unless $broken;<\/code><\/pre>"]]},"it":{"t":"<code>if<\/code> e <code>unless<\/code> come modificatori di istruzioni","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku offre una soluzione molto pratica quando si desidera eseguire una semplice istruzione condizionalmente.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, non è necessario creare un blocco di codice separato.<\/span> <span class=\"sg\" data-s=\"2\">Basta mettere <code>if<\/code> o <code>unless<\/code> immediatamente dopo l'istruzione.<\/span> <span class=\"sg\" data-s=\"3\">In Raku, tali costrutti sono chiamati <em>modificatori di istruzione<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Buon pomeriggio' if $hours &gt; 12;\n\nsay 'Tutti i sistemi funzionano' unless $broken;<\/code><\/pre>"]]},"lv":{"t":"<code>if<\/c say 'Добрий день' if $hours &gt; 12;\n\nsay 'Усі системи працюють' unless $broken;<\/code><\/pre>"]]},"bg":{"t":"<code>if<\/code> и <code>unless<\/code> като модификатори на изречения","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku предлага много удобно решение, когато искате да изпълните просто изречение условно.<\/span> <span class=\"sg\" data-s=\"1\">В този случай няма нужда да създавате отделен блок от код.<\/span> <span class=\"sg\" data-s=\"2\">Просто поставете <code>if<\/code> или <code>unless<\/code> веднага след изречението.<\/span> <span class=\"sg\" data-s=\"3\">В Raku такива конструкции се наричат <em>модификатори на изречения<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Добър следобед' if $hours &gt; 12;\n\nsay 'Всички системи работят' unless $broken;<\/code><\/pre>"]]},"eo":{"t":"<code>if<\/code> kaj <code>unless<\/code> kiel modifiloj de deklaroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ofertas tre oportunan solvon kiam vi volas kondiĉe ekzekuti simplan deklaron.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, ne necesas krei apartan blokon de kodo.<\/span> <span class=\"sg\" data-s=\"2\">Simple metu <code>if<\/code> aŭ <code>unless<\/code> tuj post la deklaro.<\/span> <span class=\"sg\" data-s=\"3\">En Raku, tiaj konstruaĵoj nomiĝas <em>deklaraj modifiloj<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Bonan posttagmezon' if $hours &gt; 12;\n\nsay 'Ĉiuj sistemoj funkcias' unless $broken;<\/code><\/pre>"]]},"la":{"t":"<code>if<\/code> et <code>unless<\/code> ut statement modificatores","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku praebet solutionem valde utilem cum vis simplicem sententiam conditionaliter exsequi.<\/span> <span class=\"sg\" data-s=\"1\">In hoc casu, non opus est separatum codicem creare.<\/span> <span class=\"sg\" data-s=\"2\">Modo pone <code>si<\/code> vel <code>nisi<\/code> statim post sententiam.<\/span> <span class=\"sg\" data-s=\"3\">In Raku, tales structurae vocantur <em>modificatores sententiae<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic 'Bonum postmeridianum' si $horae &gt; 12;\n\ndic 'Omnia systemata operantur' nisi $fractum;<\/code><\/pre>"]]}}}</script>
