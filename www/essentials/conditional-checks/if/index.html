<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/if","n":125,"k":"topic","pv":"essentials/conditional-checks","nx":"essentials/conditional-checks/if/quiz","tr":["essentials","essentials/conditional-checks"],"L":{"en":{"t":"Conditional checks with if","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>if<\/code> conditional check tests a condition and if it is <code>True<\/code>, runs a block of code.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Mathematics works!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice that you don’t need to put the condition in parentheses (but you can if you wish).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of course, variables are more than welcome in the tests:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . do something\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In the case when more than one check uses the same variable, it is possible to use chained comparisons:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Correct answer $x is given.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the condition is not satisfied, the associated block of code is not executed, and the program flow continues.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Begin';\nif False {\n    say 'This is never printed.';\n}\nsay 'End';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program just prints <code>Begin<\/code> and <code>End<\/code>.<\/span><\/p>"]]},"de":{"t":"<code>if<\/code>-Blöcke","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <code>if<\/code>-Bedingungsprüfung testet eine Bedingung und führt, wenn sie <code>True<\/code> ist, einen Codeblock aus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Mathematik funktioniert!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Sie die Bedingung nicht in Klammern setzen müssen (aber Sie können es, wenn Sie möchten).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natürlich sind Variablen in den Tests mehr als willkommen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . etwas tun\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Falls mehr als eine Überprüfung dieselbe Variable verwendet, ist es möglich, verkettete Vergleiche zu verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Die richtige Antwort $x wurde gegeben.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn die Bedingung nicht erfüllt ist, wird der zugehörige Codeblock nicht ausgeführt und der Programmfluss geht weiter.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Begin';\nif False {\n    say 'Dies wird nie gedruckt.';\n}\nsay 'Ende';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm druckt nur <code>Begin<\/code> und <code>Ende<\/code>.<\/span><\/p>"]]},"nl":{"t":"<code>if<\/code> blokken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>if<\/code> voorwaardelijke controle test een conditie en als deze <code>True<\/code> is, voert het een blok code uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Wiskunde werkt!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat je de conditie niet tussen haakjes hoeft te plaatsen (maar het kan als je dat wilt).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natuurlijk zijn variabelen meer dan welkom in de tests:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . doe iets\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In het geval dat meer dan één controle dezelfde variabele gebruikt, is het mogelijk om gekoppelde vergelijkingen te gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Correct antwoord $x is gegeven.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als de conditie niet wordt voldaan, wordt het bijbehorende codeblok niet uitgevoerd en gaat de programmastructuur verder.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Begin';\nif False {\n    say 'Dit wordt nooit afgedrukt.';\n}\nsay 'Einde';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma print alleen <code>Begin<\/code> en <code>Einde<\/code>.<\/span><\/p>"]]},"es":{"t":"Bloques <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La verificación condicional <code>if<\/code> prueba una condición y si es <code>True<\/code>, ejecuta un bloque de código.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say '¡Las matemáticas funcionan!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa que no necesitas poner la condición entre paréntesis (pero puedes hacerlo si lo deseas).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por supuesto, las variables son más que bienvenidas en las pruebas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . hacer algo\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En el caso de que más de una verificación use la misma variable, es posible usar comparaciones encadenadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Se ha dado la respuesta correcta $x.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si la condición no se cumple, el bloque de código asociado no se ejecuta y el flujo del programa continúa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Inicio';\nif False {\n    say 'Esto nunca se imprime.';\n}\nsay 'Fin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa solo imprime <code>Inicio<\/code> y <code>Fin<\/code>.<\/span><\/p>"]]},"it":{"t":"Blocchi <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Il controllo condizionale <code>if<\/code> verifica una condizione e, se è <code>True<\/code>, esegue un blocco di codice.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'La matematica funziona!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che non è necessario mettere la condizione tra parentesi (ma puoi farlo se lo desideri).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, le variabili sono benvenute nei test:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . fai qualcosa\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nel caso in cui più di un controllo utilizzi la stessa variabile, è possibile utilizzare confronti concatenati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"La risposta corretta $x è data.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la condizione non è soddisfatta, il blocco di codice associato non viene eseguito e il flusso del programma continua.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Inizio';\nif False {\n    say 'Questo non viene mai stampato.';\n}\nsay 'Fine';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa solo <code>Inizio<\/code> e <code>Fine<\/code>.<\/span><\/p>"]]},"lv":{"t":"<code>if<\/code> bloki","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>if<\/code> nosacījuma pārbaude pārbauda nosacījumu un, ja tas ir <code>True<\/code>, izpilda koda bloku.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Matemātika darbojas!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka jums nav nepieciešams ievietot nosacījumu iekavās (bet varat, ja vēlaties).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, mainīgie ir vairāk nekā laipni gaidīti pārbaudēs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . dari kaut ko\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gadījumā, ja vairāk nekā viena pārbaude izmanto to pašu mainīgo, ir iespējams izmantot ķēdveida salīdzinājumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Pareizā atbilde $x ir dota.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja nosacījums nav izpildīts, saistītais koda bloks netiek izpildīts, un programmas plūsma turpinās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Sākums';\nif False {\n    say 'Šis nekad netiek izdrukāts.';\n}\nsay 'Beigas';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma vienkārši izdrukā <code>Sākums<\/code> un <code>Beigas<\/code>.<\/span><\/p>"]]},"ru":{"t":"<code>if<\/code> блоки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Инструкция <code>if<\/code> проверяет условие, и если оно равно <code>True<\/code>, то запускает блок кода.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Mathematics works!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отметим, что вам не нужно заключать условие в скобки (но при желании вы можете это сделать).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разумеется, переменные тоже приветствуются в условиях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . do something\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В случае, когда больше чем одна проверка использует одну и ту же переменную, возможно использование сравнений цепочкой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Correct answer $x is given.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если условие не было выполнено, соответствующий блок кода не выполняется, и программа продолжает свое исполнение.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Begin';\nif False {\n    say 'This is never printed.';\n}\nsay 'End';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа выводит только <code>Begin<\/code> и <code>End<\/code>.<\/span><\/p>"]]},"uk":{"t":"Блоки <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Умовна перевірка <code>if<\/code> тестує умову, і якщо вона <code>True<\/code>, виконує блок коду.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Математика працює!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що вам не потрібно брати умову в дужки (але ви можете, якщо хочете).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звісно, змінні також можна використовувати в тестах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . зробити щось\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У випадку, коли більше ніж одна перевірка використовує ту саму змінну, можливо використовувати ланцюгові порівняння:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Правильна відповідь $x дана.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо умова не задовольняється, відповідний блок коду не виконується, і програма продовжує виконання.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Початок';\nif False {\n    say 'Це ніколи не буде надруковано.';\n}\nsay 'Кінець';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма просто друкує <code>Початок<\/code> і <code>Кінець<\/code>.<\/span><\/p>"]]},"bg":{"t":"Блокове <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Условната проверка <code>if<\/code> тества условие и ако то е <code>True<\/code>, изпълнява блок от код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Математиката работи!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че не е необходимо да поставяте условието в скоби (но можете, ако желаете).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, променливите са повече от добре дошли в тестовете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . направете нещо\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В случай, че повече от една проверка използва една и съща променлива, е възможно да се използват свързани сравнения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Даден е правилният отговор $x.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако условието не е изпълнено, свързаният блок от код не се изпълнява и програмният поток продължава.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Начало';\nif False {\n    say 'Това никога не се отпечатва.';\n}\nsay 'Край';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма просто отпечатва <code>Начало<\/code> и <code>Край<\/code>.<\/span><\/p>"]]},"eo":{"t":"<code>if<\/code> blokoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La <code>if<\/code> kondiĉa kontrolo testas kondiĉon kaj se ĝi estas <code>True<\/code>, rulas blokon de kodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if 10 &gt; 4 {\n    say 'Matematiko funkcias!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke vi ne bezonas meti la kondiĉon en parentezojn (sed vi povas se vi volas).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, variabloj estas pli ol bonvenaj en la testoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $flag = False;\nif $flag {\n    # . . . fari ion\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la kazo kiam pli ol unu kontrolo uzas la saman variablon, eblas uzi ĉenitajn komparojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nif 40 &lt; $x &lt; 45 {\n    say \"Ĝusta respondo $x estas donita.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la kondiĉo ne estas plenumita, la asociita bloko de kodo ne estas ekzekutita, kaj la programfluo daŭras.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Komenco';\nif False {\n    say 'Ĉi tio neniam estas presita.';\n}\nsay 'Fino';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo nur presas <code>Komenco<\/code> kaj <code>Fino<\/code>.<\/span><\/p>"]]},"la":{"t":"<code>if<\/code> sectiones","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Si<\/code> conditionalis condicio probat et si <code>Verum<\/code> est, codicem exsequi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>si 10 &gt; 4 {\n    dic 'Mathematica operatur!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod non opus est conditionem in parenthesibus ponere (sed potes si vis).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scilicet, variabiles in probationibus gratissime accipiuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meum $vexillum = Falsum;\nsi $vexillum {\n    # . . . aliquid fac\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In casu ubi plus quam una probatio eadem variabile utitur, fieri potest ut comparationes concatenatae utantur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meum $x = 42;\nsi 40 &lt; $x &lt; 45 {\n    dic \"Responsum rectum $x datum est.\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si condicio non impletur, codicis pars associata non exsequitur, et cursus programmatis continuatur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>dic 'Incipe';\nsi Falsum {\n    dic 'Hoc numquam imprimetur.';\n}\ndic 'Finis';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma solum <code>Incipe<\/code> et <code>Finis<\/code> imprimit.;<\/span><\/p>"]]}}}</script>
