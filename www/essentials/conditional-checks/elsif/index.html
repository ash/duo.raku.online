<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/elsif","n":128,"k":"topic","pv":"essentials/conditional-checks/else","nx":"essentials/conditional-checks/elsif/quiz","tr":["essentials","essentials/conditional-checks"],"L":{"en":{"t":"Using elsif","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">So far, we’ve learned <code>if<\/code> and <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">What if you want to organise a chain of tests?<\/span> <span class=\"sg\" data-s=\"2\">There are at least two ways to do that in Raku (actually, there are even more).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One of the possibilities is to use the chain of <code>if<\/code>, <code>elsif<\/code>, and <code>else<\/code> blocks.<\/span> <span class=\"sg\" data-s=\"1\">Note the spelling of <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It is neither <code>elseif<\/code> nor <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In this program, there are three branches and three tests one after another.<\/span> <span class=\"sg\" data-s=\"1\">As soon as one of the conditions turns out to be <code>True<\/code>, the corresponding code block is run.<\/span> <span class=\"sg\" data-s=\"2\">If neither check is <code>True<\/code>, the <code>else<\/code> block is run.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are a few test runs of the program that triggers all of the blocks:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An alternative way is to use the <a href=\"/advanced/given-when/\"><code>given<\/code> and <code>when<\/code><\/a> pair, which we will learn in the future.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bisher haben wir <code>if<\/code> und <code>else<\/code> gelernt.<\/span> <span class=\"sg\" data-s=\"1\">Was ist, wenn Sie eine Kette von Tests organisieren möchten?<\/span> <span class=\"sg\" data-s=\"2\">Es gibt mindestens zwei Möglichkeiten, dies in Raku zu tun (tatsächlich gibt es sogar noch mehr).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine der Möglichkeiten ist die Verwendung einer Kette von <code>if<\/code>, <code>elsif<\/code> und <code>else<\/code> Blöcken.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie die Schreibweise von <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es ist weder <code>elseif<\/code> noch <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Geben Sie die Zahl ein: ';\nif $x &gt; 100 {\n    say \"$x ist größer als 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x ist größer als 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x ist größer als 25.\";\n}\nelse {\n    say \"$x ist 25 oder kleiner.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In diesem Programm gibt es drei Zweige und drei Tests nacheinander.<\/span> <span class=\"sg\" data-s=\"1\">Sobald eine der Bedingungen als <code>True<\/code> herausstellt, wird der entsprechende Codeblock ausgeführt.<\/span> <span class=\"sg\" data-s=\"2\">Wenn keine der Prüfungen <code>True<\/code> ist, wird der <code>else<\/code> Block ausgeführt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind einige Testläufe des Programms, die alle Blöcke auslösen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nGeben Sie die Zahl ein: 120\n120 ist größer als 100.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 75      \n75 ist größer als 50.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 30\n30 ist größer als 25.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 10\n10 ist 25 oder kleiner.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine alternative Möglichkeit ist die Verwendung des <code>given<\/code> und <code>when<\/code> Paares, das wir in Zukunft lernen werden.<\/span><\/p>"]]},"nl":{"t":"Gebruik van <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe hebben we <code>if<\/code> en <code>else<\/code> geleerd.<\/span> <span class=\"sg\" data-s=\"1\">Wat als je een keten van tests wilt organiseren?<\/span> <span class=\"sg\" data-s=\"2\">Er zijn minstens twee manieren om dat in Raku te doen (eigenlijk zijn er nog meer).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een van de mogelijkheden is om de keten van <code>if<\/code>, <code>elsif<\/code> en <code>else<\/code> blokken te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Let op de spelling van <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het is noch <code>elseif<\/code> noch <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Voer het nummer in: ';\nif $x &gt; 100 {\n    say \"$x is groter dan 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is groter dan 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is groter dan 25.\";\n}\nelse {\n    say \"$x is 25 of kleiner.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In dit programma zijn er drie takken en drie tests na elkaar.<\/span> <span class=\"sg\" data-s=\"1\">Zodra een van de voorwaarden <code>True<\/code> blijkt te zijn, wordt het bijbehorende codeblok uitgevoerd.<\/span> <span class=\"sg\" data-s=\"2\">Als geen van de controles <code>True<\/code> is, wordt het <code>else<\/code> blok uitgevoerd.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar testuitvoeringen van het programma die alle blokken activeren:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer het nummer in: 120\n120 is groter dan 100.\n\n$ raku t.raku\nVoer het nummer in: 75      \n75 is groter dan 50.\n\n$ raku t.raku\nVoer het nummer in: 30\n30 is groter dan 25.\n\n$ raku t.raku\nVoer het nummer in: 10\n10 is 25 of kleiner.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een alternatieve manier is om het <code>given<\/code> en <code>when<\/code> paar te gebruiken, wat we in de toekomst zullen leren.<\/span><\/p>"]]},"es":{"t":"Uso de <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, hemos aprendido <code>if<\/code> y <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">¿Qué pasa si quieres organizar una cadena de pruebas?<\/span> <span class=\"sg\" data-s=\"2\">Hay al menos dos formas de hacerlo en Raku (de hecho, hay incluso más).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una de las posibilidades es usar la cadena de bloques <code>if<\/code>, <code>elsif<\/code> y <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota la ortografía de <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No es ni <code>elseif<\/code> ni <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Introduce el número: ';\nif $x &gt; 100 {\n    say \"$x es mayor que 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x es mayor que 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x es mayor que 25.\";\n}\nelse {\n    say \"$x es 25 o menor.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En este programa, hay tres ramas y tres pruebas una tras otra.<\/span> <span class=\"sg\" data-s=\"1\">Tan pronto como una de las condiciones resulta ser <code>True<\/code>, se ejecuta el bloque de código correspondiente.<\/span> <span class=\"sg\" data-s=\"2\">Si ninguna verificación es <code>True<\/code>, se ejecuta el bloque <code>else<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay algunas ejecuciones de prueba del programa que activan todos los bloques:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntroduce el número: 120\n120 es mayor que 100.\n\n$ raku t.raku\nIntroduce el número: 75      \n75 es mayor que 50.\n\n$ raku t.raku\nIntroduce el número: 30\n30 es mayor que 25.\n\n$ raku t.raku\nIntroduce el número: 10\n10 es 25 o menor.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una forma alternativa es usar el par <code>given<\/code> y <code>when<\/code>, que aprenderemos en el futuro.<\/span><\/p>"]]},"it":{"t":"Uso di <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Finora, abbiamo imparato <code>if<\/code> e <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">E se volessi organizzare una catena di test?<\/span> <span class=\"sg\" data-s=\"2\">Ci sono almeno due modi per farlo in Raku (in realtà, ce ne sono anche di più).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una delle possibilità è usare la catena di blocchi <code>if<\/code>, <code>elsif<\/code> e <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota l'ortografia di <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Non è né <code>elseif<\/code> né <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Inserisci il numero: ';\nif $x &gt; 100 {\n    say \"$x è maggiore di 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x è maggiore di 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x è maggiore di 25.\";\n}\nelse {\n    say \"$x è 25 o minore.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In questo programma, ci sono tre rami e tre test uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"1\">Non appena una delle condizioni risulta essere <code>True<\/code>, viene eseguito il blocco di codice corrispondente.<\/span> <span class=\"sg\" data-s=\"2\">Se nessun controllo è <code>True<\/code>, viene eseguito il blocco <code>else<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni test del programma che attivano tutti i blocchi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nInserisci il numero: 120\n120 è maggiore di 100.\n\n$ raku t.raku\nInserisci il numero: 75      \n75 è maggiore di 50.\n\n$ raku t.raku\nInserisci il numero: 30\n30 è maggiore di 25.\n\n$ raku t.raku\nInserisci il numero: 10\n10 è 25 o minore.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un modo alternativo è usare la coppia <code>given<\/code> e <code>when<\/code>, che impareremo in futuro.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Līdz šim mēs esam apguvuši <code>if<\/code> un <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ko darīt, ja vēlaties organizēt testu ķēdi?<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā ir vismaz divi veidi, kā to izdarīt (patiesībā ir vēl vairāk).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Viena no iespējām ir izmantot <code>if<\/code>, <code>elsif<\/code> un <code>else<\/code> bloku ķēdi.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā <code>elsif<\/code> pareizrakstību.<\/span> <span class=\"sg\" data-s=\"2\">Tas nav ne <code>elseif<\/code>, ne <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā programmā ir trīs zari un trīs testi viens pēc otra.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz kāds no nosacījumiem izrādās <code>True<\/code>, tiek izpildīts atbilstošais koda bloks.<\/span> <span class=\"sg\" data-s=\"2\">Ja neviens pārbaudījums nav <code>True<\/code>, tiek izpildīts <code>else<\/code> bloks.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir daži programmas testa izpildes piemēri, kas aktivizē visus blokus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alternatīvs veids ir izmantot <code>given<\/code> un <code>when<\/code> pāri, ko mēs apgūsim nākotnē.<\/span><\/p>"]]},"ru":{"t":"Использование <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пока мы познакомились с <code>if<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Что если вы хотите организовать цепочку проверок?<\/span> <span class=\"sg\" data-s=\"2\">Есть как минимум два способа сделать это в Raku (на самом деле их гораздо больше).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Один из вариантов — это использовать цепочку из <code>if<\/code>, <code>elsif<\/code> и <code>else<\/code> блоков.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание на написание <code>elsif<\/code> — это не <code>elseif<\/code> и не <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этой программе есть три ветки и три проверки, следующие одна за другой.<\/span> <span class=\"sg\" data-s=\"1\">Как только одно из условий вернет <code>True<\/code>, соответствующий блок кода будет запущен.<\/span> <span class=\"sg\" data-s=\"2\">Если ни одна проверка не вернет <code>True<\/code>, то будет запущен блок <code>else<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот несколько запусков программы, которые проходятся по всем блокам:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75\n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другой способ — это использовать пару <code>given<\/code> и <code>when<\/code>, с которыми мы еще познакомимся.<\/span><\/p>"]]},"uk":{"t":"Використання <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досі ми вивчили <code>if<\/code> та <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Що робити, якщо ви хочете організувати ланцюг тестів?<\/span> <span class=\"sg\" data-s=\"2\">Є принаймні два способи зробити це в Raku (насправді, є навіть більше).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Однією з можливостей є використання ланцюга блоків <code>if<\/code>, <code>elsif<\/code> та <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу на написання <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це не <code>elseif<\/code> і не <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Введіть число: ';\nif $x &gt; 100 {\n    say \"$x більше за 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x більше за 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x більше за 25.\";\n}\nelse {\n    say \"$x дорівнює 25 або менше.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цій програмі є три гілки та три тести один за одним.<\/span> <span class=\"sg\" data-s=\"1\">Як тільки одна з умов виявляється <code>True<\/code>, відповідний блок коду виконується.<\/span> <span class=\"sg\" data-s=\"2\">Якщо жодна з перевірок не є <code>True<\/code>, виконується блок <code>else<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось кілька тестових запусків програми, які запускають усі блоки:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведіть число: 120\n120 більше за 100.\n\n$ raku t.raku\nВведіть число: 75      \n75 більше за 50.\n\n$ raku t.raku\nВведіть число: 30\n30 більше за 25.\n\n$ raku t.raku\nВведіть число: 10\n10 дорівнює 25 або менше.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Альтернативний спосіб — використання пари <code>given<\/code> та <code>when<\/code>, про які ми дізнаємось у майбутньому.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досега научихме <code>if<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ами ако искате да организирате верига от тестове?<\/span> <span class=\"sg\" data-s=\"2\">Има поне два начина да направите това в Raku (всъщност има дори повече).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една от възможностите е да използвате верига от блокове <code>if<\/code>, <code>elsif<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание на правописа на <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това не е нито <code>elseif<\/code>, нито <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В тази програма има три клона и три теста един след друг.<\/span> <span class=\"sg\" data-s=\"1\">Веднага щом едно от условията се окаже <code>True<\/code>, съответният блок код се изпълнява.<\/span> <span class=\"sg\" data-s=\"2\">Ако нито една проверка не е <code>True<\/code>, се изпълнява блокът <code>else<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето няколко тестови изпълнения на програмата, които задействат всички блокове:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Алтернативен начин е да използвате двойката <code>given<\/code> и <code>when<\/code>, която ще научим в бъдеще.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">So far, we’ve learned <code>if<\/code> and <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">What if you want to organise a chain of tests?<\/span> <span class=\"sg\" data-s=\"2\">There are at least two ways to do that in Raku (actually, there are even more).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One of the possibilities is to use the chain of <code>if<\/code>, <code>elsif<\/code>, and <code>else<\/code> blocks.<\/span> <span class=\"sg\" data-s=\"1\">Note the spelling of <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It is neither <code>elseif<\/code> nor <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In this program, there are three branches and three tests one after another.<\/span> <span class=\"sg\" data-s=\"1\">As soon as one of the conditions turns out to be <code>True<\/code>, the corresponding code block is run.<\/span> <span class=\"sg\" data-s=\"2\">If neither check is <code>True<\/code>, the <code>else<\/code> block is run.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are a few test runs of the program that triggers all of the blocks:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An alternative way is to use the <code>given<\/code> and <code>when<\/code> pair, which we will learn in the future.<\/span><\/p>"]]},"la":{"t":"Utendo <code>elsif<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hactenus, didicimus <code>si<\/code> et <code>alioquin<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quid si vis ordinare catenam testium?<\/span> <span class=\"sg\" data-s=\"2\">Sunt saltem duo modi ad hoc faciendum in Raku (revera, sunt etiam plures).<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una ex possibilitatibus est uti catena <code>si<\/code>, <code>elsif<\/code>, et <code>alioquin<\/code> clausulis.<\/span> <span class=\"sg\" data-s=\"1\">Nota orthographiam <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Neque <code>elseif<\/code> neque <code>else si<\/code> est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>meum $x = roga 'Intra numerum: ';\nsi $x &gt; 100 {\n    dic \"$x maior est quam 100.\";\n}\nelsif $x &gt; 50 {\n    dic \"$x maior est quam 50.\";\n}\nelsif $x &gt; 25 {\n    dic \"$x maior est quam 25.\";\n}\nalioquin {\n    dic \"$x est 25 vel minor.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In hoc programmate, sunt tres rami et tres probationes una post alteram.<\/span> <span class=\"sg\" data-s=\"1\">Simul ac una ex condicionibus <code>Verum<\/code> est, correspondens codicis clausula curritur.<\/span> <span class=\"sg\" data-s=\"2\">Si nulla probatio <code>Verum<\/code> est, <code>alioquin<\/code> clausula curritur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt paucae probationes currendi programmatis quae omnes clausulas excitant:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum: 120\n120 maior est quam 100.\n\n$ raku t.raku\nIntra numerum: 75      \n75 maior est quam 50.\n\n$ raku t.raku\nIntra numerum: 30\n30 maior est quam 25.\n\n$ raku t.raku\nIntra numerum: 10\n10 est 25 vel minor.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alternativus modus est uti par <code>datis<\/code> et <code>quando<\/code>, quod in futuro discemus.<\/span><\/p>"]]}}}</script>
