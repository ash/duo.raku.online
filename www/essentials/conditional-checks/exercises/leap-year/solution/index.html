 % 400 {\n    say 'Common year';\n}\nelse {\n    say 'Leap year';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/conditional-checks/leap-year.raku\" target=\"_blank\" rel=\"noopener\">leap-year.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код 2<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Във второто решение логиката е събрана в едно изразяване.<\/span> <span class=\"sg\" data-s=\"1\">Скобите не винаги са необходими, но са добавени тук за яснота.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $year = prompt 'Year: ';\n\nsay (($year %% 400) || (($year %% 4) &amp;&amp; ($year % 100))) ?? 'Leap year' !! 'Common year';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/conditional-checks/leap-year-formula.raku\" target=\"_blank\" rel=\"noopener\">leap-year-formula.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опитайте и двете програми с най-критичните случаи, например, 1900, 2000, 2020, 2021.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/conditional-checks/leap-year.raku\nYear: 1900\nCommon year\n\n$ raku exercises/conditional-checks/leap-year.raku\nYear: 2000\nLeap year<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/conditional-checks/leap-year-formula.raku\nYear: 2020\nLeap year\n\n$ raku exercises/conditional-checks/leap-year-formula.raku\nYear: 2021\nCommon year<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## <code>%%<\/code> срещу <code>%<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Имайте предвид, че в логически контексти операторите <code>%%<\/code> и <code>%<\/code> са допълв ';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/conditional-checks/leap-year.raku\" target=\"_blank\" rel=\"noopener\">leap-year.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo 2<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En la dua solvo, la logiko estas pakita en unu esprimon.<\/span> <span class=\"sg\" data-s=\"1\">Parentezoj ne estas ĉiam necesaj sed aldonitaj ĉi tie por klareco.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $year = prompt 'Year: ';\n\nsay (($year %% 400) || (($year %% 4) &amp;&amp; ($year % 100))) ?? 'Leap year' !! 'Common year';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/conditional-checks/leap-year-formula.raku\" target=\"_blank\" rel=\"noopener\">leap-year-formula.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Provu ambaŭ programojn kun la plej kritikaj kazoj, ekzemple, 1900, 2000, 2020, 2021.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/conditional-checks/leap-year.raku\nYear: 1900\nCommon year\n\n$ raku exercises/conditional-checks/leap-year.raku\nYear: 2000\nLeap year<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/conditional-checks/leap-year-formula.raku\nYear: 2020\nLeap year\n\n$ raku exercises/conditional-checks/leap-year-formula.raku\nYear: 2021\nCommon year<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## <code>%%<\/code> vs <code>%<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke en Booleaj kuntekstoj, la operatoroj <code>%%<\/code> kaj <code>%<\/code> estas komplementaj.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas u
