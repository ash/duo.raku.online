<script type="application/json" id="page-data">{"u":"essentials/conditional-checks","n":124,"k":"section","pv":"essentials/code-blocks/local-variables/quiz","nx":"essentials/conditional-checks/if","tr":["essentials"],"L":{"en":{"t":"Conditional checks","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">As soon as you want the program to behave differently in response to different circumstances, you can start using <code>if<\/code> and its family.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">All these constructs need some condition, which is a <a href=\"/essentials/booleans/\">Boolean<\/a> value or a Boolean expression, or any other expression that can be <a href=\"/essentials/coercion/\">converted<\/a> to a Boolean value.<\/span><\/p>"]]},"de":{"t":"Bedingte Überprüfungen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sobald Sie möchten, dass das Programm unterschiedlich auf verschiedene Umstände reagiert, können Sie beginnen, <code>if<\/code> und seine Familie zu verwenden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">All diese Konstrukte benötigen eine Bedingung, die ein <a href=\"https://course.raku.org/de/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Boolean<\/a>-Wert oder ein Boolean-Ausdruck ist, oder ein beliebiger anderer Ausdruck, der in einen Boolean-Wert <a href=\"https://course.raku.org/de/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">umgewandelt<\/a> werden kann.<\/span><\/p>"]]},"nl":{"t":"Voorwaardelijke controles","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zodra je wilt dat het programma anders reageert op verschillende omstandigheden, kun je <code>if<\/code> en zijn familie gaan gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Al deze constructies hebben een voorwaarde nodig, wat een <a href=\"https://course.raku.org/nl/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleaanse<\/a> waarde of een Booleaanse expressie is, of een andere expressie die kan worden <a href=\"https://course.raku.org/nl/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">geconverteerd<\/a> naar een Booleaanse waarde.<\/span><\/p>"]]},"es":{"t":"Controles condicionales","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tan pronto como desees que el programa se comporte de manera diferente en respuesta a diferentes circunstancias, puedes comenzar a usar <code>if<\/code> y su familia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Todas estas construcciones necesitan alguna condición, que es un valor <a href=\"https://course.raku.org/es/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleano<\/a> o una expresión Booleana, o cualquier otra expresión que pueda ser <a href=\"https://course.raku.org/es/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">convertida<\/a> a un valor Booleano.<\/span><\/p>"]]},"it":{"t":"Controlli condizionali","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Non appena desideri che il programma si comporti in modo diverso in risposta a circostanze diverse, puoi iniziare a usare <code>if<\/code> e la sua famiglia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tutti questi costrutti necessitano di una condizione, che è un valore <a href=\"https://course.raku.org/it/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleano<\/a> o un'espressione booleana, o qualsiasi altra espressione che può essere <a href=\"https://course.raku.org/it/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">convertita<\/a> in un valore booleano.<\/span><\/p>"]]},"lv":{"t":"Nosacījumu pārbaudes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tiklīdz vēlaties, lai programma reaģētu atšķirīgi uz dažādiem apstākļiem, varat sākt izmantot <code>if<\/code> un tā ģimeni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visām šīm konstrukcijām ir nepieciešams kāds nosacījums, kas ir <a href=\"https://course.raku.org/lv/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Būla<\/a> vērtība vai Būla izteiksme, vai jebkura cita izteiksme, kuru var <a href=\"https://course.raku.org/lv/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">pārvērst<\/a> par Būla vērtību.<\/span><\/p>"]]},"ru":{"t":"Проверка условий","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Как только вы захотите, чтобы программа вела себя по-разному в зависимости от разных обстоятельств, вы можете начать использовать <code>if<\/code> и всё его семейство.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всем этим конструкциям необходимо условие, которое является <a href=\"https://course.raku.org/ru/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булевым<\/a> значением или булевым выражением, или любым другим выражением, которое может быть <a href=\"https://course.raku.org/ru/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">приведено<\/a> к булевому типу.<\/span><\/p>"]]},"uk":{"t":"Умовні перевірки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Як тільки ви хочете, щоб програма поводилася по-різному в залежності від різних обставин, ви можете почати використовувати <code>if<\/code> та його сімейство.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Усі ці конструкції потребують деякої умови, яка є <a href=\"https://course.raku.org/uk/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булевим<\/a> значенням або булевим виразом, або будь-яким іншим виразом, який може бути <a href=\"https://course.raku.org/uk/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">перетворений<\/a> на булеве значення.<\/span><\/p>"]]},"bg":{"t":"Условни проверки","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щом искате програмата да се държи различно в отговор на различни обстоятелства, можете да започнете да използвате <code>if<\/code> и неговото семейство.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всички тези конструкции се нуждаят от някакво условие, което е <a href=\"https://course.raku.org/bg/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Булева<\/a> стойност или Булево израз, или всякакъв друг израз, който може да бъде <a href=\"https://course.raku.org/bg/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">преобразуван<\/a> в Булева стойност.<\/span><\/p>"]]},"eo":{"t":"Kondiĉaj kontroloj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tuj kiam vi volas ke la programo kondutu malsame responde al malsamaj cirkonstancoj, vi povas komenci uzi <code>if<\/code> kaj ĝian familion.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj ĉi tiuj konstruoj bezonas iun kondiĉon, kiu estas <a href=\"https://course.raku.org/eo/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Boolea<\/a> valoro aŭ Boolea esprimo, aŭ iu ajn alia esprimo kiu povas esti <a href=\"https://course.raku.org/eo/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">konvertita<\/a> al Boolea valoro.<\/span><\/p>"]]},"la":{"t":"Conditiones comprobationes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Simulac ut vis programma aliter se gerere in responsione ad diversas circumstantias, potes incipere uti <code>si<\/code> et eius familia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omnes hae structurae aliquam condicionem indigent, quae est valor <a href=\"https://course.raku.org/la/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleanus<\/a> vel expressio Booleana, vel aliqua alia expressio quae potest <a href=\"https://course.raku.org/la/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">converti<\/a> ad valorem Booleanum.<\/span><\/p>"]]}}}</script>
