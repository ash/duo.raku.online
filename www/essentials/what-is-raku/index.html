">Raku ir lieliska programmēšanas valoda.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tā ļauj programmēt dažādos stilos, tostarp procedurālajā, funkcionālajā, objektorientētajā un reaktīvajā programmēšanā.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir valoda ar daudzveidīgu un pakāpenisku tipu sistēmu un neticamiem jauniem regex un gramatikām.<\/span> <span class=\"sg\" data-s=\"2\">Raku var atrisināt daudzus uzdevumus ar ļoti kompaktiem programmām.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis kurss aptver visbūtiskākās Raku funkcijas, kā arī daudzus trikus, kas padarīs jūsu darbu efektīvāku.<\/span><\/p>"]]},"ru":{"t":"Что такое Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku это отличный язык программирования.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Он позволяет программировать в разных стилях, включая процедурный, функциональный, объектно-ориентированный и реактивный.<\/span> <span class=\"sg\" data-s=\"1\">Это язык с разнообразной и последовательной типизацией, и невероятными новыми регулярными выражениями и грамматической системой.<\/span> <span class=\"sg\" data-s=\"2\">Raku может решить большое количество проблем с помощью очень компактных программ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этот курс покрывает самые фундаментальные особенности Raku вместе с большим количеством хитростей, которые сделают вашу работу еще более эффективной.<\/span><\/p>"]]},"uk":{"t":"Що таке Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku — це чудова мова програмування.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вона дозволяє програмувати в різних стилях, включаючи процедурне, функціональне, об'єктно-орієнтоване та реактивне програмування.<\/span> <span class=\"sg\" data-s=\"1\">Це мова з різноманітною та поступовою системою типів і неймовірними новими регулярними виразами та граматиками.<\/span> <span class=\"sg\" data-s=\"2\">Raku може вирішувати багато завдань за допомогою дуже компактних програм.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей курс охоплює найосновніші функції Raku, а також багато трюків, які зроблять вашу роботу більш ефективною.<\/span><\/p>"]]},"bg":{"t":"Какво е Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku е страхотен програмен език.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Той позволява програмиране в различни стилове, включително процедурно, функционално, обектно-ориентирано и реактивно програмиране.<\/span> <span class=\"sg\" data-s=\"1\">Това е език с разнообразна и постепенна типова система и невероятни нови регекси и граматики.<\/span> <span class=\"sg\" data-s=\"2\">Raku може да решава много задачи с много компактни програми.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този курс обхваща най-фундаменталните характеристики на Raku, заедно с много трикове, които ще направят работата ви по-ефективна.<\/span><\/p>"]]},"eo":{"t":"Kio estas Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku estas bonega programlingvo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝi permesas programadon en diversaj stiloj, inkluzive de procedura, funkcia, objekt-orientita, kaj reaktiva programado.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas lingvo kun diversa kaj grada tipa sistemo kaj nekredeblaj novaj regexoj kaj gramatikoj.<\/span> <span class=\"sg\" data-s=\"2\">Raku povas solvi multajn taskojn per tre kompaktaj programoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu kurso kovras la plej fundamentajn trajtojn de Raku, kune kun multaj ruzoj kiuj faros vian laboron pli efika.<\/span><\/p>"]]},"la":{"t":"Quid est Raku","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku est lingua programmandi magna.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Permittit programmare in variis stiliis, inter quos sunt procedurale, functionale, obiectum-orientatum, et reactiva programmatio.<\/span> <span class=\"sg\" data-s=\"1\">Es
