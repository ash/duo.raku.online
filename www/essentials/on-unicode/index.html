<script type="application/json" id="page-data">{"u":"essentials/on-unicode","n":11,"k":"section","pv":"essentials/hello-world","nx":"essentials/running-programs","tr":["essentials"],"L":{"en":{"t":"Notes on using Unicode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku assumes that all your program files are saved as UTF-8 files.<\/span> <span class=\"sg\" data-s=\"1\">From the practical point of view, that means that you don’t have to worry about non-ASCII characters in, for example, string literals.<\/span> <span class=\"sg\" data-s=\"2\">But that’s not only that.<\/span> <span class=\"sg\" data-s=\"3\">You most likely will not need to worry if your program reads a text file that is also a UTF-8 file.<\/span> <span class=\"sg\" data-s=\"4\">It also means that string length is correctly detected as the number of characters and not the number of bytes. (We will have a more detailed look into it later.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next thing you want to know is that you can use non-Latin or non-English letters for identifiers.<\/span> <span class=\"sg\" data-s=\"1\">You can name your variable <code>$ι<\/code> instead of <code>$i<\/code> if you prefer, and the compiler will parse it correctly.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku treats the Unicode properties of the characters pedantically enough.<\/span> <span class=\"sg\" data-s=\"1\">For example, it not only knows if a character is a letter or a digit, but also correctly identifies pair characters such as parentheses or different kinds of brackets.<\/span> <span class=\"sg\" data-s=\"2\">In many cases, you can choose a different type of brackets for separate parts of the program.<\/span> <span class=\"sg\" data-s=\"3\">For instance, you can modify our ‘Hello, World!’ program to use these non-Latin quoting characters (you will see them again when we’ll work with Raku grammars):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Some built-in operators have two forms: a Unicode and an ASCII version.<\/span> <span class=\"sg\" data-s=\"1\">For example, one can type a negated comparison as <code>!=<\/code> or as <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The same applies to set operations: for instance, <code>∈<\/code> has a pure ASCII equivalent <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Or, there is a built-in constant which you can refer to as <code>pi<\/code> or <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When working with numbers, you can choose to use fractions in the form of <code>½<\/code> instead of <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Or, evaluating the square of <code>$x<\/code> as <code>$x²<\/code> using a superscript character.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Find the full list of such pairs at the following documentation page: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbols<\/a>.<\/span><\/p>"]]},"de":{"t":"Hinweise zur Verwendung von Unicode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku geht davon aus, dass alle Ihre Programmdateien als UTF-8-Dateien gespeichert sind.<\/span> <span class=\"sg\" data-s=\"1\">Aus praktischer Sicht bedeutet das, dass Sie sich keine Sorgen um Nicht-ASCII-Zeichen in beispielsweise Zeichenkettenliteralen machen müssen.<\/span> <span class=\"sg\" data-s=\"2\">Aber das ist noch nicht alles.<\/span> <span class=\"sg\" data-s=\"3\">Höchstwahrscheinlich müssen Sie sich auch keine Sorgen machen, wenn Ihr Programm eine Textdatei liest, die ebenfalls eine UTF-8-Datei ist.<\/span> <span class=\"sg\" data-s=\"4\">Es bedeutet auch, dass die Zeichenlänge korrekt als Anzahl der Zeichen und nicht als Anzahl der Bytes erkannt wird. (Wir werden später einen detaillierteren Blick darauf werfen.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das nächste, was Sie wissen möchten, ist, dass Sie nicht-lateinische oder nicht-englische Buchstaben für Bezeichner verwenden können.<\/span> <span class=\"sg\" data-s=\"1\">Sie können Ihre Variable <code>$ι<\/code> anstelle von <code>$i<\/code> benennen, wenn Sie dies bevorzugen, und der Compiler wird sie korrekt parsen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku behandelt die Unicode-Eigenschaften der Zeichen pedantisch genug.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel weiß es nicht nur, ob ein Zeichen ein Buchstabe oder eine Ziffer ist, sondern erkennt auch korrekt Paarzeichen wie Klammern oder verschiedene Arten von Klammern.<\/span> <span class=\"sg\" data-s=\"2\">In vielen Fällen können Sie für verschiedene Teile des Programms unterschiedliche Arten von Klammern wählen.<\/span> <span class=\"sg\" data-s=\"3\">Beispielsweise können Sie unser „Hello, World!“-Programm so ändern, dass diese nicht-lateinischen Anführungszeichen verwendet werden (Sie werden sie wiedersehen, wenn wir mit Raku-Grammatiken arbeiten):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Einige eingebaute Operatoren haben zwei Formen: eine Unicode- und eine ASCII-Version.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kann man einen negierten Vergleich als <code>!=<\/code> oder als <code>≠<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Dasselbe gilt für Mengenoperationen: zum Beispiel hat <code>∈<\/code> ein reines ASCII-Äquivalent <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Oder es gibt eine eingebaute Konstante, auf die Sie als <code>pi<\/code> oder <code>π<\/code> verweisen können.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beim Arbeiten mit Zahlen können Sie wählen, Brüche in der Form von <code>½<\/code> anstelle von <code>0.5<\/code> zu verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Oder das Quadrat von <code>$x<\/code> als <code>$x²<\/code> unter Verwendung eines hochgestellten Zeichens auszuwerten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die vollständige Liste solcher Paare finden Sie auf der folgenden Dokumentationsseite: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII-Symbole<\/a>.<\/span><\/p>"]]},"nl":{"t":"Opmerkingen over het gebruik van Unicode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku gaat ervan uit dat al je programmabestanden zijn opgeslagen als UTF-8 bestanden.<\/span> <span class=\"sg\" data-s=\"1\">Vanuit praktisch oogpunt betekent dit dat je je geen zorgen hoeft te maken over niet-ASCII tekens in bijvoorbeeld string-literals.<\/span> <span class=\"sg\" data-s=\"2\">Maar dat is niet alles.<\/span> <span class=\"sg\" data-s=\"3\">Je hoeft je hoogstwaarschijnlijk ook geen zorgen te maken als je programma een tekstbestand leest dat ook een UTF-8 bestand is.<\/span> <span class=\"sg\" data-s=\"4\">Dit betekent ook dat de stringlengte correct wordt gedetecteerd als het aantal tekens en niet als het aantal bytes. (We zullen hier later dieper op ingaan.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het volgende dat je moet weten, is dat je niet-Latijnse of niet-Engelse letters kunt gebruiken voor identificatoren.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt je variabele <code>$ι<\/code> noemen in plaats van <code>$i<\/code> als je dat liever hebt, en de compiler zal het correct parsen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku behandelt de Unicode-eigenschappen van de tekens nauwgezet genoeg.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, het weet niet alleen of een teken een letter of een cijfer is, maar identificeert ook correct paartekens zoals haakjes of verschillende soorten haken.<\/span> <span class=\"sg\" data-s=\"2\">In veel gevallen kun je een ander type haakjes kiezen voor afzonderlijke delen van het programma.<\/span> <span class=\"sg\" data-s=\"3\">Bijvoorbeeld, je kunt ons 'Hello, World!' programma aanpassen om deze niet-Latijnse aanhalingstekens te gebruiken (je zult ze opnieuw zien wanneer we met Raku-grammatica's werken):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sommige ingebouwde operators hebben twee vormen: een Unicode en een ASCII versie.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld, je kunt een ontkende vergelijking typen als <code>!=<\/code> of als <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hetzelfde geldt voor setbewerkingen: bijvoorbeeld, <code>∈<\/code> heeft een puur ASCII-equivalent <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Of, er is een ingebouwde constante waarnaar je kunt verwijzen als <code>pi<\/code> of <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bij het werken met getallen kun je ervoor kiezen om breuken te gebruiken in de vorm van <code>½<\/code> in plaats van <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Of, het kwadraat van <code>$x<\/code> evalueren als <code>$x²<\/code> met behulp van een superscript-teken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vind de volledige lijst van dergelijke paren op de volgende documentatiepagina: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbolen<\/a>.<\/span><\/p>"]]},"es":{"t":"Notas sobre el uso de Unicode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku asume que todos tus archivos de programa están guardados como archivos UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Desde el punto de vista práctico, eso significa que no tienes que preocuparte por caracteres no ASCII en, por ejemplo, literales de cadena.<\/span> <span class=\"sg\" data-s=\"2\">Pero eso no es todo.<\/span> <span class=\"sg\" data-s=\"3\">Lo más probable es que tampoco necesites preocuparte si tu programa lee un archivo de texto que también es un archivo UTF-8.<\/span> <span class=\"sg\" data-s=\"4\">También significa que la longitud de la cadena se detecta correctamente como el número de caracteres y no el número de bytes. (Lo veremos con más detalle más adelante.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo siguiente que debes saber es que puedes usar letras no latinas o no inglesas para identificadores.<\/span> <span class=\"sg\" data-s=\"1\">Puedes nombrar tu variable <code>$ι<\/code> en lugar de <code>$i<\/code> si lo prefieres, y el compilador la analizará correctamente.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku trata las propiedades Unicode de los caracteres con suficiente meticulosidad.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, no solo sabe si un carácter es una letra o un dígito, sino que también identifica correctamente caracteres pares como paréntesis o diferentes tipos de corchetes.<\/span> <span class=\"sg\" data-s=\"2\">En muchos casos, puedes elegir un tipo diferente de corchetes para partes separadas del programa.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, puedes modificar nuestro programa ‘¡Hola, Mundo!’ para usar estos caracteres de comillas no latinas (los verás de nuevo cuando trabajemos con gramáticas de Raku):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Algunos operadores integrados tienen dos formas: una versión Unicode y una versión ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, se puede escribir una comparación negada como <code>!=<\/code> o como <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo mismo se aplica a las operaciones de conjuntos: por ejemplo, <code>∈<\/code> tiene un equivalente puramente ASCII <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">O, hay una constante incorporada a la que puedes referirte como <code>pi<\/code> o <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al trabajar con números, puedes optar por usar fracciones en la forma de <code>½<\/code> en lugar de <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">O, evaluar el cuadrado de <code>$x<\/code> como <code>$x²<\/code> usando un carácter en superíndice.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Encuentra la lista completa de tales pares en la siguiente página de documentación: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Símbolos Unicode versus ASCII<\/a>.<\/span><\/p>"]]},"it":{"t":"Note sull'uso di Unicode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku presume che tutti i file del tuo programma siano salvati come file UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Dal punto di vista pratico, ciò significa che non devi preoccuparti dei caratteri non ASCII, ad esempio, nei letterali di stringa.<\/span> <span class=\"sg\" data-s=\"2\">Ma non è solo questo.<\/span> <span class=\"sg\" data-s=\"3\">Molto probabilmente non dovrai preoccuparti se il tuo programma legge un file di testo che è anche un file UTF-8.<\/span> <span class=\"sg\" data-s=\"4\">Significa anche che la lunghezza della stringa viene rilevata correttamente come numero di caratteri e non come numero di byte. (Ne parleremo più dettagliatamente in seguito.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prossima cosa che vuoi sapere è che puoi usare lettere non latine o non inglesi per gli identificatori.<\/span> <span class=\"sg\" data-s=\"1\">Puoi nominare la tua variabile <code>$ι<\/code> invece di <code>$i<\/code> se preferisci, e il compilatore la analizzerà correttamente.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku tratta le proprietà Unicode dei caratteri in modo abbastanza pedante.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, non solo sa se un carattere è una lettera o una cifra, ma identifica correttamente i caratteri di coppia come parentesi o diversi tipi di parentesi.<\/span> <span class=\"sg\" data-s=\"2\">In molti casi, puoi scegliere un tipo diverso di parentesi per parti separate del programma.<\/span> <span class=\"sg\" data-s=\"3\">Ad esempio, puoi modificare il nostro programma ‘Hello, World!’ per usare questi caratteri di citazione non latini (li vedrai di nuovo quando lavoreremo con le grammatiche Raku):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Alcuni operatori integrati hanno due forme: una versione Unicode e una versione ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio, si può digitare un confronto negato come <code>!=<\/code> o come <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso vale per le operazioni sugli insiemi: ad esempio, <code>∈<\/code> ha un equivalente puramente ASCII <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Oppure, c'è una costante integrata a cui puoi fare riferimento come <code>pi<\/code> o <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando lavori con i numeri, puoi scegliere di usare frazioni nella forma di <code>½<\/code> invece di <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Oppure, valutare il quadrato di <code>$x<\/code> come <code>$x²<\/code> usando un carattere apice.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Trova l'elenco completo di tali coppie alla seguente pagina di documentazione: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Simboli Unicode contro ASCII<\/a>.<\/span><\/p>"]]},"lv":{"t":"Piezīmes par Unicode izmantošanu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku pieņem, ka visi jūsu programmu faili ir saglabāti kā UTF-8 faili.<\/span> <span class=\"sg\" data-s=\"1\">No praktiskā viedokļa tas nozīmē, ka jums nav jāuztraucas par ne-ASCII rakstzīmēm, piemēram, virknes literāļos.<\/span> <span class=\"sg\" data-s=\"2\">Bet tas nav viss.<\/span> <span class=\"sg\" data-s=\"3\">Visticamāk, jums nebūs jāuztraucas, ja jūsu programma lasa teksta failu, kas arī ir UTF-8 fails.<\/span> <span class=\"sg\" data-s=\"4\">Tas arī nozīmē, ka virknes garums tiek pareizi noteikts kā rakstzīmju skaits, nevis baitu skaits. (Mēs to apskatīsim sīkāk vēlāk.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamā lieta, ko vēlaties zināt, ir tā, ka jūs varat izmantot ne-latīņu vai ne-angļu burtus identifikatoriem.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat nosaukt savu mainīgo <code>$ι<\/code> tā vietā, lai izmantotu <code>$i<\/code>, ja vēlaties, un kompilators to pareizi parsēs.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku pietiekami pedantiski apstrādā rakstzīmju Unicode īpašības.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tas ne tikai zina, vai rakstzīme ir burts vai cipars, bet arī pareizi identificē pāra rakstzīmes, piemēram, iekavas vai dažāda veida iekavas.<\/span> <span class=\"sg\" data-s=\"2\">Daudzos gadījumos jūs varat izvēlēties dažāda veida iekavas atsevišķām programmas daļām.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, jūs varat modificēt mūsu \"Hello, World!\" programmu, lai izmantotu šīs ne-latīņu citēšanas rakstzīmes (jūs tās redzēsiet atkal, kad strādāsim ar Raku gramatikām):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažiem iebūvētiem operatoriem ir divas formas: Unicode un ASCII versijas.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, var rakstīt noliegtu salīdzinājumu kā <code>!=<\/code> vai kā <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats attiecas uz kopu operācijām: piemēram, <code>∈<\/code> ir tīrs ASCII ekvivalents <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vai arī ir iebūvēta konstante, uz kuru var atsaukties kā <code>pi<\/code> vai <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Strādājot ar skaitļiem, jūs varat izvēlēties izmantot daļskaitļus formā <code>½<\/code> tā vietā, lai izmantotu <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vai arī novērtēt kvadrātu <code>$x<\/code> kā <code>$x²<\/code>, izmantojot augšraksta rakstzīmi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pilnu šādu pāru sarakstu varat atrast šajā dokumentācijas lapā: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbols<\/a>.<\/span><\/p>"]]},"ru":{"t":"Заметки по использованию Юникода","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku предполагает, что все ваши файлы с кодом сохранены в кодировке UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">С практической точки зрения это означает, что вам не нужно волноваться о содержании в них символов не из ASCII таблицы, например, в строках.<\/span> <span class=\"sg\" data-s=\"2\">Но этим все не ограничивается.<\/span> <span class=\"sg\" data-s=\"3\">Скорее всего вам не придется волноваться из-за того, что ваша программа прочитает файл, который тоже имеет кодировку UTF-8.<\/span> <span class=\"sg\" data-s=\"4\">Это также означает, что длина строки правильно определяется как количество букв, а не количество байтов в строке (позже мы посмотрим на это более подробно).<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующее, что вам следует знать, это что в качестве идентификаторов вы можете использовать буквы помимо латинского и английского алфавитов.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете назвать свою переменную <code>$и<\/code> заместо <code>$i<\/code>, если того пожелаете, и компилятор правильно это прочитает.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku достаточно педантично подходит к свойствам букв Юникода.<\/span> <span class=\"sg\" data-s=\"1\">Например, он не только знает, если символ является буквой или цифрой, но так же правильно распознает парные символы, такие как скобки разных форм.<\/span> <span class=\"sg\" data-s=\"2\">К примеру, вы можете изменить нашу программу \"Привет, Мир!\", чтобы она использовала кавычки не из латинского алфавита (вы увидите их снова, когда мы начнем работать с грамматической системой Raku):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Некоторые встроенные операторы имеют две формы: Юникод и ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Например, неравенство можно написать как <code>!=<\/code>, но также и <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">То же касается операций над множествами, к примеру, оператор <code>∈<\/code> имеет ASCII вариант <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">А еще есть встроенная константа, к которой можно одинаково обращаться как <code>pi<\/code>, так и <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы работаете с числами, вы можете записать число в форме <code>½<\/code> заместо <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Или вычислить квадрат <code>$x<\/code> как <code>$x²<\/code>, используя число в верхнем индексе.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы можете найти полный список всех таких пар на следующей странице документации: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Юникод и ASCII символы<\/a>.<\/span><\/p>"]]},"uk":{"t":"Примітки щодо використання Юнікоду","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku передбачає, що всі ваші програмні файли збережені як файли UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">З практичної точки зору це означає, що вам не потрібно турбуватися про не-ASCII символи, наприклад, у рядкових літералах.<\/span> <span class=\"sg\" data-s=\"2\">Але це не все.<\/span> <span class=\"sg\" data-s=\"3\">Найімовірніше, вам не потрібно буде турбуватися, якщо ваша програма читає текстовий файл, який також є файлом UTF-8.<\/span> <span class=\"sg\" data-s=\"4\">Це також означає, що довжина рядка правильно визначається як кількість символів, а не кількість байтів. (Ми детальніше розглянемо це пізніше.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступне, що вам потрібно знати, це те, що ви можете використовувати не латинські або не англійські літери для ідентифікаторів.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете назвати свою змінну <code>$ι<\/code> замість <code>$i<\/code>, якщо вам так зручніше, і компілятор правильно її розпізнає.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku досить педантично ставиться до властивостей символів Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, він не тільки знає, чи є символ літерою або цифрою, але також правильно ідентифікує парні символи, такі як дужки або різні види кронштейнів.<\/span> <span class=\"sg\" data-s=\"2\">У багатьох випадках ви можете вибрати інший тип кронштейнів для окремих частин програми.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, ви можете змінити нашу програму «Hello, World!» для використання цих не латинських символів цитування (ви побачите їх знову, коли ми працюватимемо з граматиками Raku):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Деякі вбудовані оператори мають дві форми: версію Unicode та версію ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, можна написати заперечене порівняння як <code>!=<\/code> або як <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Те ж саме стосується операцій з множинами: наприклад, <code>∈<\/code> має чисто ASCII еквівалент <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Або, є вбудована константа, до якої можна звертатися як <code>pi<\/code> або <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Працюючи з числами, ви можете вибрати використання дробів у формі <code>½<\/code> замість <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Або, обчислюючи квадрат <code>$x<\/code> як <code>$x²<\/code>, використовуючи символ надрядкового індексу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Знайдіть повний список таких пар на наступній сторінці документації: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbols<\/a>.<\/span><\/p>"]]},"bg":{"t":"Бележки относно използването на Unicode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku приема, че всички ваши програмни файлове са запазени като UTF-8 файлове.<\/span> <span class=\"sg\" data-s=\"1\">От практическа гледна точка, това означава, че не трябва да се притеснявате за не-ASCII символи в, например, низови литерали.<\/span> <span class=\"sg\" data-s=\"2\">Но това не е всичко.<\/span> <span class=\"sg\" data-s=\"3\">Най-вероятно няма да се притеснявате, ако вашата програма чете текстов файл, който също е UTF-8 файл.<\/span> <span class=\"sg\" data-s=\"4\">Това също означава, че дължината на низа се открива правилно като броя на символите, а не като броя на байтовете. (Ще разгледаме това по-подробно по-късно.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващото нещо, което трябва да знаете, е че можете да използвате не-латински или не-английски букви за идентификатори.<\/span> <span class=\"sg\" data-s=\"1\">Можете да наречете вашата променлива <code>$ι<\/code> вместо <code>$i<\/code>, ако предпочитате, и компилаторът ще я парсира правилно.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku третира Unicode свойствата на символите достатъчно педантично.<\/span> <span class=\"sg\" data-s=\"1\">Например, той не само знае дали един символ е буква или цифра, но също така правилно идентифицира двойки символи като скоби или различни видове скоби.<\/span> <span class=\"sg\" data-s=\"2\">В много случаи можете да изберете различен тип скоби за отделни части на програмата.<\/span> <span class=\"sg\" data-s=\"3\">Например, можете да модифицирате нашата програма „Hello, World!“ да използва тези не-латински кавички (ще ги видите отново, когато работим с граматики на Raku):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Някои вградени оператори имат две форми: Unicode и ASCII версии.<\/span> <span class=\"sg\" data-s=\"1\">Например, може да напишете отрицателно сравнение като <code>!=<\/code> или като <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Същото важи и за операции със множества: например, <code>∈<\/code> има чисто ASCII еквивалент <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Или, има вградена константа, към която можете да се отнесете като <code>pi<\/code> или <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато работите с числа, можете да изберете да използвате дроби във формата на <code>½<\/code> вместо <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Или, да изчислите квадрата на <code>$x<\/code> като <code>$x²<\/code> използвайки надписан символ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Намерете пълния списък на такива двойки на следната страница с документация: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode срещу ASCII символи<\/a>.<\/span><\/p>"]]},"eo":{"t":"Notoj pri uzado de Unikodo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku supozas, ke ĉiuj viaj programdosieroj estas konservitaj kiel UTF-8 dosieroj.<\/span> <span class=\"sg\" data-s=\"1\">El praktika vidpunkto, tio signifas, ke vi ne devas zorgi pri ne-ASCII-karakteroj en, ekzemple, ŝnurliteraloj.<\/span> <span class=\"sg\" data-s=\"2\">Sed tio ne estas ĉio.<\/span> <span class=\"sg\" data-s=\"3\">Vi plej verŝajne ne devos zorgi, se via programo legas tekstdosieron, kiu ankaŭ estas UTF-8 dosiero.<\/span> <span class=\"sg\" data-s=\"4\">Tio ankaŭ signifas, ke la longeco de ŝnuro estas ĝuste detektita kiel la nombro de karakteroj kaj ne la nombro de bajtoj. (Ni pli detale rigardos tion poste.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekva afero, kiun vi volas scii, estas ke vi povas uzi ne-latinajn aŭ ne-anglajn literojn por identigiloj.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas nomi vian variablon <code>$ι<\/code> anstataŭ <code>$i<\/code> se vi preferas, kaj la kompililo ĝin ĝuste analizos.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku traktas la Unikodajn ecojn de la karakteroj sufiĉe pedante.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, ĝi ne nur scias, ĉu karaktero estas litero aŭ cifero, sed ankaŭ ĝuste identigas parigitajn karakterojn kiel krampojn aŭ malsamajn specojn de krampoj.<\/span> <span class=\"sg\" data-s=\"2\">En multaj kazoj, vi povas elekti malsaman tipon de krampoj por apartaj partoj de la programo.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, vi povas modifi nian ‘Saluton, Mondo!’ programon por uzi ĉi tiujn ne-latinajn citilojn (vi vidos ilin denove kiam ni laboros kun Raku-gramatikoj):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Saluton, Mondo!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Iuj enkonstruitaj operatoroj havas du formojn: Unikodan kaj ASCII-versiojn.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, oni povas tajpi negitan komparon kiel <code>!=<\/code> aŭ kiel <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La sama aplikiĝas al aroj operacioj: ekzemple, <code>∈<\/code> havas puran ASCII-ekvivalenton <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ, estas enkonstruita konstanto, kiun vi povas referenci kiel <code>pi<\/code> aŭ <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi laboras kun nombroj, vi povas elekti uzi frakciojn en la formo de <code>½<\/code> anstataŭ <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aŭ, taksi la kvadraton de <code>$x<\/code> kiel <code>$x²<\/code> uzante superskriban karakteron.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Trovu la plenan liston de tiaj paroj ĉe la sekva dokumenta paĝo: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unikodo kontraŭ ASCII simboloj<\/a>.<\/span><\/p>"]]},"la":{"t":"Notae de usu Unicodi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku assumit omnes fasciculos programmatis tui ut UTF-8 fasciculi servati sint.<\/span> <span class=\"sg\" data-s=\"1\">Ex practica sententia, id significat te non curare de characteribus non-ASCII in, exempli gratia, literalibus stringae.<\/span> <span class=\"sg\" data-s=\"2\">Sed non solum id.<\/span> <span class=\"sg\" data-s=\"3\">Verisimiliter non necesse erit curare si programma tuum fasciculum textus legit qui etiam fasciculus UTF-8 est.<\/span> <span class=\"sg\" data-s=\"4\">Etiam significat longitudinem stringae recte deprehendi ut numerus characterum et non numerus byte-orum. (Postea diligentius inspiciemus.)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proximum quod scire vis est te posse uti litteris non-Latinis vel non-Anglicis pro identificatoribus.<\/span> <span class=\"sg\" data-s=\"1\">Variabile tuum nominare potes <code>$ι<\/code> loco <code>$i<\/code> si mavis, et compilator id recte interpretabitur.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku proprietates Unicodi characterum satis pedantice tractat.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, non solum scit si character sit littera vel digitus, sed etiam recte identificat characteres parium sicut parenthesin vel diversos generis claudendi.<\/span> <span class=\"sg\" data-s=\"2\">In multis casibus, potes eligere diversum genus claudendi pro partibus separatis programmatis.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, potes modificare nostrum programma ‘Hello, World!’ utatur his characteribus non-Latinis pro citando (videbis eos iterum cum grammaticis Raku laborabimus):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quidam operatores in-builti duas formas habent: versionem Unicodi et versionem ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, quis potest scribere comparationem negatum ut <code>!=<\/code> vel ut <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Idem valet pro operationibus set: exempli gratia, <code>∈<\/code> habet purum ASCII aequivalentem <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vel, est constans in-builta quam potes referre ut <code>pi<\/code> vel <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum numeris laborans, potes eligere uti fractionibus in forma <code>½<\/code> loco <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vel, quadratum <code>$x<\/code> aestimare ut <code>$x²<\/code> utens charactere superscripto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Invenies plenam indicem talium parium in sequenti pagina documentorum: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Symbola Unicode versus ASCII<\/a>.<\/span><\/p>"]]}}}</script>
