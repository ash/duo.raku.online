<script type="application/json" id="page-data">{"u":"essentials/comments/multi-line","n":27,"k":"topic","pv":"essentials/comments/single-line/quiz","nx":"essentials/comments/embedded","tr":["essentials","essentials/comments"],"L":{"en":{"t":"Multi-line comments","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">As soon as you want to leave a comment that is bigger than a single line, you can choose either to have a few single-line comments or a single multi-line comment.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Multi-line comments start with a two-character combination <code><\/code>#<code> <\/code><code> and are followed by a pair of enclosing characters <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, or <\/code>&lt; &gt;<code> or their repeated copies: <\/code>(( ))<code>, <\/code>[[[ ]]]<code>, etc.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( We are going to ask the user\nto enter their name first and then\nsave the input in a variable. )\n\n$name = prompt 'What is your name? ';\n#`{ The program now waits\nuntil the user enters the name\nand presses Enter. }\n\nsay $name; #`( And now we can print it )<\/code><\/pre>"]]},"de":{"t":"Mehrzeilige Kommentare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sobald Sie einen Kommentar hinterlassen möchten, der größer als eine einzelne Zeile ist, können Sie entweder einige einzeilige Kommentare oder einen einzigen mehrzeiligen Kommentar verwenden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mehrzeilige Kommentare beginnen mit einer zweistelligen Kombination <code><\/code>#<code> <\/code><code> und werden von einem Paar einschließender Zeichen <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code> oder <\/code>&lt; &gt;<code> oder deren wiederholten Kopien gefolgt: <\/code>(( ))<code>, <\/code>[[[ ]]]<code> usw.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zum Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Wir werden den Benutzer fragen,\nseinen Namen einzugeben, und dann\ndie Eingabe in einer Variablen speichern. )\n\n$name = prompt 'Wie heißt du? ';\n#`{ Das Programm wartet jetzt,\nbis der Benutzer den Namen eingibt\nund Enter drückt. }\n\nsay $name; #`( Und jetzt können wir es ausdrucken )<\/code><\/pre>"]]},"nl":{"t":"Meerzijdige opmerkingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zodra je een opmerking wilt achterlaten die groter is dan een enkele regel, kun je ervoor kiezen om een paar enkelregelige opmerkingen te hebben of een enkele meerregelige opmerking.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Meerregelige opmerkingen beginnen met een tweekaraktercombinatie <code><\/code>#<code> <\/code><code> en worden gevolgd door een paar insluitende tekens <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, of <\/code>&lt; &gt;<code> of hun herhaalde kopieën: <\/code>(( ))<code>, <\/code>[[[ ]]]<code>, enz.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( We gaan de gebruiker vragen\nom eerst hun naam in te voeren en vervolgens\nde invoer in een variabele op te slaan. )\n\n$name = prompt 'Wat is je naam? ';\n#`{ Het programma wacht nu\ntotdat de gebruiker de naam invoert\nen op Enter drukt. }\n\nsay $name; #`( En nu kunnen we het afdrukken )<\/code><\/pre>"]]},"es":{"t":"Comentarios de varias líneas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tan pronto como desees dejar un comentario que sea más grande que una sola línea, puedes optar por tener algunos comentarios de una sola línea o un solo comentario de varias líneas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los comentarios de varias líneas comienzan con una combinación de dos caracteres <code><\/code>#<code> <\/code><code> y son seguidos por un par de caracteres de cierre <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, o <\/code>&lt; &gt;<code> o sus copias repetidas: <\/code>(( ))<code>, <\/code>[[[ ]]]<code>, etc.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Vamos a pedirle al usuario\nque ingrese su nombre primero y luego\nguardaremos la entrada en una variable. )\n\n$name = prompt '¿Cuál es tu nombre? ';\n#`{ El programa ahora espera\nhasta que el usuario ingrese el nombre\ny presione Enter. }\n\nsay $name; #`( Y ahora podemos imprimirlo )<\/code><\/pre>"]]},"it":{"t":"Commenti su più linee","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Non appena vuoi lasciare un commento che è più grande di una singola riga, puoi scegliere di avere alcuni commenti su singola riga o un singolo commento multi-linea.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I commenti multi-linea iniziano con una combinazione di due caratteri <code><\/code>#<code> <\/code><code> e sono seguiti da una coppia di caratteri di chiusura <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, o <\/code>&lt; &gt;<code> o dalle loro copie ripetute: <\/code>(( ))<code>, <\/code>[[[ ]]]<code>, ecc.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Chiederemo all'utente\ndi inserire il proprio nome prima e poi\nsalveremo l'input in una variabile. )\n\n$name = prompt 'Qual è il tuo nome? ';\n#`{ Il programma ora aspetta\nfino a quando l'utente inserisce il nome\ne preme Invio. }\n\nsay $name; #`( E ora possiamo stamparlo )<\/code><\/pre>"]]},"lv":{"t":"Daudzrindu komentāri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tiklīdz vēlaties atstāt komentāru, kas ir lielāks par vienu rindu, varat izvēlēties vai nu vairākus vienrindu komentārus, vai vienu vairākrindu komentāru.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vairākrindu komentāri sākas ar divu rakstzīmju kombināciju <code><\/code>#<code> <\/code><code> un tiem seko pāris noslēdzošo rakstzīmju <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code> vai <\/code>&lt; &gt;<code> vai to atkārtotas kopijas: <\/code>(( ))<code>, <\/code>[[[ ]]]<code> utt.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Mēs lūgsim lietotājam\nvispirms ievadīt savu vārdu un tad\nsaglabāt ievadi mainīgajā. )\n\n$name = prompt 'Kāds ir tavs vārds? ';\n#`{ Programma tagad gaida,\nlīdz lietotājs ievadīs vārdu\nun nospiedīs Enter. }\n\nsay $name; #`( Un tagad mēs to varam izdrukāt )<\/code><\/pre>"]]},"ru":{"t":"Многострочные комментарии","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Как только вы захотите оставить комментарий, который больше одной строки, у вас есть выбор: либо оставить несколько однострочных комментариев, либо один многострочный.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Многострочные комментарии начинаются с комбинации из двух символов <code><\/code>#<code> <\/code><code> и заключены в пару охватывающих символов <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, <\/code>&lt; &gt;<code> или их повторяющиеся копии: <\/code>(( ))<code>, <\/code>[[[ ]]]<code> и так далее.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( We are going to ask the user\nto enter their name first and then\nsave the input in a variable. )\n\n$name = prompt 'What is your name? ';\n#`{ The program now waits\nuntil the user enters the name\nand presses Enter. }\n\nsay $name; #`( And now we can print it )<\/code><\/pre>"]]},"uk":{"t":"Багаторядкові коментарі","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви хочете залишити коментар, який займає більше одного рядка, ви можете вибрати або кілька однорядкових коментарів, або один багаторядковий коментар.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Багаторядкові коментарі починаються з комбінації двох символів <code><\/code>#<code> <\/code><code> і супроводжуються парою обмежуючих символів <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code> або <\/code>&lt; &gt;<code> або їх повтореними копіями: <\/code>(( ))<code>, <\/code>[[[ ]]]<code> тощо.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Ми збираємося попросити користувача\nввести своє ім'я спочатку, а потім\nзберегти введення в змінну. )\n\n$name = prompt 'Як вас звати? ';\n#`{ Програма тепер чекає,\nпоки користувач введе ім'я\nі натисне Enter. }\n\nsay $name; #`( А тепер ми можемо його надрукувати )<\/code><\/pre>"]]},"bg":{"t":"Многоредови коментари","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щом искате да оставите коментар, който е по-голям от един ред, можете да изберете или няколко едноредови коментара, или един многострочен коментар.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Многострочните коментари започват с двусимволната комбинация <code><\/code>#<code> <\/code><code> и са последвани от двойка ограждащи символи <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, или <\/code>&lt; &gt;<code> или техните повторени копия: <\/code>(( ))<code>, <\/code>[[[ ]]]<code> и т.н.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Ще помолим потребителя\nда въведе своето име първо и след това\nще запазим въведеното в променлива. )\n\n$name = prompt 'Как се казвате? ';\n#`{ Програмата сега чака\nдокато потребителят въведе името\nи натисне Enter. }\n\nsay $name; #`( И сега можем да го отпечатаме )<\/code><\/pre>"]]},"eo":{"t":"Plurliniaj komentoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tuj kiam vi volas lasi komenton kiu estas pli granda ol unu linio, vi povas elekti aŭ havi kelkajn unu-linajn komentojn aŭ unu solan multi-linian komenton.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Multi-liniaj komentoj komenciĝas per du-karaktera kombinaĵo <code><\/code>#<code> <\/code><code> kaj estas sekvataj de paro de enfermaj karakteroj <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, aŭ <\/code>&lt; &gt;<code> aŭ iliaj ripetitaj kopioj: <\/code>(( ))<code>, <\/code>[[[ ]]]<code>, ktp.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Ni petos la uzanton\nenmeti sian nomon unue kaj poste\nkonservi la enigon en variablo. )\n\n$name = prompt 'Kio estas via nomo? ';\n#`{ La programo nun atendas\nĝis la uzanto enmetas la nomon\nkaj premas Enter. }\n\nsay $name; #`( Kaj nun ni povas presi ĝin )<\/code><\/pre>"]]},"la":{"t":"Commentarii multi-lineae","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Simul ac vis relinquere commentarium quod maius est quam una linea, potes eligere vel habere pauca commentaria unius lineae vel unum commentarium multi-lineae.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Commentarii multi-lineae incipiunt cum combinatione duorum characterum <code><\/code>#<code> <\/code><code> et sequuntur par characterum includentium <\/code>( )<code>, <\/code>{ }<code>, <\/code>[ ]<code>, vel <\/code>&lt; &gt;<code> vel eorum exemplaria repetita: <\/code>(( ))<code>, <\/code>[[[ ]]]<code>, etc.<\/code><\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Rogaturi sumus utentem\nut nomen suum primum inserat et deinde\ninput in variabili servet. )\n\n$name = prompt 'Quod est nomen tuum? ';\n#`{ Programma nunc exspectat\nuntil utens nomen inserat\net premet Enter. }\n\nsay $name; #`( Et nunc possumus illud imprimere )<\/code><\/pre>"]]}}}</script>
