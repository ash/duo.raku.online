<script type="application/json" id="page-data">{"u":"essentials/comments","n":24,"k":"section","pv":"essentials/simple-input-output/prompt","nx":"essentials/comments/single-line","tr":["essentials"],"L":{"en":{"t":"Comments in Raku","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Comments are those parts of the program that are written for a human that reads the program.<\/span> <span class=\"sg\" data-s=\"1\">The compiler mostly ignores comments (in some rare cases you can have some comments that will be part of an error message, for example, but we will not cover it right now).<\/span><\/p>"]]},"de":{"t":"Kommentare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kommentare sind jene Teile des Programms, die für einen Menschen geschrieben sind, der das Programm liest.<\/span> <span class=\"sg\" data-s=\"1\">Der Compiler ignoriert Kommentare größtenteils (in einigen seltenen Fällen können Kommentare Teil einer Fehlermeldung sein, aber das werden wir jetzt nicht behandeln).<\/span><\/p>"]]},"nl":{"t":"Opmerkingen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Opmerkingen zijn die delen van het programma die zijn geschreven voor een mens die het programma leest.<\/span> <span class=\"sg\" data-s=\"1\">De compiler negeert meestal opmerkingen (in enkele zeldzame gevallen kun je opmerkingen hebben die deel uitmaken van een foutmelding, bijvoorbeeld, maar dat zullen we nu niet behandelen).<\/span><\/p>"]]},"es":{"t":"Comentarios","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los comentarios son aquellas partes del programa que están escritas para un humano que lee el programa.<\/span> <span class=\"sg\" data-s=\"1\">El compilador ignora mayormente los comentarios (en algunos casos raros puedes tener algunos comentarios que serán parte de un mensaje de error, por ejemplo, pero no lo cubriremos ahora).<\/span><\/p>"]]},"it":{"t":"Commenti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I commenti sono quelle parti del programma che sono scritte per un essere umano che legge il programma.<\/span> <span class=\"sg\" data-s=\"1\">Il compilatore ignora per lo più i commenti (in alcuni rari casi puoi avere alcuni commenti che faranno parte di un messaggio di errore, per esempio, ma non lo copriremo adesso).<\/span><\/p>"]]},"lv":{"t":"Komentāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Komentāri ir tās programmas daļas, kas ir rakstītas cilvēkam, kurš lasa programmu.<\/span> <span class=\"sg\" data-s=\"1\">Kompilators lielākoties ignorē komentārus (retos gadījumos var būt daži komentāri, kas būs daļa no kļūdas ziņojuma, piemēram, bet mēs to šobrīd neapskatīsim).<\/span><\/p>"]]},"ru":{"t":"Комментарии","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Комментарии — это те части программы, которые написаны для человека, который читает программу.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор в большинстве случаев игнорирует комментарии (в редких случаях у вас могут быть комментарии, которые будут частью сообщения об ошибке, но мы не будем сейчас в это углубляться).<\/span><\/p>"]]},"uk":{"t":"Коментарі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коментарі — це ті частини програми, які написані для людини, що читає програму.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор здебільшого ігнорує коментарі (в деяких рідкісних випадках коментарі можуть бути частиною повідомлення про помилку, наприклад, але ми не будемо розглядати це зараз).<\/span><\/p>"]]},"bg":{"t":"Коментари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коментарите са тези части от програмата, които са написани за човека, който чете програмата.<\/span> <span class=\"sg\" data-s=\"1\">Компилаторът най-вече игнорира коментарите (в някои редки случаи може да имате коментари, които ще бъдат част от съобщение за грешка, например, но няма да го разглеждаме сега).<\/span><\/p>"]]},"eo":{"t":"Komentoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Komentoj estas tiuj partoj de la programo, kiuj estas skribitaj por homo kiu legas la programon.<\/span> <span class=\"sg\" data-s=\"1\">La kompililo plejparte ignoras komentojn (en kelkaj raraj kazoj vi povas havi kelkajn komentojn kiuj estos parto de erarmesaĝo, ekzemple, sed ni ne kovros tion nun).<\/span><\/p>"]]},"la":{"t":"Commentarii","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Commentarii sunt partes programmatis quae scriptae sunt pro homine qui programmatem legit.<\/span> <span class=\"sg\" data-s=\"1\">Compilator plerumque commentarios ignorat (in quibusdam raris casibus potes habere aliquos commentarios qui pars nuntii erroris erunt, exempli gratia, sed hoc nunc non tractabimus).<\/span><\/p>"]]}}}</script>
