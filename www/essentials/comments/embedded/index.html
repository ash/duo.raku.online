te visualiseren.<\/span><\/p>"]]},"es":{"t":"Comentarios incrustados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los comentarios embebidos, o en línea, tienen la misma forma que los comentarios de varias líneas con la única diferencia de que los colocas entre otras partes del programa.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Se espera entrada del usuario aquí] prompt '¿Cuál es tu nombre? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un buen resaltador de sintaxis ayuda mucho a visualizar los comentarios.<\/span><\/p>"]]},"it":{"t":"Commenti incorporati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I commenti incorporati, o inline, hanno la stessa forma dei commenti multi-linea con l'unica differenza che li posizioni tra altre parti del programma.<\/span> <span class=\"sg\" data-s=\"1\">Ad esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[User input expected here] prompt 'What is your name? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un buon evidenziatore di sintassi aiuta molto a visualizzare i commenti.<\/span><\/p>"]]},"lv":{"t":"Iekļautie komentāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Iekļautajiem jeb inline komentāriem ir tāda pati forma kā vairākrindu komentāriem, ar vienīgo atšķirību, ka tos ievieto starp citām programmas daļām.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Šeit tiek gaidīta lietotāja ievade] prompt 'What is your name? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Labs sintakses izcēlējs ļoti palīdz vizualizēt komentārus.<\/span><\/p>"]]},"ru":{"t":"Вложенные комментарии","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вложенные или строчные комментарии имеют ту же форму, что и многострочные комментарии, с одной только разницей, что вы можете поставить его в середине программы.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[User input expected here] prompt 'What is your name? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хорошая подсветка синтаксиса сильно помогает в визуализации комментариев.<\/span><\/p>"]]},"uk":{"t":"Вбудовані коментарі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вбудовані, або рядкові коментарі, мають ту ж форму, що й багаторядкові коментарі, з тією лише різницею, що ви розміщуєте їх між іншими частинами програми.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Тут очікується введення користувача] prompt 'Як вас звати? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хороший підсвічувач синтаксису дуже допомагає візуалізувати коментарі.<\/span><\/p>"]]},"bg":{"t":"Вградени коментари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вградените, или inline коментари, имат същата форма като многострочните коментари с единствената разлика, че ги поставяте между други части на програмата.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Очаква се потребителски вход тук] prompt 'Как се казваш? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Добър синтактичен оцветител много помага за визуализирането на коментарите.<\/span><\/p>"]]},"eo":{"t":"Enmetitaj komentoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Enigitaj, aŭ enliniaj komentoj, havas la saman formon kiel plurliniaj komentoj kun la sola diferenco, ke vi metas ilin inter aliaj partoj de la programo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Uzanta enigo atendita ĉi tie] prompt 'Kio estas via nomo? ';\nsay $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bona sintaksa reliefigilo multe helpas por vizualigi la komentojn.<\/span><\/p>"]]},"la":{"t":"Inscripti commentarii","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Commentarii incorporati, vel commentarii in linea, eandem formam habent ac commentarii multi-lineae, sola differentia quod eos inter alias partes programmatis ponis.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[User input expected here] prompt 'Quod est nomen tuum? ';\ndic $name;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bonus syntax highlighter multum adiuvat ad commentarios visualizandos.<\/span><\/p>"]]}}}</script>
