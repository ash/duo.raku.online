<script type="application/json" id="page-data">{"u":"essentials/comments/single-line/quiz","n":26,"k":"quiz","pv":"essentials/comments/single-line","nx":"essentials/comments/multi-line","tr":["essentials","essentials/comments","essentials/comments/single-line"],"L":{"en":{"t":"Quiz: Single-line comments","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Select the lines with correct comments.<\/span> <span class=\"sg\" data-s=\"1\">Don’t worry if you do not understand the Raku code yet.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Setting the name<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Change it next year<\/code><span class=\"quiz-note\">Everything after the first <code>#<\/code> is a comment.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Printing name<\/code><span class=\"quiz-note\">A comment must start with a <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Not yet known<\/code><span class=\"quiz-note\">C++-style comments are not recognised in Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">The whole line has been commented out.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"de":{"t":"Quiz: Einzeilige Kommentare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wählen Sie die Zeilen mit korrekten Kommentaren aus.<\/span> <span class=\"sg\" data-s=\"1\">Machen Sie sich keine Sorgen, wenn Sie den Raku-Code noch nicht verstehen.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Name setzen<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Nächstes Jahr ändern<\/code><span class=\"quiz-note\">Alles nach dem ersten <code>#<\/code> ist ein Kommentar.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Name ausgeben<\/code><span class=\"quiz-note\">Ein Kommentar muss mit einem <code>#<\/code> beginnen.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Noch nicht bekannt<\/code><span class=\"quiz-note\">Kommentare im C++-Stil werden in Raku nicht erkannt.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">Die ganze Zeile wurde auskommentiert.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"nl":{"t":"Quiz: Eenzijnige opmerkingen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Selecteer de regels met correcte opmerkingen.<\/span> <span class=\"sg\" data-s=\"1\">Maak je geen zorgen als je de Raku-code nog niet begrijpt.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Naam instellen<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Verander het volgend jaar<\/code><span class=\"quiz-note\">Alles na de eerste <code>#<\/code> is een opmerking.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Naam afdrukken<\/code><span class=\"quiz-note\">Een opmerking moet beginnen met een <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Nog niet bekend<\/code><span class=\"quiz-note\">C++-stijl opmerkingen worden niet herkend in Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">De hele regel is uitgecommentarieerd.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"es":{"t":"Quiz: Comentarios de una línea","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Selecciona las líneas con comentarios correctos.<\/span> <span class=\"sg\" data-s=\"1\">No te preocupes si aún no entiendes el código Raku.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Estableciendo el nombre<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Cambiarlo el próximo año<\/code><span class=\"quiz-note\">Todo después del primer <code>#<\/code> es un comentario.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Imprimiendo nombre<\/code><span class=\"quiz-note\">Un comentario debe comenzar con un <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Aún no conocido<\/code><span class=\"quiz-note\">Los comentarios al estilo de C++ no son reconocidos en Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">Toda la línea ha sido comentada.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"it":{"t":"Quiz: Commenti su una sola linea","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Seleziona le righe con i commenti corretti.<\/span> <span class=\"sg\" data-s=\"1\">Non preoccuparti se non capisci ancora il codice Raku.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Impostazione del nome<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Cambialo l'anno prossimo<\/code><span class=\"quiz-note\">Tutto ciò che segue il primo <code>#<\/code> è un commento.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Stampa del nome<\/code><span class=\"quiz-note\">Un commento deve iniziare con un <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Non ancora conosciuto<\/code><span class=\"quiz-note\">I commenti in stile C++ non sono riconosciuti in Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">L'intera riga è stata commentata.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"lv":{"t":"Tests: Vienrindas komentāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Izvēlieties rindas ar pareiziem komentāriem.<\/span> <span class=\"sg\" data-s=\"1\">Neuztraucieties, ja vēl nesaprotat Raku kodu.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Iestatīt vārdu<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Nomainīt nākamgad<\/code><span class=\"quiz-note\">Viss pēc pirmā <code>#<\/code> ir komentārs.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Printing name<\/code><span class=\"quiz-note\">Komentāram jāsākas ar <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Vēl nav zināms<\/code><span class=\"quiz-note\">C++ stila komentāri Raku netiek atpazīti.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">Visa rinda ir komentēta.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"ru":{"t":"Тест: Однострочные комментарии","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Выберите строки с правильными комментариями.<\/span> <span class=\"sg\" data-s=\"1\">Не бойтесь, если вы пока не понимаете сам код.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Setting the name<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Change it next year<\/code><span class=\"quiz-note\">Все после первого <code>#<\/code> является комментарием.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Printing name<\/code><span class=\"quiz-note\">Комментарий должен начинаться с <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Not yet known<\/code><span class=\"quiz-note\">Комментарии в стиле C++ не работают в Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">Вся строка была закомментирована.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"uk":{"t":"Тест: Однорядкові коментарі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Виберіть рядки з правильними коментарями.<\/span> <span class=\"sg\" data-s=\"1\">Не хвилюйтеся, якщо ви ще не розумієте код Raku.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Встановлення імені<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Змінити наступного року<\/code><span class=\"quiz-note\">Все після першого <code>#<\/code> є коментарем.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Друк імені<\/code><span class=\"quiz-note\">Коментар має починатися з <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Ще не відомо<\/code><span class=\"quiz-note\">Коментарі в стилі C++ не розпізнаються в Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">Весь рядок закоментовано.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"bg":{"t":"Тест: Едноредови коментари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Изберете редовете с правилни коментари.<\/span> <span class=\"sg\" data-s=\"1\">Не се притеснявайте, ако все още не разбирате кода на Raku.<\/span><\/p>"],["quiz",6,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>my $name = 'John'; # Задаване на името<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>my $age = 23; ## Променете го следващата година<\/code><span class=\"quiz-note\">Всичко след първото <code>#<\/code> е коментар.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>say $name; Печат на името<\/code><span class=\"quiz-note\">Коментарът трябва да започва с <code>#<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>my $city = 'TBA'; // Все още не е известно<\/code><span class=\"quiz-note\">Коментари в стил C++ не се разпознават в Raku.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"4\"><code># say $age;<\/code><span class=\"quiz-note\">Целият ред е коментиран.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"5\"><code>#say $age;<\/code><\/span><\/li><\/ul>"]]},"eo":{"t":"Kvizo: Unuliniaj komentoj","b":[["p",2,"<p><span class=\"sg\" data-s
