<script type="application/json" id="page-data">{"u":"essentials/comments/single-line","n":25,"k":"topic","pv":"essentials/comments","nx":"essentials/comments/single-line/quiz","tr":["essentials","essentials/comments"],"L":{"en":{"t":"Single-line comments","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The simplest form of a comment is a one-line comment.<\/span> <span class=\"sg\" data-s=\"1\">It starts with the <code>#<\/code> character and goes until the end of the current line.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # This variable is used to keep user’s name\n$name = prompt 'What is your name? ';\nsay $name; # We see the name now<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notice that a shebang such as <code>#!/usr/bin/env raku<\/code> in the first line of code is also a comment for Raku, while it can be read and executed by the shell.<\/span><\/p>"]]},"de":{"t":"Einzeilige Kommentare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die einfachste Form eines Kommentars ist ein einzeiliger Kommentar.<\/span> <span class=\"sg\" data-s=\"1\">Er beginnt mit dem Zeichen <code>#<\/code> und geht bis zum Ende der aktuellen Zeile.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Diese Variable wird verwendet, um den Namen des Benutzers zu speichern\n$name = prompt 'Wie heißt du? ';\nsay $name; # Jetzt sehen wir den Namen<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass ein Shebang wie <code>#!/usr/bin/env raku<\/code> in der ersten Zeile des Codes auch ein Kommentar für Raku ist, während er von der Shell gelesen und ausgeführt werden kann.<\/span><\/p>"]]},"nl":{"t":"Eenzijnige opmerkingen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste vorm van een opmerking is een eenregelige opmerking.<\/span> <span class=\"sg\" data-s=\"1\">Deze begint met het <code>#<\/code>-teken en gaat door tot het einde van de huidige regel.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Deze variabele wordt gebruikt om de naam van de gebruiker te bewaren\n$name = prompt 'Wat is je naam? ';\nsay $name; # We zien nu de naam<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat een shebang zoals <code>#!/usr/bin/env raku<\/code> in de eerste regel van de code ook een opmerking is voor Raku, terwijl deze door de shell kan worden gelezen en uitgevoerd.<\/span><\/p>"]]},"es":{"t":"Comentarios de una línea","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma más simple de un comentario es un comentario de una sola línea.<\/span> <span class=\"sg\" data-s=\"1\">Comienza con el carácter <code>#<\/code> y continúa hasta el final de la línea actual.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Esta variable se usa para guardar el nombre del usuario\n$name = prompt '¿Cuál es tu nombre? ';\nsay $name; # Ahora vemos el nombre<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota que un shebang como <code>#!/usr/bin/env raku<\/code> en la primera línea de código también es un comentario para Raku, aunque puede ser leído y ejecutado por el shell.<\/span><\/p>"]]},"it":{"t":"Commenti su una sola linea","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La forma più semplice di un commento è un commento su una singola linea.<\/span> <span class=\"sg\" data-s=\"1\">Inizia con il carattere <code>#<\/code> e continua fino alla fine della linea corrente.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Questa variabile viene utilizzata per memorizzare il nome dell'utente\n$name = prompt 'Qual è il tuo nome? ';\nsay $name; # Ora vediamo il nome<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che uno shebang come <code>#!/usr/bin/env raku<\/code> nella prima linea di codice è anche un commento per Raku, mentre può essere letto ed eseguito dalla shell.<\/span><\/p>"]]},"lv":{"t":"Vienrindas komentāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākā komentāra forma ir vienrindas komentārs.<\/span> <span class=\"sg\" data-s=\"1\">Tas sākas ar <code>#<\/code> rakstzīmi un turpinās līdz pašreizējās rindas beigām.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Šis mainīgais tiek izmantots lietotāja vārda glabāšanai\n$name = prompt 'Kā tevi sauc? ';\nsay $name; # Tagad redzam vārdu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka sheebang, piemēram, <code>#!/usr/bin/env raku<\/code> koda pirmajā rindā, arī ir komentārs Raku valodā, lai gan to var nolasīt un izpildīt čaula.<\/span><\/p>"]]},"ru":{"t":"Однострочные комментарии","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Простейшая форма комментария — это однострочный комментарий.<\/span> <span class=\"sg\" data-s=\"1\">Он начинается с символа <code>#<\/code> и продолжается до конца строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # This variable is used to keep user’s name\n$name = prompt 'What is your name? ';\nsay $name; # We see the name now<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Интересно, что shebang, такой как <code>#!/usr/bin/env raku<\/code>, на первой строчке кода также будет комментарием для Raku, хотя он может быть прочитан и выполнен командной оболочкой.<\/span><\/p>"]]},"uk":{"t":"Однорядкові коментарі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Найпростішою формою коментаря є однорядковий коментар.<\/span> <span class=\"sg\" data-s=\"1\">Він починається з символу <code>#<\/code> і триває до кінця поточного рядка.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Ця змінна використовується для зберігання імені користувача\n$name = prompt 'Як вас звати? ';\nsay $name; # Тепер ми бачимо ім'я<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що shebang, такий як <code>#!/usr/bin/env raku<\/code> у першому рядку коду, також є коментарем для Raku, хоча він може бути прочитаний і виконаний оболонкою.<\/span><\/p>"]]},"bg":{"t":"Едноредови коментари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Най-простата форма на коментар е едноредовият коментар.<\/span> <span class=\"sg\" data-s=\"1\">Той започва с символа <code>#<\/code> и продължава до края на текущия ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Тази променлива се използва за съхранение на името на потребителя\n$name = prompt 'Как се казваш? ';\nsay $name; # Сега виждаме името<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че sheebang като <code>#!/usr/bin/env raku<\/code> в първия ред на кода също е коментар за Raku, въпреки че може да бъде прочетен и изпълнен от черупката.<\/span><\/p>"]]},"eo":{"t":"Unuliniaj komentoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La plej simpla formo de komento estas unulinia komento.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi komenciĝas per la signo <code>#<\/code> kaj daŭras ĝis la fino de la aktuala linio.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Ĉi tiu variablo estas uzata por konservi la nomon de la uzanto\n$name = prompt 'Kio estas via nomo? ';\nsay $name; # Ni vidas la nomon nun<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke shebang kiel <code>#!/usr/bin/env raku<\/code> en la unua linio de kodo ankaŭ estas komento por Raku, dum ĝi povas esti legita kaj plenumita de la ŝelo.<\/span><\/p>"]]},"la":{"t":"Commentarii unius lineae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Simplissima forma commentarii est commentarius unius lineae.<\/span> <span class=\"sg\" data-s=\"1\">Incipit a charactere <code>#<\/code> et pergit usque ad finem lineae currentis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Haec variabilis ad nomen usoris servandum adhibetur\n$name = prompt 'Quod est nomen tuum? ';\nsay $name; # Nunc nomen videmus<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod sheebang sicut <code>#!/usr/bin/env raku<\/code> in prima linea codicis etiam commentarius pro Raku est, dum a testudine legi et exsequi potest.<\/span><\/p>"]]}}}</script>
