e>zef<\/code> è il gestore di moduli standard.<\/span> <span class=\"sg\" data-s=\"2\">Arriva insieme a Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Per installare un modulo, dai a <code>zef<\/code> il nome del modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> scarica il modulo.<\/span> <span class=\"sg\" data-s=\"1\">Scarica anche tutto quello che serve al modulo.<\/span> <span class=\"sg\" data-s=\"2\">Poi esegue i test del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, installa il modulo.<\/span> <span class=\"sg\" data-s=\"4\">Da quel momento il modulo è automaticamente nel percorso di ricerca.<\/span> <span class=\"sg\" data-s=\"5\">Così un programma può caricarlo solo con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Non serve l'opzione <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche cercare nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">L'ecosistema è fatto di tutti i moduli che le persone pubblicano.<\/span> <span class=\"sg\" data-s=\"2\">E puoi aggiornare o rimuovere moduli:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Da dove provengono i moduli<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">I moduli pubblicati sono nell'<em>ecosistema<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puoi guardarlo sul sito <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Il sito elenca le distribuzioni disponibili.<\/span> <span class=\"sg\" data-s=\"3\">Una distribuzione contiene uno o più moduli.<\/span> <span class=\"sg\" data-s=\"4\">Il sito mostra anche la loro documentazione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Una distribuzione da condividere ha un file con una descrizione.<\/span> <span class=\"sg\" data-s=\"1\">Il file si chiama <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Contiene il nome e la versione della distribuzione.<\/span> <span class=\"sg\" data-s=\"3\">Elenca i moduli della distribuzione.<\/span> <span class=\"sg\" data-s=\"4\">Elenca anche le altre distribuzioni che le servono.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> legge questo file.<\/span> <span class=\"sg\" data-s=\"6\">Così sa cosa installare.<\/span> <span class=\"sg\" data-s=\"7\">Sa anche come le parti stanno insieme.<\/span> <span class=\"sg\" data-s=\"8\">Forse vuoi pubblicare un tuo modulo.<\/span> <span class=\"sg\" data-s=\"9\">Allora dagli un <code>META6.json<\/code> corretto.<\/span> <span class=\"sg\" data-s=\"10\">Con questo file, tutti gli altri possono installare il tuo modulo.<\/span><\/p>"]]},"lv":{"t":"Moduļu instalēšana no tīmekļa","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat rakstīt savus moduļus.<\/span> <span class=\"sg\" data-s=\"1\">Bet Raku kopiena arī publicē daudz moduļu.<\/span> <span class=\"sg\" data-s=\"2\">Ir moduļi daudzām lietām, no tīmekļa ietvariem līdz datu formātiem.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat tos instalēt un izmantot savās programmās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Instalēšana ar <code>zef<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs instalējat moduļus ar <code>zef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef<\/code> ir standarta moduļu pārvaldnieks.<\/span> <span class=\"sg\" data-s=\"2\">Tas nāk kopā ar Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Lai instalētu moduli, dodiet <code>zef<\/code> moduļa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> lejupielādē moduli.<\/span> <span class=\"sg\" data-s=\"1\">Tas lejupielādē arī visu, kas modulim vajadzīgs.<\/span> <span class=\"sg\" data-s=\"2\">Tālāk tas izpilda moduļa testus.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas instalē moduli.<\/span> <span class=\"sg\" data-s=\"4\">Pēc tam modulis automātiski ir meklēšanas ceļā.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc programma var to ielādēt vienkārši ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Jums nav vajadzīga opcija <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī meklēt ekosistēmā.<\/span> <span class=\"sg\" data-s=\"1\">Ekosistēma ir visi moduļi, ko cilvēki publicē.<\/span> <span class=\"sg\" data-s=\"2\">Un jūs varat atjaunināt vai noņemt moduļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No kurienes nāk moduļi<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Publicētie moduļi ir Raku <em>ekosistēmā<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to apskatīt tīmekļa vietnē <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Vietne parāda pieejamās distribūcijas.<\/span> <span class=\"sg\" data-s=\"3\">Distribūcijā ir viens vai vairāki moduļi.<\/span> <span class=\"sg\" data-s=\"4\">Vietne parāda arī to dokumentāciju.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Distribūcijai kopīgošanai ir fails ar aprakstu.<\/span> <span class=\"sg\" data-s=\"1\">Fails saucas <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tajā ir distribūcijas nosaukums un versija.<\/span> <span class=\"sg\" data-s=\"3\">Tas uzskaita distribūcijas moduļus.<\/span> <span class=\"sg\" data-s=\"4\">Tas uzskaita arī citas vajadzīgās distribūcijas.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> nolasa šo failu.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc tas zina, ko instalēt.<\/span> <span class=\"sg\" data-s=\"7\">Tas zina arī, kā daļas sader kopā.<\/span> <span class=\"sg\" data-s=\"8\">Varbūt jūs gribat publicēt savu moduli.<\/span> <span class=\"sg\" data-s=\"9\">Tad dodiet tam pareizu <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">Ar šo failu visi pārējie var instalēt jūsu moduli.<\/span><\/p>"]]},"ru":{"t":"Установка модулей из сети","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы можете писать свои модули.<\/span> <span class=\"sg\" data-s=\"1\">Но сообщество Raku тоже публикует много модулей.<\/span> <span class=\"sg\" data-s=\"2\">Есть модули для многих задач, от веб-фреймворков до форматов данных.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете установить их и использовать в своих программах.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Установка с помощью <code>zef<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы устанавливаете модули с помощью <code>zef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef<\/code> — это стандартный менеджер модулей.<\/span> <span class=\"sg\" data-s=\"2\">Он идёт вместе с Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы установить модуль, передайте <code>zef<\/code> имя модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> скачивает модуль.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он скачивает всё, что нужно модулю.<\/span> <span class=\"sg\" data-s=\"2\">Дальше он запускает тесты модуля.<\/span> <span class=\"sg\" data-s=\"3\">Потом он устанавливает модуль.<\/span> <span class=\"sg\" data-s=\"4\">После этого модуль сам попадает в путь поиска.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому программа может загрузить его просто через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Вам не нужна опция <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы также можете искать в экосистеме.<\/span> <span class=\"sg\" data-s=\"1\">Экосистема — это все модули, которые публикуют люди.<\/span> <span class=\"sg\" data-s=\"2\">И вы можете обновлять или удалять модули:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Откуда берутся модули<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Опубликованные модули находятся в <em>экосистеме<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете посмотреть её на сайте <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">На сайте есть список доступных дистрибутивов.<\/span> <span class=\"sg\" data-s=\"3\">В дистрибутиве есть один или несколько модулей.<\/span> <span class=\"sg\" data-s=\"4\">Ещё сайт показывает их документацию.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">У дистрибутива для других людей есть файл с описанием.<\/span> <span class=\"sg\" data-s=\"1\">Файл называется <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В нём есть имя и версия дистрибутива.<\/span> <span class=\"sg\" data-s=\"3\">Там есть список модулей дистрибутива.<\/span> <span class=\"sg\" data-s=\"4\">Ещё там есть список других дистрибутивов, которые ему нужны.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> читает этот файл.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому он знает, что устанавливать.<\/span> <span class=\"sg\" data-s=\"7\">Ещё он знает, как части связаны между собой.<\/span> <span class=\"sg\" data-s=\"8\">Может быть, вы захотите опубликовать свой модуль.<\/span> <span class=\"sg\" data-s=\"9\">Тогда добавьте к нему правильный <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">С этим файлом все остальные смогут установить ваш модуль.<\/span><\/p>"]]},"uk":{"t":"Встановлення модулів із мережі","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви можете писати власні модулі.<\/span> <span class=\"sg\" data-s=\"1\">Але спільнота Raku теж публікує багато модулів.<\/span> <span class=\"sg\" data-s=\"2\">Є модулі для багатьох речей, від вебфреймворків до форматів даних.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете встановити їх і використати у своїх програмах.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Встановлення через <code>zef<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви встановлюєте модулі за допомогою <code>zef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef<\/code> — це стандартний менеджер модулів.<\/span> <span class=\"sg\" data-s=\"2\">Він іде разом із Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Щоб встановити модуль, дайте <code>zef<\/code> назву модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> завантажує модуль.<\/span> <span class=\"sg\" data-s=\"1\">Він також завантажує все, що потрібно модулю.<\/span> <span class=\"sg\" data-s=\"2\">Далі він запускає тести модуля.<\/span> <span class=\"sg\" data-s=\"3\">Потім він встановлює модуль.<\/span> <span class=\"sg\" data-s=\"4\">Після цього модуль автоматично опиняється на шляху пошуку.<\/span> <span class=\"sg\" data-s=\"5\">Тож програма може завантажити його просто через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Опція <code>-I<\/code> вам не потрібна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви також можете шукати в екосистемі.<\/span> <span class=\"sg\" data-s=\"1\">Екосистема — це всі модулі, які люди публікують.<\/span> <span class=\"sg\" data-s=\"2\">А ще ви можете оновлювати або видаляти модулі:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звідки беруться модулі<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Опубліковані модулі живуть в <em>екосистемі<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете переглянути її на сайті <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Сайт має список доступних дистрибутивів.<\/span> <span class=\"sg\" data-s=\"3\">Дистрибутив містить один або кілька модулів.<\/span> <span class=\"sg\" data-s=\"4\">Також сайт показує їхню документацію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив для поширення має файл з описом.<\/span> <span class=\"sg\" data-s=\"1\">Цей файл називається <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У ньому є назва і версія дистрибутива.<\/span> <span class=\"sg\" data-s=\"3\">Він має список модулів у дистрибутиві.<\/span> <span class=\"sg\" data-s=\"4\">Ще він перелічує інші дистрибутиви, які йому потрібні.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> читає цей файл.<\/span> <span class=\"sg\" data-s=\"6\">Так він знає, що встановити.<\/span> <span class=\"sg\" data-s=\"7\">Також він знає, як частини з'єднуються між собою.<\/span> <span class=\"sg\" data-s=\"8\">Можливо, ви захочете опублікувати власний модуль.<\/span> <span class=\"sg\" data-s=\"9\">Тоді дайте йому правильний <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">З цим файлом усі інші зможуть встановити ваш модуль.<\/span><\/p>"]]},"bg":{"t":"Инсталиране на модули от мрежата","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да пишете свои модули.<\/span> <span class=\"sg\" data-s=\"1\">Но общността на Raku също публикува много модули.<\/span> <span class=\"sg\" data-s=\"2\">Има модули за много неща, от уеб фреймуърки до формати за данни.<\/span> <span class=\"sg\" data-s=\"3\">Можете да ги инсталирате и да ги използвате в програмите си.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Инсталиране със <code>zef<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Инсталирате модули със <code>zef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef<\/code> е стандартният мениджър на модули.<\/span> <span class=\"sg\" data-s=\"2\">Той идва с Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">За да инсталирате модул, дайте на <code>zef<\/code> името на модула:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> изтегля модула.<\/span> <span class=\"sg\" data-s=\"1\">Той изтегля и всичко, от което модулът има нужда.<\/span> <span class=\"sg\" data-s=\"2\">След това изпълнява тестовете на модула.<\/span> <span class=\"sg\" data-s=\"3\">После инсталира модула.<\/span> <span class=\"sg\" data-s=\"4\">Тогава модулът автоматично е в пътя за търсене.<\/span> <span class=\"sg\" data-s=\"5\">Така програмата може да го зареди само с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Не ви трябва опцията <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете също да търсите в екосистемата.<\/span> <span class=\"sg\" data-s=\"1\">В екосистемата са всички модули, които хората публикуват.<\/span> <span class=\"sg\" data-s=\"2\">И можете да обновявате или премахвате модули:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Откъде идват модулите<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Публикуваните модули са в <em>екосистемата<\/em> на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я разгледате на уебсайта <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Сайтът показва списък с наличните дистрибуции.<\/span> <span class=\"sg\" data-s=\"3\">Една дистрибуция съдържа един или повече модули.<\/span> <span class=\"sg\" data-s=\"4\">Сайтът показва и тяхната документация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Дистрибуцията за споделяне има файл с описание.<\/span> <span class=\"sg\" data-s=\"1\">Файлът се казва <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В него са името и версията на дистрибуцията.<\/span> <span class=\"sg\" data-s=\"3\">Той изброява модулите в дистрибуцията.<\/span> <span class=\"sg\" data-s=\"4\">Изброява и другите дистрибуции, от които тя има нужда.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> чете този файл.<\/span> <span class=\"sg\" data-s=\"6\">Така знае какво да инсталира.<\/span> <span class=\"sg\" data-s=\"7\">Знае и как частите се свързват.<\/span> <span class=\"sg\" data-s=\"8\">Може да искате да публикувате свой модул.<\/span> <span class=\"sg\" data-s=\"9\">Тогава му дайте правилен <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">С този файл всички останали могат да инсталират вашия модул.<\/span><\/p>"]]},"eo":{"t":"Instali modulojn el la reto","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas skribi viajn proprajn modulojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed la Raku-komunumo ankaŭ publikigas multajn modulojn.<\/span> <span class=\"sg\" data-s=\"2\">Estas moduloj por multaj aferoj, de retkadroj ĝis datumformatoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas instali ilin kaj uzi ilin en viaj programoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Instalado per <code>zef<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi instalas modulojn per <code>zef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef<\/code> estas la norma modula administrilo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi venas kun Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Por instali modulon, donu al <code>zef<\/code> la nomon de la modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> elŝutas la modulon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ elŝutas ĉion, kion la modulo bezonas.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi rulas la testojn de la modulo.<\/span> <span class=\"sg\" data-s=\"3\">Tiam ĝi instalas la modulon.<\/span> <span class=\"sg\" data-s=\"4\">Post tio, la modulo estas aŭtomate en la serĉvojo.<\/span> <span class=\"sg\" data-s=\"5\">Do programo povas ŝargi ĝin simple per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Vi ne bezonas la opcion <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas serĉi en la ekosistemo.<\/span> <span class=\"sg\" data-s=\"1\">La ekosistemo estas ĉiuj moduloj, kiujn homoj publikigas.<\/span> <span class=\"sg\" data-s=\"2\">Kaj vi povas ĝisdatigi aŭ forigi modulojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De kie venas moduloj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Publikigitaj moduloj estas en la Raku-<em>ekosistemo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas rigardi ĝin en la retejo <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La retejo listigas la disponeblajn distribuaĵojn.<\/span> <span class=\"sg\" data-s=\"3\">Distribuaĵo enhavas unu aŭ pli da moduloj.<\/span> <span class=\"sg\" data-s=\"4\">La retejo ankaŭ montras ilian dokumentadon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Distribuaĵo por kunhavigo havas dosieron kun priskribo.<\/span> <span class=\"sg\" data-s=\"1\">La dosiero nomiĝas <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi enhavas la nomon kaj la version de la distribuaĵo.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi listigas la modulojn en la distribuaĵo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ listigas la aliajn distribuaĵojn, kiujn ĝi bezonas.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> legas ĉi tiun dosieron.<\/span> <span class=\"sg\" data-s=\"6\">Do ĝi scias, kion instali.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ankaŭ scias, kiel la partoj kuniĝas.<\/span> <span class=\"sg\" data-s=\"8\">Eble vi volas publikigi vian propran modulon.<\/span> <span class=\"sg\" data-s=\"9\">Tiam donu al ĝi ĝustan <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">Kun ĉi tiu dosiero, ĉiuj aliaj povas instali vian modulon.<\/span><\/p>"]]},"la":{"t":"Modulos ex interrete installare","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulos tuos ipse scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sed communitas Raku etiam multos modulos edit.<\/span> <span class=\"sg\" data-s=\"2\">Moduli sunt pro multis rebus, a compagibus interretialibus usque ad formas datorum.<\/span> <span class=\"sg\" data-s=\"3\">Eos installare et in programmatis tuis adhibere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Installare per <code>zef<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulos per <code>zef<\/code> installas.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef<\/code> est moderator modulorum normatus.<\/span> <span class=\"sg\" data-s=\"2\">Una cum Rakudo venit.<\/span> <span class=\"sg\" data-s=\"3\">Ut modulum installes, nomen moduli <code>zef<\/code> da:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> modulum deponit.<\/span> <span class=\"sg\" data-s=\"1\">Etiam omnia deponit quae modulus requirit.<\/span> <span class=\"sg\" data-s=\"2\">Deinde probationes moduli exsequitur.<\/span> <span class=\"sg\" data-s=\"3\">Tum modulum installat.<\/span> <span class=\"sg\" data-s=\"4\">Postea modulus automatice in via inquisitionis est.<\/span> <span class=\"sg\" data-s=\"5\">Itaque programma eum solo <code>use<\/code> onerare potest.<\/span> <span class=\"sg\" data-s=\"6\">Optionem <code>-I<\/code> non requiris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Etiam in oecosystemate quaerere potes.<\/span> <span class=\"sg\" data-s=\"1\">Oecosystema omnes modulos continet quos homines edunt.<\/span> <span class=\"sg\" data-s=\"2\">Et modulos renovare vel removere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unde moduli proveniant<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Moduli editi in <em>oecosystemate<\/em> Raku sunt.<\/span> <span class=\"sg\" data-s=\"1\">Id in situ interretiali <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a> inspicere potes.<\/span> <span class=\"sg\" data-s=\"2\">Situs distributiones paratas enumerat.<\/span> <span class=\"sg\" data-s=\"3\">Distributio unum vel plures modulos continet.<\/span> <span class=\"sg\" data-s=\"4\">Situs etiam documentationem earum ostendit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Distributio ad communicandum fasciculum cum descriptione habet.<\/span> <span class=\"sg\" data-s=\"1\">Nomen fasciculi est <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nomen et versionem distributionis continet.<\/span> <span class=\"sg\" data-s=\"3\">Modulos distributionis enumerat.<\/span> <span class=\"sg\" data-s=\"4\">Etiam alias distributiones enumerat quas requirit.<\/span> <span class=\"sg\" data-s=\"5\"><code>zef<\/code> hunc fasciculum legit.<\/span> <span class=\"sg\" data-s=\"6\">Itaque scit quid installare debeat.<\/span> <span class=\"sg\" data-s=\"7\">Etiam scit quomodo partes inter se conveniant.<\/span> <span class=\"sg\" data-s=\"8\">Fortasse modulum tuum edere vis.<\/span> <span class=\"sg\" data-s=\"9\">Tum ei rectum <code>META6.json<\/code> da.<\/span> <span class=\"sg\" data-s=\"10\">Hoc fasciculo omnes alii modulum tuum installare possunt.<\/span><\/p>"]]}}}</script>
