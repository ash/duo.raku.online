<script type="application/json" id="page-data">{"u":"advanced/anonymous-subroutines","n":683,"k":"section","pv":"advanced/nested-subroutines/quiz","nx":"advanced/anonymous-subroutines/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Anonymous subroutines","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A subroutine does not need a name.<\/span> <span class=\"sg\" data-s=\"1\">A subroutine without a name is <em>anonymous<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You write it like a normal subroutine, only with no name.<\/span> <span class=\"sg\" data-s=\"3\">Usually, you keep it in a variable.<\/span> <span class=\"sg\" data-s=\"4\">Then you can call it later.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$double<\/code> has the subroutine in it.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> calls the subroutine with the argument <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy blocks<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku has a shorter way to write the same thing.<\/span> <span class=\"sg\" data-s=\"1\">It is the <em>pointy block<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">It has an arrow, <code>-&gt;<\/code>, before the parameters.<\/span> <span class=\"sg\" data-s=\"3\">You do not need the word <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">You do not need parentheses around the parameters either:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is how people usually write a small anonymous subroutine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>&amp;<\/code> sigil<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Maybe you want a name for the call, not a <code>$<\/code> variable.<\/span> <span class=\"sg\" data-s=\"1\">Then create the variable with the <code>&amp;<\/code> sigil.<\/span> <span class=\"sg\" data-s=\"2\">Now you can call it without the sigil.<\/span> <span class=\"sg\" data-s=\"3\">It works just like a normal subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Giving it to another function<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You do not have to keep an anonymous subroutine in a variable.<\/span> <span class=\"sg\" data-s=\"1\">It is just a value.<\/span> <span class=\"sg\" data-s=\"2\">So you can give it directly to a function.<\/span> <span class=\"sg\" data-s=\"3\">Some functions need such a value, for example, <code>map<\/code>, <code>grep<\/code>, or <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Here, the pointy block is the anonymous subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> calls it once for each element.<\/span> <span class=\"sg\" data-s=\"2\">In fact, you already do this all the time.<\/span> <span class=\"sg\" data-s=\"3\">You often give a <code>{ ... }<\/code> block or <code>-&gt; $x { ... }<\/code> to <code>map<\/code> and <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Each of them is a small anonymous subroutine.<\/span> <span class=\"sg\" data-s=\"5\">You write it right where you need it.<\/span> <span class=\"sg\" data-s=\"6\">You do not give it a name first.<\/span><\/p>"]]},"de":{"t":"Anonyme Unterprogramme","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine braucht keinen Namen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Subroutine ohne Namen ist <em>anonym<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Sie schreiben sie wie eine normale Subroutine, nur ohne Namen.<\/span> <span class=\"sg\" data-s=\"3\">Meistens speichern Sie sie in einer Variablen.<\/span> <span class=\"sg\" data-s=\"4\">Dann können Sie sie später aufrufen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$double<\/code> enthält die Subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> ruft die Subroutine mit dem Argument <code>5<\/code> auf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy Blocks<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In Raku geht dasselbe auch kürzer.<\/span> <span class=\"sg\" data-s=\"1\">Das ist der <em>Pointy Block<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Er hat einen Pfeil, <code>-&gt;<\/code>, vor den Parametern.<\/span> <span class=\"sg\" data-s=\"3\">Sie brauchen das Wort <code>sub<\/code> nicht.<\/span> <span class=\"sg\" data-s=\"4\">Sie brauchen auch keine Klammern um die Parameter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So schreibt man meistens eine kleine anonyme Subroutine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das <code>&amp;<\/code>-Sigil<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vielleicht wollen Sie beim Aufruf einen Namen, keine <code>$<\/code>-Variable.<\/span> <span class=\"sg\" data-s=\"1\">Dann erstellen Sie die Variable mit dem <code>&amp;<\/code>-Sigil.<\/span> <span class=\"sg\" data-s=\"2\">Jetzt können Sie sie ohne Sigil aufrufen.<\/span> <span class=\"sg\" data-s=\"3\">Das funktioniert genau wie bei einer normalen Subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">An eine andere Funktion geben<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie müssen eine anonyme Subroutine nicht in einer Variablen speichern.<\/span> <span class=\"sg\" data-s=\"1\">Sie ist nur ein Wert.<\/span> <span class=\"sg\" data-s=\"2\">Also können Sie sie direkt an eine Funktion übergeben.<\/span> <span class=\"sg\" data-s=\"3\">Manche Funktionen brauchen so einen Wert, zum Beispiel <code>map<\/code>, <code>grep<\/code> oder <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier ist der Pointy Block die anonyme Subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> ruft sie für jedes Element einmal auf.<\/span> <span class=\"sg\" data-s=\"2\">Eigentlich machen Sie das schon die ganze Zeit.<\/span> <span class=\"sg\" data-s=\"3\">Sie übergeben oft einen <code>{ ... }<\/code>-Block oder <code>-&gt; $x { ... }<\/code> an <code>map<\/code> und <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Jeder davon ist eine kleine anonyme Subroutine.<\/span> <span class=\"sg\" data-s=\"5\">Sie schreiben sie genau dort, wo Sie sie brauchen.<\/span> <span class=\"sg\" data-s=\"6\">Sie geben ihr vorher keinen Namen.<\/span><\/p>"]]},"nl":{"t":"Anonieme subroutines","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een subroutine heeft geen naam nodig.<\/span> <span class=\"sg\" data-s=\"1\">Een subroutine zonder naam is <em>anoniem<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft hem als een gewone subroutine, alleen zonder naam.<\/span> <span class=\"sg\" data-s=\"3\">Meestal bewaar je hem in een variabele.<\/span> <span class=\"sg\" data-s=\"4\">Dan kun je hem later aanroepen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In de variabele <code>$double<\/code> zit de subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> roept de subroutine aan met het argument <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy blocks<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een kortere manier om hetzelfde te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het <em>pointy block<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Het heeft een pijl, <code>-&gt;<\/code>, voor de parameters.<\/span> <span class=\"sg\" data-s=\"3\">Je hebt het woord <code>sub<\/code> niet nodig.<\/span> <span class=\"sg\" data-s=\"4\">Je hebt ook geen haakjes rond de parameters nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zo schrijven mensen meestal een kleine anonieme subroutine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De <code>&amp;<\/code>-sigil<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Misschien wil je bij de aanroep een naam, geen <code>$<\/code>-variabele.<\/span> <span class=\"sg\" data-s=\"1\">Maak de variabele dan met de <code>&amp;<\/code>-sigil.<\/span> <span class=\"sg\" data-s=\"2\">Nu kun je hem zonder sigil aanroepen.<\/span> <span class=\"sg\" data-s=\"3\">Het werkt net als een gewone subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aan een andere functie geven<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je hoeft een anonieme subroutine niet in een variabele te bewaren.<\/span> <span class=\"sg\" data-s=\"1\">Het is gewoon een waarde.<\/span> <span class=\"sg\" data-s=\"2\">Dus kun je hem direct aan een functie geven.<\/span> <span class=\"sg\" data-s=\"3\">Sommige functies hebben zo'n waarde nodig, bijvoorbeeld <code>map<\/code>, <code>grep<\/code> of <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier is het pointy block de anonieme subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> roept het een keer aan voor elk element.<\/span> <span class=\"sg\" data-s=\"2\">Eigenlijk doe je dit al de hele tijd.<\/span> <span class=\"sg\" data-s=\"3\">Je geeft vaak een <code>{ ... }<\/code>-blok of <code>-&gt; $x { ... }<\/code> aan <code>map<\/code> en <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Elk daarvan is een kleine anonieme subroutine.<\/span> <span class=\"sg\" data-s=\"5\">Je schrijft hem precies waar je hem nodig hebt.<\/span> <span class=\"sg\" data-s=\"6\">Je geeft hem niet eerst een naam.<\/span><\/p>"]]},"es":{"t":"Subrutinas anónimas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una subrutina no necesita un nombre.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina sin nombre es <em>anónima<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La escribes como una subrutina normal, solo que sin nombre.<\/span> <span class=\"sg\" data-s=\"3\">Normalmente, la guardas en una variable.<\/span> <span class=\"sg\" data-s=\"4\">Así puedes llamarla más tarde.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$double<\/code> tiene la subrutina dentro.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> llama a la subrutina con el argumento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bloques puntiagudos<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku tiene una forma más corta de escribir lo mismo.<\/span> <span class=\"sg\" data-s=\"1\">Es el <em>bloque puntiagudo<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tiene una flecha, <code>-&gt;<\/code>, antes de los parámetros.<\/span> <span class=\"sg\" data-s=\"3\">No necesitas la palabra <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tampoco necesitas paréntesis alrededor de los parámetros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Normalmente, la gente escribe así una subrutina anónima pequeña.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El sigilo <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quizás quieres un nombre para la llamada, no una variable <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces crea la variable con el sigilo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ahora puedes llamarla sin el sigilo.<\/span> <span class=\"sg\" data-s=\"3\">Funciona igual que una subrutina normal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Darla a otra función<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">No tienes que guardar una subrutina anónima en una variable.<\/span> <span class=\"sg\" data-s=\"1\">Es solo un valor.<\/span> <span class=\"sg\" data-s=\"2\">Así que puedes darla directamente a una función.<\/span> <span class=\"sg\" data-s=\"3\">Algunas funciones necesitan un valor así, por ejemplo, <code>map<\/code>, <code>grep<\/code> o <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Aquí, el bloque puntiagudo es la subrutina anónima.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> la llama una vez para cada elemento.<\/span> <span class=\"sg\" data-s=\"2\">De hecho, ya haces esto todo el tiempo.<\/span> <span class=\"sg\" data-s=\"3\">A menudo das un bloque <code>{ ... }<\/code> o <code>-&gt; $x { ... }<\/code> a <code>map<\/code> y <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Cada uno de ellos es una pequeña subrutina anónima.<\/span> <span class=\"sg\" data-s=\"5\">La escribes justo donde la necesitas.<\/span> <span class=\"sg\" data-s=\"6\">No le das un nombre antes.<\/span><\/p>"]]},"it":{"t":"Subroutine anonime","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una subroutine non ha bisogno di un nome.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine senza nome è <em>anonima<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La scrivi come una subroutine normale, solo senza nome.<\/span> <span class=\"sg\" data-s=\"3\">Di solito la tieni in una variabile.<\/span> <span class=\"sg\" data-s=\"4\">Poi puoi chiamarla più tardi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$double<\/code> contiene la subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> chiama la subroutine con l'argomento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Blocchi a freccia<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ha un modo più breve per scrivere la stessa cosa.<\/span> <span class=\"sg\" data-s=\"1\">È il <em>blocco a freccia<\/em> (pointy block).<\/span> <span class=\"sg\" data-s=\"2\">Ha una freccia, <code>-&gt;<\/code>, prima dei parametri.<\/span> <span class=\"sg\" data-s=\"3\">Non ti serve la parola <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Non ti servono neanche le parentesi intorno ai parametri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Di solito una piccola subroutine anonima si scrive così.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il sigillo <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Forse vuoi usare un nome per la chiamata, non una variabile <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora crea la variabile con il sigillo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ora puoi chiamarla senza il sigillo.<\/span> <span class=\"sg\" data-s=\"3\">Funziona proprio come una subroutine normale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Darla a un'altra funzione<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Non devi per forza tenere una subroutine anonima in una variabile.<\/span> <span class=\"sg\" data-s=\"1\">È solo un valore.<\/span> <span class=\"sg\" data-s=\"2\">Quindi puoi darla direttamente a una funzione.<\/span> <span class=\"sg\" data-s=\"3\">Alcune funzioni hanno bisogno di un valore così, per esempio <code>map<\/code>, <code>grep<\/code> o <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Qui il blocco a freccia è la subroutine anonima.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> lo chiama una volta per ogni elemento.<\/span> <span class=\"sg\" data-s=\"2\">In realtà, lo fai già di continuo.<\/span> <span class=\"sg\" data-s=\"3\">Spesso dai un blocco <code>{ ... }<\/code> o <code>-&gt; $x { ... }<\/code> a <code>map<\/code> e <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ognuno di questi è una piccola subroutine anonima.<\/span> <span class=\"sg\" data-s=\"5\">La scrivi proprio dove ti serve.<\/span> <span class=\"sg\" data-s=\"6\">Non le dai prima un nome.<\/span><\/p>"]]},"lv":{"t":"Anonīmas apakšprogrammas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammai nav vajadzīgs nosaukums.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogramma bez nosaukuma ir <em>anonīma<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to rakstāt kā parastu apakšprogrammu, tikai bez nosaukuma.<\/span> <span class=\"sg\" data-s=\"3\">Parasti jūs to glabājat mainīgajā.<\/span> <span class=\"sg\" data-s=\"4\">Tad jūs varat to izsaukt vēlāk.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgajā <code>$double<\/code> ir apakšprogramma.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> izsauc šo apakšprogrammu ar argumentu <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bultiņu bloki<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir īsāks veids, kā uzrakstīt to pašu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir <em>bultiņas bloks<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tam pirms parametriem ir bultiņa <code>-&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vārds <code>sub<\/code> nav vajadzīgs.<\/span> <span class=\"sg\" data-s=\"4\">Iekavas ap parametriem arī nav vajadzīgas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā parasti raksta mazu anonīmu apakšprogrammu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sigils <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Varbūt jūs gribat izsaukumā lietot nosaukumu, nevis <code>$<\/code> mainīgo.<\/span> <span class=\"sg\" data-s=\"1\">Tad izveidojiet mainīgo ar sigilu <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tagad jūs varat to izsaukt bez sigila.<\/span> <span class=\"sg\" data-s=\"3\">Tas darbojas tieši kā parasta apakšprogramma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kā to iedot citai funkcijai<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Anonīma apakšprogramma nav obligāti jāglabā mainīgajā.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir vienkārši vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat to iedot tieši funkcijai.<\/span> <span class=\"sg\" data-s=\"3\">Dažām funkcijām vajag šādu vērtību, piemēram, <code>map<\/code>, <code>grep<\/code> vai <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šeit bultiņas bloks ir anonīmā apakšprogramma.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> to izsauc vienu reizi katram elementam.<\/span> <span class=\"sg\" data-s=\"2\">Patiesībā jūs to darāt jau visu laiku.<\/span> <span class=\"sg\" data-s=\"3\">Jūs bieži iedodat <code>map<\/code> un <code>grep<\/code> bloku <code>{ ... }<\/code> vai <code>-&gt; $x { ... }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Katrs no tiem ir maza anonīma apakšprogramma.<\/span> <span class=\"sg\" data-s=\"5\">Jūs to rakstāt tieši tur, kur tā vajadzīga.<\/span> <span class=\"sg\" data-s=\"6\">Jūs tai vispirms nedodat nosaukumu.<\/span><\/p>"]]},"ru":{"t":"Анонимные подпрограммы","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Подпрограмме не нужно имя.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограмма без имени — <em>анонимная<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вы пишете её как обычную подпрограмму, только без имени.<\/span> <span class=\"sg\" data-s=\"3\">Обычно вы храните её в переменной.<\/span> <span class=\"sg\" data-s=\"4\">Тогда её можно вызвать позже.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$double<\/code> хранит подпрограмму.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> вызывает подпрограмму с аргументом <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Остроконечные блоки<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku можно записать то же самое короче.<\/span> <span class=\"sg\" data-s=\"1\">Это <em>остроконечный блок<\/em> (pointy block).<\/span> <span class=\"sg\" data-s=\"2\">Перед параметрами у него стоит стрелка <code>-&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Слово <code>sub<\/code> не нужно.<\/span> <span class=\"sg\" data-s=\"4\">Скобки вокруг параметров тоже не нужны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так обычно пишут небольшую анонимную подпрограмму.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигил <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Может быть, для вызова вам нужно имя, а не переменная с <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда создайте переменную с сигилом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Теперь её можно вызвать без сигила.<\/span> <span class=\"sg\" data-s=\"3\">Это работает так же, как обычная подпрограмма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передаём её другой функции<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Анонимную подпрограмму не обязательно хранить в переменной.<\/span> <span class=\"sg\" data-s=\"1\">Это просто значение.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому её можно сразу передать функции.<\/span> <span class=\"sg\" data-s=\"3\">Некоторым функциям нужно такое значение, например <code>map<\/code>, <code>grep<\/code> или <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Здесь остроконечный блок — это анонимная подпрограмма.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> вызывает его один раз для каждого элемента.<\/span> <span class=\"sg\" data-s=\"2\">На самом деле вы делаете это постоянно.<\/span> <span class=\"sg\" data-s=\"3\">Вы часто передаёте в <code>map<\/code> и <code>grep<\/code> блок <code>{ ... }<\/code> или <code>-&gt; $x { ... }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Каждый из них — небольшая анонимная подпрограмма.<\/span> <span class=\"sg\" data-s=\"5\">Вы пишете её прямо там, где она нужна.<\/span> <span class=\"sg\" data-s=\"6\">Вы не даёте ей имя заранее.<\/span><\/p>"]]},"uk":{"t":"Анонімні підпрограми","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Підпрограмі не потрібне ім'я.<\/span> <span class=\"sg\" data-s=\"1\">Підпрограма без імені — <em>анонімна<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете її як звичайну підпрограму, тільки без імені.<\/span> <span class=\"sg\" data-s=\"3\">Зазвичай ви тримаєте її у змінній.<\/span> <span class=\"sg\" data-s=\"4\">Тоді ви можете викликати її пізніше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У змінній <code>$double<\/code> є підпрограма.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> викликає підпрограму з аргументом <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стрілочні блоки<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У Raku є коротший спосіб записати те саме.<\/span> <span class=\"sg\" data-s=\"1\">Це <em>стрілочний блок<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Перед параметрами в ньому стоїть стрілка, <code>-&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Слово <code>sub<\/code> вам не потрібне.<\/span> <span class=\"sg\" data-s=\"4\">Дужки навколо параметрів теж не потрібні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так зазвичай пишуть невелику анонімну підпрограму.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигіл <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можливо, для виклику ви хочете ім'я, а не змінну з <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді створіть змінну з сигілом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тепер ви можете викликати її без сигіла.<\/span> <span class=\"sg\" data-s=\"3\">Це працює так само, як звичайна підпрограма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Як дати її іншій функції<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вам не треба тримати анонімну підпрограму у змінній.<\/span> <span class=\"sg\" data-s=\"1\">Це просто значення.<\/span> <span class=\"sg\" data-s=\"2\">Тож ви можете дати її прямо функції.<\/span> <span class=\"sg\" data-s=\"3\">Деяким функціям потрібне таке значення, наприклад, <code>map<\/code>, <code>grep<\/code> або <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тут стрілочний блок і є анонімною підпрограмою.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> викликає її один раз для кожного елемента.<\/span> <span class=\"sg\" data-s=\"2\">Насправді ви вже робите це весь час.<\/span> <span class=\"sg\" data-s=\"3\">Ви часто даєте блок <code>{ ... }<\/code> або <code>-&gt; $x { ... }<\/code> функціям <code>map<\/code> і <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Кожен із них — невелика анонімна підпрограма.<\/span> <span class=\"sg\" data-s=\"5\">Ви пишете її прямо там, де вона потрібна.<\/span> <span class=\"sg\" data-s=\"6\">Спочатку ви не даєте їй імені.<\/span><\/p>"]]},"bg":{"t":"Анонимни подпрограми","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата не се нуждае от име.<\/span> <span class=\"sg\" data-s=\"1\">Подпрограма без име е <em>анонимна<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Пишете я като обикновена подпрограма, само без име.<\/span> <span class=\"sg\" data-s=\"3\">Обикновено я пазите в променлива.<\/span> <span class=\"sg\" data-s=\"4\">Тогава можете да я извикате по-късно.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$double<\/code> съдържа подпрограмата.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> извиква подпрограмата с аргумента <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стрелкови блокове<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku има по-кратък начин да запишете същото.<\/span> <span class=\"sg\" data-s=\"1\">Това е <em>стрелковият блок<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Той има стрелка, <code>-&gt;<\/code>, преди параметрите.<\/span> <span class=\"sg\" data-s=\"3\">Не ви трябва думата <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Не ви трябват и скоби около параметрите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така хората обикновено пишат малка анонимна подпрограма.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигилът <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Може би за извикването искате име, а не променлива с <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава създайте променливата със сигила <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сега можете да я извикате без сигила.<\/span> <span class=\"sg\" data-s=\"3\">Това работи точно като обикновена подпрограма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Даваме я на друга функция<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Не е нужно да пазите анонимната подпрограма в променлива.<\/span> <span class=\"sg\" data-s=\"1\">Тя е просто стойност.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да я дадете направо на функция.<\/span> <span class=\"sg\" data-s=\"3\">Някои функции искат такава стойност, например <code>map<\/code>, <code>grep<\/code> или <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тук стрелковият блок е анонимната подпрограма.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> я извиква веднъж за всеки елемент.<\/span> <span class=\"sg\" data-s=\"2\">Всъщност вие правите това през цялото време.<\/span> <span class=\"sg\" data-s=\"3\">Често давате блок <code>{ ... }<\/code> или <code>-&gt; $x { ... }<\/code> на <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всеки от тях е малка анонимна подпрограма.<\/span> <span class=\"sg\" data-s=\"5\">Пишете я точно там, където ви трябва.<\/span> <span class=\"sg\" data-s=\"6\">Не ѝ давате име преди това.<\/span><\/p>"]]},"eo":{"t":"Anonimaj subrutinaj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Subrutino ne bezonas nomon.<\/span> <span class=\"sg\" data-s=\"1\">Subrutino sen nomo estas <em>anonima<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas ĝin kiel ordinaran subrutinon, nur sen nomo.<\/span> <span class=\"sg\" data-s=\"3\">Kutime vi konservas ĝin en variablo.<\/span> <span class=\"sg\" data-s=\"4\">Tiam vi povas voki ĝin poste.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$double<\/code> enhavas la subrutinon.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> vokas la subrutinon kun la argumento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pintaj blokoj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku havas pli mallongan manieron skribi la samon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la <em>pinta bloko<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi havas sagon, <code>-&gt;<\/code>, antaŭ la parametroj.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne bezonas la vorton <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ ne bezonas krampojn ĉirkaŭ la parametroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tiel oni kutime skribas malgrandan anoniman subrutinon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La sigelo <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eble vi volas nomon por la voko, ne <code>$<\/code>-variablon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam kreu la variablon kun la sigelo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nun vi povas voki ĝin sen la sigelo.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi funkcias same kiel ordinara subrutino:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Doni ĝin al alia funkcio<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ne devas konservi anoniman subrutinon en variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas nur valoro.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas doni ĝin rekte al funkcio.<\/span> <span class=\"sg\" data-s=\"3\">Kelkaj funkcioj bezonas tian valoron, ekzemple <code>map<\/code>, <code>grep<\/code> aŭ <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la pinta bloko estas la anonima subrutino.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> vokas ĝin unufoje por ĉiu elemento.<\/span> <span class=\"sg\" data-s=\"2\">Fakte, vi jam faras tion la tutan tempon.<\/span> <span class=\"sg\" data-s=\"3\">Vi ofte donas <code>{ ... }<\/code>-blokon aŭ <code>-&gt; $x { ... }<\/code> al <code>map<\/code> kaj <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu el ili estas malgranda anonima subrutino.<\/span> <span class=\"sg\" data-s=\"5\">Vi skribas ĝin ĝuste tie, kie vi bezonas ĝin.<\/span> <span class=\"sg\" data-s=\"6\">Vi ne donas al ĝi nomon unue.<\/span><\/p>"]]},"la":{"t":"Subprogrammata anonyma","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Subroutina nomine non eget.<\/span> <span class=\"sg\" data-s=\"1\">Subroutina sine nomine <em>anonyma<\/em> est.<\/span> <span class=\"sg\" data-s=\"2\">Eam sicut subroutinam ordinariam scribis, sed sine nomine.<\/span> <span class=\"sg\" data-s=\"3\">Plerumque eam in variabili servas.<\/span> <span class=\"sg\" data-s=\"4\">Tum eam postea vocare potes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$double<\/code> subroutinam continet.<\/span> <span class=\"sg\" data-s=\"1\"><code>$double(5)<\/code> subroutinam cum argumento <code>5<\/code> vocat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cuspides acutae<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In Raku idem brevius scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Haec est <em>cuspis acuta<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Sagittam <code>-&gt;<\/code> ante parametros habet.<\/span> <span class=\"sg\" data-s=\"3\">Verbum <code>sub<\/code> non necessarium est.<\/span> <span class=\"sg\" data-s=\"4\">Neque parentheses circa parametros necessariae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sic homines plerumque parvam subroutinam anonymam scribunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sigillum <code>&amp;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fortasse nomen ad vocationem vis, non variabilem <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum variabilem cum sigillo <code>&amp;<\/code> crea.<\/span> <span class=\"sg\" data-s=\"2\">Nunc eam sine sigillo vocare potes.<\/span> <span class=\"sg\" data-s=\"3\">Sicut subroutina ordinaria operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eam alii functioni dare<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subroutinam anonymam in variabili servare non necesse est.<\/span> <span class=\"sg\" data-s=\"1\">Ea est tantum valor.<\/span> <span class=\"sg\" data-s=\"2\">Itaque eam recta functioni dare potes.<\/span> <span class=\"sg\" data-s=\"3\">Quaedam functiones talem valorem requirunt, exempli gratia <code>map<\/code>, <code>grep<\/code> vel <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hic cuspis acuta est subroutina anonyma.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> eam semel pro quoque elemento vocat.<\/span> <span class=\"sg\" data-s=\"2\">Re vera hoc iam semper facis.<\/span> <span class=\"sg\" data-s=\"3\">Saepe clausuram <code>{ ... }<\/code> vel <code>-&gt; $x { ... }<\/code> ad <code>map<\/code> et <code>grep<\/code> das.<\/span> <span class=\"sg\" data-s=\"4\">Quaeque earum parva subroutina anonyma est.<\/span> <span class=\"sg\" data-s=\"5\">Eam ibi scribis ubi opus est.<\/span> <span class=\"sg\" data-s=\"6\">Nomen ei prius non das.<\/span><\/p>"]]}}}</script>
