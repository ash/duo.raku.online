<span class=\"sg\" data-s=\"3\">All values of a type <em>share<\/em> one metaobject.<\/span> <span class=\"sg\" data-s=\"4\">The methods of the metaobject are meta-methods.<\/span> <span class=\"sg\" data-s=\"5\">A meta-method must know which object you ask about.<\/span> <span class=\"sg\" data-s=\"6\">The form <code>.^<\/code> passes the object for you.<\/span> <span class=\"sg\" data-s=\"7\">For <code>name<\/code>, Raku does not use this argument.<\/span> <span class=\"sg\" data-s=\"8\">But the right, general way is to pass it.<\/span> <span class=\"sg\" data-s=\"9\">Some meta-methods do use it.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This is also true for other meta-methods.<\/span> <span class=\"sg\" data-s=\"1\">One example is <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It gives a list of methods.<\/span> <span class=\"sg\" data-s=\"3\">You can call these methods on the value.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> returns the <em>package<\/em> of a name.<\/span> <span class=\"sg\" data-s=\"1\">It is a table of the names, or symbols, in that namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">A <code>Stash<\/code> is a hash for a table of symbols.<\/span> <span class=\"sg\" data-s=\"1\">It is useful with modules.<\/span> <span class=\"sg\" data-s=\"2\">With it, you can look up the names of a module.<\/span> <span class=\"sg\" data-s=\"3\">We come back to it in <a href=\"/advanced/module-introspection/\">the section about modules<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">For now, just remember that <code>WHO<\/code> exists.<\/span> <span class=\"sg\" data-s=\"5\">Also remember what it gives you.<\/span><\/p>"]]},"de":{"t":"<code>WHO<\/code> und <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s= "6\">Die Form <code>.^<\/code> übergibt das Objekt für dich.<\/span> <span class=\"sg\" data-s=\"7\">Bei <code>name<\/code> verwendet Raku dieses Argument nicht.<\/span> <span class=\"sg\" data-s=\"8\">Aber der richtige, allgemeine Weg ist, das Argument zu übergeben.<\/span> <span class=\"sg\" data-s=\"9\">Manche Meta-Methoden verwenden es wirklich.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das gilt auch für andere Meta-Methoden.<\/span> <span class=\"sg\" data-s=\"1\">Ein Beispiel ist <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es liefert eine Liste von Methoden.<\/span> <span class=\"sg\" data-s=\"3\">Diese Methoden kannst du auf dem Wert aufrufen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> gibt das <em>Paket<\/em> eines Namens zurück.<\/span> <span class=\"sg\" data-s=\"1\">Das ist eine Tabelle mit den Namen, oder Symbolen, in diesem Namensraum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Stash<\/code> ist ein Hash für eine Tabelle von Symbolen.<\/span> <span class=\"sg\" data-s=\"1\">Er ist bei Modulen nützlich.<\/span> <span class=\"sg\" data-s=\"2\">Mit ihm kannst du die Namen eines Moduls nachschlagen.<\/span> <span class=\"sg\" data-s=\"3\">Wir kommen im <a href=\"https://course.raku.org/de/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Module<\/a> darauf zurück.<\/span> <span class=\"sg\" data-s=\"4\">Merk dir für den Moment nur, dass <code>WHO<\/code> existiert.<\/span> <span class=\"sg\" data-s=\"5\">Merk dir auch, was es dir liefert.<\/span><\/p>"]]},"nl":{"t":"<code>WHO<\/code> en <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nog twee tools voor introspectie zijn <code>HOW<\/code> en <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze maken de set compleet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Achter elke waarde in Raku zit een <em>metaobject<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Een metaobject is een object.<\/span> <span class=\"sg\" data-s=\"2\">Het weet hoe het type van de waarde werkt.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> is kort voor <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Het geeft het metaobject terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je gebruikt het metaobject al.<\/span> <span class=\"sg\" data-s=\"1\">Misschien heb je het niet gemerkt.<\/span> <span class=\"sg\" data-s=\"2\">De <code>.^<\/code> in <code>.^name<\/code> is een methode-aanroep.<\/span> <span class=\"sg\" data-s=\"3\">Deze aanroep gaat via <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Deze twee regels doen hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Dus is <code>$x.^name<\/code> alleen een korte manier om <code>$x.HOW.name($x)<\/code> te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Let op: het object gaat er opnieuw in als argument.<\/span> <span class=\"sg\" data-s=\"2\">Waarom?<\/span> <span class=\"sg\" data-s=\"3\">Alle waarden van een type <em>delen<\/em> één metaobject.<\/span> <span class=\"sg\" data-s=\"4\">De methodes van het metaobject zijn meta-methodes.<\/span> <span class=\"sg\" data-s=\"5\">Een meta-methode moet weten naar welk object je vraagt.<\/span> <span class=\"sg\" data-s=\"6\">De vorm <code>.^<\/code> geeft het object voor je mee.<\/span> <span class=\"sg\" data-s=\"7\">Voor <code>name<\/code> gebruikt Raku dit argument niet.<\/span> <span class=\"sg\" data-s=\"8\">Maar de juiste, algemene manier is om het mee te geven.<\/span> <span class=\"sg\" data-s=\"9\">Sommige meta-methodes gebruiken het wel.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit geldt ook voor andere meta-methodes.<\/span> <span class=\"sg\" data-s=\"1\">Een voorbeeld is <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die geeft een lijst van methodes.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt deze methodes op de waarde aanroepen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> geeft het <em>package<\/em> van een naam terug.<\/span> <span class=\"sg\" data-s=\"1\">Dat is een tabel met de namen, of symbolen, in die namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <code>Stash<\/code> is een hash voor een tabel met symbolen.<\/span> <span class=\"sg\" data-s=\"1\">Hij is handig bij modules.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt er de namen van een module mee opzoeken.<\/span> <span class=\"sg\" data-s=\"3\">We komen erop terug in <a href=\"https://course.raku.org/nl/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">het gedeelte over modules<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Onthoud voor nu alleen dat <code>WHO<\/code> bestaat.<\/span> <span class=\"sg\" data-s=\"5\">Onthoud ook wat het je geeft.<\/span><\/p>"]]},"es":{"t":"<code>WHO<\/code> y <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Otras dos herramientas de introspección son <code>HOW<\/code> y <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Completan el conjunto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cada valor en Raku tiene un <em>metaobjeto<\/em> detrás.<\/span> <span class=\"sg\" data-s=\"1\">Un metaobjeto es un objeto.<\/span> <span class=\"sg\" data-s=\"2\">Sabe cómo funciona el tipo del valor.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> es la forma corta de <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Devuelve el metaobjeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ya usas el metaobjeto.<\/span> <span class=\"sg\" data-s=\"1\">Quizás no lo notaste.<\/span> <span class=\"sg\" data-s=\"2\">El <code>.^<\/code> en <code>.^name<\/code> es una llamada a un método.<\/span> <span class=\"sg\" data-s=\"3\">Esta llamada pasa por <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Estas dos líneas hacen lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Así que <code>$x.^name<\/code> es solo una forma corta de escribir <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Observa que el objeto entra otra vez como argumento.<\/span> <span class=\"sg\" data-s=\"2\">¿Por qué?<\/span> <span class=\"sg\" data-s=\"3\">Todos los valores de un tipo <em>comparten<\/em> un metaobjeto.<\/span> <span class=\"sg\" data-s=\"4\">Los métodos del metaobjeto son meta-métodos.<\/span> <span class=\"sg\" data-s=\"5\">Un meta-método debe saber por qué objeto preguntas.<\/span> <span class=\"sg\" data-s=\"6\">La forma <code>.^<\/code> pasa el objeto por ti.<\/span> <span class=\"sg\" data-s=\"7\">Para <code>name<\/code>, Raku no usa este argumento.<\/span> <span class=\"sg\" data-s=\"8\">Pero la forma correcta y general es pasarlo.<\/span> <span class=\"sg\" data-s=\"9\">Algunos meta-métodos sí lo usan.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esto también vale para otros meta-métodos.<\/span> <span class=\"sg\" data-s=\"1\">Un ejemplo es <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Da una lista de métodos.<\/span> <span class=\"sg\" data-s=\"3\">Puedes llamar a estos métodos sobre el valor.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> devuelve el <em>paquete<\/em> de un nombre.<\/span> <span class=\"sg\" data-s=\"1\">Es una tabla de los nombres, o símbolos, de ese espacio de nombres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <code>Stash<\/code> es un hash para una tabla de símbolos.<\/span> <span class=\"sg\" data-s=\"1\">Es útil con los módulos.<\/span> <span class=\"sg\" data-s=\"2\">Con él, puedes buscar los nombres de un módulo.<\/span> <span class=\"sg\" data-s=\"3\">Volvemos a él en <a href=\"https://course.raku.org/es/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">la sección sobre módulos<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Por ahora, solo recuerda que <code>WHO<\/code> existe.<\/span> <span class=\"sg\" data-s=\"5\">Recuerda también qué te da.<\/span><\/p>"]]},"it":{"t":"<code>WHO<\/code> e <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri due strumenti per l'introspezione sono <code>HOW<\/code> e <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Completano l'insieme.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni valore in Raku ha un <em>metaoggetto<\/em> dietro di sé.<\/span> <span class=\"sg\" data-s=\"1\">Un metaoggetto è un oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Sa come funziona il tipo del valore.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> sta per <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Restituisce il metaoggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Usi già il metaoggetto.<\/span> <span class=\"sg\" data-s=\"1\">Forse non te ne sei accorto.<\/span> <span class=\"sg\" data-s=\"2\">Il <code>.^<\/code> in <code>.^name<\/code> è una chiamata di metodo.<\/span> <span class=\"sg\" data-s=\"3\">Questa chiamata passa per <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Queste due righe fanno la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>$x.^name<\/code> è solo un modo breve per scrivere <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che l'oggetto entra di nuovo come argomento.<\/span> <span class=\"sg\" data-s=\"2\">Perché?<\/span> <span class=\"sg\" data-s=\"3\">Tutti i valori di un tipo <em>condividono<\/em> un solo metaoggetto.<\/span> <span class=\"sg\" data-s=\"4\">I metodi del metaoggetto sono meta-metodi.<\/span> <span class=\"sg\" data-s=\"5\">Un meta-metodo deve sapere di quale oggetto chiedi.<\/span> <span class=\"sg\" data-s=\"6\">La forma <code>.^<\/code> passa l'oggetto per te.<\/span> <span class=\"sg\" data-s=\"7\">Per <code>name<\/code>, Raku non usa questo argomento.<\/span> <span class=\"sg\" data-s=\"8\">Ma il modo giusto e generale è passarlo.<\/span> <span class=\"sg\" data-s=\"9\">Alcuni meta-metodi lo usano davvero.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo vale anche per altri meta-metodi.<\/span> <span class=\"sg\" data-s=\"1\">Un esempio è <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dà una lista di metodi.<\/span> <span class=\"sg\" data-s=\"3\">Puoi chiamare questi metodi sul valore.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> restituisce il <em>package<\/em> di un nome.<\/span> <span class=\"sg\" data-s=\"1\">È una tabella dei nomi, o simboli, in quel namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Uno <code>Stash<\/code> è un hash per una tabella di simboli.<\/span> <span class=\"sg\" data-s=\"1\">È utile con i moduli.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi cercare i nomi di un modulo.<\/span> <span class=\"sg\" data-s=\"3\">Ci torniamo nella <a href=\"https://course.raku.org/it/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sezione sui moduli<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Per ora, ricorda solo che <code>WHO<\/code> esiste.<\/span> <span class=\"sg\" data-s=\"5\">Ricorda anche cosa ti dà.<\/span><\/p>"]]},"lv":{"t":"<code>WHO<\/code> un <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vēl divi introspekcijas rīki ir <code>HOW<\/code> un <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tie papildina kopu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aiz katras vērtības Raku valodā ir <em>metaobjekts<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Metaobjekts ir objekts.<\/span> <span class=\"sg\" data-s=\"2\">Tas zina, kā darbojas vērtības tips.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> ir saīsinājums no <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Tas atgriež metaobjektu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs jau izmantojat metaobjektu.<\/span> <span class=\"sg\" data-s=\"1\">Varbūt jūs to nepamanījāt.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^<\/code> izsaukumā <code>.^name<\/code> ir metodes izsaukums.<\/span> <span class=\"sg\" data-s=\"3\">Šis izsaukums iet caur <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Šīs divas rindas dara vienu un to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>$x.^name<\/code> ir tikai īss veids, kā uzrakstīt <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka objekts vēlreiz nonāk iekšā kā arguments.<\/span> <span class=\"sg\" data-s=\"2\">Kāpēc?<\/span> <span class=\"sg\" data-s=\"3\">Visām tipa vērtībām ir <em>kopīgs<\/em> viens metaobjekts.<\/span> <span class=\"sg\" data-s=\"4\">Metaobjekta metodes ir metametodes.<\/span> <span class=\"sg\" data-s=\"5\">Metametodei jāzina, par kuru objektu jūs jautājat.<\/span> <span class=\"sg\" data-s=\"6\">Forma <code>.^<\/code> padod objektu jūsu vietā.<\/span> <span class=\"sg\" data-s=\"7\">Metodei <code>name<\/code> Raku šo argumentu neizmanto.<\/span> <span class=\"sg\" data-s=\"8\">Bet pareizais, vispārīgais veids ir to padot.<\/span> <span class=\"sg\" data-s=\"9\">Dažas metametodes to tiešām izmanto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas attiecas arī uz citām metametodēm.<\/span> <span class=\"sg\" data-s=\"1\">Viens piemērs ir <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā dod metožu sarakstu.<\/span> <span class=\"sg\" data-s=\"3\">Šīs metodes jūs varat izsaukt uz vērtības.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> atgriež nosaukuma <em>pakotni<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir nosaukumu jeb simbolu tabula šajā vārdtelpā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> ir hešs simbolu tabulai.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir noderīgs darbā ar moduļiem.<\/span> <span class=\"sg\" data-s=\"2\">Ar to jūs varat atrast moduļa nosaukumus.<\/span> <span class=\"sg\" data-s=\"3\">Mēs pie tā atgriezīsimies <a href=\"https://course.raku.org/lv/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sadaļā par moduļiem<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Pagaidām tikai atcerieties, ka <code>WHO<\/code> pastāv.<\/span> <span class=\"sg\" data-s=\"5\">Atcerieties arī, ko tas jums dod.<\/span><\/p>"]]},"ru":{"t":"<code>WHO<\/code> и <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ещё два инструмента интроспекции — это <code>HOW<\/code> и <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Они завершают набор.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За каждым значением в Raku стоит <em>метаобъект<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Метаобъект — это объект.<\/span> <span class=\"sg\" data-s=\"2\">Он знает, как работает тип значения.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> — это сокращение от <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Он возвращает метаобъект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вы уже пользуетесь метаобъектом.<\/span> <span class=\"sg\" data-s=\"1\">Может быть, вы этого не замечали.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^<\/code> в <code>.^name<\/code> — это вызов метода.<\/span> <span class=\"sg\" data-s=\"3\">Этот вызов идёт через <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Эти две строки делают одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Значит, <code>$x.^name<\/code> — это просто короткая запись <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание: объект снова передаётся как аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Почему?<\/span> <span class=\"sg\" data-s=\"3\">У всех значений типа <em>общий<\/em> метаобъект.<\/span> <span class=\"sg\" data-s=\"4\">Методы метаобъекта — это мета-методы.<\/span> <span class=\"sg\" data-s=\"5\">Мета-метод должен знать, о каком объекте вы спрашиваете.<\/span> <span class=\"sg\" data-s=\"6\">Форма <code>.^<\/code> передаёт объект за вас.<\/span> <span class=\"sg\" data-s=\"7\">Для <code>name<\/code> Raku не использует этот аргумент.<\/span> <span class=\"sg\" data-s=\"8\">Но правильный, общий способ — передавать его.<\/span> <span class=\"sg\" data-s=\"9\">Некоторые мета-методы его используют.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Это верно и для других мета-методов.<\/span> <span class=\"sg\" data-s=\"1\">Один пример — <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он даёт список методов.<\/span> <span class=\"sg\" data-s=\"3\">Эти методы можно вызвать у значения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> возвращает <em>пакет<\/em> имени.<\/span> <span class=\"sg\" data-s=\"1\">Это таблица имён, или символов, в этом пространстве имён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> — это хеш для таблицы символов.<\/span> <span class=\"sg\" data-s=\"1\">Он полезен при работе с модулями.<\/span> <span class=\"sg\" data-s=\"2\">С ним можно найти имена модуля.<\/span> <span class=\"sg\" data-s=\"3\">Мы вернёмся к нему в <a href=\"https://course.raku.org/ru/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">разделе о модулях<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Пока просто запомните, что <code>WHO<\/code> существует.<\/span> <span class=\"sg\" data-s=\"5\">Ещё запомните, что он вам даёт.<\/span><\/p>"]]},"uk":{"t":"<code>WHO<\/code> та <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ще два інструменти інтроспекції — це <code>HOW<\/code> і <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони завершують набір.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За кожним значенням у Raku стоїть <em>метаоб'єкт<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Метаоб'єкт — це об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Він знає, як працює тип значення.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> — це скорочення від <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Він повертає метаоб'єкт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви вже використовуєте метаоб'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Можливо, ви цього не помітили.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^<\/code> у <code>.^name<\/code> — це виклик методу.<\/span> <span class=\"sg\" data-s=\"3\">Цей виклик іде через <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ці два рядки роблять те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Тож <code>$x.^name<\/code> — це лише короткий запис для <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що об'єкт знову йде як аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Чому?<\/span> <span class=\"sg\" data-s=\"3\">Усі значення типу мають один <em>спільний<\/em> метаоб'єкт.<\/span> <span class=\"sg\" data-s=\"4\">Методи метаоб'єкта — це метаметоди.<\/span> <span class=\"sg\" data-s=\"5\">Метаметод має знати, про який об'єкт ви питаєте.<\/span> <span class=\"sg\" data-s=\"6\">Форма <code>.^<\/code> передає об'єкт за вас.<\/span> <span class=\"sg\" data-s=\"7\">Для <code>name<\/code> Raku не використовує цей аргумент.<\/span> <span class=\"sg\" data-s=\"8\">Але правильний, загальний спосіб — передавати його.<\/span> <span class=\"sg\" data-s=\"9\">Деякі метаметоди таки його використовують.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Це також стосується інших метаметодів.<\/span> <span class=\"sg\" data-s=\"1\">Один приклад — <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він дає список методів.<\/span> <span class=\"sg\" data-s=\"3\">Ці методи можна викликати для значення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> повертає <em>пакунок<\/em> імені.<\/span> <span class=\"sg\" data-s=\"1\">Це таблиця імен, або символів, у цьому просторі імен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> — це хеш для таблиці символів.<\/span> <span class=\"sg\" data-s=\"1\">Він корисний для роботи з модулями.<\/span> <span class=\"sg\" data-s=\"2\">З ним можна шукати імена модуля.<\/span> <span class=\"sg\" data-s=\"3\">Ми повернемося до нього в <a href=\"https://course.raku.org/uk/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">розділі про модулі<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Поки що просто запам'ятайте, що <code>WHO<\/code> існує.<\/span> <span class=\"sg\" data-s=\"5\">Також запам'ятайте, що він дає.<\/span><\/p>"]]},"bg":{"t":"<code>WHO<\/code> и <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Още два инструмента за интроспекция са <code>HOW<\/code> и <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те допълват набора.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Зад всяка стойност в Raku има <em>метаобект<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Метаобектът е обект.<\/span> <span class=\"sg\" data-s=\"2\">Той знае как работи типът на стойността.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> е съкращение от <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Той връща метаобекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вие вече използвате метаобекта.<\/span> <span class=\"sg\" data-s=\"1\">Може би не сте го забелязали.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^<\/code> в <code>.^name<\/code> е извикване на метод.<\/span> <span class=\"sg\" data-s=\"3\">Това извикване минава през <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тези два реда правят едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Така <code>$x.^name<\/code> е само кратък начин да напишете <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че обектът влиза отново като аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Защо?<\/span> <span class=\"sg\" data-s=\"3\">Всички стойности на даден тип <em>споделят<\/em> един метаобект.<\/span> <span class=\"sg\" data-s=\"4\">Методите на метаобекта са мета-методи.<\/span> <span class=\"sg\" data-s=\"5\">Мета-методът трябва да знае за кой обект питате.<\/span> <span class=\"sg\" data-s=\"6\">Формата <code>.^<\/code> предава обекта вместо вас.<\/span> <span class=\"sg\" data-s=\"7\">За <code>name<\/code> Raku не използва този аргумент.<\/span> <span class=\"sg\" data-s=\"8\">Но правилният, общ начин е да го предавате.<\/span> <span class=\"sg\" data-s=\"9\">Някои мета-методи наистина го използват.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Това важи и за други мета-методи.<\/span> <span class=\"sg\" data-s=\"1\">Един пример е <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той дава списък от методи.<\/span> <span class=\"sg\" data-s=\"3\">Можете да извиквате тези методи върху стойността.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> връща <em>пакета<\/em> на дадено име.<\/span> <span class=\"sg\" data-s=\"1\">Това е таблица на имената, или символите, в това пространство от имена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> е хеш за таблица на символите.<\/span> <span class=\"sg\" data-s=\"1\">Той е полезен при модулите.<\/span> <span class=\"sg\" data-s=\"2\">С него можете да потърсите имената в даден модул.<\/span> <span class=\"sg\" data-s=\"3\">Ще се върнем към него в <a href=\"https://course.raku.org/bg/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">раздела за модулите<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Засега просто запомнете, че <code>WHO<\/code> съществува.<\/span> <span class=\"sg\" data-s=\"5\">Запомнете и какво ви дава той.<\/span><\/p>"]]},"eo":{"t":"<code>WHO<\/code> kaj <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Du pliaj iloj por introspekto estas <code>HOW<\/code> kaj <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili kompletigas la aron.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu valoro en Raku havas <em>metaobjekton<\/em> malantaŭ si.<\/span> <span class=\"sg\" data-s=\"1\">Metaobjekto estas objekto.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi scias, kiel funkcias la tipo de la valoro.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> estas mallongigo de <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi redonas la metaobjekton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzas la metaobjekton.<\/span> <span class=\"sg\" data-s=\"1\">Eble vi ne rimarkis tion.<\/span> <span class=\"sg\" data-s=\"2\">La <code>.^<\/code> en <code>.^name<\/code> estas metod-alvoko.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu alvoko iras tra <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiuj du linioj faras la samon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Do <code>$x.^name<\/code> estas nur mallonga maniero skribi <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Notu, ke la objekto denove eniras kiel argumento.<\/span> <span class=\"sg\" data-s=\"2\">Kial?<\/span> <span class=\"sg\" data-s=\"3\">Ĉiuj valoroj de tipo <em>kunhavas<\/em> unu metaobjekton.<\/span> <span class=\"sg\" data-s=\"4\">La metodoj de la metaobjekto estas meta-metodoj.<\/span> <span class=\"sg\" data-s=\"5\">Meta-metodo devas scii, pri kiu objekto vi demandas.<\/span> <span class=\"sg\" data-s=\"6\">La formo <code>.^<\/code> transdonas la objekton por vi.<\/span> <span class=\"sg\" data-s=\"7\">Por <code>name<\/code>, Raku ne uzas ĉi tiun argumenton.<\/span> <span class=\"sg\" data-s=\"8\">Sed la ĝusta, ĝenerala maniero estas transdoni ĝin.<\/span> <span class=\"sg\" data-s=\"9\">Kelkaj meta-metodoj ja uzas ĝin.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tio estas vera ankaŭ por aliaj meta-metodoj.<\/span> <span class=\"sg\" data-s=\"1\">Unu ekzemplo estas <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi donas liston de metodoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas voki ĉi tiujn metodojn sur la valoro.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> redonas la <em>pakon<\/em> de nomo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas tabelo de la nomoj, aŭ simboloj, en tiu nomspaco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> estas hako por tabelo de simboloj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas utila kun moduloj.<\/span> <span class=\"sg\" data-s=\"2\">Per ĝi, vi povas serĉi la nomojn de modulo.<\/span> <span class=\"sg\" data-s=\"3\">Ni revenas al ĝi en <a href=\"https://course.raku.org/eo/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">la sekcio pri moduloj<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Por nun, simple memoru, ke <code>WHO<\/code> ekzistas.<\/span> <span class=\"sg\" data-s=\"5\">Memoru ankaŭ, kion ĝi donas al vi.<\/span><\/p>"]]},"la":{"t":"<code>WHO<\/code> et <code>HOW<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Duo alia instrumenta introspectionis sunt <code>HOW<\/code> et <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Seriem complent.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Omnis valor in Raku <em>metaobiectum<\/em> post se habet.<\/span> <span class=\"sg\" data-s=\"1\">Metaobiectum est obiectum.<\/span> <span class=\"sg\" data-s=\"2\">Operationem typi valoris novit.<\/span> <span class=\"sg\" data-s=\"3\"><code>HOW<\/code> est abbreviatio pro <em>Higher Order Workings<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Metaobiectum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Metaobiecto iam uteris.<\/span> <span class=\"sg\" data-s=\"1\">Fortasse id non animadvertisti.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^<\/code> in <code>.^name<\/code> est vocatio methodi.<\/span> <span class=\"sg\" data-s=\"3\">Haec vocatio per <code>HOW<\/code> it.<\/span> <span class=\"sg\" data-s=\"4\">Hae duae lineae idem faciunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>$x.^name<\/code> est tantum forma brevis pro <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota: obiectum iterum ut argumentum intrat.<\/span> <span class=\"sg\" data-s=\"2\">Cur?<\/span> <span class=\"sg\" data-s=\"3\">Omnes valores typi unum metaobiectum <em>communicant<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Methodi metaobiecti sunt meta-methodi.<\/span> <span class=\"sg\" data-s=\"5\">Meta-methodus scire debet de quo obiecto interroges.<\/span> <span class=\"sg\" data-s=\"6\">Forma <code>.^<\/code> obiectum pro te transmittit.<\/span> <span class=\"sg\" data-s=\"7\">Pro <code>name<\/code> Raku hoc argumentum non adhibet.<\/span> <span class=\"sg\" data-s=\"8\">Sed modus rectus et generalis est id transmittere.<\/span> <span class=\"sg\" data-s=\"9\">Quaedam meta-methodi id adhibent.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc etiam de aliis meta-methodis verum est.<\/span> <span class=\"sg\" data-s=\"1\">Unum exemplum est <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Indicem methodorum dat.<\/span> <span class=\"sg\" data-s=\"3\">Has methodos in valore vocare potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> <em>fasciculum<\/em> nominis reddit.<\/span> <span class=\"sg\" data-s=\"1\">Est tabula nominum, sive symbolorum, in illo spatio nominum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> est hash pro tabula symbolorum.<\/span> <span class=\"sg\" data-s=\"1\">Cum modulis utile est.<\/span> <span class=\"sg\" data-s=\"2\">Per id nomina moduli quaerere potes.<\/span> <span class=\"sg\" data-s=\"3\">Ad id redimus in <a href=\"https://course.raku.org/la/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sectione de modulis<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Nunc hoc tantum memento: <code>WHO<\/code> exsistit.<\/span> <span class=\"sg\" data-s=\"5\">Memento etiam id quod reddit.<\/span><\/p>"]]}}}</script>
