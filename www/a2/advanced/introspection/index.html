<script type="application/json" id="page-data">{"u":"advanced/introspection","n":419,"k":"section","pv":"advanced/special-variables/exercises/topic-variable/solution","nx":"advanced/introspection/what","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Introspecting containers","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Introspection<\/em> means that you ask a value or a container about itself.<\/span> <span class=\"sg\" data-s=\"1\">You can ask about its type.<\/span> <span class=\"sg\" data-s=\"2\">You can ask about the container behind it.<\/span> <span class=\"sg\" data-s=\"3\">You can also ask how Raku makes it work inside.<\/span> <span class=\"sg\" data-s=\"4\">You already know one tool for introspection, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">It prints the type of a value.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku has a small group of such tools.<\/span> <span class=\"sg\" data-s=\"1\">Their names are in capital letters: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code>, and <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">People sometimes call them <em>pseudo-methods<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">They look like methods.<\/span> <span class=\"sg\" data-s=\"4\">But they are not normal methods.<\/span> <span class=\"sg\" data-s=\"5\">The compiler gives them a special meaning.<\/span> <span class=\"sg\" data-s=\"6\">This section looks at each of them.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is a reminder about <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The container in this code has no fixed type.<\/span> <span class=\"sg\" data-s=\"2\">We store different values in it.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> shows how the type changes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">At first, the container is <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">After that, it shows the type of its current value.<\/span><\/p>"]]},"de":{"t":"Introspektion von Containern","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Introspektion<\/em> bedeutet, dass du einen Wert oder einen Container nach sich selbst fragst.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst nach seinem Typ fragen.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst nach dem Container dahinter fragen.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst auch fragen, wie er im Inneren von Raku funktioniert.<\/span> <span class=\"sg\" data-s=\"4\">Du kennst schon ein Werkzeug für Introspektion, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Damit gibst du den Typ eines Wertes aus.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine kleine Gruppe solcher Werkzeuge.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Namen sind in Großbuchstaben: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> und <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Man nennt sie manchmal <em>Pseudo-Methoden<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sie sehen wie Methoden aus.<\/span> <span class=\"sg\" data-s=\"4\">Aber sie sind keine normalen Methoden.<\/span> <span class=\"sg\" data-s=\"5\">Der Compiler gibt ihnen eine besondere Bedeutung.<\/span> <span class=\"sg\" data-s=\"6\">Dieser Abschnitt schaut sich jedes davon an.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine Erinnerung an <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Container in diesem Code hat keinen festen Typ.<\/span> <span class=\"sg\" data-s=\"2\">Wir speichern verschiedene Werte darin.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> zeigt, wie sich der Typ ändert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zuerst ist der Container <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Danach zeigt er den Typ seines aktuellen Wertes.<\/span><\/p>"]]},"nl":{"t":"Containers introspecteren","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Introspectie<\/em> betekent dat je een waarde of een container iets over zichzelf vraagt.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt naar zijn type vragen.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt vragen naar de container erachter.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ook vragen hoe Raku hem van binnen laat werken.<\/span> <span class=\"sg\" data-s=\"4\">Je kent al één tool voor introspectie, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Die drukt het type van een waarde af.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een kleine groep van zulke tools.<\/span> <span class=\"sg\" data-s=\"1\">Hun namen staan in hoofdletters: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> en <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mensen noemen ze soms <em>pseudo-methodes<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ze lijken op methodes.<\/span> <span class=\"sg\" data-s=\"4\">Maar het zijn geen gewone methodes.<\/span> <span class=\"sg\" data-s=\"5\">De compiler geeft ze een speciale betekenis.<\/span> <span class=\"sg\" data-s=\"6\">Dit gedeelte bekijkt ze allemaal.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is nog eens <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De container in deze code heeft geen vast type.<\/span> <span class=\"sg\" data-s=\"2\">We bewaren er verschillende waarden in.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> laat zien hoe het type verandert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eerst is de container <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarna toont hij het type van zijn huidige waarde.<\/span><\/p>"]]},"es":{"t":"Introspección de contenedores","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La <em>introspección<\/em> significa que preguntas a un valor o a un contenedor sobre sí mismo.<\/span> <span class=\"sg\" data-s=\"1\">Puedes preguntar por su tipo.<\/span> <span class=\"sg\" data-s=\"2\">Puedes preguntar por el contenedor que hay detrás.<\/span> <span class=\"sg\" data-s=\"3\">También puedes preguntar cómo Raku lo hace funcionar por dentro.<\/span> <span class=\"sg\" data-s=\"4\">Ya conoces una herramienta de introspección, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Imprime el tipo de un valor.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku tiene un pequeño grupo de estas herramientas.<\/span> <span class=\"sg\" data-s=\"1\">Sus nombres están en mayúsculas: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> y <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A veces la gente las llama <em>pseudo-métodos<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Parecen métodos.<\/span> <span class=\"sg\" data-s=\"4\">Pero no son métodos normales.<\/span> <span class=\"sg\" data-s=\"5\">El compilador les da un significado especial.<\/span> <span class=\"sg\" data-s=\"6\">Esta sección mira cada una de ellas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un recordatorio sobre <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El contenedor de este código no tiene un tipo fijo.<\/span> <span class=\"sg\" data-s=\"2\">Guardamos diferentes valores en él.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> muestra cómo cambia el tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al principio, el contenedor es <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después, muestra el tipo de su valor actual.<\/span><\/p>"]]},"it":{"t":"Introspezione dei contenitori","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Con l'<em>introspezione<\/em> chiedi a un valore o a un contenitore qualcosa su se stesso.<\/span> <span class=\"sg\" data-s=\"1\">Puoi chiedere il suo tipo.<\/span> <span class=\"sg\" data-s=\"2\">Puoi chiedere quale contenitore c'è dietro.<\/span> <span class=\"sg\" data-s=\"3\">Puoi anche chiedere come Raku lo fa funzionare dentro.<\/span> <span class=\"sg\" data-s=\"4\">Conosci già uno strumento per l'introspezione, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Stampa il tipo di un valore.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ha un piccolo gruppo di strumenti così.<\/span> <span class=\"sg\" data-s=\"1\">I loro nomi sono in lettere maiuscole: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> e <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A volte la gente li chiama <em>pseudo-metodi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sembrano metodi.<\/span> <span class=\"sg\" data-s=\"4\">Ma non sono metodi normali.<\/span> <span class=\"sg\" data-s=\"5\">Il compilatore dà loro un significato speciale.<\/span> <span class=\"sg\" data-s=\"6\">Questa sezione parla di ognuno di loro.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco un promemoria su <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il contenitore in questo codice non ha un tipo fisso.<\/span> <span class=\"sg\" data-s=\"2\">Mettiamo dentro valori diversi.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> mostra come cambia il tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">All'inizio, il contenitore è <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dopo, mostra il tipo del suo valore attuale.<\/span><\/p>"]]},"lv":{"t":"Konteineru introspekcija","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Introspekcija<\/em> nozīmē jautāt vērtībai vai konteineram par sevi.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat jautāt par tā tipu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat jautāt par konteineru aiz tā.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat arī jautāt, kā Raku liek tam darboties iekšienē.<\/span> <span class=\"sg\" data-s=\"4\">Jūs jau zināt vienu introspekcijas rīku, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tas izdrukā vērtības tipu.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ir neliela šādu rīku grupa.<\/span> <span class=\"sg\" data-s=\"1\">To nosaukumi ir rakstīti ar lielajiem burtiem: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> un <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cilvēki dažreiz tos sauc par <em>pseidometodēm<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tie izskatās kā metodes.<\/span> <span class=\"sg\" data-s=\"4\">Bet tie nav parastas metodes.<\/span> <span class=\"sg\" data-s=\"5\">Kompilators tiem dod īpašu nozīmi.<\/span> <span class=\"sg\" data-s=\"6\">Šī sadaļa aplūko katru no tiem.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir atgādinājums par <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Konteineram šajā kodā nav noteikta tipa.<\/span> <span class=\"sg\" data-s=\"2\">Mēs tajā glabājam dažādas vērtības.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> parāda, kā tips mainās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sākumā konteineris ir <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tas rāda savas pašreizējās vērtības tipu.<\/span><\/p>"]]},"ru":{"t":"Интроспекция с помощью МОП","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Интроспекция<\/em> значит, что вы спрашиваете значение или контейнер о нём самом.<\/span> <span class=\"sg\" data-s=\"1\">Можно спросить о его типе.<\/span> <span class=\"sg\" data-s=\"2\">Можно спросить о контейнере за ним.<\/span> <span class=\"sg\" data-s=\"3\">Ещё можно спросить, как Raku устроил его внутри.<\/span> <span class=\"sg\" data-s=\"4\">Вы уже знаете один инструмент интроспекции — <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Он печатает тип значения.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В Raku есть небольшая группа таких инструментов.<\/span> <span class=\"sg\" data-s=\"1\">Их имена состоят из заглавных букв: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> и <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Иногда их называют <em>псевдо-методами<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Они похожи на методы.<\/span> <span class=\"sg\" data-s=\"4\">Но это не обычные методы.<\/span> <span class=\"sg\" data-s=\"5\">Компилятор даёт им особый смысл.<\/span> <span class=\"sg\" data-s=\"6\">В этом разделе мы посмотрим на каждый из них.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вспомним <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У контейнера в этом коде нет постоянного типа.<\/span> <span class=\"sg\" data-s=\"2\">Мы кладём в него разные значения.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> показывает, как меняется тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сначала контейнер — это <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потом он показывает тип своего текущего значения.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція контейнерів","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Інтроспекція<\/em> означає, що ви питаєте значення чи контейнер про нього самого.<\/span> <span class=\"sg\" data-s=\"1\">Можна спитати про його тип.<\/span> <span class=\"sg\" data-s=\"2\">Можна спитати про контейнер за ним.<\/span> <span class=\"sg\" data-s=\"3\">Також можна спитати, як воно працює всередині Raku.<\/span> <span class=\"sg\" data-s=\"4\">Ви вже знаєте один інструмент інтроспекції — <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Він виводить тип значення.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">У Raku є невелика група таких інструментів.<\/span> <span class=\"sg\" data-s=\"1\">Їхні імена написані великими літерами: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> і <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Іноді їх називають <em>псевдометодами<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вони схожі на методи.<\/span> <span class=\"sg\" data-s=\"4\">Але це не звичайні методи.<\/span> <span class=\"sg\" data-s=\"5\">Компілятор дає їм особливе значення.<\/span> <span class=\"sg\" data-s=\"6\">Цей розділ розглядає кожен із них.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось нагадування про <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Контейнер у цьому коді не має сталого типу.<\/span> <span class=\"sg\" data-s=\"2\">Ми зберігаємо в ньому різні значення.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> показує, як змінюється тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спочатку контейнер — це <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після цього він показує тип свого поточного значення.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на контейнери","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Интроспекция<\/em> означава, че питате стойност или контейнер за самия него.<\/span> <span class=\"sg\" data-s=\"1\">Можете да попитате за неговия тип.<\/span> <span class=\"sg\" data-s=\"2\">Можете да попитате за контейнера зад него.<\/span> <span class=\"sg\" data-s=\"3\">Можете да попитате и как Raku го кара да работи отвътре.<\/span> <span class=\"sg\" data-s=\"4\">Вече знаете един инструмент за интроспекция, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Той отпечатва типа на стойност.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku има малка група такива инструменти.<\/span> <span class=\"sg\" data-s=\"1\">Имената им са с главни букви: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> и <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Понякога хората ги наричат <em>псевдо-методи<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Те приличат на методи.<\/span> <span class=\"sg\" data-s=\"4\">Но не са обикновени методи.<\/span> <span class=\"sg\" data-s=\"5\">Компилаторът им дава специално значение.<\/span> <span class=\"sg\" data-s=\"6\">Този раздел разглежда всеки от тях.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето едно напомняне за <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Контейнерът в този код няма фиксиран тип.<\/span> <span class=\"sg\" data-s=\"2\">Слагаме в него различни стойности.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> показва как се променя типът:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отначало контейнерът е <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това той показва типа на текущата си стойност.<\/span><\/p>"]]},"eo":{"t":"Introspekto de ujoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Introspekto<\/em> signifas, ke vi demandas valoron aŭ ujon pri si mem.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas demandi pri ĝia tipo.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas demandi pri la ujo malantaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ povas demandi, kiel Raku igas ĝin funkcii interne.<\/span> <span class=\"sg\" data-s=\"4\">Vi jam konas unu ilon por introspekto, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi presas la tipon de valoro.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku havas malgrandan grupon de tiaj iloj.<\/span> <span class=\"sg\" data-s=\"1\">Iliaj nomoj havas grandajn literojn: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> kaj <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Oni foje nomas ilin <em>pseŭdo-metodoj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ili aspektas kiel metodoj.<\/span> <span class=\"sg\" data-s=\"4\">Sed ili ne estas normalaj metodoj.<\/span> <span class=\"sg\" data-s=\"5\">La kompililo donas al ili specialan signifon.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu sekcio rigardas ĉiun el ili.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen rememorigo pri <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ujo en ĉi tiu kodo ne havas fiksan tipon.<\/span> <span class=\"sg\" data-s=\"2\">Ni metas diversajn valorojn en ĝin.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> montras, kiel la tipo ŝanĝiĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Komence la ujo estas <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi montras la tipon de sia nuna valoro.<\/span><\/p>"]]},"la":{"t":"Introspectio receptaculorum","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Introspectio<\/em> est hoc: valorem vel receptaculum de se ipso interrogas.<\/span> <span class=\"sg\" data-s=\"1\">De typo eius interrogare potes.<\/span> <span class=\"sg\" data-s=\"2\">De receptaculo post eum interrogare potes.<\/span> <span class=\"sg\" data-s=\"3\">Etiam interrogare potes quomodo Raku eum intus agat.<\/span> <span class=\"sg\" data-s=\"4\">Iam unum instrumentum introspectionis nosti, <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Typum valoris imprimit.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku parvam familiam talium instrumentorum habet.<\/span> <span class=\"sg\" data-s=\"1\">Nomina eorum litteras maiusculas habent: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> et <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Homines ea interdum <em>pseudo-methodos<\/em> vocant.<\/span> <span class=\"sg\" data-s=\"3\">Methodis similia sunt.<\/span> <span class=\"sg\" data-s=\"4\">Sed non sunt methodi ordinariae.<\/span> <span class=\"sg\" data-s=\"5\">Compilator eis significationem specialem dat.<\/span> <span class=\"sg\" data-s=\"6\">Haec sectio unumquodque eorum inspicit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic est recordatio de <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Receptaculum in hoc codice typum fixum non habet.<\/span> <span class=\"sg\" data-s=\"2\">Diversos valores in eo condimus.<\/span> <span class=\"sg\" data-s=\"3\"><code>.^name<\/code> mutationem typi ostendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Primo receptaculum est <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Postea typum valoris sui praesentis ostendit.<\/span><\/p>"]]}}}</script>
