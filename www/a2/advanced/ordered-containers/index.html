<script type="application/json" id="page-data">{"u":"advanced/ordered-containers","n":368,"k":"section","pv":"advanced/scalar-containers/exercises/reuse-the-container/solution","nx":"advanced/ordered-containers/arrays","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Ordered containers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ordered containers keep several elements.<\/span> <span class=\"sg\" data-s=\"1\">They keep the elements in order.<\/span> <span class=\"sg\" data-s=\"2\">So you can get each element by its position.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes they keep only one element, or even no elements at all.<\/span> <span class=\"sg\" data-s=\"4\">The most common ordered containers are <em>arrays<\/em> and <em>lists<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The <code>@<\/code> sigil shows that a variable is for many elements.<\/span> <span class=\"sg\" data-s=\"1\">You can use an index with such a variable.<\/span> <span class=\"sg\" data-s=\"2\">You write the index in square brackets.<\/span> <span class=\"sg\" data-s=\"3\">Then you get one element.<\/span> <span class=\"sg\" data-s=\"4\">You already saw this in the Essentials part.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">In this section, we look more closely at arrays and lists.<\/span> <span class=\"sg\" data-s=\"1\">How are they different <em>as containers<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Which of them can you change?<\/span> <span class=\"sg\" data-s=\"3\">What happens when you put one container inside another?<\/span> <span class=\"sg\" data-s=\"4\">And what is <em>binding<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Binding gives a name to a container.<\/span> <span class=\"sg\" data-s=\"6\">It copies nothing.<\/span><\/p>"]]},"de":{"t":"Geordnete Container","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Geordnete Container speichern mehrere Elemente.<\/span> <span class=\"sg\" data-s=\"1\">Sie behalten die Reihenfolge der Elemente.<\/span> <span class=\"sg\" data-s=\"2\">So kannst du jedes Element über seine Position bekommen.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal speichern sie nur ein Element oder sogar gar keins.<\/span> <span class=\"sg\" data-s=\"4\">Die häufigsten geordneten Container sind <em>Arrays<\/em> und <em>Listen<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das Sigil <code>@<\/code> zeigt: Die Variable ist für viele Elemente.<\/span> <span class=\"sg\" data-s=\"1\">Bei so einer Variable kannst du einen Index verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Du schreibst den Index in eckige Klammern.<\/span> <span class=\"sg\" data-s=\"3\">Dann bekommst du ein Element.<\/span> <span class=\"sg\" data-s=\"4\">Das hast du schon im Grundlagenteil gesehen.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt sehen wir uns Arrays und Listen genauer an.<\/span> <span class=\"sg\" data-s=\"1\">Wie unterscheiden sie sich <em>als Container<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Welche davon kannst du ändern?<\/span> <span class=\"sg\" data-s=\"3\">Was passiert, wenn du einen Container in einen anderen steckst?<\/span> <span class=\"sg\" data-s=\"4\">Und was ist <em>Binding<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Binding gibt einem Container einen Namen.<\/span> <span class=\"sg\" data-s=\"6\">Es kopiert nichts.<\/span><\/p>"]]},"nl":{"t":"Geordende containers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Geordende containers bewaren meerdere elementen.<\/span> <span class=\"sg\" data-s=\"1\">Ze bewaren de elementen in volgorde.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je elk element via zijn positie krijgen.<\/span> <span class=\"sg\" data-s=\"3\">Soms bewaren ze maar één element, of zelfs helemaal geen elementen.<\/span> <span class=\"sg\" data-s=\"4\">De meest gebruikte geordende containers zijn <em>arrays<\/em> en <em>lists<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De <code>@<\/code> sigil laat zien dat een variabele voor veel elementen is.<\/span> <span class=\"sg\" data-s=\"1\">Bij zo'n variabele kun je een index gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft de index tussen vierkante haken.<\/span> <span class=\"sg\" data-s=\"3\">Dan krijg je één element.<\/span> <span class=\"sg\" data-s=\"4\">Dit zag je al in het deel Essentials.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">In dit deel bekijken we arrays en lists van dichterbij.<\/span> <span class=\"sg\" data-s=\"1\">Hoe verschillen ze <em>als containers<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Welke kun je veranderen?<\/span> <span class=\"sg\" data-s=\"3\">Wat gebeurt er als je de ene container in de andere zet?<\/span> <span class=\"sg\" data-s=\"4\">En wat is <em>binding<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Binding geeft een naam aan een container.<\/span> <span class=\"sg\" data-s=\"6\">Het kopieert niets.<\/span><\/p>"]]},"es":{"t":"Contenedores ordenados","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Los contenedores ordenados guardan varios elementos.<\/span> <span class=\"sg\" data-s=\"1\">Guardan los elementos en orden.<\/span> <span class=\"sg\" data-s=\"2\">Así puedes obtener cada elemento por su posición.<\/span> <span class=\"sg\" data-s=\"3\">A veces guardan solo un elemento, o incluso ninguno.<\/span> <span class=\"sg\" data-s=\"4\">Los contenedores ordenados más comunes son los <em>arrays<\/em> y las <em>listas<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El sigilo <code>@<\/code> muestra que una variable es para muchos elementos.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usar un índice con esa variable.<\/span> <span class=\"sg\" data-s=\"2\">Escribes el índice entre corchetes.<\/span> <span class=\"sg\" data-s=\"3\">Así obtienes un elemento.<\/span> <span class=\"sg\" data-s=\"4\">Ya viste esto en la parte de Esenciales.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">En esta sección, vemos más de cerca los arrays y las listas.<\/span> <span class=\"sg\" data-s=\"1\">¿En qué se diferencian <em>como contenedores<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">¿Cuáles de ellos puedes cambiar?<\/span> <span class=\"sg\" data-s=\"3\">¿Qué pasa cuando pones un contenedor dentro de otro?<\/span> <span class=\"sg\" data-s=\"4\">¿Y qué es la <em>vinculación<\/em> (binding)?<\/span> <span class=\"sg\" data-s=\"5\">La vinculación da un nombre a un contenedor.<\/span> <span class=\"sg\" data-s=\"6\">No copia nada.<\/span><\/p>"]]},"it":{"t":"Contenitori ordinati","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">I contenitori ordinati conservano più elementi.<\/span> <span class=\"sg\" data-s=\"1\">Tengono gli elementi in ordine.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi prendere ogni elemento con la sua posizione.<\/span> <span class=\"sg\" data-s=\"3\">A volte conservano solo un elemento, o anche nessun elemento.<\/span> <span class=\"sg\" data-s=\"4\">I contenitori ordinati più comuni sono gli <em>array<\/em> e le <em>liste<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il sigillo <code>@<\/code> mostra che una variabile è per molti elementi.<\/span> <span class=\"sg\" data-s=\"1\">Con una variabile così puoi usare un indice.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi l'indice tra parentesi quadre.<\/span> <span class=\"sg\" data-s=\"3\">Allora ottieni un elemento.<\/span> <span class=\"sg\" data-s=\"4\">Hai già visto questo nella parte Essenziali.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">In questa sezione, guardiamo più da vicino gli array e le liste.<\/span> <span class=\"sg\" data-s=\"1\">In cosa sono diversi <em>come contenitori<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Quali di essi puoi cambiare?<\/span> <span class=\"sg\" data-s=\"3\">Cosa succede quando metti un contenitore dentro un altro?<\/span> <span class=\"sg\" data-s=\"4\">E cos'è il <em>binding<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Il binding dà un nome a un contenitore.<\/span> <span class=\"sg\" data-s=\"6\">Non copia niente.<\/span><\/p>"]]},"lv":{"t":"Kārtotie konteineri","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sakārtotie konteineri glabā vairākus elementus.<\/span> <span class=\"sg\" data-s=\"1\">Tie glabā elementus noteiktā secībā.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat iegūt katru elementu pēc tā pozīcijas.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz tie glabā tikai vienu elementu vai pat nevienu.<\/span> <span class=\"sg\" data-s=\"4\">Visbiežākie sakārtotie konteineri ir <em>masīvi<\/em> un <em>saraksti<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sigils <code>@<\/code> parāda, ka mainīgais ir paredzēts daudziem elementiem.<\/span> <span class=\"sg\" data-s=\"1\">Ar šādu mainīgo jūs varat lietot indeksu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs rakstāt indeksu kvadrātiekavās.<\/span> <span class=\"sg\" data-s=\"3\">Tad jūs iegūstat vienu elementu.<\/span> <span class=\"sg\" data-s=\"4\">Jūs to jau redzējāt daļā Pamati.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā mēs tuvāk aplūkojam masīvus un sarakstus.<\/span> <span class=\"sg\" data-s=\"1\">Kā tie atšķiras <em>kā konteineri<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Kurus no tiem jūs varat mainīt?<\/span> <span class=\"sg\" data-s=\"3\">Kas notiek, kad jūs ieliekat vienu konteineru citā?<\/span> <span class=\"sg\" data-s=\"4\">Un kas ir <em>saistīšana<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Saistīšana dod konteineram nosaukumu.<\/span> <span class=\"sg\" data-s=\"6\">Tā neko nekopē.<\/span><\/p>"]]},"ru":{"t":"Упорядоченные контейнеры","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Упорядоченные контейнеры хранят несколько элементов.<\/span> <span class=\"sg\" data-s=\"1\">Они хранят элементы по порядку.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому каждый элемент можно получить по его позиции.<\/span> <span class=\"sg\" data-s=\"3\">Иногда в них только один элемент или даже ни одного.<\/span> <span class=\"sg\" data-s=\"4\">Самые частые упорядоченные контейнеры — это <em>массивы<\/em> и <em>списки<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Сигил <code>@<\/code> показывает, что переменная нужна для многих элементов.<\/span> <span class=\"sg\" data-s=\"1\">С такой переменной можно использовать индекс.<\/span> <span class=\"sg\" data-s=\"2\">Вы пишете индекс в квадратных скобках.<\/span> <span class=\"sg\" data-s=\"3\">Так вы получаете один элемент.<\/span> <span class=\"sg\" data-s=\"4\">Вы уже видели это в части «Основы».<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В этом разделе мы ближе посмотрим на массивы и списки.<\/span> <span class=\"sg\" data-s=\"1\">Чем они различаются <em>как контейнеры<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Какие из них можно менять?<\/span> <span class=\"sg\" data-s=\"3\">Что происходит, когда вы кладёте один контейнер в другой?<\/span> <span class=\"sg\" data-s=\"4\">И что такое <em>привязка<\/em> (binding)?<\/span> <span class=\"sg\" data-s=\"5\">Привязка даёт контейнеру имя.<\/span> <span class=\"sg\" data-s=\"6\">Она ничего не копирует.<\/span><\/p>"]]},"uk":{"t":"Впорядковані контейнери","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Впорядковані контейнери зберігають кілька елементів.<\/span> <span class=\"sg\" data-s=\"1\">Вони зберігають елементи по порядку.<\/span> <span class=\"sg\" data-s=\"2\">Тому кожен елемент можна отримати за його позицією.<\/span> <span class=\"sg\" data-s=\"3\">Іноді вони зберігають лише один елемент або навіть жодного.<\/span> <span class=\"sg\" data-s=\"4\">Найчастіші впорядковані контейнери — це <em>масиви<\/em> і <em>списки<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Сигіл <code>@<\/code> показує, що змінна призначена для багатьох елементів.<\/span> <span class=\"sg\" data-s=\"1\">З такою змінною ви можете використовувати індекс.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете індекс у квадратних дужках.<\/span> <span class=\"sg\" data-s=\"3\">Тоді ви отримуєте один елемент.<\/span> <span class=\"sg\" data-s=\"4\">Ви вже бачили це в частині «Основи».<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі ми уважніше дивимося на масиви і списки.<\/span> <span class=\"sg\" data-s=\"1\">Чим вони відрізняються <em>як контейнери<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Який із них можна змінювати?<\/span> <span class=\"sg\" data-s=\"3\">Що стається, коли ви кладете один контейнер усередину іншого?<\/span> <span class=\"sg\" data-s=\"4\">І що таке <em>зв'язування<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Зв'язування дає контейнеру ім'я.<\/span> <span class=\"sg\" data-s=\"6\">Воно нічого не копіює.<\/span><\/p>"]]},"bg":{"t":"Подредени контейнери","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Подредените контейнери пазят няколко елемента.<\/span> <span class=\"sg\" data-s=\"1\">Те пазят реда на елементите.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да вземете всеки елемент по неговата позиция.<\/span> <span class=\"sg\" data-s=\"3\">Понякога те пазят само един елемент или дори нито един.<\/span> <span class=\"sg\" data-s=\"4\">Най-честите подредени контейнери са <em>масивите<\/em> и <em>списъците<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Сигилът <code>@<\/code> показва, че променливата е за много елементи.<\/span> <span class=\"sg\" data-s=\"1\">С такава променлива можете да използвате индекс.<\/span> <span class=\"sg\" data-s=\"2\">Пишете индекса в квадратни скоби.<\/span> <span class=\"sg\" data-s=\"3\">Тогава получавате един елемент.<\/span> <span class=\"sg\" data-s=\"4\">Вече видяхте това в частта „Основи“.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В тази секция разглеждаме по-отблизо масивите и списъците.<\/span> <span class=\"sg\" data-s=\"1\">С какво се различават те <em>като контейнери<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Кои от тях можете да променяте?<\/span> <span class=\"sg\" data-s=\"3\">Какво става, когато сложите един контейнер в друг?<\/span> <span class=\"sg\" data-s=\"4\">И какво е <em>свързване<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Свързването дава име на контейнер.<\/span> <span class=\"sg\" data-s=\"6\">То не копира нищо.<\/span><\/p>"]]},"eo":{"t":"Ordigitaj ujoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ordigitaj ujoj tenas plurajn elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili tenas la elementojn en ordo.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas preni ĉiun elementon laŭ ĝia pozicio.<\/span> <span class=\"sg\" data-s=\"3\">Foje ili tenas nur unu elementon, aŭ eĉ neniun elementon.<\/span> <span class=\"sg\" data-s=\"4\">La plej oftaj ordigitaj ujoj estas <em>tabeloj<\/em> kaj <em>listoj<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La sigelo <code>@<\/code> montras, ke variablo estas por multaj elementoj.<\/span> <span class=\"sg\" data-s=\"1\">Kun tia variablo vi povas uzi indekson.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas la indekson en kvadrataj krampoj.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi ricevas unu elementon.<\/span> <span class=\"sg\" data-s=\"4\">Vi jam vidis tion en la parto Esencoj.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu sekcio, ni pli detale rigardas tabelojn kaj listojn.<\/span> <span class=\"sg\" data-s=\"1\">Kiel ili diferencas <em>kiel ujoj<\/em>?<\/span> <span class=\"sg\" data-s=\"2\">Kiun el ili vi povas ŝanĝi?<\/span> <span class=\"sg\" data-s=\"3\">Kio okazas, kiam vi metas unu ujon en alian?<\/span> <span class=\"sg\" data-s=\"4\">Kaj kio estas <em>ligado<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Ligado donas nomon al ujo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi kopias nenion.<\/span><\/p>"]]},"la":{"t":"Ordinata receptacula","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Continentes ordinati plura elementa servant.<\/span> <span class=\"sg\" data-s=\"1\">Elementa in ordine servant.<\/span> <span class=\"sg\" data-s=\"2\">Itaque quodque elementum per positionem suam accipere potes.<\/span> <span class=\"sg\" data-s=\"3\">Interdum solum unum elementum servant, vel nullum omnino.<\/span> <span class=\"sg\" data-s=\"4\">Continentes ordinati frequentissimi sunt <em>ordines<\/em> et <em>indices<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sigillum <code>@<\/code> ostendit: variabilis est pro multis elementis.<\/span> <span class=\"sg\" data-s=\"1\">Cum tali variabili indicem adhibere potes.<\/span> <span class=\"sg\" data-s=\"2\">Indicem in uncis quadratis scribis.<\/span> <span class=\"sg\" data-s=\"3\">Tum unum elementum accipis.<\/span> <span class=\"sg\" data-s=\"4\">Hoc iam in parte Essentialium vidisti.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">In hac sectione ordines et indices propius inspicimus.<\/span> <span class=\"sg\" data-s=\"1\">Quomodo <em>ut continentes<\/em> differunt?<\/span> <span class=\"sg\" data-s=\"2\">Quos ex eis mutare potes?<\/span> <span class=\"sg\" data-s=\"3\">Quid accidit cum unum continentem intra alterum ponis?<\/span> <span class=\"sg\" data-s=\"4\">Et quid est <em>vinculum<\/em>?<\/span> <span class=\"sg\" data-s=\"5\">Vinculum nomen continenti dat.<\/span> <span class=\"sg\" data-s=\"6\">Nihil copiat.<\/span><\/p>"]]}}}</script>
