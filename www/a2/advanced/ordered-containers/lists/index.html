an class=\"sg\" data-s=\"1\">Елементите на списъка са просто стойности.<\/span> <span class=\"sg\" data-s=\"2\">Те не са контейнери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Втората програма спира.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва това съобщение:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И така, трябва ли да променяте данните?<\/span> <span class=\"sg\" data-s=\"1\">Тогава използвайте масив, със сигила <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Трябва ли ви само да пазите няколко стойности в постоянен ред?<\/span> <span class=\"sg\" data-s=\"3\">Тогава използвайте списък.<\/span><\/p>"]]},"eo":{"t":"Listoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Listo ankaŭ estas ordigita kolekto de valoroj.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi ne estas kiel tabelo.<\/span> <span class=\"sg\" data-s=\"2\">Listo estas <em>neŝanĝebla<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne povas ŝanĝi ĝiajn elementojn.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ ne povas aldoni aŭ forigi elementojn.<\/span> <span class=\"sg\" data-s=\"5\">Por skribi liston, metu komojn inter la valoroj.<\/span> <span class=\"sg\" data-s=\"6\">Ofte estas krampoj ĉirkaŭ ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas legi la elementojn de listo laŭ ilia indekso.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas demandi, kiom da elementoj estas.<\/span> <span class=\"sg\" data-s=\"2\">Estas same kiel ĉe tabelo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nun provu ŝanĝi elementon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie vi vidas la diferencon.<\/span> <span class=\"sg\" data-s=\"2\">Ĉe tabelo, ĝi funkcias.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu elemento de tabelo estas ujo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉe listo, vi ricevas eraron.<\/span> <span class=\"sg\" data-s=\"1\">La elementoj de listo estas nur valoroj.<\/span> <span class=\"sg\" data-s=\"2\">Ili ne estas ujoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dua programo haltas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas ĉi tiun mesaĝon:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do, ĉu vi bezonas ŝanĝi la datumojn?<\/span> <span class=\"sg\" data-s=\"1\">Tiam uzu tabelon, kun la sigelo <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu vi bezonas nur teni kelkajn valorojn en fiksita ordo?<\/span> <span class=\"sg\" data-s=\"3\">Tiam uzu liston.<\/span><\/p>"]]},"la":{"t":"Listae","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Index quoque collectio ordinata valorum est.<\/span> <span class=\"sg\" data-s=\"1\">Sed non est sicut ordo.<\/span> <span class=\"sg\" data-s=\"2\">Index <em>immutabilis<\/em> est.<\/span> <span class=\"sg\" data-s=\"3\">Elementa eius mutare non potes.<\/span> <span class=\"sg\" data-s=\"4\">Neque elementa addere vel removere potes.<\/span> <span class=\"sg\" data-s=\"5\">Ut indicem scribas, virgulas inter valores pone.<\/span> <span class=\"sg\" data-s=\"6\">Saepe parentheses circum eos sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elementa indicis per indicem suum legere potes.<\/span> <span class=\"sg\" data-s=\"1\">Etiam numerum elementorum quaerere potes.<\/span> <span class=\"sg\" data-s=\"2\">Idem est ac cum ordine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $colours = ('red', 'green', 'blue');\nsay $colours[0];    # red\nsay $colours.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nunc elementum mutare tempta.<\/span> <span class=\"sg\" data-s=\"1\">Hic differentiam vides.<\/span> <span class=\"sg\" data-s=\"2\">Cum ordine operatur.<\/span> <span class=\"sg\" data-s=\"3\">Quodque elementum ordinis continens est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 1, 2, 3;\n@array[0] = 10;\nsay @array; # [10 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum indice errorem accipis.<\/span> <span class=\"sg\" data-s=\"1\">Elementa indicis solum valores sunt.<\/span> <span class=\"sg\" data-s=\"2\">Continentes non sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $list = (1, 2, 3);\n$list[0] = 10;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secundum programma sistit.<\/span> <span class=\"sg\" data-s=\"1\">Hunc nuntium imprimit:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable List ((1 2 3))\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Itaque, data mutare debes?<\/span> <span class=\"sg\" data-s=\"1\">Tum ordine utere, cum sigillo <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Solum aliquot valores in ordine fixo servare debes?<\/span> <span class=\"sg\" data-s=\"3\">Tum indice utere.<\/span><\/p>"]]}}}</script>
