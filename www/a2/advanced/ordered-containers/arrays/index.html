ер.<\/span> <span class=\"sg\" data-s=\"1\">Кожен елемент масиву — теж скалярний контейнер.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигіл <code>@<\/code> показує, що змінна працює як об'єкт <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому кожен елемент можна отримати за його індексом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен елемент — це скалярний контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Тому йому можна присвоїти нове значення.<\/span> <span class=\"sg\" data-s=\"2\">Це працює так само, як зі звичайною скалярною змінною:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можна також присвоїти значення іншого типу.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ось чому масиви <em>змінювані<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що їх можна змінювати.<\/span> <span class=\"sg\" data-s=\"2\">Кожне місце в масиві — це контейнер.<\/span> <span class=\"sg\" data-s=\"3\">Він може отримати нове значення.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/uk/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">Списки<\/a> інші.<\/span> <span class=\"sg\" data-s=\"5\">Ви побачите це в наступній темі.<\/span><\/p>"]]},"bg":{"t":"Масиви","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивът е подреден контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Всеки елемент на масива също е скаларен контейнер.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигилът <code>@<\/code> показва, че променливата работи като обект от тип <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да вземете всеки елемент по неговия индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент е скаларен контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да му присвоите нова стойност.<\/span> <span class=\"sg\" data-s=\"2\">Това работи точно като при обикновена скаларна променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да присвоите и стойност от друг тип.<\/span> <span class=\"sg\" data-s=\"1\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Затова масивите са <em>изменяеми<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че можете да ги променяте.<\/span> <span class=\"sg\" data-s=\"2\">Всяко място в масива е контейнер.<\/span> <span class=\"sg\" data-s=\"3\">То може да получи нова стойност.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/bg/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">Списъците<\/a> са различни.<\/span> <span class=\"sg\" data-s=\"5\">Ще видите това в следващата тема.<\/span><\/p>"]]},"eo":{"t":"Tabeloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tabelo estas ordigita ujo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu elemento de tabelo estas ankaŭ skalara ujo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sigelo <code>@<\/code> montras, ke la variablo funkcias kiel objekto <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas preni ĉiun elementon laŭ ĝia indekso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu elemento estas skalara ujo.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas atribui novan valoron al ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi funkcias same kiel normala skalara variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas atribui valoron de alia tipo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tial tabeloj estas <em>ŝanĝeblaj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke vi povas ŝanĝi ilin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu loko en tabelo estas ujo.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi povas ricevi novan valoron.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/eo/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">Listoj<\/a> estas malsamaj.<\/span> <span class=\"sg\" data-s=\"5\">Vi vidos tion en la sekva temo.<\/span><\/p>"]]},"la":{"t":"Array","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordo est continens ordinatus.<\/span> <span class=\"sg\" data-s=\"1\">Quodque elementum ordinis quoque continens scalaris est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sigillum <code>@<\/code> ostendit: variabilis ut obiectum <code>Positional<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"1\">Itaque quodque elementum per indicem suum accipere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quodque elementum continens scalaris est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque novum valorem ei assignare potes.<\/span> <span class=\"sg\" data-s=\"2\">Hoc sicut cum variabili scalari normali operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam valorem typi diversi assignare potes.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ideo ordines <em>mutabiles<\/em> sunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: eos mutare potes.<\/span> <span class=\"sg\" data-s=\"2\">Quaeque positio in ordine continens est.<\/span> <span class=\"sg\" data-s=\"3\">Novum valorem accipere potest.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/la/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">Indices<\/a> diversi sunt.<\/span> <span class=\"sg\" data-s=\"5\">Hoc in themate sequenti videbis.<\/span><\/p>"]]}}}</script>
