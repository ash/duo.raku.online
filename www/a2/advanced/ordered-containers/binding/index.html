<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es el mismo contenedor.<\/span> <span class=\"sg\" data-s=\"3\">Después, <code>$x<\/code> recibe el valor <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Entonces <code>$y<\/code> también es <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Compara esto con la asignación normal.<\/span> <span class=\"sg\" data-s=\"1\">Copia el valor en otro contenedor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # una copia simple\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La vinculación también funciona con arrays.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, <code>@alias<\/code> se convierte en un segundo nombre para <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un detalle más.<\/span> <span class=\"sg\" data-s=\"1\">Puedes vincular un nombre directamente a un valor literal.<\/span> <span class=\"sg\" data-s=\"2\">Es un valor que escribes en el código.<\/span> <span class=\"sg\" data-s=\"3\">Entonces no hay ningún contenedor detrás del nombre.<\/span> <span class=\"sg\" data-s=\"4\">Por eso el nombre es de solo lectura.<\/span> <span class=\"sg\" data-s=\"5\">No puedes asignarle nada:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"it":{"t":"Binding con <code>:=<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Finora, ogni nuova variabile ha creato un nuovo contenitore.<\/span> <span class=\"sg\" data-s=\"1\">L'assegnazione con <code>=<\/code> ha messo un valore <em>dentro<\/em> questo contenitore.<\/span> <span class=\"sg\" data-s=\"2\">Il binding è diverso.<\/span>
