<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/flattening","n":373,"k":"topic","pv":"advanced/ordered-containers/binding","nx":"advanced/ordered-containers/flattening/quiz","tr":["advanced","advanced/ordered-containers"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Flattening and itemisation (itemization)","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You can put one array inside another.<\/span> <span class=\"sg\" data-s=\"1\">Raku does <em>not<\/em> join their elements by itself.<\/span> <span class=\"sg\" data-s=\"2\">Look at this program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The array <code>@c<\/code> has only two elements: the arrays <code>@a<\/code> and <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku keeps each container as one item.<\/span> <span class=\"sg\" data-s=\"2\">Its elements do not go into the outer array.<\/span> <span class=\"sg\" data-s=\"3\">It is the same with an array among other values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do you want one flat sequence?<\/span> <span class=\"sg\" data-s=\"1\">Then ask for it with the <code>flat<\/code> routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisation (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sometimes you want the opposite.<\/span> <span class=\"sg\" data-s=\"1\">You want to keep a container in one piece, even inside <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The <code>$(...)<\/code> construct <em>itemises<\/em> its argument.<\/span> <span class=\"sg\" data-s=\"3\">This means that it marks the result as one single item.<\/span> <span class=\"sg\" data-s=\"4\">Compare the last example with this one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, <code>$(@a)<\/code> keeps <code>@a<\/code> as one element.<\/span> <span class=\"sg\" data-s=\"1\">But <code>@b<\/code> still becomes flat.<\/span> <span class=\"sg\" data-s=\"2\">It gives its two values.<\/span> <span class=\"sg\" data-s=\"3\">This is the idea of the <code>$<\/code> sigil again.<\/span> <span class=\"sg\" data-s=\"4\">A <code>$<\/code> means “treat this as a single thing”.<\/span><\/p>"]]},"de":{"t":"Flattening und Itemisierung","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst ein Array in ein anderes stecken.<\/span> <span class=\"sg\" data-s=\"1\">Raku verbindet ihre Elemente <em>nicht<\/em> von selbst.<\/span> <span class=\"sg\" data-s=\"2\">Sieh dir dieses Programm an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Array <code>@c<\/code> hat nur zwei Elemente: die Arrays <code>@a<\/code> und <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku behält jeden Container als ein Element.<\/span> <span class=\"sg\" data-s=\"2\">Seine Elemente kommen nicht in das äußere Array.<\/span> <span class=\"sg\" data-s=\"3\">Mit einem Array zwischen anderen Werten ist es genauso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Willst du eine flache Sequenz?<\/span> <span class=\"sg\" data-s=\"1\">Dann frage mit der Routine <code>flat<\/code> danach:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisierung<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Manchmal willst du das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Du willst einen Container in einem Stück behalten, auch innerhalb von <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das Konstrukt <code>$(...)<\/code> <em>itemisiert<\/em> sein Argument.<\/span> <span class=\"sg\" data-s=\"3\">Das heißt, es markiert das Ergebnis als ein einzelnes Element.<\/span> <span class=\"sg\" data-s=\"4\">Vergleiche das letzte Beispiel mit diesem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier behält <code>$(@a)<\/code> <code>@a<\/code> als ein Element.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>@b<\/code> wird trotzdem flach.<\/span> <span class=\"sg\" data-s=\"2\">Es liefert seine zwei Werte.<\/span> <span class=\"sg\" data-s=\"3\">Das ist wieder die Idee des Sigils <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ein <code>$<\/code> bedeutet \"behandle dies als eine einzelne Sache\".<\/span><\/p>"]]},"nl":{"t":"Afvlakken en itemisatie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt een array in een ander array zetten.<\/span> <span class=\"sg\" data-s=\"1\">Raku voegt hun elementen <em>niet<\/em> vanzelf samen.<\/span> <span class=\"sg\" data-s=\"2\">Kijk naar dit programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het array <code>@c<\/code> heeft maar twee elementen: de arrays <code>@a<\/code> en <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku bewaart elke container als één item.<\/span> <span class=\"sg\" data-s=\"2\">De elementen ervan gaan niet in het buitenste array.<\/span> <span class=\"sg\" data-s=\"3\">Het is hetzelfde met een array tussen andere waarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wil je één platte reeks?<\/span> <span class=\"sg\" data-s=\"1\">Vraag er dan om met de <code>flat<\/code> routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisatie (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Soms wil je het omgekeerde.<\/span> <span class=\"sg\" data-s=\"1\">Je wilt een container in één stuk houden, zelfs binnen <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De <code>$(...)<\/code> constructie <em>itemiseert<\/em> zijn argument.<\/span> <span class=\"sg\" data-s=\"3\">Dat betekent: het markeert het resultaat als één enkel item.<\/span> <span class=\"sg\" data-s=\"4\">Vergelijk het vorige voorbeeld met dit voorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier houdt <code>$(@a)<\/code> het array <code>@a<\/code> als één element.<\/span> <span class=\"sg\" data-s=\"1\">Maar <code>@b<\/code> wordt nog steeds plat.<\/span> <span class=\"sg\" data-s=\"2\">Het geeft zijn twee waarden.<\/span> <span class=\"sg\" data-s=\"3\">Dit is weer het idee van de <code>$<\/code> sigil.<\/span> <span class=\"sg\" data-s=\"4\">Een <code>$<\/code> betekent \"behandel dit als één ding\".<\/span><\/p>"]]},"es":{"t":"Aplanamiento e itemización","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes poner un array dentro de otro.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>no<\/em> junta sus elementos por sí solo.<\/span> <span class=\"sg\" data-s=\"2\">Mira este programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El array <code>@c<\/code> tiene solo dos elementos: los arrays <code>@a<\/code> y <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku guarda cada contenedor como un solo elemento.<\/span> <span class=\"sg\" data-s=\"2\">Sus elementos no pasan al array de fuera.<\/span> <span class=\"sg\" data-s=\"3\">Pasa lo mismo con un array entre otros valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Quieres una sola secuencia plana?<\/span> <span class=\"sg\" data-s=\"1\">Entonces pídela con la rutina <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemización<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A veces quieres lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Quieres guardar un contenedor entero, incluso dentro de <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La construcción <code>$(...)<\/code> <em>itemiza<\/em> su argumento.<\/span> <span class=\"sg\" data-s=\"3\">Esto significa que marca el resultado como un único elemento.<\/span> <span class=\"sg\" data-s=\"4\">Compara el ejemplo anterior con este:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>$(@a)<\/code> mantiene <code>@a<\/code> como un solo elemento.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>@b<\/code> todavía se aplana.<\/span> <span class=\"sg\" data-s=\"2\">Da sus dos valores.<\/span> <span class=\"sg\" data-s=\"3\">Esta es otra vez la idea del sigilo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Un <code>$<\/code> significa \"trata esto como una sola cosa\".<\/span><\/p>"]]},"it":{"t":"Appiattimento e itemizzazione","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi mettere un array dentro un altro.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>non<\/em> unisce da solo i loro elementi.<\/span> <span class=\"sg\" data-s=\"2\">Guarda questo programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">L'array <code>@c<\/code> ha solo due elementi: gli array <code>@a<\/code> e <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene ogni contenitore come un solo elemento.<\/span> <span class=\"sg\" data-s=\"2\">I suoi elementi non vanno nell'array esterno.<\/span> <span class=\"sg\" data-s=\"3\">Succede lo stesso con un array tra altri valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vuoi una sola sequenza piatta?<\/span> <span class=\"sg\" data-s=\"1\">Allora chiedila con la routine <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemizzazione (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A volte vuoi il contrario.<\/span> <span class=\"sg\" data-s=\"1\">Vuoi tenere un contenitore in un solo pezzo, anche dentro <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il costrutto <code>$(...)<\/code> <em>itemizza<\/em> il suo argomento.<\/span> <span class=\"sg\" data-s=\"3\">Questo vuol dire che segna il risultato come un solo elemento.<\/span> <span class=\"sg\" data-s=\"4\">Confronta l'esempio di prima con questo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui <code>$(@a)<\/code> tiene <code>@a<\/code> come un solo elemento.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>@b<\/code> diventa comunque piatto.<\/span> <span class=\"sg\" data-s=\"2\">Dà i suoi due valori.<\/span> <span class=\"sg\" data-s=\"3\">Questa è di nuovo l'idea del sigillo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Un <code>$<\/code> vuol dire \"tratta questo come una sola cosa\".<\/span><\/p>"]]},"lv":{"t":"Saplacināšana un vienuma veidošana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat ielikt vienu masīvu citā.<\/span> <span class=\"sg\" data-s=\"1\">Raku pats <em>neapvieno<\/em> to elementus.<\/span> <span class=\"sg\" data-s=\"2\">Aplūkojiet šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Masīvam <code>@c<\/code> ir tikai divi elementi: masīvi <code>@a<\/code> un <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku glabā katru konteineru kā vienu vienību.<\/span> <span class=\"sg\" data-s=\"2\">Tā elementi nenonāk ārējā masīvā.<\/span> <span class=\"sg\" data-s=\"3\">Tāpat ir ar masīvu starp citām vērtībām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai jūs gribat vienu plakanu secību?<\/span> <span class=\"sg\" data-s=\"1\">Tad prasiet to ar rutīnu <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemizācija (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūs gribat pretējo.<\/span> <span class=\"sg\" data-s=\"1\">Jūs gribat saglabāt konteineru veselu, pat <code>flat<\/code> iekšā.<\/span> <span class=\"sg\" data-s=\"2\">Konstrukcija <code>$(...)<\/code> <em>itemizē<\/em> savu argumentu.<\/span> <span class=\"sg\" data-s=\"3\">Tas nozīmē, ka tā atzīmē rezultātu kā vienu vienību.<\/span> <span class=\"sg\" data-s=\"4\">Salīdziniet iepriekšējo piemēru ar šo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>$(@a)<\/code> saglabā <code>@a<\/code> kā vienu elementu.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>@b<\/code> joprojām kļūst plakans.<\/span> <span class=\"sg\" data-s=\"2\">Tas dod savas divas vērtības.<\/span> <span class=\"sg\" data-s=\"3\">Šī atkal ir sigila <code>$<\/code> ideja.<\/span> <span class=\"sg\" data-s=\"4\"><code>$<\/code> nozīmē \"uztvert šo kā vienu lietu\".<\/span><\/p>"]]},"ru":{"t":"Сглаживание и элементизация","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можно положить один массив внутрь другого.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>не<\/em> соединяет их элементы сам.<\/span> <span class=\"sg\" data-s=\"2\">Посмотрите на эту программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В массиве <code>@c<\/code> всего два элемента: массивы <code>@a<\/code> и <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku хранит каждый контейнер как один элемент.<\/span> <span class=\"sg\" data-s=\"2\">Его элементы не попадают во внешний массив.<\/span> <span class=\"sg\" data-s=\"3\">То же самое с массивом среди других значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам нужна одна плоская последовательность?<\/span> <span class=\"sg\" data-s=\"1\">Тогда попросите её с помощью функции <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Упаковка в элемент (Itemisation)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно обратное.<\/span> <span class=\"sg\" data-s=\"1\">Вы хотите сохранить контейнер целым, даже внутри <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкция <code>$(...)<\/code> <em>упаковывает<\/em> свой аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Это значит, что она помечает результат как один-единственный элемент.<\/span> <span class=\"sg\" data-s=\"4\">Сравните прошлый пример с этим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>$(@a)<\/code> сохраняет <code>@a<\/code> как один элемент.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>@b<\/code> всё равно становится плоским.<\/span> <span class=\"sg\" data-s=\"2\">Он отдаёт свои два значения.<\/span> <span class=\"sg\" data-s=\"3\">Это снова идея сигила <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Знак <code>$<\/code> значит «считать это одной вещью».<\/span><\/p>"]]},"uk":{"t":"Сплощення та штучність","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете покласти один масив усередину іншого.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>не<\/em> об'єднує їхні елементи сам.<\/span> <span class=\"sg\" data-s=\"2\">Подивіться на цю програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Масив <code>@c<\/code> має лише два елементи: масиви <code>@a<\/code> і <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku зберігає кожен контейнер як один елемент.<\/span> <span class=\"sg\" data-s=\"2\">Його елементи не потрапляють у зовнішній масив.<\/span> <span class=\"sg\" data-s=\"3\">Те саме буває з масивом серед інших значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам потрібна одна плоска послідовність?<\/span> <span class=\"sg\" data-s=\"1\">Тоді попросіть її за допомогою підпрограми <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Штучність<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді вам потрібне протилежне.<\/span> <span class=\"sg\" data-s=\"1\">Ви хочете зберегти контейнер цілим, навіть усередині <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкція <code>$(...)<\/code> робить свій аргумент <em>штучним<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Це означає, що вона позначає результат як один-єдиний елемент.<\/span> <span class=\"sg\" data-s=\"4\">Порівняйте попередній приклад із цим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$(@a)<\/code> зберігає <code>@a<\/code> як один елемент.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>@b<\/code> усе одно стає плоским.<\/span> <span class=\"sg\" data-s=\"2\">Він дає свої два значення.<\/span> <span class=\"sg\" data-s=\"3\">Це знову ідея сигіла <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Знак <code>$<\/code> означає «розглядай це як одну річ».<\/span><\/p>"]]},"bg":{"t":"Изравняване и елементизация","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да сложите един масив в друг.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>не<\/em> обединява сам елементите им.<\/span> <span class=\"sg\" data-s=\"2\">Вижте тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Масивът <code>@c<\/code> има само два елемента: масивите <code>@a<\/code> и <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku пази всеки контейнер като един елемент.<\/span> <span class=\"sg\" data-s=\"2\">Неговите елементи не отиват във външния масив.<\/span> <span class=\"sg\" data-s=\"3\">Същото е и с масив сред други стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Искате ли една плоска последователност?<\/span> <span class=\"sg\" data-s=\"1\">Тогава я поискайте с рутината <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Айтемизация (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога искате обратното.<\/span> <span class=\"sg\" data-s=\"1\">Искате да запазите контейнер цял, дори вътре във <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкцията <code>$(...)<\/code> <em>айтемизира<\/em> аргумента си.<\/span> <span class=\"sg\" data-s=\"3\">Това означава, че тя отбелязва резултата като един единствен елемент.<\/span> <span class=\"sg\" data-s=\"4\">Сравнете предишния пример с този:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$(@a)<\/code> пази <code>@a<\/code> като един елемент.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>@b<\/code> все пак става плосък.<\/span> <span class=\"sg\" data-s=\"2\">Той дава двете си стойности.<\/span> <span class=\"sg\" data-s=\"3\">Това отново е идеята на сигила <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Знакът <code>$<\/code> означава „третирай това като едно нещо“.<\/span><\/p>"]]},"eo":{"t":"Platigo kaj ero-igo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas meti unu tabelon en alian.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>ne<\/em> kunigas iliajn elementojn per si mem.<\/span> <span class=\"sg\" data-s=\"2\">Rigardu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La tabelo <code>@c<\/code> havas nur du elementojn: la tabelojn <code>@a<\/code> kaj <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku tenas ĉiun ujon kiel unu eron.<\/span> <span class=\"sg\" data-s=\"2\">Ĝiaj elementoj ne iras en la eksteran tabelon.<\/span> <span class=\"sg\" data-s=\"3\">Same estas kun tabelo inter aliaj valoroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi volas unu platan sekvencon?<\/span> <span class=\"sg\" data-s=\"1\">Tiam petu ĝin per la rutino <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ero-igo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Foje vi volas la malon.<\/span> <span class=\"sg\" data-s=\"1\">Vi volas teni ujon en unu peco, eĉ ene de <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La konstruo <code>$(...)<\/code> <em>ero-igas<\/em> sian argumenton.<\/span> <span class=\"sg\" data-s=\"3\">Tio signifas, ke ĝi markas la rezulton kiel unu solan eron.<\/span> <span class=\"sg\" data-s=\"4\">Komparu la antaŭan ekzemplon kun ĉi tiu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>$(@a)<\/code> tenas <code>@a<\/code> kiel unu elementon.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>@b<\/code> ankoraŭ fariĝas plata.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi donas siajn du valorojn.<\/span> <span class=\"sg\" data-s=\"3\">Jen denove la ideo de la sigelo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\"><code>$<\/code> signifas «traktu ĉi tion kiel unu solan aĵon».<\/span><\/p>"]]},"la":{"t":"Complanatio et itemisatio","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Unum ordinem intra alterum ponere potes.<\/span> <span class=\"sg\" data-s=\"1\">Raku elementa eorum per se <em>non<\/em> iungit.<\/span> <span class=\"sg\" data-s=\"2\">Specta hoc programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ordo <code>@c<\/code> solum duo elementa habet: ordines <code>@a<\/code> et <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku quemque continentem ut unum elementum servat.<\/span> <span class=\"sg\" data-s=\"2\">Elementa eius in ordinem exteriorem non eunt.<\/span> <span class=\"sg\" data-s=\"3\">Idem est cum ordine inter alios valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unam seriem planam vis?<\/span> <span class=\"sg\" data-s=\"1\">Tum eam cum subroutina <code>flat<\/code> pete:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisatio<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum contrarium vis.<\/span> <span class=\"sg\" data-s=\"1\">Continentem integrum servare vis, etiam intra <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Constructio <code>$(...)<\/code> argumentum suum <em>itemisat<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Hoc significat: resultatum ut unum elementum notat.<\/span> <span class=\"sg\" data-s=\"4\">Compara exemplum prius cum hoc:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic <code>$(@a)<\/code> ordinem <code>@a<\/code> ut unum elementum servat.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>@b<\/code> adhuc planus fit.<\/span> <span class=\"sg\" data-s=\"2\">Duos valores suos dat.<\/span> <span class=\"sg\" data-s=\"3\">Haec est iterum idea sigilli <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Signum <code>$<\/code> significat “hoc ut rem unam tracta”.<\/span><\/p>"]]}}}</script>
