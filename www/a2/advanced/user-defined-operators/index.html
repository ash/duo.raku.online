<script type="application/json" id="page-data">{"u":"advanced/user-defined-operators","n":557,"k":"section","pv":"advanced/metaoperators/exercises/concatenate-a-list/solution","nx":"advanced/user-defined-operators/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"User-defined operators","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, operators are just subroutines with special names.<\/span> <span class=\"sg\" data-s=\"1\">So you can make your own operators.<\/span> <span class=\"sg\" data-s=\"2\">For this, you use the category names from the page <a href=\"/advanced/operator-types/\">Types of Raku operators<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">These are <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, and so on.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">To declare an operator, write a <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Its name has three parts.<\/span> <span class=\"sg\" data-s=\"2\">First comes the category.<\/span> <span class=\"sg\" data-s=\"3\">Then comes a colon.<\/span> <span class=\"sg\" data-s=\"4\">Then comes the symbol of the operator in angle brackets.<\/span> <span class=\"sg\" data-s=\"5\">Here is a new infix operator.<\/span> <span class=\"sg\" data-s=\"6\">Its name is <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">After that, you use <code>plus<\/code> between its two operands.<\/span> <span class=\"sg\" data-s=\"1\">It works exactly like a built-in infix operator.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A postfix operator comes after its operand.<\/span> <span class=\"sg\" data-s=\"1\">The factorial is a typical example.<\/span> <span class=\"sg\" data-s=\"2\">Here it is as the postfix operator <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It uses <a href=\"/advanced/metaoperators/reduction/\">the reduction meta-operator<\/a> that you already know:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can use more than letters and ASCII punctuation.<\/span> <span class=\"sg\" data-s=\"1\">The symbol of an operator can be any character.<\/span> <span class=\"sg\" data-s=\"2\">This prefix operator uses the section sign <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It doubles a number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Your own operators are a strong tool.<\/span> <span class=\"sg\" data-s=\"1\">So use them with care.<\/span> <span class=\"sg\" data-s=\"2\">A good operator makes the code look like the language of its subject.<\/span> <span class=\"sg\" data-s=\"3\">A strange operator only confuses the next reader.<\/span><\/p>"]]},"de":{"t":"Benutzerdefinierte Operatoren","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku sind Operatoren einfach Subroutinen mit speziellen Namen.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du eigene Operatoren machen.<\/span> <span class=\"sg\" data-s=\"2\">Dafür nimmst du die Kategorienamen von der Seite <a href=\"https://course.raku.org/de/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Typen von Raku-Operatoren<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Das sind <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> und so weiter.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Um einen Operator zu deklarieren, schreibst du ein <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sein Name hat drei Teile.<\/span> <span class=\"sg\" data-s=\"2\">Zuerst kommt die Kategorie.<\/span> <span class=\"sg\" data-s=\"3\">Dann kommt ein Doppelpunkt.<\/span> <span class=\"sg\" data-s=\"4\">Dann kommt das Symbol des Operators in spitzen Klammern.<\/span> <span class=\"sg\" data-s=\"5\">Hier ist ein neuer Infix-Operator.<\/span> <span class=\"sg\" data-s=\"6\">Sein Name ist <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Danach benutzt du <code>plus<\/code> zwischen seinen zwei Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Er funktioniert genau wie ein eingebauter Infix-Operator.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Postfix-Operator kommt nach seinem Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Die Fakultät ist ein typisches Beispiel.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist sie als Postfix-Operator <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Er nutzt den <a href=\"https://course.raku.org/de/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Reduktions-Meta-Operator<\/a>, den du schon kennst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du kannst mehr als Buchstaben und ASCII-Satzzeichen benutzen.<\/span> <span class=\"sg\" data-s=\"1\">Das Symbol eines Operators kann jedes Zeichen sein.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Prefix-Operator nutzt das Paragraphenzeichen <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Er verdoppelt eine Zahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eigene Operatoren sind ein starkes Werkzeug.<\/span> <span class=\"sg\" data-s=\"1\">Also benutze sie mit Vorsicht.<\/span> <span class=\"sg\" data-s=\"2\">Mit einem guten Operator sieht der Code aus wie die Sprache seines Themas.<\/span> <span class=\"sg\" data-s=\"3\">Ein seltsamer Operator verwirrt nur den nächsten Leser.<\/span><\/p>"]]},"nl":{"t":"Zelf gedefinieerde operatoren","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku zijn operatoren gewoon subroutines met speciale namen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dus je eigen operatoren maken.<\/span> <span class=\"sg\" data-s=\"2\">Daarvoor gebruik je de namen van de categorieën op de pagina <a href=\"https://course.raku.org/nl/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Typen Raku-operatoren<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Dat zijn <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, enzovoort.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Om een operator te declareren, schrijf je een <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De naam ervan heeft drie delen.<\/span> <span class=\"sg\" data-s=\"2\">Eerst komt de categorie.<\/span> <span class=\"sg\" data-s=\"3\">Dan komt een dubbele punt.<\/span> <span class=\"sg\" data-s=\"4\">Dan komt het symbool van de operator tussen punthaken.<\/span> <span class=\"sg\" data-s=\"5\">Hier is een nieuwe infix-operator.<\/span> <span class=\"sg\" data-s=\"6\">Zijn naam is <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Daarna gebruik je <code>plus<\/code> tussen zijn twee operanden.<\/span> <span class=\"sg\" data-s=\"1\">Hij werkt precies zoals een ingebouwde infix-operator.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een postfix-operator komt na zijn operand.<\/span> <span class=\"sg\" data-s=\"1\">De faculteit is een typisch voorbeeld.<\/span> <span class=\"sg\" data-s=\"2\">Hier zie je hem als de postfix-operator <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hij gebruikt <a href=\"https://course.raku.org/nl/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">de reductie-meta-operator<\/a> die je al kent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt meer gebruiken dan letters en ASCII-leestekens.<\/span> <span class=\"sg\" data-s=\"1\">Het symbool van een operator kan elk teken zijn.<\/span> <span class=\"sg\" data-s=\"2\">Deze prefix-operator gebruikt het paragraafteken <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hij verdubbelt een getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je eigen operatoren zijn een sterk hulpmiddel.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik ze dus met zorg.<\/span> <span class=\"sg\" data-s=\"2\">Een goede operator laat de code lijken op de taal van het onderwerp.<\/span> <span class=\"sg\" data-s=\"3\">Een vreemde operator verwart de volgende lezer alleen.<\/span><\/p>"]]},"es":{"t":"Operadores definidos por el usuario","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, los operadores son solo subrutinas con nombres especiales.<\/span> <span class=\"sg\" data-s=\"1\">Así, puedes crear tus propios operadores.<\/span> <span class=\"sg\" data-s=\"2\">Para esto, usas los nombres de categoría de la página <a href=\"https://course.raku.org/es/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipos de operadores en Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Son <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, y así sucesivamente.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Para declarar un operador, escribe un <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Su nombre tiene tres partes.<\/span> <span class=\"sg\" data-s=\"2\">Primero va la categoría.<\/span> <span class=\"sg\" data-s=\"3\">Luego van dos puntos.<\/span> <span class=\"sg\" data-s=\"4\">Después va el símbolo del operador entre corchetes angulares.<\/span> <span class=\"sg\" data-s=\"5\">Aquí hay un nuevo operador infijo.<\/span> <span class=\"sg\" data-s=\"6\">Su nombre es <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Después, usas <code>plus<\/code> entre sus dos operandos.<\/span> <span class=\"sg\" data-s=\"1\">Funciona exactamente como un operador infijo incorporado.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un operador postfijo va después de su operando.<\/span> <span class=\"sg\" data-s=\"1\">El factorial es un ejemplo típico.<\/span> <span class=\"sg\" data-s=\"2\">Aquí está como el operador postfijo <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Usa <a href=\"https://course.raku.org/es/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">el metaoperador de reducción<\/a> que ya conoces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes usar más que letras y signos de puntuación ASCII.<\/span> <span class=\"sg\" data-s=\"1\">El símbolo de un operador puede ser cualquier carácter.<\/span> <span class=\"sg\" data-s=\"2\">Este operador prefijo usa el signo de sección <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Duplica un número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tus propios operadores son una herramienta fuerte.<\/span> <span class=\"sg\" data-s=\"1\">Por eso, úsalos con cuidado.<\/span> <span class=\"sg\" data-s=\"2\">Con un buen operador, el código se parece al lenguaje de su tema.<\/span> <span class=\"sg\" data-s=\"3\">Un operador extraño solo confunde al siguiente lector.<\/span><\/p>"]]},"it":{"t":"Operatori definiti dall'utente","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, gli operatori sono solo subroutine con nomi speciali.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi creare i tuoi operatori.<\/span> <span class=\"sg\" data-s=\"2\">Per questo usi i nomi delle categorie della pagina <a href=\"https://course.raku.org/it/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipi di operatori Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Sono <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> e così via.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Per dichiarare un operatore, scrivi un <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il suo nome ha tre parti.<\/span> <span class=\"sg\" data-s=\"2\">Prima viene la categoria.<\/span> <span class=\"sg\" data-s=\"3\">Poi vengono i due punti.<\/span> <span class=\"sg\" data-s=\"4\">Poi viene il simbolo dell'operatore tra parentesi angolari.<\/span> <span class=\"sg\" data-s=\"5\">Ecco un nuovo operatore infisso.<\/span> <span class=\"sg\" data-s=\"6\">Il suo nome è <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dopo, usi <code>plus<\/code> tra i suoi due operandi.<\/span> <span class=\"sg\" data-s=\"1\">Funziona proprio come un operatore infisso integrato.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un operatore postfisso viene dopo il suo operando.<\/span> <span class=\"sg\" data-s=\"1\">Il fattoriale è un esempio tipico.<\/span> <span class=\"sg\" data-s=\"2\">Eccolo come operatore postfisso <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Usa il <a href=\"https://course.raku.org/it/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">meta-operatore di riduzione<\/a> che conosci già:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi usare anche altro, non solo lettere e punteggiatura ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Il simbolo di un operatore può essere qualsiasi carattere.<\/span> <span class=\"sg\" data-s=\"2\">Questo operatore prefisso usa il segno di sezione <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raddoppia un numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I tuoi operatori sono uno strumento forte.<\/span> <span class=\"sg\" data-s=\"1\">Quindi usali con attenzione.<\/span> <span class=\"sg\" data-s=\"2\">Con un buon operatore, il codice somiglia alla lingua del suo campo.<\/span> <span class=\"sg\" data-s=\"3\">Un operatore strano confonde solo il prossimo lettore.<\/span><\/p>"]]},"lv":{"t":"Lietotāja definēti operatori","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku operatori ir vienkārši apakšprogrammas ar īpašiem nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat izveidot savus operatorus.<\/span> <span class=\"sg\" data-s=\"2\">Tam jūs lietojat kategoriju nosaukumus no lapas <a href=\"https://course.raku.org/lv/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Raku operatoru tipi<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Tie ir <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> un tā tālāk.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Lai deklarētu operatoru, uzrakstiet <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās nosaukumam ir trīs daļas.<\/span> <span class=\"sg\" data-s=\"2\">Vispirms nāk kategorija.<\/span> <span class=\"sg\" data-s=\"3\">Tad nāk kols.<\/span> <span class=\"sg\" data-s=\"4\">Tad nāk operatora simbols leņķa iekavās.<\/span> <span class=\"sg\" data-s=\"5\">Šeit ir jauns infiksa operators.<\/span> <span class=\"sg\" data-s=\"6\">Tā nosaukums ir <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc tam jūs lietojat <code>plus<\/code> starp tā diviem operandiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas strādā tieši kā iebūvēts infiksa operators.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operators nāk aiz sava operanda.<\/span> <span class=\"sg\" data-s=\"1\">Faktoriāls ir tipisks piemērs.<\/span> <span class=\"sg\" data-s=\"2\">Šeit tas ir postfiksa operators <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas lieto <a href=\"https://course.raku.org/lv/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">redukcijas metaoperatoru<\/a>, ko jūs jau zināt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat lietot ne tikai burtus un ASCII pieturzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Operatora simbols var būt jebkura rakstzīme.<\/span> <span class=\"sg\" data-s=\"2\">Šis prefiksa operators lieto paragrāfa zīmi <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas divkāršo skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūsu pašu operatori ir spēcīgs rīks.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc lietojiet tos uzmanīgi.<\/span> <span class=\"sg\" data-s=\"2\">Labs operators padara kodu līdzīgu tā tēmas valodai.<\/span> <span class=\"sg\" data-s=\"3\">Dīvains operators tikai mulsina nākamo lasītāju.<\/span><\/p>"]]},"ru":{"t":"Пользовательские операторы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku операторы — это просто подпрограммы с особыми именами.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете делать свои операторы.<\/span> <span class=\"sg\" data-s=\"2\">Для этого вы используете названия категорий со страницы <a href=\"https://course.raku.org/ru/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типы операторов Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Это <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> и так далее.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Чтобы объявить оператор, напишите <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Имя состоит из трёх частей.<\/span> <span class=\"sg\" data-s=\"2\">Сначала идёт категория.<\/span> <span class=\"sg\" data-s=\"3\">Потом идёт двоеточие.<\/span> <span class=\"sg\" data-s=\"4\">Потом идёт символ оператора в угловых скобках.<\/span> <span class=\"sg\" data-s=\"5\">Вот новый инфиксный оператор.<\/span> <span class=\"sg\" data-s=\"6\">Его имя — <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">После этого вы пишете <code>plus<\/code> между двумя его операндами.<\/span> <span class=\"sg\" data-s=\"1\">Он работает точно как встроенный инфиксный оператор.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Постфиксный оператор стоит после своего операнда.<\/span> <span class=\"sg\" data-s=\"1\">Факториал — типичный пример.<\/span> <span class=\"sg\" data-s=\"2\">Вот он в виде постфиксного оператора <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он использует <a href=\"https://course.raku.org/ru/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператор редукции<\/a>, который вы уже знаете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можно использовать не только буквы и знаки препинания ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Символом оператора может быть любой символ.<\/span> <span class=\"sg\" data-s=\"2\">Этот префиксный оператор использует знак параграфа <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он удваивает число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Свои операторы — сильный инструмент.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому используйте их осторожно.<\/span> <span class=\"sg\" data-s=\"2\">Хороший оператор делает код похожим на язык самой задачи.<\/span> <span class=\"sg\" data-s=\"3\">Странный оператор только запутает следующего читателя.<\/span><\/p>"]]},"uk":{"t":"Оператори, визначені користувачем","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У Raku оператори — це просто підпрограми з особливими іменами.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви можете створювати власні оператори.<\/span> <span class=\"sg\" data-s=\"2\">Для цього ви використовуєте назви категорій зі сторінки <a href=\"https://course.raku.org/uk/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типи операторів Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Це <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> і так далі.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Щоб оголосити оператор, напишіть <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Його ім'я має три частини.<\/span> <span class=\"sg\" data-s=\"2\">Спершу йде категорія.<\/span> <span class=\"sg\" data-s=\"3\">Потім іде двокрапка.<\/span> <span class=\"sg\" data-s=\"4\">Потім іде символ оператора в кутових дужках.<\/span> <span class=\"sg\" data-s=\"5\">Ось новий інфіксний оператор.<\/span> <span class=\"sg\" data-s=\"6\">Його ім'я — <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Після цього ви пишете <code>plus<\/code> між двома його операндами.<\/span> <span class=\"sg\" data-s=\"1\">Він працює точно як вбудований інфіксний оператор.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Постфіксний оператор іде після свого операнда.<\/span> <span class=\"sg\" data-s=\"1\">Факторіал — типовий приклад.<\/span> <span class=\"sg\" data-s=\"2\">Ось він як постфіксний оператор <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він використовує <a href=\"https://course.raku.org/uk/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператор згортки<\/a>, який ви вже знаєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можна використовувати не лише літери й розділові знаки ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Символом оператора може бути будь-який знак.<\/span> <span class=\"sg\" data-s=\"2\">Цей префіксний оператор використовує знак параграфа <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він подвоює число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Власні оператори — сильний інструмент.<\/span> <span class=\"sg\" data-s=\"1\">Тож використовуйте їх обережно.<\/span> <span class=\"sg\" data-s=\"2\">Добрий оператор робить код схожим на мову його теми.<\/span> <span class=\"sg\" data-s=\"3\">Дивний оператор лише заплутає наступного читача.<\/span><\/p>"]]},"bg":{"t":"Потребителски оператори","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku операторите са просто подпрограми със специални имена.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да създавате свои оператори.<\/span> <span class=\"sg\" data-s=\"2\">За това използвате имената на категориите от страницата <a href=\"https://course.raku.org/bg/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Видове оператори в Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Това са <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> и така нататък.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">За да декларирате оператор, напишете <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Името на <code>sub<\/code> има три части.<\/span> <span class=\"sg\" data-s=\"2\">Първо идва категорията.<\/span> <span class=\"sg\" data-s=\"3\">После идва двоеточие.<\/span> <span class=\"sg\" data-s=\"4\">После идва символът на оператора в ъглови скоби.<\/span> <span class=\"sg\" data-s=\"5\">Ето един нов инфиксен оператор.<\/span> <span class=\"sg\" data-s=\"6\">Името му е <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След това използвате <code>plus<\/code> между двата му операнда.<\/span> <span class=\"sg\" data-s=\"1\">Той работи точно като вграден инфиксен оператор.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Постфиксният оператор идва след своя операнд.<\/span> <span class=\"sg\" data-s=\"1\">Факториелът е типичен пример.<\/span> <span class=\"sg\" data-s=\"2\">Ето го като постфиксен оператор <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той използва <a href=\"https://course.raku.org/bg/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператора за редукция<\/a>, който вече познавате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате не само букви и ASCII пунктуация.<\/span> <span class=\"sg\" data-s=\"1\">Символът на оператора може да бъде всеки знак.<\/span> <span class=\"sg\" data-s=\"2\">Този префиксен оператор използва знака за параграф <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той удвоява число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вашите собствени оператори са силен инструмент.<\/span> <span class=\"sg\" data-s=\"1\">Затова ги използвайте внимателно.<\/span> <span class=\"sg\" data-s=\"2\">Добрият оператор прави кода подобен на езика на неговата област.<\/span> <span class=\"sg\" data-s=\"3\">Странният оператор само обърква следващия читател.<\/span><\/p>"]]},"eo":{"t":"Uzant-difinitaj operatoroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, operatoroj estas nur subrutinoj kun specialaj nomoj.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas fari viajn proprajn operatorojn.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, vi uzas la kategoriajn nomojn el la paĝo <a href=\"https://course.raku.org/eo/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipoj de Raku-operatoroj<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ili estas <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> kaj tiel plu.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Por deklari operatoron, skribu <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia nomo havas tri partojn.<\/span> <span class=\"sg\" data-s=\"2\">Unue venas la kategorio.<\/span> <span class=\"sg\" data-s=\"3\">Poste venas dupunkto.<\/span> <span class=\"sg\" data-s=\"4\">Post ĝi venas la simbolo de la operatoro en angulaj krampoj.<\/span> <span class=\"sg\" data-s=\"5\">Jen nova infiksa operatoro.<\/span> <span class=\"sg\" data-s=\"6\">Ĝia nomo estas <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post tio, vi uzas <code>plus<\/code> inter ĝiaj du operandoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi funkcias ĝuste kiel enkonstruita infiksa operatoro.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operatoro venas post sia operando.<\/span> <span class=\"sg\" data-s=\"1\">La faktorialo estas tipa ekzemplo.<\/span> <span class=\"sg\" data-s=\"2\">Jen ĝi kiel la postfiksa operatoro <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi uzas <a href=\"https://course.raku.org/eo/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">la reduktan metaoperatoron<\/a>, kiun vi jam konas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas uzi pli ol literojn kaj ASCII-interpunkcion.<\/span> <span class=\"sg\" data-s=\"1\">La simbolo de operatoro povas esti ajna signo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu prefiksa operatoro uzas la paragrafan signon <code>§<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi duobligas nombron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Viaj propraj operatoroj estas forta ilo.<\/span> <span class=\"sg\" data-s=\"1\">Do uzu ilin zorge.<\/span> <span class=\"sg\" data-s=\"2\">Bona operatoro igas la kodon aspekti kiel la lingvo de ĝia temo.<\/span> <span class=\"sg\" data-s=\"3\">Stranga operatoro nur konfuzas la sekvan leganton.<\/span><\/p>"]]},"la":{"t":"Operatores ab usore definiti","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku operatores tantum subroutinae cum nominibus specialibus sunt.<\/span> <span class=\"sg\" data-s=\"1\">Ergo operatores tuos facere potes.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc nomina categoriarum adhibes ex pagina <a href=\"https://course.raku.org/la/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Types of Raku operators<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Haec sunt <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, et cetera.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ut operatorem declares, scribe <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nomen eius tres partes habet.<\/span> <span class=\"sg\" data-s=\"2\">Primum venit categoria.<\/span> <span class=\"sg\" data-s=\"3\">Deinde venit colon.<\/span> <span class=\"sg\" data-s=\"4\">Postremo venit symbolum operatoris in uncis angularibus.<\/span> <span class=\"sg\" data-s=\"5\">Hic est novus operator infixus.<\/span> <span class=\"sg\" data-s=\"6\">Nomen eius est <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postea <code>plus<\/code> inter duos operandos suos adhibes.<\/span> <span class=\"sg\" data-s=\"1\">Exacte sicut operator infixus praeconstruitus operatur.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Operator postfixus post operandum suum venit.<\/span> <span class=\"sg\" data-s=\"1\">Factorialis exemplum typicum est.<\/span> <span class=\"sg\" data-s=\"2\">Hic est ut operator postfixus <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/la/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Meta-operatorem reductionis<\/a> adhibet quem iam cognoscis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Plus quam litteras et interpunctionem ASCII adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Symbolum operatoris quilibet character esse potest.<\/span> <span class=\"sg\" data-s=\"2\">Hic operator praefixus signum sectionis <code>§<\/code> adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Numerum duplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Operatores tui instrumentum potens sunt.<\/span> <span class=\"sg\" data-s=\"1\">Ergo eos cum cura adhibe.<\/span> <span class=\"sg\" data-s=\"2\">Operator bonus codicem similem linguae argumenti sui facit.<\/span> <span class=\"sg\" data-s=\"3\">Operator insolitus tantum proximum lectorem confundit.<\/span><\/p>"]]}}}</script>
