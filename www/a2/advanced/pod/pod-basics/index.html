/p>"]]},"bg":{"t":"Основи на Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod документацията е във вашия изходен файл.<\/span> <span class=\"sg\" data-s=\"1\">Специални редове я отбелязват.<\/span> <span class=\"sg\" data-s=\"2\">Тези редове започват с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Най-простият начин е блок от Pod.<\/span> <span class=\"sg\" data-s=\"4\">Сложете го между <code>=begin pod<\/code> и <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вътре в блока директивите показват структурата на текста:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — заглавия на различни нива<\/span><\/li><li><span class=\"sg\" data-s=\"1\">нормален параграф — просто текст на отделни редове<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — един елемент в списък с точки<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Редът <code>=head1<\/code> е заглавие от най-високо ниво.<\/span> <span class=\"sg\" data-s=\"1\">Трите реда <code>=item<\/code> правят списък.<\/span> <span class=\"sg\" data-s=\"2\">Pod е до вашия код.<\/span> <span class=\"sg\" data-s=\"3\">Но той не променя кода.<\/span> <span class=\"sg\" data-s=\"4\">Компилаторът пропуска Pod, когато изпълнява програмата.<\/span> <span class=\"sg\" data-s=\"5\">Но компилаторът може и да извади Pod.<\/span> <span class=\"sg\" data-s=\"6\">Тогава той показва Pod като текст.<\/span> <span class=\"sg\" data-s=\"7\">Той прави това, когато поискате.<\/span> <span class=\"sg\" data-s=\"8\">Една от следващите теми показва това.<\/span><\/p>"]]},"eo":{"t":"Pod-bazaĵoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod-dokumentado estas en via fontdosiero.<\/span> <span class=\"sg\" data-s=\"1\">Specialaj linioj markas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj linioj komenciĝas per <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La plej simpla maniero estas bloko de Pod.<\/span> <span class=\"sg\" data-s=\"4\">Metu ĝin inter <code>=begin pod<\/code> kaj <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la bloko, direktivoj montras la strukturon de la teksto:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — titoloj de malsamaj niveloj<\/span><\/li><li><span class=\"sg\" data-s=\"1\">normala alineo — nur teksto sur propraj linioj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — unu ero en listo kun bulpunktoj<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La linio <code>=head1<\/code> estas supranivela titolo.<\/span> <span class=\"sg\" data-s=\"1\">La tri linioj <code>=item<\/code> faras liston.<\/span> <span class=\"sg\" data-s=\"2\">Pod estas apud via kodo.<\/span> <span class=\"sg\" data-s=\"3\">Sed ĝi ne ŝanĝas la kodon.<\/span> <span class=\"sg\" data-s=\"4\">La kompililo ignoras la Pod, kiam ĝi rulas la programon.<\/span> <span class=\"sg\" data-s=\"5\">Sed la kompililo ankaŭ povas elpreni la Pod.<\/span> <span class=\"sg\" data-s=\"6\">Tiam ĝi montras la Pod kiel tekston.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi faras tion, kiam vi petas.<\/span> <span class=\"sg\" data-s=\"8\">Posta temo montras tion.<\/span><\/p>"]]},"la":{"t":"Fundamenta Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Documentatio Pod in fonte tuo est.<\/span> <span class=\"sg\" data-s=\"1\">Lineae speciales eam signant.<\/span> <span class=\"sg\" data-s=\"2\">Hae lineae ab <code>=<\/code> incipiunt.<\/span> <span class=\"sg\" data-s=\"3\">Modus simplicissimus est truncus Pod.<\/span> <span class=\"sg\" data-s=\"4\">Pone eum inter <code>=begin pod<\/code> et <code>=end pod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Intra truncum directivae structuram textus ostendunt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — tituli diversorum graduum<\/span><\/li><li><span class=\"sg\" data-s=\"1\">paragraphus normalis — solum textus in lineis suis<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — unum elementum in indice cum punctis<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Linea <code>=head1<\/code> est titulus summi gradus.<\/span> <span class=\"sg\" data-s=\"1\">Tres lineae <code>=item<\/code> indicem faciunt.<\/span> <span class=\"sg\" data-s=\"2\">Pod iuxta codicem tuum est.<\/span> <span class=\"sg\" data-s=\"3\">Sed codicem non mutat.<\/span> <span class=\"sg\" data-s=\"4\">Compilator Pod praeterit cum programma exsequitur.<\/span> <span class=\"sg\" data-s=\"5\">Sed compilator etiam Pod extrahere potest.<\/span> <span class=\"sg\" data-s=\"6\">Tum Pod ut textum ostendit.<\/span> <span class=\"sg\" data-s=\"7\">Hoc facit cum rogas.<\/span> <span class=\"sg\" data-s=\"8\">Thema posterius hoc ostendit.<\/span><\/p>"]]}}}</script>
