les\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Met <code>raku --doc<\/code> print het dit:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk <code>=item<\/code> wordt een punt met een bolletje.<\/span> <span class=\"sg\" data-s=\"1\">Het blok <code>=begin code … =end code<\/code> schuift een beetje naar rechts.<\/span> <span class=\"sg\" data-s=\"2\">De tekst ervan blijft precies zoals je hem schreef.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pod omzetten naar HTML<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Op dezelfde manier kun je ook andere formaten krijgen.<\/span> <span class=\"sg\" data-s=\"1\">Installeer voor HTML een formatter-module.<\/span> <span class=\"sg\" data-s=\"2\">Dat doe je maar één keer.<\/span> <span class=\"sg\" data-s=\"3\">Schrijf dan de naam ervan na <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nu komt hetzelfde document eruit als HTML.<\/span> <span class=\"sg\" data-s=\"1\">De kop wordt een <code>&lt;h1&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De lijst wordt een <code>&lt;ul&gt;<\/code> met <code>&lt;li&gt;<\/code>-items.<\/span> <span class=\"sg\" data-s=\"3\">Het codeblok wordt een <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3," s=\"2\">Per questo non esegue il programma.<\/span> <span class=\"sg\" data-s=\"3\">Si usa l'opzione <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prendiamo l'esempio di prima, con un'intestazione e un paragrafo.<\/span> <span class=\"sg\" data-s=\"1\">Per questo esempio il comando stampa più o meno questo:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo funziona anche con gli elenchi e i blocchi di codice.<\/span> <span class=\"sg\" data-s=\"1\">Guardiamo questo Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con <code>raku --doc<\/code> stampa questo:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>=item<\/code> diventa un punto elenco.<\/span> <span class=\"sg\" data-s=\"1\">Il blocco <code>=begin code … =end code<\/code> si sposta un po' a destra.<\/span> <span class=\"sg\" data-s=\"2\">Il suo testo resta esattamente come è scritto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Trasformare il Pod in HTML<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Allo stesso modo si possono avere anche altri formati.<\/span> <span class=\"sg\" data-s=\"1\">Per l'HTML si installa un modulo di formattazione.<\/span> <span class=\"sg\" data-s=\"2\">Questo si fa una sola volta.<\/span> <span class=\"sg\" data-s=\"3\">Poi si scrive il suo nome dopo <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ora lo stesso documento esce come HTML.<\/span> <span class=\"sg\" data-s=\"1\">L'intestazione diventa un <code>&lt;h1&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L'elenco diventa un <code>&lt;ul&gt;<\/code> con elementi <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il blocco di codice diventa un <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lo strumento mette anche tutto questo in una pagina HTML completa.<\/span> <span class=\"sg\" data-s=\"1\">La documentazione ufficiale di Raku su <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> si fa in questo modo.<\/span> <span class=\"sg\" data-s=\"2\">Viene da file Pod.<\/span><\/p>"]]},"lv":{"t":"Pod renderēšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Varbūt jūsu failā ir Pod.<\/span> <span class=\"sg\" data-s=\"1\">Tad kompilators var to pārvērst formatētā tekstā.<\/span> <span class=\"sg\" data-s=\"2\">Programmu tas šim nepalaiž.<\/span> <span class=\"sg\" data-s=\"3\">Izmantojiet opciju <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ņemiet iepriekšējo piemēru ar virsrakstu un rindkopu.<\/span> <span class=\"sg\" data-s=\"1\">Tam komanda izdrukā apmēram šo:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas darbojas arī ar sarakstiem un koda blokiem.<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet šo Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar <code>raku --doc<\/code> tas izdrukā šo:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>=item<\/code> kļūst par punktu ar aizzīmi.<\/span> <span class=\"sg\" data-s=\"1\">Bloks <code>=begin code … =end code<\/code> pārvietojas nedaudz pa labi.<\/span> <span class=\"sg\" data-s=\"2\">Tā teksts paliek tieši tāds, kādu jūs to uzrakstījāt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pod pārvēršana HTML formātā<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tādā pašā veidā jūs varat iegūt arī citus formātus.<\/span> <span class=\"sg\" data-s=\"1\">HTML formātam instalējiet atveidotāja moduli.<\/span> <span class=\"sg\" data-s=\"2\">To jūs darāt tikai vienreiz.<\/span> <span class=\"sg\" data-s=\"3\">Tad uzrakstiet tā nosaukumu aiz <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tagad tas pats dokuments iznāk kā HTML.<\/span> <span class=\"sg\" data-s=\"1\">Virsraksts kļūst par <code>&lt;h1&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Saraksts kļūst par <code>&lt;ul&gt;<\/code> ar <code>&lt;li&gt;<\/code> punktiem.<\/span> <span class=\"sg\" data-s=\"3\">Koda bloks kļūst par <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rīks to arī ieliek pilnā HTML lappusē.<\/span> <span class=\"sg\" data-s=\"1\">Oficiālo Raku dokumentāciju vietnē <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> veido tieši tā.<\/span> <span class=\"sg\" data-s=\"2\">Tā rodas no Pod failiem.<\/span><\/p>"]]},"ru":{"t":"Рендеринг Pod","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В вашем файле может быть Pod.<\/span> <span class=\"sg\" data-s=\"1\">Тогда компилятор может превратить его в форматированный текст.<\/span> <span class=\"sg\" data-s=\"2\">Для этого он не запускает программу.<\/span> <span class=\"sg\" data-s=\"3\">Используйте опцию <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Возьмите прошлый пример с заголовком и абзацем.<\/span> <span class=\"sg\" data-s=\"1\">Для него команда печатает примерно такое:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это работает и со списками, и с блоками кода.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на этот Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>raku --doc<\/code> он печатает вот что:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждый <code>=item<\/code> становится пунктом с маркером.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>=begin code … =end code<\/code> сдвигается немного вправо.<\/span> <span class=\"sg\" data-s=\"2\">Его текст остаётся точно таким, как вы его написали.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Как превратить Pod в HTML<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так же вы можете получить и другие форматы.<\/span> <span class=\"sg\" data-s=\"1\">Для HTML установите модуль-форматтер.<\/span> <span class=\"sg\" data-s=\"2\">Вы делаете это только один раз.<\/span> <span class=\"sg\" data-s=\"3\">Потом напишите его имя после <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Теперь тот же документ выходит в виде HTML.<\/span> <span class=\"sg\" data-s=\"1\">Заголовок становится элементом <code>&lt;h1&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Список становится <code>&lt;ul&gt;<\/code> с пунктами <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Блок кода становится <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ещё инструмент помещает это в полную HTML-страницу.<\/span> <span class=\"sg\" data-s=\"1\">Официальную документацию Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> делают именно так.<\/span> <span class=\"sg\" data-s=\"2\">Она получается из файлов Pod.<\/span><\/p>"]]},"uk":{"t":"Відображення Pod","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У вашому файлі може бути Pod.<\/span> <span class=\"sg\" data-s=\"1\">Тоді компілятор може перетворити його на форматований текст.<\/span> <span class=\"sg\" data-s=\"2\">Для цього він не запускає програму.<\/span> <span class=\"sg\" data-s=\"3\">Використайте опцію <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Візьміть попередній приклад із заголовком та абзацом.<\/span> <span class=\"sg\" data-s=\"1\">Для нього команда виводить приблизно таке:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це працює і зі списками та блоками коду.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на такий Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Через <code>raku --doc<\/code> він виводить ось що:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>=item<\/code> стає пунктом із маркером.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>=begin code … =end code<\/code> трохи зсувається вправо.<\/span> <span class=\"sg\" data-s=\"2\">Його текст залишається точно таким, як ви його написали.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перетворення Pod на HTML<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так само ви можете отримати й інші формати.<\/span> <span class=\"sg\" data-s=\"1\">Для HTML встановіть модуль-форматувальник.<\/span> <span class=\"sg\" data-s=\"2\">Ви робите це лише один раз.<\/span> <span class=\"sg\" data-s=\"3\">Потім напишіть його назву після <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тепер той самий документ виходить як HTML.<\/span> <span class=\"sg\" data-s=\"1\">Заголовок стає <code>&lt;h1&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Список стає <code>&lt;ul&gt;<\/code> з пунктами <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Блок коду стає <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Інструмент також вкладає це в повну сторінку HTML.<\/span> <span class=\"sg\" data-s=\"1\">Офіційну документацію Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> роблять саме так.<\/span> <span class=\"sg\" data-s=\"2\">Вона береться з файлів Pod.<\/span><\/p>"]]},"bg":{"t":"Рендериране на Pod","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Във вашия файл може да има Pod.<\/span> <span class=\"sg\" data-s=\"1\">Тогава компилаторът може да го превърне във форматиран текст.<\/span> <span class=\"sg\" data-s=\"2\">За това той не изпълнява програмата.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте опцията <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вземете по-ранния пример със заглавие и параграф.<\/span> <span class=\"sg\" data-s=\"1\">За него командата отпечатва нещо такова:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това работи и със списъци, и с кодови блокове.<\/span> <span class=\"sg\" data
