--doc<\/code> показва Pod като текст. Той не изпълнява никакъв код от програмата.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Искате ли наистина да <em>видите<\/em> удебеления текст? Тогава превърнете Pod във формат със стилове. Първо инсталирайте форматиращ модул, например <code>Pod::To::HTML<\/code>. За това използвайте <code>zef install Pod::To::HTML<\/code>. След това изпълнете <code>raku --doc=HTML formatted-text.raku<\/code>. Сега думата е вътре в HTML елемент <code>&lt;b&gt;<\/code>. Обикновеният текст от <code>--doc<\/code> е различен. Той не може да покаже удебелен текст във файл или в тръба.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Formatita teksto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu ĝin per <code>raku --doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> faras la vorton grasa. En simpla teksto ĝi aspektas kiel normala teksto. Sed pli riĉaj formatoj montras ĝin grase.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> montras la Pod kiel tekston. Ĝi ne rulas iun ajn kodon de la programo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉu vi volas vere <em>vidi<\/em> la grasan tekston? Tiam ŝanĝu la Pod en formaton kun stiloj. Unue, instalu formatilan modulon, ekzemple <code>Pod::To::HTML<\/code>. Uzu <code>zef install Pod::To::HTML<\/code> por tio. Poste rulu <code>raku --doc=HTML formatted-text.raku<\/code>. Nun la vorto estas en HTML-elemento <code>&lt;b&gt;<\/code>. Simpla teksto el <code>--doc<\/code> estas alia. Ĝi ne povas montri grasan tekston en dosiero aŭ dukto.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Textum formatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Fontem codicis in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exsequere eum cum <code>raku --doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> verbum crassum facit. In textu simplici ut textus ordinarius apparet. Sed formata ditiora id crasse ostendunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> Pod ut textum ostendit. Nullum codicem programmatis exsequitur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Visne crassum vere <em>videre<\/em>? Tum Pod in formatum cum ornamentis verte. Primum modulum formatoris installa, exempli gratia <code>Pod::To::HTML<\/code>. Ad hoc <code>zef install Pod::To::HTML<\/code> adhibe. Deinde <code>raku --doc=HTML formatted-text.raku<\/code> exsequere. Nunc verbum intra elementum HTML <code>&lt;b&gt;<\/code> est. Textus simplex ex <code>--doc<\/code> alius est. Crassum in fasciculo vel tubo ostendere non potest.<\/span><\/li><\/ol>"]]}}}</script>
