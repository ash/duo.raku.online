<script type="application/json" id="page-data">{"u":"advanced/pod/accessing-pod","n":762,"k":"topic","pv":"advanced/pod/rendering-pod","nx":"advanced/pod/exercises","tr":["advanced","advanced/pod"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Accessing the Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">You can show Pod as formatted text.<\/span> <span class=\"sg\" data-s=\"1\">But a program can also read its own Pod from <strong>inside<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">It does this while it runs.<\/span> <span class=\"sg\" data-s=\"3\">The special variable <code>$=pod<\/code> keeps the Pod of the current file.<\/span> <span class=\"sg\" data-s=\"4\">It is a list of block objects.<\/span> <span class=\"sg\" data-s=\"5\">So a program can look at its own documentation:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Here, <code>$=pod<\/code> has one element: the <code>pod<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">You can go inside this block.<\/span> <span class=\"sg\" data-s=\"2\">There, you can read headings, paragraphs and items as data.<\/span> <span class=\"sg\" data-s=\"3\">Some tools make documentation.<\/span> <span class=\"sg\" data-s=\"4\">Other tools test that the documentation is there.<\/span> <span class=\"sg\" data-s=\"5\">All these tools need this.<\/span> <span class=\"sg\" data-s=\"6\">You can show the documentation with <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Or you can read it through <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">In both cases, it is a real part of the program.<\/span> <span class=\"sg\" data-s=\"9\">It is not a comment, and Raku does not throw it away.<\/span><\/p>"]]},"de":{"t":"Auf Pod zugreifen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Du kannst Pod als formatierten Text zeigen.<\/span> <span class=\"sg\" data-s=\"1\">Aber ein Programm kann sein eigenes Pod auch <strong>von innen<\/strong> lesen.<\/span> <span class=\"sg\" data-s=\"2\">Das macht es, während es läuft.<\/span> <span class=\"sg\" data-s=\"3\">Die spezielle Variable <code>$=pod<\/code> enthält das Pod der aktuellen Datei.<\/span> <span class=\"sg\" data-s=\"4\">Sie ist eine Liste von Block-Objekten.<\/span> <span class=\"sg\" data-s=\"5\">So kann ein Programm seine eigene Dokumentation ansehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Hier hat <code>$=pod<\/code> ein Element: den <code>pod<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst in diesen Block hineingehen.<\/span> <span class=\"sg\" data-s=\"2\">Dort kannst du Überschriften, Absätze und Listenpunkte als Daten lesen.<\/span> <span class=\"sg\" data-s=\"3\">Manche Werkzeuge machen Dokumentation.<\/span> <span class=\"sg\" data-s=\"4\">Andere Werkzeuge testen, ob die Dokumentation da ist.<\/span> <span class=\"sg\" data-s=\"5\">All diese Werkzeuge brauchen das.<\/span> <span class=\"sg\" data-s=\"6\">Du kannst die Dokumentation mit <code>--doc<\/code> zeigen.<\/span> <span class=\"sg\" data-s=\"7\">Oder du kannst sie über <code>$=pod<\/code> lesen.<\/span> <span class=\"sg\" data-s=\"8\">In beiden Fällen ist sie ein echter Teil des Programms.<\/span> <span class=\"sg\" data-s=\"9\">Sie ist kein Kommentar, und Raku wirft sie nicht weg.<\/span><\/p>"]]},"nl":{"t":"Toegang tot de Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Je kunt Pod tonen als opgemaakte tekst.<\/span> <span class=\"sg\" data-s=\"1\">Maar een programma kan zijn eigen Pod ook van <strong>binnenuit<\/strong> lezen.<\/span> <span class=\"sg\" data-s=\"2\">Dat doet het terwijl het draait.<\/span> <span class=\"sg\" data-s=\"3\">De speciale variabele <code>$=pod<\/code> bewaart de Pod van het huidige bestand.<\/span> <span class=\"sg\" data-s=\"4\">Het is een lijst van blokobjecten.<\/span> <span class=\"sg\" data-s=\"5\">Zo kan een programma naar zijn eigen documentatie kijken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Hier heeft <code>$=pod<\/code> één element: het <code>pod<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt in dit blok naar binnen gaan.<\/span> <span class=\"sg\" data-s=\"2\">Daar kun je koppen, alinea's en items als gegevens lezen.<\/span> <span class=\"sg\" data-s=\"3\">Sommige tools maken documentatie.<\/span> <span class=\"sg\" data-s=\"4\">Andere tools testen of de documentatie er is.<\/span> <span class=\"sg\" data-s=\"5\">Al deze tools hebben dit nodig.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt de documentatie tonen met <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Of je kunt ze lezen via <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">In beide gevallen is de documentatie een echt deel van het programma.<\/span> <span class=\"sg\" data-s=\"9\">Ze is geen commentaar, en Raku gooit ze niet weg.<\/span><\/p>"]]},"es":{"t":"Acceder al Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Puedes mostrar el Pod como texto con formato.<\/span> <span class=\"sg\" data-s=\"1\">Pero un programa también puede leer su propio Pod <strong>desde dentro<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Lo hace mientras se ejecuta.<\/span> <span class=\"sg\" data-s=\"3\">La variable especial <code>$=pod<\/code> guarda el Pod del archivo actual.<\/span> <span class=\"sg\" data-s=\"4\">Es una lista de objetos de bloque.<\/span> <span class=\"sg\" data-s=\"5\">Así un programa puede mirar su propia documentación:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>$=pod<\/code> tiene un elemento: el bloque <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes entrar en este bloque.<\/span> <span class=\"sg\" data-s=\"2\">Allí puedes leer encabezados, párrafos y elementos como datos.<\/span> <span class=\"sg\" data-s=\"3\">Algunas herramientas crean documentación.<\/span> <span class=\"sg\" data-s=\"4\">Otras herramientas comprueban que la documentación está allí.<\/span> <span class=\"sg\" data-s=\"5\">Todas estas herramientas necesitan esto.<\/span> <span class=\"sg\" data-s=\"6\">Puedes mostrar la documentación con <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">O puedes leerla a través de <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">En los dos casos, es una parte real del programa.<\/span> <span class=\"sg\" data-s=\"9\">No es un comentario, y Raku no la quita.<\/span><\/p>"]]},"it":{"t":"Accedere al Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Il Pod si può mostrare come testo formattato.<\/span> <span class=\"sg\" data-s=\"1\">Ma un programma può anche leggere il proprio Pod <strong>dall'interno<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Lo fa mentre è in esecuzione.<\/span> <span class=\"sg\" data-s=\"3\">La variabile speciale <code>$=pod<\/code> contiene il Pod del file corrente.<\/span> <span class=\"sg\" data-s=\"4\">È una lista di oggetti blocco.<\/span> <span class=\"sg\" data-s=\"5\">Così un programma può guardare la propria documentazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Qui <code>$=pod<\/code> ha un solo elemento: il blocco <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si può entrare in questo blocco.<\/span> <span class=\"sg\" data-s=\"2\">Lì si possono leggere intestazioni, paragrafi ed elementi come dati.<\/span> <span class=\"sg\" data-s=\"3\">Alcuni strumenti creano documentazione.<\/span> <span class=\"sg\" data-s=\"4\">Altri strumenti controllano se la documentazione c'è.<\/span> <span class=\"sg\" data-s=\"5\">Tutti questi strumenti ne hanno bisogno.<\/span> <span class=\"sg\" data-s=\"6\">La documentazione si può mostrare con <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Oppure si può leggere attraverso <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">In tutti e due i casi è una vera parte del programma.<\/span> <span class=\"sg\" data-s=\"9\">Non è un commento, e Raku non la butta via.<\/span><\/p>"]]},"lv":{"t":"Piekļuve Pod datiem","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Jūs varat parādīt Pod kā formatētu tekstu.<\/span> <span class=\"sg\" data-s=\"1\">Bet programma var arī nolasīt savu Pod <strong>no iekšpuses<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Tā to dara, kamēr darbojas.<\/span> <span class=\"sg\" data-s=\"3\">Speciālais mainīgais <code>$=pod<\/code> glabā pašreizējā faila Pod.<\/span> <span class=\"sg\" data-s=\"4\">Tas ir bloku objektu saraksts.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc programma var apskatīt savu dokumentāciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>$=pod<\/code> satur vienu elementu: bloku <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat ieiet šajā blokā.<\/span> <span class=\"sg\" data-s=\"2\">Tur jūs varat nolasīt virsrakstus, rindkopas un punktus kā datus.<\/span> <span class=\"sg\" data-s=\"3\">Daži rīki veido dokumentāciju.<\/span> <span class=\"sg\" data-s=\"4\">Citi rīki pārbauda, vai dokumentācija ir klāt.<\/span> <span class=\"sg\" data-s=\"5\">Visiem šiem rīkiem tas ir vajadzīgs.<\/span> <span class=\"sg\" data-s=\"6\">Jūs varat parādīt dokumentāciju ar <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Vai arī jūs varat to nolasīt caur <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Abos gadījumos tā ir īsta programmas daļa.<\/span> <span class=\"sg\" data-s=\"9\">Tā nav komentārs, un Raku to neizmet.<\/span><\/p>"]]},"ru":{"t":"Доступ к Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Вы можете показать Pod как форматированный текст.<\/span> <span class=\"sg\" data-s=\"1\">Но программа может также читать свой Pod <strong>изнутри<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Она делает это во время работы.<\/span> <span class=\"sg\" data-s=\"3\">Специальная переменная <code>$=pod<\/code> хранит Pod текущего файла.<\/span> <span class=\"sg\" data-s=\"4\">Это список объектов-блоков.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому программа может посмотреть свою документацию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Здесь в <code>$=pod<\/code> один элемент: блок <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете зайти внутрь этого блока.<\/span> <span class=\"sg\" data-s=\"2\">Там вы можете читать заголовки, абзацы и элементы как данные.<\/span> <span class=\"sg\" data-s=\"3\">Некоторые инструменты делают документацию.<\/span> <span class=\"sg\" data-s=\"4\">Другие инструменты проверяют, что документация есть.<\/span> <span class=\"sg\" data-s=\"5\">Всем этим инструментам это нужно.<\/span> <span class=\"sg\" data-s=\"6\">Вы можете показать документацию с помощью <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Или вы можете читать её через <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">В обоих случаях это настоящая часть программы.<\/span> <span class=\"sg\" data-s=\"9\">Это не комментарий, и Raku её не выбрасывает.<\/span><\/p>"]]},"uk":{"t":"Доступ до Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ви можете показати Pod як форматований текст.<\/span> <span class=\"sg\" data-s=\"1\">Але програма також може читати свій Pod <strong>зсередини<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Вона робить це під час роботи.<\/span> <span class=\"sg\" data-s=\"3\">Спеціальна змінна <code>$=pod<\/code> зберігає Pod поточного файлу.<\/span> <span class=\"sg\" data-s=\"4\">Це список об'єктів-блоків.<\/span> <span class=\"sg\" data-s=\"5\">Тож програма може подивитися на власну документацію:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$=pod<\/code> має один елемент: блок <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете зайти всередину цього блоку.<\/span> <span class=\"sg\" data-s=\"2\">Там ви можете читати заголовки, абзаци й пункти як дані.<\/span> <span class=\"sg\" data-s=\"3\">Деякі інструменти створюють документацію.<\/span> <span class=\"sg\" data-s=\"4\">Інші інструменти перевіряють, що документація на місці.<\/span> <span class=\"sg\" data-s=\"5\">Усім цим інструментам це потрібно.<\/span> <span class=\"sg\" data-s=\"6\">Ви можете показати документацію через <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Або ви можете прочитати її через <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">В обох випадках вона — справжня частина програми.<\/span> <span class=\"sg\" data-s=\"9\">Це не коментар, і Raku її не викидає.<\/span><\/p>"]]},"bg":{"t":"Достъп до Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Можете да покажете Pod като форматиран текст.<\/span> <span class=\"sg\" data-s=\"1\">Но програмата може и да чете собствения си Pod <strong>отвътре<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Тя прави това по време на работа.<\/span> <span class=\"sg\" data-s=\"3\">Специалната променлива <code>$=pod<\/code> пази Pod на текущия файл.<\/span> <span class=\"sg\" data-s=\"4\">Това е списък от блокови обекти.<\/span> <span class=\"sg\" data-s=\"5\">Така програмата може да разгледа собствената си документация:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$=pod<\/code> има един елемент: блокът <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да влезете в този блок.<\/span> <span class=\"sg\" data-s=\"2\">Там можете да четете заглавия, параграфи и елементи като данни.<\/span> <span class=\"sg\" data-s=\"3\">Някои инструменти създават документация.<\/span> <span class=\"sg\" data-s=\"4\">Други инструменти проверяват дали има документация.<\/span> <span class=\"sg\" data-s=\"5\">Всички тези инструменти имат нужда от това.<\/span> <span class=\"sg\" data-s=\"6\">Можете да покажете документацията с <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Или можете да я прочетете чрез <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">И в двата случая тя е истинска част от програмата.<\/span> <span class=\"sg\" data-s=\"9\">Тя не е коментар и Raku не я изхвърля.<\/span><\/p>"]]},"eo":{"t":"Aliri la Pod","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Vi povas montri Pod kiel formatitan tekston.<\/span> <span class=\"sg\" data-s=\"1\">Sed programo ankaŭ povas legi sian propran Pod de <strong>interne<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi faras tion, dum ĝi ruliĝas.<\/span> <span class=\"sg\" data-s=\"3\">La speciala variablo <code>$=pod<\/code> tenas la Pod de la nuna dosiero.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi estas listo de blokobjektoj.<\/span> <span class=\"sg\" data-s=\"5\">Do programo povas rigardi sian propran dokumentadon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>$=pod<\/code> havas unu elementon: la blokon <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas iri en ĉi tiun blokon.<\/span> <span class=\"sg\" data-s=\"2\">Tie vi povas legi titolojn, alineojn kaj erojn kiel datumojn.<\/span> <span class=\"sg\" data-s=\"3\">Iuj iloj faras dokumentadon.<\/span> <span class=\"sg\" data-s=\"4\">Aliaj iloj testas, ke la dokumentado estas tie.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiuj ĉi tiuj iloj bezonas tion.<\/span> <span class=\"sg\" data-s=\"6\">Vi povas montri la dokumentadon per <code>--doc<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Aŭ vi povas legi ĝin per <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">En ambaŭ kazoj, ĝi estas vera parto de la programo.<\/span> <span class=\"sg\" data-s=\"9\">Ĝi ne estas komento, kaj Raku ne forĵetas ĝin.<\/span><\/p>"]]},"la":{"t":"Pod accedere","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Pod ut textum formatum ostendere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sed programma etiam suum Pod <strong>ab intus<\/strong> legere potest.<\/span> <span class=\"sg\" data-s=\"2\">Hoc facit dum currit.<\/span> <span class=\"sg\" data-s=\"3\">Variabilis specialis <code>$=pod<\/code> Pod huius fasciculi tenet.<\/span> <span class=\"sg\" data-s=\"4\">Est index obiectorum truncorum.<\/span> <span class=\"sg\" data-s=\"5\">Itaque programma suam documentationem inspicere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Hic <code>$=pod<\/code> unum elementum habet: truncum <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In hunc truncum intrare potes.<\/span> <span class=\"sg\" data-s=\"2\">Ibi titulos, paragraphos et elementa ut data legere potes.<\/span> <span class=\"sg\" data-s=\"3\">Quaedam instrumenta documentationem faciunt.<\/span> <span class=\"sg\" data-s=\"4\">Alia instrumenta probant documentationem adesse.<\/span> <span class=\"sg\" data-s=\"5\">Omnia haec instrumenta hoc requirunt.<\/span> <span class=\"sg\" data-s=\"6\">Documentationem cum <code>--doc<\/code> ostendere potes.<\/span> <span class=\"sg\" data-s=\"7\">Aut eam per <code>$=pod<\/code> legere potes.<\/span> <span class=\"sg\" data-s=\"8\">Utroque modo vera pars programmatis est.<\/span> <span class=\"sg\" data-s=\"9\">Commentarium non est, et Raku eam non abicit.<\/span><\/p>"]]}}}</script>
