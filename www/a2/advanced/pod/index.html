<script type="application/json" id="page-data">{"u":"advanced/pod","n":757,"k":"section","pv":"advanced/testing/exercises/test-a-list/solution","nx":"advanced/pod/pod-basics","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Documenting code","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku has its own way to write documentation.<\/span> <span class=\"sg\" data-s=\"1\">It is part of the language.<\/span> <span class=\"sg\" data-s=\"2\">Its name is <em>Pod<\/em>, or <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">You write the documentation right in your source file.<\/span> <span class=\"sg\" data-s=\"4\">For this, you use lines that start with <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">These lines are called directives.<\/span> <span class=\"sg\" data-s=\"6\">The compiler can show the documentation as formatted text.<\/span> <span class=\"sg\" data-s=\"7\">It can also give it to your program.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">This section shows the basic Pod directives.<\/span> <span class=\"sg\" data-s=\"1\">It also shows the formatting codes.<\/span> <span class=\"sg\" data-s=\"2\">With them, you mark words in the text.<\/span> <span class=\"sg\" data-s=\"3\">Last, it shows how to get the documentation.<\/span> <span class=\"sg\" data-s=\"4\">You can get it as formatted text with <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Or you can get it as data through the variable <code>$=pod<\/code>.<\/span><\/p>"]]},"de":{"t":"Code dokumentieren","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine eigene Art, Dokumentation zu schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Sie ist ein Teil der Sprache.<\/span> <span class=\"sg\" data-s=\"2\">Sie heißt <em>Pod<\/em> oder <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Du schreibst die Dokumentation direkt in deine Quelldatei.<\/span> <span class=\"sg\" data-s=\"4\">Dafür benutzt du Zeilen, die mit <code>=<\/code> anfangen.<\/span> <span class=\"sg\" data-s=\"5\">Diese Zeilen heißen Direktiven.<\/span> <span class=\"sg\" data-s=\"6\">Der Compiler kann die Dokumentation als formatierten Text zeigen.<\/span> <span class=\"sg\" data-s=\"7\">Er kann sie auch deinem Programm geben.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt die einfachen Pod-Direktiven.<\/span> <span class=\"sg\" data-s=\"1\">Er zeigt auch die Formatierungscodes.<\/span> <span class=\"sg\" data-s=\"2\">Mit ihnen markierst du Wörter im Text.<\/span> <span class=\"sg\" data-s=\"3\">Zuletzt zeigt er, wie du an die Dokumentation kommst.<\/span> <span class=\"sg\" data-s=\"4\">Du bekommst sie als formatierten Text mit <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Oder du bekommst sie als Daten über die Variable <code>$=pod<\/code>.<\/span><\/p>"]]},"nl":{"t":"Code documenteren","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een eigen manier om documentatie te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Die hoort bij de taal.<\/span> <span class=\"sg\" data-s=\"2\">De naam is <em>Pod<\/em>, of <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Je schrijft de documentatie direct in je bronbestand.<\/span> <span class=\"sg\" data-s=\"4\">Daarvoor gebruik je regels die met <code>=<\/code> beginnen.<\/span> <span class=\"sg\" data-s=\"5\">Die regels heten directieven.<\/span> <span class=\"sg\" data-s=\"6\">De compiler kan de documentatie tonen als opgemaakte tekst.<\/span> <span class=\"sg\" data-s=\"7\">Hij kan ze ook aan je programma geven.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dit gedeelte toont de basisdirectieven van Pod.<\/span> <span class=\"sg\" data-s=\"1\">Het toont ook de opmaakcodes.<\/span> <span class=\"sg\" data-s=\"2\">Daarmee markeer je woorden in de tekst.<\/span> <span class=\"sg\" data-s=\"3\">Tot slot laat het zien hoe je de documentatie krijgt.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt ze krijgen als opgemaakte tekst met <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Of je kunt ze krijgen als gegevens via de variabele <code>$=pod<\/code>.<\/span><\/p>"]]},"es":{"t":"Documentar código","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku tiene su propia forma de escribir documentación.<\/span> <span class=\"sg\" data-s=\"1\">Es parte del lenguaje.<\/span> <span class=\"sg\" data-s=\"2\">Se llama <em>Pod<\/em>, o <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Escribes la documentación directamente en tu archivo fuente.<\/span> <span class=\"sg\" data-s=\"4\">Para esto, usas líneas que empiezan con <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Estas líneas se llaman directivas.<\/span> <span class=\"sg\" data-s=\"6\">El compilador puede mostrar la documentación como texto con formato.<\/span> <span class=\"sg\" data-s=\"7\">También puede dársela a tu programa.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra las directivas básicas de Pod.<\/span> <span class=\"sg\" data-s=\"1\">También muestra los códigos de formato.<\/span> <span class=\"sg\" data-s=\"2\">Con ellos, marcas palabras en el texto.<\/span> <span class=\"sg\" data-s=\"3\">Por último, muestra cómo obtener la documentación.<\/span> <span class=\"sg\" data-s=\"4\">Puedes obtenerla con <code>raku --doc<\/code> como texto con formato.<\/span> <span class=\"sg\" data-s=\"5\">O puedes obtenerla como datos a través de la variable <code>$=pod<\/code>.<\/span><\/p>"]]},"it":{"t":"Documentare il codice","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku ha un suo modo per scrivere la documentazione.<\/span> <span class=\"sg\" data-s=\"1\">Fa parte del linguaggio.<\/span> <span class=\"sg\" data-s=\"2\">Il suo nome è <em>Pod<\/em>, o <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La documentazione si scrive direttamente nel file sorgente.<\/span> <span class=\"sg\" data-s=\"4\">Per questo si usano righe che iniziano con <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Queste righe si chiamano direttive.<\/span> <span class=\"sg\" data-s=\"6\">Il compilatore può mostrare la documentazione come testo formattato.<\/span> <span class=\"sg\" data-s=\"7\">Può anche darla al programma.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra le direttive Pod di base.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche i codici di formattazione.<\/span> <span class=\"sg\" data-s=\"2\">Con questi si segnano le parole nel testo.<\/span> <span class=\"sg\" data-s=\"3\">Infine mostra come ottenere la documentazione.<\/span> <span class=\"sg\" data-s=\"4\">È possibile averla come testo formattato con <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Oppure è possibile averla come dati, attraverso la variabile <code>$=pod<\/code>.<\/span><\/p>"]]},"lv":{"t":"Koda dokumentēšana 🆕","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku ir savs veids, kā rakstīt dokumentāciju.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir valodas daļa.<\/span> <span class=\"sg\" data-s=\"2\">Tā nosaukums ir <em>Pod<\/em> jeb <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs rakstāt dokumentāciju tieši savā pirmkoda failā.<\/span> <span class=\"sg\" data-s=\"4\">Tam jūs izmantojat rindas, kas sākas ar <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Šīs rindas sauc par direktīvām.<\/span> <span class=\"sg\" data-s=\"6\">Kompilators var parādīt dokumentāciju kā formatētu tekstu.<\/span> <span class=\"sg\" data-s=\"7\">Tas var to arī nodot jūsu programmai.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda Pod pamata direktīvas.<\/span> <span class=\"sg\" data-s=\"1\">Tā parāda arī formatēšanas kodus.<\/span> <span class=\"sg\" data-s=\"2\">Ar tiem jūs iezīmējat vārdus tekstā.<\/span> <span class=\"sg\" data-s=\"3\">Visbeidzot tā parāda, kā iegūt dokumentāciju.<\/span> <span class=\"sg\" data-s=\"4\">To var iegūt kā formatētu tekstu ar <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vai arī to var iegūt kā datus caur mainīgo <code>$=pod<\/code>.<\/span><\/p>"]]},"ru":{"t":"Документирование кода","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В Raku есть свой способ писать документацию.<\/span> <span class=\"sg\" data-s=\"1\">Этот способ — часть языка.<\/span> <span class=\"sg\" data-s=\"2\">Он называется <em>Pod<\/em>, или <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вы пишете документацию прямо в исходном файле.<\/span> <span class=\"sg\" data-s=\"4\">Для этого вы используете строки, которые начинаются с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Такие строки называются директивами.<\/span> <span class=\"sg\" data-s=\"6\">Компилятор может показать документацию как форматированный текст.<\/span> <span class=\"sg\" data-s=\"7\">Ещё он может передать её вашей программе.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Этот раздел показывает основные директивы Pod.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает коды форматирования.<\/span> <span class=\"sg\" data-s=\"2\">С ними вы отмечаете слова в тексте.<\/span> <span class=\"sg\" data-s=\"3\">В конце он показывает, как получить документацию.<\/span> <span class=\"sg\" data-s=\"4\">Вы можете получить её как форматированный текст с помощью <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Или вы можете получить её как данные через переменную <code>$=pod<\/code>.<\/span><\/p>"]]},"uk":{"t":"Документування коду","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku має власний спосіб писати документацію.<\/span> <span class=\"sg\" data-s=\"1\">Він є частиною мови.<\/span> <span class=\"sg\" data-s=\"2\">Його назва — <em>Pod<\/em>, або <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ви пишете документацію просто у файлі з вихідним кодом.<\/span> <span class=\"sg\" data-s=\"4\">Для цього ви використовуєте рядки, які починаються з <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ці рядки називають директивами.<\/span> <span class=\"sg\" data-s=\"6\">Компілятор може показати документацію як форматований текст.<\/span> <span class=\"sg\" data-s=\"7\">А ще він може передати її вашій програмі.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує основні директиви Pod.<\/span> <span class=\"sg\" data-s=\"1\">Також він показує коди форматування.<\/span> <span class=\"sg\" data-s=\"2\">Ними ви позначаєте слова в тексті.<\/span> <span class=\"sg\" data-s=\"3\">Нарешті, він показує, як отримати документацію.<\/span> <span class=\"sg\" data-s=\"4\">Ви можете отримати її як форматований текст через <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Або ви можете отримати її як дані через змінну <code>$=pod<\/code>.<\/span><\/p>"]]},"bg":{"t":"Документиране на код 🆕","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku има свой начин за писане на документация.<\/span> <span class=\"sg\" data-s=\"1\">Той е част от езика.<\/span> <span class=\"sg\" data-s=\"2\">Името му е <em>Pod<\/em>, или <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Пишете документацията направо във вашия изходен файл.<\/span> <span class=\"sg\" data-s=\"4\">За това използвате редове, които започват с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тези редове се наричат директиви.<\/span> <span class=\"sg\" data-s=\"6\">Компилаторът може да покаже документацията като форматиран текст.<\/span> <span class=\"sg\" data-s=\"7\">Той може и да я даде на вашата програма.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Този раздел показва основните Pod директиви.<\/span> <span class=\"sg\" data-s=\"1\">Той показва и форматиращите кодове.<\/span> <span class=\"sg\" data-s=\"2\">С тях маркирате думи в текста.<\/span> <span class=\"sg\" data-s=\"3\">Накрая показва как да получите документацията.<\/span> <span class=\"sg\" data-s=\"4\">Можете да я получите като форматиран текст с <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Или можете да я получите като данни чрез променливата <code>$=pod<\/code>.<\/span><\/p>"]]},"eo":{"t":"Dokumentado de kodo","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku havas sian propran manieron skribi dokumentadon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas parto de la lingvo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia nomo estas <em>Pod<\/em>, aŭ <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vi skribas la dokumentadon rekte en via fontdosiero.<\/span> <span class=\"sg\" data-s=\"4\">Por tio vi uzas liniojn, kiuj komenciĝas per <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiuj linioj nomiĝas direktivoj.<\/span> <span class=\"sg\" data-s=\"6\">La kompililo povas montri la dokumentadon kiel formatitan tekston.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ankaŭ povas doni ĝin al via programo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio montras la bazajn Pod-direktivojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras la formatajn kodojn.<\/span> <span class=\"sg\" data-s=\"2\">Per ili vi markas vortojn en la teksto.<\/span> <span class=\"sg\" data-s=\"3\">Fine, ĝi montras, kiel ricevi la dokumentadon.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas ricevi ĝin kiel formatitan tekston per <code>raku --doc<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Aŭ vi povas ricevi ĝin kiel datumojn per la variablo <code>$=pod<\/code>.<\/span><\/p>"]]},"la":{"t":"Codicem documentare","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku proprium modum habet ad documentationem scribendam.<\/span> <span class=\"sg\" data-s=\"1\">Pars linguae est.<\/span> <span class=\"sg\" data-s=\"2\">Nomen eius est <em>Pod<\/em>, vel <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Documentationem directe in fonte tuo scribis.<\/span> <span class=\"sg\" data-s=\"4\">Ad hoc lineas adhibes quae ab <code>=<\/code> incipiunt.<\/span> <span class=\"sg\" data-s=\"5\">Has lineas directivas vocamus.<\/span> <span class=\"sg\" data-s=\"6\">Compilator documentationem ut textum formatum ostendere potest.<\/span> <span class=\"sg\" data-s=\"7\">Etiam eam programmati tuo dare potest.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Haec sectio directivas Pod fundamentales ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Etiam notas formationis ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Eis verba in textu signas.<\/span> <span class=\"sg\" data-s=\"3\">Postremo ostendit quomodo documentationem accipias.<\/span> <span class=\"sg\" data-s=\"4\">Eam ut textum formatum cum <code>raku --doc<\/code> accipere potes.<\/span> <span class=\"sg\" data-s=\"5\">Aut eam ut data per variabilem <code>$=pod<\/code> accipere potes.<\/span><\/p>"]]}}}</script>
