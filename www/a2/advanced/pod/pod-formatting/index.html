<script type="application/json" id="page-data">{"u":"advanced/pod/pod-formatting","n":760,"k":"topic","pv":"advanced/pod/pod-basics/quiz","nx":"advanced/pod/rendering-pod","tr":["advanced","advanced/pod"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Formatting and code","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Pod text, you mark words with <em>formatting codes<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Each code is one letter.<\/span> <span class=\"sg\" data-s=\"2\">After the letter, you put angle brackets around the text:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — bold<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — italic<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — code (all letters have the same width)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — a link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In the formatted text, <code>important<\/code> is bold.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> is in a code font.<\/span> <span class=\"sg\" data-s=\"2\">You can put one code inside another code.<\/span> <span class=\"sg\" data-s=\"3\">In this way, you combine them.<\/span> <span class=\"sg\" data-s=\"4\">So <code>B&lt;C&lt;say&gt;&gt;<\/code> is bold code.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sometimes you need a whole block of code.<\/span> <span class=\"sg\" data-s=\"1\">A short piece inside a line is not enough.<\/span> <span class=\"sg\" data-s=\"2\">Then use a code block: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It has a line at the start and a line at the end.<\/span> <span class=\"sg\" data-s=\"4\">It keeps the text exactly as it is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">The lines in the code block appear exactly as you write them.<\/span> <span class=\"sg\" data-s=\"1\">Raku does not read them as Pod.<\/span> <span class=\"sg\" data-s=\"2\">So Pod has codes inside lines, and it has code blocks.<\/span> <span class=\"sg\" data-s=\"3\">With them, you can describe an API.<\/span> <span class=\"sg\" data-s=\"4\">An API is the way other programs use your code.<\/span> <span class=\"sg\" data-s=\"5\">You write formatted text and examples.<\/span> <span class=\"sg\" data-s=\"6\">The examples look like code that you can run.<\/span> <span class=\"sg\" data-s=\"7\">All of it stays next to the code that it describes.<\/span><\/p>"]]},"de":{"t":"Formatierung und Code","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Im Pod-Text markierst du Wörter mit <em>Formatierungscodes<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Code ist ein Buchstabe.<\/span> <span class=\"sg\" data-s=\"2\">Nach dem Buchstaben setzt du spitze Klammern um den Text:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — fett<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursiv<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — Code (alle Buchstaben sind gleich breit)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ein Link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Im formatierten Text ist <code>important<\/code> fett.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> steht in einer Code-Schrift.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst einen Code in einen anderen Code setzen.<\/span> <span class=\"sg\" data-s=\"3\">So kombinierst du sie.<\/span> <span class=\"sg\" data-s=\"4\">Also ist <code>B&lt;C&lt;say&gt;&gt;<\/code> fetter Code.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Manchmal brauchst du einen ganzen Block Code.<\/span> <span class=\"sg\" data-s=\"1\">Ein kurzes Stück in einer Zeile reicht nicht.<\/span> <span class=\"sg\" data-s=\"2\">Dann benutze einen Codeblock: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Er hat eine Zeile am Anfang und eine Zeile am Ende.<\/span> <span class=\"sg\" data-s=\"4\">Er behält den Text genau so, wie er ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Die Zeilen im Codeblock erscheinen genau so, wie du sie schreibst.<\/span> <span class=\"sg\" data-s=\"1\">Raku liest sie nicht als Pod.<\/span> <span class=\"sg\" data-s=\"2\">Pod hat also Codes innerhalb von Zeilen, und es hat Codeblöcke.<\/span> <span class=\"sg\" data-s=\"3\">Damit kannst du eine API beschreiben.<\/span> <span class=\"sg\" data-s=\"4\">Eine API ist die Art, wie andere Programme deinen Code benutzen.<\/span> <span class=\"sg\" data-s=\"5\">Du schreibst formatierten Text und Beispiele.<\/span> <span class=\"sg\" data-s=\"6\">Die Beispiele sehen wie Code aus, den du ausführen kannst.<\/span> <span class=\"sg\" data-s=\"7\">All das steht direkt neben dem Code, den es beschreibt.<\/span><\/p>"]]},"nl":{"t":"Opmaak en code","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Pod-tekst markeer je woorden met <em>opmaakcodes<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Elke code is één letter.<\/span> <span class=\"sg\" data-s=\"2\">Na de letter zet je punthaken rond de tekst:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — vet<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — cursief<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — code (alle letters hebben dezelfde breedte)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — een link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In de opgemaakte tekst is <code>important<\/code> vet.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> staat in een lettertype voor code.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt een code in een andere code zetten.<\/span> <span class=\"sg\" data-s=\"3\">Zo combineer je ze.<\/span> <span class=\"sg\" data-s=\"4\"><code>B&lt;C&lt;say&gt;&gt;<\/code> is dus vette code.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Soms heb je een heel blok code nodig.<\/span> <span class=\"sg\" data-s=\"1\">Een kort stukje in een regel is niet genoeg.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik dan een codeblok: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het heeft een regel aan het begin en een regel aan het eind.<\/span> <span class=\"sg\" data-s=\"4\">Het bewaart de tekst precies zoals hij is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">De regels in het codeblok verschijnen precies zoals je ze schrijft.<\/span> <span class=\"sg\" data-s=\"1\">Raku leest ze niet als Pod.<\/span> <span class=\"sg\" data-s=\"2\">Pod heeft dus codes binnen regels, en het heeft codeblokken.<\/span> <span class=\"sg\" data-s=\"3\">Daarmee kun je een API beschrijven.<\/span> <span class=\"sg\" data-s=\"4\">Een API is de manier waarop andere programma's je code gebruiken.<\/span> <span class=\"sg\" data-s=\"5\">Je schrijft opgemaakte tekst en voorbeelden.<\/span> <span class=\"sg\" data-s=\"6\">De voorbeelden zien eruit als code die je kunt uitvoeren.<\/span> <span class=\"sg\" data-s=\"7\">Alles blijft naast de code die het beschrijft.<\/span><\/p>"]]},"es":{"t":"Formato y código","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En el texto Pod, marcas las palabras con <em>códigos de formato<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Cada código es una letra.<\/span> <span class=\"sg\" data-s=\"2\">Después de la letra, pones paréntesis angulares alrededor del texto:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — negrita<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — cursiva<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — código (todas las letras tienen el mismo ancho)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — un enlace<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En el texto con formato, <code>important<\/code> está en negrita.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> está en fuente de código.<\/span> <span class=\"sg\" data-s=\"2\">Puedes poner un código dentro de otro código.<\/span> <span class=\"sg\" data-s=\"3\">De esta forma, los combinas.<\/span> <span class=\"sg\" data-s=\"4\">Así que <code>B&lt;C&lt;say&gt;&gt;<\/code> es código en negrita.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas un bloque entero de código.<\/span> <span class=\"sg\" data-s=\"1\">Un trozo corto dentro de una línea no basta.<\/span> <span class=\"sg\" data-s=\"2\">Entonces usa un bloque de código: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiene una línea al principio y una línea al final.<\/span> <span class=\"sg\" data-s=\"4\">Guarda el texto exactamente como está:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Las líneas del bloque de código aparecen exactamente como las escribes.<\/span> <span class=\"sg\" data-s=\"1\">Raku no las lee como Pod.<\/span> <span class=\"sg\" data-s=\"2\">Así que Pod tiene códigos dentro de las líneas y tiene bloques de código.<\/span> <span class=\"sg\" data-s=\"3\">Con ellos, puedes describir una API.<\/span> <span class=\"sg\" data-s=\"4\">Una API es la forma en que otros programas usan tu código.<\/span> <span class=\"sg\" data-s=\"5\">Escribes texto con formato y ejemplos.<\/span> <span class=\"sg\" data-s=\"6\">Los ejemplos parecen código que puedes ejecutar.<\/span> <span class=\"sg\" data-s=\"7\">Todo esto está junto al código que describe.<\/span><\/p>"]]},"it":{"t":"Formattazione e codice","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nel testo Pod, le parole si segnano con <em>codici di formattazione<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni codice è una lettera.<\/span> <span class=\"sg\" data-s=\"2\">Dopo la lettera si mettono parentesi angolari intorno al testo:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — grassetto<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — corsivo<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — codice (tutte le lettere hanno la stessa larghezza)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — un collegamento<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nel testo formattato, <code>important<\/code> è in grassetto.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> è scritto con un carattere per il codice.<\/span> <span class=\"sg\" data-s=\"2\">Si può mettere un codice dentro un altro codice.<\/span> <span class=\"sg\" data-s=\"3\">In questo modo si combinano.<\/span> <span class=\"sg\" data-s=\"4\">Quindi <code>B&lt;C&lt;say&gt;&gt;<\/code> è codice in grassetto.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A volte serve un intero blocco di codice.<\/span> <span class=\"sg\" data-s=\"1\">Un piccolo pezzo dentro una riga non basta.<\/span> <span class=\"sg\" data-s=\"2\">Allora si usa un blocco di codice: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ha una riga all'inizio e una riga alla fine.<\/span> <span class=\"sg\" data-s=\"4\">Mantiene il testo esattamente così com'è:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Le righe nel blocco di codice appaiono esattamente come sono scritte.<\/span> <span class=\"sg\" data-s=\"1\">Raku non le legge come Pod.<\/span> <span class=\"sg\" data-s=\"2\">Quindi il Pod ha codici dentro le righe, e ha blocchi di codice.<\/span> <span class=\"sg\" data-s=\"3\">Con questi si può descrivere un'API.<\/span> <span class=\"sg\" data-s=\"4\">Un'API è il modo in cui altri programmi usano il tuo codice.<\/span> <span class=\"sg\" data-s=\"5\">Si scrivono testi formattati ed esempi.<\/span> <span class=\"sg\" data-s=\"6\">Gli esempi sembrano codice che si può eseguire.<\/span> <span class=\"sg\" data-s=\"7\">Tutto questo resta accanto al codice che descrive.<\/span><\/p>"]]},"lv":{"t":"Formatēšana un kods","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pod tekstā jūs iezīmējat vārdus ar <em>formatēšanas kodiem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Katrs kods ir viens burts.<\/span> <span class=\"sg\" data-s=\"2\">Pēc burta jūs liekat leņķa iekavas ap tekstu:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — treknraksts<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursīvs<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — kods (visiem burtiem ir vienāds platums)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — saite<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Formatētajā tekstā <code>important<\/code> ir treknrakstā.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> ir koda fontā.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat ielikt vienu kodu citā kodā.<\/span> <span class=\"sg\" data-s=\"3\">Šādi jūs tos apvienojat.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc <code>B&lt;C&lt;say&gt;&gt;<\/code> ir trekns kods.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums vajag veselu koda bloku.<\/span> <span class=\"sg\" data-s=\"1\">Ar īsu gabalu rindas iekšpusē nepietiek.<\/span> <span class=\"sg\" data-s=\"2\">Tad izmantojiet koda bloku: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tam ir rinda sākumā un rinda beigās.<\/span> <span class=\"sg\" data-s=\"4\">Tas saglabā tekstu tieši tādu, kāds tas ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Rindas koda blokā parādās tieši tā, kā jūs tās uzrakstāt.<\/span> <span class=\"sg\" data-s=\"1\">Raku tās nelasa kā Pod.<\/span> <span class=\"sg\" data-s=\"2\">Tātad Pod piedāvā kodus rindu iekšpusē, un tas piedāvā arī koda blokus.<\/span> <span class=\"sg\" data-s=\"3\">Ar tiem jūs varat aprakstīt API.<\/span> <span class=\"sg\" data-s=\"4\">API ir veids, kā citas programmas izmanto jūsu kodu.<\/span> <span class=\"sg\" data-s=\"5\">Jūs rakstāt formatētu tekstu un piemērus.<\/span> <span class=\"sg\" data-s=\"6\">Piemēri izskatās kā kods, ko var palaist.<\/span> <span class=\"sg\" data-s=\"7\">Tas viss paliek blakus kodam, ko tas apraksta.<\/span><\/p>"]]},"ru":{"t":"Форматирование и код","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В тексте Pod вы отмечаете слова <em>кодами форматирования<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Каждый код — это одна буква.<\/span> <span class=\"sg\" data-s=\"2\">После буквы вы ставите угловые скобки вокруг текста:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — жирный<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (все буквы одной ширины)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ссылка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В форматированном тексте <code>important<\/code> стоит жирным шрифтом.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> стоит шрифтом для кода.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете поставить один код внутрь другого кода.<\/span> <span class=\"sg\" data-s=\"3\">Так вы их соединяете.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому <code>B&lt;C&lt;say&gt;&gt;<\/code> — это жирный код.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Иногда вам нужен целый блок кода.<\/span> <span class=\"sg\" data-s=\"1\">Короткого кусочка внутри строки мало.<\/span> <span class=\"sg\" data-s=\"2\">Тогда используйте блок кода: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">У него есть строка в начале и строка в конце.<\/span> <span class=\"sg\" data-s=\"4\">Он сохраняет текст точно таким, какой он есть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Строки в блоке кода выглядят точно так, как вы их пишете.<\/span> <span class=\"sg\" data-s=\"1\">Raku не читает их как Pod.<\/span> <span class=\"sg\" data-s=\"2\">Итак, в Pod есть коды внутри строк и есть блоки кода.<\/span> <span class=\"sg\" data-s=\"3\">С ними вы можете описать API.<\/span> <span class=\"sg\" data-s=\"4\">API — это то, как другие программы используют ваш код.<\/span> <span class=\"sg\" data-s=\"5\">Вы пишете форматированный текст и примеры.<\/span> <span class=\"sg\" data-s=\"6\">Примеры выглядят как код, который можно запустить.<\/span> <span class=\"sg\" data-s=\"7\">Всё это остаётся рядом с кодом, который оно описывает.<\/span><\/p>"]]},"uk":{"t":"Форматування та код","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У тексті Pod ви позначаєте слова <em>кодами форматування<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Кожен код — це одна літера.<\/span> <span class=\"sg\" data-s=\"2\">Після літери ви ставите кутові дужки навколо тексту:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — жирний<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (усі літери мають однакову ширину)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — посилання<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У форматованому тексті <code>important<\/code> стоїть жирним.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> стоїть шрифтом коду.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете вкласти один код в інший код.<\/span> <span class=\"sg\" data-s=\"3\">Так ви їх поєднуєте.<\/span> <span class=\"sg\" data-s=\"4\">Тож <code>B&lt;C&lt;say&gt;&gt;<\/code> — це жирний код.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді вам потрібен цілий блок коду.<\/span> <span class=\"sg\" data-s=\"1\">Короткого шматка всередині рядка мало.<\/span> <span class=\"sg\" data-s=\"2\">Тоді використайте блок коду: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він має рядок на початку і рядок у кінці.<\/span> <span class=\"sg\" data-s=\"4\">Він зберігає текст точно таким, як він є:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Рядки в блоці коду виглядають точно так, як ви їх пишете.<\/span> <span class=\"sg\" data-s=\"1\">Raku не читає їх як Pod.<\/span> <span class=\"sg\" data-s=\"2\">Отже, Pod має коди всередині рядків і має блоки коду.<\/span> <span class=\"sg\" data-s=\"3\">З ними ви можете описати API.<\/span> <span class=\"sg\" data-s=\"4\">API — це спосіб, яким інші програми використовують ваш код.<\/span> <span class=\"sg\" data-s=\"5\">Ви пишете форматований текст і приклади.<\/span> <span class=\"sg\" data-s=\"6\">Приклади виглядають як код, який можна запустити.<\/span> <span class=\"sg\" data-s=\"7\">Усе це лежить поруч із кодом, який воно описує.<\/span><\/p>"]]},"bg":{"t":"Форматиране и код","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Pod текста маркирате думи с <em>форматиращи кодове<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Всеки код е една буква.<\/span> <span class=\"sg\" data-s=\"2\">След буквата слагате ъглови скоби около текста:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — удебелен<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (всички букви имат еднаква ширина)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — връзка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Във форматирания текст <code>important<\/code> е удебелено.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> е с шрифт за код.<\/span> <span class=\"sg\" data-s=\"2\">Можете да сложите един код в друг код.<\/span> <span class=\"sg\" data-s=\"3\">Така ги комбинирате.<\/span> <span class=\"sg\" data-s=\"4\">Затова <code>B&lt;C&lt;say&gt;&gt;<\/code> е удебелен код.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога ви трябва цял блок от код.<\/span> <span class=\"sg\" data-s=\"1\">Кратко парче код вътре в ред не е достатъчно.<\/span> <span class=\"sg\" data-s=\"2\">Тогава използвайте кодов блок: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той има ред в началото и ред в края.<\/span> <span class=\"sg\" data-s=\"4\">Той запазва текста точно какъвто е:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Редовете в кодовия блок се показват точно както ги пишете.<\/span> <span class=\"sg\" data-s=\"1\">Raku не ги чете като Pod.<\/span> <span class=\"sg\" data-s=\"2\">Така Pod има кодове вътре в редовете и има кодови блокове.<\/span> <span class=\"sg\" data-s=\"3\">С тях можете да опишете API.<\/span> <span class=\"sg\" data-s=\"4\">API е начинът, по който други програми използват вашия код.<\/span> <span class=\"sg\" data-s=\"5\">Пишете форматиран текст и примери.<\/span> <span class=\"sg\" data-s=\"6\">Примерите изглеждат като код, който можете да изпълните.<\/span> <span class=\"sg\" data-s=\"7\">Всичко това стои до кода, който описва.<\/span><\/p>"]]},"eo":{"t":"Formatado kaj kodo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Pod-teksto vi markas vortojn per <em>formataj kodoj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu kodo estas unu litero.<\/span> <span class=\"sg\" data-s=\"2\">Post la litero vi metas angulajn krampojn ĉirkaŭ la teksto:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — grasa<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursiva<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — kodo (ĉiuj literoj havas la saman larĝon)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ligilo<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En la formatita teksto, <code>important<\/code> estas grasa.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> estas en koda tiparo.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas meti unu kodon en alian kodon.<\/span> <span class=\"sg\" data-s=\"3\">Tiel vi kombinas ilin.<\/span> <span class=\"sg\" data-s=\"4\">Do <code>B&lt;C&lt;say&gt;&gt;<\/code> estas grasa kodo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Foje vi bezonas tutan blokon de kodo.<\/span> <span class=\"sg\" data-s=\"1\">Mallonga peco en linio ne sufiĉas.<\/span> <span class=\"sg\" data-s=\"2\">Tiam uzu kodblokon: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi havas linion ĉe la komenco kaj linion ĉe la fino.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi konservas la tekston ekzakte kiel ĝi estas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La linioj en la kodbloko aperas ekzakte kiel vi skribas ilin.<\/span> <span class=\"sg\" data-s=\"1\">Raku ne legas ilin kiel Pod.<\/span> <span class=\"sg\" data-s=\"2\">Do Pod havas kodojn en linioj, kaj ĝi havas kodblokojn.<\/span> <span class=\"sg\" data-s=\"3\">Per ili vi povas priskribi API-on.<\/span> <span class=\"sg\" data-s=\"4\">API estas la maniero, kiel aliaj programoj uzas vian kodon.<\/span> <span class=\"sg\" data-s=\"5\">Vi skribas formatitan tekston kaj ekzemplojn.<\/span> <span class=\"sg\" data-s=\"6\">La ekzemploj aspektas kiel kodo, kiun vi povas ruli.<\/span> <span class=\"sg\" data-s=\"7\">Ĉio restas apud la kodo, kiun ĝi priskribas.<\/span><\/p>"]]},"la":{"t":"Formatio et codex","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In textu Pod verba <em>notis formationis<\/em> signas.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque nota una littera est.<\/span> <span class=\"sg\" data-s=\"2\">Post litteram uncos angulares circa textum ponis:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — crassum<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — obliquum<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — codex (omnes litterae eandem latitudinem habent)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — nexus<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In textu formato <code>important<\/code> crassum est.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> in litteris codicis est.<\/span> <span class=\"sg\" data-s=\"2\">Unam notam intra aliam notam ponere potes.<\/span> <span class=\"sg\" data-s=\"3\">Sic eas componis.<\/span> <span class=\"sg\" data-s=\"4\">Itaque <code>B&lt;C&lt;say&gt;&gt;<\/code> est codex crassus.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum totum truncum codicis requiris.<\/span> <span class=\"sg\" data-s=\"1\">Brevis pars intra lineam non sufficit.<\/span> <span class=\"sg\" data-s=\"2\">Tum trunco codicis utere: <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Lineam in initio et lineam in fine habet.<\/span> <span class=\"sg\" data-s=\"4\">Textum prorsus servat ut est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Lineae in trunco codicis prorsus apparent ut eas scribis.<\/span> <span class=\"sg\" data-s=\"1\">Raku eas ut Pod non legit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque Pod notas intra lineas habet, et truncos codicis habet.<\/span> <span class=\"sg\" data-s=\"3\">Eis API describere potes.<\/span> <span class=\"sg\" data-s=\"4\">API est modus quo alia programmata codicem tuum adhibent.<\/span> <span class=\"sg\" data-s=\"5\">Textum formatum et exempla scribis.<\/span> <span class=\"sg\" data-s=\"6\">Exempla similia sunt codici quem exsequi potes.<\/span> <span class=\"sg\" data-s=\"7\">Omnia iuxta codicem manent quem describunt.<\/span><\/p>"]]}}}</script>
