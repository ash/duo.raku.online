<script type="application/json" id="page-data">{"u":"advanced/date-and-time","n":478,"k":"section","pv":"advanced/quoting/exercises/a-heredoc/solution","nx":"advanced/date-and-time/arithmetic","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Date and time","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku has types for dates and times.<\/span> <span class=\"sg\" data-s=\"1\">They are part of the language.<\/span> <span class=\"sg\" data-s=\"2\">A date in the calendar has the type <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">To make a date, give the year, the month, and the day:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A date has parts.<\/span> <span class=\"sg\" data-s=\"1\">You can read each of them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>day-of-week<\/code> method gives the day of the week for the date.<\/span> <span class=\"sg\" data-s=\"1\">The days have numbers.<\/span> <span class=\"sg\" data-s=\"2\">Monday is <code>1<\/code>, and Sunday is <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The 27th of June 2026 is a Saturday.<\/span> <span class=\"sg\" data-s=\"1\">So the result is <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A leap year has 366 days.<\/span> <span class=\"sg\" data-s=\"1\">The <code>is-leap-year<\/code> method checks if the date is in a leap year:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To get today’s date, call <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">We do not show its output here.<\/span> <span class=\"sg\" data-s=\"2\">It depends on the day when you run the program.<\/span><\/p>"]]},"de":{"t":"Datum und Uhrzeit","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku hat Typen für Datum und Uhrzeit.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind Teil der Sprache.<\/span> <span class=\"sg\" data-s=\"2\">Ein Datum im Kalender hat den Typ <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Für ein neues Datum gibst du das Jahr, den Monat und den Tag an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Datum hat Teile.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst jeden Teil lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>day-of-week<\/code> gibt den Wochentag des Datums zurück.<\/span> <span class=\"sg\" data-s=\"1\">Die Tage haben Nummern.<\/span> <span class=\"sg\" data-s=\"2\">Montag ist <code>1<\/code>, und Sonntag ist <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der 27.06.2026 ist ein Samstag.<\/span> <span class=\"sg\" data-s=\"1\">Also ist das Ergebnis <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Schaltjahr hat 366 Tage.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>is-leap-year<\/code> prüft, ob das Datum in einem Schaltjahr liegt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Für das Datum von heute rufe <code>Date.today<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Wir zeigen die Ausgabe hier nicht.<\/span> <span class=\"sg\" data-s=\"2\">Sie hängt vom Tag ab, an dem du das Programm startest.<\/span><\/p>"]]},"nl":{"t":"Datum en tijd","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku heeft typen voor datums en tijden.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn een deel van de taal.<\/span> <span class=\"sg\" data-s=\"2\">Een datum in de kalender heeft het type <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Een datum maak je met het jaar, de maand en de dag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een datum heeft delen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt elk deel lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De methode <code>day-of-week<\/code> geeft de dag van de week voor de datum.<\/span> <span class=\"sg\" data-s=\"1\">De dagen hebben nummers.<\/span> <span class=\"sg\" data-s=\"2\">Maandag is <code>1<\/code> en zondag is <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">27 juni 2026 is een zaterdag.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is dus <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een schrikkeljaar heeft 366 dagen.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>is-leap-year<\/code> kijkt of de datum in een schrikkeljaar valt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Voor de datum van vandaag roep je <code>Date.today<\/code> aan.<\/span> <span class=\"sg\" data-s=\"1\">We tonen de uitvoer hier niet.<\/span> <span class=\"sg\" data-s=\"2\">Die hangt af van de dag waarop je het programma uitvoert.<\/span><\/p>"]]},"es":{"t":"Fecha y hora","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku tiene tipos para fechas y horas.<\/span> <span class=\"sg\" data-s=\"1\">Son parte del lenguaje.<\/span> <span class=\"sg\" data-s=\"2\">Una fecha del calendario tiene el tipo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Para crear una fecha, da el año, el mes y el día:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una fecha tiene partes.<\/span> <span class=\"sg\" data-s=\"1\">Puedes leer cada una de ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El método <code>day-of-week<\/code> da el día de la semana de la fecha.<\/span> <span class=\"sg\" data-s=\"1\">Los días tienen números.<\/span> <span class=\"sg\" data-s=\"2\">El lunes es <code>1<\/code>, y el domingo es <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El 27 de junio de 2026 es sábado.<\/span> <span class=\"sg\" data-s=\"1\">Por eso el resultado es <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un año bisiesto tiene 366 días.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>is-leap-year<\/code> comprueba si la fecha está en un año bisiesto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para obtener la fecha de hoy, llama a <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aquí no mostramos su salida.<\/span> <span class=\"sg\" data-s=\"2\">Depende del día en que ejecutes el programa.<\/span><\/p>"]]},"it":{"t":"Data e ora","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ha dei tipi per le date e gli orari.<\/span> <span class=\"sg\" data-s=\"1\">Fanno parte del linguaggio.<\/span> <span class=\"sg\" data-s=\"2\">Una data del calendario ha il tipo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Per creare una data, dai l'anno, il mese e il giorno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una data ha delle parti.<\/span> <span class=\"sg\" data-s=\"1\">Puoi leggere ognuna di queste parti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>day-of-week<\/code> dà il giorno della settimana della data.<\/span> <span class=\"sg\" data-s=\"1\">I giorni hanno un numero.<\/span> <span class=\"sg\" data-s=\"2\">Il lunedì è <code>1<\/code> e la domenica è <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il 27 giugno 2026 è un sabato.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il risultato è <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un anno bisestile ha 366 giorni.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>is-leap-year<\/code> controlla se la data è in un anno bisestile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per avere la data di oggi, chiama <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Qui non mostriamo il suo output.<\/span> <span class=\"sg\" data-s=\"2\">Dipende dal giorno in cui esegui il programma.<\/span><\/p>"]]},"lv":{"t":"Datums un laiks","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ir tipi datumiem un laikiem.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir valodas daļa.<\/span> <span class=\"sg\" data-s=\"2\">Kalendāra datumam ir tips <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Lai izveidotu datumu, norādiet gadu, mēnesi un dienu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Datumam ir daļas.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat nolasīt katru no tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metode <code>day-of-week<\/code> dod datuma nedēļas dienu.<\/span> <span class=\"sg\" data-s=\"1\">Dienām ir numuri.<\/span> <span class=\"sg\" data-s=\"2\">Pirmdiena ir <code>1<\/code>, un svētdiena ir <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">27.06.2026 ir sestdiena.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc rezultāts ir <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Garajā gadā ir 366 dienas.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>is-leap-year<\/code> pārbauda, vai datums ir garajā gadā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu šodienas datumu, izsauciet <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šeit mēs tā izvadi nerādām.<\/span> <span class=\"sg\" data-s=\"2\">Izvade ir atkarīga no dienas, kad jūs palaižat programmu.<\/span><\/p>"]]},"ru":{"t":"Дата и время","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku есть типы для дат и времени.<\/span> <span class=\"sg\" data-s=\"1\">Они — часть языка.<\/span> <span class=\"sg\" data-s=\"2\">Дата в календаре имеет тип <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы создать дату, укажите год, месяц и день:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У даты есть части.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете прочитать каждую из них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метод <code>day-of-week<\/code> даёт день недели для даты.<\/span> <span class=\"sg\" data-s=\"1\">У дней есть номера.<\/span> <span class=\"sg\" data-s=\"2\">Понедельник — это <code>1<\/code>, а воскресенье — <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">27 июня 2026 года — суббота.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому результат — <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В високосном году 366 дней.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>is-leap-year<\/code> проверяет, попадает ли дата в високосный год:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить сегодняшнюю дату, вызовите <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Мы не показываем здесь результат.<\/span> <span class=\"sg\" data-s=\"2\">Он зависит от дня, когда вы запускаете программу.<\/span><\/p>"]]},"uk":{"t":"Дата й час","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У Raku є типи для дат і часу.<\/span> <span class=\"sg\" data-s=\"1\">Вони є частиною мови.<\/span> <span class=\"sg\" data-s=\"2\">Дата в календарі має тип <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Щоб створити дату, вкажіть рік, місяць і день:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дата має частини.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете прочитати кожну з них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метод <code>day-of-week<\/code> дає день тижня для дати.<\/span> <span class=\"sg\" data-s=\"1\">Дні мають номери.<\/span> <span class=\"sg\" data-s=\"2\">Понеділок — це <code>1<\/code>, а неділя — <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">27 червня 2026 року — субота.<\/span> <span class=\"sg\" data-s=\"1\">Тому результат — <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Високосний рік має 366 днів.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>is-leap-year<\/code> перевіряє, чи дата у високосному році:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати сьогоднішню дату, викличте <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тут ми не показуємо її вивід.<\/span> <span class=\"sg\" data-s=\"2\">Він залежить від дня, коли ви запускаєте програму.<\/span><\/p>"]]},"bg":{"t":"Дата и време","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku има типове за дати и часове.<\/span> <span class=\"sg\" data-s=\"1\">Те са част от езика.<\/span> <span class=\"sg\" data-s=\"2\">Датата в календара има типа <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">За да създадете дата, подайте годината, месеца и деня:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Датата има части.<\/span> <span class=\"sg\" data-s=\"1\">Можете да прочетете всяка от тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Методът <code>day-of-week<\/code> дава деня от седмицата за датата.<\/span> <span class=\"sg\" data-s=\"1\">Дните имат номера.<\/span> <span class=\"sg\" data-s=\"2\">Понеделник е <code>1<\/code>, а неделя е <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">27 юни 2026 е събота.<\/span> <span class=\"sg\" data-s=\"1\">Затова резултатът е <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Високосната година има 366 дни.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>is-leap-year<\/code> проверява дали датата е във високосна година:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да получите днешната дата, извикайте <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тук не показваме резултата.<\/span> <span class=\"sg\" data-s=\"2\">Той зависи от деня, в който стартирате програмата.<\/span><\/p>"]]},"eo":{"t":"Dato kaj tempo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku havas tipojn por datoj kaj tempoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas parto de la lingvo.<\/span> <span class=\"sg\" data-s=\"2\">Dato en la kalendaro havas la tipon <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Por fari daton, donu la jaron, la monaton kaj la tagon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dato havas partojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas legi ĉiun el ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>day-of-week<\/code> donas la tagon de la semajno por la dato.<\/span> <span class=\"sg\" data-s=\"1\">La tagoj havas numerojn.<\/span> <span class=\"sg\" data-s=\"2\">Lundo estas <code>1<\/code>, kaj dimanĉo estas <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La 27-a de junio 2026 estas sabato.<\/span> <span class=\"sg\" data-s=\"1\">Do la rezulto estas <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Superjaro havas 366 tagojn.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>is-leap-year<\/code> kontrolas, ĉu la dato estas en superjaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por ricevi la hodiaŭan daton, voku <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ni ne montras ĝian eligon ĉi tie.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi dependas de la tago, kiam vi rulas la programon.<\/span><\/p>"]]},"la":{"t":"Dies et tempus","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku typos pro diebus et temporibus habet.<\/span> <span class=\"sg\" data-s=\"1\">Hi typi pars linguae sunt.<\/span> <span class=\"sg\" data-s=\"2\">Dies in calendario typum <code>Date<\/code> habet.<\/span> <span class=\"sg\" data-s=\"3\">Ut diem facias, da annum, mensem, et diem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies partes habet.<\/span> <span class=\"sg\" data-s=\"1\">Quamque partem legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>day-of-week<\/code> dat diem hebdomadis huius diei.<\/span> <span class=\"sg\" data-s=\"1\">Dies numeros habent.<\/span> <span class=\"sg\" data-s=\"2\">Dies Lunae est <code>1<\/code>, et dies Solis est <code>7<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dies 27 Iunii 2026 est dies Saturni.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eventus est <code>6<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Annus bisextilis 366 dies habet.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>is-leap-year<\/code> probat num dies in anno bisextili sit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pro die hodierno, voca <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exitum eius hic non monstramus.<\/span> <span class=\"sg\" data-s=\"2\">Exitus a die pendet quo programma curris.<\/span><\/p>"]]}}}</script>
