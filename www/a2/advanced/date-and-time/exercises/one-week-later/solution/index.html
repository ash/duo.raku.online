d/date-and-time/one-week-later.raku\" target=\"_blank\" rel=\"noopener\">one-week-later.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>2027-03-07\n7<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>later(:days(7))<\/code> movas la daton antaŭen je sep tagoj. Tio estas unu semajno. Ni ankaŭ povus skribi <code>+ 7<\/code>. Sed kun la nomita argumento, vi vidas la unuon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Februaro 2027 havas 28 tagojn. Do la dato unu semajnon post la 28-a estas en marto. Raku iras en marton per si mem. La rezulto estas <code>2027-03-07<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ni vokas <code>day-of-week<\/code> sur la nova dato. Ĝi donas <code>7<\/code>. Per ĉi tiu nombro, vi povas facile kontroli la rezulton. Ĝuste unu semajnon poste, la tago de la semajno estas la <em>sama<\/em>. Kaj <code>2027-02-28<\/code> ankaŭ estas dimanĉo (<code>7<\/code>). Do <code>7<\/code> estas la respondo, kiun vi atendas ĉi tie.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Una septimana postea","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $later = Date.new(2027, 2, 28).later(:days(7));\nsay $later;\nsay $later.day-of-week;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/date-and-time/one-week-later.raku\" target=\"_blank\" rel=\"noopener\">one-week-later.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>2027-03-07\n7<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>later(:days(7))<\/code> diem septem diebus promovet. Haec est una hebdomas. Etiam <code>+ 7<\/code> scribere possumus. Sed cum argumento nominato unitatem vides.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Februarius 2027 habet 28 dies. Itaque dies una hebdomade post diem 28 in Martio est. Raku sponte in Martium transit. Eventus est <code>2027-03-07<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>day-of-week<\/code> in novo die vocamus. Dat <code>7<\/code>. Hoc numero eventum facile probare potes. Exacte una hebdomade post, dies hebdomadis <em>idem<\/em> est. Et <code>2027-02-28<\/code> quoque est dies Solis (<code>7<\/code>). Itaque <code>7<\/code> hic est responsum quod exspectas.<\/span><\/li><\/ol>"]]}}}</script>
