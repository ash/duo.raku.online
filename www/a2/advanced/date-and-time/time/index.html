<script type="application/json" id="page-data">{"u":"advanced/date-and-time/time","n":482,"k":"topic","pv":"advanced/date-and-time/arithmetic/quiz2","nx":"advanced/date-and-time/exercises","tr":["advanced","advanced/date-and-time"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Working with time","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sometimes you need the date and also the time of day.<\/span> <span class=\"sg\" data-s=\"1\">Then use the <code>DateTime<\/code> type.<\/span> <span class=\"sg\" data-s=\"2\">You make it almost like a <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">But you also give the hour, the minute, and the second:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">By default, the text follows the ISO 8601 standard.<\/span> <span class=\"sg\" data-s=\"1\">First comes the date.<\/span> <span class=\"sg\" data-s=\"2\">Then come the letter <code>T<\/code> and the time.<\/span> <span class=\"sg\" data-s=\"3\">At the end is the letter <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">It stands for the time zone UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You already know the parts of a date.<\/span> <span class=\"sg\" data-s=\"1\">A <code>DateTime<\/code> has them too.<\/span> <span class=\"sg\" data-s=\"2\">It also has the parts of the time:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">To get the time right now, call <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">We do not show its output here.<\/span> <span class=\"sg\" data-s=\"2\">We did the same for <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The output changes every time the program runs.<\/span><\/p>"]]},"de":{"t":"Mit Uhrzeiten arbeiten","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Manchmal brauchst du das Datum und auch die Uhrzeit.<\/span> <span class=\"sg\" data-s=\"1\">Dann nimm den Typ <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Du machst ihn fast wie ein <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Aber du gibst auch die Stunde, die Minute und die Sekunde an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalerweise folgt der Text dem Standard ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Zuerst kommt das Datum.<\/span> <span class=\"sg\" data-s=\"2\">Dann kommen der Buchstabe <code>T<\/code> und die Uhrzeit.<\/span> <span class=\"sg\" data-s=\"3\">Am Ende steht der Buchstabe <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Er steht für die Zeitzone UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kennst schon die Teile eines Datums.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>DateTime<\/code> hat sie auch.<\/span> <span class=\"sg\" data-s=\"2\">Dazu kommen die Teile der Uhrzeit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Für die Zeit genau jetzt rufe <code>DateTime.now<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Wir zeigen die Ausgabe hier nicht.<\/span> <span class=\"sg\" data-s=\"2\">Bei <code>Date.today<\/code> haben wir das auch so gemacht.<\/span> <span class=\"sg\" data-s=\"3\">Die Ausgabe ändert sich jedes Mal, wenn das Programm läuft.<\/span><\/p>"]]},"nl":{"t":"Werken met tijd","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Soms heb je de datum en ook de tijd van de dag nodig.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik dan het <code>DateTime<\/code>-type.<\/span> <span class=\"sg\" data-s=\"2\">Je maakt het bijna net als een <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Maar je geeft ook het uur, de minuut en de seconde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Standaard volgt de tekst de ISO 8601-standaard.<\/span> <span class=\"sg\" data-s=\"1\">Eerst komt de datum.<\/span> <span class=\"sg\" data-s=\"2\">Dan komen de letter <code>T<\/code> en de tijd.<\/span> <span class=\"sg\" data-s=\"3\">Aan het eind staat de letter <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Die staat voor de tijdzone UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kent de delen van een datum al.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>DateTime<\/code> heeft die ook.<\/span> <span class=\"sg\" data-s=\"2\">Het heeft ook de delen van de tijd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Voor de tijd van nu roep je <code>DateTime.now<\/code> aan.<\/span> <span class=\"sg\" data-s=\"1\">We tonen de uitvoer hier niet.<\/span> <span class=\"sg\" data-s=\"2\">Dat deden we ook bij <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De uitvoer verandert elke keer dat het programma draait.<\/span><\/p>"]]},"es":{"t":"Trabajando con la hora","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas la fecha y también la hora del día.<\/span> <span class=\"sg\" data-s=\"1\">Entonces usa el tipo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo creas casi como un <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pero también das la hora, el minuto y el segundo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Por defecto, el texto sigue el estándar ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Primero va la fecha.<\/span> <span class=\"sg\" data-s=\"2\">Luego van la letra <code>T<\/code> y la hora.<\/span> <span class=\"sg\" data-s=\"3\">Al final está la letra <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Indica la zona horaria UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ya conoces las partes de una fecha.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>DateTime<\/code> también las tiene.<\/span> <span class=\"sg\" data-s=\"2\">Además, tiene las partes de la hora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Para obtener la hora de ahora mismo, llama a <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aquí no mostramos su salida.<\/span> <span class=\"sg\" data-s=\"2\">Hicimos lo mismo con <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La salida cambia cada vez que ejecutas el programa.<\/span><\/p>"]]},"it":{"t":"Lavorare con l'ora","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A volte ti serve la data e anche l'ora del giorno.<\/span> <span class=\"sg\" data-s=\"1\">Allora usa il tipo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo crei quasi come un <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ma dai anche l'ora, il minuto e il secondo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalmente il testo segue lo standard ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Prima viene la data.<\/span> <span class=\"sg\" data-s=\"2\">Poi vengono la lettera <code>T<\/code> e l'ora.<\/span> <span class=\"sg\" data-s=\"3\">Alla fine c'è la lettera <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Indica il fuso orario UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Conosci già le parti di una data.<\/span> <span class=\"sg\" data-s=\"1\">Anche un <code>DateTime<\/code> le ha.<\/span> <span class=\"sg\" data-s=\"2\">Ha anche le parti dell'ora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per avere l'ora di adesso, chiama <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Qui non mostriamo il suo output.<\/span> <span class=\"sg\" data-s=\"2\">Abbiamo fatto lo stesso per <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">L'output cambia ogni volta che esegui il programma.<\/span><\/p>"]]},"lv":{"t":"Darbs ar laiku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums vajag datumu un arī diennakts laiku.<\/span> <span class=\"sg\" data-s=\"1\">Tad izmantojiet tipu <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to izveidojat gandrīz tāpat kā <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Bet jūs norādāt arī stundu, minūti un sekundi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma teksts seko standartam ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms nāk datums.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam nāk burts <code>T<\/code> un laiks.<\/span> <span class=\"sg\" data-s=\"3\">Beigās ir burts <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas nozīmē laika joslu UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt datuma daļas.<\/span> <span class=\"sg\" data-s=\"1\">Arī tipam <code>DateTime<\/code> ir šīs daļas.<\/span> <span class=\"sg\" data-s=\"2\">Tam ir arī laika daļas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu pašreizējo laiku, izsauciet <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šeit mēs tā izvadi nerādām.<\/span> <span class=\"sg\" data-s=\"2\">Tāpat mēs darījām ar <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Izvade mainās katru reizi, kad programma darbojas.<\/span><\/p>"]]},"ru":{"t":"Работа со временем","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Иногда вам нужна дата и ещё время суток.<\/span> <span class=\"sg\" data-s=\"1\">Тогда используйте тип <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вы создаёте его почти как <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но вы также указываете час, минуту и секунду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По умолчанию текст следует стандарту ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Сначала идёт дата.<\/span> <span class=\"sg\" data-s=\"2\">Потом идут буква <code>T<\/code> и время.<\/span> <span class=\"sg\" data-s=\"3\">В конце стоит буква <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Она означает часовой пояс UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете части даты.<\/span> <span class=\"sg\" data-s=\"1\">У <code>DateTime<\/code> они тоже есть.<\/span> <span class=\"sg\" data-s=\"2\">Ещё у него есть части времени:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить время прямо сейчас, вызовите <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Мы не показываем здесь результат.<\/span> <span class=\"sg\" data-s=\"2\">Так же мы сделали для <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Результат меняется при каждом запуске программы.<\/span><\/p>"]]},"uk":{"t":"Робота з часом","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Іноді вам потрібна дата, а також час доби.<\/span> <span class=\"sg\" data-s=\"1\">Тоді використовуйте тип <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви створюєте його майже як <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Але ви також вказуєте годину, хвилину й секунду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Типово текст відповідає стандарту ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку йде дата.<\/span> <span class=\"sg\" data-s=\"2\">Потім ідуть літера <code>T<\/code> і час.<\/span> <span class=\"sg\" data-s=\"3\">У кінці стоїть літера <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Вона означає часовий пояс UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте частини дати.<\/span> <span class=\"sg\" data-s=\"1\"><code>DateTime<\/code> теж їх має.<\/span> <span class=\"sg\" data-s=\"2\">Він також має частини часу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати час саме зараз, викличте <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тут ми не показуємо його вивід.<\/span> <span class=\"sg\" data-s=\"2\">Так само ми зробили для <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вивід змінюється при кожному запуску програми.<\/span><\/p>"]]},"bg":{"t":"Работа с време","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Понякога ви трябва датата, а също и часът.<\/span> <span class=\"sg\" data-s=\"1\">Тогава използвайте типа <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Създавате го почти като <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но подавате и часа, минутата и секундата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По подразбиране текстът следва стандарта ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Първо идва датата.<\/span> <span class=\"sg\" data-s=\"2\">След нея идват буквата <code>T<\/code> и часът.<\/span> <span class=\"sg\" data-s=\"3\">Накрая е буквата <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тя означава часовата зона UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вече познавате частите на датата.<\/span> <span class=\"sg\" data-s=\"1\"><code>DateTime<\/code> също ги има.<\/span> <span class=\"sg\" data-s=\"2\">Той има и частите на времето:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За да получите часа в този момент, извикайте <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тук не показваме резултата.<\/span> <span class=\"sg\" data-s=\"2\">Същото направихме и за <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Резултатът се сменя всеки път, когато програмата работи.<\/span><\/p>"]]},"eo":{"t":"Laboro kun tempo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Foje vi bezonas la daton kaj ankaŭ la horon de la tago.<\/span> <span class=\"sg\" data-s=\"1\">Tiam uzu la tipon <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi faras ĝin preskaŭ kiel <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sed vi ankaŭ donas la horon, la minuton kaj la sekundon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, la teksto sekvas la normon ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Unue venas la dato.<\/span> <span class=\"sg\" data-s=\"2\">Poste venas la litero <code>T<\/code> kaj la tempo.<\/span> <span class=\"sg\" data-s=\"3\">Ĉe la fino estas la litero <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi signifas la horzonon UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas la partojn de dato.<\/span> <span class=\"sg\" data-s=\"1\"><code>DateTime<\/code> ankaŭ havas ilin.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi havas ankaŭ la partojn de la tempo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Por ricevi la tempon ĝuste nun, voku <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ni ne montras ĝian eligon ĉi tie.<\/span> <span class=\"sg\" data-s=\"2\">Ni faris same por <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La eligo ŝanĝiĝas ĉiufoje, kiam la programo ruliĝas.<\/span><\/p>"]]},"la":{"t":"Laborando cum tempore","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum diem et etiam tempus diei requiris.<\/span> <span class=\"sg\" data-s=\"1\">Tum typum <code>DateTime<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"2\">Eum fere ut <code>Date<\/code> facis.<\/span> <span class=\"sg\" data-s=\"3\">Sed etiam horam, minutum, et secundum das:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Forma textus praedefinita normam ISO 8601 sequitur.<\/span> <span class=\"sg\" data-s=\"1\">Primo venit dies.<\/span> <span class=\"sg\" data-s=\"2\">Deinde veniunt littera <code>T<\/code> et tempus.<\/span> <span class=\"sg\" data-s=\"3\">In fine est littera <code>Z<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Significat zonam temporis UTC.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Partes diei iam cognoscis.<\/span> <span class=\"sg\" data-s=\"1\"><code>DateTime<\/code> eas quoque habet.<\/span> <span class=\"sg\" data-s=\"2\">Etiam partes temporis habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pro tempore praesenti, voca <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exitum eius hic non monstramus.<\/span> <span class=\"sg\" data-s=\"2\">Idem pro <code>Date.today<\/code> fecimus.<\/span> <span class=\"sg\" data-s=\"3\">Exitus mutatur quotiens programma currit.<\/span><\/p>"]]}}}</script>
