<script type="application/json" id="page-data">{"u":"advanced/date-and-time/arithmetic","n":479,"k":"topic","pv":"advanced/date-and-time","nx":"advanced/date-and-time/arithmetic/quiz","tr":["advanced","advanced/date-and-time"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Date arithmetic","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You can do arithmetic with dates.<\/span> <span class=\"sg\" data-s=\"1\">Then many everyday calculations are easy.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can add an integer to a date.<\/span> <span class=\"sg\" data-s=\"1\">Then the date moves forward by that many days.<\/span> <span class=\"sg\" data-s=\"2\">You get a new date.<\/span> <span class=\"sg\" data-s=\"3\">If needed, Raku also changes the month and the year:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also subtract one date from another.<\/span> <span class=\"sg\" data-s=\"1\">You get the number of days between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For bigger steps, use the methods <code>later<\/code> and <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">They take named arguments, like <code>:days<\/code>, <code>:months<\/code>, or <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">These methods always give the correct date.<\/span> <span class=\"sg\" data-s=\"1\">They also work when a new month or year starts.<\/span> <span class=\"sg\" data-s=\"2\">So you never need to know how many days a month has.<\/span><\/p>"]]},"de":{"t":"Datumsarithmetik","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst mit Daten rechnen.<\/span> <span class=\"sg\" data-s=\"1\">Dann sind viele Rechnungen aus dem Alltag einfach.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du kannst eine ganze Zahl zu einem Datum addieren.<\/span> <span class=\"sg\" data-s=\"1\">Dann geht das Datum so viele Tage nach vorne.<\/span> <span class=\"sg\" data-s=\"2\">Du bekommst ein neues Datum.<\/span> <span class=\"sg\" data-s=\"3\">Wenn nötig, ändert Raku auch den Monat und das Jahr:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst auch ein Datum von einem anderen subtrahieren.<\/span> <span class=\"sg\" data-s=\"1\">Du bekommst die Anzahl der Tage dazwischen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Für größere Schritte nimm die Methoden <code>later<\/code> und <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie nehmen benannte Argumente, wie <code>:days<\/code>, <code>:months<\/code> oder <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diese Methoden geben immer das richtige Datum.<\/span> <span class=\"sg\" data-s=\"1\">Sie funktionieren auch, wenn ein neuer Monat oder ein neues Jahr beginnt.<\/span> <span class=\"sg\" data-s=\"2\">Also musst du nie wissen, wie viele Tage ein Monat hat.<\/span><\/p>"]]},"nl":{"t":"Datumrekenen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt met datums rekenen.<\/span> <span class=\"sg\" data-s=\"1\">Dan zijn veel gewone berekeningen makkelijk.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt een geheel getal bij een datum optellen.<\/span> <span class=\"sg\" data-s=\"1\">Dan gaat de datum zoveel dagen vooruit.<\/span> <span class=\"sg\" data-s=\"2\">Je krijgt een nieuwe datum.<\/span> <span class=\"sg\" data-s=\"3\">Als het nodig is, verandert Raku ook de maand en het jaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook een datum van een andere datum aftrekken.<\/span> <span class=\"sg\" data-s=\"1\">Je krijgt het aantal dagen ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik voor grotere stappen de methoden <code>later<\/code> en <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze nemen benoemde argumenten, zoals <code>:days<\/code>, <code>:months<\/code> of <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze methoden geven altijd de juiste datum.<\/span> <span class=\"sg\" data-s=\"1\">Ze werken ook als er een nieuwe maand of een nieuw jaar begint.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft dus nooit te weten hoeveel dagen een maand heeft.<\/span><\/p>"]]},"es":{"t":"Aritmética de fechas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes hacer aritmética con fechas.<\/span> <span class=\"sg\" data-s=\"1\">Así, muchos cálculos de cada día son fáciles.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes sumar un entero a una fecha.<\/span> <span class=\"sg\" data-s=\"1\">Entonces la fecha avanza ese número de días.<\/span> <span class=\"sg\" data-s=\"2\">Obtienes una fecha nueva.<\/span> <span class=\"sg\" data-s=\"3\">Si hace falta, Raku también cambia el mes y el año:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes restar una fecha de otra.<\/span> <span class=\"sg\" data-s=\"1\">Obtienes el número de días entre ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para pasos más grandes, usa los métodos <code>later<\/code> y <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aceptan argumentos con nombre, como <code>:days<\/code>, <code>:months<\/code> o <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estos métodos siempre dan la fecha correcta.<\/span> <span class=\"sg\" data-s=\"1\">También funcionan cuando empieza un mes o un año nuevo.<\/span> <span class=\"sg\" data-s=\"2\">Así nunca necesitas saber cuántos días tiene un mes.<\/span><\/p>"]]},"it":{"t":"Aritmetica delle date","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Con le date puoi fare operazioni aritmetiche.<\/span> <span class=\"sg\" data-s=\"1\">Così molti calcoli di tutti i giorni diventano facili.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi aggiungere un intero a una data.<\/span> <span class=\"sg\" data-s=\"1\">Allora la data va avanti di quel numero di giorni.<\/span> <span class=\"sg\" data-s=\"2\">Ottieni una nuova data.<\/span> <span class=\"sg\" data-s=\"3\">Se serve, Raku cambia anche il mese e l'anno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche sottrarre una data da un'altra.<\/span> <span class=\"sg\" data-s=\"1\">Ottieni il numero di giorni tra le due date:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per passi più grandi, usa i metodi <code>later<\/code> e <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Prendono argomenti con nome, come <code>:days<\/code>, <code>:months<\/code> o <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questi metodi danno sempre la data giusta.<\/span> <span class=\"sg\" data-s=\"1\">Funzionano anche quando inizia un nuovo mese o un nuovo anno.<\/span> <span class=\"sg\" data-s=\"2\">Così non devi mai sapere quanti giorni ha un mese.<\/span><\/p>"]]},"lv":{"t":"Datumu aritmētika","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar datumiem jūs varat rēķināt.<\/span> <span class=\"sg\" data-s=\"1\">Tad daudzi ikdienas aprēķini ir viegli.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Datumam var pieskaitīt veselu skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Tad datums pavirzās uz priekšu par tik dienām.<\/span> <span class=\"sg\" data-s=\"2\">Jūs iegūstat jaunu datumu.<\/span> <span class=\"sg\" data-s=\"3\">Ja vajag, Raku maina arī mēnesi un gadu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī atņemt vienu datumu no otra.<\/span> <span class=\"sg\" data-s=\"1\">Jūs iegūstat dienu skaitu starp tiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lielākiem soļiem izmantojiet metodes <code>later<\/code> un <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās pieņem nosauktus argumentus, piemēram, <code>:days<\/code>, <code>:months<\/code> vai <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šīs metodes vienmēr dod pareizo datumu.<\/span> <span class=\"sg\" data-s=\"1\">Tās strādā arī tad, kad sākas jauns mēnesis vai gads.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jums nekad nav jāzina, cik dienu ir mēnesī.<\/span><\/p>"]]},"ru":{"t":"Арифметика дат","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">С датами работает арифметика.<\/span> <span class=\"sg\" data-s=\"1\">Тогда многие обычные расчёты делать легко.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">К дате можно прибавить целое число.<\/span> <span class=\"sg\" data-s=\"1\">Тогда дата сдвигается вперёд на столько дней.<\/span> <span class=\"sg\" data-s=\"2\">Вы получаете новую дату.<\/span> <span class=\"sg\" data-s=\"3\">Если нужно, Raku также меняет месяц и год:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно также вычесть одну дату из другой.<\/span> <span class=\"sg\" data-s=\"1\">Вы получаете число дней между ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для больших шагов используйте методы <code>later<\/code> и <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Они принимают именованные аргументы, например <code>:days<\/code>, <code>:months<\/code> или <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Эти методы всегда дают правильную дату.<\/span> <span class=\"sg\" data-s=\"1\">Они работают, даже когда начинается новый месяц или год.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому вам не нужно знать, сколько дней в месяце.<\/span><\/p>"]]},"uk":{"t":"Арифметика дат","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">З датами можна робити арифметичні дії.<\/span> <span class=\"sg\" data-s=\"1\">Тоді багато щоденних обчислень робити легко.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">До дати можна додати ціле число.<\/span> <span class=\"sg\" data-s=\"1\">Тоді дата рухається вперед на стільки ж днів.<\/span> <span class=\"sg\" data-s=\"2\">Ви отримуєте нову дату.<\/span> <span class=\"sg\" data-s=\"3\">Якщо треба, Raku також змінює місяць і рік:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можна також відняти одну дату від іншої.<\/span> <span class=\"sg\" data-s=\"1\">Ви отримуєте кількість днів між ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для більших кроків використовуйте методи <code>later<\/code> та <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони приймають іменовані аргументи, наприклад <code>:days<\/code>, <code>:months<\/code> або <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ці методи завжди дають правильну дату.<\/span> <span class=\"sg\" data-s=\"1\">Вони працюють і на початку нового місяця чи року.<\/span> <span class=\"sg\" data-s=\"2\">Тож вам ніколи не треба знати, скільки днів має місяць.<\/span><\/p>"]]},"bg":{"t":"Аритметика с дати","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да смятате с дати.<\/span> <span class=\"sg\" data-s=\"1\">Така много ежедневни сметки стават лесни.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да добавите цяло число към дата.<\/span> <span class=\"sg\" data-s=\"1\">Тогава датата се мести напред с толкова дни.<\/span> <span class=\"sg\" data-s=\"2\">Получавате нова дата.<\/span> <span class=\"sg\" data-s=\"3\">Ако трябва, Raku сменя и месеца, и годината:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете също да извадите една дата от друга.<\/span> <span class=\"sg\" data-s=\"1\">Получавате броя на дните между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За по-големи стъпки използвайте методите <code>later<\/code> и <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те приемат именувани аргументи, като <code>:days<\/code>, <code>:months<\/code> или <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тези методи винаги дават правилната дата.<\/span> <span class=\"sg\" data-s=\"1\">Те работят и когато започва нов месец или нова година.<\/span> <span class=\"sg\" data-s=\"2\">Затова никога не трябва да знаете колко дни има един месец.<\/span><\/p>"]]},"eo":{"t":"Datkalkulado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas fari aritmetikon kun datoj.<\/span> <span class=\"sg\" data-s=\"1\">Tiam multaj ĉiutagaj kalkuloj estas facilaj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas aldoni entjeron al dato.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la dato moviĝas antaŭen je tiom da tagoj.<\/span> <span class=\"sg\" data-s=\"2\">Vi ricevas novan daton.<\/span> <span class=\"sg\" data-s=\"3\">Se necese, Raku ankaŭ ŝanĝas la monaton kaj la jaron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas subtrahi unu daton de alia.<\/span> <span class=\"sg\" data-s=\"1\">Vi ricevas la nombron de tagoj inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por pli grandaj paŝoj, uzu la metodojn <code>later<\/code> kaj <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili prenas nomitajn argumentojn, kiel <code>:days<\/code>, <code>:months<\/code> aŭ <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj metodoj ĉiam donas la ĝustan daton.<\/span> <span class=\"sg\" data-s=\"1\">Ili funkcias ankaŭ, kiam nova monato aŭ jaro komenciĝas.<\/span> <span class=\"sg\" data-s=\"2\">Do vi neniam devas scii, kiom da tagoj havas monato.<\/span><\/p>"]]},"la":{"t":"Arithmetica dierum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum diebus arithmeticam facere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum multae computationes cotidianae faciles sunt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Numerum integrum ad diem addere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum dies tot diebus progreditur.<\/span> <span class=\"sg\" data-s=\"2\">Novum diem accipis.<\/span> <span class=\"sg\" data-s=\"3\">Si opus est, Raku etiam mensem et annum mutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam unum diem ab alio subtrahere potes.<\/span> <span class=\"sg\" data-s=\"1\">Numerum dierum inter eos accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro maioribus gradibus, methodos <code>later<\/code> et <code>earlier<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Argumenta nominata accipiunt, ut <code>:days<\/code>, <code>:months<\/code>, vel <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hae methodi semper rectum diem dant.<\/span> <span class=\"sg\" data-s=\"1\">Etiam operantur cum novus mensis vel annus incipit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque numquam scire debes quot dies mensis habeat.<\/span><\/p>"]]}}}</script>
