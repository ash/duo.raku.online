<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas","n":566,"k":"section","pv":"advanced/user-defined-operators/quiz","nx":"advanced/traits-pragmas/built-in-traits","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Traits and pragmas","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Two features change how Raku <strong>compiles<\/strong> your code.<\/span> <span class=\"sg\" data-s=\"1\">This happens before the code runs.<\/span> <span class=\"sg\" data-s=\"2\">The first feature is a <em>trait<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">A trait changes a declaration.<\/span> <span class=\"sg\" data-s=\"4\">The declaration can be a variable or a routine.<\/span> <span class=\"sg\" data-s=\"5\">You write a trait with <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">The second feature is a <em>pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">A pragma is a bit like a module.<\/span> <span class=\"sg\" data-s=\"8\">You turn it on with <code>use<\/code>, or off with <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">It changes a rule for the rest of the lexical scope.<\/span> <span class=\"sg\" data-s=\"10\">In other words, it works until the end of the block.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You have already used a trait, like <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But you did not learn much about it then.<\/span> <span class=\"sg\" data-s=\"2\">This section looks at traits more closely.<\/span> <span class=\"sg\" data-s=\"3\">It shows how to write your own trait.<\/span> <span class=\"sg\" data-s=\"4\">It also introduces pragmas.<\/span><\/p>"]]},"de":{"t":"Traits und Pragmas","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Zwei Funktionen ändern, wie Raku Ihren Code <strong>kompiliert<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert, bevor der Code läuft.<\/span> <span class=\"sg\" data-s=\"2\">Die erste Funktion ist ein <em>Trait<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ein Trait ändert eine Deklaration.<\/span> <span class=\"sg\" data-s=\"4\">Die Deklaration kann eine Variable oder eine Routine sein.<\/span> <span class=\"sg\" data-s=\"5\">Sie schreiben ein Trait mit <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Die zweite Funktion ist ein <em>Pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Ein Pragma ist ein bisschen wie ein Modul.<\/span> <span class=\"sg\" data-s=\"8\">Sie schalten es mit <code>use<\/code> ein oder mit <code>no<\/code> aus.<\/span> <span class=\"sg\" data-s=\"9\">Es ändert eine Regel für den Rest des lexikalischen Gültigkeitsbereichs.<\/span> <span class=\"sg\" data-s=\"10\">Anders gesagt: Es wirkt bis zum Ende des Blocks.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sie haben schon ein Trait benutzt, zum Beispiel <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aber damals haben Sie nicht viel darüber gelernt.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt sieht sich Traits genauer an.<\/span> <span class=\"sg\" data-s=\"3\">Er zeigt, wie Sie ein eigenes Trait schreiben.<\/span> <span class=\"sg\" data-s=\"4\">Er stellt auch Pragmas vor.<\/span><\/p>"]]},"nl":{"t":"Traits en pragma's","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Twee mogelijkheden veranderen hoe Raku je code <strong>compileert<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt voordat de code draait.<\/span> <span class=\"sg\" data-s=\"2\">De eerste mogelijkheid is een <em>trait<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Een trait verandert een declaratie.<\/span> <span class=\"sg\" data-s=\"4\">De declaratie kan een variabele of een routine zijn.<\/span> <span class=\"sg\" data-s=\"5\">Je schrijft een trait met <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">De tweede mogelijkheid is een <em>pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Een pragma lijkt een beetje op een module.<\/span> <span class=\"sg\" data-s=\"8\">Je zet het aan met <code>use<\/code>, of uit met <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Het verandert een regel voor de rest van het lexicale bereik.<\/span> <span class=\"sg\" data-s=\"10\">Met andere woorden: het werkt tot het einde van het blok.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je hebt al een trait gebruikt, zoals <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar je leerde er toen niet veel over.<\/span> <span class=\"sg\" data-s=\"2\">Deze sectie bekijkt traits van dichterbij.<\/span> <span class=\"sg\" data-s=\"3\">Ze laat zien hoe je je eigen trait schrijft.<\/span> <span class=\"sg\" data-s=\"4\">Ze laat ook pragma's zien.<\/span><\/p>"]]},"es":{"t":"Traits y pragmas","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Dos características cambian cómo Raku <strong>compila<\/strong> tu código.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa antes de ejecutar el código.<\/span> <span class=\"sg\" data-s=\"2\">La primera característica es un <em>trait<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Un trait cambia una declaración.<\/span> <span class=\"sg\" data-s=\"4\">La declaración puede ser una variable o una rutina.<\/span> <span class=\"sg\" data-s=\"5\">Escribes un trait con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">La segunda característica es una <em>pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Una pragma se parece un poco a un módulo.<\/span> <span class=\"sg\" data-s=\"8\">La activas con <code>use<\/code>, o la desactivas con <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Cambia una regla para el resto del ámbito léxico.<\/span> <span class=\"sg\" data-s=\"10\">En otras palabras, funciona hasta el final del bloque.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ya has usado un trait, como <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero entonces no aprendiste mucho sobre él.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección mira los traits más de cerca.<\/span> <span class=\"sg\" data-s=\"3\">Muestra cómo escribir tu propio trait.<\/span> <span class=\"sg\" data-s=\"4\">También presenta las pragmas.<\/span><\/p>"]]},"it":{"t":"Trait e pragma","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Due funzionalità cambiano come Raku <strong>compila<\/strong> il tuo codice.<\/span> <span class=\"sg\" data-s=\"1\">Questo succede prima dell'esecuzione del codice.<\/span> <span class=\"sg\" data-s=\"2\">La prima funzionalità è il <em>trait<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Un trait cambia una dichiarazione.<\/span> <span class=\"sg\" data-s=\"4\">La dichiarazione può essere una variabile o una routine.<\/span> <span class=\"sg\" data-s=\"5\">Scrivi un trait con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">La seconda funzionalità è il <em>pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Un pragma è un po' come un modulo.<\/span> <span class=\"sg\" data-s=\"8\">Lo attivi con <code>use<\/code>, o lo disattivi con <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Cambia una regola per il resto dello scope lessicale.<\/span> <span class=\"sg\" data-s=\"10\">In altre parole, funziona fino alla fine del blocco.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hai già usato un trait, come <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma allora non hai imparato molto sui trait.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione guarda i trait più da vicino.<\/span> <span class=\"sg\" data-s=\"3\">Mostra come scrivere un tuo trait.<\/span> <span class=\"sg\" data-s=\"4\">Presenta anche i pragma.<\/span><\/p>"]]},"lv":{"t":"Īpašības un pragmas 🆕","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Divas iespējas maina to, kā Raku <strong>kompilē<\/strong> jūsu kodu.<\/span> <span class=\"sg\" data-s=\"1\">Tas notiek pirms koda izpildes.<\/span> <span class=\"sg\" data-s=\"2\">Pirmā iespēja ir <em>īpašība<\/em> (trait).<\/span> <span class=\"sg\" data-s=\"3\">Īpašība maina deklarāciju.<\/span> <span class=\"sg\" data-s=\"4\">Deklarācija var būt mainīgais vai apakšprogramma.<\/span> <span class=\"sg\" data-s=\"5\">Jūs rakstāt īpašību ar <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Otrā iespēja ir <em>pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Pragma ir mazliet līdzīga modulim.<\/span> <span class=\"sg\" data-s=\"8\">Jūs to ieslēdzat ar <code>use<\/code> vai izslēdzat ar <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Tā maina kādu noteikumu pārējā leksiskajā tvērumā.<\/span> <span class=\"sg\" data-s=\"10\">Citiem vārdiem, tā darbojas līdz bloka beigām.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat lietojuši īpašību, piemēram, <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet toreiz jūs par to daudz neuzzinājāt.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa aplūko īpašības tuvāk.<\/span> <span class=\"sg\" data-s=\"3\">Tā parāda, kā uzrakstīt savu īpašību.<\/span> <span class=\"sg\" data-s=\"4\">Tā arī iepazīstina ar pragmām.<\/span><\/p>"]]},"ru":{"t":"Трейты и прагмы","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Две возможности меняют то, как Raku <strong>компилирует<\/strong> ваш код.<\/span> <span class=\"sg\" data-s=\"1\">Это происходит до запуска кода.<\/span> <span class=\"sg\" data-s=\"2\">Первая возможность — <em>типаж<\/em> (trait).<\/span> <span class=\"sg\" data-s=\"3\">Типаж меняет объявление.<\/span> <span class=\"sg\" data-s=\"4\">Объявление может быть переменной или подпрограммой.<\/span> <span class=\"sg\" data-s=\"5\">Типаж пишут с помощью <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Вторая возможность — <em>прагма<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Прагма немного похожа на модуль.<\/span> <span class=\"sg\" data-s=\"8\">Её включают с помощью <code>use<\/code>, а выключают с помощью <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Она меняет правило для остальной части лексической области видимости.<\/span> <span class=\"sg\" data-s=\"10\">Другими словами, она работает до конца блока.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали типаж, например <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но тогда вы мало о нём узнали.<\/span> <span class=\"sg\" data-s=\"2\">Этот раздел подробнее рассматривает типажи.<\/span> <span class=\"sg\" data-s=\"3\">Он показывает, как написать свой типаж.<\/span> <span class=\"sg\" data-s=\"4\">Ещё он знакомит с прагмами.<\/span><\/p>"]]},"uk":{"t":"Трейти та прагми","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Дві можливості змінюють те, як Raku <strong>компілює<\/strong> ваш код.<\/span> <span class=\"sg\" data-s=\"1\">Це відбувається ще до запуску коду.<\/span> <span class=\"sg\" data-s=\"2\">Перша можливість — це <em>трейт<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Трейт змінює оголошення.<\/span> <span class=\"sg\" data-s=\"4\">Оголошення може бути змінною або підпрограмою.<\/span> <span class=\"sg\" data-s=\"5\">Ви пишете трейт через <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Друга можливість — це <em>прагма<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Прагма трохи схожа на модуль.<\/span> <span class=\"sg\" data-s=\"8\">Ви вмикаєте її через <code>use<\/code>, а вимикаєте через <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Вона змінює правило до кінця лексичної області видимості.<\/span> <span class=\"sg\" data-s=\"10\">Іншими словами, вона діє до кінця блоку.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви вже використовували трейт, наприклад <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але тоді ви мало про нього дізналися.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ розглядає трейти ближче.<\/span> <span class=\"sg\" data-s=\"3\">Він показує, як написати власний трейт.<\/span> <span class=\"sg\" data-s=\"4\">А ще він знайомить із прагмами.<\/span><\/p>"]]},"bg":{"t":"Трейтове и прагми 🆕","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Две средства променят как Raku <strong>компилира<\/strong> вашия код.<\/span> <span class=\"sg\" data-s=\"1\">Това става преди изпълнението на кода.<\/span> <span class=\"sg\" data-s=\"2\">Първото средство е <em>трейт<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Трейтът променя декларация.<\/span> <span class=\"sg\" data-s=\"4\">Декларацията може да бъде на променлива или на подпрограма.<\/span> <span class=\"sg\" data-s=\"5\">Пишете трейта с <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Второто средство е <em>прагма<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Прагмата прилича малко на модул.<\/span> <span class=\"sg\" data-s=\"8\">Включвате я с <code>use<\/code> или я изключвате с <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Тя променя правило за останалата част от лексикалния обхват.<\/span> <span class=\"sg\" data-s=\"10\">С други думи, тя работи до края на блока.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали трейт, като <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но тогава не научихте много за него.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел разглежда трейтовете по-отблизо.<\/span> <span class=\"sg\" data-s=\"3\">Той показва как да напишете свой трейт.<\/span> <span class=\"sg\" data-s=\"4\">Той също представя прагмите.<\/span><\/p>"]]},"eo":{"t":"Trajtoj kaj pragmoj","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Du ecoj ŝanĝas, kiel Raku <strong>kompilas<\/strong> vian kodon.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas antaŭ ol la kodo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">La unua eco estas <em>trajto<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Trajto ŝanĝas deklaron.<\/span> <span class=\"sg\" data-s=\"4\">La deklaro povas esti variablo aŭ rutino.<\/span> <span class=\"sg\" data-s=\"5\">Vi skribas trajton per <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">La dua eco estas <em>pragmo<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Pragmo estas iom kiel modulo.<\/span> <span class=\"sg\" data-s=\"8\">Vi ŝaltas ĝin per <code>use<\/code>, aŭ malŝaltas per <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Ĝi ŝanĝas regulon por la resto de la leksika amplekso.<\/span> <span class=\"sg\" data-s=\"10\">Alivorte, ĝi funkcias ĝis la fino de la bloko.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis trajton, kiel <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed tiam vi ne lernis multon pri ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio rigardas trajtojn pli detale.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi montras, kiel skribi vian propran trajton.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ prezentas pragmojn.<\/span><\/p>"]]},"la":{"t":"Proprietates et pragmata","b":[["p",11,"<p><span class=\"sg\" data-s=\"0\">Duae proprietates modum mutant quo Raku codicem tuum <strong>compilat<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit antequam codex currit.<\/span> <span class=\"sg\" data-s=\"2\">Prima proprietas est <em>trait<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Trait declarationem mutat.<\/span> <span class=\"sg\" data-s=\"4\">Declaratio variabilis vel routina esse potest.<\/span> <span class=\"sg\" data-s=\"5\">Trait cum <code>is<\/code> scribis.<\/span> <span class=\"sg\" data-s=\"6\">Secunda proprietas est <em>pragma<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Pragma paulum simile est modulo.<\/span> <span class=\"sg\" data-s=\"8\">Id cum <code>use<\/code> activas, vel cum <code>no<\/code> deactivas.<\/span> <span class=\"sg\" data-s=\"9\">Regulam pro reliquo ambitu lexicali mutat.<\/span> <span class=\"sg\" data-s=\"10\">Aliis verbis, usque ad finem blocki operatur.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Iam trait adhibuisti, ut <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed tunc non multum de eo didicisti.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio traits propius spectat.<\/span> <span class=\"sg\" data-s=\"3\">Te docet trait tuum scribere.<\/span> <span class=\"sg\" data-s=\"4\">Etiam pragmata tibi ostendit.<\/span><\/p>"]]}}}</script>
