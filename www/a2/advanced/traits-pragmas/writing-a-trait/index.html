<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/writing-a-trait","n":569,"k":"topic","pv":"advanced/traits-pragmas/built-in-traits/quiz","nx":"advanced/traits-pragmas/pragmas","tr":["advanced","advanced/traits-pragmas"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Writing a trait","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Traits are normal multi-subroutines with a special name.<\/span> <span class=\"sg\" data-s=\"1\">So you can write your own traits.<\/span> <span class=\"sg\" data-s=\"2\">Do you want a trait <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Then define a <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Its parameters say two things.<\/span> <span class=\"sg\" data-s=\"5\">They say what the trait works on.<\/span> <span class=\"sg\" data-s=\"6\">They also give the name of the trait:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">This is one of the harder parts of Raku.<\/span> <span class=\"sg\" data-s=\"1\">Do not worry if it looks difficult.<\/span> <span class=\"sg\" data-s=\"2\">You can use the built-in traits well without this knowledge.<\/span> <span class=\"sg\" data-s=\"3\">You do not need to know how they are made.<\/span> <span class=\"sg\" data-s=\"4\">You will rarely need to write a trait yourself.<\/span> <span class=\"sg\" data-s=\"5\">This page just shows you how traits work inside.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Look at the signature.<\/span> <span class=\"sg\" data-s=\"1\">The first parameter is <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It is the thing that has the trait.<\/span> <span class=\"sg\" data-s=\"3\">Here, it is a subroutine.<\/span> <span class=\"sg\" data-s=\"4\">The <code>:D<\/code> is a type <em>smiley<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">It needs a <strong>defined<\/strong> value.<\/span> <span class=\"sg\" data-s=\"6\">This is a real routine object.<\/span> <span class=\"sg\" data-s=\"7\">It is not the undefined type <code>Routine<\/code> itself.<\/span> <span class=\"sg\" data-s=\"8\">There are two other smileys.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> needs the undefined type object.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> takes both.<\/span> <span class=\"sg\" data-s=\"11\">The named parameter <code>:$traced!<\/code> is the name of the trait.<\/span> <span class=\"sg\" data-s=\"12\">This parameter is the reason why <code>is traced<\/code> calls this sub.<\/span> <span class=\"sg\" data-s=\"13\">Traits run at <strong>compile time<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">So Raku records <code>foo<\/code> and <code>bar<\/code> right when it reads their declarations.<\/span> <span class=\"sg\" data-s=\"15\">When the program runs, <code>@traced<\/code> already has both names.<\/span> <span class=\"sg\" data-s=\"16\">You can even move the line <code>say @traced<\/code> up, above the two <code>sub<\/code> definitions.<\/span> <span class=\"sg\" data-s=\"17\">It still prints <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">This small trait only records names.<\/span> <span class=\"sg\" data-s=\"1\">But the same idea can do much more.<\/span> <span class=\"sg\" data-s=\"2\">For example, a trait can wrap a routine to add logging.<\/span> <span class=\"sg\" data-s=\"3\">It can check an attribute.<\/span> <span class=\"sg\" data-s=\"4\">Or it can attach metadata, that is, extra data about the code.<\/span> <span class=\"sg\" data-s=\"5\">Here, the first parameter is a <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">You can also make it an <code>Attribute<\/code> or a <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Then the trait works with attributes or variables.<\/span> <span class=\"sg\" data-s=\"8\">Traits keep the syntax of declarations in Raku open.<\/span> <span class=\"sg\" data-s=\"9\">You can always add new traits.<\/span> <span class=\"sg\" data-s=\"10\">The built-in <code>is rw<\/code> and your own <code>is traced<\/code> are made in the same way.<\/span><\/p>"]]},"de":{"t":"Einen Trait schreiben","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Traits sind normale Multi-Subroutinen mit einem speziellen Namen.<\/span> <span class=\"sg\" data-s=\"1\">Also können Sie eigene Traits schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Möchten Sie ein Trait <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Dann definieren Sie ein <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Seine Parameter sagen zwei Dinge.<\/span> <span class=\"sg\" data-s=\"5\">Erstens sagen sie, worauf das Trait wirkt.<\/span> <span class=\"sg\" data-s=\"6\">Zweitens geben sie den Namen des Traits an:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Das ist einer der schwereren Teile von Raku.<\/span> <span class=\"sg\" data-s=\"1\">Keine Sorge, wenn es schwierig aussieht.<\/span> <span class=\"sg\" data-s=\"2\">Sie können die eingebauten Traits auch ohne dieses Wissen gut benutzen.<\/span> <span class=\"sg\" data-s=\"3\">Sie müssen nicht wissen, wie sie gemacht sind.<\/span> <span class=\"sg\" data-s=\"4\">Sie müssen nur selten selbst ein Trait schreiben.<\/span> <span class=\"sg\" data-s=\"5\">Diese Seite zeigt Ihnen nur, wie Traits innen funktionieren.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich die Signatur an.<\/span> <span class=\"sg\" data-s=\"1\">Der erste Parameter ist <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er ist das Element, das das Trait hat.<\/span> <span class=\"sg\" data-s=\"3\">Hier ist es eine Subroutine.<\/span> <span class=\"sg\" data-s=\"4\">Das <code>:D<\/code> ist ein Typ-<em>Smiley<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Er braucht einen <strong>definierten<\/strong> Wert.<\/span> <span class=\"sg\" data-s=\"6\">Das ist ein echtes Routine-Objekt.<\/span> <span class=\"sg\" data-s=\"7\">Es ist nicht der undefinierte Typ <code>Routine<\/code> selbst.<\/span> <span class=\"sg\" data-s=\"8\">Es gibt noch zwei andere Smileys.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> braucht das undefinierte Typ-Objekt.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> nimmt beides.<\/span> <span class=\"sg\" data-s=\"11\">Der benannte Parameter <code>:$traced!<\/code> ist der Name des Traits.<\/span> <span class=\"sg\" data-s=\"12\">Wegen dieses Parameters ruft <code>is traced<\/code> diese Sub auf.<\/span> <span class=\"sg\" data-s=\"13\">Traits laufen zur <strong>Kompilierzeit<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Also speichert Raku <code>foo<\/code> und <code>bar<\/code> schon, wenn es ihre Deklarationen liest.<\/span> <span class=\"sg\" data-s=\"15\">Wenn das Programm läuft, hat <code>@traced<\/code> schon beide Namen.<\/span> <span class=\"sg\" data-s=\"16\">Sie können die Zeile <code>say @traced<\/code> sogar nach oben schieben, über die zwei <code>sub<\/code>-Definitionen.<\/span> <span class=\"sg\" data-s=\"17\">Die Zeile gibt trotzdem <code>[foo bar]<\/code> aus.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Dieses kleine Trait speichert nur Namen.<\/span> <span class=\"sg\" data-s=\"1\">Aber die gleiche Idee kann viel mehr.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kann ein Trait eine Routine umhüllen und Protokollierung hinzufügen.<\/span> <span class=\"sg\" data-s=\"3\">Es kann ein Attribut prüfen.<\/span> <span class=\"sg\" data-s=\"4\">Oder es kann Metadaten anhängen, also zusätzliche Daten über den Code.<\/span> <span class=\"sg\" data-s=\"5\">Hier ist der erste Parameter eine <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Sie können ihn auch zu einem <code>Attribute<\/code> oder einer <code>Variable<\/code> machen.<\/span> <span class=\"sg\" data-s=\"7\">Dann arbeitet das Trait mit Attributen oder Variablen.<\/span> <span class=\"sg\" data-s=\"8\">Traits halten die Syntax von Deklarationen in Raku offen.<\/span> <span class=\"sg\" data-s=\"9\">Sie können immer neue Traits hinzufügen.<\/span> <span class=\"sg\" data-s=\"10\">Das eingebaute <code>is rw<\/code> und Ihr eigenes <code>is traced<\/code> sind auf die gleiche Weise gemacht.<\/span><\/p>"]]},"nl":{"t":"Een trait schrijven","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Traits zijn gewone multi-subroutines met een speciale naam.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dus je eigen traits schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Wil je een trait <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Definieer dan een <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Zijn parameters zeggen twee dingen.<\/span> <span class=\"sg\" data-s=\"5\">Ze zeggen waar de trait op werkt.<\/span> <span class=\"sg\" data-s=\"6\">Ze geven ook de naam van de trait:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dit is een van de moeilijkere delen van Raku.<\/span> <span class=\"sg\" data-s=\"1\">Maak je geen zorgen als het moeilijk lijkt.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt de ingebouwde traits goed gebruiken zonder deze kennis.<\/span> <span class=\"sg\" data-s=\"3\">Je hoeft niet te weten hoe ze gemaakt zijn.<\/span> <span class=\"sg\" data-s=\"4\">Je moet maar zelden zelf een trait schrijven.<\/span> <span class=\"sg\" data-s=\"5\">Deze pagina laat je alleen zien hoe traits van binnen werken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de signatuur.<\/span> <span class=\"sg\" data-s=\"1\">De eerste parameter is <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat is het ding met de trait.<\/span> <span class=\"sg\" data-s=\"3\">Hier is het een subroutine.<\/span> <span class=\"sg\" data-s=\"4\">De <code>:D<\/code> is een type-<em>smiley<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Die vraagt om een <strong>gedefinieerde<\/strong> waarde.<\/span> <span class=\"sg\" data-s=\"6\">Dat is een echt routineobject.<\/span> <span class=\"sg\" data-s=\"7\">Het is niet het ongedefinieerde type <code>Routine<\/code> zelf.<\/span> <span class=\"sg\" data-s=\"8\">Er zijn nog twee andere smileys.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> vraagt om het ongedefinieerde typeobject.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> neemt allebei.<\/span> <span class=\"sg\" data-s=\"11\">De benoemde parameter <code>:$traced!<\/code> is de naam van de trait.<\/span> <span class=\"sg\" data-s=\"12\">Deze parameter is de reden dat <code>is traced<\/code> deze sub aanroept.<\/span> <span class=\"sg\" data-s=\"13\">Traits draaien <strong>tijdens het compileren<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Raku legt <code>foo<\/code> en <code>bar<\/code> dus vast zodra het hun declaraties leest.<\/span> <span class=\"sg\" data-s=\"15\">Als het programma draait, bevat <code>@traced<\/code> al beide namen.<\/span> <span class=\"sg\" data-s=\"16\">Je kunt de regel <code>say @traced<\/code> zelfs boven de twee <code>sub<\/code>-definities zetten.<\/span> <span class=\"sg\" data-s=\"17\">Hij drukt dan nog steeds <code>[foo bar]<\/code> af.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Deze kleine trait legt alleen namen vast.<\/span> <span class=\"sg\" data-s=\"1\">Maar hetzelfde idee kan veel meer.<\/span> <span class=\"sg\" data-s=\"2\">Een trait kan bijvoorbeeld een routine inpakken om logging toe te voegen.<\/span> <span class=\"sg\" data-s=\"3\">Hij kan een attribuut controleren.<\/span> <span class=\"sg\" data-s=\"4\">Of hij kan metadata toevoegen, dat wil zeggen extra gegevens over de code.<\/span> <span class=\"sg\" data-s=\"5\">Hier is de eerste parameter een <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt er ook een <code>Attribute<\/code> of een <code>Variable<\/code> van maken.<\/span> <span class=\"sg\" data-s=\"7\">Dan werkt de trait met attributen of variabelen.<\/span> <span class=\"sg\" data-s=\"8\">Traits houden de syntaxis van declaraties in Raku open.<\/span> <span class=\"sg\" data-s=\"9\">Je kunt altijd nieuwe traits toevoegen.<\/span> <span class=\"sg\" data-s=\"10\">De ingebouwde <code>is rw<\/code> en je eigen <code>is traced<\/code> zijn op dezelfde manier gemaakt.<\/span><\/p>"]]},"es":{"t":"Escribir un trait","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Los traits son subrutinas multi normales con un nombre especial.<\/span> <span class=\"sg\" data-s=\"1\">Así, puedes escribir tus propios traits.<\/span> <span class=\"sg\" data-s=\"2\">¿Quieres un trait <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Entonces define un <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sus parámetros dicen dos cosas.<\/span> <span class=\"sg\" data-s=\"5\">Dicen con qué trabaja el trait.<\/span> <span class=\"sg\" data-s=\"6\">También dan el nombre del trait:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Esta es una de las partes más difíciles de Raku.<\/span> <span class=\"sg\" data-s=\"1\">No te preocupes si te parece difícil.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usar bien los traits incorporados sin este conocimiento.<\/span> <span class=\"sg\" data-s=\"3\">No necesitas saber cómo están hechos.<\/span> <span class=\"sg\" data-s=\"4\">Pocas veces vas a necesitar escribir un trait tú mismo.<\/span> <span class=\"sg\" data-s=\"5\">Esta página solo te muestra cómo funcionan los traits por dentro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Mira la firma.<\/span> <span class=\"sg\" data-s=\"1\">El primer parámetro es <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es el elemento que tiene el trait.<\/span> <span class=\"sg\" data-s=\"3\">Aquí, es una subrutina.<\/span> <span class=\"sg\" data-s=\"4\">El <code>:D<\/code> es un <em>smiley<\/em> de tipo.<\/span> <span class=\"sg\" data-s=\"5\">Necesita un valor <strong>definido<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Es un objeto de rutina real.<\/span> <span class=\"sg\" data-s=\"7\">No es el propio tipo indefinido <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Hay otros dos smileys.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> necesita el objeto de tipo indefinido.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> acepta los dos.<\/span> <span class=\"sg\" data-s=\"11\">El parámetro nombrado <code>:$traced!<\/code> es el nombre del trait.<\/span> <span class=\"sg\" data-s=\"12\">Este parámetro es la razón por la que <code>is traced<\/code> llama a esta sub.<\/span> <span class=\"sg\" data-s=\"13\">Los traits se ejecutan en <strong>tiempo de compilación<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Así, Raku registra <code>foo<\/code> y <code>bar<\/code> justo cuando lee sus declaraciones.<\/span> <span class=\"sg\" data-s=\"15\">Cuando el programa se ejecuta, <code>@traced<\/code> ya tiene los dos nombres.<\/span> <span class=\"sg\" data-s=\"16\">Incluso puedes mover la línea <code>say @traced<\/code> arriba, antes de las dos definiciones <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Aun así imprime <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Este pequeño trait solo registra nombres.<\/span> <span class=\"sg\" data-s=\"1\">Pero la misma idea puede hacer mucho más.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, un trait puede envolver una rutina para añadir un registro de eventos.<\/span> <span class=\"sg\" data-s=\"3\">Puede comprobar un atributo.<\/span> <span class=\"sg\" data-s=\"4\">O puede añadir metadatos, es decir, datos extra sobre el código.<\/span> <span class=\"sg\" data-s=\"5\">Aquí, el primer parámetro es un <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">También puedes hacer que sea un <code>Attribute<\/code> o un <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Entonces el trait trabaja con atributos o variables.<\/span> <span class=\"sg\" data-s=\"8\">Los traits mantienen abierta la sintaxis de las declaraciones en Raku.<\/span> <span class=\"sg\" data-s=\"9\">Siempre puedes añadir traits nuevos.<\/span> <span class=\"sg\" data-s=\"10\">El <code>is rw<\/code> incorporado y tu propio <code>is traced<\/code> están hechos de la misma forma.<\/span><\/p>"]]},"it":{"t":"Scrivere un trait","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">I trait sono normali multi-subroutine con un nome speciale.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi scrivere i tuoi trait.<\/span> <span class=\"sg\" data-s=\"2\">Vuoi un trait <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Allora definisci una <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">I suoi parametri dicono due cose.<\/span> <span class=\"sg\" data-s=\"5\">Dicono su cosa lavora il trait.<\/span> <span class=\"sg\" data-s=\"6\">Danno anche il nome del trait:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questa è una delle parti più difficili di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Non preoccuparti se ti sembra complicata.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare bene i trait integrati anche senza saperlo.<\/span> <span class=\"sg\" data-s=\"3\">Non devi sapere come sono fatti.<\/span> <span class=\"sg\" data-s=\"4\">Raramente dovrai scrivere un trait da solo.<\/span> <span class=\"sg\" data-s=\"5\">Questa pagina ti mostra solo come funzionano i trait dentro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Guarda la firma.<\/span> <span class=\"sg\" data-s=\"1\">Il primo parametro è <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">È la cosa che ha il trait.<\/span> <span class=\"sg\" data-s=\"3\">Qui è una subroutine.<\/span> <span class=\"sg\" data-s=\"4\">Il <code>:D<\/code> è uno <em>smiley<\/em> di tipo.<\/span> <span class=\"sg\" data-s=\"5\">Vuole un valore <strong>definito<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Questo è un vero oggetto routine.<\/span> <span class=\"sg\" data-s=\"7\">Non è il tipo indefinito <code>Routine<\/code> stesso.<\/span> <span class=\"sg\" data-s=\"8\">Ci sono altri due smiley.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> vuole l'oggetto tipo indefinito.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> accetta tutti e due.<\/span> <span class=\"sg\" data-s=\"11\">Il parametro nominato <code>:$traced!<\/code> è il nome del trait.<\/span> <span class=\"sg\" data-s=\"12\">Grazie a questo parametro, <code>is traced<\/code> chiama questa sub.<\/span> <span class=\"sg\" data-s=\"13\">I trait lavorano <strong>durante la compilazione<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Così Raku registra <code>foo<\/code> e <code>bar<\/code> appena legge le loro dichiarazioni.<\/span> <span class=\"sg\" data-s=\"15\">Durante l'esecuzione, <code>@traced<\/code> ha già i due nomi.<\/span> <span class=\"sg\" data-s=\"16\">Puoi persino spostare la riga <code>say @traced<\/code> più in alto, sopra le due definizioni <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Stampa comunque <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Questo piccolo trait registra solo dei nomi.<\/span> <span class=\"sg\" data-s=\"1\">Ma la stessa idea può fare molto di più.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, un trait può avvolgere una routine per aggiungere il logging.<\/span> <span class=\"sg\" data-s=\"3\">Può controllare un attributo.<\/span> <span class=\"sg\" data-s=\"4\">Oppure può aggiungere dei metadati, cioè dati in più sul codice.<\/span> <span class=\"sg\" data-s=\"5\">Qui il primo parametro è una <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Puoi anche renderlo un <code>Attribute<\/code> o una <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Allora il trait lavora con attributi o variabili.<\/span> <span class=\"sg\" data-s=\"8\">I trait tengono aperta la sintassi delle dichiarazioni in Raku.<\/span> <span class=\"sg\" data-s=\"9\">Puoi sempre aggiungere nuovi trait.<\/span> <span class=\"sg\" data-s=\"10\">Il trait integrato <code>is rw<\/code> e il tuo <code>is traced<\/code> sono fatti nello stesso modo.<\/span><\/p>"]]},"lv":{"t":"Īpašības rakstīšana","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Īpašības ir parastas multi-apakšprogrammas ar īpašu nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat rakstīt savas īpašības.<\/span> <span class=\"sg\" data-s=\"2\">Vai jūs gribat īpašību <code>is kautkas<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Tad definējiet <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tās parametri pasaka divas lietas.<\/span> <span class=\"sg\" data-s=\"5\">Tie pasaka, ar ko īpašība strādā.<\/span> <span class=\"sg\" data-s=\"6\">Tie arī dod īpašības nosaukumu:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šī ir viena no grūtākajām Raku daļām.<\/span> <span class=\"sg\" data-s=\"1\">Neuztraucieties, ja tā izskatās grūta.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat labi lietot iebūvētās īpašības bez šīm zināšanām.<\/span> <span class=\"sg\" data-s=\"3\">Jums nav jāzina, kā tās ir veidotas.<\/span> <span class=\"sg\" data-s=\"4\">Jums reti būs pašiem jāraksta īpašība.<\/span> <span class=\"sg\" data-s=\"5\">Šī lapa tikai parāda, kā īpašības strādā iekšpusē.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Paskatieties uz signatūru.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais parametrs ir <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir lieta, kurai ir īpašība.<\/span> <span class=\"sg\" data-s=\"3\">Šeit tā ir apakšprogramma.<\/span> <span class=\"sg\" data-s=\"4\"><code>:D<\/code> ir tipa <em>smailijs<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Tas pieprasa <strong>definētu<\/strong> vērtību.<\/span> <span class=\"sg\" data-s=\"6\">Tas ir īsts apakšprogrammas objekts.<\/span> <span class=\"sg\" data-s=\"7\">Tas nav pats nedefinētais tips <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Ir vēl divi smailiji.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> pieprasa nedefinētu tipa objektu.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> pieņem abus.<\/span> <span class=\"sg\" data-s=\"11\">Nosauktais parametrs <code>:$traced!<\/code> ir īpašības nosaukums.<\/span> <span class=\"sg\" data-s=\"12\">Šī parametra dēļ <code>is traced<\/code> izsauc šo apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"13\">Īpašības izpildās <strong>kompilēšanas laikā<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Tāpēc Raku pieraksta <code>foo<\/code> un <code>bar<\/code> uzreiz, kad nolasa to deklarācijas.<\/span> <span class=\"sg\" data-s=\"15\">Kad programma darbojas, masīvā <code>@traced<\/code> jau ir abi nosaukumi.<\/span> <span class=\"sg\" data-s=\"16\">Jūs pat varat pārcelt rindu <code>say @traced<\/code> augšup, virs abām <code>sub<\/code> definīcijām.<\/span> <span class=\"sg\" data-s=\"17\">Tā joprojām izdrukā <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Šī mazā īpašība tikai pieraksta nosaukumus.<\/span> <span class=\"sg\" data-s=\"1\">Bet tā pati ideja var izdarīt daudz vairāk.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, īpašība var ietvert apakšprogrammu, lai pievienotu žurnalēšanu.<\/span> <span class=\"sg\" data-s=\"3\">Tā var pārbaudīt atribūtu.<\/span> <span class=\"sg\" data-s=\"4\">Vai arī tā var pievienot metadatus, tas ir, papildu datus par kodu.<\/span> <span class=\"sg\" data-s=\"5\">Šeit pirmais parametrs ir <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Jūs to varat padarīt arī par <code>Attribute<\/code> vai <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Tad īpašība strādā ar atribūtiem vai mainīgajiem.<\/span> <span class=\"sg\" data-s=\"8\">Īpašības uztur Raku deklarāciju sintaksi atvērtu.<\/span> <span class=\"sg\" data-s=\"9\">Jūs vienmēr varat pievienot jaunas īpašības.<\/span> <span class=\"sg\" data-s=\"10\">Iebūvētā <code>is rw<\/code> un jūsu pašu <code>is traced<\/code> ir veidotas vienādi.<\/span><\/p>"]]},"ru":{"t":"Написание трейта","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Типажи — это обычные мультиподпрограммы с особым именем.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете писать свои типажи.<\/span> <span class=\"sg\" data-s=\"2\">Вам нужен типаж <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Тогда определите <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Его параметры говорят две вещи.<\/span> <span class=\"sg\" data-s=\"5\">Они говорят, с чем работает типаж.<\/span> <span class=\"sg\" data-s=\"6\">Ещё они задают имя типажа:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Это одна из трудных частей Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не волнуйтесь, если это кажется сложным.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете хорошо использовать встроенные типажи и без этих знаний.<\/span> <span class=\"sg\" data-s=\"3\">Вам не нужно знать, как они сделаны.<\/span> <span class=\"sg\" data-s=\"4\">Вам редко понадобится самому писать типаж.<\/span> <span class=\"sg\" data-s=\"5\">Эта страница просто показывает, как типажи работают внутри.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на сигнатуру.<\/span> <span class=\"sg\" data-s=\"1\">Первый параметр — <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это то, у чего есть типаж.<\/span> <span class=\"sg\" data-s=\"3\">Здесь это подпрограмма.<\/span> <span class=\"sg\" data-s=\"4\"><code>:D<\/code> — это типовой <em>смайлик<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ему нужно <strong>определённое<\/strong> значение.<\/span> <span class=\"sg\" data-s=\"6\">Это настоящий объект подпрограммы.<\/span> <span class=\"sg\" data-s=\"7\">Это не сам неопределённый тип <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Есть ещё два смайлика.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> требует неопределённый объект типа.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> принимает и то, и другое.<\/span> <span class=\"sg\" data-s=\"11\">Именованный параметр <code>:$traced!<\/code> — это имя типажа.<\/span> <span class=\"sg\" data-s=\"12\">Из-за этого параметра <code>is traced<\/code> вызывает эту подпрограмму.<\/span> <span class=\"sg\" data-s=\"13\">Типажи выполняются во время <strong>компиляции<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Поэтому Raku записывает <code>foo<\/code> и <code>bar<\/code> сразу, когда читает их объявления.<\/span> <span class=\"sg\" data-s=\"15\">Когда программа работает, в <code>@traced<\/code> уже есть оба имени.<\/span> <span class=\"sg\" data-s=\"16\">Можно даже передвинуть строку <code>say @traced<\/code> вверх, выше двух определений <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Она всё равно напечатает <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Этот маленький типаж только записывает имена.<\/span> <span class=\"sg\" data-s=\"1\">Но та же идея может делать гораздо больше.<\/span> <span class=\"sg\" data-s=\"2\">Например, типаж может обернуть подпрограмму и добавить логирование.<\/span> <span class=\"sg\" data-s=\"3\">Он может проверить атрибут.<\/span> <span class=\"sg\" data-s=\"4\">Или он может прикрепить метаданные, то есть дополнительные данные о коде.<\/span> <span class=\"sg\" data-s=\"5\">Здесь первый параметр — <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Можно также сделать его <code>Attribute<\/code> или <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Тогда типаж работает с атрибутами или переменными.<\/span> <span class=\"sg\" data-s=\"8\">Типажи оставляют синтаксис объявлений в Raku открытым.<\/span> <span class=\"sg\" data-s=\"9\">Вы всегда можете добавить новые типажи.<\/span> <span class=\"sg\" data-s=\"10\">Встроенный <code>is rw<\/code> и ваш собственный <code>is traced<\/code> сделаны одинаково.<\/span><\/p>"]]},"uk":{"t":"Написання трейта","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Трейти — це звичайні мульти-підпрограми з особливим іменем.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви можете писати власні трейти.<\/span> <span class=\"sg\" data-s=\"2\">Хочете трейт <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Тоді визначте <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Його параметри кажуть дві речі.<\/span> <span class=\"sg\" data-s=\"5\">Вони кажуть, з чим працює трейт.<\/span> <span class=\"sg\" data-s=\"6\">А ще вони дають ім'я трейту:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Це одна з важчих частин Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не хвилюйтеся, якщо вона здається важкою.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете добре користуватися вбудованими трейтами без цих знань.<\/span> <span class=\"sg\" data-s=\"3\">Вам не треба знати, як вони зроблені.<\/span> <span class=\"sg\" data-s=\"4\">Писати трейт самому вам доведеться рідко.<\/span> <span class=\"sg\" data-s=\"5\">Ця сторінка лише показує, як трейти працюють усередині.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Подивіться на сигнатуру.<\/span> <span class=\"sg\" data-s=\"1\">Перший параметр — <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це те, що має трейт.<\/span> <span class=\"sg\" data-s=\"3\">Тут це підпрограма.<\/span> <span class=\"sg\" data-s=\"4\"><code>:D<\/code> — це <em>смайлик<\/em> типу.<\/span> <span class=\"sg\" data-s=\"5\">Він вимагає <strong>визначеного<\/strong> значення.<\/span> <span class=\"sg\" data-s=\"6\">Це справжній об'єкт-підпрограма.<\/span> <span class=\"sg\" data-s=\"7\">Це не сам невизначений тип <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Є ще два смайлики.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> вимагає невизначеного об'єкта типу.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> приймає обидва варіанти.<\/span> <span class=\"sg\" data-s=\"11\">Іменований параметр <code>:$traced!<\/code> — це ім'я трейта.<\/span> <span class=\"sg\" data-s=\"12\">Через цей параметр <code>is traced<\/code> викликає цю підпрограму.<\/span> <span class=\"sg\" data-s=\"13\">Трейти виконуються <strong>під час компіляції<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Тож Raku записує <code>foo<\/code> і <code>bar<\/code> одразу, коли читає їхні оголошення.<\/span> <span class=\"sg\" data-s=\"15\">Коли програма запускається, <code>@traced<\/code> уже має обидва імена.<\/span> <span class=\"sg\" data-s=\"16\">Ви навіть можете підняти рядок <code>say @traced<\/code> вище, над двома означеннями <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Він однаково виведе <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Цей маленький трейт лише записує імена.<\/span> <span class=\"sg\" data-s=\"1\">Але та сама ідея може робити набагато більше.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, трейт може обгорнути підпрограму, щоб додати журналювання.<\/span> <span class=\"sg\" data-s=\"3\">Він може перевірити атрибут.<\/span> <span class=\"sg\" data-s=\"4\">Або він може додати метадані, тобто додаткові дані про код.<\/span> <span class=\"sg\" data-s=\"5\">Тут перший параметр — це <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ви також можете зробити його <code>Attribute<\/code> або <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Тоді трейт працює з атрибутами або змінними.<\/span> <span class=\"sg\" data-s=\"8\">Трейти тримають синтаксис оголошень у Raku відкритим.<\/span> <span class=\"sg\" data-s=\"9\">Ви завжди можете додати нові трейти.<\/span> <span class=\"sg\" data-s=\"10\">Вбудований <code>is rw<\/code> і ваш власний <code>is traced<\/code> зроблені однаково.<\/span><\/p>"]]},"bg":{"t":"Писане на трейт","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Трейтовете са обикновени multi-подпрограми със специално име.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да пишете свои трейтове.<\/span> <span class=\"sg\" data-s=\"2\">Искате ли трейт <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Тогава дефинирайте <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Нейните параметри казват две неща.<\/span> <span class=\"sg\" data-s=\"5\">Те казват върху какво работи трейтът.<\/span> <span class=\"sg\" data-s=\"6\">Те дават и името на трейта:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Това е една от по-трудните части на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не се тревожете, ако ви изглежда трудно.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате добре вградените трейтове и без тези знания.<\/span> <span class=\"sg\" data-s=\"3\">Не е нужно да знаете как са направени.<\/span> <span class=\"sg\" data-s=\"4\">Рядко ще ви се налага сами да пишете трейт.<\/span> <span class=\"sg\" data-s=\"5\">Тази страница само ви показва как работят трейтовете отвътре.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Вижте сигнатурата.<\/span> <span class=\"sg\" data-s=\"1\">Първият параметър е <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е нещото, което има трейта.<\/span> <span class=\"sg\" data-s=\"3\">Тук това е подпрограма.<\/span> <span class=\"sg\" data-s=\"4\"><code>:D<\/code> е типов <em>смайли<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Той иска <strong>дефинирана<\/strong> стойност.<\/span> <span class=\"sg\" data-s=\"6\">Това е истински обект-подпрограма.<\/span> <span class=\"sg\" data-s=\"7\">Това не е самият недефиниран тип <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Има още два такива смайли.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> иска недефиниран типов обект.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> приема и двата вида.<\/span> <span class=\"sg\" data-s=\"11\">Именуваният параметър <code>:$traced!<\/code> е името на трейта.<\/span> <span class=\"sg\" data-s=\"12\">Заради този параметър <code>is traced<\/code> извиква тази подпрограма.<\/span> <span class=\"sg\" data-s=\"13\">Трейтовете се изпълняват по <strong>време на компилация<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Затова Raku записва <code>foo<\/code> и <code>bar<\/code> веднага, щом прочете декларациите им.<\/span> <span class=\"sg\" data-s=\"15\">Когато програмата работи, <code>@traced<\/code> вече съдържа двете имена.<\/span> <span class=\"sg\" data-s=\"16\">Можете дори да преместите реда <code>say @traced<\/code> нагоре, над двете дефиниции <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Програмата пак отпечатва <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Този малък трейт само записва имена.<\/span> <span class=\"sg\" data-s=\"1\">Но същата идея може да направи много повече.<\/span> <span class=\"sg\" data-s=\"2\">Например трейтът може да обвие подпрограма, за да добави логване.<\/span> <span class=\"sg\" data-s=\"3\">Той може да проверява атрибут.<\/span> <span class=\"sg\" data-s=\"4\">Или може да прикрепи метаданни, тоест допълнителни данни за кода.<\/span> <span class=\"sg\" data-s=\"5\">Тук първият параметър е <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Можете да го направите и <code>Attribute<\/code> или <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Тогава трейтът работи с атрибути или променливи.<\/span> <span class=\"sg\" data-s=\"8\">Трейтовете пазят синтаксиса на декларациите в Raku отворен.<\/span> <span class=\"sg\" data-s=\"9\">Винаги можете да добавяте нови трейтове.<\/span> <span class=\"sg\" data-s=\"10\">Вграденият <code>is rw<\/code> и вашият собствен <code>is traced<\/code> са направени по един и същи начин.<\/span><\/p>"]]},"eo":{"t":"Skribi trajton","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Trajtoj estas normalaj multi-subrutinoj kun speciala nomo.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas skribi viajn proprajn trajtojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu vi volas trajton <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Tiam difinu <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝiaj parametroj diras du aferojn.<\/span> <span class=\"sg\" data-s=\"5\">Ili diras, kun kio la trajto laboras.<\/span> <span class=\"sg\" data-s=\"6\">Ili ankaŭ donas la nomon de la trajto:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas unu el la pli malfacilaj partoj de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ne zorgu, se ĝi aspektas malfacila.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas bone uzi la enkonstruitajn trajtojn sen ĉi tiu scio.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne bezonas scii, kiel ili estas faritaj.<\/span> <span class=\"sg\" data-s=\"4\">Vi malofte bezonos skribi trajton mem.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiu paĝo nur montras al vi, kiel trajtoj funkcias interne.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Rigardu la subskribon.<\/span> <span class=\"sg\" data-s=\"1\">La unua parametro estas <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas la aĵo, kiu havas la trajton.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tie, ĝi estas subrutino.<\/span> <span class=\"sg\" data-s=\"4\">La <code>:D<\/code> estas tipa <em>rideto<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi bezonas <strong>difinitan<\/strong> valoron.<\/span> <span class=\"sg\" data-s=\"6\">Tio estas vera rutina objekto.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ne estas la nedifinita tipo <code>Routine<\/code> mem.<\/span> <span class=\"sg\" data-s=\"8\">Ekzistas du aliaj ridetoj.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> bezonas la nedifinitan tipobjekton.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> akceptas ambaŭ.<\/span> <span class=\"sg\" data-s=\"11\">La nomita parametro <code>:$traced!<\/code> estas la nomo de la trajto.<\/span> <span class=\"sg\" data-s=\"12\">Ĉi tiu parametro estas la kialo, kial <code>is traced<\/code> vokas ĉi tiun subrutinon.<\/span> <span class=\"sg\" data-s=\"13\">Trajtoj ruliĝas dum <strong>kompilado<\/strong>.<\/span> <span class=\"sg\" data-s=\"14\">Do Raku registras <code>foo<\/code> kaj <code>bar<\/code> tuj, kiam ĝi legas iliajn deklarojn.<\/span> <span class=\"sg\" data-s=\"15\">Kiam la programo ruliĝas, <code>@traced<\/code> jam havas ambaŭ nomojn.<\/span> <span class=\"sg\" data-s=\"16\">Vi eĉ povas movi la linion <code>say @traced<\/code> supren, antaŭ la du difinojn <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Ĝi ankoraŭ presas <code>[foo bar]<\/code>.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu malgranda trajto nur registras nomojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed la sama ideo povas fari multe pli.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, trajto povas envolvi rutinon por aldoni protokoladon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi povas kontroli atributon.<\/span> <span class=\"sg\" data-s=\"4\">Aŭ ĝi povas alfiksi metadatumojn, tio estas, kromajn datumojn pri la kodo.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tie, la unua parametro estas <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Vi ankaŭ povas fari ĝin <code>Attribute<\/code> aŭ <code>Variable<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Tiam la trajto laboras kun atributoj aŭ variabloj.<\/span> <span class=\"sg\" data-s=\"8\">Trajtoj tenas la sintakson de deklaroj en Raku malfermita.<\/span> <span class=\"sg\" data-s=\"9\">Vi ĉiam povas aldoni novajn trajtojn.<\/span> <span class=\"sg\" data-s=\"10\">La enkonstruita <code>is rw<\/code> kaj via propra <code>is traced<\/code> estas faritaj same.<\/span><\/p>"]]},"la":{"t":"Proprietatem scribere","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Traits sunt multi-subroutinae ordinariae cum nomine speciali.<\/span> <span class=\"sg\" data-s=\"1\">Ergo traits tuos scribere potes.<\/span> <span class=\"sg\" data-s=\"2\">Visne trait <code>is something<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Tum defini <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Parametra eius duas res dicunt.<\/span> <span class=\"sg\" data-s=\"5\">Dicunt rem in qua trait operatur.<\/span> <span class=\"sg\" data-s=\"6\">Etiam nomen trait dant:<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Haec est una ex partibus difficilioribus Raku.<\/span> <span class=\"sg\" data-s=\"1\">Noli sollicitari si difficilis videtur.<\/span> <span class=\"sg\" data-s=\"2\">Traits incorporatos bene adhibere potes sine hac scientia.<\/span> <span class=\"sg\" data-s=\"3\">Non necesse est scire quomodo facti sint.<\/span> <span class=\"sg\" data-s=\"4\">Raro trait ipse scribere debebis.<\/span> <span class=\"sg\" data-s=\"5\">Haec pagina tibi tantum interiora traits ostendit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",18,"<p><span class=\"sg\" data-s=\"0\">Specta signaturam.<\/span> <span class=\"sg\" data-s=\"1\">Primum parametrum est <code>Routine:D $r<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Est res quae trait habet.<\/span> <span class=\"sg\" data-s=\"3\">Hic est subroutina.<\/span> <span class=\"sg\" data-s=\"4\"><code>:D<\/code> est typus <em>smiley<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Valorem <strong>definitum<\/strong> requirit.<\/span> <span class=\"sg\" data-s=\"6\">Hoc est obiectum routinae verum.<\/span> <span class=\"sg\" data-s=\"7\">Non est ipse typus indefinitus <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Sunt duo alii smileys.<\/span> <span class=\"sg\" data-s=\"9\"><code>:U<\/code> obiectum typi indefinitum requirit.<\/span> <span class=\"sg\" data-s=\"10\"><code>:_<\/code> utrumque accipit.<\/span> <span class=\"sg\" data-s=\"11\">Parametrum nominatum <code>:$traced!<\/code> est nomen trait.<\/span> <span class=\"sg\" data-s=\"12\">Propter hoc parametrum <code>is traced<\/code> hanc sub vocat.<\/span> <span class=\"sg\" data-s=\"13\">Traits tempore <strong>compilationis<\/strong> currunt.<\/span> <span class=\"sg\" data-s=\"14\">Ergo Raku <code>foo<\/code> et <code>bar<\/code> registrat statim cum declarationes eorum legit.<\/span> <span class=\"sg\" data-s=\"15\">Cum programma currit, <code>@traced<\/code> iam ambo nomina habet.<\/span> <span class=\"sg\" data-s=\"16\">Etiam lineam <code>say @traced<\/code> sursum movere potes, supra duas definitiones <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"17\">Adhuc <code>[foo bar]<\/code> imprimit.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Hic parvus trait tantum nomina registrat.<\/span> <span class=\"sg\" data-s=\"1\">Sed eadem idea multo plus facere potest.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, trait routinam involvere potest et logificationem addere.<\/span> <span class=\"sg\" data-s=\"3\">Attributum probare potest.<\/span> <span class=\"sg\" data-s=\"4\">Aut metadata adiungere potest, id est data addita de codice.<\/span> <span class=\"sg\" data-s=\"5\">Hic primum parametrum est <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Id etiam <code>Attribute<\/code> vel <code>Variable<\/code> facere potes.<\/span> <span class=\"sg\" data-s=\"7\">Tum trait cum attributis vel variabilibus operatur.<\/span> <span class=\"sg\" data-s=\"8\">Traits syntaxin declarationum in Raku apertam servant.<\/span> <span class=\"sg\" data-s=\"9\">Semper novos traits addere potes.<\/span> <span class=\"sg\" data-s=\"10\">Trait incorporatus <code>is rw<\/code> et tuus <code>is traced<\/code> eodem modo facti sunt.<\/span><\/p>"]]}}}</script>
