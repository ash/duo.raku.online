<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/built-in-traits/quiz","n":568,"k":"quiz","pv":"advanced/traits-pragmas/built-in-traits","nx":"advanced/traits-pragmas/writing-a-trait","tr":["advanced","advanced/traits-pragmas","advanced/traits-pragmas/built-in-traits"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz — Traits","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A subroutine wants to <strong>change the caller’s variable<\/strong> through a parameter.<\/span> <span class=\"sg\" data-s=\"1\">Which trait makes this possible?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none — parameters are writable by default<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normally, a parameter is read-only.<\/span> <span class=\"sg\" data-s=\"1\">So you cannot assign a new value to a plain parameter.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> connects the parameter to the caller’s own variable.<\/span> <span class=\"sg\" data-s=\"3\">So a change inside the routine is visible outside.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> works in another way.<\/span> <span class=\"sg\" data-s=\"5\">It gives you a <em>copy<\/em> that you can change.<\/span> <span class=\"sg\" data-s=\"6\">The caller’s variable stays the same.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Traits","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine will über einen Parameter <strong>die Variable des Aufrufers ändern<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Welches Trait macht das möglich?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">keines — Parameter sind standardmäßig beschreibbar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normalerweise ist ein Parameter schreibgeschützt.<\/span> <span class=\"sg\" data-s=\"1\">Also können Sie einem einfachen Parameter keinen neuen Wert zuweisen.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> verbindet den Parameter mit der eigenen Variablen des Aufrufers.<\/span> <span class=\"sg\" data-s=\"3\">Also sieht man eine Änderung in der Routine auch außerhalb.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> arbeitet anders.<\/span> <span class=\"sg\" data-s=\"5\">Es gibt Ihnen eine <em>Kopie<\/em>, die Sie ändern können.<\/span> <span class=\"sg\" data-s=\"6\">Die Variable des Aufrufers bleibt gleich.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Traits","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een subroutine wil via een parameter <strong>de variabele van de aanroeper wijzigen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Welke trait maakt dit mogelijk?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">geen — parameters zijn standaard schrijfbaar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normaal is een parameter alleen-lezen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een gewone parameter dus geen nieuwe waarde geven.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> verbindt de parameter met de eigen variabele van de aanroeper.<\/span> <span class=\"sg\" data-s=\"3\">Een verandering binnen de routine is dus ook buiten te zien.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> werkt anders.<\/span> <span class=\"sg\" data-s=\"5\">Het geeft je een <em>kopie<\/em> die je kunt veranderen.<\/span> <span class=\"sg\" data-s=\"6\">De variabele van de aanroeper blijft hetzelfde.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Traits","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina quiere <strong>cambiar la variable del llamador<\/strong> a través de un parámetro.<\/span> <span class=\"sg\" data-s=\"1\">¿Qué trait lo hace posible?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ninguno — los parámetros son modificables por defecto<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normalmente, un parámetro es de solo lectura.<\/span> <span class=\"sg\" data-s=\"1\">Así, no puedes asignar un valor nuevo a un parámetro simple.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> conecta el parámetro con la propia variable del llamador.<\/span> <span class=\"sg\" data-s=\"3\">Así, un cambio dentro de la rutina se ve fuera.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> funciona de otra forma.<\/span> <span class=\"sg\" data-s=\"5\">Te da una <em>copia<\/em> que puedes cambiar.<\/span> <span class=\"sg\" data-s=\"6\">La variable del llamador no cambia.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Trait","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine vuole <strong>cambiare la variabile del chiamante<\/strong> attraverso un parametro.<\/span> <span class=\"sg\" data-s=\"1\">Quale trait lo rende possibile?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nessuno — i parametri sono scrivibili per impostazione predefinita<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normalmente un parametro è in sola lettura.<\/span> <span class=\"sg\" data-s=\"1\">Così non puoi assegnare un nuovo valore a un parametro semplice.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> collega il parametro alla variabile del chiamante.<\/span> <span class=\"sg\" data-s=\"3\">Così un cambiamento dentro la routine si vede fuori.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> funziona in un altro modo.<\/span> <span class=\"sg\" data-s=\"5\">Ti dà una <em>copia<\/em> che puoi cambiare.<\/span> <span class=\"sg\" data-s=\"6\">La variabile del chiamante resta uguale.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Īpašības","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma grib <strong>mainīt izsaucēja mainīgo<\/strong> caur parametru.<\/span> <span class=\"sg\" data-s=\"1\">Kura īpašība to ļauj?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none — parameters are writable by default<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Parasti parametrs ir tikai lasāms.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc parastam parametram jūs nevarat piešķirt jaunu vērtību.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> savieno parametru ar paša izsaucēja mainīgo.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc izmaiņa apakšprogrammas iekšienē ir redzama ārpusē.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> strādā citādi.<\/span> <span class=\"sg\" data-s=\"5\">Tā dod jums <em>kopiju<\/em>, ko jūs varat mainīt.<\/span> <span class=\"sg\" data-s=\"6\">Izsaucēja mainīgais paliek tāds pats.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Трейты","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма хочет <strong>изменить переменную вызывающей стороны<\/strong> через параметр.<\/span> <span class=\"sg\" data-s=\"1\">Какой типаж позволяет это сделать?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ни один — параметры по умолчанию доступны для записи<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обычно параметр доступен только для чтения.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому обычному параметру нельзя присвоить новое значение.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> связывает параметр с самой переменной вызывающей стороны.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому изменение внутри подпрограммы видно снаружи.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> работает по-другому.<\/span> <span class=\"sg\" data-s=\"5\">Он даёт вам <em>копию<\/em>, которую можно менять.<\/span> <span class=\"sg\" data-s=\"6\">Переменная вызывающей стороны остаётся прежней.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Трейти","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма хоче <strong>змінити змінну викликача<\/strong> через параметр.<\/span> <span class=\"sg\" data-s=\"1\">Який трейт це дозволяє?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">жоден — параметри доступні для запису за замовчуванням<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Зазвичай параметр доступний лише для читання.<\/span> <span class=\"sg\" data-s=\"1\">Тож звичайному параметру не можна присвоїти нове значення.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> зв'язує параметр із власною змінною викликача.<\/span> <span class=\"sg\" data-s=\"3\">Тож зміну всередині підпрограми видно ззовні.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> працює інакше.<\/span> <span class=\"sg\" data-s=\"5\">Він дає вам <em>копію<\/em>, яку можна змінювати.<\/span> <span class=\"sg\" data-s=\"6\">Змінна викликача не змінюється.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Трейтове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Една подпрограма иска да <strong>промени променливата на извикващия<\/strong> чрез параметър.<\/span> <span class=\"sg\" data-s=\"1\">Кой трейт прави това възможно?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">нито един — параметрите са записваеми по подразбиране<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обикновено параметърът е само за четене.<\/span> <span class=\"sg\" data-s=\"1\">Затова не можете да присвоите нова стойност на обикновен параметър.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> свързва параметъра със собствената променлива на извикващия.<\/span> <span class=\"sg\" data-s=\"3\">Така промяната вътре в подпрограмата се вижда навън.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> работи по друг начин.<\/span> <span class=\"sg\" data-s=\"5\">Той ви дава <em>копие<\/em>, което можете да променяте.<\/span> <span class=\"sg\" data-s=\"6\">Променливата на извикващия остава същата.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Trajtoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Subrutino volas <strong>ŝanĝi la variablon de la vokanto<\/strong> per parametro.<\/span> <span class=\"sg\" data-s=\"1\">Kiu trajto ebligas tion?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">neniu — parametroj estas skribeblaj defaŭlte<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normale, parametro estas nur-legebla.<\/span> <span class=\"sg\" data-s=\"1\">Do vi ne povas atribui novan valoron al simpla parametro.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> ligas la parametron al la propra variablo de la vokanto.<\/span> <span class=\"sg\" data-s=\"3\">Do ŝanĝo ene de la rutino videblas ekstere.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> funkcias alimaniere.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi donas al vi <em>kopion<\/em>, kiun vi povas ŝanĝi.<\/span> <span class=\"sg\" data-s=\"6\">La variablo de la vokanto restas la sama.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Proprietates","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Subroutina per parametrum <strong>variabilem vocantis mutare<\/strong> vult.<\/span> <span class=\"sg\" data-s=\"1\">Quis trait hoc possibile facit?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nullus — parametra ex defectu scribilia sunt<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normaliter parametrum tantum-lectu est.<\/span> <span class=\"sg\" data-s=\"1\">Ergo parametro simplici novum valorem assignare non potes.<\/span> <span class=\"sg\" data-s=\"2\"><code>is rw<\/code> parametrum cum variabili propria vocantis coniungit.<\/span> <span class=\"sg\" data-s=\"3\">Ergo mutatio intra routinam foris visibilis est.<\/span> <span class=\"sg\" data-s=\"4\"><code>is copy<\/code> alio modo operatur.<\/span> <span class=\"sg\" data-s=\"5\">Tibi <em>copiam<\/em> dat quam mutare potes.<\/span> <span class=\"sg\" data-s=\"6\">Variabilis vocantis eadem manet.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
