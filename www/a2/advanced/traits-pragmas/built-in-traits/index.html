<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/built-in-traits","n":567,"k":"topic","pv":"advanced/traits-pragmas","nx":"advanced/traits-pragmas/built-in-traits/quiz","tr":["advanced","advanced/traits-pragmas"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Built-in traits","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">You add a <em>trait<\/em> with the keyword <code>is<\/code>, right after a declaration.<\/span> <span class=\"sg\" data-s=\"1\">A trait runs at compile time.<\/span> <span class=\"sg\" data-s=\"2\">It changes a fixed property of the thing that has the trait.<\/span> <span class=\"sg\" data-s=\"3\">Raku has many traits.<\/span> <span class=\"sg\" data-s=\"4\">You already used a few of them.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normally, the parameters of a subroutine are <strong>read-only<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">You cannot assign new values to them inside the routine.<\/span> <span class=\"sg\" data-s=\"2\">The trait <code>is copy<\/code> gives you your own copy of the argument.<\/span> <span class=\"sg\" data-s=\"3\">You can change this copy.<\/span> <span class=\"sg\" data-s=\"4\">The change stays inside the routine.<\/span> <span class=\"sg\" data-s=\"5\">The caller’s variable stays the same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The trait <code>is rw<\/code> goes further.<\/span> <span class=\"sg\" data-s=\"1\">It connects the parameter to the caller’s variable.<\/span> <span class=\"sg\" data-s=\"2\">You change the parameter inside the routine.<\/span> <span class=\"sg\" data-s=\"3\">Then the change is visible outside too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Without one of these traits, <code>$n++<\/code> gives an error.<\/span> <span class=\"sg\" data-s=\"1\">This is because the parameter is read-only.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Another common trait sets a default value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Here, <code>is default<\/code> gives the variable a default value.<\/span> <span class=\"sg\" data-s=\"1\">The variable has this value when nothing else is in it.<\/span> <span class=\"sg\" data-s=\"2\">There are many built-in traits: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code>, and more.<\/span> <span class=\"sg\" data-s=\"3\">Each of them adds one special behaviour to a declaration.<\/span> <span class=\"sg\" data-s=\"4\">This happens at compile time.<\/span> <span class=\"sg\" data-s=\"5\">The next topic shows that the list of traits is not closed.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"/advanced/traits-pragmas/writing-a-trait/\">You can make your own traits<\/a>.<\/span><\/p>"]]},"de":{"t":"Eingebaute Traits","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Trait<\/em> fügen Sie mit dem Schlüsselwort <code>is<\/code> hinzu, direkt nach einer Deklaration.<\/span> <span class=\"sg\" data-s=\"1\">Ein Trait läuft zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"2\">Es ändert eine feste Eigenschaft des Elements, das das Trait hat.<\/span> <span class=\"sg\" data-s=\"3\">Raku hat viele Traits.<\/span> <span class=\"sg\" data-s=\"4\">Sie haben schon ein paar davon benutzt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normalerweise sind die Parameter einer Subroutine <strong>schreibgeschützt<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sie können ihnen in der Routine keine neuen Werte zuweisen.<\/span> <span class=\"sg\" data-s=\"2\">Das Trait <code>is copy<\/code> gibt Ihnen eine eigene Kopie des Arguments.<\/span> <span class=\"sg\" data-s=\"3\">Diese Kopie können Sie ändern.<\/span> <span class=\"sg\" data-s=\"4\">Die Änderung bleibt in der Routine.<\/span> <span class=\"sg\" data-s=\"5\">Die Variable des Aufrufers bleibt gleich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Trait <code>is rw<\/code> geht weiter.<\/span> <span class=\"sg\" data-s=\"1\">Es verbindet den Parameter mit der Variablen des Aufrufers.<\/span> <span class=\"sg\" data-s=\"2\">Sie ändern den Parameter in der Routine.<\/span> <span class=\"sg\" data-s=\"3\">Dann sieht man die Änderung auch außerhalb:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne eines dieser Traits gibt <code>$n++<\/code> einen Fehler.<\/span> <span class=\"sg\" data-s=\"1\">Denn der Parameter ist schreibgeschützt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein weiteres häufiges Trait setzt einen Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier gibt <code>is default<\/code> der Variablen einen Standardwert.<\/span> <span class=\"sg\" data-s=\"1\">Die Variable hat diesen Wert, wenn nichts anderes in ihr steht.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt viele eingebaute Traits: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> und mehr.<\/span> <span class=\"sg\" data-s=\"3\">Jedes davon gibt einer Deklaration ein besonderes Verhalten.<\/span> <span class=\"sg\" data-s=\"4\">Das passiert zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"5\">Das nächste Thema zeigt, dass die Liste der Traits nicht geschlossen ist.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/de/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Sie können eigene Traits machen<\/a>.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde traits","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je voegt een <em>trait<\/em> toe met het sleutelwoord <code>is<\/code>, direct na een declaratie.<\/span> <span class=\"sg\" data-s=\"1\">Een trait draait tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"2\">Hij verandert een vaste eigenschap van het ding met de trait.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft veel traits.<\/span> <span class=\"sg\" data-s=\"4\">Je hebt er al een paar gebruikt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normaal zijn de parameters van een subroutine <strong>alleen-lezen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ze binnen de routine geen nieuwe waarden geven.<\/span> <span class=\"sg\" data-s=\"2\">De trait <code>is copy<\/code> geeft je een eigen kopie van het argument.<\/span> <span class=\"sg\" data-s=\"3\">Die kopie kun je veranderen.<\/span> <span class=\"sg\" data-s=\"4\">De verandering blijft binnen de routine.<\/span> <span class=\"sg\" data-s=\"5\">De variabele van de aanroeper blijft hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — de variabele van de aanroeper blijft ongemoeid<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De trait <code>is rw<\/code> gaat verder.<\/span> <span class=\"sg\" data-s=\"1\">Hij verbindt de parameter met de variabele van de aanroeper.<\/span> <span class=\"sg\" data-s=\"2\">Je verandert de parameter binnen de routine.<\/span> <span class=\"sg\" data-s=\"3\">Dan zie je de verandering ook buiten de routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder een van deze traits geeft <code>$n++<\/code> een fout.<\/span> <span class=\"sg\" data-s=\"1\">Dat komt doordat de parameter alleen-lezen is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een andere veelgebruikte trait stelt een standaardwaarde in:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier geeft <code>is default<\/code> de variabele een standaardwaarde.<\/span> <span class=\"sg\" data-s=\"1\">De variabele heeft deze waarde als er niets anders in zit.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn veel ingebouwde traits: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> en meer.<\/span> <span class=\"sg\" data-s=\"3\">Elke trait geeft een declaratie één speciaal gedrag.<\/span> <span class=\"sg\" data-s=\"4\">Dat gebeurt tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"5\">Het volgende onderwerp laat zien dat de lijst met traits niet vastligt.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/nl/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Je kunt je eigen traits maken<\/a>.<\/span><\/p>"]]},"es":{"t":"Traits integrados","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Añades un <em>trait<\/em> con la palabra clave <code>is<\/code>, justo después de una declaración.<\/span> <span class=\"sg\" data-s=\"1\">Un trait se ejecuta en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"2\">Cambia una propiedad fija de la cosa que tiene el trait.<\/span> <span class=\"sg\" data-s=\"3\">Raku tiene muchos traits.<\/span> <span class=\"sg\" data-s=\"4\">Ya has usado algunos de ellos.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normalmente, los parámetros de una subrutina son de <strong>solo lectura<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">No puedes asignarles valores nuevos dentro de la rutina.<\/span> <span class=\"sg\" data-s=\"2\">El trait <code>is copy<\/code> te da tu propia copia del argumento.<\/span> <span class=\"sg\" data-s=\"3\">Puedes cambiar esta copia.<\/span> <span class=\"sg\" data-s=\"4\">El cambio se queda dentro de la rutina.<\/span> <span class=\"sg\" data-s=\"5\">La variable del llamador no cambia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El trait <code>is rw<\/code> va más allá.<\/span> <span class=\"sg\" data-s=\"1\">Conecta el parámetro con la variable del llamador.<\/span> <span class=\"sg\" data-s=\"2\">Cambias el parámetro dentro de la rutina.<\/span> <span class=\"sg\" data-s=\"3\">Entonces el cambio también se ve fuera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin uno de estos traits, <code>$n++<\/code> da un error.<\/span> <span class=\"sg\" data-s=\"1\">Esto es porque el parámetro es de solo lectura.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otro trait común establece un valor por defecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>is default<\/code> da a la variable un valor por defecto.<\/span> <span class=\"sg\" data-s=\"1\">La variable tiene este valor cuando no hay nada más en ella.<\/span> <span class=\"sg\" data-s=\"2\">Hay muchos traits incorporados: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> y más.<\/span> <span class=\"sg\" data-s=\"3\">Cada uno añade un comportamiento especial a una declaración.<\/span> <span class=\"sg\" data-s=\"4\">Esto pasa en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"5\">El siguiente tema muestra que la lista de traits no está cerrada.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/es/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Puedes crear tus propios traits<\/a>.<\/span><\/p>"]]},"it":{"t":"Trait integrati","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Aggiungi un <em>trait<\/em> con la parola chiave <code>is<\/code>, subito dopo una dichiarazione.<\/span> <span class=\"sg\" data-s=\"1\">Un trait lavora durante la compilazione.<\/span> <span class=\"sg\" data-s=\"2\">Cambia una proprietà fissa della cosa che ha il trait.<\/span> <span class=\"sg\" data-s=\"3\">Raku ha molti trait.<\/span> <span class=\"sg\" data-s=\"4\">Ne hai già usati alcuni.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normalmente i parametri di una subroutine sono <strong>in sola lettura<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Dentro la routine non puoi assegnare nuovi valori ai parametri.<\/span> <span class=\"sg\" data-s=\"2\">Il trait <code>is copy<\/code> ti dà una tua copia dell'argomento.<\/span> <span class=\"sg\" data-s=\"3\">Puoi cambiare questa copia.<\/span> <span class=\"sg\" data-s=\"4\">Il cambiamento resta dentro la routine.<\/span> <span class=\"sg\" data-s=\"5\">La variabile del chiamante resta uguale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il trait <code>is rw<\/code> va oltre.<\/span> <span class=\"sg\" data-s=\"1\">Collega il parametro alla variabile del chiamante.<\/span> <span class=\"sg\" data-s=\"2\">Cambi il parametro dentro la routine.<\/span> <span class=\"sg\" data-s=\"3\">Allora il cambiamento si vede anche fuori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza uno di questi trait, <code>$n++<\/code> dà un errore.<\/span> <span class=\"sg\" data-s=\"1\">Questo perché il parametro è in sola lettura.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un altro trait comune imposta un valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Qui <code>is default<\/code> dà alla variabile un valore predefinito.<\/span> <span class=\"sg\" data-s=\"1\">La variabile ha questo valore quando non contiene nient'altro.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono molti trait integrati: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> e altri.<\/span> <span class=\"sg\" data-s=\"3\">Ognuno aggiunge un comportamento speciale a una dichiarazione.<\/span> <span class=\"sg\" data-s=\"4\">Questo succede durante la compilazione.<\/span> <span class=\"sg\" data-s=\"5\">Il prossimo argomento mostra che la lista dei trait non è chiusa.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/it/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Puoi creare i tuoi trait<\/a>.<\/span><\/p>"]]},"lv":{"t":"Iebūvētās īpašības","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs pievienojat <em>īpašību<\/em> ar atslēgvārdu <code>is<\/code> uzreiz pēc deklarācijas.<\/span> <span class=\"sg\" data-s=\"1\">Īpašība izpildās kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"2\">Tā maina kādu nemainīgu iezīmi lietai, kurai ir šī īpašība.<\/span> <span class=\"sg\" data-s=\"3\">Raku ir daudz īpašību.<\/span> <span class=\"sg\" data-s=\"4\">Dažas no tām jūs jau lietojāt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Parasti apakšprogrammas parametri ir <strong>tikai lasāmi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogrammas iekšienē jūs nevarat tiem piešķirt jaunas vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Īpašība <code>is copy<\/code> dod jums savu argumenta kopiju.<\/span> <span class=\"sg\" data-s=\"3\">Šo kopiju jūs varat mainīt.<\/span> <span class=\"sg\" data-s=\"4\">Izmaiņa paliek apakšprogrammas iekšienē.<\/span> <span class=\"sg\" data-s=\"5\">Izsaucēja mainīgais paliek tāds pats:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Īpašība <code>is rw<\/code> iet vēl tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Tā savieno parametru ar izsaucēja mainīgo.<\/span> <span class=\"sg\" data-s=\"2\">Jūs maināt parametru apakšprogrammas iekšienē.<\/span> <span class=\"sg\" data-s=\"3\">Tad izmaiņa ir redzama arī ārpusē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez kādas no šīm īpašībām <code>$n++<\/code> dod kļūdu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka parametrs ir tikai lasāms.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl viena izplatīta īpašība nosaka noklusējuma vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>is default<\/code> dod mainīgajam noklusējuma vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgajam ir šī vērtība, kad tajā nav nekā cita.<\/span> <span class=\"sg\" data-s=\"2\">Ir daudz iebūvētu īpašību: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> un citas.<\/span> <span class=\"sg\" data-s=\"3\">Katra no tām pievieno deklarācijai vienu īpašu uzvedību.<\/span> <span class=\"sg\" data-s=\"4\">Tas notiek kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"5\">Nākamā tēma parāda, ka īpašību saraksts nav slēgts.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/lv/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Jūs varat izveidot savas īpašības<\/a>.<\/span><\/p>"]]},"ru":{"t":"Встроенные трейты","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вы добавляете <em>типаж<\/em> с помощью ключевого слова <code>is<\/code>, сразу после объявления.<\/span> <span class=\"sg\" data-s=\"1\">Типаж выполняется во время компиляции.<\/span> <span class=\"sg\" data-s=\"2\">Он меняет постоянное свойство той вещи, у которой есть этот типаж.<\/span> <span class=\"sg\" data-s=\"3\">В Raku много типажей.<\/span> <span class=\"sg\" data-s=\"4\">Некоторые из них вы уже использовали.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Обычно параметры подпрограммы доступны <strong>только для чтения<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Внутри подпрограммы им нельзя присвоить новые значения.<\/span> <span class=\"sg\" data-s=\"2\">Типаж <code>is copy<\/code> даёт вам личную копию аргумента.<\/span> <span class=\"sg\" data-s=\"3\">Эту копию можно менять.<\/span> <span class=\"sg\" data-s=\"4\">Изменение остаётся внутри подпрограммы.<\/span> <span class=\"sg\" data-s=\"5\">Переменная вызывающей стороны остаётся прежней:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Типаж <code>is rw<\/code> идёт дальше.<\/span> <span class=\"sg\" data-s=\"1\">Он связывает параметр с переменной вызывающей стороны.<\/span> <span class=\"sg\" data-s=\"2\">Вы меняете параметр внутри подпрограммы.<\/span> <span class=\"sg\" data-s=\"3\">Тогда изменение видно и снаружи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без одного из этих типажей <code>$n++<\/code> даёт ошибку.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что параметр доступен только для чтения.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другой распространённый типаж задаёт значение по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>is default<\/code> даёт переменной значение по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">У переменной это значение, когда в ней нет ничего другого.<\/span> <span class=\"sg\" data-s=\"2\">Есть много встроенных типажей: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> и другие.<\/span> <span class=\"sg\" data-s=\"3\">Каждый из них добавляет объявлению одно особое поведение.<\/span> <span class=\"sg\" data-s=\"4\">Это происходит во время компиляции.<\/span> <span class=\"sg\" data-s=\"5\">Следующая тема показывает, что список типажей не закрыт.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/ru/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Вы можете делать свои типажи<\/a>.<\/span><\/p>"]]},"uk":{"t":"Вбудовані трейти","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви додаєте <em>трейт<\/em> ключовим словом <code>is<\/code>, одразу після оголошення.<\/span> <span class=\"sg\" data-s=\"1\">Трейт виконується під час компіляції.<\/span> <span class=\"sg\" data-s=\"2\">Він змінює сталу властивість того, що має цей трейт.<\/span> <span class=\"sg\" data-s=\"3\">У Raku багато трейтів.<\/span> <span class=\"sg\" data-s=\"4\">Кількома з них ви вже користувалися.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Зазвичай параметри підпрограми доступні <strong>лише для читання<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Усередині підпрограми не можна присвоїти їм нові значення.<\/span> <span class=\"sg\" data-s=\"2\">Трейт <code>is copy<\/code> дає вам власну копію аргументу.<\/span> <span class=\"sg\" data-s=\"3\">Цю копію можна змінювати.<\/span> <span class=\"sg\" data-s=\"4\">Зміна лишається всередині підпрограми.<\/span> <span class=\"sg\" data-s=\"5\">Змінна викликача не змінюється:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — власна змінна викликача недоторкана<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Трейт <code>is rw<\/code> іде ще далі.<\/span> <span class=\"sg\" data-s=\"1\">Він зв'язує параметр зі змінною викликача.<\/span> <span class=\"sg\" data-s=\"2\">Ви змінюєте параметр усередині підпрограми.<\/span> <span class=\"sg\" data-s=\"3\">Тоді цю зміну видно й ззовні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без одного з цих трейтів <code>$n++<\/code> дає помилку.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що параметр доступний лише для читання.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще один поширений трейт задає типове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тут <code>is default<\/code> дає змінній значення за замовчуванням.<\/span> <span class=\"sg\" data-s=\"1\">Змінна має це значення, коли в ній немає нічого іншого.<\/span> <span class=\"sg\" data-s=\"2\">Є багато вбудованих трейтів: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> та інші.<\/span> <span class=\"sg\" data-s=\"3\">Кожен із них додає до оголошення одну особливу поведінку.<\/span> <span class=\"sg\" data-s=\"4\">Це відбувається під час компіляції.<\/span> <span class=\"sg\" data-s=\"5\">Наступна тема показує, що список трейтів не закритий.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/uk/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Ви можете створювати власні трейти<\/a>.<\/span><\/p>"]]},"bg":{"t":"Вградени трейтове","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Добавяте <em>трейт<\/em> с ключовата дума <code>is<\/code>, веднага след декларацията.<\/span> <span class=\"sg\" data-s=\"1\">Трейтът се изпълнява по време на компилация.<\/span> <span class=\"sg\" data-s=\"2\">Той променя някое постоянно свойство на нещото, което има трейта.<\/span> <span class=\"sg\" data-s=\"3\">Raku има много трейтове.<\/span> <span class=\"sg\" data-s=\"4\">Вече сте използвали няколко от тях.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Обикновено параметрите на подпрограмата са <strong>само за четене<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Не можете да им присвоявате нови стойности вътре в подпрограмата.<\/span> <span class=\"sg\" data-s=\"2\">Трейтът <code>is copy<\/code> ви дава ваше собствено копие на аргумента.<\/span> <span class=\"sg\" data-s=\"3\">Можете да променяте това копие.<\/span> <span class=\"sg\" data-s=\"4\">Промяната остава вътре в подпрограмата.<\/span> <span class=\"sg\" data-s=\"5\">Променливата на извикващия остава същата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Трейтът <code>is rw<\/code> отива по-далеч.<\/span> <span class=\"sg\" data-s=\"1\">Той свързва параметъра с променливата на извикващия.<\/span> <span class=\"sg\" data-s=\"2\">Променяте параметъра вътре в подпрограмата.<\/span> <span class=\"sg\" data-s=\"3\">Тогава промяната се вижда и навън:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без един от тези трейтове <code>$n++<\/code> дава грешка.<\/span> <span class=\"sg\" data-s=\"1\">Това е така, защото параметърът е само за четене.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друг често срещан трейт задава стойност по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тук <code>is default<\/code> дава на променливата стойност по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\">Променливата има тази стойност, когато в нея няма нищо друго.<\/span> <span class=\"sg\" data-s=\"2\">Има много вградени трейтове: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> и други.<\/span> <span class=\"sg\" data-s=\"3\">Всеки от тях добавя едно специално поведение към декларацията.<\/span> <span class=\"sg\" data-s=\"4\">Това става по време на компилация.<\/span> <span class=\"sg\" data-s=\"5\">Следващата тема показва, че списъкът с трейтове не е затворен.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/bg/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Можете да създавате свои трейтове<\/a>.<\/span><\/p>"]]},"eo":{"t":"Enkonstruitaj trajtoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi aldonas <em>trajton<\/em> per la ŝlosilvorto <code>is<\/code>, tuj post deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Trajto ruliĝas dum kompilado.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ŝanĝas fiksitan econ de la aĵo, kiu havas la trajton.<\/span> <span class=\"sg\" data-s=\"3\">Raku havas multajn trajtojn.<\/span> <span class=\"sg\" data-s=\"4\">Vi jam uzis kelkajn el ili.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normale, la parametroj de subrutino estas <strong>nur-legeblaj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne povas atribui novajn valorojn al ili ene de la rutino.<\/span> <span class=\"sg\" data-s=\"2\">La trajto <code>is copy<\/code> donas al vi vian propran kopion de la argumento.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas ŝanĝi ĉi tiun kopion.<\/span> <span class=\"sg\" data-s=\"4\">La ŝanĝo restas ene de la rutino.<\/span> <span class=\"sg\" data-s=\"5\">La variablo de la vokanto restas la sama:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — la propra variablo de la vokanto restas netuŝita<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La trajto <code>is rw<\/code> iras plu.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ligas la parametron al la variablo de la vokanto.<\/span> <span class=\"sg\" data-s=\"2\">Vi ŝanĝas la parametron ene de la rutino.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la ŝanĝo videblas ankaŭ ekstere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sen unu el ĉi tiuj trajtoj, <code>$n++<\/code> donas eraron.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas, ĉar la parametro estas nur-legebla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alia ofta trajto starigas defaŭltan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>is default<\/code> donas al la variablo defaŭltan valoron.<\/span> <span class=\"sg\" data-s=\"1\">La variablo havas ĉi tiun valoron, kiam nenio alia estas en ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ekzistas multaj enkonstruitaj trajtoj: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code> kaj pliaj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu el ili aldonas unu specialan konduton al deklaro.<\/span> <span class=\"sg\" data-s=\"4\">Tio okazas dum kompilado.<\/span> <span class=\"sg\" data-s=\"5\">La sekva temo montras, ke la listo de trajtoj ne estas fermita.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/eo/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Vi povas fari viajn proprajn trajtojn<\/a>.<\/span><\/p>"]]},"la":{"t":"Proprietates incorporatae","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Trait<\/em> cum verbo clave <code>is<\/code> addis, statim post declarationem.<\/span> <span class=\"sg\" data-s=\"1\">Trait tempore compilationis currit.<\/span> <span class=\"sg\" data-s=\"2\">Proprietatem fixam rei mutat quae trait habet.<\/span> <span class=\"sg\" data-s=\"3\">Raku multos traits habet.<\/span> <span class=\"sg\" data-s=\"4\">Iam paucos ex eis adhibuisti.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normaliter parametra subroutinae sunt <strong>tantum-lectu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Eis intra routinam novos valores assignare non potes.<\/span> <span class=\"sg\" data-s=\"2\">Trait <code>is copy<\/code> tibi copiam tuam argumenti dat.<\/span> <span class=\"sg\" data-s=\"3\">Hanc copiam mutare potes.<\/span> <span class=\"sg\" data-s=\"4\">Mutatio intra routinam manet.<\/span> <span class=\"sg\" data-s=\"5\">Variabilis vocantis eadem manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Trait <code>is rw<\/code> longius procedit.<\/span> <span class=\"sg\" data-s=\"1\">Parametrum cum variabili vocantis coniungit.<\/span> <span class=\"sg\" data-s=\"2\">Parametrum intra routinam mutas.<\/span> <span class=\"sg\" data-s=\"3\">Tum mutationem etiam foris vides:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sine uno ex his traits, <code>$n++<\/code> errorem dat.<\/span> <span class=\"sg\" data-s=\"1\">Nam parametrum tantum-lectu est.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alius trait communis valorem defectivum statuit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hic <code>is default<\/code> variabili valorem solitum dat.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis hunc valorem habet cum nihil aliud in ea est.<\/span> <span class=\"sg\" data-s=\"2\">Multi traits incorporati sunt: <code>is rw<\/code>, <code>is copy<\/code>, <code>is default<\/code>, et alii.<\/span> <span class=\"sg\" data-s=\"3\">Quisque ex eis unum modum agendi specialem declarationi addit.<\/span> <span class=\"sg\" data-s=\"4\">Hoc tempore compilationis fit.<\/span> <span class=\"sg\" data-s=\"5\">Thema proximum ostendit: index traits clausus non est.<\/span> <span class=\"sg\" data-s=\"6\"><a href=\"https://course.raku.org/la/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Traits tuos facere potes<\/a>.<\/span><\/p>"]]}}}</script>
