<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/pragmas","n":570,"k":"topic","pv":"advanced/traits-pragmas/writing-a-trait","nx":"advanced/traits-pragmas/pragmas/quiz","tr":["advanced","advanced/traits-pragmas"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Pragmas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">A <em>pragma<\/em> looks like a module.<\/span> <span class=\"sg\" data-s=\"1\">You load it with <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But it does not bring in new code.<\/span> <span class=\"sg\" data-s=\"3\">Instead, it changes a rule of compilation.<\/span> <span class=\"sg\" data-s=\"4\">The change works until the end of the current scope.<\/span> <span class=\"sg\" data-s=\"5\">You turn a pragma on with <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">If it makes sense, you can turn it off with <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The most important pragma is <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, it is <strong>on by default<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">With it, you must declare every variable before you use it.<\/span> <span class=\"sg\" data-s=\"3\">So Raku finds typing mistakes in variable names.<\/span> <span class=\"sg\" data-s=\"4\">A wrong name does not quietly make a new variable.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> turns <code>strict<\/code> off.<\/span> <span class=\"sg\" data-s=\"1\">Then this rule is gone.<\/span> <span class=\"sg\" data-s=\"2\">Now you can assign a value to a variable without <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">With the normal <code>strict<\/code>, this <code>$x = 42<\/code> without <code>my<\/code> is an error.<\/span> <span class=\"sg\" data-s=\"1\">Raku shows it at compile time: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The line <code>no strict<\/code> turns this rule off.<\/span> <span class=\"sg\" data-s=\"3\">This lasts until the end of the scope.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">There are other pragmas too.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> makes a quiet failure throw an exception.<\/span> <span class=\"sg\" data-s=\"2\">This is useful after you learn how to handle exceptions.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> allows some typical ways of writing code from other languages.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> changes the rules for variables.<\/span> <span class=\"sg\" data-s=\"5\">The effect of a pragma is <em>lexical<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">It works only until the end of its block.<\/span> <span class=\"sg\" data-s=\"7\">So you can make a rule stricter or less strict.<\/span> <span class=\"sg\" data-s=\"8\">You can do this just where you need it in the code.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">One pragma takes an argument.<\/span> <span class=\"sg\" data-s=\"1\">It is <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku looks for modules in a list of directories.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> adds a directory to this list.<\/span> <span class=\"sg\" data-s=\"4\">It works like the command-line option <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">But you write it inside the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You will need it when you write and load your own <a href=\"/advanced/modules-basics/using-modules/\">modules<\/a>.<\/span><\/p>"]]},"de":{"t":"Pragmas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Pragma<\/em> sieht aus wie ein Modul.<\/span> <span class=\"sg\" data-s=\"1\">Sie laden es mit <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber es bringt keinen neuen Code.<\/span> <span class=\"sg\" data-s=\"3\">Stattdessen ändert es eine Regel der Kompilierung.<\/span> <span class=\"sg\" data-s=\"4\">Die Änderung gilt bis zum Ende des aktuellen Gültigkeitsbereichs.<\/span> <span class=\"sg\" data-s=\"5\">Sie schalten ein Pragma mit <code>use<\/code> ein.<\/span> <span class=\"sg\" data-s=\"6\">Wenn es sinnvoll ist, können Sie es mit <code>no<\/code> ausschalten.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das wichtigste Pragma ist <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In Raku ist es <strong>standardmäßig eingeschaltet<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Damit müssen Sie jede Variable deklarieren, bevor Sie sie benutzen.<\/span> <span class=\"sg\" data-s=\"3\">So findet Raku Tippfehler in Variablennamen.<\/span> <span class=\"sg\" data-s=\"4\">Ein falscher Name macht nicht still eine neue Variable.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> schaltet <code>strict<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Dann gilt diese Regel nicht mehr.<\/span> <span class=\"sg\" data-s=\"2\">Jetzt können Sie einer Variablen ohne <code>my<\/code> einen Wert zuweisen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mit dem normalen <code>strict<\/code> ist dieses <code>$x = 42<\/code> ohne <code>my<\/code> ein Fehler.<\/span> <span class=\"sg\" data-s=\"1\">Raku zeigt ihn zur Kompilierzeit: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Die Zeile <code>no strict<\/code> schaltet diese Regel aus.<\/span> <span class=\"sg\" data-s=\"3\">Das gilt bis zum Ende des Gültigkeitsbereichs.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch andere Pragmas.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>fatal<\/code> wirft ein stiller Fehler eine Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Das ist nützlich, wenn Sie gelernt haben, wie man Ausnahmen behandelt.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> erlaubt einige typische Schreibweisen aus anderen Sprachen.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> ändert die Regeln für Variablen.<\/span> <span class=\"sg\" data-s=\"5\">Die Wirkung eines Pragmas ist <em>lexikalisch<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Sie gilt nur bis zum Ende seines Blocks.<\/span> <span class=\"sg\" data-s=\"7\">So können Sie eine Regel strenger oder weniger streng machen.<\/span> <span class=\"sg\" data-s=\"8\">Das können Sie genau dort tun, wo Sie es im Code brauchen.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein Pragma nimmt ein Argument.<\/span> <span class=\"sg\" data-s=\"1\">Das ist <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku sucht Module in einer Liste von Verzeichnissen.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> fügt ein Verzeichnis zu dieser Liste hinzu.<\/span> <span class=\"sg\" data-s=\"4\">Es funktioniert wie die Kommandozeilenoption <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Aber Sie schreiben es in das Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie brauchen es, wenn Sie eigene <a href=\"https://course.raku.org/de/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">Module<\/a> schreiben und laden.<\/span><\/p>"]]},"nl":{"t":"Pragma's","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Een <em>pragma<\/em> lijkt op een module.<\/span> <span class=\"sg\" data-s=\"1\">Je laadt het met <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar het haalt geen nieuwe code binnen.<\/span> <span class=\"sg\" data-s=\"3\">In plaats daarvan verandert het een regel van het compileren.<\/span> <span class=\"sg\" data-s=\"4\">De verandering werkt tot het einde van het huidige bereik.<\/span> <span class=\"sg\" data-s=\"5\">Je zet een pragma aan met <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Als dat zin heeft, kun je het uitzetten met <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Het belangrijkste pragma is <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In Raku staat het <strong>standaard aan<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Daardoor moet je elke variabele declareren voordat je hem gebruikt.<\/span> <span class=\"sg\" data-s=\"3\">Zo vindt Raku typefouten in namen van variabelen.<\/span> <span class=\"sg\" data-s=\"4\">Een verkeerde naam maakt niet stilletjes een nieuwe variabele aan.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> zet <code>strict<\/code> uit.<\/span> <span class=\"sg\" data-s=\"1\">Dan is deze regel weg.<\/span> <span class=\"sg\" data-s=\"2\">Nu kun je een waarde toekennen aan een variabele zonder <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Met het normale <code>strict<\/code> is deze <code>$x = 42<\/code> zonder <code>my<\/code> een fout.<\/span> <span class=\"sg\" data-s=\"1\">Raku toont die tijdens het compileren: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De regel <code>no strict<\/code> zet dit uit.<\/span> <span class=\"sg\" data-s=\"3\">Dat duurt tot het einde van het bereik.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Er zijn ook andere pragma's.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> laat een stille mislukking een exceptie gooien.<\/span> <span class=\"sg\" data-s=\"2\">Dat is handig als je hebt geleerd hoe je excepties afhandelt.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> staat een paar typische schrijfwijzen uit andere talen toe.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> verandert de regels voor variabelen.<\/span> <span class=\"sg\" data-s=\"5\">De werking van een pragma is <em>lexicaal<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Het werkt alleen tot het einde van zijn blok.<\/span> <span class=\"sg\" data-s=\"7\">Zo kun je een regel strenger of minder streng maken.<\/span> <span class=\"sg\" data-s=\"8\">Dat kan precies waar je het nodig hebt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eén pragma neemt een argument.<\/span> <span class=\"sg\" data-s=\"1\">Dat is <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku zoekt modules in een lijst met mappen.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> voegt een map aan deze lijst toe.<\/span> <span class=\"sg\" data-s=\"4\">Het werkt zoals de opdrachtregeloptie <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Maar je schrijft het in het programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je hebt het nodig als je je eigen <a href=\"https://course.raku.org/nl/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modules<\/a> schrijft en laadt.<\/span><\/p>"]]},"es":{"t":"Pragmas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Una <em>pragma<\/em> se parece a un módulo.<\/span> <span class=\"sg\" data-s=\"1\">La cargas con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero no trae código nuevo.<\/span> <span class=\"sg\" data-s=\"3\">En su lugar, cambia una regla de compilación.<\/span> <span class=\"sg\" data-s=\"4\">El cambio funciona hasta el final del ámbito actual.<\/span> <span class=\"sg\" data-s=\"5\">Activas una pragma con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Si tiene sentido, puedes desactivarla con <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La pragma más importante es <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, está <strong>activada por defecto<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Con ella, debes declarar cada variable antes de usarla.<\/span> <span class=\"sg\" data-s=\"3\">Así, Raku encuentra errores de escritura en los nombres de variables.<\/span> <span class=\"sg\" data-s=\"4\">Un nombre mal escrito no crea en silencio una variable nueva.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> desactiva <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces esta regla desaparece.<\/span> <span class=\"sg\" data-s=\"2\">Ahora puedes asignar un valor a una variable sin <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con la pragma <code>strict<\/code> normal, este <code>$x = 42<\/code> sin <code>my<\/code> es un error.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo muestra en tiempo de compilación: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La línea <code>no strict<\/code> desactiva esta regla.<\/span> <span class=\"sg\" data-s=\"3\">Esto dura hasta el final del ámbito.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">También hay otras pragmas.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> hace que un fallo silencioso lance una excepción.<\/span> <span class=\"sg\" data-s=\"2\">Esto es útil después de aprender a manejar excepciones.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> permite algunas formas típicas de escribir código de otros lenguajes.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> cambia las reglas para las variables.<\/span> <span class=\"sg\" data-s=\"5\">El efecto de una pragma es <em>léxico<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Funciona solo hasta el final de su bloque.<\/span> <span class=\"sg\" data-s=\"7\">Así, puedes hacer una regla más estricta o menos estricta.<\/span> <span class=\"sg\" data-s=\"8\">Puedes hacer esto justo donde lo necesitas en el código.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Una pragma recibe un argumento.<\/span> <span class=\"sg\" data-s=\"1\">Es <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku busca módulos en una lista de directorios.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> añade un directorio a esta lista.<\/span> <span class=\"sg\" data-s=\"4\">Funciona como la opción <code>-I<\/code> de la línea de comandos.<\/span> <span class=\"sg\" data-s=\"5\">Pero la escribes dentro del programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La necesitarás cuando escribas y cargues tus propios <a href=\"https://course.raku.org/es/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">módulos<\/a>.<\/span><\/p>"]]},"it":{"t":"Pragma","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Un <em>pragma<\/em> sembra un modulo.<\/span> <span class=\"sg\" data-s=\"1\">Lo carichi con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma non porta nuovo codice.<\/span> <span class=\"sg\" data-s=\"3\">Invece, cambia una regola della compilazione.<\/span> <span class=\"sg\" data-s=\"4\">Il cambiamento vale fino alla fine dello scope attuale.<\/span> <span class=\"sg\" data-s=\"5\">Attivi un pragma con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Se ha senso, puoi disattivarlo con <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il pragma più importante è <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In Raku è <strong>attivo di default<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Con questo pragma, devi dichiarare ogni variabile prima di usarla.<\/span> <span class=\"sg\" data-s=\"3\">Così Raku trova gli errori di battitura nei nomi delle variabili.<\/span> <span class=\"sg\" data-s=\"4\">Un nome sbagliato non crea in silenzio una nuova variabile.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> disattiva <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora questa regola non c'è più.<\/span> <span class=\"sg\" data-s=\"2\">Ora puoi assegnare un valore a una variabile senza <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con il normale <code>strict<\/code>, questo <code>$x = 42<\/code> senza <code>my<\/code> è un errore.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo mostra durante la compilazione: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La riga <code>no strict<\/code> disattiva questa regola.<\/span> <span class=\"sg\" data-s=\"3\">Questo dura fino alla fine dello scope.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ci sono anche altri pragma.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>fatal<\/code>, un fallimento silenzioso lancia un'eccezione.<\/span> <span class=\"sg\" data-s=\"2\">È utile quando sai già gestire le eccezioni.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> permette alcuni modi tipici di scrivere codice presi da altri linguaggi.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> cambia le regole per le variabili.<\/span> <span class=\"sg\" data-s=\"5\">L'effetto di un pragma è <em>lessicale<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Funziona solo fino alla fine del suo blocco.<\/span> <span class=\"sg\" data-s=\"7\">Così puoi rendere una regola più severa o meno severa.<\/span> <span class=\"sg\" data-s=\"8\">Puoi farlo proprio dove ti serve nel codice.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un pragma prende un argomento.<\/span> <span class=\"sg\" data-s=\"1\">È <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku cerca i moduli in una lista di directory.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> aggiunge una directory a questa lista.<\/span> <span class=\"sg\" data-s=\"4\">Funziona come l'opzione <code>-I<\/code> della riga di comando.<\/span> <span class=\"sg\" data-s=\"5\">Ma lo scrivi dentro il programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ti servirà quando scriverai e caricherai i tuoi <a href=\"https://course.raku.org/it/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">moduli<\/a>.<\/span><\/p>"]]},"lv":{"t":"Pragmas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Pragma<\/em> izskatās kā modulis.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to ielādējat ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet tā neienes jaunu kodu.<\/span> <span class=\"sg\" data-s=\"3\">Tā vietā tā maina kādu kompilēšanas noteikumu.<\/span> <span class=\"sg\" data-s=\"4\">Izmaiņa darbojas līdz pašreizējā tvēruma beigām.<\/span> <span class=\"sg\" data-s=\"5\">Jūs ieslēdzat pragmu ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ja tam ir jēga, jūs varat to izslēgt ar <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vissvarīgākā pragma ir <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā tā ir <strong>ieslēgta pēc noklusējuma<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Ar to jums katrs mainīgais jādeklarē pirms lietošanas.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc Raku atrod drukas kļūdas mainīgo nosaukumos.<\/span> <span class=\"sg\" data-s=\"4\">Nepareizs nosaukums klusi neizveido jaunu mainīgo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> izslēdz <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad šī noteikuma vairs nav.<\/span> <span class=\"sg\" data-s=\"2\">Tagad jūs varat piešķirt vērtību mainīgajam bez <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ar parasto <code>strict<\/code> šis <code>$x = 42<\/code> bez <code>my<\/code> ir kļūda.<\/span> <span class=\"sg\" data-s=\"1\">Raku to parāda kompilēšanas laikā: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Rinda <code>no strict<\/code> izslēdz šo noteikumu.<\/span> <span class=\"sg\" data-s=\"3\">Tas ilgst līdz tvēruma beigām.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ir arī citas pragmas.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> liek klusai kļūdai izmest izņēmumu.<\/span> <span class=\"sg\" data-s=\"2\">Tas noder, kad esat iemācījušies apstrādāt izņēmumus.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> atļauj dažus tipiskus koda rakstīšanas veidus no citām valodām.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> maina mainīgo noteikumus.<\/span> <span class=\"sg\" data-s=\"5\">Pragmas iedarbība ir <em>leksiska<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Tā darbojas tikai līdz sava bloka beigām.<\/span> <span class=\"sg\" data-s=\"7\">Tāpēc jūs varat padarīt noteikumu stingrāku vai mazāk stingru.<\/span> <span class=\"sg\" data-s=\"8\">Jūs to varat darīt tieši tur, kur kodā tas jums vajadzīgs.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Viena pragma pieņem argumentu.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku meklē moduļus direktoriju sarakstā.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> pievieno šim sarakstam direktoriju.<\/span> <span class=\"sg\" data-s=\"4\">Tā strādā kā komandrindas opcija <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Bet jūs to rakstāt pašā programmā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jums tā būs vajadzīga, kad rakstīsiet un ielādēsiet savus <a href=\"https://course.raku.org/lv/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">moduļus<\/a>.<\/span><\/p>"]]},"ru":{"t":"Прагмы","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Прагма<\/em> похожа на модуль.<\/span> <span class=\"sg\" data-s=\"1\">Вы загружаете её с помощью <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но она не добавляет новый код.<\/span> <span class=\"sg\" data-s=\"3\">Вместо этого она меняет правило компиляции.<\/span> <span class=\"sg\" data-s=\"4\">Изменение действует до конца текущей области видимости.<\/span> <span class=\"sg\" data-s=\"5\">Вы включаете прагму с помощью <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Если это имеет смысл, её можно выключить с помощью <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Самая важная прагма — <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В Raku она <strong>включена по умолчанию<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">С ней вы должны объявлять каждую переменную до её использования.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому Raku находит опечатки в именах переменных.<\/span> <span class=\"sg\" data-s=\"4\">Неправильное имя не создаёт тихо новую переменную.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> выключает <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда этого правила больше нет.<\/span> <span class=\"sg\" data-s=\"2\">Теперь можно присвоить значение переменной без <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С обычной <code>strict<\/code> такое <code>$x = 42<\/code> без <code>my<\/code> — ошибка.<\/span> <span class=\"sg\" data-s=\"1\">Raku показывает её во время компиляции: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Строка <code>no strict<\/code> выключает это правило.<\/span> <span class=\"sg\" data-s=\"3\">Это действует до конца области видимости.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Есть и другие прагмы.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> заставляет тихую ошибку выбрасывать исключение.<\/span> <span class=\"sg\" data-s=\"2\">Это полезно, когда вы узнаете, как обрабатывать исключения.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> разрешает некоторые привычные способы писать код из других языков.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> меняет правила для переменных.<\/span> <span class=\"sg\" data-s=\"5\">Действие прагмы <em>лексическое<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Оно работает только до конца её блока.<\/span> <span class=\"sg\" data-s=\"7\">Так что вы можете сделать правило строже или мягче.<\/span> <span class=\"sg\" data-s=\"8\">Вы можете сделать это ровно там, где нужно в коде.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Одна прагма принимает аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Это <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku ищет модули в списке каталогов.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> добавляет каталог в этот список.<\/span> <span class=\"sg\" data-s=\"4\">Она работает как параметр командной строки <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Но вы пишете её внутри программы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Она понадобится вам, когда вы будете писать и загружать свои <a href=\"https://course.raku.org/ru/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модули<\/a>.<\/span><\/p>"]]},"uk":{"t":"Прагми","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Прагма<\/em> схожа на модуль.<\/span> <span class=\"sg\" data-s=\"1\">Ви завантажуєте її через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але вона не приносить нового коду.<\/span> <span class=\"sg\" data-s=\"3\">Натомість вона змінює правило компіляції.<\/span> <span class=\"sg\" data-s=\"4\">Ця зміна діє до кінця поточної області видимості.<\/span> <span class=\"sg\" data-s=\"5\">Ви вмикаєте прагму через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Якщо це має сенс, її можна вимкнути через <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Найважливіша прагма — це <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У Raku вона <strong>увімкнена за замовчуванням<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">З нею кожну змінну треба оголосити перед використанням.<\/span> <span class=\"sg\" data-s=\"3\">Тож Raku знаходить одруки в іменах змінних.<\/span> <span class=\"sg\" data-s=\"4\">Неправильне ім'я не створює тихо нову змінну.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> вимикає <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді цього правила вже немає.<\/span> <span class=\"sg\" data-s=\"2\">Тепер можна присвоїти значення змінній без <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зі звичайною <code>strict<\/code> цей <code>$x = 42<\/code> без <code>my<\/code> — помилка.<\/span> <span class=\"sg\" data-s=\"1\">Raku показує її під час компіляції: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Рядок <code>no strict<\/code> вимикає це правило.<\/span> <span class=\"sg\" data-s=\"3\">Це діє до кінця області видимості.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Є й інші прагми.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> змушує тихий збій кидати виняток.<\/span> <span class=\"sg\" data-s=\"2\">Це корисно, коли ви навчитеся обробляти винятки.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> дозволяє деякі типові способи писати код з інших мов.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> змінює правила для змінних.<\/span> <span class=\"sg\" data-s=\"5\">Дія прагми <em>лексична<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Вона діє лише до кінця свого блоку.<\/span> <span class=\"sg\" data-s=\"7\">Тож ви можете зробити правило суворішим або м'якшим.<\/span> <span class=\"sg\" data-s=\"8\">Ви можете зробити це саме там, де це потрібно в коді.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Одна прагма приймає аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Це <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku шукає модулі в списку каталогів.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> додає каталог до цього списку.<\/span> <span class=\"sg\" data-s=\"4\">Вона працює як опція командного рядка <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Але ви пишете її всередині програми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вона знадобиться вам, коли ви писатимете й завантажуватимете власні <a href=\"https://course.raku.org/uk/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модулі<\/a>.<\/span><\/p>"]]},"bg":{"t":"Прагми","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Прагмата<\/em> прилича на модул.<\/span> <span class=\"sg\" data-s=\"1\">Зареждате я с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но тя не внася нов код.<\/span> <span class=\"sg\" data-s=\"3\">Вместо това тя променя правило на компилацията.<\/span> <span class=\"sg\" data-s=\"4\">Промяната важи до края на текущия обхват.<\/span> <span class=\"sg\" data-s=\"5\">Включвате прагмата с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ако има смисъл, можете да я изключите с <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Най-важната прагма е <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В Raku тя е <strong>включена по подразбиране<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">С нея трябва да декларирате всяка променлива, преди да я използвате.<\/span> <span class=\"sg\" data-s=\"3\">Така Raku намира грешки при писане в имената на променливите.<\/span> <span class=\"sg\" data-s=\"4\">Грешното име не създава тихо нова променлива.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> изключва <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава това правило изчезва.<\/span> <span class=\"sg\" data-s=\"2\">Сега можете да присвоите стойност на променлива без <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С обичайния <code>strict<\/code> това <code>$x = 42<\/code> без <code>my<\/code> е грешка.<\/span> <span class=\"sg\" data-s=\"1\">Raku я показва по време на компилация: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Редът <code>no strict<\/code> изключва това правило.<\/span> <span class=\"sg\" data-s=\"3\">Това важи до края на обхвата.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Има и други прагми.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> кара тихия неуспех да хвърли изключение.<\/span> <span class=\"sg\" data-s=\"2\">Това е полезно, след като научите как да обработвате изключения.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> позволява някои типични начини на писане на код от други езици.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> променя правилата за променливите.<\/span> <span class=\"sg\" data-s=\"5\">Ефектът на прагмата е <em>лексикален<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Той важи само до края на нейния блок.<\/span> <span class=\"sg\" data-s=\"7\">Така можете да направите правило по-строго или по-малко строго.<\/span> <span class=\"sg\" data-s=\"8\">Можете да направите това точно там, където ви трябва в кода.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Една прагма приема аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Това е <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku търси модули в списък от директории.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> добавя директория към този списък.<\/span> <span class=\"sg\" data-s=\"4\">Тя работи като опцията <code>-I<\/code> от командния ред.<\/span> <span class=\"sg\" data-s=\"5\">Но я пишете вътре в програмата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще имате нужда от нея, когато пишете и зареждате свои <a href=\"https://course.raku.org/bg/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модули<\/a>.<\/span><\/p>"]]},"eo":{"t":"Pragmoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Pragmo<\/em> aspektas kiel modulo.<\/span> <span class=\"sg\" data-s=\"1\">Vi ŝargas ĝin per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi ne enportas novan kodon.<\/span> <span class=\"sg\" data-s=\"3\">Anstataŭe, ĝi ŝanĝas regulon de kompilado.<\/span> <span class=\"sg\" data-s=\"4\">La ŝanĝo funkcias ĝis la fino de la nuna amplekso.<\/span> <span class=\"sg\" data-s=\"5\">Vi ŝaltas pragmon per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Se tio havas sencon, vi povas malŝalti ĝin per <code>no<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La plej grava pragmo estas <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, ĝi estas <strong>ŝaltita defaŭlte<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Kun ĝi, vi devas deklari ĉiun variablon, antaŭ ol vi uzas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Do Raku trovas tajperarojn en nomoj de variabloj.<\/span> <span class=\"sg\" data-s=\"4\">Malĝusta nomo ne kreas silente novan variablon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> malŝaltas <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĉi tiu regulo malaperas.<\/span> <span class=\"sg\" data-s=\"2\">Nun vi povas atribui valoron al variablo sen <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kun la normala <code>strict<\/code>, ĉi tiu <code>$x = 42<\/code> sen <code>my<\/code> estas eraro.<\/span> <span class=\"sg\" data-s=\"1\">Raku montras ĝin dum kompilado: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La linio <code>no strict<\/code> malŝaltas ĉi tiun regulon.<\/span> <span class=\"sg\" data-s=\"3\">Tio daŭras ĝis la fino de la amplekso.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ aliaj pragmoj.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> igas kvietan malsukceson ĵeti escepton.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas utila, post kiam vi lernos trakti esceptojn.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> permesas kelkajn tipajn manierojn skribi kodon el aliaj lingvoj.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> ŝanĝas la regulojn por variabloj.<\/span> <span class=\"sg\" data-s=\"5\">La efiko de pragmo estas <em>leksika<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi funkcias nur ĝis la fino de sia bloko.<\/span> <span class=\"sg\" data-s=\"7\">Do vi povas fari regulon pli strikta aŭ malpli strikta.<\/span> <span class=\"sg\" data-s=\"8\">Vi povas fari tion ĝuste tie, kie vi bezonas ĝin en la kodo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Unu pragmo prenas argumenton.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku serĉas modulojn en listo de dosierujoj.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> aldonas dosierujon al ĉi tiu listo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi funkcias kiel la komandlinia opcio <code>-I<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Sed vi skribas ĝin ene de la programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi bezonos ĝin, kiam vi skribos kaj ŝargos viajn proprajn <a href=\"https://course.raku.org/eo/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modulojn<\/a>.<\/span><\/p>"]]},"la":{"t":"Pragmata","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Pragma<\/em> simile modulo videtur.<\/span> <span class=\"sg\" data-s=\"1\">Id cum <code>use<\/code> oneras.<\/span> <span class=\"sg\" data-s=\"2\">Sed novum codicem non importat.<\/span> <span class=\"sg\" data-s=\"3\">Potius regulam compilationis mutat.<\/span> <span class=\"sg\" data-s=\"4\">Mutatio usque ad finem ambitus currentis operatur.<\/span> <span class=\"sg\" data-s=\"5\">Pragma cum <code>use<\/code> activas.<\/span> <span class=\"sg\" data-s=\"6\">Si sensum habet, id cum <code>no<\/code> deactivare potes.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pragma gravissimum est <code>strict<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In Raku id <strong>ex defectu activum<\/strong> est.<\/span> <span class=\"sg\" data-s=\"2\">Cum eo omnem variabilem declarare debes antequam eam adhibes.<\/span> <span class=\"sg\" data-s=\"3\">Ergo Raku errores scribendi in nominibus variabilium invenit.<\/span> <span class=\"sg\" data-s=\"4\">Nomen falsum non tacite novam variabilem facit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> pragma <code>strict<\/code> deactivat.<\/span> <span class=\"sg\" data-s=\"1\">Tum haec regula abest.<\/span> <span class=\"sg\" data-s=\"2\">Nunc variabili sine <code>my<\/code> valorem assignare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum <code>strict<\/code> solito, hoc <code>$x = 42<\/code> sine <code>my<\/code> error est.<\/span> <span class=\"sg\" data-s=\"1\">Raku eum tempore compilationis ostendit: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Linea <code>no strict<\/code> hanc regulam deactivat.<\/span> <span class=\"sg\" data-s=\"3\">Hoc usque ad finem ambitus durat.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Sunt etiam alia pragmata.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> defectum quietum in exceptionem iactam convertit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc utile est cum exceptiones tractare scis.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> quosdam modos scribendi codicem ex aliis linguis permittit.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> regulas pro variabilibus mutat.<\/span> <span class=\"sg\" data-s=\"5\">Effectus pragmatis <em>lexicalis<\/em> est.<\/span> <span class=\"sg\" data-s=\"6\">Tantum usque ad finem blocki sui operatur.<\/span> <span class=\"sg\" data-s=\"7\">Ergo regulam severiorem vel minus severam facere potes.<\/span> <span class=\"sg\" data-s=\"8\">Hoc facere potes ibi ubi in codice opus est.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Unum pragma argumentum accipit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku modulos in indice directoriorum quaerit.<\/span> <span class=\"sg\" data-s=\"3\"><code>lib<\/code> directorium ad hunc indicem addit.<\/span> <span class=\"sg\" data-s=\"4\">Sicut optio lineae mandatorum <code>-I<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"5\">Sed id intra programma scribis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Id tibi necessarium erit cum tuos <a href=\"https://course.raku.org/la/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modulos<\/a> scribes et onerabis.<\/span><\/p>"]]}}}</script>
