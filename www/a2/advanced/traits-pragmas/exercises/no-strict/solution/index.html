асті видимості. Це область видимості, де стоїть <code>no strict<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це лише демонстрація. Ми не радимо робити так на практиці. <code>strict<\/code> увімкнена за замовчуванням недарма. Вона знаходить одруки в іменах змінних під час компіляції. У справжньому коді тримайте її увімкненою. Оголошуйте свої змінні через <code>my<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Отпускане на strict","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> изключва едно правило. Правилото казва, че трябва да декларирате всички променливи. Затова можете да присвоявате на <code>$a<\/code> и <code>$b<\/code> без <code>my<\/code>. С обичайния <code>strict<\/code> тези редове дават грешки по време на компилация.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След присвояването променливите работят както обикновено. Затова <code>$a + $b<\/code> е <code>30<\/code>. Тази промяна на правилото е лексикална. Тя важи само до края на текущия обхват. Това е обхватът с <code>no strict<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е само демонстрация. На практика не я препоръчваме. <code>strict<\/code> е включен по подразбиране с добра причина. Той намира грешки при писане в имената на променливите по време на компилация. В истински код го оставете включен. Декларирайте променливите си с <code>my<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Malstreĉi strict","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> malŝaltas regulon. La regulo diras, ke vi devas deklari ĉiujn variablojn. Do vi povas atribui al <code>$a<\/code> kaj <code>$b<\/code> sen <code>my<\/code>. Kun la normala <code>strict<\/code>, ĉi tiuj linioj donas erarojn dum kompilado.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Post la atribuo, la variabloj funkcias kiel kutime. Do <code>$a + $b<\/code> estas <code>30<\/code>. Ĉi tiu ŝanĝo de la regulo estas leksika. Ĝi daŭras nur ĝis la fino de la nuna amplekso. Tio estas la amplekso kun <code>no strict<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tio estas nur demonstro. Ni ne rekomendas ĝin en praktiko. <code>strict<\/code> estas ŝaltita defaŭlte pro bona kialo. Ĝi trovas tajperarojn en nomoj de variabloj dum kompilado. En vera kodo, lasu ĝin ŝaltita. Deklaru viajn variablojn per <code>my<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Strictum relaxare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> regulam deactivat. Regula dicit: omnes variabiles declarare debes. Ergo variabilibus <code>$a<\/code> et <code>$b<\/code> sine <code>my<\/code> assignare potes. Cum <code>strict<\/code> solito, hae lineae tempore compilationis errores dant.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Post assignationem variabiles ut solent operantur. Ergo <code>$a + $b<\/code> est <code>30<\/code>. Haec mutatio regulae lexicalis est. Tantum usque ad finem ambitus currentis durat. Hic est ambitus cum <code>no strict<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haec tantum demonstratio est. In praxi eam non commendamus. <code>strict<\/code> ex defectu activum est bona ratione. Errores scribendi in nominibus variabilium tempore compilationis invenit. In codice vero, id activum serva. Variabiles tuas cum <code>my<\/code> declara.<\/span><\/li><\/ol>"]]}}}</script>
