<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/exercises/custom-trait/solution","n":576,"k":"solution","pv":"advanced/traits-pragmas/exercises/custom-trait","nx":"advanced/traits-pragmas/exercises/no-strict","tr":["advanced","advanced/traits-pragmas"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A custom trait‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The trait is a <code>multi sub trait_mod:&lt;is&gt;<\/code>. It has a named parameter, <code>:$role!<\/code>. Because of this parameter, the sub runs for <code>is role(...)<\/code>. Some traits are only there or not there. This trait is different. It <em>gets<\/em> the argument: <code>is role('admin')<\/code> gives <code>'admin'<\/code> to <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body saves this value under the name of the subroutine. Later, <code>%role&lt;login&gt;<\/code> gives <code>admin<\/code>. Traits run at compile time. So the value is already in the hash when the program runs.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein benutzerdefinierter Trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Trait ist ein <code>multi sub trait_mod:&lt;is&gt;<\/code>. Es hat einen benannten Parameter, <code>:$role!<\/code>. Wegen dieses Parameters läuft die Sub bei <code>is role(...)<\/code>. Manche Traits sind nur da oder nicht da. Dieses Trait ist anders. Es <em>bekommt<\/em> das Argument: <code>is role('admin')<\/code> gibt <code>'admin'<\/code> an <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Rumpf speichert diesen Wert unter dem Namen der Subroutine. Später gibt <code>%role&lt;login&gt;<\/code> den Wert <code>admin<\/code>. Traits laufen zur Kompilierzeit. Also ist der Wert schon im Hash, wenn das Programm läuft.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een eigen trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de taak op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De trait is een <code>multi sub trait_mod:&lt;is&gt;<\/code>. Hij heeft een benoemde parameter, <code>:$role!<\/code>. Door deze parameter draait de sub bij <code>is role(...)<\/code>. Sommige traits zijn er alleen, of zijn er niet. Deze trait is anders. Hij <em>krijgt<\/em> het argument: <code>is role('admin')<\/code> geeft <code>'admin'<\/code> aan <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De body bewaart deze waarde onder de naam van de subroutine. Later geeft <code>%role&lt;login&gt;<\/code> de waarde <code>admin<\/code>. Traits draaien tijdens het compileren. De waarde staat dus al in de hash als het programma draait.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un trait personalizado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El trait es un <code>multi sub trait_mod:&lt;is&gt;<\/code>. Tiene un parámetro nombrado, <code>:$role!<\/code>. Por este parámetro, la sub se ejecuta para <code>is role(...)<\/code>. Algunos traits solo están o no están. Este trait es diferente. <em>Recibe<\/em> el argumento: <code>is role('admin')<\/code> da <code>'admin'<\/code> a <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo guarda este valor bajo el nombre de la subrutina. Después, <code>%role&lt;login&gt;<\/code> da <code>admin<\/code>. Los traits se ejecutan en tiempo de compilación. Así, el valor ya está en el hash cuando el programa se ejecuta.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un trait personalizzato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il trait è una <code>multi sub trait_mod:&lt;is&gt;<\/code>. Ha un parametro nominato, <code>:$role!<\/code>. Grazie a questo parametro, la sub parte per <code>is role(...)<\/code>. Alcuni trait possono solo esserci o non esserci. Questo trait è diverso. <em>Riceve<\/em> l'argomento: <code>is role('admin')<\/code> dà <code>'admin'<\/code> a <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo salva questo valore sotto il nome della subroutine. Dopo, <code>%role&lt;login&gt;<\/code> dà <code>admin<\/code>. I trait lavorano durante la compilazione. Così il valore è già nell'hash durante l'esecuzione.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pielāgota īpašība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Īpašība ir <code>multi sub trait_mod:&lt;is&gt;<\/code>. Tai ir nosaukts parametrs, <code>:$role!<\/code>. Šī parametra dēļ apakšprogramma darbojas ar <code>is role(...)<\/code>. Dažas īpašības ir tikai klāt vai nav klāt. Šī īpašība ir citāda. Tā <em>saņem<\/em> argumentu: <code>is role('admin')<\/code> dod <code>'admin'<\/code> parametram <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ķermenis saglabā šo vērtību ar apakšprogrammas nosaukumu. Vēlāk <code>%role&lt;login&gt;<\/code> dod <code>admin<\/code>. Īpašības izpildās kompilēšanas laikā. Tāpēc vērtība jau ir hešā, kad programma darbojas.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Пользовательский трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Типаж — это <code>multi sub trait_mod:&lt;is&gt;<\/code>. У него есть именованный параметр, <code>:$role!<\/code>. Из-за этого параметра подпрограмма выполняется для <code>is role(...)<\/code>. Некоторые типажи либо есть, либо их нет. Этот типаж другой. Он <em>получает<\/em> аргумент: <code>is role('admin')<\/code> отдаёт <code>'admin'<\/code> в <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тело сохраняет это значение под именем подпрограммы. Позже <code>%role&lt;login&gt;<\/code> даёт <code>admin<\/code>. Типажи выполняются во время компиляции. Поэтому значение уже есть в хеше, когда программа работает.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Власний трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трейт — це <code>multi sub trait_mod:&lt;is&gt;<\/code>. Він має іменований параметр <code>:$role!<\/code>. Через цей параметр підпрограма спрацьовує для <code>is role(...)<\/code>. Деякі трейти просто є або їх немає. Цей трейт інший. Він <em>отримує<\/em> аргумент: <code>is role('admin')<\/code> передає <code>'admin'<\/code> у <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло зберігає це значення під іменем підпрограми. Пізніше <code>%role&lt;login&gt;<\/code> дає <code>admin<\/code>. Трейти виконуються під час компіляції. Тож значення вже лежить у хеші, коли програма працює.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Потребителски трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трейтът е <code>multi sub trait_mod:&lt;is&gt;<\/code>. Той има именуван параметър, <code>:$role!<\/code>. Заради този параметър подпрограмата се изпълнява при <code>is role(...)<\/code>. Някои трейтове само присъстват или липсват. Този трейт е различен. Той <em>получава<\/em> аргумента: <code>is role('admin')<\/code> дава <code>'admin'<\/code> на <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото записва тази стойност под името на подпрограмата. По-късно <code>%role&lt;login&gt;<\/code> дава <code>admin<\/code>. Трейтовете се изпълняват по време на компилация. Затова стойността вече е в хеша, когато програмата работи.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Propra trajto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La trajto estas <code>multi sub trait_mod:&lt;is&gt;<\/code>. Ĝi havas nomitan parametron, <code>:$role!<\/code>. Pro ĉi tiu parametro, la subrutino ruliĝas por <code>is role(...)<\/code>. Kelkaj trajtoj nur ĉeestas aŭ ne ĉeestas. Ĉi tiu trajto estas alia. Ĝi <em>ricevas<\/em> la argumenton: <code>is role('admin')<\/code> donas <code>'admin'<\/code> al <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La korpo konservas ĉi tiun valoron sub la nomo de la subrutino. Poste, <code>%role&lt;login&gt;<\/code> donas <code>admin<\/code>. Trajtoj ruliĝas dum kompilado. Do la valoro jam estas en la hako, kiam la programo ruliĝas.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Proprietas personalis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Trait est <code>multi sub trait_mod:&lt;is&gt;<\/code>. Parametrum nominatum habet, <code>:$role!<\/code>. Propter hoc parametrum sub pro <code>is role(...)<\/code> currit. Quaedam traits tantum adsunt vel absunt. Hoc trait aliud est. Argumentum <em>accipit<\/em>: <code>is role('admin')<\/code> dat <code>'admin'<\/code> parametro <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus hunc valorem sub nomine subroutinae servat. Postea <code>%role&lt;login&gt;<\/code> dat <code>admin<\/code>. Traits tempore compilationis currunt. Ergo valor iam in hash est cum programma currit.<\/span><\/li><\/ol>"]]}}}</script>
