\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут ми створюємо <code>inner<\/code> усередині <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім <code>outer<\/code> викликає її.<\/span> <span class=\"sg\" data-s=\"2\">Це працює.<\/span> <span class=\"sg\" data-s=\"3\">Ім'я <code>inner<\/code> відоме в усьому тілі <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але поза <code>outer<\/code> імені <code>inner<\/code> не існує.<\/span> <span class=\"sg\" data-s=\"1\">Ця програма не компілюється:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # помилка: Undeclared routine: inner<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді допоміжна підпрограма потрібна лише одній підпрограмі.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вкладення корисне.<\/span> <span class=\"sg\" data-s=\"2\">Покладіть помічника всередину тієї підпрограми.<\/span> <span class=\"sg\" data-s=\"3\">Це показує, що помічник приватний.<\/span> <span class=\"sg\" data-s=\"4\">А ще інший код не може випадково його викликати.<\/span><\/p>"]]},"bg":{"t":"Вложени подпрограми","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да дефинирате подпрограма <em>вътре<\/em> в друга подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Това е вложена подпрограма.<\/span> <span class=\"sg\" data-s=\"2\">Тя е обикновена подпрограма.<\/span> <span class=\"sg\" data-s=\"3\">Но можете да я виждате и използвате само във външната подпрограма.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук създаваме <code>inner<\/code> вътре в <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После <code>outer<\/code> я извиква.<\/span> <span class=\"sg\" data-s=\"2\">Това работи.<\/span> <span class=\"sg\" data-s=\"3\">Името <code>inner<\/code> е известно в цялото тяло на <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но извън <code>outer<\/code> името <code>inner<\/code> не съществува.<\/span> <span class=\"sg\" data-s=\"1\">Тази програма не се компилира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога само една подпрограма има нужда от помощна подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Тогава влагането е полезно.<\/span> <span class=\"sg\" data-s=\"2\">Сложете помощника вътре в тази подпрограма.<\/span> <span class=\"sg\" data-s=\"3\">Това показва, че помощникът е частен.<\/span> <span class=\"sg\" data-s=\"4\">Освен това друг код не може да го извика по грешка.<\/span><\/p>"]]},"eo":{"t":"Nestitaj subrutinaj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas difini subprogramon <em>ene de<\/em> alia subprogramo.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas nestita subprogramo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas normala subprogramo.<\/span> <span class=\"sg\" data-s=\"3\">Sed vi povas vidi kaj uzi ĝin nur ene de la ekstera subprogramo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, ni kreas <code>inner<\/code> ene de <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste <code>outer<\/code> vokas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Tio funkcias.<\/span> <span class=\"sg\" data-s=\"3\">La nomo <code>inner<\/code> estas konata en la tuta korpo de <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed ekster <code>outer<\/code>, la nomo <code>inner<\/code> ne ekzistas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu programo ne kompiliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje nur unu subprogramo bezonas helpantan subprogramon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam nestado estas utila.<\/span> <span class=\"sg\" data-s=\"2\">Metu la helpanton ene de tiu subprogramo.<\/span> <span class=\"sg\" data-s=\"3\">Tio montras, ke la helpanto estas privata.<\/span> <span class=\"sg\" data-s=\"4\">Krome, neniu alia kodo povas voki ĝin erare.<\/span><\/p>"]]},"la":{"t":"Subprogrammata nidificata","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Subroutinam <em>intra<\/em> aliam subroutinam definire potes.<\/span> <span class=\"sg\" data-s=\"1\">Haec est subroutina inclusa.<\/span> <span class=\"sg\" data-s=\"2\">Ea est subroutina ordinaria.<\/span> <span class=\"sg\" data-s=\"3\">Sed eam solum intra subroutinam exteriorem videre et adhibere potes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic <code>inner<\/code> intra <code>outer<\/code> creamus.<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>outer<\/code> eam vocat.<\/span> <span class=\"sg\" data-s=\"2\">Hoc operatur.<\/span> <span class=\"sg\" data-s=\"3\">Nomen <code>inner<\/code> in toto corpore <code>outer<\/code> notum est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed extra <code>outer<\/code> nomen <code>inner<\/code> non exsistit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc programma non compilatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum una sola subroutina routinam auxiliarem requirit.<\/span> <span class=\"sg\" data-s=\"1\">Tum inclusio utilis est.<\/span> <span class=\"sg\" data-s=\"2\">Pone auxiliarem intra illam subroutinam.<\/span> <span class=\"sg\" data-s=\"3\">Hoc ostendit auxiliarem privatam esse.<\/span> <span class=\"sg\" data-s=\"4\">Praeterea nullus alius codex eam per errorem vocare potest.<\/span><\/p>"]]}}}</script>
