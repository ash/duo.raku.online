<script type="application/json" id="page-data">{"u":"advanced/modules-basics/export-tags","n":699,"k":"topic","pv":"advanced/modules-basics/importing/quiz","nx":"advanced/modules-basics/export-tags/quiz","tr":["advanced","advanced/modules-basics"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Export tags","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Mark a subroutine with <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then it goes into the <em>default<\/em> export group of the module.<\/span> <span class=\"sg\" data-s=\"2\">A simple <code>use<\/code> brings in the names from this group.<\/span> <span class=\"sg\" data-s=\"3\">You can also give <code>is export<\/code> a <em>tag<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">With tags, you put the exports into groups with names.<\/span> <span class=\"sg\" data-s=\"5\">Then each program takes the group that it wants.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You write a tag in parentheses after <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> has no tag.<\/span> <span class=\"sg\" data-s=\"1\">So it is in the default group.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> has the tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A simple <code>use<\/code> imports only the default group:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Now name a tag.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>use<\/code> imports that group instead.<\/span> <span class=\"sg\" data-s=\"2\">This may surprise you.<\/span> <span class=\"sg\" data-s=\"3\">It does <em>not<\/em> import the default group too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">With <code>:partings<\/code>, you get exactly this group.<\/span> <span class=\"sg\" data-s=\"1\">Do you want all the exports of a module?<\/span> <span class=\"sg\" data-s=\"2\">Then use the built-in tag <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Two special tags are good to know.<\/span> <span class=\"sg\" data-s=\"1\">Every module supports <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It imports all the exports of the module.<\/span> <span class=\"sg\" data-s=\"3\">You can put <code>:MANDATORY<\/code> on a routine.<\/span> <span class=\"sg\" data-s=\"4\">Then the routine is always imported.<\/span> <span class=\"sg\" data-s=\"5\">It does not matter which tag the caller chooses.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In fact, each tag is a package.<\/span> <span class=\"sg\" data-s=\"1\">It is inside the <code>EXPORT<\/code> package of the module.<\/span> <span class=\"sg\" data-s=\"2\">An example is <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"/advanced/module-introspection/\">Module introspection<\/a> lists exactly these packages.<\/span> <span class=\"sg\" data-s=\"4\">With tags, a large module can keep its default group small.<\/span> <span class=\"sg\" data-s=\"5\">A program can still ask for more features.<\/span><\/p>"]]},"de":{"t":"Export-Tags","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Markiere eine Subroutine mit <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dann kommt sie in die <em>Standard<\/em>-Exportgruppe des Moduls.<\/span> <span class=\"sg\" data-s=\"2\">Ein einfaches <code>use<\/code> holt die Namen aus dieser Gruppe.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst <code>is export<\/code> auch ein <em>Tag<\/em> geben.<\/span> <span class=\"sg\" data-s=\"4\">Mit Tags teilst du die Exporte in Gruppen mit Namen auf.<\/span> <span class=\"sg\" data-s=\"5\">Dann nimmt jedes Programm die Gruppe, die es will.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du schreibst ein Tag in Klammern nach <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> hat kein Tag.<\/span> <span class=\"sg\" data-s=\"1\">Also ist es in der Standardgruppe.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> hat das Tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein einfaches <code>use<\/code> importiert nur die Standardgruppe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nenne jetzt ein Tag.<\/span> <span class=\"sg\" data-s=\"1\">Dann importiert <code>use<\/code> stattdessen diese Gruppe.<\/span> <span class=\"sg\" data-s=\"2\">Das überrascht dich vielleicht.<\/span> <span class=\"sg\" data-s=\"3\">Es importiert <em>nicht<\/em> auch noch die Standardgruppe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mit <code>:partings<\/code> bekommst du genau diese Gruppe.<\/span> <span class=\"sg\" data-s=\"1\">Willst du alle Exporte eines Moduls?<\/span> <span class=\"sg\" data-s=\"2\">Dann benutze das eingebaute Tag <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Zwei besondere Tags solltest du kennen.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Modul unterstützt <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es importiert alle Exporte des Moduls.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst <code>:MANDATORY<\/code> an eine Routine setzen.<\/span> <span class=\"sg\" data-s=\"4\">Dann wird die Routine immer importiert.<\/span> <span class=\"sg\" data-s=\"5\">Es ist egal, welches Tag der Aufrufer wählt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eigentlich ist jedes Tag ein Paket.<\/span> <span class=\"sg\" data-s=\"1\">Es ist im <code>EXPORT<\/code>-Paket des Moduls.<\/span> <span class=\"sg\" data-s=\"2\">Ein Beispiel ist <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die <a href=\"https://course.raku.org/de/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Modul-Introspektion<\/a> listet genau diese Pakete auf.<\/span> <span class=\"sg\" data-s=\"4\">Mit Tags kann ein großes Modul seine Standardgruppe klein halten.<\/span> <span class=\"sg\" data-s=\"5\">Ein Programm kann trotzdem nach mehr Funktionen fragen.<\/span><\/p>"]]},"nl":{"t":"Export-tags","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Markeer een subroutine met <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dan gaat hij naar de <em>standaard<\/em> exportgroep van de module.<\/span> <span class=\"sg\" data-s=\"2\">Een gewone <code>use<\/code> haalt de namen uit deze groep binnen.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt <code>is export<\/code> ook een <em>tag<\/em> geven.<\/span> <span class=\"sg\" data-s=\"4\">Met tags verdeel je de exports in groepen met een naam.<\/span> <span class=\"sg\" data-s=\"5\">Dan neemt elk programma de groep die het wil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je schrijft een tag tussen haakjes na <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> heeft geen tag.<\/span> <span class=\"sg\" data-s=\"1\">Het hoort dus bij de standaardgroep.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> heeft de tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een gewone <code>use<\/code> importeert alleen de standaardgroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is beschikbaar; goodbye niet<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Noem nu een tag.<\/span> <span class=\"sg\" data-s=\"1\">Dan importeert <code>use<\/code> in plaats daarvan die groep.<\/span> <span class=\"sg\" data-s=\"2\">Dat verrast je misschien.<\/span> <span class=\"sg\" data-s=\"3\">Het importeert <em>niet<\/em> ook de standaardgroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is beschikbaar; hello niet<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Met <code>:partings<\/code> krijg je precies deze groep.<\/span> <span class=\"sg\" data-s=\"1\">Wil je alle exports van een module?<\/span> <span class=\"sg\" data-s=\"2\">Gebruik dan de ingebouwde tag <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # zowel hello als goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Twee speciale tags zijn goed om te kennen.<\/span> <span class=\"sg\" data-s=\"1\">Elke module ondersteunt <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die importeert alle exports van de module.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt <code>:MANDATORY<\/code> op een routine zetten.<\/span> <span class=\"sg\" data-s=\"4\">Dan wordt de routine altijd geïmporteerd.<\/span> <span class=\"sg\" data-s=\"5\">Het maakt niet uit welke tag de aanroeper kiest.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eigenlijk is elke tag een pakket.<\/span> <span class=\"sg\" data-s=\"1\">Het zit in het <code>EXPORT<\/code>-pakket van de module.<\/span> <span class=\"sg\" data-s=\"2\">Een voorbeeld is <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/nl/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Module-introspectie<\/a> toont precies deze pakketten.<\/span> <span class=\"sg\" data-s=\"4\">Met tags kan een grote module zijn standaardgroep klein houden.<\/span> <span class=\"sg\" data-s=\"5\">Een programma kan toch om meer functies vragen.<\/span><\/p>"]]},"es":{"t":"Etiquetas de exportación","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Marca una subrutina con <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces va al grupo de exportación <em>predeterminado<\/em> del módulo.<\/span> <span class=\"sg\" data-s=\"2\">Un simple <code>use<\/code> trae los nombres de este grupo.<\/span> <span class=\"sg\" data-s=\"3\">También puedes darle a <code>is export<\/code> una <em>etiqueta<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Con las etiquetas, pones las exportaciones en grupos con nombre.<\/span> <span class=\"sg\" data-s=\"5\">Así cada programa toma el grupo que quiere.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Escribes una etiqueta entre paréntesis después de <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> no tiene etiqueta.<\/span> <span class=\"sg\" data-s=\"1\">Así que está en el grupo predeterminado.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> tiene la etiqueta <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un simple <code>use<\/code> importa solo el grupo predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ahora nombra una etiqueta.<\/span> <span class=\"sg\" data-s=\"1\">Entonces <code>use<\/code> importa ese grupo en su lugar.<\/span> <span class=\"sg\" data-s=\"2\">Esto puede sorprenderte.<\/span> <span class=\"sg\" data-s=\"3\">Pero <em>no<\/em> importa también el grupo predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Con <code>:partings<\/code>, obtienes exactamente este grupo.<\/span> <span class=\"sg\" data-s=\"1\">¿Quieres todas las exportaciones de un módulo?<\/span> <span class=\"sg\" data-s=\"2\">Entonces usa la etiqueta incorporada <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Es bueno conocer dos etiquetas especiales.<\/span> <span class=\"sg\" data-s=\"1\">Todos los módulos aceptan <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Importa todas las exportaciones del módulo.<\/span> <span class=\"sg\" data-s=\"3\">Puedes poner <code>:MANDATORY<\/code> en una rutina.<\/span> <span class=\"sg\" data-s=\"4\">Entonces Raku siempre importa la rutina.<\/span> <span class=\"sg\" data-s=\"5\">Da igual qué etiqueta elige el llamador.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">En realidad, cada etiqueta es un paquete.<\/span> <span class=\"sg\" data-s=\"1\">Está dentro del paquete <code>EXPORT<\/code> del módulo.<\/span> <span class=\"sg\" data-s=\"2\">Un ejemplo es <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La <a href=\"https://course.raku.org/es/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspección de módulos<\/a> lista justo estos paquetes.<\/span> <span class=\"sg\" data-s=\"4\">Con etiquetas, un módulo grande puede mantener pequeño su grupo predeterminado.<\/span> <span class=\"sg\" data-s=\"5\">Aun así, un programa puede pedir más características.<\/span><\/p>"]]},"it":{"t":"Tag di esportazione","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Contrassegna una subroutine con <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora va nel gruppo di esportazione <em>predefinito<\/em> del modulo.<\/span> <span class=\"sg\" data-s=\"2\">Un semplice <code>use<\/code> importa i nomi di questo gruppo.<\/span> <span class=\"sg\" data-s=\"3\">Puoi anche dare un <em>tag<\/em> a <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Con i tag, metti le esportazioni in gruppi con un nome.<\/span> <span class=\"sg\" data-s=\"5\">Poi ogni programma prende il gruppo che vuole.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scrivi un tag tra parentesi dopo <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> non ha tag.<\/span> <span class=\"sg\" data-s=\"1\">Quindi è nel gruppo predefinito.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> ha il tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un semplice <code>use<\/code> importa solo il gruppo predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ora indica un tag.<\/span> <span class=\"sg\" data-s=\"1\">Allora <code>use<\/code> importa invece quel gruppo.<\/span> <span class=\"sg\" data-s=\"2\">Questo forse ti sorprende.<\/span> <span class=\"sg\" data-s=\"3\"><code>use<\/code> <em>non<\/em> importa anche il gruppo predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Con <code>:partings<\/code> ottieni proprio questo gruppo.<\/span> <span class=\"sg\" data-s=\"1\">Vuoi tutte le esportazioni di un modulo?<\/span> <span class=\"sg\" data-s=\"2\">Allora usa il tag integrato <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">È utile conoscere due tag speciali.<\/span> <span class=\"sg\" data-s=\"1\">Ogni modulo supporta <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Importa tutte le esportazioni del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Puoi mettere <code>:MANDATORY<\/code> su una routine.<\/span> <span class=\"sg\" data-s=\"4\">Allora <code>use<\/code> importa sempre questa routine.<\/span> <span class=\"sg\" data-s=\"5\">Non conta quale tag sceglie il chiamante.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In realtà ogni tag è un package.<\/span> <span class=\"sg\" data-s=\"1\">Sta dentro il package <code>EXPORT<\/code> del modulo.<\/span> <span class=\"sg\" data-s=\"2\">Un esempio è <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">L'<a href=\"https://course.raku.org/it/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspezione dei moduli<\/a> elenca proprio questi package.<\/span> <span class=\"sg\" data-s=\"4\">Con i tag, un modulo grande può tenere piccolo il suo gruppo predefinito.<\/span> <span class=\"sg\" data-s=\"5\">Un programma può comunque chiedere più funzionalità.<\/span><\/p>"]]},"lv":{"t":"Eksporta tagi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Atzīmējiet apakšprogrammu ar <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā nonāk moduļa <em>noklusētajā<\/em> eksporta grupā.<\/span> <span class=\"sg\" data-s=\"2\">Vienkāršs <code>use<\/code> ienes nosaukumus no šīs grupas.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat arī dot <code>is export<\/code> <em>birku<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ar birkām jūs saliekat eksportus grupās ar nosaukumiem.<\/span> <span class=\"sg\" data-s=\"5\">Tad katra programma ņem to grupu, ko tā vēlas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Birku jūs rakstāt iekavās aiz <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> nav birkas.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tā ir noklusētajā grupā.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogrammai <code>goodbye<\/code> ir birka <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršs <code>use<\/code> importē tikai noklusēto grupu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tagad nosauciet birku.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>use<\/code> tā vietā importē šo grupu.<\/span> <span class=\"sg\" data-s=\"2\">Tas var jūs pārsteigt.<\/span> <span class=\"sg\" data-s=\"3\">Noklusēto grupu tas klāt <em>neimportē<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ar <code>:partings<\/code> jūs iegūstat tieši šo grupu.<\/span> <span class=\"sg\" data-s=\"1\">Vai vēlaties visus moduļa eksportus?<\/span> <span class=\"sg\" data-s=\"2\">Tad izmantojiet iebūvēto birku <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Divas īpašas birkas ir labi zināt.<\/span> <span class=\"sg\" data-s=\"1\">Katrs modulis atbalsta <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā importē visus moduļa eksportus.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat uzlikt <code>:MANDATORY<\/code> rutīnai.<\/span> <span class=\"sg\" data-s=\"4\">Tad rutīnu importē vienmēr.<\/span> <span class=\"sg\" data-s=\"5\">Nav svarīgi, kuru birku izvēlas izsaucējs.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Patiesībā katra birka ir pakotne.<\/span> <span class=\"sg\" data-s=\"1\">Tā atrodas moduļa pakotnē <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Piemērs ir <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/lv/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Moduļu introspekcija<\/a> uzskaita tieši šīs pakotnes.<\/span> <span class=\"sg\" data-s=\"4\">Ar birkām liels modulis var saglabāt savu noklusēto grupu mazu.<\/span> <span class=\"sg\" data-s=\"5\">Programma tik un tā var prasīt vairāk iespēju.<\/span><\/p>"]]},"ru":{"t":"Теги экспорта","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Пометьте подпрограмму как <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда она попадает в группу экспорта модуля <em>по умолчанию<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Простой <code>use<\/code> подключает имена из этой группы.<\/span> <span class=\"sg\" data-s=\"3\">Ещё можно дать <code>is export<\/code> <em>тег<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">С тегами вы раскладываете экспорты по группам с именами.<\/span> <span class=\"sg\" data-s=\"5\">Тогда каждая программа берёт ту группу, которую хочет.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тег пишут в скобках после <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У <code>hello<\/code> нет тега.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому она в группе по умолчанию.<\/span> <span class=\"sg\" data-s=\"2\">У <code>goodbye<\/code> есть тег <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Простой <code>use<\/code> импортирует только группу по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Теперь укажите тег.<\/span> <span class=\"sg\" data-s=\"1\">Тогда <code>use<\/code> импортирует вместо этого группу тега.<\/span> <span class=\"sg\" data-s=\"2\">Это может вас удивить.<\/span> <span class=\"sg\" data-s=\"3\">Он <em>не<\/em> импортирует заодно и группу по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">С <code>:partings<\/code> вы получаете ровно эту группу.<\/span> <span class=\"sg\" data-s=\"1\">Хотите все экспорты модуля?<\/span> <span class=\"sg\" data-s=\"2\">Тогда используйте встроенный тег <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Полезно знать два особых тега.<\/span> <span class=\"sg\" data-s=\"1\">Каждый модуль поддерживает <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он импортирует все экспорты модуля.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете поставить <code>:MANDATORY<\/code> на подпрограмму.<\/span> <span class=\"sg\" data-s=\"4\">Тогда подпрограмма импортируется всегда.<\/span> <span class=\"sg\" data-s=\"5\">Неважно, какой тег выбирает вызывающий код.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">На самом деле каждый тег — это пакет.<\/span> <span class=\"sg\" data-s=\"1\">Он лежит внутри пакета <code>EXPORT<\/code> модуля.<\/span> <span class=\"sg\" data-s=\"2\">Вот пример: <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/ru/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Интроспекция модулей<\/a> показывает именно эти пакеты.<\/span> <span class=\"sg\" data-s=\"4\">С тегами большой модуль может держать группу по умолчанию маленькой.<\/span> <span class=\"sg\" data-s=\"5\">При этом программа всё равно может попросить больше возможностей.<\/span><\/p>"]]},"uk":{"t":"Мітки експорту","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Позначте підпрограму як <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вона потрапляє до <em>типової<\/em> групи експорту модуля.<\/span> <span class=\"sg\" data-s=\"2\">Простий <code>use<\/code> приносить імена з цієї групи.<\/span> <span class=\"sg\" data-s=\"3\">Також ви можете дати <code>is export<\/code> <em>мітку<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">З мітками ви розкладаєте експорти по групах з іменами.<\/span> <span class=\"sg\" data-s=\"5\">Тоді кожна програма бере ту групу, яку хоче.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви пишете мітку в дужках після <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> не має мітки.<\/span> <span class=\"sg\" data-s=\"1\">Тож вона належить до типової групи.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> має мітку <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Простий <code>use<\/code> імпортує лише типову групу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello доступна; goodbye ні<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тепер назвіть мітку.<\/span> <span class=\"sg\" data-s=\"1\">Тоді <code>use<\/code> імпортує натомість цю групу.<\/span> <span class=\"sg\" data-s=\"2\">Це може вас здивувати.<\/span> <span class=\"sg\" data-s=\"3\">Типову групу він при цьому <em>не<\/em> імпортує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye доступна; hello ні<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">З <code>:partings<\/code> ви отримуєте саме цю групу.<\/span> <span class=\"sg\" data-s=\"1\">Хочете всі експорти модуля?<\/span> <span class=\"sg\" data-s=\"2\">Тоді використайте вбудовану мітку <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # і hello, і goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Дві особливі мітки добре знати.<\/span> <span class=\"sg\" data-s=\"1\">Кожен модуль підтримує <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вона імпортує всі експорти модуля.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете поставити <code>:MANDATORY<\/code> на підпрограму.<\/span> <span class=\"sg\" data-s=\"4\">Тоді підпрограма імпортується завжди.<\/span> <span class=\"sg\" data-s=\"5\">Неважливо, яку мітку вибирає програма.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Насправді кожна мітка — це пакунок.<\/span> <span class=\"sg\" data-s=\"1\">Він лежить усередині пакунка <code>EXPORT<\/code> модуля.<\/span> <span class=\"sg\" data-s=\"2\">Приклад — <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/uk/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Інтроспекція модулів<\/a> перелічує саме ці пакунки.<\/span> <span class=\"sg\" data-s=\"4\">З мітками великий модуль може тримати типову групу малою.<\/span> <span class=\"sg\" data-s=\"5\">А програма все одно може попросити більше можливостей.<\/span><\/p>"]]},"bg":{"t":"Тагове за експортиране","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Маркирайте подпрограма с <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава тя отива в групата <em>по подразбиране<\/em> за експортиране на модула.<\/span> <span class=\"sg\" data-s=\"2\">Обикновен <code>use<\/code> внася имената от тази група.<\/span> <span class=\"sg\" data-s=\"3\">Можете също да дадете на <code>is export<\/code> <em>таг<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">С таговете разпределяте експортите в групи с имена.<\/span> <span class=\"sg\" data-s=\"5\">Тогава всяка програма взема групата, която иска.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пишете тага в скоби след <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> няма таг.<\/span> <span class=\"sg\" data-s=\"1\">Затова е в групата по подразбиране.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> има тага <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обикновен <code>use<\/code> импортира само групата по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Сега посочете таг.<\/span> <span class=\"sg\" data-s=\"1\">Тогава <code>use<\/code> импортира тази група вместо това.<\/span> <span class=\"sg\" data-s=\"2\">Това може да ви изненада.<\/span> <span class=\"sg\" data-s=\"3\">Той <em>не<\/em> импортира и групата по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">С <code>:partings<\/code> получавате точно тази група.<\/span> <span class=\"sg\" data-s=\"1\">Искате ли всички експорти на модула?<\/span> <span class=\"sg\" data-s=\"2\">Тогава използвайте вградения таг <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Добре е да знаете два специални тага.<\/span> <span class=\"sg\" data-s=\"1\">Всеки модул поддържа <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той импортира всички експорти на модула.<\/span> <span class=\"sg\" data-s=\"3\">Можете да сложите <code>:MANDATORY<\/code> на рутина.<\/span> <span class=\"sg\" data-s=\"4\">Тогава рутината винаги се импортира.<\/span> <span class=\"sg\" data-s=\"5\">Няма значение кой таг избира извикващият код.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Всъщност всеки таг е пакет.<\/span> <span class=\"sg\" data-s=\"1\">Той е вътре в пакета <code>EXPORT<\/code> на модула.<\/span> <span class=\"sg\" data-s=\"2\">Пример за това е <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/bg/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Интроспекцията на модулите<\/a> показва точно тези пакети.<\/span> <span class=\"sg\" data-s=\"4\">С таговете голям модул може да държи групата си по подразбиране малка.<\/span> <span class=\"sg\" data-s=\"5\">Програмата пак може да поиска още функции.<\/span><\/p>"]]},"eo":{"t":"Eksportaj etikedoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Marku subprogramon per <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi iras en la <em>defaŭltan<\/em> eksportgrupon de la modulo.<\/span> <span class=\"sg\" data-s=\"2\">Simpla <code>use<\/code> alportas la nomojn el ĉi tiu grupo.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ povas doni al <code>is export<\/code> <em>etikedon<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Per etikedoj, vi metas la eksportojn en grupojn kun nomoj.<\/span> <span class=\"sg\" data-s=\"5\">Tiam ĉiu programo prenas la grupon, kiun ĝi volas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi skribas etikedon en krampoj post <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> ne havas etikedon.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi estas en la defaŭlta grupo.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> havas la etikedon <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simpla <code>use<\/code> importas nur la defaŭltan grupon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello estas disponebla; goodbye ne estas<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nun nomu etikedon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam <code>use<\/code> importas tiun grupon anstataŭe.<\/span> <span class=\"sg\" data-s=\"2\">Tio eble surprizas vin.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi <em>ne<\/em> importas ankaŭ la defaŭltan grupon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye estas disponebla; hello ne estas<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kun <code>:partings<\/code>, vi ricevas ĝuste ĉi tiun grupon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu vi volas ĉiujn eksportojn de modulo?<\/span> <span class=\"sg\" data-s=\"2\">Tiam uzu la enkonstruitan etikedon <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # ambaŭ hello kaj goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Estas bone koni du specialajn etikedojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu modulo subtenas <code>:ALL<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi importas ĉiujn eksportojn de la modulo.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas meti <code>:MANDATORY<\/code> sur rutinon.<\/span> <span class=\"sg\" data-s=\"4\">Tiam Raku ĉiam importas la rutinon.<\/span> <span class=\"sg\" data-s=\"5\">Ne gravas, kiun etikedon la vokanto elektas.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Fakte, ĉiu etikedo estas pako.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas en la pako <code>EXPORT<\/code> de la modulo.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemplo estas <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/eo/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Modula introspekto<\/a> listigas ĝuste ĉi tiujn pakojn.<\/span> <span class=\"sg\" data-s=\"4\">Per etikedoj, granda modulo povas teni sian defaŭltan grupon malgranda.<\/span> <span class=\"sg\" data-s=\"5\">Programo tamen povas peti pliajn funkciojn.<\/span><\/p>"]]},"la":{"t":"Export pittacia","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nota subprogramma cum <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum in gregem exportationis <em>praedefinitum<\/em> moduli it.<\/span> <span class=\"sg\" data-s=\"2\">Simplex <code>use<\/code> nomina ex hoc grege adducit.<\/span> <span class=\"sg\" data-s=\"3\">Etiam <code>is export<\/code> <em>tesseram<\/em> dare potes.<\/span> <span class=\"sg\" data-s=\"4\">Tesseris exportationes in greges cum nominibus ponis.<\/span> <span class=\"sg\" data-s=\"5\">Tum quodque programma gregem sumit quem vult.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tesseram in parenthesibus post <code>is export<\/code> scribis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> tesseram non habet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque in grege praedefinito est.<\/span> <span class=\"sg\" data-s=\"2\"><code>goodbye<\/code> tesseram <code>:partings<\/code> habet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simplex <code>use<\/code> solum gregem praedefinitum importat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello praesto est; goodbye non est<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nunc tesseram nomina.<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>use<\/code> illum gregem pro eo importat.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fortasse mirum tibi est.<\/span> <span class=\"sg\" data-s=\"3\">Gregem praedefinitum <em>non<\/em> etiam importat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye praesto est; hello non est<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum <code>:partings<\/code> exacte hunc gregem accipis.<\/span> <span class=\"sg\" data-s=\"1\">Visne omnes exportationes moduli?<\/span> <span class=\"sg\" data-s=\"2\">Tum tessera inbuilta <code>:ALL<\/code> utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # et hello et goodbye<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Duas tesseras speciales nosse bonum est.<\/span> <span class=\"sg\" data-s=\"1\">Omnis modulus <code>:ALL<\/code> sustinet.<\/span> <span class=\"sg\" data-s=\"2\">Omnes exportationes moduli importat.<\/span> <span class=\"sg\" data-s=\"3\"><code>:MANDATORY<\/code> in proceduram ponere potes.<\/span> <span class=\"sg\" data-s=\"4\">Tum procedura semper importatur.<\/span> <span class=\"sg\" data-s=\"5\">Non refert quam tesseram vocans eligat.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Re vera quaeque tessera est fasciculus.<\/span> <span class=\"sg\" data-s=\"1\">Intra fasciculum <code>EXPORT<\/code> moduli est.<\/span> <span class=\"sg\" data-s=\"2\">Exemplum est <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/la/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Introspectio modulorum<\/a> exacte hos fasciculos enumerat.<\/span> <span class=\"sg\" data-s=\"4\">Tesseris magnus modulus gregem praedefinitum parvum servare potest.<\/span> <span class=\"sg\" data-s=\"5\">Programma tamen plures facultates petere potest.<\/span><\/p>"]]}}}</script>
