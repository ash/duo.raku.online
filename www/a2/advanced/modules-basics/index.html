<script type="application/json" id="page-data">{"u":"advanced/modules-basics","n":692,"k":"section","pv":"advanced/anonymous-subroutines/quiz","nx":"advanced/modules-basics/creating-modules","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Modules basics","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">A <em>module<\/em> is a file with code that you can use again.<\/span> <span class=\"sg\" data-s=\"1\">It can have subroutines, variables, and more.<\/span> <span class=\"sg\" data-s=\"2\">Other programs can load the module and share it.<\/span> <span class=\"sg\" data-s=\"3\">This section shows the main things in three steps.<\/span> <span class=\"sg\" data-s=\"4\">First, you <strong>write<\/strong> a module.<\/span> <span class=\"sg\" data-s=\"5\">You mark what it gives to other programs.<\/span> <span class=\"sg\" data-s=\"6\">Second, a program <strong>loads<\/strong> the module with <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Third, <strong>importing<\/strong> brings the names of the module into your scope.<\/span><\/p>"]]},"de":{"t":"Modul-Grundlagen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Modul<\/em> ist eine Datei mit Code, den du wieder benutzen kannst.<\/span> <span class=\"sg\" data-s=\"1\">Es kann Subroutinen, Variablen und mehr enthalten.<\/span> <span class=\"sg\" data-s=\"2\">Andere Programme können das Modul laden und teilen.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt die wichtigsten Dinge in drei Schritten.<\/span> <span class=\"sg\" data-s=\"4\">Zuerst <strong>schreibst<\/strong> du ein Modul.<\/span> <span class=\"sg\" data-s=\"5\">Du markierst, was es anderen Programmen gibt.<\/span> <span class=\"sg\" data-s=\"6\">Als Zweites <strong>lädt<\/strong> ein Programm das Modul mit <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Als Drittes bringt das <strong>Importieren<\/strong> die Namen des Moduls in deinen Gültigkeitsbereich.<\/span><\/p>"]]},"nl":{"t":"Basisbeginselen van modules","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Een <em>module<\/em> is een bestand met code die je opnieuw kunt gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Hij kan subroutines, variabelen en meer bevatten.<\/span> <span class=\"sg\" data-s=\"2\">Andere programma's kunnen de module laden en delen.<\/span> <span class=\"sg\" data-s=\"3\">Dit gedeelte toont de belangrijkste dingen in drie stappen.<\/span> <span class=\"sg\" data-s=\"4\">Eerst <strong>schrijf<\/strong> je een module.<\/span> <span class=\"sg\" data-s=\"5\">Je geeft aan wat hij aan andere programma's geeft.<\/span> <span class=\"sg\" data-s=\"6\">Ten tweede <strong>laadt<\/strong> een programma de module met <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ten derde brengt <strong>importeren<\/strong> de namen van de module in je bereik.<\/span><\/p>"]]},"es":{"t":"Fundamentos de módulos","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Un <em>módulo<\/em> es un archivo con código que puedes usar otra vez.<\/span> <span class=\"sg\" data-s=\"1\">Puede tener subrutinas, variables y más.<\/span> <span class=\"sg\" data-s=\"2\">Otros programas pueden cargar el módulo y compartirlo.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra lo principal en tres pasos.<\/span> <span class=\"sg\" data-s=\"4\">Primero, <strong>escribes<\/strong> un módulo.<\/span> <span class=\"sg\" data-s=\"5\">Marcas lo que da a otros programas.<\/span> <span class=\"sg\" data-s=\"6\">Segundo, un programa <strong>carga<\/strong> el módulo con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Tercero, la <strong>importación<\/strong> trae los nombres del módulo a tu ámbito.<\/span><\/p>"]]},"it":{"t":"Basi dei moduli","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Un <em>modulo<\/em> è un file con codice che puoi usare di nuovo.<\/span> <span class=\"sg\" data-s=\"1\">Può avere subroutine, variabili e altro.<\/span> <span class=\"sg\" data-s=\"2\">Altri programmi possono caricare il modulo e condividerlo.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra le cose principali in tre passi.<\/span> <span class=\"sg\" data-s=\"4\">Primo, <strong>scrivi<\/strong> un modulo.<\/span> <span class=\"sg\" data-s=\"5\">Indichi cosa dà agli altri programmi.<\/span> <span class=\"sg\" data-s=\"6\">Secondo, un programma <strong>carica<\/strong> il modulo con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Terzo, l'<strong>importazione<\/strong> porta i nomi del modulo nel tuo scope.<\/span><\/p>"]]},"lv":{"t":"Moduļu pamati","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Modulis<\/em> ir fails ar kodu, ko var izmantot atkārtoti.<\/span> <span class=\"sg\" data-s=\"1\">Tajā var būt apakšprogrammas, mainīgie un vēl citas lietas.<\/span> <span class=\"sg\" data-s=\"2\">Citas programmas var ielādēt moduli un to koplietot.<\/span> <span class=\"sg\" data-s=\"3\">Šī sadaļa parāda galveno trīs soļos.<\/span> <span class=\"sg\" data-s=\"4\">Pirmkārt, jūs <strong>uzrakstāt<\/strong> moduli.<\/span> <span class=\"sg\" data-s=\"5\">Jūs atzīmējat, ko tas dod citām programmām.<\/span> <span class=\"sg\" data-s=\"6\">Otrkārt, programma <strong>ielādē<\/strong> moduli ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Treškārt, <strong>importēšana<\/strong> ienes moduļa nosaukumus jūsu redzamības apgabalā.<\/span><\/p>"]]},"ru":{"t":"Основы модулей","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Модуль<\/em> — это файл с кодом, который можно использовать снова.<\/span> <span class=\"sg\" data-s=\"1\">В нём могут быть подпрограммы, переменные и другое.<\/span> <span class=\"sg\" data-s=\"2\">Другие программы могут загружать модуль и вместе им пользоваться.<\/span> <span class=\"sg\" data-s=\"3\">Этот раздел показывает главное в три шага.<\/span> <span class=\"sg\" data-s=\"4\">Во-первых, вы <strong>пишете<\/strong> модуль.<\/span> <span class=\"sg\" data-s=\"5\">Вы отмечаете, что он даёт другим программам.<\/span> <span class=\"sg\" data-s=\"6\">Во-вторых, программа <strong>загружает<\/strong> модуль с помощью <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">В-третьих, <strong>импорт<\/strong> вносит имена модуля в вашу область видимости.<\/span><\/p>"]]},"uk":{"t":"Основи модулів","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Модуль<\/em> — це файл із кодом, який можна використовувати знову.<\/span> <span class=\"sg\" data-s=\"1\">У ньому можуть бути підпрограми, змінні та інше.<\/span> <span class=\"sg\" data-s=\"2\">Інші програми можуть завантажити модуль і спільно ним користуватися.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує головне в три кроки.<\/span> <span class=\"sg\" data-s=\"4\">По-перше, ви <strong>пишете<\/strong> модуль.<\/span> <span class=\"sg\" data-s=\"5\">Ви позначаєте, що він дає іншим програмам.<\/span> <span class=\"sg\" data-s=\"6\">По-друге, програма <strong>завантажує<\/strong> модуль через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">По-третє, <strong>імпортування<\/strong> вводить імена модуля у вашу область видимості.<\/span><\/p>"]]},"bg":{"t":"Основи на модулите","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Модулът<\/em> е файл с код, който можете да използвате отново.<\/span> <span class=\"sg\" data-s=\"1\">Той може да има подпрограми, променливи и други неща.<\/span> <span class=\"sg\" data-s=\"2\">Други програми могат да заредят модула и да го споделят.<\/span> <span class=\"sg\" data-s=\"3\">Този раздел показва основните неща в три стъпки.<\/span> <span class=\"sg\" data-s=\"4\">Първо, вие <strong>пишете<\/strong> модул.<\/span> <span class=\"sg\" data-s=\"5\">Отбелязвате какво той дава на другите програми.<\/span> <span class=\"sg\" data-s=\"6\">Второ, програмата <strong>зарежда<\/strong> модула с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Трето, <strong>импортирането<\/strong> внася имената на модула във вашия обхват.<\/span><\/p>"]]},"eo":{"t":"Bazaj konoj pri moduloj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Modulo<\/em> estas dosiero kun kodo, kiun vi povas uzi denove.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas havi subprogramojn, variablojn kaj pli.<\/span> <span class=\"sg\" data-s=\"2\">Aliaj programoj povas ŝargi la modulon kaj kunhavi ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio montras la ĉefajn aferojn en tri paŝoj.<\/span> <span class=\"sg\" data-s=\"4\">Unue, vi <strong>skribas<\/strong> modulon.<\/span> <span class=\"sg\" data-s=\"5\">Vi markas, kion ĝi donas al aliaj programoj.<\/span> <span class=\"sg\" data-s=\"6\">Due, programo <strong>ŝargas<\/strong> la modulon per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Trie, <strong>importado<\/strong> alportas la nomojn de la modulo en vian amplekson.<\/span><\/p>"]]},"la":{"t":"Fundamenta modulorum","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Modulus<\/em> est archivum cum codice quem iterum adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Subprogrammata, variabiles et plura habere potest.<\/span> <span class=\"sg\" data-s=\"2\">Alia programmata modulum onerare et communicare possunt.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio res principales tribus gradibus ostendit.<\/span> <span class=\"sg\" data-s=\"4\">Primum modulum <strong>scribis<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Notas quid aliis programmatis det.<\/span> <span class=\"sg\" data-s=\"6\">Secundo programma modulum per <code>use<\/code> <strong>onerat<\/strong>.<\/span> <span class=\"sg\" data-s=\"7\">Tertio <strong>importatio<\/strong> nomina moduli in circumscriptionem tuam adducit.<\/span><\/p>"]]}}}</script>
