ode>require<\/code> зарежда модула по време на изпълнение, а не по време на компилация. Сам по себе си той не импортира нищо. Затова Raku не познава името <code>hello<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Списъкът <code>&lt;&amp;hello&gt;<\/code> казва на <code>require<\/code> да импортира това едно име. След този оператор можете да извикате <code>hello('Sam')<\/code> директно. Тя дава <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ето <em>защо<\/em> имаме <code>require<\/code>. Той работи по време на изпълнение. Затова може да бъде вътре в <code>if<\/code>. С <code>--quiet<\/code> програмата прескача този клон. Така тя никога не зарежда модула. <code>use<\/code> винаги зарежда модула. Той работи по време на компилация.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Ŝargi je rultempe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi ambaŭ fontdosierojn en la dosierujo <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> ŝargas la modulon je rultempo, ne je kompiltempo. Per si mem, ĝi importas nenion. Do Raku ne konas la nomon <code>hello<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La listo <code>&lt;&amp;hello&gt;<\/code> diras al <code>require<\/code> importi ĉi tiun unu nomon. Post ĉi tiu instrukcio, vi povas voki <code>hello('Sam')<\/code> rekte. Ĝi donas <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jen <em>kial<\/em> ni havas <code>require<\/code>. Ĝi funkcias je rultempo. Do ĝi povas esti en <code>if<\/code>. Kun <code>--quiet<\/code>, la programo transsaltas ĉi tiun branĉon. Do ĝi neniam ŝargas la modulon. <code>use<\/code> ĉiam ŝargas la modulon. Ĝi funkcias je kompiltempo.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Tempore exsecutionis onerare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Utrumque archivum fontem in directoria <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> modulum tempore exsecutionis onerat, non tempore compilationis. Per se nihil importat. Itaque Raku nomen <code>hello<\/code> non novit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Index <code>&lt;&amp;hello&gt;<\/code> iubet <code>require<\/code> hoc unum nomen importare. Post hoc enuntiatum <code>hello('Sam')<\/code> directe vocare potes. Id <code>Hello, Sam!<\/code> dat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><em>Ideo<\/em> <code>require<\/code> habemus. Tempore exsecutionis operatur. Itaque intra <code>if<\/code> esse potest. Cum <code>--quiet<\/code>, programma hunc ramum praetermittit. Itaque modulum numquam onerat. <code>use<\/code> semper modulum onerat. Tempore compilationis operatur.<\/span><\/li><\/ol>"]]}}}</script>
