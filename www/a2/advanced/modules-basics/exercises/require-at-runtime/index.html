 raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Ŝargi je rultempe","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen modulo, <code>Greeting.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi eksportas subrutinon <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ŝargu ĉi tiun modulon per <code>require<\/code>, ne per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la programo ŝargas ĝin je <strong>rultempo<\/strong>, dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\"><code>require<\/code> ne importas nomojn aŭtomate.<\/span> <span class=\"sg\" data-s=\"3\">Do listigu la nomon, kiun vi volas, jene: <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Poste voku <code>hello('Sam')<\/code> kaj presu la rezulton.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nun montru, kial ŝargado je rultempo estas utila.<\/span> <span class=\"sg\" data-s=\"1\">Metu la <code>require<\/code> en <code>sub MAIN<\/code> kun flago <code>--quiet<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La modulo ŝargiĝas <em>nur<\/em>, kiam vi vere volas saluton.<\/span> <span class=\"sg\" data-s=\"3\">Kun <code>--quiet<\/code>, la programo tute ne tuŝas la modulon.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi nur presas <code>Silence.<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kun la modulo sur la serĉvojo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Tempore exsecutionis onerare","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecce modulus, <code>Greeting.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Subprogramma <code>hello<\/code> exportat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Onera hunc modulum per <code>require<\/code>, non per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum programma eum <strong>tempore exsecutionis<\/strong> onerat, dum programma currit.<\/span> <span class=\"sg\" data-s=\"2\"><code>require<\/code> nomina sponte non importat.<\/span> <span class=\"sg\" data-s=\"3\">Itaque nomen quod vis enumera, sic: <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Deinde voca <code>hello('Sam')<\/code> et effectum imprime.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nunc ostende cur onerare tempore exsecutionis utile sit.<\/span> <span class=\"sg\" data-s=\"1\">Pone <code>require<\/code> intra <code>sub MAIN<\/code> cum vexillo <code>--quiet<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Programma modulum <em>solum<\/em> onerat cum salutationem re vera vis.<\/span> <span class=\"sg\" data-s=\"3\">Cum <code>--quiet<\/code>, programma modulum omnino non tangit.<\/span> <span class=\"sg\" data-s=\"4\">Tantum <code>Silence.<\/code> imprimit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma curre cum modulo in semita quaesitionis.<\/span> <span class=\"sg\" data-s=\"1\">Id imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
