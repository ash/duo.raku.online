mperature.raku 100\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>use Temperature<\/code> ŝargas la modulon. Ĝi ankaŭ importas la eksportitan subrutinon <code>c-to-f<\/code>. Do la programo povas voki ĝin rekte.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>sub MAIN($celsius)<\/code> ricevas la komandlinian argumenton. Do vi elektas la temperaturon, kiam vi rulas la programon. Ĝi ne estas fiksita en la kodo. Sen argumento, Raku aŭtomate presas uzad-mesaĝon. Ĉi tiu mesaĝo montras, kiel ruli la programon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku devas povi trovi la modulon. Do vi rulas la programon per <code>-I.<\/code>. Tiam Raku serĉas <code>Temperature.rakumod<\/code> en la nuna dosierujo. La programo ŝanĝas <code>100<\/code> °C al <code>212<\/code> °F.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Convertorem utere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma, <code>temperature.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Temperature;\n\nsub MAIN($celsius) {\n    say c-to-f($celsius);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Utrumque archivum fontem in directoria <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/use-temperature\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/use-temperature<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. temperature.raku 100\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>use Temperature<\/code> modulum onerat. Etiam subprogramma exportatum <code>c-to-f<\/code> importat. Itaque programma id directe vocare potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>sub MAIN($celsius)<\/code> argumentum lineae imperandi accipit. Itaque temperaturam eligis cum programma curris. In codice fixa non est. Sine argumento, Raku sponte nuntium usus imprimit. Hic nuntius ostendit quomodo programma curras.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku modulum invenire posse debet. Itaque programma cum <code>-I.<\/code> curris. Tum Raku <code>Temperature.rakumod<\/code> in directoria currenti quaerit. Programma <code>100<\/code> °C in <code>212<\/code> °F mutat.<\/span><\/li><\/ol>"]]}}}</script>
