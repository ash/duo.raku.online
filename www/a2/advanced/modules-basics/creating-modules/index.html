<script type="application/json" id="page-data">{"u":"advanced/modules-basics/creating-modules","n":693,"k":"topic","pv":"advanced/modules-basics","nx":"advanced/modules-basics/creating-modules/quiz","tr":["advanced","advanced/modules-basics"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Creating modules","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programs get bigger over time.<\/span> <span class=\"sg\" data-s=\"1\">Then it is good to split them into pieces.<\/span> <span class=\"sg\" data-s=\"2\">You can use these pieces again.<\/span> <span class=\"sg\" data-s=\"3\">A <em>module<\/em> is one such piece of code.<\/span> <span class=\"sg\" data-s=\"4\">It is in its own file.<\/span> <span class=\"sg\" data-s=\"5\">Other programs can load it and use it.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">A module file has the extension <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It starts with <code>unit module<\/code> and the name of the module.<\/span> <span class=\"sg\" data-s=\"2\">Normally, the subroutines in a module are private.<\/span> <span class=\"sg\" data-s=\"3\">Only the module itself can use them.<\/span> <span class=\"sg\" data-s=\"4\">Do you want to share a subroutine with other code?<\/span> <span class=\"sg\" data-s=\"5\">Mark it with the trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a module in the file <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The subroutine <code>hello<\/code> has <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So every program that uses the module can see it.<\/span> <span class=\"sg\" data-s=\"2\">A subroutine without <code>is export<\/code> stays private.<\/span> <span class=\"sg\" data-s=\"3\">Only the module itself can use it.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A module can also share data.<\/span> <span class=\"sg\" data-s=\"1\">For this, it uses <code>our<\/code> variables.<\/span> <span class=\"sg\" data-s=\"2\">Other code can get to them through the name of the module.<\/span> <span class=\"sg\" data-s=\"3\">Let’s add a version number to <code>Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">We only need one more line in the file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Now <code>Greeting.rakumod<\/code> has this line.<\/span> <span class=\"sg\" data-s=\"1\">So the value is available as <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This works everywhere the module is loaded.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next topics show <a href=\"/advanced/modules-basics/using-modules/\">how a program loads such a module<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">They also show what the program gets from it.<\/span><\/p>"]]},"de":{"t":"Module erstellen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programme werden mit der Zeit größer.<\/span> <span class=\"sg\" data-s=\"1\">Dann ist es gut, sie in Teile aufzuteilen.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst diese Teile wieder benutzen.<\/span> <span class=\"sg\" data-s=\"3\">Ein <em>Modul<\/em> ist so ein Stück Code.<\/span> <span class=\"sg\" data-s=\"4\">Es ist in einer eigenen Datei.<\/span> <span class=\"sg\" data-s=\"5\">Andere Programme können es laden und benutzen.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine Moduldatei hat die Endung <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie beginnt mit <code>unit module<\/code> und dem Namen des Moduls.<\/span> <span class=\"sg\" data-s=\"2\">Normalerweise sind die Subroutinen in einem Modul privat.<\/span> <span class=\"sg\" data-s=\"3\">Nur das Modul selbst kann sie benutzen.<\/span> <span class=\"sg\" data-s=\"4\">Willst du eine Subroutine mit anderem Code teilen?<\/span> <span class=\"sg\" data-s=\"5\">Markiere sie mit dem Trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Modul in der Datei <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine <code>hello<\/code> hat <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also kann jedes Programm, das das Modul benutzt, sie sehen.<\/span> <span class=\"sg\" data-s=\"2\">Eine Subroutine ohne <code>is export<\/code> bleibt privat.<\/span> <span class=\"sg\" data-s=\"3\">Nur das Modul selbst kann sie benutzen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Modul kann auch Daten teilen.<\/span> <span class=\"sg\" data-s=\"1\">Dafür benutzt es <code>our<\/code>-Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Anderer Code kommt über den Namen des Moduls an sie heran.<\/span> <span class=\"sg\" data-s=\"3\">Fügen wir <code>Greeting<\/code> eine Versionsnummer hinzu.<\/span> <span class=\"sg\" data-s=\"4\">Wir brauchen nur eine Zeile mehr in der Datei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jetzt hat <code>Greeting.rakumod<\/code> diese Zeile.<\/span> <span class=\"sg\" data-s=\"1\">Also ist der Wert als <code>$Greeting::version<\/code> verfügbar.<\/span> <span class=\"sg\" data-s=\"2\">Das funktioniert überall, wo das Modul geladen ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, <a href=\"https://course.raku.org/de/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">wie ein Programm so ein Modul lädt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch, was das Programm davon bekommt.<\/span><\/p>"]]},"nl":{"t":"Modules aanmaken","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programma's worden na een tijd groter.<\/span> <span class=\"sg\" data-s=\"1\">Dan is het goed om ze in stukken te verdelen.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt deze stukken opnieuw gebruiken.<\/span> <span class=\"sg\" data-s=\"3\">Een <em>module<\/em> is zo'n stuk code.<\/span> <span class=\"sg\" data-s=\"4\">Hij staat in een eigen bestand.<\/span> <span class=\"sg\" data-s=\"5\">Andere programma's kunnen hem laden en gebruiken.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Een modulebestand heeft de extensie <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het begint met <code>unit module<\/code> en de naam van de module.<\/span> <span class=\"sg\" data-s=\"2\">Normaal zijn de subroutines in een module privé.<\/span> <span class=\"sg\" data-s=\"3\">Alleen de module zelf kan ze gebruiken.<\/span> <span class=\"sg\" data-s=\"4\">Wil je een subroutine delen met andere code?<\/span> <span class=\"sg\" data-s=\"5\">Markeer hem dan met de eigenschap <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een module in het bestand <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De subroutine <code>hello<\/code> heeft <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Elk programma dat de module gebruikt, kan hem dus zien.<\/span> <span class=\"sg\" data-s=\"2\">Een subroutine zonder <code>is export<\/code> blijft privé.<\/span> <span class=\"sg\" data-s=\"3\">Alleen de module zelf kan hem gebruiken.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een module kan ook gegevens delen.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor gebruikt hij <code>our<\/code>-variabelen.<\/span> <span class=\"sg\" data-s=\"2\">Andere code kan erbij via de naam van de module.<\/span> <span class=\"sg\" data-s=\"3\">Laten we een versienummer aan <code>Greeting<\/code> toevoegen.<\/span> <span class=\"sg\" data-s=\"4\">We hebben maar één extra regel in het bestand nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nu heeft <code>Greeting.rakumod<\/code> deze regel.<\/span> <span class=\"sg\" data-s=\"1\">De waarde is dus beschikbaar als <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dit werkt overal waar de module geladen is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien <a href=\"https://course.raku.org/nl/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">hoe een programma zo'n module laadt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook zien wat het programma ervan krijgt.<\/span><\/p>"]]},"es":{"t":"Crear módulos","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Los programas crecen con el tiempo.<\/span> <span class=\"sg\" data-s=\"1\">Entonces es bueno dividirlos en piezas.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usar estas piezas otra vez.<\/span> <span class=\"sg\" data-s=\"3\">Un <em>módulo<\/em> es una de estas piezas de código.<\/span> <span class=\"sg\" data-s=\"4\">Está en su propio archivo.<\/span> <span class=\"sg\" data-s=\"5\">Otros programas pueden cargarlo y usarlo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un archivo de módulo tiene la extensión <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Empieza con <code>unit module<\/code> y el nombre del módulo.<\/span> <span class=\"sg\" data-s=\"2\">Normalmente, las subrutinas de un módulo son privadas.<\/span> <span class=\"sg\" data-s=\"3\">Solo el propio módulo puede usarlas.<\/span> <span class=\"sg\" data-s=\"4\">¿Quieres compartir una subrutina con otro código?<\/span> <span class=\"sg\" data-s=\"5\">Márcala con el trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un módulo en el archivo <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La subrutina <code>hello<\/code> tiene <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que todos los programas que usan el módulo pueden verla.<\/span> <span class=\"sg\" data-s=\"2\">Una subrutina sin <code>is export<\/code> sigue siendo privada.<\/span> <span class=\"sg\" data-s=\"3\">Solo el propio módulo puede usarla.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un módulo también puede compartir datos.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, usa variables <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Otro código puede llegar a ellas a través del nombre del módulo.<\/span> <span class=\"sg\" data-s=\"3\">Vamos a añadir un número de versión a <code>Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Solo necesitamos una línea más en el archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ahora <code>Greeting.rakumod<\/code> tiene esta línea.<\/span> <span class=\"sg\" data-s=\"1\">Así que el valor está disponible como <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto funciona en todos los sitios donde cargas el módulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran <a href=\"https://course.raku.org/es/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">cómo un programa carga un módulo así<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">También muestran qué obtiene el programa de él.<\/span><\/p>"]]},"it":{"t":"Creare moduli","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Con il tempo i programmi diventano più grandi.<\/span> <span class=\"sg\" data-s=\"1\">Allora è bene dividerli in pezzi.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare questi pezzi di nuovo.<\/span> <span class=\"sg\" data-s=\"3\">Un <em>modulo<\/em> è uno di questi pezzi di codice.<\/span> <span class=\"sg\" data-s=\"4\">Sta in un proprio file.<\/span> <span class=\"sg\" data-s=\"5\">Altri programmi possono caricarlo e usarlo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un file di modulo ha l'estensione <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Inizia con <code>unit module<\/code> e il nome del modulo.<\/span> <span class=\"sg\" data-s=\"2\">Di solito le subroutine in un modulo sono private.<\/span> <span class=\"sg\" data-s=\"3\">Solo il modulo stesso può usarle.<\/span> <span class=\"sg\" data-s=\"4\">Vuoi condividere una subroutine con altro codice?<\/span> <span class=\"sg\" data-s=\"5\">Contrassegnala con il tratto <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modulo nel file <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La subroutine <code>hello<\/code> ha <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi ogni programma che usa il modulo può vederla.<\/span> <span class=\"sg\" data-s=\"2\">Una subroutine senza <code>is export<\/code> resta privata.<\/span> <span class=\"sg\" data-s=\"3\">Solo il modulo stesso può usarla.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un modulo può anche condividere dati.<\/span> <span class=\"sg\" data-s=\"1\">Per questo usa le variabili <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Altro codice può arrivarci attraverso il nome del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Aggiungiamo un numero di versione a <code>Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Serve solo una riga in più nel file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora <code>Greeting.rakumod<\/code> ha questa riga.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il valore è disponibile come <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo funziona ovunque carichi il modulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano <a href=\"https://course.raku.org/it/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">come un programma carica un modulo così<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche cosa ottiene il programma dal modulo.<\/span><\/p>"]]},"lv":{"t":"Moduļu izveide","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Laika gaitā programmas kļūst lielākas.<\/span> <span class=\"sg\" data-s=\"1\">Tad ir labi tās sadalīt gabalos.<\/span> <span class=\"sg\" data-s=\"2\">Šos gabalus jūs varat izmantot atkal.<\/span> <span class=\"sg\" data-s=\"3\">Šādu koda gabalu sauc par <em>moduli<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Tas atrodas savā failā.<\/span> <span class=\"sg\" data-s=\"5\">Citas programmas var to ielādēt un izmantot.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Moduļa failam ir paplašinājums <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas sākas ar <code>unit module<\/code> un moduļa nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Parasti moduļa apakšprogrammas ir privātas.<\/span> <span class=\"sg\" data-s=\"3\">Tikai pats modulis var tās izmantot.<\/span> <span class=\"sg\" data-s=\"4\">Vai vēlaties apakšprogrammu kopīgot ar citu kodu?<\/span> <span class=\"sg\" data-s=\"5\">Atzīmējiet to ar iezīmi <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir modulis failā <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammai <code>hello<\/code> ir <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc to redz katra programma, kas izmanto moduli.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogramma bez <code>is export<\/code> paliek privāta.<\/span> <span class=\"sg\" data-s=\"3\">Tikai pats modulis var to izmantot.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Modulis var arī koplietot datus.<\/span> <span class=\"sg\" data-s=\"1\">Tam tas izmanto <code>our<\/code> mainīgos.<\/span> <span class=\"sg\" data-s=\"2\">Cits kods var tiem piekļūt caur moduļa nosaukumu.<\/span> <span class=\"sg\" data-s=\"3\">Pievienosim modulim <code>Greeting<\/code> versijas numuru.<\/span> <span class=\"sg\" data-s=\"4\">Mums vajag tikai vēl vienu rindu failā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad failā <code>Greeting.rakumod<\/code> ir šī rinda.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc vērtība ir pieejama kā <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas darbojas visur, kur modulis ir ielādēts.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, <a href=\"https://course.raku.org/lv/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">kā programma ielādē šādu moduli<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tie parāda arī, ko programma no tā iegūst.<\/span><\/p>"]]},"ru":{"t":"Создание модулей","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Со временем программы становятся больше.<\/span> <span class=\"sg\" data-s=\"1\">Тогда их полезно делить на части.<\/span> <span class=\"sg\" data-s=\"2\">Эти части можно использовать снова.<\/span> <span class=\"sg\" data-s=\"3\">Такая часть кода называется <em>модулем<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Она лежит в своём файле.<\/span> <span class=\"sg\" data-s=\"5\">Другие программы могут загрузить её и использовать.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">У файла модуля расширение <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он начинается с <code>unit module<\/code> и имени модуля.<\/span> <span class=\"sg\" data-s=\"2\">Обычно подпрограммы в модуле приватные.<\/span> <span class=\"sg\" data-s=\"3\">Только сам модуль может их использовать.<\/span> <span class=\"sg\" data-s=\"4\">Хотите поделиться подпрограммой с другим кодом?<\/span> <span class=\"sg\" data-s=\"5\">Пометьте её трейтом <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот модуль в файле <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У подпрограммы <code>hello<\/code> есть <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому её видит каждая программа, которая использует модуль.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмма без <code>is export<\/code> остаётся приватной.<\/span> <span class=\"sg\" data-s=\"3\">Только сам модуль может её использовать.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Модуль также может делиться данными.<\/span> <span class=\"sg\" data-s=\"1\">Для этого он использует переменные <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Другой код может получить их через имя модуля.<\/span> <span class=\"sg\" data-s=\"3\">Давайте добавим номер версии в <code>Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Нам нужна всего одна новая строка в файле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь в <code>Greeting.rakumod<\/code> есть эта строка.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому значение доступно как <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это работает везде, где программа загружает модуль.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, <a href=\"https://course.raku.org/ru/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">как программа загружает такой модуль<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, что программа из него получает.<\/span><\/p>"]]},"uk":{"t":"Створення модулів","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">З часом програми стають більшими.<\/span> <span class=\"sg\" data-s=\"1\">Тоді їх добре розбити на частини.<\/span> <span class=\"sg\" data-s=\"2\">Ці частини можна використовувати знову.<\/span> <span class=\"sg\" data-s=\"3\">Така частина коду — це <em>модуль<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Він лежить у своєму файлі.<\/span> <span class=\"sg\" data-s=\"5\">Інші програми можуть завантажити його й використати.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Файл модуля має розширення <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він починається з <code>unit module<\/code> та імені модуля.<\/span> <span class=\"sg\" data-s=\"2\">Зазвичай підпрограми в модулі приватні.<\/span> <span class=\"sg\" data-s=\"3\">Лише сам модуль може їх використовувати.<\/span> <span class=\"sg\" data-s=\"4\">Хочете поділитися підпрограмою з іншим кодом?<\/span> <span class=\"sg\" data-s=\"5\">Позначте її трейтом <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось модуль у файлі <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>hello<\/code> має <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож її бачить кожна програма, яка використовує модуль.<\/span> <span class=\"sg\" data-s=\"2\">Підпрограма без <code>is export<\/code> залишається приватною.<\/span> <span class=\"sg\" data-s=\"3\">Лише сам модуль може її використовувати.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Модуль також може ділитися даними.<\/span> <span class=\"sg\" data-s=\"1\">Для цього він використовує змінні <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Інший код може дістатися до них через ім'я модуля.<\/span> <span class=\"sg\" data-s=\"3\">Додаймо до <code>Greeting<\/code> номер версії.<\/span> <span class=\"sg\" data-s=\"4\">Нам потрібен лише ще один рядок у файлі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер у <code>Greeting.rakumod<\/code> є цей рядок.<\/span> <span class=\"sg\" data-s=\"1\">Тож значення доступне як <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це працює всюди, де ви завантажуєте модуль.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, <a href=\"https://course.raku.org/uk/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">як програма завантажує такий модуль<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Також вони показують, що програма від нього отримує.<\/span><\/p>"]]},"bg":{"t":"Създаване на модули","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">С времето програмите стават по-големи.<\/span> <span class=\"sg\" data-s=\"1\">Тогава е добре да ги разделите на части.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате тези части отново.<\/span> <span class=\"sg\" data-s=\"3\">Всеки <em>модул<\/em> е една такава част от код.<\/span> <span class=\"sg\" data-s=\"4\">Той е в свой собствен файл.<\/span> <span class=\"sg\" data-s=\"5\">Други програми могат да го заредят и да го използват.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Файлът на модула има разширение <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той започва с <code>unit module<\/code> и името на модула.<\/span> <span class=\"sg\" data-s=\"2\">Обикновено подпрограмите в модула са частни.<\/span> <span class=\"sg\" data-s=\"3\">Само самият модул може да ги използва.<\/span> <span class=\"sg\" data-s=\"4\">Искате ли да споделите подпрограма с друг код?<\/span> <span class=\"sg\" data-s=\"5\">Маркирайте я с характеристиката <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето модул във файла <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата <code>hello<\/code> има <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова всяка програма, която използва модула, може да я вижда.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограма без <code>is export<\/code> остава частна.<\/span> <span class=\"sg\" data-s=\"3\">Само самият модул може да я използва.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Модулът може да споделя и данни.<\/span> <span class=\"sg\" data-s=\"1\">За това той използва <code>our<\/code> променливи.<\/span> <span class=\"sg\" data-s=\"2\">Друг код може да стигне до тях чрез името на модула.<\/span> <span class=\"sg\" data-s=\"3\">Нека добавим номер на версия към <code>Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Трябва ни само още един ред във файла:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега <code>Greeting.rakumod<\/code> има този ред.<\/span> <span class=\"sg\" data-s=\"1\">Така стойността е достъпна като <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това работи навсякъде, където модулът е зареден.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват <a href=\"https://course.raku.org/bg/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">как програмата зарежда такъв модул<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и какво получава програмата от него.<\/span><\/p>"]]},"eo":{"t":"Krei modulojn","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programoj fariĝas pli grandaj kun la tempo.<\/span> <span class=\"sg\" data-s=\"1\">Tiam estas bone dividi ilin en pecojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi tiujn pecojn denove.<\/span> <span class=\"sg\" data-s=\"3\">La <em>modulo<\/em> estas unu tia peco de kodo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi estas en sia propra dosiero.<\/span> <span class=\"sg\" data-s=\"5\">Aliaj programoj povas ŝargi ĝin kaj uzi ĝin.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Moduldosiero havas la finaĵon <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi komenciĝas per <code>unit module<\/code> kaj la nomo de la modulo.<\/span> <span class=\"sg\" data-s=\"2\">Normale, la subprogramoj en modulo estas privataj.<\/span> <span class=\"sg\" data-s=\"3\">Nur la modulo mem povas uzi ilin.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu vi volas kunhavi subprogramon kun alia kodo?<\/span> <span class=\"sg\" data-s=\"5\">Marku ĝin per la trajto <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen modulo en la dosiero <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La subprogramo <code>hello<\/code> havas <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do ĉiu programo, kiu uzas la modulon, povas vidi ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Subprogramo sen <code>is export<\/code> restas privata.<\/span> <span class=\"sg\" data-s=\"3\">Nur la modulo mem povas uzi ĝin.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Modulo ankaŭ povas kunhavi datumojn.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, ĝi uzas <code>our<\/code>-variablojn.<\/span> <span class=\"sg\" data-s=\"2\">Alia kodo povas atingi ilin per la nomo de la modulo.<\/span> <span class=\"sg\" data-s=\"3\">Ni aldonu numeron de versio al <code>Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ni bezonas nur unu plian linion en la dosiero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun <code>Greeting.rakumod<\/code> havas ĉi tiun linion.<\/span> <span class=\"sg\" data-s=\"1\">Do la valoro estas disponebla kiel <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio funkcias ĉie, kie oni ŝargas la modulon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras <a href=\"https://course.raku.org/eo/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">kiel programo ŝargas tian modulon<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, kion la programo ricevas de ĝi.<\/span><\/p>"]]},"la":{"t":"Modulos creare","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programmata cum tempore crescunt.<\/span> <span class=\"sg\" data-s=\"1\">Tum utile est ea in partes dividere.<\/span> <span class=\"sg\" data-s=\"2\">Has partes iterum adhibere potes.<\/span> <span class=\"sg\" data-s=\"3\">Talis pars codicis est <em>modulus<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">In proprio archivo est.<\/span> <span class=\"sg\" data-s=\"5\">Alia programmata eum onerare et adhibere possunt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Archivum moduli extensionem <code>.rakumod<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Incipit a <code>unit module<\/code> et nomine moduli.<\/span> <span class=\"sg\" data-s=\"2\">Plerumque subprogrammata in modulo privata sunt.<\/span> <span class=\"sg\" data-s=\"3\">Solus modulus ipse ea adhibere potest.<\/span> <span class=\"sg\" data-s=\"4\">Visne subprogramma cum alio codice communicare?<\/span> <span class=\"sg\" data-s=\"5\">Nota id proprietate <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce modulus in archivo <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <code>hello<\/code> <code>is export<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque omne programma quod modulo utitur id videre potest.<\/span> <span class=\"sg\" data-s=\"2\">Subprogramma sine <code>is export<\/code> privatum manet.<\/span> <span class=\"sg\" data-s=\"3\">Solus modulus ipse id adhibere potest.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Modulus etiam data communicare potest.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc variabiles <code>our<\/code> adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Alius codex ad eas per nomen moduli pervenire potest.<\/span> <span class=\"sg\" data-s=\"3\">Numerum versionis ad <code>Greeting<\/code> addamus.<\/span> <span class=\"sg\" data-s=\"4\">Tantum unam lineam novam in archivo requirimus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc <code>Greeting.rakumod<\/code> hanc lineam habet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque valor ut <code>$Greeting::version<\/code> praesto est.<\/span> <span class=\"sg\" data-s=\"2\">Hoc operatur ubicumque modulum oneras.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia ostendunt <a href=\"https://course.raku.org/la/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">quomodo programma talem modulum oneret<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendunt quid programma ex eo accipiat.<\/span><\/p>"]]}}}</script>
