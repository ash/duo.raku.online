data-s=\"3\">Можливо, файл модуля лежить у тому самому каталозі, що й ваша програма.<\/span> <span class=\"sg\" data-s=\"4\">Тоді скажіть Raku шукати там за допомогою опції <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Крапка означає «поточний каталог»:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku знаходить встановлені модулі автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Про них ви дізнаєтеся пізніше, у темі <a href=\"https://course.raku.org/uk/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Встановлення модулів із мережі<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Тож опція <code>-I<\/code> потрібна лише для модулів поруч із вашою програмою.<\/span><\/p>"]]},"bg":{"t":"Използване на модули","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За да използвате модул, заредете го с оператора <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това можете да използвате имената, които модулът експортира.<\/span> <span class=\"sg\" data-s=\"2\">Все едно сте ги написали сами.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вземете файла <code>Greeting.rakumod<\/code> от предишната тема.<\/span> <span class=\"sg\" data-s=\"1\">Програмата го използва така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> има маркировката <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова операторът <code>use<\/code> я прави достъпна.<\/span> <span class=\"sg\" data-s=\"2\">Програмата я извиква директно:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku трябва да намери модула.<\/span> <span class=\"sg\" data-s=\"1\">Затова модулът трябва да е в пътя за търсене на модули.<\/span> <span class=\"sg\" data-s=\"2\">Това е списъкът с места, където Raku търси модули.<\/span> <span class=\"sg\" data-s=\"3\">Може би файлът на модула е в същата директория като вашата програма.<\/span> <span class=\"sg\" data-s=\"4\">Тогава кажете на Raku да търси там с опцията <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Точката означава „текущата директория“:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku намира инсталираните модули автоматично.<\/span> <span class=\"sg\" data-s=\"1\">За тях ще научите по-късно, в <a href=\"https://course.raku.org/bg/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Инсталиране на модули от мрежата<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>-I<\/code> ви трябва само за модули до вашата програма.<\/span><\/p>"]]},"eo":{"t":"Uzi modulojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por uzi modulon, ŝargu ĝin per la deklaro <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, vi povas uzi la nomojn, kiujn la modulo eksportas.<\/span> <span class=\"sg\" data-s=\"2\">Estas kvazaŭ vi mem skribis ilin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prenu la dosieron <code>Greeting.rakumod<\/code> el la antaŭa temo.<\/span> <span class=\"sg\" data-s=\"1\">Programo uzas ĝin jene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> havas la markon <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do la deklaro <code>use<\/code> faras ĝin disponebla.<\/span> <span class=\"sg\" data-s=\"2\">La programo vokas ĝin rekte:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku devas trovi la modulon.<\/span> <span class=\"sg\" data-s=\"1\">Do la modulo devas esti sur la modula serĉvojo.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas la listo de lokoj, kie Raku serĉas modulojn.<\/span> <span class=\"sg\" data-s=\"3\">Eble la moduldosiero estas en la sama dosierujo kiel via programo.<\/span> <span class=\"sg\" data-s=\"4\">Tiam diru al Raku serĉi tie per la opcio <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La punkto signifas \"la aktuala dosierujo\":<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku trovas instalitajn modulojn aŭtomate.<\/span> <span class=\"sg\" data-s=\"1\">Vi lernas pri ili poste, en <a href=\"https://course.raku.org/eo/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Instalado de moduloj el la reto<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Do vi bezonas <code>-I<\/code> nur por moduloj apud via programo.<\/span><\/p>"]]},"la":{"t":"Modulos utendo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut modulo utaris, eum per enuntiatum <code>use<\/code> onera.<\/span> <span class=\"sg\" data-s=\"1\">Postea nomina quae modulus exportat adhibere potes.<\/span> <span class=\"sg\" data-s=\"2\">Est quasi ea ipse scripsisses.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sume archivum <code>Greeting.rakumod<\/code> ex argumento superiore.<\/span> <span class=\"sg\" data-s=\"1\">Programma eo sic utitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> notam <code>is export<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque enuntiatum <code>use<\/code> id praesto facit.<\/span> <span class=\"sg\" data-s=\"2\">Programma id directe vocat:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku modulum invenire debet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque modulus in semita quaesitionis modulorum esse debet.<\/span> <span class=\"sg\" data-s=\"2\">Haec est series locorum ubi Raku modulos quaerit.<\/span> <span class=\"sg\" data-s=\"3\">Fortasse archivum moduli in eadem directoria est ac programma tuum.<\/span> <span class=\"sg\" data-s=\"4\">Tum Raku iube illic quaerere per optionem <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Punctum «directoriam currentem» significat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku modulos installatos sponte invenit.<\/span> <span class=\"sg\" data-s=\"1\">De eis postea disces, in <a href=\"https://course.raku.org/la/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Modulis ex rete installandis<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>-I<\/code> tantum pro modulis iuxta programma tuum requiris.<\/span><\/p>"]]}}}</script>
