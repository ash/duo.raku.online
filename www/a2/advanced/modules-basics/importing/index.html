<script type="application/json" id="page-data">{"u":"advanced/modules-basics/importing","n":697,"k":"topic","pv":"advanced/modules-basics/using-modules/quiz","nx":"advanced/modules-basics/importing/quiz","tr":["advanced","advanced/modules-basics"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Importing","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">There are several ways to bring a module into a program.<\/span> <span class=\"sg\" data-s=\"1\">Raku has three statements for this: <code>use<\/code>, <code>need<\/code>, and <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">They are different in two ways.<\/span> <span class=\"sg\" data-s=\"3\">The first is <em>when<\/em> they load the module.<\/span> <span class=\"sg\" data-s=\"4\">The second is <em>what<\/em> they give to the program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You already know <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It loads the module at compile time, before the program runs.<\/span> <span class=\"sg\" data-s=\"2\">It also imports the exported names of the module.<\/span> <span class=\"sg\" data-s=\"3\">So you can call them directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> also loads the module at compile time.<\/span> <span class=\"sg\" data-s=\"1\">But it does <em>not<\/em> import the exported names.<\/span> <span class=\"sg\" data-s=\"2\">You can still get to the <code>our<\/code> variables of the module.<\/span> <span class=\"sg\" data-s=\"3\">Use the name of the module for this:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span clas  <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie unterscheiden sich in zwei Punkten.<\/span> <span class=\"sg\" data-s=\"3\">Der erste ist, <em>wann<\/em> sie das Modul laden.<\/span> <span class=\"sg\" data-s=\"4\">Der zweite ist, <em>was<\/em> sie dem Programm geben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du kennst <code>use<\/code> schon.<\/span> <span class=\"sg\" data-s=\"1\">Es lädt das Modul zur Kompilierzeit, vor dem Start des Programms.<\/span> <span class=\"sg\" data-s=\"2\">Es importiert auch die exportierten Namen des Moduls.<\/span> <span class=\"sg\" data-s=\"3\">Also kannst du sie direkt aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> lädt das Modul auch zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"1\">Aber es importiert die exportierten Namen <em>nicht<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Du kommst trotzdem an die <code>our<\/code>-Variablen des Moduls.<\/span> <span class=\"sg\" data-s=\"3\">Benutze dafür den Namen des Moduls:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nach <code>need Greeting<\/code> funktioniert ein einfaches <code>hello(...)<\/code> nicht.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm hat nichts importiert.<\/span> <span class=\"sg\" data-s=\"2\">Nur die vollen Namen sind verfügbar, mit dem Modulnamen darin.<\/span> <span class=\"sg\" data-s=\"3\">Ein Beispiel ist <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> lädt das Modul zur <em>Laufzeit<\/em>, nicht zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"1\">Das ist in manchen Fällen nützlich.<\/span> <span class=\"sg\" data-s=\"2\">Manchmal weißt du nicht, ob du ein Modul brauchst.<\/span> <span class=\"sg\" data-s=\"3\">Du weißt es erst, wenn das Programm läuft.<\/span> <span class=\"sg\" data-s=\"4\">Zum Beispiel kann der Benutzer den Namen des Moduls eingeben.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Das Programm lädt das Modul zur Laufzeit.<\/span> <span class=\"sg\" data-s=\"1\">Also wird nichts automatisch importiert.<\/span> <span class=\"sg\" data-s=\"2\">Schreibe nach dem Namen des Moduls die Namen, die du willst.<\/span> <span class=\"sg\" data-s=\"3\">Setze sie in spitze Klammern.<\/span> <span class=\"sg\" data-s=\"4\">Dann werden sie importiert.<\/span> <span class=\"sg\" data-s=\"5\">Also kannst du sie direkt aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Meistens ist <code>use<\/code> die richtige Wahl.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> und <code>require<\/code> sind für seltenere Fälle.<\/span><\/p>"]]},"nl":{"t":"Importeren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Er zijn meerdere manieren om een module in een programma te laden.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft hiervoor drie statements: <code>use<\/code>, <code>need<\/code> en <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ze verschillen op twee punten.<\/span> <span class=\"sg\" data-s=\"3\">Het eerste is <em>wanneer<\/em> ze de module laden.<\/span> <span class=\"sg\" data-s=\"4\">Het tweede is <em>wat<\/em> ze aan het programma geven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kent <code>use<\/code> al.<\/span> <span class=\"sg\" data-s=\"1\">Het laadt de module tijdens het compileren, voordat het programma draait.<\/span> <span class=\"sg\" data-s=\"2\">Het importeert ook de geëxporteerde namen van de module.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ze dus direct aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> laadt de module ook tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"1\">Maar het importeert de geëxporteerde namen <em>niet<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt nog steeds bij de <code>our<\/code>-variabelen van de module komen.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik daarvoor de naam van de module:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Na <code>need Greeting<\/code> werkt een gewone <code>hello(...)<\/code> niet.<\/span> <span class=\"sg\" data-s=\"1\">Er is niets geïmporteerd.<\/span> <span class=\"sg\" data-s=\"2\">Alleen de volledige namen zijn beschikbaar, met de naam van de module erin.<\/span> <span class=\"sg\" data-s=\"3\">Een voorbeeld is <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> laadt de module tijdens de <em>uitvoering<\/em>, niet tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"1\">Dat is in sommige gevallen handig.<\/span> <span class=\"sg\" data-s=\"2\">Soms weet je niet of je een module nodig hebt.<\/span> <span class=\"sg\" data-s=\"3\">Dat weet je pas als het programma draait.<\/span> <span class=\"sg\" data-s=\"4\">De gebruiker kan bijvoorbeeld de naam van de module invoeren.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Het laden gebeurt tijdens de uitvoering.<\/span> <span class=\"sg\" data-s=\"1\">Daarom importeert Raku niets automatisch.<\/span> <span class=\"sg\" data-s=\"2\">Schrijf na de naam van de module de namen die je wilt.<\/span> <span class=\"sg\" data-s=\"3\">Zet ze tussen punthaken.<\/span> <span class=\"sg\" data-s=\"4\">Dan importeert Raku ze.<\/span> <span class=\"sg\" data-s=\"5\">Zo kun je ze direct aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Meestal is <code>use<\/code> de juiste keuze.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> en <code>require<\/code> zijn voor minder gewone gevallen.<\/span><\/p>"]]},"es":{"t":"Importar","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Hay varias formas de traer un módulo a un programa.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene tres instrucciones para esto: <code>use<\/code>, <code>need<\/code> y <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Son diferentes en dos cosas.<\/span> <span class=\"sg\" data-s=\"3\">La primera es <em>cuándo<\/em> cargan el módulo.<\/span> <span class=\"sg\" data-s=\"4\">La segunda es <em>qué<\/em> dan al programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ya conoces <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Carga el módulo en tiempo de compilación, antes de ejecutar el programa.<\/span> <span class=\"sg\" data-s=\"2\">También importa los nombres exportados del módulo.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes llamarlos directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> también carga el módulo en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">Pero <em>no<\/em> importa los nombres exportados.<\/span> <span class=\"sg\" data-s=\"2\">Aun así, puedes llegar a las variables <code>our<\/code> del módulo.<\/span> <span class=\"sg\" data-s=\"3\">Para esto, usa el nombre del módulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Después de <code>need Greeting<\/code>, un simple <code>hello(...)<\/code> no funciona.<\/span> <span class=\"sg\" data-s=\"1\">No se importó nada.<\/span> <span class=\"sg\" data-s=\"2\">Solo están disponibles los nombres completos, con el nombre del módulo dentro.<\/span> <span class=\"sg\" data-s=\"3\">Un ejemplo es <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> carga el módulo en <em>tiempo de ejecución<\/em>, no en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil en algunos casos.<\/span> <span class=\"sg\" data-s=\"2\">A veces no sabes si necesitas un módulo.<\/span> <span class=\"sg\" data-s=\"3\">Solo lo sabes cuando el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, el usuario puede escribir el nombre del módulo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El módulo se carga en tiempo de ejecución.<\/span> <span class=\"sg\" data-s=\"1\">Así que no se importa nada automáticamente.<\/span> <span class=\"sg\" data-s=\"2\">Después del nombre del módulo, escribe los nombres que quieres.<\/span> <span class=\"sg\" data-s=\"3\">Ponlos entre corchetes angulares.<\/span> <span class=\"sg\" data-s=\"4\">Entonces Raku los importa.<\/span> <span class=\"sg\" data-s=\"5\">Así que puedes llamarlos directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Normalmente, <code>use<\/code> es la opción correcta.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> y <code>require<\/code> son para casos menos comunes.<\/span><\/p>"]]},"it":{"t":"Importazione","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ci sono più modi per portare un modulo in un programma.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha tre istruzioni per questo: <code>use<\/code>, <code>need<\/code> e <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sono diverse in due cose.<\/span> <span class=\"sg\" data-s=\"3\">La prima è <em>quando<\/em> caricano il modulo.<\/span> <span class=\"sg\" data-s=\"4\">La seconda è <em>cosa<\/em> danno al programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Conosci già <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Carica il modulo al momento della compilazione, prima dell'esecuzione del programma.<\/span> <span class=\"sg\" data-s=\"2\">Importa anche i nomi esportati del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi chiamarli direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Anche <code>need<\/code> carica il modulo al momento della compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Ma <em>non<\/em> importa i nomi esportati.<\/span> <span class=\"sg\" data-s=\"2\">Puoi comunque arrivare alle variabili <code>our<\/code> del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Per questo usa il nome del modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dopo <code>need Greeting<\/code>, un semplice <code>hello(...)<\/code> non funziona.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> non ha importato niente.<\/span> <span class=\"sg\" data-s=\"2\">Sono disponibili solo i nomi completi, con dentro il nome del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Un esempio è <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> carica il modulo a <em>tempo di esecuzione<\/em>, non al momento della compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Questo è utile in alcuni casi.<\/span> <span class=\"sg\" data-s=\"2\">A volte non sai se ti serve un modulo.<\/span> <span class=\"sg\" data-s=\"3\">Lo sai solo quando il programma è in esecuzione.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, l'utente può scrivere il nome del modulo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il modulo si carica a tempo di esecuzione.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>require<\/code> non importa niente automaticamente.<\/span> <span class=\"sg\" data-s=\"2\">Dopo il nome del modulo, scrivi i nomi che vuoi.<\/span> <span class=\"sg\" data-s=\"3\">Mettili tra parentesi angolari.<\/span> <span class=\"sg\" data-s=\"4\">Allora <code>require<\/code> li importa.<\/span> <span class=\"sg\" data-s=\"5\">Così puoi chiamarli direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Di solito <code>use<\/code> è la scelta giusta.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> e <code>require<\/code> sono per i casi meno comuni.<\/span><\/p>"]]},"lv":{"t":"Importēšana","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ir vairāki veidi, kā ienest moduli programmā.<\/span> <span class=\"sg\" data-s=\"1\">Raku tam ir trīs teikumi: <code>use<\/code>, <code>need<\/code> un <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tie atšķiras divos veidos.<\/span> <span class=\"sg\" data-s=\"3\">Pirmais ir tas, <em>kad<\/em> tie ielādē moduli.<\/span> <span class=\"sg\" data-s=\"4\">Otrais ir tas, <em>ko<\/em> tie dod programmai.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ielādē moduli kompilēšanas laikā, pirms programma darbojas.<\/span> <span class=\"sg\" data-s=\"2\">Tas arī importē moduļa eksportētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat tos izsaukt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Arī <code>need<\/code> ielādē moduli kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Bet tas <em>neimportē<\/em> eksportētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"2\">Jūs joprojām varat piekļūt moduļa <code>our<\/code> mainīgajiem.<\/span> <span class=\"sg\" data-s=\"3\">Tam izmantojiet moduļa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pēc <code>need Greeting<\/code> vienkāršs <code>hello(...)<\/code> nedarbojas.<\/span> <span class=\"sg\" data-s=\"1\">Nekas nav importēts.<\/span> <span class=\"sg\" data-s=\"2\">Pieejami ir tikai pilnie nosaukumi ar moduļa nosaukumu.<\/span> <span class=\"sg\" data-s=\"3\">Piemērs ir <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> ielādē moduli <em>izpildes laikā<\/em>, nevis kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Dažos gadījumos tas noder.<\/span> <span class=\"sg\" data-s=\"2\">Dažreiz jūs nezināt, vai jums vajag moduli.<\/span> <span class=\"sg\" data-s=\"3\">To jūs uzzināt tikai tad, kad programma darbojas.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, lietotājs var ievadīt moduļa nosaukumu.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Modulis ielādējas izpildes laikā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc nekas netiek importēts automātiski.<\/span> <span class=\"sg\" data-s=\"2\">Aiz moduļa nosaukuma uzrakstiet vajadzīgos nosaukumus.<\/span> <span class=\"sg\" data-s=\"3\">Ielieciet tos leņķa iekavās.<\/span> <span class=\"sg\" data-s=\"4\">Tad tie tiek importēti.<\/span> <span class=\"sg\" data-s=\"5\">Tātad jūs varat tos izsaukt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parasti <code>use<\/code> ir pareizā izvēle.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> un <code>require<\/code> ir retākiem gadījumiem.<\/span><\/p>"]]},"ru":{"t":"Импорт","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Есть несколько способов подключить модуль к программе.<\/span> <span class=\"sg\" data-s=\"1\">Для этого в Raku есть три инструкции: <code>use<\/code>, <code>need<\/code> и <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Между ними два отличия.<\/span> <span class=\"sg\" data-s=\"3\">Первое — <em>когда<\/em> они загружают модуль.<\/span> <span class=\"sg\" data-s=\"4\">Второе — <em>что<\/em> они дают программе.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он загружает модуль во время компиляции, до запуска программы.<\/span> <span class=\"sg\" data-s=\"2\">Ещё он импортирует экспортированные имена модуля.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому их можно вызывать напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> тоже загружает модуль во время компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Но он <em>не<\/em> импортирует экспортированные имена.<\/span> <span class=\"sg\" data-s=\"2\">Переменные <code>our<\/code> модуля всё равно вам доступны.<\/span> <span class=\"sg\" data-s=\"3\">Для этого используйте имя модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">После <code>need Greeting<\/code> простой вызов <code>hello(...)<\/code> не работает.<\/span> <span class=\"sg\" data-s=\"1\">Ничего не импортировано.<\/span> <span class=\"sg\" data-s=\"2\">Доступны только полные имена, с именем модуля внутри.<\/span> <span class=\"sg\" data-s=\"3\">Например, <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> загружает модуль <em>во время выполнения<\/em>, а не во время компиляции.<\/span> <span class=\"sg\" data-s=\"1\">В некоторых случаях это полезно.<\/span> <span class=\"sg\" data-s=\"2\">Бывает, что вы не знаете, нужен ли модуль.<\/span> <span class=\"sg\" data-s=\"3\">Вы узнаёте это только во время работы программы.<\/span> <span class=\"sg\" data-s=\"4\">Например, имя модуля может ввести пользователь.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Модуль загружается во время выполнения.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому ничего не импортируется автоматически.<\/span> <span class=\"sg\" data-s=\"2\">После имени модуля напишите нужные имена.<\/span> <span class=\"sg\" data-s=\"3\">Возьмите их в угловые скобки.<\/span> <span class=\"sg\" data-s=\"4\">Тогда Raku их импортирует.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому их можно вызывать напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обычно <code>use<\/code> — правильный выбор.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> и <code>require<\/code> нужны для более редких случаев.<\/span><\/p>"]]},"uk":{"t":"Імпортування","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Є кілька способів внести модуль у програму.<\/span> <span class=\"sg\" data-s=\"1\">Для цього в Raku є три оператори: <code>use<\/code>, <code>need<\/code> і <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вони відрізняються двома речами.<\/span> <span class=\"sg\" data-s=\"3\">Перша — <em>коли<\/em> вони завантажують модуль.<\/span> <span class=\"sg\" data-s=\"4\">Друга — <em>що<\/em> вони дають програмі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він завантажує модуль під час компіляції, ще до запуску програми.<\/span> <span class=\"sg\" data-s=\"2\">Також він імпортує експортовані імена модуля.<\/span> <span class=\"sg\" data-s=\"3\">Тож їх можна викликати напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> теж завантажує модуль під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Але він <em>не<\/em> імпортує експортовані імена.<\/span> <span class=\"sg\" data-s=\"2\">До змінних <code>our<\/code> модуля ви все одно можете дістатися.<\/span> <span class=\"sg\" data-s=\"3\">Для цього використайте ім'я модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Після <code>need Greeting<\/code> простий <code>hello(...)<\/code> не працює.<\/span> <span class=\"sg\" data-s=\"1\">Програма нічого не імпортувала.<\/span> <span class=\"sg\" data-s=\"2\">Доступні лише повні імена, з ім'ям модуля в них.<\/span> <span class=\"sg\" data-s=\"3\">Приклад — <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> завантажує модуль <em>під час виконання<\/em>, а не під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Це корисно в деяких випадках.<\/span> <span class=\"sg\" data-s=\"2\">Іноді ви не знаєте, чи потрібен вам модуль.<\/span> <span class=\"sg\" data-s=\"3\">Ви дізнаєтеся це лише тоді, коли програма працює.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, користувач може ввести ім'я модуля.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Модуль завантажується під час виконання.<\/span> <span class=\"sg\" data-s=\"1\">Тож нічого не імпортується автоматично.<\/span> <span class=\"sg\" data-s=\"2\">Після імені модуля напишіть потрібні імена.<\/span> <span class=\"sg\" data-s=\"3\">Візьміть їх у кутові дужки.<\/span> <span class=\"sg\" data-s=\"4\">Тоді вони імпортуються.<\/span> <span class=\"sg\" data-s=\"5\">Тож їх можна викликати напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зазвичай <code>use<\/code> — правильний вибір.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> і <code>require<\/code> — для рідших випадків.<\/span><\/p>"]]},"bg":{"t":"Импортиране","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Има няколко начина да внесете модул в програма.<\/span> <span class=\"sg\" data-s=\"1\">Raku има три оператора за това: <code>use<\/code>, <code>need<\/code> и <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Те се различават по две неща.<\/span> <span class=\"sg\" data-s=\"3\">Първото е <em>кога<\/em> зареждат модула.<\/span> <span class=\"sg\" data-s=\"4\">Второто е <em>какво<\/em> дават на програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вече знаете <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той зарежда модула по време на компилация, преди програмата да започне работа.<\/span> <span class=\"sg\" data-s=\"2\">Освен това импортира експортираните имена на модула.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да ги извиквате директно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> също зарежда модула по време на компилация.<\/span> <span class=\"sg\" data-s=\"1\">Но той <em>не<\/em> импортира експортираните имена.<\/span> <span class=\"sg\" data-s=\"2\">Пак можете да стигнете до <code>our<\/code> променливите на модула.<\/span> <span class=\"sg\" data-s=\"3\">За това използвайте името на модула:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">След <code>need Greeting<\/code> извикване като <code>hello(...)<\/code> не работи.<\/span> <span class=\"sg\" data-s=\"1\">Нищо не е импортирано.<\/span> <span class=\"sg\" data-s=\"2\">Достъпни са само пълните имена, с името на модула в тях.<\/span> <span class=\"sg\" data-s=\"3\">Пример за това е <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> зарежда модула по <em>време на изпълнение<\/em>, а не по време на компилация.<\/span> <span class=\"sg\" data-s=\"1\">Това е полезно в някои случаи.<\/span> <span class=\"sg\" data-s=\"2\">Понякога не знаете дали ви трябва модул.<\/span> <span class=\"sg\" data-s=\"3\">Разбирате го едва когато програмата работи.<\/span> <span class=\"sg\" data-s=\"4\">Например потребителят може да въведе името на модула.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Модулът се зарежда по време на изпълнение.<\/span> <span class=\"sg\" data-s=\"1\">Затова нищо не се импортира автоматично.<\/span> <span class=\"sg\" data-s=\"2\">След името на модула напишете имената, които искате.<\/span> <span class=\"sg\" data-s=\"3\">Сложете ги в ъглови скоби.<\/span> <span class=\"sg\" data-s=\"4\">Тогава те се импортират.<\/span> <span class=\"sg\" data-s=\"5\">Така можете да ги извиквате директно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обикновено <code>use<\/code> е правилният избор.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> и <code>require<\/code> са за по-редки случаи.<\/span><\/p>"]]},"eo":{"t":"Importado","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Estas pluraj manieroj alporti modulon en programon.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas tri deklarojn por tio: <code>use<\/code>, <code>need<\/code> kaj <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas malsamaj laŭ du aferoj.<\/span> <span class=\"sg\" data-s=\"3\">La unua estas, <em>kiam<\/em> ili ŝargas la modulon.<\/span> <span class=\"sg\" data-s=\"4\">La dua estas, <em>kion<\/em> ili donas al la programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ŝargas la modulon je kompiltempo, antaŭ ol la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ importas la eksportitajn nomojn de la modulo.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas voki ilin rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> ankaŭ ŝargas la modulon je kompiltempo.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi <em>ne<\/em> importas la eksportitajn nomojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi tamen povas atingi la <code>our<\/code>-variablojn de la modulo.<\/span> <span class=\"sg\" data-s=\"3\">Uzu la nomon de la modulo por tio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Post <code>need Greeting<\/code>, simpla <code>hello(...)<\/code> ne funkcias.<\/span> <span class=\"sg\" data-s=\"1\">La programo importis nenion.<\/span> <span class=\"sg\" data-s=\"2\">Nur la plenaj nomoj estas disponeblaj, kun la nomo de la modulo en ili.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemplo estas <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> ŝargas la modulon je <em>rultempo<\/em>, ne je kompiltempo.<\/span> <span class=\"sg\" data-s=\"1\">Tio utilas en kelkaj kazoj.<\/span> <span class=\"sg\" data-s=\"2\">Foje vi ne scias, ĉu vi bezonas modulon.<\/span> <span class=\"sg\" data-s=\"3\">Vi scias tion nur, kiam la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, la uzanto eble enigas la nomon de la modulo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La modulo ŝargiĝas je rultempo.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku importas nenion aŭtomate.<\/span> <span class=\"sg\" data-s=\"2\">Post la nomo de la modulo, skribu la nomojn, kiujn vi volas.<\/span> <span class=\"sg\" data-s=\"3\">Metu ilin en angulajn krampojn.<\/span> <span class=\"sg\" data-s=\"4\">Tiam Raku importas ilin.<\/span> <span class=\"sg\" data-s=\"5\">Do vi povas voki ilin rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kutime, <code>use<\/code> estas la ĝusta elekto.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> kaj <code>require<\/code> estas por malpli oftaj kazoj.<\/span><\/p>"]]},"la":{"t":"Importare","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Modulum pluribus modis in programma adducere potes.<\/span> <span class=\"sg\" data-s=\"1\">Raku tria enuntiata ad hoc habet: <code>use<\/code>, <code>need<\/code> et <code>require<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Duobus modis differunt.<\/span> <span class=\"sg\" data-s=\"3\">Primus est <em>quando<\/em> modulum onerant.<\/span> <span class=\"sg\" data-s=\"4\">Secundus est <em>quid<\/em> programmati dant.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Iam <code>use<\/code> nosti.<\/span> <span class=\"sg\" data-s=\"1\">Modulum tempore compilationis onerat, antequam programma currit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam nomina exportata moduli importat.<\/span> <span class=\"sg\" data-s=\"3\">Itaque ea directe vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> quoque modulum tempore compilationis onerat.<\/span> <span class=\"sg\" data-s=\"1\">Sed nomina exportata <em>non<\/em> importat.<\/span> <span class=\"sg\" data-s=\"2\">Tamen ad variabiles <code>our<\/code> moduli pervenire potes.<\/span> <span class=\"sg\" data-s=\"3\">Ad hoc nomine moduli utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Post <code>need Greeting<\/code>, simplex <code>hello(...)<\/code> non operatur.<\/span> <span class=\"sg\" data-s=\"1\">Nihil importatum est.<\/span> <span class=\"sg\" data-s=\"2\">Sola nomina plena praesto sunt, cum nomine moduli in eis.<\/span> <span class=\"sg\" data-s=\"3\">Exemplum est <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> modulum <em>tempore exsecutionis<\/em> onerat, non tempore compilationis.<\/span> <span class=\"sg\" data-s=\"1\">Hoc in quibusdam casibus utile est.<\/span> <span class=\"sg\" data-s=\"2\">Interdum nescis an modulum requiras.<\/span> <span class=\"sg\" data-s=\"3\">Id solum scis cum programma currit.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, utens nomen moduli inscribere potest.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Programma modulum tempore exsecutionis onerat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque nihil sponte importatur.<\/span> <span class=\"sg\" data-s=\"2\">Post nomen moduli, nomina quae vis scribe.<\/span> <span class=\"sg\" data-s=\"3\">Ea in uncis angularibus pone.<\/span> <span class=\"sg\" data-s=\"4\">Tum importantur.<\/span> <span class=\"sg\" data-s=\"5\">Itaque ea directe vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plerumque <code>use<\/code> est recta electio.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> et <code>require<\/code> sunt pro casibus rarioribus.<\/span><\/p>"]]}}}</script>
