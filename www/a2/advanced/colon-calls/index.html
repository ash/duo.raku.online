<script type="application/json" id="page-data">{"u":"advanced/colon-calls","n":647,"k":"section","pv":"advanced/whatever/quiz","nx":"advanced/colon-calls/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Calling with a colon","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Usually, the arguments of a method or a subroutine are in parentheses: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku has a second way.<\/span> <span class=\"sg\" data-s=\"2\">Put a <strong>colon<\/strong> after the name.<\/span> <span class=\"sg\" data-s=\"3\">Everything after the colon becomes the list of arguments.<\/span> <span class=\"sg\" data-s=\"4\">You need no parentheses at all:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The colon in <code>grep:<\/code> does the same work as parentheses.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> means exactly the same as <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You can use either form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The colon form is nicest with some methods.<\/span> <span class=\"sg\" data-s=\"1\">They take a <strong>block<\/strong> or a <a href=\"/advanced/whatever/\">Whatever<\/a> expression.<\/span> <span class=\"sg\" data-s=\"2\">The colon removes one level of brackets.<\/span> <span class=\"sg\" data-s=\"3\">Compare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses around the block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — no closing paren to match<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Both lines print <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But the version with the colon is easier to read.<\/span> <span class=\"sg\" data-s=\"2\">This is even more true for a long block.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">You already know calls without parentheses.<\/span> <span class=\"sg\" data-s=\"1\">You use them with list operators, like <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">There, <code>say<\/code> takes everything after it as its arguments.<\/span> <span class=\"sg\" data-s=\"3\">The colon form is the same idea for methods.<\/span> <span class=\"sg\" data-s=\"4\">Remember one rule.<\/span> <span class=\"sg\" data-s=\"5\">The colon form takes the <strong>rest of the statement<\/strong> as arguments.<\/span> <span class=\"sg\" data-s=\"6\">So it must be at the <strong>end<\/strong> of a chain of calls.<\/span> <span class=\"sg\" data-s=\"7\">That is why <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> works.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> is the last call.<\/span> <span class=\"sg\" data-s=\"9\">Nothing comes after it in the chain.<\/span> <span class=\"sg\" data-s=\"10\">Do you need to call more methods?<\/span> <span class=\"sg\" data-s=\"11\">Then use the form with parentheses.<\/span> <span class=\"sg\" data-s=\"12\">Or group the parts of the whole expression with parentheses.<\/span> <span class=\"sg\" data-s=\"13\">This makes the code clear:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Be careful with one thing.<\/span> <span class=\"sg\" data-s=\"1\">Do not use the colon <strong>and<\/strong> parentheses together, like <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, <code>:( … )<\/code> means something else.<\/span> <span class=\"sg\" data-s=\"3\">It is a signature, written as a value.<\/span> <span class=\"sg\" data-s=\"4\">So Raku cannot read this code.<\/span> <span class=\"sg\" data-s=\"5\">Use either <code>.grep( … )<\/code> or <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Use one of them, not both.<\/span><\/p>"]]},"de":{"t":"Aufruf mit Doppelpunkt","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalerweise stehen die Argumente einer Methode oder Subroutine in Klammern: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat noch einen zweiten Weg.<\/span> <span class=\"sg\" data-s=\"2\">Setze einen <strong>Doppelpunkt<\/strong> nach dem Namen.<\/span> <span class=\"sg\" data-s=\"3\">Alles nach dem Doppelpunkt wird zur Liste der Argumente.<\/span> <span class=\"sg\" data-s=\"4\">Du brauchst gar keine Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Doppelpunkt in <code>grep:<\/code> macht dasselbe wie Klammern.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> bedeutet genau dasselbe wie <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst jede der beiden Formen benutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Doppelpunkt-Form ist bei manchen Methoden am schönsten.<\/span> <span class=\"sg\" data-s=\"1\">Diese Methoden nehmen einen <strong>Block<\/strong> oder einen <a href=\"https://course.raku.org/de/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-Ausdruck.<\/span> <span class=\"sg\" data-s=\"2\">Der Doppelpunkt spart eine Ebene von Klammern.<\/span> <span class=\"sg\" data-s=\"3\">Vergleiche:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # Klammern um den Block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # Doppelpunkt — keine schließende Klammer nötig<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide Zeilen geben <code>(3 2 1)<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Aber die Version mit dem Doppelpunkt ist leichter zu lesen.<\/span> <span class=\"sg\" data-s=\"2\">Bei einem langen Block gilt das noch mehr.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Aufrufe ohne Klammern kennst du schon.<\/span> <span class=\"sg\" data-s=\"1\">Du benutzt sie bei Listenoperatoren wie <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dort nimmt <code>say<\/code> alles danach als seine Argumente.<\/span> <span class=\"sg\" data-s=\"3\">Die Doppelpunkt-Form ist dieselbe Idee für Methoden.<\/span> <span class=\"sg\" data-s=\"4\">Merke dir eine Regel.<\/span> <span class=\"sg\" data-s=\"5\">Die Doppelpunkt-Form nimmt den <strong>Rest der Anweisung<\/strong> als Argumente.<\/span> <span class=\"sg\" data-s=\"6\">Also muss sie am <strong>Ende<\/strong> einer Kette von Aufrufen stehen.<\/span> <span class=\"sg\" data-s=\"7\">Deshalb funktioniert <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> ist der letzte Aufruf.<\/span> <span class=\"sg\" data-s=\"9\">In der Kette kommt nichts mehr danach.<\/span> <span class=\"sg\" data-s=\"10\">Musst du noch mehr Methoden aufrufen?<\/span> <span class=\"sg\" data-s=\"11\">Dann benutze die Form mit Klammern.<\/span> <span class=\"sg\" data-s=\"12\">Oder gruppiere die Teile des ganzen Ausdrucks mit Klammern.<\/span> <span class=\"sg\" data-s=\"13\">So wird der Code klar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Pass bei einer Sache auf.<\/span> <span class=\"sg\" data-s=\"1\">Benutze den Doppelpunkt <strong>und<\/strong> Klammern nicht zusammen, wie in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku bedeutet <code>:( … )<\/code> etwas anderes.<\/span> <span class=\"sg\" data-s=\"3\">Das ist eine Signatur, als Wert geschrieben.<\/span> <span class=\"sg\" data-s=\"4\">Also kann Raku diesen Code nicht lesen.<\/span> <span class=\"sg\" data-s=\"5\">Benutze entweder <code>.grep( … )<\/code> oder <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Benutze eins davon, nicht beide.<\/span><\/p>"]]},"nl":{"t":"Aanroepen met een dubbele punt","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Meestal staan de argumenten van een methode of een subroutine tussen haakjes: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft een tweede manier.<\/span> <span class=\"sg\" data-s=\"2\">Zet een <strong>dubbele punt<\/strong> na de naam.<\/span> <span class=\"sg\" data-s=\"3\">Alles na de dubbele punt wordt de lijst van argumenten.<\/span> <span class=\"sg\" data-s=\"4\">Je hebt helemaal geen haakjes nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De dubbele punt in <code>grep:<\/code> doet hetzelfde werk als haakjes.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> betekent precies hetzelfde als <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt beide vormen gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De dubbele-puntvorm is het prettigst bij sommige methoden.<\/span> <span class=\"sg\" data-s=\"1\">Die krijgen een <strong>blok<\/strong> of een <a href=\"https://course.raku.org/nl/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-expressie.<\/span> <span class=\"sg\" data-s=\"2\">De dubbele punt haalt een laag haakjes weg.<\/span> <span class=\"sg\" data-s=\"3\">Vergelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # haakjes om het blok\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dubbele punt — geen sluithaakje nodig<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beide regels printen <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar de versie met de dubbele punt leest makkelijker.<\/span> <span class=\"sg\" data-s=\"2\">Bij een lang blok geldt dat nog meer.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Je kent al aanroepen zonder haakjes.<\/span> <span class=\"sg\" data-s=\"1\">Je gebruikt ze bij lijstoperatoren, zoals <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Daar neemt <code>say<\/code> alles erna als zijn argumenten.<\/span> <span class=\"sg\" data-s=\"3\">De dubbele-puntvorm is hetzelfde idee voor methoden.<\/span> <span class=\"sg\" data-s=\"4\">Onthoud één regel.<\/span> <span class=\"sg\" data-s=\"5\">De dubbele-puntvorm neemt de <strong>rest van de instructie<\/strong> als argumenten.<\/span> <span class=\"sg\" data-s=\"6\">Dus moet hij aan het <strong>einde<\/strong> van een keten van aanroepen staan.<\/span> <span class=\"sg\" data-s=\"7\">Daarom werkt <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> is de laatste aanroep.<\/span> <span class=\"sg\" data-s=\"9\">Daarna komt niets meer in de keten.<\/span> <span class=\"sg\" data-s=\"10\">Moet je meer methoden aanroepen?<\/span> <span class=\"sg\" data-s=\"11\">Gebruik dan de vorm met haakjes.<\/span> <span class=\"sg\" data-s=\"12\">Of groepeer de delen van de hele expressie met haakjes.<\/span> <span class=\"sg\" data-s=\"13\">Dat maakt de code duidelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Let op één ding.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik de dubbele punt <strong>en<\/strong> haakjes niet samen, zoals <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku betekent <code>:( … )<\/code> iets anders.<\/span> <span class=\"sg\" data-s=\"3\">Het is een signatuur, geschreven als waarde.<\/span> <span class=\"sg\" data-s=\"4\">Dus kan Raku deze code niet lezen.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik ofwel <code>.grep( … )<\/code> ofwel <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Gebruik een van beide, niet allebei.<\/span><\/p>"]]},"es":{"t":"Llamadas con dos puntos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalmente, los argumentos de un método o una subrutina van entre paréntesis: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene una segunda forma.<\/span> <span class=\"sg\" data-s=\"2\">Pon <strong>dos puntos<\/strong> después del nombre.<\/span> <span class=\"sg\" data-s=\"3\">Todo lo que sigue a los dos puntos es la lista de argumentos.<\/span> <span class=\"sg\" data-s=\"4\">No necesitas ningún paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los dos puntos en <code>grep:<\/code> hacen el mismo trabajo que los paréntesis.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> significa exactamente lo mismo que <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usar cualquiera de las dos formas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La forma con dos puntos es más agradable con algunos métodos.<\/span> <span class=\"sg\" data-s=\"1\">Esos métodos reciben un <strong>bloque<\/strong> o una expresión <a href=\"https://course.raku.org/es/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Los dos puntos quitan un nivel de paréntesis.<\/span> <span class=\"sg\" data-s=\"3\">Compara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentesis alrededor del bloque\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dos puntos — sin parentesis de cierre que emparejar<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Las dos líneas imprimen <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero la versión con dos puntos es más fácil de leer.<\/span> <span class=\"sg\" data-s=\"2\">Esto es aún más cierto con un bloque largo.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Ya conoces las llamadas sin paréntesis.<\/span> <span class=\"sg\" data-s=\"1\">Las usas con operadores de lista, como <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ahí, <code>say<\/code> toma todo lo que va detrás como sus argumentos.<\/span> <span class=\"sg\" data-s=\"3\">La forma con dos puntos es la misma idea para los métodos.<\/span> <span class=\"sg\" data-s=\"4\">Recuerda una regla.<\/span> <span class=\"sg\" data-s=\"5\">La forma con dos puntos toma el <strong>resto de la sentencia<\/strong> como argumentos.<\/span> <span class=\"sg\" data-s=\"6\">Así que debe estar al <strong>final<\/strong> de una cadena de llamadas.<\/span> <span class=\"sg\" data-s=\"7\">Por eso funciona <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> es la última llamada.<\/span> <span class=\"sg\" data-s=\"9\">Nada va después de ella en la cadena.<\/span> <span class=\"sg\" data-s=\"10\">¿Necesitas llamar a más métodos?<\/span> <span class=\"sg\" data-s=\"11\">Entonces usa la forma con paréntesis.<\/span> <span class=\"sg\" data-s=\"12\">O agrupa con paréntesis las partes de toda la expresión.<\/span> <span class=\"sg\" data-s=\"13\">Así el código queda claro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ten cuidado con una cosa.<\/span> <span class=\"sg\" data-s=\"1\">No uses los dos puntos <strong>y<\/strong> paréntesis juntos, como <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, <code>:( … )<\/code> significa otra cosa.<\/span> <span class=\"sg\" data-s=\"3\">Es una firma, escrita como un valor.<\/span> <span class=\"sg\" data-s=\"4\">Así que Raku no puede leer este código.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>.grep( … )<\/code> o <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Usa una de las dos formas, pero no las dos.<\/span><\/p>"]]},"it":{"t":"Chiamate con i due punti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Di solito gli argomenti di un metodo o di una subroutine sono tra parentesi: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha un secondo modo.<\/span> <span class=\"sg\" data-s=\"2\">Metti i <strong>due punti<\/strong> dopo il nome.<\/span> <span class=\"sg\" data-s=\"3\">Tutto quello che viene dopo i due punti diventa la lista degli argomenti.<\/span> <span class=\"sg\" data-s=\"4\">Non ti serve nessuna parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I due punti in <code>grep:<\/code> fanno lo stesso lavoro delle parentesi.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> significa esattamente la stessa cosa di <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare l'una o l'altra forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La forma con i due punti è più comoda con alcuni metodi.<\/span> <span class=\"sg\" data-s=\"1\">Questi metodi prendono un <strong>blocco<\/strong> o un'espressione <a href=\"https://course.raku.org/it/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">I due punti tolgono un livello di parentesi.<\/span> <span class=\"sg\" data-s=\"3\">Confronta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentesi attorno al blocco\nsay @a.sort: { $^b &lt;=&gt; $^a }; # due punti — nessuna parentesi di chiusura da abbinare<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Entrambe le righe stampano <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma la versione con i due punti si legge più facilmente.<\/span> <span class=\"sg\" data-s=\"2\">Questo vale ancora di più per un blocco lungo.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Conosci già le chiamate senza parentesi.<\/span> <span class=\"sg\" data-s=\"1\">Le usi con gli operatori di lista, come <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lì <code>say<\/code> prende come argomenti tutto quello che viene dopo.<\/span> <span class=\"sg\" data-s=\"3\">La forma con i due punti è la stessa idea per i metodi.<\/span> <span class=\"sg\" data-s=\"4\">Ricorda una regola.<\/span> <span class=\"sg\" data-s=\"5\">La forma con i due punti prende il <strong>resto dell'istruzione<\/strong> come argomenti.<\/span> <span class=\"sg\" data-s=\"6\">Quindi deve stare alla <strong>fine<\/strong> di una catena di chiamate.<\/span> <span class=\"sg\" data-s=\"7\">Per questo <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> funziona.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> è l'ultima chiamata.<\/span> <span class=\"sg\" data-s=\"9\">Dopo questa chiamata non c'è niente nella catena.<\/span> <span class=\"sg\" data-s=\"10\">Devi chiamare altri metodi?<\/span> <span class=\"sg\" data-s=\"11\">Allora usa la forma con le parentesi.<\/span> <span class=\"sg\" data-s=\"12\">Oppure raggruppa con le parentesi le parti di tutta l'espressione.<\/span> <span class=\"sg\" data-s=\"13\">Così il codice è chiaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Fai attenzione a una cosa.<\/span> <span class=\"sg\" data-s=\"1\">Non usare insieme i due punti <strong>e<\/strong> le parentesi, come in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, <code>:( … )<\/code> significa un'altra cosa.<\/span> <span class=\"sg\" data-s=\"3\">È una firma, scritta come valore.<\/span> <span class=\"sg\" data-s=\"4\">Quindi Raku non riesce a leggere questo codice.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>.grep( … )<\/code> oppure <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Usa una delle due forme, non entrambe.<\/span><\/p>"]]},"lv":{"t":"Izsaukšana ar kolu 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Parasti metodes vai apakšprogrammas argumenti ir iekavās: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā ir otrs veids.<\/span> <span class=\"sg\" data-s=\"2\">Aiz nosaukuma lieciet <strong>kolu<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Viss aiz kola kļūst par argumentu sarakstu.<\/span> <span class=\"sg\" data-s=\"4\">Iekavas nemaz nav vajadzīgas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kols <code>grep:<\/code> dara to pašu darbu, ko iekavas.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> nozīmē tieši to pašu, ko <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat lietot jebkuru no abām formām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kola forma ir visērtākā ar dažām metodēm.<\/span> <span class=\"sg\" data-s=\"1\">Tās ņem <strong>bloku<\/strong> vai <a href=\"https://course.raku.org/lv/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> izteiksmi.<\/span> <span class=\"sg\" data-s=\"2\">Kols noņem vienu iekavu līmeni.<\/span> <span class=\"sg\" data-s=\"3\">Salīdziniet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses around the block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — no closing paren to match<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Abas rindas izdrukā <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet versiju ar kolu ir vieglāk lasīt.<\/span> <span class=\"sg\" data-s=\"2\">Ar garu bloku tas ir vēl vairāk jūtams.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt izsaukumus bez iekavām.<\/span> <span class=\"sg\" data-s=\"1\">Jūs tos lietojat ar saraksta operatoriem, piemēram, <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tur <code>say<\/code> ņem visu aiz sevis kā savus argumentus.<\/span> <span class=\"sg\" data-s=\"3\">Kola forma ir tā pati ideja metodēm.<\/span> <span class=\"sg\" data-s=\"4\">Atcerieties vienu likumu.<\/span> <span class=\"sg\" data-s=\"5\">Kola forma ņem <strong>atlikušo instrukcijas daļu<\/strong> kā argumentus.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc tai jābūt izsaukumu ķēdes <strong>beigās<\/strong>.<\/span> <span class=\"sg\" data-s=\"7\">Tieši tāpēc <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> darbojas.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> ir pēdējais izsaukums.<\/span> <span class=\"sg\" data-s=\"9\">Ķēdē aiz tā nekā nav.<\/span> <span class=\"sg\" data-s=\"10\">Vai jums vajag izsaukt vēl metodes?<\/span> <span class=\"sg\" data-s=\"11\">Tad lietojiet formu ar iekavām.<\/span> <span class=\"sg\" data-s=\"12\">Vai arī sagrupējiet visas izteiksmes daļas ar iekavām.<\/span> <span class=\"sg\" data-s=\"13\">Tā kods kļūst skaidrs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Uzmanieties ar vienu lietu.<\/span> <span class=\"sg\" data-s=\"1\">Nelietojiet kolu <strong>un<\/strong> iekavas kopā, kā <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā <code>:( … )<\/code> nozīmē ko citu.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir paraksts, kas uzrakstīts kā vērtība.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc Raku nevar nolasīt šo kodu.<\/span> <span class=\"sg\" data-s=\"5\">Lietojiet vai nu <code>.grep( … )<\/code>, vai <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Lietojiet vienu no tiem, ne abus.<\/span><\/p>"]]},"ru":{"t":"Вызов через двоеточие","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Обычно аргументы метода или подпрограммы стоят в скобках: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В Raku есть второй способ.<\/span> <span class=\"sg\" data-s=\"2\">Поставьте <strong>двоеточие<\/strong> после имени.<\/span> <span class=\"sg\" data-s=\"3\">Всё после двоеточия становится списком аргументов.<\/span> <span class=\"sg\" data-s=\"4\">Скобки совсем не нужны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двоеточие в <code>grep:<\/code> делает ту же работу, что и скобки.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> значит ровно то же, что <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можно использовать любую форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Форма с двоеточием удобнее всего с некоторыми методами.<\/span> <span class=\"sg\" data-s=\"1\">Они принимают <strong>блок<\/strong> или выражение <a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Двоеточие убирает один уровень скобок.<\/span> <span class=\"sg\" data-s=\"3\">Сравните:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # скобки вокруг блока\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двоеточие -- нет закрывающей скобки<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обе строки выводят <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но версию с двоеточием легче читать.<\/span> <span class=\"sg\" data-s=\"2\">С длинным блоком это ещё заметнее.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете вызовы без скобок.<\/span> <span class=\"sg\" data-s=\"1\">Вы используете их со списковыми операторами, например <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Там <code>say<\/code> берёт как аргументы всё после себя.<\/span> <span class=\"sg\" data-s=\"3\">Форма с двоеточием — та же идея для методов.<\/span> <span class=\"sg\" data-s=\"4\">Запомните одно правило.<\/span> <span class=\"sg\" data-s=\"5\">Форма с двоеточием берёт как аргументы <strong>остаток выражения<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому она должна стоять в <strong>конце<\/strong> цепочки вызовов.<\/span> <span class=\"sg\" data-s=\"7\">Именно поэтому работает <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> — последний вызов.<\/span> <span class=\"sg\" data-s=\"9\">После него в цепочке ничего нет.<\/span> <span class=\"sg\" data-s=\"10\">Нужно вызвать ещё методы?<\/span> <span class=\"sg\" data-s=\"11\">Тогда используйте форму со скобками.<\/span> <span class=\"sg\" data-s=\"12\">Или сгруппируйте части всего выражения скобками.<\/span> <span class=\"sg\" data-s=\"13\">Так код станет понятным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Будьте осторожны с одной вещью.<\/span> <span class=\"sg\" data-s=\"1\">Не пишите двоеточие <strong>и<\/strong> скобки вместе, как в <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В Raku <code>:( … )<\/code> значит другое.<\/span> <span class=\"sg\" data-s=\"3\">Это сигнатура, записанная как значение.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому Raku не может прочитать этот код.<\/span> <span class=\"sg\" data-s=\"5\">Пишите либо <code>.grep( … )<\/code>, либо <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Выберите одно из них, не оба.<\/span><\/p>"]]},"uk":{"t":"Виклик із двокрапкою","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Зазвичай аргументи методу чи підпрограми стоять у дужках: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У Raku є другий спосіб.<\/span> <span class=\"sg\" data-s=\"2\">Поставте після імені <strong>двокрапку<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Усе після двокрапки стає списком аргументів.<\/span> <span class=\"sg\" data-s=\"4\">Дужки зовсім не потрібні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двокрапка в <code>grep:<\/code> робить ту саму роботу, що й дужки.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> означає точно те саме, що <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можна використовувати будь-яку з двох форм:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Форма з двокрапкою найкраще підходить для деяких методів.<\/span> <span class=\"sg\" data-s=\"1\">Вони приймають <strong>блок<\/strong> або вираз <a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Двокрапка прибирає один рівень дужок.<\/span> <span class=\"sg\" data-s=\"3\">Порівняйте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # дужки навколо блоку\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двокрапка — закривальну дужку шукати не треба<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обидва рядки виводять <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але версію з двокрапкою легше читати.<\/span> <span class=\"sg\" data-s=\"2\">З довгим блоком це ще помітніше.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте виклики без дужок.<\/span> <span class=\"sg\" data-s=\"1\">Ви використовуєте їх зі списковими операторами, як-от <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Там <code>say<\/code> бере все після себе як свої аргументи.<\/span> <span class=\"sg\" data-s=\"3\">Форма з двокрапкою — та сама ідея для методів.<\/span> <span class=\"sg\" data-s=\"4\">Запам'ятайте одне правило.<\/span> <span class=\"sg\" data-s=\"5\">Форма з двокрапкою бере <strong>решту оператора<\/strong> як аргументи.<\/span> <span class=\"sg\" data-s=\"6\">Тож вона мусить стояти в <strong>кінці<\/strong> ланцюжка викликів.<\/span> <span class=\"sg\" data-s=\"7\">Ось чому працює <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> — останній виклик.<\/span> <span class=\"sg\" data-s=\"9\">Після нього в ланцюжку нічого немає.<\/span> <span class=\"sg\" data-s=\"10\">Вам треба викликати ще методи?<\/span> <span class=\"sg\" data-s=\"11\">Тоді використайте форму з дужками.<\/span> <span class=\"sg\" data-s=\"12\">Або згрупуйте частини всього виразу дужками.<\/span> <span class=\"sg\" data-s=\"13\">Так код стане зрозумілим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу на одну річ.<\/span> <span class=\"sg\" data-s=\"1\">Не використовуйте двокрапку <strong>й<\/strong> дужки разом, як-от <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У Raku <code>:( … )<\/code> означає інше.<\/span> <span class=\"sg\" data-s=\"3\">Це сигнатура, записана як значення.<\/span> <span class=\"sg\" data-s=\"4\">Тож Raku не може прочитати цей код.<\/span> <span class=\"sg\" data-s=\"5\">Використовуйте або <code>.grep( … )<\/code>, або <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Беріть щось одне, а не обидва.<\/span><\/p>"]]},"bg":{"t":"Извикване с двоеточие 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Обикновено аргументите на метод или подпрограма са в скоби: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku има и втори начин.<\/span> <span class=\"sg\" data-s=\"2\">Сложете <strong>двоеточие<\/strong> след името.<\/span> <span class=\"sg\" data-s=\"3\">Всичко след двоеточието става списъкът с аргументи.<\/span> <span class=\"sg\" data-s=\"4\">Изобщо не ви трябват скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двоеточието в <code>grep:<\/code> върши същата работа като скобите.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> означава точно същото като <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате всяка от двете форми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Формата с двоеточие е най-удобна при някои методи.<\/span> <span class=\"sg\" data-s=\"1\">Те приемат <strong>блок<\/strong> или <a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> израз.<\/span> <span class=\"sg\" data-s=\"2\">Двоеточието маха едно ниво скоби.<\/span> <span class=\"sg\" data-s=\"3\">Сравнете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # скоби около блока\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двоеточие — няма затваряща скоба за съвпадение<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">И двата реда отпечатват <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но версията с двоеточие се чете по-лесно.<\/span> <span class=\"sg\" data-s=\"2\">Това важи още повече за дълъг блок.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Вече познавате извиквания без скоби.<\/span> <span class=\"sg\" data-s=\"1\">Използвате ги с операторите за списъци, като <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Там <code>say<\/code> взема всичко след себе си като свои аргументи.<\/span> <span class=\"sg\" data-s=\"3\">Формата с двоеточие е същата идея, но за методи.<\/span> <span class=\"sg\" data-s=\"4\">Запомнете едно правило.<\/span> <span class=\"sg\" data-s=\"5\">Формата с двоеточие взема <strong>остатъка от израза<\/strong> като аргументи.<\/span> <span class=\"sg\" data-s=\"6\">Затова тя трябва да е в <strong>края<\/strong> на веригата от извиквания.<\/span> <span class=\"sg\" data-s=\"7\">Ето защо <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> работи.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> е последното извикване.<\/span> <span class=\"sg\" data-s=\"9\">След него във веригата няма нищо.<\/span> <span class=\"sg\" data-s=\"10\">Трябва ли да извикате още методи?<\/span> <span class=\"sg\" data-s=\"11\">Тогава използвайте формата със скоби.<\/span> <span class=\"sg\" data-s=\"12\">Или групирайте частите на целия израз със скоби.<\/span> <span class=\"sg\" data-s=\"13\">Така кодът става ясен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Внимавайте с едно нещо.<\/span> <span class=\"sg\" data-s=\"1\">Не използвайте двоеточие <strong>и<\/strong> скоби заедно, като <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В Raku <code>:( … )<\/code> означава нещо друго.<\/span> <span class=\"sg\" data-s=\"3\">Това е сигнатура, записана като стойност.<\/span> <span class=\"sg\" data-s=\"4\">Затова Raku не може да прочете този код.<\/span> <span class=\"sg\" data-s=\"5\">Използвайте или <code>.grep( … )<\/code>, или <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Използвайте едното от двете, а не и двете.<\/span><\/p>"]]},"eo":{"t":"Vokado per dupunkto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kutime la argumentoj de metodo aŭ subfunkcio estas en krampoj: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas duan manieron.<\/span> <span class=\"sg\" data-s=\"2\">Metu <strong>dupunkton<\/strong> post la nomo.<\/span> <span class=\"sg\" data-s=\"3\">Ĉio post la dupunkto fariĝas la listo de argumentoj.<\/span> <span class=\"sg\" data-s=\"4\">Vi tute ne bezonas krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La dupunkto en <code>grep:<\/code> faras la saman laboron kiel krampoj.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> signifas ekzakte la samon kiel <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi ajnan el la du formoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La dupunkta formo estas plej agrabla kun kelkaj metodoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili prenas <strong>blokon<\/strong> aŭ <a href=\"https://course.raku.org/eo/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-esprimon.<\/span> <span class=\"sg\" data-s=\"2\">La dupunkto forigas unu nivelon de krampoj.<\/span> <span class=\"sg\" data-s=\"3\">Komparu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # krampoj chirkaue de la bloko\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dupunkto — neniu ferma krampo por pari<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ linioj presas <code>(3 2 1)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed la versio kun la dupunkto estas pli facile legebla.<\/span> <span class=\"sg\" data-s=\"2\">Tio validas eĉ pli por longa bloko.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas vokojn sen krampoj.<\/span> <span class=\"sg\" data-s=\"1\">Vi uzas ilin kun listaj operatoroj, kiel <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tie, <code>say<\/code> prenas ĉion post si kiel siajn argumentojn.<\/span> <span class=\"sg\" data-s=\"3\">La dupunkta formo estas la sama ideo por metodoj.<\/span> <span class=\"sg\" data-s=\"4\">Memoru unu regulon.<\/span> <span class=\"sg\" data-s=\"5\">La dupunkta formo prenas la <strong>reston de la deklaro<\/strong> kiel argumentojn.<\/span> <span class=\"sg\" data-s=\"6\">Do ĝi devas esti ĉe la <strong>fino<\/strong> de ĉeno de vokoj.<\/span> <span class=\"sg\" data-s=\"7\">Tial <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> funkcias.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> estas la lasta voko.<\/span> <span class=\"sg\" data-s=\"9\">Nenio venas post ĝi en la ĉeno.<\/span> <span class=\"sg\" data-s=\"10\">Ĉu vi bezonas voki pliajn metodojn?<\/span> <span class=\"sg\" data-s=\"11\">Tiam uzu la formon kun krampoj.<\/span> <span class=\"sg\" data-s=\"12\">Aŭ grupigu la partojn de la tuta esprimo per krampoj.<\/span> <span class=\"sg\" data-s=\"13\">Tiel la kodo estas klara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Atentu pri unu afero.<\/span> <span class=\"sg\" data-s=\"1\">Ne uzu la dupunkton <strong>kaj<\/strong> krampojn kune, kiel <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, <code>:( … )<\/code> signifas ion alian.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas signaturo, skribita kiel valoro.<\/span> <span class=\"sg\" data-s=\"4\">Do Raku ne povas legi ĉi tiun kodon.<\/span> <span class=\"sg\" data-s=\"5\">Uzu aŭ <code>.grep( … )<\/code>, aŭ <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Uzu unu el ili, ne ambaŭ.<\/span><\/p>"]]},"la":{"t":"Vocatio cum duplo puncto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Plerumque argumenta methodi vel subroutinae in parenthesibus sunt: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku alterum modum habet.<\/span> <span class=\"sg\" data-s=\"2\">Pone <strong>colonum<\/strong> post nomen.<\/span> <span class=\"sg\" data-s=\"3\">Omnia post colonum fiunt index argumentorum.<\/span> <span class=\"sg\" data-s=\"4\">Parentheses omnino non necessariae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Colon in <code>grep:<\/code> idem facit quod parentheses.<\/span> <span class=\"sg\" data-s=\"1\"><code>(1..10).grep: * %% 2<\/code> prorsus idem significat quod <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Utramvis formam adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Forma cum colono maxime placet cum quibusdam methodis.<\/span> <span class=\"sg\" data-s=\"1\">Eae <strong>codicem clausum<\/strong> vel expressionem <a href=\"https://course.raku.org/la/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> accipiunt.<\/span> <span class=\"sg\" data-s=\"2\">Colon unum gradum parenthesium removet.<\/span> <span class=\"sg\" data-s=\"3\">Compara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses circa codicem clausum\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — nulla parenthesis claudenda<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ambae lineae <code>(3 2 1)<\/code> imprimunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed versio cum colono facilius legitur.<\/span> <span class=\"sg\" data-s=\"2\">Hoc etiam magis verum est de codice clauso longo.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Iam vocationes sine parenthesibus nosti.<\/span> <span class=\"sg\" data-s=\"1\">Eas cum operatoribus indicis adhibes, ut <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ibi <code>say<\/code> omnia post se ut argumenta sua accipit.<\/span> <span class=\"sg\" data-s=\"3\">Forma cum colono eadem res est pro methodis.<\/span> <span class=\"sg\" data-s=\"4\">Unam regulam memento.<\/span> <span class=\"sg\" data-s=\"5\">Forma cum colono <strong>reliquum enuntiati<\/strong> ut argumenta accipit.<\/span> <span class=\"sg\" data-s=\"6\">Itaque in <strong>fine<\/strong> catenae vocationum esse debet.<\/span> <span class=\"sg\" data-s=\"7\">Ideo <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"8\"><code>grep<\/code> ultima vocatio est.<\/span> <span class=\"sg\" data-s=\"9\">Nihil post eam in catena venit.<\/span> <span class=\"sg\" data-s=\"10\">Debesne plures methodos vocare?<\/span> <span class=\"sg\" data-s=\"11\">Tum formam cum parenthesibus adhibe.<\/span> <span class=\"sg\" data-s=\"12\">Aut partes totius expressionis in parenthesibus pone.<\/span> <span class=\"sg\" data-s=\"13\">Hoc codicem clarum facit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Unam rem cave.<\/span> <span class=\"sg\" data-s=\"1\">Noli colonum <strong>et<\/strong> parentheses simul adhibere, ut <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku <code>:( … )<\/code> aliud significat.<\/span> <span class=\"sg\" data-s=\"3\">Est signatura, ut valor scripta.<\/span> <span class=\"sg\" data-s=\"4\">Itaque Raku hunc codicem legere non potest.<\/span> <span class=\"sg\" data-s=\"5\">Adhibe aut <code>.grep( … )<\/code> aut <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Unum ex eis adhibe, non ambo.<\/span><\/p>"]]}}}</script>
