<script type="application/json" id="page-data">{"u":"advanced/colon-calls/exercises/colon-map/solution","n":650,"k":"solution","pv":"advanced/colon-calls/exercises/colon-map","nx":"advanced/colon-calls/exercises/colon-join","tr":["advanced","advanced/colon-calls"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A colon map‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Only <code>grep<\/code> can use the colon form. It is the last call in the chain. The colon makes <code>* &gt; 10<\/code> its argument. This is exactly like <code>grep(* &gt; 10)<\/code>. We still need to print the result. So now we use <code>say<\/code> as a function, not as a method.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>map<\/code> call must keep its parentheses. If you write <code>.map: * * 2<\/code>, there is a problem. The colon takes <code>.grep(* &gt; 10)<\/code> too. It becomes part of the arguments of <code>map<\/code>. Then the chain breaks.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Doppelpunkt-map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre cla ada a <code>map<\/code> debe mantener sus paréntesis. Si escribes <code>.map: * * 2<\/code>, hay un problema. Los dos puntos toman también <code>.grep(* &gt; 10)<\/code>. Se convierte en parte de los argumentos de <code>map<\/code>. Entonces la cadena se rompe.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un map con due punti","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Solo <code>grep<\/code> può usare la forma con i due punti. È l'ultima chiamata della catena. Con i due punti, <code>* &gt; 10<\/code> diventa il suo argomento. È esattamente come <code>grep(* &gt; 10)<\/code>. Dobbiamo ancora stampare il risultato. Quindi ora usiamo <code>say<\/code> come funzione, non come metodo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La chiamata a <code>map<\/code> deve mantenere le sue parentesi. Se scrivi <code>.map: * * 2<\/code>, c'è un problema. I due punti prendono anche <code>.grep(* &gt; 10)<\/code>. Diventa parte degli argomenti di <code>map<\/code>. Allora la catena si rompe.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Map ar kolu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre cl >grep<\/code> может использовать форму с двоеточием. Это последний вызов в цепочке. Двоеточие делает <code>* &gt; 10<\/code> его аргументом. Это точно как <code>grep(* &gt; 10)<\/code>. Нам всё ещё нужно вывести результат. Поэтому теперь мы используем <code>say<\/code> как функцию, а не как метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вызов <code>map<\/code> должен оставить свои скобки. Если написать <code>.map: * * 2<\/code>, будет проблема. Двоеточие забирает и <code>.grep(* &gt; 10)<\/code>. Он становится частью аргументов <code>map<\/code>. Тогда цепочка ломается.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Map із двокрапкою","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Лише <code>grep<\/code> може використати форму з двокрапкою. Це останній виклик у ланцюжку. Двокрапка робить <code>* &gt; 10<\/code> його аргументом. Це точно як <code>grep(* &gt; 10)<\/code>. Нам усе ще треба вивести результат. Тож тепер ми використовуємо <code>say<\/code> як функцію, а не як метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Виклик <code>map<\/code> мусить зберегти свої дужки. Якщо ви напишете <code>.map: * * 2<\/code>, буде проблема. Двокрапка забирає й <code>.grep(* &gt; 10)<\/code>. Він стає частиною аргумен
