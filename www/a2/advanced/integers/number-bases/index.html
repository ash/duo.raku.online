<script type="application/json" id="page-data">{"u":"advanced/integers/number-bases","n":432,"k":"topic","pv":"advanced/integers","nx":"advanced/integers/number-bases/quiz","tr":["advanced","advanced/integers"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Number bases","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">You can write an integer in other bases too.<\/span> <span class=\"sg\" data-s=\"1\">It does not have to be base 10.<\/span> <span class=\"sg\" data-s=\"2\">Base 10 is the decimal system.<\/span> <span class=\"sg\" data-s=\"3\">Raku knows the three most common other bases.<\/span> <span class=\"sg\" data-s=\"4\">You do not need anything extra for them.<\/span> <span class=\"sg\" data-s=\"5\">Each base has its own prefix:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can use any base in the code.<\/span> <span class=\"sg\" data-s=\"1\">The value is always the same integer.<\/span> <span class=\"sg\" data-s=\"2\">Only the way of writing it is different.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For any other base, use the form <code>:base&lt;number&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is called the radix form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can also go the other way.<\/span> <span class=\"sg\" data-s=\"1\">Take a number and write it in another base.<\/span> <span class=\"sg\" data-s=\"2\">For this, call the <code>base<\/code> method.<\/span> <span class=\"sg\" data-s=\"3\">It gives a string of digits:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"de":{"t":"Zahlensysteme","b":[[" s=\"2\">Grondtal 10 is het decimale stelsel.<\/span> <span class=\"sg\" data-s=\"3\">Raku kent de drie meest gebruikte andere talstelsels.<\/span> <span class=\"sg\" data-s=\"4\">Je hebt er niets extra voor nodig.<\/span> <span class=\"sg\" data-s=\"5\">Elk talstelsel heeft een eigen prefix:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimaal (grondtal 16)\nsay 0b1010; # 10   — binair (grondtal 2)\nsay 0o17;   # 15   — octaal (grondtal 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt elk talstelsel in de code gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">De waarde is altijd hetzelfde gehele getal.<\/span> <span class=\"sg\" data-s=\"2\">Alleen de manier van schrijven is anders.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik voor elk ander talstelsel de vorm <code>:base&lt;number&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die heet de radix-vorm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook de andere kant op gaan.<\/span> <span class=\"sg\" data-s=\"1\">Neem een getal en schrijf het in een ander talstelsel.<\/span> <span class=\"sg\" data-s=\"2\">Roep daarvoor de methode <code>base<\/code> aan.<\/span> <span class=\"sg\" data-s=\"3\">Die geeft een string van cijfers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"es":{"t":"Bases numéricas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">También puedes escribir un entero en otras bases.<\/span> <span class=\"sg\" data-s=\"1\">No tiene que ser la base 10.<\/span> <span class=\"sg\" data-s=\"2\">La base 10 es el sistema decimal.<\/span> <span class=\"sg\" data-s=\"3\">Raku conoce las otras tres bases más comunes.<\/span> <span class=\"sg\" data-s=\"4\">Para ellas no necesitas nada más.<\/span> <span class=\"sg\" da =\"sg\" data-s=\"1\">To sauc par radiksa formu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat iet arī pretējā virzienā.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet skaitli un uzrakstiet to citā bāzē.<\/span> <span class=\"sg\" data-s=\"2\">Tam izsauciet metodi <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tā dod ciparu virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"ru":{"t":"Системы счисления","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Целое число можно записать и в других системах счисления.<\/span> <span class=\"sg\" data-s=\"1\">Это не обязательно система с основанием 10.<\/span> <span class=\"sg\" data-s=\"2\">Система с основанием 10 — это десятичная система.<\/span> <span class=\"sg\" data-s=\"3\">Raku знает три другие самые частые системы.<\/span> <span class=\"sg\" data-s=\"4\">Для них не нужно ничего дополнительного.<\/span> <span class=\"sg\" data-s=\"5\">У каждой системы свой префикс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В коде можно использовать любую систему счисления.<\/span> <span class=\"sg\" data-s=\"1\">Значение всегда одно и то же целое число.<\/span> <span class=\"sg\" data-s=\"2\">Отличается только способ записи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для любой другой системы используйте форму <code>:основание&lt;число&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Её называют формой с основанием:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можно пойти и в обратную сторону.<\/span> <span class=\"sg\" data-s=\"1\">Возьмите число и запишите его в другой системе счисления.<\/span> <span class=\"sg\" data-s=\"2\">Для этого вызовите метод <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он даёт строку цифр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"uk":{"t":"Системи числення","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ви можете записати ціле число й за іншою основою.<\/span> <span class=\"sg\" data-s=\"1\">Це не обов'язково основа 10.<\/span> <span class=\"sg\" data-s=\"2\">Основа 10 — це десяткова система.<\/span> <span class=\"sg\" data-s=\"3\">Raku знає три найпоширеніші інші основи.<\/span> <span class=\"sg\" data-s=\"4\">Для них не потрібно нічого додаткового.<\/span> <span class=\"sg\" data-s=\"5\">Кожна основа має свій префікс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — шістнадцяткова (основа 16)\nsay 0b1010; # 10   — двійкова (основа 2)\nsay 0o17;   # 15   — вісімкова (основа 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У коді можна використати будь-яку основу.<\/span> <span class=\"sg\" data-s=\"1\">Значення — завжди те саме ціле число.<\/span> <span class=\"sg\" data-s=\"2\">Різниться лише спосіб запису.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для будь-якої іншої основи використовуйте форму <code>:основа&lt;число&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вона називається формою з основою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можна піти й у зворотний бік.<\/span> <span class=\"sg\" data-s=\"1\">Візьміть число й запишіть його за іншою основою.<\/span> <span class=\"sg\" data-s=\"2\">Для цього викличте метод <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він дає рядок цифр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"bg":{"t":"Бройни системи","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Можете да пишете цяло число и в други бройни системи.<\/span> <span class=\"sg\" data-s=\"1\">Не е нужно основата да е 10.<\/span> <span class=\"sg\" data-s=\"2\">Основа 10 е десетичната система.<\/span> <span class=\"sg\" data-s=\"3\">Raku знае трите най-често срещани други системи.<\/span> <span class=\"sg\" data-s=\"4\">За тях не ви трябва нищо допълнително.<\/span> <span class=\"sg\" data-s=\"5\">Всяка система има свой префикс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — шестнадесетична (основа 16)\nsay 0b1010; # 10   — двоична (основа 2)\nsay 0o17;   # 15   — осмична (основа 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В кода можете да използвате всяка бройна система.<\/span> <span class=\"sg\" data-s=\"1\">Стойността е винаги същото цяло число.<\/span> <span class=\"sg\" data-s=\"2\">Различен е само начинът на записване.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За всяка друга бройна система използвайте формата <code>:base&lt;number&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя се нарича форма с основа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да направите и обратното.<\/span> <span class=\"sg\" data-s=\"1\">Вземете число и го запишете в друга бройна система.<\/span> <span class=\"sg\" data-s=\"2\">За целта извикайте метода <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той дава низ от цифри:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"eo":{"t":"Nombraj bazoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Vi povas skribi entjeron ankaŭ en aliaj bazoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne devas esti en bazo 10.<\/span> <span class=\"sg\" data-s=\"2\">Bazo 10 estas la dekuma sistemo.<\/span> <span class=\"sg\" data-s=\"3\">Raku konas la tri plej oftajn aliajn bazojn.<\/span> <span class=\"sg\" data-s=\"4\">Vi bezonas nenion ekstran por ili.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiu bazo havas sian propran prefikson:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas uzi ajnan bazon en la kodo.<\/span> <span class=\"sg\" data-s=\"1\">La valoro ĉiam estas la sama entjero.<\/span> <span class=\"sg\" data-s=\"2\">Nur la maniero skribi ĝin estas alia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por ĉiu alia bazo, uzu la formon <code>:base&lt;number&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi nomiĝas la radika formo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas iri en la alian direkton.<\/span> <span class=\"sg\" data-s=\"1\">Prenu nombron kaj skribu ĝin en alia bazo.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, voku la metodon <code>base<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi donas ĉenon de ciferoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]},"la":{"t":"Bases numerorum","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Numerum integrum etiam in aliis basibus scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Basis 10 non necessaria est.<\/span> <span class=\"sg\" data-s=\"2\">Basis 10 est systema decimale.<\/span> <span class=\"sg\" data-s=\"3\">Raku tres alias bases maxime communes novit.<\/span> <span class=\"sg\" data-s=\"4\">Pro eis nihil aliud requiris.<\/span> <span class=\"sg\" data-s=\"5\">Quaeque basis suum praefixum habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0xFF;   # 255  — hexadecimal (base 16)\nsay 0b1010; # 10   — binary (base 2)\nsay 0o17;   # 15   — octal (base 8)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In codice quamlibet basem adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Valor semper idem numerus integer est.<\/span> <span class=\"sg\" data-s=\"2\">Solus modus scribendi differt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro qualibet alia basi formam <code>:base&lt;number&gt;<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Eam formam radicis vocamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say :16&lt;FF&gt;;   # 255\nsay :2&lt;1010&gt;;  # 10<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Etiam in contrariam partem ire potes.<\/span> <span class=\"sg\" data-s=\"1\">Sume numerum et eum in alia basi scribe.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc methodum <code>base<\/code> voca.<\/span> <span class=\"sg\" data-s=\"3\">Chordam digitorum dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 255.base(16); # FF\nsay 10.base(2);   # 1010<\/code><\/pre>"]]}}}</script>
