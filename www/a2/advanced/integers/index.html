ta-s=\"0\">Svarīgākā īpašība ir <em>patvaļīga precizitāte<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Raku veselajam skaitlim nav fiksēta baitu skaita.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc tas nekad nepārplūst.<\/span> <span class=\"sg\" data-s=\"3\">Pārplūšanā skaitlis kļūst pārāk liels.<\/span> <span class=\"sg\" data-s=\"4\">Tad tas klusi kļūst nepareizs.<\/span> <span class=\"sg\" data-s=\"5\">Ar pietiekamu atmiņu vesels skaitlis var būt tik liels, cik jums vajag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šī vērtība ir precīza.<\/span> <span class=\"sg\" data-s=\"1\">Tā nav noapaļota.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats notiek, kad jūs reizināt lielus skaitļus.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, Raku atrod precīzu 50 faktoriālu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Garus skaitļus kodā ir grūti lasīt.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat sadalīt ciparus grupās ar pasvītrām.<\/span> <span class=\"sg\" data-s=\"2\">Kompilators pasvītras izlaiž:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nākamās tēmas parāda, kā rakstīt veselos skaitļus citās bāzēs.<\/span> <span class=\"sg\" data-s=\"1\">Bāze 10 nav vienīgā.<\/span> <span class=\"sg\" data-s=\"2\">Tās arī parāda dažas noderīgas metodes veselajiem skaitļiem.<\/span><\/p>"]]},"ru":{"t":"Целые числа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы используете целые числа с самого начала курса.<\/span> <span class=\"sg\" data-s=\"1\">Целые числа — это числа без дробной части.<\/span> <span class=\"sg\" data-s=\"2\">Этот раздел показывает несколько их особенностей.<\/span> <span class=\"sg\" data-s=\"3\">Сначала эти особенности можно не заметить.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Самая важная особенность — это <em>произвольная точность<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">У целого числа в Raku нет фиксированного количества байтов.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому оно никогда не переполняется.<\/span> <span class=\"sg\" data-s=\"3\">При переполнении число становится слишком большим.<\/span> <span class=\"sg\" data-s=\"4\">Тогда оно тихо становится неправильным.<\/span> <span class=\"sg\" data-s=\"5\">Если памяти достаточно, целое число может быть таким большим, как вам нужно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Это значение точное.<\/span> <span class=\"sg\" data-s=\"1\">Оно не округлено.<\/span> <span class=\"sg\" data-s=\"2\">То же самое верно и для умножения больших чисел.<\/span> <span class=\"sg\" data-s=\"3\">Например, Raku находит точный факториал числа 50:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Длинные числа в коде трудно читать.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому цифры можно разделить на группы подчёркиваниями.<\/span> <span class=\"sg\" data-s=\"2\">Компилятор пропускает подчёркивания:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, как записывать целые числа в других системах счисления.<\/span> <span class=\"sg\" data-s=\"1\">Десятичная система — не единственная.<\/span> <span class=\"sg\" data-s=\"2\">Ещё они показывают несколько полезных методов для целых чисел.<\/span><\/p>"]]},"uk":{"t":"Цілі числа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви користуєтеся цілими числами від самого початку курсу.<\/span> <span class=\"sg\" data-s=\"1\">Цілі числа — це числа без дробової частини.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ показує кілька їхніх властивостей.<\/span> <span class=\"sg\" data-s=\"3\">Спершу ви можете їх не помітити.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Найважливіша властивість — це <em>довільна точність<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ціле число в Raku не має фіксованої кількості байтів.<\/span> <span class=\"sg\" data-s=\"2\">Тому воно ніколи не переповнюється.<\/span> <span class=\"sg\" data-s=\"3\">При переповненні число стає завеликим.<\/span> <span class=\"sg\" data-s=\"4\">Тоді воно тихо стає неправильним.<\/span> <span class=\"sg\" data-s=\"5\">Коли пам'яті досить, ціле число може бути таким великим, як вам треба:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Це значення точне.<\/span> <span class=\"sg\" data-s=\"1\">Воно не округлене.<\/span> <span class=\"sg\" data-s=\"2\">Те саме буває, коли ви множите великі числа.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, Raku знаходить точний факторіал 50:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Довгі числа в коді важко читати.<\/span> <span class=\"sg\" data-s=\"1\">Тому ви можете ділити цифри на групи підкресленнями.<\/span> <span class=\"sg\" data-s=\"2\">Компілятор пропускає підкреслення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як записувати цілі числа за іншими основами.<\/span> <span class=\"sg\" data-s=\"1\">Основа 10 — не єдина.<\/span> <span class=\"sg\" data-s=\"2\">Вони також показують кілька корисних методів для цілих чисел.<\/span><\/p>"]]},"bg":{"t":"Цели числа","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Използвали сте цели числа от самото начало на курса.<\/span> <span class=\"sg\" data-s=\"1\">Целите числа са числа без дробна част.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел показва някои техни особености.<\/span> <span class=\"sg\" data-s=\"3\">Може да не ги забележите веднага.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Най-важната особеност е <em>произволната точност<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Цялото число в Raku няма определен брой байтове.<\/span> <span class=\"sg\" data-s=\"2\">Затова то никога не прелива.<\/span> <span class=\"sg\" data-s=\"3\">При преливане числото става твърде голямо.<\/span> <span class=\"sg\" data-s=\"4\">Тогава то тихо става грешно.<\/span> <span class=\"sg\" data-s=\"5\">Ако има достатъчно памет, цялото число може да е толкова голямо, колкото ви трябва:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тази стойност е точна.<\/span> <span class=\"sg\" data-s=\"1\">Тя не е закръглена.<\/span> <span class=\"sg\" data-s=\"2\">Същото важи, когато умножавате големи числа.<\/span> <span class=\"sg\" data-s=\"3\">Например Raku намира точния факториел на 50:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дългите числа в кода се четат трудно.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да разделите цифрите на групи с долни черти.<\/span> <span class=\"sg\" data-s=\"2\">Компилаторът пропуска долните черти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да пишете цели числа в други бройни системи.<\/span> <span class=\"sg\" data-s=\"1\">Десетичната система не е единствената.<\/span> <span class=\"sg\" data-s=\"2\">Те показват и няколко полезни метода за цели числа.<\/span><\/p>"]]},"eo":{"t":"Entjeroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi uzas entjerojn jam de la komenco de la kurso.<\/span> <span class=\"sg\" data-s=\"1\">Entjeroj estas tutaj nombroj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio montras kelkajn el iliaj trajtoj.<\/span> <span class=\"sg\" data-s=\"3\">Eble vi ne tuj rimarkas ĉi tiujn trajtojn.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La plej grava trajto estas <em>arbitra precizeco<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Entjero en Raku ne havas fiksan nombron da bajtoj.<\/span> <span class=\"sg\" data-s=\"2\">Do ĝi neniam superfluas.<\/span> <span class=\"sg\" data-s=\"3\">Ĉe superfluo, nombro fariĝas tro granda.<\/span> <span class=\"sg\" data-s=\"4\">Tiam ĝi silente fariĝas malĝusta.<\/span> <span class=\"sg\" data-s=\"5\">Kun sufiĉe da memoro, entjero povas esti tiom granda, kiom vi bezonas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu valoro estas ekzakta.<\/span> <span class=\"sg\" data-s=\"1\">Raku ne rondigas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Same estas, kiam vi multiplikas grandajn nombrojn.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, Raku trovas la ekzaktan faktorialon de 50:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Longajn nombrojn en la kodo estas malfacile legi.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas meti la ciferojn en grupojn per substrekoj.<\/span> <span class=\"sg\" data-s=\"2\">La kompililo preterlasas la substrekojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel skribi entjerojn en aliaj bazoj.<\/span> <span class=\"sg\" data-s=\"1\">Bazo 10 ne estas la sola.<\/span> <span class=\"sg\" data-s=\"2\">Ili ankaŭ montras kelkajn utilajn metodojn por entjeroj.<\/span><\/p>"]]},"la":{"t":"Integri","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Numeros integros iam ab ipso initio cursus adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Numeri integri sunt numeri sine fractionibus.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio aliquas eorum proprietates ostendit.<\/span> <span class=\"sg\" data-s=\"3\">Primo has proprietates fortasse non vides.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Maxima proprietas est <em>praecisio arbitraria<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Numerus integer in Raku nullum numerum fixum bytorum habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque numquam superfluit.<\/span> <span class=\"sg\" data-s=\"3\">In superfluxu numerus nimis magnus fit.<\/span> <span class=\"sg\" data-s=\"4\">Tum tacite falsus fit.<\/span> <span class=\"sg\" data-s=\"5\">Si satis memoriae est, numerus integer tam magnus esse potest quam opus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic valor exactus est.<\/span> <span class=\"sg\" data-s=\"1\">Raku eum non rotundat.<\/span> <span class=\"sg\" data-s=\"2\">Idem verum est cum magnos numeros multiplicas.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, Raku factorialem numeri 50 exacte invenit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Longos numeros in codice difficile legis.<\/span> <span class=\"sg\" data-s=\"1\">Itaque digitos cum underscores in greges dividere potes.<\/span> <span class=\"sg\" data-s=\"2\">Compilator underscores neglegit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Proxima themata docent numeros integros in aliis basibus scribere.<\/span> <span class=\"sg\" data-s=\"1\">Basis 10 non sola est.<\/span> <span class=\"sg\" data-s=\"2\">Etiam aliquas methodos utiles pro numeris integris ostendunt.<\/span><\/p>"]]}}}</script>
