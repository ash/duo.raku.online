<script type="application/json" id="page-data">{"u":"advanced/contexts","n":382,"k":"section","pv":"advanced/ordered-containers/exercises/bind-a-scalar/solution","nx":"advanced/contexts/coercion-contexts","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Contexts","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">In Raku, a value can behave in different ways.<\/span> <span class=\"sg\" data-s=\"1\">It depends on the <em>context<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The context is the place where you use the value.<\/span> <span class=\"sg\" data-s=\"3\">For example, an array can act as a number.<\/span> <span class=\"sg\" data-s=\"4\">This number is its length.<\/span> <span class=\"sg\" data-s=\"5\">The same array can act as a string.<\/span> <span class=\"sg\" data-s=\"6\">Then its elements are joined together.<\/span> <span class=\"sg\" data-s=\"7\">It can also act as <code>True<\/code> or <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">This shows if the array is empty or not.<\/span> <span class=\"sg\" data-s=\"9\">The code around the array decides which one you get.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Context explains many things in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Without it, these things look strange.<\/span> <span class=\"sg\" data-s=\"2\">For example, why is <code>+@array<\/code> a number?<\/span> <span class=\"sg\" data-s=\"3\">Why does an array in a scalar act as one item?<\/span> <span class=\"sg\" data-s=\"4\">And why does <code>if @array<\/code> check if the array is empty?<\/span> <span class=\"sg\" data-s=\"5\">This section shows the main contexts.<\/span><\/p>"]]},"de":{"t":"Kontexte","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">In Raku kann sich ein Wert auf verschiedene Arten verhalten.<\/span> <span class=\"sg\" data-s=\"1\">Das hängt vom <em>Kontext<\/em> ab.<\/span> <span class=\"sg\" data-s=\"2\">Der Kontext ist die Stelle, wo du den Wert benutzt.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel kann sich ein Array wie eine Zahl verhalten.<\/span> <span class=\"sg\" data-s=\"4\">Diese Zahl ist seine Länge.<\/span> <span class=\"sg\" data-s=\"5\">Dasselbe Array kann sich wie ein String verhalten.<\/span> <span class=\"sg\" data-s=\"6\">Dann sind seine Elemente miteinander verbunden.<\/span> <span class=\"sg\" data-s=\"7\">Es kann sich auch wie <code>True<\/code> oder <code>False<\/code> verhalten.<\/span> <span class=\"sg\" data-s=\"8\">Das zeigt, ob das Array leer ist oder nicht.<\/span> <span class=\"sg\" data-s=\"9\">Der Code um das Array herum entscheidet, was du bekommst.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Der Kontext erklärt viele Dinge in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ohne ihn sehen diese Dinge seltsam aus.<\/span> <span class=\"sg\" data-s=\"2\">Warum ist zum Beispiel <code>+@array<\/code> eine Zahl?<\/span> <span class=\"sg\" data-s=\"3\">Warum verhält sich ein Array in einem Skalar wie ein einzelnes Element?<\/span> <span class=\"sg\" data-s=\"4\">Und warum prüft <code>if @array<\/code>, ob das Array leer ist?<\/span> <span class=\"sg\" data-s=\"5\">Dieser Abschnitt zeigt die wichtigsten Kontexte.<\/span><\/p>"]]},"nl":{"t":"Contexten","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">In Raku kan een waarde zich op verschillende manieren gedragen.<\/span> <span class=\"sg\" data-s=\"1\">Dat hangt af van de <em>context<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De context is de plek waar je de waarde gebruikt.<\/span> <span class=\"sg\" data-s=\"3\">Een array kan zich bijvoorbeeld als een getal gedragen.<\/span> <span class=\"sg\" data-s=\"4\">Dat getal is zijn lengte.<\/span> <span class=\"sg\" data-s=\"5\">Dezelfde array kan zich als een string gedragen.<\/span> <span class=\"sg\" data-s=\"6\">Dan plakt Raku de elementen aan elkaar.<\/span> <span class=\"sg\" data-s=\"7\">Hij kan zich ook als <code>True<\/code> of <code>False<\/code> gedragen.<\/span> <span class=\"sg\" data-s=\"8\">Dat laat zien of de array leeg is of niet.<\/span> <span class=\"sg\" data-s=\"9\">De code rond de array bepaalt wat je krijgt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Context verklaart veel dingen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Zonder context lijken die dingen vreemd.<\/span> <span class=\"sg\" data-s=\"2\">Waarom is <code>+@array<\/code> bijvoorbeeld een getal?<\/span> <span class=\"sg\" data-s=\"3\">Waarom gedraagt een array in een scalar zich als één item?<\/span> <span class=\"sg\" data-s=\"4\">En waarom controleert <code>if @array<\/code> of de array leeg is?<\/span> <span class=\"sg\" data-s=\"5\">Dit gedeelte toont de belangrijkste contexten.<\/span><\/p>"]]},"es":{"t":"Contextos","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">En Raku, un valor puede comportarse de formas diferentes.<\/span> <span class=\"sg\" data-s=\"1\">Depende del <em>contexto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">El contexto es el lugar donde usas el valor.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, un array puede actuar como un número.<\/span> <span class=\"sg\" data-s=\"4\">Este número es su longitud.<\/span> <span class=\"sg\" data-s=\"5\">El mismo array puede actuar como una cadena.<\/span> <span class=\"sg\" data-s=\"6\">Entonces sus elementos se unen.<\/span> <span class=\"sg\" data-s=\"7\">También puede actuar como <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Esto muestra si el array tiene elementos o está vacío.<\/span> <span class=\"sg\" data-s=\"9\">El código alrededor del array decide qué obtienes.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El contexto explica muchas cosas en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Sin él, estas cosas parecen raras.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, ¿por qué <code>+@array<\/code> es un número?<\/span> <span class=\"sg\" data-s=\"3\">¿Por qué un array en un escalar actúa como un solo elemento?<\/span> <span class=\"sg\" data-s=\"4\">¿Y por qué <code>if @array<\/code> comprueba si el array está vacío?<\/span> <span class=\"sg\" data-s=\"5\">Esta sección muestra los contextos principales.<\/span><\/p>"]]},"it":{"t":"Contesti","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">In Raku, un valore può comportarsi in modi diversi.<\/span> <span class=\"sg\" data-s=\"1\">Dipende dal <em>contesto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Il contesto è il posto dove usi il valore.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, un array può agire come un numero.<\/span> <span class=\"sg\" data-s=\"4\">Questo numero è la sua lunghezza.<\/span> <span class=\"sg\" data-s=\"5\">Lo stesso array può agire come una stringa.<\/span> <span class=\"sg\" data-s=\"6\">Allora i suoi elementi sono uniti insieme.<\/span> <span class=\"sg\" data-s=\"7\">Può anche agire come <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Questo mostra se l'array è vuoto o se ha elementi.<\/span> <span class=\"sg\" data-s=\"9\">Il codice intorno all'array decide cosa ottieni.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il contesto spiega molte cose in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Senza di esso, queste cose sembrano strane.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, perché <code>+@array<\/code> è un numero?<\/span> <span class=\"sg\" data-s=\"3\">Perché un array in uno scalare agisce come un solo elemento?<\/span> <span class=\"sg\" data-s=\"4\">E perché <code>if @array<\/code> controlla se l'array è vuoto?<\/span> <span class=\"sg\" data-s=\"5\">Questa sezione mostra i contesti principali.<\/span><\/p>"]]},"lv":{"t":"Konteksti 🆕","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku valodā vērtība var uzvesties dažādi.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir atkarīgs no <em>konteksta<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Konteksts ir vieta, kur jūs izmantojat vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, masīvs var darboties kā skaitlis.<\/span> <span class=\"sg\" data-s=\"4\">Šis skaitlis ir tā garums.<\/span> <span class=\"sg\" data-s=\"5\">Tas pats masīvs var darboties kā virkne.<\/span> <span class=\"sg\" data-s=\"6\">Tad tā elementi ir savienoti kopā.<\/span> <span class=\"sg\" data-s=\"7\">Tas var darboties arī kā <code>True<\/code> vai <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Tas parāda, vai masīvs ir tukšs vai nav.<\/span> <span class=\"sg\" data-s=\"9\">Kods ap masīvu nosaka, kuru no tiem jūs saņemat.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Konteksts izskaidro daudzas lietas Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Bez tā šīs lietas izskatās dīvaini.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, kāpēc <code>+@array<\/code> ir skaitlis?<\/span> <span class=\"sg\" data-s=\"3\">Kāpēc masīvs skalārā darbojas kā viens elements?<\/span> <span class=\"sg\" data-s=\"4\">Un kāpēc <code>if @array<\/code> pārbauda, vai masīvs ir tukšs?<\/span> <span class=\"sg\" data-s=\"5\">Šī sadaļa parāda galvenos kontekstus.<\/span><\/p>"]]},"ru":{"t":"Контексты","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">В Raku значение может вести себя по-разному.<\/span> <span class=\"sg\" data-s=\"1\">Это зависит от <em>контекста<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Контекст — это место, где вы используете значение.<\/span> <span class=\"sg\" data-s=\"3\">Например, массив может работать как число.<\/span> <span class=\"sg\" data-s=\"4\">Это число — его длина.<\/span> <span class=\"sg\" data-s=\"5\">Тот же массив может работать как строка.<\/span> <span class=\"sg\" data-s=\"6\">Тогда его элементы соединяются вместе.<\/span> <span class=\"sg\" data-s=\"7\">Ещё он может работать как <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Так видно, пустой массив или нет.<\/span> <span class=\"sg\" data-s=\"9\">Код вокруг массива решает, что вы получите.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Контекст объясняет многое в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Без него эти вещи выглядят странно.<\/span> <span class=\"sg\" data-s=\"2\">Например, почему <code>+@array<\/code> — это число?<\/span> <span class=\"sg\" data-s=\"3\">Почему массив в скаляре работает как один элемент?<\/span> <span class=\"sg\" data-s=\"4\">И почему <code>if @array<\/code> проверяет, пустой ли массив?<\/span> <span class=\"sg\" data-s=\"5\">Этот раздел показывает главные контексты.<\/span><\/p>"]]},"uk":{"t":"Контексти","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">У Raku значення може поводитися по-різному.<\/span> <span class=\"sg\" data-s=\"1\">Це залежить від <em>контексту<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Контекст — це місце, де ви використовуєте значення.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, масив може поводитися як число.<\/span> <span class=\"sg\" data-s=\"4\">Це число — його довжина.<\/span> <span class=\"sg\" data-s=\"5\">Той самий масив може поводитися як рядок.<\/span> <span class=\"sg\" data-s=\"6\">Тоді його елементи з'єднуються разом.<\/span> <span class=\"sg\" data-s=\"7\">Він також може поводитися як <code>True<\/code> або <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Це показує, порожній масив чи ні.<\/span> <span class=\"sg\" data-s=\"9\">Код навколо масиву вирішує, що ви отримаєте.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Контекст пояснює багато речей у Raku.<\/span> <span class=\"sg\" data-s=\"1\">Без нього ці речі здаються дивними.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, чому <code>+@array<\/code> — це число?<\/span> <span class=\"sg\" data-s=\"3\">Чому масив у скалярі поводиться як один елемент?<\/span> <span class=\"sg\" data-s=\"4\">І чому <code>if @array<\/code> перевіряє, чи масив порожній?<\/span> <span class=\"sg\" data-s=\"5\">Цей розділ показує основні контексти.<\/span><\/p>"]]},"bg":{"t":"Контексти 🆕","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">В Raku една стойност може да се държи по различни начини.<\/span> <span class=\"sg\" data-s=\"1\">Това зависи от <em>контекста<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Контекстът е мястото, където използвате стойността.<\/span> <span class=\"sg\" data-s=\"3\">Например, масив може да действа като число.<\/span> <span class=\"sg\" data-s=\"4\">Това число е неговата дължина.<\/span> <span class=\"sg\" data-s=\"5\">Същият масив може да действа като низ.<\/span> <span class=\"sg\" data-s=\"6\">Тогава елементите му се съединяват.<\/span> <span class=\"sg\" data-s=\"7\">Той може да действа и като <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Това показва дали масивът е празен, или не.<\/span> <span class=\"sg\" data-s=\"9\">Кодът около масива решава кое от тях получавате.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Контекстът обяснява много неща в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Без него тези неща изглеждат странно.<\/span> <span class=\"sg\" data-s=\"2\">Например, защо <code>+@array<\/code> е число?<\/span> <span class=\"sg\" data-s=\"3\">Защо масив в скалар действа като един елемент?<\/span> <span class=\"sg\" data-s=\"4\">И защо <code>if @array<\/code> проверява дали масивът е празен?<\/span> <span class=\"sg\" data-s=\"5\">Този раздел показва основните контексти.<\/span><\/p>"]]},"eo":{"t":"Kuntekstoj","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">En Raku, valoro povas konduti en diversaj manieroj.<\/span> <span class=\"sg\" data-s=\"1\">Tio dependas de la <em>kunteksto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La kunteksto estas la loko, kie vi uzas la valoron.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, tabelo povas agi kiel nombro.<\/span> <span class=\"sg\" data-s=\"4\">Tiu nombro estas ĝia longo.<\/span> <span class=\"sg\" data-s=\"5\">La sama tabelo povas agi kiel ĉeno.<\/span> <span class=\"sg\" data-s=\"6\">Tiam ĝiaj elementoj kuniĝas.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ankaŭ povas agi kiel <code>True<\/code> aŭ <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Tio montras, ĉu la tabelo estas malplena aŭ ne.<\/span> <span class=\"sg\" data-s=\"9\">La kodo ĉirkaŭ la tabelo decidas, kion vi ricevas.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kunteksto klarigas multajn aferojn en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Sen ĝi, tiuj aferoj aspektas strangaj.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, kial <code>+@array<\/code> estas nombro?<\/span> <span class=\"sg\" data-s=\"3\">Kial tabelo en skalaro agas kiel unu ero?<\/span> <span class=\"sg\" data-s=\"4\">Kaj kial <code>if @array<\/code> kontrolas, ĉu la tabelo estas malplena?<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiu sekcio montras la ĉefajn kuntekstojn.<\/span><\/p>"]]},"la":{"t":"Contextus","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">In Raku valor diversis modis se gerere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hoc a <em>contextu<\/em> pendet.<\/span> <span class=\"sg\" data-s=\"2\">Contextus est locus ubi valorem adhibes.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, ordo ut numerus agere potest.<\/span> <span class=\"sg\" data-s=\"4\">Hic numerus est longitudo eius.<\/span> <span class=\"sg\" data-s=\"5\">Idem ordo ut chorda agere potest.<\/span> <span class=\"sg\" data-s=\"6\">Tum elementa eius coniuncta sunt.<\/span> <span class=\"sg\" data-s=\"7\">Etiam ut <code>True<\/code> aut <code>False<\/code> agere potest.<\/span> <span class=\"sg\" data-s=\"8\">Hoc ostendit an ordo vacuus sit.<\/span> <span class=\"sg\" data-s=\"9\">Codex circa ordinem decernit quid accipias.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Contextus multa in Raku explicat.<\/span> <span class=\"sg\" data-s=\"1\">Sine eo, haec mira videntur.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, cur <code>+@array<\/code> numerus est?<\/span> <span class=\"sg\" data-s=\"3\">Cur ordo in scalari ut unum item agit?<\/span> <span class=\"sg\" data-s=\"4\">Et cur <code>if @array<\/code> probat an ordo vacuus sit?<\/span> <span class=\"sg\" data-s=\"5\">Haec sectio praecipuos contextus ostendit.<\/span><\/p>"]]}}}</script>
