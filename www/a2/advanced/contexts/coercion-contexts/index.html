<script type="application/json" id="page-data">{"u":"advanced/contexts/coercion-contexts","n":383,"k":"topic","pv":"advanced/contexts","nx":"advanced/contexts/coercion-contexts/quiz","tr":["advanced","advanced/contexts"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Numeric, string, and Boolean context","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Three contexts are very common.<\/span> <span class=\"sg\" data-s=\"1\">In the first one, a value acts as a number.<\/span> <span class=\"sg\" data-s=\"2\">In the second, it acts as a string.<\/span> <span class=\"sg\" data-s=\"3\">In the third, it acts as <code>True<\/code> or <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Each of these contexts has a prefix operator.<\/span> <span class=\"sg\" data-s=\"5\">The operator goes before the value.<\/span> <span class=\"sg\" data-s=\"6\">It sets the context directly:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numeric context: the value acts as a number<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — string context: the value acts as a string<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Boolean context: the value acts as <code>True<\/code> or <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Use them with an array.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> gives the length of the array.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> gives its elements, with spaces between them.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> tells you if the array has any elements:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An empty array is <code>0<\/code> in numeric context.<\/span> <span class=\"sg\" data-s=\"1\">In Boolean context, it is <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You do not always have to write these operators.<\/span> <span class=\"sg\" data-s=\"1\">Often, Raku sets the right context for you.<\/span> <span class=\"sg\" data-s=\"2\">Arithmetic puts values in numeric context.<\/span> <span class=\"sg\" data-s=\"3\">Joining strings puts them in string context.<\/span> <span class=\"sg\" data-s=\"4\">And <code>if<\/code>, <code>while<\/code>, <code>and<\/code> and <code>or<\/code> put their condition in Boolean context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So <code>if @array { … }<\/code> works as you expect.<\/span> <span class=\"sg\" data-s=\"1\">An array with elements is true.<\/span> <span class=\"sg\" data-s=\"2\">With the prefix operators, you ask for the same conversions yourself.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also put <code>if<\/code> after the statement.<\/span> <span class=\"sg\" data-s=\"1\">Then the code is short and clear:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"de":{"t":"Numerischer, String- und Boolescher Kontext","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Drei Kontexte sind sehr häufig.<\/span> <span class=\"sg\" data-s=\"1\">Im ersten verhält sich ein Wert wie eine Zahl.<\/span> <span class=\"sg\" data-s=\"2\">Im zweiten verhält er sich wie ein String.<\/span> <span class=\"sg\" data-s=\"3\">Im dritten verhält er sich wie <code>True<\/code> oder <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Jeder dieser Kontexte hat einen Präfixoperator.<\/span> <span class=\"sg\" data-s=\"5\">Der Operator steht vor dem Wert.<\/span> <span class=\"sg\" data-s=\"6\">Er setzt den Kontext direkt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numerischer Kontext: Der Wert verhält sich wie eine Zahl<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — Stringkontext: Der Wert verhält sich wie ein String<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Boolescher Kontext: Der Wert verhält sich wie <code>True<\/code> oder <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Verwende sie mit einem Array.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> liefert die Länge des Arrays.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> liefert seine Elemente, mit Leerzeichen dazwischen.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> sagt dir, ob das Array Elemente hat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein leeres Array ist im numerischen Kontext <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Im Booleschen Kontext ist es <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Du musst diese Operatoren nicht immer schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Oft setzt Raku den richtigen Kontext für dich.<\/span> <span class=\"sg\" data-s=\"2\">Arithmetik setzt Werte in den numerischen Kontext.<\/span> <span class=\"sg\" data-s=\"3\">Das Verbinden von Strings setzt sie in den Stringkontext.<\/span> <span class=\"sg\" data-s=\"4\">Und <code>if<\/code>, <code>while<\/code>, <code>and<\/code> und <code>or<\/code> setzen ihre Bedingung in den Booleschen Kontext:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Also funktioniert <code>if @array { … }<\/code> so, wie du es erwartest.<\/span> <span class=\"sg\" data-s=\"1\">Ein Array mit Elementen ist wahr.<\/span> <span class=\"sg\" data-s=\"2\">Mit den Präfixoperatoren verlangst du dieselben Umwandlungen selbst.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst <code>if<\/code> auch hinter die Anweisung schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Dann ist der Code kurz und klar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"nl":{"t":"Numerieke, string- en Booleaanse context","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Drie contexten komen heel vaak voor.<\/span> <span class=\"sg\" data-s=\"1\">In de eerste gedraagt een waarde zich als een getal.<\/span> <span class=\"sg\" data-s=\"2\">In de tweede gedraagt hij zich als een string.<\/span> <span class=\"sg\" data-s=\"3\">In de derde gedraagt hij zich als <code>True<\/code> of <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Elk van deze contexten heeft een prefix-operator.<\/span> <span class=\"sg\" data-s=\"5\">De operator staat voor de waarde.<\/span> <span class=\"sg\" data-s=\"6\">Hij stelt de context direct in:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numerieke context: de waarde gedraagt zich als een getal<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — stringcontext: de waarde gedraagt zich als een string<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Booleaanse context: de waarde gedraagt zich als <code>True<\/code> of <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Gebruik ze met een array.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> geeft de lengte van de array.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> geeft zijn elementen, met spaties ertussen.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> zegt of de array elementen heeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een lege array is <code>0<\/code> in numerieke context.<\/span> <span class=\"sg\" data-s=\"1\">In Booleaanse context is hij <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je hoeft deze operatoren niet altijd te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Vaak stelt Raku de juiste context voor je in.<\/span> <span class=\"sg\" data-s=\"2\">Rekenen zet waarden in numerieke context.<\/span> <span class=\"sg\" data-s=\"3\">Strings samenvoegen zet ze in stringcontext.<\/span> <span class=\"sg\" data-s=\"4\">En <code>if<\/code>, <code>while<\/code>, <code>and<\/code> en <code>or<\/code> zetten hun voorwaarde in Booleaanse context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dus werkt <code>if @array { … }<\/code> zoals je verwacht.<\/span> <span class=\"sg\" data-s=\"1\">Een array met elementen is waar.<\/span> <span class=\"sg\" data-s=\"2\">Met de prefix-operatoren vraag je zelf om dezelfde conversies.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt <code>if<\/code> ook na het statement zetten.<\/span> <span class=\"sg\" data-s=\"1\">Dan is de code kort en duidelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"es":{"t":"Contexto numérico, de cadena y booleano","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Tres contextos son muy comunes.<\/span> <span class=\"sg\" data-s=\"1\">En el primero, un valor actúa como un número.<\/span> <span class=\"sg\" data-s=\"2\">En el segundo, actúa como una cadena.<\/span> <span class=\"sg\" data-s=\"3\">En el tercero, actúa como <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Cada uno de estos contextos tiene un operador prefijo.<\/span> <span class=\"sg\" data-s=\"5\">El operador va antes del valor.<\/span> <span class=\"sg\" data-s=\"6\">Pone el contexto directamente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contexto numérico: el valor actúa como un número<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contexto de cadena: el valor actúa como una cadena<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contexto booleano: el valor actúa como <code>True<\/code> o <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Úsalos con un array.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> da la longitud del array.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> da sus elementos, con espacios entre ellos.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> te dice si el array tiene elementos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un array vacío es <code>0<\/code> en contexto numérico.<\/span> <span class=\"sg\" data-s=\"1\">En contexto booleano, es <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">No siempre tienes que escribir estos operadores.<\/span> <span class=\"sg\" data-s=\"1\">Muchas veces, Raku pone el contexto correcto por ti.<\/span> <span class=\"sg\" data-s=\"2\">La aritmética pone los valores en contexto numérico.<\/span> <span class=\"sg\" data-s=\"3\">Unir cadenas los pone en contexto de cadena.<\/span> <span class=\"sg\" data-s=\"4\">Y <code>if<\/code>, <code>while<\/code>, <code>and<\/code> y <code>or<\/code> ponen su condición en contexto booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Así que <code>if @array { … }<\/code> funciona como esperas.<\/span> <span class=\"sg\" data-s=\"1\">Un array con elementos es verdadero.<\/span> <span class=\"sg\" data-s=\"2\">Con los operadores prefijo, tú mismo pides las mismas conversiones.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes poner <code>if<\/code> después de la sentencia.<\/span> <span class=\"sg\" data-s=\"1\">Así el código es corto y claro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"it":{"t":"Contesto numerico, stringa e booleano","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Tre contesti sono molto comuni.<\/span> <span class=\"sg\" data-s=\"1\">Nel primo, un valore agisce come un numero.<\/span> <span class=\"sg\" data-s=\"2\">Nel secondo, agisce come una stringa.<\/span> <span class=\"sg\" data-s=\"3\">Nel terzo, agisce come <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ognuno di questi contesti ha un operatore prefisso.<\/span> <span class=\"sg\" data-s=\"5\">L'operatore va prima del valore.<\/span> <span class=\"sg\" data-s=\"6\">Imposta il contesto direttamente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contesto numerico: il valore agisce come un numero<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contesto stringa: il valore agisce come una stringa<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contesto Booleano: il valore agisce come <code>True<\/code> o <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Usali con un array.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> dà la lunghezza dell'array.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> dà i suoi elementi, con spazi tra loro.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> ti dice se l'array ha elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un array vuoto è <code>0<\/code> in contesto numerico.<\/span> <span class=\"sg\" data-s=\"1\">In contesto Booleano, è <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Non devi sempre scrivere questi operatori.<\/span> <span class=\"sg\" data-s=\"1\">Spesso Raku imposta il contesto giusto per te.<\/span> <span class=\"sg\" data-s=\"2\">L'aritmetica mette i valori in contesto numerico.<\/span> <span class=\"sg\" data-s=\"3\">Unire stringhe li mette in contesto stringa.<\/span> <span class=\"sg\" data-s=\"4\">E <code>if<\/code>, <code>while<\/code>, <code>and<\/code> e <code>or<\/code> mettono la loro condizione in contesto Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>if @array { … }<\/code> funziona come ti aspetti.<\/span> <span class=\"sg\" data-s=\"1\">Un array con elementi è vero.<\/span> <span class=\"sg\" data-s=\"2\">Con gli operatori prefisso, chiedi tu stesso le stesse conversioni.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche mettere <code>if<\/code> dopo l'istruzione.<\/span> <span class=\"sg\" data-s=\"1\">Allora il codice è breve e chiaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"lv":{"t":"Skaitliskais, virkņu un Būla konteksts","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Trīs konteksti ir ļoti bieži.<\/span> <span class=\"sg\" data-s=\"1\">Pirmajā vērtība darbojas kā skaitlis.<\/span> <span class=\"sg\" data-s=\"2\">Otrajā tā darbojas kā virkne.<\/span> <span class=\"sg\" data-s=\"3\">Trešajā tā darbojas kā <code>True<\/code> vai <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Katram no šiem kontekstiem ir prefiksa operators.<\/span> <span class=\"sg\" data-s=\"5\">Operators stāv pirms vērtības.<\/span> <span class=\"sg\" data-s=\"6\">Tas uzliek kontekstu tieši:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — skaitliskais konteksts: vērtība darbojas kā skaitlis<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — virknes konteksts: vērtība darbojas kā virkne<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Būla konteksts: vērtība darbojas kā <code>True<\/code> vai <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet tos ar masīvu.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> dod masīva garumu.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> dod tā elementus ar atstarpēm starp tiem.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> pasaka, vai masīvā ir kādi elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tukšs masīvs skaitliskajā kontekstā ir <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Būla kontekstā tas ir <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jums ne vienmēr ir jāraksta šie operatori.<\/span> <span class=\"sg\" data-s=\"1\">Bieži Raku jūsu vietā uzliek pareizo kontekstu.<\/span> <span class=\"sg\" data-s=\"2\">Aritmētika ievieto vērtības skaitliskajā kontekstā.<\/span> <span class=\"sg\" data-s=\"3\">Virkņu savienošana ievieto tās virknes kontekstā.<\/span> <span class=\"sg\" data-s=\"4\">Un <code>if<\/code>, <code>while<\/code>, <code>and<\/code> un <code>or<\/code> ievieto savu nosacījumu Būla kontekstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>if @array { … }<\/code> darbojas tā, kā jūs gaidāt.<\/span> <span class=\"sg\" data-s=\"1\">Masīvs ar elementiem ir patiess.<\/span> <span class=\"sg\" data-s=\"2\">Ar prefiksa operatoriem jūs paši prasāt tās pašas pārvēršanas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat likt <code>if<\/code> arī aiz izteikuma.<\/span> <span class=\"sg\" data-s=\"1\">Tad kods ir īss un skaidrs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"ru":{"t":"Числовой, строковый и булев контекст","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Три контекста встречаются очень часто.<\/span> <span class=\"sg\" data-s=\"1\">В первом значение работает как число.<\/span> <span class=\"sg\" data-s=\"2\">Во втором оно работает как строка.<\/span> <span class=\"sg\" data-s=\"3\">В третьем оно работает как <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">У каждого из этих контекстов есть префиксный оператор.<\/span> <span class=\"sg\" data-s=\"5\">Оператор стоит перед значением.<\/span> <span class=\"sg\" data-s=\"6\">Он прямо задаёт контекст:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числовой контекст: значение работает как число<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — строковый контекст: значение работает как строка<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — логический контекст: значение работает как <code>True<\/code> или <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Используйте их с массивом.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> даёт длину массива.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> даёт его элементы с пробелами между ними.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> говорит, есть ли в массиве элементы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пустой массив равен <code>0<\/code> в числовом контексте.<\/span> <span class=\"sg\" data-s=\"1\">В логическом контексте он равен <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вам не всегда нужно писать эти операторы.<\/span> <span class=\"sg\" data-s=\"1\">Часто Raku сам задаёт нужный контекст.<\/span> <span class=\"sg\" data-s=\"2\">Арифметика ставит значения в числовой контекст.<\/span> <span class=\"sg\" data-s=\"3\">Соединение строк ставит их в строковый контекст.<\/span> <span class=\"sg\" data-s=\"4\">А <code>if<\/code>, <code>while<\/code>, <code>and<\/code> и <code>or<\/code> ставят своё условие в логический контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поэтому <code>if @array { … }<\/code> работает так, как вы ждёте.<\/span> <span class=\"sg\" data-s=\"1\">Массив с элементами — истинный.<\/span> <span class=\"sg\" data-s=\"2\">С префиксными операторами вы сами просите те же преобразования.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ещё можно поставить <code>if<\/code> после инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Тогда код короткий и понятный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"uk":{"t":"Числовий, рядковий та булевий контекст","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Три контексти трапляються дуже часто.<\/span> <span class=\"sg\" data-s=\"1\">У першому значення поводиться як число.<\/span> <span class=\"sg\" data-s=\"2\">У другому воно поводиться як рядок.<\/span> <span class=\"sg\" data-s=\"3\">У третьому воно поводиться як <code>True<\/code> або <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Кожен із цих контекстів має префіксний оператор.<\/span> <span class=\"sg\" data-s=\"5\">Оператор стоїть перед значенням.<\/span> <span class=\"sg\" data-s=\"6\">Він прямо задає контекст:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числовий контекст: значення поводиться як число<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — рядковий контекст: значення поводиться як рядок<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — булевий контекст: значення поводиться як <code>True<\/code> або <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Застосуйте їх до масиву.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> дає довжину масиву.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> дає його елементи з пробілами між ними.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> каже, чи є в масиві елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Порожній масив у числовому контексті — це <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У булевому контексті він — <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вам не завжди треба писати ці оператори.<\/span> <span class=\"sg\" data-s=\"1\">Часто Raku сам задає потрібний контекст за вас.<\/span> <span class=\"sg\" data-s=\"2\">Арифметика ставить значення в числовий контекст.<\/span> <span class=\"sg\" data-s=\"3\">З'єднання рядків ставить їх у рядковий контекст.<\/span> <span class=\"sg\" data-s=\"4\">А <code>if<\/code>, <code>while<\/code>, <code>and<\/code> та <code>or<\/code> ставлять свою умову в булевий контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, тут @a це його довжина: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тож <code>if @array { … }<\/code> працює так, як ви чекаєте.<\/span> <span class=\"sg\" data-s=\"1\">Масив з елементами є істинним.<\/span> <span class=\"sg\" data-s=\"2\">Префіксними операторами ви самі просите ті самі перетворення.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви також можете поставити <code>if<\/code> після виразу.<\/span> <span class=\"sg\" data-s=\"1\">Тоді код короткий і зрозумілий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"bg":{"t":"Числов, низов и булев контекст","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Три контекста са много чести.<\/span> <span class=\"sg\" data-s=\"1\">В първия стойността действа като число.<\/span> <span class=\"sg\" data-s=\"2\">Във втория тя действа като низ.<\/span> <span class=\"sg\" data-s=\"3\">В третия тя действа като <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всеки от тези контексти има префиксен оператор.<\/span> <span class=\"sg\" data-s=\"5\">Операторът стои пред стойността.<\/span> <span class=\"sg\" data-s=\"6\">Той задава контекста направо:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числов контекст: стойността действа като число<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — низов контекст: стойността действа като низ<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — булев контекст: стойността действа като <code>True<\/code> или <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Използвайте ги с масив.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> дава дължината на масива.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> дава елементите му с интервали между тях.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> ви казва дали масивът има елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Празен масив е <code>0<\/code> в числов контекст.<\/span> <span class=\"sg\" data-s=\"1\">В булев контекст той е <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Не винаги трябва да пишете тези оператори.<\/span> <span class=\"sg\" data-s=\"1\">Често Raku задава правилния контекст вместо вас.<\/span> <span class=\"sg\" data-s=\"2\">Аритметиката поставя стойностите в числов контекст.<\/span> <span class=\"sg\" data-s=\"3\">Съединяването на низове ги поставя в низов контекст.<\/span> <span class=\"sg\" data-s=\"4\">А <code>if<\/code>, <code>while<\/code>, <code>and<\/code> и <code>or<\/code> поставят условието си в булев контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Така <code>if @array { … }<\/code> работи, както очаквате.<\/span> <span class=\"sg\" data-s=\"1\">Масив с елементи е истина.<\/span> <span class=\"sg\" data-s=\"2\">С префиксните оператори вие сами искате същите преобразувания.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да поставите <code>if<\/code> и след израза.<\/span> <span class=\"sg\" data-s=\"1\">Тогава кодът е кратък и ясен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"eo":{"t":"Nombra, ĉena kaj Boolea kunteksto","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Tri kuntekstoj estas tre oftaj.<\/span> <span class=\"sg\" data-s=\"1\">En la unua, valoro agas kiel nombro.<\/span> <span class=\"sg\" data-s=\"2\">En la dua, ĝi agas kiel ĉeno.<\/span> <span class=\"sg\" data-s=\"3\">En la tria, ĝi agas kiel <code>True<\/code> aŭ <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu el tiuj kuntekstoj havas prefiksan operatoron.<\/span> <span class=\"sg\" data-s=\"5\">La operatoro staras antaŭ la valoro.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi rekte agordas la kuntekston:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — nombra kunteksto: la valoro agas kiel nombro<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — ĉena kunteksto: la valoro agas kiel ĉeno<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — bulea kunteksto: la valoro agas kiel <code>True<\/code> aŭ <code>False<\/code><\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzu ilin kun tabelo.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> donas la longon de la tabelo.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> donas ĝiajn elementojn, kun spacoj inter ili.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> diras al vi, ĉu la tabelo havas iujn elementojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Malplena tabelo estas <code>0<\/code> en nombra kunteksto.<\/span> <span class=\"sg\" data-s=\"1\">En bulea kunteksto, ĝi estas <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi ne ĉiam devas skribi ĉi tiujn operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ofte Raku agordas la ĝustan kuntekston por vi.<\/span> <span class=\"sg\" data-s=\"2\">Aritmetiko metas valorojn en nombran kuntekston.<\/span> <span class=\"sg\" data-s=\"3\">Kunigo de ĉenoj metas ilin en ĉenan kuntekston.<\/span> <span class=\"sg\" data-s=\"4\">Kaj <code>if<\/code>, <code>while<\/code>, <code>and<\/code> kaj <code>or<\/code> metas sian kondiĉon en bulean kuntekston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Do <code>if @array { … }<\/code> funkcias, kiel vi atendas.<\/span> <span class=\"sg\" data-s=\"1\">Tabelo kun elementoj estas vera.<\/span> <span class=\"sg\" data-s=\"2\">Per la prefiksaj operatoroj, vi mem petas la samajn konvertojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas meti <code>if<\/code> post la deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la kodo estas mallonga kaj klara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"la":{"t":"Numericus, catenarius, et Booleanus contextus","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Tres contextus valde frequentes sunt.<\/span> <span class=\"sg\" data-s=\"1\">In primo valor ut numerus agit.<\/span> <span class=\"sg\" data-s=\"2\">In secundo ut chorda agit.<\/span> <span class=\"sg\" data-s=\"3\">In tertio ut <code>True<\/code> aut <code>False<\/code> agit.<\/span> <span class=\"sg\" data-s=\"4\">Quisque ex his contextibus operatorem praefixum habet.<\/span> <span class=\"sg\" data-s=\"5\">Operator ante valorem stat.<\/span> <span class=\"sg\" data-s=\"6\">Contextum directe ponit:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contextus numericus: valor ut numerus agit<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contextus chordae: valor ut chorda agit<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contextus Booleanus: valor ut <code>True<\/code> aut <code>False<\/code> agit<\/span><\/li><\/ul>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Adhibe eos cum ordine.<\/span> <span class=\"sg\" data-s=\"1\"><code>+<\/code> longitudinem ordinis dat.<\/span> <span class=\"sg\" data-s=\"2\"><code>~<\/code> elementa eius dat, cum spatiis inter ea.<\/span> <span class=\"sg\" data-s=\"3\"><code>?<\/code> tibi dicit an ordo ulla elementa habeat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordo vacuus est <code>0<\/code> in contextu numerico.<\/span> <span class=\"sg\" data-s=\"1\">In contextu Booleano est <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Non semper necesse est hos operatores scribere.<\/span> <span class=\"sg\" data-s=\"1\">Saepe Raku rectum contextum pro te ponit.<\/span> <span class=\"sg\" data-s=\"2\">Arithmetica valores in contextum numericum ponit.<\/span> <span class=\"sg\" data-s=\"3\">Coniunctio chordarum valores in contextum chordae ponit.<\/span> <span class=\"sg\" data-s=\"4\">Et <code>if<\/code>, <code>while<\/code>, <code>and<\/code> et <code>or<\/code> condicionem suam in contextum Booleanum ponunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>if @array { … }<\/code> operatur ut exspectas.<\/span> <span class=\"sg\" data-s=\"1\">Ordo cum elementis verus est.<\/span> <span class=\"sg\" data-s=\"2\">Cum operatoribus praefixis easdem conversiones ipse petis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Potes etiam <code>if<\/code> post enuntiatum ponere.<\/span> <span class=\"sg\" data-s=\"1\">Tum codex brevis et clarus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]}}}</script>
