<script type="application/json" id="page-data">{"u":"advanced/contexts/item-and-list","n":385,"k":"topic","pv":"advanced/contexts/coercion-contexts/quiz","nx":"advanced/contexts/item-and-list/quiz","tr":["advanced","advanced/contexts"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Item and list context","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">There are two more contexts.<\/span> <span class=\"sg\" data-s=\"1\">They decide one thing.<\/span> <span class=\"sg\" data-s=\"2\">Is a value a <strong>list<\/strong> of several values?<\/span> <span class=\"sg\" data-s=\"3\">Or is it one single <strong>item<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">The sigils <code>@<\/code> and <code>$<\/code> show this difference.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In <em>list context<\/em>, an array becomes its separate elements.<\/span> <span class=\"sg\" data-s=\"1\">A <code>for<\/code> loop puts its argument in list context.<\/span> <span class=\"sg\" data-s=\"2\">So the loop goes over each element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In <em>item context<\/em>, the same array is one single value.<\/span> <span class=\"sg\" data-s=\"1\">The contextualiser <code>$( … )<\/code> sets item context.<\/span> <span class=\"sg\" data-s=\"2\">Now the loop sees only one thing.<\/span> <span class=\"sg\" data-s=\"3\">So it runs one time:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Item context also explains this.<\/span> <span class=\"sg\" data-s=\"1\">You assign an array to a scalar.<\/span> <span class=\"sg\" data-s=\"2\">The scalar gets the whole array as one item.<\/span> <span class=\"sg\" data-s=\"3\">It does not copy the elements.<\/span> <span class=\"sg\" data-s=\"4\">The reason is that <code>my $x = @a<\/code> puts <code>@a<\/code> in item context.<\/span> <span class=\"sg\" data-s=\"5\">Note that this one item can be another container.<\/span> <span class=\"sg\" data-s=\"6\">And this container can have many items in it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> is a scalar container.<\/span> <span class=\"sg\" data-s=\"1\">So it now keeps one single object.<\/span> <span class=\"sg\" data-s=\"2\">This object is an <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">You can easily check this.<\/span> <span class=\"sg\" data-s=\"4\">Use <code>$var<\/code> as a kind of array reference.<\/span> <span class=\"sg\" data-s=\"5\">That is what other languages call it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The contextualiser <code>@( … )<\/code> does the opposite.<\/span> <span class=\"sg\" data-s=\"1\">It sets list context.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">There is also <em>sink context<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">In sink context, nobody uses the value of a statement.<\/span> <span class=\"sg\" data-s=\"2\">Raku just throws the value away.<\/span> <span class=\"sg\" data-s=\"3\">For example, a line can be there only for its side effect.<\/span> <span class=\"sg\" data-s=\"4\">A side effect is an extra action of the code, like printing.<\/span> <span class=\"sg\" data-s=\"5\">Sometimes a value in sink context does nothing useful.<\/span> <span class=\"sg\" data-s=\"6\">Then Raku may warn you about a “useless use”.<\/span> <span class=\"sg\" data-s=\"7\">This is a helpful hint.<\/span> <span class=\"sg\" data-s=\"8\">You probably forgot to use a result.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The sigil, <code>$<\/code> or <code>@<\/code>, is really a choice of context.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes you need another context.<\/span> <span class=\"sg\" data-s=\"2\">Then the contextualisers <code>$( )<\/code> and <code>@( )<\/code> change it.<\/span><\/p>"]]},"de":{"t":"Item- und Listenkontext","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Es gibt zwei weitere Kontexte.<\/span> <span class=\"sg\" data-s=\"1\">Sie entscheiden eine Sache.<\/span> <span class=\"sg\" data-s=\"2\">Ist ein Wert eine <strong>Liste<\/strong> aus mehreren Werten?<\/span> <span class=\"sg\" data-s=\"3\">Oder ist er ein einzelnes <strong>Element<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Die Sigils <code>@<\/code> und <code>$<\/code> zeigen diesen Unterschied.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Im <em>Listenkontext<\/em> wird ein Array zu seinen einzelnen Elementen.<\/span> <span class=\"sg\" data-s=\"1\">Eine <code>for<\/code>-Schleife setzt ihr Argument in den Listenkontext.<\/span> <span class=\"sg\" data-s=\"2\">Also geht die Schleife über jedes Element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Im <em>Elementkontext<\/em> ist dasselbe Array ein einzelner Wert.<\/span> <span class=\"sg\" data-s=\"1\">Der Kontextualisierer <code>$( … )<\/code> setzt den Elementkontext.<\/span> <span class=\"sg\" data-s=\"2\">Jetzt sieht die Schleife nur eine Sache.<\/span> <span class=\"sg\" data-s=\"3\">Also läuft sie einmal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Der Elementkontext erklärt auch Folgendes.<\/span> <span class=\"sg\" data-s=\"1\">Du weist einem Skalar ein Array zu.<\/span> <span class=\"sg\" data-s=\"2\">Der Skalar bekommt das ganze Array als ein Element.<\/span> <span class=\"sg\" data-s=\"3\">Er kopiert die Elemente nicht.<\/span> <span class=\"sg\" data-s=\"4\">Der Grund ist: <code>my $x = @a<\/code> setzt <code>@a<\/code> in den Elementkontext.<\/span> <span class=\"sg\" data-s=\"5\">Beachte: Dieses eine Element kann ein weiterer Container sein.<\/span> <span class=\"sg\" data-s=\"6\">Und dieser Container kann viele Elemente enthalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> ist ein Skalar-Container.<\/span> <span class=\"sg\" data-s=\"1\">Also enthält er jetzt ein einzelnes Objekt.<\/span> <span class=\"sg\" data-s=\"2\">Dieses Objekt ist ein <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Das kannst du leicht prüfen.<\/span> <span class=\"sg\" data-s=\"4\">Verwende <code>$var<\/code> als eine Art Array-Referenz.<\/span> <span class=\"sg\" data-s=\"5\">So heißt das in anderen Sprachen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Kontextualisierer <code>@( … )<\/code> macht das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Er setzt den Listenkontext.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch den <em>Sink-Kontext<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Im Sink-Kontext benutzt niemand den Wert einer Anweisung.<\/span> <span class=\"sg\" data-s=\"2\">Raku wirft den Wert einfach weg.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel kann eine Zeile nur wegen ihres Seiteneffekts da sein.<\/span> <span class=\"sg\" data-s=\"4\">Ein Seiteneffekt ist eine zusätzliche Aktion des Codes, wie das Ausgeben von Text.<\/span> <span class=\"sg\" data-s=\"5\">Manchmal tut ein Wert im Sink-Kontext nichts Nützliches.<\/span> <span class=\"sg\" data-s=\"6\">Dann warnt Raku dich vielleicht vor einer \"useless use\".<\/span> <span class=\"sg\" data-s=\"7\">Das ist ein hilfreicher Hinweis.<\/span> <span class=\"sg\" data-s=\"8\">Du hast wahrscheinlich vergessen, ein Ergebnis zu benutzen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Sigil, <code>$<\/code> oder <code>@<\/code>, ist eigentlich eine Wahl des Kontexts.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal brauchst du einen anderen Kontext.<\/span> <span class=\"sg\" data-s=\"2\">Dann ändern ihn die Kontextualisierer <code>$( )<\/code> und <code>@( )<\/code>.<\/span><\/p>"]]},"nl":{"t":"Item- en lijstcontext","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Er zijn nog twee contexten.<\/span> <span class=\"sg\" data-s=\"1\">Ze beslissen één ding.<\/span> <span class=\"sg\" data-s=\"2\">Is een waarde een <strong>lijst<\/strong> van meerdere waarden?<\/span> <span class=\"sg\" data-s=\"3\">Of is het één enkel <strong>item<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">De sigils <code>@<\/code> en <code>$<\/code> laten dit verschil zien.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In <em>lijstcontext<\/em> wordt een array zijn losse elementen.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>for<\/code>-lus zet zijn argument in lijstcontext.<\/span> <span class=\"sg\" data-s=\"2\">Dus gaat de lus langs elk element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In <em>itemcontext<\/em> is dezelfde array één enkele waarde.<\/span> <span class=\"sg\" data-s=\"1\">De contextomzetter <code>$( … )<\/code> stelt itemcontext in.<\/span> <span class=\"sg\" data-s=\"2\">Nu ziet de lus maar één ding.<\/span> <span class=\"sg\" data-s=\"3\">Dus loopt hij één keer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Itemcontext verklaart ook het volgende.<\/span> <span class=\"sg\" data-s=\"1\">Je wijst een array toe aan een scalar.<\/span> <span class=\"sg\" data-s=\"2\">De scalar krijgt de hele array als één item.<\/span> <span class=\"sg\" data-s=\"3\">Hij kopieert de elementen niet.<\/span> <span class=\"sg\" data-s=\"4\">De reden is dat <code>my $x = @a<\/code> de array <code>@a<\/code> in itemcontext zet.<\/span> <span class=\"sg\" data-s=\"5\">Let op: dit ene item kan een andere container zijn.<\/span> <span class=\"sg\" data-s=\"6\">En deze container kan veel items bevatten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> is een scalaire container.<\/span> <span class=\"sg\" data-s=\"1\">Dus bewaart hij nu één enkel object.<\/span> <span class=\"sg\" data-s=\"2\">Dit object is een <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt dit makkelijk controleren.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik <code>$var<\/code> als een soort array-referentie.<\/span> <span class=\"sg\" data-s=\"5\">Zo heet dat in andere talen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De contextomzetter <code>@( … )<\/code> doet het tegenovergestelde.<\/span> <span class=\"sg\" data-s=\"1\">Hij stelt lijstcontext in.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Er is ook <em>sink-context<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">In sink-context gebruikt niemand de waarde van een statement.<\/span> <span class=\"sg\" data-s=\"2\">Raku gooit de waarde gewoon weg.<\/span> <span class=\"sg\" data-s=\"3\">Een regel kan er bijvoorbeeld alleen zijn voor zijn neveneffect.<\/span> <span class=\"sg\" data-s=\"4\">Een neveneffect is een extra actie van de code, zoals afdrukken.<\/span> <span class=\"sg\" data-s=\"5\">Soms doet een waarde in sink-context niets nuttigs.<\/span> <span class=\"sg\" data-s=\"6\">Dan kan Raku je waarschuwen voor een \"useless use\".<\/span> <span class=\"sg\" data-s=\"7\">Dat is een handige hint.<\/span> <span class=\"sg\" data-s=\"8\">Je bent waarschijnlijk vergeten een resultaat te gebruiken.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De sigil, <code>$<\/code> of <code>@<\/code>, is eigenlijk een keuze van context.<\/span> <span class=\"sg\" data-s=\"1\">Soms heb je een andere context nodig.<\/span> <span class=\"sg\" data-s=\"2\">Dan veranderen de contextomzetters <code>$( )<\/code> en <code>@( )<\/code> hem.<\/span><\/p>"]]},"es":{"t":"Contexto de ítem y de lista","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Hay dos contextos más.<\/span> <span class=\"sg\" data-s=\"1\">Deciden una cosa.<\/span> <span class=\"sg\" data-s=\"2\">¿Es un valor una <strong>lista<\/strong> de varios valores?<\/span> <span class=\"sg\" data-s=\"3\">¿O es un solo <strong>elemento<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Los sigils <code>@<\/code> y <code>$<\/code> muestran esta diferencia.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En <em>contexto de lista<\/em>, un array se convierte en sus elementos separados.<\/span> <span class=\"sg\" data-s=\"1\">Un bucle <code>for<\/code> pone su argumento en contexto de lista.<\/span> <span class=\"sg\" data-s=\"2\">Así que el bucle recorre cada elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En <em>contexto de elemento<\/em>, el mismo array es un solo valor.<\/span> <span class=\"sg\" data-s=\"1\">El contextualizador <code>$( … )<\/code> pone el contexto de elemento.<\/span> <span class=\"sg\" data-s=\"2\">Ahora el bucle ve solo una cosa.<\/span> <span class=\"sg\" data-s=\"3\">Así que se ejecuta una vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">El contexto de elemento también explica esto.<\/span> <span class=\"sg\" data-s=\"1\">Asignas un array a un escalar.<\/span> <span class=\"sg\" data-s=\"2\">El escalar recibe el array completo como un solo elemento.<\/span> <span class=\"sg\" data-s=\"3\">No copia los elementos.<\/span> <span class=\"sg\" data-s=\"4\">La razón es que <code>my $x = @a<\/code> pone <code>@a<\/code> en contexto de elemento.<\/span> <span class=\"sg\" data-s=\"5\">Ten en cuenta que este único elemento puede ser otro contenedor.<\/span> <span class=\"sg\" data-s=\"6\">Y este contenedor puede tener muchos elementos dentro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> es un contenedor escalar.<\/span> <span class=\"sg\" data-s=\"1\">Así que ahora guarda un solo objeto.<\/span> <span class=\"sg\" data-s=\"2\">Este objeto es un <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puedes comprobarlo fácilmente.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>$var<\/code> como una especie de referencia a array.<\/span> <span class=\"sg\" data-s=\"5\">Así lo llaman otros lenguajes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El contextualizador <code>@( … )<\/code> hace lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Pone el contexto de lista.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">También existe el <em>contexto sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">En contexto sink, nadie usa el valor de una sentencia.<\/span> <span class=\"sg\" data-s=\"2\">Raku simplemente tira el valor.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, una línea puede estar ahí solo por su efecto secundario.<\/span> <span class=\"sg\" data-s=\"4\">Un efecto secundario es una acción extra del código, como imprimir.<\/span> <span class=\"sg\" data-s=\"5\">A veces un valor en contexto sink no hace nada útil.<\/span> <span class=\"sg\" data-s=\"6\">Entonces Raku puede avisarte de un “uso inútil”.<\/span> <span class=\"sg\" data-s=\"7\">Esta es una pista útil.<\/span> <span class=\"sg\" data-s=\"8\">Probablemente olvidaste usar un resultado.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El sigil, <code>$<\/code> o <code>@<\/code>, es en realidad una elección de contexto.<\/span> <span class=\"sg\" data-s=\"1\">A veces necesitas otro contexto.<\/span> <span class=\"sg\" data-s=\"2\">Entonces los contextualizadores <code>$( )<\/code> y <code>@( )<\/code> lo cambian.<\/span><\/p>"]]},"it":{"t":"Contesto elemento e lista","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ci sono altri due contesti.<\/span> <span class=\"sg\" data-s=\"1\">Decidono una cosa.<\/span> <span class=\"sg\" data-s=\"2\">Un valore è una <strong>lista<\/strong> di più valori?<\/span> <span class=\"sg\" data-s=\"3\">Oppure è un solo <strong>elemento<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">I sigilli <code>@<\/code> e <code>$<\/code> mostrano questa differenza.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nel <em>contesto lista<\/em>, un array diventa i suoi singoli elementi.<\/span> <span class=\"sg\" data-s=\"1\">Un ciclo <code>for<\/code> mette il suo argomento in contesto lista.<\/span> <span class=\"sg\" data-s=\"2\">Così il ciclo passa su ogni elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nel <em>contesto elemento<\/em>, lo stesso array è un solo valore.<\/span> <span class=\"sg\" data-s=\"1\">Il contestualizzatore <code>$( … )<\/code> imposta il contesto elemento.<\/span> <span class=\"sg\" data-s=\"2\">Ora il ciclo vede una sola cosa.<\/span> <span class=\"sg\" data-s=\"3\">Così gira una volta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il contesto elemento spiega anche questo.<\/span> <span class=\"sg\" data-s=\"1\">Assegni un array a uno scalare.<\/span> <span class=\"sg\" data-s=\"2\">Lo scalare riceve tutto l'array come un solo elemento.<\/span> <span class=\"sg\" data-s=\"3\">Non copia gli elementi.<\/span> <span class=\"sg\" data-s=\"4\">Il motivo è che <code>my $x = @a<\/code> mette <code>@a<\/code> in contesto elemento.<\/span> <span class=\"sg\" data-s=\"5\">Nota che questo unico elemento può essere un altro contenitore.<\/span> <span class=\"sg\" data-s=\"6\">E questo contenitore può avere molti elementi dentro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> è un contenitore scalare.<\/span> <span class=\"sg\" data-s=\"1\">Quindi ora contiene un solo oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Questo oggetto è un <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi verificarlo facilmente.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>$var<\/code> come una specie di riferimento ad array.<\/span> <span class=\"sg\" data-s=\"5\">Così lo chiamano altri linguaggi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il contestualizzatore <code>@( … )<\/code> fa il contrario.<\/span> <span class=\"sg\" data-s=\"1\">Imposta il contesto lista.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Esiste anche il <em>contesto sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Nel contesto sink, nessuno usa il valore di un'istruzione.<\/span> <span class=\"sg\" data-s=\"2\">Raku butta semplicemente via il valore.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, una riga può esserci solo per il suo effetto collaterale.<\/span> <span class=\"sg\" data-s=\"4\">Un effetto collaterale è un'azione in più del codice, come stampare.<\/span> <span class=\"sg\" data-s=\"5\">A volte un valore in contesto sink non fa niente di utile.<\/span> <span class=\"sg\" data-s=\"6\">Allora Raku può avvisarti di un “useless use”.<\/span> <span class=\"sg\" data-s=\"7\">Questo è un suggerimento utile.<\/span> <span class=\"sg\" data-s=\"8\">Probabilmente hai dimenticato di usare un risultato.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il sigillo, <code>$<\/code> o <code>@<\/code>, è in realtà una scelta di contesto.<\/span> <span class=\"sg\" data-s=\"1\">A volte ti serve un altro contesto.<\/span> <span class=\"sg\" data-s=\"2\">Allora i contestualizzatori <code>$( )<\/code> e <code>@( )<\/code> lo cambiano.<\/span><\/p>"]]},"lv":{"t":"Vienuma un saraksta konteksts","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ir vēl divi konteksti.<\/span> <span class=\"sg\" data-s=\"1\">Tie nosaka vienu lietu.<\/span> <span class=\"sg\" data-s=\"2\">Vai vērtība ir <strong>saraksts<\/strong> ar vairākām vērtībām?<\/span> <span class=\"sg\" data-s=\"3\">Vai arī tā ir viens <strong>elements<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Sigili <code>@<\/code> un <code>$<\/code> parāda šo atšķirību.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Saraksta kontekstā<\/em> masīvs kļūst par atsevišķiem elementiem.<\/span> <span class=\"sg\" data-s=\"1\">Cikls <code>for<\/code> ievieto savu argumentu saraksta kontekstā.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc cikls iet cauri katram elementam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Elementa kontekstā<\/em> tas pats masīvs ir viena vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Kontekstualizators <code>$( … )<\/code> uzliek elementa kontekstu.<\/span> <span class=\"sg\" data-s=\"2\">Tagad cikls redz tikai vienu lietu.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc tas izpildās vienu reizi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Elementa konteksts izskaidro arī šo.<\/span> <span class=\"sg\" data-s=\"1\">Jūs piešķirat masīvu skalāram.<\/span> <span class=\"sg\" data-s=\"2\">Skalārs saņem visu masīvu kā vienu elementu.<\/span> <span class=\"sg\" data-s=\"3\">Tas nekopē elementus.<\/span> <span class=\"sg\" data-s=\"4\">Iemesls ir tāds, ka <code>my $x = @a<\/code> ievieto <code>@a<\/code> elementa kontekstā.<\/span> <span class=\"sg\" data-s=\"5\">Ņemiet vērā, ka šis viens elements var būt cits konteineris.<\/span> <span class=\"sg\" data-s=\"6\">Un šajā konteinerā var būt daudz elementu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> ir skalārs konteineris.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tagad tas glabā vienu objektu.<\/span> <span class=\"sg\" data-s=\"2\">Šis objekts ir <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">To var viegli pārbaudīt.<\/span> <span class=\"sg\" data-s=\"4\">Izmantojiet <code>$var<\/code> kā sava veida masīva atsauci.<\/span> <span class=\"sg\" data-s=\"5\">Tā to sauc citās valodās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kontekstualizators <code>@( … )<\/code> dara pretējo.<\/span> <span class=\"sg\" data-s=\"1\">Tas uzliek saraksta kontekstu.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ir arī <em>izlietnes konteksts<\/em> (sink context).<\/span> <span class=\"sg\" data-s=\"1\">Izlietnes kontekstā neviens neizmanto izteikuma vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Raku vienkārši izmet šo vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, rinda var būt tikai sava blakusefekta dēļ.<\/span> <span class=\"sg\" data-s=\"4\">Blakusefekts ir koda papildu darbība, piemēram, drukāšana.<\/span> <span class=\"sg\" data-s=\"5\">Dažreiz vērtība izlietnes kontekstā nedara neko noderīgu.<\/span> <span class=\"sg\" data-s=\"6\">Tad Raku var jūs brīdināt par \"bezjēdzīgu lietojumu\" (useless use).<\/span> <span class=\"sg\" data-s=\"7\">Tas ir noderīgs padoms.<\/span> <span class=\"sg\" data-s=\"8\">Jūs droši vien aizmirsāt izmantot rezultātu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sigils, <code>$<\/code> vai <code>@<\/code>, patiesībā ir konteksta izvēle.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz jums vajag citu kontekstu.<\/span> <span class=\"sg\" data-s=\"2\">Tad kontekstualizatori <code>$( )<\/code> un <code>@( )<\/code> to maina.<\/span><\/p>"]]},"ru":{"t":"Элементный и списковый контекст","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Есть ещё два контекста.<\/span> <span class=\"sg\" data-s=\"1\">Они решают одну вещь.<\/span> <span class=\"sg\" data-s=\"2\">Значение — это <strong>список<\/strong> из нескольких значений?<\/span> <span class=\"sg\" data-s=\"3\">Или это один <strong>элемент<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Сигилы <code>@<\/code> и <code>$<\/code> показывают эту разницу.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В <em>контексте списка<\/em> массив распадается на отдельные элементы.<\/span> <span class=\"sg\" data-s=\"1\">Цикл <code>for<\/code> ставит свой аргумент в контекст списка.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому цикл проходит по каждому элементу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В <em>контексте элемента<\/em> тот же массив — одно значение.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуализатор <code>$( … )<\/code> задаёт контекст элемента.<\/span> <span class=\"sg\" data-s=\"2\">Теперь цикл видит только одну вещь.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому он выполняется один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Контекст элемента объясняет и это.<\/span> <span class=\"sg\" data-s=\"1\">Вы присваиваете массив скаляру.<\/span> <span class=\"sg\" data-s=\"2\">Скаляр получает весь массив как один элемент.<\/span> <span class=\"sg\" data-s=\"3\">Он не копирует элементы.<\/span> <span class=\"sg\" data-s=\"4\">Причина в том, что <code>my $x = @a<\/code> ставит <code>@a<\/code> в контекст элемента.<\/span> <span class=\"sg\" data-s=\"5\">Обратите внимание: этот один элемент может быть другим контейнером.<\/span> <span class=\"sg\" data-s=\"6\">А в этом контейнере может быть много элементов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> — это скалярный контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому теперь он хранит один объект.<\/span> <span class=\"sg\" data-s=\"2\">Этот объект — <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это легко проверить.<\/span> <span class=\"sg\" data-s=\"4\">Используйте <code>$var<\/code> как своего рода ссылку на массив.<\/span> <span class=\"sg\" data-s=\"5\">Так это называют в других языках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Контекстуализатор <code>@( … )<\/code> делает обратное.<\/span> <span class=\"sg\" data-s=\"1\">Он задаёт контекст списка.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Есть ещё <em>контекст поглощения (sink context)<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">В этом контексте никто не использует значение выражения.<\/span> <span class=\"sg\" data-s=\"2\">Raku просто выбрасывает это значение.<\/span> <span class=\"sg\" data-s=\"3\">Например, строка кода может быть нужна только ради побочного эффекта.<\/span> <span class=\"sg\" data-s=\"4\">Побочный эффект — это дополнительное действие кода, например печать.<\/span> <span class=\"sg\" data-s=\"5\">Иногда значение в контексте поглощения не делает ничего полезного.<\/span> <span class=\"sg\" data-s=\"6\">Тогда Raku может предупредить вас о «бесполезном использовании» (useless use).<\/span> <span class=\"sg\" data-s=\"7\">Это полезная подсказка.<\/span> <span class=\"sg\" data-s=\"8\">Наверное, вы забыли использовать результат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сигил, <code>$<\/code> или <code>@<\/code>, — это на самом деле выбор контекста.<\/span> <span class=\"sg\" data-s=\"1\">Иногда вам нужен другой контекст.<\/span> <span class=\"sg\" data-s=\"2\">Тогда контекстуализаторы <code>$( )<\/code> и <code>@( )<\/code> меняют его.<\/span><\/p>"]]},"uk":{"t":"Штучний та списковий контекст","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Є ще два контексти.<\/span> <span class=\"sg\" data-s=\"1\">Вони вирішують одне питання.<\/span> <span class=\"sg\" data-s=\"2\">Значення — це <strong>список<\/strong> із кількох значень?<\/span> <span class=\"sg\" data-s=\"3\">Чи це один-єдиний <strong>елемент<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Сигіли <code>@<\/code> і <code>$<\/code> показують цю різницю.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У <em>списковому контексті<\/em> масив стає окремими елементами.<\/span> <span class=\"sg\" data-s=\"1\">Цикл <code>for<\/code> ставить свій аргумент у списковий контекст.<\/span> <span class=\"sg\" data-s=\"2\">Тож цикл проходить по кожному елементу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У <em>штучному контексті<\/em> той самий масив — це одне значення.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуалізатор <code>$( … )<\/code> задає штучний контекст.<\/span> <span class=\"sg\" data-s=\"2\">Тепер цикл бачить лише одну річ.<\/span> <span class=\"sg\" data-s=\"3\">Тож він виконується один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Штучний контекст пояснює і ось що.<\/span> <span class=\"sg\" data-s=\"1\">Ви присвоюєте масив скаляру.<\/span> <span class=\"sg\" data-s=\"2\">Скаляр отримує весь масив як один елемент.<\/span> <span class=\"sg\" data-s=\"3\">Він не копіює елементи.<\/span> <span class=\"sg\" data-s=\"4\">Причина в тому, що <code>my $x = @a<\/code> ставить <code>@a<\/code> у штучний контекст.<\/span> <span class=\"sg\" data-s=\"5\">Зверніть увагу, що цей один елемент може бути іншим контейнером.<\/span> <span class=\"sg\" data-s=\"6\">А в цьому контейнері може бути багато елементів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> — це скалярний контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Тож тепер він зберігає один об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Цей об'єкт — <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це легко перевірити.<\/span> <span class=\"sg\" data-s=\"4\">Використайте <code>$var<\/code> як своєрідне посилання на масив.<\/span> <span class=\"sg\" data-s=\"5\">Так це називають в інших мовах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Контекстуалізатор <code>@( … )<\/code> робить протилежне.<\/span> <span class=\"sg\" data-s=\"1\">Він задає списковий контекст.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Є ще <em>контекст стоку<\/em> (sink context).<\/span> <span class=\"sg\" data-s=\"1\">У контексті стоку ніхто не використовує значення оператора.<\/span> <span class=\"sg\" data-s=\"2\">Raku просто викидає це значення.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, рядок коду може існувати лише заради побічного ефекту.<\/span> <span class=\"sg\" data-s=\"4\">Побічний ефект — це додаткова дія коду, як-от виведення.<\/span> <span class=\"sg\" data-s=\"5\">Іноді значення в контексті стоку не робить нічого корисного.<\/span> <span class=\"sg\" data-s=\"6\">Тоді Raku може попередити вас про «useless use».<\/span> <span class=\"sg\" data-s=\"7\">Це корисна підказка.<\/span> <span class=\"sg\" data-s=\"8\">Мабуть, ви забули використати результат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сигіл, <code>$<\/code> або <code>@<\/code>, — це насправді вибір контексту.<\/span> <span class=\"sg\" data-s=\"1\">Іноді вам потрібен інший контекст.<\/span> <span class=\"sg\" data-s=\"2\">Тоді контекстуалізатори <code>$( )<\/code> та <code>@( )<\/code> змінюють його.<\/span><\/p>"]]},"bg":{"t":"Елементен и списъчен контекст","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Има още два контекста.<\/span> <span class=\"sg\" data-s=\"1\">Те решават едно нещо.<\/span> <span class=\"sg\" data-s=\"2\">Дали стойността е <strong>списък<\/strong> от няколко стойности?<\/span> <span class=\"sg\" data-s=\"3\">Или е един единичен <strong>елемент<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Сигилите <code>@<\/code> и <code>$<\/code> показват тази разлика.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В <em>контекст на списък<\/em> масивът се разделя на отделните си елементи.<\/span> <span class=\"sg\" data-s=\"1\">Цикълът <code>for<\/code> поставя аргумента си в контекст на списък.<\/span> <span class=\"sg\" data-s=\"2\">Така цикълът минава през всеки елемент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В <em>контекст на елемент<\/em> същият масив е една единична стойност.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуализаторът <code>$( … )<\/code> задава контекст на елемент.<\/span> <span class=\"sg\" data-s=\"2\">Сега цикълът вижда само едно нещо.<\/span> <span class=\"sg\" data-s=\"3\">Затова се изпълнява един път:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Контекстът на елемент обяснява и това.<\/span> <span class=\"sg\" data-s=\"1\">Присвоявате масив на скалар.<\/span> <span class=\"sg\" data-s=\"2\">Скаларът получава целия масив като един елемент.<\/span> <span class=\"sg\" data-s=\"3\">Той не копира елементите.<\/span> <span class=\"sg\" data-s=\"4\">Причината е, че <code>my $x = @a<\/code> поставя <code>@a<\/code> в контекст на елемент.<\/span> <span class=\"sg\" data-s=\"5\">Забележете, че този един елемент може да е друг контейнер.<\/span> <span class=\"sg\" data-s=\"6\">А този контейнер може да има много елементи в себе си:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> е скаларен контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Затова сега той пази един единичен обект.<\/span> <span class=\"sg\" data-s=\"2\">Този обект е <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Можете лесно да проверите това.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте <code>$var<\/code> като вид препратка към масив.<\/span> <span class=\"sg\" data-s=\"5\">Така я наричат другите езици:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Контекстуализаторът <code>@( … )<\/code> прави обратното.<\/span> <span class=\"sg\" data-s=\"1\">Той задава контекст на списък.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Има и <em>sink контекст<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">В sink контекст никой не използва стойността на израза.<\/span> <span class=\"sg\" data-s=\"2\">Raku просто изхвърля стойността.<\/span> <span class=\"sg\" data-s=\"3\">Например, един ред може да е там само заради страничния си ефект.<\/span> <span class=\"sg\" data-s=\"4\">Страничният ефект е допълнително действие на кода, като печатането.<\/span> <span class=\"sg\" data-s=\"5\">Понякога стойност в sink контекст не прави нищо полезно.<\/span> <span class=\"sg\" data-s=\"6\">Тогава Raku може да ви предупреди за „useless use“.<\/span> <span class=\"sg\" data-s=\"7\">Това е полезна подсказка.<\/span> <span class=\"sg\" data-s=\"8\">Вероятно сте забравили да използвате някакъв резултат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сигилът, <code>$<\/code> или <code>@<\/code>, всъщност е избор на контекст.<\/span> <span class=\"sg\" data-s=\"1\">Понякога ви трябва друг контекст.<\/span> <span class=\"sg\" data-s=\"2\">Тогава контекстуализаторите <code>$( )<\/code> и <code>@( )<\/code> го променят.<\/span><\/p>"]]},"eo":{"t":"Era kaj lista kunteksto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Estas du pliaj kuntekstoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili decidas unu aferon.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu valoro estas <strong>listo<\/strong> de pluraj valoroj?<\/span> <span class=\"sg\" data-s=\"3\">Aŭ ĉu ĝi estas unu sola <strong>ero<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">La sigeloj <code>@<\/code> kaj <code>$<\/code> montras ĉi tiun diferencon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En <em>lista kunteksto<\/em>, tabelo disiĝas en siajn apartajn elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Buklo <code>for<\/code> metas sian argumenton en listan kuntekston.<\/span> <span class=\"sg\" data-s=\"2\">Do la buklo iras tra ĉiu elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En <em>era kunteksto<\/em>, la sama tabelo estas unu sola valoro.<\/span> <span class=\"sg\" data-s=\"1\">La kuntekstigilo <code>$( … )<\/code> agordas eran kuntekston.<\/span> <span class=\"sg\" data-s=\"2\">Nun la buklo vidas nur unu aferon.<\/span> <span class=\"sg\" data-s=\"3\">Do ĝi ruliĝas unu fojon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Era kunteksto klarigas ankaŭ ĉi tion.<\/span> <span class=\"sg\" data-s=\"1\">Vi asignas tabelon al skalaro.<\/span> <span class=\"sg\" data-s=\"2\">La skalaro ricevas la tutan tabelon kiel unu eron.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne kopias la elementojn.<\/span> <span class=\"sg\" data-s=\"4\">La kialo estas, ke <code>my $x = @a<\/code> metas <code>@a<\/code> en eran kuntekston.<\/span> <span class=\"sg\" data-s=\"5\">Notu, ke ĉi tiu unu ero povas esti alia ujo.<\/span> <span class=\"sg\" data-s=\"6\">Kaj ĉi tiu ujo povas havi multajn erojn en si:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> estas skalara ujo.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi nun tenas unu solan objekton.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu objekto estas <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas facile kontroli tion.<\/span> <span class=\"sg\" data-s=\"4\">Uzu <code>$var<\/code> kiel specon de tabela referenco.<\/span> <span class=\"sg\" data-s=\"5\">Tiel aliaj lingvoj nomas ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La kuntekstigilo <code>@( … )<\/code> faras la malon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi agordas listan kuntekston.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ <em>sink-kunteksto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">En sink-kunteksto, neniu uzas la valoron de deklaro.<\/span> <span class=\"sg\" data-s=\"2\">Raku simple forĵetas la valoron.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, linio povas esti tie nur pro sia flanka efiko.<\/span> <span class=\"sg\" data-s=\"4\">Flanka efiko estas kroma ago de la kodo, kiel presado.<\/span> <span class=\"sg\" data-s=\"5\">Foje valoro en sink-kunteksto faras nenion utilan.<\/span> <span class=\"sg\" data-s=\"6\">Tiam Raku povas averti vin pri «senutila uzo».<\/span> <span class=\"sg\" data-s=\"7\">Tio estas utila sugesto.<\/span> <span class=\"sg\" data-s=\"8\">Vi verŝajne forgesis uzi rezulton.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sigelo, <code>$<\/code> aŭ <code>@<\/code>, vere estas elekto de kunteksto.<\/span> <span class=\"sg\" data-s=\"1\">Foje vi bezonas alian kuntekston.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la kuntekstigiloj <code>$( )<\/code> kaj <code>@( )<\/code> ŝanĝas ĝin.<\/span><\/p>"]]},"la":{"t":"Elementalis et listae contextus","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sunt duo alii contextus.<\/span> <span class=\"sg\" data-s=\"1\">Unam rem decernunt.<\/span> <span class=\"sg\" data-s=\"2\">Estne valor <strong>lista<\/strong> plurium valorum?<\/span> <span class=\"sg\" data-s=\"3\">An est unum <strong>item<\/strong>?<\/span> <span class=\"sg\" data-s=\"4\">Sigilla <code>@<\/code> et <code>$<\/code> hanc differentiam ostendunt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In <em>contextu listae<\/em> ordo in elementa sua singula se dividit.<\/span> <span class=\"sg\" data-s=\"1\">Ansa <code>for<\/code> argumentum suum in contextum listae ponit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque ansa per singula elementa it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In <em>contextu item<\/em> idem ordo est unus valor.<\/span> <span class=\"sg\" data-s=\"1\">Contextualiser <code>$( … )<\/code> contextum item ponit.<\/span> <span class=\"sg\" data-s=\"2\">Nunc ansa unam tantum rem videt.<\/span> <span class=\"sg\" data-s=\"3\">Itaque semel currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Contextus item etiam hoc explicat.<\/span> <span class=\"sg\" data-s=\"1\">Ordinem scalari assignas.<\/span> <span class=\"sg\" data-s=\"2\">Scalaris totum ordinem ut unum item accipit.<\/span> <span class=\"sg\" data-s=\"3\">Elementa non copiat.<\/span> <span class=\"sg\" data-s=\"4\">Causa est haec: <code>my $x = @a<\/code> ordinem <code>@a<\/code> in contextum item ponit.<\/span> <span class=\"sg\" data-s=\"5\">Nota: hoc unum item potest esse alius container.<\/span> <span class=\"sg\" data-s=\"6\">Et hic container multa itema in se habere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>$var<\/code> est container scalaris.<\/span> <span class=\"sg\" data-s=\"1\">Itaque nunc unum obiectum tenet.<\/span> <span class=\"sg\" data-s=\"2\">Hoc obiectum est <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hoc facile probare potes.<\/span> <span class=\"sg\" data-s=\"4\">Adhibe <code>$var<\/code> ut genus referentiae ordinis.<\/span> <span class=\"sg\" data-s=\"5\">Sic aliae linguae id vocant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Contextualiser <code>@( … )<\/code> contrarium facit.<\/span> <span class=\"sg\" data-s=\"1\">Contextum listae ponit.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Est etiam <em>contextus sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">In contextu sink nemo valorem enuntiati adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Raku valorem simpliciter abicit.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, linea ibi esse potest solum propter effectum lateralem.<\/span> <span class=\"sg\" data-s=\"4\">Effectus lateralis est alia actio codicis, ut impressio.<\/span> <span class=\"sg\" data-s=\"5\">Interdum valor in contextu sink nihil utile facit.<\/span> <span class=\"sg\" data-s=\"6\">Tum Raku te monere potest de \"useless use\".<\/span> <span class=\"sg\" data-s=\"7\">Hoc est utile indicium.<\/span> <span class=\"sg\" data-s=\"8\">Fortasse oblitus es resultatum adhibere.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sigillum, <code>$<\/code> vel <code>@<\/code>, revera est electio contextus.<\/span> <span class=\"sg\" data-s=\"1\">Interdum alium contextum requiris.<\/span> <span class=\"sg\" data-s=\"2\">Tum contextualisers <code>$( )<\/code> et <code>@( )<\/code> eum mutant.<\/span><\/p>"]]}}}</script>
