<script type="application/json" id="page-data">{"u":"advanced/representations/str","n":339,"k":"topic","pv":"advanced/representations/gist","nx":"advanced/representations/str/quiz","tr":["advanced","advanced/representations"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The <code>.Str<\/code> method","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">The <code>.Str<\/code> method returns the <strong>plain string<\/strong> form of a value.<\/span> <span class=\"sg\" data-s=\"1\">Raku calls it when it needs a value as a string.<\/span> <span class=\"sg\" data-s=\"2\">This is called <em>string context<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> and <code>put<\/code> call it.<\/span> <span class=\"sg\" data-s=\"4\">The <code>~<\/code> operator calls it too.<\/span> <span class=\"sg\" data-s=\"5\">This operator joins strings.<\/span> <span class=\"sg\" data-s=\"6\">It also works for values inside strings in double quotes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Note that the array comes back <strong>without the brackets<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Its elements are just joined with spaces.<\/span> <span class=\"sg\" data-s=\"2\">Here you can see the difference from <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">The <code>.gist<\/code> method keeps the brackets.<\/span> <span class=\"sg\" data-s=\"4\">Compare the two methods side by side:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A value inside a string in double quotes uses <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So an array inside a string is shown in the plain way:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"de":{"t":"Die <code>.Str<\/code>-Methode","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.Str<\/code> gibt die <strong>einfache Stringform<\/strong> eines Wertes zurück.<\/span> <span class=\"sg\" data-s=\"1\">Raku ruft sie auf, wenn es einen Wert als String braucht.<\/span> <span class=\"sg\" data-s=\"2\">Das nennt man <em>Stringkontext<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> und <code>put<\/code> rufen sie auf.<\/span> <span class=\"sg\" data-s=\"4\">Der Operator <code>~<\/code> ruft sie auch auf.<\/span> <span class=\"sg\" data-s=\"5\">Dieser Operator verbindet Strings.<\/span> <span class=\"sg\" data-s=\"6\">Das gilt auch für Werte in Strings mit doppelten Anführungszeichen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beachte: Das Array kommt <strong>ohne Klammern<\/strong> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Zwischen seinen Elementen stehen nur Leerzeichen.<\/span> <span class=\"sg\" data-s=\"2\">Hier siehst du den Unterschied zu <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Die Methode <code>.gist<\/code> behält die Klammern.<\/span> <span class=\"sg\" data-s=\"4\">Vergleiche die beiden Methoden nebeneinander:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Wert in einem String mit doppelten Anführungszeichen verwendet <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb erscheint ein Array in einem String in der einfachen Form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"nl":{"t":"De <code>.Str<\/code>-methode","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">De <code>.Str<\/code>-methode geeft de <strong>gewone string<\/strong>-vorm van een waarde terug.<\/span> <span class=\"sg\" data-s=\"1\">Raku roept hem aan als het een waarde als string nodig heeft.<\/span> <span class=\"sg\" data-s=\"2\">Dat heet <em>stringcontext<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> en <code>put<\/code> roepen hem aan.<\/span> <span class=\"sg\" data-s=\"4\">De <code>~<\/code> operator roept hem ook aan.<\/span> <span class=\"sg\" data-s=\"5\">Deze operator plakt strings aan elkaar.<\/span> <span class=\"sg\" data-s=\"6\">Het werkt ook voor waarden in strings tussen dubbele aanhalingstekens.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Let op: de array komt terug <strong>zonder de vierkante haken<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">De elementen staan gewoon achter elkaar, met spaties ertussen.<\/span> <span class=\"sg\" data-s=\"2\">Hier zie je het verschil met <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">De <code>.gist<\/code>-methode houdt de haken wel.<\/span> <span class=\"sg\" data-s=\"4\">Vergelijk de twee methodes naast elkaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een waarde in een string tussen dubbele aanhalingstekens gebruikt <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarom verschijnt een array in een string op de gewone manier:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"es":{"t":"El método <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">El método <code>.Str<\/code> devuelve la forma de <strong>cadena simple<\/strong> de un valor.<\/span> <span class=\"sg\" data-s=\"1\">Raku llama a este método cuando necesita un valor como cadena.<\/span> <span class=\"sg\" data-s=\"2\">Esto se llama <em>contexto de cadena<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> y <code>put<\/code> llaman a este método.<\/span> <span class=\"sg\" data-s=\"4\">El operador <code>~<\/code> también lo llama.<\/span> <span class=\"sg\" data-s=\"5\">Este operador une cadenas.<\/span> <span class=\"sg\" data-s=\"6\">También funciona con valores dentro de cadenas entre comillas dobles.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Observa que el arreglo vuelve <strong>sin los corchetes<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sus elementos solo están unidos con espacios.<\/span> <span class=\"sg\" data-s=\"2\">Aquí ves la diferencia con <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">El método <code>.gist<\/code> mantiene los corchetes.<\/span> <span class=\"sg\" data-s=\"4\">Compara los dos métodos lado a lado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un valor dentro de una cadena entre comillas dobles usa <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por eso un arreglo dentro de una cadena se muestra de la forma simple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"it":{"t":"Il metodo <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.Str<\/code> restituisce la forma <strong>stringa semplice<\/strong> di un valore.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo chiama quando gli serve un valore come stringa.<\/span> <span class=\"sg\" data-s=\"2\">Questo si chiama <em>contesto stringa<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> e <code>put<\/code> lo chiamano.<\/span> <span class=\"sg\" data-s=\"4\">Anche l'operatore <code>~<\/code> lo chiama.<\/span> <span class=\"sg\" data-s=\"5\">Questo operatore unisce le stringhe.<\/span> <span class=\"sg\" data-s=\"6\">Vale anche per i valori dentro le stringhe tra virgolette doppie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nota che l'array torna <strong>senza le parentesi quadre<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tra i suoi elementi ci sono solo spazi.<\/span> <span class=\"sg\" data-s=\"2\">Qui vedi la differenza da <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Il metodo <code>.gist<\/code> tiene le parentesi.<\/span> <span class=\"sg\" data-s=\"4\">Confronta i due metodi uno accanto all'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un valore dentro una stringa tra virgolette doppie usa <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Così un array dentro una stringa appare nella forma semplice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"lv":{"t":"Metode <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.Str<\/code> atgriež vērtības <strong>vienkāršas virknes<\/strong> formu.<\/span> <span class=\"sg\" data-s=\"1\">Raku to izsauc, kad tam vajag vērtību kā virkni.<\/span> <span class=\"sg\" data-s=\"2\">To sauc par <em>virknes kontekstu<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> un <code>put<\/code> to izsauc.<\/span> <span class=\"sg\" data-s=\"4\">Arī operators <code>~<\/code> to izsauc.<\/span> <span class=\"sg\" data-s=\"5\">Šis operators savieno virknes.<\/span> <span class=\"sg\" data-s=\"6\">Tā darbojas arī ar vērtībām virknē dubultpēdiņās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka masīvs atgriežas <strong>bez iekavām<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tā elementi ir vienkārši savienoti ar atstarpēm.<\/span> <span class=\"sg\" data-s=\"2\">Šeit jūs redzat atšķirību no <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Metode <code>.gist<\/code> saglabā iekavas.<\/span> <span class=\"sg\" data-s=\"4\">Salīdziniet abas metodes blakus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vērtība virknē dubultpēdiņās izmanto <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc masīvs virknē parādās vienkāršā veidā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"ru":{"t":"Метод <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.Str<\/code> возвращает <strong>простую строковую<\/strong> форму значения.<\/span> <span class=\"sg\" data-s=\"1\">Raku вызывает его, когда ему нужно значение в виде строки.<\/span> <span class=\"sg\" data-s=\"2\">Это называют <em>строковым контекстом<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> и <code>put<\/code> вызывают его.<\/span> <span class=\"sg\" data-s=\"4\">Оператор <code>~<\/code> тоже вызывает его.<\/span> <span class=\"sg\" data-s=\"5\">Этот оператор соединяет строки.<\/span> <span class=\"sg\" data-s=\"6\">Это работает и для значений внутри строк в двойных кавычках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: массив возвращается <strong>без скобок<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Между его элементами просто стоят пробелы.<\/span> <span class=\"sg\" data-s=\"2\">Здесь видно отличие от <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Метод <code>.gist<\/code> оставляет скобки.<\/span> <span class=\"sg\" data-s=\"4\">Сравните два метода рядом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значение внутри строки в двойных кавычках использует <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому массив внутри строки выводится в простом виде:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"uk":{"t":"Метод <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.Str<\/code> повертає <strong>просту рядкову<\/strong> форму значення.<\/span> <span class=\"sg\" data-s=\"1\">Raku викликає його, коли йому потрібне значення як рядок.<\/span> <span class=\"sg\" data-s=\"2\">Це називають <em>рядковим контекстом<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> і <code>put<\/code> викликають його.<\/span> <span class=\"sg\" data-s=\"4\">Оператор <code>~<\/code> теж його викликає.<\/span> <span class=\"sg\" data-s=\"5\">Цей оператор з'єднує рядки.<\/span> <span class=\"sg\" data-s=\"6\">Це також працює для значень усередині рядків у подвійних лапках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що масив повертається <strong>без дужок<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Його елементи просто з'єднані пробілами.<\/span> <span class=\"sg\" data-s=\"2\">Тут видно відмінність від <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Метод <code>.gist<\/code> зберігає дужки.<\/span> <span class=\"sg\" data-s=\"4\">Порівняйте два методи поруч:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значення всередині рядка в подвійних лапках використовує <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому масив усередині рядка має простий вигляд:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"bg":{"t":"Методът <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.Str<\/code> връща формата на <strong>обикновен низ<\/strong> на стойността.<\/span> <span class=\"sg\" data-s=\"1\">Raku го извиква, когато му трябва стойност като низ.<\/span> <span class=\"sg\" data-s=\"2\">Това се нарича <em>контекст на низ<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> и <code>put<\/code> го извикват.<\/span> <span class=\"sg\" data-s=\"4\">Операторът <code>~<\/code> също го извиква.<\/span> <span class=\"sg\" data-s=\"5\">Този оператор съединява низове.<\/span> <span class=\"sg\" data-s=\"6\">Същото става и със стойности вътре в низове с двойни кавички.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Забележете, че масивът се връща <strong>без скобите<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Елементите му са просто свързани с интервали.<\/span> <span class=\"sg\" data-s=\"2\">Тук виждате разликата от <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Методът <code>.gist<\/code> запазва скобите.<\/span> <span class=\"sg\" data-s=\"4\">Сравнете двата метода един до друг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойност вътре в низ с двойни кавички използва <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова масив вътре в низ се показва по обикновения начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"eo":{"t":"La metodo <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.Str<\/code> redonas la <strong>simplan ĉenan<\/strong> formon de valoro.<\/span> <span class=\"sg\" data-s=\"1\">Raku vokas ĝin, kiam ĝi bezonas valoron kiel ĉenon.<\/span> <span class=\"sg\" data-s=\"2\">Tio nomiĝas <em>ĉenkonteksto<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> kaj <code>put<\/code> vokas ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Ankaŭ la operatoro <code>~<\/code> vokas ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiu operatoro kunigas ĉenojn.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ankaŭ funkcias por valoroj ene de ĉenoj en duoblaj citiloj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la tabelo revenas <strong>sen la krampoj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝiaj elementoj estas simple kunigitaj per spacoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tie vi vidas la diferencon de <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">La metodo <code>.gist<\/code> konservas la krampojn.<\/span> <span class=\"sg\" data-s=\"4\">Komparu la du metodojn unu apud la alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valoro ene de ĉeno en duoblaj citiloj uzas <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do tabelo ene de ĉeno aperas en la simpla maniero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"la":{"t":"Methodus <code>.Str<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.Str<\/code> formam <strong>seriei planae<\/strong> valoris reddit.<\/span> <span class=\"sg\" data-s=\"1\">Raku eam vocat cum valorem ut seriem requirit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc <em>contextum serierum<\/em> vocamus.<\/span> <span class=\"sg\" data-s=\"3\"><code>print<\/code> et <code>put<\/code> eam vocant.<\/span> <span class=\"sg\" data-s=\"4\">Operator <code>~<\/code> quoque eam vocat.<\/span> <span class=\"sg\" data-s=\"5\">Hic operator series iungit.<\/span> <span class=\"sg\" data-s=\"6\">Etiam pro valoribus intra series in signis citationis duplicibus operatur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nota: ordo <strong>sine uncis<\/strong> redit.<\/span> <span class=\"sg\" data-s=\"1\">Inter elementa eius solum spatia sunt.<\/span> <span class=\"sg\" data-s=\"2\">Hic differentiam a <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> videre potes.<\/span> <span class=\"sg\" data-s=\"3\">Methodus <code>.gist<\/code> uncos servat.<\/span> <span class=\"sg\" data-s=\"4\">Compara duas methodos iuxta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor intra seriem in signis citationis duplicibus <code>.Str<\/code> adhibet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque ordo intra seriem modo plano apparet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]}}}</script>
