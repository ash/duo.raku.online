<script type="application/json" id="page-data">{"u":"advanced/representations","n":337,"k":"section","pv":"advanced","nx":"advanced/representations/gist","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Turning values into text","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Sometimes a program shows a value.<\/span> <span class=\"sg\" data-s=\"1\">You can <code>say<\/code> it, print it, or put it into a string.<\/span> <span class=\"sg\" data-s=\"2\">In all these cases, the value must become text.<\/span> <span class=\"sg\" data-s=\"3\">Raku does not have only one fixed way to do this.<\/span> <span class=\"sg\" data-s=\"4\">Instead, every value has a few standard methods.<\/span> <span class=\"sg\" data-s=\"5\">Each method makes a string for a different purpose:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — a form for people to read. <code>say<\/code> prints this form.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — the plain string form. Raku uses it when it needs a string.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — a form like code. It is useful when you debug a program.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">All three are normal methods.<\/span> <span class=\"sg\" data-s=\"1\">Every value in Raku has them.<\/span> <span class=\"sg\" data-s=\"2\">So they work in the same way for any value.<\/span> <span class=\"sg\" data-s=\"3\">This can be a number, a string or an array.<\/span> <span class=\"sg\" data-s=\"4\">It can also be an object of your own.<\/span> <span class=\"sg\" data-s=\"5\">The next pages show each method, one by one.<\/span> <span class=\"sg\" data-s=\"6\">Then they help you choose the right one.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"/advanced/dd/\">The section after that is about <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">This is a tool in Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">It is built on <code>.raku<\/code>.<\/span><\/p>"]]},"de":{"t":"Werte in Text umwandeln","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Manchmal zeigt ein Programm einen Wert.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst ihn mit <code>say<\/code> ausgeben, drucken oder in einen String setzen.<\/span> <span class=\"sg\" data-s=\"2\">In all diesen Fällen muss der Wert zu Text werden.<\/span> <span class=\"sg\" data-s=\"3\">Raku hat dafür nicht nur einen festen Weg.<\/span> <span class=\"sg\" data-s=\"4\">Stattdessen hat jeder Wert ein paar Standardmethoden.<\/span> <span class=\"sg\" data-s=\"5\">Jede Methode macht einen String für einen anderen Zweck:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — eine Form zum Lesen für Menschen. <code>say<\/code> gibt diese Form aus.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — die einfache Stringform. Raku verwendet sie, wenn es einen String braucht.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — eine Form wie Code. Sie ist nützlich, wenn du ein Programm debuggst.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Alle drei sind normale Methoden.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Wert in Raku hat sie.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb funktionieren sie für jeden Wert gleich.<\/span> <span class=\"sg\" data-s=\"3\">Das kann eine Zahl, ein String oder ein Array sein.<\/span> <span class=\"sg\" data-s=\"4\">Es kann auch ein eigenes Objekt sein.<\/span> <span class=\"sg\" data-s=\"5\">Die nächsten Seiten zeigen jede Methode, eine nach der anderen.<\/span> <span class=\"sg\" data-s=\"6\">Dann helfen sie dir, die richtige auszuwählen.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/de/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Im Abschnitt danach geht es um <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Das ist ein Werkzeug in Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Es baut auf <code>.raku<\/code> auf.<\/span><\/p>"]]},"nl":{"t":"Waarden omzetten naar tekst","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Soms toont een programma een waarde.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt hem met <code>say<\/code> tonen, printen of in een string zetten.<\/span> <span class=\"sg\" data-s=\"2\">In al deze gevallen moet de waarde tekst worden.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft niet maar één vaste manier om dit te doen.<\/span> <span class=\"sg\" data-s=\"4\">In plaats daarvan heeft elke waarde een paar standaardmethodes.<\/span> <span class=\"sg\" data-s=\"5\">Elke methode maakt een string voor een ander doel:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — een vorm voor mensen om te lezen. <code>say<\/code> drukt deze vorm af.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — de gewone stringvorm. Raku gebruikt die als het een string nodig heeft.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — een vorm die op code lijkt. Die is handig als je een programma debugt.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Alle drie zijn gewone methodes.<\/span> <span class=\"sg\" data-s=\"1\">Elke waarde in Raku heeft ze.<\/span> <span class=\"sg\" data-s=\"2\">Dus werken ze op dezelfde manier voor elke waarde.<\/span> <span class=\"sg\" data-s=\"3\">Dat kan een getal, een string of een array zijn.<\/span> <span class=\"sg\" data-s=\"4\">Het kan ook een eigen object zijn.<\/span> <span class=\"sg\" data-s=\"5\">De volgende pagina's tonen elke methode, een voor een.<\/span> <span class=\"sg\" data-s=\"6\">Daarna helpen ze je de juiste te kiezen.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/nl/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Het deel daarna gaat over <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Dit is een hulpmiddel in Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Het is gebouwd op <code>.raku<\/code>.<\/span><\/p>"]]},"es":{"t":"Convirtiendo valores en texto","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A veces un programa muestra un valor.<\/span> <span class=\"sg\" data-s=\"1\">Puedes mostrarlo con <code>say<\/code>, imprimirlo o ponerlo en una cadena.<\/span> <span class=\"sg\" data-s=\"2\">En todos estos casos, el valor tiene que convertirse en texto.<\/span> <span class=\"sg\" data-s=\"3\">Raku no tiene una sola forma fija de hacer esto.<\/span> <span class=\"sg\" data-s=\"4\">En cambio, cada valor tiene unos pocos métodos estándar.<\/span> <span class=\"sg\" data-s=\"5\">Cada método crea una cadena para un fin diferente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — una forma fácil de leer para las personas. <code>say<\/code> imprime esta forma.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la forma de cadena simple. Raku la usa cuando necesita una cadena.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — una forma parecida al código. Es útil cuando depuras un programa.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Los tres son métodos normales.<\/span> <span class=\"sg\" data-s=\"1\">Todos los valores en Raku los tienen.<\/span> <span class=\"sg\" data-s=\"2\">Por eso funcionan igual con cualquier valor.<\/span> <span class=\"sg\" data-s=\"3\">Puede ser un número, una cadena o un arreglo.<\/span> <span class=\"sg\" data-s=\"4\">También puede ser un objeto tuyo.<\/span> <span class=\"sg\" data-s=\"5\">Las páginas siguientes muestran cada método, uno por uno.<\/span> <span class=\"sg\" data-s=\"6\">Luego te ayudan a elegir el correcto.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/es/advanced/dd/\" target=\"_blank\" rel=\"noopener\">La sección siguiente trata sobre <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Es una herramienta de Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Se basa en <code>.raku<\/code>.<\/span><\/p>"]]},"it":{"t":"Trasformare valori in testo","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A volte un programma mostra un valore.<\/span> <span class=\"sg\" data-s=\"1\">Puoi stamparlo con <code>say<\/code> o con <code>print<\/code>, o metterlo in una stringa.<\/span> <span class=\"sg\" data-s=\"2\">In tutti questi casi, il valore deve diventare testo.<\/span> <span class=\"sg\" data-s=\"3\">Raku non ha un solo modo fisso per farlo.<\/span> <span class=\"sg\" data-s=\"4\">Invece, ogni valore ha alcuni metodi standard.<\/span> <span class=\"sg\" data-s=\"5\">Ogni metodo crea una stringa per uno scopo diverso:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — una forma da leggere per le persone. <code>say<\/code> stampa questa forma.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la forma stringa semplice. Raku la usa quando gli serve una stringa.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — una forma simile al codice. È utile quando fai il debug di un programma.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Tutti e tre sono metodi normali.<\/span> <span class=\"sg\" data-s=\"1\">Ogni valore in Raku li ha.<\/span> <span class=\"sg\" data-s=\"2\">Così funzionano nello stesso modo per qualsiasi valore.<\/span> <span class=\"sg\" data-s=\"3\">Può essere un numero, una stringa o un array.<\/span> <span class=\"sg\" data-s=\"4\">Può essere anche un oggetto creato da te.<\/span> <span class=\"sg\" data-s=\"5\">Le pagine seguenti mostrano ogni metodo, uno alla volta.<\/span> <span class=\"sg\" data-s=\"6\">Poi ti aiutano a scegliere quello giusto.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/it/advanced/dd/\" target=\"_blank\" rel=\"noopener\">La sezione dopo parla di <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">È uno strumento di Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">È costruito sopra <code>.raku<\/code>.<\/span><\/p>"]]},"lv":{"t":"Vērtību pārvēršana tekstā","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Dažreiz programma parāda vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to izvadīt ar <code>say<\/code>, izdrukāt vai ielikt virknē.<\/span> <span class=\"sg\" data-s=\"2\">Visos šajos gadījumos vērtībai jākļūst par tekstu.<\/span> <span class=\"sg\" data-s=\"3\">Raku nav tikai viena fiksēta veida, kā to darīt.<\/span> <span class=\"sg\" data-s=\"4\">Tā vietā katrai vērtībai ir dažas standarta metodes.<\/span> <span class=\"sg\" data-s=\"5\">Katra metode izveido virkni citam mērķim:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — forma, ko lasa cilvēki. <code>say<\/code> izdrukā šo formu.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — vienkārša virknes forma. Raku to izmanto, kad tam vajag virkni.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — kodam līdzīga forma. Tā noder, kad jūs atkļūdojat programmu.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Visas trīs ir parastas metodes.<\/span> <span class=\"sg\" data-s=\"1\">Katrai vērtībai Raku valodā tās ir.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc tās strādā vienādi ar jebkuru vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Tas var būt skaitlis, virkne vai masīvs.<\/span> <span class=\"sg\" data-s=\"4\">Tas var būt arī jūsu paša objekts.<\/span> <span class=\"sg\" data-s=\"5\">Nākamās lappuses parāda katru metodi pa vienai.<\/span> <span class=\"sg\" data-s=\"6\">Tad tās palīdz jums izvēlēties pareizo.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/lv/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Nākamā sadaļa ir par <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Tas ir Rakudo rīks.<\/span> <span class=\"sg\" data-s=\"9\">Tā pamatā ir <code>.raku<\/code>.<\/span><\/p>"]]},"ru":{"t":"Преобразование значений в текст","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Иногда программа показывает значение.<\/span> <span class=\"sg\" data-s=\"1\">Его можно вывести через <code>say<\/code>, напечатать или вставить в строку.<\/span> <span class=\"sg\" data-s=\"2\">Во всех этих случаях значение должно стать текстом.<\/span> <span class=\"sg\" data-s=\"3\">В Raku для этого нет одного-единственного способа.<\/span> <span class=\"sg\" data-s=\"4\">Вместо этого у каждого значения есть несколько стандартных методов.<\/span> <span class=\"sg\" data-s=\"5\">Каждый метод делает строку для своей цели:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма, которую читают люди. <code>say<\/code> печатает эту форму.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — простая строковая форма. Raku использует её, когда ему нужна строка.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, похожая на код. Она полезна, когда вы отлаживаете программу.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Все три — обычные методы.<\/span> <span class=\"sg\" data-s=\"1\">Они есть у каждого значения в Raku.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому они работают одинаково для любого значения.<\/span> <span class=\"sg\" data-s=\"3\">Это может быть число, строка или массив.<\/span> <span class=\"sg\" data-s=\"4\">Это может быть и ваш собственный объект.<\/span> <span class=\"sg\" data-s=\"5\">Следующие страницы показывают каждый метод по очереди.<\/span> <span class=\"sg\" data-s=\"6\">Потом они помогают выбрать нужный.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/ru/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Следующий раздел — о <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Это инструмент в Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Он построен на <code>.raku<\/code>.<\/span><\/p>"]]},"uk":{"t":"Перетворення значень у текст","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Іноді програма показує значення.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете вивести його через <code>say<\/code>, надрукувати або вставити в рядок.<\/span> <span class=\"sg\" data-s=\"2\">У всіх цих випадках значення має стати текстом.<\/span> <span class=\"sg\" data-s=\"3\">У Raku немає лише одного сталого способу це зробити.<\/span> <span class=\"sg\" data-s=\"4\">Натомість кожне значення має кілька стандартних методів.<\/span> <span class=\"sg\" data-s=\"5\">Кожен метод створює рядок для іншої мети:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма, яку читають люди. <code>say<\/code> друкує цю форму.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — проста рядкова форма. Raku використовує її, коли йому потрібен рядок.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, схожа на код. Вона корисна, коли ви налагоджуєте програму.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Усі три — звичайні методи.<\/span> <span class=\"sg\" data-s=\"1\">Їх має кожне значення в Raku.<\/span> <span class=\"sg\" data-s=\"2\">Тому вони працюють однаково для будь-якого значення.<\/span> <span class=\"sg\" data-s=\"3\">Це може бути число, рядок або масив.<\/span> <span class=\"sg\" data-s=\"4\">Це може бути також ваш власний об'єкт.<\/span> <span class=\"sg\" data-s=\"5\">Наступні сторінки показують кожен метод по черзі.<\/span> <span class=\"sg\" data-s=\"6\">Потім вони допомагають вам вибрати правильний.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/uk/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Після них іде розділ про <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Це інструмент у Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Він працює на основі <code>.raku<\/code>.<\/span><\/p>"]]},"bg":{"t":"Превръщане на стойности в текст","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Понякога програмата показва стойност.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я изведете със <code>say<\/code>, да я отпечатате или да я сложите в низ.<\/span> <span class=\"sg\" data-s=\"2\">Във всички тези случаи стойността трябва да стане текст.<\/span> <span class=\"sg\" data-s=\"3\">Raku няма само един фиксиран начин за това.<\/span> <span class=\"sg\" data-s=\"4\">Вместо това всяка стойност има няколко стандартни метода.<\/span> <span class=\"sg\" data-s=\"5\">Всеки метод прави низ за различна цел:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма за четене от хората. <code>say<\/code> отпечатва тази форма.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — обикновената форма на низ. Raku я използва, когато му трябва низ.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, подобна на код. Тя е полезна, когато дебъгвате програма.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">И трите са обикновени методи.<\/span> <span class=\"sg\" data-s=\"1\">Всяка стойност в Raku ги има.<\/span> <span class=\"sg\" data-s=\"2\">Затова те работят по един и същи начин за всяка стойност.<\/span> <span class=\"sg\" data-s=\"3\">Тя може да е число, низ или масив.<\/span> <span class=\"sg\" data-s=\"4\">Може да е и ваш собствен обект.<\/span> <span class=\"sg\" data-s=\"5\">Следващите страници показват всеки метод поотделно.<\/span> <span class=\"sg\" data-s=\"6\">След това ви помагат да изберете правилния.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/bg/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Разделът след тях е за <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Това е инструмент в Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Той е построен върху <code>.raku<\/code>.<\/span><\/p>"]]},"eo":{"t":"Konverti valorojn al teksto","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Foje programo montras valoron.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi <code>say<\/code> por ĝi, presi ĝin, aŭ meti ĝin en ĉenon.<\/span> <span class=\"sg\" data-s=\"2\">En ĉiuj ĉi tiuj kazoj, la valoro devas fariĝi teksto.<\/span> <span class=\"sg\" data-s=\"3\">Raku ne havas nur unu fiksan manieron fari tion.<\/span> <span class=\"sg\" data-s=\"4\">Anstataŭe, ĉiu valoro havas kelkajn normajn metodojn.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiu metodo faras ĉenon por alia celo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — formo, kiun homoj legas. <code>say<\/code> presas ĉi tiun formon.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la simpla ĉenformo. Raku uzas ĝin, kiam ĝi bezonas ĉenon.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — formo kiel kodo. Ĝi estas utila, kiam vi sencimigas programon.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj tri estas normalaj metodoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu valoro en Raku havas ilin.<\/span> <span class=\"sg\" data-s=\"2\">Do ili funkcias same por ĉiu valoro.<\/span> <span class=\"sg\" data-s=\"3\">Tio povas esti nombro, ĉeno aŭ tabelo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi povas esti ankaŭ via propra objekto.<\/span> <span class=\"sg\" data-s=\"5\">La sekvaj paĝoj montras ĉiun metodon, unu post la alia.<\/span> <span class=\"sg\" data-s=\"6\">Poste ili helpas vin elekti la ĝustan.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/eo/advanced/dd/\" target=\"_blank\" rel=\"noopener\">La sekcio post tio temas pri <code>dd<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Ĝi estas ilo en Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Ĝi estas konstruita sur <code>.raku<\/code>.<\/span><\/p>"]]},"la":{"t":"Valores in textum convertere","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Interdum programma valorem ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Potes eum cum <code>say<\/code> dicere, imprimere, vel in seriem ponere.<\/span> <span class=\"sg\" data-s=\"2\">In omnibus his casibus valor textus fieri debet.<\/span> <span class=\"sg\" data-s=\"3\">Ad hoc Raku non unum solum modum fixum habet.<\/span> <span class=\"sg\" data-s=\"4\">Potius quisque valor aliquot methodos normales habet.<\/span> <span class=\"sg\" data-s=\"5\">Quaeque methodus seriem ad aliud propositum facit:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — forma quam homines legunt. <code>say<\/code> hanc formam imprimit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — forma seriei planae. Raku eam adhibet cum seriem requirit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — forma codici similis. Utilis est cum programma corrigis.<\/span><\/li><\/ul>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Omnes tres methodi normales sunt.<\/span> <span class=\"sg\" data-s=\"1\">Quisque valor in Raku eas habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque eodem modo pro quolibet valore operantur.<\/span> <span class=\"sg\" data-s=\"3\">Hic valor numerus, series vel ordo esse potest.<\/span> <span class=\"sg\" data-s=\"4\">Etiam obiectum tuum proprium esse potest.<\/span> <span class=\"sg\" data-s=\"5\">Paginae sequentes quamque methodum, unam post aliam, ostendunt.<\/span> <span class=\"sg\" data-s=\"6\">Deinde te adiuvant rectam eligere.<\/span> <span class=\"sg\" data-s=\"7\"><a href=\"https://course.raku.org/la/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Sectio post eas de <code>dd<\/code> est<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Hoc est instrumentum in Rakudo.<\/span> <span class=\"sg\" data-s=\"9\">Fundamentum eius est <code>.raku<\/code>.<\/span><\/p>"]]}}}</script>
