\/span><\/p>"]]},"lv":{"t":"Pareizā metode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vienkāršus skalārus, piemēram, skaitļus un virknes.<\/span> <span class=\"sg\" data-s=\"1\">Šeit visas trīs formas izskatās vienādi.<\/span> <span class=\"sg\" data-s=\"2\">Tās atšķiras vērtībām ar vairākām daļām.<\/span> <span class=\"sg\" data-s=\"3\">Tās atšķiras arī nedefinētām vērtībām.<\/span> <span class=\"sg\" data-s=\"4\">Šeit ir <code>Pair<\/code>, parādīts trijos veidos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vienkāršs likums:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — izvadei, ko cilvēki <em>lasa<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — izvadei, kas ir <em>vienkāršs teksts<\/em> (<code>print<\/code>, <code>put<\/code>, vērtības virknēs, operators <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — formai, kas ir <em>kā kods<\/em>, kad jūs atkļūdojat (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs varat rakstīt savas klases.<\/span> <span class=\"sg\" data-s=\"1\">Klasē jūs varat paši definēt katru no šīm metodēm.<\/span> <span class=\"sg\" data-s=\"2\">Tad arī jūsu pašu objekti izdrukājas glīti.<\/span> <span class=\"sg\" data-s=\"3\">Mēs pie tā atgriežamies nākamajā daļā.<\/span> <span class=\"sg\" data-s=\"4\">Tur mēs <a href=\"https://course.raku.org/lv/oop/classes/\" target=\"_blank\" rel=\"noopener\">veidojam klases<\/a>.<\/span><\/p>"]]},"ru":{"t":"Выбор подходящего метода","b":[["p",5,"<p><span class=\"sg\" data-s=\  <span class=\"sg\" data-s=\"1\">Тут усі три форми виглядають однаково.<\/span> <span class=\"sg\" data-s=\"2\">Вони різні для значень із кількох частин.<\/span> <span class=\"sg\" data-s=\"3\">Вони також різні для невизначених значень.<\/span> <span class=\"sg\" data-s=\"4\">Ось <code>Pair<\/code>, показаний трьома способами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось просте правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — для виводу, який люди <em>читають<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — для виводу, який є <em>простим текстом<\/em> (<code>print<\/code>, <code>put<\/code>, значення всередині рядків, оператор <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — для форми, <em>схожої на код<\/em>, під час налагодження (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви можете писати власні класи.<\/span> <span class=\"sg\" data-s=\"1\">У класі ви можете самі визначити кожен із цих методів.<\/span> <span class=\"sg\" data-s=\"2\">Тоді ваші власні об'єкти теж гарно друкуються.<\/span> <span class=\"sg\" data-s=\"3\">Ми повернемося до цього в наступній частині.<\/span> <span class=\"sg\" data-s=\"4\">Там ми <a href=\"https://course.raku.org/uk/oop/classes/\" target=\"_blank\" rel=\"noopener\">створимо класи<\/a>.<\/span><\/p>"]]},"bg":{"t":"Избор на правилния метод","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вземете прости скалари, като числа и низове.<\/span> <span class=\"sg\" data-s=\"1\">При тях и трите форми изглеждат еднакво.<\/span> <span class=\"sg\" data-s=\"2\">Те са различни за стойности с няколко части.<\/span> <span class=\"sg\" data-s=\"3\">Те са различни и за недефинирани стойности.<\/span> <span class=\"sg\" data-s=\"4\">Ето една <code>Pair<\/code>, показана по три начина:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно просто правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — за изход, който хората <em>четат<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — за изход, който е <em>обикновен текст<\/em> (<code>print<\/code>, <code>put<\/code>, стойности вътре в низове, операторът <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — за форма, <em>подобна на код<\/em>, когато дебъгвате (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Можете да пишете свои собствени класове.<\/span> <span class=\"sg\" data-s=\"1\">В клас можете сами да дефинирате всеки от тези методи.<\/span> <span class=\"sg\" data-s=\"2\">Тогава и вашите обекти се отпечатват добре.<\/span> <span class=\"sg\" data-s=\"3\">Връщаме се към това в следващата част.<\/span> <span class=\"sg\" data-s=\"4\">Там <a href=\"https://course.raku.org/bg/oop/classes/\" target=\"_blank\" rel=\"noopener\">създаваме класове<\/a>.<\/span><\/p>"]]},"eo":{"t":"Elekti la ĝustan","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Prenu simplajn skalarojn, kiel nombrojn kaj ĉenojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉe ili, ĉiuj tri formoj aspektas same.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas malsamaj por valoroj kun pluraj partoj.<\/span> <span class=\"sg\" data-s=\"3\">Ili estas ankaŭ malsamaj por nedifinitaj valoroj.<\/span> <span class=\"sg\" data-s=\"4\">Jen <code>Pair<\/code>, montrata en tri manieroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen simpla regulo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — por eligo, kiun homoj <em>legas<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — por eligo, kiu estas <em>simpla teksto<\/em> (<code>print<\/code>, <code>put<\/code>, valoroj ene de ĉenoj, la operatoro <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — por formo <em>kiel kodo<\/em>, kiam vi sencimigas (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi povas skribi viajn proprajn klasojn.<\/span> <span class=\"sg\" data-s=\"1\">En klaso, vi povas mem difini ĉiun el ĉi tiuj metodoj.<\/span> <span class=\"sg\" data-s=\"2\">Tiam ankaŭ viaj propraj objektoj presiĝas bele.<\/span> <span class=\"sg\" data-s=\"3\">Ni revenas al tio en la sekva parto.<\/span> <span class=\"sg\" data-s=\"4\">Tie, ni <a href=\"https://course.raku.org/eo/oop/classes/\" target=\"_blank\" rel=\"noopener\">kreas klasojn<\/a>.<\/span><\/p>"]]},"la":{"t":"Rectam eligere","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sume scalares simplices, ut numeros et series.<\/span> <span class=\"sg\" data-s=\"1\">Hic omnes tres formae idem apparent.<\/span> <span class=\"sg\" data-s=\"2\">Pro valoribus cum pluribus partibus differunt.<\/span> <span class=\"sg\" data-s=\"3\">Etiam pro valoribus indefinitis differunt.<\/span> <span class=\"sg\" data-s=\"4\">Hic est <code>Pair<\/code>, tribus modis ostensus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est regula simplex:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — pro output quod homines <em>legunt<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — pro output quod <em>textus planus<\/em> est (<code>print<\/code>, <code>put<\/code>, valores intra series, operator <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — pro forma <em>codici simili<\/em>, cum errores corrigis (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Classes tuas proprias scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">In classe quamque harum methodorum ipse definire potes.<\/span> <span class=\"sg\" data-s=\"2\">Tum obiecta tua quoque pulchre apparent.<\/span> <span class=\"sg\" data-s=\"3\">Ad hoc in parte sequenti redimus.<\/span> <span class=\"sg\" data-s=\"4\">Ibi <a href=\"https://course.raku.org/la/oop/classes/\" target=\"_blank\" rel=\"noopener\">classes creamus<\/a>.<\/span><\/p>"]]}}}</script>
