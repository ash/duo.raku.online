\/code> gibt einen normalen String zurück.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du ihn überall verwenden, wo ein String nötig ist.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kannst du ihn in einen String in doppelten Anführungszeichen setzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Verwende <code>.raku<\/code>, wenn du diese Form als String brauchst.<\/span> <span class=\"sg\" data-s=\"1\">Dann kannst du sie in deine eigenen Nachrichten einfügen.<\/span> <span class=\"sg\" data-s=\"2\">Sehr bald lernst du <code>dd<\/code> kennen.<\/span> <span class=\"sg\" data-s=\"3\">Das ist ein Werkzeug in Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Es gibt dieselbe Art von Form für dich aus, in einem Schritt.<\/span><\/p>"]]},"nl":{"t":"De <code>.raku<\/code>-methode","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">De derde methode is <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft een string terug met een <strong>codeachtige<\/strong> vorm van de waarde.<\/span> <span class=\"sg\" data-s=\"2\">In het beste geval kun je deze string in een programma plakken.<\/span> <span class=\"sg\" data-s=\"3\">Dan krijg je dezelfde waarde weer.<\/span> <span class=\"sg\" data-s=\"4\">Elke waarde in Raku heeft deze methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die komt terug met aanhalingstekens eromheen.<\/span> <span class=\"sg\" data-s=\"2\">Zo zien een getal en een string er anders uit.<\/span> <span class=\"sg\" data-s=\"3\">Zulke details heb je nodig als je een programma debugt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De methode werkt ook voor gegevens met veel delen.<\/span> <span class=\"sg\" data-s=\"1\">Dat geldt ook voor geneste gegevens, met de ene structuur in de andere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> geeft een gewone string terug.<\/span> <span class=\"sg\" data-s=\"1\">Dus kun je hem gebruiken op elke plek die een string nodig heeft.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt hem bijvoorbeeld in een string tussen dubbele aanhalingstekens zetten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>.raku<\/code> als je deze vorm als string nodig hebt.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je hem aan je eigen berichten toevoegen.<\/span> <span class=\"sg\" data-s=\"2\">Heel binnenkort leer je <code>dd<\/code> kennen.<\/span> <span class=\"sg\" data-s=\"3\">Dat is een hulpmiddel in Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Het drukt dezelfde soort vorm voor je af, in één stap.<\/span><\/p>"]]},"es":{"t":"El método <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">El tercer método es <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Devuelve una cadena con una forma <strong>similar a código<\/strong> del valor.<\/span> <span class=\"sg\" data-s=\"2\">En el mejor caso, puedes pegar esta cadena en un programa.<\/span> <span class=\"sg\" data-s=\"3\">Así obtienes otra vez el mismo valor.<\/span> <span class=\"sg\" data-s=\"4\">Cada valor en Raku tiene este método.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mira la cadena <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vuelve con comillas alrededor.<\/span> <span class=\"sg\" data-s=\"2\">Así un número y una cadena se ven diferentes.<\/span> <span class=\"sg\" data-s=\"3\">Necesitas estos detalles cuando depuras un programa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El método también funciona con datos de muchas partes.<\/span> <span class=\"sg\" data-s=\"1\">Esto incluye datos anidados, con una estructura dentro de otra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> devuelve una cadena normal.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes usarlo donde necesitas una cadena.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, puedes ponerlo dentro de una cadena entre comillas dobles:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Usa <code>.raku<\/code> cuando necesitas esta forma como cadena.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes añadirla a tus propios mensajes.<\/span> <span class=\"sg\" data-s=\"2\">Muy pronto vas a conocer <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Es una herramienta de Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Imprime el mismo tipo de forma por ti, en un solo paso.<\/span><\/p>"]]},"it":{"t":"Il metodo <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Il terzo metodo è <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce una stringa con una forma del valore <strong>simile al codice<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Nel caso migliore, puoi incollare questa stringa in un programma.<\/span> <span class=\"sg\" data-s=\"3\">Allora ottieni di nuovo lo stesso valore.<\/span> <span class=\"sg\" data-s=\"4\">Ogni valore in Raku ha questo metodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Guarda la stringa <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Torna con le virgolette intorno.<\/span> <span class=\"sg\" data-s=\"2\">Così un numero e una stringa hanno un aspetto diverso.<\/span> <span class=\"sg\" data-s=\"3\">Ti servono dettagli così quando fai il debug di un programma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo funziona anche per dati con molte parti.<\/span> <span class=\"sg\" data-s=\"1\">Questo vale anche per i dati annidati, con una struttura dentro un'altra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> restituisce una stringa normale.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi usarlo in ogni punto che vuole una stringa.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, puoi metterlo dentro una stringa tra virgolette doppie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Usa <code>.raku<\/code> quando ti serve questa forma come stringa.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi aggiungerla ai tuoi messaggi.<\/span> <span class=\"sg\" data-s=\"2\">Molto presto incontrerai <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">È uno strumento di Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Stampa lo stesso tipo di forma per te, in un solo passo.<\/span><\/p>"]]},"lv":{"t":"Metode <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Trešā metode ir <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež virkni ar vērtības <strong>kodam līdzīgu<\/strong> formu.<\/span> <span class=\"sg\" data-s=\"2\">Labākajā gadījumā jūs varat ielīmēt šo virkni programmā.<\/span> <span class=\"sg\" data-s=\"3\">Tad jūs atkal iegūstat to pašu vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Katrai vērtībai Raku valodā ir šī metode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aplūkojiet virkni <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriežas ar pēdiņām ap to.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc skaitlis un virkne izskatās atšķirīgi.<\/span> <span class=\"sg\" data-s=\"3\">Jums vajag šādas detaļas, kad jūs atkļūdojat programmu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode strādā arī ar datiem, kam ir daudz daļu.<\/span> <span class=\"sg\" data-s=\"1\">Tā strādā arī ar ligzdotiem datiem, kur viena struktūra ir citā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> atgriež parastu virkni.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat to lietot katrā vietā, kur vajag virkni.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, jūs varat to ielikt virknē dubultpēdiņās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lietojiet <code>.raku<\/code>, kad jums vajag šo formu kā virkni.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat to pievienot saviem ziņojumiem.<\/span> <span class=\"sg\" data-s=\"2\">Ļoti drīz jūs iepazīsiet <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir Rakudo rīks.<\/span> <span class=\"sg\" data-s=\"4\">Tas izdrukā tādu pašu formu jūsu vietā vienā solī.<\/span><\/p>"]]},"ru":{"t":"Метод <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Третий метод — <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он возвращает строку с формой значения, <strong>похожей на код<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">В лучшем случае эту строку можно вставить в программу.<\/span> <span class=\"sg\" data-s=\"3\">Тогда вы снова получите то же значение.<\/span> <span class=\"sg\" data-s=\"4\">Этот метод есть у каждого значения в Raku.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на строку <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она возвращается с кавычками.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому число и строка выглядят по-разному.<\/span> <span class=\"sg\" data-s=\"3\">Такие детали нужны, когда вы отлаживаете программу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод работает и для данных из многих частей.<\/span> <span class=\"sg\" data-s=\"1\">Это касается и вложенных данных, где одна структура лежит внутри другой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> возвращает обычную строку.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому его можно использовать везде, где нужна строка.<\/span> <span class=\"sg\" data-s=\"2\">Например, его можно вставить в строку в двойных кавычках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Используйте <code>.raku<\/code>, когда вам нужна эта форма в виде строки.<\/span> <span class=\"sg\" data-s=\"1\">Тогда её можно добавить в свои сообщения.<\/span> <span class=\"sg\" data-s=\"2\">Совсем скоро вы познакомитесь с <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это инструмент в Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Он печатает такую же форму за вас, за один шаг.<\/span><\/p>"]]},"uk":{"t":"Метод <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Третій метод — це <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертає рядок із <strong>подібною до коду<\/strong> формою значення.<\/span> <span class=\"sg\" data-s=\"2\">У найкращому випадку ви можете вставити цей рядок у програму.<\/span> <span class=\"sg\" data-s=\"3\">Тоді ви знову отримаєте те саме значення.<\/span> <span class=\"sg\" data-s=\"4\">Кожне значення в Raku має цей метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Подивіться на рядок <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертається з лапками навколо.<\/span> <span class=\"sg\" data-s=\"2\">Тому число й рядок виглядають по-різному.<\/span> <span class=\"sg\" data-s=\"3\">Такі деталі потрібні вам, коли ви налагоджуєте програму.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод також працює для даних із багатьох частин.<\/span> <span class=\"sg\" data-s=\"1\">Це стосується і вкладених даних, де одна структура лежить усередині іншої:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> повертає звичайний рядок.<\/span> <span class=\"sg\" data-s=\"1\">Тому його можна використати в кожному місці, де потрібен рядок.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, його можна вставити в рядок у подвійних лапках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <code>.raku<\/code>, коли вам потрібна ця форма як рядок.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви можете додати її до своїх повідомлень.<\/span> <span class=\"sg\" data-s=\"2\">Дуже скоро ви познайомитеся з <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це інструмент у Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Він друкує таку саму форму за вас, за один крок.<\/span><\/p>"]]},"bg":{"t":"Методът <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Третият метод е <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той връща низ с форма на стойността, <strong>подобна на код<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">В най-добрия случай можете да поставите този низ в програма.<\/span> <span class=\"sg\" data-s=\"3\">Тогава получавате същата стойност отново.<\/span> <span class=\"sg\" data-s=\"4\">Всяка стойност в Raku има този метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вижте низа <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той се връща с кавички около него.<\/span> <span class=\"sg\" data-s=\"2\">Така числото и низът изглеждат различно.<\/span> <span class=\"sg\" data-s=\"3\">Такива детайли ви трябват, когато дебъгвате програма.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът работи и за данни с много части.<\/span> <span class=\"sg\" data-s=\"1\">Това включва и вложени данни, с една структура вътре в друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> връща обикновен низ.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да го използвате на всяко място, където трябва низ.<\/span> <span class=\"sg\" data-s=\"2\">Например можете да го сложите в низ с двойни кавички:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Използвайте <code>.raku<\/code>, когато ви трябва тази форма като низ.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да я добавите към своите съобщения.<\/span> <span class=\"sg\" data-s=\"2\">Много скоро ще се запознаете с <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това е инструмент в Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Той отпечатва същия вид форма вместо вас, с една стъпка.<\/span><\/p>"]]},"eo":{"t":"La metodo <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La tria metodo estas <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas ĉenon kun <strong>kodosimila<\/strong> formo de la valoro.<\/span> <span class=\"sg\" data-s=\"2\">En la plej bona kazo, vi povas enmeti ĉi tiun ĉenon en programon.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi ricevas la saman valoron denove.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu valoro en Raku havas ĉi tiun metodon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rigardu la ĉenon <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi revenas kun citiloj ĉirkaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Do nombro kaj ĉeno aspektas malsame.<\/span> <span class=\"sg\" data-s=\"3\">Vi bezonas tiajn detalojn, kiam vi sencimigas programon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La metodo ankaŭ funkcias por datumoj kun multaj partoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi funkcias ankaŭ por nestitaj datumoj, kun unu strukturo en alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> redonas normalan ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas uzi ĝin en ĉiu loko, kiu bezonas ĉenon.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, vi povas meti ĝin en ĉenon en duoblaj citiloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Uzu <code>.raku<\/code>, kiam vi bezonas ĉi tiun formon kiel ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas aldoni ĝin al viaj propraj mesaĝoj.<\/span> <span class=\"sg\" data-s=\"2\">Tre baldaŭ, vi renkontos <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas ilo en Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi presas la saman specon de formo por vi, en unu paŝo.<\/span><\/p>"]]},"la":{"t":"Methodus <code>.raku<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tertia methodus est <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Seriem cum forma valoris <strong>codici simili<\/strong> reddit.<\/span> <span class=\"sg\" data-s=\"2\">Optimo casu hanc seriem in programma inserere potes.<\/span> <span class=\"sg\" data-s=\"3\">Tum eundem valorem iterum accipis.<\/span> <span class=\"sg\" data-s=\"4\">Quisque valor in Raku hanc methodum habet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Specta seriem <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cum signis citationis circum se redit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque numerus et series diversi apparent.<\/span> <span class=\"sg\" data-s=\"3\">Tales res parvas requiris cum programma corrigis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus etiam pro datis cum multis partibus operatur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc etiam data inserta continet, cum una structura intra alteram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.raku<\/code> seriem normalem reddit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eam in omni loco adhibere potes qui seriem requirit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, eam intra seriem in signis citationis duplicibus ponere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Utere <code>.raku<\/code> cum hanc formam ut seriem requiris.<\/span> <span class=\"sg\" data-s=\"1\">Tum eam nuntiis tuis addere potes.<\/span> <span class=\"sg\" data-s=\"2\">Mox <code>dd<\/code> cognosces.<\/span> <span class=\"sg\" data-s=\"3\">Instrumentum in Rakudo est.<\/span> <span class=\"sg\" data-s=\"4\">Idem genus formae pro te imprimit, uno gradu.<\/span><\/p>"]]}}}</script>
