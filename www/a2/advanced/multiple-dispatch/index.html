<script type="application/json" id="page-data">{"u":"advanced/multiple-dispatch","n":656,"k":"section","pv":"advanced/colon-calls/quiz","nx":"advanced/multiple-dispatch/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Multiple dispatch","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you learned about <a href=\"/essentials/more-on-functions/multi-functions/\"><em>multi-functions<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">These are several subroutines with the same name.<\/span> <span class=\"sg\" data-s=\"2\">Raku looks at the types of the arguments.<\/span> <span class=\"sg\" data-s=\"3\">Then it chooses the right subroutine.<\/span> <span class=\"sg\" data-s=\"4\">This is called <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Until now, Raku chose by the <em>type<\/em> of the arguments.<\/span> <span class=\"sg\" data-s=\"1\">With a <code>where<\/code> clause, you can do more.<\/span> <span class=\"sg\" data-s=\"2\">Raku can also choose by the <em>value<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">You write <code>where<\/code> after a parameter.<\/span> <span class=\"sg\" data-s=\"4\">It has a condition.<\/span> <span class=\"sg\" data-s=\"5\">Each variant of the function is called a candidate.<\/span> <span class=\"sg\" data-s=\"6\">Raku chooses a candidate only when its condition is true for the argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each call goes to the candidate with a true condition for that value:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Look at the types.<\/span> <span class=\"sg\" data-s=\"1\">All three candidates have the same signature: one <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Without the <code>where<\/code> clauses, they clash.<\/span> <span class=\"sg\" data-s=\"3\">Raku cannot choose between them.<\/span> <span class=\"sg\" data-s=\"4\">The conditions make them different.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stopping a recursion<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">People often use <code>where<\/code> with recursion.<\/span> <span class=\"sg\" data-s=\"1\">In a recursion, a function calls itself.<\/span> <span class=\"sg\" data-s=\"2\">It must stop at some point.<\/span> <span class=\"sg\" data-s=\"3\">You can put this stop point into a separate candidate.<\/span> <span class=\"sg\" data-s=\"4\">Here is the factorial again.<\/span> <span class=\"sg\" data-s=\"5\">Now it has two multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">The first candidate is the base case.<\/span> <span class=\"sg\" data-s=\"1\">Here, the recursion stops.<\/span> <span class=\"sg\" data-s=\"2\">In this case, <code>$n<\/code> is <code>1<\/code> or less.<\/span> <span class=\"sg\" data-s=\"3\">This candidate simply returns <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">All other values go to the second candidate.<\/span> <span class=\"sg\" data-s=\"5\">It calls <code>fact<\/code> again with a smaller number.<\/span> <span class=\"sg\" data-s=\"6\">There is no <code>if<\/code> inside the function.<\/span> <span class=\"sg\" data-s=\"7\">The dispatcher chooses between the base case and the recursive step.<\/span> <span class=\"sg\" data-s=\"8\">The dispatcher is the part of Raku that picks a candidate.<\/span><\/p>"]]},"de":{"t":"Mehrfach-Dispatch","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Im Teil „Grundlagen“ haben Sie <a href=\"https://course.raku.org/de/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>Multi-Funktionen<\/em><\/a> kennengelernt.<\/span> <span class=\"sg\" data-s=\"1\">Das sind mehrere Subroutinen mit demselben Namen.<\/span> <span class=\"sg\" data-s=\"2\">Raku sieht sich die Typen der Argumente an.<\/span> <span class=\"sg\" data-s=\"3\">Dann wählt es die richtige Subroutine.<\/span> <span class=\"sg\" data-s=\"4\">Das nennt man <em>Multiple Dispatch<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Bis jetzt hat Raku nach dem <em>Typ<\/em> der Argumente gewählt.<\/span> <span class=\"sg\" data-s=\"1\">Mit einer <code>where<\/code>-Klausel können Sie mehr machen.<\/span> <span class=\"sg\" data-s=\"2\">Raku kann auch nach dem <em>Wert<\/em> wählen.<\/span> <span class=\"sg\" data-s=\"3\">Sie schreiben <code>where<\/code> nach einem Parameter.<\/span> <span class=\"sg\" data-s=\"4\">Die Klausel enthält eine Bedingung.<\/span> <span class=\"sg\" data-s=\"5\">Jede Variante der Funktion heißt Kandidat.<\/span> <span class=\"sg\" data-s=\"6\">Raku wählt einen Kandidaten nur, wenn seine Bedingung für das Argument wahr ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf geht an den Kandidaten mit einer wahren Bedingung für diesen Wert:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich die Typen an.<\/span> <span class=\"sg\" data-s=\"1\">Alle drei Kandidaten haben dieselbe Signatur: ein <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ohne die <code>where<\/code>-Klauseln kollidieren sie.<\/span> <span class=\"sg\" data-s=\"3\">Raku kann nicht zwischen ihnen wählen.<\/span> <span class=\"sg\" data-s=\"4\">Die Bedingungen machen sie verschieden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eine Rekursion beenden<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Man benutzt <code>where<\/code> oft bei einer Rekursion.<\/span> <span class=\"sg\" data-s=\"1\">Bei einer Rekursion ruft eine Funktion sich selbst auf.<\/span> <span class=\"sg\" data-s=\"2\">Sie muss irgendwann aufhören.<\/span> <span class=\"sg\" data-s=\"3\">Diesen Endpunkt können Sie in einen eigenen Kandidaten setzen.<\/span> <span class=\"sg\" data-s=\"4\">Hier ist wieder die Fakultät.<\/span> <span class=\"sg\" data-s=\"5\">Jetzt hat sie zwei Multi-Subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Der erste Kandidat ist der Basisfall.<\/span> <span class=\"sg\" data-s=\"1\">Hier hört die Rekursion auf.<\/span> <span class=\"sg\" data-s=\"2\">In diesem Fall ist <code>$n<\/code> gleich <code>1<\/code> oder kleiner.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Kandidat gibt einfach <code>1<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"4\">Alle anderen Werte gehen an den zweiten Kandidaten.<\/span> <span class=\"sg\" data-s=\"5\">Er ruft <code>fact<\/code> noch einmal mit einer kleineren Zahl auf.<\/span> <span class=\"sg\" data-s=\"6\">In der Funktion gibt es kein <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Der Dispatcher wählt zwischen dem Basisfall und dem rekursiven Schritt.<\/span> <span class=\"sg\" data-s=\"8\">Der Dispatcher ist der Teil von Raku, der einen Kandidaten auswählt.<\/span><\/p>"]]},"nl":{"t":"Meervoudige dispatch","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <a href=\"https://course.raku.org/nl/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-functies<\/em><\/a> leren kennen.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn meerdere subroutines met dezelfde naam.<\/span> <span class=\"sg\" data-s=\"2\">Raku kijkt naar de typen van de argumenten.<\/span> <span class=\"sg\" data-s=\"3\">Dan kiest het de juiste subroutine.<\/span> <span class=\"sg\" data-s=\"4\">Dit heet <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe koos Raku op het <em>type<\/em> van de argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Met een <code>where<\/code>-clausule kun je meer doen.<\/span> <span class=\"sg\" data-s=\"2\">Raku kan ook op de <em>waarde<\/em> kiezen.<\/span> <span class=\"sg\" data-s=\"3\">Je schrijft <code>where<\/code> na een parameter.<\/span> <span class=\"sg\" data-s=\"4\">Daarin staat een voorwaarde.<\/span> <span class=\"sg\" data-s=\"5\">Elke variant van de functie heet een kandidaat.<\/span> <span class=\"sg\" data-s=\"6\">Raku kiest een kandidaat alleen als zijn voorwaarde waar is voor het argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep gaat naar de kandidaat met een voorwaarde die waar is voor die waarde:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de typen.<\/span> <span class=\"sg\" data-s=\"1\">Alle drie de kandidaten hebben dezelfde signatuur: één <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Zonder de <code>where<\/code>-clausules botsen ze.<\/span> <span class=\"sg\" data-s=\"3\">Raku kan er dan niet tussen kiezen.<\/span> <span class=\"sg\" data-s=\"4\">De voorwaarden maken ze verschillend.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een recursie stoppen<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Mensen gebruiken <code>where<\/code> vaak bij recursie.<\/span> <span class=\"sg\" data-s=\"1\">Bij recursie roept een functie zichzelf aan.<\/span> <span class=\"sg\" data-s=\"2\">Op een bepaald moment moet die stoppen.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt dit stoppunt in een aparte kandidaat zetten.<\/span> <span class=\"sg\" data-s=\"4\">Hier is de faculteit weer.<\/span> <span class=\"sg\" data-s=\"5\">Nu zijn het twee multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">De eerste kandidaat is het basisgeval.<\/span> <span class=\"sg\" data-s=\"1\">Hier stopt de recursie.<\/span> <span class=\"sg\" data-s=\"2\">In dit geval is <code>$n<\/code> gelijk aan <code>1<\/code> of minder.<\/span> <span class=\"sg\" data-s=\"3\">Deze kandidaat geeft gewoon <code>1<\/code> terug.<\/span> <span class=\"sg\" data-s=\"4\">Alle andere waarden gaan naar de tweede kandidaat.<\/span> <span class=\"sg\" data-s=\"5\">Die roept <code>fact<\/code> weer aan met een kleiner getal.<\/span> <span class=\"sg\" data-s=\"6\">Er staat geen <code>if<\/code> in de functie.<\/span> <span class=\"sg\" data-s=\"7\">De dispatcher kiest tussen het basisgeval en de recursieve stap.<\/span> <span class=\"sg\" data-s=\"8\">De dispatcher is het deel van Raku dat een kandidaat kiest.<\/span><\/p>"]]},"es":{"t":"Despacho múltiple","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales, aprendiste sobre las <a href=\"https://course.raku.org/es/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funciones<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Son varias subrutinas con el mismo nombre.<\/span> <span class=\"sg\" data-s=\"2\">Raku mira los tipos de los argumentos.<\/span> <span class=\"sg\" data-s=\"3\">Después elige la subrutina correcta.<\/span> <span class=\"sg\" data-s=\"4\">Esto se llama <em>despacho múltiple<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, Raku elegía por el <em>tipo<\/em> de los argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Con una cláusula <code>where<\/code>, puedes hacer más.<\/span> <span class=\"sg\" data-s=\"2\">Raku también puede elegir por el <em>valor<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Escribes <code>where<\/code> después de un parámetro.<\/span> <span class=\"sg\" data-s=\"4\">Tiene una condición.<\/span> <span class=\"sg\" data-s=\"5\">Cada variante de la función se llama candidato.<\/span> <span class=\"sg\" data-s=\"6\">Raku elige un candidato solo cuando su condición es verdadera para el argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada va al candidato con una condición verdadera para ese valor:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Mira los tipos.<\/span> <span class=\"sg\" data-s=\"1\">Los tres candidatos tienen la misma firma: un <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sin las cláusulas <code>where<\/code>, chocan.<\/span> <span class=\"sg\" data-s=\"3\">Raku no puede elegir entre ellos.<\/span> <span class=\"sg\" data-s=\"4\">Las condiciones los hacen diferentes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Detener una recursión<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La gente usa a menudo <code>where<\/code> con la recursión.<\/span> <span class=\"sg\" data-s=\"1\">En una recursión, una función se llama a sí misma.<\/span> <span class=\"sg\" data-s=\"2\">Debe parar en algún momento.<\/span> <span class=\"sg\" data-s=\"3\">Puedes poner este punto de parada en un candidato aparte.<\/span> <span class=\"sg\" data-s=\"4\">Aquí está otra vez el factorial.<\/span> <span class=\"sg\" data-s=\"5\">Ahora tiene dos multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">El primer candidato es el caso base.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, la recursión se detiene.<\/span> <span class=\"sg\" data-s=\"2\">En este caso, <code>$n<\/code> es <code>1<\/code> o menos.<\/span> <span class=\"sg\" data-s=\"3\">Este candidato simplemente devuelve <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Todos los demás valores van al segundo candidato.<\/span> <span class=\"sg\" data-s=\"5\">Este llama a <code>fact<\/code> otra vez con un número más pequeño.<\/span> <span class=\"sg\" data-s=\"6\">No hay ningún <code>if<\/code> dentro de la función.<\/span> <span class=\"sg\" data-s=\"7\">El despachador elige entre el caso base y el paso recursivo.<\/span> <span class=\"sg\" data-s=\"8\">El despachador es la parte de Raku que elige un candidato.<\/span><\/p>"]]},"it":{"t":"Dispatch multiplo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essenziali hai conosciuto le <a href=\"https://course.raku.org/it/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funzioni<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sono più subroutine con lo stesso nome.<\/span> <span class=\"sg\" data-s=\"2\">Raku guarda i tipi degli argomenti.<\/span> <span class=\"sg\" data-s=\"3\">Poi sceglie la subroutine giusta.<\/span> <span class=\"sg\" data-s=\"4\">Questo si chiama <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Finora Raku ha scelto in base al <em>tipo<\/em> degli argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Con una clausola <code>where<\/code> puoi fare di più.<\/span> <span class=\"sg\" data-s=\"2\">Raku può scegliere anche in base al <em>valore<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Scrivi <code>where<\/code> dopo un parametro.<\/span> <span class=\"sg\" data-s=\"4\">Contiene una condizione.<\/span> <span class=\"sg\" data-s=\"5\">Ogni variante della funzione si chiama candidato.<\/span> <span class=\"sg\" data-s=\"6\">Raku sceglie un candidato solo quando la sua condizione è vera per l'argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata va al candidato con una condizione vera per quel valore:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Guarda i tipi.<\/span> <span class=\"sg\" data-s=\"1\">Tutti e tre i candidati hanno la stessa firma: un <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Senza le clausole <code>where<\/code>, sono in conflitto.<\/span> <span class=\"sg\" data-s=\"3\">Raku non può scegliere tra loro.<\/span> <span class=\"sg\" data-s=\"4\">Le condizioni li rendono diversi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fermare una ricorsione<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Spesso si usa <code>where<\/code> con la ricorsione.<\/span> <span class=\"sg\" data-s=\"1\">In una ricorsione, una funzione chiama se stessa.<\/span> <span class=\"sg\" data-s=\"2\">A un certo punto deve fermarsi.<\/span> <span class=\"sg\" data-s=\"3\">Puoi mettere questo punto di arresto in un candidato separato.<\/span> <span class=\"sg\" data-s=\"4\">Ecco di nuovo il fattoriale.<\/span> <span class=\"sg\" data-s=\"5\">Ora ha due multi-sub:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Il primo candidato è il caso base.<\/span> <span class=\"sg\" data-s=\"1\">Qui la ricorsione si ferma.<\/span> <span class=\"sg\" data-s=\"2\">In questo caso, <code>$n<\/code> vale <code>1<\/code> o meno.<\/span> <span class=\"sg\" data-s=\"3\">Questo candidato restituisce semplicemente <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tutti gli altri valori vanno al secondo candidato.<\/span> <span class=\"sg\" data-s=\"5\">Questo chiama di nuovo <code>fact<\/code> con un numero più piccolo.<\/span> <span class=\"sg\" data-s=\"6\">Dentro la funzione non c'è nessun <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Il dispatcher sceglie tra il caso base e il passo ricorsivo.<\/span> <span class=\"sg\" data-s=\"8\">Il dispatcher è la parte di Raku che sceglie un candidato.<\/span><\/p>"]]},"lv":{"t":"Daudzkārtēja nosūtīšana","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sadaļā \"Pamati\" jūs uzzinājāt par <a href=\"https://course.raku.org/lv/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funkcijām<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir vairākas apakšprogrammas ar vienādu nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Raku skatās uz argumentu tipiem.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas izvēlas pareizo apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"4\">To sauc par <em>vairākkārtēju dispečēšanu<\/em> (multiple dispatch).<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Līdz šim Raku izvēlējās pēc argumentu <em>tipa<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>where<\/code> klauzulu jūs varat vairāk.<\/span> <span class=\"sg\" data-s=\"2\">Raku var izvēlēties arī pēc <em>vērtības<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs rakstāt <code>where<\/code> aiz parametra.<\/span> <span class=\"sg\" data-s=\"4\">Tajā ir nosacījums.<\/span> <span class=\"sg\" data-s=\"5\">Katru funkcijas variantu sauc par kandidātu.<\/span> <span class=\"sg\" data-s=\"6\">Raku izvēlas kandidātu tikai tad, ja tā nosacījums argumentam ir patiess:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums nonāk pie kandidāta, kura nosacījums šai vērtībai ir patiess:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Paskatieties uz tipiem.<\/span> <span class=\"sg\" data-s=\"1\">Visiem trim kandidātiem ir vienāda signatūra: viens <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bez <code>where<\/code> klauzulām tie konfliktē.<\/span> <span class=\"sg\" data-s=\"3\">Raku nevar izvēlēties starp tiem.<\/span> <span class=\"sg\" data-s=\"4\">Nosacījumi padara tos atšķirīgus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kā apturēt rekursiju<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> bieži lieto kopā ar rekursiju.<\/span> <span class=\"sg\" data-s=\"1\">Rekursijā funkcija izsauc pati sevi.<\/span> <span class=\"sg\" data-s=\"2\">Kādā brīdī tai jāapstājas.<\/span> <span class=\"sg\" data-s=\"3\">Šo apstāšanās punktu jūs varat ielikt atsevišķā kandidātā.<\/span> <span class=\"sg\" data-s=\"4\">Šeit atkal ir faktoriāls.<\/span> <span class=\"sg\" data-s=\"5\">Tagad tajā ir divas multi-apakšprogrammas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Pirmais kandidāts ir bāzes gadījums.<\/span> <span class=\"sg\" data-s=\"1\">Šeit rekursija apstājas.<\/span> <span class=\"sg\" data-s=\"2\">Šajā gadījumā <code>$n<\/code> ir <code>1<\/code> vai mazāks.<\/span> <span class=\"sg\" data-s=\"3\">Šis kandidāts vienkārši atgriež <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Visas citas vērtības nonāk pie otrā kandidāta.<\/span> <span class=\"sg\" data-s=\"5\">Tas izsauc <code>fact<\/code> vēlreiz ar mazāku skaitli.<\/span> <span class=\"sg\" data-s=\"6\">Funkcijā nav neviena <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Dispečeris izvēlas starp bāzes gadījumu un rekursīvo soli.<\/span> <span class=\"sg\" data-s=\"8\">Dispečeris ir Raku daļa, kas izvēlas kandidātu.<\/span><\/p>"]]},"ru":{"t":"Мультиметоды","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В разделе «Основы» вы узнали о <a href=\"https://course.raku.org/ru/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мульти-функциях<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Это несколько подпрограмм с одним именем.<\/span> <span class=\"sg\" data-s=\"2\">Raku смотрит на типы аргументов.<\/span> <span class=\"sg\" data-s=\"3\">Потом он выбирает нужную подпрограмму.<\/span> <span class=\"sg\" data-s=\"4\">Это называется <em>множественная диспетчеризация<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">До сих пор Raku выбирал по <em>типу<\/em> аргументов.<\/span> <span class=\"sg\" data-s=\"1\">С конструкцией <code>where<\/code> можно сделать больше.<\/span> <span class=\"sg\" data-s=\"2\">Raku может выбирать и по <em>значению<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вы пишете <code>where<\/code> после параметра.<\/span> <span class=\"sg\" data-s=\"4\">В <code>where<\/code> стоит условие.<\/span> <span class=\"sg\" data-s=\"5\">Каждый вариант функции называется кандидатом.<\/span> <span class=\"sg\" data-s=\"6\">Raku выбирает кандидата, только когда его условие истинно для аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов попадает к кандидату с истинным условием для этого значения:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на типы.<\/span> <span class=\"sg\" data-s=\"1\">У всех трёх кандидатов одна и та же сигнатура: один <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без конструкций <code>where<\/code> они конфликтуют.<\/span> <span class=\"sg\" data-s=\"3\">Raku не может выбрать между ними.<\/span> <span class=\"sg\" data-s=\"4\">Условия делают их разными.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Как остановить рекурсию<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> часто используют с рекурсией.<\/span> <span class=\"sg\" data-s=\"1\">В рекурсии функция вызывает сама себя.<\/span> <span class=\"sg\" data-s=\"2\">В какой-то момент она должна остановиться.<\/span> <span class=\"sg\" data-s=\"3\">Эту точку остановки можно вынести в отдельного кандидата.<\/span> <span class=\"sg\" data-s=\"4\">Вот снова факториал.<\/span> <span class=\"sg\" data-s=\"5\">Теперь в нём две мульти-подпрограммы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Первый кандидат — это базовый случай.<\/span> <span class=\"sg\" data-s=\"1\">Здесь рекурсия останавливается.<\/span> <span class=\"sg\" data-s=\"2\">В этом случае <code>$n<\/code> равно <code>1<\/code> или меньше.<\/span> <span class=\"sg\" data-s=\"3\">Этот кандидат просто возвращает <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Все остальные значения идут ко второму кандидату.<\/span> <span class=\"sg\" data-s=\"5\">Он снова вызывает <code>fact<\/code> с меньшим числом.<\/span> <span class=\"sg\" data-s=\"6\">Внутри функции нет <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Диспетчер выбирает между базовым случаем и шагом рекурсии.<\/span> <span class=\"sg\" data-s=\"8\">Диспетчер — это часть Raku, которая выбирает кандидата.<\/span><\/p>"]]},"uk":{"t":"Множинна диспетчеризація","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви дізналися про <a href=\"https://course.raku.org/uk/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мульти-функції<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Це кілька підпрограм з однаковим іменем.<\/span> <span class=\"sg\" data-s=\"2\">Raku дивиться на типи аргументів.<\/span> <span class=\"sg\" data-s=\"3\">Потім він вибирає потрібну підпрограму.<\/span> <span class=\"sg\" data-s=\"4\">Це називають <em>множинною диспетчеризацією<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Досі Raku вибирав за <em>типом<\/em> аргументів.<\/span> <span class=\"sg\" data-s=\"1\">З реченням <code>where<\/code> можна зробити більше.<\/span> <span class=\"sg\" data-s=\"2\">Raku може вибирати ще й за <em>значенням<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ви пишете <code>where<\/code> після параметра.<\/span> <span class=\"sg\" data-s=\"4\">У ньому є умова.<\/span> <span class=\"sg\" data-s=\"5\">Кожен варіант функції називають кандидатом.<\/span> <span class=\"sg\" data-s=\"6\">Raku вибирає кандидата, лише коли його умова істинна для аргументу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик іде до кандидата з істинною умовою для цього значення:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Подивіться на типи.<\/span> <span class=\"sg\" data-s=\"1\">Усі три кандидати мають однакову сигнатуру: один <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без речень <code>where<\/code> вони конфліктують.<\/span> <span class=\"sg\" data-s=\"3\">Raku не може вибрати між ними.<\/span> <span class=\"sg\" data-s=\"4\">Умови роблять їх різними.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Як зупинити рекурсію<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Часто <code>where<\/code> використовують із рекурсією.<\/span> <span class=\"sg\" data-s=\"1\">У рекурсії функція викликає саму себе.<\/span> <span class=\"sg\" data-s=\"2\">У якийсь момент вона мусить зупинитися.<\/span> <span class=\"sg\" data-s=\"3\">Цю точку зупинки можна винести в окремого кандидата.<\/span> <span class=\"sg\" data-s=\"4\">Ось знову факторіал.<\/span> <span class=\"sg\" data-s=\"5\">Тепер у нього дві мульти-підпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Перший кандидат — це базовий випадок.<\/span> <span class=\"sg\" data-s=\"1\">Тут рекурсія зупиняється.<\/span> <span class=\"sg\" data-s=\"2\">У цьому випадку <code>$n<\/code> дорівнює <code>1<\/code> або менше.<\/span> <span class=\"sg\" data-s=\"3\">Цей кандидат просто повертає <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Усі інші значення йдуть до другого кандидата.<\/span> <span class=\"sg\" data-s=\"5\">Він знову викликає <code>fact<\/code> із меншим числом.<\/span> <span class=\"sg\" data-s=\"6\">Усередині функції немає <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Диспетчер вибирає між базовим випадком і рекурсивним кроком.<\/span> <span class=\"sg\" data-s=\"8\">Диспетчер — це частина Raku, яка вибирає кандидата.<\/span><\/p>"]]},"bg":{"t":"Множествена диспечеризация","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи“ научихте за <a href=\"https://course.raku.org/bg/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мулти-функциите<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Това са няколко подпрограми с едно и също име.<\/span> <span class=\"sg\" data-s=\"2\">Raku гледа типовете на аргументите.<\/span> <span class=\"sg\" data-s=\"3\">После избира правилната подпрограма.<\/span> <span class=\"sg\" data-s=\"4\">Това се нарича <em>множествено диспечиране<\/em> (multiple dispatch).<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Досега Raku избираше по <em>типа<\/em> на аргументите.<\/span> <span class=\"sg\" data-s=\"1\">С клауза <code>where<\/code> можете да направите повече.<\/span> <span class=\"sg\" data-s=\"2\">Raku може да избира и по <em>стойността<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Пишете <code>where<\/code> след параметъра.<\/span> <span class=\"sg\" data-s=\"4\">Клаузата съдържа условие.<\/span> <span class=\"sg\" data-s=\"5\">Всеки вариант на функцията се нарича кандидат.<\/span> <span class=\"sg\" data-s=\"6\">Raku избира кандидата само когато условието му е вярно за аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване отива към кандидата с вярно условие за тази стойност:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вижте типовете.<\/span> <span class=\"sg\" data-s=\"1\">И трите кандидата имат една и съща сигнатура: един <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без клаузите <code>where<\/code> те се сблъскват.<\/span> <span class=\"sg\" data-s=\"3\">Raku не може да избере между тях.<\/span> <span class=\"sg\" data-s=\"4\">Условията ги правят различни.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Как да спрем рекурсията<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Хората често използват <code>where<\/code> при рекурсия.<\/span> <span class=\"sg\" data-s=\"1\">При рекурсия функцията извиква сама себе си.<\/span> <span class=\"sg\" data-s=\"2\">Тя трябва да спре в някакъв момент.<\/span> <span class=\"sg\" data-s=\"3\">Можете да сложите тази точка на спиране в отделен кандидат.<\/span> <span class=\"sg\" data-s=\"4\">Ето отново факториелът.<\/span> <span class=\"sg\" data-s=\"5\">Сега той има две мулти-подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Първият кандидат е базовият случай.<\/span> <span class=\"sg\" data-s=\"1\">Тук рекурсията спира.<\/span> <span class=\"sg\" data-s=\"2\">В този случай <code>$n<\/code> е <code>1<\/code> или по-малко.<\/span> <span class=\"sg\" data-s=\"3\">Този кандидат просто връща <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всички други стойности отиват към втория кандидат.<\/span> <span class=\"sg\" data-s=\"5\">Той извиква <code>fact<\/code> отново с по-малко число.<\/span> <span class=\"sg\" data-s=\"6\">Във функцията няма <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Диспечерът избира между базовия случай и рекурсивната стъпка.<\/span> <span class=\"sg\" data-s=\"8\">Диспечерът е частта от Raku, която избира кандидат.<\/span><\/p>"]]},"eo":{"t":"Multobla dissendo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencaĵoj, vi lernis pri <a href=\"https://course.raku.org/eo/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funkcioj<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas pluraj subrutinoj kun la sama nomo.<\/span> <span class=\"sg\" data-s=\"2\">Raku rigardas la tipojn de la argumentoj.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi elektas la ĝustan subrutinon.<\/span> <span class=\"sg\" data-s=\"4\">Tio nomiĝas <em>multobla sendo<\/em>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, Raku elektis laŭ la <em>tipo<\/em> de la argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Per frazo <code>where<\/code>, vi povas fari pli.<\/span> <span class=\"sg\" data-s=\"2\">Raku povas elekti ankaŭ laŭ la <em>valoro<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vi skribas <code>where<\/code> post parametro.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi havas kondiĉon.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiu varianto de la funkcio nomiĝas kandidato.<\/span> <span class=\"sg\" data-s=\"6\">Raku elektas kandidaton nur, kiam ĝia kondiĉo estas vera por la argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko iras al la kandidato kun vera kondiĉo por tiu valoro:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Rigardu la tipojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiuj tri kandidatoj havas la saman signaturon: unu <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sen la <code>where<\/code>-frazoj, ili kolizias.<\/span> <span class=\"sg\" data-s=\"3\">Raku ne povas elekti inter ili.<\/span> <span class=\"sg\" data-s=\"4\">La kondiĉoj faras ilin malsamaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Haltigi rekursion<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Oni ofte uzas <code>where<\/code> kun rekursio.<\/span> <span class=\"sg\" data-s=\"1\">En rekursio, funkcio vokas sin mem.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi devas halti iam.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas meti ĉi tiun haltan punkton en apartan kandidaton.<\/span> <span class=\"sg\" data-s=\"4\">Jen denove la faktorialo.<\/span> <span class=\"sg\" data-s=\"5\">Nun ĝi havas du multi-subrutinojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La unua kandidato estas la baza kazo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie, la rekursio haltas.<\/span> <span class=\"sg\" data-s=\"2\">En ĉi tiu kazo, <code>$n<\/code> estas <code>1<\/code> aŭ malpli.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu kandidato simple redonas <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiuj aliaj valoroj iras al la dua kandidato.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi vokas <code>fact<\/code> denove kun pli malgranda nombro.<\/span> <span class=\"sg\" data-s=\"6\">Ne estas <code>if<\/code> en la funkcio.<\/span> <span class=\"sg\" data-s=\"7\">La sendilo elektas inter la baza kazo kaj la rekursia paŝo.<\/span> <span class=\"sg\" data-s=\"8\">La sendilo estas la parto de Raku, kiu elektas kandidaton.<\/span><\/p>"]]},"la":{"t":"Multiplex dispatch","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium de <a href=\"https://course.raku.org/la/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-functionibus<\/em><\/a> didicisti.<\/span> <span class=\"sg\" data-s=\"1\">Hae sunt plures subroutinae cum eodem nomine.<\/span> <span class=\"sg\" data-s=\"2\">Raku genera argumentorum spectat.<\/span> <span class=\"sg\" data-s=\"3\">Tum subroutinam rectam eligit.<\/span> <span class=\"sg\" data-s=\"4\">Hoc <em>multiplex dispatium<\/em> vocatur.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Adhuc Raku ex <em>genere<\/em> argumentorum eligebat.<\/span> <span class=\"sg\" data-s=\"1\">Cum clausula <code>where<\/code> plus facere potes.<\/span> <span class=\"sg\" data-s=\"2\">Raku etiam ex <em>valore<\/em> eligere potest.<\/span> <span class=\"sg\" data-s=\"3\"><code>where<\/code> post parametrum scribis.<\/span> <span class=\"sg\" data-s=\"4\">Condicionem habet.<\/span> <span class=\"sg\" data-s=\"5\">Quaeque varians functionis candidatus vocatur.<\/span> <span class=\"sg\" data-s=\"6\">Raku candidatum eligit solum cum condicio eius vera est pro argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio ad candidatum it, cum condicione vera pro hoc valore:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Specta genera.<\/span> <span class=\"sg\" data-s=\"1\">Omnes tres candidati eandem signaturam habent: unum <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sine clausulis <code>where<\/code> confligunt.<\/span> <span class=\"sg\" data-s=\"3\">Raku inter eos eligere non potest.<\/span> <span class=\"sg\" data-s=\"4\">Condiciones eos diversos faciunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Recursionem sistere<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Homines saepe <code>where<\/code> cum recursione adhibent.<\/span> <span class=\"sg\" data-s=\"1\">In recursione functio se ipsam vocat.<\/span> <span class=\"sg\" data-s=\"2\">Aliquando consistere debet.<\/span> <span class=\"sg\" data-s=\"3\">Hoc punctum sistendi in candidatum separatum ponere potes.<\/span> <span class=\"sg\" data-s=\"4\">Ecce iterum factorialis.<\/span> <span class=\"sg\" data-s=\"5\">Nunc duos multi-subs habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Primus candidatus est casus basis.<\/span> <span class=\"sg\" data-s=\"1\">Hic recursio consistit.<\/span> <span class=\"sg\" data-s=\"2\">In hoc casu <code>$n<\/code> est <code>1<\/code> vel minus.<\/span> <span class=\"sg\" data-s=\"3\">Hic candidatus simpliciter <code>1<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"4\">Omnes alii valores ad secundum candidatum eunt.<\/span> <span class=\"sg\" data-s=\"5\">Is <code>fact<\/code> iterum cum numero minore vocat.<\/span> <span class=\"sg\" data-s=\"6\">Nullum <code>if<\/code> intra functionem est.<\/span> <span class=\"sg\" data-s=\"7\">Dispatchor inter casum basis et gradum recursivum eligit.<\/span> <span class=\"sg\" data-s=\"8\">Dispatchor est pars Raku quae candidatum eligit.<\/span><\/p>"]]}}}</script>
