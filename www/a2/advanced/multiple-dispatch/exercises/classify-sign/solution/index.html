","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Усі три кандидати приймають один <code>Int<\/code>. Без речень <code>where<\/code> вони конфліктують. Raku не може вибрати між ними. Умови на перших двох роблять їх різними. Третій кандидат бере всі інші числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Речення <code>where<\/code> перевіряють <code>$n.abs<\/code>. Тож важить лише величина числа, а не його знак. <code>size(7)<\/code> підходить до першого кандидата й дає <code>small<\/code>. У <code>size(-250)<\/code> абсолютне значення — <code>250<\/code>. Воно не проходить жодної з умов. Тож воно йде до останнього кандидата, який бере все інше. Результат — <code>large<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku перевіряє кандидатів від найконкретнішого до найзагальнішого. Тут це саме їхній порядок у коді.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Класифицирайте размера","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И трите кандидата приемат един <code>Int<\/code>. Без клаузите <code>where<\/code> те се сблъскват. Raku не може да избере между тях. Условията на първите два ги правят различни. Третият кандидат приема всички други числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Клаузите <code>where<\/code> проверяват <code>$n.abs<\/code>. Затова има значение само големината на числото, а не знакът му. <code>size(7)<\/code> съвпада с първия кандидат и дава <code>small<\/code>. В <code>size(-250)<\/code> абсолютната стойност е <code>250<\/code>. Тя не отговаря на нито едно от условията. Затова отива при последния кандидат, който приема всичко останало. Резултатът е <code>large<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku проверява кандидатите от най-специфичния към най-общия. Тук това е точно редът им в кода.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Klasifiki la grandecon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiuj tri kandidatoj prenas unu <code>Int<\/code>. Sen la <code>where<\/code>-frazoj, ili kolizias. Raku ne povas elekti inter ili. La kondiĉoj ĉe la unuaj du faras ilin malsamaj. La tria kandidato prenas ĉiujn aliajn nombrojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>where<\/code>-frazoj kontrolas <code>$n.abs<\/code>. Do nur la grandeco de la nombro gravas, ne ĝia signo. <code>size(7)<\/code> kongruas kun la unua kandidato kaj donas <code>small<\/code>. En <code>size(-250)<\/code>, la absoluta valoro estas <code>250<\/code>. Ĝi plenumas neniun el la du kondiĉoj. Do ĝi iras al la lasta kandidato, kiu prenas ĉion alian. La rezulto estas <code>large<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku testas la kandidatojn de la plej specifa ĝis la plej ĝenerala. Ĉi tie, tio estas ĝuste ilia ordo en la kodo.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Magnitudinem classificare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omnes tres candidati unum <code>Int<\/code> accipiunt. Sine clausulis <code>where<\/code> confligunt. Raku inter eos eligere non potest. Condiciones in primis duobus eos diversos faciunt. Tertius candidatus omnes alios numeros accipit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Clausulae <code>where<\/code> <code>$n.abs<\/code> probant. Itaque solum magnitudo numeri refert, non signum eius. <code>size(7)<\/code> primo candidato congruit et <code>small<\/code> dat. In <code>size(-250)<\/code> valor absolutus est <code>250<\/code>. Neutri condicioni satisfacit. Itaque ad ultimum candidatum it, qui omnia cetera accipit. Exitus est <code>large<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku candidatos a specificissimo ad generalissimum probat. Hic hoc est prorsus ordo eorum in codice.<\/span><\/li><\/ol>"]]}}}</script>
