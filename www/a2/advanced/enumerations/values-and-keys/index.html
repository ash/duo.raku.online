<script type="application/json" id="page-data">{"u":"advanced/enumerations/values-and-keys","n":515,"k":"topic","pv":"advanced/enumerations/defining/quiz","nx":"advanced/enumerations/values-and-keys/quiz","tr":["advanced","advanced/enumerations"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Values and keys","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Each constant of an enum has a name and a number.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.value<\/code> method gives the number.<\/span> <span class=\"sg\" data-s=\"2\">The <code>.key<\/code> method gives the name as a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku numbers the constants from zero.<\/span> <span class=\"sg\" data-s=\"1\">But you can change this.<\/span> <span class=\"sg\" data-s=\"2\">Write the constants as pairs.<\/span> <span class=\"sg\" data-s=\"3\">Then you choose the values yourself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, the working week starts from one, not from zero.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The enum type can also list all its constants.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.enums<\/code> method returns a map.<\/span> <span class=\"sg\" data-s=\"2\">A map is like a hash.<\/span> <span class=\"sg\" data-s=\"3\">In this map, each name has its value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">With <code>.value<\/code>, <code>.key<\/code>, and <code>.enums<\/code>, you can move around freely.<\/span> <span class=\"sg\" data-s=\"1\">You can go from a constant to its number.<\/span> <span class=\"sg\" data-s=\"2\">You can go from a number back to the data.<\/span> <span class=\"sg\" data-s=\"3\">And you can go over the whole set.<\/span> <span class=\"sg\" data-s=\"4\">So enums are useful, for example, for menus, states, and lookup tables.<\/span><\/p>"]]},"de":{"t":"Werte und Schlüssel","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jede Konstante eines Enums hat einen Namen und eine Zahl.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>.value<\/code> gibt die Zahl zurück.<\/span> <span class=\"sg\" data-s=\"2\">Die Methode <code>.key<\/code> gibt den Namen als String zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku nummeriert die Konstanten ab null.<\/span> <span class=\"sg\" data-s=\"1\">Aber du kannst das ändern.<\/span> <span class=\"sg\" data-s=\"2\">Schreibe die Konstanten als Paare.<\/span> <span class=\"sg\" data-s=\"3\">Dann wählst du die Werte selbst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier beginnt die Arbeitswoche bei eins, nicht bei null.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der Enum-Typ kann auch alle seine Konstanten auflisten.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>.enums<\/code> gibt eine Map zurück.<\/span> <span class=\"sg\" data-s=\"2\">Eine Map ist wie ein Hash.<\/span> <span class=\"sg\" data-s=\"3\">In dieser Map hat jeder Name seinen Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Mit <code>.value<\/code>, <code>.key<\/code> und <code>.enums<\/code> kannst du dich frei bewegen.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst von einer Konstante zu ihrer Zahl gehen.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst von einer Zahl zurück zu den Daten gehen.<\/span> <span class=\"sg\" data-s=\"3\">Und du kannst über die ganze Menge gehen.<\/span> <span class=\"sg\" data-s=\"4\">Deshalb sind Enums zum Beispiel für Menüs, Zustände und Nachschlagetabellen nützlich.<\/span><\/p>"]]},"nl":{"t":"Waarden en sleutels","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke constante van een enum heeft een naam en een getal.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.value<\/code> geeft het getal.<\/span> <span class=\"sg\" data-s=\"2\">De methode <code>.key<\/code> geeft de naam als een tekenreeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku nummert de constanten vanaf nul.<\/span> <span class=\"sg\" data-s=\"1\">Maar je kunt dat veranderen.<\/span> <span class=\"sg\" data-s=\"2\">Schrijf de constanten als paren.<\/span> <span class=\"sg\" data-s=\"3\">Dan kies je de waarden zelf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier begint de werkweek bij één, niet bij nul.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het enum-type kan ook een lijst van al zijn constanten geven.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.enums<\/code> geeft een map terug.<\/span> <span class=\"sg\" data-s=\"2\">Een map lijkt op een hash.<\/span> <span class=\"sg\" data-s=\"3\">In deze map heeft elke naam zijn waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Met <code>.value<\/code>, <code>.key<\/code> en <code>.enums<\/code> kun je vrij heen en weer gaan.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt van een constante naar zijn getal gaan.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt van een getal terug naar de gegevens gaan.<\/span> <span class=\"sg\" data-s=\"3\">En je kunt de hele verzameling doorlopen.<\/span> <span class=\"sg\" data-s=\"4\">Daarom zijn enums handig, bijvoorbeeld voor menu's, toestanden en opzoektabellen.<\/span><\/p>"]]},"es":{"t":"Valores y claves","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada constante de un enum tiene un nombre y un número.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>.value<\/code> da el número.<\/span> <span class=\"sg\" data-s=\"2\">El método <code>.key<\/code> da el nombre como cadena de texto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku numera las constantes desde cero.<\/span> <span class=\"sg\" data-s=\"1\">Pero puedes cambiar esto.<\/span> <span class=\"sg\" data-s=\"2\">Escribe las constantes como pares.<\/span> <span class=\"sg\" data-s=\"3\">Entonces eliges los valores tú mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí, la semana de trabajo empieza en uno, no en cero.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El tipo enum también puede listar todas sus constantes.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>.enums<\/code> devuelve un mapa.<\/span> <span class=\"sg\" data-s=\"2\">Un mapa es como un hash.<\/span> <span class=\"sg\" data-s=\"3\">En este mapa, cada nombre tiene su valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Con <code>.value<\/code>, <code>.key<\/code> y <code>.enums<\/code>, puedes moverte con libertad.<\/span> <span class=\"sg\" data-s=\"1\">Puedes ir de una constante a su número.<\/span> <span class=\"sg\" data-s=\"2\">Puedes volver de un número a los datos.<\/span> <span class=\"sg\" data-s=\"3\">Y puedes recorrer todo el conjunto.<\/span> <span class=\"sg\" data-s=\"4\">Por eso los enums son útiles, por ejemplo, para menús, estados y tablas de búsqueda.<\/span><\/p>"]]},"it":{"t":"Valori e chiavi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni costante di un enum ha un nome e un numero.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>.value<\/code> dà il numero.<\/span> <span class=\"sg\" data-s=\"2\">Il metodo <code>.key<\/code> dà il nome come stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku numera le costanti a partire da zero.<\/span> <span class=\"sg\" data-s=\"1\">Ma puoi cambiarlo.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi le costanti come coppie.<\/span> <span class=\"sg\" data-s=\"3\">Allora scegli tu i valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui la settimana lavorativa parte da uno, non da zero.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il tipo enum può anche elencare tutte le sue costanti.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>.enums<\/code> restituisce una mappa.<\/span> <span class=\"sg\" data-s=\"2\">Una mappa è come un hash.<\/span> <span class=\"sg\" data-s=\"3\">In questa mappa, ogni nome ha il suo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Con <code>.value<\/code>, <code>.key<\/code> e <code>.enums<\/code> ti puoi muovere liberamente.<\/span> <span class=\"sg\" data-s=\"1\">Puoi andare da una costante al suo numero.<\/span> <span class=\"sg\" data-s=\"2\">Puoi tornare da un numero ai dati.<\/span> <span class=\"sg\" data-s=\"3\">E puoi lavorare su tutto l'insieme.<\/span> <span class=\"sg\" data-s=\"4\">Per questo gli enum sono utili, per esempio, per menu, stati e tabelle di ricerca.<\/span><\/p>"]]},"lv":{"t":"Vērtības un atslēgas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrai uzskaitījuma konstantei ir nosaukums un skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>.value<\/code> dod skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Metode <code>.key<\/code> dod nosaukumu kā virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku numurē konstantes no nulles.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs varat to mainīt.<\/span> <span class=\"sg\" data-s=\"2\">Rakstiet konstantes kā pārus.<\/span> <span class=\"sg\" data-s=\"3\">Tad jūs pats izvēlaties vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit darba nedēļa sākas no viena, nevis no nulles.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzskaitījuma tips var arī uzskaitīt visas savas konstantes.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>.enums<\/code> atgriež attēlojumu.<\/span> <span class=\"sg\" data-s=\"2\">Attēlojums ir līdzīgs hešam.<\/span> <span class=\"sg\" data-s=\"3\">Šajā attēlojumā katram nosaukumam ir sava vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ar <code>.value<\/code>, <code>.key<\/code> un <code>.enums<\/code> jūs varat brīvi pārvietoties.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat iet no konstantes uz tās skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat iet no skaitļa atpakaļ uz datiem.<\/span> <span class=\"sg\" data-s=\"3\">Un jūs varat iet pāri visai kopai.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc uzskaitījumi ir noderīgi, piemēram, izvēlnēm, stāvokļiem un uzmeklēšanas tabulām.<\/span><\/p>"]]},"ru":{"t":"Значения и ключи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У каждой константы перечисления есть имя и число.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.value<\/code> даёт число.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>.key<\/code> даёт имя в виде строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku нумерует константы с нуля.<\/span> <span class=\"sg\" data-s=\"1\">Но это можно изменить.<\/span> <span class=\"sg\" data-s=\"2\">Запишите константы как пары.<\/span> <span class=\"sg\" data-s=\"3\">Тогда вы сами выбираете значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь рабочая неделя начинается с единицы, а не с нуля.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тип перечисления может также показать все свои константы.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.enums<\/code> возвращает отображение.<\/span> <span class=\"sg\" data-s=\"2\">Отображение похоже на хеш.<\/span> <span class=\"sg\" data-s=\"3\">В этом отображении у каждого имени есть своё значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">С <code>.value<\/code>, <code>.key<\/code> и <code>.enums<\/code> можно свободно двигаться.<\/span> <span class=\"sg\" data-s=\"1\">Можно перейти от константы к её числу.<\/span> <span class=\"sg\" data-s=\"2\">Можно перейти от числа обратно к данным.<\/span> <span class=\"sg\" data-s=\"3\">А ещё можно пройти по всему набору.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому перечисления полезны, например, для меню, состояний и таблиц соответствий.<\/span><\/p>"]]},"uk":{"t":"Значення та ключі","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожна константа перелічення має ім'я та число.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.value<\/code> дає число.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>.key<\/code> дає ім'я як рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku нумерує константи від нуля.<\/span> <span class=\"sg\" data-s=\"1\">Але це можна змінити.<\/span> <span class=\"sg\" data-s=\"2\">Запишіть константи як пари.<\/span> <span class=\"sg\" data-s=\"3\">Тоді ви самі обираєте значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут робочий тиждень починається з одиниці, а не з нуля.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тип перелічення може також показати всі свої константи.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.enums<\/code> повертає відображення.<\/span> <span class=\"sg\" data-s=\"2\">Відображення схоже на хеш.<\/span> <span class=\"sg\" data-s=\"3\">У цьому відображенні кожне ім'я має своє значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">З <code>.value<\/code>, <code>.key<\/code> і <code>.enums<\/code> ви можете вільно рухатися.<\/span> <span class=\"sg\" data-s=\"1\">Можна перейти від константи до її числа.<\/span> <span class=\"sg\" data-s=\"2\">Можна перейти від числа назад до даних.<\/span> <span class=\"sg\" data-s=\"3\">І можна пройти по всьому набору.<\/span> <span class=\"sg\" data-s=\"4\">Тому перелічення корисні, наприклад, для меню, станів і таблиць пошуку.<\/span><\/p>"]]},"bg":{"t":"Стойности и ключове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяка константа на изброимия тип има име и число.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>.value<\/code> дава числото.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>.key<\/code> дава името като низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku номерира константите от нула.<\/span> <span class=\"sg\" data-s=\"1\">Но можете да промените това.<\/span> <span class=\"sg\" data-s=\"2\">Запишете константите като двойки.<\/span> <span class=\"sg\" data-s=\"3\">Тогава сами избирате стойностите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук работната седмица започва от едно, а не от нула.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Изброимият тип може също да даде списък с всичките си константи.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>.enums<\/code> връща карта.<\/span> <span class=\"sg\" data-s=\"2\">Картата е като хеш.<\/span> <span class=\"sg\" data-s=\"3\">В тази карта всяко име има своята стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">С <code>.value<\/code>, <code>.key<\/code> и <code>.enums<\/code> можете да се движите свободно.<\/span> <span class=\"sg\" data-s=\"1\">Можете да минете от константа към нейното число.<\/span> <span class=\"sg\" data-s=\"2\">Можете да минете от число обратно към данните.<\/span> <span class=\"sg\" data-s=\"3\">А можете да минете и през целия набор.<\/span> <span class=\"sg\" data-s=\"4\">Затова изброимите типове са полезни например за менюта, състояния и таблици за справка.<\/span><\/p>"]]},"eo":{"t":"Valoroj kaj ŝlosiloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu konstanto de enumeracio havas nomon kaj nombron.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>.value<\/code> donas la nombron.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>.key<\/code> donas la nomon kiel ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku numeras la konstantojn de nulo.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi povas ŝanĝi tion.<\/span> <span class=\"sg\" data-s=\"2\">Skribu la konstantojn kiel parojn.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi mem elektas la valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la labora semajno komenciĝas de unu, ne de nulo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La enumeracia tipo ankaŭ povas listigi ĉiujn siajn konstantojn.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>.enums<\/code> redonas mapon.<\/span> <span class=\"sg\" data-s=\"2\">Mapo similas al hako.<\/span> <span class=\"sg\" data-s=\"3\">En ĉi tiu mapo, ĉiu nomo havas sian valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per <code>.value<\/code>, <code>.key<\/code> kaj <code>.enums<\/code>, vi povas libere moviĝi.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas iri de konstanto al ĝia nombro.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas iri de nombro reen al la datumoj.<\/span> <span class=\"sg\" data-s=\"3\">Kaj vi povas trairi la tutan aron.<\/span> <span class=\"sg\" data-s=\"4\">Do enumeracioj estas utilaj, ekzemple, por menuoj, statoj kaj serĉtabeloj.<\/span><\/p>"]]},"la":{"t":"Valores et claves","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quaeque constans enumerationis nomen et numerum habet.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>.value<\/code> numerum dat.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>.key<\/code> nomen ut chordam dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku constantes ab zero numerat.<\/span> <span class=\"sg\" data-s=\"1\">Sed hoc mutare potes.<\/span> <span class=\"sg\" data-s=\"2\">Constantes ut paria scribe.<\/span> <span class=\"sg\" data-s=\"3\">Tum valores ipse eligis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic hebdomas operaria ab uno incipit, non ab zero.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Typus enumerationis etiam omnes constantes suas monstrare potest.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>.enums<\/code> tabulam reddit.<\/span> <span class=\"sg\" data-s=\"2\">Tabula similis est hash.<\/span> <span class=\"sg\" data-s=\"3\">In hac tabula quodque nomen valorem suum habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cum <code>.value<\/code>, <code>.key<\/code>, et <code>.enums<\/code> libere ire potes.<\/span> <span class=\"sg\" data-s=\"1\">A constante ad numerum eius ire potes.<\/span> <span class=\"sg\" data-s=\"2\">A numero retro ad data ire potes.<\/span> <span class=\"sg\" data-s=\"3\">Et per totum gregem ire potes.<\/span> <span class=\"sg\" data-s=\"4\">Itaque enumerationes utiles sunt, exempli gratia, pro indicibus, statibus, et tabulis inspectionis.<\/span><\/p>"]]}}}</script>
