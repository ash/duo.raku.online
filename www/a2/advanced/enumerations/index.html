<script type="application/json" id="page-data">{"u":"advanced/enumerations","n":512,"k":"section","pv":"advanced/sequences/exercises/last-three/solution","nx":"advanced/enumerations/defining","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Enumerations","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\">An <em>enumeration<\/em> is a type.<\/span> <span class=\"sg\" data-s=\"1\">Its short name is <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">An enum has a fixed list of values.<\/span> <span class=\"sg\" data-s=\"3\">Each value is a constant with a name.<\/span> <span class=\"sg\" data-s=\"4\">A constant is a value that never changes.<\/span> <span class=\"sg\" data-s=\"5\">The days of the week are an example.<\/span> <span class=\"sg\" data-s=\"6\">The colours of a traffic light are another.<\/span> <span class=\"sg\" data-s=\"7\">The suits in a deck of cards are one more.<\/span> <span class=\"sg\" data-s=\"8\">Maybe <code>0<\/code> means red, and <code>1<\/code> means amber.<\/span> <span class=\"sg\" data-s=\"9\">You do not need to remember this.<\/span> <span class=\"sg\" data-s=\"10\">You give each value a name.<\/span> <span class=\"sg\" data-s=\"11\">Raku remembers the numbers for you.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This section shows how to make an enum.<\/span> <span class=\"sg\" data-s=\"1\">It also shows how to go from names to values, and back.<\/span><\/p>"]]},"de":{"t":"Aufzählungen","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Enumeration<\/em> ist ein Typ.<\/span> <span class=\"sg\" data-s=\"1\">Ihr kurzer Name ist <em>Enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Enum hat eine feste Liste von Werten.<\/span> <span class=\"sg\" data-s=\"3\">Jeder Wert ist eine Konstante mit einem Namen.<\/span> <span class=\"sg\" data-s=\"4\">Eine Konstante ist ein Wert, der sich nie ändert.<\/span> <span class=\"sg\" data-s=\"5\">Die Wochentage sind ein Beispiel.<\/span> <span class=\"sg\" data-s=\"6\">Die Farben einer Ampel sind ein anderes.<\/span> <span class=\"sg\" data-s=\"7\">Die Farben bei Spielkarten sind noch ein Beispiel.<\/span> <span class=\"sg\" data-s=\"8\">Vielleicht bedeutet <code>0<\/code> rot, und <code>1<\/code> bedeutet gelb.<\/span> <span class=\"sg\" data-s=\"9\">Das musst du dir nicht merken.<\/span> <span class=\"sg\" data-s=\"10\">Du gibst jedem Wert einen Namen.<\/span> <span class=\"sg\" data-s=\"11\">Raku merkt sich die Zahlen für dich.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt, wie du ein Enum machst.<\/span> <span class=\"sg\" data-s=\"1\">Er zeigt auch, wie du von Namen zu Werten kommst und zurück.<\/span><\/p>"]]},"nl":{"t":"Enumeraties","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\">Een <em>enumeratie<\/em> is een type.<\/span> <span class=\"sg\" data-s=\"1\">De korte naam is <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Een enum heeft een vaste lijst van waarden.<\/span> <span class=\"sg\" data-s=\"3\">Elke waarde is een constante met een naam.<\/span> <span class=\"sg\" data-s=\"4\">Een constante is een waarde die nooit verandert.<\/span> <span class=\"sg\" data-s=\"5\">De dagen van de week zijn een voorbeeld.<\/span> <span class=\"sg\" data-s=\"6\">De kleuren van een verkeerslicht zijn een ander voorbeeld.<\/span> <span class=\"sg\" data-s=\"7\">De kleuren in een kaartspel zijn nog een voorbeeld.<\/span> <span class=\"sg\" data-s=\"8\">Misschien betekent <code>0<\/code> rood en <code>1<\/code> oranje.<\/span> <span class=\"sg\" data-s=\"9\">Dat hoef je niet te onthouden.<\/span> <span class=\"sg\" data-s=\"10\">Je geeft elke waarde een naam.<\/span> <span class=\"sg\" data-s=\"11\">Raku onthoudt de nummers voor je.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel laat zien hoe je een enum maakt.<\/span> <span class=\"sg\" data-s=\"1\">Het laat ook zien hoe je van namen naar waarden gaat, en terug.<\/span><\/p>"]]},"es":{"t":"Enumeraciones","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\">Una <em>enumeración<\/em> es un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Su nombre corto es <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Un enum tiene una lista fija de valores.<\/span> <span class=\"sg\" data-s=\"3\">Cada valor es una constante con nombre.<\/span> <span class=\"sg\" data-s=\"4\">Una constante es un valor que nunca cambia.<\/span> <span class=\"sg\" data-s=\"5\">Los días de la semana son un ejemplo.<\/span> <span class=\"sg\" data-s=\"6\">Los colores de un semáforo son otro.<\/span> <span class=\"sg\" data-s=\"7\">Los palos de una baraja de cartas son uno más.<\/span> <span class=\"sg\" data-s=\"8\">Quizás <code>0<\/code> significa rojo, y <code>1<\/code> significa ámbar.<\/span> <span class=\"sg\" data-s=\"9\">No necesitas recordar esto.<\/span> <span class=\"sg\" data-s=\"10\">Le das un nombre a cada valor.<\/span> <span class=\"sg\" data-s=\"11\">Raku recuerda los números por ti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra cómo crear un enum.<\/span> <span class=\"sg\" data-s=\"1\">También muestra cómo ir de los nombres a los valores, y al revés.<\/span><\/p>"]]},"it":{"t":"Enumerazioni","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\">Un'<em>enumerazione<\/em> è un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Il suo nome breve è <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Un enum ha una lista fissa di valori.<\/span> <span class=\"sg\" data-s=\"3\">Ogni valore è una costante con un nome.<\/span> <span class=\"sg\" data-s=\"4\">Una costante è un valore che non cambia mai.<\/span> <span class=\"sg\" data-s=\"5\">I giorni della settimana sono un esempio.<\/span> <span class=\"sg\" data-s=\"6\">I colori di un semaforo sono un altro esempio.<\/span> <span class=\"sg\" data-s=\"7\">I semi di un mazzo di carte sono un altro ancora.<\/span> <span class=\"sg\" data-s=\"8\">Forse <code>0<\/code> significa rosso e <code>1<\/code> significa giallo.<\/span> <span class=\"sg\" data-s=\"9\">Non devi ricordarlo.<\/span> <span class=\"sg\" data-s=\"10\">Dai un nome a ogni valore.<\/span> <span class=\"sg\" data-s=\"11\">Raku ricorda i numeri per te.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra come creare un enum.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche come passare dai nomi ai valori, e viceversa.<\/span><\/p>"]]},"lv":{"t":"Uzskaitījumi 🆕","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\"><em>Uzskaitījums<\/em> ir tips.<\/span> <span class=\"sg\" data-s=\"1\">Tā īsais nosaukums ir <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Uzskaitījumam ir noteikts vērtību saraksts.<\/span> <span class=\"sg\" data-s=\"3\">Katra vērtība ir konstante ar nosaukumu.<\/span> <span class=\"sg\" data-s=\"4\">Konstante ir vērtība, kas nekad nemainās.<\/span> <span class=\"sg\" data-s=\"5\">Nedēļas dienas ir viens piemērs.<\/span> <span class=\"sg\" data-s=\"6\">Luksofora krāsas ir otrs piemērs.<\/span> <span class=\"sg\" data-s=\"7\">Kāršu masti ir vēl viens piemērs.<\/span> <span class=\"sg\" data-s=\"8\">Varbūt <code>0<\/code> nozīmē sarkano, un <code>1<\/code> nozīmē dzelteno.<\/span> <span class=\"sg\" data-s=\"9\">Jums tas nav jāatceras.<\/span> <span class=\"sg\" data-s=\"10\">Jūs katrai vērtībai dodat nosaukumu.<\/span> <span class=\"sg\" data-s=\"11\">Raku atceras skaitļus jūsu vietā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda, kā izveidot uzskaitījumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā arī parāda, kā pāriet no nosaukumiem uz vērtībām un atpakaļ.<\/span><\/p>"]]},"ru":{"t":"Перечисления","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\"><em>Перечисление<\/em> — это тип.<\/span> <span class=\"sg\" data-s=\"1\">Его короткое название — <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">У перечисления есть неизменный список значений.<\/span> <span class=\"sg\" data-s=\"3\">Каждое значение — это константа с именем.<\/span> <span class=\"sg\" data-s=\"4\">Константа — это значение, которое никогда не меняется.<\/span> <span class=\"sg\" data-s=\"5\">Дни недели — это пример.<\/span> <span class=\"sg\" data-s=\"6\">Цвета светофора — ещё один.<\/span> <span class=\"sg\" data-s=\"7\">Масти в колоде карт — ещё один пример.<\/span> <span class=\"sg\" data-s=\"8\">Например, <code>0<\/code> — это красный, а <code>1<\/code> — жёлтый.<\/span> <span class=\"sg\" data-s=\"9\">Вам не нужно это запоминать.<\/span> <span class=\"sg\" data-s=\"10\">Вы даёте каждому значению имя.<\/span> <span class=\"sg\" data-s=\"11\">Raku помнит числа за вас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот раздел показывает, как создать перечисление.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает, как перейти от имён к значениям и обратно.<\/span><\/p>"]]},"uk":{"t":"Перелічення","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\"><em>Перелічення<\/em> — це тип.<\/span> <span class=\"sg\" data-s=\"1\">Його коротка назва — <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Перелічення має фіксований список значень.<\/span> <span class=\"sg\" data-s=\"3\">Кожне значення — це константа з іменем.<\/span> <span class=\"sg\" data-s=\"4\">Константа — це значення, яке ніколи не змінюється.<\/span> <span class=\"sg\" data-s=\"5\">Дні тижня — один приклад.<\/span> <span class=\"sg\" data-s=\"6\">Кольори світлофора — другий.<\/span> <span class=\"sg\" data-s=\"7\">Масті в колоді карт — ще один.<\/span> <span class=\"sg\" data-s=\"8\">Можливо, <code>0<\/code> означає червоний, а <code>1<\/code> — жовтий.<\/span> <span class=\"sg\" data-s=\"9\">Вам не треба це пам'ятати.<\/span> <span class=\"sg\" data-s=\"10\">Ви даєте кожному значенню ім'я.<\/span> <span class=\"sg\" data-s=\"11\">Raku пам'ятає числа за вас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує, як створити перелічення.<\/span> <span class=\"sg\" data-s=\"1\">Він також показує, як перейти від імен до значень і назад.<\/span><\/p>"]]},"bg":{"t":"Изброявания 🆕","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\"><em>Изброимият тип<\/em> е вид тип.<\/span> <span class=\"sg\" data-s=\"1\">Краткото му име е <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Изброимият тип има определен списък от стойности.<\/span> <span class=\"sg\" data-s=\"3\">Всяка стойност е константа с име.<\/span> <span class=\"sg\" data-s=\"4\">Константата е стойност, която никога не се променя.<\/span> <span class=\"sg\" data-s=\"5\">Дните от седмицата са пример.<\/span> <span class=\"sg\" data-s=\"6\">Цветовете на светофара са друг пример.<\/span> <span class=\"sg\" data-s=\"7\">Боите в тесте карти са още един.<\/span> <span class=\"sg\" data-s=\"8\">Може би <code>0<\/code> означава червено, а <code>1<\/code> означава жълто.<\/span> <span class=\"sg\" data-s=\"9\">Не трябва да помните това.<\/span> <span class=\"sg\" data-s=\"10\">Давате име на всяка стойност.<\/span> <span class=\"sg\" data-s=\"11\">Raku помни числата вместо вас.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази секция показва как да създадете изброим тип.<\/span> <span class=\"sg\" data-s=\"1\">Тя показва и как да минете от имената към стойностите и обратно.<\/span><\/p>"]]},"eo":{"t":"Enumeracioj","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\"><em>Enumeracio<\/em> estas tipo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia mallonga nomo estas <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Enumeracio havas fiksitan liston de valoroj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu valoro estas konstanto kun nomo.<\/span> <span class=\"sg\" data-s=\"4\">Konstanto estas valoro, kiu neniam ŝanĝiĝas.<\/span> <span class=\"sg\" data-s=\"5\">La tagoj de la semajno estas ekzemplo.<\/span> <span class=\"sg\" data-s=\"6\">La koloroj de trafiklumo estas alia.<\/span> <span class=\"sg\" data-s=\"7\">La emblemoj en kartaro estas ankoraŭ unu.<\/span> <span class=\"sg\" data-s=\"8\">Eble <code>0<\/code> signifas ruĝan, kaj <code>1<\/code> signifas sukcenan.<\/span> <span class=\"sg\" data-s=\"9\">Vi ne devas memori tion.<\/span> <span class=\"sg\" data-s=\"10\">Vi donas al ĉiu valoro nomon.<\/span> <span class=\"sg\" data-s=\"11\">Raku memoras la nombrojn por vi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio montras, kiel fari enumeracion.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras, kiel iri de nomoj al valoroj kaj reen.<\/span><\/p>"]]},"la":{"t":"Enumerationes","b":[["p",12,"<p><span class=\"sg\" data-s=\"0\"><em>Enumeratio<\/em> est typus.<\/span> <span class=\"sg\" data-s=\"1\">Nomen eius breve est <em>enum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Enum indicem fixum valorum habet.<\/span> <span class=\"sg\" data-s=\"3\">Quisque valor est constans cum nomine.<\/span> <span class=\"sg\" data-s=\"4\">Constans est valor qui numquam mutatur.<\/span> <span class=\"sg\" data-s=\"5\">Dies hebdomadis sunt exemplum.<\/span> <span class=\"sg\" data-s=\"6\">Colores lucernae itinerariae sunt aliud exemplum.<\/span> <span class=\"sg\" data-s=\"7\">Etiam genera chartarum in fasciculo exemplum sunt.<\/span> <span class=\"sg\" data-s=\"8\">Fortasse <code>0<\/code> significat rubrum, et <code>1<\/code> significat flavum.<\/span> <span class=\"sg\" data-s=\"9\">Hoc meminisse non debes.<\/span> <span class=\"sg\" data-s=\"10\">Cuique valori nomen das.<\/span> <span class=\"sg\" data-s=\"11\">Raku numeros pro te meminit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec sectio docet enum facere.<\/span> <span class=\"sg\" data-s=\"1\">Etiam docet a nominibus ad valores ire, et retro.<\/span><\/p>"]]}}}</script>
