ardar un <code>Light<\/code>. Asigna la siguiente constante, y la luz avanza. Cada vez, el número cambia con el nombre: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Parece que <code>$current++<\/code> pasa a la siguiente luz por sí solo. Pero falla con un error de verificación de tipo. <code>++<\/code> ve la constante solo como su número. Devuelve un <code>Int<\/code>: <code>red<\/code> se convierte en <code>1<\/code>. Pero un <code>Int<\/code> no es un <code>Light<\/code>. Así que, para mover la luz, asigna la siguiente constante, como arriba.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku comprueba el tipo en cada asignación, no solo en la primera. <code>$current<\/code> acepta <code>red<\/code>, <code>amber<\/code> o <code>green<\/code>. No acepta otros valores, como un número o una cadena. No son un <code>Light<\/code>. Una asignación así da un error de verificación de tipo.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Semafori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol> <\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> ir parasts mainīgais. Jūs varat mainīt tā vērtību. Bet tas var glabāt tikai <code>Light<\/code>. Piešķiriet nākamo konstanti, un gaisma pārslēdzas. Katru reizi skaitlis mainās kopā ar nosaukumu: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izskatās, ka <code>$current++<\/code> pats pāriet uz nākamo gaismu. Bet tas dod tipa pārbaudes kļūdu. <code>++<\/code> redz konstanti tikai kā tās skaitli. Tas atgriež <code>Int<\/code>: <code>red<\/code> kļūst par <code>1<\/code>. Bet <code>Int<\/code> nav <code>Light<\/code>. Tāpēc, lai pārslēgtu gaismu, piešķiriet nākamo konstanti, kā augstāk.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku pārbauda tipu katrā piešķiršanā, ne tikai pirmajā. <code>$current<\/code> pieņem <code>red<\/code>, <code>amber<\/code> vai <code>green<\/code>. Tas nepieņem citas vērtības, piemēram, skaitli vai virkni. Tās nav <code>Light<\/code>. Šāda piešķiršana dod tipa pārbaudes kļūdu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Светофор","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> — обычная переменная. Её значение можно менять. Но она может хранить только <code>Light<\/code>. Присвойте следующую константу, и сигнал переключается. Каждый раз число меняется вместе с именем: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кажется, что <code>$current++<\/code> сам переходит к следующему сигналу. Но возникает ошибка проверки типа. <code>++<\/code> видит в константе только её число. Он возвращает <code>Int<\/code>: <code>red<\/code> становится <code>1<\/code>. Но <code>Int<\/code> — это не <code>Light<\/code>. Поэтому, чтобы переключить сигнал, присвойте следующую константу, как выше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku проверяет тип при каждом присваивании, а не только при первом. <code>$current<\/code> принимает <code>red<\/code>, <code>amber<\/code> или <code>green<\/code>. Другие значения он не принимает, например число или строку. Это не <code>Light<\/code>. Такое присваивание даёт ошибку проверки типа.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Світлофор","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> — це звичайна змінна. Ви можете змінювати її значення. Але вона може зберігати лише <code>Light<\/code>. Присвойте наступну константу, і сигнал перейде далі. Щоразу число змінюється разом з іменем: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Здається, що <code>$current++<\/code> сам переходить до наступного сигналу. Але він дає помилку перевірки типу. <code>++<\/code> бачить у константі лише її число. Він повертає <code>Int<\/code>: <code>red<\/code> стає <code>1<\/code>. Але <code>Int<\/code> — це не <code>Light<\/code>. Тож, щоб змінити сигнал, присвойте наступну константу, як вище.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku перевіряє тип при кожному присвоєнні, а не лише при першому. <code>$current<\/code> приймає <code>red<\/code>, <code>amber<\/code> або <code>green<\/code>. Інших значень вона не приймає, наприклад числа чи рядка. Вони не є <code>Light<\/code>. Таке присвоєння дає помилку перевірки типу.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Светофар","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> е обикновена променлива. Можете да сменяте нейната стойност. Но тя може да пази само <code>Light<\/code>. Присвоете следващата константа и светлината минава нататък. Всеки път числото се сменя заедно с името: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изглежда, че <code>$current++<\/code> минава сам към следващата светлина. Но той дава грешка при проверка на типа. <code>++<\/code> вижда константата само като нейното число. Той връща <code>Int<\/code>: <code>red<\/code> става <code>1<\/code>. Но <code>Int<\/code> не е <code>Light<\/code>. Затова, за да смените светлината, присвоете следващата константа, както по-горе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku проверява типа при всяко присвояване, не само при първото. <code>$current<\/code> приема <code>red<\/code>, <code>amber<\/code> или <code>green<\/code>. Той не приема други стойности, като число или низ. Те не са <code>Light<\/code>. Такова присвояване дава грешка при проверка на типа.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Trafiklumo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> estas normala variablo. Vi povas ŝanĝi ĝian valoron. Sed ĝi povas teni nur <code>Light<\/code>. Atribuu la sekvan konstanton, kaj la lumo iras plu. Ĉiufoje, la nombro ŝanĝiĝas kun la nomo: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ŝajnas, ke <code>$current++<\/code> iras al la sekva lumo per si mem. Sed ĝi malsukcesas kun tipkontrola eraro. <code>++<\/code> vidas la konstanton nur kiel ĝian nombron. Ĝi redonas <code>Int<\/code>: <code>red<\/code> fariĝas <code>1<\/code>. Sed <code>Int<\/code> ne estas <code>Light<\/code>. Do, por movi la lumon, atribuu la sekvan konstanton, kiel supre.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku kontrolas la tipon ĉe ĉiu atribuo, ne nur ĉe la unua. <code>$current<\/code> prenas <code>red<\/code>, <code>amber<\/code> aŭ <code>green<\/code>. Ĝi ne prenas aliajn valorojn, kiel nombron aŭ ĉenon. Ili ne estas <code>Light<\/code>. Tia atribuo donas tipkontrolan eraron.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Lumina trafficum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> est variabilis ordinaria. Valorem eius mutare potes. Sed solum <code>Light<\/code> tenere potest. Proximam constantem assigna, et lux progreditur. Quaque vice numerus cum nomine mutatur: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Videtur <code>$current++<\/code> sponte ad proximam lucem ire. Sed errore typi verificandi deficit. <code>++<\/code> constantem solum ut numerum eius videt. <code>Int<\/code> reddit: <code>red<\/code> fit <code>1<\/code>. Sed <code>Int<\/code> non est <code>Light<\/code>. Itaque, ut lucem moveas, proximam constantem assigna, ut supra.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku typum in omni assignatione probat, non solum in prima. <code>$current<\/code> accipit <code>red<\/code>, <code>amber<\/code>, vel <code>green<\/code>. Alios valores non accipit, ut numerum vel chordam. Hi valores non sunt <code>Light<\/code>. Talis assignatio errorem typi verificandi dat.<\/span><\/li><\/ol>"]]}}}</script>
