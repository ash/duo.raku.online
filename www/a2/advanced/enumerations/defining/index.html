lass=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aiz katra nosaukuma ir skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Raku piešķir skaitļus jūsu vietā.<\/span> <span class=\"sg\" data-s=\"2\">Tas sāk no nulles un iet jūsu saraksta secībā.<\/span> <span class=\"sg\" data-s=\"3\">Tātad <code>red<\/code> ir <code>0<\/code>, <code>green<\/code> ir <code>1<\/code> un <code>blue<\/code> ir <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vērtībām ir secība.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc konstantes var salīdzināt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgajam var būt uzskaitījuma tips.<\/span> <span class=\"sg\" data-s=\"1\">Tad mainīgais pieņem tikai šīs konstantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Konstantei un kaut kam citam var būt vienāds nosaukums.<\/span> <span class=\"sg\" data-s=\"1\">Tad pirms konstantes uzrakstiet uzskaitījuma nosaukumu un <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas vienmēr strādā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzskaitījums saliek kopā saistītas konstantes.<\/span> <span class=\"sg\" data-s=\"1\">Tas dod tām nosaukumu un tipu.<\/span> <span class=\"sg\" data-s=\"2\">Kods ar šīm konstantēm ir daudz skaidrāks nekā kods tikai ar skaitļiem.<\/span> <span class=\"sg\" data-s=\"3\">Nākamais temats ir par <a href=\"https://course.raku.org/lv/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">skaitļiem aiz nosaukumiem<\/a>.<\/span><\/p>"]]},"ru":{"t":"Определение перечисления","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы объявить перечисление, напишите ключевое слово < нстанты вместе.<\/span> <span class=\"sg\" data-s=\"1\">Оно даёт им имя и тип.<\/span> <span class=\"sg\" data-s=\"2\">Код с ними гораздо понятнее, чем код с одними числами.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема — о <a href=\"https://course.raku.org/ru/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числах за именами<\/a>.<\/span><\/p>"]]},"uk":{"t":"Визначення перелічення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб оголосити перелічення, напишіть ключове слово <code>enum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім напишіть ім'я та список імен для констант:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це створює новий тип <code>Colour<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це також створює три константи: <code>red<\/code>, <code>green<\/code> і <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Константу можна використати просто за її іменем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">За кожним іменем стоїть число.<\/span> <span class=\"sg\" data-s=\"1\">Raku сам дає ці числа.<\/span> <span class=\"sg\" data-s=\"2\">Він починає з нуля й іде за порядком вашого списку.<\/span> <span class=\"sg\" data-s=\"3\">Тож <code>red<\/code> — це <code>0<\/code>, <code>green<\/code> — <code>1<\/code>, а <code>blue<\/code> — <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Значення мають порядок.<\/span> <span class=\"sg\" data-s=\"5\">Тому константи можна порівнювати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінна може мати перелічення як свій тип.<\/span> <span class=\"sg\" data-s=\"1\">Тоді змінна приймає лише ці константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Константа й щось інше можуть мати однакове ім'я.<\/span> <span class=\"sg\" data-s=\"1\">Тоді напишіть перед константою ім'я перелічення та <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це працює завжди:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перелічення об'єднує пов'язані константи.<\/span> <span class=\"sg\" data-s=\"1\">Воно дає їм ім'я та тип.<\/span> <span class=\"sg\" data-s=\"2\">Код із такими константами набагато зрозуміліший, ніж код із самими числами.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема розповідає про <a href=\"https://course.raku.org/uk/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числа, що стоять за іменами<\/a>.<\/span><\/p>"]]},"bg":{"t":"Дефиниране на enum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За да декларирате изброим тип, напишете ключовата дума <code>enum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това напишете име и списъка с имената на константите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това създава нов тип, <code>Colour<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Създава и три константи: <code>red<\/code>, <code>green<\/code> и <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате константата просто по нейното име:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Зад всяко име има число.<\/span> <span class=\"sg\" data-s=\"1\">Raku дава числата вместо вас.<\/span> <span class=\"sg\" data-s=\"2\">Той започва от нула и следва реда на вашия списък.<\/span> <span class=\"sg\" data-s=\"3\">Така <code>red<\/code> е <code>0<\/code>, <code>green<\/code> е <code>1<\/code>, а <code>blue<\/code> е <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Стойностите имат ред.<\/span> <span class=\"sg\" data-s=\"5\">Затова можете да сравнявате константите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Една променлива може да има изброимия тип като свой тип.<\/span> <span class=\"sg\" data-s=\"1\">Тогава променливата приема само тези константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една константа и нещо друго може да имат едно и също име.<\/span> <span class=\"sg\" data-s=\"1\">Тогава напишете името на изброимия тип и <code>::<\/code> пред константата.<\/span> <span class=\"sg\" data-s=\"2\">Това винаги работи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Изброимият тип събира свързани константи заедно.<\/span> <span class=\"sg\" data-s=\"1\">Той им дава име и тип.<\/span> <span class=\"sg\" data-s=\"2\">Кодът с тези константи е много по-ясен от код само с числа.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема е за <a href=\"https://course.raku.org/bg/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числата зад имената<\/a>.<\/span><\/p>"]]},"eo":{"t":"Difini enumeracion","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por deklari enumeracion, skribu la ŝlosilvorton <code>enum<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste skribu nomon kaj la liston de nomoj por la konstantoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio faras novan tipon, <code>Colour<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ faras tri konstantojn: <code>red<\/code>, <code>green<\/code> kaj <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi konstanton nur per ĝia nomo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉiu nomo havas nombron malantaŭ si.<\/span> <span class=\"sg\" data-s=\"1\">Raku donas la nombrojn por vi.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi komencas de nulo kaj sekvas la ordon de via listo.<\/span> <span class=\"sg\" data-s=\"3\">Do <code>red<\/code> estas <code>0<\/code>, <code>green<\/code> estas <code>1<\/code>, kaj <code>blue<\/code> estas <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La valoroj havas ordon.<\/span> <span class=\"sg\" data-s=\"5\">Do vi povas kompari la konstantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variablo povas havi la enumeracion kiel sian tipon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la variablo prenas nur ĉi tiujn konstantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Konstanto kaj io alia povas havi la saman nomon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam skribu la nomon de la enumeracio kaj <code>::<\/code> antaŭ la konstanto.<\/span> <span class=\"sg\" data-s=\"2\">Tio ĉiam funkcias:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Enumeracio kunmetas rilatajn konstantojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi donas al ili nomon kaj tipon.<\/span> <span class=\"sg\" data-s=\"2\">Kodo kun ĉi tiuj konstantoj estas multe pli klara ol kodo kun nur nombroj.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo estas pri <a href=\"https://course.raku.org/eo/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">la nombroj malantaŭ la nomoj<\/a>.<\/span><\/p>"]]},"la":{"t":"Enumerationem definire","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut enum declares, verbum clavis <code>enum<\/code> scribe.<\/span> <span class=\"sg\" data-s=\"1\">Deinde nomen et indicem nominum pro constantibus scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc novum typum facit, <code>Colour<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam tres constantes facit: <code>red<\/code>, <code>green<\/code>, et <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Constantem solo nomine eius adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Post quodque nomen est numerus.<\/span> <span class=\"sg\" data-s=\"1\">Raku numeros pro te dat.<\/span> <span class=\"sg\" data-s=\"2\">Ab zero incipit et ordinem indicis tui sequitur.<\/span> <span class=\"sg\" data-s=\"3\">Itaque <code>red<\/code> est <code>0<\/code>, <code>green<\/code> est <code>1<\/code>, et <code>blue<\/code> est <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Valores ordinem habent.<\/span> <span class=\"sg\" data-s=\"5\">Itaque constantes comparare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis enum ut typum suum habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum variabilis solas has constantes accipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Constans et aliquid aliud idem nomen habere possunt.<\/span> <span class=\"sg\" data-s=\"1\">Tum nomen enumerationis et <code>::<\/code> ante constantem scribe.<\/span> <span class=\"sg\" data-s=\"2\">Hoc semper operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Enum constantes cognatas coniungit.<\/span> <span class=\"sg\" data-s=\"1\">Eis nomen et typum dat.<\/span> <span class=\"sg\" data-s=\"2\">Codex cum his constantibus multo clarior est quam codex cum solis numeris.<\/span> <span class=\"sg\" data-s=\"3\">Proximum thema est de <a href=\"https://course.raku.org/la/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">numeris post nomina<\/a>.<\/span><\/p>"]]}}}</script>
