 <span class=\"sg\" data-s=\"2\">Затова той е постциркумфиксен оператор.<\/span> <span class=\"sg\" data-s=\"3\">Обикновеният постфикс, като <code>++<\/code>, не слага скоби около нищо.<\/span> <span class=\"sg\" data-s=\"4\">Циркумфиксът стои около нещо.<\/span> <span class=\"sg\" data-s=\"5\">Но той не идва след терм.<\/span> <span class=\"sg\" data-s=\"6\">Пример за това е <code>[1, 2, 3]<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Той създава масив.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Operatorkategorioj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Rigardu la esprimon <code>@a[0]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kio estas la kategorio de la subskribo <code>[0]<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">postfix<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">postcircumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">circumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">infix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Subskribo havas krampojn ĉirkaŭ sia enhavo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi <em>ankaŭ<\/em> venas post termino, ĉi tie <code>@a<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do ĝi estas post-ĉirkaŭfiksa operatoro.<\/span> <span class=\"sg\" data-s=\"3\">Normala postfikso, kiel <code>++<\/code>, ne havas krampojn ĉirkaŭ io.<\/span> <span class=\"sg\" data-s=\"4\">Ĉirkaŭfikso staras ĉirkaŭ io.<\/span> <span class=\"sg\" data-s=\"5\">Sed ĝi ne venas post termino.<\/span> <span class=\"sg\" data-s=\"6\">Ekzemplo estas <code>[1, 2, 3]<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi faras tabelon.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Categoriae operatorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Specta expressionem <code>@a[0]<\/code>.<\/span> <span class=\"sg\
