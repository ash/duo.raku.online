" data-s=\"0\">Jūs jau zināt daudzus operatorus, piemēram, <code>+<\/code>, <code>~<\/code> un <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Operators strādā ar vērtībām.<\/span> <span class=\"sg\" data-s=\"2\">Šīs vērtības ir tā operandi.<\/span> <span class=\"sg\" data-s=\"3\">Raku sadala operatorus kategorijās.<\/span> <span class=\"sg\" data-s=\"4\">Kategorija ir grupa.<\/span> <span class=\"sg\" data-s=\"5\">Kategorija ir atkarīga no tā, <em>kur<\/em> operators stāv blakus saviem operandiem.<\/span> <span class=\"sg\" data-s=\"6\">Vēlāk jūs veidosiet savus operatorus.<\/span> <span class=\"sg\" data-s=\"7\">Tad kategorijas jums palīdzēs.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prefiksa operatoram ir viens operands.<\/span> <span class=\"sg\" data-s=\"1\">Tas atrodas <em>pirms<\/em> šī operanda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>-<\/code> maina skaitļa zīmi.<\/span> <span class=\"sg\" data-s=\"1\">Operators <code>?<\/code> pārvērš vērtību par <code>True<\/code> vai <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir tās Būla vērtība.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Infiksa operators stāv <em>starp<\/em> diviem operandiem.<\/span> <span class=\"sg\" data-s=\"1\">Jūs zināt daudzus operatorus skaitļiem un virknēm.<\/span> <span class=\"sg\" data-s=\"2\">Lielākā daļa no tiem ir infiksa operatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Infiksa operators ne vienmēr ir simbols.<\/span> <span class=\"sg\" data-s=\"1\">Tas var būt arī vārds.<\/span> <span class=\"sg\" data-s=\"2\">Paskatieties uz operatoru <code>gcd<\/code> no sadaļas par <a href=\"https://course.raku.org/lv/advanced/integers/\" target=\"_blank\" rel=\"noopener\">veseliem skaitļiem<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir infiksa operators.<\/span> <span class=\"sg\" data-s=\"4\">Jūs rakstāt tā nosaukumu starp diviem operandiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operatoram ir viens operands.<\/span> <span class=\"sg\" data-s=\"1\">Tas atrodas <em>aiz<\/em> šī operanda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> un <code>postcircumfix<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cirkumfiksa operators stāv <em>ap<\/em> savu operandu.<\/span> <span class=\"sg\" data-s=\"1\">Paskatieties uz kvadrātiekavām, kas izveido masīvu.<\/span> <span class=\"sg\" data-s=\"2\">Tās ir cirkumfiksa operators:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Postcirkumfiksa operators arī stāv ap kaut ko.<\/span> <span class=\"sg\" data-s=\"1\">Bet tas atrodas aiz terma.<\/span> <span class=\"sg\" data-s=\"2\">Terms ir, piemēram, mainīgais.<\/span> <span class=\"sg\" data-s=\"3\">Indeksi ir postcirkumfiksa operatori.<\/span> <span class=\"sg\" data-s=\"4\">Šeit indekss ir <code>[1]<\/code> aiz <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nosaukumi ir <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> un <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku lieto tos pašus vārdus, kad jūs <a href=\"https://course.raku.org/lv/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">deklarējat jaunu operatoru<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to redzēsiet vēlāk.<\/span><\/p>"]]},"ru":{"t":"Типы операторов Raku","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете много операторов, например <code>+<\/code>, <code>~<\/code> и <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оператор работает со значениями.<\/span> <span class=\"sg\" data-s=\"2\">Эти значения — его операнды.<\/span> <span class=\"sg\" data-s=\"3\">Raku делит операторы на категории.<\/span> <span class=\"sg\" data-s=\"4\">Категория — это группа.<\/span> <span class=\"sg\" data-s=\"5\">Категория зависит от того, <em>где<\/em> оператор стоит рядом с операндами.<\/span> <span class=\"sg\" data-s=\"6\">Позже вы будете создавать свои операторы.<\/span> <span class=\"sg\" data-s=\"7\">Тогда категории вам помогут.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У префиксного оператора один операнд.<\/span> <span class=\"sg\" data-s=\"1\">Он стоит <em>перед<\/em> этим операндом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-<\/code> меняет знак числа.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>?<\/code> превращает значение в <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это его булево значение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Инфиксный оператор стоит <em>между<\/em> двумя операндами.<\/span> <span class=\"sg\" data-s=\"1\">Вы знаете много операторов для чисел и строк.<\/span> <span class=\"sg\" data-s=\"2\">Большинство из них — инфиксные:<\/span><\/p>"],["code",0,"<pre class=\"la > <span class=\"sg\" data-s=\"1\">Venit <em>post<\/em> hunc operandum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> et <code>postcircumfix<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Operator circumfixus <em>circum<\/em> operandum suum stat.<\/span> <span class=\"sg\" data-s=\"1\">Specta uncos quadratos qui ordinem faciunt.<\/span> <span class=\"sg\" data-s=\"2\">Hi unci sunt operator circumfixus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Operator postcircumfixus etiam circum aliquid stat.<\/span> <span class=\"sg\" data-s=\"1\">Sed post terminum venit.<\/span> <span class=\"sg\" data-s=\"2\">Terminus est, exempli gratia, variabilis.<\/span> <span class=\"sg\" data-s=\"3\">Subscripta sunt operatores postcircumfixi.<\/span> <span class=\"sg\" data-s=\"4\">Hic subscriptum est <code>[1]<\/code> post <code>@a<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomina sunt <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code>, et <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku eadem verba adhibet cum <a href=\"https://course.raku.org/la/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">novum operatorem declaras<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc postea videbis.<\/span><\/p>"]]}}}</script>
