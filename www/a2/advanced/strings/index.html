g\" data-s=\"0\">Следующие темы показывают, как искать в строках.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, как разделять строки на части.<\/span> <span class=\"sg\" data-s=\"2\">И они показывают, как снова соединять части.<\/span><\/p>"]]},"uk":{"t":"Рядки","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви дізналися, <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">як будувати рядки<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ви навчилися з'єднувати рядки та інтерполювати.<\/span> <span class=\"sg\" data-s=\"2\">Ви також навчилися знаходити довжину рядка.<\/span> <span class=\"sg\" data-s=\"3\">Рядки мають ще й багато методів.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ показує найкорисніші з них.<\/span> <span class=\"sg\" data-s=\"5\">Пошук за <a href=\"https://course.raku.org/uk/regexes/\" target=\"_blank\" rel=\"noopener\">регулярними виразами<\/a> — окрема, більша тема.<\/span> <span class=\"sg\" data-s=\"6\">Вона має власну частину далі в курсі.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Три методи змінюють регістр рядка.<\/span> <span class=\"sg\" data-s=\"1\">Регістр — це великі або малі літери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — верхній регістр\nsay 'RAKU'.lc; # raku  — нижній регістр\nsay 'raku'.tc; # Raku  — заголовний регістр (перша літера велика)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>flip<\/code> записує символи рядка задом наперед:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">А оператор <code>x<\/code> повторює рядок кілька разів.<\/span> <span class=\"sg\" data-s=\"1\">Кількість разів задаєте ви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як шукати в р data-s=\"1\">Те показват и как да разделяте низове на части.<\/span> <span class=\"sg\" data-s=\"2\">И показват как да съединявате частите отново.<\/span><\/p>"]]},"eo":{"t":"Ĉenoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencoj, vi lernis, <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">kiel konstrui ĉenojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vi lernis kunigi ĉenojn kaj interpoli.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ lernis trovi la longecon de ĉeno.<\/span> <span class=\"sg\" data-s=\"3\">Ĉenoj ankaŭ havas multajn metodojn.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio montras la plej utilajn.<\/span> <span class=\"sg\" data-s=\"5\">Serĉado per <a href=\"https://course.raku.org/eo/regexes/\" target=\"_blank\" rel=\"noopener\">regulesprimoj<\/a> estas aparta, pli granda temo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi havas sian propran parton poste en la kurso.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tri metodoj ŝanĝas la literusklecon de ĉeno.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas grandajn aŭ malgrandajn literojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — majuskloj\nsay 'RAKU'.lc; # raku  — minuskloj\nsay 'raku'.tc; # Raku  — titolusklo (unua litero majuskligita)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>flip<\/code> skribas la signojn de ĉeno en inversa ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kaj la operatoro <code>x<\/code> ripetas ĉenon plurfoje.<\/span> <span class=\"sg\" data-s=\"1\">Vi donas la nombron de fojoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel serĉi en ĉenoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, kiel disigi ĉenojn en partojn.<\/span> <span class=\"sg\" data-s=\"2\">Kaj ili montras, kiel kunigi la partojn denove.<\/span><\/p>"]]},"la":{"t":"Catenae","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">chordas construere<\/a> didicisti.<\/span> <span class=\"sg\" data-s=\"1\">Chordas iungere et interpolare didicisti.<\/span> <span class=\"sg\" data-s=\"2\">Etiam longitudinem chordae invenire didicisti.<\/span> <span class=\"sg\" data-s=\"3\">Chordae etiam multas methodos habent.<\/span> <span class=\"sg\" data-s=\"4\">Haec sectio utilissimas ostendit.<\/span> <span class=\"sg\" data-s=\"5\">Quaerere cum <a href=\"https://course.raku.org/la/regexes/\" target=\"_blank\" rel=\"noopener\">expressionibus regularibus<\/a> est thema separatum et maius.<\/span> <span class=\"sg\" data-s=\"6\">Suam partem postea in cursu habet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres methodi casum litterarum chordae mutant.<\/span> <span class=\"sg\" data-s=\"1\">Casus significat litteras maiores vel minores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>flip<\/code> characteres chordae retrorsum scribit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Et operator <code>x<\/code> chordam aliquoties repetit.<\/span> <span class=\"sg\" data-s=\"1\">Tu numerum repetitionum das:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Proxima themata docent quaerere in chordis.<\/span> <span class=\"sg\" data-s=\"1\">Etiam docent chordas in partes dividere.<\/span> <span class=\"sg\" data-s=\"2\">Et docent partes iterum coniungere.<\/span><\/p>"]]}}}</script>
