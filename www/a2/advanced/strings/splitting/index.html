 gratia spatium simplex, verba separat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello big World'.words; # (Hello big World)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>split<\/code> chordam ad separatorem secat.<\/span> <span class=\"sg\" data-s=\"1\">Tu separatorem eligis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a,b,c'.split(','); # (a b c)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ecce casus specialis et gravis.<\/span> <span class=\"sg\" data-s=\"1\">Chordam per <strong>chordam vacuam<\/strong> <code>''<\/code> dividere potes.<\/span> <span class=\"sg\" data-s=\"2\">Tum singulos characteres chordae accipis.<\/span> <span class=\"sg\" data-s=\"3\">Sed etiam duas alias chordas vacuas accipis.<\/span> <span class=\"sg\" data-s=\"4\">In ipso initio et in ipso fine sunt.<\/span> <span class=\"sg\" data-s=\"5\">Itaque eventus duo elementa plus habet quam exspectas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Visne chordam in characteres dividere?<\/span> <span class=\"sg\" data-s=\"1\">Methodum <code>comb<\/code> sine argumentis voca.<\/span> <span class=\"sg\" data-s=\"2\">Hoc directe facit.<\/span> <span class=\"sg\" data-s=\"3\">Nullae aliae chordae vacuae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>join<\/code> contrarium facit.<\/span> <span class=\"sg\" data-s=\"1\">Indicem valorum in unam chordam coniungit.<\/span> <span class=\"sg\" data-s=\"2\">Separatorem inter valores ponit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Duae aliae methodi cum partibus chordae operantur.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>substr<\/code> tibi partem chordae dat.<\/span> <span class=\"sg\" data-s=\"2\">Ei positionem initialem das.<\/span> <span class=\"sg\" data-s=\"3\">Si vis, etiam longitudinem ei dare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et <code>trim<\/code> spatia alba in utroque fine chordae removet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '  hi  '.trim; # hi<\/code><\/pre>"]]}}}</script>
