efisso <code>do<\/code> fa di tutto l'<code>if<\/code>/<code>else<\/code> un'espressione.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> è vero. Così il valore dell'espressione è <code>'big'<\/code>. Il programma lo assegna a <code>$label<\/code>. Lo stesso trucco funziona con <code>do given<\/code> e <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dovete scrivere le parentesi graffe <code>{ }<\/code>. In Raku, <code>if<\/code> ha sempre bisogno di un blocco. Quindi non potete accorciare i rami, come in <code>if 7 &gt; 5 'big' else 'small'<\/code>. Questo codice non compila. L'errore è <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: do bloka vērtība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vienkāršs <code>if<\/code> ir teikums. Tam nav vērtības, ko jūs varat izmantot. Prefikss <code>do<\/code> padara visu <code>if<\/code>/<code>else<\/code> par izteiksmi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> ir patiess. Tāpēc izteiksmes vērtība ir <code>'big'<\/code>. Programma to piešķir mainīgajam <code>$label<\/code>. Tas pats paņēmiens darbojas ar <code>do given<\/code> un <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jums jāraksta figūriekavas <code>{ }<\/code>. Raku valodā <code>if<\/code> vienmēr vajag bloku. Tāpēc zarus nevar saīsināt, piemēram, līdz <code>if 7 &gt; 5 'big' else 'small'<\/code>. Šis kods nekompilējas. Kļūda ir <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Значение блока do","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обычный <code>if<\/code> — это оператор. У него нет значения, которое можно использовать. Префикс <code>do<\/code> делает всю конструкцию <code>if<\/code>/<code>else<\/code> выражением.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> — это истина. Поэтому значение выражения — <code>'big'<\/code>. Программа присваивает его переменной <code>$label<\/code>. Тот же приём работает с <code>do given<\/code> и <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фигурные скобки <code>{ }<\/code> нужно писать обязательно. В Raku <code>if<\/code> всегда требует блок. Поэтому ветки нельзя сократить, например так: <code>if 7 &gt; 5 'big' else 'small'<\/code>. Этот код не компилируется. Ошибка — <em>Missing block<\/em>.<\/span><\/li><\/ g\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simpla <code>if<\/code> estas deklaro. Ĝi ne havas valoron, kiun vi povas uzi. La prefikso <code>do<\/code> faras el la tuta <code>if<\/code>/<code>else<\/code> esprimon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> estas vera. Do la valoro de la esprimo estas <code>'big'<\/code>. La programo atribuas ĝin al <code>$label<\/code>. La sama truko funkcias kun <code>do given<\/code> kaj <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi devas skribi la krampojn <code>{ }<\/code>. En Raku, <code>if<\/code> ĉiam bezonas blokon. Do vi ne povas mallongigi la branĉojn, ekzemple al <code>if 7 &gt; 5 'big' else 'small'<\/code>. Ĉi tiu kodo ne kompiliĝas. La eraro estas <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Valor bloci do","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nudum <code>if<\/code> sententia est. Nullum valorem habet quo uti potes. Praefixum <code>do<\/code> totum <code>if<\/code>/<code>else<\/code> expressionem facit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> verum est. Itaque valor expressionis est <code>'big'<\/code>. Programma eum ad <code>$label<\/code> assignat. Idem artificium cum <code>do given<\/code> et <code>do for<\/code> operatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Uncos curvos <code>{ }<\/code> scribere debes. In Raku <code>if<\/code> semper copiam requirit. Itaque ramos breviores facere non potes, sicut <code>if 7 &gt; 5 'big' else 'small'<\/code>. Hic codex non compilatur. Error est <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]}}}</script>
