<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/exercises/force-eager/solution","n":626,"k":"solution","pv":"advanced/statement-prefixes/exercises/force-eager","nx":"advanced/statement-prefixes/exercises/silence-warning","tr":["advanced","advanced/statement-prefixes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Force eager evaluation‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku cannot compute a range up to <code>Inf<\/code> all at once. So the range is lazy, and <code>.is-lazy<\/code> gives <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>eager<\/code> prefix makes Raku produce a list at once. So the result is not lazy any more, and <code>.is-lazy<\/code> gives <code>False<\/code>. This is the exact opposite of marking a list <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Do not use <code>eager<\/code> with a range that has no end. <code>eager 1 .. Inf<\/code> tries to compute every element at once. So the program just hangs. It never finishes. It uses more and more memory. This goes on until the program is stopped. Use <code>eager<\/code> only with lists that you know have an end.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">It also works the other way. <code>lazy 1..3<\/code> marks a short range as lazy. This range has an end, but it is still lazy. So <code>.is-lazy<\/code> gives <code>True<\/code>. The prefix makes any list lazy, however small. A list does not have to be infinite to be lazy.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Sofortige Auswertung erzwingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku kann einen Bereich bis <code>Inf<\/code> nicht auf einmal berechnen. Also ist der Bereich lazy, und <code>.is-lazy<\/code> gibt <code>True<\/code> zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>eager<\/code>-Präfix lässt Raku eine Liste sofort erzeugen. Also ist das Ergebnis nicht mehr lazy, und <code>.is-lazy<\/code> gibt <code>False<\/code> zurück. Das ist genau das Gegenteil davon, eine Liste als <code>lazy<\/code> zu markieren.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nutze <code>eager<\/code> nicht mit einem Bereich ohne Ende. <code>eager 1 .. Inf<\/code> versucht, jedes Element sofort zu berechnen. Also hängt das Programm einfach. Es wird nie fertig. Es braucht immer mehr Speicher. Das geht so weiter, bis jemand das Programm stoppt. Nutze <code>eager<\/code> nur mit Listen, die sicher ein Ende haben.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Es geht auch andersherum. <code>lazy 1..3<\/code> markiert einen kurzen Bereich als lazy. Dieser Bereich hat ein Ende, aber er ist trotzdem lazy. Also gibt <code>.is-lazy<\/code> <code>True<\/code> zurück. Das Präfix macht jede Liste lazy, egal wie klein sie ist. Eine Liste muss nicht unendlich sein, um lazy zu sein.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Gretige evaluatie afdwingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku kan een range tot <code>Inf<\/code> niet in één keer berekenen. Daarom is de range lazy, en <code>.is-lazy<\/code> geeft <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het prefix <code>eager<\/code> laat Raku een lijst meteen maken. Het resultaat is dus niet meer lazy, en <code>.is-lazy<\/code> geeft <code>False<\/code>. Dit is precies het omgekeerde van een lijst <code>lazy<\/code> maken.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gebruik <code>eager<\/code> niet met een range zonder einde. <code>eager 1 .. Inf<\/code> probeert elk element in één keer te berekenen. Het programma blijft dus gewoon hangen. Het wordt nooit klaar. Het gebruikt steeds meer geheugen. Dat gaat door tot iemand het programma stopt. Gebruik <code>eager<\/code> alleen met lijsten waarvan je weet dat ze een einde hebben.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het werkt ook andersom. <code>lazy 1..3<\/code> maakt een korte range lazy. Deze range heeft een einde, maar is toch lazy. Daarom geeft <code>.is-lazy<\/code> de waarde <code>True<\/code>. Het prefix maakt elke lijst lazy, hoe klein ook. Een lijst hoeft niet oneindig te zijn om lazy te zijn.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Forzar evaluación ansiosa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku no puede calcular de una vez un rango hasta <code>Inf<\/code>. Así que el rango es perezoso, y <code>.is-lazy<\/code> da <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El prefijo <code>eager<\/code> hace que Raku produzca una lista enseguida. Así que el resultado ya no es perezoso, y <code>.is-lazy<\/code> da <code>False<\/code>. Esto es justo lo contrario de marcar una lista como <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">No uses <code>eager<\/code> con un rango sin final. <code>eager 1 .. Inf<\/code> intenta calcular todos los elementos de una vez. Así que el programa se queda colgado. Nunca termina. Usa cada vez más memoria. Esto sigue hasta que alguien detiene el programa. Usa <code>eager<\/code> solo con listas que sabes que tienen final.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">También funciona al revés. <code>lazy 1..3<\/code> marca un rango corto como perezoso. Este rango tiene final, pero aun así es perezoso. Así que <code>.is-lazy<\/code> da <code>True<\/code>. El prefijo hace perezosa cualquier lista, aunque sea pequeña. Una lista no tiene que ser infinita para ser perezosa.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Forzare la valutazione eager","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Il codice sorgente è disponibile nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku non può calcolare tutto insieme un intervallo fino a <code>Inf<\/code>. Quindi l'intervallo è lazy, e <code>.is-lazy<\/code> dà <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il prefisso <code>eager<\/code> fa produrre a Raku una lista subito. Quindi il risultato non è più lazy, e <code>.is-lazy<\/code> dà <code>False<\/code>. È proprio l'opposto di segnare una lista come <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Non usate <code>eager<\/code> con un intervallo senza fine. <code>eager 1 .. Inf<\/code> prova a calcolare ogni elemento tutto insieme. Così il programma si blocca e basta. Non finisce mai. Usa sempre più memoria. Questo va avanti finché qualcuno non ferma il programma. Usate <code>eager<\/code> solo con liste che di sicuro hanno una fine.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Funziona anche al contrario. <code>lazy 1..3<\/code> segna come lazy un intervallo corto. Questo intervallo ha una fine, ma è comunque lazy. Così <code>.is-lazy<\/code> dà <code>True<\/code>. Il prefisso rende lazy qualsiasi lista, anche piccola. Una lista non deve essere infinita per essere lazy.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Piespiest tūlītēju izvērtēšanu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku nevar aprēķināt diapazonu līdz <code>Inf<\/code> visu uzreiz. Tāpēc diapazons ir slinks, un <code>.is-lazy<\/code> dod <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Prefikss <code>eager<\/code> liek Raku izveidot sarakstu uzreiz. Tāpēc rezultāts vairs nav slinks, un <code>.is-lazy<\/code> dod <code>False<\/code>. Tas ir tieši pretējais saraksta atzīmēšanai ar <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Neizmantojiet <code>eager<\/code> ar diapazonu, kam nav beigu. <code>eager 1 .. Inf<\/code> mēģina aprēķināt katru elementu uzreiz. Tāpēc programma vienkārši iekaras. Tā nekad nebeidzas. Tā izmanto arvien vairāk atmiņas. Tas turpinās, līdz programmu aptur. Izmantojiet <code>eager<\/code> tikai tad, ja jūs zināt, ka sarakstam ir beigas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tas darbojas arī otrādi. <code>lazy 1..3<\/code> atzīmē īsu diapazonu kā slinku. Šim diapazonam ir beigas, bet tas tomēr ir slinks. Tāpēc <code>.is-lazy<\/code> dod <code>True<\/code>. Prefikss padara slinku jebkuru sarakstu, lai cik mazs tas būtu. Sarakstam nav jābūt bezgalīgam, lai tas būtu slinks.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Принудительное немедленное вычисление","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku не может вычислить диапазон до <code>Inf<\/code> весь сразу. Поэтому диапазон ленивый, и <code>.is-lazy<\/code> даёт <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префикс <code>eager<\/code> заставляет Raku создать список сразу. Поэтому результат больше не ленивый, и <code>.is-lazy<\/code> даёт <code>False<\/code>. Это точная противоположность пометке списка как <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не используйте <code>eager<\/code> с диапазоном без конца. <code>eager 1 .. Inf<\/code> пытается вычислить каждый элемент сразу. Поэтому программа просто зависает. Она никогда не заканчивается. Она берёт всё больше и больше памяти. Так продолжается, пока программу не остановят. Используйте <code>eager<\/code> только со списками, у которых точно есть конец.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Это работает и в обратную сторону. <code>lazy 1..3<\/code> помечает короткий диапазон как ленивый. У этого диапазона есть конец, но он всё равно ленивый. Поэтому <code>.is-lazy<\/code> даёт <code>True<\/code>. Префикс делает ленивым любой список, даже самый маленький. Списку не нужно быть бесконечным, чтобы быть ленивым.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Змусьте до жадібного обчислення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku не може обчислити діапазон до <code>Inf<\/code> увесь одразу. Тож діапазон лінивий, і <code>.is-lazy<\/code> дає <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префікс <code>eager<\/code> змушує Raku створити список одразу. Тож результат уже не лінивий, і <code>.is-lazy<\/code> дає <code>False<\/code>. Це точна протилежність до позначки <code>lazy<\/code> на списку.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не використовуйте <code>eager<\/code> з діапазоном без кінця. <code>eager 1 .. Inf<\/code> пробує обчислити кожен елемент одразу. Тож програма просто зависає. Вона ніколи не закінчується. Вона бере все більше й більше пам'яті. Так триває, доки хтось не зупинить програму. Використовуйте <code>eager<\/code> лише зі списками, які точно мають кінець.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це працює і навпаки. <code>lazy 1..3<\/code> позначає короткий діапазон як лінивий. Цей діапазон має кінець, але він усе одно лінивий. Тож <code>.is-lazy<\/code> дає <code>True<\/code>. Префікс робить лінивим будь-який список, навіть дуже малий. Список не мусить бути нескінченним, щоб бути лінивим.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Принудете нетърпеливо изчисление","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku не може да изчисли диапазон до <code>Inf<\/code> наведнъж. Затова диапазонът е мързелив и <code>.is-lazy<\/code> дава <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префиксът <code>eager<\/code> кара Raku да създаде списъка веднага. Затова резултатът вече не е мързелив и <code>.is-lazy<\/code> дава <code>False<\/code>. Това е точно обратното на отбелязване с <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не използвайте <code>eager<\/code> с диапазон, който няма край. <code>eager 1 .. Inf<\/code> се опитва да изчисли всеки елемент наведнъж. Затова програмата просто увисва. Тя никога не свършва. Тя използва все повече и повече памет. Това продължава, докато някой не спре програмата. Използвайте <code>eager<\/code> само със списъци, за които знаете, че имат край.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Работи и по обратния начин. <code>lazy 1..3<\/code> отбелязва къс диапазон като мързелив. Този диапазон има край, но пак е мързелив. Затова <code>.is-lazy<\/code> дава <code>True<\/code>. Префиксът прави всеки списък мързелив, колкото и малък да бъде. Не е нужно списъкът да е безкраен, за да е мързелив.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Devigi fervoron","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku ne povas komputi la tutan intervalon ĝis <code>Inf<\/code> samtempe. Do la intervalo estas maldiligenta, kaj <code>.is-lazy<\/code> donas <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La prefikso <code>eager<\/code> igas Raku produkti liston tuj. Do la rezulto ne plu estas maldiligenta, kaj <code>.is-lazy<\/code> donas <code>False<\/code>. Tio estas precize la malo de markado de listo kiel <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ne uzu <code>eager<\/code> kun intervalo, kiu ne havas finon. <code>eager 1 .. Inf<\/code> provas komputi ĉiun elementon samtempe. Do la programo simple blokiĝas. Ĝi neniam finiĝas. Ĝi uzas pli kaj pli da memoro. Tio daŭras, ĝis iu haltigas la programon. Uzu <code>eager<\/code> nur kun listoj, pri kiuj vi scias, ke ili havas finon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tio funkcias ankaŭ inverse. <code>lazy 1..3<\/code> markas mallongan intervalon kiel maldiligenta. Ĉi tiu intervalo havas finon, sed ĝi tamen estas maldiligenta. Do <code>.is-lazy<\/code> donas <code>True<\/code>. La prefikso faras ajnan liston maldiligenta, kiom ajn malgranda ĝi estas. Listo ne devas esti senfina por esti maldiligenta.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Alacrem aestimationem cogere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku intervallum usque ad <code>Inf<\/code> totum simul computare non potest. Itaque intervallum pigrum est, et <code>.is-lazy<\/code> dat <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Praefixum <code>eager<\/code> Raku cogit indicem statim producere. Itaque resultatum non iam pigrum est, et <code>.is-lazy<\/code> dat <code>False<\/code>. Hoc est exacte contrarium signi <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Noli <code>eager<\/code> cum intervallo sine fine adhibere. <code>eager 1 .. Inf<\/code> conatur omne elementum statim computare. Itaque programma solum pendet. Numquam finitur. Semper plus memoriae adhibet. Hoc pergit donec aliquis programma sistit. Adhibe <code>eager<\/code> solum cum indicibus qui certe finem habent.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Etiam contrario modo operatur. <code>lazy 1..3<\/code> breve intervallum ut pigrum signat. Hoc intervallum finem habet, sed tamen pigrum est. Itaque <code>.is-lazy<\/code> dat <code>True<\/code>. Praefixum quemvis indicem pigrum facit, quamvis parvum. Index piger esse potest, etiam si infinitus non est.<\/span><\/li><\/ol>"]]}}}</script>
