<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/exercises/silence-warning/solution","n":628,"k":"solution","pv":"advanced/statement-prefixes/exercises/silence-warning","nx":"advanced/signatures","tr":["advanced","advanced/statement-prefixes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Silence a warning‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Here, the undefined <code>$name<\/code> goes into the string. Usually, this gives a warning: “use of uninitialized value”. But the expression is inside <code>quietly<\/code>. So the warning is hidden. The program prints only the greeting.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Like <code>do<\/code>, <code>quietly<\/code> returns the value of its block. So the program stores the new string in <code>$greeting<\/code>. The name is missing, so there is an empty gap in the string.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> only hides the warning. The value is still undefined. Maybe you want to <em>handle<\/em> the missing value. Then give a default value with the defined-or operator <code>//<\/code>. <code>$name // 'friend'<\/code> gives <code>'friend'<\/code> when <code>$name<\/code> is undefined. So <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> prints <code>Hello, friend!<\/code>. There is no warning at all.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Eine Warnung unterdrücken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hier kommt das undefinierte <code>$name<\/code> in den String. Normalerweise gibt das eine Warnung: „use of uninitialized value“. Aber der Ausdruck steht in <code>quietly<\/code>. Also bleibt die Warnung versteckt. Das Programm gibt nur den Gruß aus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wie <code>do<\/code> gibt <code>quietly<\/code> den Wert seines Blocks zurück. Also speichert das Programm den neuen String in <code>$greeting<\/code>. Der Name fehlt, also gibt es eine leere Lücke im String.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> versteckt nur die Warnung. Der Wert ist immer noch undefiniert. Vielleicht willst du mit dem fehlenden Wert <em>umgehen<\/em>. Dann gib einen Standardwert mit dem Defined-or-Operator <code>//<\/code> an. <code>$name // 'friend'<\/code> ergibt <code>'friend'<\/code>, wenn <code>$name<\/code> undefiniert ist. Also gibt <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> den Text <code>Hello, friend!<\/code> aus. Es gibt überhaupt keine Warnung.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een waarschuwing onderdrukken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hier gaat de ongedefinieerde <code>$name<\/code> in de string. Meestal geeft dat een waarschuwing: \"use of uninitialized value\". Maar de expressie staat in <code>quietly<\/code>. Daarom blijft de waarschuwing verborgen. Het programma drukt alleen de begroeting af.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Net als <code>do<\/code> geeft <code>quietly<\/code> de waarde van zijn blok terug. Het programma bewaart de nieuwe string dus in <code>$greeting<\/code>. De naam ontbreekt, dus er zit een leeg gat in de string.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> verbergt alleen de waarschuwing. De waarde is nog steeds ongedefinieerd. Misschien wil je iets <em>doen<\/em> met de ontbrekende waarde. Geef dan een standaardwaarde met de defined-or-operator <code>//<\/code>. <code>$name // 'friend'<\/code> geeft <code>'friend'<\/code> als <code>$name<\/code> ongedefinieerd is. Zo print <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> de tekst <code>Hello, friend!<\/code>. Er is helemaal geen waarschuwing.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Silenciar una advertencia","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aquí, el <code>$name<\/code> indefinido entra en la cadena. Normalmente, esto da una advertencia: «uso de valor no inicializado». Pero la expresión está dentro de <code>quietly<\/code>. Así que la advertencia queda oculta. El programa imprime solo el saludo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Como <code>do<\/code>, <code>quietly<\/code> devuelve el valor de su bloque. Así que el programa guarda la nueva cadena en <code>$greeting<\/code>. Falta el nombre, así que hay un hueco vacío en la cadena.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> solo oculta la advertencia. El valor sigue indefinido. A lo mejor quieres <em>ocuparte<\/em> del valor que falta. Entonces da un valor predeterminado con el operador definido-o <code>//<\/code>. <code>$name // 'friend'<\/code> da <code>'friend'<\/code> cuando <code>$name<\/code> está indefinido. Así que <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> imprime <code>Hello, friend!<\/code>. No hay ninguna advertencia.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Silenziare un avviso","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Il codice sorgente è disponibile nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui il <code>$name<\/code> non definito entra nella stringa. Di solito questo dà un avviso: “use of uninitialized value”. Ma l'espressione è dentro <code>quietly<\/code>. Così l'avviso resta nascosto. Il programma stampa solo il saluto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Come <code>do<\/code>, <code>quietly<\/code> restituisce il valore del suo blocco. Così il programma salva la nuova stringa in <code>$greeting<\/code>. Il nome manca, quindi nella stringa c'è uno spazio vuoto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> nasconde solo l'avviso. Il valore resta non definito. Forse volete <em>gestire<\/em> il valore mancante. Allora date un valore predefinito con l'operatore defined-or <code>//<\/code>. <code>$name // 'friend'<\/code> dà <code>'friend'<\/code> quando <code>$name<\/code> non è definito. Così <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> stampa <code>Hello, friend!<\/code>. Non c'è nessun avviso.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Apklusināt brīdinājumu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šeit nedefinētais <code>$name<\/code> nonāk virknē. Parasti tas dod brīdinājumu: “neinicializētas vērtības lietošana”. Bet izteiksme ir <code>quietly<\/code> iekšā. Tāpēc brīdinājums ir paslēpts. Programma izdrukā tikai sveicienu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tāpat kā <code>do<\/code>, <code>quietly<\/code> atgriež sava bloka vērtību. Tāpēc programma saglabā jauno virkni mainīgajā <code>$greeting<\/code>. Vārda nav, tāpēc virknē ir tukša sprauga.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> tikai paslēpj brīdinājumu. Vērtība joprojām ir nedefinēta. Varbūt jūs gribat trūkstošo vērtību <em>apstrādāt<\/em>. Tad dodiet noklusējuma vērtību ar defined-or operatoru <code>//<\/code>. <code>$name // 'friend'<\/code> dod <code>'friend'<\/code>, kad <code>$name<\/code> ir nedefinēts. Tāpēc <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> izdrukā <code>Hello, friend!<\/code>. Brīdinājuma nemaz nav.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Подавление предупреждения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Здесь неопределённая переменная <code>$name<\/code> попадает в строку. Обычно это даёт предупреждение: «use of uninitialized value». Но выражение стоит внутри <code>quietly<\/code>. Поэтому предупреждение скрыто. Программа печатает только приветствие.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Как и <code>do<\/code>, <code>quietly<\/code> возвращает значение своего блока. Поэтому программа сохраняет новую строку в <code>$greeting<\/code>. Имени нет, поэтому в строке пустое место.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> только скрывает предупреждение. Значение всё ещё не определено. Может быть, вы хотите <em>обработать<\/em> отсутствующее значение. Тогда задайте значение по умолчанию с помощью оператора defined-or <code>//<\/code>. <code>$name // 'friend'<\/code> даёт <code>'friend'<\/code>, когда <code>$name<\/code> не определено. Поэтому <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> печатает <code>Hello, friend!<\/code>. Никакого предупреждения нет.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Приглушіть попередження","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тут невизначений <code>$name<\/code> іде в рядок. Зазвичай це дає попередження: «use of uninitialized value». Але вираз стоїть усередині <code>quietly<\/code>. Тож попередження приховане. Програма виводить лише привітання.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Як і <code>do<\/code>, <code>quietly<\/code> повертає значення свого блоку. Тож програма зберігає новий рядок у <code>$greeting<\/code>. Імені немає, тому в рядку є порожній проміжок.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> лише ховає попередження. Значення все одно невизначене. Можливо, ви хочете <em>обробити<\/em> відсутнє значення. Тоді дайте типове значення за допомогою оператора «визначене або» <code>//<\/code>. <code>$name // 'friend'<\/code> дає <code>'friend'<\/code>, коли <code>$name<\/code> не визначено. Тож <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> виводить <code>Hello, friend!<\/code>. Попередження немає зовсім.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Заглушете предупреждение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тук неопределената <code>$name<\/code> влиза в низа. Обикновено това дава предупреждение: „use of uninitialized value“. Но изразът е вътре в <code>quietly<\/code>. Затова предупреждението е скрито. Програмата отпечатва само поздрава.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Както <code>do<\/code>, <code>quietly<\/code> връща стойността на своя блок. Затова програмата записва новия низ в <code>$greeting<\/code>. Името липсва, затова в низа има празно място.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> само скрива предупреждението. Стойността все още е неопределена. Може би искате да се <em>справите<\/em> с липсващата стойност. Тогава дайте стойност по подразбиране с оператора за определеност <code>//<\/code>. <code>$name // 'friend'<\/code> дава <code>'friend'<\/code>, когато <code>$name<\/code> е неопределена. Затова <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> отпечатва <code>Hello, friend!<\/code>. Няма никакво предупреждение.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Silentigi averton","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tie la nedefinita <code>$name<\/code> iras en la ĉenon. Kutime tio donas averton: \"uzo de neinicialigita valoro\". Sed la esprimo estas ene de <code>quietly<\/code>. Do la averto estas kaŝita. La programo presas nur la salutfrazon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kiel <code>do<\/code>, <code>quietly<\/code> redonas la valoron de sia bloko. Do la programo konservas la novan ĉenon en <code>$greeting<\/code>. La nomo mankas, do estas malplena spaco en la ĉeno.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> nur kaŝas la averton. La valoro ankoraŭ estas nedefinita. Eble vi volas <em>trakti<\/em> la mankantan valoron. Tiam donu defaŭltan valoron per la difinita-aŭ operatoro <code>//<\/code>. <code>$name // 'friend'<\/code> donas <code>'friend'<\/code>, kiam <code>$name<\/code> estas nedefinita. Do <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> presas <code>Hello, friend!<\/code>. Tute ne estas averto.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Admonitionem silere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic <code>$name<\/code> indefinitus in chordam it. Plerumque hoc admonitionem dat: “use of uninitialized value”. Sed expressio intra <code>quietly<\/code> est. Itaque admonitio latet. Programma solum salutationem imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sicut <code>do<\/code>, <code>quietly<\/code> valorem copiae suae reddit. Itaque programma novam chordam in <code>$greeting<\/code> servat. Nomen abest, itaque in chorda est lacuna vacua.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> solum admonitionem celat. Valor adhuc indefinitus est. Fortasse valorem absentem <em>tractare<\/em> vis. Tum valorem praedefinitum cum operatore definito-vel <code>//<\/code> da. <code>$name // 'friend'<\/code> dat <code>'friend'<\/code> cum <code>$name<\/code> indefinitus est. Itaque <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> imprimit <code>Hello, friend!<\/code>. Nulla omnino admonitio est.<\/span><\/li><\/ol>"]]}}}</script>
