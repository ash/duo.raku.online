<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/lazy-eager","n":619,"k":"topic","pv":"advanced/statement-prefixes/do-prefix/quiz","nx":"advanced/statement-prefixes/sink-quietly","tr":["advanced","advanced/statement-prefixes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Laziness and eagerness","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku computes some lists only when it needs their elements.<\/span> <span class=\"sg\" data-s=\"1\">Such lists are <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">With the <code>lazy<\/code> and <code>eager<\/code> prefixes, you can control this yourself.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>eager<\/code> prefix makes Raku produce a list <strong>all at once<\/strong>, right now:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>map<\/code> also produces the values without <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But <code>eager<\/code> makes sure that Raku computes all of them at once.<\/span> <span class=\"sg\" data-s=\"2\">It does not wait until you need them.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>lazy<\/code> prefix does the opposite.<\/span> <span class=\"sg\" data-s=\"1\">It marks a list as lazy.<\/span> <span class=\"sg\" data-s=\"2\">Then Raku produces each element only when the code asks for it.<\/span> <span class=\"sg\" data-s=\"3\">So a list can, in theory, have no end:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>.is-lazy<\/code> method shows that the list is lazy.<\/span> <span class=\"sg\" data-s=\"1\">So it does not try to compute all its elements first.<\/span> <span class=\"sg\" data-s=\"2\">And there is no end to these elements.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">But in this example, Raku makes the list lazy anyway.<\/span> <span class=\"sg\" data-s=\"1\">A range with no end, like <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, is already lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">So <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> prints <\/code>True<code> without the prefix.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Here, <code>lazy<\/code> changes nothing.<\/span> <span class=\"sg\" data-s=\"6\">It only shows clearly what you want.<\/span> <span class=\"sg\" data-s=\"7\">The prefix is really useful in another case.<\/span> <span class=\"sg\" data-s=\"8\">Sometimes Raku computes a list eagerly, all at once.<\/span> <span class=\"sg\" data-s=\"9\">With the prefix, you can make such a list lazy.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Most of the time, Raku makes a good choice by itself.<\/span> <span class=\"sg\" data-s=\"1\">Ranges and sequences are lazy.<\/span> <span class=\"sg\" data-s=\"2\">A normal assignment to an array is eager.<\/span> <span class=\"sg\" data-s=\"3\">Use these prefixes when you want a different choice.<\/span> <span class=\"sg\" data-s=\"4\">Use <code>eager<\/code> to make a slow computation happen now.<\/span> <span class=\"sg\" data-s=\"5\">Use <code>lazy<\/code> to put off a very large or endless computation.<\/span><\/p>"]]},"de":{"t":"Laziness und Eagerness","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku berechnet manche Listen erst, wenn es ihre Elemente braucht.<\/span> <span class=\"sg\" data-s=\"1\">Solche Listen sind <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Mit den Präfixen <code>lazy<\/code> und <code>eager<\/code> kannst du das selbst steuern.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>eager<\/code>-Präfix lässt Raku eine Liste <strong>auf einmal<\/strong> erzeugen, und zwar sofort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <code>map<\/code> erzeugt die Werte auch ohne <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>eager<\/code> sorgt dafür, dass Raku sie alle sofort berechnet.<\/span> <span class=\"sg\" data-s=\"2\">Raku wartet nicht, bis du sie brauchst.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das <code>lazy<\/code>-Präfix macht das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Es markiert eine Liste als lazy.<\/span> <span class=\"sg\" data-s=\"2\">Dann erzeugt Raku jedes Element erst, wenn der Code danach fragt.<\/span> <span class=\"sg\" data-s=\"3\">So kann eine Liste theoretisch kein Ende haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.is-lazy<\/code> zeigt, dass die Liste lazy ist.<\/span> <span class=\"sg\" data-s=\"1\">Also versucht sie nicht, zuerst alle ihre Elemente zu berechnen.<\/span> <span class=\"sg\" data-s=\"2\">Und diese Elemente haben kein Ende.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Aber in diesem Beispiel macht Raku die Liste sowieso lazy.<\/span> <span class=\"sg\" data-s=\"1\">Ein Bereich ohne Ende, wie <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, ist schon lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Also gibt <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> auch ohne das Präfix <\/code>True<code> aus.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Hier ändert <code>lazy<\/code> nichts.<\/span> <span class=\"sg\" data-s=\"6\">Es zeigt nur klar, was du willst.<\/span> <span class=\"sg\" data-s=\"7\">Das Präfix ist in einem anderen Fall wirklich nützlich.<\/span> <span class=\"sg\" data-s=\"8\">Manchmal berechnet Raku eine Liste eager, also auf einmal.<\/span> <span class=\"sg\" data-s=\"9\">Mit dem Präfix kannst du so eine Liste lazy machen.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Meistens wählt Raku von selbst gut.<\/span> <span class=\"sg\" data-s=\"1\">Bereiche und Sequenzen sind lazy.<\/span> <span class=\"sg\" data-s=\"2\">Eine normale Zuweisung an ein Array ist eager.<\/span> <span class=\"sg\" data-s=\"3\">Nutze diese Präfixe, wenn du eine andere Wahl willst.<\/span> <span class=\"sg\" data-s=\"4\">Nutze <code>eager<\/code>, damit eine langsame Berechnung jetzt passiert.<\/span> <span class=\"sg\" data-s=\"5\">Nutze <code>lazy<\/code>, um eine sehr große oder endlose Berechnung aufzuschieben.<\/span><\/p>"]]},"nl":{"t":"Luiheid en gretigheid","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku berekent sommige lijsten pas als het hun elementen nodig heeft.<\/span> <span class=\"sg\" data-s=\"1\">Zulke lijsten zijn <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Met de prefixen <code>lazy<\/code> en <code>eager<\/code> kun je dit zelf sturen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>eager<\/code> laat Raku een lijst <strong>in één keer<\/strong> maken, nu meteen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>map<\/code> maakt de waarden ook zonder <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar <code>eager<\/code> zorgt ervoor dat Raku ze allemaal meteen berekent.<\/span> <span class=\"sg\" data-s=\"2\">Raku wacht niet tot je ze nodig hebt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>lazy<\/code> doet het omgekeerde.<\/span> <span class=\"sg\" data-s=\"1\">Het markeert een lijst als lazy.<\/span> <span class=\"sg\" data-s=\"2\">Dan maakt Raku elk element pas als de code erom vraagt.<\/span> <span class=\"sg\" data-s=\"3\">Zo kan een lijst in theorie geen einde hebben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De methode <code>.is-lazy<\/code> laat zien dat de lijst lazy is.<\/span> <span class=\"sg\" data-s=\"1\">De lijst probeert dus niet eerst al zijn elementen te berekenen.<\/span> <span class=\"sg\" data-s=\"2\">En aan die elementen komt geen einde.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Maar in dit voorbeeld maakt Raku de lijst toch al lazy.<\/span> <span class=\"sg\" data-s=\"1\">Een range zonder einde, zoals <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, is al lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Daarom print <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> ook zonder het prefix <\/code>True<code>.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Hier verandert <code>lazy<\/code> niets.<\/span> <span class=\"sg\" data-s=\"6\">Het laat alleen duidelijk zien wat je wilt.<\/span> <span class=\"sg\" data-s=\"7\">Het prefix is echt nuttig in een ander geval.<\/span> <span class=\"sg\" data-s=\"8\">Soms berekent Raku een lijst eager, helemaal in één keer.<\/span> <span class=\"sg\" data-s=\"9\">Met het prefix kun je zo'n lijst lazy maken.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Meestal maakt Raku zelf een goede keuze.<\/span> <span class=\"sg\" data-s=\"1\">Ranges en reeksen zijn lazy.<\/span> <span class=\"sg\" data-s=\"2\">Een gewone toewijzing aan een array is eager.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik deze prefixen als je een andere keuze wilt.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik <code>eager<\/code> om een trage berekening nu te laten gebeuren.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik <code>lazy<\/code> om een heel grote of eindeloze berekening uit te stellen.<\/span><\/p>"]]},"es":{"t":"Pereza y ansiedad","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku calcula algunas listas solo cuando necesita sus elementos.<\/span> <span class=\"sg\" data-s=\"1\">Estas listas son <em>perezosas<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"2\">Con los prefijos <code>lazy<\/code> y <code>eager<\/code>, puedes controlar esto tú mismo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>eager<\/code> hace que Raku produzca una lista <strong>toda de una vez<\/strong>, ahora mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El <code>map<\/code> también produce los valores sin <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>eager<\/code> se asegura de que Raku los calcule todos de una vez.<\/span> <span class=\"sg\" data-s=\"2\">No espera al momento en que los necesitas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>lazy<\/code> hace lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Marca una lista como perezosa.<\/span> <span class=\"sg\" data-s=\"2\">Entonces Raku produce cada elemento solo cuando el código lo pide.<\/span> <span class=\"sg\" data-s=\"3\">Así que una lista puede, en teoría, no tener final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El método <code>.is-lazy<\/code> muestra que la lista es perezosa.<\/span> <span class=\"sg\" data-s=\"1\">Así que no intenta calcular primero todos sus elementos.<\/span> <span class=\"sg\" data-s=\"2\">Y estos elementos no tienen final.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Pero en este ejemplo, Raku hace la lista perezosa de todos modos.<\/span> <span class=\"sg\" data-s=\"1\">Un rango sin final, como <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, ya es perezoso.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Así que <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> imprime <\/code>True<code> sin el prefijo.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Aquí, <code>lazy<\/code> no cambia nada.<\/span> <span class=\"sg\" data-s=\"6\">Solo muestra claramente lo que quieres.<\/span> <span class=\"sg\" data-s=\"7\">El prefijo es útil de verdad en otro caso.<\/span> <span class=\"sg\" data-s=\"8\">A veces Raku calcula una lista de forma ansiosa, toda de una vez.<\/span> <span class=\"sg\" data-s=\"9\">Con el prefijo, puedes hacer perezosa esa lista.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Casi siempre, Raku elige bien por sí solo.<\/span> <span class=\"sg\" data-s=\"1\">Los rangos y las secuencias son perezosos.<\/span> <span class=\"sg\" data-s=\"2\">Una asignación normal a un array es ansiosa.<\/span> <span class=\"sg\" data-s=\"3\">Usa estos prefijos si quieres otra elección.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>eager<\/code> para hacer ahora un cálculo lento.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>lazy<\/code> para dejar para después un cálculo muy grande o sin final.<\/span><\/p>"]]},"it":{"t":"Laziness e eagerness","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku calcola alcune liste solo quando gli servono i loro elementi.<\/span> <span class=\"sg\" data-s=\"1\">Queste liste sono <em>lazy<\/em> (pigre).<\/span> <span class=\"sg\" data-s=\"2\">Con i prefissi <code>lazy<\/code> e <code>eager<\/code> potete controllarlo voi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>eager<\/code> fa produrre a Raku una lista <strong>tutta insieme<\/strong>, subito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anche senza <code>eager<\/code> il <code>map<\/code> produce i valori.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>eager<\/code> fa in modo che Raku li calcoli tutti subito.<\/span> <span class=\"sg\" data-s=\"2\">Non aspetta che vi servano.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>lazy<\/code> fa l'opposto.<\/span> <span class=\"sg\" data-s=\"1\">Segna una lista come lazy.<\/span> <span class=\"sg\" data-s=\"2\">Allora Raku produce ogni elemento solo quando il codice lo chiede.<\/span> <span class=\"sg\" data-s=\"3\">Così una lista può, in teoria, non avere fine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.is-lazy<\/code> mostra che la lista è lazy.<\/span> <span class=\"sg\" data-s=\"1\">Così non prova a calcolare prima tutti i suoi elementi.<\/span> <span class=\"sg\" data-s=\"2\">E questi elementi non hanno fine.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Ma in questo esempio Raku rende comunque la lista lazy.<\/span> <span class=\"sg\" data-s=\"1\">Un intervallo senza fine, come <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, è già lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Così <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> stampa <\/code>True<code> senza il prefisso.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Qui <code>lazy<\/code> non cambia niente.<\/span> <span class=\"sg\" data-s=\"6\">Mostra solo in modo chiaro quello che volete.<\/span> <span class=\"sg\" data-s=\"7\">Il prefisso è davvero utile in un altro caso.<\/span> <span class=\"sg\" data-s=\"8\">A volte Raku calcola una lista in modo eager, tutta insieme.<\/span> <span class=\"sg\" data-s=\"9\">Con il prefisso, potete rendere lazy una lista così.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Quasi sempre Raku fa da solo una buona scelta.<\/span> <span class=\"sg\" data-s=\"1\">Gli intervalli e le sequenze sono lazy.<\/span> <span class=\"sg\" data-s=\"2\">Una normale assegnazione a un array è eager.<\/span> <span class=\"sg\" data-s=\"3\">Usate questi prefissi quando volete una scelta diversa.<\/span> <span class=\"sg\" data-s=\"4\">Usate <code>eager<\/code> per fare subito un calcolo lento.<\/span> <span class=\"sg\" data-s=\"5\">Usate <code>lazy<\/code> per rimandare un calcolo molto grande o senza fine.<\/span><\/p>"]]},"lv":{"t":"Slinkums un dedzīgums","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku aprēķina dažus sarakstus tikai tad, kad tam vajag to elementus.<\/span> <span class=\"sg\" data-s=\"1\">Tādi saraksti ir <em>slinki<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ar prefiksiem <code>lazy<\/code> un <code>eager<\/code> jūs to varat vadīt paši.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>eager<\/code> liek Raku izveidot sarakstu <strong>visu uzreiz<\/strong>, tieši tagad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> dod vērtības arī bez <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>eager<\/code> gādā, ka Raku tās visas aprēķina uzreiz.<\/span> <span class=\"sg\" data-s=\"2\">Tas negaida, līdz tās jums vajag.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>lazy<\/code> dara pretējo.<\/span> <span class=\"sg\" data-s=\"1\">Tas atzīmē sarakstu kā slinku.<\/span> <span class=\"sg\" data-s=\"2\">Tad Raku izveido katru elementu tikai tad, kad kods to prasa.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc sarakstam teorētiski var nebūt beigu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.is-lazy<\/code> parāda, ka saraksts ir slinks.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tas nemēģina vispirms aprēķināt visus savus elementus.<\/span> <span class=\"sg\" data-s=\"2\">Un šiem elementiem nav beigu.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Bet šajā piemērā Raku tik un tā padara sarakstu slinku.<\/span> <span class=\"sg\" data-s=\"1\">Diapazons bez beigām, piemēram, <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, jau ir slinks.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Tāpēc <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> izdrukā <\/code>True<code> arī bez prefiksa.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Šeit <code>lazy<\/code> neko nemaina.<\/span> <span class=\"sg\" data-s=\"6\">Tas tikai skaidri parāda, ko jūs gribat.<\/span> <span class=\"sg\" data-s=\"7\">Prefikss ir patiešām noderīgs citā gadījumā.<\/span> <span class=\"sg\" data-s=\"8\">Dažreiz Raku aprēķina sarakstu dedzīgi, visu uzreiz.<\/span> <span class=\"sg\" data-s=\"9\">Ar prefiksu jūs varat padarīt tādu sarakstu slinku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Lielākoties Raku pats izdara labu izvēli.<\/span> <span class=\"sg\" data-s=\"1\">Diapazoni un virknes ir slinkas.<\/span> <span class=\"sg\" data-s=\"2\">Parasta piešķiršana masīvam ir dedzīga.<\/span> <span class=\"sg\" data-s=\"3\">Izmantojiet šos prefiksus, kad gribat citu izvēli.<\/span> <span class=\"sg\" data-s=\"4\">Izmantojiet <code>eager<\/code>, lai lēns aprēķins notiktu tagad.<\/span> <span class=\"sg\" data-s=\"5\">Izmantojiet <code>lazy<\/code>, lai atliktu ļoti lielu vai bezgalīgu aprēķinu.<\/span><\/p>"]]},"ru":{"t":"Ленивость и немедленность","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Некоторые списки Raku вычисляет, только когда ему нужны их элементы.<\/span> <span class=\"sg\" data-s=\"1\">Такие списки — <em>ленивые<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">С префиксами <code>lazy<\/code> и <code>eager<\/code> вы можете управлять этим сами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>eager<\/code> заставляет Raku создать список <strong>весь сразу<\/strong>, прямо сейчас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> создаёт значения и без <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>eager<\/code> следит, чтобы Raku вычислил их все сразу.<\/span> <span class=\"sg\" data-s=\"2\">Он не ждёт, пока они вам понадобятся.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>lazy<\/code> делает обратное.<\/span> <span class=\"sg\" data-s=\"1\">Он помечает список как ленивый.<\/span> <span class=\"sg\" data-s=\"2\">Тогда Raku создаёт каждый элемент, только когда код его просит.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому список может, в теории, не иметь конца:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.is-lazy<\/code> показывает, что список ленивый.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому он не пытается сначала вычислить все свои элементы.<\/span> <span class=\"sg\" data-s=\"2\">А у этих элементов нет конца.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Но в этом примере Raku и так делает список ленивым.<\/span> <span class=\"sg\" data-s=\"1\">Диапазон без конца, например <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, уже ленивый.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Поэтому <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> печатает <\/code>True<code> и без префикса.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Здесь <code>lazy<\/code> ничего не меняет.<\/span> <span class=\"sg\" data-s=\"6\">Он только ясно показывает, чего вы хотите.<\/span> <span class=\"sg\" data-s=\"7\">Префикс по-настоящему полезен в другом случае.<\/span> <span class=\"sg\" data-s=\"8\">Иногда Raku вычисляет список нетерпеливо, весь сразу.<\/span> <span class=\"sg\" data-s=\"9\">С префиксом такой список можно сделать ленивым.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Чаще всего Raku сам делает хороший выбор.<\/span> <span class=\"sg\" data-s=\"1\">Диапазоны и последовательности ленивые.<\/span> <span class=\"sg\" data-s=\"2\">Обычное присваивание массиву — нетерпеливое.<\/span> <span class=\"sg\" data-s=\"3\">Используйте эти префиксы, когда хотите другой выбор.<\/span> <span class=\"sg\" data-s=\"4\">Используйте <code>eager<\/code>, чтобы медленное вычисление произошло сейчас.<\/span> <span class=\"sg\" data-s=\"5\">Используйте <code>lazy<\/code>, чтобы отложить очень большое или бесконечное вычисление.<\/span><\/p>"]]},"uk":{"t":"Лінивість та жадібність","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku обчислює деякі списки лише тоді, коли йому потрібні їхні елементи.<\/span> <span class=\"sg\" data-s=\"1\">Такі списки — <em>ліниві<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">З префіксами <code>lazy<\/code> і <code>eager<\/code> ви можете керувати цим самі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>eager<\/code> змушує Raku створити список <strong>весь одразу<\/strong>, просто зараз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> створює значення і без <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>eager<\/code> дбає, щоб Raku обчислив їх усі одразу.<\/span> <span class=\"sg\" data-s=\"2\">Raku не чекає, поки вони вам знадобляться.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>lazy<\/code> робить протилежне.<\/span> <span class=\"sg\" data-s=\"1\">Він позначає список як лінивий.<\/span> <span class=\"sg\" data-s=\"2\">Тоді Raku створює кожен елемент лише тоді, коли код його просить.<\/span> <span class=\"sg\" data-s=\"3\">Тож список може, в теорії, не мати кінця:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.is-lazy<\/code> показує, що список лінивий.<\/span> <span class=\"sg\" data-s=\"1\">Тож він не пробує спочатку обчислити всі свої елементи.<\/span> <span class=\"sg\" data-s=\"2\">А цим елементам немає кінця.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Але в цьому прикладі Raku і так робить список лінивим.<\/span> <span class=\"sg\" data-s=\"1\">Діапазон без кінця, як-от <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, уже лінивий.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Тож <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> виводить <\/code>True<code> і без префікса.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Тут <code>lazy<\/code> нічого не змінює.<\/span> <span class=\"sg\" data-s=\"6\">Він лише ясно показує, чого ви хочете.<\/span> <span class=\"sg\" data-s=\"7\">Префікс справді корисний в іншому випадку.<\/span> <span class=\"sg\" data-s=\"8\">Іноді Raku обчислює список жадібно, весь одразу.<\/span> <span class=\"sg\" data-s=\"9\">З префіксом ви можете зробити такий список лінивим.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здебільшого Raku сам робить добрий вибір.<\/span> <span class=\"sg\" data-s=\"1\">Діапазони й послідовності ліниві.<\/span> <span class=\"sg\" data-s=\"2\">Звичайне присвоєння масиву жадібне.<\/span> <span class=\"sg\" data-s=\"3\">Використовуйте ці префікси, коли хочете іншого вибору.<\/span> <span class=\"sg\" data-s=\"4\">Використовуйте <code>eager<\/code>, щоб повільне обчислення відбулося зараз.<\/span> <span class=\"sg\" data-s=\"5\">Використовуйте <code>lazy<\/code>, щоб відкласти дуже велике або нескінченне обчислення.<\/span><\/p>"]]},"bg":{"t":"Мързеливост и нетърпеливост","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku изчислява някои списъци само когато му трябват елементите им.<\/span> <span class=\"sg\" data-s=\"1\">Такива списъци са <em>мързеливи<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">С префиксите <code>lazy<\/code> и <code>eager<\/code> можете сами да управлявате това.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>eager<\/code> кара Raku да създаде целия списък <strong>наведнъж<\/strong>, веднага:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> създава стойностите и без <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>eager<\/code> прави така, че Raku да изчисли всички веднага.<\/span> <span class=\"sg\" data-s=\"2\">Той не чака, докато ви потрябват.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>lazy<\/code> прави обратното.<\/span> <span class=\"sg\" data-s=\"1\">Той отбелязва списък като мързелив.<\/span> <span class=\"sg\" data-s=\"2\">Тогава Raku създава всеки елемент само когато кодът го поиска.<\/span> <span class=\"sg\" data-s=\"3\">Така списъкът може, на теория, да няма край:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.is-lazy<\/code> показва, че списъкът е мързелив.<\/span> <span class=\"sg\" data-s=\"1\">Затова той не се опитва първо да изчисли всичките си елементи.<\/span> <span class=\"sg\" data-s=\"2\">А тези елементи нямат край.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Но в този пример Raku и без това прави списъка мързелив.<\/span> <span class=\"sg\" data-s=\"1\">Диапазон без край, като <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, вече е мързелив.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Затова <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> отпечатва <\/code>True<code> и без префикса.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Тук <code>lazy<\/code> не променя нищо.<\/span> <span class=\"sg\" data-s=\"6\">Той само показва ясно какво искате.<\/span> <span class=\"sg\" data-s=\"7\">Префиксът е наистина полезен в друг случай.<\/span> <span class=\"sg\" data-s=\"8\">Понякога Raku изчислява списък нетърпеливо, целия наведнъж.<\/span> <span class=\"sg\" data-s=\"9\">С префикса можете да направите такъв списък мързелив.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Най-често Raku сам прави добър избор.<\/span> <span class=\"sg\" data-s=\"1\">Диапазоните и последователностите са мързеливи.<\/span> <span class=\"sg\" data-s=\"2\">Обикновеното присвояване на масив е нетърпеливо.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте тези префикси, когато искате друг избор.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте <code>eager<\/code>, за да стане бавно изчисление сега.<\/span> <span class=\"sg\" data-s=\"5\">Използвайте <code>lazy<\/code>, за да отложите много голямо или безкрайно изчисление.<\/span><\/p>"]]},"eo":{"t":"Maldiligento kaj fervoro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku komputas iujn listojn nur, kiam ĝi bezonas iliajn elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiaj listoj estas <em>maldiligentaj<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"2\">Per la prefiksoj <code>lazy<\/code> kaj <code>eager<\/code>, vi povas mem regi tion.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>eager<\/code> igas Raku produkti liston <strong>tutan samtempe<\/strong>, tuj nun:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>map<\/code> produktas la valorojn ankaŭ sen <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>eager<\/code> certigas, ke Raku komputas ilin ĉiujn tuj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne atendas, ĝis vi bezonas ilin.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>lazy<\/code> faras la malon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi markas liston kiel maldiligenta.<\/span> <span class=\"sg\" data-s=\"2\">Tiam Raku produktas ĉiun elementon nur, kiam la kodo petas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Do listo povas, teorie, ne havi finon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.is-lazy<\/code> montras, ke la listo estas maldiligenta.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi ne provas komputi ĉiujn siajn elementojn unue.<\/span> <span class=\"sg\" data-s=\"2\">Kaj ĉi tiuj elementoj ne havas finon.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Sed en ĉi tiu ekzemplo, Raku ĉiuokaze faras la liston maldiligenta.<\/span> <span class=\"sg\" data-s=\"1\">Intervalo sen fino, kiel <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, jam estas maldiligenta.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Do <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> presas <\/code>True<code> sen la prefikso.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Ĉi tie <code>lazy<\/code> ŝanĝas nenion.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi nur montras klare, kion vi volas.<\/span> <span class=\"sg\" data-s=\"7\">La prefikso estas vere utila en alia kazo.<\/span> <span class=\"sg\" data-s=\"8\">Foje Raku komputas liston avide, tutan samtempe.<\/span> <span class=\"sg\" data-s=\"9\">Per la prefikso, vi povas fari tian liston maldiligenta.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Plej ofte Raku mem faras bonan elekton.<\/span> <span class=\"sg\" data-s=\"1\">Intervaloj kaj sekvencoj estas maldiligentaj.<\/span> <span class=\"sg\" data-s=\"2\">Normala atribuo al tabelo estas avida.<\/span> <span class=\"sg\" data-s=\"3\">Uzu ĉi tiujn prefiksojn, kiam vi volas alian elekton.<\/span> <span class=\"sg\" data-s=\"4\">Uzu <code>eager<\/code>, por ke malrapida komputado okazu nun.<\/span> <span class=\"sg\" data-s=\"5\">Uzu <code>lazy<\/code> por prokrasti tre grandan aŭ senfinan komputadon.<\/span><\/p>"]]},"la":{"t":"Pigritia et alacri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku quosdam indices solum computat cum elementa eorum requirit.<\/span> <span class=\"sg\" data-s=\"1\">Tales indices <em>pigri<\/em> sunt.<\/span> <span class=\"sg\" data-s=\"2\">Cum praefixis <code>lazy<\/code> et <code>eager<\/code> hoc ipse regere potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>eager<\/code> Raku cogit indicem <strong>totum simul<\/strong> producere, nunc statim:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> etiam sine <code>eager<\/code> valores producit.<\/span> <span class=\"sg\" data-s=\"1\">Sed cum <code>eager<\/code> Raku certe omnes statim computat.<\/span> <span class=\"sg\" data-s=\"2\">Non exspectat donec eos requiris.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>lazy<\/code> contrarium facit.<\/span> <span class=\"sg\" data-s=\"1\">Indicem ut pigrum signat.<\/span> <span class=\"sg\" data-s=\"2\">Tum Raku quodque elementum solum producit cum codex id petit.<\/span> <span class=\"sg\" data-s=\"3\">Itaque index, in theoria, sine fine esse potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.is-lazy<\/code> ostendit: index piger est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque non conatur omnia elementa sua prius computare.<\/span> <span class=\"sg\" data-s=\"2\">Et haec elementa finem non habent.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Sed in hoc exemplo Raku indicem iam per se pigrum facit.<\/span> <span class=\"sg\" data-s=\"1\">Intervallum sine fine, sicut <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, iam pigrum est.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Itaque <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> imprimit <\/code>True<code> sine praefixo.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Hic <code>lazy<\/code> nihil mutat.<\/span> <span class=\"sg\" data-s=\"6\">Solum voluntatem tuam clare ostendit.<\/span> <span class=\"sg\" data-s=\"7\">Praefixum vere utile est in alio casu.<\/span> <span class=\"sg\" data-s=\"8\">Interdum Raku indicem impigre computat, totum simul.<\/span> <span class=\"sg\" data-s=\"9\">Cum praefixo talem indicem pigrum facere potes.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Plerumque Raku per se bene eligit.<\/span> <span class=\"sg\" data-s=\"1\">Intervalla et sequentiae pigra sunt.<\/span> <span class=\"sg\" data-s=\"2\">Assignatio simplex ad ordinem impigra est.<\/span> <span class=\"sg\" data-s=\"3\">Haec praefixa adhibe cum aliam electionem vis.<\/span> <span class=\"sg\" data-s=\"4\">Adhibe <code>eager<\/code> ut computatio lenta nunc fiat.<\/span> <span class=\"sg\" data-s=\"5\">Adhibe <code>lazy<\/code> ut computationem magnam vel infinitam differas.<\/span><\/p>"]]}}}</script>
