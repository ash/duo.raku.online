<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes","n":616,"k":"section","pv":"advanced/gather-take/quiz","nx":"advanced/statement-prefixes/do-prefix","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Statement prefixes","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A <em>statement prefix<\/em> is a keyword.<\/span> <span class=\"sg\" data-s=\"1\">You put it before a statement or a block.<\/span> <span class=\"sg\" data-s=\"2\">It changes how the statement or block runs.<\/span> <span class=\"sg\" data-s=\"3\">You already know one prefix: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">It collects everything that a block gives to <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">This section shows a few more prefixes for general use.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Prefixes can do several things.<\/span> <span class=\"sg\" data-s=\"1\">With <code>do<\/code>, a block becomes an expression with a value.<\/span> <span class=\"sg\" data-s=\"2\">With <code>eager<\/code> and <code>lazy<\/code>, you choose when Raku computes a list.<\/span> <span class=\"sg\" data-s=\"3\">It can compute it at once or only when needed.<\/span> <span class=\"sg\" data-s=\"4\">With <code>sink<\/code>, code runs only for its side effects.<\/span> <span class=\"sg\" data-s=\"5\">A side effect is an extra action of the code, like printing.<\/span> <span class=\"sg\" data-s=\"6\">With <code>quietly<\/code>, code runs and does not show its warnings.<\/span><\/p>"]]},"de":{"t":"Anweisungspräfixe","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Statement-Prefix<\/em> ist ein Schlüsselwort.<\/span> <span class=\"sg\" data-s=\"1\">Du setzt es vor eine Anweisung oder einen Block.<\/span> <span class=\"sg\" data-s=\"2\">Es ändert, wie die Anweisung oder der Block läuft.<\/span> <span class=\"sg\" data-s=\"3\">Du kennst schon ein Präfix: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Es sammelt alles, was ein Block an <code>take<\/code> gibt.<\/span> <span class=\"sg\" data-s=\"5\">Dieser Abschnitt zeigt noch ein paar Präfixe für den allgemeinen Gebrauch.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Präfixe können verschiedene Dinge tun.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>do<\/code> wird ein Block zu einem Ausdruck mit einem Wert.<\/span> <span class=\"sg\" data-s=\"2\">Mit <code>eager<\/code> und <code>lazy<\/code> wählst du, wann Raku eine Liste berechnet.<\/span> <span class=\"sg\" data-s=\"3\">Raku kann sie sofort berechnen oder erst, wenn sie gebraucht wird.<\/span> <span class=\"sg\" data-s=\"4\">Mit <code>sink<\/code> läuft Code nur für seine Seiteneffekte.<\/span> <span class=\"sg\" data-s=\"5\">Ein Seiteneffekt ist eine zusätzliche Aktion des Codes, zum Beispiel eine Ausgabe.<\/span> <span class=\"sg\" data-s=\"6\">Mit <code>quietly<\/code> läuft Code und zeigt seine Warnungen nicht.<\/span><\/p>"]]},"nl":{"t":"Statement-prefixen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <em>statement prefix<\/em> is een sleutelwoord.<\/span> <span class=\"sg\" data-s=\"1\">Je zet het voor een statement of een blok.<\/span> <span class=\"sg\" data-s=\"2\">Het verandert hoe het statement of blok draait.<\/span> <span class=\"sg\" data-s=\"3\">Je kent al één prefix: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Dat verzamelt alles wat een blok aan <code>take<\/code> geeft.<\/span> <span class=\"sg\" data-s=\"5\">Dit gedeelte laat nog een paar prefixen voor algemeen gebruik zien.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Prefixen kunnen verschillende dingen doen.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>do<\/code> wordt een blok een expressie met een waarde.<\/span> <span class=\"sg\" data-s=\"2\">Met <code>eager<\/code> en <code>lazy<\/code> kies je wanneer Raku een lijst berekent.<\/span> <span class=\"sg\" data-s=\"3\">Dat kan meteen of pas als het nodig is.<\/span> <span class=\"sg\" data-s=\"4\">Met <code>sink<\/code> draait code alleen voor zijn neveneffecten.<\/span> <span class=\"sg\" data-s=\"5\">Een neveneffect is een extra actie van de code, zoals printen.<\/span> <span class=\"sg\" data-s=\"6\">Met <code>quietly<\/code> draait code zonder zijn waarschuwingen te tonen.<\/span><\/p>"]]},"es":{"t":"Prefijos de sentencia","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>prefijo de sentencia<\/em> es una palabra clave.<\/span> <span class=\"sg\" data-s=\"1\">La pones delante de una sentencia o de un bloque.<\/span> <span class=\"sg\" data-s=\"2\">Cambia cómo se ejecuta la sentencia o el bloque.<\/span> <span class=\"sg\" data-s=\"3\">Ya conoces un prefijo: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Recoge todo lo que un bloque da a <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Esta sección muestra algunos prefijos más para uso general.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Los prefijos pueden hacer varias cosas.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>do<\/code>, un bloque se convierte en una expresión con un valor.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>eager<\/code> y <code>lazy<\/code>, eliges cuándo Raku calcula una lista.<\/span> <span class=\"sg\" data-s=\"3\">Puede calcularla enseguida o solo cuando hace falta.<\/span> <span class=\"sg\" data-s=\"4\">Con <code>sink<\/code>, el código se ejecuta solo por sus efectos secundarios.<\/span> <span class=\"sg\" data-s=\"5\">Un efecto secundario es una acción extra del código, como imprimir.<\/span> <span class=\"sg\" data-s=\"6\">Con <code>quietly<\/code>, el código se ejecuta y no muestra sus advertencias.<\/span><\/p>"]]},"it":{"t":"Prefissi di istruzione","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>prefisso di istruzione<\/em> è una parola chiave.<\/span> <span class=\"sg\" data-s=\"1\">La mettete prima di un'istruzione o di un blocco.<\/span> <span class=\"sg\" data-s=\"2\">Cambia il modo in cui gira l'istruzione o il blocco.<\/span> <span class=\"sg\" data-s=\"3\">Conoscete già un prefisso: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Raccoglie tutto quello che un blocco dà a <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Questa sezione mostra alcuni altri prefissi di uso generale.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">I prefissi possono fare diverse cose.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>do<\/code>, un blocco diventa un'espressione con un valore.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>eager<\/code> e <code>lazy<\/code>, scegliete quando Raku calcola una lista.<\/span> <span class=\"sg\" data-s=\"3\">Può calcolarla subito o solo quando serve.<\/span> <span class=\"sg\" data-s=\"4\">Con <code>sink<\/code>, il codice gira solo per i suoi effetti collaterali.<\/span> <span class=\"sg\" data-s=\"5\">Un effetto collaterale è un'azione in più del codice, come stampare.<\/span> <span class=\"sg\" data-s=\"6\">Con <code>quietly<\/code>, il codice gira e non mostra i suoi avvisi.<\/span><\/p>"]]},"lv":{"t":"Priekšrakstu prefiksi 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Teikuma prefikss<\/em> ir atslēgvārds.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to liekat pirms teikuma vai bloka.<\/span> <span class=\"sg\" data-s=\"2\">Tas maina to, kā teikums vai bloks izpildās.<\/span> <span class=\"sg\" data-s=\"3\">Vienu prefiksu jūs jau zināt: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas savāc visu, ko bloks dod <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Šī sadaļa parāda vēl dažus prefiksus vispārīgai lietošanai.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Prefiksi var darīt vairākas lietas.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>do<\/code> bloks kļūst par izteiksmi ar vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>eager<\/code> un <code>lazy<\/code> jūs izvēlaties, kad Raku aprēķina sarakstu.<\/span> <span class=\"sg\" data-s=\"3\">Tas var to aprēķināt uzreiz vai tikai tad, kad vajag.<\/span> <span class=\"sg\" data-s=\"4\">Ar <code>sink<\/code> kods izpildās tikai savu blakusefektu dēļ.<\/span> <span class=\"sg\" data-s=\"5\">Blakusefekts ir koda papildu darbība, piemēram, drukāšana.<\/span> <span class=\"sg\" data-s=\"6\">Ar <code>quietly<\/code> kods izpildās un nerāda savus brīdinājumus.<\/span><\/p>"]]},"ru":{"t":"Префиксы инструкций","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Префикс оператора<\/em> — это ключевое слово.<\/span> <span class=\"sg\" data-s=\"1\">Вы ставите его перед оператором или блоком.<\/span> <span class=\"sg\" data-s=\"2\">Он меняет то, как выполняется оператор или блок.<\/span> <span class=\"sg\" data-s=\"3\">Один префикс вы уже знаете: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Он собирает всё, что блок передаёт в <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Этот раздел показывает ещё несколько префиксов для общего использования.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Префиксы умеют несколько вещей.<\/span> <span class=\"sg\" data-s=\"1\">С <code>do<\/code> блок становится выражением со значением.<\/span> <span class=\"sg\" data-s=\"2\">С <code>eager<\/code> и <code>lazy<\/code> вы выбираете, когда Raku вычисляет список.<\/span> <span class=\"sg\" data-s=\"3\">Он может вычислить его сразу или только когда нужно.<\/span> <span class=\"sg\" data-s=\"4\">С <code>sink<\/code> код выполняется только ради побочных эффектов.<\/span> <span class=\"sg\" data-s=\"5\">Побочный эффект — это дополнительное действие кода, например печать.<\/span> <span class=\"sg\" data-s=\"6\">С <code>quietly<\/code> код выполняется и не показывает свои предупреждения.<\/span><\/p>"]]},"uk":{"t":"Префікси операторів","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Префікс оператора<\/em> — це ключове слово.<\/span> <span class=\"sg\" data-s=\"1\">Ви ставите його перед оператором або блоком.<\/span> <span class=\"sg\" data-s=\"2\">Він змінює те, як виконується оператор або блок.<\/span> <span class=\"sg\" data-s=\"3\">Ви вже знаєте один префікс: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він збирає все, що блок передає до <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Цей розділ показує ще кілька префіксів для загального вжитку.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Префікси можуть робити різні речі.<\/span> <span class=\"sg\" data-s=\"1\">З <code>do<\/code> блок стає виразом зі значенням.<\/span> <span class=\"sg\" data-s=\"2\">З <code>eager<\/code> і <code>lazy<\/code> ви вибираєте, коли Raku обчислює список.<\/span> <span class=\"sg\" data-s=\"3\">Він може обчислити його одразу або лише тоді, коли треба.<\/span> <span class=\"sg\" data-s=\"4\">З <code>sink<\/code> код виконується лише заради побічних ефектів.<\/span> <span class=\"sg\" data-s=\"5\">Побічний ефект — це додаткова дія коду, наприклад друк.<\/span> <span class=\"sg\" data-s=\"6\">З <code>quietly<\/code> код виконується і не показує своїх попереджень.<\/span><\/p>"]]},"bg":{"t":"Префикси на инструкции 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Един <em>префикс на оператор<\/em> е ключова дума.<\/span> <span class=\"sg\" data-s=\"1\">Слагате я пред оператор или блок.<\/span> <span class=\"sg\" data-s=\"2\">Тя променя как се изпълнява операторът или блокът.<\/span> <span class=\"sg\" data-s=\"3\">Вече знаете един префикс: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Той събира всичко, което блокът дава на <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Този раздел показва още няколко префикса за обща употреба.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Префиксите могат да правят няколко неща.<\/span> <span class=\"sg\" data-s=\"1\">С <code>do<\/code> блокът става израз със стойност.<\/span> <span class=\"sg\" data-s=\"2\">С <code>eager<\/code> и <code>lazy<\/code> вие избирате кога Raku изчислява списък.<\/span> <span class=\"sg\" data-s=\"3\">Той може да го изчисли веднага или само когато трябва.<\/span> <span class=\"sg\" data-s=\"4\">Със <code>sink<\/code> кодът се изпълнява само заради страничните си ефекти.<\/span> <span class=\"sg\" data-s=\"5\">Страничният ефект е допълнително действие на кода, например отпечатване.<\/span> <span class=\"sg\" data-s=\"6\">С <code>quietly<\/code> кодът се изпълнява и не показва предупрежденията си.<\/span><\/p>"]]},"eo":{"t":"Deklaraj prefiksoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Deklara prefikso<\/em> estas ŝlosilvorto.<\/span> <span class=\"sg\" data-s=\"1\">Vi metas ĝin antaŭ deklaro aŭ bloko.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ŝanĝas, kiel la deklaro aŭ bloko ruliĝas.<\/span> <span class=\"sg\" data-s=\"3\">Vi jam konas unu prefikson: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi kolektas ĉion, kion bloko donas al <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiu sekcio montras kelkajn pliajn prefiksojn por ĝenerala uzo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Prefiksoj povas fari plurajn aferojn.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>do<\/code>, bloko fariĝas esprimo kun valoro.<\/span> <span class=\"sg\" data-s=\"2\">Per <code>eager<\/code> kaj <code>lazy<\/code>, vi elektas, kiam Raku komputas liston.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi povas komputi ĝin tuj aŭ nur kiam necese.<\/span> <span class=\"sg\" data-s=\"4\">Per <code>sink<\/code>, kodo ruliĝas nur pro siaj flankefektoj.<\/span> <span class=\"sg\" data-s=\"5\">Flankefekto estas kroma ago de la kodo, ekzemple presado.<\/span> <span class=\"sg\" data-s=\"6\">Per <code>quietly<\/code>, kodo ruliĝas kaj ne montras siajn avertojn.<\/span><\/p>"]]},"la":{"t":"Praefixae sententiae","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In Raku, <em>praefixum sententiae<\/em> est verbum clavium.<\/span> <span class=\"sg\" data-s=\"1\">Id ante sententiam vel copiam ponis.<\/span> <span class=\"sg\" data-s=\"2\">Mutat modum quo sententia vel copia currit.<\/span> <span class=\"sg\" data-s=\"3\">Iam unum praefixum cognovisti: <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Omnia colligit quae copia ad <code>take<\/code> dat.<\/span> <span class=\"sg\" data-s=\"5\">Haec sectio pauca alia praefixa ad usum generalem ostendit.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Praefixa plures res facere possunt.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>do<\/code> copia fit expressio cum valore.<\/span> <span class=\"sg\" data-s=\"2\">Cum <code>eager<\/code> et <code>lazy<\/code> eligis quando Raku indicem computet.<\/span> <span class=\"sg\" data-s=\"3\">Eum statim computare potest, aut solum cum opus est.<\/span> <span class=\"sg\" data-s=\"4\">Cum <code>sink<\/code> codex solum propter effectus laterales currit.<\/span> <span class=\"sg\" data-s=\"5\">Effectus lateralis est actio codicis addita, sicut impressio.<\/span> <span class=\"sg\" data-s=\"6\">Cum <code>quietly<\/code> codex currit et admonitiones suas non ostendit.<\/span><\/p>"]]}}}</script>
