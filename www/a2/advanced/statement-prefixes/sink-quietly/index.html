<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/sink-quietly","n":620,"k":"topic","pv":"advanced/statement-prefixes/lazy-eager","nx":"advanced/statement-prefixes/sink-quietly/quiz","tr":["advanced","advanced/statement-prefixes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"sink and quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">There are two more prefixes.<\/span> <span class=\"sg\" data-s=\"1\">They run code for what it does.<\/span> <span class=\"sg\" data-s=\"2\">The value of the code is not important.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The <code>sink<\/code> prefix runs code in <em>sink context<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The code runs only for its side effects.<\/span> <span class=\"sg\" data-s=\"2\">Raku throws away the result.<\/span> <span class=\"sg\" data-s=\"3\">This is useful with a lazy operation.<\/span> <span class=\"sg\" data-s=\"4\">With <code>sink<\/code>, you make it run:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, we run the <code>map<\/code> only for its printing.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> makes sure that it really runs.<\/span> <span class=\"sg\" data-s=\"2\">Then <code>sink<\/code> throws away the list from the <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">If nothing forces it, a lazy <code>map<\/code> may not run at all.<\/span> <span class=\"sg\" data-s=\"4\">This can happen when nobody uses its result.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>quietly<\/code> prefix runs a block and <strong>hides its warnings<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Some code usually prints a warning to the error stream.<\/span> <span class=\"sg\" data-s=\"2\">Inside <code>quietly<\/code>, this code is silent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Usually, Raku shows a warning when you add <code>1<\/code> to an undefined <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The warning is about an “uninitialized value”.<\/span> <span class=\"sg\" data-s=\"2\">Inside <code>quietly<\/code>, this warning is hidden.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes you know that your code gives a warning.<\/span> <span class=\"sg\" data-s=\"4\">You do not want this noise.<\/span> <span class=\"sg\" data-s=\"5\">Then use <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">But do not use it often.<\/span> <span class=\"sg\" data-s=\"7\">A warning usually shows a real mistake.<\/span><\/p>"]]},"de":{"t":"sink und quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt noch zwei Präfixe.<\/span> <span class=\"sg\" data-s=\"1\">Sie führen Code für das aus, was er tut.<\/span> <span class=\"sg\" data-s=\"2\">Der Wert des Codes ist nicht wichtig.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das <code>sink<\/code>-Präfix führt Code im <em>Sink-Kontext<\/em> aus.<\/span> <span class=\"sg\" data-s=\"1\">Der Code läuft nur für seine Seiteneffekte.<\/span> <span class=\"sg\" data-s=\"2\">Raku wirft das Ergebnis weg.<\/span> <span class=\"sg\" data-s=\"3\">Das ist nützlich bei einer lazy Operation.<\/span> <span class=\"sg\" data-s=\"4\">Mit <code>sink<\/code> bringst du sie zum Laufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier führen wir das <code>map<\/code> nur für seine Ausgabe aus.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> sorgt dafür, dass es wirklich läuft.<\/span> <span class=\"sg\" data-s=\"2\">Dann wirft <code>sink<\/code> die Liste aus dem <code>map<\/code> weg.<\/span> <span class=\"sg\" data-s=\"3\">Ohne Zwang läuft ein lazy <code>map<\/code> vielleicht gar nicht.<\/span> <span class=\"sg\" data-s=\"4\">Das kann passieren, wenn niemand sein Ergebnis nutzt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <code>quietly<\/code>-Präfix führt einen Block aus und <strong>versteckt seine Warnungen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Mancher Code gibt normalerweise eine Warnung in den Fehlerstrom aus.<\/span> <span class=\"sg\" data-s=\"2\">In <code>quietly<\/code> ist dieser Code still:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, ohne \"uninitialized value\"-Warnung\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Normalerweise zeigt Raku eine Warnung, wenn du <code>1<\/code> zu einem undefinierten <code>$value<\/code> addierst.<\/span> <span class=\"sg\" data-s=\"1\">Die Warnung spricht von einem „uninitialized value“.<\/span> <span class=\"sg\" data-s=\"2\">In <code>quietly<\/code> ist diese Warnung versteckt.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal weißt du, dass dein Code eine Warnung gibt.<\/span> <span class=\"sg\" data-s=\"4\">Du willst diesen Lärm nicht.<\/span> <span class=\"sg\" data-s=\"5\">Dann nutze <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Aber nutze es nicht oft.<\/span> <span class=\"sg\" data-s=\"7\">Eine Warnung zeigt meistens einen echten Fehler.<\/span><\/p>"]]},"nl":{"t":"sink en quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Er zijn nog twee prefixen.<\/span> <span class=\"sg\" data-s=\"1\">Ze draaien code voor wat die doet.<\/span> <span class=\"sg\" data-s=\"2\">De waarde van de code is niet belangrijk.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>sink<\/code> draait code in <em>sink context<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De code draait alleen voor zijn neveneffecten.<\/span> <span class=\"sg\" data-s=\"2\">Raku gooit het resultaat weg.<\/span> <span class=\"sg\" data-s=\"3\">Dat is handig bij een luie operatie.<\/span> <span class=\"sg\" data-s=\"4\">Met <code>sink<\/code> laat je die draaien:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier draaien we de <code>map<\/code> alleen om wat hij print.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> zorgt ervoor dat hij echt draait.<\/span> <span class=\"sg\" data-s=\"2\">Dan gooit <code>sink<\/code> de lijst van de <code>map<\/code> weg.<\/span> <span class=\"sg\" data-s=\"3\">Als niets hem dwingt, draait een luie <code>map<\/code> misschien helemaal niet.<\/span> <span class=\"sg\" data-s=\"4\">Dat kan gebeuren als niemand zijn resultaat gebruikt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>quietly<\/code> draait een blok en <strong>verbergt zijn waarschuwingen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sommige code print meestal een waarschuwing naar de foutuitvoer.<\/span> <span class=\"sg\" data-s=\"2\">Binnen <code>quietly<\/code> is deze code stil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Meestal geeft Raku een waarschuwing als je <code>1<\/code> optelt bij een ongedefinieerde <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De waarschuwing gaat over een \"uninitialized value\".<\/span> <span class=\"sg\" data-s=\"2\">Binnen <code>quietly<\/code> blijft deze waarschuwing verborgen.<\/span> <span class=\"sg\" data-s=\"3\">Soms weet je dat je code een waarschuwing geeft.<\/span> <span class=\"sg\" data-s=\"4\">Je wilt dit lawaai niet.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik dan <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Maar gebruik het niet vaak.<\/span> <span class=\"sg\" data-s=\"7\">Een waarschuwing wijst meestal op een echte fout.<\/span><\/p>"]]},"es":{"t":"sink y quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay dos prefijos más.<\/span> <span class=\"sg\" data-s=\"1\">Ejecutan código por lo que hace.<\/span> <span class=\"sg\" data-s=\"2\">El valor del código no importa.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>sink<\/code> ejecuta código en <em>contexto sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El código se ejecuta solo por sus efectos secundarios.<\/span> <span class=\"sg\" data-s=\"2\">Raku tira el resultado.<\/span> <span class=\"sg\" data-s=\"3\">Esto es útil con una operación perezosa.<\/span> <span class=\"sg\" data-s=\"4\">Con <code>sink<\/code>, haces que se ejecute:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, ejecutamos el <code>map<\/code> solo para imprimir.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> se asegura de que de verdad se ejecute.<\/span> <span class=\"sg\" data-s=\"2\">Después <code>sink<\/code> tira la lista que da el <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Si nada lo obliga, un <code>map<\/code> perezoso puede no ejecutarse nunca.<\/span> <span class=\"sg\" data-s=\"4\">Esto puede pasar cuando nadie usa su resultado.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>quietly<\/code> ejecuta un bloque y <strong>oculta sus advertencias<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Algún código normalmente imprime una advertencia en el flujo de error.<\/span> <span class=\"sg\" data-s=\"2\">Dentro de <code>quietly<\/code>, este código se queda en silencio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Normalmente, Raku muestra una advertencia cuando sumas <code>1<\/code> a un <code>$value<\/code> indefinido.<\/span> <span class=\"sg\" data-s=\"1\">La advertencia habla de un «valor no inicializado».<\/span> <span class=\"sg\" data-s=\"2\">Dentro de <code>quietly<\/code>, esta advertencia queda oculta.<\/span> <span class=\"sg\" data-s=\"3\">A veces sabes que tu código da una advertencia.<\/span> <span class=\"sg\" data-s=\"4\">No quieres este ruido.<\/span> <span class=\"sg\" data-s=\"5\">Entonces usa <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Pero no lo uses a menudo.<\/span> <span class=\"sg\" data-s=\"7\">Una advertencia normalmente muestra un error real.<\/span><\/p>"]]},"it":{"t":"sink e quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ci sono altri due prefissi.<\/span> <span class=\"sg\" data-s=\"1\">Eseguono il codice per quello che fa.<\/span> <span class=\"sg\" data-s=\"2\">Il valore del codice non è importante.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>sink<\/code> esegue il codice in <em>contesto sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il codice gira solo per i suoi effetti collaterali.<\/span> <span class=\"sg\" data-s=\"2\">Raku butta via il risultato.<\/span> <span class=\"sg\" data-s=\"3\">Questo è utile con un'operazione lazy.<\/span> <span class=\"sg\" data-s=\"4\">Con <code>sink<\/code> la fate partire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui eseguiamo il <code>map<\/code> solo per quello che stampa.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> fa in modo che parta davvero.<\/span> <span class=\"sg\" data-s=\"2\">Poi <code>sink<\/code> butta via la lista del <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Se niente lo obbliga, un <code>map<\/code> lazy può non partire per niente.<\/span> <span class=\"sg\" data-s=\"4\">Questo può succedere quando nessuno usa il suo risultato.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>quietly<\/code> esegue un blocco e <strong>nasconde i suoi avvisi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Un certo codice di solito stampa un avviso sul flusso di errore.<\/span> <span class=\"sg\" data-s=\"2\">Dentro <code>quietly<\/code>, questo codice resta in silenzio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Di solito Raku mostra un avviso quando sommate <code>1<\/code> a un <code>$value<\/code> non definito.<\/span> <span class=\"sg\" data-s=\"1\">L'avviso parla di un “uninitialized value”.<\/span> <span class=\"sg\" data-s=\"2\">Dentro <code>quietly<\/code>, questo avviso è nascosto.<\/span> <span class=\"sg\" data-s=\"3\">A volte sapete che il vostro codice dà un avviso.<\/span> <span class=\"sg\" data-s=\"4\">Non volete questo rumore.<\/span> <span class=\"sg\" data-s=\"5\">Allora usate <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ma non usatelo spesso.<\/span> <span class=\"sg\" data-s=\"7\">Un avviso di solito indica un errore vero.<\/span><\/p>"]]},"lv":{"t":"sink un quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir vēl divi prefiksi.<\/span> <span class=\"sg\" data-s=\"1\">Tie izpilda kodu tā darbības dēļ.<\/span> <span class=\"sg\" data-s=\"2\">Koda vērtība nav svarīga.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>sink<\/code> izpilda kodu <em>iesūkšanas kontekstā<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Kods izpildās tikai savu blakusefektu dēļ.<\/span> <span class=\"sg\" data-s=\"2\">Raku izmet rezultātu.<\/span> <span class=\"sg\" data-s=\"3\">Tas noder ar slinku darbību.<\/span> <span class=\"sg\" data-s=\"4\">Ar <code>sink<\/code> jūs liekat tai izpildīties:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit mēs izpildām <code>map<\/code> tikai tā drukāšanas dēļ.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> gādā, ka tas tiešām izpildās.<\/span> <span class=\"sg\" data-s=\"2\">Tad <code>sink<\/code> izmet sarakstu, ko devis <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ja nekas to nepiespiež, slinks <code>map<\/code> var nemaz neizpildīties.<\/span> <span class=\"sg\" data-s=\"4\">Tā var notikt, kad neviens neizmanto tā rezultātu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>quietly<\/code> izpilda bloku un <strong>paslēpj tā brīdinājumus<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Kāds kods parasti izdrukā brīdinājumu kļūdu plūsmā.<\/span> <span class=\"sg\" data-s=\"2\"><code>quietly<\/code> iekšā šis kods ir kluss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Parasti Raku parāda brīdinājumu, kad jūs pieskaitāt <code>1<\/code> nedefinētam <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Brīdinājums ir par “neinicializētu vērtību”.<\/span> <span class=\"sg\" data-s=\"2\"><code>quietly<\/code> iekšā šis brīdinājums ir paslēpts.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz jūs zināt, ka jūsu kods dod brīdinājumu.<\/span> <span class=\"sg\" data-s=\"4\">Jūs negribat šo troksni.<\/span> <span class=\"sg\" data-s=\"5\">Tad izmantojiet <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Bet neizmantojiet to bieži.<\/span> <span class=\"sg\" data-s=\"7\">Brīdinājums parasti parāda īstu kļūdu.<\/span><\/p>"]]},"ru":{"t":"sink и quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Есть ещё два префикса.<\/span> <span class=\"sg\" data-s=\"1\">Они выполняют код ради того, что он делает.<\/span> <span class=\"sg\" data-s=\"2\">Значение кода не важно.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>sink<\/code> выполняет код в <em>контексте sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Код выполняется только ради побочных эффектов.<\/span> <span class=\"sg\" data-s=\"2\">Raku выбрасывает результат.<\/span> <span class=\"sg\" data-s=\"3\">Это полезно с ленивой операцией.<\/span> <span class=\"sg\" data-s=\"4\">С <code>sink<\/code> вы заставляете её выполниться:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь мы выполняем <code>map<\/code> только ради печати.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> следит, чтобы он правда выполнился.<\/span> <span class=\"sg\" data-s=\"2\">Потом <code>sink<\/code> выбрасывает список из <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Если ничто его не заставляет, ленивый <code>map<\/code> может вообще не выполниться.<\/span> <span class=\"sg\" data-s=\"4\">Так бывает, когда никто не использует его результат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>quietly<\/code> выполняет блок и <strong>скрывает его предупреждения<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Какой-то код обычно печатает предупреждение в поток ошибок.<\/span> <span class=\"sg\" data-s=\"2\">Внутри <code>quietly<\/code> такой код молчит:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, без предупреждения \"uninitialized value\"\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Обычно Raku показывает предупреждение, когда вы прибавляете <code>1<\/code> к неопределённому <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Предупреждение говорит про «uninitialized value».<\/span> <span class=\"sg\" data-s=\"2\">Внутри <code>quietly<\/code> это предупреждение скрыто.<\/span> <span class=\"sg\" data-s=\"3\">Иногда вы знаете, что ваш код даёт предупреждение.<\/span> <span class=\"sg\" data-s=\"4\">Вам не нужен этот шум.<\/span> <span class=\"sg\" data-s=\"5\">Тогда используйте <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Но не используйте его часто.<\/span> <span class=\"sg\" data-s=\"7\">Предупреждение обычно показывает настоящую ошибку.<\/span><\/p>"]]},"uk":{"t":"sink та quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Є ще два префікси.<\/span> <span class=\"sg\" data-s=\"1\">Вони виконують код заради того, що він робить.<\/span> <span class=\"sg\" data-s=\"2\">Значення коду не важливе.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>sink<\/code> виконує код у <em>контексті стоку<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Код виконується лише заради побічних ефектів.<\/span> <span class=\"sg\" data-s=\"2\">Raku викидає результат.<\/span> <span class=\"sg\" data-s=\"3\">Це корисно з лінивою операцією.<\/span> <span class=\"sg\" data-s=\"4\">З <code>sink<\/code> ви змушуєте її виконатися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут ми виконуємо <code>map<\/code> лише заради друку.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> дбає, щоб він справді виконався.<\/span> <span class=\"sg\" data-s=\"2\">Потім <code>sink<\/code> викидає список від <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Якщо ніщо його не змушує, лінивий <code>map<\/code> може взагалі не виконатися.<\/span> <span class=\"sg\" data-s=\"4\">Так буває, коли ніхто не використовує його результат.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>quietly<\/code> виконує блок і <strong>ховає його попередження<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Деякий код зазвичай друкує попередження в потік помилок.<\/span> <span class=\"sg\" data-s=\"2\">Усередині <code>quietly<\/code> цей код мовчить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, без попередження \"uninitialized value\"\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Зазвичай Raku показує попередження, коли ви додаєте <code>1<\/code> до невизначеного <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це попередження про «неініціалізоване значення».<\/span> <span class=\"sg\" data-s=\"2\">Усередині <code>quietly<\/code> це попередження приховане.<\/span> <span class=\"sg\" data-s=\"3\">Іноді ви знаєте, що ваш код дає попередження.<\/span> <span class=\"sg\" data-s=\"4\">Вам не потрібен цей шум.<\/span> <span class=\"sg\" data-s=\"5\">Тоді використовуйте <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Але не використовуйте його часто.<\/span> <span class=\"sg\" data-s=\"7\">Попередження зазвичай показує справжню помилку.<\/span><\/p>"]]},"bg":{"t":"sink и quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Има още два префикса.<\/span> <span class=\"sg\" data-s=\"1\">Те изпълняват код заради това, което той прави.<\/span> <span class=\"sg\" data-s=\"2\">Стойността на кода не е важна.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>sink<\/code> изпълнява код в <em>sink контекст<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Кодът се изпълнява само заради страничните си ефекти.<\/span> <span class=\"sg\" data-s=\"2\">Raku изхвърля резултата.<\/span> <span class=\"sg\" data-s=\"3\">Това е полезно при мързелива операция.<\/span> <span class=\"sg\" data-s=\"4\">Със <code>sink<\/code> вие я карате да се изпълни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук изпълняваме <code>map<\/code> само заради отпечатването.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> се грижи той наистина да се изпълни.<\/span> <span class=\"sg\" data-s=\"2\">След това <code>sink<\/code> изхвърля списъка от <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ако нищо не го принуждава, мързеливият <code>map<\/code> може изобщо да не се изпълни.<\/span> <span class=\"sg\" data-s=\"4\">Това може да стане, когато никой не използва резултата му.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>quietly<\/code> изпълнява блок и <strong>скрива предупрежденията му<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Някой код обикновено отпечатва предупреждение в потока за грешки.<\/span> <span class=\"sg\" data-s=\"2\">Вътре в <code>quietly<\/code> този код мълчи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Обикновено Raku показва предупреждение, когато добавите <code>1<\/code> към неопределена <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Предупреждението е за „неинициализирана стойност“.<\/span> <span class=\"sg\" data-s=\"2\">Вътре в <code>quietly<\/code> това предупреждение е скрито.<\/span> <span class=\"sg\" data-s=\"3\">Понякога знаете, че кодът ви дава предупреждение.<\/span> <span class=\"sg\" data-s=\"4\">Не искате този шум.<\/span> <span class=\"sg\" data-s=\"5\">Тогава използвайте <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Но не го използвайте често.<\/span> <span class=\"sg\" data-s=\"7\">Предупреждението обикновено показва истинска грешка.<\/span><\/p>"]]},"eo":{"t":"sink kaj quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ekzistas du pliaj prefiksoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili rulas kodon pro tio, kion ĝi faras.<\/span> <span class=\"sg\" data-s=\"2\">La valoro de la kodo ne estas grava.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>sink<\/code> rulas kodon en <em>sink-kunteksto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La kodo ruliĝas nur pro siaj flankefektoj.<\/span> <span class=\"sg\" data-s=\"2\">Raku forĵetas la rezulton.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas utila kun maldiligenta operacio.<\/span> <span class=\"sg\" data-s=\"4\">Per <code>sink<\/code>, vi igas ĝin ruliĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie ni rulas la <code>map<\/code> nur pro ĝia presado.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> certigas, ke ĝi vere ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">Poste <code>sink<\/code> forĵetas la liston de la <code>map<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Se nenio devigas ĝin, maldiligenta <code>map<\/code> eble tute ne ruliĝas.<\/span> <span class=\"sg\" data-s=\"4\">Tio povas okazi, kiam neniu uzas ĝian rezulton.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>quietly<\/code> rulas blokon kaj <strong>kaŝas ĝiajn avertojn<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Iu kodo kutime presas averton al la erara fluo.<\/span> <span class=\"sg\" data-s=\"2\">Ene de <code>quietly<\/code>, ĉi tiu kodo estas silenta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Kutime Raku montras averton, kiam vi aldonas <code>1<\/code> al nedefinita <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La averto temas pri \"neinicialigita valoro\".<\/span> <span class=\"sg\" data-s=\"2\">Ene de <code>quietly<\/code>, ĉi tiu averto estas kaŝita.<\/span> <span class=\"sg\" data-s=\"3\">Foje vi scias, ke via kodo donas averton.<\/span> <span class=\"sg\" data-s=\"4\">Vi ne volas ĉi tiun bruon.<\/span> <span class=\"sg\" data-s=\"5\">Tiam uzu <code>quietly<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Sed ne uzu ĝin ofte.<\/span> <span class=\"sg\" data-s=\"7\">Averto kutime montras veran eraron.<\/span><\/p>"]]},"la":{"t":"sink et quietly","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sunt duo alia praefixa.<\/span> <span class=\"sg\" data-s=\"1\">Codicem currunt propter id quod facit.<\/span> <span class=\"sg\" data-s=\"2\">Valor codicis non magni momenti est.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>sink<\/code> codicem in <em>contextu sink<\/em> currit.<\/span> <span class=\"sg\" data-s=\"1\">Codex solum propter effectus laterales currit.<\/span> <span class=\"sg\" data-s=\"2\">Raku resultatum abicit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc utile est cum operatione pigra.<\/span> <span class=\"sg\" data-s=\"4\">Cum <code>sink<\/code> eam currere cogis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic <code>map<\/code> solum propter impressionem currimus.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>sink<\/code> revera currit.<\/span> <span class=\"sg\" data-s=\"2\">Deinde <code>sink<\/code> indicem ex <code>map<\/code> abicit.<\/span> <span class=\"sg\" data-s=\"3\">Si nihil eam cogit, <code>map<\/code> pigra fortasse omnino non currit.<\/span> <span class=\"sg\" data-s=\"4\">Hoc fieri potest cum nemo resultatum eius adhibet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>quietly<\/code> copiam currit et <strong>admonitiones eius celat<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Quidam codex plerumque admonitionem ad fluxum errorum imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Intra <code>quietly<\/code> hic codex tacet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Plerumque Raku admonitionem ostendit cum <code>1<\/code> ad <code>$value<\/code> indefinitum addis.<\/span> <span class=\"sg\" data-s=\"1\">Admonitio de “uninitialized value” est.<\/span> <span class=\"sg\" data-s=\"2\">Intra <code>quietly<\/code> haec admonitio latet.<\/span> <span class=\"sg\" data-s=\"3\">Interdum scis: codex tuus admonitionem dat.<\/span> <span class=\"sg\" data-s=\"4\">Hunc strepitum non vis.<\/span> <span class=\"sg\" data-s=\"5\">Tum <code>quietly<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"6\">Sed id non saepe adhibe.<\/span> <span class=\"sg\" data-s=\"7\">Admonitio plerumque verum errorem ostendit.<\/span><\/p>"]]}}}</script>
