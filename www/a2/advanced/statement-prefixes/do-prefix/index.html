<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/do-prefix","n":617,"k":"topic","pv":"advanced/statement-prefixes","nx":"advanced/statement-prefixes/do-prefix/quiz","tr":["advanced","advanced/statement-prefixes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"do and the value of a block","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A block alone is a statement, not an expression.<\/span> <span class=\"sg\" data-s=\"1\">So usually you cannot assign it to a variable.<\/span> <span class=\"sg\" data-s=\"2\">The <code>do<\/code> prefix makes a block an expression.<\/span> <span class=\"sg\" data-s=\"3\">Its value is the value of the <strong>last<\/strong> statement in the block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Inside the block, you can create variables.<\/span> <span class=\"sg\" data-s=\"1\">You can run several statements and compute a result.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> gives back the value of the block.<\/span> <span class=\"sg\" data-s=\"3\">This is useful when one expression is not enough for a value.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> also works before control-flow statements.<\/span> <span class=\"sg\" data-s=\"1\">These statements choose or repeat code.<\/span> <span class=\"sg\" data-s=\"2\">With <code>do<\/code>, they return a value too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, <code>do given<\/code> makes the whole <code>given<\/code>/<code>when<\/code> an expression.<\/span> <span class=\"sg\" data-s=\"1\">Its value is <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The same works with <code>do if<\/code> and <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">In short, <code>do<\/code> lets a block stand where Raku needs a value.<\/span> <span class=\"sg\" data-s=\"4\">It works for control structures too.<\/span><\/p>"]]},"de":{"t":"do und der Wert eines Blocks","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Block allein ist eine Anweisung, kein Ausdruck.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du ihn normalerweise keiner Variablen zuweisen.<\/span> <span class=\"sg\" data-s=\"2\">Das <code>do<\/code>-Präfix macht einen Block zu einem Ausdruck.<\/span> <span class=\"sg\" data-s=\"3\">Sein Wert ist der Wert der <strong>letzten<\/strong> Anweisung im Block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Im Block kannst du Variablen anlegen.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst mehrere Anweisungen ausführen und ein Ergebnis berechnen.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> gibt den Wert des Blocks zurück.<\/span> <span class=\"sg\" data-s=\"3\">Das ist nützlich, wenn ein Ausdruck für einen Wert nicht reicht.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> funktioniert auch vor Kontrollfluss-Anweisungen.<\/span> <span class=\"sg\" data-s=\"1\">Diese Anweisungen wählen Code aus oder wiederholen ihn.<\/span> <span class=\"sg\" data-s=\"2\">Mit <code>do<\/code> geben auch sie einen Wert zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier macht <code>do given<\/code> das ganze <code>given<\/code>/<code>when<\/code> zu einem Ausdruck.<\/span> <span class=\"sg\" data-s=\"1\">Sein Wert ist <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das geht auch mit <code>do if<\/code> und <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kurz gesagt: Mit <code>do<\/code> kann ein Block dort stehen, wo Raku einen Wert braucht.<\/span> <span class=\"sg\" data-s=\"4\">Das geht auch für Kontrollstrukturen.<\/span><\/p>"]]},"nl":{"t":"do en de waarde van een blok","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een blok alleen is een statement, geen expressie.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het dus meestal niet aan een variabele toewijzen.<\/span> <span class=\"sg\" data-s=\"2\">Het prefix <code>do<\/code> maakt van een blok een expressie.<\/span> <span class=\"sg\" data-s=\"3\">De waarde ervan is de waarde van het <strong>laatste<\/strong> statement in het blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In het blok kun je variabelen maken.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt meerdere statements draaien en een resultaat berekenen.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> geeft de waarde van het blok terug.<\/span> <span class=\"sg\" data-s=\"3\">Dat is handig als één expressie niet genoeg is voor een waarde.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> werkt ook vóór control-flow-statements.<\/span> <span class=\"sg\" data-s=\"1\">Deze statements kiezen of herhalen code.<\/span> <span class=\"sg\" data-s=\"2\">Met <code>do<\/code> geven ze ook een waarde terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier maakt <code>do given<\/code> van de hele <code>given<\/code>/<code>when<\/code> een expressie.<\/span> <span class=\"sg\" data-s=\"1\">De waarde ervan is <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hetzelfde werkt met <code>do if<\/code> en <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kort gezegd: met <code>do<\/code> kan een blok staan waar Raku een waarde nodig heeft.<\/span> <span class=\"sg\" data-s=\"4\">Het werkt ook voor besturingsstructuren.<\/span><\/p>"]]},"es":{"t":"do y el valor de un bloque","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un bloque por sí solo es una sentencia, no una expresión.<\/span> <span class=\"sg\" data-s=\"1\">Así que normalmente no puedes asignarlo a una variable.<\/span> <span class=\"sg\" data-s=\"2\">El prefijo <code>do<\/code> convierte un bloque en una expresión.<\/span> <span class=\"sg\" data-s=\"3\">Su valor es el valor de la <strong>última<\/strong> sentencia del bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro del bloque, puedes crear variables.<\/span> <span class=\"sg\" data-s=\"1\">Puedes ejecutar varias sentencias y calcular un resultado.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> devuelve el valor del bloque.<\/span> <span class=\"sg\" data-s=\"3\">Esto es útil cuando una sola expresión no basta para obtener un valor.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> también funciona delante de las sentencias de flujo de control.<\/span> <span class=\"sg\" data-s=\"1\">Estas sentencias eligen o repiten código.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>do<\/code>, también devuelven un valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>do given<\/code> convierte todo el <code>given<\/code>/<code>when<\/code> en una expresión.<\/span> <span class=\"sg\" data-s=\"1\">Su valor es <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo mismo funciona con <code>do if<\/code> y <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">En resumen, con <code>do<\/code> puedes poner un bloque donde Raku necesita un valor.<\/span> <span class=\"sg\" data-s=\"4\">También funciona con estructuras de control.<\/span><\/p>"]]},"it":{"t":"do e il valore di un blocco","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un blocco da solo è un'istruzione, non un'espressione.<\/span> <span class=\"sg\" data-s=\"1\">Quindi di solito non potete assegnarlo a una variabile.<\/span> <span class=\"sg\" data-s=\"2\">Il prefisso <code>do<\/code> fa di un blocco un'espressione.<\/span> <span class=\"sg\" data-s=\"3\">Il suo valore è il valore dell'<strong>ultima<\/strong> istruzione del blocco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro il blocco potete creare variabili.<\/span> <span class=\"sg\" data-s=\"1\">Potete eseguire diverse istruzioni e calcolare un risultato.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> restituisce il valore del blocco.<\/span> <span class=\"sg\" data-s=\"3\">Questo è utile quando un'espressione non basta per un valore.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> funziona anche prima delle istruzioni di controllo del flusso.<\/span> <span class=\"sg\" data-s=\"1\">Queste istruzioni scelgono o ripetono il codice.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>do<\/code>, anche loro restituiscono un valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui <code>do given<\/code> fa di tutto il <code>given<\/code>/<code>when<\/code> un'espressione.<\/span> <span class=\"sg\" data-s=\"1\">Il suo valore è <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso funziona con <code>do if<\/code> e <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">In breve, con <code>do<\/code> un blocco può stare dove serve un valore.<\/span> <span class=\"sg\" data-s=\"4\">Funziona anche per le strutture di controllo.<\/span><\/p>"]]},"lv":{"t":"do un bloka vērtība","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloks viens pats ir teikums, nevis izteiksme.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc parasti to nevar piešķirt mainīgajam.<\/span> <span class=\"sg\" data-s=\"2\">Prefikss <code>do<\/code> padara bloku par izteiksmi.<\/span> <span class=\"sg\" data-s=\"3\">Tās vērtība ir bloka <strong>pēdējā<\/strong> teikuma vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloka iekšā jūs varat izveidot mainīgos.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat izpildīt vairākus teikumus un aprēķināt rezultātu.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> atdod bloka vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Tas noder, kad vērtībai nepietiek ar vienu izteiksmi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> darbojas arī pirms vadības plūsmas teikumiem.<\/span> <span class=\"sg\" data-s=\"1\">Šie teikumi izvēlas vai atkārto kodu.<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>do<\/code> arī tie atgriež vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>do given<\/code> padara visu <code>given<\/code>/<code>when<\/code> par izteiksmi.<\/span> <span class=\"sg\" data-s=\"1\">Tās vērtība ir <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats darbojas ar <code>do if<\/code> un <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Īsi sakot, ar <code>do<\/code> bloks var stāvēt tur, kur Raku vajag vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Tas darbojas arī vadības struktūrām.<\/span><\/p>"]]},"ru":{"t":"do и значение блока","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок сам по себе — это оператор, а не выражение.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому обычно его нельзя присвоить переменной.<\/span> <span class=\"sg\" data-s=\"2\">Префикс <code>do<\/code> делает блок выражением.<\/span> <span class=\"sg\" data-s=\"3\">Его значение — это значение <strong>последнего<\/strong> оператора в блоке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Внутри блока можно создавать переменные.<\/span> <span class=\"sg\" data-s=\"1\">Можно выполнить несколько операторов и вычислить результат.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> возвращает значение блока.<\/span> <span class=\"sg\" data-s=\"3\">Это удобно, когда для значения мало одного выражения.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> работает и перед управляющими конструкциями.<\/span> <span class=\"sg\" data-s=\"1\">Эти конструкции выбирают или повторяют код.<\/span> <span class=\"sg\" data-s=\"2\">С <code>do<\/code> они тоже возвращают значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>do given<\/code> делает всю конструкцию <code>given<\/code>/<code>when<\/code> выражением.<\/span> <span class=\"sg\" data-s=\"1\">Его значение — <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">То же работает с <code>do if<\/code> и <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Короче говоря, с <code>do<\/code> блок может стоять там, где Raku нужно значение.<\/span> <span class=\"sg\" data-s=\"4\">Это работает и для управляющих конструкций.<\/span><\/p>"]]},"uk":{"t":"do та значення блоку","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок сам по собі — це оператор, а не вираз.<\/span> <span class=\"sg\" data-s=\"1\">Тож зазвичай його не можна присвоїти змінній.<\/span> <span class=\"sg\" data-s=\"2\">Префікс <code>do<\/code> робить блок виразом.<\/span> <span class=\"sg\" data-s=\"3\">Його значення — це значення <strong>останнього<\/strong> оператора в блоці:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Усередині блоку можна створювати змінні.<\/span> <span class=\"sg\" data-s=\"1\">Можна виконати кілька операторів і обчислити результат.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> повертає значення блоку.<\/span> <span class=\"sg\" data-s=\"3\">Це корисно, коли для значення не вистачає одного виразу.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> також працює перед операторами керування потоком виконання.<\/span> <span class=\"sg\" data-s=\"1\">Ці оператори вибирають або повторюють код.<\/span> <span class=\"sg\" data-s=\"2\">З <code>do<\/code> вони теж повертають значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут <code>do given<\/code> робить увесь <code>given<\/code>/<code>when<\/code> виразом.<\/span> <span class=\"sg\" data-s=\"1\">Його значення — <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так само працюють <code>do if<\/code> і <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Коротко кажучи, з <code>do<\/code> блок може стояти там, де Raku потрібне значення.<\/span> <span class=\"sg\" data-s=\"4\">Це працює і для керівних конструкцій.<\/span><\/p>"]]},"bg":{"t":"do и стойността на блок","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блокът сам по себе си е оператор, а не израз.<\/span> <span class=\"sg\" data-s=\"1\">Затова обикновено не можете да го присвоите на променлива.<\/span> <span class=\"sg\" data-s=\"2\">Префиксът <code>do<\/code> прави блока израз.<\/span> <span class=\"sg\" data-s=\"3\">Стойността му е стойността на <strong>последния<\/strong> оператор в блока:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вътре в блока можете да създавате променливи.<\/span> <span class=\"sg\" data-s=\"1\">Можете да изпълнявате няколко оператора и да изчислите резултат.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> връща стойността на блока.<\/span> <span class=\"sg\" data-s=\"3\">Това е полезно, когато един израз не стига, за да получите стойност.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> работи и пред операторите за управление на потока.<\/span> <span class=\"sg\" data-s=\"1\">Тези оператори избират или повтарят код.<\/span> <span class=\"sg\" data-s=\"2\">С <code>do<\/code> и те връщат стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук <code>do given<\/code> прави цялата конструкция <code>given<\/code>/<code>when<\/code> израз.<\/span> <span class=\"sg\" data-s=\"1\">Стойността на този израз е <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Същото работи с <code>do if<\/code> и <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Накратко, с <code>do<\/code> блокът може да стои там, където Raku иска стойност.<\/span> <span class=\"sg\" data-s=\"4\">Това работи и за управляващите конструкции.<\/span><\/p>"]]},"eo":{"t":"do kaj la valoro de bloko","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloko sola estas deklaro, ne esprimo.<\/span> <span class=\"sg\" data-s=\"1\">Do kutime vi ne povas atribui ĝin al variablo.<\/span> <span class=\"sg\" data-s=\"2\">La prefikso <code>do<\/code> faras el bloko esprimon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝia valoro estas la valoro de la <strong>lasta<\/strong> deklaro en la bloko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ene de la bloko, vi povas krei variablojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas ruli plurajn deklarojn kaj komputi rezulton.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> redonas la valoron de la bloko.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas utila, kiam unu esprimo ne sufiĉas por valoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> ankaŭ funkcias antaŭ kontrolfluaj deklaroj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj deklaroj elektas aŭ ripetas kodon.<\/span> <span class=\"sg\" data-s=\"2\">Kun <code>do<\/code>, ili ankaŭ redonas valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>do given<\/code> faras el la tuta <code>given<\/code>/<code>when<\/code> esprimon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia valoro estas <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Same funkcias <code>do if<\/code> kaj <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Mallonge, per <code>do<\/code> bloko povas stari tie, kie Raku bezonas valoron.<\/span> <span class=\"sg\" data-s=\"4\">Tio funkcias ankaŭ por kontrolstrukturoj.<\/span><\/p>"]]},"la":{"t":"do et valor bloci","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Copia sola sententia est, non expressio.<\/span> <span class=\"sg\" data-s=\"1\">Itaque plerumque eam variabili assignare non potes.<\/span> <span class=\"sg\" data-s=\"2\">Praefixum <code>do<\/code> copiam expressionem facit.<\/span> <span class=\"sg\" data-s=\"3\">Valor eius est valor <strong>ultimae<\/strong> sententiae in copia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Intra copiam variabiles creare potes.<\/span> <span class=\"sg\" data-s=\"1\">Plures sententias currere et resultatum computare potes.<\/span> <span class=\"sg\" data-s=\"2\"><code>do<\/code> valorem copiae reddit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc utile est cum una expressio ad valorem non sufficit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> etiam ante sententias fluxus controllandi operatur.<\/span> <span class=\"sg\" data-s=\"1\">Hae sententiae codicem eligunt aut iterant.<\/span> <span class=\"sg\" data-s=\"2\">Cum <code>do<\/code> etiam valorem reddunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic <code>do given<\/code> totum <code>given<\/code>/<code>when<\/code> expressionem facit.<\/span> <span class=\"sg\" data-s=\"1\">Valor eius est <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Idem cum <code>do if<\/code> et <code>do for<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"3\">Breviter, <code>do<\/code> sinit copiam stare ubi Raku valorem requirit.<\/span> <span class=\"sg\" data-s=\"4\">Etiam pro structuris controllandi operatur.<\/span><\/p>"]]}}}</script>
