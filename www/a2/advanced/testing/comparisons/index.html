<script type="application/json" id="page-data">{"u":"advanced/testing/comparisons","n":748,"k":"topic","pv":"advanced/testing/test-module/quiz","nx":"advanced/testing/running-tests","tr":["advanced","advanced/testing"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Comparisons and plans","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>Test<\/code> module has more than <code>ok<\/code> and <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It has comparisons for different kinds of values.<\/span> <span class=\"sg\" data-s=\"2\">These are the most useful ones:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — checks that two values are equal (as strings or numbers)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — checks that two data structures are exactly equal, and their types too<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — checks that a string matches a regex<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — passes when two values are <strong>not<\/strong> equal<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Use <code>is-deeply<\/code> for arrays, hashes and data inside other data.<\/span> <span class=\"sg\" data-s=\"1\">It compares the structure and the type exactly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> turns the values into strings.<\/span> <span class=\"sg\" data-s=\"1\">Then it compares them, but not very strictly.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> is different.<\/span> <span class=\"sg\" data-s=\"3\">With it, the structures must really match.<\/span> <span class=\"sg\" data-s=\"4\">Note that <code>done-testing<\/code> puts the plan <code>1..1<\/code> at the end, after the check.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> can count the tests for you.<\/span> <span class=\"sg\" data-s=\"1\">But you can also give the number at the start, with <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This helps with one problem.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes a test file stops too early.<\/span> <span class=\"sg\" data-s=\"4\">Then it skips some checks without any message:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Now the plan is <strong>first<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">It comes before the results:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Here you can see how <code>plan<\/code> is different from <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> prints the count <code>1..2<\/code> at the top, before any checks run.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> prints it at the very end.<\/span> <span class=\"sg\" data-s=\"3\">In any case, with <code>plan 2<\/code>, the run expects exactly two tests.<\/span> <span class=\"sg\" data-s=\"4\">If fewer or more tests run, the whole set of tests fails.<\/span> <span class=\"sg\" data-s=\"5\">Use <code>plan<\/code> if the number of tests is fixed and you know it.<\/span> <span class=\"sg\" data-s=\"6\">Use <code>done-testing<\/code> if it is easier to let the test module count.<\/span><\/p>"]]},"de":{"t":"Vergleiche und Pläne","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <code>Test<\/code>-Modul hat mehr als <code>ok<\/code> und <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es hat Vergleiche für verschiedene Arten von Werten.<\/span> <span class=\"sg\" data-s=\"2\">Das hier sind die nützlichsten:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — prüft, ob zwei Werte gleich sind (als Strings oder Zahlen)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — prüft, ob zwei Datenstrukturen genau gleich sind, auch ihre Typen<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — prüft, ob ein String zu einer Regex passt<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — ist erfolgreich, wenn zwei Werte <strong>nicht<\/strong> gleich sind<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Benutze <code>is-deeply<\/code> für Arrays, Hashes und Daten in anderen Daten.<\/span> <span class=\"sg\" data-s=\"1\">Es vergleicht die Struktur und den Typ genau:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies gibt aus:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> macht aus den Werten Strings.<\/span> <span class=\"sg\" data-s=\"1\">Dann vergleicht es sie, aber nicht sehr streng.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> ist anders.<\/span> <span class=\"sg\" data-s=\"3\">Damit müssen die Strukturen wirklich übereinstimmen.<\/span> <span class=\"sg\" data-s=\"4\">Beachte: <code>done-testing<\/code> setzt den Plan <code>1..1<\/code> ans Ende, nach der Prüfung.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> kann die Tests für dich zählen.<\/span> <span class=\"sg\" data-s=\"1\">Aber du kannst die Anzahl auch am Anfang angeben, mit <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das hilft bei einem Problem.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal hört eine Testdatei zu früh auf.<\/span> <span class=\"sg\" data-s=\"4\">Dann überspringt sie einige Prüfungen ohne eine Meldung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jetzt steht der Plan <strong>zuerst<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Er kommt vor den Ergebnissen:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier siehst du den Unterschied zwischen <code>plan<\/code> und <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> gibt die Anzahl <code>1..2<\/code> oben aus, bevor eine Prüfung läuft.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> gibt sie ganz am Ende aus.<\/span> <span class=\"sg\" data-s=\"3\">In jedem Fall erwartet der Lauf mit <code>plan 2<\/code> genau zwei Tests.<\/span> <span class=\"sg\" data-s=\"4\">Wenn weniger oder mehr Tests laufen, schlägt die ganze Gruppe von Tests fehl.<\/span> <span class=\"sg\" data-s=\"5\">Benutze <code>plan<\/code>, wenn die Anzahl der Tests fest ist und du sie kennst.<\/span> <span class=\"sg\" data-s=\"6\">Benutze <code>done-testing<\/code>, wenn es einfacher ist, das Testmodul zählen zu lassen.<\/span><\/p>"]]},"nl":{"t":"Vergelijkingen en plannen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>Test<\/code>-module heeft meer dan <code>ok<\/code> en <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij heeft vergelijkingen voor verschillende soorten waarden.<\/span> <span class=\"sg\" data-s=\"2\">Dit zijn de nuttigste:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — controleert of twee waarden gelijk zijn (als strings of getallen)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — controleert of twee datastructuren precies gelijk zijn, en hun types ook<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — controleert of een string bij een regex past<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — slaagt als twee waarden <strong>niet<\/strong> gelijk zijn<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>is-deeply<\/code> voor arrays, hashes en data in andere data.<\/span> <span class=\"sg\" data-s=\"1\">Het vergelijkt de structuur en het type precies:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit geeft:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> maakt strings van de waarden.<\/span> <span class=\"sg\" data-s=\"1\">Dan vergelijkt het ze, maar niet erg streng.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> is anders.<\/span> <span class=\"sg\" data-s=\"3\">Daarmee moeten de structuren echt overeenkomen.<\/span> <span class=\"sg\" data-s=\"4\">Let op: <code>done-testing<\/code> zet het plan <code>1..1<\/code> aan het eind, na de controle.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> kan de tests voor je tellen.<\/span> <span class=\"sg\" data-s=\"1\">Maar je kunt het aantal ook aan het begin geven, met <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dit helpt bij één probleem.<\/span> <span class=\"sg\" data-s=\"3\">Soms stopt een testbestand te vroeg.<\/span> <span class=\"sg\" data-s=\"4\">Dan slaat het sommige controles over, zonder enige melding:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nu komt het plan <strong>eerst<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Het staat vóór de resultaten:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier zie je hoe <code>plan<\/code> anders is dan <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> print het aantal <code>1..2<\/code> bovenaan, voordat er controles draaien.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> print het helemaal aan het eind.<\/span> <span class=\"sg\" data-s=\"3\">In elk geval verwacht de uitvoering met <code>plan 2<\/code> precies twee tests.<\/span> <span class=\"sg\" data-s=\"4\">Als er minder of meer tests draaien, faalt de hele reeks tests.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik <code>plan<\/code> als het aantal tests vastligt en je het kent.<\/span> <span class=\"sg\" data-s=\"6\">Gebruik <code>done-testing<\/code> als het makkelijker is om de testmodule te laten tellen.<\/span><\/p>"]]},"es":{"t":"Comparaciones y planes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El módulo <code>Test<\/code> tiene más que <code>ok<\/code> e <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiene comparaciones para distintos tipos de valores.<\/span> <span class=\"sg\" data-s=\"2\">Estas son las más útiles:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — comprueba que dos valores son iguales (como cadenas o números)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — comprueba que dos estructuras de datos son exactamente iguales, y también sus tipos<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — comprueba que una cadena coincide con una expresión regular<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — pasa cuando dos valores <strong>no<\/strong> son iguales<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa <code>is-deeply<\/code> para arreglos, hashes y datos dentro de otros datos.<\/span> <span class=\"sg\" data-s=\"1\">Compara la estructura y el tipo de forma exacta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> convierte los valores en cadenas.<\/span> <span class=\"sg\" data-s=\"1\">Luego los compara, pero no de forma muy estricta.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> es diferente.<\/span> <span class=\"sg\" data-s=\"3\">Con él, las estructuras deben coincidir de verdad.<\/span> <span class=\"sg\" data-s=\"4\">Observa que <code>done-testing<\/code> pone el plan <code>1..1<\/code> al final, después de la comprobación.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> puede contar las pruebas por ti.<\/span> <span class=\"sg\" data-s=\"1\">Pero también puedes dar el número al principio, con <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto ayuda con un problema.<\/span> <span class=\"sg\" data-s=\"3\">A veces un archivo de pruebas se detiene demasiado pronto.<\/span> <span class=\"sg\" data-s=\"4\">Entonces se salta algunas comprobaciones sin ningún mensaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora el plan está <strong>primero<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Viene antes de los resultados:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Aquí ves en qué se diferencia <code>plan<\/code> de <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> imprime el conteo <code>1..2<\/code> arriba, antes de cualquier comprobación.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> lo imprime justo al final.<\/span> <span class=\"sg\" data-s=\"3\">En cualquier caso, con <code>plan 2<\/code>, la ejecución espera exactamente dos pruebas.<\/span> <span class=\"sg\" data-s=\"4\">Si se ejecutan menos o más pruebas, todo el conjunto de pruebas falla.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>plan<\/code> si el número de pruebas es fijo y lo conoces.<\/span> <span class=\"sg\" data-s=\"6\">Usa <code>done-testing<\/code> si es más fácil dejar que el módulo de pruebas cuente.<\/span><\/p>"]]},"it":{"t":"Confronti e piani","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il modulo <code>Test<\/code> non ha solo <code>ok<\/code> e <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ha confronti per diversi tipi di valori.<\/span> <span class=\"sg\" data-s=\"2\">Questi sono i più utili:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — controlla se due valori sono uguali (come stringhe o numeri)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — controlla se due strutture dati sono esattamente uguali, anche nei tipi<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — controlla se una stringa corrisponde a un'espressione regolare<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — ha successo quando due valori <strong>non<\/strong> sono uguali<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usa <code>is-deeply<\/code> per array, hash e dati dentro altri dati.<\/span> <span class=\"sg\" data-s=\"1\">Confronta la struttura e il tipo in modo esatto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> trasforma i valori in stringhe.<\/span> <span class=\"sg\" data-s=\"1\">Poi li confronta, ma non in modo molto rigido.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> è diverso.<\/span> <span class=\"sg\" data-s=\"3\">Con questa funzione le strutture devono corrispondere davvero.<\/span> <span class=\"sg\" data-s=\"4\">Nota che <code>done-testing<\/code> mette il piano <code>1..1<\/code> alla fine, dopo il controllo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> può contare i test per te.<\/span> <span class=\"sg\" data-s=\"1\">Ma puoi anche dare il numero all'inizio, con <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo aiuta con un problema.<\/span> <span class=\"sg\" data-s=\"3\">A volte un file di test si ferma troppo presto.<\/span> <span class=\"sg\" data-s=\"4\">Allora salta alcuni controlli senza nessun messaggio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora il piano viene <strong>per primo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Arriva prima dei risultati:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Qui vedi come <code>plan<\/code> è diverso da <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> stampa il conteggio <code>1..2<\/code> in cima, prima di tutti i controlli.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> lo stampa proprio alla fine.<\/span> <span class=\"sg\" data-s=\"3\">In ogni caso, con <code>plan 2<\/code> l'esecuzione aspetta esattamente due test.<\/span> <span class=\"sg\" data-s=\"4\">Se ci sono meno test o più test, tutto il gruppo di test fallisce.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>plan<\/code> se il numero di test è fisso e lo conosci.<\/span> <span class=\"sg\" data-s=\"6\">Usa <code>done-testing<\/code> se è più facile lasciar contare il modulo di test.<\/span><\/p>"]]},"lv":{"t":"Salīdzinājumi un plāni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Modulim <code>Test<\/code> ir vairāk nekā <code>ok<\/code> un <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir salīdzinājumi dažādu veidu vērtībām.<\/span> <span class=\"sg\" data-s=\"2\">Šie ir visnoderīgākie:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — pārbauda, vai divas vērtības ir vienādas (kā virknes vai skaitļi)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — pārbauda, vai divas datu struktūras ir pilnīgi vienādas, arī to tipi<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — pārbauda, vai virkne atbilst regulārajai izteiksmei<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — izdodas, kad divas vērtības <strong>nav<\/strong> vienādas<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet <code>is-deeply<\/code> masīviem, jaukteņiem un datiem citu datu iekšpusē.<\/span> <span class=\"sg\" data-s=\"1\">Tas precīzi salīdzina struktūru un tipu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> pārvērš vērtības virknēs.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas salīdzina tās, bet ne pārāk stingri.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> ir citāds.<\/span> <span class=\"sg\" data-s=\"3\">Ar to struktūrām tiešām jāsakrīt.<\/span> <span class=\"sg\" data-s=\"4\">Ievērojiet, ka <code>done-testing<\/code> liek plānu <code>1..1<\/code> beigās, pēc pārbaudes.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> var saskaitīt testus jūsu vietā.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs varat arī pateikt skaitu sākumā, ar <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas palīdz ar vienu problēmu.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz testu fails apstājas par agru.<\/span> <span class=\"sg\" data-s=\"4\">Tad tas izlaiž dažas pārbaudes bez jebkāda ziņojuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad plāns ir <strong>pirmais<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas nāk pirms rezultātiem:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šeit jūs redzat, kā <code>plan<\/code> atšķiras no <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> izdrukā skaitu <code>1..2<\/code> augšā, pirms sākas pārbaudes.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> to izdrukā pašās beigās.<\/span> <span class=\"sg\" data-s=\"3\">Jebkurā gadījumā ar <code>plan 2<\/code> izpilde gaida tieši divus testus.<\/span> <span class=\"sg\" data-s=\"4\">Ja izpildās mazāk vai vairāk testu, visa testu kopa neizdodas.<\/span> <span class=\"sg\" data-s=\"5\">Izmantojiet <code>plan<\/code>, ja testu skaits ir noteikts un jūs to zināt.<\/span> <span class=\"sg\" data-s=\"6\">Izmantojiet <code>done-testing<\/code>, ja ir vieglāk ļaut testu modulim skaitīt.<\/span><\/p>"]]},"ru":{"t":"Сравнения и планы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В модуле <code>Test<\/code> есть не только <code>ok<\/code> и <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В нём есть сравнения для разных видов значений.<\/span> <span class=\"sg\" data-s=\"2\">Вот самые полезные:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — проверяет, что два значения равны (как строки или числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — проверяет, что две структуры данных точно равны, и их типы тоже<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — проверяет, что строка подходит под регулярное выражение<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — проходит, когда два значения <strong>не<\/strong> равны<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Используйте <code>is-deeply<\/code> для массивов, хэшей и данных внутри других данных.<\/span> <span class=\"sg\" data-s=\"1\">Он точно сравнивает структуру и тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вывод:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> превращает значения в строки.<\/span> <span class=\"sg\" data-s=\"1\">Потом он сравнивает их, но не очень строго.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> работает иначе.<\/span> <span class=\"sg\" data-s=\"3\">С ним структуры должны совпадать по-настоящему.<\/span> <span class=\"sg\" data-s=\"4\">Заметьте, что <code>done-testing<\/code> ставит план <code>1..1<\/code> в конец, после проверки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> может посчитать тесты за вас.<\/span> <span class=\"sg\" data-s=\"1\">Но вы можете и указать их число в начале, с помощью <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это помогает с одной проблемой.<\/span> <span class=\"sg\" data-s=\"3\">Иногда тестовый файл останавливается слишком рано.<\/span> <span class=\"sg\" data-s=\"4\">Тогда он пропускает некоторые проверки без всякого сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь план стоит <strong>первым<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Он идёт перед результатами:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Здесь вы видите, чем <code>plan<\/code> отличается от <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> печатает количество <code>1..2<\/code> вверху, до всех проверок.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> печатает его в самом конце.<\/span> <span class=\"sg\" data-s=\"3\">В любом случае с <code>plan 2<\/code> запуск ждёт ровно два теста.<\/span> <span class=\"sg\" data-s=\"4\">Если запускается меньше или больше тестов, весь набор тестов не проходит.<\/span> <span class=\"sg\" data-s=\"5\">Используйте <code>plan<\/code>, если число тестов постоянное и вы его знаете.<\/span> <span class=\"sg\" data-s=\"6\">Используйте <code>done-testing<\/code>, если проще дать модулю тестов посчитать самому.<\/span><\/p>"]]},"uk":{"t":"Порівняння та плани","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Модуль <code>Test<\/code> має не лише <code>ok<\/code> та <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У ньому є порівняння для різних видів значень.<\/span> <span class=\"sg\" data-s=\"2\">Ось найкорисніші з них:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — перевіряє, що два значення рівні (як рядки чи числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — перевіряє, що дві структури даних точно рівні, і їхні типи теж<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — перевіряє, що рядок збігається з регулярним виразом<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — проходить, коли два значення <strong>не<\/strong> рівні<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <code>is-deeply<\/code> для масивів, хешів і даних усередині інших даних.<\/span> <span class=\"sg\" data-s=\"1\">Він точно порівнює структуру і тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це виводить:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> перетворює значення на рядки.<\/span> <span class=\"sg\" data-s=\"1\">Потім він порівнює їх, але не дуже строго.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> працює інакше.<\/span> <span class=\"sg\" data-s=\"3\">З ним структури мають справді збігатися.<\/span> <span class=\"sg\" data-s=\"4\">Зверніть увагу, що <code>done-testing<\/code> ставить план <code>1..1<\/code> у кінці, після перевірки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> може порахувати тести за вас.<\/span> <span class=\"sg\" data-s=\"1\">Але ви також можете вказати їхню кількість на початку, через <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це допомагає з однією проблемою.<\/span> <span class=\"sg\" data-s=\"3\">Іноді файл тестів зупиняється надто рано.<\/span> <span class=\"sg\" data-s=\"4\">Тоді він пропускає деякі перевірки без жодного повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер план стоїть <strong>першим<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Він іде перед результатами:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тут видно, чим <code>plan<\/code> відрізняється від <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> виводить кількість <code>1..2<\/code> угорі, до всіх перевірок.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> виводить її в самому кінці.<\/span> <span class=\"sg\" data-s=\"3\">У будь-якому разі з <code>plan 2<\/code> запуск чекає рівно двох тестів.<\/span> <span class=\"sg\" data-s=\"4\">Якщо запускається менше або більше тестів, увесь набір тестів провалюється.<\/span> <span class=\"sg\" data-s=\"5\">Використовуйте <code>plan<\/code>, якщо кількість тестів не змінюється і ви її знаєте.<\/span> <span class=\"sg\" data-s=\"6\">Використовуйте <code>done-testing<\/code>, якщо простіше дати модулю тестів порахувати їх.<\/span><\/p>"]]},"bg":{"t":"Сравнения и планове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Модулът <code>Test<\/code> има повече от <code>ok<\/code> и <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В него има сравнения за различни видове стойности.<\/span> <span class=\"sg\" data-s=\"2\">Ето най-полезните от тях:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — проверява дали две стойности са равни (като низове или числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — проверява дали две структури от данни са точно равни, и типовете им също<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — проверява дали низ съвпада с регулярен израз<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — минава, когато две стойности <strong>не<\/strong> са равни<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвайте <code>is-deeply<\/code> за масиви, хешове и данни в други данни.<\/span> <span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> сравнява точно структурата и типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това извежда:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> превръща стойностите в низове.<\/span> <span class=\"sg\" data-s=\"1\">След това ги сравнява, но не много строго.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> работи иначе.<\/span> <span class=\"sg\" data-s=\"3\">С него структурите трябва наистина да съвпадат.<\/span> <span class=\"sg\" data-s=\"4\">Забележете, че <code>done-testing<\/code> слага плана <code>1..1<\/code> в края, след проверката.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> може да брои тестовете вместо вас.<\/span> <span class=\"sg\" data-s=\"1\">Но можете също да дадете броя в началото, с <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това помага при един проблем.<\/span> <span class=\"sg\" data-s=\"3\">Понякога тестовият файл спира твърде рано.<\/span> <span class=\"sg\" data-s=\"4\">Тогава той пропуска някои проверки без никакво съобщение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега планът е <strong>пръв<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Той идва преди резултатите:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тук виждате как <code>plan<\/code> се различава от <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> отпечатва броя <code>1..2<\/code> най-горе, преди проверките.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> го отпечатва в самия край.<\/span> <span class=\"sg\" data-s=\"3\">Във всеки случай с <code>plan 2<\/code> изпълнението очаква точно два теста.<\/span> <span class=\"sg\" data-s=\"4\">Ако се изпълнят по-малко или повече тестове, целият набор от тестове се проваля.<\/span> <span class=\"sg\" data-s=\"5\">Използвайте <code>plan<\/code>, ако броят на тестовете е постоянен и го знаете.<\/span> <span class=\"sg\" data-s=\"6\">Използвайте <code>done-testing<\/code>, ако е по-лесно да оставите тестовия модул да брои.<\/span><\/p>"]]},"eo":{"t":"Komparoj kaj planoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La modulo <code>Test<\/code> havas pli ol <code>ok<\/code> kaj <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas komparojn por diversaj specoj de valoroj.<\/span> <span class=\"sg\" data-s=\"2\">Jen la plej utilaj:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — kontrolas, ke du valoroj estas egalaj (kiel ĉenoj aŭ nombroj)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — kontrolas, ke du datumstrukturoj estas ekzakte egalaj, kaj ankaŭ iliaj tipoj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — kontrolas, ke ĉeno kongruas kun regula esprimo<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — sukcesas, kiam du valoroj <strong>ne<\/strong> estas egalaj<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzu <code>is-deeply<\/code> por tabeloj, asociaj tabeloj kaj datumoj en aliaj datumoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi komparas la strukturon kaj la tipon ekzakte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio presas:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> ŝanĝas la valorojn en ĉenojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi komparas ilin, sed ne tre strikte.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> estas alia.<\/span> <span class=\"sg\" data-s=\"3\">Kun ĝi, la strukturoj devas vere kongrui.<\/span> <span class=\"sg\" data-s=\"4\">Notu, ke <code>done-testing<\/code> metas la planon <code>1..1<\/code> ĉe la fino, post la kontrolo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> povas kalkuli la testojn por vi.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankaŭ povas doni la nombron ĉe la komenco, per <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio helpas kontraŭ unu problemo.<\/span> <span class=\"sg\" data-s=\"3\">Foje testodosiero haltas tro frue.<\/span> <span class=\"sg\" data-s=\"4\">Tiam ĝi preterlasas iujn kontrolojn sen ia mesaĝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun la plano venas <strong>unue<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas antaŭ la rezultoj:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie vi vidas, kiel <code>plan<\/code> diferencas de <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> presas la nombron <code>1..2<\/code> supre, antaŭ ol iuj kontroloj ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> presas ĝin tute ĉe la fino.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiukaze, kun <code>plan 2<\/code> la rulo atendas ekzakte du testojn.<\/span> <span class=\"sg\" data-s=\"4\">Se ruliĝas malpli aŭ pli da testoj, la tuta aro de testoj malsukcesas.<\/span> <span class=\"sg\" data-s=\"5\">Uzu <code>plan<\/code>, se la nombro de testoj estas fiksita kaj vi konas ĝin.<\/span> <span class=\"sg\" data-s=\"6\">Uzu <code>done-testing<\/code>, se estas pli facile lasi la testan modulon kalkuli.<\/span><\/p>"]]},"la":{"t":"Comparationes et consilia","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Modulus <code>Test<\/code> plus quam <code>ok<\/code> et <code>is<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Comparationes pro diversis generibus valorum habet.<\/span> <span class=\"sg\" data-s=\"2\">Hae sunt utilissimae:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — verificat duos valores aequales esse (ut chordas vel numeros)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — verificat duas structuras datorum exacte aequales esse, et genera quoque earum<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — verificat chordam expressioni regulari respondere<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — transit cum duo valores <strong>non<\/strong> aequales sunt<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adhibe <code>is-deeply<\/code> pro ordinibus, mappis et datis intra alia data.<\/span> <span class=\"sg\" data-s=\"1\">Structuram et genus exacte comparat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> valores in chordas vertit.<\/span> <span class=\"sg\" data-s=\"1\">Tum eos comparat, sed non valde severe.<\/span> <span class=\"sg\" data-s=\"2\"><code>is-deeply<\/code> aliter agit.<\/span> <span class=\"sg\" data-s=\"3\">Cum eo structurae vere convenire debent.<\/span> <span class=\"sg\" data-s=\"4\">Nota: <code>done-testing<\/code> consilium <code>1..1<\/code> in fine ponit, post probationem.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>done-testing<\/code> probationes pro te numerare potest.<\/span> <span class=\"sg\" data-s=\"1\">Sed numerum etiam in initio dare potes, per <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc in uno problemate adiuvat.<\/span> <span class=\"sg\" data-s=\"3\">Interdum archivum probationum nimis mature desinit.<\/span> <span class=\"sg\" data-s=\"4\">Tum quasdam probationes sine ullo nuntio praeterit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc consilium <strong>primum<\/strong> est.<\/span> <span class=\"sg\" data-s=\"1\">Ante effectus venit:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hic vides quomodo <code>plan<\/code> a <code>done-testing<\/code> differat.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> numerum <code>1..2<\/code> in summo imprimit, antequam ullae probationes currunt.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> eum in ipso fine imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Utroque modo, cum <code>plan 2<\/code>, cursus exacte duas probationes exspectat.<\/span> <span class=\"sg\" data-s=\"4\">Si pauciores vel plures probationes currunt, tota series probationum deficit.<\/span> <span class=\"sg\" data-s=\"5\">Adhibe <code>plan<\/code> si numerus probationum fixus est et eum scis.<\/span> <span class=\"sg\" data-s=\"6\">Adhibe <code>done-testing<\/code> si facilius est modulum probationum numerare sinere.<\/span><\/p>"]]}}}</script>
