ta-s=\"2\">Zuletzt zeigt er, wie du Tests ausführst.<\/span><\/p>"]]},"nl":{"t":"Testen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Tests controleren of je code het goede doet.<\/span> <span class=\"sg\" data-s=\"1\">Ze controleren dat ook opnieuw na elke verandering.<\/span> <span class=\"sg\" data-s=\"2\">Raku heeft een module voor tests, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft ook vaste manieren om veel tests tegelijk uit te voeren.<\/span> <span class=\"sg\" data-s=\"4\">Echte Raku-programma's en -modules hebben tests nodig.<\/span> <span class=\"sg\" data-s=\"5\">Tests schrijven is een belangrijk deel van het werk.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel toont de belangrijkste delen van de <code>Test<\/code>-module.<\/span> <span class=\"sg\" data-s=\"1\">Het toont ook de verschillende soorten vergelijkingen erin.<\/span> <span class=\"sg\" data-s=\"2\">Tot slot laat het zien hoe je tests uitvoert.<\/span><\/p>"]]},"es":{"t":"Pruebas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Las pruebas comprueban que tu código hace lo correcto.<\/span> <span class=\"sg\" data-s=\"1\">También lo comprueban otra vez después de cada cambio.<\/span> <span class=\"sg\" data-s=\"2\">Raku viene con un módulo para pruebas, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku también tiene formas estándar de ejecutar muchas pruebas a la vez.<\/span> <span class=\"sg\" data-s=\"4\">Los programas y módulos reales de Raku necesitan pruebas.<\/span> <span class=\"sg\" data-s=\"5\">Escribirlas es una parte importante del trabajo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra las partes principales del módulo <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También muestra los distintos tipos de comparación que tiene.<\/span> <span class=\"sg\" data-s=\"2\">Por último, muestra cómo ejecutar las pruebas.<\/span><\/p>"]]},"it":{"t":"Test","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">I test controllano se il tuo codice fa la cosa giusta.<\/span> <span class=\"sg\" data-s=\"1\">Lo controllano di nuovo anche dopo ogni modifica.<\/span> <span class=\"sg\" data-s=\"2\">Raku include un modulo per i test, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku ha anche modi standard per eseguire molti test insieme.<\/span> <span class=\"sg\" data-s=\"4\">I veri programmi e moduli Raku hanno bisogno di test.<\/span> <span class=\"sg\" data-s=\"5\">Scriverli è una parte importante del lavoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra le parti principali del modulo <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche i diversi tipi di confronto che ha.<\/span> <span class=\"sg\" data-s=\"2\">Infine mostra come eseguire i test.<\/span><\/p>"]]},"lv":{"t":"Testēšana 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Testi pārbauda, vai jūsu kods strādā pareizi.<\/span> <span class=\"sg\" data-s=\"1\">Tie to pārbauda atkal pēc katras izmaiņas.<\/span> <span class=\"sg\" data-s=\"2\">Raku nāk kopā ar testu moduli <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku piedāvā arī standarta veidus, kā izpildīt daudz testu uzreiz.<\/span> <span class=\"sg\" data-s=\"4\">Īstām Raku programmām un moduļiem vajag testus.<\/span> <span class=\"sg\" data-s=\"5\">To rakstīšana ir svarīga darba daļa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda moduļa <code>Test<\/code> galvenās daļas.<\/span> <span class=\"sg\" data-s=\"1\">Tā parāda arī dažādos salīdzināšanas veidus, kas tajā ir.<\/span> <span class=\"sg\" data-s=\"2\">Visbeidzot tā parāda, kā izpildīt testus.<\/span><\/p>"]]},"ru":{"t":"Тестирование","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Тесты проверяют, что ваш код делает то, что нужно.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они проверяют это снова после каждого изменения.<\/span> <span class=\"sg\" data-s=\"2\">В Raku уже есть модуль для тестов, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ещё в Raku есть стандартные способы запускать много тестов сразу.<\/span> <span class=\"sg\" data-s=\"4\">Настоящим программам и модулям на Raku нужны тесты.<\/span> <span class=\"sg\" data-s=\"5\">Писать их — важная часть работы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот раздел показывает главные части модуля <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает разные виды сравнений в нём.<\/span> <span class=\"sg\" data-s=\"2\">В конце он показывает, как запускать тесты.<\/span><\/p>"]]},"uk":{"t":"Тестування","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Тести перевіряють, що ваш код працює правильно.<\/span> <span class=\"sg\" data-s=\"1\">Також вони перевіряють його знову після кожної зміни.<\/span> <span class=\"sg\" data-s=\"2\">Разом із Raku йде модуль для тестів, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ще Raku має стандартні способи запускати багато тестів одразу.<\/span> <span class=\"sg\" data-s=\"4\">Справжнім програмам і модулям на Raku потрібні тести.<\/span> <span class=\"sg\" data-s=\"5\">Писати їх — важлива частина роботи.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує основні частини модуля <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Також він показує різні види порівнянь у ньому.<\/span> <span class=\"sg\" data-s=\"2\">Нарешті, він показує, як запускати тести.<\/span><\/p>"]]},"bg":{"t":"Тестване 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Тестовете проверяват дали вашият код работи правилно.<\/span> <span class=\"sg\" data-s=\"1\">Те го проверяват отново и след всяка промяна.<\/span> <span class=\"sg\" data-s=\"2\">Raku идва с модул за тестове, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku има и стандартни начини да изпълни много тестове наведнъж.<\/span> <span class=\"sg\" data-s=\"4\">Истинските програми и модули на Raku имат нужда от тестове.<\/span> <span class=\"sg\" data-s=\"5\">Писането им е важна част от работата.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази секция показва основните части на модула <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя показва и различните видове сравнения в него.<\/span> <span class=\"sg\" data-s=\"2\">Накрая показва как да изпълнявате тестове.<\/span><\/p>"]]},"eo":{"t":"Testado","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Testoj kontrolas, ke via kodo faras la ĝustan aferon.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ kontrolas ĝin denove post ĉiu ŝanĝo.<\/span> <span class=\"sg\" data-s=\"2\">Raku venas kun modulo por testoj, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku ankaŭ havas normajn manierojn ruli multajn testojn samtempe.<\/span> <span class=\"sg\" data-s=\"4\">Veraj programoj kaj moduloj en Raku bezonas testojn.<\/span> <span class=\"sg\" data-s=\"5\">Skribi ilin estas grava parto de la laboro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio montras la ĉefajn partojn de la modulo <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras la diversajn specojn de komparo en ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Fine, ĝi montras, kiel ruli testojn.<\/span><\/p>"]]},"la":{"t":"Probatio","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Probationes verificant codicem tuum recte agere.<\/span> <span class=\"sg\" data-s=\"1\">Post quamque mutationem iterum verificant.<\/span> <span class=\"sg\" data-s=\"2\">Raku modulum ad probationes secum fert, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku etiam modos normales habet ad multas probationes simul currendas.<\/span> <span class=\"sg\" data-s=\"4\">Vera programmata et moduli Raku probationes requirunt.<\/span> <span class=\"sg\" data-s=\"5\">Eas scribere magna pars operis est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec sectio partes principales moduli <code>Test<\/code> ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Etiam varia genera comparationum in eo ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Postremo ostendit quomodo probationes curras.<\/span><\/p>"]]}}}</script>
