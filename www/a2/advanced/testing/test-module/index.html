<script type="application/json" id="page-data">{"u":"advanced/testing/test-module","n":746,"k":"topic","pv":"advanced/testing","nx":"advanced/testing/test-module/quiz","tr":["advanced","advanced/testing"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Test module","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">To get the tools for testing, write <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The simplest check is <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It passes when its condition is true.<\/span> <span class=\"sg\" data-s=\"3\">Each check can also have a description:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Run this program.<\/span> <span class=\"sg\" data-s=\"1\">It prints the result in the standard format for tests.<\/span> <span class=\"sg\" data-s=\"2\">This format is called <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">For each check that passes, you see <code>ok<\/code> with its number and description.<\/span> <span class=\"sg\" data-s=\"1\">A check that fails shows <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The last line, <code>1..2<\/code>, is the <em>plan<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">It says how many tests ran.<\/span> <span class=\"sg\" data-s=\"4\">The call to <code>done-testing<\/code> at the end prints this plan automatically.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sometimes you expect a certain value.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>is<\/code> is clearer than <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">If the test fails, <code>is<\/code> shows two values.<\/span> <span class=\"sg\" data-s=\"3\">It shows the value that you expect and the value that you get:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This prints <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Now let us see how <code>is<\/code> reports a failure.<\/span> <span class=\"sg\" data-s=\"2\">Give <code>is<\/code> a wrong expected value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Now the check fails.<\/span> <span class=\"sg\" data-s=\"1\">The output shows exactly what is wrong:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>not ok<\/code> line shows the failure.<\/span> <span class=\"sg\" data-s=\"1\">Under it, more lines explain the problem.<\/span> <span class=\"sg\" data-s=\"2\">They show the value that you expect and the value that you get.<\/span> <span class=\"sg\" data-s=\"3\">So, when you need a certain value, <code>is<\/code> helps more than <code>ok<\/code> alone.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With <code>ok<\/code>, <code>is<\/code> and <code>done-testing<\/code>, you can already write a useful test file.<\/span> <span class=\"sg\" data-s=\"1\">The next topic shows <a href=\"/advanced/testing/comparisons/\">the other comparisons<\/a>.<\/span><\/p>"]]},"de":{"t":"Das Test-Modul","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Um die Werkzeuge für Tests zu bekommen, schreibe <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die einfachste Prüfung ist <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie ist erfolgreich, wenn ihre Bedingung wahr ist.<\/span> <span class=\"sg\" data-s=\"3\">Jede Prüfung kann auch eine Beschreibung haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Führe dieses Programm aus.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt das Ergebnis im Standardformat für Tests aus.<\/span> <span class=\"sg\" data-s=\"2\">Dieses Format heißt <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Für jede erfolgreiche Prüfung siehst du <code>ok<\/code> mit ihrer Nummer und Beschreibung.<\/span> <span class=\"sg\" data-s=\"1\">Eine fehlgeschlagene Prüfung zeigt <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die letzte Zeile, <code>1..2<\/code>, ist der <em>Plan<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Er sagt, wie viele Tests gelaufen sind.<\/span> <span class=\"sg\" data-s=\"4\">Der Aufruf von <code>done-testing<\/code> am Ende gibt diesen Plan automatisch aus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Manchmal erwartest du einen bestimmten Wert.<\/span> <span class=\"sg\" data-s=\"1\">Dann ist <code>is<\/code> klarer als <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wenn der Test fehlschlägt, zeigt <code>is<\/code> zwei Werte.<\/span> <span class=\"sg\" data-s=\"3\">Es zeigt den Wert, den du erwartest, und den Wert, den du bekommst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das gibt <code>ok 1 - addition works<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Jetzt sehen wir, wie <code>is<\/code> einen Fehler meldet.<\/span> <span class=\"sg\" data-s=\"2\">Gib <code>is<\/code> einen falschen erwarteten Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jetzt schlägt die Prüfung fehl.<\/span> <span class=\"sg\" data-s=\"1\">Die Ausgabe zeigt genau, was falsch ist:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Zeile <code>not ok<\/code> zeigt den Fehler.<\/span> <span class=\"sg\" data-s=\"1\">Darunter erklären weitere Zeilen das Problem.<\/span> <span class=\"sg\" data-s=\"2\">Sie zeigen den Wert, den du erwartest, und den Wert, den du bekommst.<\/span> <span class=\"sg\" data-s=\"3\">Wenn du also einen bestimmten Wert brauchst, hilft <code>is<\/code> mehr als <code>ok<\/code> allein.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit <code>ok<\/code>, <code>is<\/code> und <code>done-testing<\/code> kannst du schon eine nützliche Testdatei schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Thema zeigt <a href=\"https://course.raku.org/de/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">die anderen Vergleiche<\/a>.<\/span><\/p>"]]},"nl":{"t":"De Test-module","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Om de testtools te krijgen, schrijf je <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De eenvoudigste controle is <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die slaagt als de voorwaarde waar is.<\/span> <span class=\"sg\" data-s=\"3\">Elke controle kan ook een beschrijving hebben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Voer dit programma uit.<\/span> <span class=\"sg\" data-s=\"1\">Het print het resultaat in het standaardformaat voor tests.<\/span> <span class=\"sg\" data-s=\"2\">Dit formaat heet <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Voor elke controle die slaagt, zie je <code>ok<\/code> met het nummer en de beschrijving.<\/span> <span class=\"sg\" data-s=\"1\">Een controle die faalt, toont <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De laatste regel, <code>1..2<\/code>, is het <em>plan<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Het zegt hoeveel tests er hebben gedraaid.<\/span> <span class=\"sg\" data-s=\"4\">De aanroep van <code>done-testing<\/code> aan het eind print dit plan automatisch.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Soms verwacht je een bepaalde waarde.<\/span> <span class=\"sg\" data-s=\"1\">Dan is <code>is<\/code> duidelijker dan <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Als de test faalt, toont <code>is<\/code> twee waarden.<\/span> <span class=\"sg\" data-s=\"3\">Het toont de waarde die je verwacht en de waarde die je krijgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit print <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Laten we nu kijken hoe <code>is<\/code> een fout meldt.<\/span> <span class=\"sg\" data-s=\"2\">Geef <code>is<\/code> een verkeerde verwachte waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nu faalt de controle.<\/span> <span class=\"sg\" data-s=\"1\">De uitvoer toont precies wat er fout is:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De regel <code>not ok<\/code> toont de fout.<\/span> <span class=\"sg\" data-s=\"1\">Eronder leggen meer regels het probleem uit.<\/span> <span class=\"sg\" data-s=\"2\">Ze tonen de waarde die je verwacht en de waarde die je krijgt.<\/span> <span class=\"sg\" data-s=\"3\">Als je dus een bepaalde waarde nodig hebt, helpt <code>is<\/code> meer dan alleen <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met <code>ok<\/code>, <code>is<\/code> en <code>done-testing<\/code> kun je al een nuttig testbestand schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende onderwerp toont <a href=\"https://course.raku.org/nl/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">de andere vergelijkingen<\/a>.<\/span><\/p>"]]},"es":{"t":"El módulo Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Para tener las herramientas de pruebas, escribe <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La comprobación más simple es <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pasa cuando su condición es verdadera.<\/span> <span class=\"sg\" data-s=\"3\">Cada comprobación también puede tener una descripción:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ejecuta este programa.<\/span> <span class=\"sg\" data-s=\"1\">Imprime el resultado en el formato estándar para pruebas.<\/span> <span class=\"sg\" data-s=\"2\">Este formato se llama <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Para cada comprobación que pasa, ves <code>ok<\/code> con su número y su descripción.<\/span> <span class=\"sg\" data-s=\"1\">Una comprobación que falla muestra <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La última línea, <code>1..2<\/code>, es el <em>plan<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dice cuántas pruebas se ejecutaron.<\/span> <span class=\"sg\" data-s=\"4\">La llamada a <code>done-testing<\/code> al final imprime este plan automáticamente.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A veces esperas un valor concreto.<\/span> <span class=\"sg\" data-s=\"1\">Entonces <code>is<\/code> es más claro que <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si la prueba falla, <code>is<\/code> muestra dos valores.<\/span> <span class=\"sg\" data-s=\"3\">Muestra el valor que esperas y el valor que obtienes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esto imprime <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ahora vamos a ver cómo <code>is<\/code> informa de un fallo.<\/span> <span class=\"sg\" data-s=\"2\">Dale a <code>is<\/code> un valor esperado incorrecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora la comprobación falla.<\/span> <span class=\"sg\" data-s=\"1\">La salida muestra exactamente qué está mal:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La línea <code>not ok<\/code> muestra el fallo.<\/span> <span class=\"sg\" data-s=\"1\">Debajo, otras líneas explican el problema.<\/span> <span class=\"sg\" data-s=\"2\">Muestran el valor que esperas y el valor que obtienes.<\/span> <span class=\"sg\" data-s=\"3\">Así que, cuando necesitas un valor concreto, <code>is<\/code> ayuda más que <code>ok<\/code> solo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>ok<\/code>, <code>is<\/code> y <code>done-testing<\/code>, ya puedes escribir un archivo de pruebas útil.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente tema muestra <a href=\"https://course.raku.org/es/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">las otras comparaciones<\/a>.<\/span><\/p>"]]},"it":{"t":"Il modulo Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Per avere gli strumenti per i test, scrivi <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il controllo più semplice è <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ha successo quando la sua condizione è vera.<\/span> <span class=\"sg\" data-s=\"3\">Ogni controllo può avere anche una descrizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esegui questo programma.<\/span> <span class=\"sg\" data-s=\"1\">Stampa il risultato nel formato standard per i test.<\/span> <span class=\"sg\" data-s=\"2\">Questo formato si chiama <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per ogni controllo che ha successo, vedi <code>ok<\/code> con il suo numero e la descrizione.<\/span> <span class=\"sg\" data-s=\"1\">Un controllo che fallisce mostra <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L'ultima riga, <code>1..2<\/code>, è il <em>piano<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dice quanti test ha eseguito il programma.<\/span> <span class=\"sg\" data-s=\"4\">La chiamata a <code>done-testing<\/code> alla fine stampa questo piano in automatico.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A volte ti aspetti un certo valore.<\/span> <span class=\"sg\" data-s=\"1\">Allora <code>is<\/code> è più chiaro di <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Se il test fallisce, <code>is<\/code> mostra due valori.<\/span> <span class=\"sg\" data-s=\"3\">Mostra il valore che ti aspetti e il valore che ottieni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ora vediamo come <code>is<\/code> segnala un fallimento.<\/span> <span class=\"sg\" data-s=\"2\">Dai a <code>is<\/code> un valore atteso sbagliato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora il controllo fallisce.<\/span> <span class=\"sg\" data-s=\"1\">L'output mostra esattamente cosa non va:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La riga <code>not ok<\/code> mostra il fallimento.<\/span> <span class=\"sg\" data-s=\"1\">Sotto, altre righe spiegano il problema.<\/span> <span class=\"sg\" data-s=\"2\">Mostrano il valore che ti aspetti e il valore che ottieni.<\/span> <span class=\"sg\" data-s=\"3\">Quindi, quando ti serve un certo valore, <code>is<\/code> aiuta più di <code>ok<\/code> da solo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>ok<\/code>, <code>is<\/code> e <code>done-testing<\/code> puoi già scrivere un file di test utile.<\/span> <span class=\"sg\" data-s=\"1\">Il prossimo argomento mostra <a href=\"https://course.raku.org/it/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">gli altri confronti<\/a>.<\/span><\/p>"]]},"lv":{"t":"Test modulis","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu testēšanas rīkus, uzrakstiet <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršākā pārbaude ir <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā izdodas, kad tās nosacījums ir patiess.<\/span> <span class=\"sg\" data-s=\"3\">Katrai pārbaudei var būt arī apraksts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Palaidiet šo programmu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izdrukā rezultātu standarta testu formātā.<\/span> <span class=\"sg\" data-s=\"2\">Šo formātu sauc par <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Katrai pārbaudei, kas izdodas, jūs redzat <code>ok<\/code> ar tās numuru un aprakstu.<\/span> <span class=\"sg\" data-s=\"1\">Pārbaude, kas neizdodas, rāda <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pēdējā rinda, <code>1..2<\/code>, ir <em>plāns<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tā pasaka, cik testu izpildījās.<\/span> <span class=\"sg\" data-s=\"4\">Izsaukums <code>done-testing<\/code> beigās izdrukā šo plānu automātiski.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūs gaidāt noteiktu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>is<\/code> ir skaidrāks nekā <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ja tests neizdodas, <code>is<\/code> parāda divas vērtības.<\/span> <span class=\"sg\" data-s=\"3\">Tas parāda vērtību, ko jūs gaidāt, un vērtību, ko jūs iegūstat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tagad apskatīsim, kā <code>is<\/code> ziņo par neveiksmi.<\/span> <span class=\"sg\" data-s=\"2\">Dodiet <code>is<\/code> nepareizu gaidīto vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad pārbaude neizdodas.<\/span> <span class=\"sg\" data-s=\"1\">Izvade parāda, kas tieši ir nepareizi:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rinda <code>not ok<\/code> parāda neveiksmi.<\/span> <span class=\"sg\" data-s=\"1\">Zem tās vēl dažas rindas paskaidro problēmu.<\/span> <span class=\"sg\" data-s=\"2\">Tās parāda vērtību, ko jūs gaidāt, un vērtību, ko jūs iegūstat.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc, kad jums vajag noteiktu vērtību, <code>is<\/code> palīdz vairāk nekā <code>ok<\/code> viens pats.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar <code>ok<\/code>, <code>is<\/code> un <code>done-testing<\/code> jūs jau varat uzrakstīt noderīgu testu failu.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais temats parāda <a href=\"https://course.raku.org/lv/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">pārējos salīdzinājumus<\/a>.<\/span><\/p>"]]},"ru":{"t":"Модуль Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить инструменты для тестов, напишите <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Самая простая проверка — это <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Она проходит, когда её условие истинно.<\/span> <span class=\"sg\" data-s=\"3\">У каждой проверки может быть ещё и описание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Запустите эту программу.<\/span> <span class=\"sg\" data-s=\"1\">Она печатает результат в стандартном формате для тестов.<\/span> <span class=\"sg\" data-s=\"2\">Этот формат называется <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Для каждой проверки, которая прошла, вы видите <code>ok<\/code> с её номером и описанием.<\/span> <span class=\"sg\" data-s=\"1\">Проверка, которая не прошла, показывает <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Последняя строка, <code>1..2<\/code>, — это <em>план<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Он говорит, сколько тестов запустилось.<\/span> <span class=\"sg\" data-s=\"4\">Вызов <code>done-testing<\/code> в конце печатает этот план сам.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Иногда вы ждёте определённое значение.<\/span> <span class=\"sg\" data-s=\"1\">Тогда <code>is<\/code> понятнее, чем <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Если тест не проходит, <code>is<\/code> показывает два значения.<\/span> <span class=\"sg\" data-s=\"3\">Он показывает значение, которое вы ждёте, и значение, которое вы получаете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Теперь посмотрим, как <code>is<\/code> сообщает об ошибке.<\/span> <span class=\"sg\" data-s=\"2\">Дайте <code>is<\/code> неверное ожидаемое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь проверка не проходит.<\/span> <span class=\"sg\" data-s=\"1\">Вывод точно показывает, что не так:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Строка <code>not ok<\/code> показывает ошибку.<\/span> <span class=\"sg\" data-s=\"1\">Под ней другие строки объясняют проблему.<\/span> <span class=\"sg\" data-s=\"2\">Они показывают значение, которое вы ждёте, и значение, которое вы получаете.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому, когда вам нужно определённое значение, <code>is<\/code> помогает больше, чем просто <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>ok<\/code>, <code>is<\/code> и <code>done-testing<\/code> вы уже можете написать полезный тестовый файл.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема показывает <a href=\"https://course.raku.org/ru/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">другие виды сравнений<\/a>.<\/span><\/p>"]]},"uk":{"t":"Модуль Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати інструменти для тестів, напишіть <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіша перевірка — це <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вона проходить, коли її умова істинна.<\/span> <span class=\"sg\" data-s=\"3\">Кожна перевірка також може мати опис:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Запустіть цю програму.<\/span> <span class=\"sg\" data-s=\"1\">Вона виводить результат у стандартному форматі для тестів.<\/span> <span class=\"sg\" data-s=\"2\">Цей формат називається <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Для кожної перевірки, яка проходить, ви бачите <code>ok<\/code> з її номером та описом.<\/span> <span class=\"sg\" data-s=\"1\">Перевірка, яка не проходить, показує <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Останній рядок, <code>1..2<\/code>, — це <em>план<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Він каже, скільки тестів виконалося.<\/span> <span class=\"sg\" data-s=\"4\">Виклик <code>done-testing<\/code> у кінці виводить цей план автоматично.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Іноді ви очікуєте певне значення.<\/span> <span class=\"sg\" data-s=\"1\">Тоді <code>is<\/code> зрозуміліший за <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Якщо тест не проходить, <code>is<\/code> показує два значення.<\/span> <span class=\"sg\" data-s=\"3\">Він показує значення, яке ви очікуєте, і значення, яке ви отримуєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це виводить <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тепер подивімося, як <code>is<\/code> повідомляє про невдачу.<\/span> <span class=\"sg\" data-s=\"2\">Дайте <code>is<\/code> неправильне очікуване значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер перевірка не проходить.<\/span> <span class=\"sg\" data-s=\"1\">Вивід точно показує, що не так:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Рядок <code>not ok<\/code> показує невдачу.<\/span> <span class=\"sg\" data-s=\"1\">Під ним інші рядки пояснюють проблему.<\/span> <span class=\"sg\" data-s=\"2\">Вони показують значення, яке ви очікуєте, і значення, яке ви отримуєте.<\/span> <span class=\"sg\" data-s=\"3\">Тож коли вам потрібне певне значення, <code>is<\/code> допомагає більше, ніж просто <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>ok<\/code>, <code>is<\/code> і <code>done-testing<\/code> ви вже можете написати корисний файл тестів.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема показує <a href=\"https://course.raku.org/uk/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">інші порівняння<\/a>.<\/span><\/p>"]]},"bg":{"t":"Модулът Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">За да получите инструментите за тестване, напишете <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Най-простата проверка е <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тя минава, когато условието ѝ е вярно.<\/span> <span class=\"sg\" data-s=\"3\">Всяка проверка може да има и описание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Изпълнете тази програма.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва резултата в стандартния формат за тестове.<\/span> <span class=\"sg\" data-s=\"2\">Този формат се казва <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За всяка проверка, която минава, виждате <code>ok<\/code> с нейния номер и описание.<\/span> <span class=\"sg\" data-s=\"1\">Проверка, която не минава, показва <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Последният ред, <code>1..2<\/code>, е <em>планът<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Той казва колко теста са се изпълнили.<\/span> <span class=\"sg\" data-s=\"4\">Извикването на <code>done-testing<\/code> в края отпечатва този план автоматично.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Понякога очаквате определена стойност.<\/span> <span class=\"sg\" data-s=\"1\">Тогава <code>is<\/code> е по-ясно от <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ако тестът не мине, <code>is<\/code> показва две стойности.<\/span> <span class=\"sg\" data-s=\"3\">Показва стойността, която очаквате, и стойността, която получавате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сега да видим как <code>is<\/code> съобщава за неуспех.<\/span> <span class=\"sg\" data-s=\"2\">Дайте на <code>is<\/code> грешна очаквана стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега проверката не минава.<\/span> <span class=\"sg\" data-s=\"1\">Изходът показва точно какво не е наред:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Редът <code>not ok<\/code> показва неуспеха.<\/span> <span class=\"sg\" data-s=\"1\">Под него още редове обясняват проблема.<\/span> <span class=\"sg\" data-s=\"2\">Те показват стойността, която очаквате, и стойността, която получавате.<\/span> <span class=\"sg\" data-s=\"3\">Затова, когато ви трябва определена стойност, <code>is<\/code> помага повече от самото <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>ok<\/code>, <code>is<\/code> и <code>done-testing<\/code> вече можете да напишете полезен тестов файл.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема показва <a href=\"https://course.raku.org/bg/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">другите сравнения<\/a>.<\/span><\/p>"]]},"eo":{"t":"La modulo Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Por ricevi la ilojn por testado, skribu <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La plej simpla kontrolo estas <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi sukcesas, kiam ĝia kondiĉo estas vera.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu kontrolo povas ankaŭ havi priskribon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rulu ĉi tiun programon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas la rezulton en la norma formato por testoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu formato nomiĝas <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Por ĉiu kontrolo, kiu sukcesas, vi vidas <code>ok<\/code> kun ĝia numero kaj priskribo.<\/span> <span class=\"sg\" data-s=\"1\">Kontrolo, kiu malsukcesas, montras <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La lasta linio, <code>1..2<\/code>, estas la <em>plano<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi diras, kiom da testoj ruliĝis.<\/span> <span class=\"sg\" data-s=\"4\">La alvoko de <code>done-testing<\/code> ĉe la fino presas ĉi tiun planon aŭtomate.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Foje vi atendas certan valoron.<\/span> <span class=\"sg\" data-s=\"1\">Tiam <code>is<\/code> estas pli klara ol <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Se la testo malsukcesas, <code>is<\/code> montras du valorojn.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi montras la valoron, kiun vi atendas, kaj la valoron, kiun vi ricevas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio presas <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nun ni vidu, kiel <code>is<\/code> raportas malsukceson.<\/span> <span class=\"sg\" data-s=\"2\">Donu al <code>is<\/code> malĝustan atendatan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun la kontrolo malsukcesas.<\/span> <span class=\"sg\" data-s=\"1\">La eligo montras ekzakte, kio estas malĝusta:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La linio <code>not ok<\/code> montras la malsukceson.<\/span> <span class=\"sg\" data-s=\"1\">Sub ĝi, pliaj linioj klarigas la problemon.<\/span> <span class=\"sg\" data-s=\"2\">Ili montras la valoron, kiun vi atendas, kaj la valoron, kiun vi ricevas.<\/span> <span class=\"sg\" data-s=\"3\">Do, kiam vi bezonas certan valoron, <code>is<\/code> helpas pli ol nur <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per <code>ok<\/code>, <code>is<\/code> kaj <code>done-testing<\/code> vi jam povas skribi utilan testodosieron.<\/span> <span class=\"sg\" data-s=\"1\">La sekva temo montras <a href=\"https://course.raku.org/eo/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">la aliajn komparojn<\/a>.<\/span><\/p>"]]},"la":{"t":"Modulus Test","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ut instrumenta probandi habeas, scribe <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probatio simplicissima est <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Transit cum condicio eius vera est.<\/span> <span class=\"sg\" data-s=\"3\">Quaeque probatio etiam descriptionem habere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc programma curre.<\/span> <span class=\"sg\" data-s=\"1\">Effectum in forma normali probationum imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Hanc formam <em>TAP<\/em> vocamus:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pro quaque probatione quae transit, <code>ok<\/code> cum numero et descriptione eius vides.<\/span> <span class=\"sg\" data-s=\"1\">Probatio quae deficit <code>not ok<\/code> ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Ultima linea, <code>1..2<\/code>, est <em>consilium<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dicit quot probationes cucurrerint.<\/span> <span class=\"sg\" data-s=\"4\">Vocatio <code>done-testing<\/code> in fine hoc consilium sponte imprimit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum certum valorem exspectas.<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>is<\/code> clarior est quam <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si probatio deficit, <code>is<\/code> duos valores ostendit.<\/span> <span class=\"sg\" data-s=\"3\">Valorem quem exspectas et valorem quem accipis ostendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nunc videamus quomodo <code>is<\/code> defectum nuntiet.<\/span> <span class=\"sg\" data-s=\"2\">Da <code>is<\/code> valorem exspectatum falsum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc probatio deficit.<\/span> <span class=\"sg\" data-s=\"1\">Exitus prorsus ostendit quid falsum sit:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Linea <code>not ok<\/code> defectum ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Sub ea aliae lineae problema explicant.<\/span> <span class=\"sg\" data-s=\"2\">Valorem quem exspectas et valorem quem accipis ostendunt.<\/span> <span class=\"sg\" data-s=\"3\">Itaque, cum certum valorem requiris, <code>is<\/code> plus quam solum <code>ok<\/code> adiuvat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per <code>ok<\/code>, <code>is<\/code> et <code>done-testing<\/code> iam archivum probationum utile scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Argumentum sequens <a href=\"https://course.raku.org/la/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">ceteras comparationes<\/a> ostendit.<\/span><\/p>"]]}}}</script>
