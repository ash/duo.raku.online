<script type="application/json" id="page-data">{"u":"advanced/block-phasers","n":588,"k":"section","pv":"advanced/phasers/quiz","nx":"advanced/block-phasers/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Block-related phasers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You already know the phasers for the whole program.<\/span> <span class=\"sg\" data-s=\"1\">Raku also has phasers for one block or one loop.<\/span> <span class=\"sg\" data-s=\"2\">They belong to the life of that block or loop.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Going into a block and out of it<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>ENTER<\/code> phaser runs each time the program goes into a block.<\/span> <span class=\"sg\" data-s=\"1\">The <code>LEAVE<\/code> phaser runs each time the program leaves the block.<\/span> <span class=\"sg\" data-s=\"2\">Their place in the block does not matter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Look at the output.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> runs first, and <code>LEAVE<\/code> runs last.<\/span> <span class=\"sg\" data-s=\"2\">The body of the block is between them:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> is very useful.<\/span> <span class=\"sg\" data-s=\"1\">It runs even when the block ends early.<\/span> <span class=\"sg\" data-s=\"2\">So you can safely free a resource there, like an open file.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">A phaser can have a whole <code>{ }<\/code> block, not only one statement.<\/span> <span class=\"sg\" data-s=\"1\">You can also have several phasers.<\/span> <span class=\"sg\" data-s=\"2\">A block can have more than one <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Then they run in reverse order.<\/span> <span class=\"sg\" data-s=\"4\">The last one runs first.<\/span> <span class=\"sg\" data-s=\"5\">It works like a stack.<\/span> <span class=\"sg\" data-s=\"6\">The last thing in goes out first:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The program opens resource <code>A<\/code> first.<\/span> <span class=\"sg\" data-s=\"1\">It closes it last:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This order is “last in, first out”.<\/span> <span class=\"sg\" data-s=\"1\">It is exactly right for cleanup.<\/span> <span class=\"sg\" data-s=\"2\">The last thing you set up is the first thing you remove.<\/span> <span class=\"sg\" data-s=\"3\">The <code>END<\/code> phaser for the whole program works in the same way.<\/span> <span class=\"sg\" data-s=\"4\">Several <code>END<\/code> blocks also run in reverse order.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phasers for loops<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Loops have three more phasers.<\/span> <span class=\"sg\" data-s=\"1\">They mark the steps of the loop.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> runs once, before the first round.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> runs once, after the last round.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> runs at the end of each round:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The loop prints:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">It is the same as with other phasers.<\/span> <span class=\"sg\" data-s=\"1\">You can write <code>FIRST<\/code>, <code>NEXT<\/code>, and <code>LAST<\/code> anywhere in the loop.<\/span> <span class=\"sg\" data-s=\"2\">Each one runs at its own time.<\/span><\/p>"]]},"de":{"t":"Block-bezogene Phasers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kennst schon die Phaser für das ganze Programm.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat auch Phaser für einen Block oder eine Schleife.<\/span> <span class=\"sg\" data-s=\"2\">Sie gehören zum Leben dieses Blocks oder dieser Schleife.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">In einen Block hinein und wieder heraus<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der <code>ENTER<\/code>-Phaser läuft jedes Mal, wenn das Programm in einen Block geht.<\/span> <span class=\"sg\" data-s=\"1\">Der <code>LEAVE<\/code>-Phaser läuft jedes Mal, wenn das Programm den Block verlässt.<\/span> <span class=\"sg\" data-s=\"2\">Ihre Stelle im Block ist egal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Schau dir die Ausgabe an.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> läuft zuerst, und <code>LEAVE<\/code> läuft zuletzt.<\/span> <span class=\"sg\" data-s=\"2\">Der Rumpf des Blocks liegt dazwischen:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> ist sehr nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Er läuft auch dann, wenn der Block früh endet.<\/span> <span class=\"sg\" data-s=\"2\">Also kannst du dort sicher eine Ressource freigeben, zum Beispiel eine offene Datei.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ein Phaser kann einen ganzen <code>{ }<\/code>-Block haben, nicht nur eine Anweisung.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst auch mehrere Phaser haben.<\/span> <span class=\"sg\" data-s=\"2\">Ein Block kann mehr als einen <code>LEAVE<\/code> haben.<\/span> <span class=\"sg\" data-s=\"3\">Dann laufen sie in umgekehrter Reihenfolge.<\/span> <span class=\"sg\" data-s=\"4\">Der letzte läuft zuerst.<\/span> <span class=\"sg\" data-s=\"5\">Das funktioniert wie ein Stapel.<\/span> <span class=\"sg\" data-s=\"6\">Was zuletzt hineinkommt, kommt zuerst wieder heraus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Programm öffnet Ressource <code>A<\/code> zuerst.<\/span> <span class=\"sg\" data-s=\"1\">Es schließt sie zuletzt:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Diese Reihenfolge heißt „last in, first out“.<\/span> <span class=\"sg\" data-s=\"1\">Sie passt genau zum Aufräumen.<\/span> <span class=\"sg\" data-s=\"2\">Was du zuletzt einrichtest, entfernst du zuerst.<\/span> <span class=\"sg\" data-s=\"3\">Der <code>END<\/code>-Phaser für das ganze Programm funktioniert genauso.<\/span> <span class=\"sg\" data-s=\"4\">Mehrere <code>END<\/code>-Blöcke laufen auch in umgekehrter Reihenfolge.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaser für Schleifen<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Schleifen haben drei weitere Phaser.<\/span> <span class=\"sg\" data-s=\"1\">Sie markieren die Schritte der Schleife.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> läuft einmal, vor der ersten Runde.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> läuft einmal, nach der letzten Runde.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> läuft am Ende jeder Runde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Schleife gibt aus:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das ist wie bei anderen Phasern.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst <code>FIRST<\/code>, <code>NEXT<\/code> und <code>LAST<\/code> überall in die Schleife schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Jeder läuft zu seiner eigenen Zeit.<\/span><\/p>"]]},"nl":{"t":"Blokgerelateerde phasers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kent de phasers voor het hele programma al.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft ook phasers voor één blok of één lus.<\/span> <span class=\"sg\" data-s=\"2\">Ze horen bij het leven van dat blok of die lus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een blok in en weer uit<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>ENTER<\/code>-phaser draait elke keer als het programma een blok binnengaat.<\/span> <span class=\"sg\" data-s=\"1\">De <code>LEAVE<\/code>-phaser draait elke keer als het programma het blok verlaat.<\/span> <span class=\"sg\" data-s=\"2\">Hun plek in het blok maakt niet uit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de uitvoer.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> draait als eerste, en <code>LEAVE<\/code> draait als laatste.<\/span> <span class=\"sg\" data-s=\"2\">De body van het blok zit ertussen:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> is heel handig.<\/span> <span class=\"sg\" data-s=\"1\">Hij draait ook als het blok vroeg stopt.<\/span> <span class=\"sg\" data-s=\"2\">Daar kun je dus veilig een resource vrijgeven, zoals een open bestand.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Een phaser kan een heel <code>{ }<\/code>-blok hebben, niet alleen één instructie.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ook meerdere phasers hebben.<\/span> <span class=\"sg\" data-s=\"2\">Een blok kan meer dan één <code>LEAVE<\/code> hebben.<\/span> <span class=\"sg\" data-s=\"3\">Dan draaien ze in omgekeerde volgorde.<\/span> <span class=\"sg\" data-s=\"4\">De laatste draait als eerste.<\/span> <span class=\"sg\" data-s=\"5\">Het werkt als een stapel.<\/span> <span class=\"sg\" data-s=\"6\">Wat het laatst erin gaat, komt er het eerst uit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het programma opent resource <code>A<\/code> als eerste.<\/span> <span class=\"sg\" data-s=\"1\">Het sluit die als laatste:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Deze volgorde is \"last in, first out\".<\/span> <span class=\"sg\" data-s=\"1\">Ze is precies goed voor opruimen.<\/span> <span class=\"sg\" data-s=\"2\">Wat je het laatst opzet, ruim je als eerste op.<\/span> <span class=\"sg\" data-s=\"3\">De <code>END<\/code>-phaser voor het hele programma werkt op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"4\">Meerdere <code>END<\/code>-blokken draaien ook in omgekeerde volgorde.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phasers voor lussen<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lussen hebben nog drie phasers.<\/span> <span class=\"sg\" data-s=\"1\">Ze markeren de stappen van de lus.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> draait één keer, vóór de eerste ronde.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> draait één keer, na de laatste ronde.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> draait aan het einde van elke ronde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De lus drukt af:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het is net als bij andere phasers.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt <code>FIRST<\/code>, <code>NEXT<\/code> en <code>LAST<\/code> overal in de lus schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Elke phaser draait op zijn eigen moment.<\/span><\/p>"]]},"es":{"t":"Phasers de bloque","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ya conoces los phasers de todo el programa.<\/span> <span class=\"sg\" data-s=\"1\">Raku también tiene phasers para un solo bloque o un solo bucle.<\/span> <span class=\"sg\" data-s=\"2\">Pertenecen a la vida de ese bloque o bucle.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entrar en un bloque y salir de él<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El phaser <code>ENTER<\/code> se ejecuta cada vez que el programa entra en un bloque.<\/span> <span class=\"sg\" data-s=\"1\">El phaser <code>LEAVE<\/code> se ejecuta cada vez que el programa sale del bloque.<\/span> <span class=\"sg\" data-s=\"2\">Su lugar en el bloque no importa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mira la salida.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> se ejecuta primero, y <code>LEAVE<\/code> se ejecuta al final.<\/span> <span class=\"sg\" data-s=\"2\">El cuerpo del bloque está entre los dos:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> es muy útil.<\/span> <span class=\"sg\" data-s=\"1\">Se ejecuta incluso cuando el bloque termina antes de tiempo.<\/span> <span class=\"sg\" data-s=\"2\">Así que allí puedes liberar un recurso sin peligro, como un archivo abierto.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un phaser puede tener un bloque <code>{ }<\/code> completo, no solo una sentencia.<\/span> <span class=\"sg\" data-s=\"1\">También puedes tener varios phasers.<\/span> <span class=\"sg\" data-s=\"2\">Un bloque puede tener más de un <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Entonces se ejecutan en orden inverso.<\/span> <span class=\"sg\" data-s=\"4\">El último se ejecuta primero.<\/span> <span class=\"sg\" data-s=\"5\">Funciona como una pila.<\/span> <span class=\"sg\" data-s=\"6\">Lo último que entra sale primero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El programa abre primero el recurso <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo cierra al final:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Este orden es «último en entrar, primero en salir».<\/span> <span class=\"sg\" data-s=\"1\">Es justo lo que necesitas para la limpieza.<\/span> <span class=\"sg\" data-s=\"2\">Lo último que preparas es lo primero que quitas.<\/span> <span class=\"sg\" data-s=\"3\">El phaser <code>END<\/code> de todo el programa funciona igual.<\/span> <span class=\"sg\" data-s=\"4\">Varios bloques <code>END<\/code> también se ejecutan en orden inverso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phasers para bucles<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Los bucles tienen tres phasers más.<\/span> <span class=\"sg\" data-s=\"1\">Marcan los pasos del bucle.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> se ejecuta una vez, antes de la primera vuelta.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> se ejecuta una vez, después de la última vuelta.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> se ejecuta al final de cada vuelta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El bucle imprime:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pasa lo mismo que con otros phasers.<\/span> <span class=\"sg\" data-s=\"1\">Puedes escribir <code>FIRST<\/code>, <code>NEXT<\/code> y <code>LAST<\/code> en cualquier lugar del bucle.<\/span> <span class=\"sg\" data-s=\"2\">Cada uno se ejecuta en su propio momento.<\/span><\/p>"]]},"it":{"t":"Phaser di blocco","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Conosci già i phaser per tutto il programma.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha anche phaser per un solo blocco o un solo ciclo.<\/span> <span class=\"sg\" data-s=\"2\">Fanno parte della vita di quel blocco o ciclo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entrare in un blocco e uscirne<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il phaser <code>ENTER<\/code> parte ogni volta che il programma entra in un blocco.<\/span> <span class=\"sg\" data-s=\"1\">Il phaser <code>LEAVE<\/code> parte ogni volta che il programma esce dal blocco.<\/span> <span class=\"sg\" data-s=\"2\">Il loro posto nel blocco non conta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Guarda l'output.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> parte per primo, e <code>LEAVE<\/code> parte per ultimo.<\/span> <span class=\"sg\" data-s=\"2\">Il corpo del blocco sta tra loro due:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> è molto utile.<\/span> <span class=\"sg\" data-s=\"1\">Parte anche quando il blocco finisce in anticipo.<\/span> <span class=\"sg\" data-s=\"2\">Così lì puoi liberare una risorsa senza rischi, come un file aperto.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un phaser può avere un intero blocco <code>{ }<\/code>, non solo un'istruzione.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche avere più phaser.<\/span> <span class=\"sg\" data-s=\"2\">Un blocco può avere più di un <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Allora partono in ordine inverso.<\/span> <span class=\"sg\" data-s=\"4\">L'ultimo parte per primo.<\/span> <span class=\"sg\" data-s=\"5\">Funziona come uno stack.<\/span> <span class=\"sg\" data-s=\"6\">L'ultima cosa che entra esce per prima:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il programma apre per prima la risorsa <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La chiude per ultima:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo ordine è “last in, first out”.<\/span> <span class=\"sg\" data-s=\"1\">È proprio l'ordine giusto per la pulizia.<\/span> <span class=\"sg\" data-s=\"2\">L'ultima cosa che prepari è la prima che togli.<\/span> <span class=\"sg\" data-s=\"3\">Il phaser <code>END<\/code> per tutto il programma funziona allo stesso modo.<\/span> <span class=\"sg\" data-s=\"4\">Anche più blocchi <code>END<\/code> partono in ordine inverso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaser per i cicli<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">I cicli hanno altri tre phaser.<\/span> <span class=\"sg\" data-s=\"1\">Segnano le fasi del ciclo.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> parte una volta, prima del primo giro.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> parte una volta, dopo l'ultimo giro.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> parte alla fine di ogni giro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il ciclo stampa:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">È come per gli altri phaser.<\/span> <span class=\"sg\" data-s=\"1\">Puoi scrivere <code>FIRST<\/code>, <code>NEXT<\/code> e <code>LAST<\/code> in qualsiasi punto del ciclo.<\/span> <span class=\"sg\" data-s=\"2\">Ognuno parte al suo momento.<\/span><\/p>"]]},"lv":{"t":"Bloku fāzeri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt fāzerus visai programmai.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā ir arī fāzeri vienam blokam vai vienam ciklam.<\/span> <span class=\"sg\" data-s=\"2\">Tie ir saistīti ar šī bloka vai cikla dzīvi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ieiet blokā un iziet no tā<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fāzeris <code>ENTER<\/code> izpildās katru reizi, kad programma ieiet blokā.<\/span> <span class=\"sg\" data-s=\"1\">Fāzeris <code>LEAVE<\/code> izpildās katru reizi, kad programma iziet no bloka.<\/span> <span class=\"sg\" data-s=\"2\">To vieta blokā nav svarīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Paskatieties uz izvadi.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> izpildās pirmais, un <code>LEAVE<\/code> izpildās pēdējais.<\/span> <span class=\"sg\" data-s=\"2\">Bloka ķermenis ir starp tiem:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> ir ļoti noderīgs.<\/span> <span class=\"sg\" data-s=\"1\">Tas izpildās pat tad, kad bloks beidzas pirms laika.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc tur var droši atbrīvot resursu, piemēram, atvērtu failu.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Fāzerim var būt vesels <code>{ }<\/code> bloks, ne tikai viens teikums.<\/span> <span class=\"sg\" data-s=\"1\">Jums var būt arī vairāki fāzeri.<\/span> <span class=\"sg\" data-s=\"2\">Blokam var būt vairāk nekā viens <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad tie izpildās apgrieztā secībā.<\/span> <span class=\"sg\" data-s=\"4\">Pēdējais izpildās pirmais.<\/span> <span class=\"sg\" data-s=\"5\">Tas darbojas kā steks.<\/span> <span class=\"sg\" data-s=\"6\">Ko ieliek pēdējo, to izņem pirmo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma vispirms atver resursu <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā to aizver pēdējo:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šī secība ir “pēdējais iekšā, pirmais ārā”.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir tieši pareiza tīrīšanai.<\/span> <span class=\"sg\" data-s=\"2\">Ko jūs iestatāt pēdējo, to jūs noņemat pirmo.<\/span> <span class=\"sg\" data-s=\"3\">Fāzeris <code>END<\/code> visai programmai darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"4\">Arī vairāki <code>END<\/code> bloki izpildās apgrieztā secībā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fāzeri cikliem<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cikliem ir vēl trīs fāzeri.<\/span> <span class=\"sg\" data-s=\"1\">Tie iezīmē cikla soļus.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> izpildās vienreiz, pirms pirmās kārtas.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> izpildās vienreiz, pēc pēdējās kārtas.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> izpildās katras kārtas beigās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cikls izdrukā:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas ir tāpat kā ar citiem fāzeriem.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code>, <code>NEXT<\/code> un <code>LAST<\/code> var rakstīt jebkurā cikla vietā.<\/span> <span class=\"sg\" data-s=\"2\">Katrs izpildās savā laikā.<\/span><\/p>"]]},"ru":{"t":"Фазеры блоков","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете фазеры для всей программы.<\/span> <span class=\"sg\" data-s=\"1\">В Raku есть и фазеры для одного блока или одного цикла.<\/span> <span class=\"sg\" data-s=\"2\">Они связаны с жизнью этого блока или цикла.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вход в блок и выход из него<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>ENTER<\/code> выполняется каждый раз, когда программа входит в блок.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>LEAVE<\/code> выполняется каждый раз, когда программа выходит из блока.<\/span> <span class=\"sg\" data-s=\"2\">Их место в блоке не важно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на вывод.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> выполняется первым, а <code>LEAVE<\/code> — последним.<\/span> <span class=\"sg\" data-s=\"2\">Тело блока стоит между ними:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> очень полезен.<\/span> <span class=\"sg\" data-s=\"1\">Он выполняется, даже когда блок заканчивается раньше времени.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому в нём можно спокойно освободить ресурс, например открытый файл.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Фазер может содержать целый блок <code>{ }<\/code>, а не только одно выражение.<\/span> <span class=\"sg\" data-s=\"1\">Ещё можно задать несколько фазеров.<\/span> <span class=\"sg\" data-s=\"2\">В блоке может быть больше одного <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогда они выполняются в обратном порядке.<\/span> <span class=\"sg\" data-s=\"4\">Последний выполняется первым.<\/span> <span class=\"sg\" data-s=\"5\">Это работает как стек.<\/span> <span class=\"sg\" data-s=\"6\">Что пришло последним, уходит первым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Программа открывает ресурс <code>A<\/code> первым.<\/span> <span class=\"sg\" data-s=\"1\">Она закрывает его последним:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Этот порядок — «последним пришёл, первым ушёл».<\/span> <span class=\"sg\" data-s=\"1\">Он как раз подходит для очистки.<\/span> <span class=\"sg\" data-s=\"2\">Что вы настроили последним, вы убираете первым.<\/span> <span class=\"sg\" data-s=\"3\">Фазер <code>END<\/code> для всей программы работает так же.<\/span> <span class=\"sg\" data-s=\"4\">Несколько блоков <code>END<\/code> тоже выполняются в обратном порядке.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазеры для циклов<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У циклов есть ещё три фазера.<\/span> <span class=\"sg\" data-s=\"1\">Они отмечают этапы цикла.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> выполняется один раз, перед первым шагом.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> выполняется один раз, после последнего шага.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> выполняется в конце каждого шага:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цикл печатает:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь всё как с другими фазерами.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code>, <code>NEXT<\/code> и <code>LAST<\/code> можно писать в любом месте цикла.<\/span> <span class=\"sg\" data-s=\"2\">Каждый выполняется в своё время.<\/span><\/p>"]]},"uk":{"t":"Блокові фейзери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте фазери для всієї програми.<\/span> <span class=\"sg\" data-s=\"1\">Raku також має фазери для одного блоку або одного циклу.<\/span> <span class=\"sg\" data-s=\"2\">Вони належать до життя цього блоку або циклу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вхід у блок і вихід з нього<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>ENTER<\/code> запускається щоразу, коли програма входить у блок.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>LEAVE<\/code> запускається щоразу, коли програма виходить з блоку.<\/span> <span class=\"sg\" data-s=\"2\">Їхнє місце в блоці не має значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Подивіться на вивід.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> запускається першим, а <code>LEAVE<\/code> — останнім.<\/span> <span class=\"sg\" data-s=\"2\">Тіло блоку стоїть між ними:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> дуже корисний.<\/span> <span class=\"sg\" data-s=\"1\">Він запускається, навіть коли блок закінчується раніше.<\/span> <span class=\"sg\" data-s=\"2\">Тож там можна спокійно звільнити ресурс, наприклад відкритий файл.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Фазер може мати цілий блок <code>{ }<\/code>, а не лише один оператор.<\/span> <span class=\"sg\" data-s=\"1\">Ви також можете мати кілька фазерів.<\/span> <span class=\"sg\" data-s=\"2\">Блок може мати більше одного <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді вони запускаються у зворотному порядку.<\/span> <span class=\"sg\" data-s=\"4\">Останній запускається першим.<\/span> <span class=\"sg\" data-s=\"5\">Це працює як стек.<\/span> <span class=\"sg\" data-s=\"6\">Що прийшло останнім, те йде першим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програма відкриває ресурс <code>A<\/code> першим.<\/span> <span class=\"sg\" data-s=\"1\">Вона закриває його останнім:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Цей порядок — «останнім прийшов, першим пішов».<\/span> <span class=\"sg\" data-s=\"1\">Він якраз підходить для очищення.<\/span> <span class=\"sg\" data-s=\"2\">Що ви налаштували останнім, те ви прибираєте першим.<\/span> <span class=\"sg\" data-s=\"3\">Фазер <code>END<\/code> для всієї програми працює так само.<\/span> <span class=\"sg\" data-s=\"4\">Кілька блоків <code>END<\/code> теж запускаються у зворотному порядку.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазери для циклів<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Цикли мають ще три фазери.<\/span> <span class=\"sg\" data-s=\"1\">Вони позначають кроки циклу.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> запускається один раз, перед першим проходом.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> запускається один раз, після останнього проходу.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> запускається в кінці кожного проходу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цикл друкує:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут усе так само, як з іншими фазерами.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете писати <code>FIRST<\/code>, <code>NEXT<\/code> і <code>LAST<\/code> будь-де в циклі.<\/span> <span class=\"sg\" data-s=\"2\">Кожен запускається у свій час.<\/span><\/p>"]]},"bg":{"t":"Фейзъри за блокове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вече знаете фазерите за цялата програма.<\/span> <span class=\"sg\" data-s=\"1\">Raku има и фазери за един блок или един цикъл.<\/span> <span class=\"sg\" data-s=\"2\">Те са свързани с живота на този блок или цикъл.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Влизане в блок и излизане от него<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фазерът <code>ENTER<\/code> се изпълнява всеки път, когато програмата влиза в блок.<\/span> <span class=\"sg\" data-s=\"1\">Фазерът <code>LEAVE<\/code> се изпълнява всеки път, когато програмата излиза от блока.<\/span> <span class=\"sg\" data-s=\"2\">Мястото им в блока няма значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вижте изхода.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> се изпълнява първи, а <code>LEAVE<\/code> — последен.<\/span> <span class=\"sg\" data-s=\"2\">Тялото на блока е между тях:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> е много полезен.<\/span> <span class=\"sg\" data-s=\"1\">Той се изпълнява дори когато блокът свършва рано.<\/span> <span class=\"sg\" data-s=\"2\">Затова там можете спокойно да освободите ресурс, например отворен файл.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Фазерът може да има цял блок <code>{ }<\/code>, а не само един оператор.<\/span> <span class=\"sg\" data-s=\"1\">Можете да имате и няколко фазера.<\/span> <span class=\"sg\" data-s=\"2\">Един блок може да има повече от един <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава те се изпълняват в обратен ред.<\/span> <span class=\"sg\" data-s=\"4\">Последният се изпълнява първи.<\/span> <span class=\"sg\" data-s=\"5\">Това работи като стек.<\/span> <span class=\"sg\" data-s=\"6\">Което влиза последно, излиза първо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Програмата първо отваря ресурс <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя го затваря най-накрая:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Този ред е „последен влязъл, първи излязъл“.<\/span> <span class=\"sg\" data-s=\"1\">Той е точно подходящ за почистване.<\/span> <span class=\"sg\" data-s=\"2\">Първо премахвате нещото, което сте настроили последно.<\/span> <span class=\"sg\" data-s=\"3\">Фазерът <code>END<\/code> за цялата програма работи по същия начин.<\/span> <span class=\"sg\" data-s=\"4\">Няколко блока <code>END<\/code> също се изпълняват в обратен ред.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазери за цикли<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Циклите имат още три фазера.<\/span> <span class=\"sg\" data-s=\"1\">Те отбелязват стъпките на цикъла.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> се изпълнява веднъж, преди първата обиколка.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> се изпълнява веднъж, след последната обиколка.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> се изпълнява в края на всяка обиколка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цикълът отпечатва:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Същото е като при другите фазери.<\/span> <span class=\"sg\" data-s=\"1\">Можете да пишете <code>FIRST<\/code>, <code>NEXT<\/code> и <code>LAST<\/code> навсякъде в цикъла.<\/span> <span class=\"sg\" data-s=\"2\">Всеки от тях се изпълнява в своето време.<\/span><\/p>"]]},"eo":{"t":"Blok-rilataj faziloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas la fazilojn por la tuta programo.<\/span> <span class=\"sg\" data-s=\"1\">Raku ankaŭ havas fazilojn por unu bloko aŭ unu buklo.<\/span> <span class=\"sg\" data-s=\"2\">Ili apartenas al la vivo de tiu bloko aŭ buklo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eniri blokon kaj eliri el ĝi<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La fazilo <code>ENTER<\/code> ruliĝas ĉiufoje, kiam la programo eniras blokon.<\/span> <span class=\"sg\" data-s=\"1\">La fazilo <code>LEAVE<\/code> ruliĝas ĉiufoje, kiam la programo forlasas la blokon.<\/span> <span class=\"sg\" data-s=\"2\">Ilia loko en la bloko ne gravas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rigardu la eligon.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> ruliĝas unue, kaj <code>LEAVE<\/code> ruliĝas laste.<\/span> <span class=\"sg\" data-s=\"2\">La korpo de la bloko estas inter ili:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> estas tre utila.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ruliĝas eĉ kiam la bloko finiĝas frue.<\/span> <span class=\"sg\" data-s=\"2\">Do tie vi povas sekure liberigi rimedon, ekzemple malfermitan dosieron.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Fazilo povas havi tutan <code>{ }<\/code> blokon, ne nur unu deklaron.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas havi plurajn fazilojn.<\/span> <span class=\"sg\" data-s=\"2\">Bloko povas havi pli ol unu <code>LEAVE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam ili ruliĝas en inversa ordo.<\/span> <span class=\"sg\" data-s=\"4\">La lasta ruliĝas unue.<\/span> <span class=\"sg\" data-s=\"5\">Tio funkcias kiel stako.<\/span> <span class=\"sg\" data-s=\"6\">Kio eniras laste, eliras unue:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La programo malfermas la rimedon <code>A<\/code> unue.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi fermas ĝin laste:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ordo estas «laste en, unue el».<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas ĝuste la bona ordo por purigado.<\/span> <span class=\"sg\" data-s=\"2\">Kion vi preparas laste, tion vi forigas unue.<\/span> <span class=\"sg\" data-s=\"3\">La fazilo <code>END<\/code> por la tuta programo funkcias same.<\/span> <span class=\"sg\" data-s=\"4\">Pluraj <code>END<\/code>-blokoj ankaŭ ruliĝas en inversa ordo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Faziloj por bukloj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Bukloj havas tri pliajn fazilojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili markas la paŝojn de la buklo.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> ruliĝas unufoje, antaŭ la unua rondo.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> ruliĝas unufoje, post la lasta rondo.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> ruliĝas ĉe la fino de ĉiu rondo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La buklo presas:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas same kiel ĉe aliaj faziloj.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas skribi <code>FIRST<\/code>, <code>NEXT<\/code> kaj <code>LAST<\/code> ie ajn en la buklo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu ruliĝas en sia propra tempo.<\/span><\/p>"]]},"la":{"t":"Phaseres blocorum","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Phaseres pro toto programmate iam cognovisti.<\/span> <span class=\"sg\" data-s=\"1\">Raku etiam phaseres pro una copia vel una ansa habet.<\/span> <span class=\"sg\" data-s=\"2\">Ad vitam illius copiae vel ansae pertinent.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Copiam intrare et ex ea exire<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Phaser <code>ENTER<\/code> currit quotiens programma copiam intrat.<\/span> <span class=\"sg\" data-s=\"1\">Phaser <code>LEAVE<\/code> currit quotiens programma copiam relinquit.<\/span> <span class=\"sg\" data-s=\"2\">Locus eorum in copia nihil refert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Specta output.<\/span> <span class=\"sg\" data-s=\"1\"><code>ENTER<\/code> primus currit, et <code>LEAVE<\/code> ultimus currit.<\/span> <span class=\"sg\" data-s=\"2\">Corpus copiae inter eos est:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> valde utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Currit etiam cum copia mature finitur.<\/span> <span class=\"sg\" data-s=\"2\">Itaque ibi rem tuto liberare potes, exempli gratia archivum apertum.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Phaser totam copiam <code>{ }<\/code> habere potest, non solum unam sententiam.<\/span> <span class=\"sg\" data-s=\"1\">Etiam plures phaseres habere potes.<\/span> <span class=\"sg\" data-s=\"2\">Copia plus quam unum <code>LEAVE<\/code> habere potest.<\/span> <span class=\"sg\" data-s=\"3\">Tum ordine inverso currunt.<\/span> <span class=\"sg\" data-s=\"4\">Ultimus primus currit.<\/span> <span class=\"sg\" data-s=\"5\">Sicut cumulus operatur.<\/span> <span class=\"sg\" data-s=\"6\">Quod ultimum intrat, primum exit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma rem <code>A<\/code> primam aperit.<\/span> <span class=\"sg\" data-s=\"1\">Eam ultimam claudit:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic ordo est “ultimum intrat, primum exit”.<\/span> <span class=\"sg\" data-s=\"1\">Ad purgationem exacte aptus est.<\/span> <span class=\"sg\" data-s=\"2\">Quod ultimum constituis, primum removes.<\/span> <span class=\"sg\" data-s=\"3\">Phaser <code>END<\/code> pro toto programmate eodem modo operatur.<\/span> <span class=\"sg\" data-s=\"4\">Plures copiae <code>END<\/code> etiam ordine inverso currunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaseres pro ansis<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ansae tres alios phaseres habent.<\/span> <span class=\"sg\" data-s=\"1\">Gradus ansae signant.<\/span> <span class=\"sg\" data-s=\"2\"><code>FIRST<\/code> semel currit, ante primum gyrum.<\/span> <span class=\"sg\" data-s=\"3\"><code>LAST<\/code> semel currit, post ultimum gyrum.<\/span> <span class=\"sg\" data-s=\"4\"><code>NEXT<\/code> in fine cuiusque gyri currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ansa imprimit:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Idem est ac cum aliis phaseribus.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code>, <code>NEXT<\/code> et <code
