\" data-s=\"2\">Uzskaitiet visus zināmos posmus.<\/span> <span class=\"sg\" data-s=\"3\">Uzrakstiet <code>senior<\/code> kā nosacījumu <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Viss pārējais ir nederīgs, piemēram, negatīvs vecums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>default<\/code> tiešām nozīmē “nekas no augstāk minētā”.<\/span> <span class=\"sg\" data-s=\"1\">Kura versija ir labāka?<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat izvēlēties.<\/span> <span class=\"sg\" data-s=\"3\">Vai nederīgais gadījums ir rets?<\/span> <span class=\"sg\" data-s=\"4\">Tad ielieciet pārbaudi pirmo.<\/span> <span class=\"sg\" data-s=\"5\">Vai jūs skaidri uzskaitāt visus derīgos posmus?<\/span> <span class=\"sg\" data-s=\"6\">Tad padariet nederīgo gadījumu par <code>default<\/code>.<\/span><\/p>"]]},"ru":{"t":"Решение: Жизненный этап по возрасту","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В этом решении два вида <code>when<\/code>. Первый — это <em>условие<\/em>, <code>$_ &lt; 0<\/code>. Здесь <code>$_<\/code> — это топик из <code>given<\/code>. Это условие ловит возрасты, которые не имеют смысла. Остальные блоки <code>when<\/code> — это <em>диапазоны<\/em>. Они делят правильные возрасты на этапы.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок важен. Проверка отрицательного возраста идёт первой. Поэтому она выполняется раньше всех диапазонов. Значение <code>30<\/code> входит в <code>20..64<\/code>. Поэтому программа печатает <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> нужен для любого возраста от 65 и старше. Ни один диапазон в списке не включает эти возрасты.<\/span><\/li><\/ol>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Есть и другой способ.<\/span> <span class=\"sg\" data-s=\"1\">Пусть <code>default<\/code> ловит <em>неправильный<\/em> ввод.<\/span> <span class=\"sg\" data-s=\"2\">Перечислите все известные этапы.<\/span> <span class=\"sg\" data-s=\"3\">Запишите <code>senior<\/code> как условие <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всё остальное неправильно, например отрицательный возраст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>default<\/code> правда значит «ничего из перечисленного выше».<\/span> <span class=\"sg\" data-s=\"1\">Какой вариант лучше?<\/span> <span class=\"sg\" data-s=\"2\">Выбирать вам.<\/span> <span class=\"sg\" data-s=\"3\">Неправильный случай бывает редко?<\/span> <span class=\"sg\" data-s=\"4\">Тогда поставьте проверку первой.<\/span> <span class=\"sg\" data-s=\"5\">Вы ясно перечисляете все правильные этапы?<\/span> <span class=\"sg\" data-s=\"6\">Тогда сделайте неправильный случай блоком <code>default<\/code>.<\/span><\/p>"]]},"uk":{"t":"Розв'язання: Життєвий етап за віком","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це розв'язання має два види <code>when<\/code>. Перший — це <em>умова<\/em>, <code>$_ &lt; 0<\/code>. Тут <code>$_<\/code> — це топік з <code>given<\/code>. Ця умова ловить вік, який не має сенсу. Інші блоки <code>when<\/code> — це <em>діапазони<\/em>. Вони розкладають правильний вік за етапами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок важливий. Перевірка на від'ємний вік іде першою. Тож вона виконується перед усіма діапазонами. Значення <code>30<\/code> входить у <code>20..64<\/code>. Тож програма виводить <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> — для будь-якого віку від 65 і старше. Жоден діапазон у списку не має такого віку.<\/span><\/li><\/ol>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Є й інший спосіб.<\/span> <span class=\"sg\" data-s=\"1\">Нехай <code>default<\/code> ловить <em>недійсний<\/em> ввід.<\/span> <span class=\"sg\" data-s=\"2\">Перелічіть кожен відомий етап.<\/span> <span class=\"sg\" data-s=\"3\">Запишіть <code>senior<\/code> як умову <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Усе інше недійсне, наприклад від'ємний вік:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тут <code>default<\/code> справді означає «жодне з переліченого».<\/span> <span class=\"sg\" data-s=\"1\">Який варіант кращий?<\/span> <span class=\"sg\" data-s=\"2\">Ви можете вибрати.<\/span> <span class=\"sg\" data-s=\"3\">Недійсний випадок рідкісний?<\/span> <span class=\"sg\" data-s=\"4\">Тоді поставте перевірку першою.<\/span> <span class=\"sg\" data-s=\"5\">Ви чітко перелічуєте всі дійсні етапи?<\/span> <span class=\"sg\" data-s=\"6\">Тоді зробіть недійсний випадок блоком <code>default<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Етап от живота по възраст","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това решение има два вида <code>when<\/code>. Първият е <em>условие<\/em>, <code>$_ &lt; 0<\/code>. Тук <code>$_<\/code> е темата от <code>given<\/code>. Това условие хваща възрастите, които нямат смисъл. Другите блокове <code>when<\/code> са <em>диапазони<\/em>. Те слагат правилните възрасти в етапи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът е важен. Проверката за отрицателна възраст е първа. Затова тя се изпълнява преди всички диапазони. Стойността <code>30<\/code> е в <code>20..64<\/code>. Затова програмата отпечатва <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> е за всяка възраст от 65 и повече. Нито един от диапазоните в списъка няма тези възрасти.<\/span><\/li><\/ol>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Има и друг начин.<\/span> <span class=\"sg\" data-s=\"1\">Нека <code>default<\/code> хваща <em>невалидния<\/em> вход.<\/span> <span class=\"sg\" data-s=\"2\">Изброете всеки познат етап.<\/span> <span class=\"sg\" data-s=\"3\">Напишете <code>senior<\/code> като условието <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всичко останало е невалидно, например отрицателна възраст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тук <code>default<\/code> наистина значи „нищо от горното“.<\/span> <span class=\"sg\" data-s=\"1\">Кой вариант е по-добър?<\/span> <span class=\"sg\" data-s=\"2\">Вие избирате.<\/span> <span class=\"sg\" data-s=\"3\">Рядък ли е невалидният случай?<\/span> <span class=\"sg\" data-s=\"4\">Тогава сложете проверката първа.<\/span> <span class=\"sg\" data-s=\"5\">Изброявате ли ясно всички валидни етапи?<\/span> <span class=\"sg\" data-s=\"6\">Тогава направете невалидния случай <code>default<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Vivperiodo laŭ aĝo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tiu solvo havas du specojn de <code>when<\/code>. La unua estas <em>kondiĉo<\/em>, <code>$_ &lt; 0<\/code>. Ĉi tie <code>$_<\/code> estas la temo de <code>given<\/code>. Ĉi tiu kondiĉo kaptas la aĝojn, kiuj ne havas sencon. La aliaj blokoj <code>when<\/code> estas <em>intervaloj<\/em>. Ili metas la ĝustajn aĝojn en periodojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ordo estas grava. La kontrolo de negativa aĝo venas unue. Do ĝi ruliĝas antaŭ ĉiuj intervaloj. La valoro <code>30<\/code> estas en <code>20..64<\/code>. Do la programo presas <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La bloko <code>default<\/code> estas por ĉiu aĝo de 65 kaj pli. Neniu el la intervaloj en la listo havas ĉi tiujn aĝojn.<\/span><\/li><\/ol>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Estas ankaŭ alia maniero.<\/span> <span class=\"sg\" data-s=\"1\">Lasu <code>default<\/code> kapti la <em>nevalidan<\/em> enigon.<\/span> <span class=\"sg\" data-s=\"2\">Listigu ĉiun konatan periodon.<\/span> <span class=\"sg\" data-s=\"3\">Skribu <code>senior<\/code> kiel la kondiĉon <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉio alia estas nevalida, ekzemple negativa aĝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>default<\/code> vere signifas «neniu el la supraj».<\/span> <span class=\"sg\" data-s=\"1\">Kiu versio estas pli bona?<\/span> <span class=\"sg\" data-s=\"2\">Vi povas elekti.<\/span> <span class=\"sg\" data-s=\"3\">Ĉu la nevalida kazo estas malofta?<\/span> <span class=\"sg\" data-s=\"4\">Tiam metu la kontrolon unue.<\/span> <span class=\"sg\" data-s=\"5\">Ĉu vi listigas ĉiujn validajn periodojn klare?<\/span> <span class=\"sg\" data-s=\"6\">Tiam faru la nevalidan kazon la <code>default<\/code>.<\/span><\/p>"]]},"la":{"t":"Solutio: Stadium vitae ex aetate","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haec solutio duo genera <code>when<\/code> habet. Primum est <em>condicio<\/em>, <code>$_ &lt; 0<\/code>. Hic <code>$_<\/code> est topicum ex <code>given<\/code>. Haec condicio aetates capit quae sensum non habent. Ceterae copiae <code>when<\/code> sunt <em>intervalla<\/em>. Aetates rectas in stadia ponunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo magni momenti est. Probatio aetatis negativae prima venit. Itaque ante omnia intervalla currit. Valor <code>30<\/code> in <code>20..64<\/code> est. Itaque programma <code>adult<\/code> imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code> est pro omni aetate 65 vel maiore. Nullum intervallum in indice has aetates habet.<\/span><\/li><\/ol>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Est etiam alius modus.<\/span> <span class=\"sg\" data-s=\"1\">Permitte <code>default<\/code> inputum <em>invalidum<\/em> capere.<\/span> <span class=\"sg\" data-s=\"2\">Enumera omne stadium notum.<\/span> <span class=\"sg\" data-s=\"3\">Scribe <code>senior<\/code> ut condicionem <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Omnia alia invalida sunt, exempli gratia aetas negativa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hic <code>default<\/code> vere significat “nihil ex supra dictis”.<\/span> <span class=\"sg\" data-s=\"1\">Quae versio melior est?<\/span> <span class=\"sg\" data-s=\"2\">Tu eligere potes.<\/span> <span class=\"sg\" data-s=\"3\">Estne casus invalidus rarus?<\/span> <span class=\"sg\" data-s=\"4\">Tum probationem primam pone.<\/span> <span class=\"sg\" data-s=\"5\">Enumerasne omnia stadia valida clare?<\/span> <span class=\"sg\" data-s=\"6\">Tum casum invalidum <code>default<\/code> fac.<\/span><\/p>"]]}}}</script>
