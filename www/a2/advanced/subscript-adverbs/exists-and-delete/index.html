 %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questo è il modo giusto per controllare una chiave.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche solo leggere <code>%h&lt;plum&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma allora ottieni un valore indefinito.<\/span> <span class=\"sg\" data-s=\"3\">Oppure, con alcuni dati, non vedi la differenza.<\/span> <span class=\"sg\" data-s=\"4\">La chiave è “assente”?<\/span> <span class=\"sg\" data-s=\"5\">Oppure è “presente ma indefinita”?<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:delete<\/code> rimuove l'elemento.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce il valore dell'elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'elemento <code>apple<\/code> non c'è più.<\/span> <span class=\"sg\" data-s=\"1\">Ricevi indietro il suo valore <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare questo valore.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutti e due gli avverbi funzionano anche con gli array.<\/span> <span class=\"sg\" data-s=\"1\">Lì usi un indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rimuovi un elemento dal centro.<\/span> <span class=\"sg\" data-s=\"1\">Come appare l'array allora?<\/span> <span class=\"sg\" data-s=\"2\">Ecco la risposta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quindi usi una "sg\" data-s=\"2\">Jūs varat izmantot šo vērtību.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Abi apstākļvārdi darbojas arī ar masīviem.<\/span> <span class=\"sg\" data-s=\"1\">Tur jūs izmantojat indeksu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs noņemat elementu no vidus.<\/span> <span class=\"sg\" data-s=\"1\">Kā tad izskatās masīvs?<\/span> <span class=\"sg\" data-s=\"2\">Lūk, atbilde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tātad jūs izmantojat vienu pierakstu, un tas vienmēr darbojas vienādi.<\/span> <span class=\"sg\" data-s=\"1\">Ar to jūs varat jautāt par konteineru.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat arī mainīt konteineru uz vietas.<\/span> <span class=\"sg\" data-s=\"3\">Šim nolūkam jums nav vajadzīgas atsevišķas metodes.<\/span><\/p>"]]},"ru":{"t":"Существование и удаление","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:exists<\/code> превращает обращение по индексу в вопрос.<\/span> <span class=\"sg\" data-s=\"1\">Есть ли значение по этому ключу или индексу?<\/span> <span class=\"sg\" data-s=\"2\">Ответ — <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Наречие не получает само значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Это правильный способ проверить ключ.<\/span> <span class=\"sg\" data-s=\"1\">Можно также просто прочитать <code>%h&lt;plum&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но тогда вы получите неопределённое значение.<\/span> <span class=\"sg\" data-s=\"3\">Или, с некоторыми данными, вы не увидите разницы.<\/span> <span class=\"sg\" data-s=\"4\">Ключа просто «нет»?<\/span> <span class=\"sg\" data-s=\"5\">Или он «есть, но не определён»?<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:delete<\/code> удаляет запись.<\/span> <span class=\"sg\" data-s=\"1\">Оно возвращает значение этой записи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Записи <code>apple<\/code> больше нет.<\/span> <span class=\"sg\" data-s=\"1\">Вы получаете обратно её значение <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это значение можно использовать.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оба наречия работают и с массивами.<\/span> <span class=\"sg\" data-s=\"1\">Там вы используете индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы удаляете элемент из середины.<\/span> <span class=\"sg\" data-s=\"1\">Как тогда выглядит массив?<\/span> <span class=\"sg\" data-s=\"2\">Вот ответ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итак, вы используете одну запись, и она всегда работает одинаково.<\/span> <span class=\"sg\" data-s=\"1\">С ней можно спросить о контейнере.<\/span> <span class=\"sg\" data-s=\"2\">Можно также изменить контейнер на месте.<\/span> <span class=\"sg\" data-s=\"3\">Отдельные методы для этого не нужны.<\/span><\/p>"]]},"uk":{"t":"Exists та delete","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Наріччя <code>:exists<\/code> робить з індексу запитання.<\/span> <span class=\"sg\" data-s=\"1\">Чи є значення за цим ключем або індексом?<\/span> <span class=\"sg\" data-s=\"2\">Відповідь — <code>True<\/code> або <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Наріччя не дістає значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Це правильний спосіб перевірити ключ.<\/span> <span class=\"sg\" data-s=\"1\">Можна також просто прочитати <code>%h&lt;plum&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але тоді ви отримаєте невизначене значення.<\/span> <span class=\"sg\" data-s=\"3\">Або з деякими даними ви не побачите різниці.<\/span> <span class=\"sg\" data-s=\"4\">Ключ «відсутній»?<\/span> <span class=\"sg\" data-s=\"5\">Чи він «є, але невизначений»?<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наріччя <code>:delete<\/code> видаляє запис.<\/span> <span class=\"sg\" data-s=\"1\">Воно повертає значення цього запису:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Запису <code>apple<\/code> більше немає.<\/span> <span class=\"sg\" data-s=\"1\">Ви отримуєте назад його значення <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете використати це значення.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва наріччя працюють і з масивами.<\/span> <span class=\"sg\" data-s=\"1\">Там ви використовуєте індекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви видаляєте елемент із середини.<\/span> <span class=\"sg\" data-s=\"1\">Який тоді вигляд має масив?<\/span> <span class=\"sg\" data-s=\"2\">Ось відповідь:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тож ви використовуєте один запис, і він завжди працює однаково.<\/span> <span class=\"sg\" data-s=\"1\">З ним можна запитати про контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Також можна змінити контейнер на місці.<\/span> <span class=\"sg\" data-s=\"3\">Для цього не потрібні окремі методи.<\/span><\/p>"]]},"bg":{"t":"Съществуване и изтриване","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:exists<\/code> превръща индексирането във въпрос.<\/span> <span class=\"sg\" data-s=\"1\">Има ли стойност на този ключ или индекс?<\/span> <span class=\"sg\" data-s=\"2\">Отговорът е <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Наречието не взима стойността:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Това е правилният начин да проверите за ключ.<\/span> <span class=\"sg\" data-s=\"1\">Можете също просто да прочетете <code>%h&lt;plum&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но тогава получавате недефинирана стойност.<\/span> <span class=\"sg\" data-s=\"3\">Или, при някои данни, не можете да видите разликата.<\/span> <span class=\"sg\" data-s=\"4\">„Липсва“ ли ключът?<\/span> <span class=\"sg\" data-s=\"5\">Или е „наличен, но недефиниран“?<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:delete<\/code> премахва записа.<\/span> <span class=\"sg\" data-s=\"1\">То връща стойността на записа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Записът <code>apple<\/code> вече го няма.<\/span> <span class=\"sg\" data-s=\"1\">Получавате обратно неговата стойност <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате тази стойност.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двете наречия работят и с масиви.<\/span> <span class=\"sg\" data-s=\"1\">Там използвате индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Премахвате елемент от средата.<\/span> <span class=\"sg\" data-s=\"1\">Как изглежда масивът тогава?<\/span> <span class=\"sg\" data-s=\"2\">Ето отговора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Така използвате една нотация и тя винаги работи по един и същи начин.<\/span> <span class=\"sg\" data-s=\"1\">С нея можете да питате за контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Можете и да промените контейнера на място.<\/span> <span class=\"sg\" data-s=\"3\">Не ви трябват отделни методи за това.<\/span><\/p>"]]},"eo":{"t":"Ekzistas kaj forigi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La adverbo <code>:exists<\/code> faras demandon el subskribo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu estas valoro ĉe ĉi tiu ŝlosilo aŭ indekso?<\/span> <span class=\"sg\" data-s=\"2\">La respondo estas <code>True<\/code> aŭ <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La adverbo ne prenas la valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tio estas la ĝusta maniero kontroli ŝlosilon.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas simple legi <code>%h&lt;plum&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed tiam vi ricevas nedifinitan valoron.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ, kun iuj datumoj, vi ne povas vidi la diferencon.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu la ŝlosilo estas «mankanta»?<\/span> <span class=\"sg\" data-s=\"5\">Aŭ ĉu ĝi estas «ĉeestanta sed nedifinita»?<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La adverbo <code>:delete<\/code> forigas la eron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas la valoron de la ero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La ero <code>apple<\/code> malaperis.<\/span> <span class=\"sg\" data-s=\"1\">Vi ricevas reen ĝian valoron <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi ĉi tiun valoron.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ adverboj funkcias ankaŭ kun tabeloj.<\/span> <span class=\"sg\" data-s=\"1\">Tie vi uzas indekson:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi forigas eron el la mezo.<\/span> <span class=\"sg\" data-s=\"1\">Kiel la tabelo aspektas tiam?<\/span> <span class=\"sg\" data-s=\"2\">Jen la respondo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do vi uzas unu skribmanieron, kaj ĝi ĉiam funkcias same.<\/span> <span class=\"sg\" data-s=\"1\">Per ĝi, vi povas demandi pri ujo.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas ŝanĝi la ujon surloke.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne bezonas apartajn metodojn por tio.<\/span><\/p>"]]},"la":{"t":"Exists et delete","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Adverbium <code>:exists<\/code> subscriptum in quaestionem vertit.<\/span> <span class=\"sg\" data-s=\"1\">Estne valor sub hac clave vel indice?<\/span> <span class=\"sg\" data-s=\"2\">Responsum est <code>True<\/code> aut <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Adverbium valorem non obtinet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hoc modo clavem recte probas.<\/span> <span class=\"sg\" data-s=\"1\">Potes etiam simpliciter <code>%h&lt;plum&gt;<\/code> legere.<\/span> <span class=\"sg\" data-s=\"2\">Sed tum valorem indefinitum accipis.<\/span> <span class=\"sg\" data-s=\"3\">Vel, cum quibusdam datis, differentiam videre non potes.<\/span> <span class=\"sg\" data-s=\"4\">Estne clavis \"absens\"?<\/span> <span class=\"sg\" data-s=\"5\">An est \"praesens sed indefinita\"?<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adverbium <code>:delete<\/code> introitum removet.<\/span> <span class=\"sg\" data-s=\"1\">Valorem introitus reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Introitus <code>apple<\/code> abest.<\/span> <span class=\"sg\" data-s=\"1\">Valorem eius <code>1<\/code> recipis.<\/span> <span class=\"sg\" data-s=\"2\">Hunc valorem adhibere potes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambo adverbia etiam cum ordinibus operantur.<\/span> <span class=\"sg\" data-s=\"1\">Ibi indicem adhibes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elementum e medio removes.<\/span> <span class=\"sg\" data-s=\"1\">Qualis tum est ordo?<\/span> <span class=\"sg\" data-s=\"2\">Hic est responsum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Itaque unam notationem adhibes, et semper eodem modo operatur.<\/span> <span class=\"sg\" data-s=\"1\">Cum ea de continenti quaerere potes.<\/span> <span class=\"sg\" data-s=\"2\">Etiam continens in loco mutare potes.<\/span> <span class=\"sg\" data-s=\"3\">Methodis separatis ad hoc non eges.<\/span><\/p>"]]}}}</script>
