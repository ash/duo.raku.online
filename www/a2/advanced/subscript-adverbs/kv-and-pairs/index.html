<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs/kv-and-pairs","n":397,"k":"topic","pv":"advanced/subscript-adverbs/exists-and-delete/quiz","nx":"advanced/subscript-adverbs/exercises","tr":["advanced","advanced/subscript-adverbs"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Keys, values, and pairs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Other adverbs change <strong>what<\/strong> a subscript returns.<\/span> <span class=\"sg\" data-s=\"1\">Usually, a subscript returns the value.<\/span> <span class=\"sg\" data-s=\"2\">These adverbs return more:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — the value; this is the default<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — the key or the index<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — the key and the value<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — a <code>Pair<\/code> of the key and the value<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For an array, the “key” is the index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> returns the index and the value together in a list.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> returns them as a pair.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This also works with hashes.<\/span> <span class=\"sg\" data-s=\"1\">It is very useful with a slice.<\/span> <span class=\"sg\" data-s=\"2\">A slice has several keys at once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, the slice has two keys.<\/span> <span class=\"sg\" data-s=\"1\">The result is a key, its value, the next key, its value.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code>, and similar tools often use these adverbs.<\/span> <span class=\"sg\" data-s=\"3\">With them, you can work with keys and values together.<\/span> <span class=\"sg\" data-s=\"4\">You do not need separate lookups.<\/span><\/p>"]]},"de":{"t":"Schlüssel, Werte und Paare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Andere Adverbien ändern, <strong>was<\/strong> eine Indizierung zurückgibt.<\/span> <span class=\"sg\" data-s=\"1\">Normalerweise gibt eine Indizierung den Wert zurück.<\/span> <span class=\"sg\" data-s=\"2\">Diese Adverbien geben mehr zurück:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — den Wert; das ist der Standard<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — den Schlüssel oder den Index<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — den Schlüssel und den Wert<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — ein <code>Pair<\/code> aus dem Schlüssel und dem Wert<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einem Array ist der \"Schlüssel\" der Index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> gibt den Index und den Wert zusammen in einer Liste zurück.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> gibt sie als Pair zurück.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das funktioniert auch bei Hashes.<\/span> <span class=\"sg\" data-s=\"1\">Mit einem Slice ist es sehr nützlich.<\/span> <span class=\"sg\" data-s=\"2\">Ein Slice hat mehrere Schlüssel auf einmal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier hat der Slice zwei Schlüssel.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis ist ein Schlüssel, sein Wert, der nächste Schlüssel, sein Wert.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> und ähnliche Werkzeuge verwenden diese Adverbien oft.<\/span> <span class=\"sg\" data-s=\"3\">Mit ihnen kannst du mit Schlüsseln und Werten zusammen arbeiten.<\/span> <span class=\"sg\" data-s=\"4\">Du brauchst keine getrennten Abfragen.<\/span><\/p>"]]},"nl":{"t":"Sleutels, waarden en paren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Andere adverbs veranderen <strong>wat<\/strong> een subscript teruggeeft.<\/span> <span class=\"sg\" data-s=\"1\">Meestal geeft een subscript de waarde terug.<\/span> <span class=\"sg\" data-s=\"2\">Deze adverbs geven meer terug:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — de waarde; dit is de standaard<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — de sleutel of de index<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — de sleutel en de waarde<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — een <code>Pair<\/code> van de sleutel en de waarde<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een array is de \"sleutel\" de index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> geeft de index en de waarde samen terug in een lijst.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> geeft ze terug als een paar.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit werkt ook met hashes.<\/span> <span class=\"sg\" data-s=\"1\">Het is heel handig bij een slice.<\/span> <span class=\"sg\" data-s=\"2\">Een slice heeft meerdere sleutels tegelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier heeft de slice twee sleutels.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is een sleutel, zijn waarde, de volgende sleutel, zijn waarde.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> en soortgelijke tools gebruiken deze adverbs vaak.<\/span> <span class=\"sg\" data-s=\"3\">Daarmee kun je met sleutels en waarden samen werken.<\/span> <span class=\"sg\" data-s=\"4\">Je hebt geen aparte opzoekingen nodig.<\/span><\/p>"]]},"es":{"t":"Keys, values y pairs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Otros adverbios cambian <strong>qué<\/strong> devuelve un subíndice.<\/span> <span class=\"sg\" data-s=\"1\">Normalmente, un subíndice devuelve el valor.<\/span> <span class=\"sg\" data-s=\"2\">Estos adverbios devuelven más:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — el valor; es lo predeterminado<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la clave o el índice<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — la clave y el valor<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — un <code>Pair<\/code> de la clave y el valor<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un array, la \"clave\" es el índice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> devuelve el índice y el valor juntos en una lista.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> los devuelve como un par.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esto también funciona con hashes.<\/span> <span class=\"sg\" data-s=\"1\">Es muy útil con un segmento.<\/span> <span class=\"sg\" data-s=\"2\">Un segmento tiene varias claves a la vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, el segmento tiene dos claves.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es una clave, su valor, la siguiente clave, su valor.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> y herramientas parecidas usan a menudo estos adverbios.<\/span> <span class=\"sg\" data-s=\"3\">Con ellos, puedes trabajar con claves y valores juntos.<\/span> <span class=\"sg\" data-s=\"4\">No necesitas consultas separadas.<\/span><\/p>"]]},"it":{"t":"Chiavi, valori e coppie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Altri avverbi cambiano <strong>cosa<\/strong> restituisce un accesso tramite indice.<\/span> <span class=\"sg\" data-s=\"1\">Di solito, l'accesso restituisce il valore.<\/span> <span class=\"sg\" data-s=\"2\">Questi avverbi restituiscono di più:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — il valore; questo è il comportamento predefinito<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la chiave o l'indice<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — la chiave e il valore<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — una <code>Pair<\/code> della chiave e del valore<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un array, la \"chiave\" è l'indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> restituisce l'indice e il valore insieme in una lista.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> li restituisce come coppia.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo funziona anche con gli hash.<\/span> <span class=\"sg\" data-s=\"1\">È molto utile con una fetta.<\/span> <span class=\"sg\" data-s=\"2\">Una fetta ha più chiavi insieme:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui la fetta ha due chiavi.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è una chiave, il suo valore, la chiave dopo, il suo valore.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> e strumenti simili usano spesso questi avverbi.<\/span> <span class=\"sg\" data-s=\"3\">Con loro puoi lavorare con chiavi e valori insieme.<\/span> <span class=\"sg\" data-s=\"4\">Non ti servono ricerche separate.<\/span><\/p>"]]},"lv":{"t":"Atslēgas, vērtības un pāri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Citi apstākļvārdi maina to, <strong>ko<\/strong> indekss atgriež.<\/span> <span class=\"sg\" data-s=\"1\">Parasti indekss atgriež vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Šie apstākļvārdi atgriež vairāk:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — vērtību; tas ir noklusējums<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — atslēgu vai indeksu<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — atslēgu un vērtību<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — atslēgas un vērtības <code>Pair<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Masīvam «atslēga» ir indekss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> atgriež indeksu un vērtību kopā sarakstā.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> atgriež tos kā pāri.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas darbojas arī ar jaukteņiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir ļoti noderīgi ar šķēli.<\/span> <span class=\"sg\" data-s=\"2\">Šķēlē ir vairākas atslēgas uzreiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit šķēlē ir divas atslēgas.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts ir atslēga, tās vērtība, nākamā atslēga, tās vērtība.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> un līdzīgi rīki bieži izmanto šos apstākļvārdus.<\/span> <span class=\"sg\" data-s=\"3\">Ar tiem jūs varat strādāt ar atslēgām un vērtībām kopā.<\/span> <span class=\"sg\" data-s=\"4\">Jums nav vajadzīgi atsevišķi meklējumi.<\/span><\/p>"]]},"ru":{"t":"Ключи, значения и пары","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Другие наречия меняют <strong>то, что<\/strong> возвращает обращение по индексу.<\/span> <span class=\"sg\" data-s=\"1\">Обычно обращение по индексу возвращает значение.<\/span> <span class=\"sg\" data-s=\"2\">Эти наречия возвращают больше:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — значение; это вариант по умолчанию<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключ или индекс<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — ключ и значение<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — пару (<code>Pair<\/code>) из ключа и значения<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для массива «ключом» является индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> возвращает индекс и значение вместе в виде списка.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> возвращает их в виде пары.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это работает и с хешами.<\/span> <span class=\"sg\" data-s=\"1\">Это очень удобно со срезом.<\/span> <span class=\"sg\" data-s=\"2\">В срезе сразу несколько ключей:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь в срезе два ключа.<\/span> <span class=\"sg\" data-s=\"1\">Результат — ключ, его значение, следующий ключ, его значение.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> и похожие инструменты часто используют эти наречия.<\/span> <span class=\"sg\" data-s=\"3\">С ними можно работать с ключами и значениями вместе.<\/span> <span class=\"sg\" data-s=\"4\">Отдельные обращения не нужны.<\/span><\/p>"]]},"uk":{"t":"Ключі, значення та пари","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Інші наріччя змінюють те, <strong>що<\/strong> повертає індекс.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай індекс повертає значення.<\/span> <span class=\"sg\" data-s=\"2\">Ці наріччя повертають більше:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — значення; так є за замовчуванням<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключ або індекс<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — ключ і значення<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> із ключа та значення<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для масиву «ключем» є індекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> повертає індекс і значення разом у списку.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> повертає їх як пару.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це працює і з хешами.<\/span> <span class=\"sg\" data-s=\"1\">Це дуже зручно зі зрізом.<\/span> <span class=\"sg\" data-s=\"2\">Зріз має кілька ключів одразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут зріз має два ключі.<\/span> <span class=\"sg\" data-s=\"1\">Результат — ключ, його значення, наступний ключ, його значення.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> та схожі інструменти часто використовують ці наріччя.<\/span> <span class=\"sg\" data-s=\"3\">З ними можна працювати з ключами й значеннями разом.<\/span> <span class=\"sg\" data-s=\"4\">Вам не потрібні окремі пошуки.<\/span><\/p>"]]},"bg":{"t":"Ключове, стойности и двойки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Други наречия променят <strong>какво<\/strong> връща индексирането.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено индексирането връща стойността.<\/span> <span class=\"sg\" data-s=\"2\">Тези наречия връщат повече:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — стойността; това е по подразбиране<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключа или индекса<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — ключа и стойността<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> от ключа и стойността<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За масив „ключът\" е индексът:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> връща индекса и стойността заедно в списък.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> ги връща като двойка.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това работи и с хешове.<\/span> <span class=\"sg\" data-s=\"1\">То е много полезно при срез.<\/span> <span class=\"sg\" data-s=\"2\">Срезът има няколко ключа наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук срезът има два ключа.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е ключ, неговата стойност, следващият ключ, неговата стойност.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> и подобни инструменти често използват тези наречия.<\/span> <span class=\"sg\" data-s=\"3\">С тях можете да работите с ключове и стойности заедно.<\/span> <span class=\"sg\" data-s=\"4\">Не ви трябват отделни търсения.<\/span><\/p>"]]},"eo":{"t":"Ŝlosiloj, valoroj kaj paroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Aliaj adverboj ŝanĝas, <strong>kion<\/strong> subskribo redonas.<\/span> <span class=\"sg\" data-s=\"1\">Kutime subskribo redonas la valoron.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj adverboj redonas pli:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — la valoron; tio estas la defaŭlto<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la ŝlosilon aŭ la indekson<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — la ŝlosilon kaj la valoron<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> el la ŝlosilo kaj la valoro<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por tabelo, la «ŝlosilo» estas la indekso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> redonas la indekson kaj la valoron kune en listo.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> redonas ilin kiel paron.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio funkcias ankaŭ kun hakoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas tre utila kun tranĉaĵo.<\/span> <span class=\"sg\" data-s=\"2\">Tranĉaĵo havas plurajn ŝlosilojn samtempe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la tranĉaĵo havas du ŝlosilojn.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas ŝlosilo, ĝia valoro, la sekva ŝlosilo, ĝia valoro.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> kaj similaj iloj ofte uzas ĉi tiujn adverbojn.<\/span> <span class=\"sg\" data-s=\"3\">Per ili, vi povas labori kun ŝlosiloj kaj valoroj kune.<\/span> <span class=\"sg\" data-s=\"4\">Vi ne bezonas apartajn serĉojn.<\/span><\/p>"]]},"la":{"t":"Claves, valores, et paria","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Alia adverbia mutant <strong>quid<\/strong> subscriptum reddat.<\/span> <span class=\"sg\" data-s=\"1\">Plerumque subscriptum valorem reddit.<\/span> <span class=\"sg\" data-s=\"2\">Haec adverbia plus reddunt:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — valorem; hoc est praedefinitum<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — clavem vel indicem<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — clavem et valorem<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> clavis et valoris<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In ordine, \"clavis\" est index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> indicem et valorem simul in lista reddit.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> ea ut par reddit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc etiam cum tabulis operatur.<\/span> <span class=\"sg\" data-s=\"1\">Cum segmento valde utile est.<\/span> <span class=\"sg\" data-s=\"2\">Segmentum plures claves simul habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic segmentum duas claves habet.<\/span> <span class=\"sg\" data-s=\"1\">Eventus est clavis, valor eius, clavis sequens, valor eius.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code>, <code>for<\/code> et similia instrumenta saepe haec adverbia adhibent.<\/span> <span class=\"sg\" data-s=\"3\">Cum eis claves et valores simul tractare potes.<\/span> <span class=\"sg\" data-s=\"4\">Quaestionibus separatis non eges.<\/span><\/p>"]]}}}</script>
