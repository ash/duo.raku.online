<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs","n":394,"k":"section","pv":"advanced/contexts/exercises/item-or-list/solution","nx":"advanced/subscript-adverbs/exists-and-delete","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Subscript adverbs","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">You can subscript an array or a hash, like <code>@a[2]<\/code> or <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then you can add an <em>adverb<\/em> to the subscript.<\/span> <span class=\"sg\" data-s=\"2\">The adverb changes what the subscript does.<\/span> <span class=\"sg\" data-s=\"3\">Usually, a subscript only gets the value.<\/span> <span class=\"sg\" data-s=\"4\">With an adverb, you can ask if a key exists.<\/span> <span class=\"sg\" data-s=\"5\">You can delete the key.<\/span> <span class=\"sg\" data-s=\"6\">Or you can get the key and the value together.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You write these adverbs after the subscript.<\/span> <span class=\"sg\" data-s=\"1\">They start with a colon.<\/span> <span class=\"sg\" data-s=\"2\">They work in the same way with arrays and with hashes.<\/span> <span class=\"sg\" data-s=\"3\">This section shows the most useful adverbs.<\/span><\/p>"]]},"de":{"t":"Subskript-Adverbien","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Du kannst ein Array oder einen Hash indizieren, wie <code>@a[2]<\/code> oder <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dann kannst du an die Indizierung ein <em>Adverb<\/em> anhängen.<\/span> <span class=\"sg\" data-s=\"2\">Das Adverb ändert, was die Indizierung tut.<\/span> <span class=\"sg\" data-s=\"3\">Normalerweise holt eine Indizierung nur den Wert.<\/span> <span class=\"sg\" data-s=\"4\">Mit einem Adverb kannst du fragen, ob ein Schlüssel existiert.<\/span> <span class=\"sg\" data-s=\"5\">Du kannst den Schlüssel löschen.<\/span> <span class=\"sg\" data-s=\"6\">Oder du kannst den Schlüssel und den Wert zusammen bekommen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du schreibst diese Adverbien nach dem Index.<\/span> <span class=\"sg\" data-s=\"1\">Sie beginnen mit einem Doppelpunkt.<\/span> <span class=\"sg\" data-s=\"2\">Sie funktionieren bei Arrays und bei Hashes gleich.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt die nützlichsten Adverbien.<\/span><\/p>"]]},"nl":{"t":"Subscript-adverbia","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Je kunt een subscript op een array of een hash gebruiken, zoals <code>@a[2]<\/code> of <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je een <em>adverb<\/em> aan de subscript toevoegen.<\/span> <span class=\"sg\" data-s=\"2\">Het adverb verandert wat de subscript doet.<\/span> <span class=\"sg\" data-s=\"3\">Meestal haalt een subscript alleen de waarde op.<\/span> <span class=\"sg\" data-s=\"4\">Met een adverb kun je vragen of een sleutel bestaat.<\/span> <span class=\"sg\" data-s=\"5\">Je kunt de sleutel verwijderen.<\/span> <span class=\"sg\" data-s=\"6\">Of je kunt de sleutel en de waarde samen krijgen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je schrijft deze adverbs na de subscript.<\/span> <span class=\"sg\" data-s=\"1\">Ze beginnen met een dubbele punt.<\/span> <span class=\"sg\" data-s=\"2\">Ze werken op dezelfde manier bij arrays en bij hashes.<\/span> <span class=\"sg\" data-s=\"3\">Dit deel toont de nuttigste adverbs.<\/span><\/p>"]]},"es":{"t":"Adverbios de subíndice","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Puedes usar un subíndice con un array o un hash, como <code>@a[2]<\/code> o <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes añadir un <em>adverbio<\/em> al subíndice.<\/span> <span class=\"sg\" data-s=\"2\">El adverbio cambia lo que hace el subíndice.<\/span> <span class=\"sg\" data-s=\"3\">Normalmente, un subíndice solo obtiene el valor.<\/span> <span class=\"sg\" data-s=\"4\">Con un adverbio, puedes preguntar si una clave existe.<\/span> <span class=\"sg\" data-s=\"5\">Puedes eliminar la clave.<\/span> <span class=\"sg\" data-s=\"6\">O puedes obtener la clave y el valor juntos.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Escribes estos adverbios después del subíndice.<\/span> <span class=\"sg\" data-s=\"1\">Empiezan con dos puntos.<\/span> <span class=\"sg\" data-s=\"2\">Funcionan de la misma manera con arrays y con hashes.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra los adverbios más útiles.<\/span><\/p>"]]},"it":{"t":"Avverbi di subscript","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Puoi accedere a un array o a un hash tramite indice, come <code>@a[2]<\/code> o <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi aggiungere un <em>avverbio<\/em> all'accesso tramite indice.<\/span> <span class=\"sg\" data-s=\"2\">L'avverbio cambia quello che fa l'accesso.<\/span> <span class=\"sg\" data-s=\"3\">Di solito, l'accesso tramite indice prende solo il valore.<\/span> <span class=\"sg\" data-s=\"4\">Con un avverbio, puoi chiedere se una chiave esiste.<\/span> <span class=\"sg\" data-s=\"5\">Puoi eliminare la chiave.<\/span> <span class=\"sg\" data-s=\"6\">Oppure puoi prendere la chiave e il valore insieme.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Scrivi questi avverbi dopo l'indice.<\/span> <span class=\"sg\" data-s=\"1\">Iniziano con i due punti.<\/span> <span class=\"sg\" data-s=\"2\">Funzionano nello stesso modo con gli array e con gli hash.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra gli avverbi più utili.<\/span><\/p>"]]},"lv":{"t":"Indeksa apzīmētāji 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Jūs varat indeksēt masīvu vai jaukteni, piemēram, <code>@a[2]<\/code> vai <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad indeksam jūs varat pievienot <em>apstākļvārdu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Apstākļvārds maina to, ko indekss dara.<\/span> <span class=\"sg\" data-s=\"3\">Parasti indekss tikai paņem vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Ar apstākļvārdu jūs varat pajautāt, vai atslēga eksistē.<\/span> <span class=\"sg\" data-s=\"5\">Jūs varat izdzēst atslēgu.<\/span> <span class=\"sg\" data-s=\"6\">Vai arī jūs varat iegūt atslēgu un vērtību kopā.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šos apstākļvārdus jūs rakstāt aiz indeksa.<\/span> <span class=\"sg\" data-s=\"1\">Tie sākas ar kolu.<\/span> <span class=\"sg\" data-s=\"2\">Tie darbojas vienādi ar masīviem un ar jaukteņiem.<\/span> <span class=\"sg\" data-s=\"3\">Šī sadaļa parāda noderīgākos apstākļvārdus.<\/span><\/p>"]]},"ru":{"t":"Наречия индексации","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Вы можете обратиться к массиву или хешу по индексу, например <code>@a[2]<\/code> или <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда к этому обращению можно добавить <em>наречие<\/em> (adverb).<\/span> <span class=\"sg\" data-s=\"2\">Наречие меняет то, что делает обращение.<\/span> <span class=\"sg\" data-s=\"3\">Обычно обращение по индексу только берёт значение.<\/span> <span class=\"sg\" data-s=\"4\">С наречием можно спросить, есть ли ключ.<\/span> <span class=\"sg\" data-s=\"5\">Можно удалить ключ.<\/span> <span class=\"sg\" data-s=\"6\">Или можно получить ключ и значение вместе.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы пишете эти наречия после индекса.<\/span> <span class=\"sg\" data-s=\"1\">Они начинаются с двоеточия.<\/span> <span class=\"sg\" data-s=\"2\">Они одинаково работают с массивами и с хешами.<\/span> <span class=\"sg\" data-s=\"3\">Этот раздел показывает самые полезные наречия.<\/span><\/p>"]]},"uk":{"t":"Наріччя індексів","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ви можете індексувати масив або хеш, як-от <code>@a[2]<\/code> чи <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді до індексу можна додати <em>наріччя<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Наріччя змінює те, що робить індекс.<\/span> <span class=\"sg\" data-s=\"3\">Зазвичай індекс лише дістає значення.<\/span> <span class=\"sg\" data-s=\"4\">З наріччям можна запитати, чи існує ключ.<\/span> <span class=\"sg\" data-s=\"5\">Можна видалити ключ.<\/span> <span class=\"sg\" data-s=\"6\">Або можна отримати ключ і значення разом.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви пишете ці наріччя після індексу.<\/span> <span class=\"sg\" data-s=\"1\">Вони починаються з двокрапки.<\/span> <span class=\"sg\" data-s=\"2\">Вони працюють однаково з масивами і з хешами.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує найкорисніші наріччя.<\/span><\/p>"]]},"bg":{"t":"Наречия за индексиране 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Можете да индексирате масив или хеш, като <code>@a[2]<\/code> или <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да добавите <em>наречие<\/em> (adverb) към индекса.<\/span> <span class=\"sg\" data-s=\"2\">Наречието променя какво прави индексирането.<\/span> <span class=\"sg\" data-s=\"3\">Обикновено индексирането само взима стойността.<\/span> <span class=\"sg\" data-s=\"4\">С наречие можете да попитате дали даден ключ съществува.<\/span> <span class=\"sg\" data-s=\"5\">Можете да изтриете ключа.<\/span> <span class=\"sg\" data-s=\"6\">Или можете да получите ключа и стойността заедно.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Пишете тези наречия след индекса.<\/span> <span class=\"sg\" data-s=\"1\">Те започват с двоеточие.<\/span> <span class=\"sg\" data-s=\"2\">Те работят по един и същи начин с масиви и с хешове.<\/span> <span class=\"sg\" data-s=\"3\">Тази секция показва най-полезните наречия.<\/span><\/p>"]]},"eo":{"t":"Subskribaj adverboj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Vi povas subskribi tabelon aŭ hakon, kiel <code>@a[2]<\/code> aŭ <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas aldoni <em>adverbon<\/em> al la subskribo.<\/span> <span class=\"sg\" data-s=\"2\">La adverbo ŝanĝas, kion la subskribo faras.<\/span> <span class=\"sg\" data-s=\"3\">Kutime subskribo nur prenas la valoron.<\/span> <span class=\"sg\" data-s=\"4\">Per adverbo, vi povas demandi, ĉu ŝlosilo ekzistas.<\/span> <span class=\"sg\" data-s=\"5\">Vi povas forigi la ŝlosilon.<\/span> <span class=\"sg\" data-s=\"6\">Aŭ vi povas ricevi la ŝlosilon kaj la valoron kune.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi skribas ĉi tiujn adverbojn post la subskribo.<\/span> <span class=\"sg\" data-s=\"1\">Ili komenciĝas per dupunkto.<\/span> <span class=\"sg\" data-s=\"2\">Ili funkcias same kun tabeloj kaj kun hakoj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio montras la plej utilajn adverbojn.<\/span><\/p>"]]},"la":{"t":"Subscripti adverbia","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ordinem vel tabulam subscribere potes, ut <code>@a[2]<\/code> vel <code>%h&lt;key&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum <em>adverbium<\/em> subscripto addere potes.<\/span> <span class=\"sg\" data-s=\"2\">Adverbium mutat id quod subscriptum facit.<\/span> <span class=\"sg\" data-s=\"3\">Plerumque subscriptum solum valorem obtinet.<\/span> <span class=\"sg\" data-s=\"4\">Cum adverbio quaerere potes num clavis exsistat.<\/span> <span class=\"sg\" data-s=\"5\">Clavem delere potes.<\/span> <span class=\"sg\" data-s=\"6\">Vel clavem et valorem simul accipere potes.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec adverbia post subscriptum scribis.<\/span> <span class=\"sg\" data-s=\"1\">Cum duobus punctis incipiunt.<\/span> <span class=\"sg\" data-s=\"2\">Eodem modo cum ordinibus et cum tabulis operantur.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio utilissima adverbia ostendit.<\/span><\/p>"]]}}}</script>
